<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Principia</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%232f5bd3'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%232f5bd3' stroke-width='2' opacity='.45'/%3E%3C/svg%3E" />
    <script>
      // 在页面渲染前就定好亮色 / 暗色，避免闪一下。主题偏好只存在这台设备的浏览器里，不算进度。
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('principia.theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
