- id: p1
  tier: easy
  statement: |
    太空中，一颗卫星绕自己的对称轴以$3.0\,\mathrm{rad/s}$转动，卫星本体上各质点的质量乘它到转轴的距离的平方，加起来是$4.5\,\mathrm{kg\cdot m^2}$，所以本体对转轴的角动量是$4.5\,\mathrm{kg\cdot m^2}$乘角速度。本体上还有两个$1.0\,\mathrm{kg}$的小重物，原来离转轴$0.50\,\mathrm m$，跟着本体一起转；后来它们沿两根轻杆向外滑到离转轴$2.0\,\mathrm m$处，仍跟着本体一起转。这时卫星的角速度是多少？以$\mathrm{rad/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: (4.5 + 2*1.0*0.50^2)*3.0/(4.5 + 2*1.0*2.0^2)
    unit: |
      $\mathrm{rad/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      重物滑动时，它和本体之间的力是内力，没有外力矩，对转轴的总角动量守恒。
    - |
      每个重物对转轴的角动量是$mr^2\omega$；总角动量是$(4.5+2mr^2)\omega$。
    - |
      $(4.5+0.5)\times3.0=(4.5+8.0)\omega'$，$\omega'=1.20\,\mathrm{rad/s}$。
  solution: |
    重物和本体之间的力是内力，没有外力矩，对转轴的总角动量守恒。开始时总角动量$(4.5+2\times1.0\times0.50^2)\times3.0=15\,\mathrm{kg\cdot m^2/s}$，后来是$(4.5+2\times1.0\times2.0^2)\omega'=12.5\omega'$，所以$\omega'=1.20\,\mathrm{rad/s}$。把重物往外放，卫星就转慢了，真实的卫星正是这样减慢自转的。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        质点系不受外力时，它对任意固定点的总角动量都不变
      - |
        两个只相互作用的质点，各自的角动量都不变
      - |
        质心静止时，质点系对任意固定点的角动量都等于它对质心的角动量
      - |
        物体只受一个力，这个力的作用线通过质心，物体对质心的角动量就不变
      - |
        外力之和为零时，外力对任意一点的力矩之和也一定为零
    value: [1, 3, 4]
  hints:
    - |
      内力的力矩两两抵消，只能保证总和不变。
    - |
      $\vb L=\vb r_{\mathrm C}\times M\vb v_{\mathrm C}+\vb L'$；对质心的角动量只由外力对质心的力矩决定。
    - |
      A、C、D 对；B、E 错。E 想一想力偶。
  solution: |
    A 对：没有外力，外力矩为零。B 错：一对内力的力矩之和为零，可每个质点受的那个力对它自己的力矩不一定为零，两个质点之间可以转移角动量，只有总和不变。C 对：$\vb v_{\mathrm C}=\vb 0$，$\vb L=\vb L'$。

    D 对：力过质心，对质心的力矩为零，由对质心的角动量定理，$\vb L'$不变。E 错：力偶的两个力之和为零，力矩之和却不为零。

- id: p3
  tier: medium
  statement: |
    太空中静止着一个哑铃：两个$2.0\,\mathrm{kg}$的小球装在一根长$0.80\,\mathrm m$的轻杆两端。一团$1.0\,\mathrm{kg}$的油泥以$5.0\,\mathrm{m/s}$的速度垂直于杆飞来，撞上一端的小球并粘在上面。之后整体绕质心转动的角速度是多少？以$\mathrm{rad/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 1.0*5.0*0.32/(3.0*0.32^2 + 2.0*0.48^2)
    unit: |
      $\mathrm{rad/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      粘上以后一端是$3.0\,\mathrm{kg}$、另一端是$2.0\,\mathrm{kg}$，先求质心的位置。
    - |
      对撞击时质心所在的那一点，总角动量守恒，撞后就是对质心的角动量。
    - |
      质心离油泥那端$0.32\,\mathrm m$；$1.0\times5.0\times0.32=(3.0\times0.32^2+2.0\times0.48^2)\omega$，$\omega\approx2.08\,\mathrm{rad/s}$。
  solution: |
    粘上以后一端$3.0\,\mathrm{kg}$、另一端$2.0\,\mathrm{kg}$，质心离油泥那端$\frac{2.0\times0.80}{5.0}=0.32\,\mathrm m$，离另一端$0.48\,\mathrm m$。撞击时只有内力，对撞击时质心所在的点，总角动量守恒。撞前只有油泥有角动量$1.0\times5.0\times0.32=1.6\,\mathrm{kg\cdot m^2/s}$；撞后这一点就是质心，总角动量是绕质心转动的$(3.0\times0.32^2+2.0\times0.48^2)\omega=0.768\omega$。所以$\omega=\frac{1.6}{0.768}\approx2.08\,\mathrm{rad/s}$。

- id: p4
  tier: medium
  statement: |
    在$xy$平面里，质量$2.0\,\mathrm{kg}$的质点在$(1.0,0)\,\mathrm m$处，速度是$(0,3.0)\,\mathrm{m/s}$；质量$1.0\,\mathrm{kg}$的质点在$(-2.0,0)\,\mathrm m$处，速度是$(0,-6.0)\,\mathrm{m/s}$。这两个质点对点$(0,5.0)\,\mathrm m$的总角动量的$z$分量是多少？以$\mathrm{kg\cdot m^2/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 2.0*(1.0*3.0 - (-5.0)*0) + 1.0*((-2.0)*(-6.0) - (-5.0)*0)
    unit: |
      $\mathrm{kg\cdot m^2/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      先看总动量是多少；总动量为零时，对哪一点的总角动量都一样。
    - |
      也可以直接算：相对$(0,5.0)$的位置是$(1.0,-5.0)$和$(-2.0,-5.0)$，$z$分量是$m(xv_y-yv_x)$。
    - |
      $2.0\times(1.0\times3.0)+1.0\times(-2.0)\times(-6.0)=18.0\,\mathrm{kg\cdot m^2/s}$。
  solution: |
    总动量$2.0\times3.0+1.0\times(-6.0)=0$，质心静止在原点。相对点$(0,5.0)$的位置是$(1.0,-5.0)\,\mathrm m$和$(-2.0,-5.0)\,\mathrm m$，$z$分量$m(xv_y-yv_x)$分别是$2.0\times(1.0\times3.0-0)=6.0$和$1.0\times((-2.0)\times(-6.0)-0)=12$，总和$18.0\,\mathrm{kg\cdot m^2/s}$，和对原点的一样：总动量为零，对哪一点的角动量都相同。

- id: p5
  tier: hard
  statement: |
    质点系的总动量是$\vb P$，对点$O$的总角动量是$\vb L_O$。

    （1）证明：对另一点$Q$的总角动量是$\vb L_Q=\vb L_O+\overrightarrow{QO}\times\vb P$。

    （2）由此说明：总动量为零时，质点系对哪一点的角动量都相同。

    （3）把（1）和[力矩与角动量](lesson:physics.newtonian-mechanics.angular-momentum)里力偶的力矩和取哪一点无关比较，说明两者的道理是不是一样。
  hints:
    - |
      第$i$个质点相对$Q$的位置是$\overrightarrow{QO}+\vb r_i$，$\vb r_i$是它相对$O$的位置。
    - |
      $\sum_i(\overrightarrow{QO}+\vb r_i)\times m_i\vb v_i$，把$\overrightarrow{QO}$提出来。
    - |
      力偶的两个力之和为零。
  reference: |
    （1）第$i$个质点相对$Q$的位置是$\overrightarrow{QO}+\vb r_i$，所以$\vb L_Q=\sum_i(\overrightarrow{QO}+\vb r_i)\times m_i\vb v_i=\overrightarrow{QO}\times\sum_im_i\vb v_i+\sum_i\vb r_i\times m_i\vb v_i=\overrightarrow{QO}\times\vb P+\vb L_O$。

    （2）$\vb P=\vb 0$时$\vb L_Q=\vb L_O$，对任意两点都相同。例如质心静止、绕质心转动的物体，说它的角动量时不必指明对哪一点。

    （3）道理一样。几个力对$Q$和对$O$的力矩之和相差$\overrightarrow{QO}\times\sum_i\vb F_i$，推导完全照搬（1），只是把$m_i\vb v_i$换成$\vb F_i$。力偶的两个力之和为零，所以它的力矩和取哪一点无关；总动量为零的质点系，角动量也和取哪一点无关。

- id: p6
  tier: hard
  statement: |
    太空中，质量$80\,\mathrm{kg}$和$60\,\mathrm{kg}$的两个宇航员抓着一根长$10\,\mathrm m$、质量不计的绳子的两端，绕两人的质心转动，转一圈用$20\,\mathrm s$。

    （1）两人各离质心多远？速率各是多少？

    （2）两人沿绳子把彼此拉到相距$5.0\,\mathrm m$，转一圈要多久？

    （3）两人一共做了多少功？
  hints:
    - |
      质心把两人的连线分成和质量成反比的两段；两人转动的角速度相同。
    - |
      总角动量是$(m_1r_1^2+m_2r_2^2)\omega$；距离都减半时，括号里变成原来的$\frac14$。
    - |
      总动能是$\frac12(m_1r_1^2+m_2r_2^2)\omega^2$，比较前后两个值。
  reference: |
    （1）$m_1r_1=m_2r_2$，$r_1+r_2=10\,\mathrm m$，得$r_1=\frac{60}{140}\times10\approx4.29\,\mathrm m$，$r_2\approx5.71\,\mathrm m$。$\omega=\frac{2\pi}{20}\approx0.314\,\mathrm{rad/s}$，速率$v_1=\omega r_1\approx1.35\,\mathrm{m/s}$，$v_2\approx1.80\,\mathrm{m/s}$。

    （2）只有内力，质心不动，对质心的总角动量$(m_1r_1^2+m_2r_2^2)\omega$守恒。两人到质心的距离都减半，括号里的量变成原来的$\frac14$，$\omega$变成$4$倍，转一圈要$5.0\,\mathrm s$。

    （3）开始时$m_1r_1^2+m_2r_2^2\approx80\times4.29^2+60\times5.71^2\approx3.43\times10^3\,\mathrm{kg\cdot m^2}$，总动能$\frac12\times3.43\times10^3\times0.314^2\approx169\,\mathrm J$。拉近后括号里的量是$\frac14$，$\omega$是$4$倍，动能是原来的$4$倍，约$677\,\mathrm J$。两人一共做了约$508\,\mathrm J$的功。

- id: p7
  tier: thinking
  statement: |
    猫背朝下从高处落下，在空中能翻过身来，四脚着地。设猫离手时没有转动，不计空气。

    （1）在空中，猫对它的质心的角动量是多少？

    （2）角动量一直为零，猫为什么还能转过身来？

    （3）宇航员在太空里没有可以借力的东西，能不能用类似的办法让身体转个方向？
  hints:
    - |
      在空中只有地球的吸引，它对质心没有力矩。
    - |
      角动量为零不等于每一部分都不转；猫的身体不是一块刚性的整体。
    - |
      想一想：把一部分身体收紧转一个方向，另一部分伸开转另一个方向。
  reference: |
    （1）离手时不转，对质心的角动量为零。在空中只有地球的吸引，猫身上第$i$部分受的吸引是$m_i\vb g$，对质心的力矩之和是$\Bigl(\sum_im_i\vb r_i'\Bigr)\times\vb g=\vb 0$，所以对质心的角动量一直是零。

    （2）角动量为零只说明各部分的角动量之和为零，不说明每一部分都不转。猫先把前腿收紧、后腿伸开，让前半身大幅度地转过去，后半身只小幅度地反转；再反过来，把后腿收紧、前腿伸开，让后半身转过去。两步合起来，前后半身都转过了身，总角动量却始终是零。身体的形状一直在变，才能这样做；一块刚体在角动量为零时就不能转向。

    （3）能。宇航员可以把手臂在头顶上一圈一圈地划，身体就会慢慢朝反方向转；停下来时，身体已经转过了一个角度。

- id: p8
  tier: thinking
  statement: |
    直升机的发动机带动顶上的主旋翼转动。

    （1）如果没有尾部的小旋翼，主旋翼转起来以后，机身会怎样？说明理由。

    （2）尾旋翼是怎样解决这个问题的？

    （3）有的直升机有上下两副旋翼，朝相反的方向转，不需要尾旋翼，为什么？
  hints:
    - |
      发动机让主旋翼转动的力是机身和旋翼之间的内力。
    - |
      尾旋翼把空气推向一侧，空气对它的反作用力对直升机的质心有力矩。
    - |
      两副旋翼的角动量方向相反。
  reference: |
    （1）发动机让主旋翼转动，是机身对旋翼的作用，反过来旋翼也作用于机身，这是一对内力，它们的力矩之和为零。直升机起飞后，可以近似地看成不受绕竖直轴的外力矩，绕竖直轴的总角动量守恒：主旋翼得到一个方向的角动量，机身就要得到反方向的角动量，朝相反的方向转起来。

    （2）尾旋翼在离质心很远的地方，把空气推向一侧，空气对尾旋翼的力是外力，对质心有绕竖直轴的力矩，正好抵消机身受到的那个反向的力矩，机身就不转了。

    （3）两副旋翼朝相反的方向转，角动量方向相反，总和可以为零，发动机让它们转起来时，机身不必得到反向的角动量，所以不需要尾旋翼。
