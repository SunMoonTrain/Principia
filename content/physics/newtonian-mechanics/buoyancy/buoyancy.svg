<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-size="14">
  <!-- 浮力的来源：左边，长方体浸没在水中，上表面受到向下的压力，下表面受到向上的、更大的压力，左右两个侧面受到的压力大小相等、方向相反，越往下箭头越长。右边，把长方体换成同样形状的一块水，这块水静止，周围的水对它的压力的合力就是浮力，竖直向上，和它受的重力一样长。 -->
