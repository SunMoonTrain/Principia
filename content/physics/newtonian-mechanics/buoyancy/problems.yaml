- id: p1
  tier: easy
  statement: |
    一个体积为$5.0\times10^{-4}\,\mathrm{m^3}$的铁块完全浸没在酒精里，酒精的密度是$0.80\times10^3\,\mathrm{kg/m^3}$，$g$取$9.8\,\mathrm{m/s^2}$。铁块受的浮力是多少？以$\mathrm N$为单位，保留三位有效数字。
  answer:
    type: number
    value: 0.80e3*9.8*5.0e-4
    unit: |
      $\mathrm N$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      浮力只看排开了多少液体，和铁块本身的密度无关。
    - |
      $F_{\text{浮}}=\rho gV_{\text{排}}$，浸没时$V_{\text{排}}$就是铁块的体积，$\rho$是酒精的密度。
    - |
      $F_{\text{浮}}=0.80\times10^3\times9.8\times5.0\times10^{-4}=3.92\,\mathrm N$。
  solution: |
    由阿基米德原理，浮力等于排开的酒精受的重力。铁块完全浸没，排开的体积就是它自己的体积，$F_{\text{浮}}=\rho gV=0.80\times10^3\times9.8\times5.0\times10^{-4}=3.92\,\mathrm N$。铁块受的重力比这大得多，所以它会沉下去，可浮力的大小和它是不是铁无关。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        体积相同的铁块和木块都完全浸没在水里，铁块受的浮力大
      - |
        同一个物体，漂浮在清水面上和漂浮在盐水面上，受的浮力一样大
      - |
        一块冰浮在一杯清水上，冰全部熔化以后，杯里的水面高度不变
      - |
        氢气球能升空，是因为空气对它的浮力大于它受的重力
      - |
        同一个物体，完全浸没在清水里和完全浸没在盐水里，受的浮力一样大
    value: [2, 3, 4]
  hints:
    - |
      漂浮时浮力和重力是什么关系？完全浸没时浮力由什么决定？
    - |
      冰漂浮时排开的水的体积，和它熔化成的水的体积比较。
    - |
      B、C、D 对；A、E 错。
  solution: |
    A 错：完全浸没时浮力是$\rho gV$，体积相同、液体相同，浮力就相同。B 对：漂浮时浮力等于重力，和液体是什么无关，在盐水里只是浸得浅一些。C 对：冰漂浮时排开的水重等于冰重，正好是它熔化成的水重，熔化成的水刚好填满原来排开的那部分体积。

    D 对：氢气比空气轻得多，气球排开的空气受的重力，比氢气和气球皮受的重力之和大。E 错：浸没时排开的体积相同，盐水的密度大，浮力也大。

- id: p3
  tier: medium
  statement: |
    一个木块漂浮在水面上时，露出水面的部分占总体积的$\frac25$；放进另一种液体里漂浮时，露出液面的部分占总体积的$\frac14$。水的密度是$1.0\times10^3\,\mathrm{kg/m^3}$，这种液体的密度是多少？以$\mathrm{kg/m^3}$为单位。
  answer:
    type: number
    value: 1.0e3*(3/5)/(3/4)
    unit: |
      $\mathrm{kg/m^3}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      漂浮时，浸在液体里的体积占总体积的$\frac{\rho_{\text{物}}}\rho$。
    - |
      在水里浸入$\frac35$，所以木块的密度是$0.60\times10^3\,\mathrm{kg/m^3}$；在液体里浸入$\frac34$。
    - |
      $\rho_{\text{液}}=\frac{0.60\times10^3}{3/4}=8.0\times10^2\,\mathrm{kg/m^3}$。
  solution: |
    漂浮时浸入的体积占$\frac{\rho_{\text{物}}}\rho$。在水里浸入$\frac35$，木块的密度是$0.60\times10^3\,\mathrm{kg/m^3}$；在液体里浸入$\frac34$，所以$\rho_{\text{液}}=\frac{0.60\times10^3}{3/4}=8.0\times10^2\,\mathrm{kg/m^3}$。液体比水轻，木块要浸得更深，排开的液体才够托住它。

- id: p4
  tier: medium
  statement: |
    一个氦气球里充了$5.0\,\mathrm{m^3}$的氦气，空气的密度是$1.29\,\mathrm{kg/m^3}$，氦气的密度是$0.18\,\mathrm{kg/m^3}$。气球皮、绳子和吊着的东西的总质量最多是多少，气球才能离地上升？以$\mathrm{kg}$为单位，保留三位有效数字。气球皮的体积不计。
  answer:
    type: number
    value: (1.29 - 0.18)*5.0
    unit: |
      $\mathrm{kg}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      气球排开的空气的体积是$5.0\,\mathrm{m^3}$；要上升，浮力至少要等于氦气和别的东西受的重力之和。
    - |
      $\rho_{\text{空}}gV\ge\rho_{\text{氦}}gV+mg$，$g$约掉。
    - |
      $m\le(1.29-0.18)\times5.0=5.55\,\mathrm{kg}$。
  solution: |
    浮力是$\rho_{\text{空}}gV$，要大于氦气和其余东西受的重力之和$\rho_{\text{氦}}gV+mg$。$g$约掉，$m<(1.29-0.18)\times5.0=5.55\,\mathrm{kg}$。$5\,\mathrm{m^3}$的大气球只能吊起五千多克的东西：空气的密度太小了。

- id: p5
  tier: hard
  statement: |
    水槽的横截面积是$0.50\,\mathrm{m^2}$，水面上漂着一只小船，船里放着一块$2.0\,\mathrm{kg}$的石头，石头的密度是$2.5\times10^3\,\mathrm{kg/m^3}$，水的密度是$1.0\times10^3\,\mathrm{kg/m^3}$，水没有溢出。

    （1）把石头从船里拿出来，轻轻放进水里，石头沉到槽底。水面升高还是降低？

    （2）水面变化多少？

    （3）把石头换成同样质量、密度为$0.50\times10^3\,\mathrm{kg/m^3}$的木块，木块放进水里漂着，水面怎样变化？
  hints:
    - |
      比较前后两种情况下，石头「替」船和水排开了多少体积的水。
    - |
      石头在船里时，船要多排开$\frac m{\rho_{\text{水}}}$的水来托住它；沉在槽底时，它只排开自己的体积$\frac m{\rho_{\text{石}}}$。
    - |
      $\frac{2.0}{1.0\times10^3}-\frac{2.0}{2.5\times10^3}=1.2\times10^{-3}\,\mathrm{m^3}$，水面下降$\frac{1.2\times10^{-3}}{0.50}=2.4\times10^{-3}\,\mathrm m$。
  reference: |
    （1）降低。石头在船里时，船和石头一起漂浮，石头那一份要排开和它同样重的水，体积是$\frac m{\rho_{\text{水}}}$；石头沉到槽底时，它只排开自己的体积$\frac m{\rho_{\text{石}}}$，比前者小，因为石头比水密。

    （2）排开的总体积减少$\frac{2.0}{1.0\times10^3}-\frac{2.0}{2.5\times10^3}=1.2\times10^{-3}\,\mathrm{m^3}$，水面下降$\frac{1.2\times10^{-3}}{0.50}=2.4\times10^{-3}\,\mathrm m=2.4\,\mathrm{mm}$。

    （3）不变。木块放进水里仍然漂浮，浮力等于它的重力，排开的水的体积还是$\frac m{\rho_{\text{水}}}$，和放在船里时一样。

- id: p6
  tier: hard
  statement: |
    半径为$R$、长为$L$的圆柱体横放（轴水平），完全浸没在密度为$\rho$的液体里，轴在液面下$h$处（$h>R$），液面上的压强是$p_0$。不用阿基米德原理，直接把压力加起来求浮力。

    （1）设侧面上一点和轴的连线与竖直向下的方向成$\varphi$角，写出那里的压强，以及$\varphi$到$\varphi+\dd\varphi$之间那一窄条受的压力的竖直分量。

    （2）积分求竖直方向的合力，验证它等于$\rho g\pi R^2L$。

    （3）两个圆形端面和水平方向的分量为什么不用管？
  hints:
    - |
      那一点在液面下$h+R\cos\varphi$处；窄条的面积是$LR\,\dd\varphi$，压力垂直于侧面、指向轴。
    - |
      压力的竖直分量是$p\cos\varphi\,LR\,\dd\varphi$，向上为正；$\int_0^{2\pi}\cos\varphi\,\dd\varphi=0$，$\int_0^{2\pi}\cos^2\varphi\,\dd\varphi=\pi$。
    - |
      $\int_0^{2\pi}\bigl(p_0+\rho gh+\rho gR\cos\varphi\bigr)\cos\varphi\,LR\,\dd\varphi=\rho gR^2L\pi$。
  reference: |
    （1）那一点在液面下$h+R\cos\varphi$处，压强$p=p_0+\rho g(h+R\cos\varphi)$。窄条的面积是$LR\,\dd\varphi$，压力垂直于侧面、指向轴，和竖直向上的方向成$\varphi$角，竖直分量是$p\cos\varphi\,LR\,\dd\varphi$。

    （2）$F=LR\int_0^{2\pi}\bigl(p_0+\rho gh\bigr)\cos\varphi\,\dd\varphi+\rho gR^2L\int_0^{2\pi}\cos^2\varphi\,\dd\varphi$。第一个积分是零，第二个用$\cos^2\varphi=\frac{1+\cos2\varphi}2$，等于$\pi$，所以$F=\rho g\pi R^2L$，正是排开的液体受的重力。

    （3）两个端面在同样的深度范围里、面积相同，压力大小相等、方向相反，互相抵消。侧面压力的水平分量是$-p\sin\varphi\,LR\,\dd\varphi$，$\varphi$和$2\pi-\varphi$两处深度相同、$\sin$相反，积分为零。

- id: p7
  tier: thinking
  statement: |
    一块冰浮在一杯浓盐水上，冰全部熔化以后，杯里的液面升高、降低还是不变？说明理由。熔化成的水和盐水混合后，总体积等于两者体积之和。
  hints:
    - |
      冰漂浮时，排开的盐水重等于冰重。
    - |
      冰熔化成的水，重量和冰相同，体积和排开的盐水的体积比，哪个大？
    - |
      盐水比水密，同样重的盐水体积更小。
  reference: |
    升高。冰的质量是$m$，漂浮时排开的盐水的体积是$\frac m{\rho_{\text{盐水}}}$。它熔化成的水质量还是$m$，体积是$\frac m{\rho_{\text{水}}}$，比排开的盐水的体积大，因为盐水比水密。熔化后这些水和盐水混合，总体积增加的部分比原来排开的多，液面就升高了。

- id: p8
  tier: thinking
  statement: |
    潜水艇能停在水下不同的深度。一个吹足了气的气球拴上一块石头，调节得正好能悬浮在水面下浅处。把它往下按一段再松手，它会怎样运动？为什么潜水艇不会这样？
  hints:
    - |
      往下按，气球外的水的压强怎样变？
    - |
      压强大了，气球被压小，排开的水少了，浮力怎样变？
    - |
      潜水艇的艇身是硬的，体积不随深度变；水本身也几乎不能压缩。
  reference: |
    会一直沉下去，越沉越快。往下按以后，气球外的水的压强变大，气球被压小，排开的水变少，浮力就比重力小，合力向下，它继续下沉；越往下压强越大，浮力越小，所以停不下来。反过来，稍稍往上一点，它就会一直浮上来，这样的悬浮是不稳定的。

    潜水艇的艇身是硬的，体积几乎不随深度变，水又几乎不能压缩，密度也不变，所以浮力在各个深度都一样。灌水、排水把平均密度调到和水相等以后，它在哪个深度都能悬浮，要上下运动就再灌水或排水。
