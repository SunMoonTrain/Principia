- id: p1
  tier: easy
  statement: |
    小球以$3.0\,\mathrm{m/s}$的速度从高$1.25\,\mathrm m$的桌边水平滚出，不计空气阻力，$g$取$9.8\,\mathrm{m/s^2}$。落地点离桌边的水平距离是多少？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: 3*sqrt(2*1.25/9.8)
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      离开桌边后是抛射角为零的抛体运动：水平方向匀速，竖直方向从静止开始以$g$加速。
    - |
      落地时间由$1.25=\frac12gt^2$求出。
    - |
      $t=\sqrt{\frac{2\times1.25}{9.8}}\approx0.505\,\mathrm s$，水平距离$3.0\times0.505\approx1.52\,\mathrm m$。
  solution: |
    竖直方向$1.25=\frac12\times9.8\,t^2$，$t\approx0.505\,\mathrm s$。水平方向不受影响，一直以$3.0\,\mathrm{m/s}$匀速运动，水平距离$3.0\times0.505\approx1.52\,\mathrm m$。

- id: p2
  tier: easy
  statement: |
    不计空气阻力，下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        两个方向的分运动都是匀速直线运动时，合运动一定是匀速直线运动
      - |
        一个方向匀速、另一个方向匀加速的平面运动，轨迹一定是抛物线
      - |
        抛体运动中，任意两段相等的时间里，速度矢量的改变量都相同
      - |
        斜抛的物体在空中运动时，速度和加速度的夹角一直在增大
      - |
        水平抛出的物体，落地时速度和水平面的夹角只由下落的高度决定
    value: [1, 3]
  hints:
    - |
      把速度矢量按分量写出来，看每个分量怎样随时间变化。
    - |
      抛体的加速度是不变的矢量$(0,-g)$；初速度为零或和加速度同一直线时，轨迹是什么？
    - |
      A、C 对；B、D、E 错。
  solution: |
    A 对：两个分速度都不变，速度矢量就不变，合运动是匀速直线运动。B 错：匀速的那个方向速度为零时，物体只沿一条直线运动，轨迹是直线。C 对：$\Delta\vb v=\vb a\Delta t=(0,-g\Delta t)$，只和时间间隔有关。

    D 错：抛出时速度斜向上，和竖直向下的加速度成钝角；到最高点时速度水平，夹角是$90^\circ$；之后夹角小于$90^\circ$，所以夹角一直在减小。E 错：$\tan\varphi=\frac{gt}{v_0}=\frac{\sqrt{2gh}}{v_0}$，还和水平抛出的速度有关。

- id: p3
  tier: medium
  statement: |
    投篮时，篮球以和水平成$50^\circ$的角出手，篮筐中心比出手点高$1.0\,\mathrm m$，水平距离$6.0\,\mathrm m$。不计空气阻力，把篮球当作质点，$g$取$9.8\,\mathrm{m/s^2}$，篮球恰好穿过篮筐中心，出手速率应是多少？以$\mathrm{m/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: sqrt(9.8*6^2/(2*cos(50*pi/180)^2*(6*tan(50*pi/180) - 1)))
    unit: |
      $\mathrm{m/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      用轨迹方程$y=x\tan\theta-\frac{gx^2}{2v_0^2\cos^2\theta}$，代入篮筐中心的坐标。
    - |
      $1.0=6.0\tan50^\circ-\frac{9.8\times36}{2v_0^2\cos^250^\circ}$，解出$v_0^2$。
    - |
      $v_0^2=\frac{9.8\times36}{2\cos^250^\circ(6\tan50^\circ-1)}\approx69.4\,\mathrm{m^2/s^2}$，$v_0\approx8.33\,\mathrm{m/s}$。
  solution: |
    以出手点为原点，篮筐中心在$(6.0,1.0)$，代入轨迹方程：$1.0=6.0\tan50^\circ-\frac{9.8\times36}{2v_0^2\cos^250^\circ}$。$6.0\tan50^\circ\approx7.15$，所以$\frac{352.8}{2v_0^2\times0.413}\approx6.15$，$v_0^2\approx69.4$，$v_0\approx8.33\,\mathrm{m/s}$。

- id: p4
  tier: medium
  statement: |
    从倾角为$30^\circ$的斜坡顶端，把小球以$10\,\mathrm{m/s}$的速度水平抛出，小球落在斜坡上。不计空气阻力，$g$取$9.8\,\mathrm{m/s^2}$，小球在空中飞了多长时间？以$\mathrm s$为单位，保留三位有效数字。
  answer:
    type: number
    value: 2*10*tan(30*pi/180)/9.8
    unit: |
      $\mathrm s$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      以抛出点为原点，小球落在斜坡上，说明落点的竖直下落距离和水平距离之比是$\tan30^\circ$。
    - |
      水平距离$10t$，下落距离$\frac12gt^2$，令$\frac{gt^2/2}{10t}=\tan30^\circ$。
    - |
      $t=\frac{2\times10\tan30^\circ}{9.8}\approx1.18\,\mathrm s$。
  solution: |
    $t$时刻小球的水平距离是$10t$，下落距离是$\frac12gt^2$。落在斜坡上时两者之比等于$\tan30^\circ$：$\frac{gt}{2\times10}=\tan30^\circ$，$t=\frac{20\tan30^\circ}{9.8}\approx1.18\,\mathrm s$。飞行时间和初速度成正比，初速度加倍，落点沿坡的距离变成$4$倍。

- id: p5
  tier: hard
  statement: |
    在高$h$的平台边缘，以速率$v_0$斜向上抛出小球，抛射角为$\theta$，不计空气阻力，小球落到平台下方的地面上。

    （1）求小球的水平射程$R(\theta)$。（2）证明射程最大时$\tan\theta=\frac{v_0}{\sqrt{v_0^2+2gh}}$，最大射程是$\frac{v_0\sqrt{v_0^2+2gh}}g$。（3）说明$h>0$时最佳抛射角小于$45^\circ$，$h\to0$时趋于$45^\circ$。
  hints:
    - |
      令$y=-h$，从轨迹方程或运动方程解出落地时间，再乘水平速度。
    - |
      直接对$R(\theta)$求导很麻烦；可以换个思路：给定落点的水平距离$x$，轨迹方程是$u=\tan\theta$的一元二次方程，问它什么时候有实数解。
    - |
      $-h=xu-\frac{gx^2}{2v_0^2}(1+u^2)$有实根要求判别式不小于零，最大的$x$对应判别式为零，那时$u=\frac{v_0^2}{gx}$。
  reference: |
    （1）$y=v_0\sin\theta\cdot t-\frac12gt^2=-h$，取正根$t=\frac{v_0\sin\theta+\sqrt{v_0^2\sin^2\theta+2gh}}g$，$R=v_0\cos\theta\cdot t=\frac{v_0\cos\theta\bigl(v_0\sin\theta+\sqrt{v_0^2\sin^2\theta+2gh}\bigr)}g$。

    （2）记$u=\tan\theta$，$\frac1{\cos^2\theta}=1+u^2$。落点水平距离为$x$时，轨迹方程给出$\frac{gx^2}{2v_0^2}u^2-xu+\frac{gx^2}{2v_0^2}-h=0$。能打到$x$，就是这个关于$u$的方程有实根，判别式$x^2-4\cdot\frac{gx^2}{2v_0^2}\bigl(\frac{gx^2}{2v_0^2}-h\bigr)\ge0$，化简得$\frac{g^2x^2}{v_0^4}\le1+\frac{2gh}{v_0^2}$，即$x\le\frac{v_0\sqrt{v_0^2+2gh}}g$。取等号时方程有重根$u=\frac{x}{2\cdot gx^2/(2v_0^2)}=\frac{v_0^2}{gx}=\frac{v_0}{\sqrt{v_0^2+2gh}}$。

    （3）$h>0$时$\frac{v_0}{\sqrt{v_0^2+2gh}}<1$，所以$\theta<45^\circ$；$h\to0$时它趋于$1$，$\theta\to45^\circ$，最大射程趋于$\frac{v_0^2}g$，和射程公式一致。从高处抛出时，球在空中多飞的那段时间来自下落，压低角度、多给水平速度更划算。

- id: p6
  tier: hard
  statement: |
    从原点以固定的速率$v_0$向竖直平面内的各个方向抛出小球，不计空气阻力。

    （1）证明：点$(x,y)$能被打到，当且仅当$y\le\frac{v_0^2}{2g}-\frac{gx^2}{2v_0^2}$。（2）这条边界抛物线的最高点和与$x$轴的交点各在哪里？和竖直上抛的最大高度、最大射程有什么关系？（3）点在边界以内时，有几条轨迹经过它？
  hints:
    - |
      记$u=\tan\theta$，把轨迹方程写成$u$的一元二次方程。
    - |
      $\frac{gx^2}{2v_0^2}u^2-xu+\frac{gx^2}{2v_0^2}+y=0$，有实根的条件就是判别式不小于零。
    - |
      判别式大于零时有两个不同的$u$，对应两个抛射角。
  reference: |
    （1）$x\ne0$时，经过$(x,y)$的轨迹满足$y=xu-\frac{gx^2}{2v_0^2}(1+u^2)$，即$\frac{gx^2}{2v_0^2}u^2-xu+\frac{gx^2}{2v_0^2}+y=0$。能打到等价于它有实根，判别式$x^2-\frac{2gx^2}{v_0^2}\bigl(\frac{gx^2}{2v_0^2}+y\bigr)\ge0$，两边除以$x^2$整理得$y\le\frac{v_0^2}{2g}-\frac{gx^2}{2v_0^2}$。$x=0$时只能竖直上抛，能到的高度是$y\le\frac{v_0^2}{2g}$，也符合这个式子。

    （2）最高点$\bigl(0,\frac{v_0^2}{2g}\bigr)$正是竖直上抛的最大高度；和$x$轴交于$x=\pm\frac{v_0^2}g$，正是$45^\circ$时的最大射程。

    （3）边界以内判别式大于零，有两个$u$，即两个抛射角（一高一低）的轨迹经过这一点；在边界上两个角重合，只有一条轨迹，而且它在这一点和边界相切。烟花、喷泉的水柱外缘看起来是一条抛物线，就是这个原因。

- id: p7
  tier: thinking
  statement: |
    火车沿平直轨道匀速行驶，车里的人把小球竖直向上抛起，不计空气阻力。

    （1）小球会落回他的手里，还是落在他身后？（2）车里的人看到小球走的是什么样的路线？站在地面上的人看到的又是什么样的路线？（3）两个人看到的运动都可以用这一节的办法分解吗？
  hints:
    - |
      抛出之前，小球和人一起以火车的速度水平运动。
    - |
      对地面上的人来说，小球的初速度有水平分量吗？
    - |
      两个人看到的竖直方向的运动完全一样，区别只在水平方向。
  reference: |
    （1）落回手里。抛出前小球随火车以速度$u$水平运动，抛出后水平方向没有加速度，仍以$u$运动，和人的水平运动始终一致。

    （2）车里的人看到小球竖直上升、再竖直落下。地面上的人看到小球的初速度是竖直分量加上水平分量$u$，所以走的是一条抛物线，就是斜抛；人的手也以$u$前进，正好在落点接住它。

    （3）都可以：两个人看到的竖直运动完全相同，都是加速度为$-g$的匀变速直线运动；水平方向一个看到静止，一个看到以$u$匀速。同一个运动在两个观察者看来轨迹不同，以后讲参考系时再细说（见[参考系与相对运动](lesson:physics.newtonian-mechanics.relative-motion)）。

- id: p8
  tier: thinking
  statement: |
    有空气阻力时，物体除了$\vb g$以外还多了一个加速度，它的方向和速度相反，大小随速率增大而增大。

    （1）这时水平和竖直两个方向的运动为什么不再互不相干？

    （2）和不计阻力时相比，射程和最高点的高度会怎样变？轨迹还左右对称吗？

    （3）这时射程最大的抛射角大于还是小于$45^\circ$？说出理由。
  hints:
    - |
      多出来的加速度的两个分量各和速率有关，而速率$\sqrt{v_x^2+v_y^2}$同时含有两个分速度。
    - |
      这个加速度一直在削减速度，下降阶段的水平速度比上升阶段小。
    - |
      抛得越高，在空中停留越久，水平方向被阻力拖慢的时间也越长。
  reference: |
    （1）多出来的加速度的水平分量是它的大小乘以$-\frac{v_x}v$，而它的大小随$v=\sqrt{v_x^2+v_y^2}$变，所以水平方向的加速度和竖直分速度也有关，反过来也一样。两个方向的加速度互相牵连，不能再分开各算各的，运动的分解失效。

    （2）射程和最高点都比不计阻力时小。轨迹不再对称：上升段较长、较平缓，下降段较短、较陡，因为下落时水平速度已经减小了。

    （3）一般小于$45^\circ$。抛射角越大，在空中停留越久，水平速度被削减得越多，所以把角度压低一些、换取更大的水平速度更合算。这只是定性的判断，实际的最佳角度要按阻力的具体规律算（见以后的[与速度有关的阻力](lesson:physics.newtonian-mechanics.drag)）。
