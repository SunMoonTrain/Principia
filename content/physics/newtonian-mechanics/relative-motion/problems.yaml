- id: p1
  tier: easy
  statement: |
    自动扶梯以$0.75\,\mathrm{m/s}$的速度向上运行，扶梯长$24\,\mathrm m$。一个人在扶梯上相对扶梯以$1.25\,\mathrm{m/s}$的速度向上走，他从底端到顶端要多长时间？以$\mathrm s$为单位。
  answer:
    type: number
    value: 24/(0.75 + 1.25)
    unit: |
      $\mathrm s$
  hints:
    - |
      以地面为一个参考系、扶梯为另一个参考系，人相对地面的速度等于相对扶梯的速度加上扶梯相对地面的速度。
    - |
      两个速度同向，人相对地面的速度是$0.75+1.25=2.0\,\mathrm{m/s}$。
    - |
      $\frac{24}{2.0}=12\,\mathrm s$。
  solution: |
    人相对扶梯的速度$1.25\,\mathrm{m/s}$，扶梯相对地面的速度$0.75\,\mathrm{m/s}$，同向相加，人相对地面的速度是$2.0\,\mathrm{m/s}$，走完$24\,\mathrm m$要$12\,\mathrm s$。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        在一个参考系里静止的物体，在另一个参考系里可能在做曲线运动
      - |
        两个参考系相对做匀速直线运动时，在一个参考系里做匀速直线运动的物体，在另一个参考系里也做匀速直线运动
      - |
        两辆车同向行驶，速度分别是$20\,\mathrm{m/s}$和$15\,\mathrm{m/s}$，慢车上的人看快车以$35\,\mathrm{m/s}$的速率运动
      - |
        船在静水中的速率小于水流速度时，无论船头指向哪里，船都不能到达正对岸
      - |
        按伽利略变换，同一时刻两个质点之间的距离在两个参考系里一般不同
    value: [1, 2, 4]
  hints:
    - |
      参考系可以转动；匀速直线运动就是加速度为零的运动。
    - |
      船相对河岸的速度是$\vb v'+\vb u$，正对岸到达要求它没有沿岸的分量；两个质点的位置差在换算时会怎样？
    - |
      A、B、D 对；C、E 错。
  solution: |
    A 对：坐在转动的转盘上看，地上静止的路灯在绕着自己转圈。B 对：加速度在两个参考系里相同，一边为零，另一边也为零。C 错：同向时相对速度是$20-15=5\,\mathrm{m/s}$。

    D 对：船相对水的速度$\vb v'$沿岸的分量最大只有$v'$，抵消不了更大的水流速度，船总被冲向下游。E 错：$\vb r_1'-\vb r_2'=(\vb r_1-\vb ut)-(\vb r_2-\vb ut)=\vb r_1-\vb r_2$，位置差相同，距离也相同。

- id: p3
  tier: medium
  statement: |
    轮船以$10\,\mathrm{km/h}$的速度向正北航行，船上的人觉得风从正西方吹来，风速是$10\,\mathrm{km/h}$。风相对地面的速度有多大？以$\mathrm{km/h}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 10*sqrt(2)
    unit: |
      $\mathrm{km/h}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      「风从正西方吹来」说的是风相对船向正东吹。
    - |
      风相对地面的速度等于风相对船的速度加上船相对地面的速度。
    - |
      取东为$x$、北为$y$：$(10,0)+(0,10)=(10,10)$，大小$10\sqrt2\approx14.1\,\mathrm{km/h}$。
  solution: |
    以地面为$S$、船为$S'$，船相对地面的速度$\vb u=(0,10)$（东为$x$、北为$y$，单位$\mathrm{km/h}$），风相对船的速度$\vb v'=(10,0)$。风相对地面的速度$\vb v=\vb v'+\vb u=(10,10)$，大小$10\sqrt2\approx14.1\,\mathrm{km/h}$，从西南吹向东北。船上的人感到的风，比真实的风偏向了船头的方向。

- id: p4
  tier: medium
  statement: |
    河宽$90\,\mathrm m$，水流速度$5.0\,\mathrm{m/s}$，船相对水的速率是$3.0\,\mathrm{m/s}$。船从岸边出发，到达对岸时被水冲向下游的距离最短是多少？以$\mathrm m$为单位。
  answer:
    type: number
    value: 90*4/3
    unit: |
      $\mathrm m$
  hints:
    - |
      船相对河岸的速度$\vb v=\vb u+\vb v'$：$\vb u$固定，$\vb v'$的长度固定、方向可选，$\vb v$的终点落在一个圆上。
    - |
      冲向下游的距离最短，就是$\vb v$和河岸的夹角最大；这时$\vb v$和那个圆相切，和$\vb v'$垂直。
    - |
      这时$\vb v$和河岸夹角的正弦是$\frac{3.0}{5.0}$，余切是$\frac43$，下游距离$90\times\frac43=120\,\mathrm m$。
  solution: |
    船相对河岸的速度$\vb v=\vb u+\vb v'$。从$\vb u$的终点画半径为$3.0$的圆，$\vb v$的终点在圆上，而$\vb u$比半径长，起点在圆外。船的路线沿$\vb v$，冲向下游的距离最短，就是$\vb v$和河岸的夹角$\theta$最大，这时$\vb v$和圆相切、垂直于$\vb v'$，$\sin\theta=\frac{3.0}{5.0}$，$\tan\theta=\frac34$。下游距离是$\frac{90}{\tan\theta}=120\,\mathrm m$；船头要偏向上游，和河岸成$53^\circ$。

- id: p5
  tier: hard
  statement: |
    参考系$S'$相对$S$以$\vb u_1$匀速运动，$S''$相对$S'$以$\vb u_2$匀速运动，三者的坐标轴平行，$t=0$时原点重合。

    （1）证明从$S$到$S''$的换算也是伽利略变换，相对速度是$\vb u_1+\vb u_2$；从$S'$换回$S$的换算也是伽利略变换，相对速度是$-\vb u_1$。（2）证明同一时刻两个质点的位置差、速度差在所有这些参考系里都相同。（3）由（2）说明：只由两个质点的位置差和速度差决定的加速度规律（例如两者之间的相互作用），在这些参考系里形式完全一样。
  hints:
    - |
      依次用两次$\vb r'=\vb r-\vb ut$。
    - |
      位置差$\vb r_1-\vb r_2$里，$\vb ut$这一项相减抵消；速度差里$\vb u$抵消。
    - |
      加速度在这些参考系里本来就相同，等式两边都不变。
  reference: |
    （1）$\vb r'=\vb r-\vb u_1t$，$\vb r''=\vb r'-\vb u_2t=\vb r-(\vb u_1+\vb u_2)t$，正是相对速度为$\vb u_1+\vb u_2$的伽利略变换。由$\vb r'=\vb r-\vb u_1t$解出$\vb r=\vb r'+\vb u_1t=\vb r'-(-\vb u_1)t$，是相对速度为$-\vb u_1$的伽利略变换。两次变换连起来还是变换，每个变换都能倒回去。

    （2）同一时刻$t$，$\vb r_1'-\vb r_2'=(\vb r_1-\vb ut)-(\vb r_2-\vb ut)=\vb r_1-\vb r_2$；求导得$\vb v_1'-\vb v_2'=\vb v_1-\vb v_2$。对任何相对速度为$\vb u$的变换都成立，所以在所有这些参考系里都相同。

    （3）设某条规律说质点 1 的加速度是$\vb a_1=\vb f(\vb r_1-\vb r_2,\vb v_1-\vb v_2)$。换到另一个参考系，左边$\vb a_1'=\vb a_1$，右边的两个差都不变，所以$\vb a_1'=\vb f(\vb r_1'-\vb r_2',\vb v_1'-\vb v_2')$，形式一模一样。这类规律分辨不出哪个参考系在「真正地」运动。

- id: p6
  tier: hard
  statement: |
    甲船从港口出发，以$15\,\mathrm{km/h}$向正北航行；同一时刻，乙船在港口正东$20\,\mathrm{km}$处，以$20\,\mathrm{km/h}$向正西航行。

    （1）以甲船为参考系，乙船怎样运动？（2）两船之间最近的距离是多少，出现在出发后多久？（3）如果不换参考系，直接写出两船距离的平方随时间的函数，求它的最小值，核对（2）的结果。
  hints:
    - |
      乙相对甲的速度是$\vb v_{\text{乙}}-\vb v_{\text{甲}}$，是一个不变的矢量，乙相对甲做匀速直线运动。
    - |
      在甲船看来，乙从$(20,0)$出发沿直线运动，最近距离是甲到这条直线的距离。
    - |
      乙相对甲的速度是$(-20,-15)$，大小$25\,\mathrm{km/h}$；直线到原点的距离是$\frac{20\times15}{25}$。
  reference: |
    取东为$x$、北为$y$，单位$\mathrm{km}$、$\mathrm h$。甲的速度$(0,15)$，乙的速度$(-20,0)$。

    （1）乙相对甲的速度$(-20,0)-(0,15)=(-20,-15)$，大小$25$，不随时间变。所以在甲船上看，乙从$(20,0)$出发，沿$(-4,-3)$方向做匀速直线运动。

    （2）甲在原点，乙的路线是过$(20,0)$、方向$(-4,-3)$的直线。原点到它的距离是$\frac{|20\times(-3)-0\times(-4)|}{5}=12\,\mathrm{km}$。走到垂足的路程是$(20,0)$在方向$\frac{(-4,-3)}5$上投影的大小$\frac{80}5=16\,\mathrm{km}$，用时$\frac{16}{25}=0.64\,\mathrm h$，约$38$分钟。

    （3）$t$时刻乙相对甲的位置是$(20-20t,-15t)$，距离的平方$D^2=(20-20t)^2+225t^2=625t^2-800t+400$。它在$t=\frac{800}{1250}=0.64\,\mathrm h$时最小，最小值$400-\frac{800^2}{4\times625}=144$，最近距离$12\,\mathrm{km}$，和（2）一致。

- id: p7
  tier: thinking
  statement: |
    伽利略写过：在匀速平稳航行的船舱里，关上门窗，蝴蝶照样四处飞，鱼照样在缸里游，水滴照样竖直落进下面的瓶口，你分辨不出船是停着还是在动。

    （1）用这一节的伽利略变换解释，为什么这些现象在船上和在岸上看起来一样。（2）如果船在加速，哪些现象会和停船时不同？（3）「速度是相对的，加速度却不是」，你同意吗？
  hints:
    - |
      船舱里的物体相对船舱怎样运动，由什么决定？换到岸上，哪个量不变？
    - |
      船加速时，船舱这个参考系相对岸的速度不再是常矢量。
    - |
      $\vb a'=\vb a$只对相对速度不变的两个参考系成立。
  reference: |
    （1）船匀速时，船舱和岸是相对速度不变的两个参考系，同一个运动在两边加速度相同，两个物体之间的相对位置、相对速度也相同（第 5 题）。鱼、蝴蝶、水滴的运动只和它们之间、和船舱之间的相对位置、相对速度有关，所以在船上看到的和停船时完全一样。

    （2）船加速时，船舱相对岸的速度在变，换算时$\vb a'=\vb a-\dv{\vb u}t$，加速度不再相同：水滴会落在瓶口后方，悬挂的灯会向后偏，人会感到被往后推。

    （3）在相对做匀速直线运动的参考系之间，加速度确实对谁都一样，从这个意义上说它不是相对的；可是一旦允许参考系加速，加速度也要跟着换算。哪些参考系能让运动规律最简单，是[牛顿运动定律](lesson:physics.newtonian-mechanics.newtons-laws)的问题。

- id: p8
  tier: thinking
  statement: |
    一列火车以速度$u$行驶，车头的灯向前发出光。按伽利略变换，地面上测得的光速应该是车上测得的光速加上$u$。

    （1）如果车上测得光速是$c$，地面上按伽利略变换应该测得多少？（2）实验发现，不管光源怎样运动，测得的真空中的光速总是$c$。这和伽利略变换的哪一个假设冲突？（3）为什么日常生活里我们从来察觉不到伽利略变换有问题？
  hints:
    - |
      速度的换算$\vb v=\vb v'+\vb u$。
    - |
      推导伽利略变换时，对两个参考系的时间和长度做了什么假设？
    - |
      和光速比，火车的速度有多大？
  reference: |
    （1）按$\vb v=\vb v'+\vb u$，应是$c+u$。

    （2）光速对谁都是$c$，就不能再按$\vb v=\vb v'+\vb u$相加，而这个公式来自「两个参考系量的时间、长度相同」这一假设。爱因斯坦正是放弃了这个假设，才得到了狭义相对论（见[相对性原理与光速不变](lesson:physics.special-relativity.postulates)）。

    （3）火车的速度只有光速的几千万分之一，按相对论算出的修正小得测不出来。日常的速度、距离下，伽利略变换是极好的近似，牛顿力学就建立在它上面。
