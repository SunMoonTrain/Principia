- id: p1
  tier: easy
  statement: |
    火星轨道的半长轴约是$1.52\,\mathrm{AU}$，地球的轨道近似是半径$1\,\mathrm{AU}$的圆，周期$1$年。火星绕太阳一周要多少年？保留三位有效数字。
  answer:
    type: number
    value: 1.52^1.5
    unit: |
      年
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      火星和地球都绕太阳转，用开普勒第三定律。
    - |
      $\frac{T^2}{a^3}$相同，以年和$\mathrm{AU}$为单位时，地球的比值是$1$，所以$T^2=a^3$。
    - |
      $T=1.52^{3/2}\approx1.87$年。
  solution: |
    由开普勒第三定律，绕太阳的天体$\frac{T^2}{a^3}$都相同。以年和$\mathrm{AU}$为单位，地球的比值是$1$，所以火星的$T^2=a^3=1.52^3$，$T=1.52^{3/2}\approx1.87$年。

- id: p2
  tier: easy
  statement: |
    行星、彗星都只受太阳的引力，太阳当作不动的质点。下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        偏心率越大的椭圆轨道越接近圆
      - |
        行星在近日点的速率比在远日点的大
      - |
        机械能为正的彗星，轨道是一个很扁的椭圆
      - |
        椭圆轨道上的机械能只和半长轴有关
      - |
        半长轴相同的两条椭圆轨道，周期相同
    value: [2, 4, 5]
  hints:
    - |
      近日点、远日点处速度都垂直于半径，角动量是$mrv$。
    - |
      $\frac{T^2}{a^3}=\frac{4\pi^2}{GM}$；$E=\frac{mk^2}{2L^2}(e^2-1)$。
    - |
      B、D、E 对；A、C 错。
  solution: |
    A 错：$e=0$是圆，$e$越大椭圆越扁。B 对：角动量守恒，近日点、远日点的速度都垂直于半径，$r_{\text{近}}v_{\text{近}}=r_{\text{远}}v_{\text{远}}$，近日点离得近，速率大。C 错：$E>0$时$e>1$，轨道是双曲线，彗星一去不回。

    D 对：$E=-\frac{GMm}{2a}$。E 对：$T^2=\frac{4\pi^2a^3}{GM}$，只和$a$有关。

- id: p3
  tier: medium
  statement: |
    一颗彗星的近日点离太阳$0.50\,\mathrm{AU}$，远日点离太阳$9.5\,\mathrm{AU}$。它绕太阳一周要多少年？保留三位有效数字。
  answer:
    type: number
    value: ((0.50 + 9.5)/2)^1.5
    unit: |
      年
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      近日点、远日点到太阳的距离是$a(1-e)$和$a(1+e)$。
    - |
      两者之和是$2a$，$a=5.0\,\mathrm{AU}$。
    - |
      和地球比较，$T=a^{3/2}=5.0^{3/2}\approx11.2$年。
  solution: |
    近日点、远日点到太阳的距离之和是$a(1-e)+a(1+e)=2a$，所以$a=\frac{0.50+9.5}2=5.0\,\mathrm{AU}$。由开普勒第三定律，和地球比较，$T=a^{3/2}=5.0^{3/2}\approx11.2$年。偏心率$e=\frac{9.5-0.50}{10}=0.90$，可周期只看半长轴。

- id: p4
  tier: medium
  statement: |
    卫星的椭圆轨道，近地点离地心$7.0\times10^6\,\mathrm m$，远地点离地心$1.4\times10^7\,\mathrm m$，地球的$GM$取$3.98\times10^{14}\,\mathrm{m^3/s^2}$。卫星在近地点的速率是多少？以$\mathrm{km/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: sqrt(3.98e14*(2/7.0e6 - 2/(7.0e6 + 1.4e7)))/1000
    unit: |
      $\mathrm{km/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      椭圆轨道的机械能$E=-\frac{GMm}{2a}$，$a$是近地点、远地点距离的平均值。
    - |
      $\frac12v^2-\frac{GM}r=-\frac{GM}{2a}$，所以$v^2=GM\Bigl(\frac2r-\frac1a\Bigr)$。
    - |
      $a=1.05\times10^7\,\mathrm m$，$v=\sqrt{3.98\times10^{14}\times\Bigl(\frac2{7.0\times10^6}-\frac1{1.05\times10^7}\Bigr)}\approx8.71\,\mathrm{km/s}$。
  solution: |
    半长轴$a=\frac{7.0\times10^6+1.4\times10^7}2=1.05\times10^7\,\mathrm m$，机械能$E=-\frac{GMm}{2a}$。在近地点$\frac12mv^2-\frac{GMm}{r}=-\frac{GMm}{2a}$，$v=\sqrt{GM\Bigl(\frac2r-\frac1a\Bigr)}=\sqrt{3.98\times10^{14}\times\Bigl(\frac2{7.0\times10^6}-\frac1{1.05\times10^7}\Bigr)}\approx8.71\,\mathrm{km/s}$。也可以用角动量守恒$r_{\text{近}}v_{\text{近}}=r_{\text{远}}v_{\text{远}}$加上机械能守恒，结果相同。

- id: p5
  tier: hard
  statement: |
    牛顿当年是反过来推的：由开普勒定律推出太阳对行星的引力的规律。为简单起见，设各个行星都绕太阳做匀速圆周运动。

    （1）由开普勒第三定律$T^2\propto r^3$，证明太阳对行星的引力和行星的质量成正比、和距离的平方成反比。

    （2）再用牛顿第三定律说明，这个力也和太阳的质量成正比。

    （3）只用圆轨道，能不能断定「同一颗行星离太阳远近不同时，引力按距离的平方成反比变化」？开普勒第一定律在这里起什么作用？
  hints:
    - |
      圆轨道上，太阳的引力就是向心力$m\frac{4\pi^2r}{T^2}$。
    - |
      太阳吸引行星，行星也以同样大的力吸引太阳；把两者的地位对调来看。
    - |
      圆轨道上，每颗行星只在一个距离上「量」过引力。
  reference: |
    （1）行星做匀速圆周运动，太阳的引力就是向心力：$F=m\frac{4\pi^2r}{T^2}$。由$T^2=Cr^3$（$C$对所有行星相同），$F=\frac{4\pi^2}C\cdot\frac m{r^2}$，和行星的质量成正比、和距离的平方成反比。

    （2）由牛顿第三定律，行星对太阳的引力和太阳对行星的引力大小相等。把太阳和行星的地位对调，引力也应该和被吸引的太阳的质量成正比，所以$F\propto\frac{Mm}{r^2}$，写成$F=\frac{GMm}{r^2}$。

    （3）不能完全断定。圆轨道上每颗行星离太阳的距离不变，各颗行星只在各自的距离上给出一个数据点；这些点合起来说明力按$\frac1{r^2}$变化，前提是引力只和距离、质量有关，对所有行星是同一个规律。第一定律说同一颗行星在椭圆上远近变化，而只有平方反比的引力才给出焦点在太阳的椭圆（本节的轨道方程），这就在同一颗行星身上检验了平方反比。

- id: p6
  tier: hard
  statement: |
    质点受背离力心的斥力，大小$\frac\kappa{r^2}$（$\kappa>0$），例如两个同号的点电荷之间的库仑力。角动量$L\ne0$。

    （1）仿照讲解，写出$u=\frac1r$满足的方程，并解出轨道。

    （2）轨道是什么曲线？力心在它的哪里？

    （3）质点离力心最近是多少？机械能能不能是负的？
  hints:
    - |
      势能是$+\frac\kappa r$，相当于讲解里把$k$换成$-\kappa$。
    - |
      $u=\frac{m\kappa}{L^2}\bigl[e\cos(\varphi-\varphi_0)-1\bigr]$，$u>0$要求$e>1$。
    - |
      最近处$\varphi=\varphi_0$；$E$是动能加正的势能。
  reference: |
    （1）势能$U=+\frac\kappa r$，推导和讲解一样，只是$k$换成$-\kappa$：$\dv{^2u}{\varphi^2}+u=-\frac{m\kappa}{L^2}$。特解是$-\frac{m\kappa}{L^2}$，通解$u=\frac{m\kappa}{L^2}\bigl[e\cos(\varphi-\varphi_0)-1\bigr]$，$e\ge0$。

    （2）$u>0$要求$e\cos(\varphi-\varphi_0)>1$，所以$e>1$，而且$\varphi$只能在$\varphi_0$附近一段角度里。取$\varphi_0=0$，$r=\frac p{e\cos\varphi-1}$，$p=\frac{L^2}{m\kappa}$，化成直角坐标是双曲线的一支。和引力时不同，这一支背着力心弯：力心不在这一支张开的那一边，而在它外侧的那个焦点上，质点从远处飞来，绕开力心，又飞走。

    （3）最近处$\varphi=0$，$r_{\min}=\frac p{e-1}$。机械能$E=\frac12mv^2+\frac\kappa r>0$，不能是负的，所以斥力下没有有界的轨道。卢瑟福（Rutherford）正是用这样的轨道分析了$\alpha$粒子被原子核散射的实验。

- id: p7
  tier: thinking
  statement: |
    地球每年 1 月初经过近日点，7 月初经过远日点。

    （1）北半球的冬天在 1 月前后，这说明季节是由地球离太阳的远近决定的吗？

    （2）从春分到秋分（北半球的夏半年）约$186$天，从秋分到春分只有约$179$天。为什么会有这个差别？

    （3）南半球的夏半年和冬半年，哪个长？
  hints:
    - |
      近日点、远日点到太阳的距离只差约$3\%$。
    - |
      春分、秋分时地球和太阳的连线把轨道分成两半；想一想开普勒第二定律。
    - |
      南半球的季节和北半球相反。
  reference: |
    （1）不是。地球轨道的偏心率只有约$0.017$，近日点、远日点离太阳只差约$3\%$。季节来自地轴的倾斜：太阳直射北半球时，北半球白天长、阳光照得陡，是夏天。北半球的冬天正好碰上近日点，说明距离不是主要原因。

    （2）由开普勒第二定律，地球离太阳近时扫过面积快，也就跑得快。秋分到春分这一段包含 1 月初的近日点，地球在这半边轨道上跑得快，用的时间就少；春分到秋分包含远日点，跑得慢，用的时间多。

    （3）南半球的季节和北半球相反：它的夏半年是秋分到春分，约$179$天，冬半年约$186$天，夏半年短。

- id: p8
  tier: thinking
  statement: |
    两艘飞船在同一条圆轨道上绕地球运行，后面那艘想追上前面那艘。

    （1）它在原地沿运动方向点火加速，轨道会变得怎样？这样能更快地追上吗？

    （2）如果改成沿运动方向的反方向点火、减速一点呢？

    （3）追上以后，它要怎样回到原来的圆轨道？
  hints:
    - |
      加速以后机械能增大，$E=-\frac{GMm}{2a}$，半长轴怎样变？周期呢？
    - |
      减速以后，点火处成了远地点，新轨道的半长轴变小，周期变短。
    - |
      回到点火的地方时再反过来点火一次。
  reference: |
    （1）加速以后机械能增大，由$E=-\frac{GMm}{2a}$，半长轴变大，点火处成了近地点，卫星升到更高的地方，那里跑得慢。由开普勒第三定律，周期也变长，转完一圈回到点火处时，前面那艘飞船已经走得更远：越加速，落得越远。

    （2）减速一点，机械能减小，半长轴变小，点火处成了远地点，卫星沉到低处跑得快，周期比原来短。每转一圈，它都比前面那艘少用一点时间，相当于追近一段；选好减速的多少，可以让它在某一次回到点火处时，前面那艘也正好到达那里。

    （3）回到点火处（远地点）时，再沿运动方向点火，加回同样多的速率，机械能恢复原值，又回到原来的圆轨道上。
