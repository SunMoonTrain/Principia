- id: p1
  tier: easy
  statement: |
    用长$1.2\,\mathrm m$的撬棍撬石头，支点离撬石头的那一端$0.20\,\mathrm m$，石头对撬棍的力是$600\,\mathrm N$，垂直于撬棍。人在另一端垂直于撬棍用力，至少要多大的力？以$\mathrm N$为单位，撬棍受的重力不计。
  answer:
    type: number
    value: 600*0.20/(1.2 - 0.20)
    unit: |
      $\mathrm N$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      撬棍是杠杆，对支点取力矩。
    - |
      两个力的力臂分别是$0.20\,\mathrm m$和$1.0\,\mathrm m$，$F_1l_1=F_2l_2$。
    - |
      $F=\frac{600\times0.20}{1.0}=120\,\mathrm N$。
  solution: |
    对支点取力矩，支点的力不出现：$F\times1.0=600\times0.20$，$F=120\,\mathrm N$。人这一边的力臂是石头那一边的$5$倍，力就只要$\frac15$。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        刚体平衡时，作用在它上面的每一个力对任一点的力矩都是零
      - |
        刚体平衡时，外力对物体外面的任意一点的力矩之和也为零
      - |
        一根粗细不均匀的木棒，在重心处支起来能平衡；从重心处锯成两段，两段受的重力相等
      - |
        只受三个力而平衡的刚体，三个力如果在同一平面里、互不平行，作用线一定交于一点
      - |
        同一个物体，从山脚搬到山顶，重心相对物体的位置几乎不变
    value: [2, 4, 5]
  hints:
    - |
      平衡条件说的是力矩之和；力矩之和对哪一点都要为零。
    - |
      锯开前对重心取力矩：两段的重力各乘自己的力臂。对三个力，取其中两个力作用线的交点。
    - |
      B、D、E 对；A、C 错。
  solution: |
    A 错：平衡只要求力矩之和为零，单个力的力矩可以不为零，例 2 里墙和地面的力对梯子中点就都有力矩。B 对：平衡时外力之和为零，对任意一点的力矩之和都相等，都是零，这一点在不在物体上无所谓。C 错：两段的重力对支点的力矩相等，粗的那段重心离支点近，力臂短，所以更重。

    D 对：对其中两个力作用线的交点取力矩，这两个力的力矩都是零，第三个力的力矩也要为零，它的作用线就必须过这个交点。E 对：不论在山脚还是山顶，物体各部分所在处的重力加速度都几乎一样，重心就是质心，而质心相对物体的位置不会因为搬动而变。

- id: p3
  tier: medium
  statement: |
    一根长$4.0\,\mathrm m$、质量$20\,\mathrm{kg}$的均匀木板，两端各搁在一个支架上，水平静止。质量$50\,\mathrm{kg}$的人站在离左端$1.2\,\mathrm m$处，$g$取$9.8\,\mathrm{m/s^2}$。左边的支架对木板的支持力是多少？以$\mathrm N$为单位，保留三位有效数字。
  answer:
    type: number
    value: (20*9.8*2.0 + 50*9.8*(4.0 - 1.2))/4.0
    unit: |
      $\mathrm N$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      对右端取力矩，右边支架的力就不出现。
    - |
      木板的重力作用在中点，离右端$2.0\,\mathrm m$；人离右端$2.8\,\mathrm m$。
    - |
      $N_{\text{左}}\times4.0=20\times9.8\times2.0+50\times9.8\times2.8$，$N_{\text{左}}=441\,\mathrm N$。
  solution: |
    对右端取力矩：$N_{\text{左}}\times4.0=20\times9.8\times2.0+50\times9.8\times2.8$，所以$N_{\text{左}}=441\,\mathrm N$。再由竖直方向的力之和为零，右边支架的力是$70\times9.8-441=245\,\mathrm N$。人离左端近，左边的支架承担得多。

- id: p4
  tier: medium
  statement: |
    一根长$1.0\,\mathrm m$、质量$2.0\,\mathrm{kg}$的均匀木杆，一端装着一个$1.0\,\mathrm{kg}$的铁块，铁块可以看成质点。在离装铁块那一端多远的地方把它支起来，它能水平平衡？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: 2.0*0.50/(2.0 + 1.0)
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      支点要在重心处。
    - |
      以装铁块的那一端为原点，木杆的重心在$0.50\,\mathrm m$处，铁块在$0$处。
    - |
      $x_{\mathrm C}=\frac{2.0\times0.50+1.0\times0}{3.0}\approx0.333\,\mathrm m$。
  solution: |
    支点要在整体的重心处，重力对它的力矩才为零。以装铁块的一端为原点，$x_{\mathrm C}=\frac{2.0\times0.50+1.0\times0}{2.0+1.0}\approx0.333\,\mathrm m$。重心偏向铁块，离铁块那端约三分之一杆长。

- id: p5
  tier: hard
  statement: |
    长$l$、质量$m$的均匀梯子斜靠在竖直的墙上，下端放在水平地面上。墙和梯子之间的静摩擦因数是$\mu_1=0.20$，地面和梯子之间的是$\mu_2=0.40$。

    （1）梯子和墙成$\theta$角时，画出梯子受的力，列出平衡方程。

    （2）梯子刚好要滑动时，$\theta$是多少？

    （3）只有地面有摩擦、墙光滑时，这个角是多少？比较两者。
  hints:
    - |
      墙的支持力$N_1$水平，墙的摩擦力$f_1$沿墙向上；地面的支持力$N_2$竖直向上，摩擦力$f_2$水平指向墙。
    - |
      刚好要滑动时$f_1=\mu_1N_1$、$f_2=\mu_2N_2$。对下端取力矩：$N_1l\cos\theta+f_1l\sin\theta=mg\frac l2\sin\theta$。
    - |
      解得$\tan\theta=\frac{2\mu_2}{1-\mu_1\mu_2}$。
  reference: |
    （1）梯子受重力$mg$（中点）、墙的支持力$N_1$（水平离开墙）、墙的摩擦力$f_1$（沿墙向上）、地面的支持力$N_2$（向上）、地面的摩擦力$f_2$（水平指向墙）。水平：$N_1=f_2$；竖直：$N_2+f_1=mg$；对下端：$N_1l\cos\theta+f_1l\sin\theta=mg\frac l2\sin\theta$。

    （2）梯子越斜越容易滑；刚好要滑动时两处摩擦都达到最大，$f_1=\mu_1N_1$，$f_2=\mu_2N_2$。由前两式，$N_2=\frac{mg}{1+\mu_1\mu_2}$，$N_1=\frac{\mu_2mg}{1+\mu_1\mu_2}$；代入力矩方程，$2\mu_2(\cos\theta+\mu_1\sin\theta)=(1+\mu_1\mu_2)\sin\theta$，即$\tan\theta=\frac{2\mu_2}{1-\mu_1\mu_2}=\frac{0.80}{0.92}\approx0.870$，$\theta\approx41.0^\circ$。

    （3）$\mu_1=0$时$\tan\theta=2\mu_2=0.80$，$\theta\approx38.7^\circ$，和例 2 的$\mu_{\mathrm s}\ge\frac12\tan\theta$一致。墙也有摩擦时，梯子可以放得更斜一点。

- id: p6
  tier: hard
  statement: |
    质量为$m$、边长为$a$的均匀正方体放在水平地面上，静摩擦因数是$\mu_{\mathrm s}$。在一个侧面的中线上、离地面$h$高处，用水平力$F$推它，$F$从零慢慢增大。

    （1）正方体还没动时，地面的支持力的作用点在哪里？它怎样随$F$移动？

    （2）$F$多大时正方体开始滑动？多大时开始绕前面的底边翻倒？

    （3）推在上边缘（$h=a$）时，$\mu_{\mathrm s}$满足什么条件，正方体先翻倒而不是先滑动？
  hints:
    - |
      地面对底面的支持力分布在底面上，合起来是一个力$N=mg$，作用点由力矩平衡决定。
    - |
      对重心取力矩，或者对前面的底边取力矩。作用点移到前面的底边时就要翻倒。
    - |
      滑动：$F=\mu_{\mathrm s}mg$；翻倒：$Fh=mg\frac a2$。
  reference: |
    （1）竖直方向$N=mg$，水平方向静摩擦力$f=F$。设$N$的作用点在重心正下方往前$x$处，对正方体的重心取力矩：$F\bigl(h-\frac a2\bigr)+f\frac a2=Nx$，即$x=\frac{Fh}{mg}$。$F$越大，支持力的作用点越往前移。

    （2）$F=\mu_{\mathrm s}mg$时静摩擦力达到最大，开始滑动。$x=\frac a2$时作用点到了前面的底边，再推就要绕它翻倒，这时$F=\frac{mga}{2h}$。哪个先到就先发生哪个。

    （3）$h=a$时翻倒需要$F=\frac12mg$，要它比$\mu_{\mathrm s}mg$小，就要$\mu_{\mathrm s}>\frac12$。地面很粗糙时，推箱子的上边缘容易把它推倒；推得低一些，翻倒需要的力就大，箱子就会滑动。

- id: p7
  tier: thinking
  statement: |
    （1）为什么只受三个力而平衡的刚体，三个力在同一平面里、互不平行时，作用线一定交于一点？

    （2）例 1 里横杆受绳子的拉力、自己的重力、重物的重力和铰链的力。用（1）的结论说明铰链的力为什么不沿着杆，并找出它的作用线经过哪里。
  hints:
    - |
      对其中两个力作用线的交点取力矩。
    - |
      两个重力都竖直向下，先把它们合成一个力：它作用在哪里？
    - |
      合成后只剩三个力：拉力、总重力、铰链的力。
  reference: |
    （1）取其中两个力作用线的交点为参考点，这两个力的力矩都是零；平衡时力矩之和为零，第三个力对这一点的力矩也是零，它的作用线就必须过这一点。

    （2）杆的重力$39.2\,\mathrm N$作用在中点，重物的重力$58.8\,\mathrm N$作用在末端，合成一个$98\,\mathrm N$的竖直力，作用线离铰链$\frac{39.2\times0.6+58.8\times1.2}{98}=0.96\,\mathrm m$。这样横杆只受三个力：绳子的拉力（沿绳子）、合成的重力（竖直）、铰链的力，三条作用线交于一点。绳子的作用线在离铰链$0.96\,\mathrm m$处比杆高$0.24\times\tan30^\circ\approx0.139\,\mathrm m$，铰链的力就从铰链指向这一点，和杆成约$8^\circ$角，斜向上，和例 1 里$V\approx19.6\,\mathrm N$、$H\approx136\,\mathrm N$的方向一致。

- id: p8
  tier: thinking
  statement: |
    一张正方形的桌子有四条一样的腿，桌面上偏离中心放着一个重物，桌子静止在水平地面上，桌子受的重力不计。

    （1）列出平衡方程，能不能求出每条腿受的力？

    （2）为什么三条腿的凳子放在不平的地面上也不晃，四条腿的桌子却常常晃？

    （3）真实的桌子每条腿受多大的力，还取决于什么？
  hints:
    - |
      四个竖直的力，平衡方程有几个是独立的？
    - |
      竖直方向一个，对两条水平轴的力矩各一个。
    - |
      三点总能确定一个平面；腿和地面的微小形变也要算进来。
  reference: |
    （1）不能。四条腿的力都竖直，独立的方程只有三个：竖直方向的力之和为零，对两条互相垂直的水平轴的力矩之和为零。四个未知量、三个方程，解不唯一，这样的问题叫超静定问题（statically indeterminate problem）。

    （2）三条腿的端点总能落在同一个平面上，地面不平也都着地，三个未知量、三个方程，正好确定。四条腿的端点一般不在地面的同一个平面上，常常只有三条着地，换一下重心的位置，着地的三条就换了，桌子就晃。

    （3）取决于桌腿、桌面和地面的微小形变：它们并不是真正的刚体，受力越大的腿压缩得越多。要知道每条腿的力，得把形变也考虑进来，单靠刚体的平衡条件不够。
