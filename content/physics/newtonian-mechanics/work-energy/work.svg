  <text x="585.6" y="234.0" fill="currentColor" text-anchor="middle"><tspan font-style="italic">x</tspan><tspan dy="4" font-size="11">2</tspan></text>
  <text x="616.0" y="126.0" fill="currentColor"><tspan font-style="italic">F</tspan>(<tspan font-style="italic">x</tspan>)</text>
