<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-size="14">
  <!-- 两幅图说明功的算法。左图：水平地面上的木块受一个斜向上的拉力 F，和水平方向成 θ 角；虚线把 F 分成沿地面的分量 F cos θ 和竖直的分量 F sin θ，三个箭头的长短按同一比例画。木块从左边的虚线位置移到右边，位移 Δr 沿地面向右，只有沿位移的分量 F cos θ 做功。右图：横轴是位置 x，纵轴是力 F，一条弯曲的 F(x) 曲线；从 x1 到 x2，曲线下面涂了颜色的面积就是变力做的功，面积里画了几个细长的矩形，表示把位移分成小段，每段的功近似是 F 乘 Δx。 -->
