- id: p1
  tier: easy
  statement: |
    质点沿直线运动，位置$x(t)=2t^3-9t^2+12t$（$x$以$\mathrm m$计，$t$以$\mathrm s$计）。速度第一次为零时，加速度是多少？以$\mathrm{m/s^2}$为单位。
  answer:
    type: number
    value: 12*1 - 18
    unit: |
      $\mathrm{m/s^2}$
  hints:
    - |
      先求速度$v=\dv xt$，再求加速度$a=\dv vt$。
    - |
      $v=6t^2-18t+12=6(t-1)(t-2)$，第一次为零是在$t=1\,\mathrm s$。
    - |
      $a=12t-18$，$a(1)=-6\,\mathrm{m/s^2}$。
  solution: |
    $v=\dv xt=6t^2-18t+12=6(t-1)(t-2)$，$t=1\,\mathrm s$时第一次为零。$a=\dv vt=12t-18$，所以这时$a=-6\,\mathrm{m/s^2}$：速度为零的那一刻，加速度并不为零，质点接着就往负方向走了。

- id: p2
  tier: easy
  statement: |
    下面关于直线运动的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        加速度和速度方向相同、加速度又在逐渐减小时，速度的绝对值在减小
      - |
        质点的位置是时间的可导函数时，一段时间里的平均速度一定等于这段时间里某一时刻的瞬时速度
      - |
        加速度不变时，速度随时间均匀变化，位置也随时间均匀变化
      - |
        只要知道加速度$a(t)$和某一时刻的速度，就能确定质点在任何时刻的位置
      - |
        在匀变速直线运动中，即使质点中途掉过头，$v^2-v_0^2=2a(x-x_0)$也成立
    value: [2, 5]
  hints:
    - |
      速度的绝对值增大还是减小，看加速度和速度是否同号，不看加速度的大小怎样变。
    - |
      平均速度是$x(t)$在两端的差商，想想[微分中值定理](lesson:math.calculus.mean-value-theorem)；由加速度求位置要定两个常数。
    - |
      B、E 对；A、C、D 错。
  solution: |
    A 错：加速度和速度同号，速度的绝对值就在增大，加速度减小只是增大得慢了。B 对：平均速度是$\frac{x(t_2)-x(t_1)}{t_2-t_1}$，由拉格朗日中值定理（mean value theorem），它等于$t_1$和$t_2$之间某一时刻的$x'(t)$，也就是那一刻的瞬时速度。C 错：$x=x_0+v_0t+\frac12at^2$是$t$的二次函数，只有$a=0$时位置才随时间均匀变化。

    D 错：由速度求位置还要再定一个常数，必须知道某一时刻的位置。E 对：$v=v_0+at$、$x=x_0+v_0t+\frac12at^2$对掉头前后都成立，消去$t$得到的关系也就不受掉头影响。

- id: p3
  tier: medium
  statement: |
    汽车以$72\,\mathrm{km/h}$的速度行驶，司机看到前方有障碍，经过$0.60\,\mathrm s$的反应时间才开始刹车，刹车时加速度的大小是$5.0\,\mathrm{m/s^2}$。从看到障碍到停下，汽车一共走了多远？以$\mathrm m$为单位。
  answer:
    type: number
    value: 20*0.6 + 20^2/(2*5)
    unit: |
      $\mathrm m$
  hints:
    - |
      先把速度换成$\mathrm{m/s}$；反应时间里汽车还在匀速行驶。
    - |
      刹车阶段是匀变速直线运动，末速度为零，用$v^2-v_0^2=2a(x-x_0)$。
    - |
      $20\times0.60=12\,\mathrm m$，$\frac{20^2}{2\times5.0}=40\,\mathrm m$，合计$52\,\mathrm m$。
  solution: |
    $72\,\mathrm{km/h}=20\,\mathrm{m/s}$。反应时间里汽车匀速走了$20\times0.60=12\,\mathrm m$。刹车阶段$a=-5.0\,\mathrm{m/s^2}$，由$0-v_0^2=2a\Delta x$，$\Delta x=\frac{20^2}{2\times5.0}=40\,\mathrm m$。一共$52\,\mathrm m$；速度加倍时刹车距离变成$4$倍，这就是限速的道理之一。

- id: p4
  tier: medium
  statement: |
    质点沿直线运动，加速度$a=6t-4$（$a$以$\mathrm{m/s^2}$计，$t$以$\mathrm s$计），$t=0$时速度$v=2\,\mathrm{m/s}$、位置$x=1\,\mathrm m$。速度最小的时刻，质点的位置在哪里？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: 47/27
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      先由加速度和初始条件求出$v(t)$，再求出$x(t)$。
    - |
      $v=3t^2-4t+2$，它在$a=0$即$t=\frac23\,\mathrm s$时最小。
    - |
      $x=t^3-2t^2+2t+1$，$x\bigl(\frac23\bigr)=\frac{47}{27}\approx1.74\,\mathrm m$。
  solution: |
    $v$是$a$的原函数，$v=3t^2-4t+C_1$，由$v(0)=2$得$C_1=2$；$x$是$v$的原函数，$x=t^3-2t^2+2t+C_2$，由$x(0)=1$得$C_2=1$。$v$的导数是$a=6t-4$，$t=\frac23\,\mathrm s$时为零，之前为负、之后为正，所以那时速度最小（$v=\frac23\,\mathrm{m/s}$，一直没有掉头）。代入得$x=\frac8{27}-\frac89+\frac43+1=\frac{47}{27}\approx1.74\,\mathrm m$。

- id: p5
  tier: hard
  statement: |
    （1）证明：匀变速直线运动中，任意一段时间里的平均速度，等于这段时间中间时刻的瞬时速度，也等于这段时间初、末速度的平均值。

    （2）证明：匀变速直线运动中，相邻两段长都为$T$的时间里，位移之差等于$aT^2$。

    （3）举一个加速度随时间变化的直线运动的例子，说明（1）的两个结论一般不成立。
  hints:
    - |
      设这段时间从$t_1$到$t_2$，用$x=x_0+v_0t+\frac12at^2$写出位移，除以时间。
    - |
      （2）里两段时间的位移分别用$x(t+T)-x(t)$和$x(t+2T)-x(t+T)$表示。
    - |
      （3）可以试$x=t^3$在$0$到$1$这段时间里的情形。
  reference: |
    （1）$x(t_2)-x(t_1)=v_0(t_2-t_1)+\frac12a(t_2^2-t_1^2)$，除以$t_2-t_1$，平均速度是$v_0+\frac12a(t_1+t_2)$。它等于中间时刻$\frac{t_1+t_2}2$的瞬时速度$v_0+a\frac{t_1+t_2}2$，也等于$\frac{v(t_1)+v(t_2)}2=\frac{(v_0+at_1)+(v_0+at_2)}2$。

    （2）$x(t+T)-x(t)=v_0T+\frac12a(2tT+T^2)$，$x(t+2T)-x(t+T)=v_0T+\frac12a(2tT+3T^2)$，相减得$aT^2$，和$t$无关。打点计时器的纸带上，相邻两段的长度差总是同一个数，就是用这一点判断运动是否匀变速、并量出$a$的。

    （3）$x=t^3$，$v=3t^2$，加速度$6t$在变。从$0$到$1$，平均速度是$1$；中间时刻的速度$v\bigl(\frac12\bigr)=\frac34$；初、末速度的平均值是$\frac{0+3}2=\frac32$。三者互不相等，两个结论都不成立。

- id: p6
  tier: hard
  statement: |
    公交车从站台由静止开始，以加速度$a$匀加速开出；同一时刻，车后距离$d$处有人以速度$v$匀速追车，运动在同一条直线上。

    （1）证明人能追上车的条件是$v^2\ge2ad$。（2）追不上时，人和车之间最近的距离是多少？（3）$v^2>2ad$时，人追上车之后，车会不会又追上人？各在什么时刻？
  hints:
    - |
      以人出发的位置为原点，写出人和车的位置，再写出车领先人的距离$D(t)$。
    - |
      $D(t)=d+\frac12at^2-vt$是$t$的二次函数，最小值在$t=\frac va$处。
    - |
      $D(t)=0$有两个正根时，人在小的那个根追上车，车在大的那个根又追上人。
  reference: |
    以人出发的位置为原点、车开出的方向为正，人在$x_1=vt$，车在$x_2=d+\frac12at^2$。车领先人的距离$D(t)=x_2-x_1=\frac12at^2-vt+d$。

    （1）$D(t)$在$t=\frac va$时最小，最小值$D_{\min}=d-\frac{v^2}{2a}$。追得上就是$D$在某一时刻等于零，即$D_{\min}\le0$，也就是$v^2\ge2ad$。

    （2）$v^2<2ad$时最近的距离是$D_{\min}=d-\frac{v^2}{2a}$，出现在$t=\frac va$，那时车速正好等于人的速度：之前人比车快，距离在缩小；之后车比人快，距离又拉大。

    （3）$v^2>2ad$时$D(t)=0$有两个正根$t_{1,2}=\frac{v\mp\sqrt{v^2-2ad}}a$。在$t_1$人追上并超过车，此后一段时间人在车前；车的速度不断增大，到$t_2$车又追上人，之后车一直在前。$v^2=2ad$时两根重合，人只是刚好碰到车，速度相同的那一刻又被拉开。

- id: p7
  tier: thinking
  statement: |
    汽车的里程表记录的是走过的路程$s(t)$，不是位置坐标$x(t)$。

    （1）用$s(t)$能求出速度表的读数吗？能求出速度$v(t)$吗？

    （2）一段时间里里程表的读数一直在增加，能不能断定汽车在这段时间里没有掉头？

    （3）知道$v(t)$，能求出$s(t)$吗？还需要知道什么？
  hints:
    - |
      很短的时间里，路程的增量和位移的增量有什么关系？
    - |
      掉头前后，里程表的读数都在增加。
    - |
      $s(t)$的导数是速度的绝对值；求原函数时要把$v$变号的时刻分开。
  reference: |
    （1）很短的时间里，路程的增量是位移增量的绝对值，所以$\dv st=|v|$，正是速度表的读数。可$s(t)$不记方向，从它求不出$v$的正负，求不出速度本身。

    （2）不能。不管往哪边开，路程都在增加；掉头的那一刻$|v|=0$，里程表只是那一瞬间停了一下。要知道有没有掉头，得看$v$有没有变号，里程表看不出来。

    （3）能：$s(t)$是$|v(t)|$的原函数，再用开始时$s=0$定常数。$v$变号时$|v|$在那里有个尖角，要在掉头的时刻把时间分成几段，每段里$|v|$等于$v$或$-v$，分别求原函数再接起来。和由$v$求$x$相比，还要知道$v$在哪些时刻变号。

- id: p8
  tier: thinking
  statement: |
    加速度对时间的导数叫作加加速度（jerk）。

    （1）电梯起动时，如果加速度在一瞬间从$0$跳到$1\,\mathrm{m/s^2}$，速度和位置随时间的图像在那一刻是什么样子？（2）速度能不能在一瞬间跳变？为什么分析碰撞时常常把速度当作瞬间改变？（3）为什么电梯、地铁的设计要限制加加速度的大小？
  hints:
    - |
      加速度是速度图像的斜率，速度是位置图像的斜率。
    - |
      速度在很短的时间$\Delta t$里改变$\Delta v$，平均加速度是多少？$\Delta t\to0$时呢？
    - |
      人对加速度的突然变化很敏感：汽车起步太猛，人会往后一仰。
  reference: |
    （1）加速度跳变时，速度图像在那一点连续，但出现一个折角：之前斜率为$0$，之后斜率为$1\,\mathrm{m/s^2}$。位置图像在那一点连切线都是连续的，只是向上弯曲的程度突然改变，看上去依然光滑。

    （2）速度在$\Delta t$里改变$\Delta v$，平均加速度是$\frac{\Delta v}{\Delta t}$，$\Delta t\to0$时趋于无穷大，真实的物体做不到。碰撞时速度在几毫秒里就改变了，加速度极大，持续时间又比我们关心的时间短得多，所以近似成瞬间跳变，只看碰撞前后的速度。

    （3）人能清楚地感到加速度的突然变化：加速度一瞬间从$0$跳到$1\,\mathrm{m/s^2}$，身体会被猛地带一下，感到顿挫。把加加速度限制在一定范围内，加速度就平缓地升到额定值，乘客感觉平稳；到达时同样让加速度平缓地回到零。
