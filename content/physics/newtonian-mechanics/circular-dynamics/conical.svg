<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" width="660" height="280" font-size="14">
  <!-- 两种由几个力合成向心力的情形：左边是圆锥摆，小球拴在细绳下端，在水平面内绕竖直轴转圈，绳子和竖直方向成 θ 角；小球受竖直向下的重力 G 和沿绳指向悬点的拉力 T，两者的合力水平指向圆心，就是向心力 Fn。右边是倾斜路面上转弯的汽车的横截面，路面向弯道外侧抬高，倾角为 θ；汽车受竖直向下的重力 G 和垂直于路面的支持力 N，两者的合力水平指向弯道的圆心，就是向心力 Fn。 -->
