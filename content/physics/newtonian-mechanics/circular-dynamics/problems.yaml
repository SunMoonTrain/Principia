- id: p1
  tier: easy
  statement: |
    质量$1000\,\mathrm{kg}$的汽车以$10\,\mathrm{m/s}$的速率通过拱形桥的桥顶，桥顶附近的路面可以看成半径$40\,\mathrm m$的圆弧。这时桥面对汽车的支持力是多少？$g$取$9.8\,\mathrm{m/s^2}$，以$\mathrm N$为单位。
  answer:
    type: number
    value: 1000*(9.8 - 10^2/40)
    unit: |
      $\mathrm N$
  hints:
    - |
      在桥顶，圆心在汽车的正下方，向心力竖直向下。
    - |
      汽车受重力和支持力，向下为正：$mg-N=\frac{mv^2}R$。
    - |
      $N=1000\times(9.8-2.5)=7300\,\mathrm N$。
  solution: |
    在桥顶，圆心在正下方。汽车受竖直向下的重力和竖直向上的支持力，指向圆心（向下）的合力等于向心力：$mg-N=\frac{mv^2}R$，$N=1000\times\bigl(9.8-\frac{10^2}{40}\bigr)=7300\,\mathrm N$，比重力$9800\,\mathrm N$小。速度再大，支持力会减到零，汽车就要离开桥面了。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        做匀速圆周运动的物体，受到的合力大小不变、方向时刻在变
      - |
        用绳子拴着小球在竖直平面内转圈，小球到最高点时，受到的合力一定竖直向下
      - |
        用绳子拴着小球在光滑水平桌面上转圈，绳子突然断了，小球会沿半径方向飞出去
      - |
        汽车在水平路面上以一定速率转弯，转弯半径越小，需要的向心力越小
      - |
        在倾斜的弯道上以设计速率转弯时，路面对汽车的支持力大于汽车的重力
    value: [1, 2, 5]
  hints:
    - |
      向心力的大小$\frac{mv^2}r$，方向总指向圆心。
    - |
      最高点时重力和绳子的拉力都朝哪边？绳子断了以后，小球还受不受水平方向的力？
    - |
      A、B、E 对；C、D 错。
  solution: |
    A 对：合力就是向心力，大小$\frac{mv^2}r$不变，方向跟着物体转。B 对：在最高点，重力向下，绳子拉力也沿绳指向下方的圆心（或者恰好为零），合力竖直向下。C 错：绳子断后小球在水平方向不受力，沿断开时的速度方向，也就是切线方向，做匀速直线运动。

    D 错：$\frac{mv^2}r$，半径越小，需要的向心力越大，所以急弯要慢开。E 对：竖直方向$N\cos\theta=mg$，$N=\frac{mg}{\cos\theta}>mg$。

- id: p3
  tier: medium
  statement: |
    长$0.50\,\mathrm m$的细绳上端固定，下端拴一个小球，让小球在水平面内以$6.0\,\mathrm{rad/s}$的角速度做匀速圆周运动。绳子和竖直方向的夹角是多少？$g$取$9.8\,\mathrm{m/s^2}$，以度为单位，保留三位有效数字。
  answer:
    type: number
    value: acos(9.8/(6^2*0.5))*180/pi
    unit: |
      $^\circ$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      圆心在悬点正下方，半径是$L\sin\theta$；竖直方向合力为零，水平方向的合力是向心力。
    - |
      $T\cos\theta=mg$，$T\sin\theta=m\omega^2L\sin\theta$，所以$\cos\theta=\frac g{\omega^2L}$。
    - |
      $\cos\theta=\frac{9.8}{36\times0.50}\approx0.544$，$\theta\approx57.0^\circ$。
  solution: |
    竖直方向$T\cos\theta=mg$；水平方向拉力的分量提供向心力，$T\sin\theta=m\omega^2L\sin\theta$，所以$T=m\omega^2L$，$\cos\theta=\frac g{\omega^2L}=\frac{9.8}{18}\approx0.544$，$\theta\approx57.0^\circ$。角速度小于$\sqrt{\frac gL}\approx4.4\,\mathrm{rad/s}$时，这个式子给不出解，小球只能在悬点正下方静止或摆动，绕不起圈来。

- id: p4
  tier: medium
  statement: |
    过山车沿半径$10\,\mathrm m$的竖直圆形轨道内侧运动。车到最高点时，乘客对座椅恰好没有压力，这时车的速率是多少？$g$取$9.8\,\mathrm{m/s^2}$，以$\mathrm{m/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: sqrt(9.8*10)
    unit: |
      $\mathrm{m/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      在最高点，圆心在乘客的正下方；乘客对座椅没有压力，座椅对乘客也就没有支持力。
    - |
      这时乘客只受重力，它就是向心力：$mg=\frac{mv^2}R$。
    - |
      $v=\sqrt{gR}=\sqrt{98}\approx9.90\,\mathrm{m/s}$。
  solution: |
    乘客对座椅没有压力，由牛顿第三定律，座椅对乘客的支持力也是零，乘客只受重力。在最高点，重力竖直向下，正好指向圆心，就是向心力：$mg=\frac{mv^2}R$，$v=\sqrt{gR}=\sqrt{98}\approx9.90\,\mathrm{m/s}$。速度比这小，重力比需要的向心力大，乘客会离开圆轨道往下掉，所以座椅上要有安全杠。

- id: p5
  tier: hard
  statement: |
    半径为$R$的光滑半球形碗开口向上固定，一个小球贴着碗的内壁，在离碗底高$h$（$0<h<R$）的水平面内做匀速圆周运动。

    （1）证明角速度$\omega$满足$\omega^2=\frac g{R-h}$。（2）$\omega$越大，小球的位置越高还是越低？（3）为什么$\omega$小于$\sqrt{\frac gR}$时，小球不能在任何高度上这样转圈？
  hints:
    - |
      碗壁光滑，支持力沿半径指向球心；小球的圆心在球心正下方$R-h$处的竖直轴上。
    - |
      设支持力和竖直方向成$\alpha$，$\cos\alpha=\frac{R-h}R$，圆周半径$r=R\sin\alpha$。
    - |
      竖直方向$N\cos\alpha=mg$，水平方向$N\sin\alpha=m\omega^2R\sin\alpha$。
  reference: |
    （1）支持力垂直于碗壁，沿半径指向球心$O$。设它和竖直方向成$\alpha$，则$\cos\alpha=\frac{R-h}R$，小球的圆周半径$r=R\sin\alpha$，圆心在$O$的正下方。竖直方向没有加速度：$N\cos\alpha=mg$；水平方向支持力的分量是向心力：$N\sin\alpha=m\omega^2R\sin\alpha$，所以$N=m\omega^2R$。代入第一式：$\omega^2R\cdot\frac{R-h}R=g$，$\omega^2=\frac g{R-h}$。

    （2）$R-h=\frac g{\omega^2}$，$\omega$越大，$R-h$越小，$h$越大，小球越高。

    （3）$0<h<R$要求$R-h<R$，也就是$\omega^2>\frac gR$。$\omega$不够大时，支持力的竖直分量和水平分量配不上，小球只能滑到碗底，在那里静止或来回滚动。

- id: p6
  tier: hard
  statement: |
    光滑水平桌面上，一根轻绳的一端固定在竖直轴$O$上，绳上依次拴着两个小球：质量$m_1$的小球离轴$r_1$，质量$m_2$的小球离轴$r_2$（$r_2>r_1$）。两个小球连同绳子一起以角速度$\omega$绕轴匀速转动，绳子沿半径拉直。

    （1）求两段绳子中的拉力。（2）哪一段绳子更容易被拉断？（3）把绳上的小球换成$n$个质量都是$m$的小球，离轴依次为$d,2d,\dots,nd$，求第$k$个小球内侧那一段绳子的拉力。
  hints:
    - |
      两个小球的角速度相同，各自需要的向心力是$m\omega^2r$。
    - |
      外面的小球只受外段绳子的拉力；里面的小球受内段绳子向内的拉力和外段绳子向外的拉力。
    - |
      （3）里把第$k$个到第$n$个小球连同它们之间的绳子看成一个整体，它只受第$k$个小球内侧那段绳子的拉力。
  reference: |
    （1）外面的小球只受外段绳子指向轴的拉力$T_2$：$T_2=m_2\omega^2r_2$。里面的小球受内段绳子向内的拉力$T_1$和外段绳子向外的拉力$T_2$：$T_1-T_2=m_1\omega^2r_1$，所以$T_1=\omega^2(m_1r_1+m_2r_2)$。

    （2）$T_1>T_2$，靠轴的那一段拉力大，更容易断。

    （3）把第$k$个到第$n$个小球看成一个整体，它们之间的绳子拉力成对抵消，整体在水平方向只受第$k$个小球内侧那段绳子的拉力$T_k$。每个小球需要的向心力是$m\omega^2jd$，所以$T_k=m\omega^2d\,(k+(k+1)+\dots+n)=\frac{m\omega^2d}2\,(n-k+1)(n+k)$。$k=1$时最大，是$\frac{n(n+1)}2m\omega^2d$；$k=n$时最小，是$nm\omega^2d$。小球越多越密，就越像一根均匀的细杆，杆里的拉力同样是靠轴处最大、外端最小：越靠近轴，要拉住的东西越多。

- id: p7
  tier: thinking
  statement: |
    转动雨伞时，伞边上的水滴会被甩出去。

    （1）水滴离开伞边以后，沿什么方向运动？在地面上的人看来，有没有一个「离心力」把它推出去？

    （2）水滴为什么在某个时候离开伞？伞对它的作用起了什么变化？（3）转得越快，水滴越容易甩掉，用向心力说明。
  hints:
    - |
      离开伞的那一刻，水滴的速度沿什么方向？离开后它受哪些力？
    - |
      水滴靠附着在伞面上的作用跟着伞转，这种作用有一个最大值。
    - |
      需要的向心力$m\omega^2r$随角速度增大。
  reference: |
    （1）离开伞的那一刻水滴的速度沿伞边的切线方向，此后只受重力（空气的影响忽略），从上往下看沿切线飞出，同时往下落。在地面这个惯性系里没有任何力把它往外推，它只是没有了指向圆心的力，按惯性沿切线走。

    （2）水滴要跟着伞转，就需要一个大小为$m\omega^2r$、指向圆心的合力，这由伞面对它的附着作用提供。这种作用有一个最大值，需要的向心力超过它时，伞就「拉不住」水滴，水滴离开圆周。

    （3）$m\omega^2r$随$\omega$的平方增大，转得越快，需要的向心力越大，越早超过附着作用能提供的最大值，水滴越容易甩掉。洗衣机甩干、离心机分离，都是这个道理。

- id: p8
  tier: thinking
  statement: |
    公路弯道的外侧都修得比内侧高一些，赛车场弯道的倾角更大。

    （1）倾角越大，设计速率（不靠摩擦就能转弯的速率）越大还是越小？为什么赛车场要修得更陡？

    （2）车速比设计速率低时，汽车会怎样？靠什么才不会往下滑？（3）同一个弯道，载重不同的卡车设计速率一样吗？
  hints:
    - |
      用例 2 的结果$v^2=gR\tan\theta$。
    - |
      速度低时，支持力的水平分量比需要的向心力大。
    - |
      设计速率的式子里有没有质量？
  reference: |
    （1）$v^2=gR\tan\theta$，倾角越大，设计速率越大。赛车的速度快，弯道的倾角就要大，才能在不太依赖轮胎摩擦的情况下高速转弯。

    （2）速度低时，需要的向心力$\frac{mv^2}R$比支持力的水平分量$mg\tan\theta$小，合力把汽车往弯道内侧、也就是斜面下方拉，汽车有往下滑的趋势，要靠路面的摩擦才能稳住；路面结冰时，慢车反而会滑向内侧。

    （3）一样。$v^2=gR\tan\theta$里没有质量，因为重力、支持力和需要的向心力都和质量成正比，质量约掉了。
