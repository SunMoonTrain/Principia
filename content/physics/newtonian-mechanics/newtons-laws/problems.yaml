- id: p1
  tier: easy
  statement: |
    在一个惯性系里，质量$1.5\,\mathrm{kg}$的质点只受两个力：$3.0\,\mathrm N$指向正东，$4.0\,\mathrm N$指向正北。它的加速度有多大？以$\mathrm{m/s^2}$为单位，保留三位有效数字。
  answer:
    type: number
    value: sqrt(3^2 + 4^2)/1.5
    unit: |
      $\mathrm{m/s^2}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      先把两个力按矢量相加，得到合力。
    - |
      两个力互相垂直，合力大小$\sqrt{3.0^2+4.0^2}=5.0\,\mathrm N$。
    - |
      $a=\frac{5.0}{1.5}\approx3.33\,\mathrm{m/s^2}$，方向和合力相同。
  solution: |
    合力是两个力的矢量和，大小$\sqrt{3.0^2+4.0^2}=5.0\,\mathrm N$，方向北偏东约$37^\circ$。由牛顿第二定律，$a=\frac Fm=\frac{5.0}{1.5}\approx3.33\,\mathrm{m/s^2}$，方向和合力相同。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        相对一个惯性系做匀加速直线运动的参考系，也是惯性系
      - |
        物体的速度为零时，它受到的合力一定为零
      - |
        同样大小的合力作用在质量不同的两个物体上，质量大的那个加速度小
      - |
        马拉车加速前进时，马拉车的力大于车拉马的力
      - |
        在惯性系里做匀速圆周运动的质点，受到的合力不为零
    value: [3, 5]
  hints:
    - |
      惯性系之间的相对运动只能是匀速直线运动；合力决定的是加速度。
    - |
      马和车之间的一对力服从牛顿第三定律；匀速圆周运动有向心加速度。
    - |
      C、E 对；A、B、D 错。
  solution: |
    A 错：两个参考系相对加速时，同一个质点的加速度在两边不同，不受作用的质点在后一个参考系里会加速。B 错：合力决定加速度，速度为零时加速度可以不为零，例如刚开始被推动的那一刻。C 对：$a=\frac Fm$。

    D 错：马拉车的力和车拉马的力是一对作用力和反作用力，大小总相等；车能加速，是因为车受到的合力向前。E 对：匀速圆周运动有指向圆心的向心加速度，合力等于质量乘以它，不为零。

- id: p3
  tier: medium
  statement: |
    在光滑的水平轨道上，用同一根压缩的弹簧依次推开两对小车。推开 A、B 时，A 的加速度大小是$1.8\,\mathrm{m/s^2}$，B 的是$0.60\,\mathrm{m/s^2}$；推开 B、C 时，B 的加速度大小是$1.2\,\mathrm{m/s^2}$，C 的是$0.80\,\mathrm{m/s^2}$。A 的质量是$0.50\,\mathrm{kg}$，C 的质量是多少？以$\mathrm{kg}$为单位。
  answer:
    type: number
    value: 0.5*(1.8/0.6)*(1.2/0.8)
    unit: |
      $\mathrm{kg}$
  hints:
    - |
      两个质点只相互作用时，质量之比等于加速度大小的反比。
    - |
      先由第一次求出 B 的质量：$m_B=m_A\frac{a_A}{a_B}$。
    - |
      $m_B=0.50\times3=1.5\,\mathrm{kg}$，$m_C=m_B\times\frac{1.2}{0.80}=2.25\,\mathrm{kg}$。
  solution: |
    按质量的定义，$\frac{m_B}{m_A}=\frac{a_A}{a_B}=\frac{1.8}{0.60}=3$，$m_B=1.5\,\mathrm{kg}$。再由第二次，$\frac{m_C}{m_B}=\frac{1.2}{0.80}=1.5$，$m_C=2.25\,\mathrm{kg}$。两次推开时弹簧压缩得不一样也没关系，比值只和两辆车有关。

- id: p4
  tier: medium
  statement: |
    在一个惯性系里，质量$0.50\,\mathrm{kg}$的质点从原点出发，初速度$2.0\,\mathrm{m/s}$沿$x$轴正方向；从$t=0$起它只受沿$x$轴的力$F=-1.2t$（$F$以$\mathrm N$计，$t$以$\mathrm s$计）。质点掉头时离原点多远？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: 4/3*sqrt(5/3)
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      运动方程是$0.50\frac{\dd^2x}{\dd t^2}=-1.2t$，按初始条件求两次原函数。
    - |
      $v=2.0-1.2t^2$，掉头时$v=0$，$t^2=\frac53$。
    - |
      $x=2.0t-0.4t^3$，代入$t=\sqrt{5/3}$得$x=\frac43\sqrt{\frac53}\approx1.72\,\mathrm m$。
  solution: |
    加速度$a=\frac Fm=-2.4t$。由$v(0)=2.0$，$v=2.0-1.2t^2$；由$x(0)=0$，$x=2.0t-0.4t^3$。掉头时$v=0$，$t=\sqrt{5/3}\approx1.29\,\mathrm s$，这时$x=t(2.0-0.4t^2)=\frac43\sqrt{\frac53}\approx1.72\,\mathrm m$。

- id: p5
  tier: hard
  statement: |
    在一个惯性系里，两个质点只相互作用，质量分别为$m_1$、$m_2$。

    （1）用牛顿第二、第三定律证明$m_1\vb v_1+m_2\vb v_2$不随时间变化。（2）证明点$\vb R=\frac{m_1\vb r_1+m_2\vb r_2}{m_1+m_2}$做匀速直线运动。（3）换到相对这个惯性系以$\vb u$匀速运动的参考系，（1）（2）的结论还成立吗？$m_1\vb v_1+m_2\vb v_2$的值变了多少？
  hints:
    - |
      对$m_1\vb v_1+m_2\vb v_2$求导，每一项用第二定律换成力。
    - |
      $\vb R$的导数就是$\frac{m_1\vb v_1+m_2\vb v_2}{m_1+m_2}$。
    - |
      用伽利略变换$\vb v'=\vb v-\vb u$代进去。
  reference: |
    （1）$\dv{}t(m_1\vb v_1+m_2\vb v_2)=m_1\vb a_1+m_2\vb a_2=\vb F_{2\text{对}1}+\vb F_{1\text{对}2}$，由第三定律这两个力之和为零，所以$m_1\vb v_1+m_2\vb v_2$不变。

    （2）$\dv{\vb R}t=\frac{m_1\vb v_1+m_2\vb v_2}{m_1+m_2}$是常矢量，$\vb R$做匀速直线运动（或静止）。不管两个质点之间的力多复杂，这个加权平均的位置都像不受作用的质点一样运动。

    （3）新参考系也是惯性系，第二、第三定律照样成立，结论不变。$m_1\vb v_1'+m_2\vb v_2'=m_1\vb v_1+m_2\vb v_2-(m_1+m_2)\vb u$，值变了$(m_1+m_2)\vb u$，但在新参考系里同样不随时间变化。取$\vb u=\dv{\vb R}t$，这个和就是零，$\vb R$在那个参考系里静止。

- id: p6
  tier: hard
  statement: |
    光滑水平面上有$n$个木块排成一行，彼此靠紧，质量从左到右是$m_1,m_2,\dots,m_n$。用水平力$F$从左边推第一个木块，只看水平方向。

    （1）求第$k$个和第$k+1$个木块之间的作用力。（2）改从右边以同样大小的力推第$n$个木块，这个作用力变成多少？两种推法下的这两个力之和是多少？（3）所有木块质量相同时，哪两个木块之间的力最大？
  hints:
    - |
      所有木块一起加速，加速度都是$\frac F{M}$，$M=m_1+\dots+m_n$。
    - |
      把第$k+1$个到第$n$个木块看成一个整体，它在水平方向只受第$k$个木块的推力。
    - |
      从右边推时，把第$1$个到第$k$个木块看成整体。
  reference: |
    （1）所有木块的加速度相同，$a=\frac FM$，$M=\sum_{i=1}^nm_i$。把第$k+1$个到第$n$个木块看成一个整体，它们之间的推力成对抵消，水平方向只剩第$k$个木块的推力$N_k$，所以$N_k=(m_{k+1}+\dots+m_n)a=F\frac{m_{k+1}+\dots+m_n}M$。

    （2）从右边推时，第$1$个到第$k$个木块合起来只受第$k+1$个木块的推力$N_k'$，$N_k'=F\frac{m_1+\dots+m_k}M$。两者之和$N_k+N_k'=F$。

    （3）质量都相同时$N_k=F\frac{n-k}n$，$k=1$时最大，是$F\frac{n-1}n$：越靠近推的一端，木块之间的力越大，因为它要带动后面越多的木块。

- id: p7
  tier: thinking
  statement: |
    有人说：「这一节用$\vb F=m\vb a$定义力，第二定律$m\vb a=\vb F$岂不成了同义反复？」

    （1）这个说法哪里不对？第二定律到底说了哪些可以用实验检验的事？（2）如果有一天发现，同一根拉长同样长度的弹簧，拉铁块和拉木块时$m\vb a$不一样，牛顿力学会出什么问题？（3）第三定律在这套说法里起什么作用？
  hints:
    - |
      回想讲解里说的第二定律的「实质内容」。
    - |
      力能不能只由施力的那一方算出来，是关键。
    - |
      质量是用两个质点相互作用时的加速度比定义的。
  reference: |
    （1）定义只说了怎样从一个作用产生的加速度量出它的力。第二定律另外断言了两件可以检验的事：同一个施力者在同一状态下，对不同物体的$m\vb a$相同，所以力可以只由施力的那一方算出来，写成「力的规律」；几个作用同时存在时，加速度由各个力的矢量和决定。这两点都可能被实验推翻，所以不是同义反复。

    （2）那样「弹簧的力」就不再只由弹簧决定，还和被拉的物体有关，就没法先写出力的规律、再去算运动，运动方程失去了意义。实验至今支持第二定律，这种情形没有出现。

    （3）质量的定义要求两个只相互作用的质点加速度之比和作用方式无关，这正是第三定律$m_1\vb a_1=-m_2\vb a_2$的内容。第三定律保证了质量是物体自己的属性，也让「整体只受外力」（例 2）这样的推理成立。

- id: p8
  tier: thinking
  statement: |
    公交车突然起动时，车里没扶好的乘客会向后倒。

    （1）站在路边的人怎样用牛顿第一定律解释这件事？（2）车里的人觉得自己「被一个力推向后方」，可他找不到推他的物体。这说明了什么？（3）如果车里的人坚持用牛顿定律分析车厢里的运动，他需要怎么办？
  hints:
    - |
      以地面为参考系，乘客起动前的速度是多少？他的脚和身体各受到了什么作用？
    - |
      加速的车厢是不是惯性系？
    - |
      在这个车厢里，不受作用的物体会怎样运动？
  reference: |
    （1）以地面这个近似的惯性系来看，乘客原来静止，车起动时，地板通过脚把他的下半身带着向前加速，上半身没有受到向前的作用，由于惯性保持原来的静止，于是相对车厢向后倒。

    （2）车厢在加速，不是惯性系。在这个参考系里，物体相对车厢的加速度不全来自别的物体的作用，所以会出现「找不到施力者的力」：这正是牛顿定律只在惯性系里成立的表现。

    （3）他可以换到地面这个惯性系里分析；或者在车厢里给每个物体额外加上一个和车厢加速度方向相反、大小等于质量乘车厢加速度的「力」，再照牛顿定律算。后一种办法要到[平动加速参考系与惯性力](lesson:physics.newtonian-mechanics.accelerating-frames)才说清楚。
