- id: p1
  tier: easy
  statement: |
    月球的质量是$7.35\times10^{22}\,\mathrm{kg}$，半径是$1.74\times10^6\,\mathrm m$，引力常量取$6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$。不计月球的自转，月球表面的重力加速度是多少？以$\mathrm{m/s^2}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 6.67e-11*7.35e22/(1.74e6)^2
    unit: |
      $\mathrm{m/s^2}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      把月球当作质量集中在球心的质点，月面上的物体受的重力就是月球对它的引力。
    - |
      $mg_{\text{月}}=\frac{GMm}{R^2}$，约去$m$。
    - |
      $g_{\text{月}}=\frac{6.67\times10^{-11}\times7.35\times10^{22}}{(1.74\times10^6)^2}\approx1.62\,\mathrm{m/s^2}$。
  solution: |
    月面上的物体受的重力就是月球对它的引力，$mg_{\text{月}}=\frac{GMm}{R^2}$，所以$g_{\text{月}}=\frac{GM}{R^2}=\frac{6.67\times10^{-11}\times7.35\times10^{22}}{(1.74\times10^6)^2}\approx1.62\,\mathrm{m/s^2}$，约为地面上的$\frac16$。

- id: p2
  tier: easy
  statement: |
    几颗人造卫星都绕地球做匀速圆周运动，下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        轨道半径之比为$4:1$的两颗卫星，速率之比是$1:2$
      - |
        在同一条轨道上，质量大的卫星需要的速率大
      - |
        轨道半径之比为$4:1$的两颗卫星，周期之比是$8:1$
      - |
        卫星离地面越高，地球对它的引力越大
      - |
        同一颗卫星，轨道半径变为原来的$2$倍，地球对它的引力变为原来的$\frac14$
    value: [1, 3, 5]
  hints:
    - |
      圆轨道的速率是$\sqrt{\frac{GM}r}$，周期是$2\pi\sqrt{\frac{r^3}{GM}}$，里面都没有卫星的质量。
    - |
      引力是$\frac{GMm}{r^2}$，$r$是卫星到地心的距离。
    - |
      A、C、E 对；B、D 错。
  solution: |
    A 对：$v\propto\frac1{\sqrt r}$，半径之比$4:1$，速率之比$1:2$。B 错：$v=\sqrt{\frac{GM}r}$和卫星的质量无关。C 对：$T\propto r^{3/2}$，$4^{3/2}=8$。

    D 错：引力$\frac{GMm}{r^2}$随距离增大而减小。E 对：$r$变成$2r$，$\frac1{r^2}$变成原来的$\frac14$。

- id: p3
  tier: medium
  statement: |
    离地面多高的地方，重力加速度减为地面上的一半？地球半径取$6.37\times10^6\,\mathrm m$，不计地球的自转。以$\mathrm{km}$为单位，保留三位有效数字。
  answer:
    type: number
    value: (sqrt(2) - 1)*6370
    unit: |
      $\mathrm{km}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      高$h$处的重力加速度是$\frac{GM}{(R+h)^2}$，地面上是$\frac{GM}{R^2}$。
    - |
      两者之比$\frac{R^2}{(R+h)^2}=\frac12$，所以$R+h=\sqrt2R$。
    - |
      $h=(\sqrt2-1)R\approx0.414\times6370\,\mathrm{km}\approx2.64\times10^3\,\mathrm{km}$。
  solution: |
    高$h$处的重力加速度和地面上的之比是$\frac{GM/(R+h)^2}{GM/R^2}=\frac{R^2}{(R+h)^2}$。令它等于$\frac12$，$R+h=\sqrt2R$，$h=(\sqrt2-1)R\approx0.414\times6370\,\mathrm{km}\approx2.64\times10^3\,\mathrm{km}$，比地球半径的一半还少一些。

- id: p4
  tier: medium
  statement: |
    火星的卫星火卫一（Phobos）绕火星的轨道近似是圆，半径是$9.38\times10^6\,\mathrm m$，周期是$7.65\,\mathrm h$。引力常量取$6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$，求火星的质量。以$\mathrm{kg}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 4*pi^2*(9.38e6)^3/(6.67e-11*(7.65*3600)^2)
    unit: |
      $\mathrm{kg}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      火卫一绕火星做匀速圆周运动，火星对它的引力就是向心力；火卫一的质量会约掉。
    - |
      由$T=2\pi\sqrt{\frac{r^3}{GM}}$，$M=\frac{4\pi^2r^3}{GT^2}$；周期先换成秒。
    - |
      $M=\frac{4\pi^2\times(9.38\times10^6)^3}{6.67\times10^{-11}\times27540^2}\approx6.44\times10^{23}\,\mathrm{kg}$。
  solution: |
    火星对火卫一的引力提供向心力，由圆轨道的周期$T=2\pi\sqrt{\frac{r^3}{GM}}$，$M=\frac{4\pi^2r^3}{GT^2}$。$T=7.65\times3600\,\mathrm s=27540\,\mathrm s$，代入得$M=\frac{4\pi^2\times(9.38\times10^6)^3}{6.67\times10^{-11}\times27540^2}\approx6.44\times10^{23}\,\mathrm{kg}$，约为地球质量的十分之一。绕一个天体转的卫星，只要量出轨道半径和周期，就能求出这个天体的质量。

- id: p5
  tier: hard
  statement: |
    把天体当作质量集中在球心的质点，引力常量取$6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$。

    （1）地球的自转要快到一天多长，赤道上的物体才对地面没有压力？$g$取$9.8\,\mathrm{m/s^2}$，地球半径取$6.37\times10^6\,\mathrm m$。

    （2）把（1）的答案和贴着地面运行的卫星的周期比较，说明为什么。

    （3）一颗中子星（neutron star）的质量是$2.8\times10^{30}\,\mathrm{kg}$，半径是$10\,\mathrm{km}$，每秒自转$716$圈。它赤道上的物质会不会被甩出去？
  hints:
    - |
      赤道上的物体随地球做匀速圆周运动；对地面没有压力时，引力就是它需要的全部向心力。
    - |
      $\frac{GMm}{R^2}=m\omega^2R$，地面附近$\frac{GM}{R^2}=g$。
    - |
      中子星赤道上的物质能被留住的条件是$\omega^2R\le\frac{GM}{R^2}$，即自转一周的时间不短于$2\pi\sqrt{\frac{R^3}{GM}}$。
  reference: |
    （1）赤道上的物体随地球自转，做半径$R$的匀速圆周运动。对地面没有压力时，只有引力提供向心力：$\frac{GMm}{R^2}=m\omega^2R$，即$mg=m\omega^2R$，$\omega=\sqrt{\frac gR}$。一天$T=2\pi\sqrt{\frac Rg}=2\pi\sqrt{\frac{6.37\times10^6}{9.8}}\approx5.07\times10^3\,\mathrm s$，约$84$分钟。

    （2）贴着地面运行的卫星的周期$\frac{2\pi R}{v_1}=2\pi\sqrt{\frac Rg}$，和（1）的答案相同。两者都是在半径$R$的圆上运动、只靠引力提供向心力，所需的角速度一样。这时赤道上的物体就像一颗贴着地面的卫星。

    （3）物质能被留住，要求引力不小于所需的向心力，$\frac{GMm}{R^2}\ge m\omega^2R$，即周期不短于$2\pi\sqrt{\frac{R^3}{GM}}=2\pi\sqrt{\frac{(1.0\times10^4)^3}{6.67\times10^{-11}\times2.8\times10^{30}}}\approx4.6\times10^{-4}\,\mathrm s$，也就是每秒不超过约$2.2\times10^3$圈。$716$圈比这少得多，不会被甩出去：赤道上需要的向心加速度$(2\pi\times716)^2\times10^4\approx2.0\times10^{11}\,\mathrm{m/s^2}$，引力能给的是$\frac{GM}{R^2}\approx1.9\times10^{12}\,\mathrm{m/s^2}$，约为它的$9$倍。

- id: p6
  tier: hard
  statement: |
    地球同步卫星的轨道半径取例 1 的结果$4.22\times10^7\,\mathrm m$，地球当作半径$6.37\times10^6\,\mathrm m$的球。

    （1）从一颗同步卫星上，能看到赤道上经度相差多少度的一段？

    （2）要让赤道上的每一点都至少能看到一颗同步卫星，至少要几颗？

    （3）从同步卫星上能看到的地方，纬度最高是多少？
  hints:
    - |
      卫星看到的范围以从卫星引出的、和地球相切的直线为边界，切点处的半径和切线垂直。
    - |
      设切点和卫星对地心张开的角为$\alpha$，$\cos\alpha=\frac Rr$。
    - |
      $\alpha\approx81.3^\circ$；在卫星所在的那条经线上，最远能看到纬度$\alpha$处。
  reference: |
    （1）在赤道平面里，从卫星引出和地球相切的两条直线，切点处的半径垂直于切线。设切点和卫星对地心张开的角为$\alpha$，直角三角形里$\cos\alpha=\frac Rr=\frac{6.37\times10^6}{4.22\times10^7}\approx0.151$，$\alpha\approx81.3^\circ$。卫星能看到赤道上卫星正下方两侧各$81.3^\circ$的一段，经度共相差约$163^\circ$。

    （2）$\frac{360^\circ}{163^\circ}\approx2.2$，两颗不够，至少要$3$颗。例如三颗卫星相隔$120^\circ$，相邻两颗看到的范围有重叠。

    （3）同样的道理用在过卫星和地心的经线平面里：沿卫星正下方的经线，最远能看到离赤道$81.3^\circ$的地方，即纬度约$81^\circ$。纬度更高的极地看不到同步卫星，要用别的轨道上的卫星通信。

- id: p7
  tier: thinking
  statement: |
    太阳的质量约是地球的$3.33\times10^5$倍，太阳到月球的距离约是地球到月球的$390$倍。

    （1）太阳和地球，谁对月球的引力大？

    （2）既然这样，月球为什么没有被太阳拉走，而是一直绕着地球转？

    （3）在太阳看来，月球的轨迹会不会绕出一个个小圈？
  hints:
    - |
      引力和质量成正比、和距离的平方成反比，把两个比值合起来。
    - |
      太阳也拉着地球；地球和月球到太阳的距离差不多，太阳给它们的加速度差不多。
    - |
      月球受的合力总是大致指向哪里？轨迹总向合力的那一侧弯。
  reference: |
    （1）$\frac{F_{\text{日}}}{F_{\text{地}}}=3.33\times10^5\times\frac1{390^2}\approx2.2$，太阳对月球的引力约是地球的两倍。

    （2）太阳同样拉着地球。引力产生的加速度$\frac{GM_{\text{日}}}{r^2}$和被拉的物体的质量无关，地球和月球到太阳的距离只相差约$\frac1{390}$，太阳给两者的加速度几乎一样，它们一起绕太阳转。太阳的作用在两者之间差不多抵消了，决定月球相对地球怎样运动的，是地球的引力。

    （3）不会。月球受的合力里太阳的引力占大头，合力总是大致指向太阳，所以月球的轨迹总向太阳那一侧弯，只是弯得时快时慢，看起来像一条略有起伏的大圆，而不是一串小圈。

- id: p8
  tier: thinking
  statement: |
    假如地球的质量不变，半径缩小到原来的一半。

    （1）地面上的重力加速度变成原来的几倍？

    （2）第一宇宙速度变成原来的几倍？

    （3）月球绕地球的轨道会不会变？地球绕太阳的轨道呢？
  hints:
    - |
      $g=\frac{GM}{R^2}$，$v_1=\sqrt{\frac{GM}R}$。
    - |
      地面变了，可地心和地球的质量没变。
    - |
      月球在地球外面，它受的引力只取决于地球的质量和它到地心的距离。
  reference: |
    （1）$g=\frac{GM}{R^2}$，$R$减半，$g$变成原来的$4$倍。

    （2）$v_1=\sqrt{\frac{GM}R}$，变成原来的$\sqrt2$倍，约$11\,\mathrm{km/s}$：贴着变小的地面转，离地心更近，需要更快。

    （3）都不会变。月球一直在地球外面，地球对它的引力只取决于地球的质量和地心到月球的距离，两者都没变；地球绕太阳的轨道由太阳的质量和日地距离决定，和地球有多大无关。
