- id: p1
  tier: easy
  statement: |
    把地球当作半径$6.37\times10^6\,\mathrm m$的均匀球体，不计地球的自转。地下多深处的重力加速度是地面上的一半？以$\mathrm{km}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 6370/2
    unit: |
      $\mathrm{km}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      地下离地心$r$处，只有半径$r$以内的那部分球体起作用。
    - |
      均匀球体内的引力和$r$成正比，$g(r)=g\frac rR$。
    - |
      $r=\frac R2$，深度是$\frac R2\approx3.19\times10^3\,\mathrm{km}$。
  solution: |
    均匀球体内离球心$r$处，引力是$\frac{GMmr}{R^3}$，重力加速度$g(r)=\frac{GMr}{R^3}=g\frac rR$。要$g(r)=\frac g2$，$r=\frac R2$，深度$R-\frac R2=\frac R2\approx3.19\times10^3\,\mathrm{km}$。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        在均匀球壳里面移动质点，球壳的引力对它不做功
      - |
        两个质量相同的均匀球体，半径大的那个对它外面离球心$r$处的质点引力大
      - |
        均匀球壳外面，离球心越远，质点的引力势能越小
      - |
        均匀球体内部，离球心越近，质点受的引力越小
      - |
        两个均匀球体之间的引力，可以按两个球心之间的距离用万有引力定律算
    value: [1, 4, 5]
  hints:
    - |
      球壳里面引力为零；球壳外面的引力势能是$-\frac{GMm}r$。
    - |
      球体外面的引力只看质量和到球心的距离，和半径无关。
    - |
      A、D、E 对；B、C 错。E 要用两次球壳定理，再用一次牛顿第三定律。
  solution: |
    A 对：球壳里面引力为零，不做功。B 错：质点在两个球外面时，引力都是$\frac{GMm}{r^2}$，和半径无关。C 错：$-\frac{GMm}r$随$r$增大而增大，越远越大。

    D 对：均匀球体内的引力$\frac{GMmr}{R^3}$和$r$成正比。E 对：球 1 对球 2 的每一小块，都如同质量集中在球心 1；把这些力加起来，就是一个放在球心 1、质量为$M_1$的质点受球 2 的引力的反作用力，而球 2 对这个质点又如同质量集中在球心 2，所以引力是$\frac{GM_1M_2}{d^2}$，$d$是球心距。

- id: p3
  tier: medium
  statement: |
    一颗小行星是半径$10\,\mathrm{km}$、密度$2.0\times10^3\,\mathrm{kg/m^3}$的均匀球体，引力常量取$6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$。它表面的重力加速度是多少？以$\mathrm{m/s^2}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 4/3*pi*6.67e-11*2.0e3*1.0e4
    unit: |
      $\mathrm{m/s^2}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      对表面上的质点，均匀球体如同质量集中在球心。
    - |
      $M=\frac43\pi R^3\rho$，$g=\frac{GM}{R^2}=\frac43\pi G\rho R$。
    - |
      $g=\frac43\pi\times6.67\times10^{-11}\times2.0\times10^3\times1.0\times10^4\approx5.59\times10^{-3}\,\mathrm{m/s^2}$。
  solution: |
    小行星的质量$M=\frac43\pi R^3\rho$。表面上的质点在球外，引力如同质量集中在球心，$g=\frac{GM}{R^2}=\frac43\pi G\rho R$。代入数值，$g=\frac43\pi\times6.67\times10^{-11}\times2.0\times10^3\times1.0\times10^4\approx5.59\times10^{-3}\,\mathrm{m/s^2}$，不到地面上的千分之一。密度相同时，$g$和半径成正比。

- id: p4
  tier: medium
  statement: |
    地核的半径约是$3.48\times10^6\,\mathrm m$，质量约是$1.94\times10^{24}\,\mathrm{kg}$；地球的半径取$6.37\times10^6\,\mathrm m$，质量取$5.97\times10^{24}\,\mathrm{kg}$。把地核和地球都当作密度只随到地心的距离变化的球，不计地球的自转。地核表面的重力加速度是地面上的多少倍？保留三位有效数字。
  answer:
    type: number
    value: (1.94e24/5.97e24)/(3.48e6/6.37e6)^2
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      地核表面以外的那部分地球，对地核表面上的质点没有引力。
    - |
      地核表面上$g_{\text{核}}=\frac{GM_{\text{核}}}{r_{\text{核}}^2}$，地面上$g=\frac{GM}{R^2}$。
    - |
      比值$\frac{1.94}{5.97}\times\Bigl(\frac{6.37}{3.48}\Bigr)^2\approx1.09$。
  solution: |
    地核以外的部分由许多同心球壳组成，对地核表面上的质点都没有引力；地核对它如同质量集中在地心。所以$\frac{g_{\text{核}}}{g}=\frac{M_{\text{核}}}{M}\Bigl(\frac R{r_{\text{核}}}\Bigr)^2=\frac{1.94}{5.97}\times\Bigl(\frac{6.37}{3.48}\Bigr)^2\approx1.09$。地核表面的$g$比地面上还大约$9\%$：地核很密，往下走时少掉的质量不多，离地心却近得多。

- id: p5
  tier: hard
  statement: |
    把地球当作均匀球体，半径$R$，地面上的重力加速度$g$，不计空气和地球的自转，隧道都是光滑的直隧道。

    （1）沿一条直径挖隧道，物体从一端的隧道口由静止落下。证明它的运动和一颗贴着地面做匀速圆周运动的卫星在这条直径上的投影一样，并求它到达另一端要多久。

    （2）隧道不过地心，是连接地面上两点的一条弦。物体从一端由静止滑下，到另一端要多久？

    （3）弦到地心的距离是$d$，物体在隧道里的最大速率是多少？
  hints:
    - |
      离地心$r$处引力指向地心，大小$\frac{mgr}R$；沿直径取坐标$x$，引力就是$-\frac{mg}Rx$。
    - |
      卫星的角速度$\omega=\sqrt{\frac gR}$，它的$x$坐标的加速度是$-\omega^2x$。运动方程和初始条件都相同，运动就相同。
    - |
      弦上离弦的中点$x$处，引力沿弦的分量是$\frac{mgr}R\cdot\frac xr=\frac{mg}Rx$，指向中点。
  reference: |
    （1）沿直径取坐标$x$，原点在地心，物体在$x$处受的引力指向地心，大小$\frac{mg|x|}R$，所以$m\dv{^2x}{t^2}=-\frac{mg}Rx$，开始时$x=R$，速度为零。贴着地面做匀速圆周运动的卫星，角速度$\omega$满足$m\omega^2R=mg$，$\omega=\sqrt{\frac gR}$；它的$x$坐标是$R\cos\omega t$，求两次导数，加速度是$-\omega^2x=-\frac gRx$，$t=0$时$x=R$，$x$方向的速度为零。两者的运动方程和初始条件都相同，运动就相同（见[牛顿运动定律](lesson:physics.newtonian-mechanics.newtons-laws#def-equation-of-motion)）。卫星绕半圈时，投影从一端走到另一端，所以要$\pi\sqrt{\frac Rg}=\pi\sqrt{\frac{6.37\times10^6}{9.8}}\approx2.53\times10^3\,\mathrm s$，约$42$分钟。

    （2）在弦上取坐标$x$，原点在弦的中点。物体离地心$r$时，引力大小$\frac{mgr}R$，沿弦的分量是$\frac{mgr}R\cdot\frac{|x|}r=\frac{mg|x|}R$，指向中点；垂直于弦的分量被隧道壁的支持力抵消。沿弦的运动方程和（1）一模一样，只是开始时$x$等于弦长的一半。把它和一个半径为弦长的一半、角速度为$\sqrt{\frac gR}$的匀速圆周运动在弦上的投影比较，同样的道理，到另一端也要约$42$分钟，和弦的长短无关。

    （3）弦长的一半是$\sqrt{R^2-d^2}$。从一端到中点，沿弦的力做的功是$\int_0^{\sqrt{R^2-d^2}}\frac{mg}Rx\,\dd x=\frac{mg(R^2-d^2)}{2R}$，在中点速率最大：$v=\sqrt{\frac{g(R^2-d^2)}R}$。$d=0$时就是例 2 的$\sqrt{gR}$。

- id: p6
  tier: hard
  statement: |
    把地球当作质量$M$、半径$R$的均匀球体，取无穷远处为引力势能的参考点。

    （1）求质量为$m$的质点在地球内部离地心$r$处的引力势能。

    （2）沿直径的隧道里，质点从地心出发，至少要多大的速率才能飞到无穷远？用$g$和$R$表示，并算出数值，$g$取$9.8\,\mathrm{m/s^2}$，$R$取$6.37\times10^6\,\mathrm m$。

    （3）和地面上的逃逸速度比较，说明多出来的部分是什么。
  hints:
    - |
      势能等于从这里移到参考点时引力做的功，分成地球内部和外部两段。
    - |
      从$r$到$R$，引力$-\frac{GMms}{R^3}$做的功是$-\frac{GMm}{2R^3}(R^2-r^2)$；从$R$到无穷远做的功是$-\frac{GMm}R$。
    - |
      地心处的势能是$-\frac{3GMm}{2R}$。
  reference: |
    （1）从$r$移到无穷远，引力做的功分两段：在地球内部，$\int_r^R\Bigl(-\frac{GMms}{R^3}\Bigr)\dd s=-\frac{GMm}{2R^3}(R^2-r^2)$；在外部，$-\frac{GMm}R$。相加得$U(r)=-\frac{GMm}{2R^3}(3R^2-r^2)$。$r=R$时是$-\frac{GMm}R$，和外面接得上。

    （2）地心处$U(0)=-\frac{3GMm}{2R}$。飞到无穷远要机械能不小于零：$\frac12mv^2\ge\frac{3GMm}{2R}$，$v\ge\sqrt{\frac{3GM}R}=\sqrt{3gR}=\sqrt{3\times9.8\times6.37\times10^6}\approx1.37\times10^4\,\mathrm m/s$，约$13.7\,\mathrm{km/s}$。

    （3）地面上的逃逸速度是$\sqrt{2gR}\approx11.2\,\mathrm{km/s}$。从地心出发，先要爬出地球内部，多付的能量是$U(R)-U(0)=\frac12mgR$，正是例 2 里从隧道口落到地心时增加的动能：$\frac12v^2=\frac12gR+gR$。

- id: p7
  tier: thinking
  statement: |
    （1）由球壳定理，地球对月球的引力如同地球的质量集中在地心。月球对地球的引力呢？算月球对整个地球的引力时，能不能把地球当作质量集中在地心？

    （2）地球上离月球近的一侧和远的一侧，每千克物质受到月球的引力一样大吗？

    （3）这和海水的涨落有什么关系？
  hints:
    - |
      想一想牛顿第三定律。
    - |
      离月球近的一侧比远的一侧近约一个地球直径。
    - |
      地球整体的加速度由月球对整个地球的引力决定，各处的海水受到的引力却有大有小。
  reference: |
    （1）能。由牛顿第三定律，月球对地球的引力和地球对月球的引力大小相等、方向相反；后者如同地球的质量集中在地心，所以月球对整个地球的引力，也等于把地球当作集中在地心的质点算出的结果。

    （2）不一样。引力和距离的平方成反比，近的一侧每千克受的引力大，远的一侧小，地心处居中。

    （3）地球整体的加速度由地心处的那个值决定。近的一侧的海水被拉得比地球整体更厉害，远的一侧被拉得比地球整体弱，相对地球都向外隆起，所以地球上同时有两处涨潮，地球自转一周大约经过两次。这种「各处受的引力不一样」的效应叫作潮汐（tide）。

- id: p8
  tier: thinking
  statement: |
    （1）均匀球壳对里面的质点没有引力。那么，里面的质点对球壳的合力是多少？

    （2）设想一个均匀的空心球形空间站，远离其他天体。宇航员在里面不碰壳壁，他会不会被壳壁吸过去？

    （3）如果空间站的壳不均匀，一边厚一边薄，结论还成立吗？
  hints:
    - |
      想一想牛顿第三定律。
    - |
      球壳里面各处的引力势能都一样。
    - |
      证明里用到的是哪一条假设？
  reference: |
    （1）零。由牛顿第三定律，质点对球壳每一部分的引力，和那一部分对质点的引力等大反向；后者加起来是零，前者加起来也是零。

    （2）不会，他在里面任何地方都不受壳的引力。壳的近处那部分离他近，引力大，可面积小；远处那部分离他远，引力小，可面积大，正好抵消。（空间站本身的引力本来就很小，这里只看它的方向。）

    （3）不成立。证明用到了质量均匀分布，厚的一边质量多，合力会指向厚的一边附近，宇航员会慢慢被拉过去。
