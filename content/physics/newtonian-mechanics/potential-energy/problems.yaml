- id: p1
  tier: easy
  statement: |
    从高$20\,\mathrm m$的楼顶以$10\,\mathrm{m/s}$的速率抛出一个小球，抛出的方向任意，空气的影响可以忽略，$g$取$9.8\,\mathrm{m/s^2}$。小球落地时的速率是多少？以$\mathrm{m/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: sqrt(10^2 + 2*9.8*20)
    unit: |
      $\mathrm{m/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      小球只受重力，机械能守恒，用不着知道抛出的方向。
    - |
      取地面为参考点：$\frac12mv_0^2+mgh=\frac12mv^2$。
    - |
      $v=\sqrt{10^2+2\times9.8\times20}=\sqrt{492}\approx22.2\,\mathrm{m/s}$。
  solution: |
    小球只受重力，机械能守恒。取地面为参考点，$\frac12mv_0^2+mgh=\frac12mv^2$，$v=\sqrt{v_0^2+2gh}=\sqrt{100+392}\approx22.2\,\mathrm{m/s}$。不管向上、向下还是水平抛出，落地的速率都一样，只是方向和用的时间不同。

- id: p2
  tier: easy
  statement: |
    空气的影响都可以忽略，下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        弹簧伸长$2x$时的弹性势能是伸长$x$时的$2$倍
      - |
        在竖直平面内做匀速圆周运动的物体，机械能守恒
      - |
        物体受的合力为零，它的机械能一定守恒
      - |
        竖直上抛的小球上升时动能减少，下降时动能增加，机械能始终不变
      - |
        质点沿一条闭合路径走一圈回到出发点，重力做的功为零
    value: [4, 5]
  hints:
    - |
      弹性势能是$\frac12kx^2$；机械能是动能和势能之和。
    - |
      合力为零时动能不变，可势能可能在变；重力做的功是$U(A)-U(B)$。
    - |
      D、E 对；A、B、C 错。
  solution: |
    A 错：$\frac12k(2x)^2$是$\frac12kx^2$的$4$倍。B 错：动能不变，高度却在变，重力势能变了，机械能不守恒。C 错：例如用绳子把物体匀速提起，合力为零、动能不变，重力势能却在增加，机械能增加了，是绳子的拉力做了功。

    D 对：只有重力做功，动能和重力势能互相转化，和不变。E 对：回到出发点，$W=U(A)-U(A)=0$。

- id: p3
  tier: medium
  statement: |
    竖直放置的弹簧下端固定，劲度系数是$400\,\mathrm{N/m}$。把质量$0.10\,\mathrm{kg}$的小球放在弹簧上端，向下压，使弹簧比原长短$0.10\,\mathrm m$，然后放手，小球被弹起后离开弹簧。空气的影响可以忽略，$g$取$9.8\,\mathrm{m/s^2}$，从放手时的位置算起，小球最高能上升多少？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: 0.5*400*0.1^2/(0.1*9.8)
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      从放手到最高点，只有重力和弹簧的弹力做功，机械能守恒；两个时刻的速度都是零。
    - |
      弹性势能$\frac12\times400\times0.10^2=2.0\,\mathrm J$全部变成重力势能。
    - |
      $mgH=2.0\,\mathrm J$，$H=\frac{2.0}{0.10\times9.8}\approx2.04\,\mathrm m$。
  solution: |
    从放手到最高点，只有重力和弹力做功，机械能守恒，而两个时刻的速度都是零。弹簧放出的弹性势能$\frac12kx^2=2.0\,\mathrm J$全部变成重力势能：$mgH=2.0\,\mathrm J$，$H\approx2.04\,\mathrm m$。小球在弹簧恢复原长时离开弹簧，这时它已经上升了$0.10\,\mathrm m$，剩下的$1.94\,\mathrm m$是离开弹簧以后上升的。

- id: p4
  tier: medium
  statement: |
    长$1.0\,\mathrm m$的细绳一端固定，另一端拴一个小球。把绳拉直，使它和竖直方向成$60^\circ$，然后由静止放开，空气的影响可以忽略，$g$取$9.8\,\mathrm{m/s^2}$。小球经过最低点时的速率是多少？以$\mathrm{m/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: sqrt(2*9.8*1.0*(1 - cos(60*pi/180)))
    unit: |
      $\mathrm{m/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      绳子的拉力始终和小球的速度垂直，不做功，机械能守恒。
    - |
      小球下降的高度是$L-L\cos60^\circ=0.50\,\mathrm m$。
    - |
      $v=\sqrt{2\times9.8\times0.50}\approx3.13\,\mathrm{m/s}$。
  solution: |
    小球沿圆弧运动，速度沿圆弧的切线，绳子的拉力沿半径，两者垂直，拉力不做功，只有重力做功，机械能守恒。小球下降的高度是$L(1-\cos60^\circ)=0.50\,\mathrm m$，所以$v=\sqrt{2gh}=\sqrt{9.8}\approx3.13\,\mathrm{m/s}$。

- id: p5
  tier: hard
  statement: |
    劲度系数为$k$的轻弹簧竖直悬挂，下端挂一个质量为$m$的小球。取弹簧原长时小球的位置为原点，$x$轴竖直向下。

    （1）求小球的平衡位置$x_0$。

    （2）证明：小球的重力势能和弹簧的弹性势能之和可以写成$\frac12k(x-x_0)^2+C$，$C$是常数。

    （3）把小球从原点由静止放开，空气的影响可以忽略，它最低到哪里？
  hints:
    - |
      平衡时重力和弹力大小相等。
    - |
      取原点为重力势能的参考点，$x$向下时重力势能是$-mgx$；再配方。
    - |
      放开时动能为零，最低点动能也为零，两处的势能相等。
  reference: |
    （1）平衡时$mg=kx_0$，$x_0=\frac{mg}k$。

    （2）取原点为参考点，重力势能是$-mgx$，弹性势能是$\frac12kx^2$。两者之和$\frac12kx^2-mgx=\frac12k\Bigl(x-\frac{mg}k\Bigr)^2-\frac{(mg)^2}{2k}=\frac12k(x-x_0)^2-\frac12kx_0^2$。从平衡位置量起，重力和弹簧合起来就像一根劲度系数为$k$的弹簧。

    （3）放开时$x=0$、动能为零，势能是$\frac12kx_0^2-\frac12kx_0^2=0$。最低点动能也为零，势能也是零：$\frac12k(x-x_0)^2=\frac12kx_0^2$，$x=2x_0=\frac{2mg}k$，是平衡位置处伸长量的$2$倍。

- id: p6
  tier: hard
  statement: |
    （1）证明：沿直线运动的质点，如果受的力$F(x)$只随位置变化，这个力就是保守力，它的势能可以写成$U(x)=-\int_{x_0}^xF(s)\,\dd s$，$x_0$是参考点。

    （2）一种硬弹簧的弹力是$F=-kx-bx^3$，$k=100\,\mathrm{N/m}$，$b=1.0\times10^4\,\mathrm{N/m^3}$，$x$是伸长量。光滑水平面上，质量$0.50\,\mathrm{kg}$的物块以$2.0\,\mathrm{m/s}$从原长处出发，它最远能把弹簧拉长多少？和$b=0$的普通弹簧比较。
  hints:
    - |
      讲[功与动能定理](lesson:physics.newtonian-mechanics.work-energy)时证明过，这时功是$\int_{x_1}^{x_2}F\,\dd x$，即使中途折返也成立。
    - |
      硬弹簧的势能是$\frac12kx^2+\frac14bx^4$。
    - |
      令$y=x^2$，$\frac12mv^2=\frac12ky+\frac14by^2$是$y$的二次方程。
  reference: |
    （1）由[功与动能定理](lesson:physics.newtonian-mechanics.work-energy)，从$x_1$到$x_2$，$F$做的功是$\int_{x_1}^{x_2}F\,\dd x$，即使中途折返也一样，只取决于两端，所以$F$是保守力。取$U(x)=-\int_{x_0}^xF(s)\,\dd s$，则$U(x_1)-U(x_2)=\int_{x_1}^{x_2}F\,\dd x=W_{12}$，符合势能的定义，而且$U(x_0)=0$。

    （2）取原长处为参考点，$U=\frac12kx^2+\frac14bx^4$。机械能守恒：$\frac12\times0.50\times2.0^2=1.0\,\mathrm J=50x^2+2500x^4$。令$y=x^2$，$2500y^2+50y-1=0$，正根$y=\frac{-50+\sqrt{2500+10^4}}{5000}\approx0.0124$，$x\approx0.111\,\mathrm m$。普通弹簧$50x^2=1.0$，$x\approx0.141\,\mathrm m$：硬弹簧越拉越硬，物块停得更早。

- id: p7
  tier: thinking
  statement: |
    过山车由电机拖上第一个坡以后，就再没有动力了。

    （1）为什么第一个坡总是最高的？

    （2）实际的轨道上，后面的坡一个比一个低，为什么？

    （3）过山车跑完一圈回到站台，靠什么停下？那时它的机械能到哪里去了？
  hints:
    - |
      冲上一个坡顶时，动能不能是负的。
    - |
      轨道的摩擦和空气都在做负功。
    - |
      刹车片和轨道之间是什么力？
  reference: |
    （1）过山车在第一个坡顶附近几乎静止，机械能约等于那里的重力势能。到后面任何一个坡顶，动能不能是负的，所以那里的重力势能不能超过开头的机械能，坡就不能比第一个坡高。

    （2）轨道的摩擦和空气都对过山车做负功，机械能越来越少，后面的坡就要一个比一个低，还要留出余量，保证过山车能冲过去。

    （3）靠刹车：刹车片夹住轨道或车轮，滑动摩擦力做负功，把动能变成了刹车片和轨道的内能，它们会发热。

- id: p8
  tier: thinking
  statement: |
    （1）有人想仿照重力势能，给滑动摩擦力也定义一个「势能」：质点在某处的「势能」，就是它从这里移到参考点时摩擦力做的功。这样定义会出什么问题？

    （2）为什么说重力做的功「存」进了势能，还能取回来，而滑动摩擦力做的功却「散失」了？

    （3）汽车刹车时，它的动能到哪里去了？
  hints:
    - |
      从同一个点出发，走不同的路到参考点，摩擦力做的功一样吗？
    - |
      把石头举高再放手，重力做的功前后各是多少？
    - |
      刹车片摸起来会怎样？
  reference: |
    （1）摩擦力做的功和路径有关：从同一点出发，走的路越长，做的负功越多，这个「势能」就不是一个确定的值，没法定义。

    （2）把石头举高时重力做负功，势能增加；石头落回原处时，重力做同样多的正功，势能又全部变回动能，功可以原样取回来。滑动摩擦力不管物体往哪边走都做负功，把动能变成内能，这些内能不会自己变回动能。

    （3）刹车片压住车轮上的刹车盘，滑动摩擦力做负功，动能变成了刹车片、刹车盘的内能，它们会发热，长时间下坡刹车时甚至会烫得冒烟。
