- id: p1
  tier: easy
  statement: |
    质量$4.0\,\mathrm{kg}$的步枪水平射出一颗$10\,\mathrm g$的子弹，子弹离开枪口时相对地面的速度是$800\,\mathrm{m/s}$。枪原来静止、可以自由后退，枪后退的速度多大？以$\mathrm{m/s}$为单位。
  answer:
    type: number
    value: 0.010*800/4.0
    unit: |
      $\mathrm{m/s}$
  hints:
    - |
      射击的时间很短，外力的冲量可以忽略，枪和子弹的总动量守恒。
    - |
      射击前总动量是零，所以$0.010\times800=4.0\,v$。
    - |
      $v=2.0\,\mathrm{m/s}$，方向和子弹相反。
  solution: |
    射击的时间很短，外力的冲量可以忽略，枪和子弹的总动量守恒，射击前是零。所以$4.0\,v=0.010\times800=8.0$，枪后退的速度$v=2.0\,\mathrm{m/s}$。实际射击时人用肩膀抵住枪，人和枪一起后退，速度要小得多。

- id: p2
  tier: easy
  statement: |
    下面关于火箭的说法哪些对？$u$是排气速度。
  answer:
    type: choice
    multiple: true
    options:
      - |
        排气速度不变、不受外力时，火箭速度的增加只取决于开始和结束时的质量之比
      - |
        不受外力时，燃料烧得越快，火箭最后的速度越大
      - |
        把排气速度提高到原来的 2 倍，和把质量比变成原来的平方，火箭速度的增加一样多
      - |
        燃料匀速燃烧、排气速度不变时，火箭在燃料烧完以前的加速度一直不变
      - |
        不受外力的火箭，质量减到原来的一半时，速度增加了约$0.69u$
    value: [1, 3, 5]
  hints:
    - |
      火箭方程：$v-v_0=u\ln\frac{m_0}m$。
    - |
      $\ln R^2=2\ln R$；推力不变，可火箭的质量在减小。
    - |
      A、C、E 对；B、D 错。
  solution: |
    A 对：由火箭方程，速度的增加是$u\ln\frac{m_0}m$。B 错：不受外力时只和质量比有关，和烧得快慢无关。C 对：$2u\ln R=u\ln R^2$。

    D 错：推力$u\bigl|\dv mt\bigr|$不变，火箭的质量越来越小，加速度越来越大。E 对：$u\ln2\approx0.69u$。

- id: p3
  tier: medium
  statement: |
    要让火箭在不受外力时从静止加速到$5.0\,\mathrm{km/s}$，排气速度是$2.0\,\mathrm{km/s}$。燃料至少要占起飞质量的百分之几？保留三位有效数字。
  answer:
    type: number
    value: 100*(1 - exp(-2.5))
    unit: |
      $\%$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      由火箭方程，$\frac{m_0}m=e^{\Delta v/u}$。
    - |
      $\frac{m_0}m=e^{2.5}\approx12.2$。
    - |
      燃料占起飞质量的$1-\frac m{m_0}=1-e^{-2.5}\approx91.8\%$。
  solution: |
    由$\Delta v=u\ln\frac{m_0}m$，$\frac{m_0}m=e^{5.0/2.0}=e^{2.5}\approx12.18$。燃料的质量是$m_0-m$，占起飞质量的$1-\frac m{m_0}=1-e^{-2.5}\approx0.918$，即约$91.8\%$。剩下的约$8\%$里还要放下箭体、发动机和有效载荷，单级火箭很难做到。

- id: p4
  tier: medium
  statement: |
    火箭竖直起飞时的质量是$5.0\times10^5\,\mathrm{kg}$，每秒喷出$2.0\times10^3\,\mathrm{kg}$燃气，排气速度是$3.0\times10^3\,\mathrm{m/s}$。空气的影响可以忽略，$g$取$9.8\,\mathrm{m/s^2}$，刚起飞时火箭的加速度多大？以$\mathrm{m/s^2}$为单位。
  answer:
    type: number
    value: 3.0e3*2.0e3/5.0e5 - 9.8
    unit: |
      $\mathrm{m/s^2}$
  hints:
    - |
      推力是$u\bigl|\dv mt\bigr|$，火箭还受重力。
    - |
      推力$3.0\times10^3\times2.0\times10^3=6.0\times10^6\,\mathrm N$，重力$4.9\times10^6\,\mathrm N$。
    - |
      $a=\frac{6.0\times10^6-4.9\times10^6}{5.0\times10^5}=2.2\,\mathrm{m/s^2}$。
  solution: |
    推力$F=u\bigl|\dv mt\bigr|=6.0\times10^6\,\mathrm N$，重力$mg=4.9\times10^6\,\mathrm N$。由$m\dv vt=F-mg$，$a=\frac{1.1\times10^6}{5.0\times10^5}=2.2\,\mathrm{m/s^2}$。以后火箭的质量越来越小，加速度越来越大。

- id: p5
  tier: hard
  statement: |
    有效载荷是$1\,\mathrm t$。方案一：单级火箭，燃料$89\,\mathrm t$，箭体$10\,\mathrm t$。方案二：两级火箭，第一级燃料$80\,\mathrm t$、箭体$8\,\mathrm t$，第二级燃料$9\,\mathrm t$、箭体$2\,\mathrm t$，第一级的燃料烧完就把它的箭体扔掉，扔的时候不改变火箭的速度。两种方案的燃料、箭体总质量相同，排气速度都是$3.0\,\mathrm{km/s}$，不计外力。

    （1）求方案一燃料烧完时的速度。

    （2）求方案二最后的速度。

    （3）为什么两级火箭更快？
  hints:
    - |
      方案一：$m_0=100\,\mathrm t$，燃料烧完时$m=11\,\mathrm t$。
    - |
      方案二的第一级：$100\,\mathrm t\to20\,\mathrm t$；扔掉$8\,\mathrm t$后剩$12\,\mathrm t$，第二级：$12\,\mathrm t\to3\,\mathrm t$。
    - |
      两级的速度增加相加，也就是质量比相乘以后取对数。
  reference: |
    （1）$v_1=3.0\ln\frac{100}{11}\approx3.0\times2.21\approx6.62\,\mathrm{km/s}$。

    （2）第一级：$3.0\ln\frac{100}{20}=3.0\ln5\approx4.83\,\mathrm{km/s}$。扔掉第一级的箭体，火箭剩$12\,\mathrm t$，速度不变。第二级：$3.0\ln\frac{12}3=3.0\ln4\approx4.16\,\mathrm{km/s}$。最后的速度约$8.99\,\mathrm{km/s}$，超过了绕地球表面附近做圆周运动需要的约$7.9\,\mathrm{km/s}$（见[万有引力定律](lesson:physics.newtonian-mechanics.gravitation)）。

    （3）两级的质量比相乘是$5\times4=20$，单级只有$\frac{100}{11}\approx9.1$，速度的增加是$u$乘质量比的对数，所以两级的大。原因是第一级的$8\,\mathrm t$空壳扔掉以后，第二级的燃料不必再给它加速。

- id: p6
  tier: hard
  statement: |
    质量为$m_0$的敞篷车在光滑水平轨道上以$v_0$滑行。下起了雨，雨滴竖直落下，车里每秒积下质量为$\lambda$的雨水。

    （1）求车速随时间的变化$v(t)$。

    （2）求从下雨开始到$t$时刻车走过的距离。

    （3）照搬「水平方向不受力，所以$mv$不变」，会得到和（1）一样的结果。为什么这里碰巧对了，讲解里漏沙的车却不对？
  hints:
    - |
      把车、车里的雨水和这段时间里落进车里的雨滴看作一个系统，水平方向不受外力。
    - |
      雨滴落进车以前，水平速度为零，所以水平方向的总动量$(m_0+\lambda t)v$保持为$m_0v_0$。
    - |
      距离是$\int_0^t\frac{m_0v_0}{m_0+\lambda s}\,\dd s$；由链式法则，$\ln(m_0+\lambda s)$的导数是$\frac\lambda{m_0+\lambda s}$。
  reference: |
    （1）取车和到$t$时刻为止落进车里的雨水为系统。雨滴落进车之前水平速度为零，系统在水平方向不受外力，水平方向的总动量守恒：$(m_0+\lambda t)v=m_0v_0$，所以$v(t)=\frac{m_0v_0}{m_0+\lambda t}$。

    （2）$x(t)=\int_0^t\frac{m_0v_0}{m_0+\lambda s}\,\dd s=\frac{m_0v_0}\lambda\ln\Bigl(1+\frac{\lambda t}{m_0}\Bigr)$。车越来越慢，走过的距离却随时间无限增大，只是增大得越来越慢。

    （3）并入的雨水原来的水平动量是零，车和车里雨水的水平总动量正好就是$mv$，所以「$mv$不变」碰巧对了。漏沙的车里，离开的沙子带走了它原有的那份动量，留在车上的部分的$mv$并不等于系统的总动量，照搬就会错。

- id: p7
  tier: thinking
  statement: |
    讲解里说，不受外力时，火箭最后的速度和燃料烧得快慢无关。

    （1）在地面附近竖直起飞时，燃料烧得快好还是慢好？为什么？

    （2）如果燃料烧得太慢，推力比火箭受的重力还小，会怎样？

    （3）燃料烧得太快，又会带来什么问题？
  hints:
    - |
      竖直起飞时，燃料烧完时的速度是$u\ln\frac{m_0}m-gt$，$t$是烧完用的时间。
    - |
      推力小于重力时，火箭离得开发射台吗？
    - |
      推力越大，加速度越大；箭体、仪器和航天员能承受多大的加速度？
  reference: |
    （1）快好。燃料烧完时$v=u\ln\frac{m_0}m-gt$，质量比一定时，烧得越快，$t$越短，减去的重力损失$gt$越小。

    （2）推力$u\bigl|\dv mt\bigr|$小于重力$m_0g$时，火箭根本飞不起来，燃料在发射台上白白烧掉。

    （3）推力很大时加速度也很大，箭体、仪器和航天员都要承受很大的力；在稠密的大气里飞得太快，空气的阻碍和发热也很严重。所以实际的火箭起飞时加速度只有一两个$g$，以后再逐渐变大。

- id: p8
  tier: thinking
  statement: |
    喷气式飞机的发动机也向后喷出高速的气体，可它不能像火箭那样飞出大气层。

    （1）喷气发动机喷出的气体是从哪里来的？火箭的呢？

    （2）喷气发动机从前面吸进空气，从后面以更大的速度喷出。从动量的角度看，它的推力从哪里来？

    （3）为什么喷气式飞机离不开空气？
  hints:
    - |
      燃料燃烧需要氧气。
    - |
      在飞机上看，每秒吸进的空气以多大的速度进来、多大的速度出去？
    - |
      火箭自己带着燃料和氧化剂。
  reference: |
    （1）喷气发动机吸进外面的空气，空气里的氧气和燃料一起燃烧，喷出的主要是被加热、加速的空气；火箭带着燃料和氧化剂，喷出的全是自己带的物质。

    （2）在飞机上看，每秒吸进质量为$\mu$的空气，它以飞行速度$V$迎面进来，又以相对飞机的速度$w$从后面喷出。燃料的质量比空气少得多，可以忽略，空气向后的动量每秒增加约$\mu(w-V)$。发动机给空气这么大的向后的力，空气就以同样大的力向前推发动机。

    （3）没有空气，就没有可以加速的气体，也没有和燃料一起燃烧的氧气，发动机就不能工作；飞得越高空气越稀薄，吸进的空气越少，推力也越小。火箭不靠外面的东西，在真空里照样有推力。
