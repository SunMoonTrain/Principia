- id: p1
  tier: easy
  statement: |
    一颗绕地球运动的卫星，每千克对地心的角动量是$5.30\times10^{10}\,\mathrm{m^2/s}$。如果它做圆周运动，轨道半径是多少？地球的质量取$5.97\times10^{24}\,\mathrm{kg}$，引力常量取$6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$。以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: (5.30e10)^2/(6.67e-11*5.97e24)
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      圆轨道的半径在有效势的最低点。
    - |
      $r_0=\frac{L^2}{mk}$，$k=GMm$，所以$r_0=\frac{(L/m)^2}{GM}$。
    - |
      $r_0=\frac{(5.30\times10^{10})^2}{6.67\times10^{-11}\times5.97\times10^{24}}\approx7.05\times10^6\,\mathrm m$。
  solution: |
    引力的有效势$-\frac{GMm}r+\frac{L^2}{2mr^2}$在$r_0=\frac{L^2}{GMm^2}=\frac{(L/m)^2}{GM}$处最小，圆轨道的半径就是它：$r_0=\frac{(5.30\times10^{10})^2}{6.67\times10^{-11}\times5.97\times10^{24}}\approx7.05\times10^6\,\mathrm m$。也可以用圆轨道的速率$v=\sqrt{\frac{GM}r}$和$\frac Lm=rv$验证：$\frac Lm=\sqrt{GMr}$，同样得到这个半径。

- id: p2
  tier: easy
  statement: |
    质点受指向力心、大小为$\frac k{r^2}$（$k>0$）的力，角动量不为零。下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        质点在近心点受的合力为零
      - |
        角动量相同时，机械能越大，远心点离力心越近
      - |
        角动量相同时，机械能越大，近心点离力心越近
      - |
        质点运动时，机械能和角动量都不变
      - |
        角动量越大，圆轨道的半径越大
    value: [3, 4, 5]
  hints:
    - |
      画出有效势$-\frac kr+\frac{L^2}{2mr^2}$，把水平线$E$往上移，看两个交点怎样动。
    - |
      近心点只是$r$的转折点，那里$v_r=0$，力并不为零。
    - |
      C、D、E 对；A、B 错。
  solution: |
    A 错：近心点处$v_r=0$，可力$\frac k{r^2}$不为零，正是它让质点转回去。B 错、C 对：有效势在最低点左侧递减、右侧递增，水平线$E$往上移，左边的交点往左移，近心点更近；右边的交点往右移，远心点更远（$E\ge0$时没有远心点）。

    D 对：力是保守力，又沿着质点和力心的连线，机械能和角动量都守恒。E 对：圆轨道的半径$r_0=\frac{L^2}{mk}$随$L$增大。

- id: p3
  tier: medium
  statement: |
    卫星在近地点离地心$6.6\times10^6\,\mathrm m$，速率是$8.4\,\mathrm{km/s}$。地球的质量取$5.97\times10^{24}\,\mathrm{kg}$，引力常量取$6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$。它的远地点离地心多远？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: 6.67e-11*5.97e24/(6.67e-11*5.97e24/6.6e6 - 0.5*8.4e3^2) - 6.6e6
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      近地点、远地点都是有效势等于机械能的点，速度都垂直于半径。
    - |
      $Er^2+kr-\frac{L^2}{2m}=0$的两根之和是$-\frac kE$，$k=GMm$。
    - |
      每千克的机械能约$-2.51\times10^7\,\mathrm{J/kg}$，两根之和约$1.59\times10^7\,\mathrm m$，远地点离地心约$9.29\times10^6\,\mathrm m$。
  solution: |
    $GM\approx3.98\times10^{14}\,\mathrm{m^3/s^2}$。每千克的机械能$\frac Em=\frac12v^2-\frac{GM}r\approx3.53\times10^7-6.03\times10^7\approx-2.51\times10^7\,\mathrm{J/kg}$。$U_{\text{eff}}(r)=E$乘以$r^2$得$Er^2+GMmr-\frac{L^2}{2m}=0$，两根之和$r_{\text{近}}+r_{\text{远}}=\frac{GM}{-E/m}\approx1.59\times10^7\,\mathrm m$，所以$r_{\text{远}}\approx1.59\times10^7-6.6\times10^6\approx9.29\times10^6\,\mathrm m$。

- id: p4
  tier: medium
  statement: |
    光滑水平桌面上，质量$0.50\,\mathrm{kg}$的小球拴在一根轻弹簧的一端，弹簧的另一端固定在桌面上的$O$点。这根弹簧的原长可以当作零，弹力指向$O$，大小是$kr$，$k=2.0\,\mathrm{N/m}$，$r$是小球到$O$的距离。小球对$O$的角动量是$0.36\,\mathrm{kg\cdot m^2/s}$，它做圆周运动时半径是多少？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: (0.36^2/(0.50*2.0))^(1/4)
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      弹力的势能是$\frac12kr^2$，有效势是$\frac12kr^2+\frac{L^2}{2mr^2}$。
    - |
      圆轨道在有效势的最低点：$kr=\frac{L^2}{mr^3}$。
    - |
      $r^4=\frac{L^2}{mk}=\frac{0.36^2}{0.50\times2.0}=0.1296$，$r=0.600\,\mathrm m$。
  solution: |
    弹力大小只和$r$有关，势能$U=\frac12kr^2$，有效势$U_{\text{eff}}=\frac12kr^2+\frac{L^2}{2mr^2}$。令$U_{\text{eff}}'=kr-\frac{L^2}{mr^3}=0$，$r^4=\frac{L^2}{mk}=\frac{0.36^2}{0.50\times2.0}=0.1296\,\mathrm{m^4}$，$r=0.600\,\mathrm m$。验算：$\omega=\frac L{mr^2}=\frac{0.36}{0.50\times0.36}=2.0\,\mathrm{rad/s}$，向心力$m\omega^2r=1.2\,\mathrm N$正好等于弹力$kr$。

- id: p5
  tier: hard
  statement: |
    质点受指向力心的力，大小是$\frac k{r^3}$（$k>0$），角动量是$L\ne0$。

    （1）取无穷远处为参考点，写出势能和有效势。

    （2）有没有圆轨道？如果有，它稳定吗？

    （3）设$L^2<mk$。质点向力心运动时会怎样？离开力心运动时又会怎样？
  hints:
    - |
      $U(r)=-\int_r^{+\infty}F\,\dd s$里$F=-\frac k{s^3}$，或者找一个导数等于$\frac k{r^3}$的函数。
    - |
      有效势$\frac{L^2-mk}{2mr^2}$只是$\frac1{r^2}$乘一个常数。
    - |
      $L^2<mk$时有效势处处为负，$r\to0$时趋于$-\infty$。
  reference: |
    （1）$U(r)=\int_r^{+\infty}\Bigl(-\frac k{s^3}\Bigr)\dd s=-\frac k{2r^2}$，有效势$U_{\text{eff}}=\frac{L^2}{2mr^2}-\frac k{2r^2}=\frac{L^2-mk}{2mr^2}$。

    （2）$U_{\text{eff}}'(r)=-\frac{L^2-mk}{mr^3}$，只有$L^2=mk$时才为零，而这时$U_{\text{eff}}$处处为零：质点在任何$r$上都能以$v_r=0$转圈。可只要扰动使$L^2$略大于或略小于$mk$，或者给它一点$v_r$，$r$就一直增大或一直减小，回不来，圆轨道不稳定。这个力的势能$-\frac k{2r^2}$和墙$\frac{L^2}{2mr^2}$随$r$变化得一样快，墙不一定挡得住它。

    （3）$L^2<mk$时$U_{\text{eff}}<0$，随$r$增大而增大，趋于$0$。向力心运动（$v_r<0$）时，$U_{\text{eff}}$越来越低，$v_r$越来越大，质点一直落到力心。离开力心运动时，$E\ge0$的一直飞到无穷远；$E<0$的到$U_{\text{eff}}(r)=E$处停止外移，然后掉头，最后也落到力心。

- id: p6
  tier: hard
  statement: |
    光滑水平桌面中央有个小孔，轻绳穿过小孔，一端拴着桌面上质量为$m$的小球，另一端挂着质量为$M$的重物。小球绕小孔运动，对小孔的角动量是$L$；绳子总是拉直的，重物只上下运动，不计一切摩擦。

    （1）记小球到小孔的距离为$r$，写出整个系统的机械能，说明$r$的变化相当于在什么样的有效势里做一维运动。

    （2）小球做圆周运动时，半径是多少？这个圆周运动稳定吗？

    （3）在圆周运动时，突然给重物一个向下的小速度，接下来$r$怎样变化？
  hints:
    - |
      绳长不变，$r$增大多少，重物就升高多少，重物的速率是$|v_r|$。绳子对小球的力指向小孔，小球对小孔的角动量守恒。
    - |
      绳子对两个物体做的功一正一负，相加为零；机械能$E=\frac12(m+M)v_r^2+\frac{L^2}{2mr^2}+Mgr+$常数。
    - |
      有效势$Mgr+\frac{L^2}{2mr^2}$的最低点满足$Mg=\frac{L^2}{mr^3}$。
  reference: |
    （1）小球受的重力和支持力相互抵消，绳子对它的力指向小孔，所以它对小孔的角动量$L=mr^2\omega$守恒。绳长不变，重物的高度是$r$加一个常数，速率是$|v_r|$。绳子拉小球、拉重物的两个力大小相等，对两者做的功一正一负，相加为零，系统的机械能守恒：$E=\frac12mv_r^2+\frac{L^2}{2mr^2}+\frac12Mv_r^2+Mgr+$常数。这相当于质量为$m+M$的质点在有效势$U_{\text{eff}}(r)=Mgr+\frac{L^2}{2mr^2}$里做一维运动。

    （2）$U_{\text{eff}}'=Mg-\frac{L^2}{mr^3}=0$，$r_0=\Bigl(\frac{L^2}{mMg}\Bigr)^{1/3}$。验算：这时重物静止，绳子的力是$Mg$，正好提供小球的向心力$m\omega^2r_0=\frac{L^2}{mr_0^3}$。$U_{\text{eff}}''=\frac{3L^2}{mr^4}>0$，$r_0$是稳定平衡位置，圆周运动是稳定的。

    （3）给重物一个向下的速度，$v_r<0$，$L$不变，机械能比$U_{\text{eff}}$的最小值略大。$r$先减小到有效势左侧的转折点，再增大到右侧的转折点，在$r_0$附近来回变化，重物跟着上下振动，小球的轨道是一条绕小孔的花瓣状曲线。

- id: p7
  tier: thinking
  statement: |
    卫星在圆轨道上运行。宇航员在某一时刻把一个小包推出，相对卫星的速度不大。

    （1）沿半径向地心方向推出时，小包的角动量和机械能各怎样变？

    （2）小包的轨道还是圆吗？它离地心最近、最远在什么范围？

    （3）如果改成沿运动方向向前推出呢？
  hints:
    - |
      沿半径推出，只改变$v_r$，不改变垂直于半径的分速度。
    - |
      角动量不变，有效势就不变，最低点还在原来的半径$r_0$处；机械能比最小值大了一点。
    - |
      向前推出时角动量变大，有效势的最低点往外移，推出的那一点$v_r=0$。
  reference: |
    （1）推出前后小包的位置相同，垂直于半径的分速度也相同，所以角动量$L=mr\cdot(r\omega)$不变；多了一点径向的速度，动能增大，机械能比原来的圆轨道大了一点。

    （2）$L$不变，有效势还是原来那条，最低点仍在原来的半径$r_0$；机械能比最小值大一点，就不再是圆，$r$在略小于$r_0$和略大于$r_0$的两个转折点之间来回变化。推出时它有向内的$v_r$，先向地球靠近，到近地点再转回来，一圈里离地心最近、最远都和$r_0$差不多。

    （3）向前推出，垂直于半径的速度变大，角动量变大，有效势的最低点往外移到$r_0'>r_0$。推出的那一点$v_r=0$，是转折点，又在新的最低点左侧，所以它成了近地点：小包走上一条在推出点离地心最近、对面离地心最远的轨道。

- id: p8
  tier: thinking
  statement: |
    让探测器飞出太阳系，比让它落到太阳上容易。

    （1）探测器刚离开地球的引力范围时，相对太阳的速度大约多大，方向怎样？它对太阳的角动量大不大？

    （2）用有效势说明，要落到太阳上，角动量必须怎样？

    （3）太阳的半径约$7.0\times10^8\,\mathrm m$，日地距离约$1.5\times10^{11}\,\mathrm m$，太阳的$GM$约$1.33\times10^{20}\,\mathrm{m^3/s^2}$。粗略地估计，探测器相对太阳的速度要减掉多少，才能落到太阳表面？
  hints:
    - |
      探测器离开地球时，带着地球绕太阳公转的速度，约$30\,\mathrm{km/s}$，垂直于太阳的方向。
    - |
      近心点是有效势左侧的交点；角动量越大，墙越高，近心点越远。
    - |
      让日地距离处成为远日点、太阳表面成为近日点，用机械能守恒和角动量守恒求远日点的速率。
  reference: |
    （1）探测器带着地球公转的速度，相对太阳约$30\,\mathrm{km/s}$，方向大致垂直于太阳的方向，对太阳的角动量$mrv$很大。

    （2）有效势$-\frac{GMm}r+\frac{L^2}{2mr^2}$里的墙挡着它，近心点是墙上的转折点。$L$大，墙高，近心点远；要让近心点落进太阳半径以内，$L$必须很小，也就是垂直于太阳方向的速度几乎全要抵消掉。

    （3）设远日点在日地距离$r_{\text{远}}$处，近日点在太阳表面$r_{\text{近}}$处，两点的速度都垂直于半径。由$r_{\text{近}}v_{\text{近}}=r_{\text{远}}v_{\text{远}}$和机械能守恒，$v_{\text{远}}=\sqrt{\frac{2GMr_{\text{近}}}{r_{\text{远}}(r_{\text{远}}+r_{\text{近}})}}\approx2.9\,\mathrm{km/s}$。也就是说，$30\,\mathrm{km/s}$里要减掉约$27\,\mathrm{km/s}$，只留下不到$3\,\mathrm{km/s}$。而飞出太阳系只要在公转速度上再加约$12\,\mathrm{km/s}$，所以去太阳反而更难。
