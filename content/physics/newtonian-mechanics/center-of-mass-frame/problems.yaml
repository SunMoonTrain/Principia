- id: p1
  tier: easy
  statement: |
    光滑水平直轨道上，质量$2.0\,\mathrm{kg}$的小车以$3.0\,\mathrm{m/s}$向右运动，质量$1.0\,\mathrm{kg}$的小车以$3.0\,\mathrm{m/s}$向左运动。两车在质心系里的总动能是多少？以$\mathrm J$为单位。
  answer:
    type: number
    value: (0.5*2*3^2 + 0.5*1*3^2) - 0.5*3*((2*3 - 1*3)/3)^2
    unit: |
      $\mathrm J$
  hints:
    - |
      先求质心的速度$v_{\mathrm C}=\frac{m_1v_1+m_2v_2}{m_1+m_2}$。
    - |
      取向右为正，$v_{\mathrm C}=\frac{6.0-3.0}{3.0}=1.0\,\mathrm{m/s}$；总动能是$9.0+4.5=13.5\,\mathrm J$。
    - |
      由柯尼希定理，$K'=13.5-\frac12\times3.0\times1.0^2=12\,\mathrm J$。
  solution: |
    取向右为正，$v_{\mathrm C}=\frac{2.0\times3.0+1.0\times(-3.0)}{3.0}=1.0\,\mathrm{m/s}$。总动能$K=9.0+4.5=13.5\,\mathrm J$，质心的动能$\frac12\times3.0\times1.0^2=1.5\,\mathrm J$，由柯尼希定理，$K'=12\,\mathrm J$。也可以用相对速度直接算：$K'=\frac{2.0\times1.0}{2\times3.0}\times6.0^2=12\,\mathrm J$。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        同一个质点系，在各个惯性系里量出的动能中，质心系里的最小
      - |
        两个物体在它们的质心系里，速度的大小和各自的质量成反比
      - |
        在质心系里，质点系的总动能为零
      - |
        两个物体发生完全非弹性碰撞，在原来的参考系里量出的动能损失，比在质心系里量出的大
      - |
        质心系相对原来参考系的速度，等于质点系的总动量除以总质量
    value: [1, 2, 5]
  hints:
    - |
      柯尼希定理：$K=\frac12Mv_{\mathrm C}^2+K'$，换到以$\vb v_0$运动的参考系，第一项里的$v_{\mathrm C}$换成相对速度。
    - |
      质心系里$m_1\vb u_1+m_2\vb u_2=\vb 0$；损失的动能只和相对速度有关。
    - |
      A、B、E 对；C、D 错。
  solution: |
    A 对：在以$\vb v_0$运动的惯性系里，动能是$\frac12M|\vb v_{\mathrm C}-\vb v_0|^2+K'$，$\vb v_0=\vb v_{\mathrm C}$时最小，就是$K'$。B 对：$m_1u_1=m_2u_2$。C 错：总动量为零，动能并不为零，两个物体都在动。

    D 错：损失的动能$\frac{m_1m_2}{2(m_1+m_2)}(v_1-v_2)^2$只和相对速度有关，在每个惯性系里都一样。E 对：总动量$\vb P=M\vb v_{\mathrm C}$。

- id: p3
  tier: medium
  statement: |
    光滑水平面上，质量$3.0\,\mathrm{kg}$的小球以$5.0\,\mathrm{m/s}$正面撞上静止的、质量$2.0\,\mathrm{kg}$的小球，碰撞是弹性碰撞。碰后$3.0\,\mathrm{kg}$的小球的速度是多少？以$\mathrm{m/s}$为单位，以原来的运动方向为正。
  answer:
    type: number
    value: 2*(3*5/5) - 5
    unit: |
      $\mathrm{m/s}$
  hints:
    - |
      在质心系里，一维弹性碰撞后每个物体的速度反向。
    - |
      $v_{\mathrm C}=\frac{3.0\times5.0}{5.0}=3.0\,\mathrm{m/s}$。
    - |
      $v_1'=2v_{\mathrm C}-v_1=6.0-5.0=1.0\,\mathrm{m/s}$。
  solution: |
    质心的速度$v_{\mathrm C}=\frac{3.0\times5.0}{5.0}=3.0\,\mathrm{m/s}$。在质心系里，$3.0\,\mathrm{kg}$的小球碰前以$2.0\,\mathrm{m/s}$向前，碰后以$2.0\,\mathrm{m/s}$向后；换回原来的参考系，$v_1'=3.0-2.0=1.0\,\mathrm{m/s}$，仍然向前。被撞的球$v_2'=2v_{\mathrm C}-0=6.0\,\mathrm{m/s}$。

- id: p4
  tier: medium
  statement: |
    台球以$5.0\,\mathrm{m/s}$斜着撞上一个静止的同样的球，碰撞是弹性碰撞，碰后撞上去的球的速率是$3.0\,\mathrm{m/s}$。被撞的球的速率是多少？以$\mathrm{m/s}$为单位。
  answer:
    type: number
    value: sqrt(5^2 - 3^2)
    unit: |
      $\mathrm{m/s}$
  hints:
    - |
      等质量、被撞的球原来静止的弹性碰撞，碰后两个速度互相垂直。
    - |
      动量守恒：$\vb v_1=\vb v_1'+\vb v_2'$；动能守恒：$v_1^2=v_1'^2+v_2'^2$。
    - |
      $v_2'=\sqrt{25-9}=4.0\,\mathrm{m/s}$。
  solution: |
    质量相等时，动量守恒是$\vb v_1=\vb v_1'+\vb v_2'$，动能守恒是$v_1^2=v_1'^2+v_2'^2$，所以$v_2'=\sqrt{5.0^2-3.0^2}=4.0\,\mathrm{m/s}$。两个末速度互相垂直，撞上去的球偏离原方向的角度满足$\cos\theta=\frac35$，约$53^\circ$。

- id: p5
  tier: hard
  statement: |
    要把一个物体撞碎、撞变形，靠的是碰撞中能变成其他形式的那部分动能。

    （1）质量为$m$的物体以速度$v$撞上静止的、质量为$M$的物体，碰撞中最多有多少动能能变成其他形式？占原来动能的几分之几？

    （2）质量都是$m$的两个物体相向而行，速率都是$\frac v{\sqrt2}$，总动能和（1）里$M=m$时一样。最多有多少动能能变成其他形式？

    （3）从牛顿力学看，为什么粒子物理实验常用两束粒子迎头相撞的「对撞机」（collider），而不是用一束粒子去打静止的靶？
  hints:
    - |
      能转化的最多是质心系里的动能$K'$；质心的动能在碰撞前后不变。
    - |
      $K'=\frac{mM}{2(m+M)}v^2$；相向而行、动量相等时质心静止。
    - |
      比较两种做法里$K'$占总动能的比例。
  reference: |
    （1）碰撞前后质心的速度不变，质心的动能$\frac12(m+M)v_{\mathrm C}^2$不能变成别的形式，能转化的最多是$K'=\frac{mM}{2(m+M)}v^2$，即完全非弹性碰撞时的损失。它占原来动能$\frac12mv^2$的$\frac M{m+M}$；靶越轻，能用上的越少。

    （2）两者动量大小相等、方向相反，质心静止，$K'$就是全部动能$2\times\frac12m\cdot\frac{v^2}2=\frac12mv^2$，全部都能转化。（1）里$M=m$时只有一半。

    （3）打静止的靶，相当一部分动能被质心的运动占着，碰后产物还要带着这部分动能飞走，用不上；两束粒子迎头相撞，质心几乎静止，动能几乎都能用来产生新的东西。速度接近光速时这个差别大得多，要用狭义相对论计算。

- id: p6
  tier: hard
  statement: |
    质量为$m_1$的小球以$v$撞上静止的、质量为$m_2$的小球，发生弹性碰撞，$m_1>m_2$。

    （1）在原来的参考系里画速度图：撞上去的小球碰后的速度$\vb v_1'$的末端在一个圆上，求圆心和半径。

    （2）证明：撞上去的小球最多只能偏离原方向$\theta_{\max}$，$\sin\theta_{\max}=\frac{m_2}{m_1}$。

    （3）$m_1<m_2$时，最大偏离角是多少？
  hints:
    - |
      在质心系里，撞上去的小球碰后速率不变，等于$u_1=v-v_{\mathrm C}$，方向任意。
    - |
      $\vb v_1'=\vb v_{\mathrm C}+\vb u_1'$，$v_{\mathrm C}=\frac{m_1v}{m_1+m_2}$，$u_1=\frac{m_2v}{m_1+m_2}$。
    - |
      从原点向圆引切线，切线和$\vb v_{\mathrm C}$的夹角就是最大偏离角。
  reference: |
    （1）$v_{\mathrm C}=\frac{m_1v}{m_1+m_2}$，撞上去的小球在质心系里的速率是$u_1=v-v_{\mathrm C}=\frac{m_2v}{m_1+m_2}$。弹性碰撞后速率不变，方向可以是任意的，所以$\vb v_1'=\vb v_{\mathrm C}+\vb u_1'$的末端在以$\vb v_{\mathrm C}$的末端为圆心、$u_1$为半径的圆上。

    （2）$m_1>m_2$时$u_1<v_{\mathrm C}$，原点在圆外。$\vb v_1'$和原方向的夹角，在$\vb v_1'$沿圆的切线时最大，这时$\sin\theta_{\max}=\frac{u_1}{v_{\mathrm C}}=\frac{m_2}{m_1}$。例如质子打电子，偏离不超过约$0.03^\circ$，几乎不拐弯。

    （3）$m_1<m_2$时$u_1>v_{\mathrm C}$，原点在圆内，$\vb v_1'$可以指向任何方向，最大偏离角是$180^\circ$，即正面弹回；$m_1=m_2$时原点在圆上，就是几何图像里的情形。

- id: p7
  tier: thinking
  statement: |
    跳水运动员离开跳板后，在空中翻腾、伸展，空气的影响可以忽略。

    （1）他的质心怎样运动？身体怎样动，能不能改变它？

    （2）用柯尼希定理说明，他的动能可以分成哪两部分。

    （3）这两部分在空中各由什么改变？
  hints:
    - |
      外力只有地球的吸引；身体各部分之间的力是内力。
    - |
      $K=\frac12Mv_{\mathrm C}^2+K'$，$K'$是身体各部分相对质心运动的动能。
    - |
      质心的动能随下落怎样变？收拢、伸展身体时，肌肉做功吗？
  reference: |
    （1）外力只有地球的吸引，由质心运动定理，质心的加速度是$\vb g$，沿抛物线运动；身体各部分之间的力是内力，怎么动都改变不了质心的抛物线。

    （2）动能分成质心的动能$\frac12Mv_{\mathrm C}^2$，和身体各部分相对质心运动的动能$K'$，翻腾、甩动手脚的动能都在$K'$里。

    （3）质心的动能只随质心的运动变化，由重力做功决定，上升时减小、下落时增大。$K'$由内力改变：肌肉收拢、伸展身体时做功，翻腾的快慢就跟着变，可这些改变不影响质心的动能。

- id: p8
  tier: thinking
  statement: |
    静止的镭 226 原子核放出一个 α 粒子，变成氡 222 原子核；α 粒子的质量约是 4 个单位，氡核约 222 个单位。

    （1）在质心系里看，衰变后两部分的动量有什么关系？

    （2）两部分的动能之比是多少？α 粒子带走了总动能的百分之几？

    （3）为什么放射性衰变放出的 α 粒子几乎带走了全部动能？
  hints:
    - |
      衰变前原子核静止，原来的参考系就是质心系。
    - |
      动量大小相等时，动能$\frac{p^2}{2m}$和质量成反比。
    - |
      哪一部分轻得多？
  reference: |
    （1）衰变前原子核静止，原来的参考系就是质心系，总动量为零，衰变后两部分的动量等大反向。

    （2）动能$\frac{p^2}{2m}$和质量成反比，α 粒子和氡核的动能之比是$222:4$，α 粒子带走$\frac{222}{226}\approx98\%$。

    （3）动量相同时，轻的那部分速度大、动能大；α 粒子比剩下的原子核轻得多，所以几乎带走全部动能，原子核只稍稍「反冲」一下。
