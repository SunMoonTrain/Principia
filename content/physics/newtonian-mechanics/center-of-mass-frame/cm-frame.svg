  <line x1="230.0" y1="56.0" x2="187.0" y2="56.0" style="stroke: var(--good, #059669)" stroke-width="2.0" />
  <path d="M 180.0 56.0 L 188.0 52.3 L 188.0 59.7 Z" style="fill: var(--good, #059669)" />
  <text x="125.0" y="48.0" style="fill: var(--accent, #2563eb)" text-anchor="middle"><tspan font-style="italic">u</tspan></text>
  <text x="205.0" y="48.0" style="fill: var(--good, #059669)" text-anchor="middle"><tspan font-style="italic">u</tspan></text>
  <text x="18.0" y="197.0" fill="currentColor">碰后</text>
