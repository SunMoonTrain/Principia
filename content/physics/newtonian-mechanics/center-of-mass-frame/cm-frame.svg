<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-size="14">
  <!-- 两幅图看两个质量相等的球的弹性碰撞。左图是质心系：碰前两个球以大小相等的速度 u 沿水平线相向而行；碰后两个球仍以速率 u 背向飞开，速度方向转过了同一个角度，仍在一条直线上。右图是原来的参考系里的速度图：从原点 O 画出撞上去的球原来的速度 v1，它的中点是质心速度 vC 的末端；以这一点为圆心、u 为半径画一个圆，它经过 O 和 v1 的末端；碰后两个球的速度 v1′、v2′ 从 O 指向圆上一条直径的两端，两者互相垂直。 -->
  <text x="165.0" y="24.0" fill="currentColor" text-anchor="middle">质心系</text>
  <text x="18.0" y="87.0" fill="currentColor">碰前</text>
