- id: p1
  tier: easy
  statement: |
    水管的直径从$4.0\,\mathrm{cm}$缩小到$2.0\,\mathrm{cm}$，粗处的流速是$1.5\,\mathrm{m/s}$，水当作理想流体，定常流动。细处的流速是多少？以$\mathrm{m/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 1.5*(4.0/2.0)^2
    unit: |
      $\mathrm{m/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      单位时间流过各个截面的体积相同。
    - |
      $S_1v_1=S_2v_2$；截面积和直径的平方成正比。
    - |
      直径变成$\frac12$，截面积变成$\frac14$，流速变成$4$倍：$4\times1.5=6.0\,\mathrm{m/s}$。
  solution: |
    由连续性方程$S_1v_1=S_2v_2$。截面积和直径的平方成正比，直径减半，截面积变成原来的$\frac14$，所以$v_2=4v_1=6.0\,\mathrm{m/s}$。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？题中的流体都当作理想流体，流动都是定常的。
  answer:
    type: choice
    multiple: true
    options:
      - |
        定常流动里，流体各处的速度都相同
      - |
        水在截面处处相同的竖直管子里向下流，越往下流速越大
      - |
        水在截面处处相同的竖直管子里向下流，越往下压强越大
      - |
        从大水箱侧壁小孔流出的液体，流速和液体的密度无关，换成水银也一样
      - |
        截面处处相同的水平管子里，各处的压强都相等
    value: [3, 4, 5]
  hints:
    - |
      「定常」说的是每一点的流速不随时间变化，不是各点的流速相同。
    - |
      截面不变时，由连续性方程，流速处处一样；再看伯努利方程里剩下的两项。
    - |
      C、D、E 对；A、B 错。
  solution: |
    A 错：定常只要求每一点的流速不随时间变化，不同的点流速可以不同，管子细处就流得快。B 错：截面不变，由连续性方程流速处处相同。C 对：流速相同，$p+\rho gz$不变，越往下$z$越小，$p$越大。

    D 对：$v=\sqrt{2gh}$里没有密度，两端的压强都是大气压，密度在方程里约掉了。E 对：截面相同、高度相同，流速相同，压强也就相同。

- id: p3
  tier: medium
  statement: |
    大水箱的侧壁上开了一个小孔，孔在水面下$0.45\,\mathrm m$处，离地面$0.80\,\mathrm m$，水从孔里水平射出。水箱很大，水面下降得很慢，水的黏性和空气的阻力都不计。水落地的地方离水箱侧壁多远？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: 2*sqrt(0.45*0.80)
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      先求水从孔里射出的速率，再按平抛运动算落地的距离。
    - |
      $v=\sqrt{2gh}$，$h=0.45\,\mathrm m$；落下$H=0.80\,\mathrm m$用的时间是$\sqrt{\frac{2H}g}$。
    - |
      $x=v\sqrt{\frac{2H}g}=2\sqrt{hH}=2\sqrt{0.45\times0.80}=1.20\,\mathrm m$。
  solution: |
    由托里拆利定理，水射出的速率$v=\sqrt{2gh}$。射出后做平抛运动，落下$H$用的时间$t=\sqrt{\frac{2H}g}$，水平距离$x=vt=2\sqrt{hH}=2\sqrt{0.45\times0.80}=1.20\,\mathrm m$。结果和$g$无关；$h+H$一定时，孔开在正中间射得最远。

- id: p4
  tier: medium
  statement: |
    楼里的一根水管，一楼处管子的截面积是$S$，水的流速是$1.0\,\mathrm{m/s}$，压强是$3.0\times10^5\,\mathrm{Pa}$；比它高$12\,\mathrm m$的五楼处，管子的截面积是$\frac S2$。水当作理想流体，定常流动，$g$取$9.8\,\mathrm{m/s^2}$，水的密度是$1.0\times10^3\,\mathrm{kg/m^3}$。五楼处管里水的压强是多少？以$\mathrm{Pa}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 3.0e5 + 0.5*1.0e3*(1.0^2 - (2*1.0)^2) - 1.0e3*9.8*12
    unit: |
      $\mathrm{Pa}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      先由连续性方程求五楼处的流速，再沿流线用伯努利方程。
    - |
      $v_2=2.0\,\mathrm{m/s}$；$p_2=p_1+\frac12\rho(v_1^2-v_2^2)-\rho g\Delta z$。
    - |
      $p_2=3.0\times10^5-1.5\times10^3-1.176\times10^5\approx1.81\times10^5\,\mathrm{Pa}$。
  solution: |
    截面积减半，流速变成$2.0\,\mathrm{m/s}$。沿流线用伯努利方程：$p_2=p_1+\frac12\rho(v_1^2-v_2^2)-\rho g\Delta z$，代入数值，$p_2=3.0\times10^5-1.5\times10^3-1.176\times10^5\approx1.81\times10^5\,\mathrm{Pa}$。压强主要因为升高而减小，流速变化的影响只有约$1.5\times10^3\,\mathrm{Pa}$，约百分之一点五个大气压。

- id: p5
  tier: hard
  statement: |
    用一根粗细均匀的软管把水从大水桶里吸出来，这叫虹吸（siphon）。管子装满水以后，一端插在桶里的水面下，另一端在桶外，出口比桶里的水面低$h_1=0.50\,\mathrm m$；管子的最高点比桶里的水面高$h_2=0.30\,\mathrm m$。水当作理想流体，定常流动，大气压是$1.0\times10^5\,\mathrm{Pa}$，$g$取$9.8\,\mathrm{m/s^2}$。

    （1）出口处水的流速是多少？

    （2）管子最高点处水的压强是多少？

    （3）最高点比桶里的水面最多能高多少，虹吸还能进行？
  hints:
    - |
      从桶里的水面沿流线到出口：两端都是大气压，水面的流速可以当作零。
    - |
      管子粗细均匀，最高点的流速和出口一样；再从水面到最高点用伯努利方程。
    - |
      最高点的压强$p_0-\rho g(h_1+h_2)$不能小于零。
  reference: |
    （1）从水面到出口，两端都是大气压，水面的流速可以当作零：$\rho gh_1=\frac12\rho v^2$，$v=\sqrt{2gh_1}=\sqrt{2\times9.8\times0.50}\approx3.13\,\mathrm{m/s}$。

    （2）管子粗细均匀，最高点的流速也是$v$。从水面到最高点：$p_0=p+\frac12\rho v^2+\rho gh_2$，而$\frac12\rho v^2=\rho gh_1$，所以$p=p_0-\rho g(h_1+h_2)=1.0\times10^5-1.0\times10^3\times9.8\times0.80\approx9.22\times10^4\,\mathrm{Pa}$，比大气压低。

    （3）$p$不能小于零，$h_1+h_2\le\frac{p_0}{\rho g}\approx10.2\,\mathrm m$，所以$h_2$最多约$10.2-0.50\approx9.7\,\mathrm m$。实际上压强降得很低时水会汽化，管子里出现气泡，能做到的高度还要低一些。

- id: p6
  tier: hard
  statement: |
    圆柱形水箱的横截面积是$S$，底部开了一个面积为$s$的小孔，$s$比$S$小得多，开始时水深$H$。水当作理想流体，每一时刻都可以用托里拆利定理。

    （1）写出水深$h$随时间$t$变化的方程。

    （2）验证$h(t)=\Bigl(\sqrt H-\frac sS\sqrt{\frac g2}\,t\Bigr)^2$满足这个方程和初始条件，求水流完要多长时间。

    （3）$S=0.50\,\mathrm{m^2}$、$s=2.0\,\mathrm{cm^2}$、$H=1.0\,\mathrm m$、$g$取$9.8\,\mathrm{m/s^2}$时，水流完要多久？前一半的水流出去用的时间，比总时间的一半多还是少？
  hints:
    - |
      水面下降的速率是$-\dv ht$，由连续性方程，$S\Bigl(-\dv ht\Bigr)=sv$，$v=\sqrt{2gh}$。
    - |
      记$c=\frac sS\sqrt{\frac g2}$，$h=(\sqrt H-ct)^2$，$\dv ht=-2c(\sqrt H-ct)=-2c\sqrt h$。
    - |
      流完时$\sqrt H=ct$，$T=\frac Ss\sqrt{\frac{2H}g}$；前一半的水流完时$h=\frac H2$。
  reference: |
    （1）由连续性方程，$S\Bigl(-\dv ht\Bigr)=s\sqrt{2gh}$，即$\dv ht=-\frac sS\sqrt{2gh}$。

    （2）记$c=\frac sS\sqrt{\frac g2}$，则$2c=\frac sS\sqrt{2g}$。$h=(\sqrt H-ct)^2$时$\dv ht=-2c(\sqrt H-ct)=-2c\sqrt h=-\frac sS\sqrt{2gh}$，满足方程，$h(0)=H$也满足。$\sqrt H-ct=0$时水流完，$T=\frac{\sqrt H}c=\frac Ss\sqrt{\frac{2H}g}$。

    （3）$T=\frac{0.50}{2.0\times10^{-4}}\times\sqrt{\frac{2\times1.0}{9.8}}\approx1.13\times10^3\,\mathrm s$，约$19$分钟。前一半的水流完时$\sqrt H-ct=\sqrt{\frac H2}$，$t=\Bigl(1-\frac1{\sqrt2}\Bigr)T\approx0.29T$，比总时间的一半少得多：水深时流得快，越到后来流得越慢。

- id: p7
  tier: thinking
  statement: |
    伯努利方程只沿同一条流线成立。

    （1）为什么一般说来，不同流线上$p+\frac12\rho v^2+\rho gz$的值可以不同？

    （2）水从一个很大的、原来静止的水池里平稳地流出来，为什么各条流线上的这个值都相同？
  hints:
    - |
      证明里跟着的是哪一块流体？它走过的是哪条曲线？
    - |
      顺着流线往上游找，每条流线都从哪里来？
    - |
      静止的、连成一片的液体里，$p+\rho gz$处处相同。
  reference: |
    （1）证明只跟着一小块流体，用的是它沿自己那条流线受的力和做的功，从头到尾没有把不同流线上的流体联系起来，所以每条流线可以有各自的常量。比如水在旋转着流动时，靠近中心和远离中心的流线，这个值就可以不同。

    （2）顺着流线往上游找，每条流线都来自大水池里几乎静止的水。那里$v\approx0$，而静止的、连成一片的水里$p+\rho gz$处处相同，所以每条流线带着的常量都一样，可以在任意两点之间用伯努利方程，不必在同一条流线上。

- id: p8
  tier: thinking
  statement: |
    自来水在很长的水平管道里流动，管子粗细处处一样。测量发现，下游的压强比上游的低。这和伯努利方程矛盾吗？下游的压强低，水为什么还能往下游流？
  hints:
    - |
      伯努利方程要求什么样的流体？
    - |
      管子粗细不变，由连续性方程，流速处处一样，动能没有变。
    - |
      压强差做的功到哪里去了？
  reference: |
    不矛盾。伯努利方程要求理想流体，真实的水有黏性，相邻的水层之间、水和管壁之间互相拖拽，会把一部分机械能变成内能。管子粗细不变，流速处处一样，动能和重力势能都不变，所以压强沿着管道越来越低，压强差做的功正好补上拖拽损失的能量。

    水往下游流，是因为上游的压强大、下游的压强小，压强差推着它前进，正好抵消黏性的拖拽，流速才保持不变。要是两端的压强一样，黏性会让水越流越慢，最后停下来。
