id: physics.newtonian-mechanics
title: |
  牛顿力学
proofPolicy: sketch
macros:
  \vb: |
    \mathbf{#1}
  \uv: |
    \hat{\mathbf{#1}}
  \dd: |
    \mathop{}\!\mathrm{d}
  \dv: |
    \frac{\mathrm{d} #1}{\mathrm{d} #2}
glossary:
  - id: physics.newtonian-mechanics.displacement
    zh: |
      位移
    en: |
      displacement
    brief: |
      质点从一个时刻到另一个时刻位置坐标的改变$\Delta x=x(t_2)-x(t_1)$；只看起点和终点，正负表示方向。
    definedIn: physics.newtonian-mechanics.kinematics-1d
    anchor: def-displacement
  - id: physics.newtonian-mechanics.velocity
    zh: |
      速度
    en: |
      velocity
    brief: |
      位置对时间的导数$v=\dv xt$，即时间段趋于零时平均速度的极限；正负表示运动方向。
    definedIn: physics.newtonian-mechanics.kinematics-1d
    anchor: def-velocity
  - id: physics.newtonian-mechanics.acceleration
    zh: |
      加速度
    en: |
      acceleration
    brief: |
      速度对时间的导数$a=\dv vt$；和速度同号时速度的绝对值增大，异号时减小。
    definedIn: physics.newtonian-mechanics.kinematics-1d
    anchor: def-acceleration
  - id: physics.newtonian-mechanics.initial-conditions
    zh: |
      初始条件
    en: |
      initial conditions
    brief: |
      某一时刻质点的位置和速度；知道加速度和初始条件，求两次原函数就确定了运动。
    definedIn: physics.newtonian-mechanics.kinematics-1d
    anchor: thm-motion
  - id: physics.newtonian-mechanics.uniformly-accelerated-motion
    zh: |
      匀变速直线运动
    en: |
      uniformly accelerated motion
    brief: |
      加速度不变的直线运动：$v=v_0+at$，$x=x_0+v_0t+\frac12at^2$，$v^2-v_0^2=2a(x-x_0)$。
    definedIn: physics.newtonian-mechanics.kinematics-1d
    anchor: def-uniform
  - id: physics.newtonian-mechanics.gravitational-acceleration
    zh: |
      重力加速度
    en: |
      gravitational acceleration
    brief: |
      地面附近不计空气阻力时物体下落的加速度，竖直向下，各种物体都相同，约$9.8\,\mathrm{m/s^2}$，记作$g$。
    definedIn: physics.newtonian-mechanics.kinematics-1d
    anchor: def-g
  - id: physics.newtonian-mechanics.speed
    zh: |
      速率
    en: |
      speed
    brief: |
      速度矢量的大小$v=|\vb v|$；速率不变时速度的方向仍可以变。
    definedIn: physics.newtonian-mechanics.kinematics-vectors
    anchor: def-velocity-vector
  - id: physics.newtonian-mechanics.projectile-motion
    zh: |
      抛体运动
    en: |
      projectile motion
    brief: |
      不计空气阻力、加速度始终为$g$的运动：水平方向匀速，竖直方向匀变速，轨迹是抛物线。
    definedIn: physics.newtonian-mechanics.kinematics-vectors
    anchor: def-projectile
  - id: physics.newtonian-mechanics.angular-velocity
    zh: |
      角速度
    en: |
      angular velocity
    brief: |
      圆周运动中转过的角对时间的导数$\omega=\dv\theta t$，单位$\mathrm{rad/s}$，逆时针为正；速率$v=r|\omega|$。
    definedIn: physics.newtonian-mechanics.circular-motion
    anchor: def-angular-velocity
  - id: physics.newtonian-mechanics.uniform-circular-motion
    zh: |
      匀速圆周运动
    en: |
      uniform circular motion
    brief: |
      角速度不变的圆周运动；速率不变，速度的方向一直在变，加速度指向圆心。
    definedIn: physics.newtonian-mechanics.circular-motion
    anchor: def-angular-velocity
  - id: physics.newtonian-mechanics.centripetal-acceleration
    zh: |
      向心加速度
    en: |
      centripetal acceleration
    brief: |
      圆周运动的加速度中指向圆心的分量，大小$\frac{v^2}r=\omega^2r$；它只改变速度的方向。
    definedIn: physics.newtonian-mechanics.circular-motion
    anchor: thm-centripetal
  - id: physics.newtonian-mechanics.tangential-acceleration
    zh: |
      切向加速度
    en: |
      tangential acceleration
    brief: |
      圆周运动的加速度中沿切线的分量$\dv vt=r\alpha$；它只改变速率，速率不变时为零。
    definedIn: physics.newtonian-mechanics.circular-motion
    anchor: thm-tangential
  - id: physics.newtonian-mechanics.reference-frame
    zh: |
      参考系
    en: |
      reference frame
    brief: |
      描述运动时选作标准的物体，连同固定在它上面的坐标系和钟；位置、速度都是相对参考系说的。
    definedIn: physics.newtonian-mechanics.relative-motion
    anchor: def-frame
  - id: physics.newtonian-mechanics.galilean-transformation
    zh: |
      伽利略变换
    en: |
      Galilean transformation
    brief: |
      参考系$S'$相对$S$以不变的$\vb u$运动时，$\vb r'=\vb r-\vb ut$，$\vb v'=\vb v-\vb u$，$\vb a'=\vb a$。
    definedIn: physics.newtonian-mechanics.relative-motion
    anchor: thm-galilean
  - id: physics.newtonian-mechanics.inertial-frame
    zh: |
      惯性系
    en: |
      inertial frame
    brief: |
      不受其他物体作用的质点在其中保持静止或匀速直线运动的参考系；相对它匀速运动的参考系也是惯性系。
    definedIn: physics.newtonian-mechanics.newtons-laws
    anchor: def-inertial-frame
  - id: physics.newtonian-mechanics.newtons-first-law
    zh: |
      牛顿第一定律
    en: |
      Newton's first law
    brief: |
      惯性系存在；在惯性系里，不受其他物体作用的质点保持静止或匀速直线运动。
    definedIn: physics.newtonian-mechanics.newtons-laws
    anchor: thm-first-law
  - id: physics.newtonian-mechanics.inertia
    zh: |
      惯性
    en: |
      inertia
    brief: |
      物体保持原有速度的性质；不受作用时速度不变，质量越大，速度越难改变。
    definedIn: physics.newtonian-mechanics.newtons-laws
    anchor: thm-first-law
  - id: physics.newtonian-mechanics.mass
    zh: |
      质量
    en: |
      mass
    brief: |
      两个质点只相互作用时，在惯性系里加速度大小之比的反比给出质量之比；它量的是惯性的大小，单位$\mathrm{kg}$。
    definedIn: physics.newtonian-mechanics.newtons-laws
    anchor: def-mass
  - id: physics.newtonian-mechanics.force
    zh: |
      力
    en: |
      force
    brief: |
      其他物体对质点的作用，用它在惯性系里使质点产生的加速度量：$\vb F=m\vb a$，是矢量，单位$\mathrm N$。
    definedIn: physics.newtonian-mechanics.newtons-laws
    anchor: def-force
  - id: physics.newtonian-mechanics.net-force
    zh: |
      合力
    en: |
      net force
    brief: |
      同时作用于质点的各个力的矢量和；在惯性系里它等于质量乘加速度。
    definedIn: physics.newtonian-mechanics.newtons-laws
    anchor: thm-second-law
  - id: physics.newtonian-mechanics.newtons-second-law
    zh: |
      牛顿第二定律
    en: |
      Newton's second law
    brief: |
      在惯性系里，作用于质点的各个力按矢量相加，合力等于质量乘加速度：$m\vb a=\vb F$。
    definedIn: physics.newtonian-mechanics.newtons-laws
    anchor: thm-second-law
  - id: physics.newtonian-mechanics.newtons-third-law
    zh: |
      牛顿第三定律
    en: |
      Newton's third law
    brief: |
      两个质点相互作用时，彼此施加的力大小相等、方向相反，在同一条直线上，分别作用在两个质点上。
    definedIn: physics.newtonian-mechanics.newtons-laws
    anchor: thm-third-law
  - id: physics.newtonian-mechanics.equation-of-motion
    zh: |
      运动方程
    en: |
      equation of motion
    brief: |
      把合力写成位置、速度和时间的函数后的第二定律$m\frac{\dd^2\vb r}{\dd t^2}=\vb F$；加上初始条件就确定了运动。
    definedIn: physics.newtonian-mechanics.newtons-laws
    anchor: def-equation-of-motion
  - id: physics.newtonian-mechanics.torque
    zh: |
      力矩
    en: |
      torque
    brief: |
      力对参考点$O$的力矩$\boldsymbol\tau=\vb r\times\vb F$，$\vb r$从$O$指向受力的质点；大小等于力乘力臂。
    definedIn: physics.newtonian-mechanics.angular-momentum
    anchor: def-torque
  - id: physics.newtonian-mechanics.moment-arm
    zh: |
      力臂
    en: |
      moment arm
    brief: |
      参考点到力的作用线的距离$d=r\sin\varphi$；力矩的大小是$Fd$。
    definedIn: physics.newtonian-mechanics.angular-momentum
    anchor: def-torque
  - id: physics.newtonian-mechanics.couple
    zh: |
      力偶
    en: |
      couple
    brief: |
      大小相等、方向相反、作用线不重合的两个力；合力为零，力矩之和$(\vb r_1-\vb r_2)\times\vb F$和参考点无关。
    definedIn: physics.newtonian-mechanics.angular-momentum
    anchor: def-couple
  - id: physics.newtonian-mechanics.angular-momentum
    zh: |
      角动量
    en: |
      angular momentum
    brief: |
      质点对参考点$O$的角动量$\vb L=\vb r\times m\vb v$；绕$O$做圆周运动时大小是$mr^2\omega$。
    definedIn: physics.newtonian-mechanics.angular-momentum
    anchor: def-angular-momentum
  - id: physics.newtonian-mechanics.conservation-of-angular-momentum
    zh: |
      角动量守恒
    en: |
      conservation of angular momentum
    brief: |
      在惯性系里，合力对固定点$O$的力矩一直为零时，质点对$O$的角动量不变。
    definedIn: physics.newtonian-mechanics.angular-momentum
    anchor: thm-conservation
  - id: physics.newtonian-mechanics.weight
    zh: |
      重力
    en: |
      weight
    brief: |
      地面附近地球对物体的吸引力$\vb G=m\vb g$，竖直向下，和质量成正比。
    definedIn: physics.newtonian-mechanics.common-forces
    anchor: def-weight
  - id: physics.newtonian-mechanics.elastic-force
    zh: |
      弹力
    en: |
      elastic force
    brief: |
      物体发生形变后，要恢复原状而对和它接触的物体施加的力；支持力、拉力、弹簧的力都是弹力。
    definedIn: physics.newtonian-mechanics.common-forces
    anchor: def-elastic
  - id: physics.newtonian-mechanics.hookes-law
    zh: |
      胡克定律
    en: |
      Hooke's law
    brief: |
      弹簧伸长或压缩$x$时弹力的大小是$kx$，方向指向恢复原长的一侧；形变不太大时成立。
    definedIn: physics.newtonian-mechanics.common-forces
    anchor: def-hooke
  - id: physics.newtonian-mechanics.spring-constant
    zh: |
      劲度系数
    en: |
      spring constant
    brief: |
      胡克定律$F=kx$里的比例系数$k$，单位$\mathrm{N/m}$，由弹簧本身决定，越硬越大。
    definedIn: physics.newtonian-mechanics.common-forces
    anchor: def-hooke
  - id: physics.newtonian-mechanics.normal-force
    zh: |
      支持力
    en: |
      normal force
    brief: |
      支持面对压在它上面的物体的弹力，垂直于接触面、指向物体；大小要由运动和其他力算出。
    definedIn: physics.newtonian-mechanics.common-forces
    anchor: def-normal
  - id: physics.newtonian-mechanics.tension
    zh: |
      拉力
    en: |
      tension
    brief: |
      拉紧的绳子对两端物体的弹力，沿着绳子、指向绳子中间；轻绳各处的拉力一样大。
    definedIn: physics.newtonian-mechanics.common-forces
    anchor: def-tension
  - id: physics.newtonian-mechanics.light-string
    zh: |
      轻绳
    en: |
      light string
    brief: |
      质量可以不计的绳子；它的每一段合力都是零，所以拉力处处相同。
    definedIn: physics.newtonian-mechanics.common-forces
    anchor: def-tension
  - id: physics.newtonian-mechanics.centripetal-force
    zh: |
      向心力
    en: |
      centripetal force
    brief: |
      做圆周运动的物体所受合力指向圆心的分量$\frac{mv^2}r$；它不是新的一种力，而是各个力的合力的分量。
    definedIn: physics.newtonian-mechanics.circular-dynamics
    anchor: def-centripetal-force
  - id: physics.newtonian-mechanics.free-body-diagram
    zh: |
      受力图
    en: |
      free-body diagram
    brief: |
      把研究的物体单独画出来，标出其他物体对它施加的每一个力的图；物体对别人的力、合力都不画。
    definedIn: physics.newtonian-mechanics.free-body-diagrams
    anchor: def-fbd
  - id: physics.newtonian-mechanics.connected-bodies
    zh: |
      连接体
    en: |
      connected bodies
    brief: |
      用绳、杆连着或互相挤压、一起运动的几个物体；常用整体法求共同的加速度，用隔离法求它们之间的力。
    definedIn: physics.newtonian-mechanics.free-body-diagrams
    anchor: def-connected
  - id: physics.newtonian-mechanics.whole-system-method
    zh: |
      整体法
    en: |
      whole-system method
    brief: |
      把加速度相同的几个物体当作一个整体，只考虑外界对整体的力；物体之间的相互作用成对抵消。
    definedIn: physics.newtonian-mechanics.free-body-diagrams
    anchor: def-connected
  - id: physics.newtonian-mechanics.friction
    zh: |
      摩擦力
    en: |
      friction
    brief: |
      互相接触的两个物体之间，沿接触面、阻碍它们相对滑动的力；分静摩擦力和滑动摩擦力。
    definedIn: physics.newtonian-mechanics.friction
    anchor: def-friction
  - id: physics.newtonian-mechanics.static-friction
    zh: |
      静摩擦力
    en: |
      static friction
    brief: |
      两个物体相对静止时的摩擦力；大小等于保持相对静止所需的值，不超过最大静摩擦力$\mu_{\mathrm s}N$。
    definedIn: physics.newtonian-mechanics.friction
    anchor: def-friction
  - id: physics.newtonian-mechanics.kinetic-friction
    zh: |
      滑动摩擦力
    en: |
      kinetic friction
    brief: |
      两个物体相对滑动时的摩擦力，大小$\mu_{\mathrm k}N$，方向和物体相对接触面的速度相反。
    definedIn: physics.newtonian-mechanics.friction
    anchor: def-friction
  - id: physics.newtonian-mechanics.maximum-static-friction
    zh: |
      最大静摩擦力
    en: |
      maximum static friction
    brief: |
      静摩擦力能达到的上限$\mu_{\mathrm s}N$；需要的静摩擦力超过它，两个物体就开始相对滑动。
    definedIn: physics.newtonian-mechanics.friction
    anchor: def-max-static
  - id: physics.newtonian-mechanics.coefficient-of-static-friction
    zh: |
      静摩擦因数
    en: |
      coefficient of static friction
    brief: |
      最大静摩擦力和支持力之比$\mu_{\mathrm s}$，由两个接触面的材料和状况决定。
    definedIn: physics.newtonian-mechanics.friction
    anchor: def-max-static
  - id: physics.newtonian-mechanics.coefficient-of-kinetic-friction
    zh: |
      动摩擦因数
    en: |
      coefficient of kinetic friction
    brief: |
      滑动摩擦力和支持力之比$\mu_{\mathrm k}$，一般比静摩擦因数略小。
    definedIn: physics.newtonian-mechanics.friction
    anchor: def-kinetic
  - id: physics.newtonian-mechanics.isolation-method
    zh: |
      隔离法
    en: |
      isolation method
    brief: |
      把连接体中的一个物体单独隔离出来，对它画受力图、列牛顿第二定律；求物体之间的力要用它。
    definedIn: physics.newtonian-mechanics.free-body-diagrams
    anchor: def-connected
  - id: physics.newtonian-mechanics.central-force
    zh: |
      有心力
    en: |
      central force
    brief: |
      作用线总通过一个固定点（力心）的力；它对力心的力矩为零，质点对力心的角动量守恒。
    definedIn: physics.newtonian-mechanics.angular-momentum
    anchor: thm-conservation
  - id: physics.newtonian-mechanics.angular-acceleration
    zh: |
      角加速度
    en: |
      angular acceleration
    brief: |
      角速度对时间的导数$\alpha=\dv\omega t$；圆周运动的切向加速度是$r\alpha$。
    definedIn: physics.newtonian-mechanics.circular-motion
    anchor: thm-tangential
  - id: physics.newtonian-mechanics.momentum
    zh: |
      动量
    en: |
      momentum
    brief: |
      质点的质量和速度的乘积$\vb p=m\vb v$，是矢量；质量不变时，合力等于它的变化率$\dv{\vb p}t$。
    definedIn: physics.newtonian-mechanics.momentum-impulse
    anchor: def-momentum
  - id: physics.newtonian-mechanics.impulse
    zh: |
      冲量
    en: |
      impulse
    brief: |
      力对时间的积分$\vb J=\int_{t_1}^{t_2}\vb F\,\dd t$；力不变时是$\vb F\Delta t$。
    definedIn: physics.newtonian-mechanics.momentum-impulse
    anchor: def-impulse
  - id: physics.newtonian-mechanics.impulse-momentum-theorem
    zh: |
      动量定理
    en: |
      impulse–momentum theorem
    brief: |
      质点受的合力在一段时间里的冲量，等于这段时间里质点动量的改变。
    definedIn: physics.newtonian-mechanics.momentum-impulse
    anchor: thm-impulse-momentum
  - id: physics.newtonian-mechanics.average-force
    zh: |
      平均力
    en: |
      average force
    brief: |
      一段时间里力的冲量除以这段时间，$\bar{\vb F}=\frac{\vb J}{\Delta t}$，即同样时间里给出同样冲量的恒力。
    definedIn: physics.newtonian-mechanics.momentum-impulse
    anchor: def-average-force
  - id: physics.newtonian-mechanics.system-of-particles
    zh: |
      质点系
    en: |
      system of particles
    brief: |
      合在一起研究的几个质点；系统内质点之间的力是内力，系统外的物体给的力是外力。
    definedIn: physics.newtonian-mechanics.momentum-conservation
    anchor: def-system
  - id: physics.newtonian-mechanics.internal-force
    zh: |
      内力
    en: |
      internal force
    brief: |
      质点系里各质点之间的力；由牛顿第三定律成对出现、等大反向，加起来为零。
    definedIn: physics.newtonian-mechanics.momentum-conservation
    anchor: def-system
  - id: physics.newtonian-mechanics.external-force
    zh: |
      外力
    en: |
      external force
    brief: |
      质点系以外的物体对系统里质点的力；外力之和决定系统总动量的变化。
    definedIn: physics.newtonian-mechanics.momentum-conservation
    anchor: def-system
  - id: physics.newtonian-mechanics.center-of-mass
    zh: |
      质心
    en: |
      center of mass
    brief: |
      质点系各质点位置按质量加权的平均$\vb r_{\mathrm C}=\frac1M\sum m_i\vb r_i$；总动量等于$M\vb v_{\mathrm C}$。
    definedIn: physics.newtonian-mechanics.momentum-conservation
    anchor: def-center-of-mass
  - id: physics.newtonian-mechanics.center-of-mass-theorem
    zh: |
      质心运动定理
    en: |
      center-of-mass theorem
    brief: |
      惯性系里，质点系受的外力之和等于总质量乘质心的加速度，内力不影响质心的运动。
    definedIn: physics.newtonian-mechanics.momentum-conservation
    anchor: thm-cm-motion
  - id: physics.newtonian-mechanics.conservation-of-momentum
    zh: |
      动量守恒
    en: |
      conservation of momentum
    brief: |
      质点系受的外力之和为零时，总动量保持不变，质心静止或做匀速直线运动。
    definedIn: physics.newtonian-mechanics.momentum-conservation
    anchor: thm-momentum-conservation
  - id: physics.newtonian-mechanics.work
    zh: |
      功
    en: |
      work
    brief: |
      恒力沿直线时是$\vb F\cdot\Delta\vb r$；一般是功率对时间的积分$\int\vb F\cdot\vb v\,\dd t$，单位焦耳。
    definedIn: physics.newtonian-mechanics.work-energy
    anchor: def-work
  - id: physics.newtonian-mechanics.power
    zh: |
      功率
    en: |
      power
    brief: |
      力做功的快慢$P=\vb F\cdot\vb v$，单位瓦特；力和速度垂直时为零。
    definedIn: physics.newtonian-mechanics.work-energy
    anchor: def-power
  - id: physics.newtonian-mechanics.kinetic-energy
    zh: |
      动能
    en: |
      kinetic energy
    brief: |
      质点的$K=\frac12mv^2$，是标量，只和速率有关。
    definedIn: physics.newtonian-mechanics.work-energy
    anchor: def-kinetic-energy
  - id: physics.newtonian-mechanics.work-energy-theorem
    zh: |
      动能定理
    en: |
      work-energy theorem
    brief: |
      合力做的功等于质点动能的改变；动能的变化率等于合力的功率$\vb F\cdot\vb v$。
    definedIn: physics.newtonian-mechanics.work-energy
    anchor: thm-work-energy
  - id: physics.newtonian-mechanics.recoil
    zh: |
      反冲
    en: |
      recoil
    brief: |
      原来静止的物体在内力作用下分成两部分，总动量仍为零，两部分朝相反方向运动，速度和质量成反比。
    definedIn: physics.newtonian-mechanics.rockets
    anchor: def-recoil
  - id: physics.newtonian-mechanics.variable-mass-system
    zh: |
      变质量系统
    en: |
      variable-mass system
    brief: |
      不断有质量离开或并入的物体；要把离开、并入的部分算进系统，再用动量守恒。
    definedIn: physics.newtonian-mechanics.rockets
    anchor: def-variable-mass
  - id: physics.newtonian-mechanics.exhaust-velocity
    zh: |
      排气速度
    en: |
      exhaust velocity
    brief: |
      火箭喷出的燃气相对火箭的速度大小$u$。
    definedIn: physics.newtonian-mechanics.rockets
    anchor: def-thrust
  - id: physics.newtonian-mechanics.elastic-collision
    zh: |
      弹性碰撞
    en: |
      elastic collision
    brief: |
      碰撞前后系统的总动能不变的碰撞；一维时碰后的相对速度和碰前大小相等、方向相反。
    definedIn: physics.newtonian-mechanics.collisions
    anchor: def-collision
  - id: physics.newtonian-mechanics.inelastic-collision
    zh: |
      非弹性碰撞
    en: |
      inelastic collision
    brief: |
      碰撞前后总动量守恒、总动能减少的碰撞，少了的动能变成内能、声音等。
    definedIn: physics.newtonian-mechanics.collisions
    anchor: def-collision
  - id: physics.newtonian-mechanics.perfectly-inelastic-collision
    zh: |
      完全非弹性碰撞
    en: |
      perfectly inelastic collision
    brief: |
      碰后两个物体粘在一起、速度相同的碰撞；同样的质量和相对速度下损失的动能最多。
    definedIn: physics.newtonian-mechanics.collisions
    anchor: def-collision
  - id: physics.newtonian-mechanics.center-of-mass-frame
    zh: |
      质心系
    en: |
      center-of-mass frame
    brief: |
      原点随质心运动、坐标轴方向不变的参考系；质点系在其中的总动量为零。
    definedIn: physics.newtonian-mechanics.center-of-mass-frame
    anchor: def-cm-frame
  - id: physics.newtonian-mechanics.koenigs-theorem
    zh: |
      柯尼希定理
    en: |
      König's theorem
    brief: |
      质点系的总动能等于质心的动能$\frac12Mv_{\mathrm C}^2$加上它在质心系里的动能。
    definedIn: physics.newtonian-mechanics.center-of-mass-frame
    anchor: thm-koenig
  - id: physics.newtonian-mechanics.thrust
    zh: |
      推力
    en: |
      thrust
    brief: |
      燃气对火箭向前的反作用力，大小是排气速度乘每秒喷出的质量$u\bigl|\dv mt\bigr|$。
    definedIn: physics.newtonian-mechanics.rockets
    anchor: def-thrust
  - id: physics.newtonian-mechanics.conservative-force
    zh: |
      保守力
    en: |
      conservative force
    brief: |
      做的功只取决于起点和终点、和路径无关的力，例如重力、弹簧的弹力；它有势能。
    definedIn: physics.newtonian-mechanics.potential-energy
    anchor: def-conservative-force
  - id: physics.newtonian-mechanics.nonconservative-force
    zh: |
      非保守力
    en: |
      nonconservative force
    brief: |
      做的功和路径有关的力，例如滑动摩擦力；它没有势能。
    definedIn: physics.newtonian-mechanics.potential-energy
    anchor: def-conservative-force
  - id: physics.newtonian-mechanics.potential-energy
    zh: |
      势能
    en: |
      potential energy
    brief: |
      保守力的位置函数$U$，保守力从$A$到$B$做的功$W_{AB}=U(A)-U(B)$；参考点处取零。
    definedIn: physics.newtonian-mechanics.potential-energy
    anchor: def-potential-energy
  - id: physics.newtonian-mechanics.gravitational-potential-energy
    zh: |
      重力势能
    en: |
      gravitational potential energy
    brief: |
      重力的势能$U=mgh$，$h$是比参考点高出的高度，可正可负。
    definedIn: physics.newtonian-mechanics.potential-energy
    anchor: def-gravitational-pe
  - id: physics.newtonian-mechanics.elastic-potential-energy
    zh: |
      弹性势能
    en: |
      elastic potential energy
    brief: |
      弹簧弹力的势能$U=\frac12kx^2$，$x$是伸长量或压缩量，原长时为零。
    definedIn: physics.newtonian-mechanics.potential-energy
    anchor: def-gravitational-pe
  - id: physics.newtonian-mechanics.mechanical-energy
    zh: |
      机械能
    en: |
      mechanical energy
    brief: |
      质点的动能和势能之和$E=K+U$。
    definedIn: physics.newtonian-mechanics.potential-energy
    anchor: def-mechanical-energy
  - id: physics.newtonian-mechanics.conservation-of-mechanical-energy
    zh: |
      机械能守恒
    en: |
      conservation of mechanical energy
    brief: |
      只有保守力做功、别的力不做功时，质点的机械能保持不变。
    definedIn: physics.newtonian-mechanics.potential-energy
    anchor: thm-mechanical-energy
  - id: physics.newtonian-mechanics.potential-energy-curve
    zh: |
      势能曲线
    en: |
      potential energy curve
    brief: |
      势能$U$随位置$x$变化的曲线；画上高度为机械能$E$的水平线，两者的距离是动能，质点只能在$U\le E$处。
    definedIn: physics.newtonian-mechanics.energy-diagrams
    anchor: def-potential-curve
  - id: physics.newtonian-mechanics.turning-point
    zh: |
      转折点
    en: |
      turning point
    brief: |
      势能等于机械能$E$、力不为零的点；质点到那里速度为零，随即掉头。
    definedIn: physics.newtonian-mechanics.energy-diagrams
    anchor: def-turning-point
  - id: physics.newtonian-mechanics.stable-equilibrium
    zh: |
      稳定平衡
    en: |
      stable equilibrium
    brief: |
      质点稍稍离开后力把它推回来的平衡位置，在势能的极小值点；$U'=0$、$U''>0$处一定是。
    definedIn: physics.newtonian-mechanics.energy-diagrams
    anchor: def-equilibrium
  - id: physics.newtonian-mechanics.unstable-equilibrium
    zh: |
      不稳定平衡
    en: |
      unstable equilibrium
    brief: |
      质点稍稍离开后力把它推得更远的平衡位置，例如势能的极大值点；$U'=0$、$U''<0$处一定是。
    definedIn: physics.newtonian-mechanics.energy-diagrams
    anchor: def-equilibrium
  - id: physics.newtonian-mechanics.drag
    zh: |
      阻力
    en: |
      drag
    brief: |
      物体在空气、水里运动时，流体对它的、和它相对流体的速度方向相反的力，速率越大阻力越大。
    definedIn: physics.newtonian-mechanics.drag
    anchor: def-drag
  - id: physics.newtonian-mechanics.linear-drag
    zh: |
      线性阻力
    en: |
      linear drag
    brief: |
      大小和速率成正比的阻力$bv$，适用于黏稠流体里很小、很慢的物体。
    definedIn: physics.newtonian-mechanics.drag
    anchor: def-drag
  - id: physics.newtonian-mechanics.quadratic-drag
    zh: |
      平方阻力
    en: |
      quadratic drag
    brief: |
      大小和速率的平方成正比的阻力$cv^2$，适用于空气里较大、较快的物体，如雨滴、跳伞的人。
    definedIn: physics.newtonian-mechanics.drag
    anchor: def-drag
  - id: physics.newtonian-mechanics.terminal-velocity
    zh: |
      终端速度
    en: |
      terminal velocity
    brief: |
      阻力和重力相等时的下落速度，线性阻力时$\frac{mg}b$，平方阻力时$\sqrt{\frac{mg}c}$；从静止下落的物体越来越接近它。
    definedIn: physics.newtonian-mechanics.drag
    anchor: def-terminal-velocity
  - id: physics.newtonian-mechanics.gravitation
    zh: |
      万有引力
    en: |
      gravitation
    brief: |
      任意两个有质量的物体之间的相互吸引；两个质点之间的大小是$\frac{Gm_1m_2}{r^2}$，方向沿连线。简称引力。
    definedIn: physics.newtonian-mechanics.gravitation
    anchor: def-gravitation
  - id: physics.newtonian-mechanics.law-of-gravitation
    zh: |
      万有引力定律
    en: |
      law of universal gravitation
    brief: |
      任意两个质点相互吸引，引力沿连线，大小$F=\frac{Gm_1m_2}{r^2}$，和质量之积成正比、和距离的平方成反比。
    definedIn: physics.newtonian-mechanics.gravitation
    anchor: def-gravitation
  - id: physics.newtonian-mechanics.gravitational-constant
    zh: |
      引力常量
    en: |
      gravitational constant
    brief: |
      万有引力定律里的比例系数$G=6.674\,30\times10^{-11}\,\mathrm{N\,m^2/kg^2}$；它极小，日常物体之间的引力察觉不到。
    definedIn: physics.newtonian-mechanics.gravitation
    anchor: def-gravitation
  - id: physics.newtonian-mechanics.first-cosmic-velocity
    zh: |
      第一宇宙速度
    en: |
      first cosmic velocity
    brief: |
      贴着地面绕地球做圆周运动的速率$\sqrt{gR}\approx7.9\,\mathrm{km/s}$，也叫环绕速度，是绕地球的圆轨道上最大的速率。
    definedIn: physics.newtonian-mechanics.gravitation
    anchor: def-first-cosmic-velocity
  - id: physics.newtonian-mechanics.gravitational-potential-energy-universal
    zh: |
      引力势能
    en: |
      gravitational potential energy
    brief: |
      两个质点之间万有引力的势能，取无穷远处为参考点时是$-\frac{GMm}r$；离地面不高时，它的差就是$mgh$。
    definedIn: physics.newtonian-mechanics.gravitational-potential
    anchor: def-gravitational-potential
  - id: physics.newtonian-mechanics.escape-velocity
    zh: |
      逃逸速度
    en: |
      escape velocity
    brief: |
      从天体表面出发、只受它的引力，能飞到无穷远的最小速率$\sqrt{\frac{2GM}R}$；地球的约$11.2\,\mathrm{km/s}$，也叫第二宇宙速度。
    definedIn: physics.newtonian-mechanics.gravitational-potential
    anchor: def-escape-velocity
  - id: physics.newtonian-mechanics.effective-potential
    zh: |
      有效势
    en: |
      effective potential
    brief: |
      有心力问题里$U_{\text{eff}}=U(r)+\frac{L^2}{2mr^2}$；角动量守恒时，$r$的变化就像在它里面做一维运动。
    definedIn: physics.newtonian-mechanics.central-forces
    anchor: def-effective-potential
  - id: physics.newtonian-mechanics.pericenter
    zh: |
      近心点
    en: |
      pericenter
    brief: |
      有心力作用下轨道上离力心最近的点，那里速度垂直于半径；绕太阳的叫近日点，绕地球的叫近地点。
    definedIn: physics.newtonian-mechanics.central-forces
    anchor: def-apsides
  - id: physics.newtonian-mechanics.shell-theorem
    zh: |
      球壳定理
    en: |
      shell theorem
    brief: |
      均匀球壳对外面的质点的引力如同质量集中在球心，对里面的质点没有引力；引力和距离的平方成反比是关键。
    definedIn: physics.newtonian-mechanics.shell-theorem
    anchor: thm-shell
  - id: physics.newtonian-mechanics.reduced-mass
    zh: |
      约化质量
    en: |
      reduced mass
    brief: |
      两个质点的$\mu=\frac{m_1m_2}{m_1+m_2}$；只有相互作用时，相对位置的运动就像质量为$\mu$的质点受这个力。
    definedIn: physics.newtonian-mechanics.two-body-problem
    anchor: def-reduced-mass
  - id: physics.newtonian-mechanics.noninertial-frame
    zh: |
      非惯性系
    en: |
      non-inertial frame
    brief: |
      相对惯性系做加速运动的参考系；在它里面不受力的质点也有加速度，要加上惯性力才能用牛顿第二定律。
    definedIn: physics.newtonian-mechanics.accelerating-frames
    anchor: def-noninertial-frame
  - id: physics.newtonian-mechanics.inertial-force
    zh: |
      惯性力
    en: |
      inertial force
    brief: |
      在非惯性系里为了照用牛顿第二定律而加上的力，加速度为$\vb a_0$的平动参考系里是$-m\vb a_0$；没有施力物体，也没有反作用力。
    definedIn: physics.newtonian-mechanics.accelerating-frames
    anchor: def-inertial-force
  - id: physics.newtonian-mechanics.angular-velocity-vector
    zh: |
      角速度矢量
    en: |
      angular velocity vector
    brief: |
      大小是角速度的大小、方向沿转轴按右手定则定的矢量$\boldsymbol\omega$；转动参考系里固定的点的速度是$\boldsymbol\omega\times\vb r$。
    definedIn: physics.newtonian-mechanics.rotating-frames
    anchor: def-angular-velocity-vector
  - id: physics.newtonian-mechanics.rotating-frame
    zh: |
      转动参考系
    en: |
      rotating frame
    brief: |
      相对惯性系绕一根轴转动的参考系，是非惯性系；在里面要加上离心力和科里奥利力，才能照用牛顿第二定律。
    definedIn: physics.newtonian-mechanics.rotating-frames
    anchor: def-rotating-frame
  - id: physics.newtonian-mechanics.centrifugal-force
    zh: |
      离心力
    en: |
      centrifugal force
    brief: |
      转动参考系里加在质点上的惯性力$-m\boldsymbol\omega\times(\boldsymbol\omega\times\vb r')$，背离转轴，大小$m\omega^2\rho$；惯性系里没有它。
    definedIn: physics.newtonian-mechanics.rotating-frames
    anchor: def-centrifugal-force
  - id: physics.newtonian-mechanics.coriolis-force
    zh: |
      科里奥利力
    en: |
      Coriolis force
    brief: |
      转动参考系里加在相对它运动的质点上的惯性力$-2m\boldsymbol\omega\times\vb v'$；垂直于相对速度，不做功，只改变运动方向。
    definedIn: physics.newtonian-mechanics.rotating-frames
    anchor: def-coriolis-force
  - id: physics.newtonian-mechanics.apocenter
    zh: |
      远心点
    en: |
      apocenter
    brief: |
      有心力作用下有界的轨道上离力心最远的点，那里速度垂直于半径；绕太阳的叫远日点，绕地球的叫远地点。
    definedIn: physics.newtonian-mechanics.central-forces
    anchor: def-apsides
  - id: physics.newtonian-mechanics.keplers-first-law
    zh: |
      开普勒第一定律
    en: |
      Kepler's first law
    brief: |
      行星绕太阳的轨道是椭圆，太阳在椭圆的一个焦点上；平方反比的引力下，有界的轨道都是这样的椭圆或圆。
    definedIn: physics.newtonian-mechanics.kepler-orbits
    anchor: thm-kepler
  - id: physics.newtonian-mechanics.keplers-second-law
    zh: |
      开普勒第二定律
    en: |
      Kepler's second law
    brief: |
      行星和太阳的连线在相等的时间里扫过相等的面积；它是角动量守恒的结果，任何有心力下都成立。
    definedIn: physics.newtonian-mechanics.kepler-orbits
    anchor: thm-kepler
  - id: physics.newtonian-mechanics.keplers-third-law
    zh: |
      开普勒第三定律
    en: |
      Kepler's third law
    brief: |
      绕同一个天体的各条椭圆轨道，周期的平方和半长轴的立方之比相同：$\frac{T^2}{a^3}=\frac{4\pi^2}{GM}$。
    definedIn: physics.newtonian-mechanics.kepler-orbits
    anchor: thm-kepler
