- id: p1
  tier: easy
  statement: |
    地球的质量取$5.97\times10^{24}\,\mathrm{kg}$，月球的质量取$7.35\times10^{22}\,\mathrm{kg}$。地月系统的约化质量是月球质量的多少倍？保留三位有效数字。
  answer:
    type: number
    value: 5.97e24/(5.97e24 + 7.35e22)
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      约化质量$\mu=\frac{m_1m_2}{m_1+m_2}$。
    - |
      $\frac\mu{m_{\text{月}}}=\frac{m_{\text{地}}}{m_{\text{地}}+m_{\text{月}}}$。
    - |
      $\frac{5.97\times10^{24}}{5.97\times10^{24}+7.35\times10^{22}}\approx0.988$。
  solution: |
    $\frac\mu{m_{\text{月}}}=\frac{m_{\text{地}}}{m_{\text{地}}+m_{\text{月}}}=\frac{5.97\times10^{24}}{6.04\times10^{24}}\approx0.988$。约化质量比月球的质量只小约$1\%$：地球比月球重得多，把地球当作不动，误差约为百分之一。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        双星中质量大的那颗绕质心运动的速率小
      - |
        质量为$1\,\mathrm{kg}$和$4\,\mathrm{kg}$的两个物体，约化质量是$0.8\,\mathrm{kg}$
      - |
        两个物体之间的引力变为原来的$2$倍，它们的约化质量也变为原来的$2$倍
      - |
        只考虑太阳和一颗行星，行星的质量越大，在同样的半长轴上周期越短
      - |
        双星绕质心转动时，质量大的那颗离质心远
    value: [1, 2, 4]
  hints:
    - |
      约化质量只由两个质量决定。
    - |
      两颗星到质心的距离满足$m_1r_1=m_2r_2$，转一圈的时间相同。
    - |
      A、B、D 对；C、E 错。
  solution: |
    A 对、E 错：$m_1r_1=m_2r_2$，质量大的离质心近，两者周期相同，它的轨道小，速率也小。B 对：$\mu=\frac{1\times4}{1+4}=0.8\,\mathrm{kg}$。C 错：$\mu=\frac{m_1m_2}{m_1+m_2}$和力无关。

    D 对：$T^2=\frac{4\pi^2a^3}{G(M+m)}$，$m$越大，周期越短，只是行星的质量比太阳小得多时，这个差别很小。

- id: p3
  tier: medium
  statement: |
    两颗恒星绕共同的质心做匀速圆周运动，相距$2.0\times10^{11}\,\mathrm m$，周期是$2.0$年。$1$年取$3.16\times10^7\,\mathrm s$，引力常量取$6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$。两颗星的总质量是多少？以$\mathrm{kg}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 4*pi^2*(2.0e11)^3/(6.67e-11*(2.0*3.16e7)^2)
    unit: |
      $\mathrm{kg}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      相对轨道是半径等于两星距离的圆，周期满足$T^2=\frac{4\pi^2a^3}{G(m_1+m_2)}$。
    - |
      $m_1+m_2=\frac{4\pi^2a^3}{GT^2}$，周期换成秒。
    - |
      $m_1+m_2=\frac{4\pi^2\times(2.0\times10^{11})^3}{6.67\times10^{-11}\times(6.32\times10^7)^2}\approx1.19\times10^{30}\,\mathrm{kg}$。
  solution: |
    相对位置的运动和一个质点绕固定的、质量为$m_1+m_2$的天体运动一样，相对轨道是半径$a=2.0\times10^{11}\,\mathrm m$的圆。由$T^2=\frac{4\pi^2a^3}{G(m_1+m_2)}$，$m_1+m_2=\frac{4\pi^2a^3}{GT^2}=\frac{4\pi^2\times(2.0\times10^{11})^3}{6.67\times10^{-11}\times(6.32\times10^7)^2}\approx1.19\times10^{30}\,\mathrm{kg}$，约为太阳质量的$0.6$倍。

- id: p4
  tier: medium
  statement: |
    冥王星的质量约$1.30\times10^{22}\,\mathrm{kg}$，它最大的卫星卡戎（Charon）的质量约$1.59\times10^{21}\,\mathrm{kg}$，两者相距约$1.96\times10^7\,\mathrm m$，相对轨道近似是圆。引力常量取$6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$。卡戎绕冥王星一周要多少天？保留三位有效数字。
  answer:
    type: number
    value: 2*pi*sqrt((1.96e7)^3/(6.67e-11*(1.30e22 + 1.59e21)))/86400
    unit: |
      天
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      卡戎的质量约是冥王星的八分之一，不能不计，用两者的质量之和。
    - |
      $T=2\pi\sqrt{\frac{a^3}{G(m_1+m_2)}}$。
    - |
      $T\approx5.53\times10^5\,\mathrm s$，约$6.40$天。
  solution: |
    相对轨道是半径$a=1.96\times10^7\,\mathrm m$的圆，$T=2\pi\sqrt{\frac{a^3}{G(m_1+m_2)}}=2\pi\sqrt{\frac{(1.96\times10^7)^3}{6.67\times10^{-11}\times1.459\times10^{22}}}\approx5.53\times10^5\,\mathrm s$，约$6.40$天。如果不计卡戎的质量，算出的周期约长$6\%$。

- id: p5
  tier: hard
  statement: |
    在远离其他天体的太空里，两个质量都是$1.0\,\mathrm{kg}$的小球相距$1.0\,\mathrm m$，由静止释放，只受彼此的引力，小球的大小不计。引力常量取$6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$。

    （1）它们的相对运动相当于什么样的单体问题？

    （2）把相对运动看成越来越扁的椭圆轨道的极限，用开普勒第三定律求两球经过多久相碰。

    （3）如果其中一个小球被固定住，另一个要多久碰到它？
  hints:
    - |
      相对运动像一个质点从静止开始落向固定的、质量为$m_1+m_2$的天体，角动量为零。
    - |
      沿直线下落，可以看成半长轴为$\frac d2$、偏心率趋于$1$的椭圆：起点是远心点，力心在另一端，从远心点到近心点走半个周期。
    - |
      $t=\frac T2=\pi\sqrt{\frac{(d/2)^3}{G(m_1+m_2)}}$。
  reference: |
    （1）相对位置$\vb r$满足$\dv{^2\vb r}{t^2}=-\frac{G(m_1+m_2)}{r^2}\uv r$，就像一个质点从相距$d=1.0\,\mathrm m$处由静止落向固定的、质量为$M=2.0\,\mathrm{kg}$的天体，角动量为零。

    （2）角动量很小时，轨道是很扁的椭圆，远心点在出发处，近心点贴近力心，半长轴趋于$\frac d2$，力心在一个焦点上，焦点趋于椭圆的另一端。角动量趋于零，轨道就成了一条线段，质点从远心点走到近心点用半个周期：$t=\pi\sqrt{\frac{(d/2)^3}{GM}}=\pi\sqrt{\frac{0.125}{6.67\times10^{-11}\times2.0}}\approx9.6\times10^4\,\mathrm s$，约$27$小时。两个$1\,\mathrm{kg}$的球要一天多才能靠引力碰到一起，可见引力之弱。

    （3）固定一个球，相当于$M$换成$1.0\,\mathrm{kg}$，时间变成$\sqrt2$倍，约$38$小时。两个球都能动时，彼此迎着走，碰得更快。

- id: p6
  tier: hard
  statement: |
    观测发现，一颗质量约等于太阳（$1.99\times10^{30}\,\mathrm{kg}$）的恒星，以$4.2$天为周期来回晃动，晃动的速率是$50\,\mathrm{m/s}$。设绕它转的是一颗行星，轨道是圆，我们正好从轨道平面里看过去，行星的质量比恒星小得多。引力常量取$6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$。

    （1）行星的轨道半径是多少？

    （2）行星的速率是多少？

    （3）行星的质量是多少？和木星的$1.90\times10^{27}\,\mathrm{kg}$比较。
  hints:
    - |
      行星的质量比恒星小得多，用开普勒第三定律求轨道半径时可以只用恒星的质量。
    - |
      行星和恒星都绕质心转，周期相同，到质心的距离和质量成反比，速率也是。
    - |
      $mv_{\text{行}}=Mv_{\text{星}}$。
  reference: |
    （1）$a=\Bigl(\frac{GMT^2}{4\pi^2}\Bigr)^{1/3}$，$T=4.2\times86400\,\mathrm s\approx3.63\times10^5\,\mathrm s$，得$a\approx7.6\times10^9\,\mathrm m$，约$0.05\,\mathrm{AU}$，比水星离太阳还近得多。

    （2）$v_{\text{行}}=\frac{2\pi a}T\approx1.32\times10^5\,\mathrm{m/s}$，约$132\,\mathrm{km/s}$。

    （3）两者都绕质心转，周期相同，到质心的距离之比是$M:m$的倒数，速率之比也是，所以$mv_{\text{行}}=Mv_{\text{星}}$，$m=\frac{1.99\times10^{30}\times50}{1.32\times10^5}\approx7.5\times10^{26}\,\mathrm{kg}$，约为木星的$0.4$倍。1995 年发现的第一颗绕类太阳恒星转的系外行星，就是这样一颗离恒星极近、像木星那样大的行星。

- id: p7
  tier: thinking
  statement: |
    两个物体沿一条直线相撞，碰前相对速度的大小是$v$。

    （1）碰撞中最多能损失多少动能？用约化质量表示，说明为什么。

    （2）一辆很重的卡车撞上一只飞虫，最多损失多少动能？

    （3）两个质量相同、速率相同的物体迎面相撞，最多损失多少？
  hints:
    - |
      总动能是$\frac12Mv_{\mathrm C}^2+\frac12\mu v^2$；碰撞时外力可以不计，质心的速度不变。
    - |
      卡车的质量远大于飞虫，$\mu$约等于哪个质量？
    - |
      两者质量都是$m$、速率都是$u$，$v=2u$，$\mu=\frac m2$。
  reference: |
    （1）由本节的定理，总动能是$\frac12Mv_{\mathrm C}^2+\frac12\mu v^2$。碰撞时外力可以不计，动量守恒，质心的速度不变，第一项改变不了，能损失的只有第二项，最多是$\frac12\mu v^2$：两者粘在一起、相对速度变成零时，正好损失这么多。这和[质心系](lesson:physics.newtonian-mechanics.center-of-mass-frame)里「完全非弹性碰撞损失最多」是一回事。

    （2）$\mu$约等于飞虫的质量，最多损失$\frac12m_{\text{虫}}v^2$，就是在卡车上看飞虫的动能，对卡车来说微不足道。

    （3）$v=2u$，$\mu=\frac m2$，最多损失$\frac12\cdot\frac m2\cdot(2u)^2=mu^2$，正是两者动能的总和：迎面相撞、粘在一起后静止，动能全部损失。

- id: p8
  tier: thinking
  statement: |
    （1）用第 4 题的数据，冥王星和卡戎的质心离冥王星的中心多远？冥王星的半径约$1.19\times10^6\,\mathrm m$，质心在冥王星的里面还是外面？

    （2）日地质心离太阳的中心多远？太阳的质量取$1.99\times10^{30}\,\mathrm{kg}$，地球的质量取$5.97\times10^{24}\,\mathrm{kg}$，日地距离取$1.50\times10^{11}\,\mathrm m$，太阳的半径约$6.96\times10^8\,\mathrm m$。

    （3）这两种情形里，说「卫星绕着中心天体转」各有多准确？
  hints:
    - |
      两者到质心的距离和质量成反比。
    - |
      较重的那个到质心的距离是$\frac{m_{\text{轻}}}{m_1+m_2}d$。
    - |
      把这个距离和较重天体的半径比较。
  reference: |
    （1）$\frac{1.59\times10^{21}}{1.459\times10^{22}}\times1.96\times10^7\approx2.14\times10^6\,\mathrm m$，比冥王星的半径大，质心在冥王星外面。冥王星和卡戎都绕冥王星外面的一点转，常被看作一对双星式的天体。

    （2）$\frac{5.97\times10^{24}}{1.99\times10^{30}}\times1.50\times10^{11}\approx4.5\times10^5\,\mathrm m$，只有约$450\,\mathrm{km}$，远在太阳的内部。

    （3）对日地系统，说地球绕太阳转，误差只有百万分之几，几乎就是精确的；对冥王星和卡戎，两者都在明显地绕外面的一点转，只说卡戎绕冥王星转就不准确了，要用本节的二体问题处理。
