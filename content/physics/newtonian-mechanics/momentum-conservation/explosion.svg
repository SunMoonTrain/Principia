<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-size="14">
  <!-- 礼花弹在最高点炸成两块。实线是礼花弹炸开前的轨迹，从左下的发射点到最高点；虚线是它原来要走的抛物线，从最高点画到右下的落地点。炸开后，质量为 m 的碎片 A 几乎竖直地向上飞出、再落下，质量为 2m 的碎片 B 向右下方飞出，两条彩色实线是它们的轨迹。每隔相同的时间标出两块碎片的位置并用细线连起来，细线上离 B 较近、把 A 到 B 的距离分成 2 比 1 的那一点是质心，画成空心圆，这些空心圆都落在虚线上，直到 B 落地。右上角的小图是炸开前后的动量：A 的动量和 B 的动量首尾相接，合起来正好是炸开前礼花弹的动量。 -->
