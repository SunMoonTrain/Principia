- id: p1
  tier: easy
  statement: |
    质量分别是$1.0\,\mathrm{kg}$、$2.0\,\mathrm{kg}$、$3.0\,\mathrm{kg}$的三个小球，分别位于平面上的$(0,0)$、$(4.0\,\mathrm m,0)$、$(0,3.0\,\mathrm m)$。三个小球的质心到原点的距离是多少？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: sqrt((2*4/6)^2 + (3*3/6)^2)
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      质心的每个坐标分别按质量加权平均：$x_{\mathrm C}=\frac{\sum m_ix_i}M$，$y_{\mathrm C}$同样。
    - |
      $M=6.0\,\mathrm{kg}$，$x_{\mathrm C}=\frac{2.0\times4.0}{6.0}\approx1.33\,\mathrm m$，$y_{\mathrm C}=\frac{3.0\times3.0}{6.0}=1.5\,\mathrm m$。
    - |
      距离$\sqrt{1.33^2+1.5^2}\approx2.01\,\mathrm m$。
  solution: |
    总质量$M=6.0\,\mathrm{kg}$。$x_{\mathrm C}=\frac{1.0\times0+2.0\times4.0+3.0\times0}{6.0}=\frac43\,\mathrm m$，$y_{\mathrm C}=\frac{3.0\times3.0}{6.0}=1.5\,\mathrm m$。质心到原点的距离是$\sqrt{(4/3)^2+1.5^2}\approx2.01\,\mathrm m$。它比三个小球位置的几何中心$\bigl(\frac43,1\bigr)$更靠近最重的那个小球。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        系统的内力再大，也不能改变系统的总动量
      - |
        质心的速度等于各个质点速度的平均值
      - |
        两个物体组成的系统动量守恒时，它们的动量改变等大反向
      - |
        质点系的总动量守恒，它的质心就一定静止
      - |
        把质点系分成两组，各组的质量放在各组的质心上，这两点的质心就是整个质点系的质心
    value: [1, 3, 5]
  hints:
    - |
      内力成对出现、等大反向；总动量等于$M\vb v_{\mathrm C}$。
    - |
      质心的速度是按质量加权的平均；总动量不变时，质心的速度不变，但不一定是零。
    - |
      A、C、E 对；B、D 错。
  solution: |
    A 对：内力两两抵消，总动量的变化率等于外力之和。B 错：$\vb v_{\mathrm C}=\frac{\sum m_i\vb v_i}M$是按质量加权的平均，只有各质点质量相等时才是普通的平均值。C 对：总动量不变，$\Delta\vb p_1+\Delta\vb p_2=\vb 0$。

    D 错：总动量守恒时质心的速度不变，可以是匀速直线运动，例如在冰面上一起滑行、互相推开的两个人。E 对：两组的质量是$M_1$、$M_2$，质心是$\vb r_1$、$\vb r_2$，则$M_1\vb r_1=\sum_{\text{第一组}}m_i\vb r_i$，第二组同样，所以$\frac{M_1\vb r_1+M_2\vb r_2}{M_1+M_2}=\frac{\sum m_i\vb r_i}M$。

- id: p3
  tier: medium
  statement: |
    质量$3.0\,\mathrm{kg}$的物体在光滑水平面上以$4.0\,\mathrm{m/s}$向东运动，突然炸成两块：$1.0\,\mathrm{kg}$的一块以$6.0\,\mathrm{m/s}$向北运动。另一块的速率是多少？以$\mathrm{m/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: sqrt(6^2 + 3^2)
    unit: |
      $\mathrm{m/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      爆炸的时间很短，总动量守恒；动量是矢量，向东、向北两个方向分别守恒。
    - |
      取向东为$x$轴、向北为$y$轴，炸开前总动量是$(12,0)\,\mathrm{kg\cdot m/s}$，$1.0\,\mathrm{kg}$那一块的动量是$(0,6.0)\,\mathrm{kg\cdot m/s}$。
    - |
      另一块的动量是$(12,-6.0)\,\mathrm{kg\cdot m/s}$，除以$2.0\,\mathrm{kg}$，速度是$(6.0,-3.0)\,\mathrm{m/s}$，速率约$6.71\,\mathrm{m/s}$。
  solution: |
    取向东为$x$轴、向北为$y$轴。炸开前总动量$(3.0\times4.0,\ 0)=(12,0)\,\mathrm{kg\cdot m/s}$。炸开后$1.0\,\mathrm{kg}$的一块动量是$(0,6.0)$，另一块是$(12,0)-(0,6.0)=(12,-6.0)$，速度$(6.0,-3.0)\,\mathrm{m/s}$，速率$\sqrt{36+9}\approx6.71\,\mathrm{m/s}$，方向东偏南约$26.6^\circ$。

- id: p4
  tier: medium
  statement: |
    质量$2.0\times10^3\,\mathrm{kg}$的炮车静止在水平轨道上，发射一颗质量$10\,\mathrm{kg}$的炮弹。炮弹离开炮口时，相对地面的速度大小是$600\,\mathrm{m/s}$，方向和水平成$60^\circ$。轨道和地球对炮车、炮弹的力都在竖直方向，炮车沿轨道后退的速度多大？以$\mathrm{m/s}$为单位。
  answer:
    type: number
    value: 10*600*cos(60*pi/180)/2000
    unit: |
      $\mathrm{m/s}$
  hints:
    - |
      竖直方向有外力，总动量不守恒；水平方向呢？
    - |
      水平方向的外力为零，水平方向的总动量守恒，原来是零。
    - |
      $10\times600\cos60^\circ=2.0\times10^3\,v$，$v=1.5\,\mathrm{m/s}$。
  solution: |
    外力都在竖直方向，水平方向的总动量守恒，发射前是零。炮弹的水平动量是$10\times600\cos60^\circ=3.0\times10^3\,\mathrm{kg\cdot m/s}$，炮车的水平动量必须和它等大反向：$2.0\times10^3\,v=3.0\times10^3$，$v=1.5\,\mathrm{m/s}$，向后。竖直方向的动量不守恒：炮弹向上的动量是轨道在发射时给的。

- id: p5
  tier: hard
  statement: |
    炮弹以初速度$v_0$、抛射角$\theta$射出，地面水平，空气的影响可以忽略，射程本来是$R$。它在最高点炸成质量为$m_1$、$m_2$的两块，炸开后$m_1$的速度恰好为零。

    （1）求$m_2$的落地点到发射点的距离。

    （2）两块是不是同时落地？它们的质心落在哪里？用质心验证（1）的结果。

    （3）如果炸开后$m_1$以较小的速度竖直向上飞，（2）的验证还能用吗？
  hints:
    - |
      最高点的速度是水平的，大小$v_0\cos\theta$，离发射点$\frac R2$；炸开时总动量守恒。
    - |
      $m_2$的速度是$\frac{m_1+m_2}{m_2}v_0\cos\theta$，也是水平的，下落的时间和原来后半程一样。
    - |
      两块落地以前，外力只有地球的吸引，质心沿原来的抛物线走；一块先落地以后，地面的力成了外力。
  reference: |
    （1）最高点离发射点$\frac R2$，速度水平、大小$v_0\cos\theta$。炸开时动量守恒：$(m_1+m_2)v_0\cos\theta=m_2v_2$，$v_2=\frac{m_1+m_2}{m_2}v_0\cos\theta$。$m_2$从最高点开始做平抛运动，下落用的时间和原来的后半程相同，原来后半程水平走了$\frac R2$，现在走$\frac{m_1+m_2}{m_2}\cdot\frac R2$。所以落地点离发射点$\frac R2+\frac{m_1+m_2}{m_2}\cdot\frac R2$。

    （2）两块炸开时的竖直速度都是零，又从同一高度下落，所以同时落地。落地以前每块的加速度都是$\vb g$，质心沿原来的抛物线运动，落地时正好在$R$处。验证：$\frac{m_1\cdot\frac R2+m_2\bigl(\frac R2+\frac{m_1+m_2}{m_2}\cdot\frac R2\bigr)}{m_1+m_2}=\frac R2+\frac R2=R$。

    （3）不能。竖直方向的动量也守恒，$m_1$向上，$m_2$就有向下的竖直速度，先落地。从这时起地面给$m_2$力，外力不再只有地球的吸引，质心不再沿原来的抛物线走，不能再用「质心落在$R$处」来算。

- id: p6
  tier: hard
  statement: |
    光滑水平轨道上停着一辆质量为$M$的平板车，车上站着两个质量都是$m$的人。他们要沿轨道向后跳下车，跳离时相对于车的速度大小都是$u$，这里的「相对于车」指相对跳离后车的速度。

    （1）两人同时跳，车最后的速度是多少？

    （2）一个人先跳，另一个人等车的速度稳定后再跳，车最后的速度是多少？

    （3）哪一种跳法使车更快？为什么？
  hints:
    - |
      人和车组成的系统在水平方向不受外力，总动量守恒。设跳离后车的速度是$V$，人对地面的速度就是$V-u$。
    - |
      同时跳：$0=MV+2m(V-u)$。先后跳：第一次$0=(M+m)V_1+m(V_1-u)$，第二次$(M+m)V_1=MV_2+m(V_2-u)$。
    - |
      比较$\frac{2mu}{M+2m}$和$\frac{mu}{M+2m}+\frac{mu}{M+m}$。
  reference: |
    取车前进的方向为正，跳离后车的速度是$V$，人对地面的速度就是$V-u$。

    （1）同时跳：$0=MV+2m(V-u)$，$V=\frac{2mu}{M+2m}$。

    （2）第一个人跳：$0=(M+m)V_1+m(V_1-u)$，$V_1=\frac{mu}{M+2m}$。第二个人跳：$(M+m)V_1=MV_2+m(V_2-u)$，$V_2=V_1+\frac{mu}{M+m}=\frac{mu}{M+2m}+\frac{mu}{M+m}$。

    （3）先后跳更快：$V_2-V=\frac{mu}{M+m}-\frac{mu}{M+2m}>0$。第一个人跳时，两种跳法给车的速度增量一样，都是每人$\frac{mu}{M+2m}$；先后跳时，第二个人推的是已经少了一个人的车，同样的相对速度$u$给车的速度增量$\frac{mu}{M+m}$更大。火箭一边飞、一边把燃料一点点向后喷出，道理与此相同。

- id: p7
  tier: thinking
  statement: |
    宇航员在空间站外工作时安全绳断了，他离空间站有一段距离，相对空间站静止，手里拿着一把扳手。

    （1）他能靠划动手脚回到空间站吗？

    （2）怎样用扳手回到空间站？

    （3）在扔扳手前后，宇航员和扳手组成的系统的质心怎样运动？
  hints:
    - |
      划动手脚时，身体各部分之间的力是什么力？
    - |
      扔出扳手时，扳手和人之间的力等大反向。
    - |
      在空间站的参考系里，这个系统原来的总动量是零。
  reference: |
    （1）不能。划动手脚时，身体各部分之间的力是内力，人的总动量不变，质心仍然相对空间站静止，手脚动来动去，质心并不移动。

    （2）把扳手朝背离空间站的方向使劲扔出去。扔的时候人给扳手的力和扳手给人的力等大反向，人就获得朝向空间站的动量，大小和扳手的动量相等。扳手越重、扔得越快，人回去得越快。

    （3）系统原来相对空间站静止，扔扳手时只有内力，总动量保持为零，质心一直不动。扔出以后，人和扳手朝相反的方向运动，离质心的距离和各自的质量成反比。

- id: p8
  tier: thinking
  statement: |
    无风的日子里，帆船上的人把一台电风扇固定在船上，对着船帆吹。忽略水对船在水平方向的作用，把船、风扇、帆和周围的空气看作一个系统。

    （1）空气吹到帆上以后被挡住、停了下来，船能前进吗？

    （2）如果空气被帆反弹回来，向后飞走，结果有什么不同？

    （3）怎样放置风扇，船前进得最好？
  hints:
    - |
      整个系统在水平方向不受外力，原来静止，总动量一直为零。
    - |
      最后空气的动量是多少，船的动量就必须和它等大反向。
    - |
      想一想螺旋桨飞机、气垫船是怎样前进的。
  reference: |
    （1）不能。风扇把空气向前吹，空气得到向前的动量，船受到向后的冲量；空气撞到帆上停下，又把同样多的向前的动量交给帆。从整个系统看，水平方向不受外力，总动量一直为零；空气最后静止，船也就静止。

    （2）空气被反弹回来、向后飞走，带走了向后的动量，船就得到同样大小的向前的动量，能慢慢前进。实际上空气多半从帆的四周散开，被弹回的不多，效果很弱。

    （3）把风扇朝后放，直接把空气向船后吹出去，空气带走向后的动量，船得到向前的动量，帆就用不着了，螺旋桨飞机、气垫船都是这样前进的。
