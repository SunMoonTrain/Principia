- id: p1
  tier: easy
  statement: |
    均匀实心圆柱从高$0.90\,\mathrm m$的斜面顶端由静止开始纯滚动滚下，$g$取$9.8\,\mathrm{m/s^2}$。它滚到底端时，质心的速率是多少？以$\mathrm{m/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: sqrt(4*9.8*0.90/3)
    unit: |
      $\mathrm{m/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      纯滚动时静摩擦力不做功，机械能守恒；动能分成质心的动能和绕质心转动的动能。
    - |
      圆柱的$I_{\mathrm C}=\frac12MR^2$，$Mgh=\frac12\Bigl(M+\frac{I_{\mathrm C}}{R^2}\Bigr)v_{\mathrm C}^2=\frac34Mv_{\mathrm C}^2$。
    - |
      $v_{\mathrm C}=\sqrt{\frac43gh}=\sqrt{\frac43\times9.8\times0.90}\approx3.43\,\mathrm{m/s}$。
  solution: |
    静摩擦力作用在不动的接触点上，不做功，机械能守恒：$Mgh=\frac12Mv_{\mathrm C}^2+\frac12\cdot\frac12MR^2\cdot\frac{v_{\mathrm C}^2}{R^2}=\frac34Mv_{\mathrm C}^2$。所以$v_{\mathrm C}=\sqrt{\frac43gh}\approx3.43\,\mathrm{m/s}$，比从光滑斜面上滑下的$\sqrt{2gh}\approx4.20\,\mathrm{m/s}$小。

- id: p2
  tier: easy
  statement: |
    下面关于纯滚动的说法，哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        在水平地面上纯滚动的轮子，轮缘上和轮心一样高的点，速率是轮心速率的$\sqrt2$倍
      - |
        同一个圆盘，沿同一斜面纯滚动滚下，和在光滑斜面上不转动地滑下，到底端时质心的速率相同
      - |
        纯滚动的均匀圆盘，绕质心转动的动能占总动能的$\frac13$
      - |
        纯滚动的车轮，轮缘上各点的速率都相同
      - |
        质量、半径都相同的空心薄球壳和实心球，沿同一斜面纯滚动滚下，空心球壳先到底
    value: [1, 3]
  hints:
    - |
      轮缘上一点的速度是质心的速度加上绕质心转动的速度，后者大小是$R\omega=v_{\mathrm C}$，沿轮缘的切线。
    - |
      $K=\frac12Mv_{\mathrm C}^2+\frac12I_{\mathrm C}\omega^2$；质量越往外分布，$\frac{I_{\mathrm C}}{MR^2}$越大。
    - |
      A、C 对；B、D、E 错。
  solution: |
    A 对：和轮心一样高的点，绕质心转动的速度竖直、大小$v_{\mathrm C}$，和水平的$v_{\mathrm C}$合起来是$\sqrt2v_{\mathrm C}$。B 错：滚下时一部分势能变成了转动动能，质心的速率比滑下时小。C 对：$\frac12\cdot\frac12MR^2\omega^2=\frac14Mv_{\mathrm C}^2$，总动能$\frac34Mv_{\mathrm C}^2$，占$\frac13$。

    D 错：最低点静止，最高点是$2v_{\mathrm C}$，各点不同。E 错：球壳的质量都在表面，$\frac{I_{\mathrm C}}{MR^2}$比实心球大，加速度小，后到底。

- id: p3
  tier: medium
  statement: |
    质量$0.50\,\mathrm{kg}$的均匀实心球在水平地面上纯滚动，质心的速率是$2.0\,\mathrm{m/s}$。它的总动能是多少？以$\mathrm J$为单位，保留两位有效数字。
  answer:
    type: number
    value: 0.5*(0.50 + 0.4*0.50)*2.0^2
    unit: |
      $\mathrm J$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      动能分成质心的动能和绕质心转动的动能；纯滚动时$\omega=\frac{v_{\mathrm C}}R$。
    - |
      实心球的$I_{\mathrm C}=\frac25MR^2$，$K=\frac12\Bigl(M+\frac25M\Bigr)v_{\mathrm C}^2$。
    - |
      $K=\frac12\times0.70\times2.0^2=1.4\,\mathrm J$。
  solution: |
    $K=\frac12Mv_{\mathrm C}^2+\frac12I_{\mathrm C}\omega^2=\frac12\Bigl(M+\frac{I_{\mathrm C}}{R^2}\Bigr)v_{\mathrm C}^2=\frac12\times1.4\times0.50\times2.0^2=1.4\,\mathrm J$。其中质心的动能$1.0\,\mathrm J$，转动动能$0.40\,\mathrm J$，和球的半径无关。

- id: p4
  tier: medium
  statement: |
    均匀圆盘以$3.0\,\mathrm{m/s}$的质心速率纯滚动着冲上倾角$30^\circ$的斜面，一直纯滚动，$g$取$9.8\,\mathrm{m/s^2}$。它沿斜面能滚上多远？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: 0.75*3.0^2/(9.8*0.5)
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      纯滚动时静摩擦力不做功，机械能守恒，转动动能也要变成势能。
    - |
      $\frac34Mv_{\mathrm C}^2=Mgs\sin30^\circ$。
    - |
      $s=\frac{0.75\times3.0^2}{9.8\times0.5}\approx1.38\,\mathrm m$。
  solution: |
    机械能守恒：开始时的动能$\frac34Mv_{\mathrm C}^2$全部变成重力势能$Mgs\sin30^\circ$，$s=\frac{0.75\times9.0}{4.9}\approx1.38\,\mathrm m$。同样的初速度，在光滑斜面上滑上去只有$\frac{v^2}{2g\sin30^\circ}\approx0.918\,\mathrm m$：转动动能也在帮它往上爬。

- id: p5
  tier: hard
  statement: |
    质量为$M$、半径为$R$的均匀实心球。

    （1）把它切成许多垂直于一条直径的薄圆片，离球心$z$处、厚$\dd z$的那一片，半径和质量各是多少？

    （2）用薄圆片对过圆心、垂直于片面的轴的转动惯量$\frac12mr^2$，积分求球对这条直径的转动惯量。

    （3）它沿斜面纯滚动滚下的加速度是多少？
  hints:
    - |
      薄圆片的半径$r=\sqrt{R^2-z^2}$；球的密度是$\rho=\frac{M}{\frac43\pi R^3}$。
    - |
      $\dd I=\frac12\,\dd m\,r^2=\frac12\rho\pi(R^2-z^2)^2\,\dd z$，从$-R$积到$R$。
    - |
      $\int_{-R}^R(R^2-z^2)^2\,\dd z=\frac{16}{15}R^5$。
  reference: |
    （1）薄圆片的半径$r=\sqrt{R^2-z^2}$，质量$\dd m=\rho\pi(R^2-z^2)\,\dd z$，$\rho=\frac{3M}{4\pi R^3}$。

    （2）每一片绕这条直径（它垂直于片面、过片的圆心）的转动惯量是$\frac12\,\dd m\,r^2=\frac12\rho\pi(R^2-z^2)^2\,\dd z$。积分：$\int_{-R}^R(R^2-z^2)^2\,\dd z=2\Bigl(R^5-\frac23R^5+\frac15R^5\Bigr)=\frac{16}{15}R^5$，所以$I_{\mathrm C}=\frac12\rho\pi\cdot\frac{16}{15}R^5=\frac{8}{15}\pi R^5\cdot\frac{3M}{4\pi R^3}=\frac25MR^2$。

    （3）$\frac{I_{\mathrm C}}{MR^2}=\frac25$，$a_{\mathrm C}=\frac{g\sin\theta}{1+2/5}=\frac57g\sin\theta$。

- id: p6
  tier: hard
  statement: |
    保龄球（看成均匀实心球，质量$M$、半径$R$）以速率$v_0$出手，开始时只滑不转，落在水平球道上，球和球道之间的动摩擦因数是$\mu_{\mathrm k}$。

    （1）开始时滑动摩擦力朝哪个方向？它怎样改变球的平动和转动？

    （2）过多长时间球开始纯滚动？这时质心的速率是多少？

    （3）滑动的这段时间里，损失了多少机械能？
  hints:
    - |
      接触点相对球道向前滑，滑动摩擦力向后：它让质心减速，又对质心产生力矩，让球越转越快。
    - |
      $v_{\mathrm C}=v_0-\mu_{\mathrm k}gt$，$\omega=\frac{\mu_{\mathrm k}MgR}{I_{\mathrm C}}t=\frac{5\mu_{\mathrm k}g}{2R}t$；$v_{\mathrm C}=R\omega$时开始纯滚动。
    - |
      $t=\frac{2v_0}{7\mu_{\mathrm k}g}$，$v_{\mathrm C}=\frac57v_0$。
  reference: |
    （1）接触点相对球道向前滑，滑动摩擦力$\mu_{\mathrm k}Mg$向后。由质心运动定理它让质心减速，$a_{\mathrm C}=-\mu_{\mathrm k}g$；由绕质心的转动定律，它对质心的力矩$\mu_{\mathrm k}MgR$让球向前滚的方向越转越快。

    （2）$v_{\mathrm C}=v_0-\mu_{\mathrm k}gt$，$\omega=\frac{\mu_{\mathrm k}MgR}{\frac25MR^2}t=\frac{5\mu_{\mathrm k}g}{2R}t$。$v_{\mathrm C}=R\omega$时接触点不再滑动：$v_0-\mu_{\mathrm k}gt=\frac52\mu_{\mathrm k}gt$，$t=\frac{2v_0}{7\mu_{\mathrm k}g}$，$v_{\mathrm C}=\frac57v_0$。之后摩擦力消失，球以$\frac57v_0$纯滚动。

    （3）开始时动能$\frac12Mv_0^2$；纯滚动时$\frac12\cdot\frac75M\Bigl(\frac57v_0\Bigr)^2=\frac5{14}Mv_0^2$。损失了$\frac12Mv_0^2-\frac5{14}Mv_0^2=\frac17Mv_0^2$，占开始时的$\frac27$，被滑动摩擦变成了内能，和$\mu_{\mathrm k}$的大小无关。

- id: p7
  tier: thinking
  statement: |
    按纯滚动的理想模型，在水平地面上滚动的球，静摩擦力不做功，机械能不损失，应该一直滚下去。

    （1）在水平地面上纯滚动时，静摩擦力有多大？

    （2）真实的球为什么总会慢慢停下来？
  hints:
    - |
      水平地面上匀速纯滚动，质心没有加速度，角速度也不变。
    - |
      球和地面都会稍稍变形，接触的不是一个点，而是一小块。
    - |
      支持力的合力作用点稍稍偏到前面，对质心产生阻碍转动的力矩。
  reference: |
    （1）零。质心匀速运动，由质心运动定理，水平方向的合力是零；角速度不变，对质心的力矩也是零，所以静摩擦力不出现。

    （2）真实的球和地面都会稍稍变形，接触的是一小块面积。前半部分被压下去、后半部分弹回来，压下去时受的力比弹回来时大，支持力的合力作用点稍稍偏到接触区域的前面，对质心产生阻碍转动的力矩。再加上空气的影响，球就慢慢停下来；损失的能量变成了内能。这种阻碍叫滚动阻力（rolling resistance），一般比滑动摩擦小得多，所以轮子比雪橇省力。

- id: p8
  tier: thinking
  statement: |
    线轴放在粗糙的水平桌面上，线从中间较细的轴的下面绕出来。

    （1）沿水平方向拉线，线轴往哪边滚：朝着手，还是背着手？

    （2）把线拉得越来越陡，到什么情况下线轴会改为背着手滚？

    （3）线轴两种滚法之间，有没有一个拉线方向能让它既不往前也不往后？
  hints:
    - |
      对线轴和桌面的接触点取力矩：线轴开始滚动时，就像绕这一点转。
    - |
      看拉力的作用线从接触点的哪一侧经过。
    - |
      拉力的作用线正好经过接触点时，它对接触点的力矩是零。
  reference: |
    （1）朝着手。线从细轴的下面水平拉出，拉力的作用线在接触点的上方、离接触点$R-r$（$R$是大轮的半径，$r$是细轴的半径），对接触点的力矩让线轴朝着拉的方向滚，同时把线卷上去：细轴的最低点相对轴心往后转，把线带回轴上。

    （2）线越陡，拉力的作用线越接近接触点。作用线从接触点的另一侧经过时，力矩反向，线轴就背着手滚，转向也反过来，一边滚一边把线放出去。

    （3）有。拉力的作用线正好经过接触点时，它对接触点没有力矩，重力和支持力也过接触点，线轴不会滚；这时线和水平方向的夹角$\beta$满足$\cos\beta=\frac rR$。拉得够大时，线轴会在桌上滑动，而不滚动。
