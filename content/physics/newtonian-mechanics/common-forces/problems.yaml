- id: p1
  tier: easy
  statement: |
    劲度系数为$200\,\mathrm{N/m}$的轻弹簧上端固定，下端挂一个$0.50\,\mathrm{kg}$的物体，静止时弹簧伸长了多少？$g$取$9.8\,\mathrm{m/s^2}$，以$\mathrm{cm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 0.5*9.8/200*100
    unit: |
      $\mathrm{cm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      物体静止，弹簧的弹力和重力平衡。
    - |
      $kx=mg$，$x=\frac{mg}k$。
    - |
      $x=\frac{0.50\times9.8}{200}=0.0245\,\mathrm m\approx2.45\,\mathrm{cm}$。
  solution: |
    物体静止，合力为零，弹簧向上的弹力等于向下的重力：$kx=mg$，$x=\frac{0.50\times9.8}{200}=0.0245\,\mathrm m\approx2.45\,\mathrm{cm}$。弹簧秤就是这样把质量换成伸长量的。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        同一个物体在月球上的质量比在地球上小
      - |
        轻绳对物体的拉力一定沿着绳子
      - |
        静止在水平桌面上的书对桌面向下的弹力，就是书受的重力
      - |
        物体静止在倾斜的木板上时，木板对它的支持力竖直向上
      - |
        两根弹簧被拉长同样的长度，劲度系数大的那根弹力大
    value: [2, 5]
  hints:
    - |
      质量和重力不是一回事；支持力的方向由接触面决定。
    - |
      书对桌面的弹力和书受的重力，施力的物体、受力的物体各是谁？
    - |
      B、E 对；A、C、D 错。
  solution: |
    A 错：质量和物体在哪里无关，在月球上变小的是重力。B 对：绳子只能沿着自己拉。C 错：两者大小相等，但书对桌面的弹力是书施加在桌面上的，重力是地球施加在书上的，不是同一个力。

    D 错：支持力垂直于接触面，木板倾斜时支持力也跟着倾斜。E 对：弹力$kx$，伸长$x$相同时$k$大的弹力大。

- id: p3
  tier: medium
  statement: |
    质量$50\,\mathrm{kg}$的人站在电梯里的体重秤上。电梯正在向下运行，并以$2.0\,\mathrm{m/s^2}$的加速度减速。秤的示数是多少？$g$取$9.8\,\mathrm{m/s^2}$，以$\mathrm N$为单位。
  answer:
    type: number
    value: 50*(9.8 + 2.0)
    unit: |
      $\mathrm N$
  hints:
    - |
      向下运动、速度在减小，加速度朝哪边？
    - |
      加速度和速度方向相反，所以朝上；取向上为正，$N-mg=ma$。
    - |
      $N=50\times(9.8+2.0)=590\,\mathrm N$。
  solution: |
    电梯向下运动、速度在减小，加速度和速度方向相反，朝上，大小$2.0\,\mathrm{m/s^2}$。人受重力和秤的支持力，取向上为正：$N-mg=ma$，$N=50\times(9.8+2.0)=590\,\mathrm N$，比静止时的$490\,\mathrm N$大。示数只由加速度决定，和电梯往哪边走无关。

- id: p4
  tier: medium
  statement: |
    劲度系数分别为$100\,\mathrm{N/m}$和$300\,\mathrm{N/m}$的两根轻弹簧并排竖直挂着，下端连一根轻杆，在杆上适当的位置挂一个$2.0\,\mathrm{kg}$的物体，使杆保持水平。静止时两根弹簧都伸长了多少？$g$取$9.8\,\mathrm{m/s^2}$，以$\mathrm{cm}$为单位。
  answer:
    type: number
    value: 2*9.8/(100 + 300)*100
    unit: |
      $\mathrm{cm}$
  hints:
    - |
      杆保持水平，两根弹簧伸长的长度相同。
    - |
      两根弹簧的弹力之和等于物体的重力：$(k_1+k_2)x=mg$。
    - |
      $x=\frac{2.0\times9.8}{400}=0.049\,\mathrm m=4.9\,\mathrm{cm}$。
  solution: |
    杆水平，两根弹簧伸长同样的$x$，弹力分别是$k_1x$、$k_2x$。杆和物体合起来静止，两个弹力之和等于重力：$(k_1+k_2)x=mg$，$x=\frac{2.0\times9.8}{400}=0.049\,\mathrm m=4.9\,\mathrm{cm}$。并联的弹簧相当于一根劲度系数为$k_1+k_2$的弹簧，比每一根都硬，和串联的情形（例 2）正好相反。

- id: p5
  tier: hard
  statement: |
    质量为$M$、长为$L$的均匀软绳。

    （1）绳子平放在光滑水平桌面上，用水平力$F$拉它的一端，求离被拉的一端$s$处绳中的拉力。（2）把绳子上端固定、竖直挂着静止，求离下端$y$处绳中的拉力。（3）说明为什么只有轻绳才能说「拉力处处相同」。
  hints:
    - |
      在要求拉力的地方把绳子分成两段，对其中一段用牛顿第二定律。
    - |
      （1）里整根绳子的加速度是$\frac FM$，没被拉的那一段长$L-s$，质量$\frac{M(L-s)}L$。
    - |
      （2）里取下面长$y$的那一段，它静止，拉力等于这一段的重力。
  reference: |
    （1）整根绳子的加速度$a=\frac FM$。在离被拉一端$s$处把绳子分开，后面一段长$L-s$、质量$\frac{M(L-s)}L$，它在水平方向只受前面一段的拉力$T$，所以$T=\frac{M(L-s)}L\cdot\frac FM=F\bigl(1-\frac sL\bigr)$：在被拉的一端是$F$，到另一端减为零。

    （2）取下面长$y$的一段，质量$\frac{My}L$，它静止，上面那段对它的拉力等于它的重力：$T=\frac{Mgy}L$，从下端的零增大到上端的$Mg$。

    （3）两种情形里拉力随位置的变化都和绳子的质量成正比。$M\to0$时，（1）里各处的拉力都是$F$，（2）里各处都是零（再在下端挂一个物体，就处处等于物体的重力）。所以「拉力处处相同」只对质量可以不计的轻绳成立。

- id: p6
  tier: hard
  statement: |
    把一根劲度系数为$k$的轻弹簧截成长度之比为$1:2$的两段。

    （1）求两段各自的劲度系数。（2）把两段并排连起来，像第 4 题那样挂物体，整体的劲度系数是多少？（3）一般地，劲度系数和弹簧的长度有什么关系？用例 2 的结论说明。
  hints:
    - |
      原来的弹簧可以看成两段串联；同样的拉力下，每一圈伸长得一样多。
    - |
      同样的拉力下，短的一段伸长量是整根的$\frac13$。
    - |
      串联时$\frac1k=\frac1{k_1}+\frac1{k_2}$，并联时$k_1+k_2$。
  reference: |
    （1）用力$F$拉整根弹簧，伸长$\frac Fk$，均匀分布在各处，短的一段伸长$\frac F{3k}$，长的一段伸长$\frac{2F}{3k}$，而它们受的拉力都是$F$。所以短的一段$k_1=3k$，长的一段$k_2=\frac32k$。核对：串联时$\frac1{3k}+\frac2{3k}=\frac1k$，回到原来的弹簧。

    （2）并联：$k_1+k_2=3k+\frac32k=\frac92k$。

    （3）劲度系数和长度成反比：截下原长的$\frac1n$，劲度系数是$nk$。由例 2，把$n$段一样的弹簧串联，$\frac1k=\frac n{k_1}$，所以每段的劲度系数$k_1=nk$。弹簧越短越硬。

- id: p7
  tier: thinking
  statement: |
    同一张桌子，放一本书时支持力是$3\,\mathrm N$，放一箱书时支持力是$300\,\mathrm N$；用手往下按书，支持力还会更大。

    （1）桌子怎么「知道」该用多大的力去推？（2）如果桌面是绝对不会变形的理想刚体，支持力的大小还能由形变决定吗？那它由什么决定？（3）为什么说支持力是一种「约束力」？
  hints:
    - |
      桌面有没有形变？形变的大小和放上去的东西有什么关系？
    - |
      在理想刚体的假设下，支持力要满足什么条件，物体才不会穿进桌面？
    - |
      约束力的大小事先不知道，而它产生的效果事先是知道的。
  reference: |
    （1）桌面被压后会发生极小的形变，压得越重，形变越大，弹力越大，直到弹力正好和书受的其他力平衡、书不再下沉为止。桌子不需要「知道」，形变自己调节到合适的大小。

    （2）理想刚体不变形，就不能用形变算支持力。它的大小只能由「物体不穿进桌面」这个条件、连同物体的运动和其他力，用牛顿定律倒推出来：书静止时等于书的重力加上手的压力，电梯加速时又不同。

    （3）支持力的作用是维持「物体不穿过桌面」这个事先规定的条件，它的大小要等运动解出来才知道，这正是分析力学里说的约束力（见[约束与广义坐标](lesson:physics.analytical-mechanics.constraints)）。

- id: p8
  tier: thinking
  statement: |
    在电梯里，体重秤的示数会随电梯的加速度变化（例 1）。

    （1）电梯的缆绳断了，电梯和人一起自由下落，秤的示数是多少？这时人受的重力还在吗？（2）「失重」到底是什么东西消失了？（3）人站在地面上，「感觉到自己的重量」，感觉到的是哪个力？
  hints:
    - |
      自由下落时人的加速度是$g$，用$N-mg=ma$算。
    - |
      重力由地球决定，不随电梯的运动而变；变的是另一个力。
    - |
      人身上各部分之间互相挤压的感觉，来自哪里施加的力？
  reference: |
    （1）自由下落时$a=-g$（向上为正），$N-mg=-mg$，$N=0$，秤的示数为零。人受的重力仍然是$mg$，一点没少，正是它让人以$g$加速下落。

    （2）消失的是支持力。人和秤一起以同样的加速度下落，秤用不着推人，示数为零。所谓「失重」是说秤的示数为零，不是重力消失了。

    （3）站在地面上，地面向上推脚，脚推腿，腿推身体，身体各部分互相挤压，人感到的「重」其实是支持力和这些内部的挤压。自由下落时没有支持力，这种挤压也消失了，人就感到「飘起来」。
