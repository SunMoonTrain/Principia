  <rect x="556.0" y="128.0" width="44.0" height="40.0" style="stroke: currentColor" fill="none" stroke-width="1.6" />
  <line x1="560.0" y1="148.0" x2="513.0" y2="148.0" style="stroke: var(--good, #059669)" stroke-width="2.2" />
  <path d="M 506.0 148.0 L 514.0 144.3 L 514.0 151.7 Z" style="fill: var(--good, #059669)" />
  <text x="530.0" y="132.0" style="fill: var(--good, #059669)" text-anchor="middle"><tspan font-style="italic">F</tspan></text>
  <line x1="512.0" y1="196.0" x2="512.0" y2="214.0" style="stroke: var(--muted, #6b7280)" stroke-width="1.0" />
  <line x1="556.0" y1="196.0" x2="556.0" y2="214.0" style="stroke: var(--muted, #6b7280)" stroke-width="1.0" />
  <line x1="512.0" y1="208.0" x2="551.0" y2="208.0" style="stroke: var(--muted, #6b7280)" stroke-width="1.0" />
  <path d="M 556.0 208.0 L 550.0 210.6 L 550.0 205.4 Z" style="fill: var(--muted, #6b7280)" />
  <text x="534.0" y="230.0" style="fill: var(--muted, #6b7280)" text-anchor="middle"><tspan font-style="italic">x</tspan></text>
  <text x="540.0" y="258.0" fill="currentColor" text-anchor="middle">弹簧：<tspan font-style="italic">F</tspan> = <tspan font-style="italic">k</tspan><tspan font-style="italic">x</tspan>，指向原长</text>
</svg>
