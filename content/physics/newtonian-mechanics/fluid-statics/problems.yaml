- id: p1
  tier: easy
  statement: |
    湖面上的大气压是$1.0\times10^5\,\mathrm{Pa}$，水的密度是$1.0\times10^3\,\mathrm{kg/m^3}$，$g$取$9.8\,\mathrm{m/s^2}$。湖面下$25\,\mathrm m$处的压强是大气压的多少倍？保留三位有效数字。
  answer:
    type: number
    value: (1.0e5 + 1.0e3*9.8*25)/1.0e5
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      湖水静止，液面上是大气压，压强随深度均匀增加。
    - |
      $p=p_0+\rho gh$。
    - |
      $p=1.0\times10^5+1.0\times10^3\times9.8\times25=3.45\times10^5\,\mathrm{Pa}$，是大气压的$3.45$倍。
  solution: |
    湖水静止，液面上的压强是大气压$p_0$，深$h$处$p=p_0+\rho gh=1.0\times10^5+1.0\times10^3\times9.8\times25=3.45\times10^5\,\mathrm{Pa}$，是大气压的$3.45$倍。水每深约$10\,\mathrm m$，压强就增加约一个大气压。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        静止的水里，同一深度处，朝上的面和朝下的面受到的压强一样大
      - |
        往一杯水里放进一个木块，木块浮着，水没有溢出，杯底受到的水的压强变大
      - |
        大气压是空气受到重力而产生的
      - |
        静止液体里的压强只随深度变化，和液体的密度无关
      - |
        液压机的两个活塞一样高时，大活塞上的力比小活塞上的大，所以大活塞下面液体的压强也比小活塞下面的大
    value: [1, 2, 3]
  hints:
    - |
      静止流体里一点的压强和面的方向无关；深$h$处$p=p_0+\rho gh$。
    - |
      放进木块后水面怎样变化？液压机里两个活塞一样高时，压强怎样传递？
    - |
      A、B、C 对；D、E 错。
  solution: |
    A 对：静止流体里一点的压强各个方向都一样。B 对：木块排开一部分水，水面升高，杯底的深度变大，压强变大。C 对：大气层里也有$\dv pz=-\rho g$，海平面的大气压就是上面整个空气柱压下来的。

    D 错：$p=p_0+\rho gh$，同样深时密度越大压强越大。E 错：由帕斯卡原理，两个活塞一样高时，下面液体的压强相等，大活塞的力大是因为面积大。

- id: p3
  tier: medium
  statement: |
    U 形管里先装了一些水，再从右管口慢慢倒进油，油不和水混合，密度是$0.80\times10^3\,\mathrm{kg/m^3}$，水的密度是$1.0\times10^3\,\mathrm{kg/m^3}$。静止时，右管里油柱的高度是$12\,\mathrm{cm}$（从油和水的分界面量到油面）。左管的水面比右管的油面低多少？以$\mathrm{cm}$为单位。
  answer:
    type: number
    value: 12 - 0.80*12
    unit: |
      $\mathrm{cm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      连成一片的同一种静止液体里，同一水平面上压强相等。取油和水的分界面所在的水平面，它下面两边都是水。
    - |
      那个水平面上，右边的压强是$p_0+\rho_{\text{油}}g\times0.12\,\mathrm m$，左边是$p_0+\rho_{\text{水}}gh$，$h$是左管水面比这个水平面高出的高度。
    - |
      $h=\frac{0.80}{1.0}\times12=9.6\,\mathrm{cm}$，左管水面比右管油面低$12-9.6=2.4\,\mathrm{cm}$。
  solution: |
    取油和水的分界面所在的水平面，它下面两边是连成一片的水，所以这个水平面上左右的压强相等：$p_0+\rho_{\text{水}}gh=p_0+\rho_{\text{油}}g\times12\,\mathrm{cm}$。得$h=\frac{0.80}{1.0}\times12=9.6\,\mathrm{cm}$。右管的油面比这个水平面高$12\,\mathrm{cm}$，所以左管的水面比右管的油面低$2.4\,\mathrm{cm}$。

- id: p4
  tier: medium
  statement: |
    木桶里装满了水，桶盖的面积是$0.20\,\mathrm{m^2}$，盖上竖直插着一根细管，管的横截面积是$1.0\,\mathrm{cm^2}$。往管里灌水，直到管里的水面比桶盖高$10\,\mathrm m$，一共只灌进去约$1\,\mathrm L$水。这时水对桶盖内表面的压力，比灌水前增加了多少？以$\mathrm N$为单位，保留三位有效数字，$g$取$9.8\,\mathrm{m/s^2}$，水的密度是$1.0\times10^3\,\mathrm{kg/m^3}$。
  answer:
    type: number
    value: 1.0e3*9.8*10*0.20
    unit: |
      $\mathrm N$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      灌水后桶盖下面的压强增加了多少？它只看管里的水面高出多少，和灌进去多少水无关。
    - |
      增加的压强是$\rho gh$，$h=10\,\mathrm m$；细管的截面和桶盖比可以不计。
    - |
      $\Delta F=\rho ghS=1.0\times10^3\times9.8\times10\times0.20=1.96\times10^4\,\mathrm N$。
  solution: |
    灌水前水面就在桶盖处，灌水后桶盖下面的水比管里的水面低$10\,\mathrm m$，压强增加$\rho gh=1.0\times10^3\times9.8\times10=9.8\times10^4\,\mathrm{Pa}$。压力增加$9.8\times10^4\times0.20=1.96\times10^4\,\mathrm N$，相当于两吨的东西压在盖上，可灌进去的水只重约$9.8\,\mathrm N$。传说帕斯卡就是这样用一根细管把木桶撑裂的。

- id: p5
  tier: hard
  statement: |
    设大气的温度处处相同，这时空气的密度和压强成正比，$\rho=\frac p{gH}$，$H$是常量，约为$8\,\mathrm{km}$。取$z$轴竖直向上，海平面处$z=0$，$p=p_0$。

    （1）由讲解里的定理写出$p(z)$满足的方程，验证$p=p_0e^{-z/H}$满足它。

    （2）证明它是唯一的：设$p(z)$满足这个方程、$p(0)=p_0$，求$p(z)e^{z/H}$的导数。

    （3）按这个模型，海拔$8.8\,\mathrm{km}$处的大气压约是海平面的几分之几？要是把空气的密度当作处处和海平面一样，又会得到什么？
  hints:
    - |
      $\dv pz=-\rho g=-\frac pH$。
    - |
      $\dv{}z\bigl(p\,e^{z/H}\bigr)=\Bigl(\dv pz+\frac pH\Bigr)e^{z/H}=0$；导数处处为零的函数是常数。
    - |
      $e^{-8.8/8}=e^{-1.1}\approx0.33$。密度处处是海平面的$\rho_0=\frac{p_0}{gH}$时，$p=p_0\Bigl(1-\frac zH\Bigr)$。
  reference: |
    （1）$\dv pz=-\rho g=-\frac pH$。$p=p_0e^{-z/H}$时，由链式法则$\dv pz=-\frac{p_0}He^{-z/H}=-\frac pH$，并且$p(0)=p_0$。

    （2）$\dv{}z\bigl(p\,e^{z/H}\bigr)=\dv pz e^{z/H}+\frac pHe^{z/H}=0$，所以$p\,e^{z/H}$是常数，等于它在$z=0$的值$p_0$，即$p=p_0e^{-z/H}$。

    （3）$\frac p{p_0}=e^{-1.1}\approx0.33$，约是海平面的$\frac13$，和珠穆朗玛峰顶的实测值差不多。密度不变时$p=p_0-\rho_0gz=p_0\Bigl(1-\frac zH\Bigr)$，到$8\,\mathrm{km}$就降到零，再往上成了负数，大气像有一个明确的顶。真实的空气越往上越稀薄，压强按指数慢慢减小，没有这样的顶。

- id: p6
  tier: hard
  statement: |
    证明讲解里的定理：静止流体里一点的压强和面的方向无关。在这一点取一个很小的三棱柱形流体块，棱沿水平方向，长$w$；截面是直角三角形，竖直的直角边长$b$，水平的直角边长$a$，斜边长$c$。设竖直、水平、倾斜三个侧面上的压强分别是$p_1$、$p_2$、$p_3$，流体的密度是$\rho$。

    （1）写出流体块在水平方向、竖直方向合力为零的方程。两个三角形端面上的压力为什么不用管？

    （2）让流体块按比例缩小，证明$p_1=p_2=p_3$。

    （3）为什么由此可以说各个方向的压强都相等？
  hints:
    - |
      倾斜侧面的面积是$cw$，它受的压力垂直于它，水平分量占$\frac bc$，竖直分量占$\frac ac$。
    - |
      水平：$p_1bw=p_3cw\cdot\frac bc$；竖直：$p_2aw=p_3cw\cdot\frac ac+\frac12\rho gabw$，最后一项是重力。
    - |
      第一式给$p_1=p_3$；第二式两边除以$aw$，$p_2=p_3+\frac12\rho gb$，缩小时$b\to0$。
  reference: |
    （1）三个侧面受的压力都垂直于各自的面。倾斜侧面的法线和水平方向、竖直方向的夹角的余弦分别是$\frac bc$、$\frac ac$，所以水平方向$p_1bw=p_3cw\cdot\frac bc$，竖直方向$p_2aw=p_3cw\cdot\frac ac+\frac12\rho gabw$，最后一项是流体块受的重力。两个三角形端面上的压力沿着棱，垂直于截面，不进入这两个方程。

    （2）第一式给$p_1=p_3$。第二式两边除以$aw$，得$p_2=p_3+\frac12\rho gb$。流体块缩小时$b\to0$，所以$p_2=p_3$，三者相等。

    （3）$a$、$b$可以任意取，棱的水平方向也可以任意取，倾斜侧面的法线就能指向任何方向，而它上面的压强总等于水平面上的压强$p_2$。所以这一点的压强和面的方向无关。

- id: p7
  tier: thinking
  statement: |
    讲解里说，静止流体里一点的压强和面的方向无关。可是平放在桌上的一块砖，内部水平截面上每平方米受的压力（上面那部分砖的重力分摊下来的），和竖直截面上的显然不一样。

    （1）第 6 题的证明里，哪一步用到了「流体」？

    （2）为什么这一步对固体不成立？
  hints:
    - |
      证明里每个侧面受的力是怎样写的？方向是什么？
    - |
      静止的固体，内部相邻两部分之间能不能有沿着截面的力？
    - |
      静止流体只有垂直于面的力；固体静止时也能有沿着面的力。
  reference: |
    （1）证明里把每个侧面受的力写成「压强乘面积」，方向垂直于这个面。这用到了流体的性质：静止的流体对和它接触的面只能垂直地推，要是有沿着面的力，流体就会流动。

    （2）固体静止时，内部相邻两部分之间可以有沿着截面的力，它不会因此流走。小三棱柱的各个侧面上除了垂直的力，还可能有沿着面的力，两个平衡方程里多出了未知量，推不出三个面上垂直的力分摊到每平方米一样大。砖的竖直截面几乎不受挤压，水平截面却托着上面的砖，正是这样。

- id: p8
  tier: thinking
  statement: |
    杯子装满水，盖上一张硬纸片，按住纸片把杯子倒过来，松手后纸片不掉，水也不流出来。大气压取$1.0\times10^5\,\mathrm{Pa}$。

    （1）是什么托住了纸片和杯里的水？

    （2）杯子高$10\,\mathrm{cm}$，杯里没有空气，纸片的质量不计，所以纸片内外的压强相等。杯底（现在在上面）处水的压强是多少？

    （3）换成很高的「杯子」，大约多高时这个实验就不成功了？
  hints:
    - |
      纸片外面受大气压，里面受水的压强。
    - |
      纸片处水的压强等于大气压，杯底在它上面$10\,\mathrm{cm}$，压强小$\rho gh$。
    - |
      杯底处的压强不能小于零：$\rho gh\le p_0$。
  reference: |
    （1）大气压。纸片外面受向上的大气压，里面受水的压强，纸片的质量不计，两者相等，水就被托住了。

    （2）杯底比纸片高$0.10\,\mathrm m$，压强比纸片处小$\rho gh=1.0\times10^3\times9.8\times0.10=980\,\mathrm{Pa}$，是$1.0\times10^5-980\approx9.9\times10^4\,\mathrm{Pa}$，比大气压略小。

    （3）杯底处的压强是$p_0-\rho gh$，不能小于零，所以$h\le\frac{p_0}{\rho g}\approx10\,\mathrm m$。超过这个高度，杯底处的水就托不住，会出现真空，正像托里拆利管里的水银柱停在$760\,\mathrm{mm}$处。实际上压强降得很低时水会汽化，能做到的高度比$10\,\mathrm m$还略低；纸片的作用是让水面保持平整，不让空气从一边钻进去。
