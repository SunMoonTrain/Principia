  <!-- 三种一维碰撞前后的速度，箭头的长短按同一比例画。第一行，两个质量相等的球做弹性碰撞：碰前左球以速度 v 向右运动、右球静止；碰后左球静止，右球以速度 v 向右运动。第二行，两个质量相等的球做完全非弹性碰撞：碰后粘在一起，以速度 v/2 向右运动。第三行，质量为 m 的小球以速度 v 撞上静止的、质量为 3m 的大球，做弹性碰撞：碰后小球以 v/2 向左弹回，大球以 v/2 向右运动。 -->
