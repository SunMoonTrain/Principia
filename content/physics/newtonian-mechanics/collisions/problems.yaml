- id: p1
  tier: easy
  statement: |
    光滑水平面上，质量$2.0\,\mathrm{kg}$的小车以$3.0\,\mathrm{m/s}$撞上静止的、质量$1.0\,\mathrm{kg}$的小车，两车挂在一起运动。碰撞损失了多少动能？以$\mathrm J$为单位。
  answer:
    type: number
    value: 0.5*2*3^2 - 0.5*3*(2*3/3)^2
    unit: |
      $\mathrm J$
  hints:
    - |
      两车挂在一起，是完全非弹性碰撞，先由动量守恒求共同速度。
    - |
      $v'=\frac{2.0\times3.0}{3.0}=2.0\,\mathrm{m/s}$。
    - |
      碰前动能$9.0\,\mathrm J$，碰后$\frac12\times3.0\times2.0^2=6.0\,\mathrm J$，损失$3.0\,\mathrm J$。
  solution: |
    由动量守恒，$v'=\frac{2.0\times3.0}{2.0+1.0}=2.0\,\mathrm{m/s}$。碰前动能$\frac12\times2.0\times3.0^2=9.0\,\mathrm J$，碰后$\frac12\times3.0\times2.0^2=6.0\,\mathrm J$，损失$3.0\,\mathrm J$。也可以直接用$\Delta K=\frac{m_1m_2}{2(m_1+m_2)}(v_1-v_2)^2=\frac{2.0}{6.0}\times9.0=3.0\,\mathrm J$。

- id: p2
  tier: easy
  statement: |
    下面关于两个物体沿同一直线碰撞的说法，哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        非弹性碰撞中，系统的总动量不守恒
      - |
        完全非弹性碰撞后两个物体的共同速度，等于碰前两个物体的质心的速度
      - |
        轻的物体和静止的重物体发生弹性碰撞，轻的物体一定被弹回来
      - |
        两辆车迎面相撞后卡在一起，如果碰前两车的动量大小相等，碰后两车静止
      - |
        碰撞以后，两个物体一定是一个向前、一个向后运动
    value: [2, 3, 4]
  hints:
    - |
      不论哪种碰撞，碰撞前后总动量都守恒；质心的速度是总动量除以总质量。
    - |
      $v_1'=\frac{m_1-m_2}{m_1+m_2}v_1$（$v_2=0$），看它的正负。
    - |
      B、C、D 对；A、E 错。
  solution: |
    A 错：碰撞时外力的冲量可以忽略，不论弹性还是非弹性，总动量都守恒，损失的只是动能。B 对：共同速度$\frac{m_1v_1+m_2v_2}{m_1+m_2}$正是质心的速度，碰撞改变不了它。C 对：$v_2=0$时$v_1'=\frac{m_1-m_2}{m_1+m_2}v_1$，$m_1<m_2$时它和$v_1$反号。

    D 对：碰前总动量为零，碰后的共同速度也是零。E 错：例如重的物体撞上静止的轻物体，碰后两者都向前运动；质量相等的弹性碰撞，撞上去的物体停了下来。

- id: p3
  tier: medium
  statement: |
    光滑水平面上，质量$2.0\,\mathrm{kg}$的小球以$4.0\,\mathrm{m/s}$向右运动，和以$1.0\,\mathrm{m/s}$向左运动、质量$3.0\,\mathrm{kg}$的小球正面相碰，碰撞是弹性碰撞。碰后$3.0\,\mathrm{kg}$的小球的速度是多少？以$\mathrm{m/s}$为单位，向右为正。
  answer:
    type: number
    value: ((3 - 2)*(-1) + 2*2*4)/(2 + 3)
    unit: |
      $\mathrm{m/s}$
  hints:
    - |
      取向右为正，$v_1=4.0\,\mathrm{m/s}$，$v_2=-1.0\,\mathrm{m/s}$。
    - |
      弹性碰撞的相对速度反向：$v_2'-v_1'=5.0\,\mathrm{m/s}$；再加上动量守恒。
    - |
      $2.0\times4.0+3.0\times(-1.0)=2.0v_1'+3.0v_2'$，和上式联立得$v_2'=3.0\,\mathrm{m/s}$。
  solution: |
    取向右为正。动量守恒：$2.0\times4.0+3.0\times(-1.0)=5.0=2.0v_1'+3.0v_2'$。相对速度反向：$v_2'-v_1'=-(v_2-v_1)=5.0$。

    联立解得$v_1'=-2.0\,\mathrm{m/s}$，$v_2'=3.0\,\mathrm{m/s}$，两球都反了向。验算动能：碰前$16+1.5=17.5\,\mathrm J$，碰后$4+13.5=17.5\,\mathrm J$。

- id: p4
  tier: medium
  statement: |
    质子以某一速度正面撞上静止的氦原子核，氦核的质量是质子的$4$倍，碰撞是弹性碰撞。质子的动能有百分之几交给了氦核？保留三位有效数字。
  answer:
    type: number
    value: 100*4*1*4/(1 + 4)^2
    unit: |
      $\%$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      $v_2=0$时，氦核的末速度是$\frac{2m_1}{m_1+m_2}v_1$。
    - |
      $v_2'=\frac{2}{5}v_1$，氦核的动能是$\frac12\cdot4m\cdot\frac4{25}v_1^2$。
    - |
      占质子原来动能的$\frac{16}{25}=64.0\%$。
  solution: |
    取$m_1=m$、$m_2=4m$。由弹性碰撞的公式，$v_2'=\frac{2m}{5m}v_1=\frac25v_1$，氦核的动能$\frac12\cdot4m\cdot\frac4{25}v_1^2=\frac{16}{25}\cdot\frac12mv_1^2$，占$64.0\%$。一般地，正面弹性碰撞交出去的比例是$\frac{4m_1m_2}{(m_1+m_2)^2}$，两者质量相等时是$100\%$。

- id: p5
  tier: hard
  statement: |
    把一个小弹力球叠放在一个大篮球上方，两者几乎挨着，从高$h$处一起由静止放下。篮球先落地并以原来的速率弹起，这时小球正以同样的速率下落，两者随即发生弹性碰撞。空气的影响可以忽略，两个球都看作质点，篮球的质量是$M$，小球是$m$。

    （1）求碰后小球向上的速度，用落地速率$v$表示。

    （2）$m$远小于$M$时，小球能弹到多高？

    （3）$m=\frac M3$时呢？
  hints:
    - |
      取向上为正：碰前篮球的速度是$v$，小球是$-v$。
    - |
      用一维弹性碰撞的公式求小球的末速度。
    - |
      上升的高度由$v'^2=2gH$求，而$v^2=2gh$。
  reference: |
    （1）取向上为正，碰前篮球$v_2=v$，小球$v_1=-v$。由弹性碰撞的公式，$v_1'=\frac{(m-M)(-v)+2Mv}{m+M}=\frac{3M-m}{M+m}v$。

    （2）$m\ll M$时$v_1'\approx3v$。由匀变速直线运动，上升高度$H=\frac{v_1'^2}{2g}=9\cdot\frac{v^2}{2g}=9h$，从碰撞处算起约是原来高度的$9$倍。在篮球上看，小球以$2v$撞来、以$2v$弹回，换回地面就是$3v$。

    （3）$m=\frac M3$时$v_1'=\frac{3M-M/3}{4M/3}v=2v$，$H=4h$。这时篮球也损失了速度：$v_2'=\frac{(M-m)v+2m(-v)}{m+M}=0$，篮球停在地上，它的动能全交给了小球。

- id: p6
  tier: hard
  statement: |
    两个物体沿同一直线碰撞，定义恢复系数（coefficient of restitution）$e=\frac{v_2'-v_1'}{v_1-v_2}$，即碰后相互远离的速度和碰前相互接近的速度之比。

    （1）说明弹性碰撞$e=1$，完全非弹性碰撞$e=0$。

    （2）用$e$表示碰后的速度，并证明损失的动能是$(1-e^2)\frac{m_1m_2}{2(m_1+m_2)}(v_1-v_2)^2$。

    （3）小球从高$h$处落到很重的水平地面上，恢复系数是$e$，它能弹回多高？
  hints:
    - |
      弹性碰撞时相对速度反向；完全非弹性碰撞后两者速度相同。
    - |
      把$v_2'-v_1'=-e(v_2-v_1)$和动量守恒联立；损失的动能可以按质心速度和相对速度分开算。
    - |
      地面看作质量无穷大、一直静止的物体。
  reference: |
    （1）弹性碰撞时$v_2'-v_1'=-(v_2-v_1)=v_1-v_2$，$e=1$；完全非弹性碰撞后$v_1'=v_2'$，$e=0$。

    （2）记$V=\frac{m_1v_1+m_2v_2}{m_1+m_2}$，它碰撞前后不变。由动量守恒和$v_2'-v_1'=e(v_1-v_2)$，解得$v_1'=V-\frac{m_2}{m_1+m_2}e(v_1-v_2)$，$v_2'=V+\frac{m_1}{m_1+m_2}e(v_1-v_2)$。碰前的速度也可以写成$v_1=V+\frac{m_2}{m_1+m_2}(v_1-v_2)$、$v_2=V-\frac{m_1}{m_1+m_2}(v_1-v_2)$，代进动能，交叉项抵消，总动能是$\frac12(m_1+m_2)V^2+\frac{m_1m_2}{2(m_1+m_2)}(v_1-v_2)^2$；碰后同样，只是相对速度乘了$e$。两者相减就是所求。

    （3）$m_2\to\infty$、$v_2=0$时$v_1'=-ev_1$，小球以$e$倍的速率弹起，高度是$e^2h$。量弹起的高度就能测出$e$。

- id: p7
  tier: thinking
  statement: |
    现代汽车的车头、车尾设计成撞击时容易变形的「溃缩区」（crumple zone），乘客坐的车厢却做得很坚固。

    （1）汽车撞上坚固的墙停下时，它的动量改变一定。溃缩区变形，对车厢受的力有什么影响？

    （2）这是一次什么样的碰撞？汽车的动能到哪里去了？

    （3）为什么车厢不能也容易变形？
  hints:
    - |
      动量的改变一定时，作用的时间越长，平均力越小。
    - |
      车撞墙以后几乎不反弹。
    - |
      溃缩区「吃掉」动能，车厢要保住乘客的空间。
  reference: |
    （1）溃缩区一点点地压扁，让车从运动到停下的时间变长，由动量定理，平均力就变小，车厢和乘客受的减速的力小得多。

    （2）车撞墙后几乎不反弹，接近完全非弹性碰撞。动能主要用来使车头变形，变成了内能，还有一部分变成声音。

    （3）车厢变形会挤压乘客的空间，直接伤到人。所以让车头、车尾去变形、吸收能量，车厢保持坚固，加上安全带和气囊，进一步延长人减速的时间。

- id: p8
  tier: thinking
  statement: |
    一维弹性碰撞里，动量守恒和动能守恒两个方程联立。

    （1）除了讲解里的解，这个方程组还有一组解，是什么？

    （2）这组解在物理上代表什么情况？为什么要舍去？

    （3）证明里「速度有改变时」这句话起什么作用？
  hints:
    - |
      试一试碰后的速度等于碰前的速度。
    - |
      两个物体都没有改变速度，它们之间有过相互作用吗？
    - |
      除以一个可能为零的量之前，要先排除它为零的情形。
  reference: |
    （1）$v_1'=v_1$、$v_2'=v_2$显然同时满足两个守恒式，这是另一组解。

    （2）它代表两个物体根本没有相互作用，例如彼此错开、擦肩而过。题目说两者发生了碰撞，速度确实改变了，所以舍去。

    （3）证明里要用动能式除以动量式，除数$m_1(v_1-v_1')$不能是零。「速度有改变时」排除的正是上面那组解；排除以后，两个守恒式等价于动量守恒加上「相对速度反向」，解是唯一的。
