  <text x="454.0" y="174.5" fill="currentColor" text-anchor="middle"><tspan font-style="italic">r</tspan></text>
  <text x="408.7" y="93.8" style="fill: var(--accent, #2563eb)" text-anchor="middle">d<tspan font-style="italic">r</tspan></text>
  <text x="470.0" y="268.0" fill="currentColor" text-anchor="middle">圆盘：转轴垂直于纸面</text>
</svg>
