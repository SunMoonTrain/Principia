- id: p1
  tier: easy
  statement: |
    一根轻杆绕过一端、垂直于杆的轴转动，杆上装着三个小球：$1.0\,\mathrm{kg}$的离转轴$0.10\,\mathrm m$，$2.0\,\mathrm{kg}$的离转轴$0.20\,\mathrm m$，$3.0\,\mathrm{kg}$的离转轴$0.30\,\mathrm m$。小球当作质点，整体对这条轴的转动惯量是多少？以$\mathrm{kg\cdot m^2}$为单位，保留两位有效数字。
  answer:
    type: number
    value: 1.0*0.10^2 + 2.0*0.20^2 + 3.0*0.30^2
    unit: |
      $\mathrm{kg\cdot m^2}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      转动惯量是各质点的质量乘它到转轴距离的平方，再加起来；轻杆不算。
    - |
      $I=\sum m_id_i^2$。
    - |
      $I=1.0\times0.010+2.0\times0.040+3.0\times0.090=0.36\,\mathrm{kg\cdot m^2}$。
  solution: |
    $I=\sum m_id_i^2=1.0\times0.10^2+2.0\times0.20^2+3.0\times0.30^2$，三项分别是$0.01$、$0.08$、$0.27$，加起来是$0.36\,\mathrm{kg\cdot m^2}$。最外面的小球贡献了四分之三：离转轴的距离是平方着进去的。

- id: p2
  tier: easy
  statement: |
    下面关于刚体定轴转动的说法，哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        匀速转动的刚体上，离转轴越远的点，向心加速度越大
      - |
        刚体上离转轴一样远的两点，速度相同
      - |
        质量相同的两个刚体，对各自转轴的转动惯量一定相同
      - |
        刚体对一条轴的转动惯量和它转得多快无关
      - |
        一块均匀的正方形薄板，绕过中心、垂直于板面的轴转动时的转动惯量，比绕过一个角、垂直于板面的轴转动时的小
    value: [1, 4, 5]
  hints:
    - |
      各点的角速度相同，离转轴$d$处的向心加速度是$\omega^2d$；速度是矢量。
    - |
      $I=\sum m_id_i^2$只和质量相对转轴的分布有关。
    - |
      A、D、E 对；B、C 错。
  solution: |
    A 对：各点的角速度相同，向心加速度$\omega^2d$和到转轴的距离成正比。B 错：两点的速率相同，都是$d|\omega|$，可速度的方向不同，各沿自己那个圆的切线。C 错：转动惯量还看质量离转轴多远。

    D 对：$I=\sum m_id_i^2$只由质量的分布和转轴的位置决定。E 对：板上各点到中心的距离，平均起来比到一个角的距离小，绕角转时大部分质量离转轴更远。

- id: p3
  tier: medium
  statement: |
    质量$1.2\,\mathrm{kg}$、长$0.80\,\mathrm m$的均匀细杆，绕垂直于杆、离杆的一端$\frac14$杆长的轴转动。用微元法求它对这条轴的转动惯量，以$\mathrm{kg\cdot m^2}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 7/48*1.2*0.80^2
    unit: |
      $\mathrm{kg\cdot m^2}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      以转轴和杆的交点为原点，杆从$x=-\frac l4$伸到$x=\frac{3l}4$。
    - |
      $I=\int_{-l/4}^{3l/4}x^2\frac Ml\,\dd x$。
    - |
      $I=\frac Ml\cdot\frac13\Bigl(\frac{27}{64}+\frac1{64}\Bigr)l^3=\frac7{48}Ml^2\approx0.112\,\mathrm{kg\cdot m^2}$。
  solution: |
    以转轴和杆的交点为原点，杆从$-\frac l4$伸到$\frac{3l}4$，每单位长度的质量是$\frac Ml$。$I=\int_{-l/4}^{3l/4}x^2\frac Ml\,\dd x=\frac Ml\cdot\frac13\Bigl(\frac{27}{64}+\frac1{64}\Bigr)l^3=\frac7{48}Ml^2=\frac7{48}\times1.2\times0.80^2=0.112\,\mathrm{kg\cdot m^2}$。它介于对中点的$\frac1{12}Ml^2$和对一端的$\frac13Ml^2$之间。

- id: p4
  tier: medium
  statement: |
    质量$2.0\,\mathrm{kg}$、半径$0.10\,\mathrm m$的均匀圆盘绕过圆心、垂直于盘面的竖直轴以$30\,\mathrm{rad/s}$转动，转轴光滑。把一个质量$1.0\,\mathrm{kg}$、半径也是$0.10\,\mathrm m$的均匀细圆环同轴地轻轻放到盘上，圆环原来不转，后来和圆盘一起转。这时的角速度是多少？以$\mathrm{rad/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 0.5*2.0*0.10^2*30/(0.5*2.0*0.10^2 + 1.0*0.10^2)
    unit: |
      $\mathrm{rad/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      圆环和圆盘之间的力是内力；重力平行于转轴，转轴的力通过转轴，沿转轴的角动量守恒。
    - |
      圆盘的$I_1=\frac12MR^2$，圆环的$I_2=MR^2$；$I_1\omega_0=(I_1+I_2)\omega$。
    - |
      $I_1=0.010\,\mathrm{kg\cdot m^2}$，$I_2=0.010\,\mathrm{kg\cdot m^2}$，$\omega=\frac{0.010\times30}{0.020}=15.0\,\mathrm{rad/s}$。
  solution: |
    圆环和圆盘之间的力是内力；外力里重力平行于转轴，转轴的力通过转轴，沿转轴的力矩都是零，$L_z$守恒。$I_1=\frac12\times2.0\times0.10^2=0.010\,\mathrm{kg\cdot m^2}$，$I_2=1.0\times0.10^2=0.010\,\mathrm{kg\cdot m^2}$，所以$\omega=\frac{I_1\omega_0}{I_1+I_2}=15.0\,\mathrm{rad/s}$。质量只有圆盘一半的圆环，转动惯量却和圆盘一样大。

- id: p5
  tier: hard
  statement: |
    薄板放在$xy$平面里，对$x$轴、$y$轴和过原点垂直于板面的$z$轴的转动惯量分别是$I_x$、$I_y$、$I_z$。

    （1）证明$I_z=I_x+I_y$，这叫垂直轴定理（perpendicular axis theorem）。

    （2）用它求质量$M$、半径$R$的均匀圆盘对一条直径的转动惯量。

    （3）厚度不能忽略的物体（例如长方体），这个定理还成立吗？
  hints:
    - |
      板上一点$(x_i,y_i)$到$z$轴的距离的平方是$x_i^2+y_i^2$，到$x$轴的距离的平方是多少？
    - |
      到$x$轴的距离是$|y_i|$，到$y$轴的距离是$|x_i|$。
    - |
      圆盘的两条互相垂直的直径地位相同，$I_x=I_y$，而$I_z=\frac12MR^2$。
  reference: |
    （1）板上的质点都在$xy$平面里，第$i$个质点到$x$轴的距离是$|y_i|$，到$y$轴的距离是$|x_i|$，到$z$轴的距离是$\sqrt{x_i^2+y_i^2}$。所以$I_z=\sum m_i(x_i^2+y_i^2)=\sum m_iy_i^2+\sum m_ix_i^2=I_x+I_y$。

    （2）取圆心为原点，两条互相垂直的直径为$x$轴、$y$轴。圆盘绕圆心转过$90^\circ$后和原来重合，所以$I_x=I_y$；由（1），$2I_x=I_z=\frac12MR^2$，对直径的转动惯量是$\frac14MR^2$。

    （3）一般不成立。物体有厚度时，质点到$x$轴的距离的平方是$y_i^2+z_i^2$，到$y$轴的是$x_i^2+z_i^2$，$I_x+I_y=I_z+2\sum m_iz_i^2$，比$I_z$大；只有所有质点都在$z=0$的平面里时，多出的一项才是零。

- id: p6
  tier: hard
  statement: |
    均匀的圆环形薄板（垫圈），质量为$M$，内半径为$a$，外半径为$b$。

    （1）用微元法求它对过圆心、垂直于板面的轴的转动惯量。

    （2）$a\to0$和$a\to b$时，结果各变成什么？和讲解里的结论对一对。

    （3）质量和外半径都不变，内半径越大，转动惯量越大还是越小？为什么？
  hints:
    - |
      每单位面积的质量是$\frac M{\pi(b^2-a^2)}$；半径$r$到$r+\dd r$的细圆环面积约为$2\pi r\,\dd r$。
    - |
      $I=\int_a^br^2\cdot\frac M{\pi(b^2-a^2)}\cdot2\pi r\,\dd r$。
    - |
      $b^4-a^4=(b^2-a^2)(b^2+a^2)$。
  reference: |
    （1）每单位面积的质量是$\frac M{\pi(b^2-a^2)}$，$I=\int_a^br^2\cdot\frac M{\pi(b^2-a^2)}\cdot2\pi r\,\dd r=\frac{2M}{b^2-a^2}\cdot\frac{b^4-a^4}4=\frac12M(a^2+b^2)$。

    （2）$a\to0$时是$\frac12Mb^2$，就是圆盘；$a\to b$时是$Mb^2$，就是细圆环。

    （3）越大。$\frac12M(a^2+b^2)$随$a$增大：总质量不变，内半径大了，质量都挤到外圈，平均离转轴更远。

- id: p7
  tier: thinking
  statement: |
    一根细杆的中点固定在竖直的转轴上，杆和转轴成$30^\circ$角，杆两端各有一个质量为$m$的小球，离中点都是$r$，杆的质量不计。整体绕转轴以角速度$\omega$匀速转动。

    （1）对杆的中点，两个小球的总角动量沿不沿转轴？

    （2）$L_z=I\omega$还成立吗？$I$是多少？

    （3）总角动量的方向随时间怎样变化？要维持这样的转动，转轴要不要对杆施加力矩？
  hints:
    - |
      某一时刻，两个小球都在过转轴的同一个竖直平面里，速度都垂直于这个平面。
    - |
      每个小球的$\vb r\times m\vb v$垂直于杆，也垂直于速度。
    - |
      总角动量垂直于杆、在那个竖直平面里，跟着杆一起绕转轴转。
  reference: |
    （1）不沿转轴。某一时刻，两个小球都在过转轴的同一个竖直平面里，速度垂直于这个平面，各自的$\vb r\times m\vb v$在这个平面里、垂直于杆。两个小球的位置相反、速度也相反，角动量相同，总角动量垂直于杆，和转轴成$60^\circ$。

    （2）成立。每个小球到转轴的距离是$r\sin30^\circ=\frac r2$，$I=2m\Bigl(\frac r2\Bigr)^2=\frac12mr^2$，总角动量沿转轴的分量就是$I\omega$；另外还有一个垂直于转轴的分量。

    （3）总角动量的大小不变，方向跟着杆绕转轴转，垂直于转轴的那个分量一直在改变方向，所以总角动量在变。由角动量定理，转轴必须对杆施加力矩，它垂直于转轴、跟着杆一起转，轴承因此受到周期性变化的力。车轮装歪了转快时轴承会震，就是这个道理。

- id: p8
  tier: thinking
  statement: |
    定轴转动的刚体，一个转角就确定了它的位置。

    （1）为什么一个转角就够了？说明刚体上任意一点的位置是怎样由它确定的。

    （2）陀螺的尖端在桌面上不动，整个陀螺绕这一点转动，转轴本身也在变。这时一个角还够不够？
  hints:
    - |
      刚体上各点之间的距离不变，每个点到转轴的距离也不变。
    - |
      绕一点转动时，先想转轴的方向要几个数才能定下来。
    - |
      定下转轴的方向要两个角，再要一个角说明绕这根轴转了多少。
  reference: |
    （1）每个点到转轴的距离和它在转轴方向上的位置都不变，只能在一个固定的圆上运动；刚体上各点之间的距离不变，所以只要知道一条垂直于转轴的直线转过的角$\theta$，每个点在自己的圆上的位置就跟着确定了，都比开始时转过同一个角。

    （2）不够。绕一个固定点转动时，先要两个角定下对称轴的方向（比如它和竖直方向的夹角，以及它在水平面上的投影指向哪里），再要一个角说明陀螺绕自己的轴转了多少，一共三个。分析力学里会用三个这样的角描述刚体的取向。
