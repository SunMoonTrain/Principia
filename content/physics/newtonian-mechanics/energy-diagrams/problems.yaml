- id: p1
  tier: easy
  statement: |
    质点沿$x$轴运动，势能是$U=3x^2-12x+5$（$U$以$\mathrm J$为单位，$x$以$\mathrm m$为单位）。它的平衡位置在哪里？以$\mathrm m$为单位。
  answer:
    type: number
    value: 12/6
    unit: |
      $\mathrm m$
  hints:
    - |
      平衡位置满足$U'(x)=0$。
    - |
      $U'=6x-12$。
    - |
      $6x-12=0$，$x=2\,\mathrm m$；$U''=6>0$，是稳定平衡。
  solution: |
    平衡位置处力$-U'$为零：$U'=6x-12=0$，$x=2\,\mathrm m$。$U''=6>0$，这里是$U$的极小值点，是稳定平衡。势能曲线是开口向上的抛物线，平衡位置正是它的最低点。

- id: p2
  tier: easy
  statement: |
    质点沿$x$轴运动，只有一个保守力做功。下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        势能曲线越陡的地方，质点受的力越大
      - |
        在质点能到达的范围里，它经过势能最低的地方时速率最大
      - |
        机械能不同，同一条势能曲线上的平衡位置也不同
      - |
        $U=x^4$时$U''(0)=0$，所以$x=0$不是稳定平衡
      - |
        把整条势能曲线向上平移，质点受的力不变
    value: [1, 2, 5]
  hints:
    - |
      力是$-U'(x)$；动能是$E-U(x)$。
    - |
      平衡位置只由$U'=0$决定；$U''=0$时二阶导数判别法什么也不说。
    - |
      A、B、E 对；C、D 错。
  solution: |
    A 对：力的大小是$|U'(x)|$，就是曲线的陡峭程度。B 对：动能$E-U(x)$在$U$最小处最大。C 错：平衡位置由$U'(x)=0$决定，和机械能无关。

    D 错：$U''(0)=0$时二阶导数判别法失效，要看两侧：$U'=4x^3$在左侧为负、右侧为正，力都指向原点，$x=0$是稳定平衡。E 对：$U$加上常数，$U'$不变，力不变。

- id: p3
  tier: medium
  statement: |
    质量$0.50\,\mathrm{kg}$的质点沿$x$轴运动，势能是$U=2x^2+x^4$（$U$以$\mathrm J$为单位，$x$以$\mathrm m$为单位），只有这个保守力做功。它的转折点在$x=\pm1.0\,\mathrm m$。质点经过原点时的速率是多少？以$\mathrm{m/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: sqrt(2*(2 + 1)/0.5)
    unit: |
      $\mathrm{m/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      在转折点，动能为零，机械能等于那里的势能。
    - |
      $E=U(1.0)=2+1=3.0\,\mathrm J$，原点处$U=0$。
    - |
      $\frac12\times0.50\times v^2=3.0$，$v=\sqrt{12}\approx3.46\,\mathrm{m/s}$。
  solution: |
    转折点处动能为零，$E=U(1.0)=3.0\,\mathrm J$。原点处$U=0$，动能是$3.0\,\mathrm J$，$v=\sqrt{\frac{2\times3.0}{0.50}}=\sqrt{12}\approx3.46\,\mathrm{m/s}$。原点是$U$的最低点，质点经过这里时最快。

- id: p4
  tier: medium
  statement: |
    质点沿$x$轴运动，势能是$U=x^3-6x^2+9x$（$U$以$\mathrm J$为单位，$x$以$\mathrm m$为单位），只有这个保守力做功。质点原来静止在稳定平衡位置，至少要给它多大的动能，它才能越过另一个平衡位置、一直向$x$轴负方向跑下去？以$\mathrm J$为单位。
  answer:
    type: number
    value: (1 - 6 + 9) - (27 - 54 + 27)
    unit: |
      $\mathrm J$
  hints:
    - |
      $U'=3x^2-12x+9=3(x-1)(x-3)$，平衡位置是$x=1$和$x=3$。
    - |
      $U''=6x-12$：$x=3$处为正，是稳定平衡；$x=1$处为负，是不稳定平衡。
    - |
      要越过$x=1$处的峰：动能至少是$U(1)-U(3)=4-0=4\,\mathrm J$。
  solution: |
    $U'=3(x-1)(x-3)$，平衡位置是$x=1\,\mathrm m$和$x=3\,\mathrm m$。$U''=6x-12$，$x=3$处$U''=6>0$，是稳定平衡，$U(3)=0$；$x=1$处$U''=-6<0$，是不稳定平衡，$U(1)=4\,\mathrm J$。$x<1$时$U$一直下降到$-\infty$，所以质点只要越过$x=1$处的峰就跑下去了，需要的动能至少是$U(1)-U(3)=4\,\mathrm J$。

- id: p5
  tier: hard
  statement: |
    质点在$r>0$的范围里沿一条直线运动（$r$是它到一个固定点的距离），势能是$U(r)=\frac a{r^2}-\frac br$，$a$、$b$都是正的常数，只有这个保守力做功。

    （1）求平衡位置，并说明它是稳定平衡。

    （2）机械能$E$在什么范围里时，质点在两个转折点之间来回运动？求这两个转折点。

    （3）$E\ge0$时，质点的运动有什么不同？
  hints:
    - |
      $U'(r)=-\frac{2a}{r^3}+\frac b{r^2}$，令它为零。
    - |
      $r\to0$时$U\to+\infty$，$r\to\infty$时$U\to0$；平衡位置处$U=-\frac{b^2}{4a}$。
    - |
      转折点满足$Er^2+br-a=0$。
  reference: |
    （1）$U'(r)=\frac{br-2a}{r^3}=0$，$r_0=\frac{2a}b$。$U''(r)=\frac{6a}{r^4}-\frac{2b}{r^3}$，在$r_0$处等于$\frac1{r_0^3}\Bigl(\frac{6a}{r_0}-2b\Bigr)=\frac{3b-2b}{r_0^3}=\frac b{r_0^3}>0$，是稳定平衡，$U(r_0)=\frac{b^2}{4a}-\frac{b^2}{2a}=-\frac{b^2}{4a}$。

    （2）$U$从$r\to0$时的$+\infty$降到最低点$-\frac{b^2}{4a}$，再升向$0$而达不到。所以$-\frac{b^2}{4a}<E<0$时，水平线和曲线交于两点，质点在它们之间来回运动。转折点满足$\frac a{r^2}-\frac br=E$，即$Er^2+br-a=0$，$r=\frac{-b\pm\sqrt{b^2+4aE}}{2E}$，两个根都是正的（$E<0$）。

    （3）$E\ge0$时，水平线在$r$很大的地方总在曲线上方，只剩靠近固定点的一个转折点：质点从远处来，到这个转折点掉头，然后一去不回。

- id: p6
  tier: hard
  statement: |
    长$L$的轻杆一端固定在光滑的转轴上，另一端连着质量为$m$的小球，小球在竖直平面内绕轴转动。用杆和竖直向下方向的夹角$\theta$描述位置，取最低点为参考点，重力势能是$U(\theta)=mgL(1-\cos\theta)$，小球的动能是$\frac12mL^2\Bigl(\dv\theta t\Bigr)^2$。

    （1）把讲解里的$x$换成$\theta$，求平衡位置，并判断它们的稳定性。

    （2）小球在最低点时的速率至少多大，才能一直转圈，而不是来回摆动？

    （3）最低点的速率比（2）的值稍小一点时，小球的运动是什么样子？
  hints:
    - |
      杆对小球的力沿杆，和速度垂直，不做功，机械能守恒。
    - |
      $U'(\theta)=mgL\sin\theta$，$U''(\theta)=mgL\cos\theta$。
    - |
      要转过最高点$\theta=\pi$，机械能要超过$U(\pi)=2mgL$。
  reference: |
    （1）$U'(\theta)=mgL\sin\theta=0$，$\theta=0$或$\pi$。$U''(0)=mgL>0$，最低点是稳定平衡；$U''(\pi)=-mgL<0$，最高点是不稳定平衡：杆能把小球撑在正上方，但稍有偏离它就倒下来。

    （2）杆的力和速度垂直，不做功，机械能守恒。要转过最高点，机械能要超过$U(\pi)=2mgL$，即$\frac12mv^2>2mgL$，$v>2\sqrt{gL}$。

    （3）机械能稍小于$2mgL$时，水平线在$\theta=\pi$附近稍低于曲线，两个转折点都在$\pi$附近：小球几乎摆到正上方，在那里越走越慢，停一下再摆回来，来回摆动的幅度接近$180^\circ$。

- id: p7
  tier: thinking
  statement: |
    （1）碗底的小球、倒扣的碗顶上的小球、平放在水平桌面上的小球，各是哪种平衡？它们的势能曲线各是什么样子？

    （2）为什么现实里几乎看不到长时间处在不稳定平衡的物体？

    （3）把一枚硬币竖着立在桌上，它算哪种平衡？
  hints:
    - |
      把小球稍稍推开，看它受的力指向哪里。
    - |
      真实的物体总会受到一点扰动。
    - |
      硬币稍稍歪一点，它的中心是升高还是降低？
  reference: |
    （1）碗底：稍稍推开，力把它推回来，是稳定平衡，势能曲线在这里是谷底。碗顶：稍稍推开，力把它推得更远，是不稳定平衡，势能曲线在这里是峰顶。平桌面：推开后停在哪里都行，是随遇平衡，势能曲线在这一段是平的。

    （2）空气的流动、桌子的振动、温度的起伏，总有一点扰动；不稳定平衡被扰动以后偏离越来越大，所以保持不了多久。

    （3）把硬币看作没有厚度的圆片，立着的它稍稍歪一点，中心就降低，重力势能减小，它会越歪越厉害，最后倒下，是不稳定平衡。真实的硬币边缘有一点厚度，歪得极少时中心反而稍稍升高，还能自己回来，严格说是稳定平衡，只是稳定的范围非常小，稍大一点的扰动就让它倒下。

- id: p8
  tier: thinking
  statement: |
    两个原子靠得太近时互相排斥，离得远一些时互相吸引，离得很远时几乎没有相互作用。

    （1）它们之间的势能随距离变化的曲线大致是什么形状？

    （2）分子里两个原子的平衡距离对应曲线上的什么点？分子为什么能保持稳定？

    （3）给分子足够的能量，它为什么会分解？
  hints:
    - |
      排斥时力指向距离增大的方向，势能随距离增大而减小。
    - |
      吸引和排斥正好平衡的地方，力为零。
    - |
      离得很远时势能趋于一个常数。
  reference: |
    （1）靠得很近时排斥，$U$随距离减小而急剧升高；稍远处吸引，$U$随距离增大而升高；很远时力几乎为零，$U$趋于常数。所以曲线从左边很高处降下来，在某个距离处到达最低点，再缓缓升高，趋于一条水平线。

    （2）平衡距离就是曲线的最低点，$U'=0$、$U''>0$，是稳定平衡：靠近一点就被推开，离远一点又被拉回来，两个原子在最低点附近来回振动。

    （3）机械能低于远处那条水平线时，有两个转折点，原子被束缚在一起；给分子的能量使机械能超过远处的水平线以后，外侧的转折点消失，两个原子可以分开到无穷远，分子就分解了。从最低点到那条水平线的高度，就是拆开分子需要的最少能量。
