- id: p1
  tier: easy
  statement: |
    飞轮对转轴的转动惯量是$0.50\,\mathrm{kg\cdot m^2}$，从静止开始，受到对转轴$2.0\,\mathrm{N\cdot m}$的恒定力矩，转轴光滑。$3.0\,\mathrm s$末飞轮的角速度是多少？以$\mathrm{rad/s}$为单位，保留两位有效数字。
  answer:
    type: number
    value: 2.0/0.50*3.0
    unit: |
      $\mathrm{rad/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      先由转动定律求角加速度；力矩不变，角加速度也不变。
    - |
      $\alpha=\frac{\tau_z}I$，$\omega=\alpha t$。
    - |
      $\alpha=\frac{2.0}{0.50}=4.0\,\mathrm{rad/s^2}$，$\omega=4.0\times3.0=12\,\mathrm{rad/s}$。
  solution: |
    由转动定律$\alpha=\frac{\tau_z}I=\frac{2.0}{0.50}=4.0\,\mathrm{rad/s^2}$。力矩不变，角加速度不变，角速度均匀增加，$3.0\,\mathrm s$末$\omega=\alpha t=12\,\mathrm{rad/s}$。这和恒力作用下质点的速度$v=at$完全对应。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？题中的刚体都绕光滑的固定轴转动。
  answer:
    type: choice
    multiple: true
    options:
      - |
        沿着门面、对准门轴推门，用多大的力也推不动门
      - |
        两个转动惯量不同的刚体，受到同样大的对转轴的力矩，角加速度相同
      - |
        刚体转得越快，需要的对转轴的力矩就越大
      - |
        外力对转轴的力矩之和一直为零时，刚体的角速度不变
      - |
        同样大的力作用在门上同一点，方向不同，对门轴的力矩可能不同
    value: [1, 4, 5]
  hints:
    - |
      力的作用线通过转轴时，力矩是多少？
    - |
      $\tau_z=I\alpha$：力矩决定的是角速度变化的快慢，不是角速度本身。
    - |
      A、D、E 对；B、C 错。
  solution: |
    A 对：对准门轴推，力的作用线通过转轴，对转轴的力矩是零。B 错：$\alpha=\frac{\tau_z}I$，转动惯量大的角加速度小。C 错：力矩决定角加速度，匀速转动时对转轴的力矩之和是零，转得再快也一样。

    D 对：$\tau_z=0$时$\alpha=0$，角速度不变。E 对：力矩的大小是力乘力臂，方向变了，力臂就变了，平行于门面推时力臂是零。

- id: p3
  tier: medium
  statement: |
    质量$4.0\,\mathrm{kg}$、半径$0.20\,\mathrm m$的均匀圆盘可以绕光滑的水平固定轴转动。盘边上绕着轻绳，绳下挂着$2.0\,\mathrm{kg}$的重物，绳子不打滑。从静止放开，重物的加速度是多少？以$\mathrm{m/s^2}$为单位，保留三位有效数字，$g$取$9.8\,\mathrm{m/s^2}$。
  answer:
    type: number
    value: 2.0*9.8/(2.0 + 0.5*4.0)
    unit: |
      $\mathrm{m/s^2}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      重物用牛顿第二定律，圆盘用转动定律，再用$a=R\alpha$。
    - |
      $mg-T=ma$，$TR=\frac12MR^2\cdot\frac aR$。
    - |
      $a=\frac{mg}{m+\frac12M}=\frac{2.0\times9.8}{4.0}=4.90\,\mathrm{m/s^2}$。
  solution: |
    重物：$mg-T=ma$。圆盘：$TR=\frac12MR^2\alpha$，绳子不打滑，$\alpha=\frac aR$，所以$T=\frac12Ma$。两式相加，$a=\frac{mg}{m+\frac12M}=\frac{2.0\times9.8}{2.0+2.0}=4.90\,\mathrm{m/s^2}$。圆盘的作用好比在重物上多加了$\frac12M$的质量，却不多加重力。

- id: p4
  tier: medium
  statement: |
    长$1.2\,\mathrm m$的均匀细杆，一端装在光滑的水平转轴上，杆水平时从静止放开。刚放开的瞬间，杆另一端的加速度是多少？以$\mathrm{m/s^2}$为单位，保留三位有效数字，$g$取$9.8\,\mathrm{m/s^2}$。
  answer:
    type: number
    value: 1.5*9.8
    unit: |
      $\mathrm{m/s^2}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      重力对转轴的力矩：各小段的力矩加起来，$\sum_im_igx_i=Mgx_{\mathrm C}$，相当于全部重力作用在中点。
    - |
      $Mg\frac l2=\frac13Ml^2\alpha$；刚放开时角速度为零，另一端只有切向加速度$l\alpha$。
    - |
      $\alpha=\frac{3g}{2l}$，另一端的加速度$l\alpha=\frac32g=14.7\,\mathrm{m/s^2}$。
  solution: |
    杆上各小段受的重力对转轴的力矩之和是$\sum_im_igx_i=Mgx_{\mathrm C}=Mg\frac l2$，$x_i$是各小段到转轴的水平距离。由转动定律，$Mg\frac l2=\frac13Ml^2\alpha$，$\alpha=\frac{3g}{2l}$。刚放开时角速度为零，另一端只有切向加速度$l\alpha=\frac32g=14.7\,\mathrm{m/s^2}$，比自由落体还快，和杆长无关：在杆的远端放一枚硬币，硬币会跟不上，和杆分开。

- id: p5
  tier: hard
  statement: |
    质量为$M$、长为$l$的均匀细杆，一端装在光滑的水平转轴上，杆水平时从静止放开。

    （1）刚放开时，杆的角加速度是多少？

    （2）这时杆的质心的加速度是多少？

    （3）这时转轴对杆的力是多少？和用手托住杆的另一端、让它静止时比较。
  hints:
    - |
      重力对转轴的力矩是$Mg\frac l2$；杆对端点的转动惯量是$\frac13Ml^2$。
    - |
      刚放开时角速度为零，质心只有切向加速度$\frac l2\alpha$，竖直向下。
    - |
      质心运动定理：$Mg-N=Ma_{\mathrm C}$。
  reference: |
    （1）由转动定律，$Mg\frac l2=\frac13Ml^2\alpha$，$\alpha=\frac{3g}{2l}$。

    （2）刚放开时角速度为零，质心没有向心加速度，只有切向加速度$a_{\mathrm C}=\frac l2\alpha=\frac34g$，竖直向下。

    （3）水平方向质心没有加速度，转轴的力没有水平分量。竖直方向由质心运动定理，$Mg-N=M\cdot\frac34g$，$N=\frac14Mg$，向上。用手托住另一端、杆静止时，转轴和手各承担$\frac12Mg$；一放手，转轴的力立刻降到$\frac14Mg$，因为杆开始加速下落了。

- id: p6
  tier: hard
  statement: |
    质量为$M$、长为$l$的均匀细杆，上端装在光滑的水平转轴上，竖直静止地挂着。在离转轴$x$处，沿水平方向猛击一下杆，冲量是$J$，击打的时间很短，这段时间里杆几乎没有转过角度。

    （1）击打后杆的角速度是多少？

    （2）击打时转轴对杆的水平冲量是多少？

    （3）$x$取多少时，转轴不受水平的冲击？这一点叫打击中心（center of percussion）。
  hints:
    - |
      对转轴用转动定律，在很短的时间里积分：外力矩的冲量等于$L_z$的改变。重力、转轴的力对转轴没有力矩。
    - |
      $Jx=\frac13Ml^2\omega$；质心的速度是$\frac l2\omega$，由动量定理，$J+J_{\text{轴}}=M\cdot\frac l2\omega$。
    - |
      $J_{\text{轴}}=J\Bigl(\frac{3x}{2l}-1\Bigr)$，为零时$x=\frac23l$。
  reference: |
    （1）$\dv{L_z}t=\tau_z$在击打的短时间里积分，转轴的力和重力对转轴没有力矩，只有击打的力有，它的力矩的冲量是$Jx$。所以$Jx=\frac13Ml^2\omega$，$\omega=\frac{3Jx}{Ml^2}$。

    （2）质心的速度$v_{\mathrm C}=\frac l2\omega=\frac{3Jx}{2Ml}$，由动量定理，水平方向$J+J_{\text{轴}}=Mv_{\mathrm C}=\frac{3Jx}{2l}$，所以$J_{\text{轴}}=J\Bigl(\frac{3x}{2l}-1\Bigr)$，以和$J$同向为正。

    （3）$J_{\text{轴}}=0$时$x=\frac23l$。打在这一点，杆好像本来就要绕转轴转，转轴不受冲击；打得比它高，转轴受到和$J$反向的冲量，比它低则同向。棒球棒、网球拍上击球最舒服的位置，就在打击中心附近。

- id: p7
  tier: thinking
  statement: |
    两个重物用轻绳跨过定滑轮，一次用的滑轮是均匀圆盘，一次换成质量、半径都相同的细圆环，别的条件都不变，转轴光滑，绳子不打滑。哪一次重物的加速度大？两边绳子的拉力之差哪一次大？说明理由。
  hints:
    - |
      两种滑轮的转动惯量哪个大？
    - |
      滑轮的作用好比在重物上多加了$\frac I{R^2}$的质量，却不多加重力。
    - |
      $T_1-T_2=\frac I{R^2}a$。
  reference: |
    用圆盘时加速度大。由例 1 的推导，$a=\frac{(m_1-m_2)g}{m_1+m_2+I/R^2}$。圆环的质量都在边缘，$I=MR^2$，是圆盘的两倍，分母大，加速度小。

    拉力之差$T_1-T_2=\frac I{R^2}a$。用圆环时$\frac I{R^2}$变成两倍，$a$却没有减半，所以拉力之差比用圆盘时大：滑轮的转动惯量大，虽然转得慢一些，需要的力矩仍然更大。

- id: p8
  tier: thinking
  statement: |
    走钢丝的人手里横握着一根很长的杆，这样更容易保持平衡。从转动定律的角度说明为什么，杆为什么要长？
  hints:
    - |
      人在钢丝上摇晃，可以看成绕脚下的钢丝转动。
    - |
      长杆让人和杆一起对钢丝的转动惯量变大。
    - |
      同样的偏离产生的重力矩下，转动惯量大，角加速度就小。
  reference: |
    人在钢丝上往一边倒，可以看成人和杆一起绕脚下的钢丝转动。长杆的质量离钢丝远，大大增加了对钢丝的转动惯量，而人稍稍偏离时重力的力矩几乎不变。由$\alpha=\frac{\tau_z}I$，角加速度小了，倒得慢，人就有时间调整姿势；转动杆时，人对杆施加力矩，杆也对人施加反向的力矩，帮人转回来。杆越长，转动惯量越大，这两种作用都越明显。
