- id: p1
  tier: easy
  statement: |
    电梯以$2.0\,\mathrm{m/s^2}$的加速度加速下降，质量$50\,\mathrm{kg}$的人站在电梯的地板上，$g$取$9.8\,\mathrm{m/s^2}$。地板对人的支持力多大？以$\mathrm N$为单位，保留三位有效数字。
  answer:
    type: number
    value: 50*(9.8 - 2.0)
    unit: |
      $\mathrm N$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      在电梯里人静止，受重力、支持力和惯性力。
    - |
      电梯的加速度向下，惯性力向上，大小$ma_0$。
    - |
      $N=m(g-a_0)=50\times7.8=390\,\mathrm N$。
  solution: |
    在电梯里人静止。电梯的加速度向下，人受的惯性力向上，大小$ma_0$。竖直方向平衡：$N+ma_0=mg$，$N=m(g-a_0)=50\times(9.8-2.0)=390\,\mathrm N$，比重力$490\,\mathrm N$小，人处于失重状态。在地面上看，$mg-N=ma_0$，结果相同。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        惯性力也有反作用力，作用在车厢上
      - |
        以$\frac g2$的加速度加速下降的电梯里，人对地板的压力是他受的重力的一半
      - |
        匀速上升的电梯里，人处于超重状态
      - |
        在同一个加速的车厢里，质量越大的物体受的惯性力越大
      - |
        减速下降的电梯里，人处于超重状态
    value: [2, 4, 5]
  hints:
    - |
      惯性力是$-m\vb a_0$，不是哪个物体施加的。
    - |
      超重还是失重，看电梯加速度的方向。
    - |
      B、D、E 对；A、C 错。
  solution: |
    A 错：惯性力不是别的物体施加的，没有反作用力。B 对：$N=m\bigl(g-\frac g2\bigr)=\frac{mg}2$，由牛顿第三定律，人对地板的压力也是$\frac{mg}2$。C 错：匀速时加速度为零，压力等于重力。

    D 对：惯性力$-m\vb a_0$和质量成正比。E 对：减速下降时加速度向上，惯性力向下，压力$m(g+a_0)$大于重力。

- id: p3
  tier: medium
  statement: |
    车厢里固定着一个倾角$30^\circ$的光滑斜面，坡底朝车头、坡顶朝车尾。车厢在水平路面上向前加速时，放在斜面上的小木块恰好相对斜面静止。车厢的加速度多大？$g$取$9.8\,\mathrm{m/s^2}$，以$\mathrm{m/s^2}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 9.8*tan(pi/6)
    unit: |
      $\mathrm{m/s^2}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      在车厢里木块静止，受重力、斜面的支持力和惯性力；惯性力向后，也就是向坡顶那一边。
    - |
      支持力垂直于斜面；重力和惯性力的合力要正好垂直于斜面，指向斜面里面。
    - |
      $\tan30^\circ=\frac{a_0}g$，$a_0=9.8\tan30^\circ\approx5.66\,\mathrm{m/s^2}$。
  solution: |
    在车厢里木块静止，受重力$mg$、垂直于斜面的支持力$N$和向后的惯性力$ma_0$。沿斜面方向，惯性力沿斜面向上的分量$ma_0\cos30^\circ$要和重力沿斜面向下的分量$mg\sin30^\circ$相等，所以$a_0=g\tan30^\circ\approx5.66\,\mathrm{m/s^2}$。也就是重力和惯性力的合力$m(\vb g-\vb a_0)$恰好垂直于斜面，斜面像一块「水平」的板。

- id: p4
  tier: medium
  statement: |
    车厢在水平路面上以$3.0\,\mathrm{m/s^2}$的加速度向前加速。一个小球从车顶松开，车顶离车厢的地板$2.0\,\mathrm m$，不计空气，$g$取$9.8\,\mathrm{m/s^2}$。小球落到地板上的地方，在松开处正下方的后面多远？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: 3.0*2.0/9.8
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      松开的一瞬间，小球和车厢的速度相同，在车厢里看，小球从静止开始运动。
    - |
      在车厢里，小球受重力和向后的惯性力，加速度是恒定的$\vb g-\vb a_0$。
    - |
      下落时间$t=\sqrt{\frac{2h}g}$，向后移动$\frac12a_0t^2=\frac{a_0h}g\approx0.612\,\mathrm m$。
  solution: |
    松开时小球和车厢速度相同，在车厢里看，小球从静止开始，受重力和向后的惯性力，加速度是恒定的$\vb g-\vb a_0$，沿这个方向做直线运动。竖直方向下落$h$用时$t=\sqrt{\frac{2h}g}$，这段时间里向后移动$\frac12a_0t^2=\frac{a_0h}g=\frac{3.0\times2.0}{9.8}\approx0.612\,\mathrm m$。在地面上看，小球做平抛运动，车厢在它下面加速前进，结果一样。

- id: p5
  tier: hard
  statement: |
    小车沿倾角为$\theta$的光滑斜面自由滑下，车顶用细绳吊着一个质量为$m$的小球，小球相对小车静止，不计空气。

    （1）小车的加速度多大？

    （2）在小车里看，绳子沿什么方向？

    （3）绳子的拉力多大？
  hints:
    - |
      把小车和小球看作一个整体，它沿光滑斜面下滑。
    - |
      在小车里看，小球受重力、拉力和沿斜面向上、大小为$mg\sin\theta$的惯性力。
    - |
      重力和惯性力的合力是$mg\cos\theta$，垂直于斜面。
  reference: |
    （1）小车和小球相对静止，可以当作一个整体。它受重力和垂直于斜面的支持力，沿斜面方向只有重力的分量，所以加速度$a_0=g\sin\theta$，沿斜面向下。

    （2）在小车里，小球静止，受重力$m\vb g$、拉力$\vb T$和惯性力$-m\vb a_0$，惯性力沿斜面向上，大小$mg\sin\theta$，正好抵消重力沿斜面的分量。重力和惯性力的合力$m(\vb g-\vb a_0)$垂直于斜面，大小$mg\cos\theta$，所以拉力也垂直于斜面，绳子垂直于斜面，而不是竖直的。

    （3）$T=mg\cos\theta$。$\theta=0$时回到静止的小车，$T=mg$；$\theta$接近$90^\circ$时小车几乎自由下落，绳子几乎没有拉力。

- id: p6
  tier: hard
  statement: |
    电梯以加速度$a_0$竖直向上加速。电梯的天花板上挂着一个轻而光滑的定滑轮，轻绳跨过滑轮，两端挂着质量为$m_1$和$m_2$（$m_1>m_2$）的两个物体。

    （1）在电梯里看，两个物体的加速度多大？

    （2）绳子的拉力多大？

    （3）电梯的缆绳断了、电梯自由下落时，两个物体会怎样？绳子的拉力是多少？
  hints:
    - |
      在电梯里，每个物体都多受一个向下的惯性力$ma_0$，相当于重力加速度换成了$g+a_0$。
    - |
      照电梯静止时的做法列两个物体的方程，把$g$换成$g'=g+a_0$。
    - |
      自由下落时$a_0=-g$，$g'=0$。
  reference: |
    （1）电梯的加速度向上，在电梯里每个物体都多受一个向下的惯性力$ma_0$，和重力合起来是$m(g+a_0)$，就像重力加速度换成了$g'=g+a_0$。设$m_1$相对电梯向下的加速度是$a'$：$m_1g'-T=m_1a'$，$T-m_2g'=m_2a'$，所以$a'=\frac{m_1-m_2}{m_1+m_2}(g+a_0)$。

    （2）$T=m_2(g'+a')=\frac{2m_1m_2}{m_1+m_2}(g+a_0)$。

    （3）自由下落时电梯的加速度是$g$、向下，$a_0=-g$，$g'=0$：$a'=0$，$T=0$。两个物体相对电梯原来静止的，就一直静止，原来在动的，就相对电梯匀速运动，绳子松松的，处于完全失重。

- id: p7
  tier: thinking
  statement: |
    一个人在没有窗户的密封舱里醒来。

    （1）他松开手里的小球，小球以$9.8\,\mathrm{m/s^2}$的加速度落向地板。他能不能断定舱停在地面上？

    （2）如果松开的小球悬在空中不动呢？

    （3）为什么惯性力能「冒充」重力，而弹簧的弹力冒充不了？
  hints:
    - |
      在远离星球的太空里，舱以$9.8\,\mathrm{m/s^2}$的加速度加速时，舱里的物体受多大的惯性力？
    - |
      远离一切天体的太空，和自由下落的舱，舱里的物体各怎样？
    - |
      重力和惯性力都和物体的什么成正比？
  reference: |
    （1）不能。舱也可能在远离星球的太空里，以$9.8\,\mathrm{m/s^2}$的加速度向「上」加速：在舱里，小球受向下的惯性力$m\times9.8\,\mathrm{m/s^2}$，同样以这个加速度落向地板。

    （2）可能在远离一切天体的太空里，也可能在地球附近自由下落，或者绕地球运行：这时惯性力和重力抵消，小球照样悬着。

    （3）重力和惯性力都和物体的质量成正比，给所有物体同样的加速度，所以在舱里做力学实验分不出它们；弹簧的弹力只由弹簧伸长或压缩了多少决定，和物体的质量没有这样的关系。舱里分不出均匀的重力和加速这件事，正是广义相对论[等效原理](lesson:physics.general-relativity.equivalence-principle)的出发点。

- id: p8
  tier: thinking
  statement: |
    空间站在离地面约$400\,\mathrm{km}$的高处绕地球运行，那里地球对物体的吸引约是地面上的$88\%$（见[万有引力定律](lesson:physics.newtonian-mechanics.gravitation)）。

    （1）宇航员为什么飘在站里？

    （2）在站里站到体重秤上，读数是多少？

    （3）在站里，单摆还能来回摆动吗？
  hints:
    - |
      空间站和宇航员都只受地球的吸引，它们的加速度相同吗？
    - |
      以空间站为参考系，宇航员受的惯性力和地球的吸引是什么关系？
    - |
      单摆来回摆动，靠的是什么？
  reference: |
    （1）空间站和宇航员都只受地球的吸引，加速度都等于那里的重力加速度。以空间站为参考系，宇航员受的惯性力正好和地球的吸引抵消，就像不受力一样，所以飘着，处于完全失重，并不是那里没有重力。

    （2）零：宇航员和秤的加速度相同，彼此之间不用压紧。

    （3）不能。在站里重力和惯性力抵消，没有把摆球拉回最低点的作用。轻轻推一下摆球，它会在绳子的拉力下绕悬点匀速转圈，或者停在哪里就待在哪里，不会来回摆。
