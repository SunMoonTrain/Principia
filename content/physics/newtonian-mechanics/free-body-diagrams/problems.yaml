- id: p1
  tier: easy
  statement: |
    木块从倾角$25^\circ$的光滑斜面上由静止滑下，$g$取$9.8\,\mathrm{m/s^2}$。它的加速度有多大？以$\mathrm{m/s^2}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 9.8*sin(25*pi/180)
    unit: |
      $\mathrm{m/s^2}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      木块只受重力和支持力，沿斜面和垂直于斜面选坐标轴。
    - |
      支持力垂直于斜面，沿斜面方向只有重力的分量$mg\sin25^\circ$。
    - |
      $a=g\sin25^\circ\approx9.8\times0.4226\approx4.14\,\mathrm{m/s^2}$。
  solution: |
    木块受重力和垂直于斜面的支持力。沿斜面方向只有重力的分量$mg\sin25^\circ$，由牛顿第二定律$a=g\sin25^\circ\approx4.14\,\mathrm{m/s^2}$，和木块的质量无关。垂直于斜面的方向没有加速度，支持力等于$mg\cos25^\circ$。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        两个木块叠放在水平桌面上静止，把它们当作一个整体，就能求出上面的木块对下面木块的弹力
      - |
        光滑斜面上用绳子拴住静止的木块，受到的支持力等于它的重力
      - |
        竖直悬挂的物体被绳子拉着匀速上升时，绳子的拉力大于物体的重力
      - |
        两个物体用跨过光滑定滑轮的轻绳连着，绳子两边的拉力大小相等
      - |
        用绳子竖直向上提起物体，物体加速上升时，绳子的拉力大于物体的重力
    value: [4, 5]
  hints:
    - |
      整体法里，物体之间的相互作用会不会出现在方程里？支持力垂直于斜面。
    - |
      匀速运动时合力为零；加速上升时合力向上。
    - |
      D、E 对；A、B、C 错。
  solution: |
    A 错：把两个木块当作一个整体，它们之间的弹力成对抵消，不出现在方程里，要求它只能把上面的木块隔离出来。B 错：支持力等于$mg\cos\theta$，比重力小。C 错：匀速运动，合力为零，拉力等于重力。

    D 对：轻绳各处拉力相同，光滑的滑轮只改变拉力的方向。E 对：加速度向上，$T-mg=ma>0$。

- id: p3
  tier: medium
  statement: |
    质量$3.0\,\mathrm{kg}$和$2.0\,\mathrm{kg}$的两个重物用轻绳连着，挂在光滑的定滑轮两边，从静止放开。绳子的拉力是多少？$g$取$9.8\,\mathrm{m/s^2}$，以$\mathrm N$为单位，保留三位有效数字。
  answer:
    type: number
    value: 2*3*2*9.8/(3 + 2)
    unit: |
      $\mathrm N$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      两个重物的加速度大小相等，一个向下、一个向上；分别隔离，各列一个方程。
    - |
      重的取向下为正：$m_1g-T=m_1a$；轻的取向上为正：$T-m_2g=m_2a$。
    - |
      $a=\frac{(m_1-m_2)g}{m_1+m_2}=1.96\,\mathrm{m/s^2}$，$T=m_2(g+a)\approx23.5\,\mathrm N$。
  solution: |
    绳长不变，两个重物的加速度大小相等。重的那个向下加速：$m_1g-T=m_1a$；轻的那个向上加速：$T-m_2g=m_2a$。两式相加，$a=\frac{(m_1-m_2)g}{m_1+m_2}=\frac{9.8}5=1.96\,\mathrm{m/s^2}$，$T=m_2(g+a)=2.0\times11.76\approx23.5\,\mathrm N$，介于两个重物的重力$19.6\,\mathrm N$和$29.4\,\mathrm N$之间。

- id: p4
  tier: medium
  statement: |
    光滑水平面上，木块 A、B、C（质量依次为$1.0\,\mathrm{kg}$、$2.0\,\mathrm{kg}$、$3.0\,\mathrm{kg}$）用轻绳依次连成一串，用$18\,\mathrm N$的水平力拉最前面的 C。B 和 C 之间那段绳子的拉力是多少？以$\mathrm N$为单位。
  answer:
    type: number
    value: (1 + 2)*18/(1 + 2 + 3)
    unit: |
      $\mathrm N$
  hints:
    - |
      先用整体法求出共同的加速度。
    - |
      $a=\frac{18}{6.0}=3.0\,\mathrm{m/s^2}$；再把 B、C 之间的绳子后面的部分隔离出来。
    - |
      A 和 B 合起来只受 B、C 之间那段绳子的拉力：$T=(1.0+2.0)\times3.0=9.0\,\mathrm N$。
  solution: |
    整体只受$18\,\mathrm N$的拉力，$a=\frac{18}{1.0+2.0+3.0}=3.0\,\mathrm{m/s^2}$。把 A、B 当作一个整体隔离出来，它们之间那段绳子的拉力成对抵消，水平方向只受 B、C 之间那段绳子的拉力，所以$T=(m_A+m_B)a=9.0\,\mathrm N$。拉的位置越靠前，要带动的东西越多，所以越靠近拉力那一端的绳子拉力越大。

- id: p5
  tier: hard
  statement: |
    倾角为$\theta$的光滑斜面顶端装一个光滑的定滑轮，斜面上质量$m_1$的木块用平行于斜面的轻绳跨过滑轮，和竖直悬挂的质量$m_2$的重物相连，从静止放开。

    （1）求木块的加速度，说明在什么条件下木块沿斜面向上运动。（2）求绳子的拉力。（3）$\theta=90^\circ$和$\theta=0$时，结果分别回到什么情形？
  hints:
    - |
      分别隔离木块和重物；取木块沿斜面向上、重物向下为正，两者的加速度相同。
    - |
      木块：$T-m_1g\sin\theta=m_1a$；重物：$m_2g-T=m_2a$。
    - |
      $\theta=90^\circ$时两个物体都竖直挂着；$\theta=0$时木块在水平桌面上。
  reference: |
    （1）取木块沿斜面向上、重物向下为正，绳长不变，两者的加速度同为$a$。木块沿斜面方向受拉力和重力的分量：$T-m_1g\sin\theta=m_1a$；重物：$m_2g-T=m_2a$。相加得$a=\frac{(m_2-m_1\sin\theta)g}{m_1+m_2}$。$m_2>m_1\sin\theta$时$a>0$，木块向上运动；$m_2<m_1\sin\theta$时向下；相等时保持静止。

    （2）$T=m_2(g-a)=\frac{m_1m_2(1+\sin\theta)g}{m_1+m_2}$。

    （3）$\theta=90^\circ$时，$a=\frac{(m_2-m_1)g}{m_1+m_2}$，$T=\frac{2m_1m_2g}{m_1+m_2}$，正是两个重物挂在定滑轮两边的情形（第 3 题）。$\theta=0$时，$a=\frac{m_2g}{m_1+m_2}$，$T=\frac{m_1m_2g}{m_1+m_2}$，正是例 2 的桌面和滑轮。

- id: p6
  tier: hard
  statement: |
    一根轻绳的一端固定在天花板上，向下绕过一个动滑轮，再向上跨过天花板上的定滑轮，另一端挂着重物 A（质量$m_A$）；动滑轮下面挂着重物 B（质量$m_B$）。滑轮都是光滑的、质量不计，各段绳子都竖直，从静止放开。

    （1）A 下降的距离和 B 上升的距离有什么关系？两者的加速度呢？（2）求 B 的加速度和绳子的拉力。（3）在什么条件下 A 静止不动？
  hints:
    - |
      动滑轮两边各有一段绳子：B 上升$x$，这两段绳子各短了$x$。
    - |
      A 的加速度是 B 的两倍；B 受向上的两段绳子的拉力，共$2T$。
    - |
      取 B 向上、A 向下为正：$m_Ag-T=2m_Aa_B$，$2T-m_Bg=m_Ba_B$。
  reference: |
    （1）记动滑轮到天花板的距离为$y_B$，A 到定滑轮的距离为$y_A$，绳长不变：$2y_B+y_A$为常数。B 上升$x$，A 就下降$2x$；对时间求两次导数，A 向下的加速度是 B 向上的加速度的$2$倍。

    （2）取 B 向上、A 向下为正。A：$m_Ag-T=m_A\cdot2a_B$；B 和动滑轮受两段绳子向上的拉力：$2T-m_Bg=m_Ba_B$。由第一式$T=m_Ag-2m_Aa_B$，代入第二式得$a_B=\frac{(2m_A-m_B)g}{4m_A+m_B}$，$T=\frac{3m_Am_Bg}{4m_A+m_B}$。

    （3）A 静止，要求$a_B=0$，即$m_B=2m_A$：动滑轮让两段绳子一起托住 B，只要$A$的重力的一半就够了。这正是动滑轮「省力」的道理，代价是 A 要走两倍的距离。

- id: p7
  tier: thinking
  statement: |
    分析例 2 时，有人除了分别隔离 A、B 列出两个方程，又用整体法列了一个方程：「A、B 合起来受$m_Bg$，所以$m_Bg=(m_A+m_B)a$。」

    （1）这三个方程都对吗？能不能用来解三个未知数？

    （2）这里的整体法为什么能成立？A 和 B 的加速度方向明明不同。（3）一般地，整体法和隔离法得到的方程之间是什么关系？
  hints:
    - |
      把隔离得到的两个方程相加试试。
    - |
      沿着绳子的方向看，两个物体的加速度大小相同；拉力在两个物体上的作用都沿绳子。
    - |
      整体法的方程是由隔离法的方程加起来得到的。
  reference: |
    （1）三个方程都对，但第三个是前两个相加的结果，不是独立的，只能解两个未知数$a$和$T$。把它当成新的条件，以为能多解一个未知数，就会出错。

    （2）这里的「整体法」其实是沿着绳子的方向把两个物体的运动排成一条线：$A$水平、$B$竖直，但沿绳子方向的加速度大小相同，两段拉力在各自的运动方向上一正一反，相加抵消。严格说，它不是把两个物体当作一个加速度相同的整体，而是把两个隔离方程相加。

    （3）整体法的方程是各个隔离方程的和，物体之间的相互作用由第三定律在相加时抵消。所以整体法能省掉内部的力，却不能提供新的信息；要求内部的力，或者各物体加速度不同，就要回到隔离法。

- id: p8
  tier: thinking
  statement: |
    分析斜面上的木块时，这一节建议沿斜面和垂直于斜面选坐标轴。

    （1）如果选水平和竖直方向的坐标轴，列出光滑斜面上下滑的木块的方程，会遇到什么麻烦？结果会不会不同？（2）什么情况下，选水平、竖直的坐标轴反而更方便？（3）选坐标轴有没有「对错」之分？
  hints:
    - |
      选水平、竖直的轴时，支持力和加速度都有两个分量。
    - |
      想想加速度沿水平方向的情形，例如倾斜弯道上的汽车。
    - |
      牛顿第二定律是矢量方程，在哪个坐标系里分解都成立。
  reference: |
    （1）选水平、竖直的轴时，加速度沿斜面，有两个分量$a\cos\theta$、$-a\sin\theta$，支持力也有两个分量，两个方程里都同时出现$N$和$a$，要联立才能解出来，计算更繁。结果完全一样：$a=g\sin\theta$，$N=mg\cos\theta$。

    （2）加速度沿水平方向时，选水平、竖直的轴更方便，例如倾斜弯道上转弯的汽车（见[圆周运动的动力学](lesson:physics.newtonian-mechanics.circular-dynamics)例 2），竖直方向没有加速度，一个方程就定出支持力。

    （3）没有对错，只有繁简。牛顿第二定律是矢量方程，在任何一组坐标轴上分解都成立；好的选法是让尽可能多的力或加速度落在坐标轴上，方程最少、最简单。
