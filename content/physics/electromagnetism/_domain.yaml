id: physics.electromagnetism
title: |
  电磁学与电动力学
proofPolicy: sketch
macros:
  \vb: |
    \mathbf{#1}
  \uv: |
    \hat{\mathbf{#1}}
  \dd: |
    \mathop{}\!\mathrm{d}
  \pdv: |
    \frac{\partial #1}{\partial #2}
  \dv: |
    \frac{\mathrm{d} #1}{\mathrm{d} #2}
  \divg: |
    \nabla\cdot
  \curl: |
    \nabla\times
  \lap: |
    \nabla^2
glossary:
  - id: physics.electromagnetism.electric-charge
    zh: |
      电荷
    en: |
      electric charge
    brief: |
      描述物体带电多少和正负的量$q$，单位是库仑；同号的互相排斥，异号的互相吸引。
    definedIn: physics.electromagnetism.coulomb-law
    anchor: def-electric-charge
  - id: physics.electromagnetism.elementary-charge
    zh: |
      元电荷
    en: |
      elementary charge
    brief: |
      质子电荷的大小$e=1.602176634\times10^{-19}\,\mathrm C$；任何带电体的电荷都是$e$的整数倍。
    definedIn: physics.electromagnetism.coulomb-law
    anchor: def-elementary-charge
  - id: physics.electromagnetism.charge-conservation
    zh: |
      电荷守恒
    en: |
      conservation of charge
    brief: |
      和外界没有电荷交换的系统，正负电荷的代数和保持不变。
    definedIn: physics.electromagnetism.coulomb-law
    anchor: def-charge-conservation
  - id: physics.electromagnetism.point-charge
    zh: |
      点电荷
    en: |
      point charge
    brief: |
      大小比到其他带电体的距离小得多、可以看成一个点的带电体。
    definedIn: physics.electromagnetism.coulomb-law
    anchor: def-point-charge
  - id: physics.electromagnetism.coulomb-law
    zh: |
      库仑定律
    en: |
      Coulomb's law
    brief: |
      真空中两个静止的点电荷之间的力，大小是$\frac{1}{4\pi\varepsilon_0}\frac{|q_1q_2|}{r^2}$，沿两者的连线，同号相斥、异号相吸。
    definedIn: physics.electromagnetism.coulomb-law
    anchor: def-coulomb-law
  - id: physics.electromagnetism.superposition-principle
    zh: |
      叠加原理
    en: |
      superposition principle
    brief: |
      几个电荷对一个电荷的作用力，等于每个电荷单独存在时对它的力的矢量和。
    definedIn: physics.electromagnetism.coulomb-law
    anchor: def-superposition
  - id: physics.electromagnetism.electric-field
    zh: |
      电场
    en: |
      electric field
    brief: |
      空间每一点上的矢量$\vb E$：静止的试探电荷在那里受的力除以它的电荷；电荷$q$受的力是$q\vb E$。
    definedIn: physics.electromagnetism.electric-field
    anchor: def-electric-field
  - id: physics.electromagnetism.test-charge
    zh: |
      试探电荷
    en: |
      test charge
    brief: |
      用来探测电场的点电荷，电荷小到不影响产生电场的那些电荷。
    definedIn: physics.electromagnetism.electric-field
    anchor: def-electric-field
  - id: physics.electromagnetism.field-line
    zh: |
      电场线
    en: |
      electric field line
    brief: |
      处处和电场方向相切、按电场方向标上箭头的曲线；从正电荷出发，终止在负电荷上或延伸到无穷远。
    definedIn: physics.electromagnetism.electric-field
    anchor: def-field-line
  - id: physics.electromagnetism.charge-density
    zh: |
      电荷密度
    en: |
      charge density
    brief: |
      单位长度、单位面积或单位体积上的电荷，分别叫作线电荷密度$\lambda$、面电荷密度$\sigma$、体电荷密度$\rho$。
    definedIn: physics.electromagnetism.continuous-charge
    anchor: def-charge-density
  - id: physics.electromagnetism.electric-potential
    zh: |
      电势
    en: |
      electric potential
    brief: |
      选定参考点$O$，$\varphi(\vb r)=-\int_O^{\vb r}\vb E\cdot\dd\vb l$，是单位电荷的电势能；单位是伏特。
    definedIn: physics.electromagnetism.electric-potential
    anchor: def-electric-potential
  - id: physics.electromagnetism.potential-energy
    zh: |
      电势能
    en: |
      electric potential energy
    brief: |
      电荷$q$在电势为$\varphi$的地方的势能$U=q\varphi$。
    definedIn: physics.electromagnetism.electric-potential
    anchor: def-electric-potential
  - id: physics.electromagnetism.potential-difference
    zh: |
      电势差
    en: |
      potential difference
    brief: |
      两点电势之差$\varphi_A-\varphi_B=\int_A^B\vb E\cdot\dd\vb l$，也叫电压；和参考点的选择无关。
    definedIn: physics.electromagnetism.electric-potential
    anchor: def-potential-difference
  - id: physics.electromagnetism.electron-volt
    zh: |
      电子伏特
    en: |
      electron volt
    abbr: |
      eV
    brief: |
      电荷为$e$的粒子经过$1\,\mathrm V$的电势差，电场力对它做的功：$1\,\mathrm{eV}=1.602176634\times10^{-19}\,\mathrm J$。
    definedIn: physics.electromagnetism.electric-potential
    anchor: def-electron-volt
  - id: physics.electromagnetism.equipotential-surface
    zh: |
      等势面
    en: |
      equipotential surface
    brief: |
      电势相等的点组成的曲面；电场处处和它垂直，指向电势降低的一侧。
    definedIn: physics.electromagnetism.electric-potential
    anchor: def-equipotential
  - id: physics.electromagnetism.electric-flux
    zh: |
      电通量
    en: |
      electric flux
    brief: |
      电场穿过一个曲面的曲面积分$\Phi_E=\int\vb E\cdot\dd\vb a$，和穿过曲面的电场线净条数成正比。
    definedIn: physics.electromagnetism.gauss-law
    anchor: def-electric-flux
  - id: physics.electromagnetism.solid-angle
    zh: |
      立体角
    en: |
      solid angle
    brief: |
      一小块面积对一点张的立体角$\dd\Omega=\frac{\dd a\cos\alpha}{r^2}$，即它投影到以这点为心的单位球面上的面积；全球面是$4\pi$。
    definedIn: physics.electromagnetism.gauss-law
    anchor: def-solid-angle
  - id: physics.electromagnetism.gauss-law
    zh: |
      高斯定律
    en: |
      Gauss's law
    brief: |
      穿出任一闭合曲面的电通量等于面内的总电荷除以$\varepsilon_0$：$\oint\vb E\cdot\dd\vb a=\frac{Q_{\text{内}}}{\varepsilon_0}$。
    definedIn: physics.electromagnetism.gauss-law
    anchor: thm-gauss-law
  - id: physics.electromagnetism.gaussian-surface
    zh: |
      高斯面
    en: |
      Gaussian surface
    brief: |
      为了用高斯定律求电场而选的闭合曲面；选得好时，面上的电场要么垂直于面且大小处处相同，要么平行于面。
    definedIn: physics.electromagnetism.gauss-applications
    anchor: def-gaussian-surface
  - id: physics.electromagnetism.electric-dipole
    zh: |
      电偶极子
    en: |
      electric dipole
    brief: |
      相距$d$的一对等量异号点电荷，从比$d$远得多的地方看；那里的电场只由电偶极矩决定。
    definedIn: physics.electromagnetism.electric-dipole
    anchor: def-electric-dipole
  - id: physics.electromagnetism.dipole-moment
    zh: |
      电偶极矩
    en: |
      electric dipole moment
    brief: |
      $\vb p=q\vb d$，$\vb d$是从$-q$指向$+q$的位移；一般的电荷分布是$\vb p=\sum_iq_i\vb r_i$。
    definedIn: physics.electromagnetism.electric-dipole
    anchor: def-electric-dipole
  - id: physics.electromagnetism.conductor
    zh: |
      导体
    en: |
      conductor
    brief: |
      内部有大量能自由移动的电荷的物体，例如金属；电场会推动这些电荷重新分布。
    definedIn: physics.electromagnetism.conductors
    anchor: def-conductor
  - id: physics.electromagnetism.insulator
    zh: |
      绝缘体
    en: |
      insulator
    brief: |
      电荷几乎不能移动的物体，例如玻璃、橡胶；电荷放在哪里就留在哪里。
    definedIn: physics.electromagnetism.conductors
    anchor: def-conductor
  - id: physics.electromagnetism.electrostatic-equilibrium
    zh: |
      静电平衡
    en: |
      electrostatic equilibrium
    brief: |
      导体里的电荷不再宏观移动的状态；这时导体内部电场为零，整个导体等势。
    definedIn: physics.electromagnetism.conductors
    anchor: def-electrostatic-equilibrium
  - id: physics.electromagnetism.induced-charge
    zh: |
      感应电荷
    en: |
      induced charge
    brief: |
      导体在外电场或附近电荷的作用下，自由电荷重新分布，在表面上出现的电荷。
    definedIn: physics.electromagnetism.conductors
    anchor: def-induced-charge
  - id: physics.electromagnetism.electrostatic-shielding
    zh: |
      静电屏蔽
    en: |
      electrostatic shielding
    brief: |
      导体壳把外面的电场挡在外面，使里面的空腔不受外面电荷的影响。
    definedIn: physics.electromagnetism.conductors
    anchor: def-shielding
  - id: physics.electromagnetism.earnshaw-theorem
    zh: |
      恩肖定理
    en: |
      Earnshaw's theorem
    brief: |
      在没有电荷的区域里，只受静电力作用的点电荷没有稳定的平衡位置。
    definedIn: physics.electromagnetism.gauss-differential
    anchor: thm-earnshaw
  - id: physics.electromagnetism.capacitor
    zh: |
      电容器
    en: |
      capacitor
    brief: |
      两个彼此绝缘、带等量异号电荷的导体，用来储存电荷和电场的能量。
    definedIn: physics.electromagnetism.capacitors
    anchor: def-capacitor
  - id: physics.electromagnetism.electrostatic-energy
    zh: |
      静电能
    en: |
      electrostatic energy
    brief: |
      把一组电荷从彼此相距无穷远搬到现在的位置，外力做的总功；电荷连续分布、密度有限时，等于$\frac{\varepsilon_0}{2}E^2$在全空间的积分。
    definedIn: physics.electromagnetism.electrostatic-energy
    anchor: def-electrostatic-energy
  - id: physics.electromagnetism.energy-density
    zh: |
      能量密度
    en: |
      energy density
    brief: |
      单位体积的场里储存的能量；真空中静电场的能量密度是$\frac{\varepsilon_0}{2}E^2$。
    definedIn: physics.electromagnetism.electrostatic-energy
    anchor: def-energy-density
  - id: physics.electromagnetism.poisson-equation
    zh: |
      泊松方程
    en: |
      Poisson's equation
    brief: |
      静电场的电势满足的方程$\nabla^2\varphi=-\frac{\rho}{\varepsilon_0}$，把电势和电荷密度联系起来。
    definedIn: physics.electromagnetism.poisson-equation
    anchor: thm-poisson
  - id: physics.electromagnetism.laplace-equation
    zh: |
      拉普拉斯方程
    en: |
      Laplace's equation
    brief: |
      没有电荷的区域里电势满足的方程$\nabla^2\varphi=0$；它的解叫作调和函数。
    definedIn: physics.electromagnetism.poisson-equation
    anchor: def-laplace-equation
  - id: physics.electromagnetism.uniqueness-theorem
    zh: |
      唯一性定理
    en: |
      uniqueness theorem
    brief: |
      区域里的电荷和边界上的电势（或各导体的总电荷）给定时，静电问题的解只有一个。
    definedIn: physics.electromagnetism.images-uniqueness
    anchor: thm-uniqueness
  - id: physics.electromagnetism.image-charge
    zh: |
      镜像电荷
    en: |
      image charge
    brief: |
      放在求解区域以外的假想电荷，和区域里的电荷一起满足边界条件，代替导体上感应电荷的效果。
    definedIn: physics.electromagnetism.images-uniqueness
    anchor: def-method-of-images
  - id: physics.electromagnetism.method-of-images
    zh: |
      镜像法
    en: |
      method of images
    brief: |
      用镜像电荷凑出满足边界条件的电势，再由唯一性定理断定它就是要求的解。
    definedIn: physics.electromagnetism.images-uniqueness
    anchor: def-method-of-images
  - id: physics.electromagnetism.multipole-expansion
    zh: |
      多极展开
    en: |
      multipole expansion
    brief: |
      把电荷分布在远处的电势按$\frac1r$的幂展开，各项依次由总电荷、电偶极矩、电四极矩……决定。
    definedIn: physics.electromagnetism.multipole-expansion
    anchor: thm-multipole
  - id: physics.electromagnetism.quadrupole-moment
    zh: |
      电四极矩
    en: |
      electric quadrupole moment
    brief: |
      电荷分布的二阶矩$Q_{ij}=\int(3x_ix_j-r^2\delta_{ij})\rho\,\dd V$，决定远处电势里随$\frac{1}{r^3}$衰减的那一项。
    definedIn: physics.electromagnetism.multipole-expansion
    anchor: def-quadrupole
  - id: physics.electromagnetism.dielectric
    zh: |
      电介质
    en: |
      dielectric
    brief: |
      从极化的角度看的绝缘体：放进电场里，分子产生电偶极矩或者电偶极矩转向电场。
    definedIn: physics.electromagnetism.polarization
    anchor: def-dielectric
  - id: physics.electromagnetism.polarizability
    zh: |
      极化率
    en: |
      polarizability
    brief: |
      原子或分子的电偶极矩和电场之比$\alpha$，$\vb p=\alpha\vb E$；描述电子云多容易被电场拉开。
    definedIn: physics.electromagnetism.polarization
    anchor: def-polarizability
  - id: physics.electromagnetism.polarization
    zh: |
      极化强度
    en: |
      polarization density
    brief: |
      电介质单位体积里的电偶极矩$\vb P$，单位是$\mathrm{C/m^2}$；它的负散度是束缚电荷的体密度。
    definedIn: physics.electromagnetism.polarization
    anchor: def-polarization
  - id: physics.electromagnetism.bound-charge
    zh: |
      束缚电荷
    en: |
      bound charge
    brief: |
      电介质极化时正负电荷错开而积累的电荷：体内$\rho_{\mathrm b}=-\divg\vb P$，表面$\sigma_{\mathrm b}=\vb P\cdot\uv n$。
    definedIn: physics.electromagnetism.polarization
    anchor: def-bound-charge
  - id: physics.electromagnetism.free-charge
    zh: |
      自由电荷
    en: |
      free charge
    brief: |
      不是因极化而错开的电荷：导体里能移动的电荷、放到物体上的电荷，记作$\rho_{\mathrm f}$、$\sigma_{\mathrm f}$。
    definedIn: physics.electromagnetism.polarization
    anchor: def-bound-charge
  - id: physics.electromagnetism.electric-displacement
    zh: |
      电位移
    en: |
      electric displacement
    brief: |
      $\vb D=\varepsilon_0\vb E+\vb P$；它的散度只由自由电荷决定，$\divg\vb D=\rho_{\mathrm f}$。
    definedIn: physics.electromagnetism.electric-displacement
    anchor: def-displacement
  - id: physics.electromagnetism.linear-dielectric
    zh: |
      线性电介质
    en: |
      linear dielectric
    brief: |
      极化强度和电场成正比（$\vb P=\varepsilon_0\chi_{\mathrm e}\vb E$）的电介质，里面$\vb D=\varepsilon\vb E$。
    definedIn: physics.electromagnetism.electric-displacement
    anchor: def-linear-dielectric
  - id: physics.electromagnetism.electric-susceptibility
    zh: |
      电极化率
    en: |
      electric susceptibility
    brief: |
      线性电介质里$\vb P=\varepsilon_0\chi_{\mathrm e}\vb E$的比例系数$\chi_{\mathrm e}$，是一个无量纲的数。
    definedIn: physics.electromagnetism.electric-displacement
    anchor: def-linear-dielectric
  - id: physics.electromagnetism.relative-permittivity
    zh: |
      相对介电常量
    en: |
      relative permittivity
    brief: |
      $\varepsilon_{\mathrm r}=1+\chi_{\mathrm e}=\frac{\varepsilon}{\varepsilon_0}$；电容器填满这种电介质，电容变成原来的$\varepsilon_{\mathrm r}$倍。
    definedIn: physics.electromagnetism.electric-displacement
    anchor: def-permittivity
  - id: physics.electromagnetism.capacitance
    zh: |
      电容
    en: |
      capacitance
    brief: |
      电容器一个极板的电荷与两板电势差之比$C=\frac{Q}{\Delta\varphi}$，和带电多少无关，由两个导体的形状、大小、相对位置和中间的电介质决定，单位是法拉。
    definedIn: physics.electromagnetism.capacitors
    anchor: def-capacitor
  - id: physics.electromagnetism.electric-current
    zh: |
      电流
    en: |
      electric current
    brief: |
      单位时间穿过一个曲面的电荷$I=\dv Qt$，单位是安培；它是一个有正负的数，正负由选定的穿过方向决定。
    definedIn: physics.electromagnetism.current-density
    anchor: def-current
  - id: physics.electromagnetism.current-density
    zh: |
      电流密度
    en: |
      current density
    brief: |
      方向是正电荷流动方向、大小是单位垂直面积上电流的矢量$\vb J$；只在薄层里流动的电流用面电流密度$\vb K$描述。
    definedIn: physics.electromagnetism.current-density
    anchor: def-current-density
  - id: physics.electromagnetism.charge-carrier
    zh: |
      载流子
    en: |
      charge carrier
    brief: |
      导体里能移动、形成电流的带电粒子，例如金属里的电子、电解液里的正负离子。
    definedIn: physics.electromagnetism.current-density
    anchor: thm-drift
  - id: physics.electromagnetism.drift-velocity
    zh: |
      漂移速度
    en: |
      drift velocity
    brief: |
      导体里载流子平均的定向速度$\vb v_{\mathrm d}$；每单位体积有$n$个、各带电$q$时，电流密度$\vb J=nq\vb v_{\mathrm d}$。
    definedIn: physics.electromagnetism.current-density
    anchor: thm-drift
  - id: physics.electromagnetism.continuity-equation
    zh: |
      连续性方程
    en: |
      continuity equation
    brief: |
      电荷守恒在每一点的形式$\pdv\rho t+\divg\vb J=0$（$\rho$是电荷密度，$\vb J$是电流密度）：一处的电荷减少多快，电流就从那里流出多快。
    definedIn: physics.electromagnetism.current-density
    anchor: thm-continuity
  - id: physics.electromagnetism.steady-current
    zh: |
      恒定电流
    en: |
      steady current
    brief: |
      各处电流密度和电荷密度都不随时间变化的电流；这时$\divg\vb J=0$，一根导线各个截面上的电流相同。
    definedIn: physics.electromagnetism.current-density
    anchor: def-steady-current
  - id: physics.electromagnetism.ohms-law
    zh: |
      欧姆定律
    en: |
      Ohm's law
    brief: |
      许多导体里电流密度和电场成正比，$\vb J=\sigma\vb E$；对一段导体，就是两端的电势差和电流成正比。
    definedIn: physics.electromagnetism.current-density
    anchor: def-ohm
  - id: physics.electromagnetism.conductivity
    zh: |
      电导率
    en: |
      electrical conductivity
    brief: |
      欧姆定律$\vb J=\sigma\vb E$里的比例系数$\sigma$，由材料和温度决定，单位是$\mathrm{S/m}$。
    definedIn: physics.electromagnetism.current-density
    anchor: def-ohm
  - id: physics.electromagnetism.resistance
    zh: |
      电阻
    en: |
      resistance
    brief: |
      一段导体两端的电势差与电流之比$R=\frac{\varphi_a-\varphi_b}{I}$，单位是欧姆；长$L$、截面积$A$、电导率$\sigma$的均匀导线，电阻是$\frac{L}{\sigma A}$。
    definedIn: physics.electromagnetism.current-density
    anchor: def-resistance
  - id: physics.electromagnetism.resistivity
    zh: |
      电阻率
    en: |
      resistivity
    brief: |
      电导率的倒数$\frac1\sigma$，单位是$\Omega\,\mathrm m$；长$L$、截面积$A$的均匀导线，电阻是电阻率乘$\frac LA$。
    definedIn: physics.electromagnetism.current-density
    anchor: thm-wire-resistance
  - id: physics.electromagnetism.joule-heating
    zh: |
      焦耳热
    en: |
      Joule heating
    brief: |
      电流通过导体时电场做的功变成的热；单位体积每秒$\vb J\cdot\vb E$，一段电阻上每秒$I^2R$。
    definedIn: physics.electromagnetism.current-density
    anchor: thm-joule
  - id: physics.electromagnetism.electromotive-force
    zh: |
      电动势
    en: |
      electromotive force
    abbr: |
      emf
    brief: |
      电源里的非静电力把单位正电荷沿电路推一圈所做的功$\mathcal E$，单位是伏特；它不是力。
    definedIn: physics.electromagnetism.dc-circuits
    anchor: def-emf
  - id: physics.electromagnetism.internal-resistance
    zh: |
      内阻
    en: |
      internal resistance
    brief: |
      电源内部的电阻$r$；电源输出电流$I$时，两极之间的电势差是$\mathcal E-Ir$，比电动势小。
    definedIn: physics.electromagnetism.dc-circuits
    anchor: def-internal-resistance
  - id: physics.electromagnetism.kirchhoff-laws
    zh: |
      基尔霍夫定律
    en: |
      Kirchhoff's circuit laws
    brief: |
      节点定律：流进一个节点的电流等于流出的；回路定律：沿闭合回路一圈，电动势之和等于电阻上的电势降落之和。
    definedIn: physics.electromagnetism.dc-circuits
    anchor: thm-kirchhoff
  - id: physics.electromagnetism.time-constant
    zh: |
      时间常数
    en: |
      time constant
    brief: |
      按$e^{-t/\tau}$衰减的量里的$\tau$：每过时间$\tau$，它变成原来的$\frac1e$；RC 电路的时间常数是$RC$。
    definedIn: physics.electromagnetism.rc-circuits
    anchor: def-time-constant
  - id: physics.electromagnetism.magnetic-field
    zh: |
      磁场
    en: |
      magnetic field
    brief: |
      描述运动电荷所受磁力的矢量场$\vb B$：以速度$\vb v$运动的电荷$q$受力$q\vb v\times\vb B$；单位是特斯拉，也叫磁感应强度。
    definedIn: physics.electromagnetism.lorentz-force
    anchor: def-magnetic-field
  - id: physics.electromagnetism.magnetic-field-line
    zh: |
      磁场线
    en: |
      magnetic field line
    brief: |
      处处和磁场方向相切的曲线，也叫磁感线；磁场强的地方画得密，它不会在任何地方开始或终止。
    definedIn: physics.electromagnetism.lorentz-force
    anchor: def-magnetic-field-line
  - id: physics.electromagnetism.lorentz-force
    zh: |
      洛伦兹力
    en: |
      Lorentz force
    brief: |
      电荷$q$以速度$\vb v$在电场$\vb E$和磁场$\vb B$里受的力$q(\vb E+\vb v\times\vb B)$；磁场部分和速度垂直，不做功。
    definedIn: physics.electromagnetism.lorentz-force
    anchor: def-lorentz-force
  - id: physics.electromagnetism.cyclotron-frequency
    zh: |
      回旋频率
    en: |
      cyclotron frequency
    brief: |
      带电粒子在匀强磁场里绕圈的频率$f_{\mathrm c}=\frac{|q|B}{2\pi m}$，和速率无关；角频率是$\omega_{\mathrm c}=\frac{|q|B}{m}$。
    definedIn: physics.electromagnetism.lorentz-force
    anchor: thm-cyclotron
  - id: physics.electromagnetism.current-element
    zh: |
      电流元
    en: |
      current element
    brief: |
      细导线上的一小段电流$I\,\dd\vb l$（$\dd\vb l$沿电流方向）；它在磁场里受力$I\,\dd\vb l\times\vb B$。
    definedIn: physics.electromagnetism.magnetic-force-on-currents
    anchor: thm-force-current
  - id: physics.electromagnetism.magnetic-moment
    zh: |
      磁矩
    en: |
      magnetic dipole moment
    brief: |
      平面线圈的$\vb m=I\vb a$，$\vb a$的大小是线圈面积、方向按电流绕向用右手定则定；匀强磁场里线圈受的力矩是$\vb m\times\vb B$。
    definedIn: physics.electromagnetism.magnetic-force-on-currents
    anchor: def-magnetic-moment
  - id: physics.electromagnetism.hall-effect
    zh: |
      霍尔效应
    en: |
      Hall effect
    brief: |
      载流导体放在垂直于电流的磁场里，两侧出现电势差$\frac{IB}{nqt}$，正负随载流子电荷$q$变；$n$是单位体积里的载流子数，$t$是沿磁场的厚度。
    definedIn: physics.electromagnetism.magnetic-force-on-currents
    anchor: thm-hall
  - id: physics.electromagnetism.biot-savart-law
    zh: |
      毕奥-萨伐尔定律
    en: |
      Biot–Savart law
    brief: |
      恒定电流的磁场是各电流元贡献之和，$\vb B=\frac{\mu_0}{4\pi}\oint\frac{I\,\dd\vb l'\times(\vb r-\vb r')}{|\vb r-\vb r'|^3}$；长直导线外$B=\frac{\mu_0I}{2\pi s}$。
    definedIn: physics.electromagnetism.biot-savart
    anchor: def-biot-savart
  - id: physics.electromagnetism.ampere-law
    zh: |
      安培环路定理
    en: |
      Ampère's circuital law
    brief: |
      恒定电流的磁场沿闭合回路的积分等于$\mu_0$乘穿过回路的电流，$\oint\vb B\cdot\dd\vb l=\mu_0I$；微分形式是$\curl\vb B=\mu_0\vb J$。
    definedIn: physics.electromagnetism.ampere-law
    anchor: thm-ampere
  - id: physics.electromagnetism.magnetic-flux
    zh: |
      磁通量
    en: |
      magnetic flux
    brief: |
      磁场穿过一个曲面的通量$\Phi=\int\vb B\cdot\dd\vb a$，单位是韦伯；穿过任何闭合曲面的磁通量都是零。
    definedIn: physics.electromagnetism.ampere-law
    anchor: def-magnetic-flux
  - id: physics.electromagnetism.solenoid
    zh: |
      螺线管
    en: |
      solenoid
    brief: |
      导线密绕成的长圆筒形线圈；很长时管内磁场均匀，$B=\mu_0nI$（$n$是每单位长度的匝数），管外几乎为零。
    definedIn: physics.electromagnetism.ampere-law
    anchor: thm-solenoid
  - id: physics.electromagnetism.magnetic-monopole
    zh: |
      磁单极子
    en: |
      magnetic monopole
    brief: |
      能单独发出或吸收磁场线的「磁荷」；$\divg\vb B=0$说的就是它不存在，实验上至今没有找到。
    definedIn: physics.electromagnetism.ampere-law
    anchor: def-monopole
  - id: physics.electromagnetism.vector-potential
    zh: |
      磁矢势
    en: |
      magnetic vector potential
    brief: |
      旋度等于磁场的矢量场$\vb A$，$\vb B=\curl\vb A$；恒定电流的磁矢势可取$\frac{\mu_0}{4\pi}\int\frac{\vb J(\vb r')}{|\vb r-\vb r'|}\dd V'$。
    definedIn: physics.electromagnetism.vector-potential
    anchor: def-vector-potential
  - id: physics.electromagnetism.gauge-transformation
    zh: |
      规范变换
    en: |
      gauge transformation
    brief: |
      把磁矢势换成$\vb A+\nabla\chi$（$\chi$是任意函数）；磁场不变，所以磁矢势不唯一，这叫作规范自由度。
    definedIn: physics.electromagnetism.vector-potential
    anchor: thm-gauge
  - id: physics.electromagnetism.magnetic-dipole
    zh: |
      磁偶极子
    en: |
      magnetic dipole
    brief: |
      从比自身大得多的距离看的小电流环；那里的磁场只由磁矩决定，形状和电偶极子的电场一样。
    definedIn: physics.electromagnetism.magnetic-dipole
    anchor: def-magnetic-dipole
