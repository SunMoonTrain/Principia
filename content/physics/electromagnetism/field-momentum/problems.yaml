- id: p1
  tier: easy
  statement: |
    一束功率为$1.0\,\mathrm W$的激光垂直照在一块黑色的板上，被完全吸收。求激光对板的推力，以$\mathrm{nN}$为单位，保留三位有效数字。取$c=3.00\times10^8\,\mathrm{m/s}$。
  answer:
    type: number
    value: 1.0/3.00e8*1e9
    unit: |
      $\mathrm{nN}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      吸收能量$U$，得到动量$\frac Uc$。
    - |
      单位时间吸收的能量是$P$，所以推力$F=\frac Pc$。
    - |
      $F=\frac{1.0}{3.00\times10^8}\,\mathrm N\approx3.33\times10^{-9}\,\mathrm N=3.33\,\mathrm{nN}$。
  solution: |
    单位时间吸收的能量是$P$，得到的动量是$\frac Pc$，所以$F=\frac Pc=\frac{1.0}{3.00\times10^8}\,\mathrm N\approx3.33\,\mathrm{nN}$。一瓦的激光，推力只相当于约$0.3\,\mu\mathrm g$的东西受的重力。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        同样强度的光垂直照射，完全反射的镜面受到的推力是完全吸收的黑面的两倍
      - |
        电磁场的动量密度和坡印亭矢量方向相同
      - |
        电荷和磁铁都静止时，场的动量一定为零
      - |
        把两列强度相同、相向传播的光同时照在一张完全吸收的薄膜两面，薄膜受的合力为零，可它在吸收能量
      - |
        照到完全吸收的表面上时，光的压强和强度成正比，和频率无关
    value: [1, 2, 4, 5]
  hints:
    - |
      完全吸收得到$\frac Uc$的动量，完全反射得到$\frac{2U}c$；$\vb g=\frac{\vb S}{c^2}$。
    - |
      静止的电场和磁场叠在一起时，$\vb E\times\vb B$可以不为零。
    - |
      A、B、D、E 对；C 错。
  solution: |
    A 对：反射时动量反向，变化量是吸收时的两倍。B 对：$\vb g=\frac{\vb S}{c^2}$。C 错：静止的带电体和磁铁旁边$\vb E\times\vb B$可以不为零，场里储存着动量，场一变化就会交给物体。

    D 对：两面各受$\frac Ic$乘以面积的力，方向相反，合力为零；两面都在吸收能量，薄膜变热。E 对：辐射压强是$\frac Ic$或$\frac{2I}c$，只和强度、表面的性质有关，和频率无关。

- id: p3
  tier: medium
  statement: |
    一艘太阳帆飞船的帆是边长$100\,\mathrm m$的正方形薄膜，飞船连帆总质量$100\,\mathrm{kg}$。在地球附近帆正对着太阳，阳光强度$1361\,\mathrm{W/m^2}$，帆把光完全反射。求阳光使飞船得到的加速度，以$\mathrm{mm/s^2}$为单位，保留三位有效数字。取$c=3.00\times10^8\,\mathrm{m/s}$。
  answer:
    type: number
    value: 2*1361*100^2/3.00e8/100*1e3
    unit: |
      $\mathrm{mm/s^2}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      完全反射时辐射压强是$\frac{2I}{c}$，推力$F=\frac{2IA}{c}$。
    - |
      $F=\frac{2\times1361\times10^4}{3.00\times10^8}\,\mathrm N\approx9.07\times10^{-2}\,\mathrm N$。
    - |
      $a=\frac Fm\approx9.07\times10^{-4}\,\mathrm{m/s^2}=0.907\,\mathrm{mm/s^2}$。
  solution: |
    $F=\frac{2IA}{c}=\frac{2\times1361\times1.0\times10^4}{3.00\times10^8}\,\mathrm N\approx9.07\times10^{-2}\,\mathrm N$，$a=\frac Fm\approx9.07\times10^{-4}\,\mathrm{m/s^2}=0.907\,\mathrm{mm/s^2}$。加速度很小，可一直加速一天，速度能增加约$78\,\mathrm{m/s}$。

- id: p4
  tier: medium
  statement: |
    彗星周围有半径为$s=1.0\,\mu\mathrm m$、密度为$1.0\times10^3\,\mathrm{kg/m^3}$的球形尘埃，它把照到的阳光完全吸收。求阳光对它的推力和太阳对它的引力之比，保留三位有效数字。取太阳的总辐射功率$L=3.83\times10^{26}\,\mathrm W$，太阳质量$M=1.99\times10^{30}\,\mathrm{kg}$，$G=6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$，$c=3.00\times10^8\,\mathrm{m/s}$。
  answer:
    type: number
    value: 3*3.83e26/(16*pi*6.67e-11*1.99e30*3.00e8*1.0e3*1.0e-6)
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      离太阳$r$处阳光强度$I=\frac{L}{4\pi r^2}$，尘埃挡住的面积是$\pi s^2$，推力$\frac{I\pi s^2}{c}$。
    - |
      引力$\frac{GM}{r^2}\cdot\frac43\pi s^3\rho$；两者都和$\frac1{r^2}$成正比，比值和距离无关。
    - |
      比值$\frac{3L}{16\pi GMc\rho s}=\frac{3\times3.83\times10^{26}}{16\pi\times6.67\times10^{-11}\times1.99\times10^{30}\times3.00\times10^8\times1.0\times10^3\times1.0\times10^{-6}}\approx0.574$。
  solution: |
    推力$F_{\text{光}}=\frac{L}{4\pi r^2}\cdot\frac{\pi s^2}{c}$，引力$F_{\text{引}}=\frac{GM}{r^2}\cdot\frac43\pi s^3\rho$，两者之比$\frac{3L}{16\pi GMc\rho s}$，和离太阳多远无关。代入数据，比值约$0.574$：这么小的尘埃，阳光的推力已经抵消了一半多的引力；尘埃再小一些，推力就超过引力。

- id: p5
  tier: hard
  statement: |
    强度为$I$的平面电磁波以入射角$\theta$（和表面法线的夹角）照到一个平面上。

    （1）表面完全吸收时，单位面积受到的力垂直于表面的分量和平行于表面的分量各是多少？（2）表面完全反射时呢？（3）入射角接近$90^\circ$时会怎样？
  hints:
    - |
      光束的横截面积$A_\perp$照到表面上的面积是$\frac{A_\perp}{\cos\theta}$，单位面积表面单位时间收到的能量是$I\cos\theta$。
    - |
      （1）吸收：动量沿入射方向，大小$\frac{I\cos\theta}{c}$，分解为垂直分量$\frac Ic\cos^2\theta$和平行分量$\frac Ic\cos\theta\sin\theta$。
    - |
      （2）反射：平行分量不变，垂直分量反向，表面得到$\frac{2I}{c}\cos^2\theta$，没有平行分量。
  reference: |
    （1）横截面积为$A_\perp$的光束照到表面上的面积是$\frac{A_\perp}{\cos\theta}$，所以单位面积表面单位时间收到的能量是$I\cos\theta$，带来的动量是$\frac{I\cos\theta}{c}$，沿入射方向。完全吸收时这些动量全部交给表面：垂直于表面的分量是$\frac Ic\cos^2\theta$，就是压强；平行于表面的分量是$\frac Ic\cos\theta\sin\theta$，是沿表面的剪切力。

    （2）完全反射时，光的动量平行于表面的分量不变，垂直分量反向，变化量是垂直分量的两倍：表面受到的压强是$\frac{2I}c\cos^2\theta$，没有平行于表面的力。

    （3）$\theta\to90^\circ$时光几乎擦着表面走，照到单位面积上的能量趋于零，压强按$\cos^2\theta$趋于零。太阳帆就是靠转动帆面改变受力方向的：完全反射的帆受力总是垂直于帆面，斜着放，推力就有了沿轨道方向的分量，可以加速也可以减速。

- id: p6
  tier: hard
  statement: |
    一个质量为$M$、长为$L$的盒子静止在没有摩擦的地方。盒子左端的灯在很短的时间里向右发出一个能量为$U$（$U\ll Mc^2$）的光脉冲，光脉冲飞过盒子，被右端完全吸收。

    （1）发光时盒子得到多大的速度？向哪边？

    （2）光脉冲飞过盒子期间，盒子移动了多远？（3）没有外力，整个系统的质心不该移动。要让质心不动，光脉冲必须带着多少「质量」？
  hints:
    - |
      光脉冲的动量是$\frac Uc$，盒子反冲。
    - |
      $v=\frac{U}{Mc}$，向左；飞过的时间约$\frac Lc$，盒子左移$\frac{UL}{Mc^2}$，被吸收后盒子停下。
    - |
      要质心不动，$M\cdot\frac{UL}{Mc^2}=mL$，$m=\frac U{c^2}$。
  reference: |
    （1）光脉冲向右带走动量$\frac Uc$，盒子得到向左的动量，速度$v=\frac{U}{Mc}$，向左。

    （2）$U\ll Mc^2$时盒子的位移很小，光脉冲飞过盒子的时间约$\frac Lc$，盒子左移$\Delta x=v\frac Lc=\frac{UL}{Mc^2}$。光脉冲被右端吸收时，盒子得到向右的动量$\frac Uc$，又停下来。最后盒子停在比原来偏左$\frac{UL}{Mc^2}$的地方。

    （3）没有外力，质心不动。盒子左移了，必须有某种「质量」从左端搬到了右端：设光脉冲带着质量$m$，它向右移动了$L$，盒子（剩下的质量约为$M$）向左移动了$\frac{UL}{Mc^2}$，质心不动要求$mL=M\cdot\frac{UL}{Mc^2}$，即$m=\frac U{c^2}$。左端失去能量$U$，质量减少$\frac U{c^2}$，右端得到能量，质量增加同样多：这是爱因斯坦 1906 年用来说明能量有惯性的论证（见[质能关系](lesson:physics.special-relativity.mass-energy)）。

- id: p7
  tier: thinking
  statement: |
    电荷$q_1$沿$x$轴运动，电荷$q_2$沿$y$轴运动，某一时刻$q_1$正好经过$q_2$的运动路线（见[电场](lesson:physics.electromagnetism.electric-field)第 7 题）。

    （1）两者之间的磁力满足牛顿第三定律吗？（2）两个电荷的总动量守恒吗？（3）怎样才能守恒？
  hints:
    - |
      $q_2$在$q_1$处的磁场和$q_1$的速度平行，$q_1$不受磁力；$q_1$在$q_2$处的磁场却和$q_2$的速度垂直。
    - |
      两个磁力不等大反向，两个电荷的总动量会变。
    - |
      场有动量$\varepsilon_0\vb E\times\vb B$，两个电荷周围的场一直在变；守恒的是电荷和场的总动量。
  reference: |
    （1）不满足。$q_1$正好在$q_2$的运动路线上时，$q_2$在$q_1$处产生的磁场正比于$\vb v_2\times(\vb r_1-\vb r_2)$，$\vb r_1-\vb r_2$沿$q_2$的速度方向，叉乘为零，$q_1$不受磁力；$q_1$在$q_2$处产生的磁场却不为零，$q_2$受到磁力。一个有力、一个没有，不可能等大反向。

    （2）两个电荷之间的力不等大反向，两者的总动量就会变，只算电荷，动量不守恒。

    （3）把电磁场的动量算进去。两个运动的电荷周围的电场、磁场叠在一起，$\vb E\times\vb B$不为零，场带着动量$\int\varepsilon_0\vb E\times\vb B\,\dd V$；电荷运动时场跟着变，场的动量也变。电荷的动量加上场的动量，总量守恒。牛顿第三定律只在作用「瞬时传递」时成立；相互作用以有限的速度通过场传递，就要把场当作一个带着动量的东西。

- id: p8
  tier: thinking
  statement: |
    彗星靠近太阳时常常拖出两条尾巴：一条蓝色、又窄又直，一条发白、宽而弯曲。

    （1）发白的那条是尘埃反射的阳光，它为什么背着太阳？（2）为什么它是弯的，而且比尘埃的轨道更靠外？（3）蓝色的那条是电离的气体，主要是什么在推它？
  hints:
    - |
      尘埃受的光压和引力之比和距离无关，只和尘埃的大小、密度有关（第 4 题）。
    - |
      尘埃离开彗核以后，受到的「有效引力」变小了，绕太阳走得比彗核慢，落在彗核轨道的外侧、后面。
    - |
      太阳不断向外吹出带电粒子流（太阳风），它带着磁场，推着电离的气体沿背离太阳的方向走。
  reference: |
    （1）尘埃很小时，阳光的推力和太阳引力可以相比（第 4 题算出半径约$1\,\mu\mathrm m$的尘埃，推力已超过引力的一半），推力背着太阳，所以尘埃被推向背离太阳的一侧。

    （2）光压和引力都和距离的平方成反比，所以尘埃像是在一个「变弱了的引力」里运动。尘埃离开彗核时速度和彗核差不多，可受的有效引力更小，它沿着更平缓的轨道走，绕太阳的角速度比彗核小，渐渐落在彗核的后面、轨道的外侧，连起来就是一条弯弯的宽尾巴。大小不同的尘埃受的有效引力不同，散开成一片。

    （3）离子尾主要是太阳风推的：太阳不断向外吹出速度每秒几百千米的带电粒子流，带着磁场，电离的气体被它拖着沿几乎正背着太阳的方向走，所以又直又窄；它发蓝光，是因为里面的离子会发出特定颜色的光。光压对这些分子、离子的作用远小于太阳风。
