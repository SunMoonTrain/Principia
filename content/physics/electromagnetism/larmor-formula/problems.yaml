- id: p1
  tier: easy
  statement: |
    一个电子的加速度是$1.0\times10^{18}\,\mathrm{m/s^2}$，速度远小于光速。求它的辐射功率，以$10^{-18}\,\mathrm W$为单位，保留三位有效数字。取$e=1.602\times10^{-19}\,\mathrm C$，$\varepsilon_0=8.854\times10^{-12}\,\mathrm{F/m}$，$c=3.00\times10^8\,\mathrm{m/s}$。
  answer:
    type: number
    value: (1.602e-19)^2*(1.0e18)^2/(6*pi*8.854e-12*(3.00e8)^3)/1e-18
    unit: |
      $10^{-18}\,\mathrm W$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      拉莫尔公式$P=\frac{q^2a^2}{6\pi\varepsilon_0c^3}$。
    - |
      $q^2a^2=(1.602\times10^{-19})^2\times10^{36}\approx2.566\times10^{-2}$，$6\pi\varepsilon_0c^3\approx4.506\times10^{15}$（国际单位）。
    - |
      $P\approx\frac{2.566\times10^{-2}}{4.506\times10^{15}}\,\mathrm W\approx5.70\times10^{-18}\,\mathrm W$。
  solution: |
    $P=\frac{e^2a^2}{6\pi\varepsilon_0c^3}=\frac{(1.602\times10^{-19})^2\times(1.0\times10^{18})^2}{6\pi\times8.854\times10^{-12}\times(3.00\times10^8)^3}\,\mathrm W\approx5.70\times10^{-18}\,\mathrm W$。加速度大得惊人，辐射功率却很小：单个电子的辐射一般微不足道，天线、光源靠的是大量电子一起振动。

- id: p2
  tier: easy
  statement: |
    下面关于低速点电荷的辐射的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        辐射功率正比于加速度的平方
      - |
        匀速运动的电荷不辐射
      - |
        沿加速度的方向辐射最强
      - |
        同样大小的力作用下，电子的辐射功率比质子的大得多
      - |
        辐射场的电场按距离的平方反比减小
    value: [1, 2, 4]
  hints:
    - |
      $P=\frac{q^2a^2}{6\pi\varepsilon_0c^3}$，单位立体角的功率正比于$\sin^2\theta$。
    - |
      同样的力，加速度和质量成反比；辐射场按$\frac1R$减小。
    - |
      A、B、D 对；C、E 错。
  solution: |
    A 对、B 对：$P$正比于$a^2$，$a=0$时不辐射。C 错：单位立体角的功率正比于$\sin^2\theta$，沿加速度方向为零，垂直方向最强。

    D 对：同样的力下加速度和质量成反比，电荷大小相同，功率之比是质量之比的平方，约$3\times10^6$。E 错：辐射场按$\frac1R$减小，正因为这样它的能流穿过大球面时不随半径减小。

- id: p3
  tier: medium
  statement: |
    示波管里，一个电子从静止开始，被$1000\,\mathrm V$的电压在$2.0\,\mathrm{cm}$的距离上匀加速。求加速过程中辐射掉的能量和电子得到的动能之比，以$10^{-15}$为单位，保留三位有效数字。取$e=1.602\times10^{-19}\,\mathrm C$，$m=9.109\times10^{-31}\,\mathrm{kg}$，$\varepsilon_0=8.854\times10^{-12}\,\mathrm{F/m}$，$c=3.00\times10^8\,\mathrm{m/s}$。
  answer:
    type: number
    value: (1.602e-19)^2*(1.602e-19*1000/0.020/9.109e-31)^2/(6*pi*8.854e-12*(3.00e8)^3)*sqrt(2*0.020/(1.602e-19*1000/0.020/9.109e-31))/(1.602e-19*1000)/1e-15
    unit: |
      $10^{-15}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      电场$E=\frac Vd$，加速度$a=\frac{eE}{m}$是常量，辐射功率也是常量。
    - |
      加速用的时间$t=\sqrt{\frac{2d}{a}}$，辐射掉的能量是$Pt$，得到的动能是$eV$。
    - |
      $a\approx8.79\times10^{15}\,\mathrm{m/s^2}$，$P\approx4.40\times10^{-22}\,\mathrm W$，$t\approx2.13\times10^{-9}\,\mathrm s$，$\frac{Pt}{eV}\approx\frac{9.39\times10^{-31}}{1.602\times10^{-16}}\approx5.86\times10^{-15}$。
  solution: |
    $E=\frac{1000}{0.020}\,\mathrm{V/m}=5.0\times10^4\,\mathrm{V/m}$，$a=\frac{eE}{m}\approx8.79\times10^{15}\,\mathrm{m/s^2}$，末速度约$1.9\times10^7\,\mathrm{m/s}$，远小于光速，可以用拉莫尔公式：$P=\frac{e^2a^2}{6\pi\varepsilon_0c^3}\approx4.40\times10^{-22}\,\mathrm W$。用时$t=\sqrt{\frac{2d}{a}}\approx2.13\times10^{-9}\,\mathrm s$，辐射掉$Pt\approx9.39\times10^{-31}\,\mathrm J$，得到的动能$eV\approx1.60\times10^{-16}\,\mathrm J$，比值约$5.86\times10^{-15}$。日常的电子加速里辐射完全可以忽略；要辐射得显著，加速度得大得多，或者像同步加速器里那样让电子一圈一圈地转。

- id: p4
  tier: medium
  statement: |
    同样大小的力分别作用在一个电子和一个质子上，两者的速度都远小于光速。电子的辐射功率是质子的几倍？以$10^6$为单位，保留三位有效数字。取电子质量$9.109\times10^{-31}\,\mathrm{kg}$，质子质量$1.673\times10^{-27}\,\mathrm{kg}$。
  answer:
    type: number
    value: (1.673e-27/9.109e-31)^2/1e6
    unit: |
      $10^6$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      两者电荷的大小相同，$P$正比于$a^2$。
    - |
      同样的力，$a=\frac Fm$，所以$\frac{P_{\mathrm e}}{P_{\mathrm p}}=\Bigl(\frac{m_{\mathrm p}}{m_{\mathrm e}}\Bigr)^2$。
    - |
      $\frac{m_{\mathrm p}}{m_{\mathrm e}}\approx1837$，平方约$3.37\times10^6$。
  solution: |
    拉莫尔公式里$P$正比于$q^2a^2$，两者的$q^2$相同，$a=\frac Fm$，所以功率之比是$\Bigl(\frac{m_{\mathrm p}}{m_{\mathrm e}}\Bigr)^2=\Bigl(\frac{1.673\times10^{-27}}{9.109\times10^{-31}}\Bigr)^2\approx3.37\times10^6$。物质发光、发射无线电波，起作用的主要是轻得多的电子。

- id: p5
  tier: hard
  statement: |
    频率为$\omega$、电场振幅为$E_0$的平面电磁波（electromagnetic wave）照到一个自由电子上，电子被电场推着振动，速度远小于光速，磁场的力不计。

    （1）求电子辐射的平均功率。（2）辐射的平均功率和入射波的强度（intensity）之比叫作散射截面（scattering cross section）。证明它是$\sigma=\frac{8\pi}{3}r_{\mathrm e}^2$，$r_{\mathrm e}=\frac{e^2}{4\pi\varepsilon_0mc^2}$，并说明它和频率无关。（3）取$r_{\mathrm e}=2.82\times10^{-15}\,\mathrm m$，算出$\sigma$。
  hints:
    - |
      $m\vb a=-e\vb E_0\cos\omega t$，$a^2$的时间平均是$\frac{e^2E_0^2}{2m^2}$。
    - |
      入射波的强度是$\frac12c\varepsilon_0E_0^2$。
    - |
      $\sigma=\frac{e^4}{6\pi\varepsilon_0^2m^2c^4}$，把它写成$r_{\mathrm e}^2$的倍数。
  reference: |
    （1）电子的加速度$a=\frac{eE_0}{m}\cos\omega t$，由拉莫尔公式，$P=\frac{e^2a^2}{6\pi\varepsilon_0c^3}$，$\cos^2\omega t$的平均是$\frac12$，平均功率$\langle P\rangle=\frac{e^4E_0^2}{12\pi\varepsilon_0m^2c^3}$。

    （2）$\sigma=\frac{\langle P\rangle}{\frac12c\varepsilon_0E_0^2}=\frac{e^4}{6\pi\varepsilon_0^2m^2c^4}$。$r_{\mathrm e}^2=\frac{e^4}{16\pi^2\varepsilon_0^2m^2c^4}$，所以$\sigma=\frac{16\pi^2}{6\pi}r_{\mathrm e}^2=\frac{8\pi}{3}r_{\mathrm e}^2$。$E_0$和$\omega$都消掉了：电子的振幅反比于质量、和频率无关，辐射的比例也就和频率无关。

    （3）$\sigma=\frac{8\pi}3\times(2.82\times10^{-15})^2\,\mathrm{m^2}\approx6.66\times10^{-29}\,\mathrm{m^2}$。这种自由电子对电磁波的散射叫作汤姆孙散射（Thomson scattering）。截面极小，可电子数目极多时（例如在等离子体里），散射就不能忽略。电子要是被束缚在原子里，就要加上恢复力，散射随频率强烈变化，这就是[电偶极辐射](lesson:physics.electromagnetism.dipole-radiation)里天空为什么是蓝色的道理。

- id: p6
  tier: hard
  statement: |
    用几何图像里的作图推出辐射场。电荷以很小的速度$v$运动，在$t=0$时用很短的时间$\tau$停下；过了时间$T$（$T\gg\tau$）以后，看离它约$R=cT$处、方向和速度成$\theta$角的地方。

    （1）在这个方向上，薄层里电场线拐弯的那一段，沿半径方向跨过多长？垂直于半径的方向错开了多少？（2）由电场线的连续性，求薄层里电场垂直于半径的分量和沿半径的分量之比，并用$a=\frac v\tau$写出垂直分量的大小，和低速电荷的辐射场比较。
  hints:
    - |
      薄层的厚度是$c\tau$。外面的电场线从电荷没停下的话此刻该在的位置出发，那个位置和停下的位置相距约$vT$。
    - |
      $vT$垂直于半径方向的分量是$vT\sin\theta$。
    - |
      $\frac{E_\perp}{E_r}=\frac{vT\sin\theta}{c\tau}$，$E_r=\frac{q}{4\pi\varepsilon_0R^2}$。
  reference: |
    （1）消息从停下的位置以光速向外传，过了$T$以后，内圈半径约$cT$，外圈半径约$c(T+\tau)$，薄层的厚度是$c\tau$，电场线拐弯的那一段沿半径方向跨过$c\tau$。内圈以内的电场线从停下的位置出发，外圈以外的从外推的位置出发，两个位置相距约$vT$（速度小，不计相对论的压缩），在$\theta$方向上，两条电场线垂直于半径的方向错开约$vT\sin\theta$。

    （2）电场线连续，拐弯的那一段沿半径跨过$c\tau$、横向错开$vT\sin\theta$，所以那里的电场$\frac{E_\perp}{E_r}=\frac{vT\sin\theta}{c\tau}=\frac{aT\sin\theta}{c}=\frac{aR\sin\theta}{c^2}$。沿半径的分量由高斯定律仍是$E_r=\frac{q}{4\pi\varepsilon_0R^2}$，所以$E_\perp=\frac{q}{4\pi\varepsilon_0R^2}\cdot\frac{aR\sin\theta}{c^2}=\frac{qa\sin\theta}{4\pi\varepsilon_0c^2R}$，正是低速电荷的辐射场的大小。它按$\frac1R$减小，因为薄层越往外，同样的横向错开$vT\sin\theta$也越大，而薄层的厚度$c\tau$不变。珀塞尔（Edward Purcell）的教科书《电磁学》就是用这个作图推出辐射场的。

- id: p7
  tier: thinking
  statement: |
    匀速运动的电荷周围，电场和磁场也随时间变化，空间里也有能流。

    （1）为什么说它不辐射？（2）「辐射」应该怎样定义才不含糊？（3）换到和电荷一起运动的参考系里，这个问题怎样一目了然？
  hints:
    - |
      看穿过一个以电荷为中心、半径很大的球面的能流。
    - |
      速度场按$\frac1{R^2}$减小，能流按$\frac1{R^4}$减小。
    - |
      在电荷静止的参考系里只有静电场。
  reference: |
    （1）匀速运动时只有速度场，电场、磁场都按$\frac1{R^2}$减小，坡印亭矢量按$\frac1{R^4}$减小，穿过半径为$R$的大球面的能流按$\frac1{R^2}$趋于零。场里的能量只是跟着电荷一起走，并没有流到无穷远去。

    （2）辐射指的是不可逆地流到无穷远的能量：取包住电荷的球面，令半径趋于无穷大（同时用推迟时间对齐，看同一时刻发出的能量），能流的极限不为零，这部分才叫辐射。只有按$\frac1R$减小的场能做到，也就是正比于加速度的辐射场。

    （3）在电荷静止的参考系里只有静电场，没有能流，当然不辐射；而「能量流到无穷远」这件事不会因为换参考系就凭空出现。加速运动的电荷找不到一个一直让它静止的惯性系，辐射就无法这样消掉。

- id: p8
  tier: thinking
  statement: |
    按经典电磁学，氢原子里绕核运动的电子会在约$10^{-11}\,\mathrm s$里落到原子核上。

    （1）在落下去的过程中，它辐射的光的频率怎样变化？由此得到的光谱应该是什么样子？（2）实际观察到的氢原子光谱是什么样子？（3）这两个事实合起来说明了什么？
  hints:
    - |
      辐射的频率等于电子绕核转动的频率，半径越小转得越快。
    - |
      氢原子发的光由一些分立的谱线组成。
    - |
      原子既稳定，发的光又是分立的，这和经典的图像在两处都矛盾。
  reference: |
    （1）电子绕核转动的频率$f=\frac{v}{2\pi r}$，由$\frac{e^2}{4\pi\varepsilon_0r^2}=\frac{mv^2}r$得$f\propto r^{-3/2}$，半径缩小时频率连续升高。辐射的频率跟着连续变化，得到的应该是连续的光谱，而且每个原子只发一次光就塌缩了。

    （2）实际上，氢原子发的光由一些分立的谱线组成，波长可以精确地测出来，例如可见光里的巴耳末线系；原子也是稳定的。

    （3）经典电磁学和牛顿力学合起来，在原子的尺度上给出了错误的结论：原子既不会塌缩，发光也只在一些分立的频率上。1913 年，玻尔假定电子只能在一些特定的轨道上运动，在这些轨道上不辐射，只在轨道之间跃迁时发出一定频率的光，解释了氢原子的谱线；真正的解释要等到量子力学（见[原子光谱与玻尔模型](lesson:physics.quantum-mechanics.bohr-model)、[原子的辐射跃迁与选择定则](lesson:physics.quantum-mechanics.radiative-transitions)）。
