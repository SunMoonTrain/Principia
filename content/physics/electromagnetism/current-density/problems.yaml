- id: p1
  tier: easy
  statement: |
    一根长$100\,\mathrm m$、横截面积为$1.5\,\mathrm{mm^2}$的铜导线，铜的电阻率（resistivity）取$1.68\times10^{-8}\,\Omega\,\mathrm m$。求它的电阻，保留三位有效数字。
  answer:
    type: number
    value: 1.68e-8*100/1.5e-6
    unit: |
      $\Omega$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      均匀导线的电阻是$R=\frac{L}{\sigma A}$，其中$\frac1\sigma$就是电阻率。
    - |
      $L=100\,\mathrm m$，$A=1.5\times10^{-6}\,\mathrm{m^2}$。
    - |
      $R=1.68\times10^{-8}\times\frac{100}{1.5\times10^{-6}}\,\Omega=1.12\,\Omega$。
  solution: |
    $R=\frac1\sigma\cdot\frac LA=1.68\times10^{-8}\times\frac{100}{1.5\times10^{-6}}\,\Omega=1.12\,\Omega$。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        一根铜导线里电子向东漂移，导线里的电流向东
      - |
        恒定电流流过一根粗细不均匀的铜导线时，细处电子的漂移速度比粗处大
      - |
        一块区域里的电荷在增加，那么穿过它边界的净电流是向里流的
      - |
        把一根导线均匀地拉长为原来的$2$倍（体积不变），两端的电势差保持不变，电流变成原来的$\frac14$
      - |
        穿过一个曲面的电流为零，曲面上各处的电流密度就都为零
    value: [2, 3, 4]
  hints:
    - |
      电流的方向按正电荷流动的方向定；恒定电流（steady current）时，穿过导线各个横截面的电流相同。
    - |
      电荷守恒（conservation of charge）：区域里的电荷增加，就是有净电流流进来。导线拉长后，长度加倍、横截面积减半。
    - |
      B、C、D 对；A、E 错。
  solution: |
    A 错：电子带负电，电流的方向和电子漂移的方向相反，向西。B 对：各截面的电流相同，$J=\frac IA$，截面小的地方电流密度大；$v_{\mathrm d}=\frac{J}{ne}$，同一种铜里$n$相同，所以细处的漂移速度也大。C 对：由连续性方程（continuity equation）的积分形式，$\oint\vb J\cdot\dd\vb a=-\dv{}{t}\int_V\rho\,\dd V<0$，净电流向里。

    D 对：$R=\frac{L}{\sigma A}$变成原来的$4$倍，电势差不变，电流变成原来的$\frac14$。E 错：电流为零只说明穿过曲面的总量为零；例如曲面和电流的方向平行，电流顺着它流过，穿过它的电流为零，电流密度却不为零。

- id: p3
  tier: medium
  statement: |
    一根长$2.0\,\mathrm m$、直径$1.0\,\mathrm{mm}$的铜导线，两端的电势差是$0.10\,\mathrm V$。铜的电导率取$5.96\times10^7\,\mathrm{S/m}$，每立方米有$8.5\times10^{28}$个能移动的电子。求电子漂移速度的大小，以$\mathrm{mm/s}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 5.96e7*0.10/2.0/(8.5e28*1.602176634e-19)*1e3
    unit: |
      $\mathrm{mm/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      均匀导线里的电场是$E=\frac{\varphi_a-\varphi_b}{L}$；由欧姆定律（Ohm's law）得$J=\sigma E$，再由$J=nev_{\mathrm d}$求漂移速度（drift velocity）。
    - |
      $E=0.050\,\mathrm{V/m}$，$J=\sigma E=2.98\times10^6\,\mathrm{A/m^2}$。
    - |
      $v_{\mathrm d}=\frac{J}{ne}=\frac{2.98\times10^6}{8.5\times10^{28}\times1.602\times10^{-19}}\,\mathrm{m/s}\approx2.19\times10^{-4}\,\mathrm{m/s}$；直径用不到。
  solution: |
    导线里的电场是$E=\frac{0.10\,\mathrm V}{2.0\,\mathrm m}=0.050\,\mathrm{V/m}$，电流密度$J=\sigma E=2.98\times10^6\,\mathrm{A/m^2}$。

    漂移速度$v_{\mathrm d}=\frac{J}{ne}\approx2.19\times10^{-4}\,\mathrm{m/s}$，即$0.219\,\mathrm{mm/s}$。$v_{\mathrm d}=\frac{\sigma E}{ne}$只由电场决定，所以用不到导线的直径：粗的导线电流大，单个电子却漂移得一样快。

- id: p4
  tier: medium
  statement: |
    同轴电缆的内导体半径是$0.50\,\mathrm{mm}$，外导体的内半径是$2.0\,\mathrm{mm}$，中间填充的材料并不完全绝缘，电导率是$1.0\times10^{-10}\,\mathrm{S/m}$。电缆长$100\,\mathrm m$，忽略两端的影响，求内外导体之间的电阻，保留三位有效数字。
  answer:
    type: number
    value: ln(4)/(2*pi*1.0e-10*100)
    unit: |
      $\Omega$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      电流沿半径方向从内导体流到外导体；恒定电流时，穿过每个同轴圆柱面的电流都相同。
    - |
      离轴$s$处$J=\frac{I}{2\pi sL}$，$E=\frac J\sigma$；从$a$积到$b$，电势差是$\frac{I}{2\pi\sigma L}\ln\frac ba$。
    - |
      $R=\frac{\ln(b/a)}{2\pi\sigma L}=\frac{\ln4}{2\pi\times1.0\times10^{-10}\times100}\,\Omega\approx2.21\times10^7\,\Omega$。
  solution: |
    设内外导体之间的电流为$I$，它沿半径方向穿过离轴$s$处、长为$L$的圆柱面，$J=\frac{I}{2\pi sL}$，$E=\frac J\sigma$。从$a$积到$b$，电势差是$\frac{I}{2\pi\sigma L}\ln\frac ba$，所以$R=\frac{\ln(b/a)}{2\pi\sigma L}$。

    代入数值，$b/a=4$，$R=\frac{\ln4}{2\pi\times1.0\times10^{-10}\times100}\,\Omega\approx2.21\times10^7\,\Omega$。

- id: p5
  tier: hard
  statement: |
    一块电导率为$\sigma$的均匀导体满足欧姆定律，它除了导电以外，对电场的响应和真空一样。某一时刻，导体内部有体电荷密度为$\rho_0(\vb r)$的电荷。

    （1）证明此后导体内部各处的电荷密度按$\rho(\vb r,t)=\rho_0(\vb r)e^{-\sigma t/\varepsilon_0}$衰减，时间常数（time constant）是$\frac{\varepsilon_0}{\sigma}$。（2）对铜，取$\sigma=5.96\times10^7\,\mathrm{S/m}$，算出这个时间常数，并和讲解里电子两次碰撞之间的平均时间$\tau$比较。（3）这些电荷去了哪里？
  hints:
    - |
      把连续性方程、欧姆定律和高斯定律（Gauss's law）的微分形式$\divg\vb E=\frac{\rho}{\varepsilon_0}$（见[高斯定律的微分形式](lesson:physics.electromagnetism.gauss-differential)）连起来。
    - |
      $\pdv\rho t=-\divg\vb J=-\sigma\divg\vb E=-\frac{\sigma}{\varepsilon_0}\rho$：每一点的电荷密度，随时间的变化率都和它自己成正比。
    - |
      铜的$\frac{\varepsilon_0}{\sigma}\approx1.5\times10^{-19}\,\mathrm s$，比两次碰撞之间的时间$\tau\approx2.5\times10^{-14}\,\mathrm s$短得多；电荷的总量守恒，内部的电荷流到了表面上。
  reference: |
    （1）由连续性方程和欧姆定律，$\pdv\rho t=-\divg\vb J=-\sigma\divg\vb E$；再由高斯定律的微分形式$\divg\vb E=\frac{\rho}{\varepsilon_0}$，得$\pdv\rho t=-\frac{\sigma}{\varepsilon_0}\rho$。对每个固定的$\vb r$，$\rho$随时间的变化率和它自己成正比，解是$\rho(\vb r,t)=\rho_0(\vb r)e^{-\sigma t/\varepsilon_0}$，直接求导就能验证。各处的电荷按同一个时间常数衰减，和开始时怎样分布无关。

    （2）$\frac{\varepsilon_0}{\sigma}=\frac{8.854\times10^{-12}}{5.96\times10^7}\,\mathrm s\approx1.5\times10^{-19}\,\mathrm s$。讲解里算出铜里电子两次碰撞之间的时间$\tau$约为$2.5\times10^{-14}\,\mathrm s$，是它的十几万倍：在这么快的变化里电子来不及碰撞，$\vb J=\sigma\vb E$已不成立，要考虑电子的惯性；实际上金属里多出来的电荷大约在$10^{-14}\,\mathrm s$量级的时间里散开。对导电差得多的材料，例如$\sigma=10^{-6}\,\mathrm{S/m}$，$\frac{\varepsilon_0}{\sigma}\approx9\times10^{-6}\,\mathrm s$，这个结论才可靠。

    （3）电荷的总量守恒。内部的电荷密度处处趋于零，多出来的电荷随电流流到导体的表面上，最后留在表面，这正是[导体与静电平衡](lesson:physics.electromagnetism.conductors)里「静电平衡时电荷只分布在表面上」的情形；这一题说明了导体怎样达到静电平衡。

- id: p6
  tier: hard
  statement: |
    横截面积相同的一段铜线和一段铁线接在一起，通以恒定电流$I$，电流从铜流向铁。铜和铁的电导率分别是$\sigma_1$和$\sigma_2$，$\sigma_1>\sigma_2$，横截面积是$A$。

    （1）两段导线里的电流密度和电场各是多少？（2）接头处的界面上积累了多少电荷？是正是负？（3）取$I=1.0\,\mathrm A$，$\sigma_1=5.96\times10^7\,\mathrm{S/m}$，$\sigma_2=1.0\times10^7\,\mathrm{S/m}$，这些电荷相当于几个电子的电荷？
  hints:
    - |
      恒定电流时，穿过接头两侧横截面的电流相同，横截面积又相同，所以两侧的电流密度相同；电场由欧姆定律得到，两侧不同。
    - |
      在界面上取一个扁平的圆柱形闭合曲面，两个底面分别在铜里和铁里，用高斯定律（Gauss's law，见[电通量与高斯定律](lesson:physics.electromagnetism.gauss-law)）。
    - |
      界面上的电荷是$\varepsilon_0I\Bigl(\frac{1}{\sigma_2}-\frac{1}{\sigma_1}\Bigr)$，是正的；代入数值约为$7.4\times10^{-19}\,\mathrm C$。
  reference: |
    （1）恒定电流时，接头两侧的电流都是$I$，横截面积相同，所以两侧的电流密度都是$J=\frac IA$，沿着导线。电场由欧姆定律给出：铜里$E_1=\frac{I}{\sigma_1A}$，铁里$E_2=\frac{I}{\sigma_2A}$，铁里的电场强。

    （2）在界面上取一个扁平的圆柱形闭合曲面，底面就是导线的横截面，两个底面分别在铜里和铁里，侧面很矮，穿过侧面的电通量（electric flux）可以略去。穿出这个曲面的电通量是$(E_2-E_1)A$，由高斯定律，曲面里的电荷是$Q=\varepsilon_0(E_2-E_1)A=\varepsilon_0I\Bigl(\frac{1}{\sigma_2}-\frac{1}{\sigma_1}\Bigr)$。$\sigma_1>\sigma_2$，所以$Q>0$，界面上积累的是正电荷，正是它们使铁里的电场比铜里强。

    （3）$Q=8.854\times10^{-12}\times1.0\times\Bigl(\frac{1}{1.0\times10^7}-\frac{1}{5.96\times10^7}\Bigr)\,\mathrm C\approx7.4\times10^{-19}\,\mathrm C$，约为$4.6e$，不到五个电子的电荷。导线里的电场靠极少的电荷来安排：电流一接通，这些电荷就在界面和导线表面上自动积累起来，直到电流处处满足$\divg\vb J=0$。

- id: p7
  tier: thinking
  statement: |
    导线里移动的究竟是正电荷还是负电荷？

    （1）只测电流的大小和方向、导线发热的多少，能分辨吗？（2）什么样的实验能分辨？
  hints:
    - |
      $\vb J=nq\vb v_{\mathrm d}$：把$q$换成$-q$、$\vb v_{\mathrm d}$换成$-\vb v_{\mathrm d}$，电流密度变不变？焦耳热（Joule heating）$\vb J\cdot\vb E$呢？
    - |
      要找一种效应，它依赖载流子的速度本身，而不只是$q\vb v_{\mathrm d}$；运动电荷在磁场里受的力就是这样。
    - |
      霍尔效应（Hall effect）：载流子在磁场里被推向导线的同一侧，正负载流子在那一侧积累的电荷符号相反。
  reference: |
    （1）不能。正电荷沿$\vb J$的方向漂移，和数目相同的负电荷逆着$\vb J$的方向漂移，给出同样的$\vb J=nq\vb v_{\mathrm d}$；电场做功的功率$\vb J\cdot\vb E$也相同。电流的大小、方向和发热，都只和$q\vb v_{\mathrm d}$有关。

    （2）要找只依赖速度本身的效应。运动电荷在磁场里受力$q\vb v\times\vb B$（见[磁场与洛伦兹力](lesson:physics.electromagnetism.lorentz-force)），$q$和$\vb v$一起变号时这个力不变，所以两种载流子都被推向导线的同一侧，在那里积累的电荷却一正一负，导线两侧的电势差符号相反。这就是 1879 年霍尔（Edwin Hall）发现的霍尔效应（见[电流受到的磁力](lesson:physics.electromagnetism.magnetic-force-on-currents)），它显示金属里的载流子多半是负的。另一种办法利用惯性：1916 年托尔曼（Richard Tolman）和斯图尔特（Thomas Stewart）让高速转动的线圈突然停下，载流子凭惯性继续向前冲，形成一个短暂的电流，从它的方向和大小定出载流子带负电，荷质比和电子的相近。

- id: p8
  tier: thinking
  statement: |
    用两根各长$1\,\mathrm m$、横截面积$1\,\mathrm{mm^2}$的铜导线把电池和灯泡连起来，电流是$1\,\mathrm A$。

    （1）一个电子从电池沿导线走到灯泡大约要多久？（2）开关闭合后，灯泡几乎立刻就亮了。能量是怎样从电池送到灯泡的？
  hints:
    - |
      用例 1 的办法求漂移速度，$v_{\mathrm d}=\frac{I}{neA}$，$n\approx8.5\times10^{28}\,\mathrm{m^{-3}}$。
    - |
      漂移速度不到$0.1\,\mathrm{mm/s}$，走$1\,\mathrm m$要几个小时；灯亮靠的不是电子从电池跑到灯泡。
    - |
      开关闭合时，电场沿着整个电路几乎以光速建立起来，各处的电子同时开始漂移；能量是由导线周围空间里的电磁场送过去的。
  reference: |
    （1）$v_{\mathrm d}=\frac{I}{neA}=\frac{1}{8.5\times10^{28}\times1.602\times10^{-19}\times10^{-6}}\,\mathrm{m/s}\approx7.3\times10^{-5}\,\mathrm{m/s}$，走$1\,\mathrm m$要约$1.4\times10^4\,\mathrm s$，将近四个小时。

    （2）开关闭合时，电路里的电场不是由电子一个推一个地传过去的：开关处的变化以电磁波的形式沿着导线传播，速度接近光速，几乎同时在整个电路里建立起电场，灯丝里的电子和导线里的电子同时开始漂移，灯丝立刻发热。灯丝里的电子本来就在那里，电池并不需要把「自己的」电子送到灯泡。

    能量也不是电子的动能带过去的：漂移速度这么小，电子的动能微不足道。电池两极附近的电荷和导线表面的电荷产生电场，电流产生磁场，能量由导线周围空间里的电磁场从电池流向灯泡（见[坡印亭定理](lesson:physics.electromagnetism.poynting-theorem)）。用交流电时，电子只是在原地来回晃动，能量照样送到，这一点更明显。
