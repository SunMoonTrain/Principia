- id: p1
  tier: easy
  statement: |
    氢原子里，电子和质子之间既有库仑力，又有万有引力（gravitation，见[万有引力定律](lesson:physics.newtonian-mechanics.gravitation)）。按 CODATA 2022 的值，取$e=1.602176634\times10^{-19}\,\mathrm C$，$\varepsilon_0=8.8541878188\times10^{-12}\,\mathrm{C^2/(N\,m^2)}$，电子质量$m_e=9.1093837139\times10^{-31}\,\mathrm{kg}$，质子质量$m_p=1.67262192595\times10^{-27}\,\mathrm{kg}$，引力常量$G=6.67430\times10^{-11}\,\mathrm{N\,m^2/kg^2}$。求库仑力和万有引力大小之比。
  answer:
    type: number
    value: (1.602176634e-19)^2/(4*pi*8.8541878188e-12*6.67430e-11*9.1093837139e-31*1.67262192595e-27)
  hints:
    - |
      两个力都和距离的平方成反比，比值里距离约掉了。
    - |
      比值是$\frac{e^2}{4\pi\varepsilon_0Gm_em_p}$。
    - |
      代入数值，比值约为$2.27\times10^{39}$。
  solution: |
    库仑力是$\frac{1}{4\pi\varepsilon_0}\frac{e^2}{r^2}$，万有引力是$\frac{Gm_em_p}{r^2}$，比值$\frac{e^2}{4\pi\varepsilon_0Gm_em_p}\approx2.27\times10^{39}$，和两者的距离无关。原子、分子靠电力结合在一起，其中的引力完全可以忽略。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        真空中两个静止的点电荷，距离加倍、两者的电荷也都加倍时，它们之间的力大小不变
      - |
        一个带电体的电荷可以是$2.4\times10^{-19}\,\mathrm C$
      - |
        原来都不带电的橡胶棒和毛皮互相摩擦，摩擦时不和别的物体交换电荷；橡胶棒带了负电，那么毛皮带等量的正电
      - |
        真空中两个静止的点电荷，距离减小到原来的一半时，它们之间的力变成原来的 2 倍
      - |
        真空中两个静止的点电荷，把其中一个换成等量的异号电荷，它们之间的力大小不变、方向反过来
    value: [1, 3, 5]
  hints:
    - |
      力和两个电荷之积成正比，和距离的平方成反比；电荷都是元电荷$e$的整数倍。
    - |
      $2.4\times10^{-19}$除以$e$不是整数；摩擦前后，两者电荷的代数和不变。
    - |
      A、C、E 对；B、D 错。
  solution: |
    A 对：$\frac{(2q_1)(2q_2)}{(2r)^2}=\frac{q_1q_2}{r^2}$。B 错：$\frac{2.4\times10^{-19}}{1.602\times10^{-19}}\approx1.5$，不是整数。C 对：由电荷守恒，两者的电荷加起来仍是零。

    D 错：距离减半，力变成原来的 4 倍。E 对：$q_1q_2$变号、大小不变，斥力和引力互换，大小不变。

- id: p3
  tier: medium
  statement: |
    边长$a=0.10\,\mathrm m$的等边三角形，两个顶点上各有$+2.0\,\mu\mathrm C$的点电荷，第三个顶点上有$-1.0\,\mu\mathrm C$的点电荷。求第三个顶点上的电荷受的合力的大小，取$\frac{1}{4\pi\varepsilon_0}=8.988\times10^9\,\mathrm{N\,m^2/C^2}$。
  answer:
    type: number
    value: sqrt(3)*8.988e9*2.0e-6*1.0e-6/0.10^2
    unit: |
      $\mathrm N$
  hints:
    - |
      两个力都是引力，大小相同，分别指向另外两个顶点。
    - |
      两个力的夹角是$60^\circ$，合力沿这个角的平分线，大小是$2F_0\cos30^\circ$。
    - |
      $F_0=8.988\times10^9\times\frac{2.0\times10^{-6}\times1.0\times10^{-6}}{0.10^2}\,\mathrm N\approx1.80\,\mathrm N$，合力$\sqrt3F_0\approx3.11\,\mathrm N$。
  solution: |
    两个$+2.0\,\mu\mathrm C$对$-1.0\,\mu\mathrm C$都是引力，大小都是$F_0=8.988\times10^9\times\frac{2.0\times10^{-6}\times1.0\times10^{-6}}{0.10^2}\,\mathrm N\approx1.80\,\mathrm N$，分别指向另外两个顶点，夹角$60^\circ$。两个力关于角平分线对称，垂直于平分线的分量抵消，合力沿平分线指向对边的中点，大小$2F_0\cos30^\circ=\sqrt3F_0\approx3.11\,\mathrm N$。

- id: p4
  tier: medium
  statement: |
    两个相同的小球，质量都是$2.0\,\mathrm g$，用长$0.50\,\mathrm m$的绝缘细线挂在同一点。让它们带上等量的同号电荷，两球静止时相距$0.10\,\mathrm m$。求每个小球带的电荷的大小，取$g=9.8\,\mathrm{m/s^2}$，$\frac{1}{4\pi\varepsilon_0}=8.988\times10^9\,\mathrm{N\,m^2/C^2}$。
  answer:
    type: number
    value: 0.10*sqrt(2.0e-3*9.8*tan(asin(0.05/0.50))/8.988e9)
    unit: |
      $\mathrm C$
  hints:
    - |
      每个小球受重力、线的拉力和库仑力，三个力平衡（见[常见的力](lesson:physics.newtonian-mechanics.common-forces)）。
    - |
      线和竖直方向的夹角$\theta$满足$\sin\theta=\frac{0.05}{0.50}$；水平方向上，库仑力和拉力的水平分量平衡，得$F=mg\tan\theta$。
    - |
      $F=2.0\times10^{-3}\times9.8\times\tan\theta\,\mathrm N\approx1.97\times10^{-3}\,\mathrm N$，$q=r\sqrt{4\pi\varepsilon_0F}\approx4.68\times10^{-8}\,\mathrm C$。
  solution: |
    每根线和竖直方向的夹角$\theta$满足$\sin\theta=\frac{0.05}{0.50}=0.10$。竖直方向上拉力的分量平衡重力，水平方向上拉力的分量平衡库仑力，所以$F=mg\tan\theta\approx2.0\times10^{-3}\times9.8\times0.1005\,\mathrm N\approx1.97\times10^{-3}\,\mathrm N$。再由$F=\frac{1}{4\pi\varepsilon_0}\frac{q^2}{r^2}$，$q=r\sqrt{\frac{F}{8.988\times10^9}}\approx4.68\times10^{-8}\,\mathrm C$。

- id: p5
  tier: hard
  statement: |
    三个点电荷$q_1$、$q_2$、$q_3$依次放在一条直线上，$q_1$和$q_2$相距$a$，$q_2$和$q_3$相距$b$，它们只受彼此的库仑力。

    （1）要三个电荷都受力平衡，电荷之比$q_1:q_2:q_3$应是多少？$a=b$时呢？（2）为什么只要写两个电荷的平衡条件？（3）这样的平衡稳定吗？
  hints:
    - |
      中间的电荷要平衡，两边的电荷对它的力必须反向；两端的电荷要平衡，中间那个必须和它们异号。
    - |
      $q_2$平衡给出$\frac{q_1}{a^2}=\frac{q_3}{b^2}$；$q_1$平衡给出$\frac{|q_2|}{a^2}=\frac{q_3}{(a+b)^2}$（以$q_1>0$为例）。
    - |
      $q_1:q_2:q_3=1:-\frac{b^2}{(a+b)^2}:\frac{b^2}{a^2}$，$a=b$时是$1:-\frac14:1$。三个电荷之间的力两两等大反向，合起来为零，第三个条件自动满足。把一端的电荷向外挪一点，拉它回来的力比推它出去的力减小得快，平衡不稳定。
  reference: |
    （1）设$q_1>0$在左端，向右为正。$q_2$平衡：$q_1$、$q_3$对它的力反向等大，$\frac{q_1q_2}{a^2}=\frac{q_3q_2}{b^2}$，得$q_3=q_1\frac{b^2}{a^2}$，与$q_1$同号。$q_3$对$q_1$是斥力，指向左；$q_1$要平衡，$q_2$必须把它往右拉，所以$q_2<0$，且$\frac{|q_2|}{a^2}=\frac{q_3}{(a+b)^2}$。于是$q_2=-q_1\frac{b^2}{(a+b)^2}$，$q_1:q_2:q_3=1:-\frac{b^2}{(a+b)^2}:\frac{b^2}{a^2}$；$a=b$时是$1:-\frac14:1$。

    （2）由牛顿第三定律，三对力两两等大反向，三个电荷受的合力之和恒为零。前两个电荷受的合力为零，第三个受的合力也就是零。

    （3）不稳定。取$a=b$，$q_1=q_3=q$，$q_2=-\frac q4$，把$q_1$向左挪一小段$\delta$。$q_2$拉它向右的力$\frac{1}{4\pi\varepsilon_0}\frac{q^2/4}{(a+\delta)^2}$和$q_3$推它向左的力$\frac{1}{4\pi\varepsilon_0}\frac{q^2}{(2a+\delta)^2}$在$\delta=0$时相等，对$\delta$的导数分别是$-\frac{1}{4\pi\varepsilon_0}\frac{q^2}{2a^3}$和$-\frac{1}{4\pi\varepsilon_0}\frac{q^2}{4a^3}$。往右的拉力减小得快，合力指向左，$q_1$越挪越远。

- id: p6
  tier: hard
  statement: |
    电荷均匀分布在一个球面上，每块面积上的电荷和面积成正比。和球面同号的点电荷$q$在球面里面任意一点$P$。

    （1）过$P$作一个顶角很小的对顶圆锥，它在球面上截出两小块。证明这两小块对$q$的力大小相等、方向相反。（2）由此说明整个球面对$q$的合力为零。

    （3）如果电力和距离的$2+\delta$次方成反比（$\delta\ne0$），合力还为零吗？$\delta>0$时$q$会被推向哪里？
  hints:
    - |
      圆锥的轴和球面交于$A$、$B$；$OA=OB$（$O$是球心），所以弦$AB$和两端半径的夹角相等。顶角很小的圆锥在距顶点$r$处截出的面积和$r^2$成正比。
    - |
      两小块和圆锥的轴夹同样的角，面积之比、电荷之比都是$PA^2:PB^2$；力的大小之比是$1:1$，方向沿$AB$相反。所有这样的对顶圆锥恰好把球面分完。
    - |
      力和距离的$2+\delta$次方成反比时，一对小块的力之比是$PA^{-\delta}:PB^{-\delta}$。$\delta>0$时近的一块推得重，$q$被推离较近的球面，合力指向球心。
  reference: |
    （1）设圆锥的轴和球面交于$A$、$B$，$PA=r_1$，$PB=r_2$。三角形$OAB$中$OA=OB$，所以弦$AB$和两端半径的夹角相等，记作$\alpha$；半径就是球面的法线方向。顶角很小的圆锥在距顶点$r$处，垂直于轴截出的面积和$r^2$成正比；斜着截时再除以$\cos\alpha$，两端的$\alpha$相同，所以两小块的面积之比、电荷之比都是$r_1^2:r_2^2$。

    两块对$q$的力和电荷成正比、和距离的平方成反比，大小之比是$\frac{r_1^2}{r_1^2}:\frac{r_2^2}{r_2^2}=1:1$。同号相斥，两块都把$q$往离开自己的方向推，方向沿$AB$相反，所以抵消。

    （2）过$P$的所有对顶小圆锥把整个球面不重不漏地分成一对一对的小块，每一对的力都抵消，合力为零。

    （3）力和$r^{2+\delta}$成反比时，一对小块的力之比是$r_1^{-\delta}:r_2^{-\delta}$，$r_1\ne r_2$时不相等。$\delta>0$时近的一块推得更重，$q$被推离较近的那一侧球面，各对的合力加起来指向球心；$\delta<0$时指向较近的球面。所以球面里面有没有电力，正好检验平方反比；万有引力的同样结论见[球壳定理](lesson:physics.newtonian-mechanics.shell-theorem)。

- id: p7
  tier: thinking
  statement: |
    库仑力比万有引力强得多（见 p1）。

    （1）为什么桌上两本书之间觉察不到库仑力，天体的运动却由万有引力决定？（2）设地球和月球各有比例为$f$的质子没有被电子抵消，两者的质量约一半来自质子。估算$f$多大时，两者之间的库仑斥力就和万有引力一样大。
  hints:
    - |
      正负电荷的作用会互相抵消，质量却只有正的。
    - |
      宏观物体里正负电荷几乎一样多，剩下的净电荷极少；引力没有抵消，随质量一直累加。
    - |
      质子数约为$N=\frac{M}{2m_p}$。令$\frac{1}{4\pi\varepsilon_0}(fN_1e)(fN_2e)=GM_1M_2$，得$f=\frac{2m_p\sqrt{4\pi\varepsilon_0G}}{e}\approx1.8\times10^{-18}$，和质量、距离都无关。
  reference: |
    （1）电荷有正有负，同一块物体里的正负电荷几乎一样多，它对别处的电力大部分抵消；质量只有正的，引力没有抵消，物体越大、引力越大。两本书都几乎是电中性的，它们之间的电力比引力还小得多；天体同样近乎中性，剩下的只有引力。

    （2）质子数约为$N=\frac{M}{2m_p}$，净电荷$fNe$。令$\frac{1}{4\pi\varepsilon_0}\frac{(fN_1e)(fN_2e)}{r^2}=\frac{GM_1M_2}{r^2}$，$M_1$、$M_2$、$r$都约掉，得$f=\frac{2m_p\sqrt{4\pi\varepsilon_0G}}{e}\approx1.8\times10^{-18}$。也就是说，一百亿亿个质子里多出不到两个，电力就能和引力抗衡；天文尺度上引力占上风，是因为天体中性得极其严格。

- id: p8
  tier: thinking
  statement: |
    库仑定律说的是真空中两个静止的点电荷。

    （1）一个电荷在运动时，另一个电荷受的力还能用它算吗？（2）两个带电的金属球靠得很近时，为什么不能把球心距离代进库仑定律？（3）怎样在实验上检验距离的指数恰好是$2$？
  hints:
    - |
      运动的电荷之间还有磁力；速度接近光速时，电荷周围的电场（electric field）本身也不再是静止时的样子。
    - |
      金属里的电荷能移动，两球靠近时，电荷在球面上不再均匀分布。
    - |
      库仑用扭秤测力和距离；卡文迪什看一个带电的导体（conductor）球壳里面的小球带不带电，这比直接测力灵敏得多。
  reference: |
    （1）速度远小于光速时，库仑定律是很好的近似；运动的电荷之间还有磁力（见[磁场与洛伦兹力](lesson:physics.electromagnetism.lorentz-force)），它和电力之比大约是$\frac{v^2}{c^2}$的量级。速度接近光速时，匀速运动的电荷的电场向垂直于运动的方向聚拢，不再是库仑场（见狭义相对论的[电磁场张量](lesson:physics.special-relativity.field-tensor)例 1）。

    （2）金属里的电荷能移动。两个带同号电荷的金属球靠近时，电荷被推到两球相背的一侧，等效的距离比球心距离大，力比按球心距离算的小；异号时电荷被吸到相对的一侧，力比按球心距离算的大。只有两球离得足够远、电荷均匀分布时，才能按球心之间的点电荷算。

    （3）直接测力的办法，精度受扭秤的读数限制。卡文迪什的办法是：让一个带电的导体球壳和里面的小球连通再断开，看小球带不带电；平方反比严格成立时，电荷全在外壳上，小球不带电（道理见 p6 和[导体与静电平衡](lesson:physics.electromagnetism.conductors)）。他据此估计指数和$2$相差不到$\frac{1}{50}$，1877 年麦卡利斯特用麦克斯韦设计的装置把界缩小到$\frac{1}{21600}$。
