<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" font-size="14">
  <!-- 光锥示意：上方椭圆是未来光锥的锥口，下方是过去光锥；锥面母线和 ct 轴成 45°。
       三个箭头从 O 出发：锥内的是类时矢量，沿母线的是类光矢量，锥外的是类空矢量。 -->
  <g style="stroke: var(--muted, #6b7280)" stroke-width="1.2" fill="none">
    <line x1="280" y1="344" x2="280" y2="36" />
    <line x1="90" y1="190" x2="480" y2="190" />
    <line x1="210" y1="224" x2="350" y2="156" />
  </g>
  <path d="M 280.0 36.0 L 283.3 43.3 L 276.7 43.3 z" style="fill: var(--muted, #6b7280)" />
  <path d="M 480.0 190.0 L 472.7 193.3 L 472.7 186.7 z" style="fill: var(--muted, #6b7280)" />
  <path d="M 350.0 156.0 L 344.9 162.1 L 342.0 156.3 z" style="fill: var(--muted, #6b7280)" />
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="160" y1="70" x2="400" y2="310" />
    <line x1="400" y1="70" x2="160" y2="310" />
    <ellipse cx="280" cy="70" rx="120" ry="26" />
    <ellipse cx="280" cy="310" rx="120" ry="26" stroke-dasharray="5 4" />
  </g>
  <line x1="280" y1="190" x2="258.0" y2="102.0" stroke-width="2.4" style="stroke: var(--accent, #2563eb)" />
  <path d="M 258.0 102.0 L 264.8 110.7 L 256.1 112.8 z" style="fill: var(--accent, #2563eb)" />
  <line x1="280" y1="190" x2="333.7" y2="113.0" stroke-width="2.4" style="stroke: var(--accent, #2563eb)" />
  <path d="M 333.7 113.0 L 331.6 123.8 L 324.3 118.7 z" style="fill: var(--accent, #2563eb)" />
  <line x1="280" y1="190" x2="450.0" y2="144.0" stroke-width="2.4" style="stroke: var(--accent, #2563eb)" />
  <path d="M 450.0 144.0 L 441.5 151.0 L 439.1 142.3 z" style="fill: var(--accent, #2563eb)" />
  <circle cx="280" cy="190" r="3" fill="currentColor" />
  <text x="268.0" y="216.0" fill="currentColor">O</text>
  <text x="290.0" y="32.0" fill="currentColor"><tspan font-style="italic">ct</tspan></text>
  <text x="488.0" y="208.0" fill="currentColor"><tspan font-style="italic">x</tspan></text>
  <text x="356.0" y="150.0" fill="currentColor"><tspan font-style="italic">y</tspan></text>
  <text x="222.0" y="114.0" fill="currentColor">类时</text>
  <text x="372.0" y="120.0" fill="currentColor">类光</text>
  <text x="446.0" y="132.0" fill="currentColor">类空</text>
  <text x="68.0" y="75.0" fill="currentColor">未来光锥</text>
  <text x="68.0" y="315.0" fill="currentColor">过去光锥</text>
</svg>
