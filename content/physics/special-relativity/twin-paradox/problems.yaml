- id: p1
  tier: easy
  statement: |
    乙以$0.6c$飞往地球参考系里$3$光年外的恒星，到达后立即以同样的速率返回，掉头的时间不计；甲一直留在地球上。重逢时乙的钟走了多少年？
  answer:
    type: number
    value: 8
    unit: |
      年
  hints:
    - |
      先在地球参考系里算整个旅程用了多少年。
    - |
      往返共$\frac{2\times3}{0.6}=10$年；乙每一段都以$0.6c$匀速运动，$\gamma=1.25$。
    - |
      乙的钟走了$10\times\sqrt{1-0.36}=8$年。
  solution: |
    地球参考系里往返用$\frac{6\,\text{光年}}{0.6c}=10$年，甲的钟走$10$年。乙两段都以$0.6c$运动，钟走了$10\times0.8=8$年，重逢时乙比甲年轻$2$岁。

- id: p2
  tier: easy
  statement: |
    关于双生子佯谬和车库佯谬，下面哪些说法是对的？
  answer:
    type: choice
    multiple: true
    options:
      - |
        重逢时甲比乙老，这个结论在任何惯性系里算都一样
      - |
        在去程的惯性系里，乙认为甲的钟走得慢
      - |
        乙比甲年轻，是因为乙掉头时加速度让钟走慢了
      - |
        车库系里两扇门同时关上，在梯子系里也同时关上
      - |
        两个事件之间，一直匀速直线运动的钟比沿其他世界线运动的钟走过的时间长
    value: [1, 2, 5]
  hints:
    - |
      重逢时两只钟并排比较，比的是两个和惯性系无关的固有时。
    - |
      掉头的时间可以短到忽略；同时是相对的。
    - |
      A、B、E 对；C、D 错。
  solution: |
    A 对：两只钟走过的都是固有时，任何惯性系算出来都一样。B 对：去程乙静止在一个惯性系里，在这个惯性系里甲的钟确实慢。C 错，掉头的时间可以任意短，年龄差来自两条世界线的形状；D 错，这正是车库佯谬的关键。E 对，这是「直线的固有时最长」。

- id: p3
  tier: medium
  statement: |
    乙以$0.6c$飞往地球参考系里$3$光年外的恒星，到达后立即以同样的速率返回。在乙掉头前一瞬，按乙所在惯性系的同时线，地球上的「此刻」是地球时间第几年？掉头后一瞬又是第几年？答案填两者之差（年）。
  answer:
    type: number
    value: 3.6
    unit: |
      年
  hints:
    - |
      掉头事件在地球参考系里是$t=5$年、$x=3$光年。去程惯性系的同时线在时空图上斜率是$\beta=0.6$，回程的是$-0.6$。
    - |
      过掉头事件的同时线是$ct-5=\pm0.6(x-3)$（以年和光年为单位），令$x=0$。
    - |
      掉头前是$5-1.8=3.2$年，掉头后是$5+1.8=6.8$年，相差$3.6$年。
  solution: |
    以年和光年为单位，$c=1$。掉头事件 T 是$(t,x)=(5,3)$。去程惯性系的同时线过 T、斜率$0.6$：$t=5+0.6(x-3)$，在$x=0$处$t=3.2$年；回程惯性系的斜率是$-0.6$，在$x=0$处$t=6.8$年。乙心里的地球「此刻」跳了$3.6$年；去程、回程各$4$年的乙时间里，乙按时间延缓算出甲的钟各走$4\times0.8=3.2$年，$3.2+3.6+3.2=10$年，正是甲的钟走过的时间。

- id: p4
  tier: medium
  statement: |
    梯子的固有长度是$6\,\mathrm m$，车库的固有长度是$5\,\mathrm m$。梯子至少要以多大的速率冲进车库，车库系里两扇门才能同时关上、把它整个关在里面？
  answer:
    type: number
    value: sqrt(11)/6
    unit: |
      $c$
  hints:
    - |
      车库系里梯子沿运动方向缩短为$\frac{6\,\mathrm m}{\gamma}$，要求它不超过$5\,\mathrm m$。
    - |
      $\gamma\ge\frac65$，即$1-\beta^2\le\frac{25}{36}$。
    - |
      $\beta\ge\sqrt{\frac{11}{36}}=\frac{\sqrt{11}}{6}\approx0.553$。
  solution: |
    车库系里梯子长$\frac{6\,\mathrm m}{\gamma}\le5\,\mathrm m$，即$\gamma\ge1.2$，$\beta^2\ge1-\frac{1}{1.44}=\frac{11}{36}$，所以速率至少是$\frac{\sqrt{11}}6c\approx0.553c$。这时在梯子系里车库只有$5\,\mathrm m\times\frac56\approx4.17\,\mathrm m$，两扇门并不同时关上。

- id: p5
  tier: hard
  statement: |
    乙以速率$v$飞往地球参考系里距离为$L$的恒星，到达后立即以同样的速率返回。在乙去程所在的惯性系$S'$里，分别算出甲、乙从出发到重逢走过的固有时，并证明它们和地球参考系里算的一样：甲是$\frac{2L}{v}$，乙是$\frac{2L}{\gamma v}$。
  hints:
    - |
      用洛伦兹变换求掉头事件 T 和重逢事件 R 在$S'$里的坐标；出发事件 O 是原点。
    - |
      T 是$\bigl(\frac{L}{\gamma v},0\bigr)$，R 是$\bigl(\frac{2\gamma L}{v},-2\gamma L\bigr)$（先写时间、后写位置）。
    - |
      乙回程那一段$\Delta t'=\frac{L}{\gamma v}(2\gamma^2-1)$、$\Delta x'=-2\gamma L$；用$(2\gamma^2-1)^2-4\gamma^4\beta^2=1$。
  reference: |
    地球参考系$S$里，T 是$\bigl(\frac Lv,L\bigr)$，R 是$\bigl(\frac{2L}v,0\bigr)$。变换到$S'$：T 的$t'=\gamma\bigl(\frac Lv-\frac{vL}{c^2}\bigr)=\frac{\gamma L}{v}(1-\beta^2)=\frac{L}{\gamma v}$，$x'=\gamma\bigl(L-v\frac Lv\bigr)=0$；R 的$t'=\frac{2\gamma L}{v}$，$x'=-2\gamma L$。

    甲在$S'$里以$v$运动（沿$x'$轴负方向），从 O 到 R 用了$\frac{2\gamma L}{v}$，固有时$\frac{2\gamma L}{v}\cdot\frac1\gamma=\frac{2L}{v}$。乙从 O 到 T 静止，固有时$\frac{L}{\gamma v}$；从 T 到 R，$\Delta t'=\frac{2\gamma L}{v}-\frac{L}{\gamma v}=\frac{L}{\gamma v}(2\gamma^2-1)$，$\Delta x'=-2\gamma L$。

    这一段的固有时是$\sqrt{\Delta t'^2-\Delta x'^2/c^2}=\frac{L}{\gamma v}\sqrt{(2\gamma^2-1)^2-4\gamma^4\beta^2}$。由$\gamma^2\beta^2=\gamma^2-1$，根号里是$4\gamma^4-4\gamma^2+1-4\gamma^4+4\gamma^2=1$，所以这一段也是$\frac{L}{\gamma v}$，乙共走$\frac{2L}{\gamma v}$。乙回程的速率是$\frac{2\gamma^2v}{2\gamma^2-1}=\frac{2v}{1+\beta^2}$，正是速度合成的结果；在$S'$里甲的钟去程慢，乙的钟回程慢得更多，总账和$S$里一样。

- id: p6
  tier: hard
  statement: |
    车库的后门换成一堵结实的墙，前门开着。固有长度为$L$的梯子以速度$v$冲进固有长度为$D$的车库，$\frac L\gamma<D<L$。梯子头撞墙后立即停下，「停下」的消息沿梯子以不超过光速的速度往后传，梯子各部分收到消息才停下。证明：梯子尾在停下之前已经进了前门；并在梯子系里解释，车库只有$\frac D\gamma$长，梯子为什么还能整个进去。
  hints:
    - |
      「梯子尾经过前门」和「梯子尾收到消息」都发生在梯子尾的世界线上，它们的先后和参考系无关。
    - |
      车库系里梯子长$\frac L\gamma<D$：梯子头撞墙时，梯子尾已经在车库里了。
    - |
      梯子系里，墙撞上梯子头时前门在$x'=L-\frac D\gamma>0$，以$v$向梯子尾移去；消息至少要$\frac Lc$才传到梯子尾。比较$\frac{L-D/\gamma}{v}$和$\frac Lc$。
  reference: |
    车库系：前门在$x=0$，墙在$x=D$，取梯子头撞墙时$t=0$。这时梯子长$\frac L\gamma<D$，梯子尾在$x=D-\frac L\gamma>0$，早已经过前门；之后它还要等消息传到才停，所以「经过前门」在「停下」之前。这两个事件都在梯子尾的世界线上，间隔是类时（timelike）的，先后在任何参考系里都一样。

    梯子系：梯子静止，占据$0\le x'\le L$，车库以$v$沿$x'$轴负方向运动，长$\frac D\gamma<L$。墙在$t'=0$撞上梯子头，这时前门在$x'=L-\frac D\gamma>0$，梯子尾确实还在车库外面。可梯子尾不知道梯子头已经停下，消息至少要$\frac Lc$才到；这段时间里前门继续以$v$扫向梯子尾，在$t'=\frac{L-D/\gamma}{v}$经过它。

    这个时刻不晚于$\frac Lc$，因为$L-\frac D\gamma\le\beta L$等价于$\gamma L(1-\beta)\le D$，而$\gamma(1-\beta)=\sqrt{\frac{1-\beta}{1+\beta}}<\frac1\gamma$，由$\frac L\gamma<D$就成立。所以梯子系也同意：梯子尾先进前门、后停下。代价是梯子最后整个停在长$D<L$的车库里，被压短了；相对论里没有绝对刚性的物体，梯子头撞墙的消息不可能瞬间传到梯子尾。

- id: p7
  tier: thinking
  statement: |
    让甲也乘一艘小船出发：以$0.8c$飞离地球，几乎立刻掉头飞回、停下，加速的次数和剧烈程度都和乙一样，只是甲的往返在地球时间里只用了一天，乙的往返照旧是$10$年。重逢时谁年轻？这说明决定年龄差的是什么？
  hints:
    - |
      两人经历的加速一样，如果加速度是原因，两人的年龄应该一样。
    - |
      在地球参考系里分段算两人的固有时：甲只有一天在以$0.8c$运动。
    - |
      决定固有时的是整条世界线：以多大的速度、运动了多久。
  reference: |
    在地球参考系里算：甲以$0.8c$运动了约一天，钟少走约$0.4$天，其余时间留在地球上；乙以$0.8c$运动了$10$年，钟少走$4$年。重逢时乙仍比甲年轻约$4$岁，只差那$0.4$天。

    两人的加速完全一样，年龄差却几乎不变，所以加速度不是原因。按比较两只钟的定理，每只钟走过的是沿自己世界线的固有时，取决于每一段的速度和持续的时间，也就是世界线的形状；加速只是让世界线拐弯，拐弯本身花的固有时可以任意短。

    加速的作用在于让两条世界线能再次相交：两只钟都一直做惯性运动的话，分开后就不会重逢，也就谈不上「谁真的年轻」。

- id: p8
  tier: thinking
  statement: |
    1971 年的哈费尔-基廷实验（Hafele–Keating experiment，见[时间延缓](lesson:physics.special-relativity.time-dilation)的 p8）里，地面上的钟和飞机上的钟都不做惯性运动。用沿世界线累加固有时的算法，在不随地球转动的地心参考系（Earth-centered inertial frame）里说明：只算速度的效应，向东飞的钟比地面上的钟少走，向西飞的多走；并估计量级。
  hints:
    - |
      地心参考系里，地面的钟随地球自转以$V$向东运动（中纬度$V$约$350$到$400\,\mathrm{m/s}$），飞机相对地面的速率是$u$。
    - |
      低速时一段时间$T$里钟少走$\frac{u^2}{2c^2}T$。向东飞的飞机在地心参考系里的速率约$V+u$，向西飞的约$V-u$。
    - |
      飞机的钟比地面的钟多走$-\frac{(V\pm u)^2-V^2}{2c^2}T=-\frac{\pm2Vu+u^2}{2c^2}T$，上面的正号对应向东。
  reference: |
    在近似为惯性系的地心参考系里，两只钟各自的固有时是$\int\sqrt{1-\frac{w^2}{c^2}}\,\dd t\approx\int\bigl(1-\frac{w^2}{2c^2}\bigr)\dd t$，$w$是钟在这个参考系里的速率。地面的钟$w=V$，向东飞的飞机$w\approx V+u$，向西飞的$w\approx V-u$。

    飞机的钟减地面的钟，约为$-\frac{(V\pm u)^2-V^2}{2c^2}T=-\frac{\pm2Vu+u^2}{2c^2}T$。向东：$-(2Vu+u^2)$，一定是负的，飞机的钟少走；向西：$2Vu-u^2$，只要$u<2V$就是正的，飞机的钟多走。取$V\approx400\,\mathrm{m/s}$、$u\approx250\,\mathrm{m/s}$、$T\approx40$小时，向东约$-210\,\mathrm{ns}$，向西约$+110\,\mathrm{ns}$，是一两百纳秒的量级。

    实验前按实际航线算的预言，只算速度的效应是向东$-184\,\mathrm{ns}$、向西$+96\,\mathrm{ns}$；再加上高空引力较弱使钟走快的效应（向东$+144\,\mathrm{ns}$、向西$+179\,\mathrm{ns}$），总预言是$-40\,\mathrm{ns}$和$+275\,\mathrm{ns}$，实测是$-59\,\mathrm{ns}$和$+273\,\mathrm{ns}$。这和双生子佯谬是同一个道理：在一个惯性系里沿每只钟的世界线累加固有时，谁的速度大、谁就少走，地面的钟并没有特殊地位。
