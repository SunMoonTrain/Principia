<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-size="14">
  <!-- 站台参考系里看车厢中点的闪光。车厢在站台系里长 260 像素，速度 v = 0.4c 向右。
       三行自上而下是 t = 0、光到达车尾（t = 92.9）、光到达车头（t = 216.7），时间单位是光走 1 像素的时间。竖直虚线是闪光发生的位置。 -->
  <line x1="250.0" y1="30" x2="250.0" y2="308" stroke-width="1" stroke-dasharray="4 4" style="stroke: var(--muted, #6b7280)" />
  <line x1="20" y1="92.0" x2="580" y2="92.0" stroke="currentColor" stroke-width="1" />
  <rect x="120.0" y="56.0" width="260.0" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="1.6" />
  <rect x="116.0" y="67.0" width="8" height="12" stroke="currentColor" stroke-width="1" style="fill: var(--bg, #ffffff)" />
  <rect x="376.0" y="67.0" width="8" height="12" stroke="currentColor" stroke-width="1" style="fill: var(--bg, #ffffff)" />
  <circle cx="250.0" cy="73.0" r="6" style="fill: var(--accent, #2563eb)" />
  <line x1="394.0" y1="73.0" x2="420.0" y2="73.0" stroke="currentColor" stroke-width="1.4" />
  <path d="M 424.0 73.0 l -8 -4 l 0 8 z" fill="currentColor" />
  <text x="428.0" y="78.0" font-style="italic" fill="currentColor">v</text>
  <text x="20" y="46.0" fill="currentColor">t = 0：车厢中点闪光</text>
  <line x1="20" y1="197.0" x2="580" y2="197.0" stroke="currentColor" stroke-width="1" />
  <rect x="157.1" y="161.0" width="260.0" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="1.6" />
  <rect x="153.1" y="172.0" width="8" height="12" stroke="currentColor" stroke-width="1" style="fill: var(--bg, #ffffff)" />
  <rect x="413.1" y="172.0" width="8" height="12" stroke="currentColor" stroke-width="1" style="fill: var(--bg, #ffffff)" />
  <circle cx="157.1" cy="178.0" r="5" style="fill: var(--accent, #2563eb)" />
  <circle cx="342.9" cy="178.0" r="5" style="fill: var(--accent, #2563eb)" />
  <line x1="157.1" y1="178.0" x2="342.9" y2="178.0" stroke-width="1.5" style="stroke: var(--accent, #2563eb)" />
  <line x1="431.1" y1="178.0" x2="457.1" y2="178.0" stroke="currentColor" stroke-width="1.4" />
  <path d="M 461.1 178.0 l -8 -4 l 0 8 z" fill="currentColor" />
  <text x="465.1" y="183.0" font-style="italic" fill="currentColor">v</text>
  <text x="20" y="151.0" fill="currentColor">光先到达车尾</text>
  <line x1="20" y1="302.0" x2="580" y2="302.0" stroke="currentColor" stroke-width="1" />
  <rect x="206.7" y="266.0" width="260.0" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="1.6" />
  <rect x="202.7" y="277.0" width="8" height="12" stroke="currentColor" stroke-width="1" style="fill: var(--bg, #ffffff)" />
  <rect x="462.7" y="277.0" width="8" height="12" stroke="currentColor" stroke-width="1" style="fill: var(--bg, #ffffff)" />
  <circle cx="466.7" cy="283.0" r="5" style="fill: var(--accent, #2563eb)" />
  <line x1="250.0" y1="283.0" x2="466.7" y2="283.0" stroke-width="1.5" style="stroke: var(--accent, #2563eb)" />
  <line x1="480.7" y1="283.0" x2="506.7" y2="283.0" stroke="currentColor" stroke-width="1.4" />
  <path d="M 510.7 283.0 l -8 -4 l 0 8 z" fill="currentColor" />
  <text x="514.7" y="288.0" font-style="italic" fill="currentColor">v</text>
  <text x="20" y="256.0" fill="currentColor">光后到达车头</text>
</svg>
