- id: p1
  tier: easy
  statement: |
    一节车厢以$v=0.6c$沿站台行驶，在站台参考系里量得它长$240\,\mathrm{m}$。车厢中点闪光，取闪光时站台系的$t=0$。在站台参考系里，光什么时候到达车尾？取$c=3\times10^8\,\mathrm{m/s}$。
  answer:
    type: number
    value: 0.25
    unit: |
      $\mu\mathrm s$
  hints:
    - |
      在站台系里光向后的速率仍是$c$，车尾以$v$迎着光运动。
    - |
      闪光处取$x=0$，车尾在$x=-120\,\mathrm m+vt$，向后的光在$x=-ct$，令两者相等。
    - |
      $t=\frac{120\,\mathrm m}{c+v}=\frac{120}{1.6\times3\times10^8}\,\mathrm s=2.5\times10^{-7}\,\mathrm s=0.25\,\mu\mathrm s$。
  solution: |
    车尾在$x=-120\,\mathrm m+vt$，向后的光在$x=-ct$，相遇时$t=\frac{120\,\mathrm m}{c+v}=\frac{120}{4.8\times10^8}\,\mathrm s=0.25\,\mu\mathrm s$。向前的光要追跑开的车头，到得更晚，所以在站台系里两端不是同时收到光。

- id: p2
  tier: easy
  statement: |
    $S'$相对$S$沿$x$轴运动。下面哪些说法是对的？
  answer:
    type: choice
    multiple: true
    options:
      - |
        在$S$里同一地点、同一时刻发生的两个事件，在$S'$里也同时发生
      - |
        两个事件离得足够近时，在$S$里同时，在$S'$里也一定同时
      - |
        在$S$里同时、沿$x$轴分开的两个事件，在$S'$里也同时
      - |
        用光对钟时，默认了在这个惯性系里光从 A 到 B 和从 B 到 A 用的时间相同
      - |
        在$S$里同步的两只钟（沿$x$轴分开），在$S'$里看也是同步的
    value: [1, 4]
  hints:
    - |
      同一地点、同一时刻发生的两个事件，其实是同一个时空点上的事，任何参考系都一样。
    - |
      同时的相对性只要求两个事件沿运动方向分开，不论分开多远。
    - |
      A、D 对。B、C 错：沿$x$轴分开的同时事件在$S'$里不同时；E 错，在$S'$里看，这两只钟不同步。
  solution: |
    A 对：两个事件重合，在任何惯性系里都重合。B 错：沿运动方向分开多远都不同时，只是相差的时间随距离变小。C、E 错，这正是同时的相对性。D 对：光去程、回程速率都是$c$、距离相等，所以用时相同，这是同步定义的依据。

- id: p3
  tier: medium
  statement: |
    车厢里的乘客用光对钟：从车尾向车头发光，在车头反射回车尾。车厢相对站台以$v=0.5c$运动。在站台参考系里，光从车尾到车头所用的时间是从车头回到车尾所用时间的几倍？
  answer:
    type: number
    value: 3
  hints:
    - |
      在站台系里光速仍是$c$，设车厢在站台系里长$\ell$。
    - |
      去程光追跑开的车头：$ct_1=\ell+vt_1$；回程光迎着走来的车尾：$ct_2=\ell-vt_2$。
    - |
      $t_1=\frac{\ell}{c-v}$，$t_2=\frac{\ell}{c+v}$，比值$\frac{c+v}{c-v}=3$。
  solution: |
    在站台系里，去程$t_1=\frac{\ell}{c-v}$，回程$t_2=\frac{\ell}{c+v}$，比值$\frac{c+v}{c-v}=\frac{1.5}{0.5}=3$。乘客却按「去程、回程用时相同」把车头的钟拨到中间时刻，所以在站台系看来，车厢里同步好的两只钟不同步：车头的钟落后（读数比车尾的小）。

- id: p4
  tier: medium
  statement: |
    站台上相距$600\,\mathrm m$的 A、B 两点（B 在前方）同时被闪电击中（站台系里同时）。闪电发生时，以$v=0.6c$向 B 方向运动的列车上，一位乘客正好经过 AB 的中点。在站台参考系里，乘客先后收到两道闪电的光，相隔多长时间？取$c=3\times10^8\,\mathrm{m/s}$。
  answer:
    type: number
    value: 1.875
    unit: |
      $\mu\mathrm s$
  hints:
    - |
      在站台系里两束光的速率都是$c$，乘客迎着 B 的光、背着 A 的光运动。
    - |
      取中点为原点：$ct_B=300\,\mathrm m-vt_B$，$ct_A=300\,\mathrm m+vt_A$。
    - |
      $t_B=\frac{300}{1.6c}$，$t_A=\frac{300}{0.4c}$，相差$\frac{562.5\,\mathrm m}{c}=1.875\,\mu\mathrm s$。
  solution: |
    $t_B=\frac{300\,\mathrm m}{c+v}=\frac{187.5\,\mathrm m}{c}$，$t_A=\frac{300\,\mathrm m}{c-v}=\frac{750\,\mathrm m}{c}$，相差$\frac{562.5\,\mathrm m}{c}=1.875\times10^{-6}\,\mathrm s$。乘客在车厢里两个焦痕的中点，先收到 B 的光，所以在列车参考系里 B 处的闪电先发生。

- id: p5
  tier: hard
  statement: |
    设在某个惯性系里存在一种对钟方式，用它读时间时，光沿任何方向的速率都是$c$，各处的钟走得一样快。证明：按讲解里的同步定义，A 与 B 同步当且仅当两只钟和这种对钟方式的偏差相同；由此推出同步关系是对称的（symmetric，A 与 B 同步，则 B 与 A 同步）和传递的（transitive，A 与 B、B 与 C 同步，则 A 与 C 同步）。
  hints:
    - |
      记那种对钟方式给出的时间为$\tau$，各只钟的读数是$T_i=\tau+\delta_i$，$\delta_i$是常数偏差。
    - |
      光在$\tau=\tau_0$时从 A 发出，$\tau_0+\frac dc$时到 B，$\tau_0+\frac{2d}c$时回到 A，$d$是 AB 的距离。
    - |
      同步的条件$T_B=\frac{T_A+T_A'}2$化为$\tau_0+\frac dc+\delta_B=\tau_0+\frac dc+\delta_A$，即$\delta_A=\delta_B$；「偏差相等」显然对称、传递。
  reference: |
    设那种对钟方式给出的时间是$\tau$。各只钟走得一样快，读数是$T_i=\tau+\delta_i$，$\delta_i$是这只钟的常数偏差。A、B 相距$d$，按假设光沿 AB 两个方向的速率都是$c$：光在$\tau_0$从 A 发出，在$\tau_0+\frac dc$到达 B 并反射，在$\tau_0+\frac{2d}{c}$回到 A。

    三个读数是$T_A=\tau_0+\delta_A$，$T_B=\tau_0+\frac dc+\delta_B$，$T_A'=\tau_0+\frac{2d}c+\delta_A$。同步的条件$T_B=\frac{T_A+T_A'}{2}=\tau_0+\frac dc+\delta_A$，等价于$\delta_B=\delta_A$。

    所以「A 与 B 同步」就是「$\delta_A=\delta_B$」。等式是对称的、传递的，同步关系也就是对称的、传递的，和用哪只钟发光、三只钟是否共线都无关。这里光速和方向无关的假设必不可少：如果去程、回程速率不同，按定义对出来的钟会和$\tau$差一个随方向变化的量，传递性就可能失败。

- id: p6
  tier: hard
  statement: |
    车厢里，车头和车尾各有一只钟，用车厢中点的一次闪光对准：光到达时，两只钟都从$0$开始走。证明：在站台参考系里看，这两只钟走起来以后，同一时刻车尾的钟总比车头的钟读数大；也就是说，站台系认为车厢里同步好的钟，沿运动方向在前面的那只落后（读数小）。
  hints:
    - |
      在站台系里，光先到达车尾、后到达车头，相差$\Delta t=\frac{\ell v}{c^2-v^2}$，$\ell$是站台系里量的车厢长度。
    - |
      两只钟构造相同、运动相同，在站台系里走得一样快，设每过站台系的$1$秒走$k$秒（$k>0$）。
    - |
      车头的钟比车尾的晚$\Delta t$开始走，之后同一站台时刻两者读数之差恒为$k\Delta t>0$。
  reference: |
    在站台系里，车尾在$t_{\text{尾}}=\frac{\ell}{2(c+v)}$收到光、开始走，车头在$t_{\text{头}}=\frac{\ell}{2(c-v)}$收到光、开始走（讲解里的计算），$t_{\text{头}}-t_{\text{尾}}=\frac{\ell v}{c^2-v^2}>0$。

    两只钟构造相同，以同样的速度运动，站台系里没有任何理由让一只比另一只走得快，所以设它们每过站台系的$1$秒都走$k$秒（$k>0$，它的值要到[时间延缓](lesson:physics.special-relativity.time-dilation)才求出）。站台系时刻$t\ge t_{\text{头}}$时，车尾的钟读数$k(t-t_{\text{尾}})$，车头的钟读数$k(t-t_{\text{头}})$，前者比后者大$k\frac{\ell v}{c^2-v^2}$，是个和$t$无关的正数。

    所以在站台系看来，车厢里同步好的钟并不同步：沿运动方向越靠前的钟，读数越小。这个差值的精确式子是$\frac{L v}{c^2}$，$L$是在车厢里量的长度，要用到时间延缓（time dilation）和长度收缩（length contraction）才能化成这个形式，见[洛伦兹变换](lesson:physics.special-relativity.lorentz-transformation)。

- id: p7
  tier: thinking
  statement: |
    在一个惯性系里 A 先于 B 发生，在另一个惯性系里 B 先于 A 发生，这可能吗？如果 A 是「开枪」、B 是「子弹击中靶子」，先后颠倒岂不是违反了因果律（causality）？用讲解里车厢闪光的例子想一想，什么样的两个事件先后可以颠倒。
  hints:
    - |
      讲解里光到达车尾、车头两个事件，在车厢系里同时；在站台系里车尾先，在反向运动的参考系里车头先。
    - |
      能不能有一个信号从其中一个事件出发、及时到达另一个事件？在站台系里比较两事件的距离和光在$\Delta t$内走的距离。
    - |
      站台系里两事件相距$\ell+v\Delta t$，而$c\Delta t<\ell+v\Delta t$，光都来不及，任何信号都来不及。开枪和中靶之间有子弹连着，先后不会颠倒。
  reference: |
    先后可以颠倒：车厢闪光的两个到达事件在车厢系里同时，在站台系里车尾先到，在相对车厢向反方向运动的参考系里车头先到。

    但这样的两个事件之间不可能有因果联系。在站台系里，它们相隔$\Delta t=\frac{\ell v}{c^2-v^2}$，相距$\ell+v\Delta t$；$c\Delta t-v\Delta t=\frac{\ell v}{c+v}<\ell$，即$c\Delta t<\ell+v\Delta t$，光从一个事件出发也赶不到另一个事件，更慢的信号更不行。

    开枪和中靶之间有子弹（比光慢）连着，这样的两个事件在任何惯性系里先后都不会颠倒。精确的说法是：能用不超过光速的信号联系起来的两个事件，先后次序和惯性系无关，证明见[时空图与光锥](lesson:physics.special-relativity.spacetime-diagrams)。

- id: p8
  tier: thinking
  statement: |
    有人提议不用光对钟，而用一根很长的刚性杆：在 A 端一推，B 端「同时」动起来，这样就能定义各个惯性系共同的「绝对同时」（absolute simultaneity）。这个办法错在哪里？
  hints:
    - |
      推杆时，A 端的运动是怎样传到 B 端的？
    - |
      杆由原子组成，A 端的原子先动，靠原子间的作用力带动下一个，形变以一定的速度沿杆传播。
    - |
      这个速度是杆里的声速，远小于光速；何况如果能有「瞬时」传播的信号，在不同的惯性系里就会出现因果倒置。
  reference: |
    真实的杆不是绝对刚性的。推 A 端时，A 端附近先被压缩，压缩以纵波（longitudinal wave）的形式沿杆传播，速度是杆里的声速，对钢来说约$5\times10^3\,\mathrm{m/s}$，远小于光速。B 端要等这个波到了才动，「同时」并不成立。

    即使不管材料，绝对刚性的杆也和相对论矛盾：它等于一个传播速度无穷大的信号。由同时的相对性，在某个惯性系里「同时」的两端运动，在另一个惯性系里有先有后，而且次序随惯性系可以颠倒（p7）；用这样的信号就能制造因果倒置。

    所以在相对论里，「刚体」（rigid body）只能是近似：任何信号都不超过光速，一个物体各部分的运动不可能瞬间协调一致。这也是为什么对钟只能靠光这样传播速度已知、且在所有惯性系里都相同的信号。
