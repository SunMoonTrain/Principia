- id: p1
  tier: easy
  statement: |
    在$S$的时空图上（横轴$x$、纵轴$ct$），$S'$以$0.6c$处于标准位形。$S'$的$x'$轴和$x$轴的夹角是多少度？
  answer:
    type: number
    value: atan(0.6)*180/pi
    unit: |
      $^\circ$
  hints:
    - |
      $x'$轴是$t'=0$的事件。
    - |
      $t'=\gamma\bigl(t-\frac{vx}{c^2}\bigr)=0$给出$ct=\beta x$。
    - |
      斜率是$\beta=0.6$，夹角$\arctan0.6\approx31.0^\circ$。
  solution: |
    $x'$轴是$ct=\beta x=0.6x$，和$x$轴的夹角$\theta=\arctan0.6\approx30.96^\circ$。$ct'$轴是$x=0.6\,ct$，和$ct$轴的夹角也是这么大，两条带撇的轴关于光线对称。

- id: p2
  tier: easy
  statement: |
    事件 O 在原点。下面给出另外几个事件的坐标$(ct,x)$（长度单位相同）。哪些事件和 O 之间可能有因果联系（其中一个影响另一个）？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $(3,2)$
      - |
        $(1,-2)$
      - |
        $(-2,1)$
      - |
        $(2,2)$
      - |
        $(0,0.5)$
    value: [1, 3, 4]
  hints:
    - |
      看事件在不在 O 的光锥内或锥面上：$|ct|\ge|x|$。
    - |
      过去光锥里的事件能影响 O，未来光锥里的事件能被 O 影响；锥面上的只能用光联系。
    - |
      A、C、D 满足$|ct|\ge|x|$；B、E 在锥外。
  solution: |
    A 在未来光锥内，O 能影响它；C 在过去光锥内，它能影响 O；D 在锥面上，O 发出的光正好到达它。B、E 在锥外（E 和 O 在这个惯性系里同时、不同地），任何不超过光速的信号都连不起来，没有因果联系。

- id: p3
  tier: medium
  statement: |
    事件 O 在原点，事件 P 在$x=4$、$ct=1$（长度单位相同）。$S'$以$0.6c$处于标准位形。

    在$S'$里，P 比 O 早还是晚？相差多少（用$ct'$表示，单位同上）？答案填绝对值。
  answer:
    type: number
    value: 1.75
  hints:
    - |
      先看 P 在不在 O 的光锥里：$ct=1<4=x$，在锥外，次序可能颠倒。
    - |
      $ct'=\gamma(ct-\beta x)$，$\gamma=1.25$。
    - |
      $ct'_P=1.25\times(1-0.6\times4)=-1.75$，P 比 O 早$1.75$。
  solution: |
    $ct'_P=1.25\times(1-2.4)=-1.75$：在$S$里 P 晚于 O，在$S'$里 P 早于 O。这只可能发生在光锥外，和因果次序不变定理一致；在时空图上，P 在$S'$的$x'$轴（$ct=0.6x$，$x=4$处高$2.4$）的下方。

- id: p4
  tier: medium
  statement: |
    在$S$的时空图上，$S'$以$0.8c$运动。$S'$里$ct'=1$、$x'=0$的事件画在纸面上，离原点的距离是$S$的单位长度的多少倍？
  answer:
    type: number
    value: sqrt(41)/3
  hints:
    - |
      用逆变换求这个事件在$S$里的坐标。
    - |
      $(ct,x)=(\gamma,\gamma\beta)=\bigl(\frac53,\frac43\bigr)$。
    - |
      纸面距离$\sqrt{(5/3)^2+(4/3)^2}=\frac{\sqrt{41}}{3}\approx2.13$。
  solution: |
    $\gamma=\frac53$，这个事件在$S$里是$(ct,x)=\bigl(\frac53,\frac43\bigr)$，纸面上离原点$\frac{\sqrt{41}}{3}\approx2.13$个单位。$ct'$轴上的单位刻度在纸上比$ct$轴上的长一倍多，所以不能拿同一把尺子在图上量两套坐标；刻度要用双曲线$c^2t^2-x^2=1$来定。

- id: p5
  tier: hard
  statement: |
    证明：在$S$的时空图上，$S'$的$ct'$轴和双曲线$c^2t^2-x^2=1$（取$ct>0$的一支）的交点处，双曲线的切线平行于$S'$的$x'$轴；并说明这个事实的含义。
  hints:
    - |
      交点是$(x,ct)=(\gamma\beta,\gamma)$。
    - |
      双曲线$ct=\sqrt{1+x^2}$在$x$处的斜率是$\frac{x}{\sqrt{1+x^2}}$。
    - |
      在$x=\gamma\beta$处斜率为$\frac{\gamma\beta}{\gamma}=\beta$，正是$x'$轴$ct=\beta x$的斜率。
  reference: |
    $ct'$轴是$x=\beta ct$，代入$c^2t^2-x^2=1$得$c^2t^2(1-\beta^2)=1$，$ct=\gamma$，交点$(x,ct)=(\gamma\beta,\gamma)$，这正是$S'$里$ct'=1$、$x'=0$的事件。双曲线这一支是$ct=\sqrt{1+x^2}$，斜率$\frac{\dd(ct)}{\dd x}=\frac{x}{\sqrt{1+x^2}}$，在$x=\gamma\beta$处等于$\frac{\gamma\beta}{\gamma}=\beta$，和$x'$轴$ct=\beta x$的斜率相同，所以切线平行于$x'$轴。

    含义：双曲线上的点都是和原点间隔为$1$的事件，在$S'$里它们的$ct'$满足$c^2t'^2-x'^2=1$，在$x'=0$处$ct'$取最小值$1$。所以过这个点的$S'$同时线$ct'=1$只和双曲线碰一下，其余部分都在双曲线下方。

    这和$S$里的情形一模一样：在$S$里，双曲线在$(0,1)$处的切线是水平线$ct=1$，即$S$的同时线。每个惯性系都以同样的方式看这条双曲线，这是相对性原理（principle of relativity）在图上的体现。

- id: p6
  tier: hard
  statement: |
    用时空图说明时间延缓是相互的：$S$的钟静止在$x=0$，$S'$的钟静止在$x'=0$，两只钟在原点相遇时都读$0$。证明$S$认为$S'$的钟慢，$S'$也认为$S$的钟慢，并说明两者不矛盾。
  hints:
    - |
      $S'$的钟读$ct'=1$的事件是$(x,ct)=(\gamma\beta,\gamma)$，用$S$的同时线（水平线）比较。
    - |
      $S$的钟读$ct=1$的事件是$(0,1)$，它在$S'$里的$ct'$是$\gamma(1-0)=\gamma$。
    - |
      两个比较用的是不同的同时线：$S$用水平线，$S'$用平行于$x'$轴的斜线。
  reference: |
    $S$的看法：$S'$的钟读$ct'=1$时，这个事件在$S$里的$ct=\gamma>1$；$S$的钟在同一水平线上读$\gamma$。所以在$S$看来，$S'$的钟走过$1$，自己的钟走过$\gamma$，$S'$的钟慢。

    $S'$的看法：$S$的钟读$ct=1$的事件是$(x,ct)=(0,1)$，它在$S'$里$ct'=\gamma(1-\beta\cdot0)=\gamma$。也就是说，在$S'$的同时线$ct'=\gamma$上，$S$的钟才读到$1$，$S'$的钟已经走过$\gamma$：$S'$认为$S$的钟慢。

    图上看得很清楚：$S$拿水平的同时线去截$S'$的钟的世界线，$S'$拿斜的同时线去截$S$的钟的世界线，比较的是不同的事件对，所以两个结论可以同时成立。要消除对称、比出「谁真的慢」，必须让两只钟重新相遇，那就要有一只钟改变速度，见[双生子佯谬与其他佯谬](lesson:physics.special-relativity.twin-paradox)。

- id: p7
  tier: thinking
  statement: |
    假如存在一种比光快的信号，速度是$2c$（在发送者的惯性系里）。用时空图说明：可以利用它给自己的过去发消息，造成因果悖论（causal paradox）。
  hints:
    - |
      比光快的信号的世界线在光锥外，按因果次序定理，接收事件在某些惯性系里早于发送事件。
    - |
      安排两次传送：A 在自己的参考系（frame of reference）里用超光速信号发给远处运动的 B，B 在 B 的参考系里再用超光速信号发回来。
    - |
      选 B 的速度合适时，回信到达 A 的世界线时，比 A 发出第一封信还早。
  reference: |
    超光速信号的世界线比$45^\circ$线平，在发送事件的光锥外。按因果次序定理，总有惯性系认为接收早于发送。如果相对性原理成立，任何惯性系里的观察者都能用同样的装置（在自己的参考系里速度为$2c$），这就可以构成闭合的回路。

    例如：A 静止在$S$里，在$ct=0$时向远处发出速度$2c$的信号；B 以高速远离 A，收到信号后立刻在自己的参考系里发出速度$2c$的回信。在 B 的参考系里，回信的世界线向 B 的过去方向倾斜；只要 B 的速度足够大（大于$0.8c$），回信到达 A 的世界线时，A 的钟读数是负的：A 在发出第一封信之前就收到了回信。

    于是 A 可以收到回信后决定不发第一封信，矛盾。所以在狭义相对论里，能传递信息的信号不能超过光速；这和因果次序不变定理是一致的：只有光锥内的次序是确定的，因果关系也只能在光锥内传递。

- id: p8
  tier: thinking
  statement: |
    你在路上以$1.5\,\mathrm{m/s}$步行，迎面一位朋友以同样的速率反向步行。两人都说「此刻仙女座星系（Andromeda galaxy）里正在发生的事」。仙女座离我们约$250$万光年，两人的「此刻」在那里相差多少天？这说明了什么？
  hints:
    - |
      两人的同时线在时空图上斜率不同，距离越远，两条线在那里的高度差越大。
    - |
      相对速度约$3\,\mathrm{m/s}$（这样小的速度可以直接相减），远处同时线相差$\Delta t\approx\frac{vD}{c^2}=\frac vc\cdot\frac Dc$。
    - |
      $\frac vc=10^{-8}$，$\frac Dc=2.5\times10^6$年，$\Delta t\approx0.025$年，约 9 天。
  reference: |
    两人相对速度约$v=3\,\mathrm{m/s}$。在时空图上，两人的同时线都过他们相遇的事件，斜率相差约$\frac vc$，在距离$D$处高度相差$\Delta t\approx\frac{vD}{c^2}=\frac{v}{c}\cdot\frac{D}{c}$。代入$\frac vc=10^{-8}$、$\frac{D}{c}=2.5\times10^6$年，$\Delta t\approx2.5\times10^{-2}$年，约 9 天。

    也就是说，两人各自的「此刻」在仙女座那里相差 9 天左右：一个人的「此刻」里某件事已经发生，另一个人的「此刻」里还没发生。这有时被称作「仙女座佯谬」（Andromeda paradox）。

    这并不意味着谁能影响仙女座上的事：那些事件都在两人的光锥外，任何信号都要几百万年才能传到。同时的相对性告诉我们，远处的「此刻」只是一个约定，不同的惯性系约定不同；有物理意义的是光锥，它和惯性系无关。
