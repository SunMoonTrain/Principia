- id: p1
  tier: easy
  statement: |
    按伽利略变换计算：飞船以$0.6c$的速度迎着一束光飞行（光和飞船相向运动），在地面参考系里这束光的速率是$c$。在飞船参考系里，这束光的速率是多少？
  answer:
    type: number
    value: 1.6
    unit: |
      $c$
  hints:
    - |
      伽利略变换下速度相减：$u'=u-v$，先选定正方向。
    - |
      取飞船运动的方向为正，飞船速度$v=0.6c$，光的速度$u=-c$。
    - |
      $u'=-c-0.6c=-1.6c$，速率是$1.6c$。按光速不变原理应当仍是$c$，两者矛盾。
  solution: |
    取飞船运动方向为正，$v=0.6c$，$u=-c$，伽利略变换给出$u'=u-v=-1.6c$，速率$1.6c$。光速不变原理说飞船里测得的仍是$c$，这正是伽利略变换要被换掉的原因。

- id: p2
  tier: easy
  statement: |
    下面哪些说法是对的？
  answer:
    type: choice
    multiple: true
    options:
      - |
        在匀速飞行的飞船里测真空中的光速，结果仍是$c$
      - |
        在一个惯性系里做任何实验，都测不出这个惯性系相对「以太」的速度
      - |
        在相对地面以$0.5c$运动的火车上向前发出的光，相对地面的速度是$1.5c$
      - |
        地面上静止的光源和运动的光源发出的光，在地面上测得的速度不同
      - |
        如果某个力学实验在地面上的结果和在匀速直线行驶的火车上不同，那就违反了相对性原理（不计地面不是严格惯性系的影响）
    value: [1, 2, 5]
  hints:
    - |
      对照两条基本假设：物理定律在所有惯性系里相同；真空光速在所有惯性系里都是$c$，和光源的运动无关。
    - |
      C 用的是伽利略变换的速度相加；D 和「和光源的运动无关」相反。
    - |
      A、B、E 对；C、D 错，相对地面的光速仍是$c$。
  solution: |
    A 是光速不变原理。B 是相对性原理：分辨不出哪个惯性系「真正静止」，也就测不出相对以太的速度。C 错，光相对地面仍是$c$；D 错，光速和光源的运动无关。E 对，相对性原理要求同样的实验在两个惯性系里结果相同。

- id: p3
  tier: medium
  statement: |
    迈克耳孙-莫雷型干涉仪的两臂长分别是$L_1=10\,\mathrm{m}$和$L_2=15\,\mathrm{m}$，用波长$\lambda=5.0\times10^{-7}\,\mathrm{m}$的光，设仪器相对以太的速度$v=3\times10^4\,\mathrm{m/s}$，$c=3\times10^8\,\mathrm{m/s}$。按以太理论，把仪器转$90^\circ$，干涉条纹移动多少条？只保留$\frac{v^2}{c^2}$的最低阶。
  answer:
    type: number
    value: 0.5
  hints:
    - |
      沿运动方向的臂往返时间是$\frac{2L}{c}\cdot\frac{1}{1-v^2/c^2}$，垂直方向的是$\frac{2L}{c}\cdot\frac{1}{\sqrt{1-v^2/c^2}}$。
    - |
      转动前臂 1 沿运动方向，转动后臂 2 沿运动方向，分别写出两束光的时间差，再相减。
    - |
      时间差的变化约为$\frac{(L_1+L_2)}{c}\cdot\frac{v^2}{c^2}$，条纹移动$N=\frac{(L_1+L_2)v^2}{\lambda c^2}=\frac{25\times10^{-8}}{5\times10^{-7}}=0.5$条。
  solution: |
    记$a=\frac{1}{1-v^2/c^2}\approx1+\frac{v^2}{c^2}$，$b=\frac{1}{\sqrt{1-v^2/c^2}}\approx1+\frac{v^2}{2c^2}$。转动前时间差是$\frac2c(L_1a-L_2b)$，转动后是$\frac2c(L_1b-L_2a)$，两者之差$\frac2c(L_1+L_2)(a-b)\approx\frac{(L_1+L_2)v^2}{c^3}$。乘以光的频率$\frac c\lambda$，条纹移动$N=\frac{(L_1+L_2)v^2}{\lambda c^2}=0.5$条；两臂不必等长，起作用的是臂长之和。

- id: p4
  tier: medium
  statement: |
    按伽利略变换计算：在$S$里一束光沿和$x$轴成$60^\circ$的方向传播（速度的$y$分量为正），$S'$相对$S$以$v=0.5c$处于标准位形。在$S'$里这束光的速率是多少？
  answer:
    type: number
    value: sqrt(3)/2
    unit: |
      $c$
  hints:
    - |
      先把$S$里的光速分解成$x$、$y$两个分量。
    - |
      $u_x=c\cos60^\circ=0.5c$，$u_y=c\sin60^\circ$；伽利略变换只改$x$分量：$u_x'=u_x-v$。
    - |
      $u_x'=0$，$u_y'=\frac{\sqrt3}2c$，速率$\frac{\sqrt3}2c\approx0.866c$，比$c$小。
  solution: |
    $u_x'=0.5c-0.5c=0$，$u_y'=\frac{\sqrt3}{2}c$，所以在$S'$里光沿$y'$轴传播，速率$\frac{\sqrt3}2c\approx0.866c$。光速不变原理要求它仍是$c$；伽利略变换算出的速率可以比$c$大，也可以比$c$小，取决于方向。

- id: p5
  tier: hard
  statement: |
    两个质点之间的相互作用力只依赖它们的相对位置$\vb r_1-\vb r_2$和相对速度$\dot{\vb r}_1-\dot{\vb r}_2$。证明：如果在惯性系$S$里两个质点都满足牛顿第二定律（Newton's second law），那么在按伽利略变换得到的$S'$里，它们满足形式相同的方程；并说明总动量守恒（conservation of momentum）在两个惯性系里同时成立（动量守恒见[质心与动量守恒](lesson:physics.newtonian-mechanics.momentum-conservation)）。
  hints:
    - |
      把伽利略变换写成矢量形式$\vb r'=\vb r-\vb vt$、$t'=t$，$\vb v$是常矢量。
    - |
      相对位置$\vb r_1'-\vb r_2'=\vb r_1-\vb r_2$，相对速度也不变，所以力不变；加速度$\ddot{\vb r}'=\ddot{\vb r}$。
    - |
      总动量$\sum m_i\dot{\vb r}_i'=\sum m_i\dot{\vb r}_i-\bigl(\sum m_i\bigr)\vb v$，质量之和不变，所以一个守恒，另一个也守恒。
  reference: |
    伽利略变换写成$t'=t$，$\vb r'=\vb r-\vb vt$。对$t$求导：$\dot{\vb r}'=\dot{\vb r}-\vb v$，$\ddot{\vb r}'=\ddot{\vb r}$。于是$\vb r_1'-\vb r_2'=\vb r_1-\vb r_2$，$\dot{\vb r}_1'-\dot{\vb r}_2'=\dot{\vb r}_1-\dot{\vb r}_2$，力是这两者的函数，所以在两个惯性系里大小、方向都一样。

    设在$S$里$m_1\ddot{\vb r}_1=\vb F(\vb r_1-\vb r_2,\dot{\vb r}_1-\dot{\vb r}_2)$，把左边换成$m_1\ddot{\vb r}_1'$、右边的自变量换成带撇的量，等式照样成立，所以$S'$里的方程形式相同，第二个质点同理。质量在牛顿力学里和参考系无关，这一点是默认的。

    动量：$\sum_im_i\dot{\vb r}_i'=\sum_im_i\dot{\vb r}_i-\bigl(\sum_im_i\bigr)\vb v$。质量守恒时第二项是常矢量，所以$S$里总动量守恒等价于$S'$里总动量守恒。这就是力学满足相对性原理的意思：做力学实验分辨不出两个惯性系。

- id: p6
  tier: hard
  statement: |
    假设光速和光源的运动有关：光相对光源以$c$传播，速度按伽利略变换合成。一对双星（binary star）离地球$D$，其中一颗沿视线方向以速率$u$来回运动（$u\ll c$）。证明它朝着地球运动和背着地球运动时发出的光，传到地球所用的时间之差约为$\frac{2Du}{c^2}$；取$D=100$光年、$u=100\,\mathrm{km/s}$，估计这个时间差，并说明这个假设会让我们看到什么样的双星。
  hints:
    - |
      朝着地球运动时，光相对地球的速度是$c+u$；背着时是$c-u$。
    - |
      $\frac{D}{c-u}-\frac{D}{c+u}=\frac{2Du}{c^2-u^2}\approx\frac{2Du}{c^2}$。
    - |
      $\frac{2Du}{c^2}=2\times100\,\text{年}\times\frac uc\approx0.067$年，约 24 天，和许多双星的轨道周期相当。
  reference: |
    按这个假设，星朝着地球运动时发出的光以$c+u$传播，背着地球时以$c-u$传播。走过距离$D$所用的时间之差为$\frac{D}{c-u}-\frac{D}{c+u}=\frac{2Du}{c^2-u^2}$，$u\ll c$时约为$\frac{2Du}{c^2}$。

    $D=100$光年就是光以$c$走 100 年的距离，所以$\frac{2Du}{c^2}=2\times100\,\text{年}\times\frac{u}{c}=200\times\frac{10^5}{3\times10^8}\,\text{年}\approx0.067\,\text{年}$，约 24 天。轨道周期是几天到几十天的双星，后半个周期发出的光会和前半个周期发出的光挤在一起到达甚至超前，我们看到的轨道运动会严重变形，同一颗星还可能同时出现在几个位置上。

    观测到的双星轨道却规规矩矩，符合开普勒定律（Kepler's laws）。德西特（Willem de Sitter）在 1913 年用这个论证说明：光速和光源的运动无关。

- id: p7
  tier: thinking
  statement: |
    有人设想：地球表面附近的以太被地球完全拖着一起走，这样迈克耳孙-莫雷实验自然测不到以太风。天文学家布拉德雷（James Bradley）在 1725 年至 1728 年间发现了光行差：一年之中，遥远恒星的视位置（apparent position）画出一个长半轴约$20.5''$的小椭圆，只有黄道极（ecliptic pole）附近的恒星画的是圆。为什么光行差让人很难接受「以太被完全拖着走」？
  hints:
    - |
      光行差的大小约是$\frac{v}{c}$，$v$是地球公转的速率；先验证$20.5''$和$v\approx30\,\mathrm{km/s}$对得上。
    - |
      在以太理论里，光行差来自望远镜相对传光的以太横向运动：光在镜筒里下落的同时，镜筒向旁边移动了。
    - |
      如果望远镜周围的以太和地球一起运动，光进入这一层以太后就不再相对望远镜横向漂移，偏角应当消失。
  reference: |
    地球公转速率$v\approx3\times10^4\,\mathrm{m/s}$，$\frac vc\approx10^{-4}\,\mathrm{rad}\approx20.6''$，和观测到的$20.5''$一致。以太理论这样解释光行差：光在静止的以太里竖直下落，望远镜随地球横向运动，镜筒要倾斜一个角$\frac vc$，光才能从镜筒底部出来。

    如果地球表面附近的以太被完全拖着走，光进入这层以太后就随它一起横向运动，相对望远镜不再有横向漂移，镜筒不必倾斜，光行差就该消失或大大减小。斯托克斯（George Stokes）曾试图让以太拖曳理论（ether drag hypothesis）和光行差兼容，但要给以太加上很不自然的性质。

    所以零结果（null result）和光行差放在一起，以太理论左右为难：静止的以太解释光行差，却预言迈克耳孙-莫雷实验有结果；被拖着走的以太解释零结果，却解释不了光行差。狭义相对论不需要以太，两者都能解释，光行差的正确公式见[速度变换](lesson:physics.special-relativity.velocity-transformation)。

- id: p8
  tier: thinking
  statement: |
    1983 年起，米的定义是光在真空中$\frac{1}{299\,792\,458}$秒内走过的距离，于是真空光速按定义精确等于$299\,792\,458\,\mathrm{m/s}$。这样一来，「测量光速」还有意义吗？光速不变原理还能用实验检验吗？
  hints:
    - |
      按新定义，「测量光速」变成了什么？用光测出的长度又是什么？
    - |
      光速不变原理说的不只是一个数值，还说这个值和传播方向、光源的运动、所在的惯性系都无关。
    - |
      这些「无关」是可以比较的：比较不同方向、不同光源、不同时刻的光的速度，不需要先知道$c$的数值。
  reference: |
    按 1983 年的定义，$c$的数值不再测量，而是用来定义米：测量「光速」变成了用光的传播时间来实现长度的标准。单说一个数值，确实没有什么可测的了。

    但光速不变原理说的是：真空光速和传播方向、光源的运动、所在的惯性系都无关。这些是比较，不依赖$c$的数值：比较两个互相垂直方向上的光速（迈克耳孙-莫雷型实验，现代改用光学谐振腔（optical cavity）的频率，2015 年的实验已经精确到约$10^{-18}$），比较运动光源和静止光源（如 1964 年的$\pi^0$实验），比较一年中地球速度不同的时候。

    所以定义米时用到光速，并没有把光速不变原理变成同义反复：如果哪天发现不同方向的光速不一样，米的定义就得改，相对论也得改。
