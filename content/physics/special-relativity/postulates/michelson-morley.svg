<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" width="500" height="330" font-size="14">
  <!-- 迈克耳孙干涉仪俯视示意：光源 → 分束镜（45°）→ 两条互相垂直、长都为 L 的臂 → 镜子 M1、M2 → 回到分束镜 → 观察屏。
       右上角箭头是以太理论设想的「以太风」：仪器随地球以速度 v 向右运动时，以太相对仪器以 v 向左流动。 -->
  <g fill="none" stroke-width="2" style="stroke: var(--accent, #2563eb)">
    <line x1="86" y1="190" x2="250" y2="190" />
    <line x1="250" y1="187" x2="390" y2="187" />
    <line x1="390" y1="193" x2="250" y2="193" stroke-dasharray="6 4" />
    <line x1="247" y1="190" x2="247" y2="50" />
    <line x1="253" y1="50" x2="253" y2="190" stroke-dasharray="6 4" />
    <line x1="250" y1="190" x2="250" y2="288" />
  </g>
  <path d="M 160.0 190.0 L 151.9 193.9 L 151.9 186.1 z" style="fill: var(--accent, #2563eb)" />
  <path d="M 330.0 187.0 L 321.9 190.9 L 321.9 183.1 z" style="fill: var(--accent, #2563eb)" />
  <path d="M 247.0 120.0 L 250.9 128.1 L 243.1 128.1 z" style="fill: var(--accent, #2563eb)" />
  <path d="M 250.0 262.0 L 246.1 253.9 L 253.9 253.9 z" style="fill: var(--accent, #2563eb)" />
  <rect x="60" y="179" width="26" height="22" fill="none" stroke="currentColor" stroke-width="1.5" />
  <line x1="234" y1="206" x2="266" y2="174" stroke="currentColor" stroke-width="3" />
  <line x1="394" y1="170" x2="394" y2="210" stroke="currentColor" stroke-width="4" />
  <line x1="230" y1="46" x2="270" y2="46" stroke="currentColor" stroke-width="4" />
  <line x1="226" y1="292" x2="274" y2="292" stroke="currentColor" stroke-width="3" />
  <g stroke="currentColor" stroke-width="1" fill="none">
    <line x1="250" y1="224" x2="390" y2="224" />
    <line x1="250" y1="218" x2="250" y2="230" />
    <line x1="390" y1="218" x2="390" y2="230" />
    <line x1="210" y1="50" x2="210" y2="190" />
    <line x1="204" y1="50" x2="216" y2="50" />
    <line x1="204" y1="190" x2="216" y2="190" />
  </g>
  <line x1="470" y1="70" x2="368" y2="70" stroke-width="2" style="stroke: var(--muted, #6b7280)" />
  <path d="M 360 70 l 10 -5 l 0 10 z" style="fill: var(--muted, #6b7280)" />
  <text x="73.0" y="170.0" fill="currentColor" text-anchor="middle">光源</text>
  <text x="272.0" y="210.0" fill="currentColor">分束镜</text>
  <text x="404.0" y="195.0" fill="currentColor">M₁</text>
  <text x="278.0" y="55.0" fill="currentColor">M₂</text>
  <text x="282.0" y="296.0" fill="currentColor">观察屏</text>
  <text x="320.0" y="244.0" fill="currentColor" text-anchor="middle"><tspan font-style="italic">L</tspan></text>
  <text x="192.0" y="125.0" fill="currentColor" text-anchor="middle"><tspan font-style="italic">L</tspan></text>
  <text x="415.0" y="58.0" fill="currentColor" text-anchor="middle">设想的以太风</text>
</svg>
