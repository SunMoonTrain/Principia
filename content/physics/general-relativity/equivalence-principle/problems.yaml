- id: p1
  tier: easy
  statement: |
    两种材料的小球在竖直的真空管里，从$20\,\mathrm m$高处同时由静止落下，都只受引力，管里的引力场看作均匀的。球 1、球 2 的加速度$a_1$、$a_2$满足$\frac{a_1-a_2}{a_1}=2.0\times10^{-6}$。球 1 着地时，球 2 离管底多高？以$\mu\mathrm m$为单位。
  answer:
    type: number
    value: 20*2.0e-6*1e6
    unit: |
      $\mu\mathrm m$
  hints:
    - |
      两球都从静止开始、以不变的加速度下落。球 1 着地用了多长时间？这段时间里球 2 落了多少？
    - |
      球 1 着地用时$t_1=\sqrt{\frac{2h}{a_1}}$，这段时间里球 2 落了$\frac12a_2t_1^2=h\frac{a_2}{a_1}$，所以离管底$h\frac{a_1-a_2}{a_1}$。
    - |
      $20\,\mathrm m\times2.0\times10^{-6}=4.0\times10^{-5}\,\mathrm m=40\,\mu\mathrm m$。
  solution: |
    两球都从静止开始、以不变的加速度下落。球 1 着地用时$t_1=\sqrt{\frac{2h}{a_1}}$，这段时间里球 2 落了$\frac12a_2t_1^2=h\frac{a_2}{a_1}$，离管底$h\frac{a_1-a_2}{a_1}$。代入数值，$20\,\mathrm m\times2.0\times10^{-6}=4.0\times10^{-5}\,\mathrm m$，即$40\,\mu\mathrm m$。这个结果是精确的，算法和例 1 一样。

- id: p2
  tier: easy
  statement: |
    下面哪些说法对？地面看作惯性系，地面附近的引力场看作均匀的，大小取$9.8\,\mathrm{m/s^2}$，不计空气的作用。
  answer:
    type: choice
    multiple: true
    options:
      - |
        只受引力时，同一处质量不同的铁球和木球加速度相同，所以它们受的引力也一样大
      - |
        如果某种材料的引力质量是惯性质量的$1.01$倍，它在地面附近只受引力时的加速度约是普通物体的$1.01$倍
      - |
        某个区域里各处引力场的大小都相同、方向不全相同，它仍是均匀引力场
      - |
        在均匀引力场里自由下落的舱中，平行于地板抛出的小球相对舱做匀速直线运动
      - |
        在静止于地面的实验室里把小球以$5.0\,\mathrm{m/s}$竖直上抛，它回到手里用的时间，和在远离天体、以$9.8\,\mathrm{m/s^2}$向上（从地板指向天花板）加速的火箭里同样上抛时不同
    value: [2, 4]
  hints:
    - |
      A、B 想一想只受引力时，加速度和两种质量是什么关系；C 回到均匀引力场的定义；D、E 想一想舱里的惯性力，以及等效原理说的是哪一对实验室。
    - |
      A：引力$\frac{GMm_{\text{引}}}{r^2}$和引力质量成正比，加速度相同不等于引力相同。B：只受引力时$a=\frac{m_{\text{引}}}{m_{\text{惯}}}\cdot\frac{GM}{r^2}$。C：引力场是矢量，均匀要求方向也处处相同。

      D：自由下落的舱里，惯性力正好抵消引力。E：静止在地面上的实验室，和远离天体、以$9.8\,\mathrm{m/s^2}$向上加速的火箭，正是等效原理说的那一对；在两处，小球相对手的加速度各是多少？
    - |
      B、D 对，A、C、E 错。A 错：引力和引力质量成正比，铁球和木球的质量不同，受的引力也不同，只是加速度一样。B 对：只受引力时$a=\frac{m_{\text{引}}}{m_{\text{惯}}}\cdot\frac{GM}{r^2}$，这个比值是普通物体的$1.01$倍，加速度也是$1.01$倍。C 错：均匀引力场要求各处的矢量$\vb g$都相同，方向不同就不是。

      D 对：舱的加速度$\vb a_0=\vb g$，小球受的引力$m\vb g$和惯性力$-m\vb a_0$抵消，相对舱不受力，做匀速直线运动。E 错：由等效原理，两处的结果一样；具体地说，两处小球相对手的加速度都是$9.8\,\mathrm{m/s^2}$、朝向地板，回到手里都用$\frac{2\times5.0}{9.8}\,\mathrm s\approx1.0\,\mathrm s$。
  solution: |
    选 B、D。A 错：引力和引力质量成正比，铁球和木球的质量不同，受的引力也不同，只是加速度一样。B 对：只受引力时$a=\frac{m_{\text{引}}}{m_{\text{惯}}}\cdot\frac{GM}{r^2}$，这个比值是普通物体的$1.01$倍，加速度也是$1.01$倍。C 错：均匀引力场要求各处的矢量$\vb g$都相同，方向不同就不是。

    D 对：舱的加速度$\vb a_0=\vb g$，小球受的引力$m\vb g$和惯性力$-m\vb a_0$抵消，相对舱不受力，做匀速直线运动。E 错：由等效原理，两处的结果一样；具体地说，两处小球相对手的加速度都是$9.8\,\mathrm{m/s^2}$、朝向地板，回到手里都用$\frac{2\times5.0}{9.8}\,\mathrm s\approx1.0\,\mathrm s$。

- id: p3
  tier: medium
  statement: |
    失重飞机（reduced-gravity aircraft）以$180\,\mathrm{m/s}$的速度、沿和水平方向成$45^\circ$斜向上飞行时，飞行员让发动机的推力正好抵消空气对飞机的作用力，飞机从此只受引力。到飞机的速度变成和水平方向成$45^\circ$斜向下为止，舱里的人一直完全失重。这段失重持续多久？地面看作惯性系，引力场看作均匀的，$g$取$9.8\,\mathrm{m/s^2}$，结果保留三位有效数字。
  answer:
    type: number
    value: 2*180*sin(pi/4)/9.8
    unit: |
      $\mathrm s$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      飞机只受引力，它和舱里的人加速度相同，舱就是在均匀引力场里自由下落的参考系。飞机做的是什么运动？
    - |
      飞机做抛体运动（projectile motion）：水平分速度不变，竖直分速度以$g$均匀减小，从$v\sin45^\circ$减到$-v\sin45^\circ$。
    - |
      $t=\frac{2v\sin45^\circ}g=\frac{2\times180\times0.7071}{9.8}\,\mathrm s\approx26.0\,\mathrm s$。
  solution: |
    飞机只受引力，在均匀引力场里自由下落，舱的加速度$\vb a_0=\vb g$；以舱为参考系，人受的惯性力正好抵消引力，所以完全失重。飞机做抛体运动（projectile motion），水平分速度$v\cos45^\circ$不变，竖直分速度以$g$均匀减小；速度和水平方向成$45^\circ$斜向下时，竖直分速度是$-v\sin45^\circ$。所以$t=\frac{2v\sin45^\circ}g=\frac{2\times180\times0.7071}{9.8}\,\mathrm s\approx26.0\,\mathrm s$。

- id: p4
  tier: medium
  statement: |
    远离天体的火箭以$6.0\,\mathrm{m/s^2}$的加速度向上（从地板指向天花板）加速，舱里的人在离地板$1.2\,\mathrm m$高处，把小球以$3.0\,\mathrm{m/s}$的速度平行于地板抛出，不计空气的作用。小球落到地板上的点，离抛出点正下方的那一点多远？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: 3.0*sqrt(2*1.2/6.0)
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      松手后小球受什么力？在火箭里看，还要给它加上什么力？这和哪种熟悉的运动一样？
    - |
      在火箭里，小球受惯性力$-m\vb a_0$，就像在大小为$a_0$的均匀引力场里做抛体运动：垂直于地板的方向从静止开始以$a_0$加速，平行于地板的方向匀速。
    - |
      落到地板用时$t=\sqrt{\frac{2\times1.2}{6.0}}\,\mathrm s\approx0.632\,\mathrm s$，平行于地板走了$3.0\times0.632\,\mathrm m\approx1.90\,\mathrm m$。
  solution: |
    松手后小球不受力，在惯性系里做匀速直线运动；在火箭里它多受一个惯性力$-m\vb a_0$，就像在大小为$a_0$的均匀引力场里做抛体运动（projectile motion）。垂直于地板的方向，它从静止开始以$a_0$加速，落下$1.2\,\mathrm m$用时$t=\sqrt{\frac{2\times1.2}{6.0}}\,\mathrm s\approx0.632\,\mathrm s$；平行于地板的方向匀速，走了$3.0\times0.632\,\mathrm m\approx1.90\,\mathrm m$。

    在惯性系里看，小球走的是直线，是加速的地板追上了它：地板比小球多走的距离是$\frac12a_0t^2$，用时相同，落点也相同。结果和小球的质量、材料都无关。

- id: p5
  tier: hard
  statement: |
    均匀引力场$\vb g$里，一个密闭的舱相对惯性系平动，加速度是$\vb a_0$（可以随时间变化）。

    （1）证明舱里只受引力的小球，相对舱的加速度都是$\vb g-\vb a_0$。这一步用到了什么实验事实？

    （2）舱里的物体之间、物体和舱壁之间还有弹力、摩擦力、拉力。说明在舱里只做力学实验，只能测出$\vb g-\vb a_0$，分不开$\vb g$和$\vb a_0$。

    （3）舱在地面附近被发动机推着，以$2g$的加速度竖直向下加速。舱里松开的小球怎样运动？舱里的人会以为自己在什么样的引力场里？
  hints:
    - |
      先在惯性系里写只受引力的小球的方程，再用[平动加速参考系与惯性力](lesson:physics.newtonian-mechanics.accelerating-frames#thm-translating-frame)里两个参考系加速度的关系$\vb a=\vb a_0+\vb a'$。
    - |
      （1）$m_{\text{惯}}\vb a=m_{\text{引}}\vb g$，再由弱等效原理。（2）在舱里写每个物体的方程，看$\vb g$、$\vb a_0$以什么形式出现；物体之间的作用力由什么决定？（3）算$\vb g-\vb a_0$的大小和方向。
    - |
      （1）在惯性系里，小球只受引力，$m_{\text{惯}}\vb a=m_{\text{引}}\vb g$。由弱等效原理，$m_{\text{引}}=m_{\text{惯}}$，所以$\vb a=\vb g$，对一切小球都一样。舱平动，由$\vb a=\vb a_0+\vb a'$，小球相对舱的加速度是$\vb a'=\vb g-\vb a_0$。用到的实验事实就是弱等效原理：没有它，不同材料的小球的$\vb a'$就可能不同。

      （2）在舱里，第$k$个物体受引力$m_k\vb g$、惯性力$-m_k\vb a_0$，还受别的物体和舱壁给的弹力、摩擦力、拉力，合起来记作$\vb F_k$，所以$m_k\vb a_k'=\vb F_k+m_k(\vb g-\vb a_0)$。$\vb F_k$只由物体之间、物体和舱壁之间怎样接触、相对位置和相对速度决定，在舱里就能描述，和舱本身怎样运动无关。于是$\vb g$、$\vb a_0$只以$\vb g-\vb a_0$的形式出现在方程里：只要$\vb g-\vb a_0$相同、开始时舱里的情况相同，以后舱里的一切力学过程都一样。所以力学实验只能测出$\vb g-\vb a_0$，分不开$\vb g$和$\vb a_0$。

      （3）$\vb g$向下、大小为$g$，$\vb a_0$向下、大小为$2g$，所以$\vb g-\vb a_0$向上、大小为$g$。松开的小球相对舱以$g$的加速度「落」向天花板。舱里的人会以为舱静止在一个大小为$g$、方向指向天花板的均匀引力场里，就像整个舱倒了过来。
  reference: |
    （1）惯性系里$m_{\text{惯}}\vb a=m_{\text{引}}\vb g$；由弱等效原理$m_{\text{引}}=m_{\text{惯}}$，$\vb a=\vb g$对一切小球相同。由平动参考系的$\vb a=\vb a_0+\vb a'$，$\vb a'=\vb g-\vb a_0$。用到的实验事实是弱等效原理，没有它各种材料的$\vb a'$可能不同。

    （2）舱里第$k$个物体：$m_k\vb a_k'=\vb F_k+m_k\vb g-m_k\vb a_0=\vb F_k+m_k(\vb g-\vb a_0)$，$\vb F_k$是弹力、摩擦力、拉力的合力，只由接触方式、相对位置、相对速度决定，在舱里描述，和舱的运动无关。方程里$\vb g$、$\vb a_0$只以差的形式出现；$\vb g-\vb a_0$相同、初始情况相同时，舱里的力学过程完全相同，所以只能测出$\vb g-\vb a_0$。

    （3）$\vb g-\vb a_0=\vb g-2\vb g=-\vb g$，向上、大小为$g$。小球相对舱以$g$向天花板加速；舱里的人以为舱静止在指向天花板、大小为$g$的均匀引力场里，好像舱倒了过来。

- id: p6
  tier: hard
  statement: |
    MICROSCOPE 卫星（2016 年发射）在离地面约$710\,\mathrm{km}$的轨道上，让钛合金和铂合金做的两个同心圆柱一起绕地球自由下落，比较它们的加速度。取$G=6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$，地球的质量为$5.97\times10^{24}\,\mathrm{kg}$、半径为$6.37\times10^6\,\mathrm m$。

    （1）那里的引力场多大？

    （2）$\frac{|a_1-a_2|}a=1.0\times10^{-15}$时，两个圆柱的相对加速度多大？

    （3）要在能让东西自由下落$110\,\mathrm m$的落塔（drop tower）里，用例 1 的办法达到同样的精度，一个球着地时，另一个球离底多高？和原子的大小（约$10^{-10}\,\mathrm m$）比一比。

    （4）在轨道上，设两个圆柱从相对静止开始，相对加速度一直是（2）的值、方向不变，过多久相对位移才有原子大小？和落塔里一次自由下落的时间比一比，说明为什么要把实验搬到太空里做。
  hints:
    - |
      （1）两个圆柱都只受引力，加速度就是那里的引力场；地球当作质量集中在地心的质点。（4）相对加速度不变时，相对位移随时间怎样增大？落塔里一次能自由下落多久，卫星里又能落多久？
    - |
      （1）离地心$r=R+710\,\mathrm{km}=7.08\times10^6\,\mathrm m$，$g=\frac{GM}{r^2}$。（2）相对加速度$|a_1-a_2|=1.0\times10^{-15}\,a$。

      （3）照例 1，离底的高度是$h\frac{|a_1-a_2|}a$，这里$h=110\,\mathrm m$。（4）从相对静止开始，过了时间$t$，相对位移是$\frac12|a_1-a_2|t^2$；落塔里从静止落下$110\,\mathrm m$的时间，按地面上的$9.8\,\mathrm{m/s^2}$算。
    - |
      （1）两个圆柱都只受引力，加速度就是那里的引力场。离地心$r=R+710\,\mathrm{km}=7.08\times10^6\,\mathrm m$，由$g=\frac{GM}{r^2}$得$g\approx7.94\,\mathrm{m/s^2}$，约是地面的八成。

      （2）$|a_1-a_2|=1.0\times10^{-15}\times7.94\,\mathrm{m/s^2}\approx7.9\times10^{-15}\,\mathrm{m/s^2}$。

      （3）照例 1，一个球着地时另一个离底$110\,\mathrm m\times1.0\times10^{-15}=1.1\times10^{-13}\,\mathrm m$，只有原子大小的千分之一。

      （4）由$\frac12|a_1-a_2|t^2=1\times10^{-10}\,\mathrm m$，得$t=\sqrt{\frac{2\times10^{-10}}{7.9\times10^{-15}}}\,\mathrm s\approx160\,\mathrm s$。落塔里从静止落下$110\,\mathrm m$只用$\sqrt{\frac{2\times110}{9.8}}\,\mathrm s\approx4.7\,\mathrm s$，所需的时间是它的三十多倍，一次下落远远不够。卫星绕地球运行就是一直在自由下落，两个圆柱可以一起落上几个月；微小的相对加速度一直存在，测得越久，平均下来噪声越小，所以要把实验搬到太空里做。
  reference: |
    （1）$r=R+710\,\mathrm{km}=7.08\times10^6\,\mathrm m$，$g=\frac{GM}{r^2}=\frac{6.67\times10^{-11}\times5.97\times10^{24}}{(7.08\times10^6)^2}\,\mathrm{m/s^2}\approx7.94\,\mathrm{m/s^2}$。

    （2）$|a_1-a_2|\approx1.0\times10^{-15}\times7.94\approx7.9\times10^{-15}\,\mathrm{m/s^2}$。

    （3）例 1 的办法：离底$h\frac{|a_1-a_2|}a=110\times1.0\times10^{-15}\,\mathrm m=1.1\times10^{-13}\,\mathrm m$，约是原子大小的$10^{-3}$。

    （4）$\frac12|a_1-a_2|t^2=10^{-10}\,\mathrm m$，$t=\sqrt{\frac{2\times10^{-10}}{7.9\times10^{-15}}}\,\mathrm s\approx160\,\mathrm s$，是落塔里一次自由下落（$\sqrt{2\times110/9.8}\approx4.7\,\mathrm s$）的三十多倍。在轨道上可以连续几个月自由下落，相对加速度一直存在，长时间平均压低噪声，达到了$10^{-15}$。

- id: p7
  tier: thinking
  statement: |
    伽利略在《关于两门新科学的对话》（Two New Sciences）里这样反驳「重的物体落得快」：把一块重石头和一块轻石头绑在一起，看它们怎样落。

    （1）怎样由此推出矛盾？

    （2）设想下落的加速度不由轻重决定，而由材料决定，例如铁球总比木球落得快一点。把铁球和木球绑在一起，还推得出矛盾吗？这个论证能不能排除这种可能？

    （3）为什么说弱等效原理最终要靠实验来确立？
  hints:
    - |
      设重的落得快。轻石头绑在重石头上，是拖慢它还是帮它加快？绑在一起的整体比重石头重还是轻？
    - |
      （1）两种看法分别给出整体比重石头落得慢、又比它落得快。（2）整体的$\frac{m_{\text{引}}}{m_{\text{惯}}}$在铁和木之间，加速度也在两者之间，这和「加速度由材料决定」矛盾吗？（3）这个论证用到的只是整体比各部分重。
    - |
      （1）设重的落得快。轻石头落得慢，绑在重石头上会拖慢它，整体应比重石头单独落得慢；可整体比重石头更重，又应比它落得快。两个结论矛盾，所以「重的落得快」不成立；同样的论证也排除了「轻的落得快」。

      （2）推不出矛盾。若加速度由材料决定，铁球单独落得快、木球单独落得慢，绑在一起时互相牵制，整体的加速度在两者之间。按$a=\frac{m_{\text{引}}}{m_{\text{惯}}}\cdot\frac{GM}{r^2}$，整体的比值是$\frac{m_{\text{引},1}+m_{\text{引},2}}{m_{\text{惯},1}+m_{\text{惯},2}}$，正好介于两种材料的比值之间，和「由材料决定」一点也不冲突。所以这个论证排除不了加速度和材料有关。

      （3）论证只用了「整体比各部分重」，管不到各种材料的$\frac{m_{\text{引}}}{m_{\text{惯}}}$是否相同：这是自然界本身的性质，单靠推理定不下来。所以弱等效原理要靠实验来检验，从牛顿的摆、厄缶的扭秤到 MICROSCOPE 卫星，精度一步步提高。
  reference: |
    （1）若重的落得快：轻石头拖慢重石头，整体比重石头慢；整体更重，又应比重石头快，矛盾。所以「重的落得快」不成立；同理，「轻的落得快」也不成立。

    （2）若加速度取决于材料（$\frac{m_{\text{引}}}{m_{\text{惯}}}$），铁、木绑在一起，整体的比值$\frac{m_{\text{引},1}+m_{\text{引},2}}{m_{\text{惯},1}+m_{\text{惯},2}}$介于两者之间，加速度居中，自洽，推不出矛盾。论证排除不了和材料有关。

    （3）论证只用了「整体比部分重」，各种材料的比值是否相同是自然界的事实，只能由实验定：牛顿的摆约$10^{-3}$，厄缶几乘$10^{-9}$，MICROSCOPE 约$10^{-15}$。

- id: p8
  tier: thinking
  statement: |
    地面看作惯性系（不计地球自转）。等臂天平（equal-arm balance）的两个盘里各放一个物体。

    （1）天平静止在地面上并且平衡时，两边的哪种质量相等？

    （2）把天平搬到远离天体的火箭里，火箭以加速度$a_0$加速，方向垂直于横梁、指向盘的上方。天平平衡时，两边的哪种质量相等？

    （3）如果两个物体在地面上平衡，在火箭里却不平衡，说明了什么？这时等效原理还成立吗？
  hints:
    - |
      等臂天平平衡，是两个盘托物体的力一样大。在地面上，这个力等于什么？在火箭里，物体要跟着火箭加速，这个力又等于什么？
    - |
      地面上物体静止，盘的托力等于它受的引力$\frac{GMm_{\text{引}}}{R^2}$；火箭里没有引力，托力就是让物体以$a_0$加速的力$m_{\text{惯}}a_0$。
    - |
      （1）等臂天平平衡，两个盘托物体的力一样大。地面上物体静止，托力等于它受的引力$\frac{GMm_{\text{引}}}{R^2}$，所以两边的引力质量相等。

      （2）火箭里没有引力，物体跟着火箭以$a_0$加速，盘托它的力是$m_{\text{惯}}a_0$；在火箭里看，就是托力和惯性力平衡。所以两边的惯性质量相等。

      （3）两个物体的引力质量相等、惯性质量不等，它们的$\frac{m_{\text{引}}}{m_{\text{惯}}}$就不同，弱等效原理不成立。这时舱里的人把这两个物体放上天平，就分得出是静止在地面上，还是在远离天体、加速的火箭里，等效原理也不成立。反过来说，等效原理要成立，弱等效原理就必须成立；天平在地面上和在火箭里给出同样的结果，本身就是两种质量成正比的一种检验。
  reference: |
    （1）平衡时两盘托力相等；地面上托力$=\frac{GMm_{\text{引}}}{R^2}$，所以引力质量相等。

    （2）火箭里托力$=m_{\text{惯}}a_0$（舱里看是和惯性力平衡），所以惯性质量相等。

    （3）$m_{\text{引}}$相等而$m_{\text{惯}}$不等，两物的$\frac{m_{\text{引}}}{m_{\text{惯}}}$不同，弱等效原理被破坏；舱里用天平就能分出地面和火箭，等效原理也不成立。所以等效原理蕴含弱等效原理，天平在两处结果相同正是对两种质量成正比的检验。
