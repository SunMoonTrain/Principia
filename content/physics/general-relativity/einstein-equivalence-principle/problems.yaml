- id: p1
  tier: easy
  statement: |
    地面上有一根水平放置、抽成真空的长管，长$3.0\,\mathrm{km}$。一束激光从管的一端沿管水平射出，在地面参考系里看，光到另一端时比出发时低多少？引力场看作均匀的，$g$取$9.8\,\mathrm{m/s^2}$，$c$取$3.00\times10^8\,\mathrm{m/s}$，以$\mathrm{nm}$为单位。
  answer:
    type: number
    value: 9.8*3000^2/(2*(3.00e8)^2)*1e9
    unit: |
      $\mathrm{nm}$
  hints:
    - |
      光在哪个参考系里走直线？地面相对这个参考系怎样运动？
    - |
      由「地面参考系」的定理，地面相对局部惯性系以$g$竖直向上加速。光走完管长用时$t=\frac Lc$，这段时间里地面升高$\frac12gt^2=\frac{gL^2}{2c^2}$。
    - |
      $\frac{gL^2}{2c^2}=\frac{9.8\times(3.0\times10^3)^2}{2\times(3.00\times10^8)^2}\,\mathrm m=4.9\times10^{-10}\,\mathrm m$，即$0.49\,\mathrm{nm}$。
  solution: |
    由爱因斯坦等效原理，在局部惯性系里光沿直线以$c$前进。由「地面参考系」的定理，地面相对局部惯性系以$g$竖直向上加速；光走完管长$L$用时$t=\frac Lc$，这段时间里地面升高$\frac12gt^2=\frac{gL^2}{2c^2}$，在地面参考系里看，光就低了这么多。代入数值，$\frac{9.8\times(3.0\times10^3)^2}{2\times(3.00\times10^8)^2}\,\mathrm m=4.9\times10^{-10}\,\mathrm m$，即$0.49\,\mathrm{nm}$，只有几个原子那么大。

- id: p2
  tier: easy
  statement: |
    下面哪些说法对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        由爱因斯坦等效原理，不论自由下落、不转动的舱有多大，舱里做的一切非引力实验都和狭义相对论里的一样
      - |
        在局部惯性系里测量真空中的光速，结果是$c$
      - |
        地球两侧各有一个自由下落、不转动的小舱，它们各自都可以看作局部惯性系，却不能合起来看作同一个惯性系
      - |
        在地面附近自由下落、不转动的舱里，上下相距$1\,\mathrm m$的两个小球的相对加速度，比上下相距$2\,\mathrm m$的两个小球的大
      - |
        月球上离地球最近和最远的两处，每千克物质受地球的引力不一样大；在随月心一起自由下落、不转动的参考系里，这个差别抵消不掉
    value: [2, 3, 5]
  hints:
    - |
      A 看爱因斯坦等效原理对实验室的大小有什么要求；B 看它对局部惯性系里的光说了什么；C、D、E 用潮汐力想一想。
    - |
      A：舱大了，舱里各处的引力场不一样。B：局部惯性系里一切非引力的实验都照狭义相对论。C：两个舱的加速度朝哪里？

      D：上下两球的相对加速度约为$\frac{2gh}R$。E：一个平动的参考系只能给各处的物体同一个加速度。
    - |
      B、C、E 对，A、D 错。A 错：爱因斯坦等效原理只对局部惯性系说，舱大了，各处的引力场方向、大小都不同，潮汐力使里面的物体互相靠拢或分开，结果就和狭义相对论里的不一样。B 对：局部惯性系里一切非引力的实验都和狭义相对论里的一样，量出的光速也是$c$。C 对：两个舱各自在自由下落，都可以看作局部惯性系，可它们的加速度都指向地心、方向相反，彼此之间有加速度，不能合起来看作同一个惯性系。

      D 错：上下相距$h$的两球相对加速度约为$\frac{2gh}R$，和$h$成正比，相距$1\,\mathrm m$的只有相距$2\,\mathrm m$的一半。E 对：地球的引力场在月球的范围里不均匀，随月心自由下落的参考系只能抵消月心处的那一份，两处多出、少掉的部分是地球的潮汐力，抵消不掉。
  solution: |
    选 B、C、E。A 错：爱因斯坦等效原理只对局部惯性系说，舱大了，各处的引力场方向、大小都不同，潮汐力使里面的物体互相靠拢或分开，结果就和狭义相对论里的不一样。B 对：局部惯性系里一切非引力的实验都和狭义相对论里的一样，量出的光速也是$c$。C 对：两个舱各自在自由下落，都可以看作局部惯性系，可它们的加速度都指向地心、方向相反，彼此之间有加速度，不能合起来看作同一个惯性系。

    D 错：上下相距$h$的两球相对加速度约为$\frac{2gh}R$，和$h$成正比，相距$1\,\mathrm m$的只有相距$2\,\mathrm m$的一半。E 对：地球的引力场在月球的范围里不均匀，随月心自由下落的参考系只能抵消月心处的那一份，两处多出、少掉的部分是地球的潮汐力，抵消不掉。

- id: p3
  tier: medium
  statement: |
    德国的不来梅落塔（Bremen Drop Tower）里，实验舱在抽成真空的塔管中自由下落$4.74\,\mathrm s$，舱不转动。舱里上下相距$1.00\,\mathrm m$的两个小球开始时相对舱静止。只考虑地球引力造成的潮汐力，落完时两球的距离比开始时大多少？以$\mu\mathrm m$为单位，结果保留三位有效数字，$g$取$9.8\,\mathrm{m/s^2}$，地球半径取$6.37\times10^6\,\mathrm m$。
  answer:
    type: number
    value: 9.8*1.00*4.74^2/6.37e6*1e6
    unit: |
      $\mu\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      舱自由下落、不转动，两球的相对加速度由讲解里哪条估计式给出？这段时间里两球的距离变化很小，相对加速度变不变？
    - |
      上下相距$h$的两球相对加速度约为$\frac{2gh}R$，互相分开；$h$几乎不变，两球从相对静止开始做匀加速直线运动，距离增加$\frac12\cdot\frac{2gh}R\,t^2$。
    - |
      $\Delta h=\frac12\cdot\frac{2gh}R\,t^2=\frac{ght^2}R$。代入数值，$\Delta h=\frac{9.8\times1.00\times4.74^2}{6.37\times10^6}\,\mathrm m\approx3.46\times10^{-5}\,\mathrm m$，即约$34.6\,\mu\mathrm m$。
  solution: |
    舱和两球都只受地球的引力，舱自由下落、不转动。在舱里看，上下相距$h$的两球的相对加速度约为$\frac{2gh}R$，互相分开。落下的这段时间里，两球的距离变化比$h$小得多，相对加速度可以看作不变，两球从相对静止开始做匀加速直线运动。

    距离增加$\Delta h=\frac12\cdot\frac{2gh}R\,t^2=\frac{ght^2}R$。代入数值，$\Delta h=\frac{9.8\times1.00\times4.74^2}{6.37\times10^6}\,\mathrm m\approx3.46\times10^{-5}\,\mathrm m$，即约$34.6\,\mu\mathrm m$。

- id: p4
  tier: medium
  statement: |
    火箭在地面附近竖直向上起飞，相对地面的加速度是$2g$，舱宽$4.00\,\mathrm m$。一束光从一侧舱壁水平射向对面，在舱里看，光到对面时比出发处低多少？以$10^{-15}\,\mathrm m$为单位，结果保留三位有效数字；引力场看作均匀的，$g$取$9.8\,\mathrm{m/s^2}$，$c$取$3.00\times10^8\,\mathrm{m/s}$。
  answer:
    type: number
    value: 3*9.8*4.00^2/(2*(3.00e8)^2)*1e15
    unit: |
      $10^{-15}\,\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      光在哪个参考系里走直线？火箭相对这个参考系的加速度是多少？
    - |
      地面相对局部惯性系以$g$向上加速，火箭相对地面又以$2g$向上加速。这些速度都远小于光速，加速度直接相加，火箭相对局部惯性系以$3g$向上加速。
    - |
      光走过舱宽用时$t=\frac Lc$，舱升高$\frac12\cdot3g\,t^2=\frac{3gL^2}{2c^2}$。代入数值，$\frac{3\times9.8\times4.00^2}{2\times(3.00\times10^8)^2}\,\mathrm m\approx2.61\times10^{-15}\,\mathrm m$。
  solution: |
    在发光时和火箭同速的局部惯性系里，光沿直线以$c$前进。由「地面参考系」的定理，地面相对局部惯性系以$g$向上加速，火箭相对地面又以$2g$向上加速；这些速度都远小于光速，加速度可以直接相加，火箭相对这个局部惯性系以$3g$向上加速。光走过舱宽用时$t=\frac Lc$，舱升高$\frac12\cdot3g\,t^2=\frac{3gL^2}{2c^2}$，在舱里看，光就低了这么多。

    代入数值，$\frac{3\times9.8\times4.00^2}{2\times(3.00\times10^8)^2}\,\mathrm m\approx2.61\times10^{-15}\,\mathrm m$。

- id: p5
  tier: hard
  statement: |
    宇航员身高$h=2.0\,\mathrm m$，脚朝下，沿径向自由落向一颗中子星（neutron star）。中子星的质量为$2.8\times10^{30}\,\mathrm{kg}$、半径为$12\,\mathrm{km}$，把它当作质量集中在中心的质点，按牛顿引力估算，取$G=6.67\times10^{-11}\,\mathrm{N\,m^2/kg^2}$，$g$取$9.8\,\mathrm{m/s^2}$。

    （1）宇航员的脚离中心$r$（$r\gg h$）时，潮汐力使他的头和脚之间有多大的相对加速度？

    （2）离中心多远时，这个相对加速度超过$10g$？

    （3）到中子星表面时，它是多少？他这么大的「实验室」在那里还能看作局部惯性系吗？
  hints:
    - |
      照讲解里上下两球的估计，把天体表面的$R$换成离中心的距离$r$。
    - |
      （1）头和脚的加速度之差是$\frac{GM}{r^2}-\frac{GM}{(r+h)^2}$，$h\ll r$时约为$\frac{2GMh}{r^3}$。（2）令它等于$10g$，解出$r$。（3）代入$r=12\,\mathrm{km}$，再和$g$比一比。
    - |
      （1）头和脚都只受中子星的引力，加速度都指向中心，脚离中心$r$，头离中心$r+h$。两者之差是$\frac{GM}{r^2}-\frac{GM}{(r+h)^2}=\frac{GMh(2r+h)}{r^2(r+h)^2}$，$h\ll r$时约为$\frac{2GMh}{r^3}$，使头和脚互相分开。

      （2）令$\frac{2GMh}{r^3}=10g$，得$r=\bigl(\frac{2GMh}{10g}\bigr)^{1/3}$。代入$GM=1.87\times10^{20}\,\mathrm{m^3/s^2}$，$r\approx1.97\times10^6\,\mathrm m$，约是中子星半径的 160 多倍。

      （3）$r=1.2\times10^4\,\mathrm m$时，$\frac{2GMh}{r^3}\approx4.3\times10^8\,\mathrm{m/s^2}$，约是$g$的$4.4\times10^7$倍，人会被沿径向拉长、扯断。一瞬间里头和脚之间的相对运动就远远超出测量的精度，他身体这么大的范围根本不能看作局部惯性系，只有小得多的范围、短得多的时间里才行。中子星表面附近引力极强，牛顿引力的估算只给出数量级。
  reference: |
    （1）$\frac{GM}{r^2}-\frac{GM}{(r+h)^2}=\frac{GMh(2r+h)}{r^2(r+h)^2}\approx\frac{2GMh}{r^3}$，头脚互相分开。

    （2）$r=\bigl(\frac{2GMh}{10g}\bigr)^{1/3}$，$GM=1.8676\times10^{20}$，$2GMh=7.47\times10^{20}$，$r^3=7.62\times10^{18}\,\mathrm{m^3}$，$r\approx1.97\times10^6\,\mathrm m$。

    （3）$\frac{7.47\times10^{20}}{(1.2\times10^4)^3}\approx4.32\times10^8\,\mathrm{m/s^2}\approx4.4\times10^7g$；不能看作局部惯性系。表面附近引力很强，牛顿估算只给数量级。

- id: p6
  tier: hard
  statement: |
    一堆松散的石块只靠自身的引力聚成球形卫星，半径为$R_{\text{卫}}$、密度为$\rho_{\text{卫}}$，在离一颗行星的中心$r$处绕它运行，$R_{\text{卫}}\ll r$；行星的半径为$R_{\text{行}}$、密度为$\rho_{\text{行}}$。行星、卫星的质量分别记作$M_{\text{行}}$、$m_{\text{卫}}$，算引力时都当作质量集中在中心的质点，不计卫星的自转和形变。

    （1）卫星表面正对行星的那一点上，行星的潮汐力给那里的石块多大的加速度（相对卫星中心）？卫星自身的引力又给它多大的加速度？

    （2）粗略地说，前者超过后者时卫星会被拉散。$r$小于多少时会被拉散？用$R_{\text{行}}$和两个密度表示。

    （3）地球、月球的平均密度分别约为$5.51\times10^3\,\mathrm{kg/m^3}$、$3.34\times10^3\,\mathrm{kg/m^3}$。按（2），月球离地心多近时会被拉散，是地球半径的几倍？实际的月地距离约是地球半径的 60 倍。
  hints:
    - |
      卫星在绕行星自由下落。以卫星中心为参考，正对行星的那一点和卫星中心就是沿径向「上下」相距$R_{\text{卫}}$的两点。
    - |
      （1）潮汐力给的加速度约为$\frac{2GM_{\text{行}}R_{\text{卫}}}{r^3}$，自身引力给的是$\frac{Gm_{\text{卫}}}{R_{\text{卫}}^2}$。（2）用$\frac43\pi R^3\rho$把两个质量换成半径和密度。
    - |
      （1）卫星中心离行星中心$r$，正对行星的那一点离行星中心$r-R_{\text{卫}}$，两处的加速度都指向行星。照讲解里上下两球的估计，把$R$换成$r$、把$h$换成$R_{\text{卫}}$，这一点相对卫星中心的加速度约为$\frac{2GM_{\text{行}}R_{\text{卫}}}{r^3}$，指向行星，也就是背离卫星中心。卫星自身的引力给那里的石块的加速度是$\frac{Gm_{\text{卫}}}{R_{\text{卫}}^2}$，指向卫星中心。

      （2）拉散的条件是$\frac{2GM_{\text{行}}R_{\text{卫}}}{r^3}>\frac{Gm_{\text{卫}}}{R_{\text{卫}}^2}$，即$r^3<\frac{2M_{\text{行}}}{m_{\text{卫}}}R_{\text{卫}}^3$。代入$M_{\text{行}}=\frac43\pi R_{\text{行}}^3\rho_{\text{行}}$、$m_{\text{卫}}=\frac43\pi R_{\text{卫}}^3\rho_{\text{卫}}$，得$r<R_{\text{行}}\bigl(\frac{2\rho_{\text{行}}}{\rho_{\text{卫}}}\bigr)^{1/3}$，和卫星的大小无关。

      （3）$\bigl(\frac{2\times5.51}{3.34}\bigr)^{1/3}\approx1.49$，月球要近到约 1.49 个地球半径以内才会被拉散，实际的 60 倍远在界限之外。（2）的结果也可以写成$r<1.26R_{\text{行}}\bigl(\frac{\rho_{\text{行}}}{\rho_{\text{卫}}}\bigr)^{1/3}$；计入卫星的自转和形变，流体卫星的系数约为 2.44，这个界限叫作洛希极限（Roche limit），地月的约为 2.9 个地球半径，结论不变。
  reference: |
    （1）潮汐：$\frac{GM_{\text{行}}}{(r-R_{\text{卫}})^2}-\frac{GM_{\text{行}}}{r^2}\approx\frac{2GM_{\text{行}}R_{\text{卫}}}{r^3}$，背离卫星中心；自身引力$\frac{Gm_{\text{卫}}}{R_{\text{卫}}^2}$，指向卫星中心。

    （2）$r^3<\frac{2M_{\text{行}}}{m_{\text{卫}}}R_{\text{卫}}^3=2R_{\text{行}}^3\frac{\rho_{\text{行}}}{\rho_{\text{卫}}}$，$r<R_{\text{行}}\bigl(\frac{2\rho_{\text{行}}}{\rho_{\text{卫}}}\bigr)^{1/3}$。

    （3）$(2\times5.51/3.34)^{1/3}=1.489$，约 1.49 个地球半径；实际约 60 个，安全。流体卫星的洛希极限系数约 2.44，地月约 2.9 个地球半径。

- id: p7
  tier: thinking
  statement: |
    设想一种引力理论：一切物体自由下落的加速度都相同；可是在自由下落、不转动的小舱里测真空中的光速，结果和舱下落得多快有关。

    （1）这种理论满足弱等效原理吗？满足爱因斯坦等效原理吗？

    （2）在这种理论里，自由下落、不转动的小舱还算局部惯性系吗？

    （3）由此说说，为什么检验爱因斯坦等效原理要用光、钟这类不属于力学的实验。
  hints:
    - |
      两条原理各管哪些实验？局部惯性系是怎样定义的，定义里用到光了吗？
    - |
      （1）弱等效原理只看物体下落；爱因斯坦等效原理要求局部惯性系里非引力的实验和狭义相对论里的一样，还和舱下落得多快无关。（2）照定义，只看只受引力的物体在舱里怎样动。（3）在这种理论里做力学实验，能不能发现它和爱因斯坦等效原理的差别？
    - |
      （1）一切物体下落的加速度相同，满足弱等效原理。可在小舱里量到的光速和舱的速度有关，而爱因斯坦等效原理要求局部惯性系里的光速就是狭义相对论的$c$，并且结果和这个局部惯性系以多大速度下落无关，所以不满足。

      （2）还算。局部惯性系的定义只要求舱自由下落、不转动，并且在足够小的范围、足够短的时间里，只受引力的物体在里面静止或做匀速直线运动；这一条由弱等效原理保证，和光无关。只是在这种理论里，局部惯性系对光来说不像狭义相对论的惯性系：局部惯性系照样有，爱因斯坦等效原理却不成立。

      （3）这种理论和满足爱因斯坦等效原理的理论，在一切力学的自由下落实验里给出同样的结果，落体、扭秤这类实验分不出它们。要分出来，就得在自由下落的实验室里看光、钟、原子这些非引力的现象是不是照狭义相对论，再换个地点、换个下落速度看一遍。所以弱等效原理检验得再精确，也代替不了用光和钟做的检验。
  reference: |
    （1）满足弱等效原理；不满足爱因斯坦等效原理：局部惯性系里光速应为$c$，且与它下落的速度无关。

    （2）仍是局部惯性系：定义只涉及自由下落、不转动和只受引力的物体在局部匀速，由弱等效原理保证；只是局部惯性系里的光不服从狭义相对论。

    （3）力学（自由下落）实验只检验弱等效原理，两种理论都通过；爱因斯坦等效原理多出的内容（局部惯性系里非引力物理照狭义相对论、与位置和速度无关）只有用光、钟等非引力实验才能检验。

- id: p8
  tier: thinking
  statement: |
    卡文迪什（Henry Cavendish）用扭秤（torsion balance）测引力常量（gravitational constant）：两个大铅球分别靠近扭秤横杆两端的小球，引力使横杆转过一个小角度。设想把这套装置放进自由下落、不转动的舱里再做一次。

    （1）在舱里，大铅球还会吸引小球、使横杆转过去吗？

    （2）舱外地球的引力和舱里铅球的引力，哪一个被舱的自由下落「消掉」了？另一个为什么消不掉？

    （3）由此说说，爱因斯坦等效原理为什么只说非引力的实验。
  hints:
    - |
      自由下落的舱消掉的是什么样的引力？在舱的范围里，地球的引力场和铅球的引力场各是不是近似均匀的？
    - |
      （1）铅球和小球之间的引力还在不在？（2）铅球就在舱里、离小球很近，它的引力场在舱里方向、大小都变得很厉害。（3）狭义相对论里有没有引力？
    - |
      （1）会。舱自由下落，消掉的只是地球在舱里近似均匀的引力；铅球和小球之间的吸引还在，横杆照样转过去。

      （2）地球的引力被消掉了：舱比地球小得多，地球的引力场在舱里近似均匀，舱和里面的东西以同样的加速度下落，在舱里看就像没有地球的引力。铅球的引力消不掉：铅球就在舱里，离小球很近，它的引力场在舱里方向、大小都变得很厉害，舱的一个加速度抵消不了各处不同的引力。对铅球来说，舱一点也不「小」，它的引力在舱里全是抵消不掉的部分，正像潮汐力。

      （3）原理说的是局部惯性系里的实验和狭义相对论里的一样，可狭义相对论里根本没有引力；舱里物体之间的引力也不会随着自由下落消失，「和狭义相对论里的一样」对它们说不通。这些引力怎样起作用，要由引力理论本身来回答，所以原理只管非引力的实验。
  reference: |
    （1）会：自由下落只消掉地球的近似均匀的引力，铅球与小球的相互吸引仍在。

    （2）消掉的是地球的引力（在舱的尺度上近似均匀）；铅球的引力在舱里极不均匀（源就在舱内、距离与舱同量级），一个平动参考系的加速度抵消不了，相当于全是潮汐部分。

    （3）狭义相对论里没有引力，舱内物体之间的引力不随自由下落消失，「与狭义相对论相同」无从说起；它们由引力理论本身决定，所以原理限定为非引力实验。
