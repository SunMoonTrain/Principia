- id: p1
  tier: easy
  statement: |
    标准映射$p_{n+1}=p_n+K\sin q_n$，$q_{n+1}=q_n+p_{n+1}$，取$K=1$，起点$(q_0,p_0)=\bigl(\frac\pi2,0\bigr)$。求迭代一次后的$q_1$（不必取模）。
  answer:
    type: number
    value: pi/2 + 1
  hints:
    - |
      先算$p_1$，再用新的$p_1$算$q_1$。
    - |
      $p_1=0+1\cdot\sin\frac\pi2=1$。
    - |
      $q_1=\frac\pi2+p_1=\frac\pi2+1\approx2.571$。注意是用冲击以后的$p_1$，不是$p_0$。答案填 `pi/2 + 1`。
  solution: |
    $p_1=1$，$q_1=\frac\pi2+1\approx2.571$。

- id: p2
  tier: easy
  statement: |
    下面哪些系统是可积系统？
  answer:
    type: choice
    multiple: true
    options:
      - |
        一个自由度、$H(q,p)$不显含时间的系统
      - |
        两个互不耦合的一维振子
      - |
        平面上的有心力运动
      - |
        一般的两个自由度系统，只知道能量守恒
    value: [1, 2, 3]
  hints:
    - |
      $n$个自由度要有$n$个独立、两两泊松括号为零的守恒量。
    - |
      有心力问题里，除了能量还有什么守恒？它和$H$的泊松括号是多少？
    - |
      A：一个自由度，$H$本身就够了。B：两个振子各自的能量都守恒，泊松括号为零。C：能量和角动量都守恒，角动量的泊松括号$\pb{L_z}{H}=0$。D：两个自由度只有一个守恒量，不够，一般不可积（例如双摆、例 1 里$\varepsilon\ne0$的情形）。

      答案是 A、B、C。
  solution: |
    A、B、C。D 只有一个守恒量，一般不可积。

- id: p3
  tier: medium
  statement: |
    标准映射的不动点$(\pi,0)$在$0<K<K_*$时是椭圆不动点（附近的点绕它转），$K>K_*$时变成双曲不动点。求$K_*$。
  answer:
    type: number
    value: 4
  hints:
    - |
      在$(\pi,0)$处求雅可比矩阵，它的行列式是$1$。
    - |
      行列式为$1$时，迹的绝对值小于$2$是椭圆型，大于$2$是双曲型。迹是$2+K\cos q$。
    - |
      $q=\pi$时迹是$2-K$。$|2-K|<2$即$0<K<4$；$K>4$时迹小于$-2$，两个特征值是负实数，附近的点每迭代一次翻到另一侧并被拉开。所以$K_*=4$。答案填 `4`。
  solution: |
    迹$2+K\cos\pi=2-K$，$|2-K|<2\iff0<K<4$，$K_*=4$。

- id: p4
  tier: medium
  statement: |
    标准映射取$K=0.5$。双曲不动点$(0,0)$附近，沿不稳定方向偏离一点点的点，每迭代一次，偏离大约乘一个固定的倍数。求这个倍数的自然对数（不动点处的李雅普诺夫指数）。
  answer:
    type: number
    value: log(2)
  hints:
    - |
      求$(0,0)$处雅可比矩阵的特征值，大于$1$的那个就是倍数。
    - |
      雅可比矩阵是$\begin{pmatrix}1+K&1\\K&1\end{pmatrix}$，迹$2+K=2.5$，行列式$1$。
    - |
      特征值满足$\lambda^2-2.5\lambda+1=0$，$\lambda=2$或$\frac12$。不稳定方向上偏离每次乘$2$，指数$\ln2\approx0.693$。答案填 `log(2)`。
  solution: |
    $\lambda^2-2.5\lambda+1=0$，$\lambda=2$，指数$\ln2\approx0.693$。

- id: p5
  tier: hard
  statement: |
    证明：$\alpha$是无理数时，点列$x_n=n\alpha-\lfloor n\alpha\rfloor$（$n=1,2,\dots$，$n\alpha$的小数部分）在$[0,1)$中稠密。由此说明，两个自由度的可积系统，频率之比是无理数时，轨道在庞加莱截面上的点布满那条不变曲线。
  hints:
    - |
      先证明$x_n$两两不同。再用抽屉原理（pigeonhole principle）：把$[0,1)$分成$N$个长$\frac1N$的小区间，前$N+1$个点里必有两个落进同一个。
    - |
      若$x_i$、$x_j$（$i<j$）的距离小于$\frac1N$，看$x_{j-i}$离$0$或$1$有多近，再看它的倍数。
    - |
      若$x_i=x_j$（$i\ne j$），则$(j-i)\alpha$是整数，$\alpha$是有理数，矛盾；所以$x_n$两两不同。任取$N$，$x_1,\dots,x_{N+1}$落进$N$个长$\frac1N$的小区间，必有$x_i$、$x_j$（$i<j$）在同一个里，$|x_j-x_i|<\frac1N$。记$m=j-i$，$m\alpha$和某个整数的距离等于$|x_j-x_i|$，即$x_m=\delta$或$1-\delta$，$0<\delta<\frac1N$。

      于是$x_m,x_{2m},x_{3m},\dots$以步长$\delta$在圆周$[0,1)$上朝一个方向走（$x_{km}$是$k\delta$或$1-k\delta$的小数部分），相邻两点相距$\delta<\frac1N$，走完一圈之前不会跳过任何长$\frac1N$的区间。所以$[0,1)$里每个长$\frac1N$的区间都含有点列的点；$N$任意，点列稠密。

      两个自由度的可积系统，截面上轨道沿不变曲线（一个圆）每次转过角度$2\pi\frac{\omega_1}{\omega_2}$（适当的角变量下），$\frac{\omega_1}{\omega_2}$无理时由上面的结论，这些点在圆上稠密，布满整条曲线；有理时只有有限个点，轨道是周期的。
  reference: |
    $x_n$两两不同（否则$\alpha$有理）。抽屉原理给出$m$使$x_m$离$0$或$1$小于$\frac1N$，其倍数$x_{km}$以小于$\frac1N$的步长绕圆周，每个长$\frac1N$的区间都有点，故稠密。截面上每次转过$2\pi\omega_1/\omega_2$，比值无理时点在不变曲线上稠密。

- id: p6
  tier: hard
  statement: |
    （1）从$H=\frac{p^2}{2}+K\cos q\sum_n\delta(t-n)$出发，对哈密顿正则方程在冲击前后积分，推出标准映射（取每次冲击刚开始之前的$(q,p)$作为截面上的点）。（2）证明标准映射是由$F_1(q,Q)=-\frac12(Q-q)^2+K\cos q$生成的正则变换（$p=\frac{\partial F_1}{\partial q}$，$P=-\frac{\partial F_1}{\partial Q}$，$(Q,P)$是迭代一次后的值），并由此再说明它保持面积。
  hints:
    - |
      （1）$\dot q=p$，$\dot p=K\sin q\sum_n\delta(t-n)$。冲击持续时间为零，$q$在冲击中不变，$p$跳变多少？两次冲击之间呢？
    - |
      （2）分别算$\frac{\partial F_1}{\partial q}$、$-\frac{\partial F_1}{\partial Q}$，和映射比较。正则变换保持相空间的面积（[相空间与刘维尔定理](lesson:physics.analytical-mechanics.phase-space-liouville)）。
    - |
      （1）正则方程是$\dot q=\frac{\partial H}{\partial p}=p$，$\dot p=-\frac{\partial H}{\partial q}=K\sin q\sum_n\delta(t-n)$。在$t=n$前后的无穷小区间上积分，$q$连续，$p$跳变$K\sin q$；两次冲击之间$p$不变，$q$每单位时间增加$p$。记$(q_n,p_n)$为第$n$次冲击刚开始之前的值：冲击后$p$变成$p_n+K\sin q_n$，此后一个单位时间里$p$不变、$q$增加这么多，所以第$n+1$次冲击之前$p_{n+1}=p_n+K\sin q_n$，$q_{n+1}=q_n+p_{n+1}$，正是标准映射。

      （2）$\frac{\partial F_1}{\partial q}=(Q-q)-K\sin q$，$-\frac{\partial F_1}{\partial Q}=Q-q$。所以$P=Q-q$，$p=P-K\sin q$，即$P=p+K\sin q$、$Q=q+P$，正是映射。由生成函数造出的换元是正则变换，正则变换保持泊松括号，一个自由度时就是保持面积，即雅可比行列式（Jacobian determinant）为$1$，和讲解里直接算的一致。
  reference: |
    （1）$q$在冲击中连续，$p$跳变$K\sin q_n$；两次冲击之间$q$增加$p$。记录每次冲击之前的$(q_n,p_n)$，得$p_{n+1}=p_n+K\sin q_n$，$q_{n+1}=q_n+p_{n+1}$。（2）$p=\partial F_1/\partial q=(Q-q)-K\sin q$，$P=-\partial F_1/\partial Q=Q-q$，即标准映射；生成函数给出正则变换，保持面积。

- id: p7
  tier: thinking
  statement: |
    太阳系近似是一个多自由度的哈密顿系统：行星绕太阳的开普勒运动（Kepler motion）是可积的，行星之间的引力是小扰动（约为太阳引力的千分之一）。KAM 定理能不能保证太阳系永远稳定？
  hints:
    - |
      KAM 定理要求扰动「足够小」，这个界限和实际的扰动比起来怎样？自由度是几个？
    - |
      三个以上自由度时，保留下来的环面还能把能量面隔开吗？
    - |
      不能直接保证。第一，KAM 定理只说「扰动足够小」时大多数环面保留，严格证明给出的界限比真实的行星扰动小很多个数量级。第二，太阳系的自由度远多于两个，环面不能把能量面隔开，混沌轨道原则上可以通过阿诺德扩散慢慢漂走。第三，环面保留的是「大多数」初值，太阳系实际的初值是否落在保留的环面上，定理不回答。

      拉斯卡尔（J. Laskar）等人的数值计算表明，内太阳系的运动是混沌的，相邻轨道分开的特征时间，即李雅普诺夫时间（Lyapunov time），约为五百万年：几千万年以后行星的具体位置无法预测。但混沌不等于很快解体：在今后几十亿年里，水星轨道变得不稳定的概率约为百分之一，大部分情形下行星系统仍然完整。太阳系处在「混沌但大体稳定」的状态，KAM 理论解释了为什么规则运动和混沌可以这样共存。
  reference: |
    不能。KAM 要求的扰动界限远小于实际；自由度多于两个，环面不能隔开能量面，可能有阿诺德扩散；保留的只是大多数环面。数值研究表明内太阳系是混沌的，李雅普诺夫时间约五百万年，但几十亿年内失稳的概率小（水星约百分之一）：混沌而大体稳定。

- id: p8
  tier: thinking
  statement: |
    小行星带（asteroid belt）里，轨道周期和木星周期之比是$1:3$、$2:5$、$1:2$这些简单整数比的位置，几乎没有小行星，叫作柯克伍德空隙（Kirkwood gaps）。用这一节的语言（共振、不变环面、混沌层）解释它可能是怎样形成的。
  hints:
    - |
      周期之比是简单整数比，就是频率满足$\vb{k}\cdot\omega=0$（共振）。KAM 定理说共振的环面会怎样？
    - |
      落进混沌层的轨道，偏心率（eccentricity）可以变得很大。偏心率很大的小行星会遇到什么？
    - |
      把小行星绕太阳的运动看作可积的开普勒运动，木星的引力是周期性的小扰动。周期之比是简单整数比时，小行星总在轨道上同样的几个位置受到木星同样方向的拉扯，作用一次次累积，这就是共振：对应的不变环面被破坏，变成岛链和混沌层。

      落在共振附近混沌层里的小行星，轨道偏心率会不规则地、有时突然地变大（维斯德姆（J. Wisdom）在 1980 年代对$1:3$共振做的计算表明，偏心率可以在很长的平静期之后突然跳到$0.3$以上）。偏心率大的轨道会穿过火星乃至地球的轨道，在近距离交会中被甩出去或撞上行星，于是这些位置上的小行星被逐渐清除，留下空隙。远离共振的地方，KAM 环面保留，小行星的轨道长期稳定，那里的小行星就多。
  reference: |
    简单整数比是共振，木星的周期扰动在那里累积，不变环面被破坏，形成混沌层。混沌层里的小行星偏心率会不规则地增大（$1:3$共振的计算表明可突然超过$0.3$），轨道穿越火星等行星轨道，被近距离交会清除，形成空隙；非共振处的 KAM 环面保持轨道稳定。
