  <!-- 匀强重力场，取 m = g = 1。实线：水平动量 1、能量 2.5、出发点 x0 = 0, 1, …, 4 的抛体轨道的上升段 x = x0 + 2 − √(4 − 2y)。
       虚线：特征函数 W(x, y) = x + (8 − (4 − 2y)^{3/2})/3 的等值线 W = 1, 2, …, 8。横纵都是 80 像素一个单位，原点在 (40, 250)。
       W 的梯度是 (1, √(4 − 2y)) = (p_x, p_y)，正是轨道的方向，所以两族曲线处处垂直。 -->
