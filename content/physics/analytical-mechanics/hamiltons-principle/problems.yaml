- id: p1
  tier: easy
  statement: |
    质量$m=2\,\mathrm{kg}$的自由质点，$t=0$时在$x=0$，$t=1.5\,\mathrm{s}$时在$x=3\,\mathrm{m}$，真实运动是匀速直线运动。求真实路径的:term[作用量]{id="physics.analytical-mechanics.action"}$S=\int L\,\dd t$。
  answer:
    type: number
    value: 6
    unit: |
      $\mathrm{J\cdot s}$
  hints:
    - |
      自由质点$L=\frac12m\dot x^2$。先求出匀速运动的速度。
    - |
      速度$v=\frac{3}{1.5}=2\,\mathrm{m/s}$，$L$在整段时间里是常数$\frac12mv^2$。
    - |
      $S=\frac12mv^2\cdot T=\frac12\times2\times2^2\times1.5=6\,\mathrm{J\cdot s}$。
  solution: |
    $S=\frac12mv^2T=\frac{md^2}{2T}=6\,\mathrm{J\cdot s}$。

- id: p2
  tier: easy
  statement: |
    关于:term[哈密顿原理]{id="physics.analytical-mechanics.hamiltons-principle"}，下面哪些说法正确？
  answer:
    type: choice
    multiple: true
    options:
      - |
        在端点和起止时间都固定的路径里，真实运动让作用量取驻值
      - |
        真实运动总是让作用量取最小值
      - |
        给拉格朗日量加上任意函数$F(q,t)$对时间的全导数，运动方程不变
      - |
        参与比较的路径可以从不同的位置出发
    value: [1, 3]
  hints:
    - |
      回想谐振子的例子：时间间隔变长以后，真实路径还是极小吗？比较的路径要满足什么条件？
    - |
      谐振子的时间间隔超过半个周期时，有变动让作用量变小。全导数的积分只剩端点的值。
    - |
      A 对，这是哈密顿原理的内容。B 错：只保证驻值，谐振子的时间间隔超过$\frac{\pi}{\omega}$时就不是最小。C 对：全导数使作用量只多出端点处的常数。D 错：起点、终点和起止时间都要固定，否则分部积分的边界项不为零。

      答案是 A、C。
  solution: |
    A、C。真实路径只保证是驻值（B 错）；比较的路径必须两端都固定（D 错）。

- id: p3
  tier: medium
  statement: |
    谐振子$L=\frac12m\dot x^2-\frac12m\omega^2x^2$，$\omega=2\,\mathrm{rad/s}$。真实路径$x(t)$的两端固定在$t=0$和$t=T$。考虑变动$\eta(t)=\sin\frac{2\pi t}{T}$：$T$超过多少秒时，沿这个方向变动会让:term[作用量]{id="physics.analytical-mechanics.action"}变小？
  answer:
    type: number
    value: pi
    unit: |
      $\mathrm{s}$
  hints:
    - |
      $L$是二次式，$S[x+\varepsilon\eta]-S[x]=\varepsilon^2\int_0^T\bigl(\frac12m\dot\eta^2-\frac12m\omega^2\eta^2\bigr)\dd t$。看这个积分什么时候变成负的。
    - |
      $\dot\eta=\frac{2\pi}{T}\cos\frac{2\pi t}{T}$。在一个整周期上，$\sin^2$和$\cos^2$的积分都是$\frac{T}{2}$。
    - |
      $\int_0^T\bigl(\frac12m\dot\eta^2-\frac12m\omega^2\eta^2\bigr)\dd t=\frac12m\cdot\frac{T}{2}\Bigl(\frac{4\pi^2}{T^2}-\omega^2\Bigr)=\frac{mT}{4}\Bigl(\frac{4\pi^2}{T^2}-\omega^2\Bigr)$。

      它在$T>\frac{2\pi}{\omega}=\pi\,\mathrm{s}$时变成负的。答案是$\pi$，填 `pi`。
  solution: |
    积分等于$\frac{mT}{4}\bigl(\frac{4\pi^2}{T^2}-\omega^2\bigr)$，$T>\frac{2\pi}{\omega}=\pi\,\mathrm{s}\approx3.14\,\mathrm{s}$时为负。用讲解里的$\sin\frac{\pi t}{T}$，临界值是$\frac{\pi}{\omega}$，更早。

- id: p4
  tier: medium
  statement: |
    谐振子$L=\frac12m\dot x^2-\frac12m\omega^2x^2$，取$m=1\,\mathrm{kg}$、$\omega=1\,\mathrm{rad/s}$。真实运动从$t=0$时的$x=0$出发，$t=\frac{\pi}{4}\,\mathrm{s}$时到达$x=1\,\mathrm{m}$。求这段真实运动的:term[作用量]{id="physics.analytical-mechanics.action"}。
  answer:
    type: number
    value: 1/2
    unit: |
      $\mathrm{J\cdot s}$
  hints:
    - |
      先求出满足两端条件的真实运动，再算积分。可以用分部积分把$\int\dot x^2\,\dd t$化掉。
    - |
      满足$\ddot x=-\omega^2x$、$x(0)=0$的解是$x=C\sin\omega t$，由$x(T)=A$得$C=\frac{A}{\sin\omega T}$。$\int_0^T\dot x^2\,\dd t=\bigl[x\dot x\bigr]_0^T-\int_0^Tx\ddot x\,\dd t$。
    - |
      由$\ddot x=-\omega^2x$，$\int_0^T\dot x^2\,\dd t=\bigl[x\dot x\bigr]_0^T+\omega^2\int_0^Tx^2\,\dd t$，所以

      $$
      S=\frac12m\int_0^T\bigl(\dot x^2-\omega^2x^2\bigr)\dd t=\frac12m\,x(T)\dot x(T)=\frac12m\omega A^2\cot\omega T .
      $$

      代入$m=1$、$\omega=1$、$A=1$、$T=\frac{\pi}{4}$：$S=\frac12\cot\frac{\pi}{4}=\frac12\,\mathrm{J\cdot s}$。
  solution: |
    $x=\frac{A\sin\omega t}{\sin\omega T}$，$S=\frac12m\,x(T)\dot x(T)=\frac12m\omega A^2\cot\omega T=\frac12\,\mathrm{J\cdot s}$。

- id: p5
  tier: hard
  statement: |
    设$F(q_1,\dots,q_n,t)$二阶偏导数连续，$\Lambda(q,\dot q,t)=\dv{F}{t}=\sum_k\frac{\partial F}{\partial q_k}\dot q_k+\frac{\partial F}{\partial t}$。不用:term[作用量]{id="physics.analytical-mechanics.action"}，直接计算证明：对每个$j$，

    $$
    \dv{}{t}\frac{\partial\Lambda}{\partial\dot q_j}-\frac{\partial\Lambda}{\partial q_j}=0
    $$

    对任意的路径$q(t)$都成立（不只是真实运动）。由此再说明一次：$L$和$L+\dv{F}{t}$给出同样的:term[拉格朗日方程]{id="physics.analytical-mechanics.lagrange-equations"}。
  hints:
    - |
      $\Lambda$是$\dot q$的一次式，$\frac{\partial\Lambda}{\partial\dot q_j}$很简单。然后两边都用链式法则展开。
    - |
      $\frac{\partial\Lambda}{\partial\dot q_j}=\frac{\partial F}{\partial q_j}$，它对时间的全导数是$\sum_k\frac{\partial^2F}{\partial q_k\partial q_j}\dot q_k+\frac{\partial^2F}{\partial t\,\partial q_j}$。
    - |
      $\Lambda$里$\dot q_j$的系数是$\frac{\partial F}{\partial q_j}$，它不含$\dot q$，所以$\frac{\partial\Lambda}{\partial\dot q_j}=\frac{\partial F}{\partial q_j}$。沿路径$q(t)$求全导数：

      $$
      \dv{}{t}\frac{\partial F}{\partial q_j}=\sum_k\frac{\partial^2F}{\partial q_k\,\partial q_j}\dot q_k+\frac{\partial^2F}{\partial t\,\partial q_j}.
      $$

      另一方面，对$\Lambda$的表达式求$\frac{\partial}{\partial q_j}$（$\dot q$不动）：$\frac{\partial\Lambda}{\partial q_j}=\sum_k\frac{\partial^2F}{\partial q_j\,\partial q_k}\dot q_k+\frac{\partial^2F}{\partial q_j\,\partial t}$。二阶偏导数连续，混合偏导数和求导次序无关，两式相等，差为零。这里没有用到$q(t)$满足任何方程，所以对任意路径都成立。

      拉格朗日方程左边对$L$是线性的：$L'=L+\Lambda$的左边等于$L$的左边加上$\Lambda$的左边，而后者恒为零。所以两者给出完全相同的方程。
  reference: |
    $\frac{\partial\Lambda}{\partial\dot q_j}=\frac{\partial F}{\partial q_j}$，其全导数$\sum_k\frac{\partial^2F}{\partial q_k\partial q_j}\dot q_k+\frac{\partial^2F}{\partial t\partial q_j}$；$\frac{\partial\Lambda}{\partial q_j}=\sum_k\frac{\partial^2F}{\partial q_j\partial q_k}\dot q_k+\frac{\partial^2F}{\partial q_j\partial t}$。混合偏导可交换，两者恒等，与路径无关。拉格朗日方程左边对$L$线性，故$L$与$L+\dv{F}{t}$方程相同。

- id: p6
  tier: hard
  statement: |
    把时间区间$[0,T]$等分成$N$段，$\Delta t=\frac{T}{N}$，单个质点的一维路径用$x_0,x_1,\dots,x_N$近似，$x_0$、$x_N$固定。势能$V(x)$里的:term[作用量]{id="physics.analytical-mechanics.action"}近似为

    $$
    S(x_1,\dots,x_{N-1})=\sum_{k=0}^{N-1}\Bigl[\frac12m\Bigl(\frac{x_{k+1}-x_k}{\Delta t}\Bigr)^2-V(x_k)\Bigr]\Delta t .
    $$

    证明：$S$作为$N-1$元函数的驻点满足

    $$
    m\,\frac{x_{k+1}-2x_k+x_{k-1}}{\Delta t^2}=-V'(x_k),\qquad k=1,\dots,N-1,
    $$

    并说明$\Delta t\to0$时它变成什么方程。
  hints:
    - |
      驻点就是所有偏导数$\frac{\partial S}{\partial x_k}$都为零的点。数一数$x_k$出现在和式的哪几项里。
    - |
      $x_k$只出现在第$k-1$项的动能$\frac12m\frac{(x_k-x_{k-1})^2}{\Delta t}$、第$k$项的动能$\frac12m\frac{(x_{k+1}-x_k)^2}{\Delta t}$和第$k$项的势能$-V(x_k)\Delta t$里。
    - |
      对$1\le k\le N-1$，$x_k$只出现在三处，逐项求偏导：

      $$
      \frac{\partial S}{\partial x_k}=m\frac{x_k-x_{k-1}}{\Delta t}-m\frac{x_{k+1}-x_k}{\Delta t}-V'(x_k)\,\Delta t .
      $$

      令它为零，两边除以$-\Delta t$，就得到$m\frac{x_{k+1}-2x_k+x_{k-1}}{\Delta t^2}=-V'(x_k)$。

      左边的分式是$x$在$t_k=k\Delta t$处的二阶差商。$x(t)$二阶可导时，由泰勒公式$x(t_k\pm\Delta t)=x(t_k)\pm\dot x\Delta t+\frac12\ddot x\Delta t^2+o(\Delta t^2)$，二阶差商趋于$\ddot x(t_k)$，所以$\Delta t\to0$时方程变成$m\ddot x=-V'(x)$，正是由$L=\frac12m\dot x^2-V(x)$得到的:term[拉格朗日方程]{id="physics.analytical-mechanics.lagrange-equations"}。

      这说明哈密顿原理可以看成多元函数求驻点在「无穷多个变量」时的极限。这个差分格式在数值计算里也很有用：按它一步步算出$x_{k+1}$，长时间模拟时能量的误差不会越积越大。
  reference: |
    $x_k$只出现在第$k-1$、$k$项：$\frac{\partial S}{\partial x_k}=m\frac{x_k-x_{k-1}}{\Delta t}-m\frac{x_{k+1}-x_k}{\Delta t}-V'(x_k)\Delta t=0$，即$m\frac{x_{k+1}-2x_k+x_{k-1}}{\Delta t^2}=-V'(x_k)$。二阶差商在$\Delta t\to0$时趋于$\ddot x$，得$m\ddot x=-V'(x)$，即拉格朗日方程。哈密顿原理是多元驻点问题的连续极限。

- id: p7
  tier: thinking
  statement: |
    :term[哈密顿原理]{id="physics.analytical-mechanics.hamiltons-principle"}说真实运动让整段路径的作用量取驻值，听起来像系统「事先知道」终点，在所有路径里挑了一条。这种「目的论」的印象对吗？如果给定两端，满足条件的真实路径一定只有一条吗？
  hints:
    - |
      取真实路径的一小段$[t_a,t_b]\subset[t_1,t_2]$，它是否也让这一小段的作用量（两端固定在$q(t_a)$、$q(t_b)$）取驻值？
    - |
      驻值条件等价于拉格朗日方程，而拉格朗日方程是每一时刻都成立的局部条件。再看谐振子从$x=0$出发，$t=\frac{\pi}{\omega}$时回到$x=0$的情形。
    - |
      印象不对。哈密顿原理和拉格朗日方程等价，而拉格朗日方程是局部的：真实路径的任意一小段，在两端固定的条件下也让那一小段的作用量取驻值。所以不需要「预知」什么，系统每一刻只按此刻的状态演化；用哈密顿原理预测运动，最终仍是解初值问题。

      给定两端的问题（边值问题）和给定初始位置、速度的问题（初值问题）不同。边值问题可能有一条解、没有解或无穷多条解：谐振子从$x=0$出发，$T=\frac{\pi}{\omega}$时回到$x=0$的路径有无穷多条，$x=c\sin\omega t$对任意$c$都是真实运动；要求$T=\frac{\pi}{\omega}$时到达$x\ne0$则一条也没有。所以「挑出那一条」的说法本身就不总是成立。

      更深的原因在量子力学：粒子同时「走」所有路径，每条路径贡献一个相位$e^{iS/\hbar}$，远离驻值路径的那些相位互相抵消，只有驻值路径附近的贡献叠加起来。经典力学是$\hbar$相对很小时的极限，在那里只剩下驻值路径。
  reference: |
    不需要预知：驻值条件等价于局部的拉格朗日方程，真实路径的每一小段也都使该段作用量取驻值；求运动仍是初值问题。边值问题的解可以不唯一或不存在：谐振子$T=\frac{\pi}{\omega}$、两端都为$0$时$x=c\sin\omega t$都是解，端点不为零则无解。量子力学的路径积分给出更深的解释：各路径以$e^{iS/\hbar}$叠加，驻值路径附近相干增强，经典极限只剩驻值路径。

- id: p8
  tier: thinking
  statement: |
    谐振子的时间间隔超过$\frac{\pi}{\omega}$时，真实路径不再让:term[作用量]{id="physics.analytical-mechanics.action"}取极小。为什么偏偏是$\frac{\pi}{\omega}$？球面上两点之间沿大圆走，如果走的是绕远的那一段弧，它是不是最短的路？两件事之间有什么联系？
  hints:
    - |
      从$x=0$出发的所有真实运动$x=c\sin\omega t$，在什么时刻全部回到$x=0$？讲解里那个让作用量变化变号的$\eta$长什么样？
    - |
      从北极出发的所有大圆（经线）在哪里再次相交？绕远的弧经过了这个点。
    - |
      从$x=0$出发、初速度不同的真实运动$x=c\sin\omega t$，在$t=\frac{\pi}{\omega}$时全部回到$x=0$：它们在那里重新汇聚。$T=\frac{\pi}{\omega}$时，讲解里的变动$\eta=\sin\frac{\pi t}{T}=\sin\omega t$本身就是一条真实运动，作用量的二阶变化正好为零；时间再长，就有变动让作用量变小。这样的汇聚点叫共轭点（conjugate point）：路径越过了共轭点，就不再是极小。

      球面上的大圆是长度取驻值的曲线（测地线，geodesic）。从北极出发的所有经线在南极重新汇聚，南极是北极的共轭点。不经过南极的那段弧是最短的；绕远、越过了南极的那段弧，长度仍取驻值，但可以通过稍微挪开得到更短的路，所以不是最短。

      两件事是同一个数学现象：变分问题的驻值曲线在越过共轭点之前是极小，越过之后不再是极小。变分法里用雅可比条件（Jacobi condition）来判断它，谐振子的$\frac{\pi}{\omega}$和球面上的对径点是它最简单的两个例子。
  reference: |
    从$x=0$出发的真实运动$c\sin\omega t$在$t=\frac\pi\omega$全部回到$0$（共轭点）；此时$\eta=\sin\omega t$本身是解，二阶变化为零，再长就可以更小。球面上经线在对径点汇聚，越过对径点的大圆弧仍是测地线（驻值）但不最短。二者都是「越过共轭点后驻值曲线不再极小」（雅可比条件）。
