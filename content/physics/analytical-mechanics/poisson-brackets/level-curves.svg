<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460" font-size="14">
  <!-- (q, p) 平面，80 像素一个单位，原点在 (230, 210)。实线圆是 H = (q² + p²)/2 = 1 的等值线（半径 √2），
       虚线是 f = qp 的等值线 qp = ±1，以及第二、四象限的 qp = −1/2。qp = ±1 的双曲线和圆相切于 (±1, ±1)，那里 {qp, H} = p² − q² = 0；
       带箭头的点是圆和 qp = −1/2 的交点 (−0.366, 1.366)，圆在那里横穿这条虚线，{qp, H} = p² − q² = √3 > 0。 -->
  <!-- 坐标轴 -->
  <line x1="30" y1="210" x2="430" y2="210" stroke="currentColor" stroke-width="1.2" />
  <path d="M 440 210 L 430 206 L 430 214 Z" fill="currentColor" />
  <line x1="230" y1="402" x2="230" y2="22" stroke="currentColor" stroke-width="1.2" />
  <path d="M 230 12 L 226 22 L 234 22 Z" fill="currentColor" />
  <text x="436" y="230" text-anchor="end" fill="currentColor" font-style="italic">q</text>
  <text x="240" y="24" fill="currentColor" font-style="italic">p</text>
  <!-- f = qp 的等值线 -->
  <g fill="none" stroke-width="1.1" stroke-dasharray="5 4" style="stroke: var(--muted, #6b7280)">
    <path d="M 264.8 26.0 L 271.3 55.2 L 277.9 76.3 L 284.4 92.4 L 291.0 105.1 L 297.5 115.2 L 304.1 123.6 L 310.6 130.6 L 317.2 136.6 L 323.7 141.7 L 330.3 146.2 L 336.8 150.1 L 343.4 153.6 L 349.9 156.6 L 356.5 159.4 L 363.0 161.9 L 369.6 164.2 L 376.1 166.2 L 382.7 168.1 L 389.2 169.8 L 395.8 171.4 L 402.3 172.9 L 408.9 174.2 L 415.4 175.5 L 422.0 176.7" />
    <path d="M 195.2 394.0 L 188.7 364.8 L 182.1 343.7 L 175.6 327.6 L 169.0 314.9 L 162.5 304.8 L 155.9 296.4 L 149.4 289.4 L 142.8 283.4 L 136.3 278.3 L 129.7 273.8 L 123.2 269.9 L 116.6 266.4 L 110.1 263.4 L 103.5 260.6 L 97.0 258.1 L 90.4 255.8 L 83.9 253.8 L 77.3 251.9 L 70.8 250.2 L 64.2 248.6 L 57.7 247.1 L 51.1 245.8 L 44.6 244.5 L 38.0 243.3" />
    <path d="M 264.8 394.0 L 271.3 364.8 L 277.9 343.7 L 284.4 327.6 L 291.0 314.9 L 297.5 304.8 L 304.1 296.4 L 310.6 289.4 L 317.2 283.4 L 323.7 278.3 L 330.3 273.8 L 336.8 269.9 L 343.4 266.4 L 349.9 263.4 L 356.5 260.6 L 363.0 258.1 L 369.6 255.8 L 376.1 253.8 L 382.7 251.9 L 389.2 250.2 L 395.8 248.6 L 402.3 247.1 L 408.9 245.8 L 415.4 244.5 L 422.0 243.3" />
    <path d="M 195.2 26.0 L 188.7 55.2 L 182.1 76.3 L 175.6 92.4 L 169.0 105.1 L 162.5 115.2 L 155.9 123.6 L 149.4 130.6 L 142.8 136.6 L 136.3 141.7 L 129.7 146.2 L 123.2 150.1 L 116.6 153.6 L 110.1 156.6 L 103.5 159.4 L 97.0 161.9 L 90.4 164.2 L 83.9 166.2 L 77.3 168.1 L 70.8 169.8 L 64.2 171.4 L 57.7 172.9 L 51.1 174.2 L 44.6 175.5 L 38.0 176.7" />
    <path d="M 247.4 394.0 L 254.7 339.7 L 261.9 310.2 L 269.2 291.6 L 276.5 278.8 L 283.8 269.5 L 291.0 262.4 L 298.3 256.8 L 305.6 252.3 L 312.9 248.6 L 320.1 245.5 L 327.4 242.8 L 334.7 240.6 L 342.0 238.6 L 349.2 236.8 L 356.5 235.3 L 363.8 233.9 L 371.1 232.7 L 378.3 231.6 L 385.6 230.6 L 392.9 229.6 L 400.2 228.8 L 407.4 228.0 L 414.7 227.3 L 422.0 226.7" />
    <path d="M 212.6 26.0 L 205.3 80.3 L 198.1 109.8 L 190.8 128.4 L 183.5 141.2 L 176.2 150.5 L 169.0 157.6 L 161.7 163.2 L 154.4 167.7 L 147.1 171.4 L 139.9 174.5 L 132.6 177.2 L 125.3 179.4 L 118.0 181.4 L 110.8 183.2 L 103.5 184.7 L 96.2 186.1 L 88.9 187.3 L 81.7 188.4 L 74.4 189.4 L 67.1 190.4 L 59.8 191.2 L 52.6 192.0 L 45.3 192.7 L 38.0 193.3" />
  </g>
  <text x="376.0" y="161.0" style="fill: var(--muted, #6b7280)"><tspan font-style="italic">qp</tspan> = 1</text>
  <text x="368.0" y="273.0" style="fill: var(--muted, #6b7280)"><tspan font-style="italic">qp</tspan> = −1</text>
  <!-- H = 1 的等值线：运动沿着它顺时针走 -->
  <circle cx="230" cy="210" r="113.1" fill="none" stroke-width="2.5" style="stroke: var(--accent, #2563eb)" />
  <g style="fill: var(--accent, #2563eb)">
    <path d="M 126.1 164.7 L 126.7 177.7 L 117.3 174.3 Z" />
    <path d="M 333.9 255.3 L 333.3 242.3 L 342.7 245.7 Z" />
  </g>
  <text x="158" y="272" style="fill: var(--accent, #2563eb)"><tspan font-style="italic">H</tspan> = 1</text>
  <!-- 相切的四个点：qp 取极值，{qp, H} = 0 -->
  <g stroke="currentColor" stroke-width="1.2" style="fill: var(--good, #059669)">
    <circle cx="310.0" cy="130.0" r="5" />
    <circle cx="150.0" cy="290.0" r="5" />
    <circle cx="310.0" cy="290.0" r="5" />
    <circle cx="150.0" cy="130.0" r="5" />
  </g>
  <text x="320.0" y="120.0" style="fill: var(--good, #059669)">{<tspan font-style="italic">qp</tspan>, <tspan font-style="italic">H</tspan>} = 0</text>
  <!-- 一个穿过等值线的点和它的速度 -->
  <g stroke-width="2" style="stroke: currentColor">
    <line x1="200.7" y1="100.7" x2="245.2" y2="88.8" />
  </g>
  <path d="M 252.9 86.7 L 246.3 93.2 L 244.0 84.5 Z" fill="currentColor" />
  <circle cx="200.7" cy="100.7" r="4" fill="currentColor" />
  <text x="230" y="430" text-anchor="middle" fill="currentColor">沿 <tspan font-style="italic">H</tspan> 的等值线走，<tspan font-style="italic">qp</tspan> 的变化率是 {<tspan font-style="italic">qp</tspan>, <tspan font-style="italic">H</tspan>} = <tspan font-style="italic">p</tspan>² − <tspan font-style="italic">q</tspan>²</text>
  <text x="230" y="452" text-anchor="middle" fill="currentColor">带箭头的点处它大于 0，<tspan font-style="italic">qp</tspan> 在增大；绿点处它为 0，<tspan font-style="italic">qp</tspan> 取极值</text>
</svg>
