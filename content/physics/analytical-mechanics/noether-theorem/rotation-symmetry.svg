<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-size="14">
  <!-- 左：各向同性势能 V = ½k(x² + y²) 的等势线是圆；右：各向异性 V = ½k(x² + 4y²) 的等势线是椭圆。 -->
  <!-- 箭头是绕中心的无穷小转动 δr = s ẑ × r 的方向，画在半径 90 的圆上的四个点，长 36。 -->
  <!-- 左图 -->
  <g fill="none" stroke-width="1.4" style="stroke: var(--accent, #2563eb)">
    <circle cx="160" cy="150" r="30" />
    <circle cx="160" cy="150" r="60" />
    <circle cx="160" cy="150" r="90" />
    <circle cx="160" cy="150" r="120" />
  </g>
  <circle cx="160" cy="150" r="3" fill="currentColor" />
  <g stroke-width="2.2" style="stroke: var(--good, #059669); fill: var(--good, #059669)">
    <line x1="236.3" y1="99.1" x2="215.85" y2="78.65" />
    <path d="M 210.9 73.7 L 218 76.5 L 213.7 80.8 Z" stroke-width="1" />
    <line x1="109.1" y1="73.7" x2="88.65" y2="94.15" />
    <path d="M 83.7 99.1 L 90.8 96.3 L 86.5 92 Z" stroke-width="1" />
    <line x1="83.7" y1="200.9" x2="104.15" y2="221.35" />
    <path d="M 109.1 226.3 L 106.3 219.2 L 102 223.5 Z" stroke-width="1" />
    <line x1="210.9" y1="226.3" x2="231.35" y2="205.85" />
    <path d="M 236.3 200.9 L 233.5 208 L 229.2 203.7 Z" stroke-width="1" />
  </g>
  <text x="160" y="296" text-anchor="middle" fill="currentColor">各向同性：<tspan font-style="italic">V</tspan> = ½<tspan font-style="italic">k</tspan>(<tspan font-style="italic">x</tspan>² + <tspan font-style="italic">y</tspan>²)</text>
  <text x="160" y="318" text-anchor="middle" fill="currentColor">转动不变，<tspan font-style="italic">L</tspan><tspan font-size="10" dy="4" font-style="italic">z</tspan><tspan dy="-4"> 守恒</tspan></text>
  <!-- 右图 -->
  <g fill="none" stroke-width="1.4" style="stroke: var(--accent, #2563eb)">
    <ellipse cx="480" cy="150" rx="36" ry="18" />
    <ellipse cx="480" cy="150" rx="72" ry="36" />
    <ellipse cx="480" cy="150" rx="108" ry="54" />
    <ellipse cx="480" cy="150" rx="144" ry="72" />
  </g>
  <circle cx="480" cy="150" r="3" fill="currentColor" />
  <g stroke-width="2.2" style="stroke: var(--good, #059669); fill: var(--good, #059669)">
    <line x1="556.3" y1="99.1" x2="535.85" y2="78.65" />
    <path d="M 530.9 73.7 L 538 76.5 L 533.7 80.8 Z" stroke-width="1" />
    <line x1="429.1" y1="73.7" x2="408.65" y2="94.15" />
    <path d="M 403.7 99.1 L 410.8 96.3 L 406.5 92 Z" stroke-width="1" />
    <line x1="403.7" y1="200.9" x2="424.15" y2="221.35" />
    <path d="M 429.1 226.3 L 426.3 219.2 L 422 223.5 Z" stroke-width="1" />
    <line x1="530.9" y1="226.3" x2="551.35" y2="205.85" />
    <path d="M 556.3 200.9 L 553.5 208 L 549.2 203.7 Z" stroke-width="1" />
  </g>
  <text x="480" y="296" text-anchor="middle" fill="currentColor">各向异性：<tspan font-style="italic">V</tspan> = ½<tspan font-style="italic">k</tspan>(<tspan font-style="italic">x</tspan>² + 4<tspan font-style="italic">y</tspan>²)</text>
  <text x="480" y="318" text-anchor="middle" fill="currentColor">转动改变势能，<tspan font-style="italic">L</tspan><tspan font-size="10" dy="4" font-style="italic">z</tspan><tspan dy="-4"> 不守恒</tspan></text>
</svg>
