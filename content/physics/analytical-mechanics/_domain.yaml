id: physics.analytical-mechanics
title: |
  分析力学
proofPolicy: full
macros:
  \vb: |
    \mathbf{#1}
  \uv: |
    \hat{\mathbf{#1}}
  \dd: |
    \mathop{}\!\mathrm{d}
  \dv: |
    \frac{\mathrm{d} #1}{\mathrm{d} #2}
  \pdv: |
    \frac{\partial #1}{\partial #2}
  \pb: |
    \left\{#1,#2\right\}
  \T: |
    ^{\mathsf{T}}
glossary:
  - id: physics.analytical-mechanics.constraint
    zh: |
      约束
    en: |
      constraint
    brief: |
      系统各质点的位置（有时还有速度）事先必须满足的条件，例如单摆的$x^2+y^2=l^2$。
    definedIn: physics.analytical-mechanics.constraints
    anchor: def-constraint
  - id: physics.analytical-mechanics.constraint-force
    zh: |
      约束力
    en: |
      constraint force
    brief: |
      维持约束的力，如绳子的拉力、斜面的支持力；大小事先不知道，要由运动定出。
    definedIn: physics.analytical-mechanics.constraints
    anchor: def-constraint
  - id: physics.analytical-mechanics.holonomic-constraint
    zh: |
      完整约束
    en: |
      holonomic constraint
    brief: |
      能写成坐标和时间之间的等式$f(\vb{r}_1,\dots,\vb{r}_N,t)=0$的约束。
    definedIn: physics.analytical-mechanics.constraints
    anchor: def-holonomic
  - id: physics.analytical-mechanics.nonholonomic-constraint
    zh: |
      非完整约束
    en: |
      nonholonomic constraint
    brief: |
      不能写成坐标和时间之间等式的约束，例如积不出来的速度关系、不等式。
    definedIn: physics.analytical-mechanics.constraints
    anchor: def-holonomic
  - id: physics.analytical-mechanics.scleronomic-constraint
    zh: |
      定常约束
    en: |
      scleronomic constraint
    brief: |
      等式里不显含时间的约束。
    definedIn: physics.analytical-mechanics.constraints
    anchor: def-scleronomic
  - id: physics.analytical-mechanics.rheonomic-constraint
    zh: |
      非定常约束
    en: |
      rheonomic constraint
    brief: |
      等式里显含时间的约束，例如套在匀速转动的铁丝上的珠子。
    definedIn: physics.analytical-mechanics.constraints
    anchor: def-scleronomic
  - id: physics.analytical-mechanics.degrees-of-freedom
    zh: |
      自由度
    en: |
      degrees of freedom
    brief: |
      确定系统位置所需的独立坐标个数；$N$个质点受$k$个独立的完整约束时是$3N-k$。
    definedIn: physics.analytical-mechanics.constraints
    anchor: def-dof
  - id: physics.analytical-mechanics.generalized-coordinates
    zh: |
      广义坐标
    en: |
      generalized coordinates
    brief: |
      唯一确定系统位置、彼此独立、个数等于自由度的一组数$q_1,\dots,q_n$，约束自动满足。
    definedIn: physics.analytical-mechanics.constraints
    anchor: def-generalized-coordinates
  - id: physics.analytical-mechanics.configuration-space
    zh: |
      位形空间
    en: |
      configuration space
    brief: |
      广义坐标所有可能取值组成的空间；系统的位置是其中的点，运动是其中的曲线。
    definedIn: physics.analytical-mechanics.constraints
    anchor: def-configuration-space
  - id: physics.analytical-mechanics.virtual-displacement
    zh: |
      虚位移
    en: |
      virtual displacement
    brief: |
      冻结时间时，和此刻的约束相容的无穷小位置改变$\delta\vb{r}_i=\sum_j\frac{\partial\vb{r}_i}{\partial q_j}\delta q_j$。
    definedIn: physics.analytical-mechanics.virtual-work
    anchor: def-virtual-displacement
  - id: physics.analytical-mechanics.applied-force
    zh: |
      主动力
    en: |
      applied force
    brief: |
      约束力以外的力，如重力、弹簧的弹力；它们是位置、速度、时间的已知函数。
    definedIn: physics.analytical-mechanics.virtual-work
    anchor: def-applied-force
  - id: physics.analytical-mechanics.virtual-work
    zh: |
      虚功
    en: |
      virtual work
    brief: |
      力在虚位移上做的功，主动力的虚功是$\delta W=\sum_i\vb{F}_i\cdot\delta\vb{r}_i$。
    definedIn: physics.analytical-mechanics.virtual-work
    anchor: def-virtual-work
  - id: physics.analytical-mechanics.ideal-constraint
    zh: |
      理想约束
    en: |
      ideal constraint
    brief: |
      约束力在任何虚位移上总虚功为零的约束，如光滑面、刚性杆、不可伸长的绳、纯滚动。
    definedIn: physics.analytical-mechanics.virtual-work
    anchor: def-ideal-constraint
  - id: physics.analytical-mechanics.virtual-work-principle
    zh: |
      虚功原理
    en: |
      principle of virtual work
    brief: |
      受定常的理想约束的系统静止，当且仅当主动力在任何虚位移上的虚功都为零。
    definedIn: physics.analytical-mechanics.virtual-work
    anchor: def-virtual-work-principle
  - id: physics.analytical-mechanics.generalized-force
    zh: |
      广义力
    en: |
      generalized force
    brief: |
      $Q_j=\sum_i\vb{F}_i\cdot\frac{\partial\vb{r}_i}{\partial q_j}$，使主动力的虚功写成$\delta W=\sum_j Q_j\delta q_j$。
    definedIn: physics.analytical-mechanics.virtual-work
    anchor: def-generalized-force
  - id: physics.analytical-mechanics.dalembert-principle
    zh: |
      达朗贝尔原理
    en: |
      d'Alembert's principle
    brief: |
      受理想约束的系统运动时，主动力和惯性力$-m_i\ddot{\vb{r}}_i$的总虚功为零。
    definedIn: physics.analytical-mechanics.virtual-work
    anchor: def-dalembert
  - id: physics.analytical-mechanics.generalized-velocity
    zh: |
      广义速度
    en: |
      generalized velocity
    brief: |
      广义坐标对时间的导数$\dot q_j$；在拉格朗日力学里和$q_j$当作互相独立的变量。
    definedIn: physics.analytical-mechanics.lagrange-equations
    anchor: def-generalized-velocity
  - id: physics.analytical-mechanics.lagrangian
    zh: |
      拉格朗日量
    en: |
      Lagrangian
    brief: |
      动能减势能$L(q,\dot q,t)=T-V$；它不是能量，加常数或乘非零常数不改变运动方程。
    definedIn: physics.analytical-mechanics.lagrange-equations
    anchor: def-lagrangian
  - id: physics.analytical-mechanics.lagrange-equations
    zh: |
      拉格朗日方程
    en: |
      Lagrange's equations
    brief: |
      $\frac{\mathrm{d}}{\mathrm{d}t}\frac{\partial L}{\partial\dot q_j}-\frac{\partial L}{\partial q_j}=0$，每个广义坐标一个，不含约束力。
    definedIn: physics.analytical-mechanics.lagrange-equations
    anchor: def-lagrange-equations
  - id: physics.analytical-mechanics.lagrange-equations-with-multipliers
    zh: |
      带乘子的拉格朗日方程
    en: |
      Lagrange's equations with multipliers
    brief: |
      多留坐标、保留约束$f=0$时的方程，右边是$\lambda\frac{\partial f}{\partial q_j}$；乘子$\lambda$给出约束力。
    definedIn: physics.analytical-mechanics.constraint-forces
    anchor: def-multiplier-equations
  - id: physics.analytical-mechanics.generalized-constraint-force
    zh: |
      广义约束力
    en: |
      generalized constraint force
    brief: |
      约束力的广义力$Q_j^{\mathrm{c}}=\sum_i\vb{R}_i\cdot\frac{\partial\vb{r}_i}{\partial q_j}$，等于$\lambda\frac{\partial f}{\partial q_j}$。
    definedIn: physics.analytical-mechanics.constraint-forces
    anchor: def-generalized-constraint-force
  - id: physics.analytical-mechanics.generalized-momentum
    zh: |
      广义动量
    en: |
      generalized momentum
    brief: |
      $p_j=\frac{\partial L}{\partial\dot q_j}$，也叫和$q_j$共轭的动量；坐标是角度时它是角动量。
    definedIn: physics.analytical-mechanics.cyclic-coordinates
    anchor: def-generalized-momentum
  - id: physics.analytical-mechanics.cyclic-coordinate
    zh: |
      循环坐标
    en: |
      cyclic coordinate
    brief: |
      拉格朗日量里不出现（只出现它的速度）的广义坐标；和它对应的广义动量守恒。
    definedIn: physics.analytical-mechanics.cyclic-coordinates
    anchor: def-cyclic-coordinate
  - id: physics.analytical-mechanics.energy-function
    zh: |
      能量函数
    en: |
      energy function
    brief: |
      $h=\sum_jp_j\dot q_j-L$，沿运动$\frac{\mathrm{d}h}{\mathrm{d}t}=-\frac{\partial L}{\partial t}$；$\vb{r}_i$不显含时间时等于机械能。
    definedIn: physics.analytical-mechanics.energy-function
    anchor: def-energy-function
  - id: physics.analytical-mechanics.action
    zh: |
      作用量
    en: |
      action
    brief: |
      拉格朗日量沿一条路径的积分$S[q]=\int_{t_1}^{t_2}L\,\mathrm{d}t$，量纲是能量乘时间。
    definedIn: physics.analytical-mechanics.hamiltons-principle
    anchor: def-action
  - id: physics.analytical-mechanics.hamiltons-principle
    zh: |
      哈密顿原理
    en: |
      Hamilton's principle
    brief: |
      在两端固定的路径中，真实运动使作用量取驻值（$\delta S=0$），与拉格朗日方程等价。
    definedIn: physics.analytical-mechanics.hamiltons-principle
    anchor: def-hamiltons-principle
  - id: physics.analytical-mechanics.continuous-symmetry
    zh: |
      连续对称性
    en: |
      continuous symmetry
    brief: |
      一族依赖连续参数$s$的变换$q\mapsto Q(q,s)$，使拉格朗日量的值不变（或只差一个全导数）。
    definedIn: physics.analytical-mechanics.noether-theorem
    anchor: def-continuous-symmetry
  - id: physics.analytical-mechanics.noether-theorem
    zh: |
      诺特定理
    en: |
      Noether's theorem
    brief: |
      拉格朗日量的连续对称性给出守恒量$\sum_jp_jK_j$；平移对应动量，转动对应角动量。
    definedIn: physics.analytical-mechanics.noether-theorem
    anchor: def-noether
  - id: physics.analytical-mechanics.hamiltonian
    zh: |
      哈密顿量
    en: |
      Hamiltonian
    brief: |
      用广义坐标和广义动量表示的能量函数$H(q,p,t)=\sum_jp_j\dot q_j-L$，是$L$对广义速度的勒让德变换。
    definedIn: physics.analytical-mechanics.hamiltons-equations
    anchor: def-hamiltonian
  - id: physics.analytical-mechanics.hamiltons-equations
    zh: |
      哈密顿正则方程
    en: |
      Hamilton's canonical equations
    brief: |
      $\dot q_j=\frac{\partial H}{\partial p_j}$，$\dot p_j=-\frac{\partial H}{\partial q_j}$：$2n$个一阶方程，和拉格朗日方程等价。
    definedIn: physics.analytical-mechanics.hamiltons-equations
    anchor: def-hamiltons-equations
  - id: physics.analytical-mechanics.phase-space
    zh: |
      相空间
    en: |
      phase space
    brief: |
      以全部广义坐标和广义动量$(q,p)$为坐标的$2n$维空间，系统的每个状态是其中的一点。
    definedIn: physics.analytical-mechanics.phase-space-liouville
    anchor: def-phase-space
  - id: physics.analytical-mechanics.phase-trajectory
    zh: |
      相轨道
    en: |
      phase trajectory
    brief: |
      系统的一个运动在相空间里画出的曲线；$H$不显含时间时，不同的相轨道不相交。
    definedIn: physics.analytical-mechanics.phase-space-liouville
    anchor: def-phase-space
  - id: physics.analytical-mechanics.phase-flow
    zh: |
      相流
    en: |
      phase flow
    brief: |
      让每个相点沿相轨道走$t$时间的映射$g_t$，它把一块区域$D_0$变成$D_t$。
    definedIn: physics.analytical-mechanics.phase-space-liouville
    anchor: def-phase-flow
  - id: physics.analytical-mechanics.liouville-theorem
    zh: |
      刘维尔定理
    en: |
      Liouville's theorem
    brief: |
      哈密顿系统的相流保持相空间的体积不变；$H$显含时间时也成立。
    definedIn: physics.analytical-mechanics.phase-space-liouville
    anchor: thm-liouville
  - id: physics.analytical-mechanics.poisson-bracket
    zh: |
      泊松括号
    en: |
      Poisson bracket
    brief: |
      $\{f,g\}=\sum_j\bigl(\frac{\partial f}{\partial q_j}\frac{\partial g}{\partial p_j}-\frac{\partial f}{\partial p_j}\frac{\partial g}{\partial q_j}\bigr)$；沿运动$\frac{\mathrm{d}f}{\mathrm{d}t}=\{f,H\}+\frac{\partial f}{\partial t}$。
    definedIn: physics.analytical-mechanics.poisson-brackets
    anchor: def-poisson-bracket
  - id: physics.analytical-mechanics.fundamental-poisson-brackets
    zh: |
      基本泊松括号
    en: |
      fundamental Poisson brackets
    brief: |
      坐标和动量之间的括号：$\{q_i,q_j\}=\{p_i,p_j\}=0$，$\{q_i,p_j\}=\delta_{ij}$。
    definedIn: physics.analytical-mechanics.poisson-brackets
    anchor: def-fundamental-brackets
  - id: physics.analytical-mechanics.jacobi-identity
    zh: |
      雅可比恒等式
    en: |
      Jacobi identity
    brief: |
      $\{f,\{g,h\}\}+\{g,\{h,f\}\}+\{h,\{f,g\}\}=0$，泊松括号的基本性质之一。
    definedIn: physics.analytical-mechanics.poisson-brackets
    anchor: thm-jacobi
  - id: physics.analytical-mechanics.poisson-theorem
    zh: |
      泊松定理
    en: |
      Poisson's theorem
    brief: |
      $H$不显含时间时，两个不显含时间的守恒量的泊松括号也守恒。
    definedIn: physics.analytical-mechanics.poisson-brackets
    anchor: thm-poisson
  - id: physics.analytical-mechanics.canonical-transformation
    zh: |
      正则变换
    en: |
      canonical transformation
    brief: |
      保持基本泊松括号、因而保持正则方程形式的换元$(q,p)\to(Q,P)$；显含时间时新哈密顿量要加上$\frac{\partial F}{\partial t}$。
    definedIn: physics.analytical-mechanics.canonical-transformations
    anchor: def-canonical-transformation
  - id: physics.analytical-mechanics.generating-function
    zh: |
      生成函数
    en: |
      generating function
    brief: |
      新旧变量各取一半的函数，如$F_2(q,P,t)$：$p=\frac{\partial F_2}{\partial q}$，$Q=\frac{\partial F_2}{\partial P}$，$K=H+\frac{\partial F_2}{\partial t}$。
    definedIn: physics.analytical-mechanics.canonical-transformations
    anchor: def-generating-function
  - id: physics.analytical-mechanics.hamilton-jacobi-equation
    zh: |
      哈密顿-雅可比方程
    en: |
      Hamilton–Jacobi equation
    brief: |
      $H\bigl(q,\frac{\partial S}{\partial q},t\bigr)+\frac{\partial S}{\partial t}=0$：让新哈密顿量为零的生成函数$S$满足的偏微分方程。
    definedIn: physics.analytical-mechanics.hamilton-jacobi
    anchor: def-hamilton-jacobi
  - id: physics.analytical-mechanics.complete-integral
    zh: |
      完全积分
    en: |
      complete integral
    brief: |
      哈密顿-雅可比方程含$n$个独立常数$\alpha_j$的解$S(q,\alpha,t)$；由$\frac{\partial S}{\partial\alpha_j}=\beta_j$解出运动。
    definedIn: physics.analytical-mechanics.hamilton-jacobi
    anchor: def-hamilton-jacobi
  - id: physics.analytical-mechanics.principal-function
    zh: |
      哈密顿主函数
    en: |
      Hamilton's principal function
    brief: |
      用作生成函数的完全积分$S(q,\alpha,t)$；沿真实运动$\frac{\mathrm{d}S}{\mathrm{d}t}=L$，它就是作用量。
    definedIn: physics.analytical-mechanics.hamilton-jacobi
    anchor: def-hamilton-jacobi
  - id: physics.analytical-mechanics.characteristic-function
    zh: |
      哈密顿特征函数
    en: |
      Hamilton's characteristic function
    brief: |
      $H$不显含时间时$S=W-Et$中的$W(q,\alpha)$，满足$H\bigl(q,\frac{\partial W}{\partial q}\bigr)=E$。
    definedIn: physics.analytical-mechanics.hamilton-jacobi
    anchor: def-characteristic-function
  - id: physics.analytical-mechanics.action-variable
    zh: |
      作用量变量
    en: |
      action variable
    brief: |
      周期运动的$I=\frac{1}{2\pi}\oint p\,\mathrm{d}q$，即相轨道围成的面积除以$2\pi$；它守恒，$H$只依赖它。
    definedIn: physics.analytical-mechanics.action-angle-variables
    anchor: def-action-variable
  - id: physics.analytical-mechanics.angle-variable
    zh: |
      角变量
    en: |
      angle variable
    brief: |
      和作用量变量$I$共轭的坐标$\theta=\frac{\partial W}{\partial I}$，以角频率$\omega=\frac{\mathrm{d}H}{\mathrm{d}I}$均匀增加，每个周期增加$2\pi$。
    definedIn: physics.analytical-mechanics.action-angle-variables
    anchor: def-angle-variable
  - id: physics.analytical-mechanics.adiabatic-invariant
    zh: |
      浸渐不变量
    en: |
      adiabatic invariant
    brief: |
      参数变化越慢、在整个过程中改变得越少的量；一个自由度周期运动的作用量变量就是。
    definedIn: physics.analytical-mechanics.adiabatic-invariants
    anchor: def-adiabatic-invariant
  - id: physics.analytical-mechanics.normal-coordinates
    zh: |
      简正坐标
    en: |
      normal coordinates
    brief: |
      使小振动的拉格朗日量变成$\frac12\sum_k(\dot\Theta_k^2-\omega_k^2\Theta_k^2)$的坐标$\Theta_k$，每个各自做简谐运动。
    definedIn: physics.analytical-mechanics.small-oscillations
    anchor: def-normal-coordinates
  - id: physics.analytical-mechanics.rotation-matrix
    zh: |
      转动矩阵
    en: |
      rotation matrix
    brief: |
      满足$R\T R=I$、$\det R=1$的$3\times3$实矩阵；描述刚体取向时，第$k$列是第$k$根体坐标轴的空间分量。
    definedIn: physics.analytical-mechanics.rigid-body-kinematics
    anchor: def-rotation-matrix
  - id: physics.analytical-mechanics.angular-velocity
    zh: |
      角速度矢量
    en: |
      angular velocity vector
    brief: |
      刚体绕固定点转动时，使刚体上每一点的速度都等于$\boldsymbol{\omega}\times\vb{r}$的唯一矢量$\boldsymbol{\omega}$。
    definedIn: physics.analytical-mechanics.rigid-body-kinematics
    anchor: def-angular-velocity
  - id: physics.analytical-mechanics.euler-angles
    zh: |
      欧拉角
    en: |
      Euler angles
    brief: |
      把转动矩阵写成$R_z(\varphi)R_x(\theta)R_z(\psi)$时的三个角，是描述刚体取向的常用广义坐标。
    definedIn: physics.analytical-mechanics.rigid-body-kinematics
    anchor: def-euler-angles
  - id: physics.analytical-mechanics.inertia-tensor
    zh: |
      惯性张量
    en: |
      inertia tensor
    brief: |
      元素为$I_{jk}=\sum_im_i(r_i^2\delta_{jk}-x_{ij}x_{ik})$的对称矩阵，把角速度变成角动量：$\vb{L}=I\boldsymbol{\omega}$。
    definedIn: physics.analytical-mechanics.inertia-tensor
    anchor: def-inertia-tensor
  - id: physics.analytical-mechanics.principal-axes
    zh: |
      惯量主轴
    en: |
      principal axes of inertia
    brief: |
      惯性张量的三个正交规范特征向量方向上的轴；角速度沿主轴时，角动量和它同向。
    definedIn: physics.analytical-mechanics.inertia-tensor
    anchor: def-principal-axes
  - id: physics.analytical-mechanics.euler-equations
    zh: |
      欧拉方程
    en: |
      Euler's equations
    brief: |
      在主轴坐标下写的刚体转动方程，如$I_1\dot\omega_1-(I_2-I_3)\omega_2\omega_3=\tau_1$，另两个轮换得到。
    definedIn: physics.analytical-mechanics.euler-equations
    anchor: thm-euler-equations
  - id: physics.analytical-mechanics.symmetric-top
    zh: |
      对称陀螺
    en: |
      symmetric top
    brief: |
      有两个主转动惯量相等（$I_1=I_2\ne I_3$）的刚体，第三根主轴是它的对称轴。
    definedIn: physics.analytical-mechanics.euler-equations
    anchor: def-symmetric-top
  - id: physics.analytical-mechanics.nutation
    zh: |
      章动
    en: |
      nutation
    brief: |
      重陀螺的对称轴一边进动、一边上下点头：倾角$\theta$在两个转折角之间周期性地来回变化。
    definedIn: physics.analytical-mechanics.heavy-symmetric-top
    anchor: def-nutation
  - id: physics.analytical-mechanics.lagrangian-density
    zh: |
      拉格朗日密度
    en: |
      Lagrangian density
    brief: |
      场的拉格朗日量对空间的密度$\mathcal L$，$L=\int\mathcal L\,\dd x$；弦的是$\frac12\mu y_t^2-\frac12Ty_x^2$。
    definedIn: physics.analytical-mechanics.field-lagrangian
    anchor: def-lagrangian-density
  - id: physics.analytical-mechanics.hamiltonian-density
    zh: |
      哈密顿密度
    en: |
      Hamiltonian density
    brief: |
      $\mathcal H=\pi y_t-\mathcal L$，$\pi=\partial\mathcal L/\partial y_t$；弦的是能量密度$\frac12\mu y_t^2+\frac12Ty_x^2$。
    definedIn: physics.analytical-mechanics.field-lagrangian
    anchor: def-hamiltonian-density
  - id: physics.analytical-mechanics.generalized-potential
    zh: |
      广义势
    en: |
      generalized potential
    brief: |
      依赖速度的函数$U(q,\dot q,t)$，使广义力$Q_j=-\frac{\partial U}{\partial q_j}+\frac{\dd}{\dd t}\frac{\partial U}{\partial\dot q_j}$，于是$L=T-U$。
    definedIn: physics.analytical-mechanics.charged-particle-lagrangian
    anchor: def-generalized-potential
  - id: physics.analytical-mechanics.integrable-system
    zh: |
      可积系统
    en: |
      integrable system
    brief: |
      $n$个自由度、有$n$个两两泊松括号为零且独立的守恒量的哈密顿系统；运动有界时轨道在不变环面上。
    definedIn: physics.analytical-mechanics.hamiltonian-chaos
    anchor: def-integrable-system
  - id: physics.analytical-mechanics.invariant-torus
    zh: |
      不变环面
    en: |
      invariant torus
    brief: |
      可积系统中运动有界时，作用量变量取定值的集合是$n$维环面；轨道留在上面，角变量匀速转动。
    definedIn: physics.analytical-mechanics.hamiltonian-chaos
    anchor: def-invariant-torus
  - id: physics.analytical-mechanics.poincare-section
    zh: |
      庞加莱截面
    en: |
      Poincaré section
    brief: |
      在能量面里取的一个截面，只记录轨道每次穿过它的位置；规则运动排成曲线，混沌散成一片。
    definedIn: physics.analytical-mechanics.hamiltonian-chaos
    anchor: def-poincare-section
  - id: physics.analytical-mechanics.standard-map
    zh: |
      标准映射
    en: |
      standard map
    brief: |
      受周期冲击的转子的庞加莱映射$p'=p+K\sin q$，$q'=q+p'$（取模$2\pi$），保持面积。
    definedIn: physics.analytical-mechanics.hamiltonian-chaos
    anchor: def-standard-map
  - id: physics.analytical-mechanics.kam-theorem
    zh: |
      KAM 定理
    en: |
      Kolmogorov–Arnold–Moser theorem
    abbr: |
      KAM
    brief: |
      可积系统受到小扰动后，频率足够无理的不变环面大多保留下来，只是稍微变形。
    definedIn: physics.analytical-mechanics.hamiltonian-chaos
    anchor: thm-kam
