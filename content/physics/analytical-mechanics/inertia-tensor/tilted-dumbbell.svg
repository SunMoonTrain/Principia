<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" width="380" height="330" font-size="14">
  <!-- 倾斜哑铃：两个质量 m 的小球在杆的两端，杆过 O、和竖直转轴成 β = 35° 角，刚体以角速度 ω 绕竖直轴转。
       L = 2ma²ω sinβ (−cosβ, 0, sinβ)：垂直于杆，在转轴和杆所在的平面里，和转轴成 90° − β 角。
       刚体转动时 L 跟着杆一起绕转轴转，箭头尖画出虚线圆；dL/dt = ω × L 此刻垂直纸面向外，要由轴承的力矩提供。 -->
  <line x1="190.0" y1="300.0" x2="190.0" y2="25.0" stroke-width="1.3" stroke-dasharray="6 4" style="stroke: var(--muted, #6b7280)" />
