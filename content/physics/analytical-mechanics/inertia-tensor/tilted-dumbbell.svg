  <path d="M 190.0 43.0 L 194.5 53.0 L 185.5 53.0 Z" style="fill: var(--accent, #2563eb)" />
  <text x="204.0" y="47.0" font-weight="bold" font-style="italic" style="fill: var(--accent, #2563eb)">ω</text>
  <ellipse cx="190.0" cy="126.2" rx="69.6" ry="19.5" fill="none" stroke-width="1.2" stroke-dasharray="4 4" style="stroke: var(--good, #059669)" />
  <line x1="250.2" y1="89.0" x2="129.8" y2="261.0" stroke-width="3" stroke="currentColor" />
