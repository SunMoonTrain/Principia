  <circle cx="129.8" cy="261.0" r="10" fill="currentColor" />
  <text x="264.2" y="85.0" font-style="italic" fill="currentColor">m</text>
  <text x="143.8" y="265.0" font-style="italic" fill="currentColor">m</text>
