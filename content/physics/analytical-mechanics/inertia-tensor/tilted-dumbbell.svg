  <text x="173.8" y="231.5" text-anchor="middle" font-style="italic" fill="currentColor">β</text>
  <path d="M 196.3 166.0 L 187.3 159.7 L 181.0 168.7" fill="none" stroke-width="1.2" stroke="currentColor" />
  <circle cx="190.0" cy="175.0" r="3.5" fill="currentColor" />
  <text x="200.0" y="191.0" font-style="italic" fill="currentColor">O</text>
