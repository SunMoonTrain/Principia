<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-size="14">
  <!-- 椭圆轨道：中心 (300, 160)，半长轴 230，半短轴 140，力心（焦点）在 (482.5, 160)。 -->
  <!-- 两块扇形对应相同的时间（平近点角各跨 0.42），面积相等：r² dφ/dt = p_φ/m 不变。 -->
  <ellipse cx="300" cy="160" rx="230" ry="140" fill="none" stroke="currentColor" stroke-width="1.8" />
  <!-- 近心点一侧的扇形：离得近，转得快 -->
  <path d="M 482.5 160.0 L 468.0 255.6 L 473.6 251.8 L 479.3 247.7 L 484.9 243.2 L 490.6 238.4 L 496.2 233.1 L 501.7 227.3 L 507.1 220.9 L 512.2 214.0 L 517.0 206.5 L 521.2 198.3 L 524.9 189.4 L 527.6 180.0 L 529.4 170.1 L 530.0 160.0 L 529.4 149.9 L 527.6 140.0 L 524.9 130.6 L 521.2 121.7 L 517.0 113.5 L 512.2 106.0 L 507.1 99.1 L 501.7 92.7 L 496.2 86.9 L 490.6 81.6 L 484.9 76.8 L 479.3 72.3 L 473.6 68.2 L 468.0 64.4 Z" stroke-width="1.2" style="fill: var(--accent, #2563eb); fill-opacity: 0.25; stroke: var(--accent, #2563eb)" />
  <!-- 远心点一侧的扇形：离得远，转得慢 -->
  <path d="M 482.5 160.0 L 71.6 143.6 L 71.4 144.8 L 71.2 146.0 L 71.0 147.1 L 70.8 148.3 L 70.7 149.5 L 70.5 150.6 L 70.4 151.8 L 70.3 153.0 L 70.2 154.1 L 70.1 155.3 L 70.1 156.5 L 70.0 157.7 L 70.0 158.8 L 70.0 160.0 L 70.0 161.2 L 70.0 162.3 L 70.1 163.5 L 70.1 164.7 L 70.2 165.9 L 70.3 167.0 L 70.4 168.2 L 70.5 169.4 L 70.7 170.5 L 70.8 171.7 L 71.0 172.9 L 71.2 174.0 L 71.4 175.2 L 71.6 176.4 Z" stroke-width="1.2" style="fill: var(--good, #059669); fill-opacity: 0.25; stroke: var(--good, #059669)" />
  <!-- 力心 -->
  <circle cx="482.5" cy="160" r="6" fill="currentColor" />
  <text x="470" y="182" text-anchor="end" fill="currentColor">力心</text>
  <!-- 两段弧的端点：质点在相同时间里走过的两段 -->
  <g style="fill: var(--accent, #2563eb)">
    <circle cx="468" cy="255.6" r="4.5" />
    <circle cx="468" cy="64.4" r="4.5" />
  </g>
  <g style="fill: var(--good, #059669)">
    <circle cx="71.6" cy="143.6" r="4.5" />
    <circle cx="71.6" cy="176.4" r="4.5" />
  </g>
  <text x="546" y="112" style="fill: var(--accent, #2563eb)">近：走得快</text>
  <text x="92" y="130" text-anchor="start" style="fill: var(--good, #059669)">远：走得慢</text>
  <text x="300" y="322" text-anchor="middle" fill="currentColor">相同时间扫过相同面积：<tspan font-style="italic">r</tspan>² d<tspan font-style="italic">φ</tspan>/d<tspan font-style="italic">t</tspan> = <tspan font-style="italic">p</tspan><tspan font-size="10" dy="4" font-style="italic">φ</tspan><tspan dy="-4"> / </tspan><tspan font-style="italic">m</tspan> 不变</text>
</svg>
