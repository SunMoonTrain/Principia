<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 430" width="470" height="430" font-size="14">
  <!-- 固定 q、t 时，L 随广义速度（横轴，标作 q 上加一点）变化的曲线（取 m = 1、V = 1：L = q̇²/2 − 1）。50 像素一个单位，原点在 (200, 200)。 -->
  <!-- 斜率 p = 2 的切线 L = 2q̇ − 3 切于 q̇ = 2，切点 (300, 150)；它在纵轴上的截距是 −H = −3，即 (200, 350)。 -->
  <!-- 坐标轴 -->
  <line x1="20" y1="200" x2="440" y2="200" stroke="currentColor" stroke-width="1.5" />
  <path d="M 450 200 L 440 196 L 440 204 Z" fill="currentColor" />
  <line x1="200" y1="412" x2="200" y2="16" stroke="currentColor" stroke-width="1.5" />
  <path d="M 200 6 L 196 16 L 204 16 Z" fill="currentColor" />
  <text x="440" y="222" fill="currentColor" font-style="italic">q</text>
  <circle cx="446" cy="209" r="1.6" fill="currentColor" />
  <text x="212" y="20" fill="currentColor" font-style="italic">L</text>
  <!-- 曲线 L = q̇²/2 − 1 -->
  <path d="M 45.0 9.7 L 50.0 25.0 L 55.0 39.8 L 60.0 54.0 L 65.0 67.8 L 70.0 81.0 L 75.0 93.8 L 80.0 106.0 L 85.0 117.8 L 90.0 129.0 L 95.0 139.8 L 100.0 150.0 L 105.0 159.8 L 110.0 169.0 L 115.0 177.8 L 120.0 186.0 L 125.0 193.8 L 130.0 201.0 L 135.0 207.8 L 140.0 214.0 L 145.0 219.8 L 150.0 225.0 L 155.0 229.8 L 160.0 234.0 L 165.0 237.8 L 170.0 241.0 L 175.0 243.8 L 180.0 246.0 L 185.0 247.8 L 190.0 249.0 L 195.0 249.8 L 200.0 250.0 L 205.0 249.8 L 210.0 249.0 L 215.0 247.7 L 220.0 246.0 L 225.0 243.7 L 230.0 241.0 L 235.0 237.7 L 240.0 234.0 L 245.0 229.7 L 250.0 225.0 L 255.0 219.7 L 260.0 214.0 L 265.0 207.7 L 270.0 201.0 L 275.0 193.7 L 280.0 186.0 L 285.0 177.7 L 290.0 169.0 L 295.0 159.7 L 300.0 150.0 L 305.0 139.7 L 310.0 129.0 L 315.0 117.7 L 320.0 106.0 L 325.0 93.7 L 330.0 81.0 L 335.0 67.7 L 340.0 54.0 L 345.0 39.7 L 350.0 25.0 L 355.0 9.7" fill="none" stroke="currentColor" stroke-width="2.5" />
  <!-- 斜率为 p 的切线 -->
  <line x1="180" y1="390" x2="370" y2="10" stroke-width="2" style="stroke: var(--accent, #2563eb)" />
  <text x="366" y="74" style="fill: var(--accent, #2563eb)">斜率 <tspan font-style="italic">p</tspan></text>
  <!-- 切点和它的横坐标 -->
  <line x1="300" y1="150" x2="300" y2="200" stroke-width="1.2" stroke-dasharray="4 3" style="stroke: var(--muted, #6b7280)" />
  <circle cx="300" cy="150" r="5" stroke="currentColor" stroke-width="1.2" style="fill: var(--accent, #2563eb)" />
  <text x="312" y="168" fill="currentColor">切点：这里 <tspan font-style="italic">L</tspan> 的斜率是 <tspan font-style="italic">p</tspan></text>
  <!-- 截距 −H，以及纵轴上长为 H 的一段 -->
  <circle cx="200" cy="350" r="5" stroke="currentColor" stroke-width="1.2" style="fill: var(--accent, #2563eb)" />
  <text x="190" y="355" text-anchor="end" fill="currentColor">−<tspan font-style="italic">H</tspan></text>
  <g stroke-width="1.6" style="stroke: var(--good, #059669)">
    <line x1="150" y1="200" x2="150" y2="350" />
    <line x1="144" y1="200" x2="156" y2="200" />
    <line x1="144" y1="350" x2="156" y2="350" />
  </g>
  <text x="140" y="280" text-anchor="end" font-style="italic" style="fill: var(--good, #059669)">H</text>
  <text x="235" y="426" text-anchor="middle" fill="currentColor">斜率为 <tspan font-style="italic">p</tspan> 的切线在纵轴上截出 −<tspan font-style="italic">H</tspan></text>
</svg>
