<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-size="14">
  <!-- 左：竖直圆环上的珠子，θ 从竖直向下的方向量起，图里 θ = 50°。右：(θ, r) 平面里的约束线 r = R。 -->
  <!-- 圆环 -->
  <circle cx="200" cy="150" r="110" fill="none" stroke="currentColor" stroke-width="2.5" />
  <circle cx="200" cy="150" r="3" fill="currentColor" />
  <line x1="200" y1="150" x2="200" y2="270" stroke-width="1.2" stroke-dasharray="4 4" style="stroke: var(--muted, #6b7280)" />
  <line x1="200" y1="150" x2="122.2" y2="72.2" stroke-width="1.2" stroke-dasharray="4 4" style="stroke: var(--muted, #6b7280)" />
  <text x="150" y="104" text-anchor="end" fill="currentColor" font-style="italic">R</text>
  <line x1="200" y1="150" x2="284.3" y2="220.7" stroke-width="1" style="stroke: var(--muted, #6b7280)" />
  <path d="M 200 185 A 35 35 0 0 0 226.8 172.5" fill="none" stroke-width="1.5" style="stroke: var(--accent, #2563eb)" />
  <text x="219" y="200" text-anchor="middle" fill="currentColor" font-style="italic">θ</text>
  <!-- 允许的方向：切向 -->
  <g stroke-width="2" style="stroke: var(--good, #059669); fill: var(--good, #059669)">
    <line x1="284.3" y1="220.7" x2="310.6" y2="189.3" stroke-dasharray="5 3" />
    <path d="M 316.4 182.4 L 313.3 191.6 L 307.9 187.1 Z" stroke-width="1" />
  </g>
  <text x="322" y="182" style="fill: var(--good, #059669)">允许的方向</text>
  <!-- 约束力：沿半径 -->
  <g style="stroke: var(--accent, #2563eb); fill: var(--accent, #2563eb)">
    <line x1="284.3" y1="220.7" x2="249.1" y2="191.1" stroke-width="3" />
    <path d="M 242.2 185.3 L 251.4 188.4 L 246.8 193.8 Z" stroke-width="1" />
  </g>
  <text x="250" y="174" text-anchor="end" font-weight="bold" style="fill: var(--accent, #2563eb)">N</text>
  <!-- 重力 -->
  <line x1="284.3" y1="220.7" x2="284.3" y2="266.7" stroke="currentColor" stroke-width="2" />
  <path d="M 284.3 275.7 L 280.3 266.7 L 288.3 266.7 Z" fill="currentColor" />
  <text x="292" y="272" fill="currentColor" font-style="italic">mg</text>
  <!-- 珠子 -->
  <circle cx="284.3" cy="220.7" r="7.5" stroke="currentColor" stroke-width="1.5" style="fill: var(--bg, #ffffff)" />

  <!-- 右：位形空间 (θ, r) -->
  <line x1="390" y1="250" x2="612" y2="250" stroke="currentColor" stroke-width="1.5" />
  <path d="M 620 250 L 610 246 L 610 254 Z" fill="currentColor" />
  <line x1="390" y1="250" x2="390" y2="48" stroke="currentColor" stroke-width="1.5" />
  <path d="M 390 40 L 386 50 L 394 50 Z" fill="currentColor" />
  <text x="616" y="270" text-anchor="end" fill="currentColor" font-style="italic">θ</text>
  <text x="376" y="52" text-anchor="end" fill="currentColor" font-style="italic">r</text>
  <!-- 约束线 f = r − R = 0 -->
  <line x1="390" y1="160" x2="606" y2="160" stroke-width="3" style="stroke: var(--muted, #6b7280)" />
  <text x="376" y="165" text-anchor="end" fill="currentColor" font-style="italic">R</text>
  <text x="604" y="182" text-anchor="end" style="fill: var(--muted, #6b7280)"><tspan font-style="italic">f</tspan> = <tspan font-style="italic">r</tspan> − <tspan font-style="italic">R</tspan> = 0</text>
  <!-- 允许的 δq：沿约束线 -->
  <g stroke-width="2" style="stroke: var(--good, #059669); fill: var(--good, #059669)">
    <line x1="480" y1="160" x2="541" y2="160" stroke-dasharray="5 3" />
    <path d="M 550 160 L 540 156 L 540 164 Z" stroke-width="1" />
  </g>
  <text x="520" y="150" text-anchor="middle" style="fill: var(--good, #059669)">允许的 δ<tspan font-style="italic">q</tspan></text>
  <!-- ∇f 和广义约束力 λ∇f：垂直于约束线 -->
  <g style="stroke: var(--accent, #2563eb); fill: var(--accent, #2563eb)">
    <line x1="480" y1="160" x2="480" y2="99" stroke-width="3" />
    <path d="M 480 90 L 476 100 L 484 100 Z" stroke-width="1" />
  </g>
  <text x="488" y="98" style="fill: var(--accent, #2563eb)">λ∇<tspan font-style="italic">f</tspan></text>
  <circle cx="480" cy="160" r="6" stroke="currentColor" stroke-width="1.5" style="fill: var(--bg, #ffffff)" />
  <text x="200" y="295" text-anchor="middle" fill="currentColor">圆环上的珠子</text>
  <text x="505" y="295" text-anchor="middle" fill="currentColor">位形空间里，约束力和允许的挪动垂直</text>
</svg>
