- id: p1
  tier: easy
  statement: |
    三维空间里，两个小球用一根长度固定的轻杆连在一起（像一个哑铃），在空中自由运动。这个系统的:term[自由度]{id="physics.analytical-mechanics.degrees-of-freedom"}是多少？
  answer:
    type: number
    value: 5
  hints:
    - |
      先数两个小球一共有几个坐标，再数轻杆给了几个:term[约束]{id="physics.analytical-mechanics.constraint"}。
    - |
      两个小球一共 6 个坐标；轻杆只给一个约束$|\vb{r}_1-\vb{r}_2|=l$。
    - |
      自由度$n=3N-k=6-1=5$。直观地看：质心的位置要 3 个数，杆的方向要 2 个角度（像地球上的经度和纬度），一共 5 个；绕杆自身转动不改变两个小球的位置，不算。

      答案是$5$。
  solution: |
    $n=3\times2-1=5$：质心的位置 3 个数，加上杆的方向 2 个角度。

- id: p2
  tier: easy
  statement: |
    下面哪些约束是:term[完整约束]{id="physics.analytical-mechanics.holonomic-constraint"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        质点在球面$x^2+y^2+z^2=R^2$上运动
      - |
        圆柱在水平直线上纯滚动：$\dot x=R\dot\varphi$
      - |
        冰刀只能沿刀刃方向滑行：$\dot x\sin\theta-\dot y\cos\theta=0$
      - |
        珠子套在匀速转动的直铁丝上：$y=x\tan\omega t$
    value: [1, 2, 4]
  hints:
    - |
      :term[完整约束]{id="physics.analytical-mechanics.holonomic-constraint"}是能写成坐标和时间之间等式的约束。速度之间的关系要看能不能积分；显含时间不影响这个判断。
    - |
      B 两边对时间积分得$x-R\varphi=C$；C 就是例 2 的冰刀；D 显含时间，但仍然是坐标和时间之间的等式。
    - |
      A 是坐标之间的等式，是完整约束。B 积分后是$x-R\varphi=C$，也是完整约束。C 积不出坐标之间的等式（冰刀能从任意位置滑到任意位置），是:term[非完整约束]{id="physics.analytical-mechanics.nonholonomic-constraint"}。D 是坐标和时间之间的等式，是完整约束，只不过是:term[非定常约束]{id="physics.analytical-mechanics.rheonomic-constraint"}。

      答案是 A、B、D。
  solution: |
    A、B、D 是完整约束，C 不是。D 显含时间，是非定常的完整约束：「完整」和「定常」是两种互不相干的分法。

- id: p3
  tier: medium
  statement: |
    三维空间里，三根轻杆首尾相连成一条链，相邻两根杆在连接处可以自由转动。链的上端用能自由转动的铰链挂在天花板上的一点，每根杆的下端各连着一个小球（一共 3 个小球，杆的质量不计）。这个系统的:term[自由度]{id="physics.analytical-mechanics.degrees-of-freedom"}是多少？
  answer:
    type: number
    value: 6
  hints:
    - |
      天花板上的固定点不是要描述的质点，要数的只有 3 个小球。先数坐标，再数:term[约束]{id="physics.analytical-mechanics.constraint"}，最后检查约束是不是相互独立。
    - |
      3 个小球一共 9 个坐标。第 1 根杆规定第 1 个小球到固定点的距离，第 2、3 根杆分别规定相邻两个小球之间的距离，一共 3 个约束。
    - |
      这 3 个约束相互独立：从上往下，每个小球只比上一个多一个约束，确定它的位置还要 2 个角度（它上面那根杆的方向）。所以$n=3\times3-3=6$，可以取三根杆各自的方向角（每根两个）作为:term[广义坐标]{id="physics.analytical-mechanics.generalized-coordinates"}。

      答案是$6$。
  solution: |
    $n=3\times3-3=6$，每根杆的方向贡献两个角度。

- id: p4
  tier: medium
  statement: |
    平面上 5 个小球依次用 5 根轻杆连成一个五边形，杆的两端都可以自由转动，所以五边形的形状能变。再用一根轻杆把 1 号球和 3 号球连起来。整个系统在这个平面内运动，:term[自由度]{id="physics.analytical-mechanics.degrees-of-freedom"}是多少？
  answer:
    type: number
    value: 4
  hints:
    - |
      先算$2N-k$，再检查这$k$个:term[约束]{id="physics.analytical-mechanics.constraint"}是不是相互独立。
    - |
      1、2、3 号球和杆 12、23、13 组成一个刚性三角形；1、3、4、5 号球和杆 13、34、45、51 组成一个四边形，四条边的长度固定时，四边形的形状还能变。
    - |
      $N=5$，$k=6$，$2N-k=4$。检查独立性：刚性三角形在平面里有 3 个自由度（平移两个方向、转一个角度）；三角形定了以后 1、3 号球就定了，四边形 1345 还剩 1 个自由度（4 号球绕 3 号球转过的角度一定，5 号球就跟着定了）。2 号球由三角形定死，不再多出自由度。

      一共$3+1=4$，和$2N-k$一致，说明 6 个约束相互独立。答案是$4$。
  solution: |
    $2\times5-6=4$：刚性三角形 123 贡献 3 个（平面里的平移和转动），四边形 1345 还能变形，再贡献 1 个。

- id: p5
  tier: hard
  statement: |
    三维空间里一个刚体由$N\ge3$个质点组成，这些质点不全在一条直线上，任意两个质点之间的距离固定。证明它的:term[自由度]{id="physics.analytical-mechanics.degrees-of-freedom"}是$6$，与$N$无关。
  hints:
    - |
      先取三个不共线的质点$A$、$B$、$C$，算出它们的自由度；再说明其余每个质点都不带来新的自由度。
    - |
      $A$可以在空间任意放（3 个数），$B$在以$A$为球心的球面上（2 个数），$C$在以$A$、$B$为球心的两个球面的交线上，那是一个圆（1 个数）。别的质点$P$到$A$、$B$、$C$的距离都固定，而以$A$、$B$、$C$为球心的三个球面最多交于两点，这两点关于平面$ABC$对称。
    - |
      先看$A$、$B$、$C$：$A$的位置任意，要 3 个数；$|AB|$固定，$B$在以$A$为球心的球面上，要 2 个数；$|AC|$、$|BC|$固定，$C$在两个球面的交线上，因为$C$不在直线$AB$上，这条交线是半径不为零的圆，要 1 个数。所以这三个质点的 9 个坐标里有 6 个能独立变化，3 个距离:term[约束]{id="physics.analytical-mechanics.constraint"}相互独立。

      再看其余任一质点$P$：它在以$A$、$B$、$C$为球心的三个球面的交点上。球心不共线时三个球面最多交于两点，两点关于平面$ABC$互为镜像（$P$在平面上时两点重合）。四面体$PABC$的六条棱长都固定，$P$到平面$ABC$的距离也就固定，刚体连续运动时$P$始终在平面的同一侧，不会跳到镜像点去。所以$A$、$B$、$C$的位置一定，$P$就定了：$P$的 3 个坐标被 3 个约束完全确定，不增加自由度。

      于是自由度是$6$。按$3N-k$验算：相互独立的约束有$3+3(N-3)=3N-6$个（其余的距离约束都能由它们推出），$3N-(3N-6)=6$。如果质点全在一条直线上，$C$就找不到，绕这条直线的转动不移动任何质点，自由度是$5$（见 p1）。
  reference: |
    取不共线的$A$、$B$、$C$：$A$任意（3），$B$在以$A$为心的球面上（2），$C$在两球面交成的非退化圆上（1），共 6，三个距离约束独立。其余质点$P$在以$A$、$B$、$C$为心的三球面交点上，至多两点且关于平面$ABC$对称；$P$到平面$ABC$的距离由固定的棱长决定，连续运动中$P$不换侧，故$P$由$A$、$B$、$C$唯一确定，不增加自由度。总自由度$6$；独立约束数$3N-6$。全共线时为$5$。

- id: p6
  tier: hard
  statement: |
    一枚半径$R$的硬币竖直立在水平面上滚动，不打滑，也不倒下；它可以一边滚一边转弯，也可以绕竖直轴原地转。用接触点的位置$(x,y)$、硬币平面和$x$轴的夹角$\theta$、硬币绕自己的轴转过的角度$\varphi$描述它的位置，不打滑的条件是

    $$
    \dot x=R\dot\varphi\cos\theta,\qquad \dot y=R\dot\varphi\sin\theta .
    $$

    证明：从任意位置$(x_0,y_0,\theta_0,\varphi_0)$出发，都能在满足这两个条件的前提下到达任意位置$(x_1,y_1,\theta_1,\varphi_1)$。并由此说明，这两个条件以及它们的任何组合都不能写成坐标之间的等式，即它们是:term[非完整约束]{id="physics.analytical-mechanics.nonholonomic-constraint"}。
  hints:
    - |
      仿照例 2：先找出满足约束的几种「基本动作」，再把它们拼起来。难点在$\varphi$：直着滚到目标点时$\varphi$跟着变，怎么把它单独调到想要的值？
    - |
      原地转（只有$\dot\theta\ne0$）和沿当前朝向直滚都满足约束。一边滚一边匀速转弯，接触点走一个圆：滚完一整圈回到原处、朝向也复原，$\varphi$却多转了$2\pi\rho/R$，其中圆的半径$\rho$可以随意取。
    - |
      满足约束的基本动作有两种：原地转，$\dot x=\dot y=\dot\varphi=0$，$\theta$随意变；沿当前朝向滚，$\theta$不变，接触点沿$(\cos\theta,\sin\theta)$方向以速率$R\dot\varphi$前进。两者同时进行、$\dot\theta=\Omega$和$\dot\varphi=\omega$都是常数时，接触点以速率$R|\omega|$绕圈，圆的半径$\rho=R|\omega/\Omega|$。

      设起点到目标点的距离是$d$。先在起点滚一整个半径为$\rho$的圆：接触点回到$(x_0,y_0)$，$\theta$增加$2\pi$（朝向复原），$\varphi$增加$2\pi\rho/R$。再原地转到正对目标点的方向，直着滚过距离$d$，$\varphi$又增加$d/R$；最后原地转到$\theta_1$。终点的转角是$\varphi_0+2\pi\rho/R+d/R$；取$\rho=\frac{R}{2\pi}\bigl(\varphi_1-\varphi_0-\frac{d}{R}+2\pi m\bigr)$，整数$m$取得足够大使$\rho>0$，终点的转角就和$\varphi_1$相差$2\pi$的整数倍，是同一个位置。

      所以四维的$(x,y,\theta,\varphi)$空间里，任意两点都能用满足约束的运动连起来。如果这两个条件或它们的某种组合等价于坐标之间的等式$f(x,y,\theta,\varphi)=C$，$f$就沿所有允许的运动不变，于是在所有位置上取同一个值，只能是常数。所以它们都是非完整约束：确定硬币的位置仍然要 4 个数，约束只限制了速度。
  reference: |
    基本动作：原地转（只改$\theta$）；沿朝向直滚（$\theta$不变，$\varphi$随路程$s$增加$s/R$）；两者同时以常速进行时接触点走半径$\rho=R|\omega/\Omega|$的圆。先在起点滚一整圈半径$\rho$的圆，回到原处、朝向复原、$\varphi$增加$2\pi\rho/R$；再转向、直滚距离$d$、转到$\theta_1$。取$\rho=\frac{R}{2\pi}(\varphi_1-\varphi_0-d/R+2\pi m)>0$即得任意目标。四维空间里处处可达，故沿允许运动守恒的函数只能是常数，任何组合都积不成坐标之间的等式，两个约束都是非完整约束。

- id: p7
  tier: thinking
  statement: |
    冰刀的位置要$x$、$y$、$\theta$三个数，可在任一时刻，它的速度只能是「顺着刀刃滑」和「原地转」两种方式的组合。那么冰刀的:term[自由度]{id="physics.analytical-mechanics.degrees-of-freedom"}应该算 3 还是 2？为什么对只受:term[完整约束]{id="physics.analytical-mechanics.holonomic-constraint"}的系统，这两种数法总是一样？这个区别对写运动方程会有什么影响？
  hints:
    - |
      分清两件事：确定位置要几个数；某一时刻速度有几个能独立选择的方向。
    - |
      完整约束$f(\vb{r}_1,\dots,\vb{r}_N,t)=0$对时间求导，得到一个速度之间的关系，所以它同时去掉一个坐标和一个速度方向。非完整约束只给速度之间的关系，没有对应的坐标可以去掉。
    - |
      这里有两个不同的数：描述位置的独立坐标有 3 个（$x$、$y$、$\theta$），某一时刻能独立选择的速度方向只有 2 个。有的书把前者叫自由度，有的书对非完整系统把后者叫自由度，所以讨论时要说清用的是哪一个。

      对完整约束，每个约束$f=0$能解出一个坐标，对时间求导得到的速度之间的关系又正好去掉一个速度方向，两个数同时减一，所以总是相等。也正因为如此，完整系统可以选出:term[广义坐标]{id="physics.analytical-mechanics.generalized-coordinates"}，让每个广义坐标和它的速度都能随意变化。

      非完整约束积不出坐标之间的等式，坐标的个数减不下来，速度方向却少了。写运动方程时就不能只用 2 个坐标、把约束忘掉：要保留 3 个坐标，再把速度之间的关系作为额外的方程留着，相应的:term[约束力]{id="physics.analytical-mechanics.constraint-force"}作为未知数一起解出来。处理这类问题的办法，在讲约束力的那一节里会讲到。
  reference: |
    两个数：位置坐标数 3，独立速度方向数 2。完整约束$f=0$既消去一个坐标，其时间导数又消去一个速度方向，故两数相等，可以选出能随意变化的广义坐标；非完整约束只减少速度方向，不能减少坐标。所以非完整系统不能只用较少的坐标写运动方程，必须保留全部坐标、把速度约束当作附加方程，约束力作为未知量一起求（拉格朗日乘子）。

- id: p8
  tier: thinking
  statement: |
    球面摆的摆球在以悬点为中心、半径$l$的球面上运动，常用$\theta$（摆线和竖直向下方向的夹角）和$\varphi$（方位角）作:term[广义坐标]{id="physics.analytical-mechanics.generalized-coordinates"}。$\theta=0$时这组坐标有什么毛病？能不能另找两个数，在整个球面上都能唯一确定位置，而且相邻的位置对应相邻的数？这对广义坐标的定义意味着什么？
  hints:
    - |
      $\theta=0$时摆球在哪里？这时$\varphi$取不同的值，位置变不变？
    - |
      想想地球仪上的经纬度在北极的情形。如果有一组在整个球面上都好用的坐标，就得到一个从球面到平面、一一对应的连续映射。
    - |
      $\theta=0$时摆球在最低点，不管$\varphi$取什么值都是同一个位置：$\varphi$在这里没有意义，坐标和位置不再一一对应，以后写出的运动方程里也会出现$1/\sin\theta$这样的项。把「极点」挪到别处（例如从水平方向量起角度）只是把毛病搬到另一个点，去不掉。

      原因在于球面本身：任何从球面到平面的连续映射，都会把某一对对径点映到同一个点（博苏克-乌拉姆定理，Borsuk–Ulam theorem），所以不存在一一对应的连续映射，也就不存在在整个球面上都好用的两个坐标。

      这说明广义坐标一般只在:term[位形空间]{id="physics.analytical-mechanics.configuration-space"}的一部分上好用。要覆盖整个位形空间，可以准备几组坐标，各管一片，在重叠的地方互相换算，就像一本地图册。单摆的$\theta$也有类似的现象：$\theta$和$\theta+2\pi$是同一个位置，位形空间是圆而不是直线，只是这不妨碍在每个位置附近使用$\theta$。
  reference: |
    $\theta=0$时$\varphi$不确定，坐标与位置不一一对应，方程中出现$1/\sin\theta$。整体的两参数坐标不存在：由博苏克-乌拉姆定理，球面到平面的连续映射必把某对对径点映到同一点，不可能一一对应。故广义坐标一般只是局部的，需用几组坐标覆盖位形空间、在重叠处换算（地图册）。单摆的$\theta$与$\theta+2\pi$代表同一位置，位形空间是圆。
