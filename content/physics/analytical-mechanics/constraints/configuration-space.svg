<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-size="14">
  <!-- 线条和文字用 currentColor，强调色用页面的 CSS 变量（带默认值），亮色、暗色主题下都看得清 -->
  <!-- 左：双摆。悬点 (160, 50)，杆长 100、90；θ1 = 35°，θ2 = 70°，都从竖直向下的方向量起 -->
  <line x1="112" y1="50" x2="208" y2="50" stroke="currentColor" stroke-width="2" />
  <g stroke="currentColor" stroke-width="1">
    <line x1="122" y1="50" x2="114" y2="42" />
    <line x1="136" y1="50" x2="128" y2="42" />
    <line x1="150" y1="50" x2="142" y2="42" />
    <line x1="164" y1="50" x2="156" y2="42" />
    <line x1="178" y1="50" x2="170" y2="42" />
    <line x1="192" y1="50" x2="184" y2="42" />
    <line x1="206" y1="50" x2="198" y2="42" />
  </g>
  <!-- 竖直向下的参考线 -->
  <g stroke-width="1.2" stroke-dasharray="4 4" style="stroke: var(--muted, #6b7280)">
    <line x1="160" y1="50" x2="160" y2="160" />
    <line x1="217.4" y1="131.9" x2="217.4" y2="215" />
  </g>
  <!-- 两根杆 -->
  <line x1="160" y1="50" x2="217.4" y2="131.9" stroke="currentColor" stroke-width="2" />
  <line x1="217.4" y1="131.9" x2="302" y2="162.7" stroke="currentColor" stroke-width="2" />
  <!-- 两个摆角 -->
  <g fill="none" stroke-width="1.6" style="stroke: var(--accent, #2563eb)">
    <path d="M 160 85 A 35 35 0 0 0 180.1 78.7" />
    <path d="M 217.4 161.9 A 30 30 0 0 0 245.6 142.2" />
  </g>
  <text x="176" y="104" text-anchor="middle" fill="currentColor"><tspan font-style="italic">θ</tspan><tspan font-size="10" dy="4">1</tspan></text>
  <text x="244" y="174" text-anchor="middle" fill="currentColor"><tspan font-style="italic">θ</tspan><tspan font-size="10" dy="4">2</tspan></text>
  <text x="200" y="84" fill="currentColor"><tspan font-style="italic">l</tspan><tspan font-size="10" dy="4">1</tspan></text>
  <text x="263" y="135" fill="currentColor"><tspan font-style="italic">l</tspan><tspan font-size="10" dy="4">2</tspan></text>
  <!-- 悬点和两个摆球 -->
  <circle cx="160" cy="50" r="3" fill="currentColor" />
  <g style="fill: var(--accent, #2563eb)">
    <circle cx="217.4" cy="131.9" r="8" />
    <circle cx="302" cy="162.7" r="8" />
  </g>
  <text x="205" y="282" text-anchor="middle" fill="currentColor">双摆：两个角度确定位置</text>

  <!-- 右：位形空间。横轴 θ1、纵轴 θ2，都从 −π 到 π；中心 (490, 140) 是 (0, 0) -->
  <rect x="390" y="40" width="200" height="200" fill="none" stroke="currentColor" stroke-width="1.5" />
  <g stroke-width="1" stroke-dasharray="3 4" style="stroke: var(--muted, #6b7280)">
    <line x1="490" y1="40" x2="490" y2="240" />
    <line x1="390" y1="140" x2="590" y2="140" />
  </g>
  <!-- 粘起来的边：左右两边各一个箭头，上下两边各两个箭头 -->
  <g fill="none" stroke="currentColor" stroke-width="1.6">
    <path d="M 384 147 L 390 137 L 396 147" />
    <path d="M 584 147 L 590 137 L 596 147" />
    <path d="M 482 34 L 491 40 L 482 46" />
    <path d="M 490 34 L 499 40 L 490 46" />
    <path d="M 482 234 L 491 240 L 482 246" />
    <path d="M 490 234 L 499 240 L 490 246" />
  </g>
  <!-- 一段运动：从右边出去，从左边进来；从上边出去，从下边进来 -->
  <g fill="none" stroke-width="2" stroke-linecap="round" style="stroke: var(--accent, #2563eb); opacity: 0.85">
    <path d="M 420 205 C 450 170, 480 120, 509.4 101.1 C 540 82, 565 72, 590 68" />
    <path d="M 390 68 C 405 66, 425 58, 445 40" />
    <path d="M 445 240 C 452 232, 460 224, 470 216" />
  </g>
  <circle cx="509.4" cy="101.1" r="5.5" style="fill: var(--accent, #2563eb)" />
  <text x="517" y="124" fill="currentColor">左图的位置</text>
  <text x="390" y="258" text-anchor="middle" fill="currentColor">−π</text>
  <text x="590" y="258" text-anchor="middle" fill="currentColor">π</text>
  <text x="490" y="262" text-anchor="middle" fill="currentColor"><tspan font-style="italic">θ</tspan><tspan font-size="10" dy="4">1</tspan></text>
  <text x="380" y="45" text-anchor="end" fill="currentColor">π</text>
  <text x="380" y="244" text-anchor="end" fill="currentColor">−π</text>
  <text x="376" y="145" text-anchor="end" fill="currentColor"><tspan font-style="italic">θ</tspan><tspan font-size="10" dy="4">2</tspan></text>
  <text x="490" y="290" text-anchor="middle" fill="currentColor">位形空间：对边粘起来是环面</text>
</svg>
