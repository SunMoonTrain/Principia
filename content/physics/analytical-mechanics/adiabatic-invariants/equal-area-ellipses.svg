<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 390" width="480" height="390" font-size="14">
  <!-- 谐振子 H = p²/2 + ω²q²/2（取 m = 1），(q, p) 平面，90 像素一个单位，原点在 (240, 180)。 -->
  <!-- 开始 ω = 1、E = 0.5：相轨道是半径 1 的圆。ω 缓慢变到 3 以后，I = E/ω = 0.5 不变，E = 1.5： -->
  <!-- 相轨道是半轴 √(2E)/ω = 1/√3 ≈ 0.577（q 方向）和 √(2E) = √3 ≈ 1.732（p 方向）的椭圆。两者面积都是 π。 -->
  <!-- 两块区域 -->
  <circle cx="240" cy="180" r="90" stroke-width="2" stroke-dasharray="6 4" fill-opacity="0.12" style="stroke: var(--accent, #2563eb); fill: var(--accent, #2563eb)" />
  <ellipse cx="240" cy="180" rx="52" ry="155.9" stroke-width="2.4" fill-opacity="0.12" style="stroke: var(--good, #059669); fill: var(--good, #059669)" />
  <!-- 坐标轴 -->
  <line x1="60" y1="180" x2="412" y2="180" stroke="currentColor" stroke-width="1.2" />
  <path d="M 422 180 L 412 176 L 412 184 Z" fill="currentColor" />
  <line x1="240" y1="352" x2="240" y2="14" stroke="currentColor" stroke-width="1.2" />
  <path d="M 240 4 L 236 14 L 244 14 Z" fill="currentColor" />
  <text x="420" y="200" text-anchor="end" fill="currentColor" font-style="italic">q</text>
  <text x="250" y="16" fill="currentColor" font-style="italic">p</text>
  <!-- 标注 -->
  <line x1="176.4" y1="116.4" x2="128" y2="84" stroke-width="1" style="stroke: var(--accent, #2563eb)" />
  <text x="124" y="80" text-anchor="end" style="fill: var(--accent, #2563eb)">开始：<tspan font-style="italic">ω</tspan> = 1</text>
  <line x1="285" y1="102" x2="338" y2="74" stroke-width="1" style="stroke: var(--good, #059669)" />
  <text x="342" y="72" style="fill: var(--good, #059669)">缓慢变到 <tspan font-style="italic">ω</tspan> = 3</text>
  <text x="240" y="380" text-anchor="middle" fill="currentColor">两条相轨道围成的面积相同（2π<tspan font-style="italic">I</tspan> 不变），能量 <tspan font-style="italic">E</tspan> = <tspan font-style="italic">ωI</tspan> 变成 3 倍</text>
</svg>
