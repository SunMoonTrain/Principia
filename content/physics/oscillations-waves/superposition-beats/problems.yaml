- id: p1
  tier: easy
  statement: |
    频率为$256\,\mathrm{Hz}$和$260\,\mathrm{Hz}$的两个音叉同时发声，每秒听到几次强弱变化？
  answer:
    type: number
    value: 4
  hints:
    - |
      强弱变化的频率就是拍频。
    - |
      拍频等于两个频率之差$|f_1-f_2|$。
    - |
      $|260-256|=4\,\mathrm{Hz}$，每秒 4 次。
  solution: |
    拍频$|f_1-f_2|=4\,\mathrm{Hz}$，每秒听到 4 次强弱变化，相邻两次最响相隔$0.25\,\mathrm s$。合起来的声音频率是平均的$258\,\mathrm{Hz}$。

- id: p2
  tier: easy
  statement: |
    一个点同时做$x=A\cos\omega t$和$y=B\cos(\omega t+\varphi)$两个振动（$A$、$B$都是正数）。下面哪些说法正确？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\varphi=\frac\pi2$时，点沿逆时针方向走
      - |
        $\varphi=0$时，轨迹是一条过原点、斜率为$\frac BA$的线段
      - |
        $\varphi=\frac\pi4$时，轨迹是一个长短轴都沿坐标轴的椭圆
      - |
        只要$A\ne B$，不论$\varphi$取什么，轨迹都不是圆
      - |
        $\varphi$从$0$变到$\frac\pi2$，轨迹越来越扁
    value: [2, 4]
  hints:
    - |
      用讲解里的轨迹方程$\frac{x^2}{A^2}+\frac{y^2}{B^2}-\frac{2xy}{AB}\cos\varphi=\sin^2\varphi$，再看$t=0$时点往哪边走。
    - |
      $\cos\varphi\ne0$时方程里有$xy$项，椭圆是斜的；轨迹总在$2A\times2B$的方框里，碰到四条边。
    - |
      A 错：$0<\varphi<\pi$时顺时针；B 对：$\varphi=0$时$\frac yB=\frac xA$。C 错：有$xy$项，椭圆是斜的；D 对：轨迹碰到$x=\pm A$和$y=\pm B$，$A\ne B$时不可能是圆。E 错：从线段变成正放的椭圆，越来越「胖」。
  solution: |
    选 B、D。$\varphi=\frac\pi2$时$t=0$点在最右边、往下走，是顺时针；$\varphi=0$时$y=\frac BAx$，是线段；$\varphi=\frac\pi4$时方程有$xy$项，椭圆的轴是斜的；轨迹和直线$x=\pm A$、$y=\pm B$相切，$A\ne B$时宽和高不等，不是圆；$\varphi$从$0$到$\frac\pi2$，轨迹从线段张开成正放的椭圆。

- id: p3
  tier: medium
  statement: |
    两个同方向的振动$x_1=3\cos(2\pi\cdot500\,t)$、$x_2=2\cos(2\pi\cdot504\,t)$（单位$\mathrm{mm}$，$t$以秒计）叠加。合振动的振幅在什么范围里变化？按「最大值, 最小值」的顺序写出（单位$\mathrm{mm}$）。
  answer:
    type: tuple
    value: [5, 1]
  hints:
    - |
      两个旋转矢量转得快慢略有不同，夹角随时间变化。
    - |
      夹角为$0$时合成矢量最长，为$\pi$时最短。
    - |
      最大$3+2=5\,\mathrm{mm}$，最小$3-2=1\,\mathrm{mm}$，以$4\,\mathrm{Hz}$的拍频在两者之间变化。
  solution: |
    由讲解里的定理，$A(t)^2=9+4+12\cos(2\pi\cdot4\,t)$，在$25$和$1$之间变化，振幅在$5\,\mathrm{mm}$和$1\,\mathrm{mm}$之间，拍频$4\,\mathrm{Hz}$。两个振幅不等时最弱的时候也不为零，声音的强度（和振幅的平方成正比）的最大值是最小值的$25$倍。

- id: p4
  tier: medium
  statement: |
    示波器水平方向接频率为$300\,\mathrm{Hz}$的信号，竖直方向接另一个信号，屏上出现稳定的李萨如图形，它和竖直的边相切 3 次、和水平的边相切 4 次。竖直方向信号的频率是多少？
  answer:
    type: number
    value: 400
    unit: |
      $\mathrm{Hz}$
  hints:
    - |
      一个周期里，亮点碰到右边的次数等于水平振动的次数，碰到上边的次数等于竖直振动的次数。
    - |
      $f_x:f_y$等于和竖直边相切的点数与和水平边相切的点数之比，这里是$3:4$。
    - |
      $f_y=\frac43f_x=\frac43\times300=400\,\mathrm{Hz}$。
  solution: |
    $f_x:f_y=3:4$，$f_y=400\,\mathrm{Hz}$。图形稳定，说明频率比正好是有理数；要是比值稍有偏离，图形会慢慢转动、变形。

- id: p5
  tier: hard
  statement: |
    $x=A\cos\omega t$，$y=B\cos(\omega t+\varphi)$，$0<\varphi<\pi$。

    （1）消去$t$，证明轨迹方程$\frac{x^2}{A^2}+\frac{y^2}{B^2}-\frac{2xy}{AB}\cos\varphi=\sin^2\varphi$。

    （2）证明点沿顺时针方向走，并说明$-\pi<\varphi<0$时为什么反过来。

    （3）$A=B$时，证明椭圆的两个轴沿直线$y=x$和$y=-x$，并求两个半轴的长。
  hints:
    - |
      $\frac yB=\cos\omega t\cos\varphi-\sin\omega t\sin\varphi$，$\cos\omega t=\frac xA$。
    - |
      看$t=0$时点在哪里、往哪边走；或者算$x\dot y-y\dot x$的符号（它是位置矢量转动快慢的$r^2$倍）。$A=B$时换成$u=\frac{x+y}{\sqrt2}$、$v=\frac{x-y}{\sqrt2}$。
    - |
      （1）$\frac yB-\frac xA\cos\varphi=-\sin\omega t\sin\varphi$，和$\frac xA\sin\varphi=\cos\omega t\sin\varphi$平方相加。（2）$x\dot y-y\dot x=-AB\omega\sin\varphi<0$，顺时针；$\varphi<0$时它为正，逆时针。（3）$A=B$时方程变成$(1-\cos\varphi)u^2+(1+\cos\varphi)v^2=A^2\sin^2\varphi$，半轴$A\sqrt{1+\cos\varphi}$（沿$y=x$）和$A\sqrt{1-\cos\varphi}$（沿$y=-x$）。
  reference: |
    （1）$\frac yB=\frac xA\cos\varphi-\sin\omega t\sin\varphi$，所以$\frac yB-\frac xA\cos\varphi=-\sin\omega t\sin\varphi$；又$\frac xA\sin\varphi=\cos\omega t\sin\varphi$。两式平方相加得$\frac{y^2}{B^2}-\frac{2xy}{AB}\cos\varphi+\frac{x^2}{A^2}=\sin^2\varphi$。

    （2）$x\dot y-y\dot x=A\cos\omega t\cdot\bigl(-B\omega\sin(\omega t+\varphi)\bigr)-B\cos(\omega t+\varphi)\cdot(-A\omega\sin\omega t)=-AB\omega\sin\varphi$，是常数。它等于$r^2\dot\theta$（$\theta$是位置矢量的方向角），$0<\varphi<\pi$时为负，点一直顺时针转；$-\pi<\varphi<0$时为正，逆时针。也可以看$t=0$：点在最右边$(A,B\cos\varphi)$，$\dot y=-B\omega\sin\varphi<0$，往下走。

    （3）$A=B$时，代入$x=\frac{u+v}{\sqrt2}$、$y=\frac{u-v}{\sqrt2}$：$x^2+y^2=u^2+v^2$，$2xy=u^2-v^2$，方程变成$(1-\cos\varphi)u^2+(1+\cos\varphi)v^2=A^2\sin^2\varphi$，没有交叉项，轴沿$u$（直线$y=x$）和$v$（直线$y=-x$）方向。半轴分别是$\frac{A\sin\varphi}{\sqrt{1-\cos\varphi}}=A\sqrt{1+\cos\varphi}$和$A\sqrt{1-\cos\varphi}$；$\varphi=\frac\pi2$时都是$A$，是圆。

- id: p6
  tier: hard
  statement: |
    李萨如图形$x=A\cos\omega_1t$，$y=B\cos(\omega_2t+\varphi)$。

    （1）设$\frac{\omega_1}{\omega_2}=\frac pq$（最简分数），证明点经过时间$T=\frac{2\pi q}{\omega_2}$回到出发点、速度也和出发时一样；并说明比$T$更短的时间做不到。

    （2）设$\frac{\omega_1}{\omega_2}$是无理数，证明点永远不会以同样的位置和速度回到出发时的状态。
  hints:
    - |
      位置和速度都回到原样，要$x$、$y$两个振动各自走完整数个周期。
    - |
      $x$、$\dot x$同时回到原样要求$\omega_1T$是$2\pi$的整数倍，$y$同理。设$\omega_1T=2\pi m$，$\omega_2T=2\pi n$，相除。
    - |
      （1）$\omega_2T=2\pi q$，$\omega_1T=2\pi p$，都是$2\pi$的整数倍，位置速度都还原。反过来，还原要$\omega_1T=2\pi m$、$\omega_2T=2\pi n$，$\frac mn=\frac pq$，$p$、$q$互素，所以$n$是$q$的倍数，$T\ge\frac{2\pi q}{\omega_2}$。（2）还原就要$\frac{\omega_1}{\omega_2}=\frac mn$是有理数，矛盾。
  reference: |
    （1）$x$和$\dot x$同时回到$t=0$时的值，当且仅当$\omega_1T$是$2\pi$的整数倍（$\cos$、$\sin$同时回到原值）；$y$、$\dot y$同理要$\omega_2T$是$2\pi$的整数倍。$T=\frac{2\pi q}{\omega_2}$时，$\omega_2T=2\pi q$，$\omega_1T=\frac pq\omega_2T=2\pi p$，满足。若$T'>0$也满足，$\omega_1T'=2\pi m$，$\omega_2T'=2\pi n$，相除得$\frac mn=\frac pq$，$pn=qm$，$p$、$q$互素，所以$q\mid n$，$n\ge q$，$T'=\frac{2\pi n}{\omega_2}\ge T$。

    （2）若某个$T>0$使状态还原，同上有$\frac{\omega_1}{\omega_2}=\frac mn$，是有理数，矛盾。所以无理数频率比时轨迹永远不闭合（点可以再次经过同一个位置，但速度不同，只是曲线自己相交）。

- id: p7
  tier: thinking
  statement: |
    三个音叉的频率是$440\,\mathrm{Hz}$、$441\,\mathrm{Hz}$、$442\,\mathrm{Hz}$，振幅相同，同时发声。

    （1）合起来的声音强弱怎样变化？多久重复一次？

    （2）最响时的振幅是一个音叉的几倍？两次最响之间还有没有较弱的「次最响」？

    （3）和两个音叉的拍比，有什么不同？
  hints:
    - |
      三个旋转矢量相对于第一个，分别以$0$、$1$、$2$转每秒转动。
    - |
      记一个音叉的振幅为$a$，合成矢量的长度是$a\bigl|1+e^{i2\pi t}+e^{i4\pi t}\bigr|$，用复数表示与旋转矢量那一节例 2 的结果。
    - |
      （1）长度$a\Bigl|\frac{\sin3\pi t}{\sin\pi t}\Bigr|$，每$1\,\mathrm s$重复一次。（2）$t$为整数时三个矢量同向，振幅$3a$；$t=\frac12$附近还有一个次最响，振幅$a$；$t=\frac13$、$\frac23$时为零。（3）两个音叉时强弱在$2a$和$0$之间平滑地变化；三个时主峰更尖、更高，中间多了一个弱峰。
  reference: |
    （1）以$441\,\mathrm{Hz}$为参考，三个振动的旋转矢量相对它以$-1$、$0$、$+1$转每秒转动；合振动可写成「平均频率的振动」乘以慢变的振幅$a\bigl|1+2\cos2\pi t\bigr|$（取$t=0$时同相），也就是$a\Bigl|\frac{\sin3\pi t}{\sin\pi t}\Bigr|$，周期$1\,\mathrm s$。

    （2）$t=0,1,2,\dots$时$|1+2\cos2\pi t|=3$，最响，振幅$3a$；$t=\frac13,\frac23$时为零；$t=\frac12$时$|1-2|=1$，是一个次最响，振幅$a$，强度只有主峰的$\frac19$。

    （3）两个音叉：振幅$2a|\cos\pi\Delta f\,t|$，在$2a$和$0$之间平滑地变化，每个周期一个峰。三个音叉：主峰振幅$3a$，更高更尖，中间夹着零点和一个弱峰。音叉越多（频率等间隔），主峰越尖、越高，中间的弱峰越多，和单缝衍射、光栅的强度分布是同一个数学。

- id: p8
  tier: thinking
  statement: |
    示波器上，水平方向接$100\,\mathrm{Hz}$的信号，竖直方向接$100.5\,\mathrm{Hz}$的信号，振幅相同。

    （1）屏上看到的是什么？会怎样变化？

    （2）多久回到同一个图形？

    （3）这和两个同方向的振动产生的拍有什么关系？
  hints:
    - |
      把竖直方向写成$\cos(2\pi\cdot100\,t+\varphi(t))$，$\varphi(t)$怎样随时间变？
    - |
      $\varphi(t)=2\pi\times0.5\,t$，慢慢从$0$增加到$2\pi$。对每个$\varphi$，图形近似是讲解里那种频率相同的椭圆。
    - |
      （1）频率几乎相同，每一刻的图形近似是$\varphi$确定的椭圆；$\varphi$慢慢增大，图形从斜线段张开成顺时针转的圆（$\varphi=\frac\pi2$），再变成另一方向的斜线段（$\varphi=\pi$），然后变成逆时针转的圆，如此循环。（2）$\varphi$增加$2\pi$要$\frac1{0.5}=2\,\mathrm s$。（3）同一个慢变的相位差：同方向叠加时它让振幅时大时小，成了拍；互相垂直时它让椭圆慢慢变形，每$\frac1{|f_1-f_2|}$循环一次。
  reference: |
    （1）$y=A\cos(2\pi\cdot100.5\,t)=A\cos\bigl(2\pi\cdot100\,t+\varphi(t)\bigr)$，$\varphi(t)=\pi t$，比振动本身慢得多。在几个$100\,\mathrm{Hz}$的周期里，$\varphi$几乎不变，亮点画出相位差为$\varphi$的同频率图形：$\varphi=0$是斜线段$y=x$，$\varphi=\frac\pi2$是顺时针的圆，$\varphi=\pi$是斜线段$y=-x$，$\varphi=\frac{3\pi}2$（即$-\frac\pi2$）是逆时针的圆。屏上看到图形在这几种之间连续地变来变去，像一个在转动的圆环被从侧面看。

    （2）$\varphi$增加$2\pi$要$2\,\mathrm s$，即$\frac1{|f_1-f_2|}$。

    （3）两种现象都来自同一个慢慢均匀增大的相位差$2\pi(f_2-f_1)t$。同方向时，旋转矢量的夹角变化让合振幅时大时小，就是拍；垂直方向时，同一个相位差让椭圆周期性地变形。所以用示波器看李萨如图形调频率，和用拍调音是同一个原理：图形停住不变，或拍消失，频率比就准了。
