id: physics.oscillations-waves
title: |
  振动与波
proofPolicy: sketch
macros:
  \vb: |
    \mathbf{#1}
  \dd: |
    \mathop{}\!\mathrm{d}
  \dv: |
    \frac{\mathrm{d} #1}{\mathrm{d} #2}
  \pdv: |
    \frac{\partial #1}{\partial #2}
  \Re: |
    \operatorname{Re}
glossary:
  - id: physics.oscillations-waves.restoring-force
    zh: |
      回复力
    en: |
      restoring force
    brief: |
      质点离开平衡位置时受到的、指向平衡位置的合力；和位移成正比时写成$F=-kx$。
    definedIn: physics.oscillations-waves.simple-harmonic-motion
    anchor: def-restoring-force
  - id: physics.oscillations-waves.simple-harmonic-motion
    zh: |
      简谐运动
    en: |
      simple harmonic motion
    brief: |
      位移随时间按$x=A\cos(\omega t+\varphi)$变化的运动；只受线性回复力的质点就做这种运动。
    definedIn: physics.oscillations-waves.simple-harmonic-motion
    anchor: def-shm
  - id: physics.oscillations-waves.amplitude
    zh: |
      振幅
    en: |
      amplitude
    brief: |
      简谐运动$x=A\cos(\omega t+\varphi)$里的$A>0$，是离开平衡位置的最大距离。
    definedIn: physics.oscillations-waves.simple-harmonic-motion
    anchor: def-shm
  - id: physics.oscillations-waves.angular-frequency
    zh: |
      角频率
    en: |
      angular frequency
    brief: |
      简谐运动$x=A\cos(\omega t+\varphi)$里的$\omega>0$，等于$2\pi$乘频率，单位$\mathrm{rad/s}$。
    definedIn: physics.oscillations-waves.simple-harmonic-motion
    anchor: def-shm
  - id: physics.oscillations-waves.phase
    zh: |
      相位
    en: |
      phase
    brief: |
      简谐运动$x=A\cos(\omega t+\varphi)$里的$\omega t+\varphi$，说明振到了一个周期里的哪一步。
    definedIn: physics.oscillations-waves.simple-harmonic-motion
    anchor: def-shm
  - id: physics.oscillations-waves.initial-phase
    zh: |
      初相
    en: |
      initial phase
    brief: |
      $t=0$时的相位，即$x=A\cos(\omega t+\varphi)$里的$\varphi$，通常取在$(-\pi,\pi]$里。
    definedIn: physics.oscillations-waves.simple-harmonic-motion
    anchor: def-shm
  - id: physics.oscillations-waves.period
    zh: |
      周期
    en: |
      period
    brief: |
      振动重复一次所用的时间；简谐运动的周期是$T=\frac{2\pi}\omega$。
    definedIn: physics.oscillations-waves.simple-harmonic-motion
    anchor: def-shm
  - id: physics.oscillations-waves.frequency
    zh: |
      频率
    en: |
      frequency
    brief: |
      单位时间里振动重复的次数$f=\frac1T$，单位是赫兹（Hz）；简谐运动的$f=\frac\omega{2\pi}$。
    definedIn: physics.oscillations-waves.simple-harmonic-motion
    anchor: def-shm
  - id: physics.oscillations-waves.reference-circle
    zh: |
      参考圆
    en: |
      reference circle
    brief: |
      半径等于振幅的圆，圆上一点以角频率逆时针匀速转动，它在$x$轴上的投影做简谐运动。
    definedIn: physics.oscillations-waves.simple-harmonic-motion
    anchor: def-reference-circle
  - id: physics.oscillations-waves.damping-force
    zh: |
      阻尼力
    en: |
      damping force
    brief: |
      和速度成正比、方向相反的力$-b\dot x$，$b>0$叫作阻尼系数；它不断消耗机械能。
    definedIn: physics.oscillations-waves.damped-oscillations
    anchor: def-damped-oscillation
  - id: physics.oscillations-waves.damped-oscillation
    zh: |
      阻尼振动
    en: |
      damped oscillation
    brief: |
      振子同时受线性回复力和阻尼力时的运动，方程是$\ddot x+\gamma\dot x+\omega_0^2x=0$，$\gamma=\frac bm$。
    definedIn: physics.oscillations-waves.damped-oscillations
    anchor: def-damped-oscillation
  - id: physics.oscillations-waves.natural-angular-frequency
    zh: |
      固有角频率
    en: |
      natural angular frequency
    brief: |
      振子没有阻尼、也不受外力时振动的角频率，由振子本身决定；弹簧振子的是$\omega_0=\sqrt{k/m}$。
    definedIn: physics.oscillations-waves.damped-oscillations
    anchor: def-damped-oscillation
  - id: physics.oscillations-waves.underdamped
    zh: |
      欠阻尼
    en: |
      underdamped
    brief: |
      $\gamma<2\omega_0$的阻尼振动：在平衡位置两边来回振动，振幅按$e^{-\gamma t/2}$衰减。
    definedIn: physics.oscillations-waves.damped-oscillations
    anchor: def-damping-cases
  - id: physics.oscillations-waves.critically-damped
    zh: |
      临界阻尼
    en: |
      critically damped
    brief: |
      $\gamma=2\omega_0$的阻尼振动：不来回振动，长时间后偏离减小得最快。
    definedIn: physics.oscillations-waves.damped-oscillations
    anchor: def-damping-cases
  - id: physics.oscillations-waves.overdamped
    zh: |
      过阻尼
    en: |
      overdamped
    brief: |
      $\gamma>2\omega_0$的阻尼振动：不来回振动，阻尼越大，回到平衡位置越慢。
    definedIn: physics.oscillations-waves.damped-oscillations
    anchor: def-damping-cases
  - id: physics.oscillations-waves.coupled-oscillators
    zh: |
      耦合振子
    en: |
      coupled oscillators
    brief: |
      用弹簧之类连在一起的几个振子，一个的位移会改变另一个受的力，运动方程要一起解。
    definedIn: physics.oscillations-waves.normal-modes
    anchor: def-coupled-oscillators
  - id: physics.oscillations-waves.normal-mode
    zh: |
      简正模
    en: |
      normal mode
    brief: |
      各振子以同一个角频率、同一个$\cos(\omega t+\varphi)$振动的运动$\vb x=\vb a\cos(\omega t+\varphi)$，位移之比不变。
    definedIn: physics.oscillations-waves.normal-modes
    anchor: def-normal-mode
  - id: physics.oscillations-waves.normal-frequency
    zh: |
      简正频率
    en: |
      normal frequency
    brief: |
      简正模的角频率；由$K\vb a=m\omega^2\vb a$，$m\omega^2$是矩阵$K$的特征值。
    definedIn: physics.oscillations-waves.normal-modes
    anchor: def-normal-mode
  - id: physics.oscillations-waves.complex-amplitude
    zh: |
      复振幅
    en: |
      complex amplitude
    brief: |
      简谐运动$A\cos(\omega t+\varphi)$对应的复数$\tilde x=Ae^{i\varphi}$，模是振幅、辐角是初相，$x=\Re(\tilde xe^{i\omega t})$。
    definedIn: physics.oscillations-waves.phasors
    anchor: def-complex-amplitude
  - id: physics.oscillations-waves.phasor
    zh: |
      旋转矢量
    en: |
      phasor
    brief: |
      复平面上从原点指向$\tilde xe^{i\omega t}$的矢量，以角速度$\omega$逆时针转，在实轴上的投影就是振动的位移。
    definedIn: physics.oscillations-waves.phasors
    anchor: def-phasor
  - id: physics.oscillations-waves.driven-oscillation
    zh: |
      受迫振动
    en: |
      driven oscillation
    brief: |
      振子在周期性外力（驱动力）作用下的振动；暂态衰减以后，以驱动力的频率振动。
    definedIn: physics.oscillations-waves.driven-oscillations
    anchor: def-driven-oscillation
  - id: physics.oscillations-waves.resonance
    zh: |
      共振
    en: |
      resonance
    brief: |
      驱动角频率接近固有角频率时，受迫振动的稳态振幅变得很大的现象。
    definedIn: physics.oscillations-waves.driven-oscillations
    anchor: def-resonance
  - id: physics.oscillations-waves.simple-pendulum
    zh: |
      单摆
    en: |
      simple pendulum
    brief: |
      不能伸长、质量不计的细线下挂一个质点构成的摆；摆角很小时周期是$2\pi\sqrt{l/g}$。
    definedIn: physics.oscillations-waves.pendulums
    anchor: def-simple-pendulum
  - id: physics.oscillations-waves.compound-pendulum
    zh: |
      复摆
    en: |
      compound pendulum
    brief: |
      绕水平固定轴摆动的刚体，也叫物理摆；摆角很小时周期是$2\pi\sqrt{\frac I{mgd}}$，$d$是转轴到质心的距离。
    definedIn: physics.oscillations-waves.pendulums
    anchor: def-compound-pendulum
  - id: physics.oscillations-waves.beats
    zh: |
      拍
    en: |
      beats
    brief: |
      两个同方向、频率相近的振动叠加时，合振动的振幅周期性地时大时小的现象。
    definedIn: physics.oscillations-waves.superposition-beats
    anchor: def-beats
  - id: physics.oscillations-waves.beat-frequency
    zh: |
      拍频
    en: |
      beat frequency
    brief: |
      拍的强弱变化的频率，等于两个振动的频率之差$|f_1-f_2|$。
    definedIn: physics.oscillations-waves.superposition-beats
    anchor: def-beats
  - id: physics.oscillations-waves.lissajous-figure
    zh: |
      李萨如图形
    en: |
      Lissajous figure
    brief: |
      两个互相垂直的振动$x=A\cos\omega_1t$、$y=B\cos(\omega_2t+\varphi)$合成的轨迹，频率比是有理数时闭合。
    definedIn: physics.oscillations-waves.superposition-beats
    anchor: def-lissajous
  - id: physics.oscillations-waves.beaded-string
    zh: |
      一维链
    en: |
      beaded string
    brief: |
      等间距串在绷紧的绳上、两端固定、只做横向小振动的一串小球，也叫小球链；$N$个小球有$N$个简正模。
    definedIn: physics.oscillations-waves.beaded-string
    anchor: def-beaded-string
  - id: physics.oscillations-waves.wave-equation
    zh: |
      波动方程
    en: |
      wave equation
    brief: |
      方程$y_{tt}=v^2y_{xx}$；弦的横向小振动满足它，$v=\sqrt{T/\mu}$。
    definedIn: physics.oscillations-waves.wave-equation
    anchor: def-wave-equation
  - id: physics.oscillations-waves.wave-speed
    zh: |
      波速
    en: |
      wave speed
    brief: |
      波形沿弦平移的速度；弦上$v=\sqrt{T/\mu}$，只由张力和线密度决定。
    definedIn: physics.oscillations-waves.wave-equation
    anchor: def-wave-equation
  - id: physics.oscillations-waves.traveling-wave
    zh: |
      行波
    en: |
      traveling wave
    brief: |
      形状不变、以一定速度平移的波，例如向右传播的$f(x-vt)$、向左传播的$g(x+vt)$。
    definedIn: physics.oscillations-waves.wave-equation
    anchor: def-traveling-wave
  - id: physics.oscillations-waves.quality-factor
    zh: |
      品质因数
    en: |
      quality factor
    brief: |
      $Q=\frac{\omega_0}\gamma$，也等于固有角频率除以平均功率的共振峰的半高宽；$Q$越大，共振峰越高越窄。
    definedIn: physics.oscillations-waves.driven-oscillations
    anchor: def-resonance
  - id: physics.oscillations-waves.harmonic-wave
    zh: |
      简谐波
    en: |
      harmonic wave
    brief: |
      形如$A\cos(\omega t-kx+\varphi)$的波，每一点都以同一个角频率做简谐运动，相位沿传播方向依次落后；满足波动方程时以$v=\frac\omega k$传播。
    definedIn: physics.oscillations-waves.harmonic-waves
    anchor: def-harmonic-wave
  - id: physics.oscillations-waves.wave-number
    zh: |
      波数
    en: |
      wave number
    brief: |
      简谐波$A\cos(\omega t-kx+\varphi)$里的$k=\frac{2\pi}\lambda$，沿传播方向每单位长度相位变化的弧度数，单位$\mathrm{rad/m}$。
    definedIn: physics.oscillations-waves.harmonic-waves
    anchor: def-harmonic-wave
  - id: physics.oscillations-waves.wavelength
    zh: |
      波长
    en: |
      wavelength
    brief: |
      简谐波在同一时刻沿传播方向重复一次的距离$\lambda=\frac{2\pi}k$；和频率、波速满足$\lambda f=v$。
    definedIn: physics.oscillations-waves.harmonic-waves
    anchor: def-harmonic-wave
  - id: physics.oscillations-waves.transverse-wave
    zh: |
      横波
    en: |
      transverse wave
    brief: |
      介质里各点振动的方向和波传播的方向垂直的波，例如弦的横向振动。
    definedIn: physics.oscillations-waves.harmonic-waves
    anchor: def-transverse-longitudinal
  - id: physics.oscillations-waves.longitudinal-wave
    zh: |
      纵波
    en: |
      longitudinal wave
    brief: |
      介质里各点振动的方向和波传播的方向平行的波，例如空气里的声波。
    definedIn: physics.oscillations-waves.harmonic-waves
    anchor: def-transverse-longitudinal
  - id: physics.oscillations-waves.dispersion-relation
    zh: |
      色散关系
    en: |
      dispersion relation
    brief: |
      线性、均匀的系统里，简谐波$e^{i(\omega t-kx)}$能存在时角频率和波数必须满足的关系$\omega(k)$；弦是$\omega=vk$。
    definedIn: physics.oscillations-waves.dispersion-relations
    anchor: def-dispersion-relation
  - id: physics.oscillations-waves.phase-velocity
    zh: |
      相速度
    en: |
      phase velocity
    brief: |
      简谐波的相位（波峰）前进的速度$v_{\mathrm p}=\frac\omega k$。
    definedIn: physics.oscillations-waves.dispersion-relations
    anchor: def-phase-velocity
  - id: physics.oscillations-waves.dispersion
    zh: |
      色散
    en: |
      dispersion
    brief: |
      相速度随波数（频率）变化，波形边走边变；光的相速度是$\frac cn$，折射率随频率变化就是光的色散。
    definedIn: physics.oscillations-waves.dispersion-relations
    anchor: def-phase-velocity
  - id: physics.oscillations-waves.doppler-effect
    zh: |
      多普勒效应
    en: |
      Doppler effect
    brief: |
      波源或观察者相对介质运动时，接收到的频率和发出的频率不同的现象；波源运动改变波长，观察者运动改变遇到波峰的快慢。
    definedIn: physics.oscillations-waves.doppler-effect
    anchor: def-doppler
  - id: physics.oscillations-waves.frequency-shift
    zh: |
      频移
    en: |
      frequency shift
    brief: |
      接收到的频率相对发出的频率的变化，例如多普勒效应造成的变化。
    definedIn: physics.oscillations-waves.doppler-effect
    anchor: def-doppler
  - id: physics.oscillations-waves.redshift
    zh: |
      红移
    en: |
      redshift
    brief: |
      接收到的频率比发出的低；名字来自光谱，红光在可见光里频率最低。
    definedIn: physics.oscillations-waves.doppler-effect
    anchor: def-doppler
  - id: physics.oscillations-waves.blueshift
    zh: |
      蓝移
    en: |
      blueshift
    brief: |
      接收到的频率比发出的高，和红移相对。
    definedIn: physics.oscillations-waves.doppler-effect
    anchor: def-doppler
  - id: physics.oscillations-waves.mach-cone
    zh: |
      马赫锥
    en: |
      Mach cone
    brief: |
      波源比波跑得快时，它各个时刻发出的波扩展成的球面的包络，是以波源为顶点、向后张开的圆锥面，半顶角满足$\sin\alpha=\frac v{u_{\mathrm s}}$。
    definedIn: physics.oscillations-waves.doppler-effect
    anchor: def-mach-cone
  - id: physics.oscillations-waves.nonlinear-oscillation
    zh: |
      非线性振动
    en: |
      nonlinear oscillation
    brief: |
      回复力不和位移成正比时的振动；周期一般随振幅变化，振幅很小、回复力的一次项不为零时近似是简谐运动。
    definedIn: physics.oscillations-waves.nonlinear-oscillators
    anchor: def-nonlinear-oscillation
  - id: physics.oscillations-waves.duffing-oscillator
    zh: |
      杜芬振子
    en: |
      Duffing oscillator
    brief: |
      最简单的形式是$\ddot x+\omega_0^2x+\varepsilon x^3=0$，$\varepsilon>0$是硬弹簧、$\varepsilon<0$是软弹簧；振幅$A$小时角频率约为$\omega_0+\frac{3\varepsilon A^2}{8\omega_0}$。
    definedIn: physics.oscillations-waves.nonlinear-oscillators
    anchor: def-duffing
  - id: physics.oscillations-waves.impedance
    zh: |
      阻抗
    en: |
      impedance
    brief: |
      张力为$T$、线密度为$\mu$的弦的$Z=\sqrt{T\mu}=\frac Tv$；向右的行波里横向拉力等于$Z$乘横向速度，两根弦阻抗相等时连接处不反射。
    definedIn: physics.oscillations-waves.reflection-transmission
    anchor: def-impedance
  - id: physics.oscillations-waves.reflection-coefficient
    zh: |
      反射系数
    en: |
      reflection coefficient
    brief: |
      反射波和入射波在界面上的位移之比；两根张力相同的弦的连接处$r=\frac{Z_1-Z_2}{Z_1+Z_2}$，为负时反射波倒过来。
    definedIn: physics.oscillations-waves.reflection-transmission
    anchor: def-coefficients
  - id: physics.oscillations-waves.transmission-coefficient
    zh: |
      透射系数
    en: |
      transmission coefficient
    brief: |
      透射波和入射波在界面上的位移之比；两根张力相同的弦的连接处$\tau=\frac{2Z_1}{Z_1+Z_2}$。
    definedIn: physics.oscillations-waves.reflection-transmission
    anchor: def-coefficients
  - id: physics.oscillations-waves.energy-flux
    zh: |
      能流
    en: |
      energy flux
    brief: |
      单位时间传过某处（三维时是穿过单位面积）的能量；弦上是$j=-Ty_xy_t$，即左边的弦对右边的弦做功的功率，行波里等于波速乘能量密度。
    definedIn: physics.oscillations-waves.wave-energy
    anchor: def-energy-flux
  - id: physics.oscillations-waves.wavefront
    zh: |
      波阵面
    en: |
      wavefront
    brief: |
      同一时刻振动状态（相位）相同的各点连成的面；平面波的是垂直于波矢的平面，点波源的球面波的是同心球面。
    definedIn: physics.oscillations-waves.waves-in-3d
    anchor: def-wavefront
  - id: physics.oscillations-waves.plane-wave
    zh: |
      平面波
    en: |
      plane wave
    brief: |
      波阵面是一族平行平面的波，只随沿传播方向的坐标和时间变化；简谐的写成$A\cos(\omega t-\vb k\cdot\vb r+\varphi)$。
    definedIn: physics.oscillations-waves.waves-in-3d
    anchor: def-wavefront
  - id: physics.oscillations-waves.spherical-wave
    zh: |
      球面波
    en: |
      spherical wave
    brief: |
      波阵面是一族同心球面的波；向外传播的$\frac{f(r-vt)}r$振幅和到中心的距离成反比。
    definedIn: physics.oscillations-waves.waves-in-3d
    anchor: def-wavefront
  - id: physics.oscillations-waves.wave-vector
    zh: |
      波矢
    en: |
      wave vector
    brief: |
      简谐平面波$A\cos(\omega t-\vb k\cdot\vb r+\varphi)$里的矢量$\vb k$，沿传播方向，大小是波数$\frac{2\pi}\lambda$。
    definedIn: physics.oscillations-waves.waves-in-3d
    anchor: def-wave-vector
  - id: physics.oscillations-waves.standing-wave
    zh: |
      驻波
    en: |
      standing wave
    brief: |
      两列振幅、频率相同，反向传播的简谐波叠成的波$2A\cos kx\cos\omega t$，波形在原地伸缩、不平移。
    definedIn: physics.oscillations-waves.standing-waves
    anchor: def-standing-wave
  - id: physics.oscillations-waves.node
    zh: |
      波节
    en: |
      node
    brief: |
      驻波里始终不动的点；相邻两个相距半个波长。
    definedIn: physics.oscillations-waves.standing-waves
    anchor: def-standing-wave
  - id: physics.oscillations-waves.antinode
    zh: |
      波腹
    en: |
      antinode
    brief: |
      驻波里振幅最大的点，在相邻两个波节的正中间。
    definedIn: physics.oscillations-waves.standing-waves
    anchor: def-standing-wave
  - id: physics.oscillations-waves.natural-frequency
    zh: |
      固有频率
    en: |
      natural frequency
    brief: |
      物体自由振动时的频率，由物体本身决定；两端固定的弦有无穷多个，$f_n=\frac{nv}{2\ell}$。
    definedIn: physics.oscillations-waves.standing-waves
    anchor: def-harmonics
  - id: physics.oscillations-waves.fundamental-frequency
    zh: |
      基频
    en: |
      fundamental frequency
    brief: |
      最低的固有频率；两端固定的弦的基频是$f_1=\frac v{2\ell}$。
    definedIn: physics.oscillations-waves.standing-waves
    anchor: def-harmonics
  - id: physics.oscillations-waves.harmonic
    zh: |
      谐波
    en: |
      harmonic
    brief: |
      频率是基频整数倍的振动；两端固定的弦的固有频率$f_n=nf_1$叫作第$n$次谐波。
    definedIn: physics.oscillations-waves.standing-waves
    anchor: def-harmonics
  - id: physics.oscillations-waves.bulk-modulus
    zh: |
      体积模量
    en: |
      bulk modulus
    brief: |
      流体压强的增加和体积相对减小之比$K=-V\dv pV$，单位$\mathrm{Pa}$；水约为$2.2\times10^9\,\mathrm{Pa}$。
    definedIn: physics.oscillations-waves.sound-waves
    anchor: def-bulk-modulus
  - id: physics.oscillations-waves.sound-wave
    zh: |
      声波
    en: |
      sound wave
    brief: |
      在介质里传播声音的机械波，也包括人耳听不到的超声波、次声波；在气体、液体里是纵波。
    definedIn: physics.oscillations-waves.sound-waves
    anchor: def-sound-wave
  - id: physics.oscillations-waves.speed-of-sound
    zh: |
      声速
    en: |
      speed of sound
    brief: |
      声波相对介质传播的速度，也叫音速；不计黏性、导热的流体中振幅很小时$v=\sqrt{K/\rho}$（$K$是绝热体积模量，$\rho$是密度），$20\,^\circ\mathrm C$的空气中约$343\,\mathrm{m/s}$。
    definedIn: physics.oscillations-waves.sound-waves
    anchor: def-sound-wave
