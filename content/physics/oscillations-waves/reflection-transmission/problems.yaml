- id: p1
  tier: easy
  statement: |
    两根张力相同的弦连在一起，弦 2 的线密度是弦 1 的 25 倍。波从弦 1 射向弦 2，反射系数是多少？
  answer:
    type: number
    value: -2/3
  hints:
    - |
      张力相同时，阻抗和$\sqrt\mu$成正比。
    - |
      $\frac{Z_2}{Z_1}=\sqrt{25}=5$，$r=\frac{Z_1-Z_2}{Z_1+Z_2}$。
    - |
      $r=\frac{1-5}{1+5}=-\frac23$。
  solution: |
    $\frac{Z_2}{Z_1}=\sqrt{\frac{\mu_2}{\mu_1}}=5$，$r=\frac{1-5}{1+5}=-\frac23$。负号表示反射波倒过来；弦 2 重得多，接近固定端的$r=-1$。

- id: p2
  tier: easy
  statement: |
    下面哪些说法正确？
  answer:
    type: choice
    multiple: true
    options:
      - |
        张力相同时，波从重弦射向轻弦，透射波的振幅比入射波大
      - |
        简谐波从弦 1 传到弦 2，频率不变
      - |
        弦的末端固定时，反射波和入射波在末端的位移同号
      - |
        两根弦的阻抗相等时，连接处没有反射
      - |
        阻抗大的弦，波速一定小
    value: [1, 2, 4]
  hints:
    - |
      $r=\frac{Z_1-Z_2}{Z_1+Z_2}$，$\tau=\frac{2Z_1}{Z_1+Z_2}$；固定端相当于$Z_2\to\infty$。
    - |
      $Z=\sqrt{T\mu}=\frac Tv$，张力不同时呢？
    - |
      A 对，$Z_1>Z_2$时$\tau>1$；B 对，连接处两边振动步调一致；C 错，$r=-1$，反号。D 对，$r=0$；E 错，$Z=\frac Tv$，张力大的弦阻抗可以大、波速也大。
  solution: |
    选 A、B、D。A：$Z_1>Z_2$时$\tau=\frac{2Z_1}{Z_1+Z_2}>1$；B：连接处两边的位移时时相同，频率不变；C 错：固定端$r=-1$，反射波在末端和入射波反号，合起来为零。D：$Z_1=Z_2$时$r=0$；E 错：$Z=\frac Tv$只说明张力相同时阻抗大的波速小，把一根弦拉得更紧，阻抗和波速都变大。

- id: p3
  tier: medium
  statement: |
    两根张力相同的弦连在一起，弦 2 的线密度是弦 1 的$\frac1{25}$。简谐波从弦 1 射向弦 2，透射波的振幅、波长各是入射波的多少倍？按这个顺序填写。
  answer:
    type: tuple
    value: [5/3, 5]
  hints:
    - |
      $\frac{Z_2}{Z_1}=\sqrt{\frac{\mu_2}{\mu_1}}$；频率不变，波长和波速成正比。
    - |
      $\frac{Z_2}{Z_1}=\frac15$，$\tau=\frac{2Z_1}{Z_1+Z_2}$，$\frac{v_2}{v_1}=\sqrt{\frac{\mu_1}{\mu_2}}$。
    - |
      $\tau=\frac2{1+0.2}=\frac53$，$\frac{\lambda_2}{\lambda_1}=\frac{v_2}{v_1}=5$。
  solution: |
    $\frac{Z_2}{Z_1}=\frac15$，$\tau=\frac{2}{1+1/5}=\frac53$；频率不变，$\frac{\lambda_2}{\lambda_1}=\frac{v_2}{v_1}=\sqrt{25}=5$。透射波比入射波高、也拉长了，填`5/3, 5`。

- id: p4
  tier: medium
  statement: |
    两根张力相同的弦连在一起，弦 1 的线密度是$2.0\,\mathrm{g/m}$。从弦 1 射来的脉冲在连接处反射，反射脉冲倒过来，高度是入射脉冲的$0.70$倍。弦 2 的线密度是多少？以$\mathrm{g/m}$为单位，结果保留三位有效数字。
  answer:
    type: number
    value: 2*(17/3)^2
    unit: |
      $\mathrm{g/m}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      倒过来说明$r<0$，$r=-0.70$。
    - |
      记$z=\frac{Z_2}{Z_1}$，$\frac{1-z}{1+z}=-0.70$。
    - |
      $z=\frac{17}3$，$\mu_2=z^2\mu_1\approx32.1\times2.0\,\mathrm{g/m}\approx64.2\,\mathrm{g/m}$。
  solution: |
    $r=\frac{1-z}{1+z}=-0.70$，$1-z=-0.70-0.70z$，$z=\frac{1.70}{0.30}=\frac{17}3$。张力相同时$z=\sqrt{\mu_2/\mu_1}$，所以$\mu_2=\bigl(\frac{17}3\bigr)^2\times2.0\,\mathrm{g/m}\approx64.2\,\mathrm{g/m}$。反射系数接近$-1$，弦 2 要比弦 1 重得多。

- id: p5
  tier: hard
  statement: |
    两根相同的弦（阻抗为$Z$，张力为$T$）在$x=0$处连着一颗质量为$M$的小珠。角频率为$\omega$的简谐波从左边射来，写成$\Re\bigl(e^{i(\omega t-kx)}\bigr)$，反射波、透射波写成$\Re\bigl(re^{i(\omega t+kx)}\bigr)$、$\Re\bigl(\tau e^{i(\omega t-kx)}\bigr)$，$r$、$\tau$可以是复数。

    （1）写出连接处的两个条件。

    （2）求$r$、$\tau$，证明$\lvert r\rvert^2+\lvert\tau\rvert^2=1$。

    （3）$\omega\to0$和$\omega\to\infty$时各是怎样？解释原因。
  hints:
    - |
      位移仍然连续；小珠有质量，两段弦对它的横向拉力之和等于$M$乘它的加速度。
    - |
      $1+r=\tau$；$-M\omega^2\tau=T\bigl(\pdv{y_2}x-\pdv{y_1}x\bigr)\big|_{x=0}=-ikT(\tau-1+r)$，$kT=\omega Z$。
    - |
      （2）$r=\frac{-iM\omega}{2Z+iM\omega}$，$\tau=\frac{2Z}{2Z+iM\omega}$。（3）低频时小珠跟着弦走，几乎不反射；高频时小珠来不及动，像固定端，$r\to-1$。
  reference: |
    （1）位移连续：$y_1(0,t)=y_2(0,t)$，即$1+r=\tau$。小珠：$M\ddot y(0,t)=T\bigl(\pdv{y_2}x-\pdv{y_1}x\bigr)\big|_{x=0}$。

    （2）$\pdv{y_1}x\big|_0$对应$-ik(1-r)$，$\pdv{y_2}x\big|_0$对应$-ik\tau$，$\ddot y$对应$-\omega^2\tau$，所以$-M\omega^2\tau=-ikT(\tau-1+r)$。用$\tau=1+r$，右边是$-2ikTr$，又$kT=\frac\omega vT=\omega Z$，得$M\omega\tau=2iZr$，即$r=-\frac{iM\omega}{2Z}(1+r)$，解出$r=\frac{-iM\omega}{2Z+iM\omega}$，$\tau=1+r=\frac{2Z}{2Z+iM\omega}$。$\lvert r\rvert^2+\lvert\tau\rvert^2=\frac{M^2\omega^2+4Z^2}{4Z^2+M^2\omega^2}=1$：两边是同样的弦，这正是能量守恒（见[波的能量与能流](lesson:physics.oscillations-waves.wave-energy)）。

    （3）$\omega\to0$：$r\to0$、$\tau\to1$，变化很慢时小珠被弦带着走，好像不存在。$\omega\to\infty$：$r\to-1$、$\tau\to0$，振动太快，小珠的惯性让它几乎不动，相当于固定端。中间的频率下$r$是复数，反射波和入射波的相位差既不是$0$也不是$\pi$。

- id: p6
  tier: hard
  statement: |
    两根弦的张力不同：弦 1 是$T_1$、$\mu_1$，弦 2 是$T_2$、$\mu_2$。连接处是一个套在光滑竖杆上的轻环，竖杆沿$y$方向，能给环水平方向的力，不能给竖直方向的力。

    （1）写出连接处的两个条件。

    （2）证明反射系数、透射系数仍是$r=\frac{Z_1-Z_2}{Z_1+Z_2}$、$\tau=\frac{2Z_1}{Z_1+Z_2}$，$Z_i=\sqrt{T_i\mu_i}$。

    （3）两根弦线密度相同、$T_2=4T_1$时，$r$是多少？弦 2 的波速大还是小？
  hints:
    - |
      两边的张力不同，环受的水平合力由竖杆平衡；竖直方向只有两段弦的拉力。
    - |
      竖直方向：$T_1\pdv{y_1}x=T_2\pdv{y_2}x$；再照讲解的推导，乘的是各自的张力。
    - |
      （2）$\frac{T_1}{v_1}(F-G)=\frac{T_2}{v_2}H$，$\frac{T_i}{v_i}=\sqrt{T_i\mu_i}=Z_i$。（3）$\frac{Z_2}{Z_1}=2$，$r=-\frac13$；$v_2=2v_1$，波速大。
  reference: |
    （1）位移连续：$y_1(0,t)=y_2(0,t)$。环质量不计，竖直方向两段弦的拉力抵消：$T_1\pdv{y_1}x(0,t)=T_2\pdv{y_2}x(0,t)$；水平方向的$T_2-T_1$由竖杆承担。

    （2）照讲解记$F$、$G$、$H$，$F+G=H$。斜率条件成为$T_1\frac{-F'+G'}{v_1}=-T_2\frac{H'}{v_2}$，积分得$\frac{T_1}{v_1}(F-G)=\frac{T_2}{v_2}H$，而$\frac{T_i}{v_i}=\frac{T_i}{\sqrt{T_i/\mu_i}}=\sqrt{T_i\mu_i}=Z_i$，所以$Z_1(F-G)=Z_2H$，和张力相同时的式子一样，解出同样的$r$、$\tau$。决定反射的是阻抗，不单是线密度。

    （3）$\mu$相同、$T_2=4T_1$，$\frac{Z_2}{Z_1}=2$，$r=-\frac13$，反射波倒过来；$v_2=\sqrt{4T_1/\mu}=2v_1$。这时波从慢的一侧射向快的一侧，反射波照样倒过来，可见「从快到慢才倒」只在张力相同时成立，一般要看阻抗。

- id: p7
  tier: thinking
  statement: |
    （1）两根弦的阻抗相等、线密度和张力却都不同，连接处为什么不反射？从结的受力说明。

    （2）做 B 超时，医生要先在皮肤上涂一层凝胶。为什么不涂凝胶，超声波大部分进不了身体？

    （3）「阻抗匹配」在别处还有哪些例子？
  hints:
    - |
      入射波单独存在时，连接处需要的横向力和右边的弦能提供的横向力一样吗？
    - |
      空气和人体组织的阻抗差得很多。
    - |
      想想需要把波（或信号）尽量完整地传过去的场合。
  reference: |
    （1）入射波到达连接处时，按向右的行波，左边的弦对结的拉力是$Z_1y_t$；右边的弦要像向右的行波那样跟着运动，需要的力是$Z_2y_t$。$Z_1=Z_2$时两者正好相等，不用产生反射波来「补」差额，波就全部过去了：从连接处的受力看，它分辨不出另一边换了弦。

    （2）探头和皮肤之间只要有一层薄薄的空气，超声波就要先从探头进入空气、再从空气进入人体；空气的阻抗比探头材料和人体组织小几千倍，两个界面上几乎全部反射。凝胶的阻抗和人体组织接近，把空气挤掉，超声波就能进去。

    （3）例如：音箱、耳机的放大器要和扬声器的阻抗相配；同轴电缆的末端接上和电缆阻抗相等的电阻，信号就不会反射回来；眼镜、相机镜头上的增透膜，让光在表面少反射。

- id: p8
  tier: thinking
  statement: |
    光从空气垂直射到玻璃上，反射光的电场相对入射光倒过来（相位突变$\pi$），常叫「半波损失」。

    （1）用弦来类比，空气和玻璃各相当于什么样的弦？

    （2）有人说「玻璃的波阻抗大，所以像重弦」。电磁学里波阻抗$Z=\frac EH$在玻璃里反而比在空气里小，这个说法错在哪里？

    （3）怎样对应才能前后一致？
  hints:
    - |
      光在玻璃里比在空气里慢；张力相同时，波速小的弦是哪一根？
    - |
      电磁学的波阻抗和波速成正比，弦的阻抗和波速成反比。
    - |
      看电场对应弦的哪个量：横向速度，还是横向拉力？
  reference: |
    （1）光在玻璃里慢，玻璃相当于重弦，空气相当于轻弦；波从轻弦射向重弦，反射的位移倒过来，对应反射光的电场倒过来。

    （2）它把弦的阻抗和电磁学的波阻抗当成了同一个量。弦的阻抗$\frac Tv$和波速成反比，电磁学的波阻抗$\frac{Z_0}n$和波速成正比，变化的方向正好相反；玻璃的波阻抗小，按「阻抗大像重弦」反而会推出玻璃像轻弦，和事实不符。

    （3）两种对应都能自洽，只是不能混着用。一种：电场对应弦的横向速度，那么和弦的阻抗对应的是折射率（都和波速成反比），电场的反射系数$\frac{n_1-n_2}{n_1+n_2}$和弦的$r=\frac{Z_1-Z_2}{Z_1+Z_2}$同形。另一种：电场对应弦的横向拉力，磁场对应横向速度，「力 = 阻抗 × 速度」对应「$E=ZH$」，这时电磁学的波阻抗就对应弦的阻抗，而拉力的反射系数是$-r=\frac{Z_2-Z_1}{Z_1+Z_2}$，正好是电磁学里写成波阻抗的形式。
