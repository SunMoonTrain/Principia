- id: p1
  tier: easy
  statement: |
    下面的机器或过程里，哪些违反热力学第二定律，却不违反热力学第一定律？
  answer:
    type: choice
    multiple: true
    options:
      - |
        一台机器每个循环从一个热库吸热$300\,\mathrm J$，又向这个热库放热$100\,\mathrm J$，对外做功$200\,\mathrm J$，回到原来的状态，此外没有引起别的变化
      - |
        一台机器每个循环不吸热，对外做功$50\,\mathrm J$，回到原来的状态，此外没有引起别的变化
      - |
        一块烧红的铁放进一桶冷水里，铁变凉，水变热
      - |
        一杯温水放在绝热的杯子里，一小部分自己结成冰，其余的变得更热，此外没有引起别的变化
      - |
        一台机器每个循环从高温热库吸热$1000\,\mathrm J$，从低温热库吸热$200\,\mathrm J$，对外做功$1200\,\mathrm J$，回到原来的状态，此外没有引起别的变化
    value: [1, 4, 5]
  hints:
    - |
      先对每一项记能量的账，对不上的违反第一定律。对得上的，再看它最后的效果是不是只从一个热库吸热、全部变成了功，或者只把热量从低温物体送到了高温物体。
    - |
      B 没有吸热却做了功；C 是热量从高温物体传到低温物体。A 要看它从热库净吸了多少热；D 要看结冰放出的热传给了谁，那时谁的温度高。E 的能量对得上，再让$200\,\mathrm J$的热量由热传导从高温热库流回低温热库，看合起来是什么。
    - |
      选 A、D、E。A 每个循环从一个热库净吸热$200\,\mathrm J$、全部变成功，此外没有变化，违反开尔文表述；净吸热等于做功，能量守恒。B 不吸热却做功$50\,\mathrm J$，违反第一定律，是第一类永动机。C 是热量从高温物体传到低温物体，两条定律都不违反。

      D 里要结冰的那一小部分先凉下来再结冰，放出的热都传给了比它热的其余的水，也就是热量从低温物体传到高温物体，此外没有变化，违反克劳修斯表述；放出的热等于其余的水得到的热，能量守恒。E 吸热$1200\,\mathrm J$、做功$1200\,\mathrm J$，能量守恒；再让$200\,\mathrm J$的热量由热传导从高温热库流回低温热库，合起来低温热库没有变化，只从高温热库吸热$1200\,\mathrm J$、全部变成功，违反开尔文表述。
  solution: |
    选 A、D、E。A 每个循环从一个热库净吸热$200\,\mathrm J$、全部变成功，此外没有变化，违反开尔文表述，能量却是守恒的。B 不吸热却做功，违反第一定律，是第一类永动机；C 是热量从高温物体传到低温物体，两条定律都不违反。

    D 里结冰的部分比其余的水凉，放出的热却都传给了它们，是热量从低温物体传到高温物体，此外没有变化，违反克劳修斯表述；放出的热等于其余的水得到的热，能量守恒。E 的能量也守恒；再配上$200\,\mathrm J$的热量由热传导从高温热库传到低温热库（这是允许的），合起来低温热库没有变化，只从高温热库吸热$1200\,\mathrm J$、全部变成功，违反开尔文表述。所以从两个热库都只吸热、不放热的循环机器，同样造不成。

- id: p2
  tier: easy
  statement: |
    下面哪些过程是不可逆过程？
  answer:
    type: choice
    multiple: true
    options:
      - |
        理想气体在同温的热库里被准静态地等温压缩，活塞和气缸壁之间没有摩擦
      - |
        单摆在空气中越摆越低，最后停下
      - |
        一杯$80\,^\circ\mathrm C$的热水放在$20\,^\circ\mathrm C$的房间里，慢慢变凉
      - |
        没有摩擦的气缸里，气体被极其缓慢地绝热压缩（adiabatic compression）
      - |
        一滴墨水滴进静止的清水里，慢慢散开
    value: [2, 3, 5]
  hints:
    - |
      对照热现象里可逆过程要满足的条件：准静态，没有摩擦一类的能量耗散，不隔着有限的温差传热，缺一条就不可逆。也可以设想让系统和外界都复原，看会不会违反开尔文表述或克劳修斯表述。
    - |
      B 里空气阻力（air resistance）把单摆的机械能（mechanical energy）变成了内能；C 是隔着有限温差的热传导；E 散开的途中各处浓淡不同，要把墨水收回一滴又不引起别的变化，和例 1 里的气体比一比。A、D 倒过来走一遍，看气体、热库和外界是不是都复原。
    - |
      选 B、C、E。A：准静态、没有摩擦，气体始终和热库同温，倒过来让气体在同一个热库里准静态地等温膨胀，气体、热库和外界都复原，可逆。B：空气阻力把机械能变成内能，要复原就得从周围吸热、全部变回机械能而不引起别的变化，违反开尔文表述，不可逆。C：热水隔着有限温差向房间放热，要复原就得把热量从房间传回更热的水而不引起别的变化，违反克劳修斯表述，不可逆。

      D：准静态、没有摩擦、不传热，倒过来让气体极其缓慢地绝热膨胀，气体和外界就都复原了，可逆。E：墨水散开的途中各处浓淡不同，不是准静态的；要把它收回原来那一滴又不引起别的变化，和例 1 的气体一样办不到，不可逆。
  solution: |
    选 B、C、E。A、D 都是没有摩擦的准静态过程，A 只和同温的热库交换热量，D 不传热，倒过来沿原路走一遍，气体、热库和外界都复原，是可逆过程。B 里空气阻力把单摆的机械能变成了内能，要复原就得从周围吸热、全部变回机械能而不引起别的变化，违反开尔文表述。

    C 是隔着有限温差的传热，要复原就得把热量从房间传回更热的水而不引起别的变化，违反克劳修斯表述。E 散开的途中各处浓淡不同，不是准静态的；要把墨水收回原来那一滴又不引起别的变化，和例 1 的气体一样办不到。B、C、E 都是不可逆过程。

- id: p3
  tier: medium
  statement: |
    装置甲违反克劳修斯表述：每个循环把一些热量从低温热库送到高温热库，此外什么都不变。热机乙在同样两个热库之间工作，热机效率是$0.30$，每个循环对外做功$450\,\mathrm J$。

    让甲每个循环把乙放给低温热库的热量全部送回高温热库。依次求甲每个循环送回的热量，以及甲、乙合起来，高温热库每个循环净放出的热量。
  answer:
    type: tuple
    value: [450/0.30 - 450, 450]
    unit: |
      $\mathrm J$
  hints:
    - |
      热机效率是哪两个量之比？由它求出乙每个循环从高温热库吸收、向低温热库放出的热量，再给高温热库记账。
    - |
      $Q_{\mathrm H}=\frac W\eta$，$Q_{\mathrm L}=Q_{\mathrm H}-W$；甲送回的就是$Q_{\mathrm L}$，高温热库净放出$Q_{\mathrm H}-Q_{\mathrm L}$。
    - |
      $Q_{\mathrm H}=\frac{450}{0.30}\,\mathrm J=1500\,\mathrm J$，$Q_{\mathrm L}=1500\,\mathrm J-450\,\mathrm J=1050\,\mathrm J$，甲每个循环送回$1050\,\mathrm J$。高温热库净放出$1500\,\mathrm J-1050\,\mathrm J=450\,\mathrm J$，正好等于乙做的功。
  solution: |
    乙每个循环从高温热库吸热$Q_{\mathrm H}=\frac W\eta=1500\,\mathrm J$，向低温热库放热$Q_{\mathrm L}=Q_{\mathrm H}-W=1050\,\mathrm J$，甲把这$1050\,\mathrm J$送回高温热库。合起来，低温热库没有净变化，高温热库每个循环净放出$1500\,\mathrm J-1050\,\mathrm J=450\,\mathrm J$，全部变成了乙做的功，此外什么都不变。甲、乙合起来就是一台违反开尔文表述的机器。

- id: p4
  tier: medium
  statement: |
    机器丙违反开尔文表述：每个循环从高温热库吸热$500\,\mathrm J$，全部变成功，此外什么都不变。用这份功带动一台制冷机，它从一个温度更低的热库吸热、向这个高温热库放热，制冷系数（coefficient of performance）$\frac{Q_{\mathrm L}}{|W|}$是$3.2$。

    依次求制冷机每个循环放进高温热库的热量，以及丙和制冷机合起来，高温热库每个循环净得到的热量。
  answer:
    type: tuple
    value: [3.2*500 + 500, 3.2*500]
    unit: |
      $\mathrm J$
  hints:
    - |
      外界对制冷机做的功是多少？由制冷系数求出它从低温热库吸收的热量，再看它向高温热库放多少热。
    - |
      $|W|=500\,\mathrm J$，$Q_{\mathrm L}=3.2|W|$，制冷机向高温热库放热$Q_{\mathrm L}+|W|$；高温热库还要给丙$500\,\mathrm J$。
    - |
      $Q_{\mathrm L}=3.2\times500\,\mathrm J=1600\,\mathrm J$，放进高温热库$1600\,\mathrm J+500\,\mathrm J=2100\,\mathrm J$。高温热库净得到$2100\,\mathrm J-500\,\mathrm J=1600\,\mathrm J$，正好是制冷机从低温热库取走的热量。
  solution: |
    丙做的功全部用来带动制冷机，外界对制冷机做的功$|W|=500\,\mathrm J$。制冷机从低温热库吸热$Q_{\mathrm L}=3.2\times500\,\mathrm J=1600\,\mathrm J$，向高温热库放热$Q_{\mathrm L}+|W|=2100\,\mathrm J$；高温热库给了丙$500\,\mathrm J$，净得到$1600\,\mathrm J$。合起来外界不做功，$1600\,\mathrm J$的热量从低温热库到了高温热库，此外什么都不变，违反克劳修斯表述。

- id: p5
  tier: hard
  statement: |
    水平的气缸浸在温度为$T$的热库里，缸里封着一定量的理想气体，活塞的面积为$A$。活塞和气缸壁之间有滑动摩擦力，大小恒为$f$，方向和活塞相对气缸的运动方向相反，摩擦生的热全部传给热库。水平方向上，除了气体的压力和摩擦力，活塞只受外界的推力$F_{\text{推}}$，大气的压力也算在$F_{\text{推}}$里。

    外界极其缓慢地把活塞推进一段距离$d$，再极其缓慢地拉回原处，每一时刻气体都几乎处在平衡态（equilibrium state）。

    （1）证明气体回到了原来的状态，这一来一回$F_{\text{推}}$一共做功$2fd$，热库一共得到热量$2fd$。

    （2）这个过程是准静态的。用开尔文表述证明它仍是不可逆过程。

    （3）$f$越来越小、趋于零时会怎样？由此说明可逆过程为什么不能有摩擦。
  hints:
    - |
      （1）活塞极其缓慢地移动，受的合力近似为零，推进、拉回时$F_{\text{推}}$各是多少？气体两次都沿哪条曲线走？（2）假如它可逆，让一切复原的那个过程，对热库和外界各有什么效果？
    - |
      （1）以向里为正，推进时$F_{\text{推}}=pA+f$，拉回时$F_{\text{推}}=pA-f$，$p$是气体此刻的压强；气体始终和热库同温，两次沿同一条等温线（isotherm）走，一去一回的$\int p\,\dd V$正好抵消。（2）复原的过程要让外界取回$2fd$的功、热库交出$2fd$的热量，此外什么都不变。
    - |
      （1）活塞极其缓慢地移动，加速度近似为零，受力平衡。以向里为正：推进时摩擦力向外，$F_{\text{推}}=pA+f$；拉回时摩擦力向里，$F_{\text{推}}=pA-f$。气体始终几乎处在平衡态，又和热库同温，推进、拉回都沿温度为$T$的同一条等温线，回到原处时体积、温度都和开始时一样，所以回到了原来的状态。

      记开始时的体积为$V_1$，推到底时为$V_2=V_1-Ad$，$W_{\text{等温}}=\int_{V_2}^{V_1}p\,\dd V$。推进时$F_{\text{推}}$做功$W_{\text{等温}}+fd$；拉回时活塞向外移动，$F_{\text{推}}$做功$-W_{\text{等温}}+fd$。两者相加，$F_{\text{推}}$一共做功$2fd$。

      气体的内能不变，压力对它做的净功为零，所以它和热库之间的热量一去一回也正好抵消；摩擦两次各生热$fd$，全部传给热库，热库一共得到$2fd$，和$F_{\text{推}}$做的功相等。

      （2）假如这个过程可逆，就有另一个过程使气体、热库和外界都复原：外界取回$2fd$的功，热库交出$2fd$的热量，此外什么都不变。这正是从单一热库吸热、全部变成功而不引起别的变化，违反开尔文表述。所以这个过程不可逆，尽管它是准静态的。

      （3）$f\to0$时，外界白白付出、变成热的$2fd$趋于零，过程越来越接近可逆；$f=0$时就是可逆的等温压缩和膨胀。只要有摩擦，功就有一部分变成热、收不回来，所以可逆过程不能有摩擦。
  reference: |
    （1）准静态、加速度为零：推进时$F_{\text{推}}=pA+f$，拉回时$F_{\text{推}}=pA-f$（向里为正）。气体始终与热库同温，往返都沿$T$的等温线，回到原体积、原温度，即原状态。记$W_{\text{等温}}=\int_{V_2}^{V_1}p\,\dd V$（$V_2=V_1-Ad$），推进时$F_{\text{推}}$做功$W_{\text{等温}}+fd$，拉回时$-W_{\text{等温}}+fd$，共$2fd$。气体$\Delta U=0$、净功为零，故与热库的净换热为零；摩擦热$2fd$全进热库。

    （2）若可逆，则存在使一切复原的过程，其净效果是热库放热$2fd$、外界得功$2fd$、别无变化，违反开尔文表述。故准静态但不可逆。

    （3）$f\to0$时损失$2fd\to0$，是可逆过程的极限；可逆要求无摩擦等耗散。

- id: p6
  tier: hard
  statement: |
    一台机器循环工作，只和一个热库交换热量，每个循环从热库吸收的净热量是$Q$，对外做的净功是$W$。

    （1）证明$W\le0$。

    （2）如果这台机器的循环是可逆过程，证明$W=0$，$Q=0$。

    （3）系统沿两条不同的可逆路径甲、乙从平衡态 A 变到平衡态 B，途中都只和同一个热库交换热量。用（2）证明，两条路径上系统从热库吸收的热量相同，对外做的功也相同。
  hints:
    - |
      （1）一个循环里内能怎样变？$W>0$会违反什么？（2）可逆的循环倒过来运行，热量和功怎样变？（3）沿一条路径去，沿另一条倒着回来。
    - |
      （1）$\Delta U=0$，$W=Q$。（2）倒过来的机器仍只和这个热库交换热量，每个循环对外做功$-W$。（3）这样走一圈，是只和这个热库交换热量的可逆循环。
    - |
      （1）一个循环回到原来的状态，内能不变，由热力学第一定律，$W=Q$。如果$W>0$，机器每个循环从这个热库吸热$Q=W$，全部变成功，回到了原来的状态，此外没有别的变化，违反开尔文表述。所以$W\le0$。

      （2）可逆的循环能倒过来运行，各段的热量和功只改变正负，倒过来的机器仍只和这个热库交换热量，每个循环对外做功$-W$。由（1），$W\le0$，$-W\le0$，所以$W=0$，$Q=W=0$。

      （3）设系统沿甲从 A 到 B 吸热$Q_{\text{甲}}$、做功$W_{\text{甲}}$，沿乙吸热$Q_{\text{乙}}$、做功$W_{\text{乙}}$。沿甲去，再沿乙倒着回来，倒着走时乙的热量和功都变号，合起来是一个只和这个热库交换热量的可逆循环，净吸热$Q_{\text{甲}}-Q_{\text{乙}}$，净功$W_{\text{甲}}-W_{\text{乙}}$。由（2），两者都是零，所以$Q_{\text{甲}}=Q_{\text{乙}}$，$W_{\text{甲}}=W_{\text{乙}}$。
  reference: |
    （1）循环$\Delta U=0$，$W=Q$；若$W>0$，即从单一热库吸热全部变成功而无其他变化，违反开尔文表述，故$W\le0$。

    （2）可逆循环反向运行，热量、功全部变号，仍只与这一个热库换热，由（1）得$-W\le0$，结合$W\le0$得$W=0$，$Q=0$。

    （3）A 沿甲到 B，再沿乙反向回 A，构成只与该热库换热的可逆循环，净热$Q_{\text{甲}}-Q_{\text{乙}}$、净功$W_{\text{甲}}-W_{\text{乙}}$，由（2）均为零。

- id: p7
  tier: thinking
  statement: |
    （1）夏天关紧厨房的门窗，打开冰箱门，让冰箱开着门一直工作。厨房会变凉吗？

    （2）空调为什么要把一部分装在室外？

    （3）有一种吸收式冰箱（absorption refrigerator）没有压缩机，只靠火焰加热就能制冷。它违反克劳修斯表述吗？如果不违反，「别的变化」是什么？
  hints:
    - |
      （1）把整个厨房连同冰箱看成一个整体，它和外面交换什么？压缩机消耗的电能最后到了哪里？（3）给冷藏室、火焰、厨房各记一笔热量的账。
    - |
      （1）（2）冰箱从冷藏室取走的热量，连同压缩机做的功，都从散热的地方放回厨房；要让一个房间整体变凉，热量得送到哪里去？（3）火焰的温度比厨房高得多，它放出的热量最后到了哪里？
    - |
      （1）时间长了不会变凉，反而变热。开着门时，冰箱从门口的空气吸热$Q_{\mathrm L}$，从背面向厨房放热$Q_{\mathrm L}+|W|$，两者都在厨房里，厨房净得到压缩机做的功$|W|$，这份电能最后都变成了厨房的内能。刚开门时，冷藏室里的冷空气、冷食物可能让厨房先凉一会儿；等它们也升到室温，厨房就越来越热，直到门窗、墙壁每秒漏出去的热和压缩机每秒做的功一样多。

      （2）要让房间整体变凉，得把热量从房间送到更热的室外；由克劳修斯表述，只靠室内、室外两个热库，就得靠外界做功。空调在室内吸热，压缩机做功，再把吸的热连同这份功一起在室外放掉，所以放热的那一部分必须装在室外。

      （3）不违反。火焰放出热量$Q_{\text{火}}$，冷藏室放出热量$Q_{\mathrm L}$，外界没有做功，厨房一共得到$Q_{\text{火}}+Q_{\mathrm L}$。$Q_{\mathrm L}$从冷藏室到了更热的厨房，可同时有$Q_{\text{火}}$从温度高得多的火焰流到了厨房，这就是「别的变化」。它相当于火焰和厨房之间的一台热机带动一台制冷机，比（2）多了火焰这个温度更高的热库；火一灭，就不再制冷。
  reference: |
    （1）时间长了不会变凉，反而变热：冰箱在厨房里吸热$Q_{\mathrm L}$、放热$Q_{\mathrm L}+|W|$，厨房净得电功$|W|$，全部成为厨房的内能，升温到门窗、墙壁散热的功率等于压缩机的功率为止。刚开门时冷藏室里的冷空气、冷食物升温要吸热（$10\,\mathrm{kg}$食物升温$20\,\mathrm K$约吸$840\,\mathrm{kJ}$），厨房可能先凉一会儿。

    （2）给房间降温要把热量从房间送到更热的室外，只靠室内、室外两个热库时，克劳修斯表述要求外界做功；吸的热连同压缩机的功都在室外放出，所以散热部分必须在室外。

    （3）不违反：冷藏室放热$Q_{\mathrm L}$、火焰放热$Q_{\text{火}}$，厨房得到$Q_{\mathrm L}+Q_{\text{火}}$，外界不做功。热量$Q_{\text{火}}$从高温的火焰到了厨房，就是「别的变化」；相当于火焰与厨房之间的热机带动制冷机。

- id: p8
  tier: thinking
  statement: |
    （1）分子之间的力只由位置决定，牛顿运动定律（Newton's laws of motion）就在时间反演（time reversal）下不变：把一段分子运动的录像倒着放，每个分子的运动仍然符合力学规律。那为什么从来没见过自由膨胀倒过来，气体自己缩回容器的一半？

    （2）麦克斯韦（James Clerk Maxwell）设想一个小妖精守着隔板上的一扇小门，只放快的分子到右边、慢的分子到左边，这个设想叫作麦克斯韦妖（Maxwell's demon）。开始时两边的温度相同，过一阵子右边变热、左边变冷，小妖精却没有做功。这违反哪一种表述？为什么说它其实做不到？（开放作答）
  hints:
    - |
      （1）倒放的录像要求每个分子从什么样的状态出发？这样的状态多不多？（2）热量从哪边到了哪边，外界做功了吗，有没有别的变化？小妖精要知道什么，才能决定开不开门？
    - |
      （1）气体自己缩回去，要求极多分子的位置和速度恰好配合得一丝不差，这样的状态比胀满整个容器的状态少得可以忽略。（2）想想克劳修斯表述；小妖精要测出每个分子的速度、记住它，它和小门自己也在做热运动（thermal motion）。
    - |
      （1）倒放的录像确实符合力学，可它要求倒放那一刻，极多分子的位置和速度恰好配合得一丝不差，一齐朝容器的一半跑去。气体分子数以$10^{23}$计，在所有可能的状态里，这样配合好的状态少得可以忽略，稍有一点扰动就被打乱；胀满整个容器的状态则多得多。所以力学允许的事实际上看不到，宏观过程的方向来自大量分子的统计规律（见[玻尔兹曼熵与统计温度](lesson:physics.thermal-physics.statistical-entropy)）。

      （2）右边变热、左边变冷以后，小妖精继续分拣，就是把热量从较冷的左边送到较热的右边，外界没有做功，看起来也没有别的变化，违反克劳修斯表述；再用两边的温差开一台热机，又能违反开尔文表述。可小妖精自己也是这个系统的一部分：它要测出每个分子的速度、记住结果，还要开关小门，它和小门也在做热运动，会被分子撞得抖个不停、看不准。仔细的分析表明，把小妖精测量、记忆、擦掉记忆所付出的代价也算进来，热力学第二定律仍然成立（开放作答，说出其中的道理即可）。
  reference: |
    （1）微观规律时间反演对称，但倒放要求极其特殊的初始条件（全部分子的位置、速度精确配合），这样的状态在全部可能的状态中只占极小的比例（例如全部分子恰好都在左半边，只占约$2^{-N}$），且对微小扰动极不稳定；大致均匀分布的状态占绝大多数。宏观的不可逆是统计规律（统计意义在玻尔兹曼熵与统计温度一节）。

    （2）小妖精不做功、看起来也不引起别的变化，就把热量从冷的一边送到热的一边，违反克劳修斯表述（再接热机也违反开尔文表述）。做不到的理由（开放）：小妖精和门处在同样的温度、自身也有热涨落，无法可靠地只放快分子；测量和记录分子的信息有代价，记忆有限，每擦除 1 比特信息至少要放出$\kB T\ln2$的热（兰道尔原理）。把小妖精算进系统，总的效果不违反第二定律。也可以提阻尼振动、电阻生热、磁滞等宏观不可逆的例子，作为同类现象。
