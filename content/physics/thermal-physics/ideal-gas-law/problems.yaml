- id: p1
  tier: easy
  statement: |
    容积为$2.50\,\mathrm L$的容器里装着氮气，压强是$2.00\times10^5\,\mathrm{Pa}$，温度是$300\,\mathrm K$。把氮气看成理想气体，它的物质的量是多少？结果保留三位有效数字。
  answer:
    type: number
    value: 2.00e5*2.50e-3/(8.31446261815324*300)
    unit: |
      $\mathrm{mol}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      三个状态参量都知道了，用理想气体状态方程解出$n$。
    - |
      $n=\frac{pV}{RT}$；体积要换成立方米，$2.50\,\mathrm L=2.50\times10^{-3}\,\mathrm{m^3}$。
    - |
      $n=\frac{2.00\times10^5\times2.50\times10^{-3}}{8.314\times300}\,\mathrm{mol}=\frac{500}{2494}\,\mathrm{mol}\approx0.200\,\mathrm{mol}$。
  solution: |
    由$pV=nRT$，$n=\frac{pV}{RT}=\frac{2.00\times10^5\times2.50\times10^{-3}}{8.314\times300}\,\mathrm{mol}\approx0.200\,\mathrm{mol}$。体积要用$\mathrm{m^3}$，$pV$的单位才是$\mathrm J$。结果和是不是氮气无关：温度、压强、体积都相同时，任何理想气体的物质的量都相同。

- id: p2
  tier: easy
  statement: |
    下面哪些说法正确？各项里的气体都看成理想气体。
  answer:
    type: choice
    multiple: true
    options:
      - |
        一定质量的气体，体积压缩到原来的$\frac14$，热力学温度变为原来的 2 倍，压强就变为原来的 8 倍
      - |
        温度、压强都相同时，质量相同的氢气和氧气占的体积也相同
      - |
        温度、压强都相同时，$2\,\mathrm L$氦气里的分子数是$1\,\mathrm L$氮气里的 2 倍
      - |
        温度不变时，一定质量的气体的密度和压强成反比
      - |
        在$p$-$V$图上，同一份气体的两条温度不同的等温线不会相交
    value: [1, 3, 5]
  hints:
    - |
      逐项用$pV=nRT$判断：哪些量不变，哪两个量成正比，哪两个量成反比？
    - |
      A 用$\frac{pV}T$不变；B、C 里温度、压强相同，体积和物质的量、分子数都成正比；D 用$\rho=\frac{pM}{RT}$；E 想想图上的一个点有几个温度。
    - |
      A 对：$\frac{p_2}{p_1}=\frac{V_1}{V_2}\cdot\frac{T_2}{T_1}=4\times2=8$。B 错：质量相同时，氢气（$2\,\mathrm{g/mol}$）的物质的量是氧气（$32\,\mathrm{g/mol}$）的 16 倍，体积也是 16 倍。C 对：$N=\frac{pV}{\kB T}$，同温同压下分子数和体积成正比，和是什么气体无关。

      D 错：$\rho=\frac{pM}{RT}$，温度不变时密度和压强成正比。E 对：图上的一个点是一个状态，它的温度$T=\frac{pV}{nR}$只有一个值，温度不同的两条等温线不会经过同一个点。
  solution: |
    选 A、C、E。A 对：由$\frac{pV}T$不变，$\frac{p_2}{p_1}=\frac{V_1}{V_2}\cdot\frac{T_2}{T_1}=4\times2=8$。B 错：同温同压下体积和物质的量成正比，质量相同时，氢气的物质的量是氧气的$\frac{32}{2}=16$倍，体积也是 16 倍。

    C 对：$N=\frac{pV}{\kB T}$，同温同压下分子数只和体积有关，和是什么气体无关。D 错：$\rho=\frac{pM}{RT}$，温度不变时密度和压强成正比：压强加倍，体积减半，质量不变，密度加倍。E 对：图上的一个点是一个状态，它的温度$T=\frac{pV}{nR}$只有一个值，所以温度不同的两条等温线不会经过同一个点。

- id: p3
  tier: medium
  statement: |
    热气球的球囊容积是$2200\,\mathrm{m^3}$，下端开口，球内外的压强都是$1.0\times10^5\,\mathrm{Pa}$，球囊的容积不变。开始时球内空气和外面一样是$280\,\mathrm K$，把它加热到$350\,\mathrm K$以后，球内空气的质量减少了多少千克？空气看成理想气体，摩尔质量取$29\,\mathrm{g/mol}$，结果保留三位有效数字。
  answer:
    type: number
    value: 1.0e5*2200*0.029/8.31446261815324*(1/280-1/350)
    unit: |
      $\mathrm{kg}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      球囊开口，球内空气的压强和体积都不变，加热时一部分空气从下口跑了出去。球内空气的质量怎样随温度变？
    - |
      球内空气的质量是$nM=\frac{pVM}{RT}$，加热前后相减：$\Delta m=\frac{pVM}R\Bigl(\frac1{T_1}-\frac1{T_2}\Bigr)$。
    - |
      $\frac{pVM}R=\frac{1.0\times10^5\times2200\times0.029}{8.314}\,\mathrm{kg\cdot K}\approx7.67\times10^5\,\mathrm{kg\cdot K}$，$\frac1{280}-\frac1{350}\approx7.14\times10^{-4}\,\mathrm{K^{-1}}$，相乘得约$548\,\mathrm{kg}$。
  solution: |
    球囊开口，球内空气的压强、体积都不变，质量$nM=\frac{pVM}{RT}$和热力学温度成反比。减少的质量是$\frac{pVM}R\Bigl(\frac1{280\,\mathrm K}-\frac1{350\,\mathrm K}\Bigr)\approx7.67\times10^5\,\mathrm{kg\cdot K}\times7.14\times10^{-4}\,\mathrm{K^{-1}}\approx548\,\mathrm{kg}$。同样体积的球外冷空气比球内热空气重这么多，所以球皮、吊篮和乘客的总质量小于约$548\,\mathrm{kg}$时，热气球才能升起来（见[浮力与阿基米德原理](lesson:physics.newtonian-mechanics.buoyancy)）。

- id: p4
  tier: medium
  statement: |
    容器 A 的容积是$2.0\,\mathrm L$，装着压强为$3.0\times10^5\,\mathrm{Pa}$、温度为$300\,\mathrm K$的某种气体；容器 B 的容积是$3.0\,\mathrm L$，装着压强为$1.0\times10^5\,\mathrm{Pa}$、温度为$400\,\mathrm K$的同种气体。用一根细管把两个容器连通，A 始终保持$300\,\mathrm K$，B 始终保持$400\,\mathrm K$，细管的容积不计，气体看成理想气体。气体不再流动以后，压强是多少$\mathrm{kPa}$？
  answer:
    type: number
    value: (300*2.0/300 + 100*3.0/400)/(2.0/300 + 3.0/400)
    unit: |
      $\mathrm{kPa}$
  hints:
    - |
      连通以后，气体在两边之间流动，直到两边的压强相同；两个容器里气体的物质的量之和不变。
    - |
      设最后的压强是$p$，则$\frac{pV_{\mathrm A}}{RT_{\mathrm A}}+\frac{pV_{\mathrm B}}{RT_{\mathrm B}}=\frac{p_{\mathrm A}V_{\mathrm A}}{RT_{\mathrm A}}+\frac{p_{\mathrm B}V_{\mathrm B}}{RT_{\mathrm B}}$。$R$约掉以后，压强可以用$\mathrm{kPa}$、体积用$\mathrm L$代入。
    - |
      $p\Bigl(\frac{2.0}{300}+\frac{3.0}{400}\Bigr)=\frac{300\times2.0}{300}+\frac{100\times3.0}{400}=2.75$，括号里约为$0.014\,17$，所以$p\approx194.1\,\mathrm{kPa}$。
  solution: |
    气体不再流动时两边压强相同，设为$p$；两边的物质的量之和不变：$\frac{pV_{\mathrm A}}{RT_{\mathrm A}}+\frac{pV_{\mathrm B}}{RT_{\mathrm B}}=\frac{p_{\mathrm A}V_{\mathrm A}}{RT_{\mathrm A}}+\frac{p_{\mathrm B}V_{\mathrm B}}{RT_{\mathrm B}}$。约去$R$，用$\mathrm{kPa}$和$\mathrm L$代入，$p\Bigl(\frac{2.0}{300}+\frac{3.0}{400}\Bigr)=2+0.75$，得$p\approx194.1\,\mathrm{kPa}$。原来 A 的压强高，连通后有一部分气体从 A 流到 B，A 的压强降低，B 的压强升高。

- id: p5
  tier: hard
  statement: |
    容器里装着几种互不反应的气体，温度为$T$，每种都可以看成理想气体，第$j$种的分子数是$N_j$。设想只留下第$j$种气体，让它单独占满整个容器、温度不变，这时的压强叫作它的分压（partial pressure），记作$p_j$。

    （1）证明：混合气体的总压强等于各成分的分压之和，$p=\sum_jp_j$。这叫作道尔顿分压定律（Dalton's law of partial pressures）。

    （2）干燥空气按体积算约有$78\%$的氮气、$21\%$的氧气、$1\%$的氩气，它们的摩尔质量分别是$28.01$、$32.00$、$39.95\,\mathrm{g/mol}$。「按体积算」是什么意思？求空气的平均摩尔质量。

    （3）海平面附近（1 标准大气压）空气中氧气的分压是多少？在大气压（atmospheric pressure）只有$5.0\times10^4\,\mathrm{Pa}$的高山上呢？
  hints:
    - |
      讲解里说，压强只由数密度和温度决定，和分子是什么无关。混合气体的总数密度是多少？
    - |
      （1）$p=\frac NV\kB T$，其中$N=\sum_jN_j$；第$j$种单独占满容器时$p_j=\frac{N_j}V\kB T$。（2）同温同压下，体积和分子数成正比。（3）由（1），$\frac{p_j}p=\frac{N_j}N$。
    - |
      （1）混合气体里各种分子都在同一个容器里，总数$N=\sum_jN_j$。压强只由数密度和温度决定，和分子是什么无关，所以$p=\frac NV\kB T=\sum_j\frac{N_j}V\kB T$。第$j$种单独占满容器时，压强$p_j=\frac{N_j}V\kB T$，所以$p=\sum_jp_j$。

      （2）「按体积算」指：把各成分分开，放在同样的温度、压强下，它们的体积之比是$78:21:1$。同温同压下体积和分子数成正比，所以这也是物质的量之比。平均摩尔质量$M=0.78\times28.01+0.21\times32.00+0.01\times39.95\approx28.97\,\mathrm{g/mol}$。

      （3）氧气的分子数占$21\%$，由（1），它的分压是总压强的$21\%$：海平面附近约$0.21\times101.3\,\mathrm{kPa}\approx21.3\,\mathrm{kPa}$，在高山上约$10.5\,\mathrm{kPa}$，只有海平面的一半左右。温度差不多时，每吸一口气，吸进的氧气分子也少了一半左右，所以在高山上容易缺氧。
  reference: |
    （1）混合气体里各种分子都在同一个容器里，总数$N=\sum_jN_j$。由讲解，压强只由数密度和温度决定，和分子是什么、有多重无关，所以$p=\frac NV\kB T=\sum_j\frac{N_j}V\kB T$。第$j$种单独占满容器、温度不变时，$p_j=\frac{N_j}V\kB T$，所以$p=\sum_jp_j$。

    （2）「按体积算」指：把各成分分开，放在同样的温度、压强下，它们的体积之比是$78:21:1$。同温同压下数密度相同，体积和分子数成正比，所以这也是分子数之比、物质的量之比。平均摩尔质量$M=0.78\times28.01+0.21\times32.00+0.01\times39.95=21.848+6.720+0.3995\approx28.97\,\mathrm{g/mol}$，和讲解里取的$29\,\mathrm{g/mol}$一致。

    （3）由（1），$\frac{p_j}p=\frac{N_j}N$，氧气的分压是总压强的$21\%$。海平面附近约$0.21\times101.3\,\mathrm{kPa}\approx21.3\,\mathrm{kPa}$；大气压为$5.0\times10^4\,\mathrm{Pa}$时约$10.5\,\mathrm{kPa}$，只有海平面的一半左右。温度差不多时，同样一口气里的氧气分子也少了一半左右，所以在高山上容易缺氧。

- id: p6
  tier: hard
  statement: |
    竖直放置的气缸里，用一个轻活塞封住一段空气，活塞的面积是$A=0.010\,\mathrm{m^2}$，能无摩擦地上下滑动，上方通大气，大气压$p_0=1.0\times10^5\,\mathrm{Pa}$。活塞上面压着一根竖直的轻弹簧，弹簧上端固定，劲度系数（spring constant）是$k=2.0\times10^3\,\mathrm{N/m}$，开始时恰好是原长。开始时气柱高$h_0=0.20\,\mathrm m$，温度是$300\,\mathrm K$，把气体缓慢加热到$450\,\mathrm K$。

    （1）活塞升高多少？弹簧的弹力见[常见的力](lesson:physics.newtonian-mechanics.common-forces#def-hooke)。

    （2）没有弹簧时，活塞升高多少？有弹簧时为什么升得少？
  hints:
    - |
      气体的物质的量不变，用$\frac{pV}T$不变；末状态的压强要由活塞受力平衡求出。
    - |
      开始时弹簧是原长，活塞又轻，$p_1=p_0$。活塞升高$x$时，弹簧被压缩$x$，向下推活塞的力是$kx$，气体压强$p_2=p_0+\frac{kx}A$，体积$V_2=A(h_0+x)$。
    - |
      （1）由$\frac{p_1V_1}{T_1}=\frac{p_2V_2}{T_2}$，$\frac{p_0Ah_0}{300}=\frac{(p_0A+kx)(h_0+x)}{450}$。代入数值（国际单位制），$(1000+2000x)(0.20+x)=300$，整理得$20x^2+14x-1=0$。取正根，$x=\frac{-14+\sqrt{276}}{40}\approx0.065\,\mathrm m$，活塞升高约$6.5\,\mathrm{cm}$。

      （2）没有弹簧时，压强始终是$p_0$，体积和热力学温度成正比，气柱高变为$0.20\,\mathrm m\times\frac{450}{300}=0.30\,\mathrm m$，活塞升高$10\,\mathrm{cm}$。有弹簧时，活塞越往上，弹簧推得越重，气体的压强越大；同样升到$450\,\mathrm K$，$pV$都要变为原来的$1.5$倍，压强大了，体积就不必胀那么多。
  reference: |
    （1）开始时弹簧是原长，活塞又轻，气体压强$p_1=p_0$，体积$V_1=Ah_0$。活塞升高$x$时，弹簧被压缩$x$，向下推活塞的力是$kx$；活塞受力平衡，$p_2A=p_0A+kx$，体积$V_2=A(h_0+x)$。由$\frac{p_1V_1}{T_1}=\frac{p_2V_2}{T_2}$，$\frac{p_0Ah_0}{300}=\frac{(p_0A+kx)(h_0+x)}{450}$。

    代入数值（国际单位制），$p_0Ah_0\times\frac{450}{300}=1000\times0.20\times1.5=300$，$(1000+2000x)(0.20+x)=300$，即$2000x^2+1400x-100=0$，$20x^2+14x-1=0$。取正根，$x=\frac{-14+\sqrt{276}}{40}\approx0.0653\,\mathrm m$，活塞升高约$6.5\,\mathrm{cm}$。验算：$p_2\approx1.131\times10^5\,\mathrm{Pa}$，$V_2\approx2.653\times10^{-3}\,\mathrm{m^3}$，$p_2V_2\approx300\,\mathrm J$，正是开始时$p_1V_1=200\,\mathrm J$的$1.5$倍。

    （2）没有弹簧时压强始终是$p_0$，体积和热力学温度成正比，气柱高变为$0.20\,\mathrm m\times\frac{450}{300}=0.30\,\mathrm m$，活塞升高$10\,\mathrm{cm}$。有弹簧时，活塞越往上，弹簧推得越重，气体的压强越大。两种情况下$pV$都要从$200\,\mathrm J$变为$300\,\mathrm J$，压强大了，体积就不必胀那么多。

- id: p7
  tier: thinking
  statement: |
    压强很大时，实际气体的$\frac{pV}{nRT}$会偏离 1。

    （1）分子本身占有一定的体积，分子能自由活动的空间比容器的容积小。只考虑这一点，$\frac{pV}{nRT}$会比 1 大还是小？

    （2）分子之间有吸引力，靠近器壁的分子会被身后的分子往回拉。只考虑这一点，$\frac{pV}{nRT}$会比 1 大还是小？

    （3）为什么压强很低时，这两点都可以不管？
  hints:
    - |
      压强来自分子撞击器壁。活动的空间小了，撞击会更频繁还是更少？往回拉的力让撞击更重还是更轻？
    - |
      （1）把分子能自由活动的体积记作$V-V_0$，$V_0$由分子本身的大小决定。（2）容器中间的分子四面八方都受吸引，靠近器壁的分子只受到身后的吸引。（3）想想压强低时分子之间相距多远。
    - |
      （1）比 1 大。分子能活动的空间只有$V-V_0$，相当于把同样多的分子挤在更小的体积里，撞击器壁更频繁，压强约为$\frac{nRT}{V-V_0}$，比$\frac{nRT}V$大，所以$\frac{pV}{nRT}>1$。

      （2）比 1 小。容器中间的分子四面八方都受吸引，合起来抵消；靠近器壁的分子只受到身后的分子往回拉，撞上器壁时被拉慢了一些，撞得轻了，压强比没有吸引时小，所以$\frac{pV}{nRT}<1$。

      （3）压强低时分子之间相距很远：$0\,^\circ\mathrm C$、1 标准大气压下约为分子直径的 10 倍，分子本身只占体积的不到千分之一，$V_0$比$V$小得多；分子之间的吸引只在很近时才明显，分子多数时候离别的分子很远，往回拉的作用也很弱。两点都随压强降低而消失，所以稀薄的气体都接近理想气体。实际气体两种效应都有：室温下二氧化碳以吸引为主，压强不太大时$\frac{pV}{nRT}$小于 1；氢气、氦气以分子本身的体积为主，$\frac{pV}{nRT}$大于 1。把这两点写进状态方程，就是[范德瓦耳斯气体与临界点](lesson:physics.thermal-physics.van-der-waals)里的方程。
  reference: |
    （1）比 1 大。分子本身占去一部分体积$V_0$，分子能活动的空间只有$V-V_0$，相当于把同样多的分子挤在更小的体积里，撞击器壁更频繁，压强约为$\frac{nRT}{V-V_0}$，比$\frac{nRT}V$大，所以$\frac{pV}{nRT}>1$。

    （2）比 1 小。容器中间的分子四面八方都受到吸引，合起来抵消；靠近器壁的分子只受到身后的分子往回拉，撞上器壁时被拉慢了一些，撞得轻了，压强比没有吸引时小，所以$\frac{pV}{nRT}<1$。

    （3）压强低时分子之间相距很远：$0\,^\circ\mathrm C$、1 标准大气压下数密度约$2.69\times10^{25}\,\mathrm{m^{-3}}$，相邻分子相距约$3.3\,\mathrm{nm}$，约为分子直径（约$0.35\,\mathrm{nm}$）的 10 倍，分子本身只占体积的不到千分之一，$V_0$比$V$小得多。分子之间的吸引只在很近时才明显，稀薄气体里分子多数时候离别的分子很远，往回拉的作用也很弱。两点都随压强降低而消失，所以稀薄的气体都接近理想气体；这也是理想气体温标要外推到气体很稀薄的原因。

    实际气体两种效应都有：室温下二氧化碳以吸引为主，压强不太大时$\frac{pV}{nRT}<1$；氢气、氦气以分子本身的体积为主，$\frac{pV}{nRT}>1$。把这两点写进状态方程，就是[范德瓦耳斯气体与临界点](lesson:physics.thermal-physics.van-der-waals)里的方程。

- id: p8
  tier: thinking
  statement: |
    胎压表测的是表压（gauge pressure），也就是轮胎里的压强比大气压（atmospheric pressure）高出的部分；轮胎里空气实际的压强叫作绝对压强（absolute pressure）。清早气温$-10\,^\circ\mathrm C$时，胎压表读$200\,\mathrm{kPa}$；中午轮胎里的空气升到$20\,^\circ\mathrm C$。设轮胎的容积不变，大气压是$101\,\mathrm{kPa}$，温度换算时取$0\,^\circ\mathrm C=273\,\mathrm K$。

    （1）中午胎压表读多少？

    （2）有人直接拿表压算：$200\,\mathrm{kPa}\times\frac{293}{263}$。他算出的读数差了多少？为什么用$pV=nRT$时一定要用绝对压强，不能用表压？
  hints:
    - |
      $pV=nRT$里的$p$是哪一个压强？先把表压换成绝对压强。
    - |
      清早的绝对压强是$200\,\mathrm{kPa}+101\,\mathrm{kPa}=301\,\mathrm{kPa}$；体积不变时，绝对压强和热力学温度成正比。
    - |
      （1）$T_1=263\,\mathrm K$，$T_2=293\,\mathrm K$，中午的绝对压强是$301\,\mathrm{kPa}\times\frac{293}{263}\approx335.3\,\mathrm{kPa}$，胎压表读$335.3\,\mathrm{kPa}-101\,\mathrm{kPa}\approx234\,\mathrm{kPa}$。

      （2）直接拿表压算得约$222.8\,\mathrm{kPa}$，比实际的读数少了约$11.5\,\mathrm{kPa}$。$pV=nRT$里的$p$是气体自己产生的压强，没有气体时它是零，和热力学温度成正比的正是它；表压把大气压当作零点，就像摄氏温度把冰点当作零点，和$T$不成正比。两者增加的千帕数相同，增加的比例却不同：绝对压强增大约$11\%$，表压增大约$17\%$。
  reference: |
    （1）清早的绝对压强是$200\,\mathrm{kPa}+101\,\mathrm{kPa}=301\,\mathrm{kPa}$，$T_1=263\,\mathrm K$；中午$T_2=293\,\mathrm K$。体积和物质的量都不变，绝对压强和热力学温度成正比，中午的绝对压强是$301\,\mathrm{kPa}\times\frac{293}{263}\approx335.3\,\mathrm{kPa}$，胎压表读$335.3\,\mathrm{kPa}-101\,\mathrm{kPa}\approx234\,\mathrm{kPa}$。

    （2）直接拿表压算，$200\,\mathrm{kPa}\times\frac{293}{263}\approx222.8\,\mathrm{kPa}$，比实际的读数$234.3\,\mathrm{kPa}$少了约$11.5\,\mathrm{kPa}$。$pV=nRT$里的$p$是气体自己对器壁的压强，没有气体时它是零，和热力学温度成正比的正是它。表压把大气压当作零点，就像摄氏温度把冰点当作零点：零点挪了，正比关系就不成立了。

    两者增加的千帕数相同（都是约$34.3\,\mathrm{kPa}$），增加的比例却不同：绝对压强增大约$11\%$，表压增大约$17\%$。拿表压按比例算，等于把增大的比例算成了$11\%$，所以算少了。
