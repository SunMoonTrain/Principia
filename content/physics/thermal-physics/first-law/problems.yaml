- id: p1
  tier: easy
  statement: |
    一定量的气体从外界吸收了$360\,\mathrm J$的热量，同时外界对它做了$170\,\mathrm J$的功。气体的内能增加了多少？
  answer:
    type: number
    value: 360 + 170
    unit: |
      $\mathrm J$
  hints:
    - |
      热力学第一定律$Q=\Delta U+W$里的$W$是气体对外做的功。外界对气体做了$170\,\mathrm J$的功，$W$是多少？
    - |
      $W=-170\,\mathrm J$，所以$\Delta U=Q-W$。
    - |
      $\Delta U=360\,\mathrm J-(-170\,\mathrm J)=530\,\mathrm J$。
  solution: |
    按本领域的约定，$W$是气体对外做的功；外界对气体做功$170\,\mathrm J$，就是$W=-170\,\mathrm J$。由$Q=\Delta U+W$，$\Delta U=Q-W=360\,\mathrm J+170\,\mathrm J=530\,\mathrm J$。吸热和外界做功都使内能增加，两份加起来；用高中课本的$\Delta U=Q+W$算（那里的$W$是外界做的功，取$170\,\mathrm J$），结果相同。

- id: p2
  tier: easy
  statement: |
    下面哪些说法正确？
  answer:
    type: choice
    multiple: true
    options:
      - |
        一定量的理想气体，内能增加了，就一定从外界吸收了热量
      - |
        按高中课本的写法$\Delta U=Q+W$，一定量的气体等压膨胀时，式中的$W$是正的
      - |
        一定量的理想气体被等压压缩时，放出的热量大于外界对它做的功
      - |
        理想气体自由膨胀前后温度相同，所以自由膨胀是等温过程
      - |
        一定量的理想气体被绝热压缩，温度升高
    value: [3, 5]
  hints:
    - |
      逐项用$Q=\Delta U+W$记账：先由体积变大还是变小看$W$的正负，再看$\Delta U$（理想气体只看温度），最后看$Q$。D 项想一想等温过程是怎样定义的。
    - |
      A 想一想绝热压缩；B 高中课本里的$W$是外界对气体做的功。C 等压压缩时温度怎样变？比较放出的热量$-Q$和外界做的功$-W$；E 绝热时$\Delta U=-W$。
    - |
      A 错：绝热压缩时$Q=0$，外界做功也能使内能增加。B 错：气体膨胀时，外界对气体做的是负功，课本式子里的$W$是负的。C 对：$p$不变、$V$减小，由$pV=nRT$，温度降低，$\Delta U<0$；放出的热量$-Q=(-\Delta U)+(-W)$，比外界做的功$-W$多出$-\Delta U>0$。

      D 错：等温过程是温度始终不变的准静态过程，自由膨胀中途气体不在平衡态，连温度都说不上，不是等温过程。E 对：$Q=0$，压缩时$W<0$，$\Delta U=-W>0$；一定量的理想气体，内能只和温度有关，温度越高内能越大，所以温度升高。
  solution: |
    选 C、E。A 错：绝热压缩时$Q=0$，外界做的功同样使内能增加，内能增加不一定靠吸热。B 错：课本式子里的$W$是外界对气体做的功，气体膨胀时外界做的是负功，$W$是负的。C 对：$p$不变、$V$减小，由$pV=nRT$，温度降低，$\Delta U<0$；放出的热量$-Q=(-\Delta U)+(-W)$，比外界做的功$-W$还多出$-\Delta U$。

    D 错：等温过程是温度始终不变的准静态过程，自由膨胀中途气体各处压强不同、不在平衡态，连温度都说不上，只是始末两个状态的温度相同。E 对：$Q=0$，压缩时$W<0$，$\Delta U=-W>0$；一定量的理想气体，内能只和温度有关，温度越高内能越大，所以温度升高。

- id: p3
  tier: medium
  statement: |
    一定量的单原子理想气体，内能$U=\frac32nRT$。在$1.2\times10^5\,\mathrm{Pa}$的恒定压强下，它的体积从$10.0\,\mathrm L$缓慢地增大到$13.0\,\mathrm L$。这一过程中气体吸收了多少热量？
  answer:
    type: number
    value: 2.5*1.2e5*(13.0e-3 - 10.0e-3)
    unit: |
      $\mathrm J$
  hints:
    - |
      压强不变，气体对外做的功好求。题里没给物质的量（amount of substance）和温度，能不能借$pV=nRT$把$\Delta U$也写成$p$、$V$的式子？
    - |
      $W=p(V_2-V_1)$；由$pV=nRT$，$U=\frac32nRT=\frac32pV$，压强不变时$\Delta U=\frac32p(V_2-V_1)$。再用$Q=\Delta U+W$。
    - |
      $p(V_2-V_1)=1.2\times10^5\times3.0\times10^{-3}\,\mathrm J=360\,\mathrm J$，$\Delta U=\frac32\times360\,\mathrm J=540\,\mathrm J$，$Q=540\,\mathrm J+360\,\mathrm J=900\,\mathrm J$。
  solution: |
    压强不变、缓慢地膨胀，是等压过程，$W=p(V_2-V_1)=1.2\times10^5\times3.0\times10^{-3}\,\mathrm J=360\,\mathrm J$。由$pV=nRT$，$U=\frac32nRT=\frac32pV$，压强不变时$\Delta U=\frac32p(V_2-V_1)=540\,\mathrm J$。所以$Q=\Delta U+W=\frac52p(V_2-V_1)=900\,\mathrm J$：吸的热有五分之三用来增加内能，五分之二用来对外做功。

- id: p4
  tier: medium
  statement: |
    一定量的气体经历一个循环 1→2→3→1。1→2 中吸热$1200\,\mathrm J$，内能增加$400\,\mathrm J$；2→3 是绝热过程，气体对外做功$300\,\mathrm J$；3→1 中气体放热$700\,\mathrm J$。3→1 中外界对气体做了多少功？
  answer:
    type: number
    value: 700 - (400 - 300)
    unit: |
      $\mathrm J$
  hints:
    - |
      一个循环回到原来的状态，三段内能的改变量加起来是多少？绝热的 2→3 中$Q$是多少？
    - |
      $\Delta U_{12}+\Delta U_{23}+\Delta U_{31}=0$，$\Delta U_{23}=-W_{23}$。求出$\Delta U_{31}$，再由$W_{31}=Q_{31}-\Delta U_{31}$求气体对外做的功；外界对气体做的功是它的相反数。
    - |
      $\Delta U_{23}=-300\,\mathrm J$，$\Delta U_{31}=-(400-300)\,\mathrm J=-100\,\mathrm J$。$Q_{31}=-700\,\mathrm J$，$W_{31}=-700\,\mathrm J-(-100\,\mathrm J)=-600\,\mathrm J$，外界对气体做功$600\,\mathrm J$。
  solution: |
    2→3 绝热，$Q_{23}=0$，$\Delta U_{23}=-W_{23}=-300\,\mathrm J$。一个循环$\Delta U$合计为零，所以$\Delta U_{31}=-(400\,\mathrm J-300\,\mathrm J)=-100\,\mathrm J$。3→1 放热，$Q_{31}=-700\,\mathrm J$，$W_{31}=Q_{31}-\Delta U_{31}=-600\,\mathrm J$，外界对气体做功$600\,\mathrm J$。核对：净功$800\,\mathrm J+300\,\mathrm J-600\,\mathrm J=500\,\mathrm J$，正好等于净吸热$1200\,\mathrm J-700\,\mathrm J$。

- id: p5
  tier: hard
  statement: |
    一定量的气体从平衡态 1 变到平衡态 2，可以沿两条不同的准静态路线 a、b；沿这两条路线，体积都从$V_1$一直增大到$V_2$，中途不停也不回头，气体也只做体积变化的功。

    （1）设 a、b 除了两个端点不相交。证明沿 a、b 吸收的热量之差$Q_a-Q_b$等于两条路线在$p$-$V$图上围成的面积，或者这块面积的相反数，并说明正负由什么决定。

    （2）由（1）说明：找不到一个只由状态决定的量$X$，使气体沿任何准静态路线从一个状态变到另一个状态时，吸收的热量都等于$X$的改变量。

    （3）如果 a、b 在中途交叉一次，$Q_a-Q_b$等于什么？它可能等于零吗？
  hints:
    - |
      两条路线的始末状态相同，哪个量的改变也相同？沿 a、b 各自的功怎样用$p$-$V$图上的面积表示？
    - |
      （1）$\Delta U$相同，所以$Q_a-Q_b=W_a-W_b$；沿两条路线，压强都是体积的函数$p_a(V)$、$p_b(V)$，$W_a-W_b=\int_{V_1}^{V_2}\bigl(p_a(V)-p_b(V)\bigr)\dd V$。（2）假如有这样的$X$，$Q_a$、$Q_b$都等于$X_2-X_1$。（3）以交点为界分成两段，看每一段上哪条路线在上面。
    - |
      （1）两条路线的始末状态相同，内能是状态函数，$\Delta U_a=\Delta U_b$，所以$Q_a-Q_b=(\Delta U+W_a)-(\Delta U+W_b)=W_a-W_b$。体积一直增大，每条路线上压强是体积的连续函数，$W_a-W_b=\int_{V_1}^{V_2}\bigl(p_a(V)-p_b(V)\bigr)\dd V$。a、b 在端点之间不相交，$p_a-p_b$在那里连续又不为零，由介值定理（intermediate value theorem）不变号：a 在上面时，$Q_a-Q_b$等于两条路线围成的面积，a 在下面时是这块面积的相反数。也可以这样看：沿 a 从 1 走到 2，再沿 b 倒着走回 1，是一个循环，净功$W_a-W_b$按[准静态过程与气体的功](lesson:physics.thermal-physics.quasi-static-processes#thm-cycle-work)里的定理，顺时针走时为正，正好对应 a 在上面。

      （2）假如有这样的$X$，沿任何两条路线都有$Q_a=X_2-X_1=Q_b$。可是由（1），两条不同、又不相交的路线吸的热之差是它们围成的面积，不为零。例如$1.00\,\mathrm{mol}$理想气体从$300\,\mathrm K$、$10.0\,\mathrm L$变到$300\,\mathrm K$、$20.0\,\mathrm L$，沿等温线（isotherm）做功约$1729\,\mathrm J$，沿$p$-$V$图上连接两端的线段（在等温线上方）做功约$1871\,\mathrm J$，两端温度相同、$\Delta U=0$，吸的热也就差约$142\,\mathrm J$。所以这样的$X$不存在：热量和功一样，不是状态函数。

      （3）设交点处的体积是$V_*$，在$V_1$到$V_*$之间 a 在上面，在$V_*$到$V_2$之间 b 在上面（反过来时整体变号）。分成两段积分，$Q_a-Q_b=A_1-A_2$，$A_1$、$A_2$是交点左右两块的面积。$A_1=A_2$时$Q_a=Q_b$：两条不同的路线吸的热也可能相等，可这并不说明热量只由状态决定，换一条路线就又不等了。
  reference: |
    （1）两条路线的始末状态相同，内能是状态函数，$\Delta U_a=\Delta U_b$，所以$Q_a-Q_b=(\Delta U+W_a)-(\Delta U+W_b)=W_a-W_b$。体积一直增大，每条路线上压强是体积的连续函数，$W_a-W_b=\int_{V_1}^{V_2}\bigl(p_a(V)-p_b(V)\bigr)\dd V$。a、b 在端点之间不相交，$p_a-p_b$在$(V_1,V_2)$上连续又不为零，由介值定理不变号：a 在上面时，$Q_a-Q_b$等于两条路线围成的面积，a 在下面时是这块面积的相反数。也可以这样看：沿 a 从 1 走到 2，再沿 b 倒着走回 1，是一个循环，倒着走一条准静态路线功变号，净功是$W_a-W_b$；按准静态过程与气体的功一节循环净功的定理，顺时针走时为正，正好对应 a 在上面。

    （2）假如有这样的$X$，沿任何两条路线都有$Q_a=X_2-X_1=Q_b$。可是由（1），两条不同、又不相交的路线吸的热之差是它们围成的面积，不为零。例如$1.00\,\mathrm{mol}$理想气体从$300\,\mathrm K$、$10.0\,\mathrm L$变到$300\,\mathrm K$、$20.0\,\mathrm L$（准静态过程与气体的功一节例 1 的两个状态），沿等温线做功$nRT\ln2\approx1729\,\mathrm J$，沿$p$-$V$图上连接两端的线段做功$\frac{p_1+p_2}2(V_2-V_1)=\frac34nRT\approx1871\,\mathrm J$（线段在等温线上方，两者只在端点相交，都满足本题的设定），两端温度相同、$\Delta U=0$，吸的热就差约$142\,\mathrm J$。所以这样的$X$不存在：热量和功一样，不是状态函数；还可以这样说：如果有这样的$X$，$X-U$的改变量沿任何路线都等于做的功，这和功与路线有关矛盾。

    （3）设交点处的体积是$V_*$，在$V_1$到$V_*$之间 a 在上面，在$V_*$到$V_2$之间 b 在上面（反过来时整体变号）。分成两段积分，$Q_a-Q_b=\int_{V_1}^{V_*}(p_a-p_b)\dd V+\int_{V_*}^{V_2}(p_a-p_b)\dd V=A_1-A_2$，$A_1$、$A_2$是交点左右两块的面积。$A_1=A_2$时$Q_a=Q_b$：两条不同的路线吸的热也可能相等，可这并不说明热量只由状态决定，换一条路线就又不等了。

- id: p6
  tier: hard
  statement: |
    实际气体（real gas）的分子之间有吸引力，内能和体积有关。某种单原子气体的内能可以近似写成$U=\frac32nRT-\frac{an^2}V$，$a>0$是常量，$n$是物质的量。

    （1）物质的量为$n$的这种气体在绝热的刚性容器里从体积$V_1$自由膨胀到$V_2$，证明它的温度变化$\Delta T=-\frac{2an}{3R}\Bigl(\frac1{V_1}-\frac1{V_2}\Bigr)$，所以温度降低。

    （2）氩气的$a=0.1355\,\mathrm{Pa\cdot m^6/mol^2}$。$1.00\,\mathrm{mol}$氩气从$1.00\,\mathrm L$自由膨胀到$2.00\,\mathrm L$，温度变化多少？同样多的氩气从$22.4\,\mathrm L$自由膨胀到$44.8\,\mathrm L$呢？

    （3）从分子的角度说明：为什么自由膨胀后这种气体的温度会降低？为什么气体越稀薄，降得越少？

    （4）把（1）里的容器换成导热的刚性容器，放在温度为$T$的热库里，气体开始时的温度也是$T$。气体同样从$V_1$向真空膨胀到$V_2$，重新平衡以后，它从热库吸收了多少热量？
  hints:
    - |
      自由膨胀中$W$和$Q$各是多少？内能怎样变？把$U$的式子代进去。（4）里容器导热，$W$和$Q$还都是零吗？
    - |
      （1）$\Delta U=0$，即$\frac32nR(T_2-T_1)=an^2\Bigl(\frac1{V_2}-\frac1{V_1}\Bigr)$。（2）体积换成立方米，$\frac{2an}{3R}\approx0.01086\,\mathrm{K\cdot m^3}$。（3）$-\frac{an^2}V$是分子之间互相吸引的势能，分子散开时它怎样变？（4）$W$仍是零，始末温度都是$T$，$Q=\Delta U$。
    - |
      （1）自由膨胀中$W=0$、$Q=0$，所以$\Delta U=0$：$\frac32nRT_1-\frac{an^2}{V_1}=\frac32nRT_2-\frac{an^2}{V_2}$。整理得$\frac32nR(T_2-T_1)=-an^2\Bigl(\frac1{V_1}-\frac1{V_2}\Bigr)$，即$\Delta T=-\frac{2an}{3R}\Bigl(\frac1{V_1}-\frac1{V_2}\Bigr)$；$V_2>V_1$，括号是正的，$\Delta T<0$。

      （2）$\frac{2an}{3R}=\frac{2\times0.1355\times1.00}{3\times8.314}\,\mathrm{K\cdot m^3}\approx0.01086\,\mathrm{K\cdot m^3}$。从$1.00\,\mathrm L$到$2.00\,\mathrm L$，括号是$1000\,\mathrm{m^{-3}}-500\,\mathrm{m^{-3}}=500\,\mathrm{m^{-3}}$，$\Delta T\approx-5.4\,\mathrm K$；从$22.4\,\mathrm L$到$44.8\,\mathrm L$，括号约是$22.3\,\mathrm{m^{-3}}$，$\Delta T\approx-0.24\,\mathrm K$。

      （3）分子之间互相吸引，靠得越近，分子势能越低（越负），$-\frac{an^2}V$说的就是这一点。自由膨胀后分子平均离得更远，势能升高；内能不变，分子无规则运动的动能就减少，温度降低。气体越稀薄，分子本来就离得远，这一项和$\frac32nRT$相比很小，降温就很少，趋于理想气体的$U=U(T)$。

      （4）容器是刚性的，气体没有推动任何东西，$W=0$；容器导热，$Q$不再是零。始末都是温度为$T$的平衡态，$\frac32nRT$一项前后相同，由第一定律$Q=\Delta U=an^2\Bigl(\frac1{V_1}-\frac1{V_2}\Bigr)>0$：分子散开要克服吸引，这份能量由热库补上。$1.00\,\mathrm{mol}$氩气从$1.00\,\mathrm L$到$2.00\,\mathrm L$时$Q\approx68\,\mathrm J$，理想气体（$a=0$）这样膨胀却不吸热。
  reference: |
    （1）自由膨胀中$W=0$（气体没有推动任何东西）、$Q=0$（绝热），所以$\Delta U=0$：$\frac32nRT_1-\frac{an^2}{V_1}=\frac32nRT_2-\frac{an^2}{V_2}$。整理得$\frac32nR(T_2-T_1)=-an^2\Bigl(\frac1{V_1}-\frac1{V_2}\Bigr)$，即$\Delta T=-\frac{2an}{3R}\Bigl(\frac1{V_1}-\frac1{V_2}\Bigr)$；$V_2>V_1$，括号是正的，$\Delta T<0$。

    （2）$\frac{2an}{3R}=\frac{2\times0.1355\times1.00}{3\times8.314}\,\mathrm{K\cdot m^3}\approx0.010\,865\,\mathrm{K\cdot m^3}$（单位：$\mathrm{Pa\cdot m^6\cdot K/J}=\mathrm{K\cdot m^3}$）。从$1.00\,\mathrm L$到$2.00\,\mathrm L$，括号是$1000-500=500\,\mathrm{m^{-3}}$，$\Delta T\approx-5.43\,\mathrm K$；从$22.4\,\mathrm L$到$44.8\,\mathrm L$，括号是$44.64-22.32\approx22.32\,\mathrm{m^{-3}}$，$\Delta T\approx-0.243\,\mathrm K$。

    （3）分子之间互相吸引，靠得越近，分子势能越低（越负），$-\frac{an^2}V$说的就是这一点：它正比于$\frac nV$，分子越密，每个分子周围的分子越多。自由膨胀后分子平均离得更远，势能升高；内能不变，分子无规则运动的动能就减少，温度降低。气体越稀薄，这一项和$\frac32nRT$相比越小：$1.00\,\mathrm{mol}$在$22.4\,\mathrm L$、$273\,\mathrm K$时，$\frac{an^2}V$只是$\frac32nRT$的约$0.18\%$，降温就很少，趋于理想气体的$U=U(T)$。

    焦耳当年把容器浸在水里、测的是水温，气体这一点降温分给大量的水和容器，水温的变化小得测不出来。$U$的这个式子正是以后范德瓦耳斯气体的内能（见范德瓦耳斯气体与临界点一节）。

    （4）容器是刚性的，气体没有推动任何东西，$W=0$；容器导热，热库可以给气体传热。始末都是温度为$T$的平衡态，$U$里的$\frac32nRT$一项前后相同，由第一定律$Q=\Delta U=an^2\Bigl(\frac1{V_1}-\frac1{V_2}\Bigr)>0$：分子散开、势能升高，这份能量由热库补上。$1.00\,\mathrm{mol}$氩气从$1.00\,\mathrm L$到$2.00\,\mathrm L$时$Q=0.1355\times500\,\mathrm J\approx68\,\mathrm J$，也等于把（2）里降掉的约$5.43\,\mathrm K$升回来要吸的热$\frac32nR\times5.43\,\mathrm K$；理想气体（$a=0$）在热库里向真空膨胀不吸热，和准静态等温膨胀吸热$nRT\ln\frac{V_2}{V_1}$不同。

- id: p7
  tier: thinking
  statement: |
    木块在固定的水平桌面上滑行，初速度为$v_0$，滑了一段路后停下，木块和桌面都变热了。设滑行的时间很短，木块、桌面和周围的空气来不及交换热量。

    （1）把木块看成质点，用动能定理（work-energy theorem）求滑动摩擦力对它做的功。

    （2）把木块和桌面合起来当作一个系统。外界对它做功吗？它吸热吗？它的内能一共增加了多少？

    （3）有人说：「摩擦力对木块做了负功，木块减少的动能全部变成了木块自己的内能。」这个说法对吗？动能定理和第一定律各能回答什么问题？
  hints:
    - |
      （1）木块受哪几个力？哪些力和位移垂直？（2）系统的能量除了内能，还有木块整体运动的动能；第一定律说的是能量守恒，这份动能也要记进账里。
    - |
      （1）只有摩擦力做功，末速度为零。（2）重力、地面对桌子的支持力（normal force）都不做功，桌面和木块之间的力是系统内部的力，又来不及传热，系统的能量（内能加上木块的动能）不变。（3）变热的有哪些物体？
    - |
      （1）竖直方向的重力和支持力与位移垂直，不做功；由动能定理，摩擦力做的功等于动能的改变，$W_f=0-\frac12mv_0^2=-\frac12mv_0^2$，$m$是木块的质量。

      （2）外界的力里，木块的重力和位移垂直，桌子的重力、地面对桌子的支持力作用在不动的桌子上，都不做功；桌面和木块之间的摩擦力、支持力是系统内部的力。外界不做功，又来不及传热，系统的能量不变：木块整体的动能减少$\frac12mv_0^2$，木块和桌面的内能一共增加$\frac12mv_0^2$。

      （3）不对。减少的动能变成了木块和桌面两者的内能，两者都变热，怎样分配要看材料和接触面的情况。动能定理只管木块整体的动能，说的是木块慢下来时动能少了多少；第一定律管能量的总账，说的是这些能量都变成了内能。两者都说不出内能怎样分给木块和桌面。
  reference: |
    （1）竖直方向的重力和桌面的支持力与位移垂直，不做功；由动能定理，摩擦力做的功等于动能的改变，$W_f=0-\frac12mv_0^2=-\frac12mv_0^2$。

    （2）外力里，木块的重力和位移垂直，桌子的重力、地面对桌子的支持力作用在不动的桌子上，都不做功；桌面和木块之间的摩擦力、支持力是系统内部的力。外界不做功，又来不及传热，系统的能量（内能加上木块整体的动能）不变：木块的动能减少$\frac12mv_0^2$，木块和桌面的内能一共增加$\frac12mv_0^2$。这就是势能与机械能守恒一节说的「机械能减少，变成了内能」。

    （3）不对。减少的动能变成了木块和桌面两者的内能，两者都变热，怎样分配要看材料、接触面和温度的情况，单靠力学定不下来。动能定理只管木块整体的动能（质点模型里摩擦力的功按木块整体的位移算），说的是木块慢下来时动能少了多少；第一定律管能量的总账，说的是这些能量都变成了内能。两者都说不出内能怎样分给木块和桌面：要用第一定律单独分析木块，还得知道接触面上传给它的能量，这不是质点模型能给出的。

- id: p8
  tier: thinking
  statement: |
    第一定律$Q=\Delta U+W$对系统整体不动、始末都是平衡态的任何过程都成立（不必是准静态的），$\delta Q=\dd U+p\,\dd V$却要求过程是准静态的。

    （1）[准静态过程与气体的功](lesson:physics.thermal-physics.quasi-static-processes)第 6 题里，物质的量为$n$的理想气体在温度为$T$的热库里，压强从$p_1$变为$p_2$（$p_2<p_1$）：一次是一粒一粒地拿走细沙，准静态地膨胀；一次是外压（external pressure）突然降到$p_2$。两次从热库吸收的热量各是多少？哪次多？

    （2）（1）里突然膨胀的那一次，气体做的功为什么不能用$\int p\,\dd V$算？那道题又是怎样求出这个功的？

    （3）有人说：「自由膨胀的始末状态在同一条等温线上，把$\delta Q=\dd U+p\,\dd V$沿这条等温线积分，就得到自由膨胀吸收的热量$nRT\ln\frac{V_2}{V_1}$。」错在哪里？
  hints:
    - |
      两次的始末状态相同，温度都是$T$，理想气体的内能怎样变？第一定律对两次都成立，于是吸的热等于什么？
    - |
      （1）$\Delta U=0$，$Q=W$；两次的功那道题已经算出：$W_1=nRT\ln\frac{p_1}{p_2}$，$W_2=nRT\bigl(1-\frac{p_2}{p_1}\bigr)$。（2）突然膨胀时，气体各处的压强一样吗？（3）沿等温线积分$\delta Q=\dd U+p\,\dd V$，算的是哪个过程的热量？
    - |
      （1）两次的始末状态都在温度$T$，一定量的理想气体，内能只和温度有关，$\Delta U=0$，所以$Q=W$。准静态的一次$Q_1=nRT\ln\frac{p_1}{p_2}$，突然膨胀的一次$Q_2=nRT\bigl(1-\frac{p_2}{p_1}\bigr)$；那道题的（3）已证$W_2<W_1$，所以准静态膨胀从热库吸的热多。例如$\frac{p_1}{p_2}=3$时，$Q_1\approx1.10\,nRT$，$Q_2\approx0.67\,nRT$。

      （2）突然膨胀时活塞猛地冲出去，气体里各处压强不同，过程不是准静态的，中途没有一个确定的$p$可以代进积分。那道题从外界一边算：外压一直是$p_2$，外界得到的功是$p_2(V_2-V_1)$；活塞很轻、最后停下，气体对活塞做的功就等于这个数，所以$W=p_2(V_2-V_1)$。

      （3）$\delta Q=\dd U+p\,\dd V$只对准静态过程成立，沿等温线积分，算出的是准静态的等温膨胀吸收的热量，那是另一个过程。热量和过程有关，不能只看始末状态；自由膨胀在绝热容器里进行，$Q=0$，同时$W=0$、$\Delta U=0$，第一定律照样成立。
  reference: |
    （1）两次的始末状态都在温度$T$，一定量的理想气体，内能只和温度有关，$\Delta U=0$，所以$Q=W$。准静态的一次$Q_1=W_1=nRT\ln\frac{p_1}{p_2}$，突然膨胀的一次$Q_2=W_2=nRT\bigl(1-\frac{p_2}{p_1}\bigr)$；记$x=\frac{p_1}{p_2}>1$，$\ln x>1-\frac1x$（那道题的（3）），所以准静态膨胀从热库吸的热多。例如$x=3$时，$Q_1\approx1.10\,nRT$，$Q_2\approx0.67\,nRT$。

    （2）突然膨胀时活塞猛地冲出去，气体里各处压强不同，过程不是准静态的，中途没有一个确定的$p$可以代进积分，也不能在$p$-$V$图上画成曲线。那道题从外界一边算：外压一直是$p_2$，外界得到的功是$p_2(V_2-V_1)$；活塞很轻，开始和最后都静止，气体对活塞做的功等于活塞对外界做的功加上活塞动能的改变，就是这个数，所以$W=p_2(V_2-V_1)$。

    （3）$\delta Q=\dd U+p\,\dd V$里用了$\delta W=p\,\dd V$，只对准静态过程成立；沿等温线积分，算出的是准静态的等温膨胀吸收的热量，那是始末状态相同的另一个过程。热量和过程有关，不能只看始末状态；自由膨胀在绝热容器里进行，$Q=0$，同时$W=0$、$\Delta U=0$，第一定律照样成立。
