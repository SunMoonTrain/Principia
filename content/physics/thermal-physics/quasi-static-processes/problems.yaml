- id: p1
  tier: easy
  statement: |
    气缸里的气体被缓慢加热，压强始终是$1.5\times10^5\,\mathrm{Pa}$，体积从$2.0\,\mathrm L$增大到$5.0\,\mathrm L$。这一过程中气体对外做了多少功？
  answer:
    type: number
    value: 1.5e5*(5.0e-3 - 2.0e-3)
    unit: |
      $\mathrm J$
  hints:
    - |
      压强始终不变，这是什么过程？在$p$-$V$图上，气体做的功是哪一块的面积？
    - |
      等压过程中$W=p(V_2-V_1)$；体积要换成立方米，$1\,\mathrm L=10^{-3}\,\mathrm{m^3}$。
    - |
      $V_2-V_1=3.0\times10^{-3}\,\mathrm{m^3}$，$W=1.5\times10^5\times3.0\times10^{-3}\,\mathrm J=450\,\mathrm J$。
  solution: |
    压强不变，是等压过程，$W=p(V_2-V_1)$。代入$p=1.5\times10^5\,\mathrm{Pa}$、$V_2-V_1=3.0\times10^{-3}\,\mathrm{m^3}$，得$W=450\,\mathrm J$。在$p$-$V$图上，这是水平线段下面那个矩形的面积；体积增大，所以功是正的。

- id: p2
  tier: easy
  statement: |
    下面哪些说法正确？各项里的过程都是准静态的，气体只做体积变化的功。
  answer:
    type: choice
    multiple: true
    options:
      - |
        一定量的理想气体被等温压缩，体积减为原来的一半，这一过程中气体对外做的功是正的
      - |
        一定量的理想气体，压强和热力学温度（thermodynamic temperature）始终成正比地变化，这一过程中气体对外做的功是零
      - |
        一个循环在$p$-$V$图上，膨胀的那一段曲线整个在压缩的那一段曲线下方，这个循环里气体对外做的净功是负的
      - |
        气体从状态 1 膨胀到状态 2，外界对气体做的功等于$p$-$V$图上过程曲线下的面积
    value: [2, 3]
  hints:
    - |
      逐项想：体积是增大还是减小？一个循环的净功怎样由两段曲线下的面积得出？外界对气体做的功和气体对外做的功差什么？
    - |
      A 看$\ln\frac{V_2}{V_1}$的正负；B 由$pV=nRT$看体积变不变；C 把净功拆成膨胀、压缩两段曲线下的面积；D 用约定：外界对气体做的功是$-W$。
    - |
      A 错：等温压缩时$W=nRT\ln\frac12<0$，气体做负功。B 对：$p$和$T$成正比，$V=\frac{nRT}p$就不变，这是等容过程，$W=0$。

      C 对：膨胀一段做的正功等于它下面的面积，压缩一段做的负功的大小等于它下面的面积；压缩那段在上方，面积更大，净功为负，这样的循环在图上是逆时针走的。D 错：膨胀时气体做的功$W$等于曲线下的面积，外界对气体做的功是$-W$，是这块面积的相反数。
  solution: |
    选 B、C。A 错：等温压缩时$\frac{V_2}{V_1}=\frac12$，$W=nRT\ln\frac12<0$，气体对外做负功，是外界对气体做了正功。B 对：$p$和$T$成正比时，$V=\frac{nRT}p$保持不变，这是等容过程，活塞不动，$W=0$。

    C 对：膨胀一段体积增大，做的正功等于它下面的面积；压缩一段做的负功的大小等于它下面的面积。压缩那段在上方，它下面的面积更大，净功为负，这样的循环在图上是逆时针走的。D 错：膨胀时气体对外做的功$W$等于曲线下的面积，外界对气体做的功是$-W$，是这块面积的相反数。

- id: p3
  tier: medium
  statement: |
    $2.00\,\mathrm{mol}$氦气封在气缸里，气缸浸在$350\,\mathrm K$的热库里。把氦气缓慢地压缩，体积从$30.0\,\mathrm L$变为$12.0\,\mathrm L$，温度始终是$350\,\mathrm K$。氦气看成理想气体，这一过程中外界对氦气做了多少功？结果保留三位有效数字。
  answer:
    type: number
    value: 2.00*8.31446261815324*350*ln(30.0/12.0)
    unit: |
      $\mathrm J$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      这是理想气体的等温过程。先求氦气对外做的功$W$，外界对氦气做的功和它是什么关系？
    - |
      $W=nRT\ln\frac{V_2}{V_1}$，这里$\frac{V_2}{V_1}=\frac{12.0}{30.0}=0.400$，所以$W<0$；外界对氦气做的功是$-W=nRT\ln\frac{V_1}{V_2}$。
    - |
      $nRT=2.00\times8.314\times350\,\mathrm J\approx5820\,\mathrm J$，$\ln\frac{30.0}{12.0}=\ln2.5\approx0.916$，所以外界做的功$-W\approx5.33\times10^3\,\mathrm J$。
  solution: |
    温度不变，是理想气体的等温过程，氦气对外做的功$W=nRT\ln\frac{V_2}{V_1}$；$\frac{V_2}{V_1}=0.400<1$，所以$W<0$。外界对氦气做的功是$-W=nRT\ln2.5$，其中$nRT=2.00\times8.314\times350\,\mathrm J\approx5820\,\mathrm J$，$\ln2.5\approx0.916$，得约$5.33\times10^3\,\mathrm J$。在$p$-$V$图上，它是等温线下、$12.0\,\mathrm L$到$30.0\,\mathrm L$那一段的面积。

- id: p4
  tier: medium
  statement: |
    一定量的气体经历一个准静态的循环，只做体积变化的功。它从状态 A（$1.0\,\mathrm L$，$4.0\times10^5\,\mathrm{Pa}$）出发，在$p$-$V$图上沿直线变到状态 B（$5.0\,\mathrm L$，$2.0\times10^5\,\mathrm{Pa}$），再等压压缩到状态 C（$1.0\,\mathrm L$），最后等容地回到 A。一个循环里气体对外做的净功是多少？
  answer:
    type: number
    value: 0.5*(5.0e-3 - 1.0e-3)*(4.0e5 - 2.0e5)
    unit: |
      $\mathrm J$
  hints:
    - |
      净功的大小等于闭合曲线围成的面积，正负由走的方向决定。先在$p$-$V$图上画出 A、B、C 三点。
    - |
      C 是（$1.0\,\mathrm L$，$2.0\times10^5\,\mathrm{Pa}$），三点围成直角三角形，直角在 C。A 在左上，B 在右下，C 在左下，A→B→C→A 是顺时针走的。
    - |
      两条直角边是$V_{\mathrm B}-V_{\mathrm C}=4.0\times10^{-3}\,\mathrm{m^3}$和$p_{\mathrm A}-p_{\mathrm C}=2.0\times10^5\,\mathrm{Pa}$，面积是$\frac12\times4.0\times10^{-3}\times2.0\times10^5\,\mathrm J=400\,\mathrm J$。循环是顺时针的，净功为正，是$400\,\mathrm J$。
  solution: |
    C 是（$1.0\,\mathrm L$，$2.0\times10^5\,\mathrm{Pa}$），A、B、C 围成直角三角形，直角在 C。A 在左上、B 在右下、C 在左下，A→B→C→A 是顺时针，净功为正，等于三角形的面积$\frac12\times4.0\times10^{-3}\,\mathrm{m^3}\times2.0\times10^5\,\mathrm{Pa}=400\,\mathrm J$。

    分段算也一样：A→B 体积增大，功是直线下梯形的面积$\frac12\times(4.0+2.0)\times10^5\times4.0\times10^{-3}\,\mathrm J=1200\,\mathrm J$；B→C 的功是$2.0\times10^5\times(-4.0\times10^{-3})\,\mathrm J=-800\,\mathrm J$；C→A 不做功。合计$400\,\mathrm J$。

- id: p5
  tier: hard
  statement: |
    气体经历准静态过程时，如果$pV^\alpha$始终不变（$\alpha$是常数），这样的过程叫作多方过程（polytropic process），$\alpha$叫作多方指数（polytropic index）。设气体沿多方过程从状态$(V_1,p_1)$变到状态$(V_2,p_2)$，$V_1\ne V_2$，只做体积变化的功。

    （1）设$\alpha\ne1$，证明气体对外做的功$W=\frac{p_1V_1-p_2V_2}{\alpha-1}$；对理想气体，再证明$W=\frac{nR(T_1-T_2)}{\alpha-1}$。

    （2）$\alpha=0$时是什么过程？对理想气体，$\alpha=1$时是什么过程？（1）的式子为什么不能用于$\alpha=1$？

    （3）对理想气体，固定$p_1$、$V_1$、$V_2$，让$\alpha\to1$。（1）中的$W$趋于什么？和等温过程的功比一比。
  hints:
    - |
      $pV^\alpha$不变，就是$p=p_1V_1^\alpha V^{-\alpha}$，把它代进$W=\int_{V_1}^{V_2}p\,\dd V$。
    - |
      （1）$\alpha\ne1$时，$V^{-\alpha}$的原函数是$\frac{V^{1-\alpha}}{1-\alpha}$，再用$p_1V_1^\alpha=p_2V_2^\alpha$化简。（2）$\alpha=1$时被积函数是$\frac{p_1V_1}V$，原函数是对数。（3）记$r=\frac{V_1}{V_2}$，把$W$写成含$\frac{r^{\alpha-1}-1}{\alpha-1}$的式子，用[两个重要极限](lesson:math.calculus.special-limits#thm-log-exp-limits)里的$\lim_{x\to0}\frac{a^x-1}x=\ln a$。
    - |
      （1）由$pV^\alpha=p_1V_1^\alpha$，$p=p_1V_1^\alpha V^{-\alpha}$。$\alpha\ne1$时，$W=\frac{p_1V_1^\alpha\left(V_2^{1-\alpha}-V_1^{1-\alpha}\right)}{1-\alpha}$。因为$p_1V_1^\alpha V_2^{1-\alpha}=p_2V_2^\alpha V_2^{1-\alpha}=p_2V_2$，$p_1V_1^\alpha V_1^{1-\alpha}=p_1V_1$，所以$W=\frac{p_2V_2-p_1V_1}{1-\alpha}=\frac{p_1V_1-p_2V_2}{\alpha-1}$。对理想气体，$p_1V_1=nRT_1$，$p_2V_2=nRT_2$，代入就是$W=\frac{nR(T_1-T_2)}{\alpha-1}$。

      （2）$\alpha=0$时$p$不变，是等压过程，（1）给出$W=p(V_2-V_1)$，和等压过程的公式一致。对理想气体，$\alpha=1$时$pV=nRT$不变，就是$T$不变，是等温过程。这时（1）的分子$p_1V_1-p_2V_2$和分母$\alpha-1$都是$0$；推导里用的原函数$\frac{V^{1-\alpha}}{1-\alpha}$也没有意义，$V^{-1}$的原函数是$\ln V$，要单独算，得$W=p_1V_1\ln\frac{V_2}{V_1}=nRT\ln\frac{V_2}{V_1}$。

      （3）记$r=\frac{V_1}{V_2}$，则$p_2V_2=p_1V_1^\alpha V_2^{1-\alpha}=p_1V_1r^{\alpha-1}$，所以$W=-p_1V_1\cdot\frac{r^{\alpha-1}-1}{\alpha-1}$。由$\lim_{x\to0}\frac{r^x-1}x=\ln r$，$\alpha\to1$时$W\to-p_1V_1\ln r=nRT_1\ln\frac{V_2}{V_1}$，正是从同一个起点等温地变到$V_2$所做的功。多方过程的功随$\alpha$连续变化，$\alpha=1$时只是公式要换一种写法。
  reference: |
    （1）由$pV^\alpha=p_1V_1^\alpha$，$p=p_1V_1^\alpha V^{-\alpha}$。$\alpha\ne1$时，$W=\int_{V_1}^{V_2}p_1V_1^\alpha V^{-\alpha}\,\dd V=\frac{p_1V_1^\alpha\left(V_2^{1-\alpha}-V_1^{1-\alpha}\right)}{1-\alpha}$。因为$p_1V_1^\alpha V_2^{1-\alpha}=p_2V_2^\alpha V_2^{1-\alpha}=p_2V_2$，$p_1V_1^\alpha V_1^{1-\alpha}=p_1V_1$，所以$W=\frac{p_2V_2-p_1V_1}{1-\alpha}=\frac{p_1V_1-p_2V_2}{\alpha-1}$。对理想气体，$p_1V_1=nRT_1$，$p_2V_2=nRT_2$，代入就是$W=\frac{nR(T_1-T_2)}{\alpha-1}$。

    （2）$\alpha=0$时$p$不变，是等压过程，（1）给出$W=p_2V_2-p_1V_1=p(V_2-V_1)$，和等压过程的公式一致。对理想气体，$\alpha=1$时$pV=nRT$不变，就是$T$不变，是等温过程。这时（1）的分子$p_1V_1-p_2V_2$和分母$\alpha-1$都是$0$，式子成了$\frac00$；推导里用的原函数$\frac{V^{1-\alpha}}{1-\alpha}$也没有意义，$V^{-1}$的原函数是$\ln V$，要单独算，得$W=p_1V_1\ln\frac{V_2}{V_1}=nRT\ln\frac{V_2}{V_1}$。

    （3）记$r=\frac{V_1}{V_2}$，则$p_2=p_1r^\alpha$，$p_2V_2=p_1V_1^\alpha V_2^{1-\alpha}=p_1V_1r^{\alpha-1}$，所以$W=\frac{p_1V_1\left(1-r^{\alpha-1}\right)}{\alpha-1}=-p_1V_1\cdot\frac{r^{\alpha-1}-1}{\alpha-1}$。由两个重要极限一节的推论，$x\to0$时$\frac{r^x-1}x\to\ln r$，所以$\alpha\to1$时$W\to-p_1V_1\ln r=p_1V_1\ln\frac{V_2}{V_1}=nRT_1\ln\frac{V_2}{V_1}$，正是从同一个起点等温地变到$V_2$所做的功。数值例：$p_1=2.0\times10^5\,\mathrm{Pa}$、$V_1=1.0\,\mathrm L$、$V_2=3.0\,\mathrm L$时，$\alpha=0.99$、$1.001$给出约$220.9\,\mathrm J$、$219.6\,\mathrm J$，等温过程是$200\ln3\approx219.7\,\mathrm J$。多方过程的功随$\alpha$连续变化，$\alpha=1$时只是公式要换一种写法。

- id: p6
  tier: hard
  statement: |
    气缸浸在温度为$T$的热库里，缸里封着物质的量为$n$的理想气体。活塞很轻，能无摩擦地滑动，面积为$A$；大气对活塞的压力加上活塞上砝码受的重力，再除以$A$，叫作外压（external pressure）。开始时气体处在平衡态，压强和外压都是$p_1$。

    （1）把砝码换成同样重的细沙，一粒一粒地拿走，直到气体的压强变为$p_2$（$p_2<p_1$）。求这一过程中气体对外做的功$W_1$。

    （2）换一种做法：从开始的状态起，一下子拿走一部分砝码，使外压变为$p_2$并保持不变。活塞冲上去、来回晃几下后停下，气体的温度又回到$T$。证明这一过程中外界得到的功（剩下的砝码被举高、大气被推开）是$W_2=nRT\bigl(1-\frac{p_2}{p_1}\bigr)$。

    （3）证明$W_2<W_1$，并在$p$-$V$图上说明为什么。
  hints:
    - |
      （1）是理想气体在热库里的准静态等温膨胀。（2）外界得到的功是剩下的砝码被举高、大气被推开这两份，它们只看活塞最后升高了多少，砝码最后又是静止的。（3）在$p$-$V$图上，两种功各是哪条线下的面积？
    - |
      （1）$W_1=nRT\ln\frac{V_2}{V_1}$，$V_1=\frac{nRT}{p_1}$，$V_2=\frac{nRT}{p_2}$。（2）剩下的砝码受的重力和大气对活塞的压力合起来是$p_2A$，不随活塞晃动而变；活塞最后升高$h$、砝码又静止，外界得到的功是$p_2Ah=p_2(V_2-V_1)$。最后气体又平衡，压强等于外压。（3）$W_1$是等温线$p=\frac{nRT}V$下的面积，$W_2$是外压的水平线$p=p_2$下的面积，都从$V_1$到$V_2$。
    - |
      （1）一粒一粒地拿走细沙，是准静态的等温膨胀，最后压强是$p_2$。$V_1=\frac{nRT}{p_1}$，$V_2=\frac{nRT}{p_2}$，所以$W_1=nRT\ln\frac{V_2}{V_1}=nRT\ln\frac{p_1}{p_2}$。

      （2）活塞晃动时砝码在加速，它压在活塞上的力并不总等于它的重力；可剩下的砝码受的重力和大气对活塞的压力都不变，合起来折合成$p_2A$。活塞最后停下、砝码又静止，外界得到的功就是砝码被举高$h$加上推开大气的功，合计$p_2Ah=p_2(V_2-V_1)$，中途晃了几下不影响。最后气体又处在平衡态，压强等于外压$p_2$，温度是$T$，所以$V_2=\frac{nRT}{p_2}$，和（1）的末状态相同。于是$W_2=p_2\Bigl(\frac{nRT}{p_2}-\frac{nRT}{p_1}\Bigr)=nRT\Bigl(1-\frac{p_2}{p_1}\Bigr)$。

      （3）在$p$-$V$图上，$W_1$是等温线$p=\frac{nRT}V$下、$V_1$到$V_2$那一段的面积，$W_2$是外压的水平线$p=p_2$下同一段的面积。$V<V_2$时$\frac{nRT}V>\frac{nRT}{V_2}=p_2$，被积函数$\frac{nRT}V-p_2$连续、不小于$0$、在$V_1$处大于$0$，由[定积分的性质](lesson:math.calculus.integral-properties#thm-positive-integral)，$W_1-W_2=\int_{V_1}^{V_2}\Bigl(\frac{nRT}V-p_2\Bigr)\dd V>0$。记$x=\frac{p_1}{p_2}>1$，这就是$\ln x>1-\frac1x$。

      为什么：准静态膨胀时，沙子是一边被举高一边被拿走的，外界举起、推开的东西折合成的外压从$p_1$慢慢降到$p_2$；突然膨胀时，拿走的那部分砝码一点也没被举高，外界举起、推开的只有剩下的砝码和大气，折合成的外压一直是$p_2$。活塞走的路一样，后一种举起、推开的东西轻，外界得到的功就少。
  reference: |
    （1）一粒一粒地拿走细沙，是准静态的等温膨胀，最后压强是$p_2$。$V_1=\frac{nRT}{p_1}$，$V_2=\frac{nRT}{p_2}$，所以$W_1=nRT\ln\frac{V_2}{V_1}=nRT\ln\frac{p_1}{p_2}$。

    （2）活塞晃动时砝码在加速，它压在活塞上的力并不总等于它的重力；可剩下的砝码受的重力和大气对活塞的压力都不变，合起来折合成$p_2A$。活塞最后停下、砝码又静止，外界得到的功就是砝码被举高$h$（重力势能增加）加上推开大气（体积$Ah$）的功，合计$p_2Ah=p_2(V_2-V_1)$，中途晃了几下不影响。最后活塞停下，气体又处在平衡态，压强等于外压$p_2$，温度是$T$，所以$V_2=\frac{nRT}{p_2}$，和（1）的末状态相同。于是$W_2=p_2\Bigl(\frac{nRT}{p_2}-\frac{nRT}{p_1}\Bigr)=nRT\Bigl(1-\frac{p_2}{p_1}\Bigr)$。

    （3）$W_1$是等温线$p=\frac{nRT}V$下、$V_1$到$V_2$那一段的面积，$W_2$是外压的水平线$p=p_2$下同一段的面积。$V<V_2$时$\frac{nRT}V>p_2$，被积函数$\frac{nRT}V-p_2$连续、不小于$0$、在$V_1$处大于$0$，由定积分的性质（连续、非负、某点为正的函数积分为正），$W_1-W_2=\int_{V_1}^{V_2}\Bigl(\frac{nRT}V-p_2\Bigr)\dd V>0$。记$x=\frac{p_1}{p_2}>1$，这就是$\ln x>1-\frac1x$；也可以用拉格朗日中值定理：$\ln x-\ln1=\frac{x-1}\xi$，$1<\xi<x$，所以$\ln x>\frac{x-1}x$。例如$\frac{p_1}{p_2}=3$时，$W_2=0.667\,nRT$，$W_1=1.099\,nRT$。

    为什么：准静态膨胀时，沙子是一边被举高一边被拿走的，外界举起、推开的东西折合成的外压从$p_1$慢慢降到$p_2$；突然膨胀时，拿走的那部分砝码一点也没被举高，外界举起、推开的只有剩下的砝码和大气，折合成的外压一直是$p_2$。活塞走的路一样，后一种举起、推开的东西轻，外界得到的功就少。

- id: p7
  tier: thinking
  statement: |
    一个刚性的容器用隔板分成相同的两半，左半边装着气体，右半边是真空，容器和外界之间不交换能量。抽掉隔板，气体冲进右半边，过一会儿又处处均匀、不再变化。

    （1）这个过程能在$p$-$V$图上画成一条曲线吗？为什么？

    （2）有人在图上只标出起点和终点，随手用一条曲线把它们连起来，把曲线下的面积当作气体对外做的功。这样做对吗？气体实际对外做了多少功？

    （3）起点和终点这两个点，在图上告诉了我们什么，没告诉我们什么？
  hints:
    - |
      准静态过程要求每一时刻都几乎处在平衡态。气体冲进真空的那一阵，各处的压强一样吗？
    - |
      （1）冲进去的时候，靠近隔板处的气体流得飞快，左边浓、右边稀。（2）功是气体推动外界的物体时做的功；容器是刚性的，右边又是真空，气体推动了什么？（3）起点、终点都是平衡态。
    - |
      （1）不能。气体冲进真空时，左边浓、右边稀，还在流动，各处的压强不同，中途没有一个确定的$p$，连温度也说不上；这些状态不是$p$-$V$图上的点，过程不是准静态的。

      （2）不对。$W=\int p\,\dd V$只对准静态过程成立，随手画的曲线代表的是另一个准静态过程，它下面的面积和这个过程的功无关。气体对外做的功是$0$：容器是刚性的，右边是真空，气体没有推动外界的任何物体。

      （3）起点、终点都是平衡态，能标在图上，从图上能读出体积变为原来的 2 倍、压强变了多少。中间经过了什么、做了多少功，两个点说明不了：同样从起点到终点，先在原来的压强$p_1$下等压膨胀到$2V_1$，再等容地变到终点，气体对外做的功是$p_1V_1$，不是零（$p_1$、$V_1$是起点的压强和体积）。所以只有两个端点时，功不能从图上读出来。
  reference: |
    （1）不能。气体冲进真空时，左边浓、右边稀，还在流动，各处的压强不同，中途没有一个确定的$p$，连温度也说不上；这些状态不是$p$-$V$图上的点，过程不是准静态的。

    （2）不对。$W=\int p\,\dd V$只对准静态过程成立，随手画的曲线代表的是另一个准静态过程，它下面的面积和这个过程的功无关。气体对外做的功是$0$：容器是刚性的，右边是真空，气体没有推动外界的任何物体。

    （3）起点、终点都是平衡态，能标在图上，从图上能读出体积变为原来的 2 倍、压强变了多少。中间经过了什么、做了多少功，两个点说明不了：同样从起点到终点，先在原来的压强$p_1$下等压膨胀到$2V_1$，再等容地变到终点，气体对外做的功是$p_1V_1$，不是零（$p_1$、$V_1$是起点的压强和体积）。所以只有两个端点时，功不能从图上读出来。以后在热力学第一定律一节会看到，这种过程叫自由膨胀，理想气体自由膨胀后温度不变，终点和起点在同一条等温线上。

- id: p8
  tier: thinking
  statement: |
    气体从状态 1 变到状态 2 时做的功和走哪条路线有关。

    （1）用循环过程说明：找不到一个只由状态决定的量$X$，使得气体沿任何准静态路线从一个状态变到另一个状态时，对外做的功都等于$X$的改变量。

    （2）「气体在状态 1 含有多少功」这句话有没有意义？和「气体在状态 1 的体积是多少」比一比。

    （3）$\delta W=p\,\dd V$里也有体积的微小改变$\dd V$，体积的改变量和路线无关，为什么功却和路线有关？
  hints:
    - |
      假如有这样的$X$，气体走完一个循环回到原来的状态，净功应该是多少？
    - |
      （1）循环回到原来的状态，$X$的改变量是$0$；可是例 2 的循环净功约$482\,\mathrm J$。（2）体积是平衡态的一个状态参量，它的改变量只看起点和终点。（3）同样从$V_1$到$V_2$，不同路线上同一个体积处的压强不一样。
    - |
      （1）假如有这样的$X$，让气体走一个准静态的循环，从状态 A 出发又回到 A，做的净功就该是$X_{\mathrm A}-X_{\mathrm A}=0$。可是例 2 的循环净功约$482\,\mathrm J$，不是零；在$p$-$V$图上围成一块面积的循环都是这样。所以这样的$X$不存在。也可以直接用例 1：起点、终点相同，两条路线的功差了约$765\,\mathrm J$。

      （2）没有意义。体积是状态参量，气体在状态 1 有确定的体积，从 1 到 2 体积的改变量只看两头；功却是在过程中推动活塞、传给外界的能量，说的是「做了多少」，不是气体在某个状态「有多少」。由（1），没有一个「功的存量」，它的改变量能代表做的功。以后会看到，热量（heat）也是这样（见[内能与热量](lesson:physics.thermal-physics.internal-energy)）。

      （3）$\int_{V_1}^{V_2}\dd V=V_2-V_1$确实和路线无关，可功是$\int p\,\dd V$：同样的一小段$\dd V$，在不同的路线上要乘不同的$p$。例 1 里路线二在较高的压强下膨胀，每一段$\dd V$都乘了较大的$p$，加起来就多。指定了路线，在体积单调变化的每一段上，$p$就成了体积的确定的函数，功也就确定了。
  reference: |
    （1）假如有这样的$X$，让气体走一个准静态的循环，从状态 A 出发又回到 A，做的净功就该是$X_{\mathrm A}-X_{\mathrm A}=0$。可是例 2 的循环净功约$482\,\mathrm J$，不是零；在$p$-$V$图上围成一块面积的循环都是这样。所以这样的$X$不存在。也可以直接用例 1：起点、终点相同，两条路线的功差了约$765\,\mathrm J$。

    （2）没有意义。体积是状态参量，气体在状态 1 有确定的体积，从 1 到 2 体积的改变量只看两头；功却是在过程中推动活塞、传给外界的能量，说的是「做了多少」，不是气体在某个状态「有多少」。由（1），没有一个「功的存量」，它的改变量能代表做的功。热量也是这样，见内能与热量一节（状态函数也在那里起名）。

    （3）$\int_{V_1}^{V_2}\dd V=V_2-V_1$确实和路线无关，可功是$\int p\,\dd V$：同样的一小段$\dd V$，在不同的路线上要乘不同的$p$。例 1 里路线二在较高的压强下膨胀，每一段$\dd V$都乘了较大的$p$，加起来就多。指定了路线，在体积单调变化的每一段上，$p$就成了体积的确定的函数，功也就确定了。
