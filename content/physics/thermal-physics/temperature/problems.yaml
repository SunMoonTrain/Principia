- id: p1
  tier: easy
  statement: |
    1 标准大气压下，液氮的沸点是$77.36\,\mathrm K$。它是多少摄氏度？
  answer:
    type: number
    value: 77.36-273.15
    unit: |
      $^\circ\mathrm C$
  hints:
    - |
      热力学温度和摄氏温度只差一个常数。
    - |
      $T=t+273.15\,\mathrm K$，所以$t$的数值等于$T$的数值减去$273.15$。
    - |
      $t=(77.36-273.15)\,^\circ\mathrm C=-195.79\,^\circ\mathrm C$。
  solution: |
    由$T=t+273.15\,\mathrm K$，$t=(77.36-273.15)\,^\circ\mathrm C=-195.79\,^\circ\mathrm C$。液氮比冰点低约$196\,\mathrm K$，常用来快速冷冻。

- id: p2
  tier: easy
  statement: |
    下面哪些说法正确？
  answer:
    type: choice
    multiple: true
    options:
      - |
        1 标准大气压下，把$0\,^\circ\mathrm C$的冰块放进一大杯$0\,^\circ\mathrm C$的水里，盖好并和外界隔绝，冰块会慢慢化掉一部分
      - |
        甲和乙热平衡，乙和丙热平衡，丙和丁热平衡，那么不让甲、丁接触也能断定：让它们接触时，两边的状态都不会变化
      - |
        两个系统温度相同，那么它们的压强也一定相同
      - |
        气温从$-5\,^\circ\mathrm C$升到$18\,^\circ\mathrm C$，热力学温度升高了$23\,\mathrm K$
      - |
        把一支冷的温度计插进一小滴热水里，等示数稳定后读出的，就是这滴水原来的温度
    value: [2, 4]
  hints:
    - |
      逐条对照定义：温度相同和热平衡是什么关系？第零定律能不能接连用几次？温度计什么时候读出的才是被测物体原来的温度？
    - |
      A 里冰和水的温度相同；B 里先由甲、丙都和乙热平衡，推出甲、丙热平衡；C 里温度相同只管接触时变不变；E 里的温度计比水滴大得多。
    - |
      A 错：冰和水温度相同，已经处于热平衡，什么都不会变。B 对：甲、丙都和乙热平衡，所以甲、丙热平衡；甲、丁又都和丙热平衡，所以甲、丁热平衡。C 错：温度相同只说明接触时状态不变，压强可以不同。D 对：升高了$18-(-5)=23$度，温差用$\mathrm K$和用$^\circ\mathrm C$数值相同；E 错：温度计比水滴大得多，接触时会把水滴的温度拉低，读数比原来的低。
  solution: |
    选 B、D。A 错：冰和水都是$0\,^\circ\mathrm C$，温度相同，已经处于热平衡，冰不会化。B 对：甲、丙都和乙热平衡，由热力学第零定律，甲、丙热平衡；甲、丁又都和丙热平衡，所以甲、丁也热平衡。C 错：温度相同只说明两者接触时状态不变，同在屋里的一瓶氧气和一个篮球温度相同，压强却可以差得很远。

    D 对：升高了$18-(-5)=23$度，温差用$\mathrm K$和用$^\circ\mathrm C$表示数值相同。E 错：温度计比水滴大得多，接触时会明显改变水滴的状态，读数比水滴原来的温度低；温度计要比待测物体小得多才行。

- id: p3
  tier: medium
  statement: |
    用充二氧化碳的定容气体温度计测锌的凝固点。泡里的气体在水的三相点时压强为$p_3=80.00\,\mathrm{kPa}$，放进正在凝固的锌里时压强为$203.856\,\mathrm{kPa}$；放掉一部分气体后，三相点时$p_3=40.00\,\mathrm{kPa}$，放进正在凝固的锌里时压强为$101.680\,\mathrm{kPa}$。设读数随$p_3$按直线变化，按理想气体温标，锌的凝固点是多少开尔文？结果保留四位有效数字。
  answer:
    type: number
    value: 273.16*(2*101.680/40 - 203.856/80)
    unit: |
      $\mathrm K$
  tolerance: { rel: 5.0e-4 }
  hints:
    - |
      两次的读数不一样，要沿直线外推到气体越来越稀薄、$p_3=0$的情形。
    - |
      $p_3=80.00\,\mathrm{kPa}$时读数$T^*=273.16\,\mathrm K\times\frac{203.856}{80.00}\approx696.066\,\mathrm K$，$p_3=40.00\,\mathrm{kPa}$时约为$694.373\,\mathrm K$。$p_3$再减少$40\,\mathrm{kPa}$，读数还会减少同样多。
    - |
      $T\approx694.373\,\mathrm K-(696.066-694.373)\,\mathrm K\approx692.68\,\mathrm K$，保留四位有效数字是$692.7\,\mathrm K$。
  solution: |
    两次的读数分别是$273.16\,\mathrm K\times2.548\,2\approx696.066\,\mathrm K$和$273.16\,\mathrm K\times2.542\,0\approx694.373\,\mathrm K$。读数随$p_3$按直线变化，$p_3$每减少$40\,\mathrm{kPa}$，读数减少约$1.693\,\mathrm K$，外推到$p_3=0$得$T\approx692.68\,\mathrm K$，即$692.7\,\mathrm K$。只用$40\,\mathrm{kPa}$那一次会得到$694.4\,\mathrm K$，偏高约$1.7\,\mathrm K$：在这样的压强下，二氧化碳离很稀薄的情形还远。锌的凝固点约为$419.5\,^\circ\mathrm C$，是校准温度计用的固定点之一。

- id: p4
  tier: medium
  statement: |
    华氏温标（Fahrenheit scale）的读数$t_{\mathrm F}$和摄氏温度$t$按直线对应：$32\,^\circ\mathrm F$对应$0\,^\circ\mathrm C$，$212\,^\circ\mathrm F$对应$100\,^\circ\mathrm C$。在某个温度下，华氏读数和摄氏读数恰好是同一个数。这个温度的热力学温度是多少开尔文？按$T=t+273.15\,\mathrm K$换算。
  answer:
    type: number
    value: 233.15
    unit: |
      $\mathrm K$
  hints:
    - |
      先写出$t_{\mathrm F}$和$t$的直线关系，再让两个读数相等。
    - |
      $100\,^\circ\mathrm C$的间隔对应$180\,^\circ\mathrm F$，所以只看数值时$t_{\mathrm F}=32+1.8t$。令$t_{\mathrm F}=t$。
    - |
      $t=32+1.8t$，$t=-40$，即$-40\,^\circ\mathrm C$也是$-40\,^\circ\mathrm F$；$T=(-40+273.15)\,\mathrm K=233.15\,\mathrm K$。
  solution: |
    $100\,^\circ\mathrm C$的间隔对应$212-32=180$华氏度，所以只看数值时$t_{\mathrm F}=32+1.8t$。两个读数相同时$t=32+1.8t$，得$t=-40$，即$-40\,^\circ\mathrm C$恰好也是$-40\,^\circ\mathrm F$。热力学温度$T=(-40+273.15)\,\mathrm K=233.15\,\mathrm K$。

- id: p5
  tier: hard
  statement: |
    铂电阻温度计（platinum resistance thermometer）用一段铂丝的电阻测温。在$0\,^\circ\mathrm C$以上，铂丝的电阻$R$和真实的摄氏温度$t$（由热力学温度定出）的关系很接近$R=R_0(1+At+Bt^2)$，其中$A=3.908\,3\times10^{-3}\,{}^\circ\mathrm C^{-1}$，$B=-5.775\times10^{-7}\,{}^\circ\mathrm C^{-2}$。

    （1）像摄氏温标对水银柱那样，在$0\,^\circ\mathrm C$和$100\,^\circ\mathrm C$量出电阻，规定这两点的读数是$0$和$100$，中间按电阻均匀分度。真实温度为$50.00\,^\circ\mathrm C$时，它读多少？

    （2）一支泡里的气体很稀薄的定容气体温度计，也在$0\,^\circ\mathrm C$和$100\,^\circ\mathrm C$按压强这样刻度，它在这一温度下读多少？两支温度计为什么只在两个刻度点上一致？

    （3）哪一支的读数算「对」，由什么决定？
  hints:
    - |
      刻度以后的读数是$t^*=100\times\frac{R-R_0}{R_{100}-R_0}$，$R_{100}$是$100\,^\circ\mathrm C$时的电阻；气体温度计的读数照样由压强算。
    - |
      代入$R=R_0(1+At+Bt^2)$，$R_0$约掉，$t^*=100\times\frac{50A+2500B}{100A+10^4B}$。稀薄气体的体积不变时，压强和热力学温度成正比，也就是$t$的一次函数。
    - |
      （1）$50A+2500B\approx0.193\,971$，$100A+10^4B=0.385\,055$，$t^*\approx50.37$，比真实温度高约$0.37\,\mathrm K$。

      （2）气体温度计的压强是$t$的一次函数，按两点刻度后读数处处等于$t$，读$50.00$。铂丝的电阻多了$Bt^2$这一项，不是$t$的一次函数，按电阻均匀分度就和$t$对不上；两支温度计只在刻度点上被人为地对准了。

      （3）两支温度计都没有「错」，读数算不算对由温标的约定决定。我们约定以热力学温度为准，它在气体温度计能用的范围里由理想气体温标实现，和用哪种气体无关，所以气体温度计的读数算对。铂电阻温度计要按$R=R_0(1+At+Bt^2)$这条校准曲线（calibration curve）换算，这条曲线本来就是拿它和标准比出来的；它又稳定又精确，实验室里常用，只是读数要这样换算。
  reference: |
    （1）刻度后的读数$t^*=100\times\frac{R-R_0}{R_{100}-R_0}$，代入$R=R_0(1+At+Bt^2)$，$R_0$约掉，$t^*=100\times\frac{50A+2500B}{100A+10^4B}$。$50A+2500B=0.195\,415-0.001\,443\,75=0.193\,971\,25$，$100A+10^4B=0.390\,83-0.005\,775=0.385\,055$，$t^*\approx50.375$，读约$50.37$，比真实温度高约$0.37\,\mathrm K$。

    （2）泡里的气体很稀薄、体积不变时，压强和热力学温度成正比，$p\propto t+273.15$，是$t$的一次函数；按两点刻度、中间按压强均匀分度，读数处处等于$t$，在这里读$50.00$。铂丝的电阻多了$Bt^2$一项，按电阻均匀分度时，读数是$t$的二次函数，只在两个刻度点上和$t$相等。两支温度计在这两点一致，是刻度时人为对准的，不说明中间也一致。

    （3）哪一支「对」，不由温度计本身决定，而由温标的约定决定。约定以热力学温度为准，它在气体温度计能用的范围里由理想气体温标实现，和用哪种气体无关，所以气体温度计的读数算对。铂电阻温度计要按它的校准曲线$R=R_0(1+At+Bt^2)$把电阻换算成温度，这条曲线正是拿它和标准比对得出的。铂电阻温度计稳定、精确、用起来方便，实际测量里常用它，只是要带着这条校准曲线。

- id: p6
  tier: hard
  statement: |
    取一支很小的温度计$C$，假定：它和别的系统接触时，几乎不改变对方的状态；它自己的状态由一个读数完全确定，两支一样的$C$读数不同时，让它们接触，状态就会变化。对每个系统$X$，让$C$和它接触、达到热平衡，把这时的读数记作$\theta(X)$。

    （1）用热力学第零定律证明：不论$C$原来是什么状态，和$X$达到热平衡以后读数都相同，所以$\theta(X)$有确定的值。

    （2）证明：$A$和$B$处于热平衡，则$\theta(A)=\theta(B)$。

    （3）证明：$\theta(A)=\theta(B)$，则$A$和$B$处于热平衡。
  hints:
    - |
      每一问都只用一次第零定律，关键是选好哪个系统当「第三个系统」。
    - |
      （1）设两支一样的$C$从不同的状态出发，和$X$达到热平衡后读数为$\theta_1$、$\theta_2$，第三个系统取$X$。（2）$C$和$A$热平衡，$B$也和$A$热平衡，第三个系统取$A$。（3）读数相同的$C$处在同一个状态，第三个系统取这个状态的$C$。
    - |
      （1）两支$C$都和$X$热平衡（$C$很小，$X$的状态没有变），由第零定律，这两支$C$彼此热平衡，让它们接触时状态都不变。按假定，读数不同的两支$C$接触时状态会变，所以$\theta_1=\theta_2$，$\theta(X)$有确定的值。

      （2）让$C$和$A$达到热平衡，读数是$\theta(A)$。$C$和$B$都与$A$热平衡，由第零定律，$C$和$B$热平衡：把这时的$C$拿去和$B$接触，它不会变化，读数仍是$\theta(A)$。由（1），$\theta(B)=\theta(A)$。

      （3）设$\theta(A)=\theta(B)=\theta$。$C$的状态由读数完全确定，读数为$\theta$的$C$是同一个状态，它既和$A$热平衡，又和$B$热平衡。由第零定律，$A$和$B$热平衡。
  reference: |
    （1）设两支一样的$C$从不同的状态出发，分别和$X$达到热平衡，读数为$\theta_1$、$\theta_2$；$C$很小，$X$的状态没有变，所以两支$C$都和同一个$X$热平衡。由第零定律（第三个系统取$X$），这两支$C$彼此热平衡，让它们接触时状态都不变。按假定，读数不同的两支$C$接触时状态会变，所以$\theta_1=\theta_2$，$\theta(X)$有确定的值。

    （2）让$C$和$A$达到热平衡，读数是$\theta(A)$。$C$和$A$热平衡，$B$也和$A$热平衡，由第零定律（第三个系统取$A$），$C$和$B$热平衡：这时的$C$和$B$接触，状态不变，读数仍是$\theta(A)$。由（1），$C$和$B$热平衡时的读数只有一个，所以$\theta(B)=\theta(A)$。

    （3）设$\theta(A)=\theta(B)=\theta$。$C$的状态由读数完全确定，读数为$\theta$的$C$是同一个状态，记作$C_\theta$；它和$A$热平衡，也和$B$热平衡。由第零定律（第三个系统取$C_\theta$），$A$和$B$热平衡。

    合起来：每个系统都有一个数$\theta$，两个系统热平衡当且仅当$\theta$相同，这正是温度的定义要的东西。换一支温度计或换一种读法，得到的是$\theta$的另一个一一对应的函数，也就是换了一种温标。

- id: p7
  tier: thinking
  statement: |
    水银温度计用水银的体积测温。

    （1）把水银换成水，在$0\,^\circ\mathrm C$到$100\,^\circ\mathrm C$之间造一支「水温度计」，像摄氏温标那样在两端刻度、中间按体积均匀分度，行不行？

    （2）一种性质要能当测温性质，至少要满足哪些条件？
  hints:
    - |
      水在$4\,^\circ\mathrm C$附近的密度有什么特别？
    - |
      从$0\,^\circ\mathrm C$升到$4\,^\circ\mathrm C$，水的体积反而变小，$4\,^\circ\mathrm C$以上才随温度升高而变大；$2\,^\circ\mathrm C$和$6\,^\circ\mathrm C$时同一份水的体积几乎一样。
    - |
      （1）不行。水在$4\,^\circ\mathrm C$附近体积最小，$2\,^\circ\mathrm C$和$6\,^\circ\mathrm C$时体积几乎一样，这支温度计分不出它们；在$4\,^\circ\mathrm C$附近体积又几乎不随温度变，很不灵敏。就算只看$4\,^\circ\mathrm C$以上，水的体积随温度的变化也很不均匀：按两端刻度后，真实温度为$50\,^\circ\mathrm C$时它只读约$28$，在$4\,^\circ\mathrm C$时还读出略低于$0$的数。

      （2）在使用的范围里，测温性质要随温度单调地变化，一个值只对应一个温度；变化要足够明显，才读得准；同一个温度下每次都得到同一个值，能复现。测温物质在这个范围里也不能变成别的状态：水在$0\,^\circ\mathrm C$结冰、在$100\,^\circ\mathrm C$沸腾，这支温度计连两端都难用。
  reference: |
    （1）不行。水的密度在约$4\,^\circ\mathrm C$时最大，体积最小：从$0\,^\circ\mathrm C$升到$4\,^\circ\mathrm C$体积变小，$4\,^\circ\mathrm C$以上才变大，$2\,^\circ\mathrm C$和$6\,^\circ\mathrm C$时同一份水的体积几乎一样，这支温度计分不出它们；$4\,^\circ\mathrm C$附近体积几乎不变，也很不灵敏。$4\,^\circ\mathrm C$以上体积随温度的变化也很不均匀：按$0\,^\circ\mathrm C$、$100\,^\circ\mathrm C$刻度、中间按体积均分，真实温度为$50\,^\circ\mathrm C$时读约$28$（由水的密度表算出），$4\,^\circ\mathrm C$时读约$-0.3$。和水银温度计、气体温度计比，它在两点之间差得太远。

    （2）测温性质要在使用的范围里随温度单调地变化，使一个值只对应一个温度；变化要足够明显，读得出来；同一个温度下每次都得到同一个值，能复现。测温物质在这个范围里不能发生凝固、沸腾这类变化：水在$0\,^\circ\mathrm C$结冰（还会胀破玻璃管），在$100\,^\circ\mathrm C$沸腾。水银在$-39\,^\circ\mathrm C$到$357\,^\circ\mathrm C$之间都是液体，体积随温度的变化又相当均匀，所以适合做温度计。

- id: p8
  tier: thinking
  statement: |
    下面几种说法里的「温度」有没有意义？

    （1）一个分子的温度。

    （2）一杯正在被搅拌、各处冷热不均的水的温度。

    （3）热水刚倒进冷水的那一刻，杯里水的温度。
  hints:
    - |
      温度是怎样定义的？它要求系统处在什么样的状态？
    - |
      温度靠热平衡定义，只对处在平衡态的宏观系统有意义；一个系统整体不平衡时，看它的一小块是不是近似平衡。
    - |
      （1）没有意义。温度靠热平衡定义，是大量分子组成的宏观系统的性质；一个分子没有平衡态，它的速度每次碰撞都在变，也没法让它和温度计达到热平衡。能说的是一团气体的温度，它和分子运动的快慢有关，见[气体动理论](lesson:physics.thermal-physics.kinetic-theory)。

      （2）整杯水没有一个温度，它不处在平衡态。取其中很小的一块，小到里面差不多冷热均匀、又大到含有大量分子，这一小块近似处在平衡态，可以说它的温度；用很小的温度计在不同地方量，读数不同，量出的就是各处的温度。

      （3）那一刻整杯水也没有一个温度：热水和冷水各占一块，各自近似有自己的温度。过一阵子，整杯水达到平衡态，才有一个共同的温度，介于原来两者之间。
  reference: |
    （1）没有意义。温度靠热平衡定义，是大量分子组成的宏观系统在平衡态时的性质；一个分子谈不上平衡态，它的速度每次碰撞都在变，也没法让它和温度计达到热平衡。能说的是由大量分子组成的一团气体的温度，它和分子平均运动的快慢有关，见[气体动理论](lesson:physics.thermal-physics.kinetic-theory)。

    （2）整杯水不处在平衡态，没有一个温度。但可以取其中很小的一块：小到里面差不多冷热均匀，又大到含有大量分子。这样的一小块近似处在平衡态，有它的温度，各处不同，用很小的温度计在不同地方就能量出来；天气预报说的各地气温，也是这个意思。

    （3）那一刻整杯水也没有一个温度：热水和冷水各占一块，交界处冷热变化很快，每一小块近似有自己的温度。等搅匀、放一阵子，整杯水达到平衡态，才有一个共同的温度，介于原来两者之间。
