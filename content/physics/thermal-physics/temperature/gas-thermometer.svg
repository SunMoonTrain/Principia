<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-size="14">
  <!-- 定容气体温度计：左边的玻璃泡浸在待测物体里，细管把泡里的气体通到水银压强计的左管；右管和左管的下端用软管连着，可以上下移动，让左管的水银面停在标记处。右管水银面比左管高出 h，右管上端通大气。示意图，不按比例。 -->
  <rect x="31" y="141" width="178" height="138" style="fill: var(--accent, #2563eb)" fill-opacity="0.10" />
  <line x1="30" y1="141" x2="210" y2="141" style="stroke: var(--accent, #2563eb)" stroke-width="1.4" />
