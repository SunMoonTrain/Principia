- id: p1
  tier: easy
  statement: |
    一台可逆热机工作在一个待测的热库和一大瓶处在三相点的水（冰、水和水蒸气共存，吸热时温度不变）之间，三相点取$273.16\,\mathrm K$。它每个循环从待测的热库吸热$2.40\,\mathrm{kJ}$，向三相点的水放热$0.900\,\mathrm{kJ}$。待测热库的热力学温度是多少？
  answer:
    type: number
    value: 273.16*2.40/0.900
    unit: |
      $\mathrm K$
  hints:
    - |
      哪个是高温热库？可逆热机吸、放的热量之比，和两个热库的热力学温度之比有什么关系？
    - |
      热机向三相点的水放热，它是低温热库，$T_{\mathrm L}=273.16\,\mathrm K$。由热力学温标的规定，$\frac{T_{\mathrm L}}{T_{\mathrm H}}=\frac{Q_{\mathrm L}}{Q_{\mathrm H}}$，所以$T_{\mathrm H}=T_{\mathrm L}\cdot\frac{Q_{\mathrm H}}{Q_{\mathrm L}}$。
    - |
      $T_{\mathrm H}=273.16\,\mathrm K\times\frac{2.40}{0.900}\approx728.4\,\mathrm K$。
  solution: |
    热机从待测的热库吸热、向三相点的水放热，待测的热库是高温热库。由热力学温标的规定，可逆热机吸、放的热量之比等于两个热库的热力学温度之比，和工作物质无关：$\frac{T_{\mathrm H}}{273.16\,\mathrm K}=\frac{2.40}{0.900}$，所以$T_{\mathrm H}\approx728.4\,\mathrm K$。这样测温不用任何一种物质的性质，只要量热量。

- id: p2
  tier: easy
  statement: |
    下面的热机都只和说到的两个热库交换热量。哪些说法正确？
  answer:
    type: choice
    multiple: true
    options:
      - |
        一台热机在$600\,\mathrm K$和$300\,\mathrm K$两个热库之间工作，热机效率是 40%，它一定不是可逆热机
      - |
        只要选对工作物质，工作在两个热库之间的热机，热机效率可以超过同样两个热库之间的可逆热机
      - |
        用热力学温标定出的两个热库的温度之比，和选哪个热库当参考热库有关
      - |
        一台可逆热机每从高温热库吸热$100\,\mathrm J$，就向低温热库放热$60\,\mathrm J$，那么低温热库的热力学温度是高温热库的$0.6$倍
      - |
        热力学温标只规定了温度之比，所以也可以像摄氏温标（Celsius scale）那样另选零点，例如把水的冰点的温度定为$0$
    value: [1, 4]
  hints:
    - |
      卡诺定理说了哪两件事，各管哪一种热机？可逆热机的热机效率由什么决定？热力学温度之比怎样由可逆热机定出？
    - |
      A 先算这两个热库之间可逆热机的热机效率；B 对照卡诺定理的前一半；C 看热力学温标的规定里两个热库的温度之比等于什么，用没用到参考热库；D 用$\frac{T_{\mathrm L}}{T_{\mathrm H}}=\frac{Q_{\mathrm L}}{Q_{\mathrm H}}$；E 另选零点，就是把每个温度都加上同一个数，温度之比还保得住吗？
    - |
      选 A、D。A 对：这两个热库之间的可逆热机，热机效率都是$1-\frac{300}{600}=0.5$，40% 不等于它，所以不是可逆热机。B 错：卡诺定理说任何热机都不超过可逆热机，和工作物质无关。C 错：两个热库的温度之比就等于它们之间可逆热机的$\frac{Q_{\mathrm L}}{Q_{\mathrm H}}$，和参考热库无关；换一个参考热库，$\varphi$只差一个常数倍。

      D 对：$\frac{T_{\mathrm L}}{T_{\mathrm H}}=\frac{60}{100}=0.6$。E 错：温度之比由可逆热机定死了，只能把所有温度同乘一个数，也就是选单位；另选零点等于把每个温度都加上同一个数，比值就变了。
  solution: |
    选 A、D。A 对：$600\,\mathrm K$和$300\,\mathrm K$之间的可逆热机，热机效率都是$1-\frac{300}{600}=0.5$，热机效率是 40% 的就不是可逆热机。B 错：由卡诺定理，任何热机都不超过同样两个热库之间的可逆热机，换什么工作物质都一样。C 错：两个热库的温度之比直接等于它们之间可逆热机的$\frac{Q_{\mathrm L}}{Q_{\mathrm H}}$，参考热库只在推导里用来说明比值能拆开，换一个参考热库，$\varphi$只差一个常数倍。

    D 对：$\frac{T_{\mathrm L}}{T_{\mathrm H}}=\frac{Q_{\mathrm L}}{Q_{\mathrm H}}=0.6$。E 错：两个热库的温度之比由可逆热机的$\frac{Q_{\mathrm L}}{Q_{\mathrm H}}$定死了，能改的只是把所有温度同乘一个数，也就是选单位；另选零点要把每个温度都加上同一个数，比值就变了，那就不再是热力学温标。

- id: p3
  tier: medium
  statement: |
    一台可逆制冷机（reversible refrigerator）用氨（ammonia）当工作物质，氨不能看成理想气体。它只和$250\,\mathrm K$的冷库、$295\,\mathrm K$的室外空气交换热量，每秒从冷库取走$1.8\,\mathrm{kJ}$的热量。外界对它做净功的功率是多少？
  answer:
    type: number
    value: 1800*(295 - 250)/250
    unit: |
      $\mathrm W$
  hints:
    - |
      工作物质不是理想气体，可逆制冷机的制冷系数还能只用两个热库的温度算吗？
    - |
      可逆制冷机是倒过来运行的可逆热机，由卡诺定理，$\frac{Q_{\mathrm L}}{Q_{\mathrm H}}=\frac{T_{\mathrm L}}{T_{\mathrm H}}$和工作物质无关，制冷系数$\frac{Q_{\mathrm L}}{|W|}=\frac{T_{\mathrm L}}{T_{\mathrm H}-T_{\mathrm L}}$。外界每秒做的净功就是要求的功率。
    - |
      制冷系数是$\frac{250}{45}$，功率是$1800\,\mathrm W\times\frac{45}{250}=324\,\mathrm W$。
  solution: |
    可逆制冷机是倒过来运行的可逆热机，各段的热量和功只改变正负。由卡诺定理，可逆热机的$\frac{Q_{\mathrm L}}{Q_{\mathrm H}}=\frac{T_{\mathrm L}}{T_{\mathrm H}}$和工作物质无关，所以用氨也有制冷系数$\frac{Q_{\mathrm L}}{|W|}=\frac{T_{\mathrm L}}{T_{\mathrm H}-T_{\mathrm L}}=\frac{250}{45}\approx5.56$。每秒取走$1800\,\mathrm J$，外界每秒做净功$1800\,\mathrm J\times\frac{45}{250}=324\,\mathrm J$，功率是$324\,\mathrm W$，每秒向室外放热$2124\,\mathrm J$。

- id: p4
  tier: medium
  statement: |
    两台可逆热机串联：甲工作在$720\,\mathrm K$的热库和一个中间热库之间，乙工作在这个中间热库和$320\,\mathrm K$的热库之间，乙每个循环正好吸收甲放进中间热库的全部热量。两台的热机效率相等。

    依次求中间热库的热力学温度（以$\mathrm K$为单位）和两台合起来的热机效率（写成分数，或保留三位有效数字的小数）。
  answer:
    type: tuple
    value: [sqrt(720*320), 1 - 320/720]
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      可逆热机的热机效率只由什么决定？两台合起来，中间热库有没有净变化，合起来相当于什么？
    - |
      记中间热库的温度为$T_{\text{中}}$，$1-\frac{T_{\text{中}}}{720\,\mathrm K}=1-\frac{320\,\mathrm K}{T_{\text{中}}}$，所以$T_{\text{中}}^2=720\times320\,\mathrm K^2$。中间热库没有净变化，两台合起来是$720\,\mathrm K$和$320\,\mathrm K$之间的一台可逆热机。
    - |
      $T_{\text{中}}=\sqrt{720\times320}\,\mathrm K=480\,\mathrm K$，每台的热机效率都是$\frac13$。合起来的热机效率是$1-\frac{320}{720}=\frac59\approx0.556$，也等于$1-\bigl(1-\frac13\bigr)^2$。
  solution: |
    可逆热机的热机效率只由两个热库的热力学温度决定。记中间热库的温度为$T_{\text{中}}$，由$1-\frac{T_{\text{中}}}{720\,\mathrm K}=1-\frac{320\,\mathrm K}{T_{\text{中}}}$得$T_{\text{中}}=\sqrt{720\times320}\,\mathrm K=480\,\mathrm K$，每台的热机效率都是$\frac13$。

    中间热库每个循环收进的热量和放出的一样多，没有净变化，两台合起来就是$720\,\mathrm K$和$320\,\mathrm K$之间的一台可逆热机，热机效率是$1-\frac{320}{720}=\frac59\approx0.556$。也可以直接算：甲吸热$Q_{\mathrm H}$，放进中间热库$\frac23Q_{\mathrm H}$，乙再放出其中的$\frac23$，一共做功$Q_{\mathrm H}-\frac49Q_{\mathrm H}=\frac59Q_{\mathrm H}$。

- id: p5
  tier: hard
  statement: |
    下面的热机、制冷机都只和同样两个热库交换热量。

    （1）证明：任何制冷机的制冷系数都不超过可逆制冷机（倒过来运行的可逆热机）。

    （2）证明：不可逆热机（irreversible engine）的热机效率一定比可逆热机低，不会相等。
  hints:
    - |
      （1）仿照卡诺定理的证明：假如制冷机甲的制冷系数比可逆制冷机乙大，让两台从低温热库取走同样多的热量，比较要外界做的功，再想想把哪一台倒过来。（2）假如相等，像讲解里那样让不可逆热机带动倒过来的可逆热机，两个热库和外界最后怎样？对照可逆过程（reversible process）的定义。
    - |
      （1）甲要的功$|W_{\text{甲}}|$比乙要的$|W_{\text{乙}}|$少；把乙倒过来当热机，它做的功一部分带动甲，还剩$|W_{\text{乙}}|-|W_{\text{甲}}|$。（2）热机效率相等、做的功相同时，两台吸、放的热量也分别相同；不可逆热机转一圈以后，倒过来的可逆热机转一圈，就把它留下的变化全部抹掉了。
    - |
      （1）设甲是任意一台制冷机，乙是可逆制冷机，调整乙里工作物质的多少，使两台每个循环都从低温热库取走热量$Q_{\mathrm L}$。假如甲的制冷系数比乙大，甲每个循环要外界做的功$|W_{\text{甲}}|$就比乙的$|W_{\text{乙}}|$少。让乙倒过来当热机：它从高温热库吸热$Q_{\mathrm L}+|W_{\text{乙}}|$，向低温热库放热$Q_{\mathrm L}$，对外做功$|W_{\text{乙}}|$，拿其中的$|W_{\text{甲}}|$带动甲。

      合起来低温热库没有变化；甲向高温热库放热$Q_{\mathrm L}+|W_{\text{甲}}|$，所以高温热库净放出$|W_{\text{乙}}|-|W_{\text{甲}}|>0$，正好是剩下对外做的功。这是只从一个热库吸热、全部变成功，此外没有别的变化，违反开尔文表述（Kelvin statement）。所以甲的制冷系数不超过乙的。

      （2）设甲是不可逆热机，乙是可逆热机，调整乙的大小，使两台每个循环做的功都是$W$。由卡诺定理，$\eta_{\text{甲}}\le\eta_{\text{乙}}$；假如两者相等，两台从高温热库吸的热量、向低温热库放的热量也分别相等。让甲转一个循环，再用它做的功$W$带动倒过来的乙转一个循环：高温热库失去的热量又被送了回来，低温热库得到的热量又被取走，外界得到的功又付了出去，两台的工作物质也都回到原来的状态。

      这就是说，甲转完一个循环以后，有一个过程能让甲和外界都完全复原，按可逆过程的定义，甲的这个循环是可逆过程。循环里的每一段也都可逆：走完任何一段以后，接着走完这个循环、回到这一段开始时的状态，再让乙倒过来转一圈，一切就都复原了。于是甲是可逆热机，和假设矛盾，所以$\eta_{\text{甲}}<\eta_{\text{乙}}$。
  reference: |
    （1）甲任意、乙可逆，取同样的$Q_{\mathrm L}$；若甲的制冷系数更大，则$|W_{\text{甲}}|<|W_{\text{乙}}|$。乙反转为热机：从高温热库吸$Q_{\mathrm L}+|W_{\text{乙}}|$，向低温热库放$Q_{\mathrm L}$，做功$|W_{\text{乙}}|$，用其中$|W_{\text{甲}}|$带动甲。低温热库净变化为零，高温热库净放热$|W_{\text{乙}}|-|W_{\text{甲}}|>0$，全部成为对外的功，违反开尔文表述。故任何制冷机的制冷系数不超过可逆制冷机；两台都可逆时互换角色得相等。

    （2）若$\eta_{\text{甲}}=\eta_{\text{乙}}$，同功$W$时两台的$Q_{\mathrm H}$、$Q_{\mathrm L}$分别相等。甲正转一圈，用其功带动反转的乙一圈，两个热库、功源和乙全部复原，所以甲的循环能被完全复原，是可逆过程；循环中任一段之后续完循环、回到这一段开始时的状态，再反转乙一圈即可复原，故每段都可逆，甲是可逆热机，矛盾。故不可逆热机的热机效率严格小于可逆热机。

- id: p6
  tier: hard
  statement: |
    热泵（heat pump）冬天靠外界做功，从室外吸热、向屋里放热。它和制冷机是同一种装置，只是要的是放出的热量。

    （1）热泵只和温度为$T_0$的室外、温度为$T_{\mathrm H}$的屋里交换热量。证明：外界每做$1\,\mathrm J$的功，屋里最多得到$\frac{T_{\mathrm H}}{T_{\mathrm H}-T_0}\,\mathrm J$的热量。

    （2）发电厂在$750\,\mathrm K$烧燃料，向$273\,\mathrm K$的环境放热，发的电用来带动热泵，室外$273\,\mathrm K$，屋里$293\,\mathrm K$。都按可逆计算，燃料每放出$1\,\mathrm J$热量，屋里最多能得到多少热量？把燃料直接在屋里烧呢？

    （3）实际的发电厂热机效率约 40%，外界对热泵每做$1\,\mathrm J$的功，屋里约得到$3.5\,\mathrm J$热量。这时用热泵，屋里得到的热量还比直接烧多吗？

    （4）换别的办法，屋里能不能得到比（2）更多的热量？设装置丙循环工作，和外界不交换功，只和$750\,\mathrm K$、$293\,\mathrm K$、$273\,\mathrm K$三个热库（后两个就是屋里和室外）交换热量，每从$750\,\mathrm K$的热库吸热$1\,\mathrm J$，就向屋里放热$Q$。证明$Q$不超过（2）里那个最大值。
  hints:
    - |
      （1）把热泵看成制冷机，屋里是高温热库，室外是低温热库；屋里得到的热量和功之比，比制冷系数多多少？制冷系数最大是多少？（2）先算燃料每放出$1\,\mathrm J$热量，发电厂最多发多少电，再算这些电带动热泵，最多给屋里多少热量。（4）仿照卡诺定理的证明，想想该把什么倒过来。
    - |
      （1）$Q_{\mathrm H}=Q_{\mathrm L}+|W|$，$\frac{Q_{\mathrm H}}{|W|}=1+\frac{Q_{\mathrm L}}{|W|}$；由第 5 题（1），制冷系数不超过可逆制冷机的$\frac{T_0}{T_{\mathrm H}-T_0}$。（2）发电厂最多$1-\frac{273}{750}$，热泵最多$\frac{293}{293-273}$，两者相乘。（3）算$0.40\times3.5$。（4）把（2）的可逆热机和可逆热泵合起来，也是一台和外界不交换功、只和这三个热库交换热量的装置；把它整个倒过来，和丙配在一起，让$750\,\mathrm K$的热库没有净变化，再看屋里和室外。
    - |
      （1）热泵是一台制冷机，室外是低温热库，屋里是高温热库。外界做功$|W|$，它从室外吸热$Q_{\mathrm L}$，向屋里放热$Q_{\mathrm H}=Q_{\mathrm L}+|W|$，所以$\frac{Q_{\mathrm H}}{|W|}=1+\frac{Q_{\mathrm L}}{|W|}$。由第 5 题（1），制冷系数$\frac{Q_{\mathrm L}}{|W|}$不超过可逆制冷机的$\frac{T_0}{T_{\mathrm H}-T_0}$，所以$\frac{Q_{\mathrm H}}{|W|}\le1+\frac{T_0}{T_{\mathrm H}-T_0}=\frac{T_{\mathrm H}}{T_{\mathrm H}-T_0}$。

      （2）把发电厂看成$750\,\mathrm K$和$273\,\mathrm K$之间的热机，燃料每放出$1\,\mathrm J$热量，最多发电$\bigl(1-\frac{273}{750}\bigr)\times1\,\mathrm J=0.636\,\mathrm J$。热泵每用$1\,\mathrm J$电，屋里最多得到$\frac{293}{20}\,\mathrm J=14.65\,\mathrm J$，所以屋里最多得到$0.636\times14.65\,\mathrm J\approx9.3\,\mathrm J$。直接在屋里烧，只得到$1\,\mathrm J$。

      （3）还是比直接烧多：燃料每放出$1\,\mathrm J$热量，屋里约得到$0.40\times3.5\,\mathrm J=1.4\,\mathrm J$。多出来的热量是热泵从室外搬进屋里的，能量照样守恒。

      （4）把（2）的可逆热机和可逆热泵合起来，也是一台和外界不交换功的装置：每从$750\,\mathrm K$的热库吸热$1\,\mathrm J$，就向屋里放热$Q_{\text{可逆}}\approx9.3\,\mathrm J$，由能量守恒，从室外净吸热$Q_{\text{可逆}}-1\,\mathrm J$。它的两部分都可逆，整个倒过来运行，就从屋里取走$Q_{\text{可逆}}$，向$750\,\mathrm K$的热库放热$1\,\mathrm J$，向室外放热$Q_{\text{可逆}}-1\,\mathrm J$。

      假如$Q>Q_{\text{可逆}}$，让丙每从$750\,\mathrm K$的热库吸热$1\,\mathrm J$，倒过来的那一台就还回$1\,\mathrm J$。合起来$750\,\mathrm K$的热库没有净变化，屋里净得到$Q-Q_{\text{可逆}}>0$，由能量守恒，这份热量都来自室外；两台都回到了原来的状态，和外界也没有交换功，没有别的变化。热量从$273\,\mathrm K$的室外传到了$293\,\mathrm K$的屋里，违反克劳修斯表述，所以$Q\le Q_{\text{可逆}}$。
  reference: |
    （1）热泵即制冷机（低温热库为室外$T_0$，高温热库为屋里$T_{\mathrm H}$）。$\frac{Q_{\mathrm H}}{|W|}=1+\frac{Q_{\mathrm L}}{|W|}$，由第 5 题（1），$\frac{Q_{\mathrm L}}{|W|}\le\frac{T_0}{T_{\mathrm H}-T_0}$，故$\frac{Q_{\mathrm H}}{|W|}\le\frac{T_{\mathrm H}}{T_{\mathrm H}-T_0}$，可逆时取等号。

    （2）$\left(1-\frac{273}{750}\right)\times\frac{293}{20}=0.636\times14.65\approx9.32$，即燃料每放热$1\,\mathrm J$，屋里最多得约$9.3\,\mathrm J$；直接燃烧只有$1\,\mathrm J$。

    （3）$0.40\times3.5=1.4>1$，仍比直接烧多；多出的热量取自室外。

    （4）把（2）的可逆热机与可逆热泵合成一台可逆装置：每从$750\,\mathrm K$吸热$1\,\mathrm J$，向$293\,\mathrm K$放热$Q_{\text{可逆}}=9.3174\,\mathrm J$，从$273\,\mathrm K$净吸热$Q_{\text{可逆}}-1\,\mathrm J$，与外界不交换功。若$Q>Q_{\text{可逆}}$，令它反向运行，与丙配成$750\,\mathrm K$处净变化为零，则$293\,\mathrm K$处净得$Q-Q_{\text{可逆}}>0$，全部来自$273\,\mathrm K$，与外界无功交换，别无变化，违反克劳修斯表述，故$Q\le Q_{\text{可逆}}$。用总熵不减核对：$-\frac1{750}-\frac{Q-1}{273}+\frac Q{293}\ge0$（$Q$以$\mathrm J$计）给出同一上限。

- id: p7
  tier: thinking
  statement: |
    热力学温标用可逆热机吸、放的热量之比规定温度之比。

    （1）由这个规定，为什么热力学温度不会是负的？要是当初把三相点规定成$-273.16\,\mathrm K$，又会怎样？

    （2）假如有一个热力学温度为$0$的热库，一台可逆热机工作在它和另一个热库之间，会怎样？这说明了什么？

    （3）有人由（2）说：「所以绝对零度（absolute zero）达不到。」这个推理对吗？
  hints:
    - |
      （1）两个热库的热力学温度之比就是$\frac{Q_{\mathrm L}}{Q_{\mathrm H}}$，[热力学第二定律](lesson:physics.thermal-physics.second-law)一节对$Q_{\mathrm L}$的正负说过什么？比值定下来以后，正负号还由什么定？（2）由温标的规定，$T_{\mathrm L}=0$时$Q_{\mathrm L}$是多少？（3）「没有温度为$0$的热库」和「不能把一个物体冷到$0\,\mathrm K$」说的是一回事吗？
    - |
      （1）由那一节的讲解和第 1 题，$Q_{\mathrm L}>0$，所以$\frac{T_{\mathrm L}}{T_{\mathrm H}}>0$，任何两个热库同号；再看三相点的正负。（2）$Q_{\mathrm L}=0$。（3）一个说的是热库，一个说的是冷却一个物体的过程；冷到了$0\,\mathrm K$的物体，再吸一点热会怎样？
    - |
      （1）可逆热机对外做正功，从高温热库吸热$Q_{\mathrm H}>0$。[热力学第二定律](lesson:physics.thermal-physics.second-law)一节讲过，热机必须向低温热库放热，$Q_{\mathrm L}=0$的热机造不成；那一节第 1 题又说明，从两个热库都只吸热、不放热的循环机器同样造不成，$Q_{\mathrm L}$也不能是负的。所以$Q_{\mathrm L}>0$，$\frac{T_{\mathrm L}}{T_{\mathrm H}}=\frac{Q_{\mathrm L}}{Q_{\mathrm H}}>0$，任何两个热库的热力学温度同号。

      三相点是正的$273.16\,\mathrm K$，每个热库都和它同号，所以热力学温度都是正的。上面的推理只定下同号，取正是规定：要是当初把三相点规定成$-273.16\,\mathrm K$，所有热库的热力学温度就都是负的，任何两个热库的温度之比都不变，可逆热机的热机效率照样是$1-\frac{T_{\mathrm L}}{T_{\mathrm H}}$，只是越热的热库数值越小，用起来别扭。统计力学里有的系统能处在「负温度」（negative temperature），这一问的推理对它们不适用，见[玻尔兹曼熵与统计温度](lesson:physics.thermal-physics.statistical-entropy)。

      （2）$T_{\mathrm L}=0$时，可逆热机的$Q_{\mathrm L}=Q_{\mathrm H}\cdot\frac{T_{\mathrm L}}{T_{\mathrm H}}=0$，它把从另一个热库吸的热全部变成功，回到原来的状态，此外没有变化，违反开尔文表述。所以不存在热力学温度为$0$的热库，热机效率$1-\frac{T_{\mathrm L}}{T_{\mathrm H}}$总小于 1。

      （3）不对。（2）只说明没有温度为$0$的热库，而热库的温度在交换热量以后几乎不变；一个物体就算冷到了$0\,\mathrm K$，不管多大，只要吸一点热，温度就不是$0$了，当不了这样的热库。所以由「没有这样的热库」推不出「没有这样的物体」。

      再说，（2）默认了有一台可逆热机能在它和另一个热库之间工作，那台热机的工作物质得先冷到$0\,\mathrm K$，才能和它同温；能不能冷到$0\,\mathrm K$，正是要回答的问题。这说的是冷却的过程，要另一条定律来回答，见[热力学第三定律](lesson:physics.thermal-physics.third-law)。
  reference: |
    （1）可逆热机$Q_{\mathrm H}>0$；$Q_{\mathrm L}=0$即热机效率为 1（热力学第二定律一节讲解），$Q_{\mathrm L}<0$即从两个热库都吸热（那一节第 1 题），都造不成。故$Q_{\mathrm L}>0$，$\frac{T_{\mathrm L}}{T_{\mathrm H}}>0$，所有热库与三相点（$273.16\,\mathrm K$）同号，热力学温度恒正。三相点若规定为负，则全部为负，比值与热机效率不变，越热数值越小，所以取正只是约定。统计力学中的负温度另论（玻尔兹曼熵与统计温度一节）。

    （2）$T_{\mathrm L}=0$则$Q_{\mathrm L}=0$，单一热库吸热全部变功，违反开尔文表述；故不存在$0\,\mathrm K$的热库，可逆热机的热机效率总小于 1。

    （3）不对。（2）只排除了交换热量后温度仍保持为$0$的热库；冷到$0\,\mathrm K$的物体再吸一点热温度就升高，不是这样的热库，所以「没有$0\,\mathrm K$的热库」推不出「不能把物体冷却到$0\,\mathrm K$」。（2）还默认了能在它和另一个热库之间工作的可逆热机，其工作物质须先冷到$0\,\mathrm K$，正是待答的问题。能否达到$0\,\mathrm K$涉及冷却过程，是热力学第三定律的内容（不能达到原理），不能由第二定律这样推出。

- id: p8
  tier: thinking
  statement: |
    讲解里证明卡诺定理时，让可逆热机乙倒过来当制冷机，由任意一台热机甲带动。

    （1）为什么不把甲倒过来？一台不可逆热机倒过来运行，会是什么样的机器？

    （2）规定热力学温标时，为什么一定要用可逆热机吸、放的热量之比？换成工作在同样两个热库之间的一台不可逆热机，行不行？
  hints:
    - |
      （1）可逆热机为什么倒过来就是制冷机？热机里有摩擦、隔着温差传热时，倒着转，这些过程会跟着倒过来吗？（2）一个温标要求温度之比只由两个热库决定；不可逆热机的$\frac{Q_{\mathrm L}}{Q_{\mathrm H}}$由什么决定？
    - |
      （1）倒着转时摩擦照样生热，热量照样从高温物体流向低温物体，各段的热量和功不只是改变正负。（2）不可逆热机的热机效率比可逆热机低，低多少要看摩擦、温差的大小。
    - |
      （1）证明要的是：把一台热机倒过来，得到的制冷机吸、放的热量和做的功只改变正负。可逆热机的每一段都能沿原路倒着走，正是这样。不可逆热机倒着转，摩擦照样把功变成热，隔着温差的传热照样从高温流向低温，倒过来的机器吸、放的热量和原来的热机对不上，甚至可能根本不能制冷。所以只能倒转可逆的乙，得出$\eta_{\text{甲}}\le\eta_{\text{乙}}$；要得出反方向的不等式，甲也得可逆。

      （2）温标要求温度之比只由两个热库决定。可逆热机的$\frac{Q_{\mathrm L}}{Q_{\mathrm H}}$都相同，这由卡诺定理保证。不可逆热机的$\frac{Q_{\mathrm L}}{Q_{\mathrm H}}$比可逆热机的大（见第 5 题（2）），大多少要看摩擦多大、隔着多大的温差传热；同样两个热库之间换一台不可逆热机，比值就变了，定不出温标。
  reference: |
    （1）卡诺定理的证明需要把一台热机反转成「热量和功仅变号」的制冷机，这只对可逆热机成立。不可逆热机反转时，摩擦仍把功变成热，有限温差下的传热方向不随之反转，反转后的装置与原热机不对应（甚至不能制冷）。故只能反转可逆的乙，得$\eta_{\text{甲}}\le\eta_{\text{乙}}$；要得$\eta_{\text{乙}}\le\eta_{\text{甲}}$须甲也可逆。

    （2）温标要求比值只依赖两个热库。可逆热机的$\frac{Q_{\mathrm L}}{Q_{\mathrm H}}$由卡诺定理保证唯一；不可逆热机的比值大于可逆值（第 5 题（2）），且随摩擦、温差等细节而变，不是两个热库的函数，不能用来定义温度。
