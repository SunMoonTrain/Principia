<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-size="14">
  <!-- 三幅并排：分子穿过平面 z₀ 时输运动量（黏性）、能量（热传导）、做了记号的甲分子（扩散）。三条水平线是 z₀ + λ、z₀（虚线）、z₀ − λ。每幅里一个分子从 z₀ + λ 向下、一个从 z₀ − λ 向上穿过 z₀。左：绿色箭头是各层的流速，上大下小。中：灰色横条的长短表示各层的温度，上高下低。右：实心圆点是甲分子，空心的是别的分子，甲分子上多下少。下面写着三个输运系数的估算式。示意图，不按比例。 -->
