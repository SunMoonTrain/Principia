- id: p1
  tier: easy
  statement: |
    隔热容器里装着$2.00\,\mathrm{kg}$水，用叶轮搅拌，外界对水做了$1.20\times10^4\,\mathrm J$的功，容器和叶轮吸收的能量不计。按$1\,\mathrm{cal}=4.184\,\mathrm J$、1 卡让$1\,\mathrm g$水升温$1\,\mathrm K$算，水温升高了多少？结果保留三位有效数字。
  answer:
    type: number
    value: 1.20e4/(4.184*2000)
    unit: |
      $\mathrm K$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      容器隔热，外界做的功和水的内能的增加有什么关系？不做功、只靠传热，要让水的内能增加同样多，水要吸收多少热量？
    - |
      水的内能增加$1.20\times10^4\,\mathrm J$。内能增加同样多，不管靠做功还是传热，升温都一样；把这份能量换算成卡，每卡让$1\,\mathrm g$水升温$1\,\mathrm K$。
    - |
      $\frac{1.20\times10^4}{4.184}\,\mathrm{cal}\approx2868\,\mathrm{cal}$，$2000\,\mathrm g$水升温$\frac{2868}{2000}\,\mathrm K\approx1.43\,\mathrm K$。
  solution: |
    容器隔热，水经历的是绝热过程，外界做的功等于水的内能的增加，$\Delta U=1.20\times10^4\,\mathrm J$。不做功时，吸收的热量等于内能的增加，所以这次升温和让水吸收$\frac{1.20\times10^4}{4.184}\,\mathrm{cal}\approx2868\,\mathrm{cal}$的热量一样。每卡让$1\,\mathrm g$水升温$1\,\mathrm K$，$2000\,\mathrm g$水升温$\Delta T\approx\frac{2868}{2000}\,\mathrm K\approx1.43\,\mathrm K$。

- id: p2
  tier: easy
  statement: |
    下面哪些说法正确？
  answer:
    type: choice
    multiple: true
    options:
      - |
        在同一间屋里放了很久的一大块铁和一小块木头，让它们接触，它们之间不传热
      - |
        用叶轮搅拌隔热容器里的水，不论搅得快还是慢，只要水的初、末状态相同，外界做的功就相同
      - |
        用绝热材料包住的物体，内能不会改变
      - |
        热传导只能在固体里发生，液体和气体里只能靠对流传热
      - |
        暖气片附近的空气受热上升，冷空气流过来补充，屋里渐渐暖和，这样传热的方式叫作对流
    value: [1, 2, 5]
  hints:
    - |
      逐项对照本节的定义和实验事实：热量是因为什么而转移的能量？绝热过程中外界做的功由什么决定？绝热壁挡住的是哪一种办法？
    - |
      A 两个物体在同一间屋里放了很久，温度怎样？B 看绝热过程中外界做功的那条实验事实。C 绝热壁挡住了传热，外界还能怎样改变物体的状态？

      D 热传导说的是热量在哪里传递？E 对流靠的是什么在流动？
    - |
      A 对：两个物体都和屋里的空气处于热平衡（thermal equilibrium），温度相同，接触时没有因为温度差而转移的能量，和大小、材料无关。B 对：水整体不动，绝热过程中外界做的功只由初、末状态决定。C 错：外界还能做功，焦耳就是在隔热容器里搅拌水。

      D 错：热量在直接接触的物体之间或物体内部由高温处传到低温处、物质本身并不流动，叫作热传导，液体、气体里也有；保温瓶的真空夹层挡住的就有空气里的热传导。E 对：受热的空气流动，把热量带到别处，这就是对流。
  solution: |
    选 A、B、E。A 对：两个物体都和屋里的空气处于热平衡，温度相同，接触时各自的状态都不变，没有因为温度差而转移的能量，铁大、木头小也不影响。B 对：水整体不动，绝热过程中外界做的功只由初、末两个平衡态决定，和怎样做功无关，搅得快慢只是做功的办法不同。

    C 错：绝热壁只挡住传热，外界还能做功改变内能，焦耳实验里的水就装在隔热容器里。D 错：热量在直接接触的物体之间或物体内部由高温处传到低温处、物质本身并不流动，叫作热传导，液体、气体里也有，只是空气导热很差；保温瓶的真空夹层挡住的就是空气的热传导和对流。E 对：空气受热上升、冷空气流过来，靠流动把热量带到整个屋子，这是对流。

- id: p3
  tier: medium
  statement: |
    隔热容器用不导热的隔板分成两格，一格装着$1.20\,\mathrm{kg}$、$15.0\,^\circ\mathrm C$的水，另一格装着$0.800\,\mathrm{kg}$、$65.0\,^\circ\mathrm C$的水。抽掉隔板，同时用叶轮搅拌，外界一共做了$1.00\times10^4\,\mathrm J$的功，最后全部的水温度相同。容器、隔板和叶轮吸收的能量都不计，按$1\,\mathrm{cal}=4.184\,\mathrm J$、1 卡让$1\,\mathrm g$水升温$1\,\mathrm K$算，最后的温度是多少？结果保留三位有效数字。
  answer:
    type: number
    value: (1200*15.0 + 800*65.0 + 1.00e4/4.184)/2000
    unit: |
      $^\circ\mathrm C$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      把全部的水当作一个系统。抽掉隔板以后，冷热两部分水之间传热，这算不算系统和外界之间的传热？系统的内能一共增加了多少？
    - |
      容器隔热，系统和外界之间不传热，外界做的功$1.00\times10^4\,\mathrm J$就是全部水的内能的增加；冷热水之间的传热只是把内能从一部分转到另一部分。水每克升温$1\,\mathrm K$，内能增加$1\,\mathrm{cal}$；设最后的温度是$x\,^\circ\mathrm C$，两部分内能的增加合起来是$1200\,(x-15.0)+800\,(x-65.0)$卡。
    - |
      $\frac{1.00\times10^4}{4.184}\,\mathrm{cal}\approx2390\,\mathrm{cal}$，所以$1200\,(x-15.0)+800\,(x-65.0)=2390$，$2000\,x=18000+52000+2390$，$x\approx36.2$，最后的温度约是$36.2\,^\circ\mathrm C$。
  solution: |
    把全部的水当作系统。容器隔热，系统和外界之间不传热，外界做的功就是系统内能的增加，$\Delta U=1.00\times10^4\,\mathrm J\approx2390\,\mathrm{cal}$；冷热两部分之间的传热只是把内能从热水转到冷水，不改变总量。水每克升温$1\,\mathrm K$，内能增加$1\,\mathrm{cal}$，设最后的温度是$x\,^\circ\mathrm C$，$1200\,(x-15.0)+800\,(x-65.0)=2390$，解得$x\approx36.2$，即约$36.2\,^\circ\mathrm C$。不搅拌时最后是$35.0\,^\circ\mathrm C$，搅拌使全部的水又多升温约$1.2\,\mathrm K$。

- id: p4
  tier: medium
  statement: |
    一个系统有四个平衡态 1、2、3、4。从 1 经绝热过程变到 2，外界做功$500\,\mathrm J$；从 1 不做功、只靠传热变到 3，系统吸热$300\,\mathrm J$；从 3 经绝热过程变到 4，外界做功$350\,\mathrm J$。从 4 不做功、只靠传热变到 2，系统吸收的热量是多少？放热时写负值。
  answer:
    type: number
    value: 500 - (300 + 350)
    unit: |
      $\mathrm J$
  hints:
    - |
      哪个量只由平衡态决定？绝热时外界做的功、不做功时吸收的热量，各等于它的什么？
    - |
      内能是状态函数：$U_2-U_1=500\,\mathrm J$，$U_3-U_1=300\,\mathrm J$，$U_4-U_3=350\,\mathrm J$。4→2 不做功，吸收的热量等于$U_2-U_4$。
    - |
      $U_4-U_1=300\,\mathrm J+350\,\mathrm J=650\,\mathrm J$，$Q=U_2-U_4=(U_2-U_1)-(U_4-U_1)=500\,\mathrm J-650\,\mathrm J=-150\,\mathrm J$，即放热$150\,\mathrm J$。
  solution: |
    内能是状态函数；系统整体不动时，绝热过程中外界做的功等于它的增加，不做功时吸收的热量也等于它的增加。由 1→2，$U_2-U_1=500\,\mathrm J$；由 1→3→4，$U_4-U_1=300\,\mathrm J+350\,\mathrm J=650\,\mathrm J$。4→2 不做功，$Q=U_2-U_4=500\,\mathrm J-650\,\mathrm J=-150\,\mathrm J$，系统放热$150\,\mathrm J$；内能的零点取在哪里都不影响这个差。

- id: p5
  tier: hard
  statement: |
    取系统的一个平衡态 O 作参考，规定$U_O=0$。

    （1）状态 A 能从 O 经绝热过程到达。按本节的定义，$U_A$等于什么？从 O 走不同的绝热路线到 A，定出的$U_A$会不会不同？

    （2）例如系统是一杯水，在隔热容器里用叶轮搅拌只能让它变热，不能让它变冷，比 O 冷的状态 B 也许不能从 O 绝热地到达。怎样用本节的实验事实给 B 定出内能？

    （3）设 O、A 之间两个方向都能绝热地走通。证明从 A 绝热地变到 O 时，外界做的功是$-U_A$，所以用（2）的办法给 A 定内能，结果和（1）相同。
  hints:
    - |
      （1）内能是怎样由绝热过程中外界做的功定义的？（2）O 不能绝热地变到 B 时，本节「实验还表明」的那一条（下面叫第二条实验事实）说明了什么？（3）把 O→A、A→O、O→A 三段接起来，它是从哪个状态到哪个状态的绝热过程？
    - |
      按本领域的约定，记 X 绝热地变到 Y 时系统对外做的功为$W_{XY}$，外界做的功就是$-W_{XY}$。（1）$U_A-U_O=-W_{OA}$。（2）由第二条实验事实，B 一定能绝热地变到 O，定义要求$U_O-U_B=-W_{BO}$。（3）三段接起来是从 O 到 A 的绝热过程，系统一共对外做功$2W_{OA}+W_{AO}$，用第一条实验事实。
    - |
      记 X 绝热地变到 Y 时系统对外做的功为$W_{XY}$，外界做的功是$-W_{XY}$。（1）按定义，O 绝热地变到 A 时外界做的功等于$U_A-U_O$，所以$U_A=-W_{OA}$。由第一条实验事实，绝热过程中外界做的功只由初、末状态决定，从 O 走哪条绝热路线到 A，$W_{OA}$都一样，定出的$U_A$也一样。

      （2）由第二条实验事实，O、B 之间至少有一个方向能绝热地走通；O 到不了 B，B 就能绝热地变到 O。定义要求$U_O-U_B=-W_{BO}$，所以$U_B=W_{BO}$，同样和走哪条绝热路线无关。例如 B 只是比 O 冷，可以靠搅拌升到 O，外界做正功，$W_{BO}<0$，$U_B<0$：内能的零点取在 O，这样的 B 内能是负的。

      （3）先从 O 绝热地变到 A，再从 A 绝热地变到 O，最后又从 O 绝热地变到 A，三段接起来是一个从 O 到 A 的绝热过程，系统一共对外做功$W_{OA}+W_{AO}+W_{OA}$。由第一条实验事实，它等于直接从 O 到 A 的$W_{OA}$，所以$W_{AO}=-W_{OA}$。从 A 绝热地变到 O 时外界做的功是$-W_{AO}=W_{OA}=-U_A$；照（2）的办法，$U_A=U_O+W_{AO}=W_{AO}=-W_{OA}$，和（1）相同。
  reference: |
    记 X 绝热地变到 Y 时系统对外做的功为$W_{XY}$（本领域的约定），外界做的功是$-W_{XY}$。

    （1）按定义，O 绝热地变到 A 时外界做的功等于$U_A-U_O$，所以$U_A=-W_{OA}$。由第一条实验事实，绝热过程中外界做的功只由初、末两个平衡态决定，从 O 走哪条绝热路线到 A，$W_{OA}$都一样，定出的$U_A$也一样。

    （2）由第二条实验事实，O、B 之间至少有一个方向能绝热地走通；O 到不了 B，B 就能绝热地变到 O。定义要求$U_O-U_B=-W_{BO}$，所以$U_B=W_{BO}$，由第一条实验事实，它同样和走哪条绝热路线无关。例如 B 和 O 只差在 B 冷一些，可以靠搅拌从 B 升到 O，外界做正功，$W_{BO}<0$，$U_B<0$：零点取在 O，这样的 B 内能是负的，这并不奇怪，有意义的只是差值。

    （3）先从 O 绝热地变到 A，再从 A 绝热地变到 O，最后又从 O 绝热地变到 A，三段接起来是一个从 O 到 A 的绝热过程，系统一共对外做功$2W_{OA}+W_{AO}$。由第一条实验事实，它等于直接从 O 到 A 的$W_{OA}$，所以$W_{AO}=-W_{OA}$，即一个绝热过程倒过来走得通时，两个方向上外界做的功互为相反数。从 A 绝热地变到 O 时外界做的功是$-W_{AO}=W_{OA}=-U_A$；照（2）的办法，$U_A=U_O+W_{AO}=W_{AO}=-W_{OA}$，和（1）相同。两条实验事实合起来，保证每个平衡态都能定出唯一的$U$，系统整体不动时，任意一个绝热过程里外界做的功都等于末、初两个状态的$U$之差。

- id: p6
  tier: hard
  statement: |
    一个$12.0\,\mathrm{kg}$的重物匀速下落$1.60\,\mathrm m$，带动叶轮搅拌隔热容器里$1.50\,\mathrm{kg}$的水，这样重复 25 次，水温升高了$0.642\,\mathrm K$。绳和滑轮的摩擦不计，取$g=9.8\,\mathrm{m/s^2}$。容器和叶轮也跟着升温、内能增加，它们内能的增加等于多少千克的水升温同样多时内能的增加，这个质量就叫作它们的水当量（water equivalent）。

    （1）按$1\,\mathrm{cal}=4.184\,\mathrm J$、1 卡让$1\,\mathrm g$水升温$1\,\mathrm K$算，容器和叶轮的水当量是多少？

    （2）如果不知道 1 卡合多少焦，又不计容器和叶轮，由这次实验算出的 1 卡约合多少焦？偏大还是偏小？

    （3）要减小（2）那样算带来的偏差，实验可以怎样安排？
  hints:
    - |
      容器隔热，把水、容器和叶轮合起来看，外界做的功和它们内能的增加有什么关系？重物匀速下落，绳子对叶轮做了多少功？
    - |
      （1）绳子做的功$25mgh=4704\,\mathrm J$等于水、容器和叶轮内能的增加；设水当量是$m'$，这就是$(1500\,\mathrm g+m')$的水升温$0.642\,\mathrm K$时内能的增加。（2）不计容器和叶轮，就是把这$4704\,\mathrm J$全部算在$1500\,\mathrm g$水上。（3）容器和叶轮分走的那一份，怎样才能占得少，或者事先量出来？
    - |
      （1）重物匀速下落，绳子的拉力等于重力，每下落一次绳子对叶轮做功$mgh$，25 次共$25\times12.0\times9.8\times1.60\,\mathrm J=4704\,\mathrm J$。容器隔热，把水、容器和叶轮合起来看是绝热过程，外界做的功等于它们内能的增加，也就是$(1500\,\mathrm g+m')$的水升温$0.642\,\mathrm K$时内能的增加：$(1500\,\mathrm g+m')\times4.184\,\mathrm{J/(g\cdot K)}\times0.642\,\mathrm K=4704\,\mathrm J$。解得$1500\,\mathrm g+m'\approx1751\,\mathrm g$，$m'\approx0.25\,\mathrm{kg}$。

      （2）不计容器和叶轮，就是认为$4704\,\mathrm J$全部使$1500\,\mathrm g$水升温$0.642\,\mathrm K$，算出 1 卡合$\frac{4704}{1500\times0.642}\,\mathrm J\approx4.88\,\mathrm J$。偏大：功有一部分使容器和叶轮的内能增加，却全部算在了水上，水升温所需的能量就被算多了。

      （3）让水多一些、容器和叶轮轻一些，它们分走的那一份就小；也可以先单独量出水当量，再像（1）那样扣掉。例如往空的容器里倒进质量、温度都已知的热水，等到热平衡时看水温降了多少：热水放出的热量全部使容器和叶轮升温，由此就能求出水当量。
  reference: |
    （1）重物匀速下落，绳子的拉力等于重力，每下落一次绳子对叶轮做功$mgh$，25 次共$W=25\times12.0\times9.8\times1.60\,\mathrm J=4704\,\mathrm J$。容器隔热，把水、容器和叶轮合起来看是绝热过程，外界做的功等于它们内能的增加。设水当量是$m'$，内能的增加和$(1500\,\mathrm g+m')$的水升温$0.642\,\mathrm K$一样：$(1500\,\mathrm g+m')\times4.184\,\mathrm{J/(g\cdot K)}\times0.642\,\mathrm K=4704\,\mathrm J$，$1500\,\mathrm g+m'\approx1751\,\mathrm g$，$m'\approx251\,\mathrm g\approx0.25\,\mathrm{kg}$（$m'$是两个相近的数之差，只有两位有效数字可信；按$4.18\,\mathrm J$算是$253\,\mathrm g$）。水的内能增加约$4029\,\mathrm J$，容器和叶轮约$675\,\mathrm J$。

    （2）不计容器和叶轮，就是认为$4704\,\mathrm J$全部使$1500\,\mathrm g$水升温$0.642\,\mathrm K$，算出 1 卡合$\frac{4704}{1500\times0.642}\,\mathrm J\approx4.88\,\mathrm J$，比$4.184\,\mathrm J$大约$17\%$。偏大：功有一部分使容器和叶轮的内能增加，却全部算在了水上，水升温所需的能量就被算多了。

    （3）让水多一些、容器和叶轮轻一些（或者用升温时内能增加得少的材料），它们分走的那一份就小；也可以先单独量出水当量，再像（1）那样扣掉。例如往空的容器里倒进质量、温度都已知的热水，等到热平衡时看水温降了多少：容器隔热，热水放出的热量全部使容器和叶轮升温，由此求出水当量。还要注意重物落地前是不是真的匀速、绳和滑轮的摩擦有多大，这些都会让按$mgh$算出的功和真正搅水的功不一样。

- id: p7
  tier: thinking
  statement: |
    一根电阻丝外面包着绝缘层，浸在隔热容器的水里，两头的导线引出容器、接到电源上。通电一段时间，水变热了。

    （1）只把水当作系统，水的内能是靠做功还是靠传热增加的？

    （2）把电阻丝和水合起来当作系统，又是哪一种？

    （3）同一件事，两种说法能都对吗？判断是做功还是传热之前，要先定下什么？
  hints:
    - |
      本节的热量是因为什么而转移的能量？做功又靠什么？通电时电阻丝的温度和水比怎样？电流有没有流过水？
    - |
      （1）电阻丝通电后比水热，它和水之间有温度差，电流并不流过水，也没有什么推着水移动。（2）把电阻丝划进系统，越过系统边界的是导线里的电流：电源通过电场推着电荷移动，在系统里做功；电阻丝和水之间的传热成了系统内部的事。（3）比一比两种划法里，能量是以哪种方式越过系统边界的。
    - |
      （1）是传热。通电后电阻丝比水热，能量因为温度差从电阻丝转到水里；电流不流过水，没有力推着水移动，外界对水不做功。水吸收热量，内能增加。

      （2）是做功。越过系统边界的是导线里的电流，电源通过电场推着电荷在电阻丝里移动，对系统做功，本节说绝热壁挡不住的「通电」就是这种做功。容器隔热，这是绝热过程，系统内能的增加等于外界做的功；电阻丝和水之间的传热是系统内部的事，不改变系统的内能。

      （3）两种说法都对。做功还是传热，说的是能量怎样越过系统的边界，所以先要定下系统包括哪些东西；边界一变，说法就可能跟着变。电磁学里的焦耳热（Joule heating）也是这样：电场对电阻丝做功，使它的内能增加，电阻丝再把热量传给周围（见[电流与欧姆定律](lesson:physics.electromagnetism.current-density#thm-joule)）。
  reference: |
    （1）是传热。通电后电阻丝的温度比水高，能量因为温度差从电阻丝转到水里；电阻丝包着绝缘层，电流不流过水，也没有力推着水移动，外界对水不做功。所以水的内能是靠吸收热量增加的。

    （2）是做功。越过系统边界的是导线里的电流：电源通过电场推着电荷在电阻丝里移动，对系统做功，本节绝热壁那一段把「通电」列为做功的办法，说的就是这种情形。容器隔热，系统经历的是绝热过程，内能的增加等于外界做的功，也就是电源输送的电能；电阻丝和水之间的传热成了系统内部的事，只把内能从电阻丝转到水里，不改变系统的总内能。

    （3）两种说法都对，并不矛盾。做功还是传热，说的是能量怎样越过系统的边界，所以先要定下系统包括哪些东西；边界一变，说法就可能跟着变，内能增加多少却是同一笔账。电磁学里的焦耳热也是这样：电场对电阻丝做功，使电阻丝的内能增加，电阻丝再把热量传给周围（见电流与欧姆定律一节的焦耳热定理）。

- id: p8
  tier: thinking
  statement: |
    在通常的大气压下，隔热容器里是$0\,^\circ\mathrm C$的冰水混合物，用叶轮不停地搅拌，冰慢慢化成水；冰化完之前，温度一直是$0\,^\circ\mathrm C$。

    （1）冰化完之前，冰水混合物的内能变了没有？怎样由本节的定义说明？

    （2）温度没变，增加的能量到了哪里？从分子看，冰化成水时什么变了？

    （3）内能和温度是一回事吗？只知道冰水混合物的温度，能定下它的内能吗？
  hints:
    - |
      容器隔热，搅拌时外界在做功。按内能的定义，外界做的功和内能有什么关系？
    - |
      （1）外界做的功等于内能的增加，叶轮推着水转，做的是正功。（2）本节说内能从分子看包括哪几部分？温度不变，哪一部分没变，哪一部分变了？（3）同样是$0\,^\circ\mathrm C$，冰多一些和冰少一些的冰水混合物，内能一样吗？
    - |
      （1）变了，增加了。容器隔热，搅拌是绝热过程，外界做的功等于内能的增加；叶轮一直推着水转，外界做正功，所以内能一直在增加，尽管温度一直是$0\,^\circ\mathrm C$。

      （2）温度不变，分子无规则运动的平均动能（平动、转动都算）也不变（见[能量均分定理](lesson:physics.thermal-physics.equipartition)）。增加的是分子之间的势能：冰里的水分子靠分子之间的吸引排成规则的晶体（crystal），化成水时这种排列被打乱，分子之间的势能升高。外界做的功就存成了这部分势能。

      （3）不是一回事。温度说的是冷热，决定两个物体接触时热量往哪边传；内能是系统的能量，由状态决定，可这里的状态不只由温度决定。同样多的冰水混合物都是$0\,^\circ\mathrm C$，冰化得越多，内能越大，所以只知道温度定不下内能，还要知道冰化了多少。
  reference: |
    （1）变了，增加了。容器隔热，搅拌是绝热过程，按内能的定义，外界做的功等于内能的增加；叶轮一直推着水转，外界做正功，所以冰水混合物的内能一直在增加，尽管温度一直是$0\,^\circ\mathrm C$。

    （2）温度不变，分子无规则运动的平均动能（平动、转动都算）也不变（能量均分定理）。增加的是分子之间的势能：冰里的水分子靠分子之间的吸引排成规则的晶体，化成水时这种排列被打乱，分子之间的势能升高。外界做的功就存成了这部分势能；冰化完以后再搅拌，温度才开始升高。

    （3）不是一回事。温度说的是冷热，决定两个物体接触时热量往哪边传，和多少无关；内能是系统的能量，由状态决定，和物质的多少有关，这里的状态也不只由温度决定。同样多的冰水混合物都是$0\,^\circ\mathrm C$，冰化得越多，内能越大，所以只知道温度定不下内能，还要知道冰化了多少（也可以用体积来定，冰化成水时体积变小）。
