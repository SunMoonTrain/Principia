<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" font-size="14">
  <!-- T = 0.9 Tc 的等温线，按比例。横轴是体积 V，纵轴是压强 p（纵轴不从零起）。粗线是最后到达平衡时的等温线：液体一段、A 到 E 的水平段、气体一段。蓝线是范德瓦耳斯等温线在 A、E 之间、被水平段换掉的部分：A 到最低点 B 是过热液体（名字用细线引到蓝线上），B 到最高点 D（虚线）不稳定，D 到 E 是过冷蒸气。水平线和等温线围成的两块涂浅蓝，面积相等。 -->

  <!-- 两块面积 -->
  <path d="M 173.1 136.5 L 175.3 165.4 L 177.4 188.3 L 179.5 206.3 L 181.7 220.3 L 183.8 230.9 L 185.9 238.6 L 188.0 244.1 L 190.2 247.6 L 192.3 249.5 L 194.4 250.1 L 197.9 248.8 L 201.3 245.4 L 204.8 240.6 L 208.2 234.7 L 211.6 228.2 L 215.1 221.2 L 218.5 214.0 L 222.0 206.8 L 225.4 199.6 L 228.8 192.5 L 232.3 185.6 L 235.7 179.0 L 239.2 172.6 L 242.6 166.5 L 246.0 160.7 L 249.5 155.3 L 252.9 150.1 L 256.4 145.3 L 259.8 140.7 L 263.2 136.5 Z" style="fill: var(--accent, #2563eb); fill-opacity: 0.16" />
  <path d="M 263.2 136.5 L 267.7 131.4 L 272.3 126.7 L 276.8 122.6 L 281.3 118.8 L 285.8 115.4 L 290.3 112.4 L 294.8 109.8 L 299.3 107.5 L 303.8 105.4 L 308.3 103.7 L 312.8 102.3 L 317.3 101.0 L 321.8 100.1 L 326.3 99.3 L 330.8 98.7 L 335.3 98.3 L 339.8 98.1 L 344.3 98.0 L 349.0 98.1 L 353.8 98.3 L 358.5 98.7 L 363.2 99.1 L 368.0 99.7 L 372.7 100.4 L 377.5 101.2 L 382.2 102.1 L 387.0 103.1 L 391.7 104.1 L 396.4 105.2 L 401.2 106.4 L 405.9 107.6 L 410.7 108.9 L 415.4 110.2 L 420.2 111.6 L 424.9 113.0 L 429.6 114.4 L 434.4 115.9 L 439.1 117.4 L 443.9 118.9 L 448.6 120.4 L 453.4 122.0 L 458.1 123.6 L 462.8 125.2 L 467.6 126.7 L 472.3 128.4 L 477.1 130.0 L 481.8 131.6 L 486.6 133.2 L 491.3 134.9 L 496.0 136.5 Z" style="fill: var(--accent, #2563eb); fill-opacity: 0.16" />

  <!-- 坐标轴 -->
  <line x1="80" y1="280" x2="606" y2="280" style="stroke: currentColor" stroke-width="1.4" />
  <path d="M 618 280 L 606 275 L 606 285 Z" style="fill: currentColor" />
  <line x1="80" y1="280" x2="80" y2="32" style="stroke: currentColor" stroke-width="1.4" />
  <path d="M 80 20 L 75 32 L 85 32 Z" style="fill: currentColor" />
  <text x="612" y="302" fill="currentColor" text-anchor="middle" font-style="italic">V</text>
  <text x="94" y="28" fill="currentColor" font-style="italic">p</text>

  <!-- 辅助线：共存的压强，两相的体积 -->
  <line x1="80" y1="136.5" x2="173.1" y2="136.5" style="stroke: currentColor" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="173.1" y1="136.5" x2="173.1" y2="280" style="stroke: currentColor" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="496" y1="136.5" x2="496" y2="280" style="stroke: currentColor" stroke-width="1" stroke-dasharray="4 4" />
  <text x="72" y="141" fill="currentColor" text-anchor="end"><tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="10">饱</tspan></text>
  <text x="173" y="300" fill="currentColor" text-anchor="middle"><tspan font-style="italic">V</tspan><tspan baseline-shift="sub" font-size="10">液</tspan></text>
  <text x="496" y="300" fill="currentColor" text-anchor="middle"><tspan font-style="italic">V</tspan><tspan baseline-shift="sub" font-size="10">气</tspan></text>

  <!-- 范德瓦耳斯等温线在 A、E 之间的部分 -->
  <path d="M 173.1 136.5 L 175.3 165.4 L 177.4 188.3 L 179.5 206.3 L 181.7 220.3 L 183.8 230.9 L 185.9 238.6 L 188.0 244.1 L 190.2 247.6 L 192.3 249.5 L 194.4 250.1" fill="none" style="stroke: var(--accent, #2563eb)" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 194.4 250.1 L 199.1 247.8 L 203.8 242.1 L 208.5 234.2 L 213.2 225.1 L 217.9 215.4 L 222.5 205.6 L 227.2 195.8 L 231.9 186.4 L 236.6 177.4 L 241.3 168.8 L 245.9 160.9 L 250.6 153.5 L 255.3 146.7 L 260.0 140.5 L 264.7 134.8 L 269.4 129.7 L 274.0 125.0 L 278.7 120.9 L 283.4 117.1 L 288.1 113.8 L 292.8 110.9 L 297.5 108.3 L 302.1 106.1 L 306.8 104.2 L 311.5 102.6 L 316.2 101.3 L 320.9 100.2 L 325.5 99.4 L 330.2 98.8 L 334.9 98.3 L 339.6 98.1 L 344.3 98.0" fill="none" style="stroke: var(--accent, #2563eb)" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="6 4" />
  <path d="M 344.3 98.0 L 349.0 98.1 L 353.8 98.3 L 358.5 98.7 L 363.2 99.1 L 368.0 99.7 L 372.7 100.4 L 377.5 101.2 L 382.2 102.1 L 387.0 103.1 L 391.7 104.1 L 396.4 105.2 L 401.2 106.4 L 405.9 107.6 L 410.7 108.9 L 415.4 110.2 L 420.2 111.6 L 424.9 113.0 L 429.6 114.4 L 434.4 115.9 L 439.1 117.4 L 443.9 118.9 L 448.6 120.4 L 453.4 122.0 L 458.1 123.6 L 462.8 125.2 L 467.6 126.7 L 472.3 128.4 L 477.1 130.0 L 481.8 131.6 L 486.6 133.2 L 491.3 134.9 L 496.0 136.5" fill="none" style="stroke: var(--accent, #2563eb)" stroke-width="2.2" stroke-linejoin="round" />

  <!-- 最后到达平衡时的等温线 -->
  <path d="M 167.8 30.0 L 168.4 43.4 L 168.9 56.1 L 169.4 68.1 L 169.9 79.5 L 170.5 90.4 L 171.0 100.6 L 171.5 110.3 L 172.1 119.5 L 172.6 128.3 L 173.1 136.5 L 496.0 136.5 L 502.4 138.7 L 508.8 140.9 L 515.2 143.1 L 521.5 145.3 L 527.9 147.5 L 534.3 149.7 L 540.6 151.9 L 547.0 154.0 L 553.4 156.2 L 559.8 158.3 L 566.1 160.4 L 572.5 162.5 L 578.9 164.6 L 585.3 166.7 L 591.6 168.8 L 598.0 170.8" fill="none" style="stroke: currentColor" stroke-width="3" stroke-linejoin="round" />

  <!-- 五个点 -->
  <circle cx="173.1" cy="136.5" r="4" style="fill: currentColor" />
  <circle cx="194.4" cy="250.1" r="3.4" style="fill: currentColor" />
  <circle cx="263.2" cy="136.5" r="3.4" style="fill: currentColor" />
  <circle cx="344.3" cy="98" r="3.4" style="fill: currentColor" />
  <circle cx="496" cy="136.5" r="4" style="fill: currentColor" />
  <text x="183" y="128" fill="currentColor">A</text>
  <text x="195" y="271" fill="currentColor" text-anchor="middle">B</text>
  <text x="250" y="128" fill="currentColor" text-anchor="middle">C</text>
  <text x="344" y="86" fill="currentColor" text-anchor="middle">D</text>
  <text x="504" y="127" fill="currentColor">E</text>

  <!-- 各段的名字 -->
  <text x="160" y="80" fill="currentColor" text-anchor="end">液体</text>
  <text x="150" y="190" fill="currentColor" text-anchor="end">过热液体</text>
  <line x1="155" y1="190" x2="180.8" y2="215" style="stroke: currentColor" stroke-width="1" />
  <text x="236" y="216" fill="currentColor">不稳定</text>
  <text x="440" y="96" fill="currentColor" text-anchor="middle">过冷蒸气</text>
  <text x="400" y="160" fill="currentColor" text-anchor="middle">气液共存</text>
  <text x="572" y="146" fill="currentColor" text-anchor="middle">气体</text>
</svg>
