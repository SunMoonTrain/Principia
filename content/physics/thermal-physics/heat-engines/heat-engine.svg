<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-size="14">
  <!-- 左：热机。上方高温热库 T_H，下方低温热库 T_L，中间圆圈是热机；蓝色箭头 Q_H 从高温热库流进热机，绿色箭头 W 向右流出（对外做的功），蓝色箭头 Q_L 流进低温热库。右：制冷机，三个箭头都反过来：Q_L 从低温热库流进制冷机，外界做的功 |W| 从右边流进来，Q_H 流进高温热库。箭头宽度按能量的比例画，Q_H : W : Q_L = 5 : 2 : 3。 -->
  <line x1="320" y1="8" x2="320" y2="292" style="stroke: currentColor" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 3" />

  <!-- 左：热机 -->
  <rect x="40" y="16" width="180" height="44" style="fill: currentColor; stroke: currentColor" fill-opacity="0.08" stroke-width="1.2" />
  <text x="130" y="43" fill="currentColor" text-anchor="middle">高温热库 <tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="10">H</tspan></text>
  <rect x="40" y="240" width="180" height="44" style="fill: currentColor; stroke: currentColor" fill-opacity="0.08" stroke-width="1.2" />
  <text x="130" y="267" fill="currentColor" text-anchor="middle">低温热库 <tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="10">L</tspan></text>
  <path d="M 115 60 H 145 V 92 H 154 L 130 110 L 106 92 H 115 Z" style="fill: var(--accent, #2563eb)" fill-opacity="0.85" />
  <path d="M 121 188.97 A 40 40 0 0 0 139 188.97 V 222 H 146 L 130 240 L 114 222 H 121 Z" style="fill: var(--accent, #2563eb)" fill-opacity="0.85" />
  <path d="M 169.55 144 H 252 V 136 L 272 150 L 252 164 V 156 H 169.55 A 40 40 0 0 0 169.55 144 Z" style="fill: var(--good, #059669)" fill-opacity="0.85" />
  <circle cx="130" cy="150" r="40" fill="none" style="stroke: currentColor" stroke-width="1.6" />
  <text x="130" y="155" fill="currentColor" text-anchor="middle">热机</text>
  <text x="162" y="90" fill="currentColor"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="10">H</tspan></text>
  <text x="154" y="220" fill="currentColor"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="10">L</tspan></text>
  <text x="212" y="128" fill="currentColor" text-anchor="middle" font-style="italic">W</text>

  <!-- 右：制冷机 -->
  <rect x="360" y="16" width="180" height="44" style="fill: currentColor; stroke: currentColor" fill-opacity="0.08" stroke-width="1.2" />
  <text x="450" y="43" fill="currentColor" text-anchor="middle">高温热库 <tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="10">H</tspan></text>
  <rect x="360" y="240" width="180" height="44" style="fill: currentColor; stroke: currentColor" fill-opacity="0.08" stroke-width="1.2" />
  <text x="450" y="267" fill="currentColor" text-anchor="middle">低温热库 <tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="10">L</tspan></text>
  <path d="M 435 112.92 V 78 H 426 L 450 60 L 474 78 H 465 V 112.92 A 40 40 0 0 0 435 112.92 Z" style="fill: var(--accent, #2563eb)" fill-opacity="0.85" />
  <path d="M 441 240 V 208 H 434 L 450 190 L 466 208 H 459 V 240 Z" style="fill: var(--accent, #2563eb)" fill-opacity="0.85" />
  <path d="M 600 144 H 510 V 136 L 490 150 L 510 164 V 156 H 600 Z" style="fill: var(--good, #059669)" fill-opacity="0.85" />
  <circle cx="450" cy="150" r="40" fill="none" style="stroke: currentColor" stroke-width="1.6" />
  <text x="450" y="155" fill="currentColor" text-anchor="middle">制冷机</text>
  <text x="482" y="98" fill="currentColor"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="10">H</tspan></text>
  <text x="474" y="230" fill="currentColor"><tspan font-style="italic">Q</tspan><tspan baseline-shift="sub" font-size="10">L</tspan></text>
  <text x="556" y="128" fill="currentColor" text-anchor="middle">|<tspan font-style="italic">W</tspan>|</text>
</svg>
