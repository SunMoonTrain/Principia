  <line x1="90" y1="140" x2="328" y2="140" style="stroke: currentColor" stroke-width="1" stroke-dasharray="5 4" />
  <path d="M 338 140 L 328 135.5 L 328 144.5 Z" style="fill: currentColor" />
  <ellipse cx="90" cy="140" rx="12" ry="34" style="fill: var(--good, #059669); stroke: var(--good, #059669)" fill-opacity="0.22" stroke-width="1.6" />
  <circle cx="90" cy="140" r="17" style="fill: var(--good, #059669); stroke: var(--good, #059669)" fill-opacity="0.35" stroke-width="1.4" />
  <circle cx="90" cy="140" r="2.5" style="fill: currentColor" />
  <line x1="90" y1="140" x2="90" y2="106" style="stroke: currentColor" stroke-width="1.4" />
  <text x="72" y="126" fill="currentColor" text-anchor="end" font-style="italic">d</text>
  <circle cx="155" cy="124" r="17" style="fill: var(--accent, #2563eb); stroke: var(--accent, #2563eb)" fill-opacity="0.4" stroke-width="1.4" />
  <circle cx="155" cy="124" r="2.5" style="fill: currentColor" />
  <circle cx="228" cy="158" r="17" style="fill: var(--accent, #2563eb); stroke: var(--accent, #2563eb)" fill-opacity="0.4" stroke-width="1.4" />
  <circle cx="228" cy="158" r="2.5" style="fill: currentColor" />
  <circle cx="288" cy="134" r="17" style="fill: var(--accent, #2563eb); stroke: var(--accent, #2563eb)" fill-opacity="0.4" stroke-width="1.4" />
  <circle cx="288" cy="134" r="2.5" style="fill: currentColor" />
  <circle cx="212" cy="94" r="17" style="stroke: currentColor" fill="none" stroke-width="1.4" />
  <circle cx="212" cy="94" r="2.5" style="fill: currentColor" />
