  <circle cx="262" cy="186" r="2.5" style="fill: currentColor" />
  <text x="152" y="94" fill="currentColor" text-anchor="middle">会撞上</text>
  <text x="236" y="88" fill="currentColor">撞不上</text>
  <text x="92" y="204" fill="currentColor" text-anchor="middle">截面 <tspan font-style="italic">σ</tspan> = π<tspan font-style="italic">d</tspan><tspan dy="-6" font-size="10">2</tspan></text>
