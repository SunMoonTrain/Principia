<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-size="14">
  <!-- 左：先假定别的分子不动，盯住的分子（绿色）沿虚线向右飞，以有效直径 d 为半径的碰撞截面（左端绿色的椭圆）随它扫出一个长 vΔt 的圆柱。中心落在圆柱里的三个分子（蓝色）会被撞上；中心在圆柱外的两个分子是空心的，撞不上，哪怕身子有一部分伸进了圆柱。右：盯住的分子在别的分子之间走出的绿色折线，每一段直线是一段自由程；盯住的分子和别的分子一样画成半径 9 的圆（即这幅图里 d = 18），起点画成实心的绿圆，每个拐弯处画一个淡绿色的圆，是它撞上时的位置，和被撞的分子相切，两个中心相距 d。被撞的三个分子的圆心在拐弯处沿法线离开 18 的地方。示意图，不按比例。 -->
  <text x="190" y="26" fill="currentColor" text-anchor="middle">碰撞截面扫出的圆柱</text>
  <rect x="90" y="106" width="220" height="68" style="fill: var(--good, #059669)" fill-opacity="0.08" />
  <line x1="90" y1="106" x2="310" y2="106" style="stroke: currentColor" stroke-width="1.2" />
  <line x1="90" y1="174" x2="310" y2="174" style="stroke: currentColor" stroke-width="1.2" />
