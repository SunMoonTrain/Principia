- id: p1
  tier: easy
  statement: |
    一块薄透镜对 d 线的焦距是$200\,\mathrm{mm}$，玻璃的阿贝数是$60$。它对 C 线和 F 线的焦距大约相差多少？以$\mathrm{mm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 200/60
    unit: |
      $\mathrm{mm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      单透镜的色差$f_{\mathrm C}-f_{\mathrm F}\approx\frac fV$。
    - |
      $\frac{200}{60}\,\mathrm{mm}$。
    - |
      约$3.33\,\mathrm{mm}$。
  solution: |
    $f_{\mathrm C}-f_{\mathrm F}\approx\frac fV=\frac{200}{60}\,\mathrm{mm}\approx3.33\,\mathrm{mm}$，红光（C 线）的焦距更长。焦距越长、阿贝数越小，色差越大。

- id: p2
  tier: easy
  statement: |
    下面关于像差的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        只要镜面磨得足够精确，球面镜就没有球差
      - |
        把凸透镜换成同样焦距的凹面反射镜，色差和球差都消失了
      - |
        把光阑缩小，只让离光轴近的光通过，可以减小球差
      - |
        单块玻璃凸透镜的蓝光焦点比红光焦点离透镜近
      - |
        会聚的消色差双透镜里，发散透镜要用阿贝数较小的玻璃
    value: [3, 4, 5]
  hints:
    - |
      球差随光线高度的平方增大；玻璃对蓝光的折射率比红光大。
    - |
      消色差的条件$\frac{\Phi_1}{V_1}+\frac{\Phi_2}{V_2}=0$，发散透镜的光焦度要小、色差要大。
    - |
      C、D、E 对；A、B 错。
  solution: |
    C 对：球差约正比于$h^2$，光阑把$h$大的光线挡掉。D 对：蓝光折射率大，$\frac1f=(n-1)K$大，焦距短。E 对：发散透镜的光焦度比会聚透镜小，却要抵消同样多的色差，色散要大，阿贝数要小。

    A 错：球差来自球面的形状，磨得再准也有，要消除轴上的球差得做成抛物面。B 错：反射镜没有色差，但球面反射镜仍有球差。

- id: p3
  tier: medium
  statement: |
    一面凹面镜的焦距是$0.50\,\mathrm m$。平行于光轴、离光轴$5.0\,\mathrm{cm}$的光线反射后，和光轴的交点比焦点靠近镜面多少？按近似式$\frac{h^2}{8f}$计算，以$\mathrm{mm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 0.050^2/(8*0.50)*1000
    unit: |
      $\mathrm{mm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      交点比焦点靠近镜面约$\frac{h^2}{4R}=\frac{h^2}{8f}$。
    - |
      $h=0.050\,\mathrm m$，$f=0.50\,\mathrm m$。
    - |
      $\frac{0.0025}{4.0}\,\mathrm m=6.25\times10^{-4}\,\mathrm m\approx0.625\,\mathrm{mm}$。
  solution: |
    $\frac{h^2}{8f}=\frac{0.050^2}{8\times0.50}\,\mathrm m=6.25\times10^{-4}\,\mathrm m\approx0.625\,\mathrm{mm}$。$\frac hR=0.05$很小，近似式和精确的式子相差约$0.2\%$。

- id: p4
  tier: medium
  statement: |
    用阿贝数$64.2$的冕牌玻璃和阿贝数$36.4$的火石玻璃，做一块焦距$200\,\mathrm{mm}$的消色差双透镜，两块透镜贴在一起。冕牌玻璃那块透镜的焦距是多少？以$\mathrm{mm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 200*(64.2 - 36.4)/64.2
    unit: |
      $\mathrm{mm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      $\Phi_1=\frac{V_1}{V_1-V_2}\Phi$，$\Phi=\frac1f$。
    - |
      $f_1=\frac{V_1-V_2}{V_1}f$。
    - |
      $f_1=\frac{27.8}{64.2}\times200\,\mathrm{mm}\approx86.6\,\mathrm{mm}$。
  solution: |
    $\Phi_1=\frac{V_1}{V_1-V_2}\Phi$，所以$f_1=\frac{V_1-V_2}{V_1}f=\frac{64.2-36.4}{64.2}\times200\,\mathrm{mm}\approx86.6\,\mathrm{mm}$。火石玻璃那块$f_2=-\frac{V_1-V_2}{V_2}f\approx-153\,\mathrm{mm}$，是发散透镜。

- id: p5
  tier: hard
  statement: |
    （1）证明用阿贝数为$V$的玻璃做的薄透镜，C 线和 F 线的焦距之差约为$\frac fV$，$f$是对 d 线的焦距。（2）两块薄透镜贴在一起，证明消色差的条件是$\frac{\Phi_1}{V_1}+\frac{\Phi_2}{V_2}=0$，并说明为什么两块透镜不能用同一种玻璃。
  hints:
    - |
      磨镜者公式$\frac1f=(n-1)K$，$K$只和两面的半径有关。
    - |
      $\frac1{f_{\mathrm F}}-\frac1{f_{\mathrm C}}=(n_{\mathrm F}-n_{\mathrm C})K$，再用$K=\frac{1}{(n_{\mathrm d}-1)f}$。
    - |
      同一种玻璃$V_1=V_2$，条件变成$\Phi_1+\Phi_2=0$。
  reference: |
    （1）$\frac1{f_{\mathrm F}}-\frac1{f_{\mathrm C}}=(n_{\mathrm F}-n_{\mathrm C})K=\frac{n_{\mathrm F}-n_{\mathrm C}}{n_{\mathrm d}-1}\cdot\frac1f=\frac1{Vf}$。左边$=\frac{f_{\mathrm C}-f_{\mathrm F}}{f_{\mathrm C}f_{\mathrm F}}\approx\frac{f_{\mathrm C}-f_{\mathrm F}}{f^2}$（三个焦距相差很小），所以$f_{\mathrm C}-f_{\mathrm F}\approx\frac fV$。

    （2）第$i$块透镜的光焦度$\Phi_i=(n_i-1)K_i$，从 C 线到 F 线变化$(n_{\mathrm F}-n_{\mathrm C})_iK_i=\frac{\Phi_i}{V_i}$。贴在一起的光焦度相加，总光焦度的变化是$\frac{\Phi_1}{V_1}+\frac{\Phi_2}{V_2}$，C、F 两线的焦距相同就要它为零。用同一种玻璃时$V_1=V_2$，条件变成$\Phi_1+\Phi_2=0$，总光焦度也是零，成了一块平板，没有用；所以必须用色散不同的两种玻璃。

- id: p6
  tier: hard
  statement: |
    半径为$R$的凹面镜，平行于光轴、高为$h$的光线反射后和光轴的交点比焦点靠近镜面约$\frac{h^2}{4R}$。（1）这条光线在近轴焦点所在的、垂直于光轴的平面上，离光轴多远？（2）光阑的半径减半，焦平面上光斑的大小变成原来的几分之一？（3）为什么说缩小光阑对减小球差特别有效？
  hints:
    - |
      反射光线和光轴的夹角约为$2\theta\approx\frac{2h}R$，它在交点处穿过光轴。
    - |
      交点离焦点约$\frac{h^2}{4R}$，再走这段距离，光线离开光轴约$\frac{h^2}{4R}\cdot\frac{2h}{R}$。
    - |
      光斑的半径正比于$h^3$。
  reference: |
    （1）反射光线和光轴的夹角是$2\theta$，$\theta\approx\frac hR$。它在离焦点约$\frac{h^2}{4R}$处穿过光轴，到达焦平面时离光轴约$\frac{h^2}{4R}\tan2\theta\approx\frac{h^2}{4R}\cdot\frac{2h}R=\frac{h^3}{2R^2}$。

    （2）光阑以内最外面的光线决定光斑的大小，光斑半径正比于$h^3$。光阑的半径减半，光斑半径变成原来的$\frac18$。

    （3）进来的光正比于光阑的面积，即$h^2$，而光斑的半径正比于$h^3$：光阑缩小一半，光只少到$\frac14$，光斑却缩到$\frac18$，像的清晰程度提高得比亮度损失快。代价是曝光时间要加长；光阑太小时，光的衍射又会让像变模糊（见[单缝衍射](lesson:physics.optics.single-slit-diffraction)）。

- id: p7
  tier: thinking
  statement: |
    哈勃空间望远镜的主镜直径约$2.4\,\mathrm m$，制造时边缘磨平了约$2\,\mu\mathrm m$。（1）这么小的误差，为什么能让像明显变模糊？（2）为什么后来不用换主镜，加一套校正光学就能补救？（3）地面上的大望远镜为什么更不容易出这种问题？
  hints:
    - |
      比较误差和可见光的波长；光被反射时，镜面高出或低下一点，光走过的路程变化是它的两倍。
    - |
      误差的形状是知道的，而且绕光轴对称。
    - |
      地面上的望远镜装好以后可以随时检测、修正。
  reference: |
    （1）可见光的波长约$0.4$到$0.7\,\mu\mathrm m$。镜面边缘低了约$2\,\mu\mathrm m$，反射光来回各走一遍，路程差约$4\,\mu\mathrm m$，是波长的好几倍：边缘反射的光和中间反射的光会聚不到同一点，正是球差。对要分辨极小细节的望远镜，这已经远远超出了允许的范围。

    （2）误差来自检验仪器的一个确定的错误，主镜的形状仍然是规则的、绕光轴对称的，只是不对。只要算出它带来多大的球差，就能设计一组镜子，故意引入大小相等、方向相反的球差，把光重新会聚好。这和用组合透镜消除像差是同一个思路。

    （3）地面上的望远镜装好以后，可以反复检测成像、更换或调整镜面，许多大望远镜还用可以变形的镜面实时修正；哈勃在太空里，只能等宇航员上去维修，所以误差没有在地面检验出来，代价就很大。

- id: p8
  tier: thinking
  statement: |
    （1）照相机的好镜头往往由十几片透镜组成，为什么不用一片设计得好的透镜代替？（2）度数很高的近视眼镜，从镜片边缘看东西会看到彩边，为什么？（3）为什么说「没有一片单透镜能同时消除球差和色差」？
  hints:
    - |
      一片透镜只有两个面的形状和一种玻璃可以选。
    - |
      镜片的边缘相当于一块薄棱镜，度数越高，边缘越厚、偏折越多。
    - |
      单透镜的色差只由焦距和阿贝数决定。
  reference: |
    （1）一片透镜能调的只有两个面的半径和玻璃，球差、色差、彗差、像散、场曲、畸变要同时控制，参数远远不够。多片透镜有许多个面、几种玻璃、可以选的间隔和光阑位置，才能让各种像差互相抵消到很小。

    （2）高度数的镜片边缘很厚，相当于一块偏向角较大的薄棱镜，从边缘看出去的光被偏折得多；偏折得越多，不同颜色分得越开（色散），所以出现彩边。中间部分近乎平板，偏折小，就看不出来。

    （3）由$f_{\mathrm C}-f_{\mathrm F}\approx\frac fV$，单透镜的色差只由焦距和玻璃决定，改变两面的形状只能改变球差，改不了色差；要消色差，必须用两种色散不同的玻璃。
