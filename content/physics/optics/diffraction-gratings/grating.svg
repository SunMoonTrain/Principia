<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 390" width="660" height="390" font-size="14">
  <!-- 光栅方程：平行光垂直照到光栅上，相邻两条缝相距 d（光栅常量），看各缝沿偏离原方向 θ 射向远处同一点的光。过最上面一条缝作和光线垂直的直线，从这条直线往后各条光线的路程相同；相邻两条缝的光程差都是 d sinθ，它等于波长的整数倍时，所有缝的光同相，相互加强，是主极大。 -->
