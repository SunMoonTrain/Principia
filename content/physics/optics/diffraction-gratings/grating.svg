  <line x1="230.0" y1="295.0" x2="230.0" y2="335.0" style="stroke: currentColor" stroke-width="5.0" />
  <line x1="230.0" y1="345.0" x2="230.0" y2="370.0" style="stroke: currentColor" stroke-width="5.0" />
  <line x1="30.0" y1="165.0" x2="132.8" y2="165.0" style="stroke: var(--muted, #6b7280)" stroke-width="1.4" />
