  <line x1="230.0" y1="190.0" x2="411.9" y2="85.0" style="stroke: var(--good, #059669)" stroke-width="1.4" />
  <line x1="230.0" y1="240.0" x2="411.9" y2="135.0" style="stroke: var(--muted, #6b7280)" stroke-width="1.4" />
