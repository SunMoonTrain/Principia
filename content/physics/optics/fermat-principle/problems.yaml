- id: p1
  tier: easy
  statement: |
    一束光垂直穿过一块厚$3.0\,\mathrm{cm}$、折射率$1.50$的玻璃板，接着又穿过$2.0\,\mathrm{cm}$厚、折射率$1.33$的水层。这两段的光程一共是多少？以$\mathrm{cm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 1.50*3.0 + 1.33*2.0
    unit: |
      $\mathrm{cm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      光程是折射率乘几何路程，几段相加。
    - |
      $1.50\times3.0+1.33\times2.0$。
    - |
      $4.50+2.66=7.16\,\mathrm{cm}$。
  solution: |
    光程$=1.50\times3.0\,\mathrm{cm}+1.33\times2.0\,\mathrm{cm}=4.50\,\mathrm{cm}+2.66\,\mathrm{cm}=7.16\,\mathrm{cm}$。光走这$5.0\,\mathrm{cm}$用的时间，和在真空中走$7.16\,\mathrm{cm}$一样多。

- id: p2
  tier: easy
  statement: |
    下面关于光程和费马原理的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        光程等于同样时间里光在真空中走过的路程
      - |
        在均匀介质里，两点之间光程最小的路径是直线
      - |
        按费马原理，光实际走的路径总是光程最小的
      - |
        按费马原理，光从$B$射向$A$时，会沿着光从$A$射向$B$的那条路径反向走回去
      - |
        光程只和几何路程有关，和介质的折射率无关
    value: [1, 2, 4]
  hints:
    - |
      光程$ns=c\cdot\frac sv$。
    - |
      费马原理要求光程取极值，不一定是最小值；同一条路径反着走，光程不变。
    - |
      A、B、D 对；C、E 错。
  solution: |
    A 对：$ns=c\cdot\frac{s}{v}$，正是光在这段时间里在真空中走的路程。B 对：折射率处处相同，光程正比于几何路程，直线最短。D 对：同一条路径正着走、反着走，光程一样，所以从$A$到$B$光程取极值的路径，从$B$到$A$也取极值，这就是光路可逆（principle of reversibility）。

    C 错：费马原理只要求光程取极值，凹面镜里的光路可以是极大值（第 6 题）。E 错：光程是折射率乘几何路程。

- id: p3
  tier: medium
  statement: |
    救生员在沙滩上跑的速度是$6.0\,\mathrm{m/s}$，在水里游的速度是$1.5\,\mathrm{m/s}$，要用最短的时间赶到水里的落水者身边。用时最短的路线在沙滩上和岸线的垂线成$50^\circ$，在水里这段路和岸线的垂线成多少度？保留三位有效数字。
  answer:
    type: number
    value: asin(sin(50*pi/180)*1.5/6.0)*180/pi
    unit: |
      $^\circ$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      用时$\frac{s_1}{v_1}+\frac{s_2}{v_2}$，和光程的式子一样，只是把$n$换成$\frac1v$。
    - |
      用时最短时$\frac{\sin\theta_1}{v_1}=\frac{\sin\theta_2}{v_2}$。
    - |
      $\sin\theta_2=\frac{1.5}{6.0}\sin50^\circ\approx0.192$，$\theta_2\approx11.0^\circ$。
  solution: |
    用时$t=\frac{s_1}{v_1}+\frac{s_2}{v_2}$，和光程$n_1s_1+n_2s_2$相比只差把$n$换成$\frac1v$，所以用时最短的路线满足和折射定律一样的条件$\frac{\sin\theta_1}{v_1}=\frac{\sin\theta_2}{v_2}$。$\sin\theta_2=\frac{1.5}{6.0}\times\sin50^\circ\approx0.1915$，$\theta_2\approx11.0^\circ$。在水里慢得多，所以水里那一段几乎垂直于岸线，尽量少游。

- id: p4
  tier: medium
  statement: |
    一块薄透镜（thin lens）中心厚$4.0\,\mathrm{mm}$，边缘厚$1.0\,\mathrm{mm}$，玻璃的折射率是$1.50$。物点发出的光线经透镜会聚到像点，一条穿过透镜中心，一条穿过边缘。按物像之间各条光线光程相等，穿过边缘的那条光线在空气中走的几何路程，比穿过中心的那条多多少？以$\mathrm{mm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 1.50*(4.0 - 1.0)
    unit: |
      $\mathrm{mm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      两条光线的光程都是「空气里的路程$+1.50\times$玻璃里的路程」，两者相等。
    - |
      中心那条在玻璃里多走$4.0-1.0=3.0\,\mathrm{mm}$。
    - |
      空气里的路程要多$1.50\times3.0=4.50\,\mathrm{mm}$。
  solution: |
    设中心那条光线在空气中走$s_{\mathrm c}$，边缘那条走$s_{\mathrm e}$。光程相等：$s_{\mathrm c}+1.50\times4.0\,\mathrm{mm}=s_{\mathrm e}+1.50\times1.0\,\mathrm{mm}$，所以$s_{\mathrm e}-s_{\mathrm c}=1.50\times3.0\,\mathrm{mm}=4.50\,\mathrm{mm}$。中心的光线几何路程短，可在玻璃里慢；边缘的光线绕远，可在空气里快，两者同时到达像点。

- id: p5
  tier: hard
  statement: |
    （1）$A$、$B$两点在平面镜同一侧，离镜面分别为$a$、$b$，沿镜面方向相距$d$。把反射点的位置记作$x$（从$A$的垂足量起），写出路程$L(x)$，用求导证明$L$取最小值时入射角等于反射角。（2）说明这个驻点确实是最小值。
  hints:
    - |
      $L(x)=\sqrt{a^2+x^2}+\sqrt{b^2+(d-x)^2}$。
    - |
      $L'(x)=\frac{x}{\sqrt{a^2+x^2}}-\frac{d-x}{\sqrt{b^2+(d-x)^2}}$，两项分别是入射角和反射角的正弦。
    - |
      $\frac{\mathrm d}{\mathrm dx}\frac{x}{\sqrt{a^2+x^2}}=\frac{a^2}{(a^2+x^2)^{3/2}}>0$。
  reference: |
    （1）反射点在$x$处时，$L(x)=\sqrt{a^2+x^2}+\sqrt{b^2+(d-x)^2}$，$L'(x)=\frac{x}{\sqrt{a^2+x^2}}-\frac{d-x}{\sqrt{b^2+(d-x)^2}}$。第一项是入射光线和法线夹角$\theta_1$的正弦，第二项是反射光线和法线夹角$\theta_1'$的正弦。$L'(x)=0$即$\sin\theta_1=\sin\theta_1'$，两个角都在$0$到$90^\circ$之间，所以$\theta_1=\theta_1'$。

    （2）$L''(x)=\frac{a^2}{(a^2+x^2)^{3/2}}+\frac{b^2}{(b^2+(d-x)^2)^{3/2}}>0$，$L$是凸函数（convex function，图像处处向上弯），唯一的驻点就是最小值。也可以看两端：$x\to\pm\infty$时$L\to\infty$，唯一的驻点只能是最小值。

- id: p6
  tier: hard
  statement: |
    （1）椭圆上任意一点到两个焦点的距离之和都等于长轴$2a$。光从椭圆形镜子的一个焦点$A$发出，经镜子反射到另一个焦点$B$，说明每一个反射点给出的路程都相同。（2）把这面椭圆镜换成一面在$P$点和椭圆相切、但弯得更厉害的凹面镜（$P$附近镜面在椭圆里面），光从$A$经$P$反射到$B$，说明$APB$的路程比经过$P$附近镜面上别的点都长。（3）费马原理为什么写成「光程取极值」，而不是「光程最短」？
  hints:
    - |
      对椭圆镜，$AP+PB=2a$和$P$在哪里无关。
    - |
      镜面在椭圆里面，镜面上$P$附近的点$Q$在椭圆内，椭圆内的点到两焦点距离之和小于$2a$。
    - |
      $P$点的路程$2a$是镜面上附近各点里最大的，可它仍然满足反射定律。
  reference: |
    （1）椭圆上每一点都有$AP+PB=2a$，光从$A$经椭圆镜上任何一点反射到$B$，路程都是$2a$。椭圆在任一点的法线平分两条焦半径的夹角，所以每一点都满足反射定律，光从$A$向各个方向射出，反射后都到达$B$。

    （2）凹面镜在$P$点和椭圆相切，$P$点的法线和椭圆的相同，$A\to P\to B$满足反射定律，是一条实际光路，路程$2a$。$P$附近镜面上的其他点$Q$都在椭圆里面，椭圆内的点到两个焦点的距离之和小于$2a$，所以$AQ+QB<2a=AP+PB$：实际光路的路程是附近路径里最大的。

    （3）在（2）里，实际的光路是极大值，不是最小值；在（1）里，附近所有路径都一样长。它们的共同点是：把路径稍微改动，路程的一阶变化为零，即导数为零。所以费马原理只能写成「光程取极值」（驻点），「最短」只是最常见的情形。

- id: p7
  tier: thinking
  statement: |
    有人问：光在出发之前，怎么会「知道」哪条路的光程是极值，再选那条路走？

    （1）把光看成波，从$A$到$B$的每一条路径都带来一个波，它到$B$时的相位正比于这条路径的光程。光程取极值的路径附近，邻近路径的光程有什么特点？离它远的路径呢？（2）由此说明为什么实际看到的光好像只走那一条路。
  hints:
    - |
      函数在驻点附近变化得最慢。
    - |
      光程相差半个波长，两个波就互相抵消。
    - |
      远离驻点的路径，相邻路径的光程变化快，相位快速变化，叠加起来互相抵消。
  reference: |
    （1）光程取极值的路径附近，光程对路径的改动只有二阶变化，邻近的一大片路径光程几乎相同，到$B$时相位几乎相同。离它远的路径，光程随路径变化得快，相邻路径的光程很快就差出半个波长、一个波长，相位一会儿相同、一会儿相反。

    （2）到$B$点的光是所有路径的波叠加起来的。驻点附近那一片路径相位一致，互相加强；远处的路径相位杂乱，互相抵消。所以叠加的结果好像只有驻点附近那一束光，费马原理描述的就是这一束。光的波长很短，这一束很细，看起来就是一条光线；路径上的障碍小到和波长相当时，这个说法就不成立了（见[单缝衍射](lesson:physics.optics.single-slit-diffraction)）。

- id: p8
  tier: thinking
  statement: |
    抛物面镜能把平行于轴的光全部会聚到焦点（见[球面镜成像](lesson:physics.optics.spherical-mirrors)第 6 题）。在过轴的截面里看，抛物线上每一点到焦点的距离，等于它到准线（在镜子后面、和轴垂直的一条直线）的距离。

    （1）在镜前取一条和轴垂直的直线，用光程说明从这条直线出发、平行于轴射来、经抛物面反射到焦点的各条光线光程都相等。（2）球面镜为什么做不到这一点？（3）这和本节「物像之间光程相等」的定理是什么关系？
  hints:
    - |
      平行于轴的光线从镜前那条直线射到镜面上的$P$点，再沿原方向延长到准线，一共走过两条直线之间的距离$H$。
    - |
      $P$到焦点的距离等于$P$到准线的距离。
    - |
      球面上各点到焦点的距离和到准线的距离不再处处相等。
  reference: |
    （1）设镜前那条直线到镜后准线的距离是$H$，两者都和轴垂直。一条平行于轴的光线从镜前的直线射到抛物面上的$P$点，走过的路程是$H$减去$P$到准线的距离；反射后到焦点的路程，按抛物线的性质等于$P$到准线的距离。两段相加正好是$H$，和$P$在哪里无关，所以各条光线的光程都相等。

    （2）球面在顶点附近和抛物面几乎重合，离轴远的地方就不一样了，各点到焦点和到准线的距离不再相等，离轴远的光线光程不同，会聚不到同一点，就是球差（spherical aberration，见[像差](lesson:physics.optics.aberrations)）。

    （3）平行光可以看成来自无穷远处的物点，焦点是它的像。抛物面让「物点」和像点之间的光程处处相等，正好满足这个定理，所以成像完美；球面只在近轴时近似满足。
