- id: p1
  tier: easy
  statement: |
    水的折射率取$1.33$，空气的取$1$。光从水里射向水面，临界角是多少度？保留三位有效数字。
  answer:
    type: number
    value: asin(1/1.33)*180/pi
    unit: |
      $^\circ$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      $\sin\theta_{\mathrm c}=\frac{n_2}{n_1}$，$n_1$是光射来的那一侧。
    - |
      $\sin\theta_{\mathrm c}=\frac1{1.33}\approx0.752$。
    - |
      $\theta_{\mathrm c}\approx48.8^\circ$。
  solution: |
    $\sin\theta_{\mathrm c}=\frac{1}{1.33}\approx0.752$，$\theta_{\mathrm c}\approx48.8^\circ$。水下的光射到水面上，入射角超过$48.8^\circ$就全部反射回水里。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        光从玻璃射向水时，也可能发生全反射
      - |
        两种介质的临界角越小，光在界面上越容易发生全反射
      - |
        光从空气斜射进水里，入射角足够大时会发生全反射
      - |
        发生全反射时，反射光的能量只有入射光的一半
      - |
        光纤的纤芯和包层的折射率越接近，数值孔径越小
    value: [1, 2, 5]
  hints:
    - |
      全反射要求光从折射率较大的介质射向折射率较小的介质；$\sin\theta_{\mathrm c}=\frac{n_2}{n_1}$。
    - |
      $\mathrm{NA}=\sqrt{n_1^2-n_2^2}$。
    - |
      A、B、E 对；C、D 错。
  solution: |
    A 对：玻璃的折射率比水大，入射角超过$\arcsin\frac{n_{\text{水}}}{n_{\text{玻璃}}}$就发生全反射。B 对：临界角越小，超过它的入射角范围越大。E 对：$n_1$、$n_2$越接近，$n_1^2-n_2^2$越小。

    C 错：光从折射率小的空气射向水，没有临界角，总有折射光。D 错：全反射时没有折射光，反射光带走入射光的全部能量。

- id: p3
  tier: medium
  statement: |
    潜水员在平静的水面下$2.0\,\mathrm m$处仰望，头顶有一个明亮的圆圈，圈外的水面像镜子。水的折射率取$1.33$。求这个圆圈的半径，以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: 2.0*tan(asin(1/1.33))
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      光路可逆：从天空各个方向射到水面上的光，进入水里以后和法线的夹角都不超过临界角。
    - |
      能射进潜水员眼睛的天光，来自以他为顶点、半顶角为$\theta_{\mathrm c}$的圆锥和水面的交线以内，半径$r=h\tan\theta_{\mathrm c}$。
    - |
      $\theta_{\mathrm c}\approx48.75^\circ$，$\tan\theta_{\mathrm c}\approx1.140$，$r\approx2.28\,\mathrm m$。
  solution: |
    天空射来的光，入射角最大接近$90^\circ$，进入水里后折射角最大是临界角$\theta_{\mathrm c}=\arcsin\frac1{1.33}\approx48.75^\circ$。由光路可逆，射进潜水员眼睛的天光都来自以眼睛为顶点、半顶角为$\theta_{\mathrm c}$的圆锥里，它和水面交成半径$r=h\tan\theta_{\mathrm c}=2.0\times1.140\,\mathrm m\approx2.28\,\mathrm m$的圆。圈外射向眼睛的光只能来自水下：水下的光在那里的入射角超过临界角，全部反射，所以圈外的水面像镜子。

- id: p4
  tier: medium
  statement: |
    一种光纤的纤芯折射率$1.50$，包层折射率$1.47$，端面外是空气。光从端面射入时，和光纤的轴的夹角最大能有多少度？保留三位有效数字。
  answer:
    type: number
    value: asin(sqrt(1.50^2 - 1.47^2))*180/pi
    unit: |
      $^\circ$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      $\mathrm{NA}=\sin\theta_{\max}=\sqrt{n_1^2-n_2^2}$。
    - |
      $n_1^2-n_2^2=2.25-2.1609=0.0891$。
    - |
      $\mathrm{NA}\approx0.2985$，$\theta_{\max}\approx17.4^\circ$。
  solution: |
    $\mathrm{NA}=\sqrt{1.50^2-1.47^2}=\sqrt{0.0891}\approx0.2985$，$\theta_{\max}=\arcsin0.2985\approx17.4^\circ$。和光纤的轴夹角在$17.4^\circ$以内射入的光，在纤芯和包层的界面上都发生全反射，能传下去。

- id: p5
  tier: hard
  statement: |
    （1）光纤的纤芯和包层的折射率分别为$n_1$、$n_2$（$n_1>n_2$），端面外介质的折射率为$n_0$。证明能在纤芯里靠全反射传下去的光，在端面外和轴的最大夹角满足$n_0\sin\theta_{\max}=\sqrt{n_1^2-n_2^2}$。（2）一根折射率$1.5$的实心玻璃棒放在空气里，外面没有包层。从端面射进去的光有没有不能传下去的？
  hints:
    - |
      端面上用折射定律：$n_0\sin\theta=n_1\sin\theta'$，$\theta'$是纤芯里光线和轴的夹角。
    - |
      光线射到纤芯和包层的界面上时，入射角是$90^\circ-\theta'$，要求$\sin(90^\circ-\theta')\ge\frac{n_2}{n_1}$。
    - |
      （2）包层换成空气，$n_2=1$，$\sqrt{1.5^2-1}\approx1.12>1$。
  reference: |
    （1）光在端面上以$\theta$射入，折射角$\theta'$满足$n_0\sin\theta=n_1\sin\theta'$，$\theta'$就是纤芯里的光线和轴的夹角。这条光线射到纤芯和包层的界面上（界面和轴平行）时，入射角是$90^\circ-\theta'$，要发生全反射就要$\sin(90^\circ-\theta')=\cos\theta'\ge\frac{n_2}{n_1}$，即$\sin\theta'\le\sqrt{1-\frac{n_2^2}{n_1^2}}$。于是$n_0\sin\theta=n_1\sin\theta'\le\sqrt{n_1^2-n_2^2}$，等号对应$\theta_{\max}$。光线在界面上反射后和轴的夹角不变，以后每次射到界面上的入射角都一样，所以只要第一次满足，就一直满足（光纤是直的时候）。

    （2）$n_0=1$，$n_1=1.5$，$n_2=1$，$\sqrt{n_1^2-n_2^2}\approx1.12$，大于$1$，而$\sin\theta_{\max}$不能超过$1$：不管从端面以多大的角射进去，光在棒的侧面上都发生全反射，都能传下去。不过侧面裸露在外，沾上灰尘、手指一碰，那里的全反射就被破坏，光会漏出去，所以实用的光纤要有包层。

- id: p6
  tier: hard
  statement: |
    一段长$L$的光纤，纤芯折射率$n_1$、包层折射率$n_2$，光在纤芯里的速度是$\frac c{n_1}$。（1）同时射入的光，沿轴直走的最快，以恰好全反射的最大角度走锯齿形路线的最慢。证明两者到达另一端的时间差$\Delta t=\frac{Ln_1}{c}\Bigl(\frac{n_1}{n_2}-1\Bigr)$。

    （2）取$L=1.0\,\mathrm{km}$、$n_1=1.48$、$n_2=1.46$、$c=3.00\times10^8\,\mathrm{m/s}$，算出$\Delta t$。相邻两个光脉冲至少要隔开$\Delta t$才分得清，粗略地说，这段光纤每秒最多能传多少个脉冲？（3）怎样减小$\Delta t$？
  hints:
    - |
      最慢的光线射到界面上的入射角等于临界角，它和轴的夹角$\theta'$满足$\cos\theta'=\frac{n_2}{n_1}$。
    - |
      锯齿形路线的总长是$\frac{L}{\cos\theta'}=\frac{Ln_1}{n_2}$。
    - |
      $\Delta t\approx6.8\times10^{-8}\,\mathrm s$，每秒约$1.5\times10^7$个脉冲。
  reference: |
    （1）沿轴的光线走$L$，用时$\frac{Ln_1}{c}$。以最大角度传播的光线，在界面上的入射角等于临界角，和轴的夹角$\theta'$满足$\cos\theta'=\sin\theta_{\mathrm c}=\frac{n_2}{n_1}$。它的锯齿形路线每段都和轴成$\theta'$，总长$\frac{L}{\cos\theta'}=\frac{Ln_1}{n_2}$，用时$\frac{Ln_1^2}{cn_2}$。两者之差$\Delta t=\frac{Ln_1}{c}\Bigl(\frac{n_1}{n_2}-1\Bigr)$。

    （2）$\Delta t=\frac{1000\times1.48}{3.00\times10^8}\times\Bigl(\frac{1.48}{1.46}-1\Bigr)\,\mathrm s\approx4.93\times10^{-6}\times0.0137\,\mathrm s\approx6.8\times10^{-8}\,\mathrm s$，约$68\,\mathrm{ns}$。脉冲至少隔开$\Delta t$，每秒最多约$\frac1{\Delta t}\approx1.5\times10^7$个；光纤越长，$\Delta t$越大，能传的就越少。

    （3）减小$n_1$和$n_2$之差可以减小$\Delta t$，但数值孔径也随之变小；彻底的办法是把纤芯做得很细，只允许一个模传播（单模光纤），就没有不同路程带来的时间差。另一种办法是让纤芯的折射率从中心向外逐渐减小，走远路的光线经过的地方折射率小、速度快，可以把时间差补回来。

- id: p7
  tier: thinking
  statement: |
    用折射率约$1.5$的玻璃仿制的「钻石」，切成和真钻石一样的形状，看上去还是没有真钻石那么亮。只从全反射的角度，说说这是为什么。
  hints:
    - |
      比较钻石（$n\approx2.42$）和玻璃（$n\approx1.5$）与空气之间的临界角。
    - |
      光从钻石的正面射进去，射到背面的斜面上；入射角超过临界角就全部反射回来。
    - |
      临界角越小，射到背面的光里能全反射的比例越大。
  reference: |
    钻石和空气之间的临界角约$24.4^\circ$，玻璃约$41.8^\circ$。从正面射进去的光射到背面的各个斜面上，入射角大于$24.4^\circ$的在钻石里都会全反射，几经反射又从正面射出来，射向看的人；换成玻璃，入射角在$24.4^\circ$和$41.8^\circ$之间的那部分光就从背面漏了出去，正面射回来的光少，看上去就暗。钻石的切磨角度正是按它的临界角设计的，同样的形状用到玻璃上并不合适。

- id: p8
  tier: thinking
  statement: |
    （1）光纤弯得太急，光就会从弯处漏出去，为什么？（2）为什么光纤的纤芯外面要包一层包层，而不是让纤芯直接接触空气？（3）长途通信为什么用单模光纤？
  hints:
    - |
      光纤弯曲时，同一条光线射到外侧界面上的入射角会变小。
    - |
      全反射只在干净的界面上才可靠；包层把这个界面藏在里面。
    - |
      想一想第 6 题里不同路线的光到达时间的差别。
  reference: |
    （1）光纤直的时候，纤芯里的光线射到界面上的入射角都大于临界角。光纤弯曲时，弯处外侧的界面相对光线转了一个角度，光线射到那里的入射角变小，弯得越急变得越小，一旦小于临界角，那部分光就折射进包层、漏出去。

    （2）纤芯直接接触空气时，表面一旦沾上灰尘、油污、水汽，或者碰到别的东西，那里的折射率条件就变了，全反射被破坏，光会漏掉。包层把纤芯和包层的界面藏在玻璃内部，外面再怎么脏、怎么碰，都不影响全反射。

    （3）多模光纤里光沿不同的路线传播，到达的时间有先有后，一个短脉冲会被拉长，距离越长，前后的脉冲越容易连成一片。单模光纤只有一个模，没有这种时间差，脉冲可以排得很密、传得很远，所以能在很长的距离上传送很多信息。
