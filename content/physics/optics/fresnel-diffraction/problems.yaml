- id: p1
  tier: easy
  statement: |
    波长$600\,\mathrm{nm}$的平行光垂直照到一个平面上，对平面后$1.50\,\mathrm m$处轴上的一点，第一个菲涅耳半波带的半径是多少？以$\mathrm{mm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: sqrt(600e-9*1.50)*1000
    unit: |
      $\mathrm{mm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      第一个半波带的外边界到观察点的距离比$L$多$\frac\lambda2$。
    - |
      角度小时$r_m\approx\sqrt{m\lambda L}$，取$m=1$。
    - |
      $r_1=\sqrt{600\times10^{-9}\times1.50}\,\mathrm m\approx9.49\times10^{-4}\,\mathrm m\approx0.949\,\mathrm{mm}$。
  solution: |
    由$\sqrt{L^2+r_1^2}=L+\frac\lambda2$，$r_1^2=\lambda L+\frac{\lambda^2}4\approx\lambda L$，所以$r_1\approx\sqrt{\lambda L}=\sqrt{9.00\times10^{-7}}\,\mathrm m\approx0.949\,\mathrm{mm}$。不到一毫米：只有这么小的孔，才能让孔里只露出一个半波带。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        圆孔里恰好露出$2$个半波带时，轴上那一点的光强约是不加遮挡时的$4$倍
      - |
        波长$600\,\mathrm{nm}$的平行光照射半径$0.90\,\mathrm{mm}$的圆孔，轴上离孔$0.45\,\mathrm m$处是亮的
      - |
        泊松亮斑只有用激光照射才能看到
      - |
        把一块波带片透光的圈和挡光的圈对调，主焦点的位置不变
      - |
        观察点离圆孔越远，孔里露出的半波带越多
    value: [2, 4]
  hints:
    - |
      露出的半波带数$N=\frac{a^2}{\lambda L}$，奇数时亮，偶数时暗。
    - |
      对调以后，留下的是另一半半波带，它们到原来那一点是不是也同相？
    - |
      B、D 对；A、C、E 错。
  solution: |
    B 对：$N=\frac{(0.90\times10^{-3})^2}{600\times10^{-9}\times0.45}=3$，奇数，是亮的。D 对：对调后留下的是偶数号半波带，它们到原来的焦点同样两两同相，只是和原来差半个周期，焦点还在原处。

    A 错：露出两个时两者几乎抵消，接近全暗；露出一个时才约是$4$倍。C 错：只要光源够小、圆屏够圆，用普通光源也能看到，1818 年阿拉戈用的就不是激光。E 错：$N=\frac{a^2}{\lambda L}$，离得越远，露出的越少。

- id: p3
  tier: medium
  statement: |
    波长$600\,\mathrm{nm}$的平行光垂直照射半径$1.20\,\mathrm{mm}$的圆孔。孔后轴上中心是暗点的位置里，离孔最远的那一个离孔多远？以$\mathrm m$为单位，保留三位有效数字。
  answer:
    type: number
    value: (1.20e-3)^2/(2*600e-9)
    unit: |
      $\mathrm m$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      孔里露出偶数个半波带时中心是暗的，$N=\frac{a^2}{\lambda L}$。
    - |
      离孔越远，$N$越小；露出的半波带数是偶数里最小的那个，即$N=2$，就是最远的暗点。
    - |
      $L=\frac{a^2}{2\lambda}=\frac{(1.20\times10^{-3})^2}{2\times600\times10^{-9}}\,\mathrm m=1.20\,\mathrm m$。
  solution: |
    中心暗要求$N=\frac{a^2}{\lambda L}$是偶数，$L=\frac{a^2}{N\lambda}$随$N$增大而减小。$N=2$时最远，$L=\frac{1.44\times10^{-6}}{1.20\times10^{-6}}\,\mathrm m=1.20\,\mathrm m$。再远，孔里的半波带不到两个，中心不再全暗；$L=2.40\,\mathrm m$（$N=1$）处是最远的亮点，比它更远，中心的光强一路减小。

- id: p4
  tier: medium
  statement: |
    波长$520\,\mathrm{nm}$的平行光垂直照射半径$0.800\,\mathrm{mm}$的圆孔，观察点在孔后轴上$1.00\,\mathrm m$处。不计越往外次波越斜带来的减小，按$I=4I_0\sin^2\frac{N\pi}2$估算，这一点的光强是不加遮挡时的多少倍？保留三位有效数字。
  answer:
    type: number
    value: 4*sin(pi*(0.800e-3)^2/(520e-9*1.00)/2)^2
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      先算孔里露出的半波带数$N=\frac{a^2}{\lambda L}$，它不一定是整数。
    - |
      $N=\frac{(0.800\times10^{-3})^2}{520\times10^{-9}\times1.00}\approx1.231$。
    - |
      $4\sin^2(0.615\pi)\approx4\times0.874\approx3.50$。
  solution: |
    $N=\frac{6.40\times10^{-7}}{5.20\times10^{-7}}\approx1.231$，孔里露出一个多一点的半波带。$\frac{N\pi}2\approx1.933\,\mathrm{rad}$，$\sin1.933\approx0.935$，$\frac I{I_0}=4\times0.935^2\approx3.50$：多露出的那一小部分和第一个半波带反相，把光强从$4$倍拉低了一些。

- id: p5
  tier: hard
  statement: |
    点光源$S$在圆孔前方的轴上，离孔$R_0$；观察点$P$在孔后的轴上，离孔$L$。

    （1）证明这时第$m$个半波带的外半径满足$r_m^2\approx m\lambda\frac{R_0L}{R_0+L}$（角度都很小）。（2）一块波带片按平行光设计，$r_m^2=m\lambda f$。证明离它$s$的点光源，像成在$s'$处，$\frac1s+\frac1{s'}=\frac1f$。（3）第一圈半径$0.30\,\mathrm{mm}$的波带片，用$600\,\mathrm{nm}$的光，点光源离它$0.45\,\mathrm m$，像在哪里？
  hints:
    - |
      从$S$经孔上离中心$r$的一点到$P$的路程是$\sqrt{R_0^2+r^2}+\sqrt{L^2+r^2}$，比$R_0+L$多出多少？
    - |
      $\sqrt{R^2+r^2}\approx R+\frac{r^2}{2R}$；多出的部分等于$\frac{m\lambda}2$时是第$m$圈的边界。
    - |
      $f=\frac{r_1^2}\lambda=0.15\,\mathrm m$，$\frac1{s'}=\frac1{0.15}-\frac1{0.45}$。
  reference: |
    （1）路程比$R_0+L$多出$\frac{r^2}2\Bigl(\frac1{R_0}+\frac1L\Bigr)$。第$m$圈的外边界要多出$\frac{m\lambda}2$，所以$r_m^2\Bigl(\frac1{R_0}+\frac1L\Bigr)=m\lambda$，即$r_m^2=m\lambda\frac{R_0L}{R_0+L}$。$R_0\to\infty$时回到平行光的$r_m^2=m\lambda L$。

    （2）波带片上各圈的半径是固定的，$r_m^2=m\lambda f$。点光源在$s$处时，要找的是这样一点$s'$：对它来说，这些圈正好是半波带，即$m\lambda\frac{ss'}{s+s'}=m\lambda f$，也就是$\frac1s+\frac1{s'}=\frac1f$。这时透光的圈到$s'$都同相，光在那里会聚成像，成像公式和薄透镜的一样。

    （3）$f=\frac{(0.30\times10^{-3})^2}{600\times10^{-9}}\,\mathrm m=0.15\,\mathrm m$。$\frac1{s'}=\frac1{0.15}-\frac1{0.45}\approx4.44\,\mathrm m^{-1}$，$s'\approx0.225\,\mathrm m$，像在波带片后约$22.5\,\mathrm{cm}$处。

- id: p6
  tier: hard
  statement: |
    用旋转矢量分析轴上一点$P$的光振动。

    （1）把每个半波带再分成许多细圈，说明各细圈的旋转矢量首尾相接，排成一条慢慢向里收的螺线，第一个半波带是螺线上的半圈。（2）由此说明：不加遮挡时的合振幅约是只露出第一个半波带时的一半。

    （3）不计越往外越斜带来的减小，螺线成了一个圆。圆孔里只露出第一个半波带的一半（按面积），合振幅、光强各是不加遮挡时的多少倍？换成恰好挡住这一半的圆屏呢？
  hints:
    - |
      面积相等的细圈到$P$的距离依次增加同样多，相位依次落后同样多；越往外越斜，振幅略小。
    - |
      不加遮挡相当于把螺线一直画下去，终点趋于螺线的中心。
    - |
      第一个半波带的一半对应圆上转过四分之一圈，弦长是直径的$\sin45^\circ$倍。
  reference: |
    （1）面积相等的细圈，按$r^2$等分，它们到$P$的距离依次增加同样多，相位依次落后同样多，旋转矢量一样长、依次转过同样的小角度，首尾相接排成一段圆弧；走过一个半波带，距离增加$\frac\lambda2$，相位落后$\pi$，正好半圈。越往外次波射向$P$越斜，矢量逐渐变短，所以每走半圈半径都缩小一点，整条曲线是向里收的螺线。

    （2）只露出第一个半波带时，合振幅是从螺线起点到半圈终点的弦，约是第一个半圆的直径$a_1$。不加遮挡时，螺线一直绕下去，终点趋于中心，合振幅是从起点到中心，约为半径$\frac{a_1}2$，即只露出第一个半波带时的一半，光强是它的四分之一。

    （3）不计减小时螺线是半径为$A_0$的圆，不加遮挡时合振幅为$A_0$（起点到圆心）。露出第一个半波带的一半，相位转过$\frac\pi2$，合振幅是对应的弦$2A_0\sin\frac\pi4=\sqrt2A_0$，光强$2I_0$，和$4I_0\sin^2\frac{N\pi}2$在$N=\frac12$时一致。圆屏挡住这一半时，剩下的部分从转过$\frac\pi2$的那一点一直绕到圆心，合振幅仍是半径$A_0$，光强$I_0$：阴影中心的亮度和没挡时一样，就是泊松亮斑。

- id: p7
  tier: thinking
  statement: |
    （1）既然圆屏阴影的中心总有亮点，为什么日常物体的影子里看不到？

    （2）半径$2.0\,\mathrm{mm}$的圆屏，用$500\,\mathrm{nm}$的平行光照射，在$1.0\,\mathrm m$外观察。圆屏边缘附近，一个半波带有多宽？圆屏边缘不平整的程度大约要小于多少，亮斑才看得清楚？

    （3）1818 年阿拉戈的实验能成功，靠的是什么？
  hints:
    - |
      亮斑来自圆屏边缘外面那一圈次波同相到达中心；边缘不规则时，各段边缘对应的相位就乱了。
    - |
      由$r_m^2=m\lambda L$，相邻两圈半径之差约为$\frac{\lambda L}{2r}$。
    - |
      光源也要足够小：光源上不同的点各自在不同的位置产生亮斑。
  reference: |
    （1）亮斑要靠圆屏边缘外面紧挨着的那一圈半波带的光同相到达中心。日常物体的边缘不圆、也不光滑，高低不平的程度远大于半波带的宽度，各处边缘外的次波到达中心时相位杂乱，相互抵消；日常的光源又很大，光源上不同的点产生的亮斑位置不同，叠在一起也就糊掉了。

    （2）$r^2=m\lambda L$，相邻两圈半径之差$\Delta r\approx\frac{\lambda L}{2r}=\frac{500\times10^{-9}\times1.0}{2\times2.0\times10^{-3}}\,\mathrm m\approx1.3\times10^{-4}\,\mathrm m$，约$0.13\,\mathrm{mm}$。边缘的起伏要明显小于这个宽度，比如几十微米以下，边缘外那一圈的相位才大体一致。

    （3）阿拉戈用的是一块直径约$2\,\mathrm{mm}$、边缘磨得很圆很平的小金属圆片，粘在玻璃上，并用一个小孔让光源足够小，满足了上面两个条件。早在 1723 年，马拉尔迪（Giacomo Maraldi）就观察到过这个亮点，只是当时没有人能解释。

- id: p8
  tier: thinking
  statement: |
    （1）为什么 X 射线显微镜用波带片聚焦，而不用透镜？（2）平行光照射时，波带片的焦距随波长怎样变化？和玻璃透镜相比有什么不同？这能派上什么用场？

    （3）离波带片$\frac f3$处也有一个焦点。在那一点看，波带片上每个透光的圈里有几个半波带？为什么那里也是亮的？
  hints:
    - |
      X 射线在各种材料里的折射率都极接近$1$，又容易被吸收。
    - |
      $f=\frac{r_1^2}\lambda$；玻璃对蓝光的折射率比对红光的大。
    - |
      对$\frac f3$处的一点，半波带的半径满足$r_k^2=k\lambda\frac f3$。
  reference: |
    （1）X 射线在各种材料里的折射率都极接近$1$（相差约百万分之一），透镜几乎不偏折它，还会把它吸收掉；波带片不靠折射，只靠挡住一半半波带，用金这类重元素做出很细的圈就能聚焦。最外一圈越窄，聚焦的光斑越小，加工精度决定了分辨的细节。

    （2）$f=\frac{r_1^2}\lambda$，波长越短焦距越长，蓝光聚在红光后面；玻璃透镜对蓝光的折射率大，蓝光聚在红光前面，正好相反。把两者配在一起，色差可以相互抵消，有的相机镜头里就用了这种衍射元件来减小色差。

    （3）对$\frac f3$处的一点，$r_k^2=k\lambda\frac f3$，波带片第$m$圈从$r_{m-1}^2=(m-1)\lambda f$到$r_m^2=m\lambda f$，正好包含这一点的$3$个半波带。透光的圈里三个半波带两个同号、一个反号，相互抵消掉两个，剩下相当于一个半波带；各个透光的圈剩下的都同号，同相相加，所以那里也会聚。按不计倾斜的近似，轴上那一点和主焦点差不多亮，只是那里的亮斑更细，会聚的总光能少得多。
