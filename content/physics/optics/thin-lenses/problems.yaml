- id: p1
  tier: easy
  statement: |
    一块平凸透镜，平的一面朝右，凸面朝左、半径$26\,\mathrm{cm}$，玻璃的折射率是$1.52$，放在空气里。它的焦距是多少？以$\mathrm{cm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 1/((1.52 - 1)*(1/26))
    unit: |
      $\mathrm{cm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      磨镜者公式$\frac1f=(n-1)\Bigl(\frac1{R_1}-\frac1{R_2}\Bigr)$；平面的半径是无穷大。
    - |
      $R_1=+26\,\mathrm{cm}$，$\frac1{R_2}=0$。
    - |
      $\frac1f=\frac{0.52}{26}\,\mathrm{cm^{-1}}=0.020\,\mathrm{cm^{-1}}$，$f=50.0\,\mathrm{cm}$。
  solution: |
    $R_1=+26\,\mathrm{cm}$（球心在右边），$R_2\to\infty$。$\frac1f=(1.52-1)\times\frac1{26}\,\mathrm{cm^{-1}}=0.020\,\mathrm{cm^{-1}}$，$f=50.0\,\mathrm{cm}$，是会聚透镜。把它掉过头，平面朝左，$R_1\to\infty$、$R_2=-26\,\mathrm{cm}$，算出的焦距一样。

- id: p2
  tier: easy
  statement: |
    下面关于空气中的薄透镜的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        焦距为$+20\,\mathrm{cm}$和$-20\,\mathrm{cm}$的两块薄透镜贴在一起，相当于一块平板玻璃
      - |
        实物经会聚透镜成实像时，像和物分在透镜两侧
      - |
        物在会聚透镜一倍焦距以内时，像在透镜的另一侧
      - |
        近视眼镜的光焦度是负的
      - |
        用纸挡住会聚透镜的上半部分，屏上的实像只剩下半部分
    value: [1, 2, 4]
  hints:
    - |
      贴在一起的薄透镜光焦度相加；实像在出射一侧。
    - |
      近视的人看不清远处，眼镜要使光发散；物在焦距以内时$s'<0$。
    - |
      A、B、D 对；C、E 错。
  solution: |
    A 对：$\frac1f=\frac1{20}-\frac1{20}=0$，光焦度为零，光穿过后方向不变。B 对：实物在入射一侧，实像的像距为正，在出射一侧；虚物在出射一侧，这时像和物可以在同一侧。D 对：近视眼镜是发散透镜，$f<0$。

    C 错：$s<f$时$\frac1{s'}=\frac1f-\frac1s<0$，像在物的同一侧，是虚像。E 错：每个物点发出的光都射到整个透镜上，挡住一半只让像变暗，像仍然完整。

- id: p3
  tier: medium
  statement: |
    投影仪的镜头可以看作焦距$10.0\,\mathrm{cm}$的薄透镜，把一张宽$2.40\,\mathrm{cm}$的胶片投到离镜头$3.00\,\mathrm m$的屏上。屏上的画面有多宽？以$\mathrm{cm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 2.40*3.00/(1/(1/0.100 - 1/3.00))
    unit: |
      $\mathrm{cm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      像距$s'=3.00\,\mathrm m$，先由$\frac1s=\frac1f-\frac1{s'}$求胶片离镜头多远。
    - |
      $\frac1s=10.0-0.333=9.667\,\mathrm{m^{-1}}$，$s\approx0.1034\,\mathrm m$。
    - |
      $|m|=\frac{s'}{s}\approx29.0$，画面宽约$2.40\times29.0\,\mathrm{cm}\approx69.6\,\mathrm{cm}$。
  solution: |
    $\frac1s=\frac1{0.100}-\frac1{3.00}\approx9.667\,\mathrm{m^{-1}}$，$s\approx10.34\,\mathrm{cm}$，胶片要放在焦点外一点点。$|m|=\frac{s'}{s}=\frac{300}{10.34}\approx29.0$，画面宽$2.40\times29.0\,\mathrm{cm}\approx69.6\,\mathrm{cm}$。像是倒立的，所以胶片要倒着放。

- id: p4
  tier: medium
  statement: |
    一个人眼睛的近点（能看清的最近距离）在$75\,\mathrm{cm}$处，想像正常人一样看清$25\,\mathrm{cm}$处的书。眼镜和眼睛的距离不计，他的老花镜应该是多少屈光度？保留三位有效数字。
  answer:
    type: number
    value: 1/0.25 - 1/0.75
    unit: |
      $\mathrm D$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      眼镜要把$25\,\mathrm{cm}$处的书成像在$75\,\mathrm{cm}$处，让眼睛看这个像；像和书在同一侧。
    - |
      $s=0.25\,\mathrm m$，$s'=-0.75\,\mathrm m$。
    - |
      $\Phi=\frac1s+\frac1{s'}=4.00-1.33\approx2.67\,\mathrm D$。
  solution: |
    眼镜把$s=0.25\,\mathrm m$处的书成虚像在$s'=-0.75\,\mathrm m$处，眼睛看这个虚像正好看得清。$\Phi=\frac1{0.25}+\frac1{-0.75}\approx2.67\,\mathrm D$，是会聚透镜，大约「$267$度」的老花镜。

- id: p5
  tier: hard
  statement: |
    （1）折射率为$n$的薄透镜放在折射率为$n_0$的介质里，两面的半径为$R_1$、$R_2$。逐面计算，证明$\frac1s+\frac1{s'}=\Bigl(\frac{n}{n_0}-1\Bigr)\Bigl(\frac1{R_1}-\frac1{R_2}\Bigr)$。（2）一块$n=1.50$的玻璃凸透镜在空气里的焦距是$10\,\mathrm{cm}$，放进水里（$n_0=1.33$）焦距变成多少？（3）水里一个形状像双凸透镜的气泡，对光是会聚还是发散？
  hints:
    - |
      第一个面两侧是$n_0$和$n$，第二个面两侧是$n$和$n_0$；第一个面的像是第二个面的物，$s_2=-s_1'$。
    - |
      两式相加后两边除以$n_0$。
    - |
      气泡里$n=1$，比周围的水小，$\frac n{n_0}-1<0$。
  reference: |
    （1）第一个面：$\frac{n_0}{s}+\frac{n}{s_1'}=\frac{n-n_0}{R_1}$。透镜很薄，第二个面的物距$s_2=-s_1'$：$\frac{n}{-s_1'}+\frac{n_0}{s'}=\frac{n_0-n}{R_2}$。两式相加，$\frac{n_0}{s}+\frac{n_0}{s'}=(n-n_0)\Bigl(\frac1{R_1}-\frac1{R_2}\Bigr)$，除以$n_0$即得。$n_0=1$时就是讲解里的磨镜者公式。

    （2）光焦度和$\frac n{n_0}-1$成正比：空气里$1.50-1=0.50$，水里$\frac{1.50}{1.33}-1\approx0.128$，只剩约$0.256$倍，焦距变成约$\frac{10}{0.256}\,\mathrm{cm}\approx39\,\mathrm{cm}$。

    （3）气泡的$n=1$，$\frac{1}{1.33}-1<0$，而双凸形状的$\frac1{R_1}-\frac1{R_2}>0$，所以焦距为负，水里的双凸气泡是发散透镜。透镜会聚还是发散，不只看形状，还要看它比周围的介质光密还是光疏。

- id: p6
  tier: hard
  statement: |
    物和屏固定不动，相距$D$，在两者之间移动一块焦距为$f$的会聚透镜。（1）证明$D>4f$时透镜有两个位置能在屏上成清晰的像，$D<4f$时一个也没有。（2）两个位置相距$d$，证明$f=\frac{D^2-d^2}{4D}$（贝塞尔法测焦距）。（3）用光路可逆解释这两个位置的关系。
  hints:
    - |
      $s+s'=D$，代入成像公式，得到关于$s$的一元二次方程。
    - |
      方程$s^2-Ds+Df=0$有两个正根的条件是判别式大于零。
    - |
      两个根之差就是$d$：$d=\sqrt{D^2-4Df}$。
  reference: |
    （1）$s'=D-s$，代入$\frac1s+\frac1{D-s}=\frac1f$，整理得$s^2-Ds+Df=0$，判别式$D^2-4Df$。$D>4f$时有两个正根（两根之和$D$、之积$Df$都为正），透镜有两个位置；$D=4f$时只有$s=s'=2f$一个；$D<4f$时没有实根，屏上接不到像。

    （2）两根之差$d=\sqrt{D^2-4Df}$，平方得$d^2=D^2-4Df$，$f=\frac{D^2-d^2}{4D}$。量出$D$和两个位置的距离$d$就能算出焦距，不用找透镜的中心在哪里，这是测会聚透镜焦距的一个好办法。

    （3）两个根是$s_1$和$s_2=D-s_1$：第二个位置的物距等于第一个位置的像距。由光路可逆，物和像可以交换，透镜在第一个位置时物距$s_1$、像距$D-s_1$，挪到第二个位置正好把两者对调，一次成放大的像、一次成缩小的像，两次放大率互为倒数。

- id: p7
  tier: thinking
  statement: |
    照相机的镜头可以看作焦距$50\,\mathrm{mm}$的薄透镜。（1）对着很远的山拍照，镜头离感光元件多远？（2）改拍$2.0\,\mathrm m$外的人，镜头要往前伸还是往后缩，挪多少？（3）为什么手机的镜头焦距只有几毫米，几乎不用怎么调焦？
  hints:
    - |
      很远的物体成像在焦点上。
    - |
      物距$2.0\,\mathrm m$时像距$s'=\frac{1}{\frac1f-\frac1s}$，比$f$大多少？
    - |
      像距比焦距多出$\frac{f^2}{s-f}$，$f$小，这一项就小。
  reference: |
    （1）物距很大时像在焦点上，镜头离感光元件$50\,\mathrm{mm}$。

    （2）$s'=\frac{1}{\frac1{50}-\frac1{2000}}\,\mathrm{mm}\approx51.3\,\mathrm{mm}$，镜头要往前伸约$1.3\,\mathrm{mm}$，离感光元件更远。物越近，要伸得越多。

    （3）$s'-f=\frac{f^2}{s-f}$，和$f^2$成正比。焦距$4\,\mathrm{mm}$的镜头拍$2\,\mathrm m$外的人，像距只比焦距多约$0.008\,\mathrm{mm}$，远近不同的物体成像的位置几乎相同，所以几乎不用调焦，一次就能把远近的东西都拍得比较清楚。

- id: p8
  tier: thinking
  statement: |
    （1）为什么说透镜是会聚还是发散，不能只看它中间厚还是边缘厚？（2）一块双凹的玻璃透镜放在比玻璃折射率更大的液体里，对光是会聚还是发散？（3）近视的人和视力正常的人都不戴潜水镜在水下睁眼，谁看得更模糊一些？为什么两人都看不清？
  hints:
    - |
      磨镜者公式里$\frac n{n_0}-1$的符号可以是负的。
    - |
      双凹透镜$\frac1{R_1}-\frac1{R_2}<0$。
    - |
      水里角膜的光焦度大大减小（见[球面折射与近轴近似](lesson:physics.optics.paraxial-refraction)第 7 题）；近视眼的问题是光焦度太大。
  reference: |
    （1）透镜的光焦度正比于$\Bigl(\frac{n}{n_0}-1\Bigr)\Bigl(\frac1{R_1}-\frac1{R_2}\Bigr)$。形状只决定第二个因子的符号，透镜比周围的介质折射率大还是小，决定第一个因子的符号，两者合起来才定会聚还是发散。

    （2）双凹透镜第二个因子为负；周围液体的折射率比玻璃大，第一个因子也为负，乘积为正，是会聚透镜。

    （3）在水里，角膜和水的界面几乎失去光焦度：按[球面折射与近轴近似](lesson:physics.optics.paraxial-refraction)第 7 题的数，角膜在空气里约$48\,\mathrm D$，在水里只剩约$5.5\,\mathrm D$，少了约$43\,\mathrm D$。视力正常的人在水下离焦约$43\,\mathrm D$，像落到视网膜后面很远处。近视的人眼睛的光焦度本来多出一些，例如$-3\,\mathrm D$的近视，在水下离焦约$40\,\mathrm D$，比正常人轻一点，可也远比在空气里的$3\,\mathrm D$模糊。所以近视的人稍微好一点，但两人都看不清；戴上潜水镜，眼前重新有一层空气，角膜的光焦度就回来了。
