- id: p1
  tier: easy
  statement: |
    空气中的光射到一个凸向射来的光、半径$10\,\mathrm{cm}$的玻璃球面上，玻璃的折射率是$1.50$，空气的取$1$。光轴上的物点离顶点$40\,\mathrm{cm}$。按近轴近似，像距是多少？以$\mathrm{cm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 1.50/((1.50 - 1)/10 - 1/40)
    unit: |
      $\mathrm{cm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      $\frac{n_1}{s}+\frac{n_2}{s'}=\frac{n_2-n_1}{R}$；球心在玻璃一侧，$R=+10\,\mathrm{cm}$。
    - |
      $\frac{1}{40}+\frac{1.50}{s'}=\frac{0.50}{10}=0.050$。
    - |
      $\frac{1.50}{s'}=0.025$，$s'=60.0\,\mathrm{cm}$。
  solution: |
    $n_1=1$，$n_2=1.50$，$R=+10\,\mathrm{cm}$，$s=+40\,\mathrm{cm}$。$\frac{1.50}{s'}=\frac{0.50}{10}-\frac1{40}=0.025\,\mathrm{cm^{-1}}$，$s'=60.0\,\mathrm{cm}$，像距为正，像在玻璃里，是实像。

- id: p2
  tier: easy
  statement: |
    按本节的符号规则，下面关于单个折射球面成像的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        光焦度的单位屈光度等于$1\,\mathrm{cm^{-1}}$
      - |
        算出的像距为负，说明像在入射一侧，是虚像
      - |
        球面两侧的折射率不同时，物方焦距和像方焦距不相等
      - |
        横向放大率为$-2$，说明像是倒立的，高度是物的$2$倍
      - |
        平面不会使光偏折，所以不能成像
    value: [2, 3, 4]
  hints:
    - |
      像距在出射一侧为正；$\frac{f_2}{f_1}=\frac{n_2}{n_1}$；$m=\frac{y'}{y}$。
    - |
      屈光度是$\mathrm m^{-1}$；平面是$R\to\infty$的球面，$s'=-\frac{n_2}{n_1}s$。
    - |
      B、C、D 对；A、E 错。
  solution: |
    B 对：像距为负表示像点在入射一侧，射出的光并不会聚到那里，是虚像。C 对：$\frac{f_2}{f_1}=\frac{n_2}{n_1}\ne1$。D 对：$m<0$倒立，$|m|=2$。

    A 错：屈光度是$\mathrm m^{-1}$，$1\,\mathrm{cm^{-1}}=100\,\mathrm D$。E 错：斜射到平面上的光照样偏折，平面成虚像，$s'=-\frac{n_2}{n_1}s$，水里的东西看上去变浅就是这个像。

- id: p3
  tier: medium
  statement: |
    一个实心玻璃球半径$5.0\,\mathrm{cm}$，折射率$1.50$，放在空气里。球里有一个小气泡，在一条直径上，离近处的球面$2.0\,\mathrm{cm}$。沿这条直径从外面看，按近轴近似，气泡看上去在这个球面后面多深处？以$\mathrm{cm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: -1/((1 - 1.50)/(-5.0) - 1.50/2.0)
    unit: |
      $\mathrm{cm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      光从气泡射出，先在玻璃里，$n_1=1.50$，射进空气，$n_2=1$；物距$s=2.0\,\mathrm{cm}$。
    - |
      球心在玻璃一侧，即入射一侧，$R=-5.0\,\mathrm{cm}$。
    - |
      $\frac1{s'}=\frac{1-1.50}{-5.0}-\frac{1.50}{2.0}=-0.65\,\mathrm{cm^{-1}}$，$s'\approx-1.54\,\mathrm{cm}$，看上去深约$1.54\,\mathrm{cm}$。
  solution: |
    $n_1=1.50$，$n_2=1$，$s=2.0\,\mathrm{cm}$，$R=-5.0\,\mathrm{cm}$。$\frac{1.50}{2.0}+\frac{1}{s'}=\frac{1-1.50}{-5.0}=0.10$，$\frac1{s'}=0.10-0.75=-0.65\,\mathrm{cm^{-1}}$，$s'\approx-1.54\,\mathrm{cm}$。像在入射一侧（玻璃里），离球面约$1.54\,\mathrm{cm}$，是虚像，比实际的$2.0\,\mathrm{cm}$浅。如果把球面换成平面，像深$\frac{2.0}{1.50}\approx1.33\,\mathrm{cm}$，球面使它稍深一些。

- id: p4
  tier: medium
  statement: |
    设人眼角膜的前表面是半径$7.8\,\mathrm{mm}$、凸向外的球面，角膜的折射率是$1.376$，外面是空气。这个表面的光焦度是多少屈光度？保留三位有效数字。
  answer:
    type: number
    value: (1.376 - 1)/0.0078
    unit: |
      $\mathrm D$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      $\Phi=\frac{n_2-n_1}{R}$，$R$用米作单位。
    - |
      光从空气射进角膜，$n_1=1$，$n_2=1.376$，球心在角膜一侧，$R=+0.0078\,\mathrm m$。
    - |
      $\Phi=\frac{0.376}{0.0078}\,\mathrm{m^{-1}}\approx48.2\,\mathrm D$。
  solution: |
    $\Phi=\frac{1.376-1}{0.0078\,\mathrm m}\approx48.2\,\mathrm D$。它的像方焦距$f_2=\frac{n_2}{\Phi}=\frac{1.376}{48.2}\,\mathrm m\approx28.5\,\mathrm{mm}$：只有角膜这一个面，就能把平行光会聚到它后面约$2.9\,\mathrm{cm}$处，和眼球的大小相当。

- id: p5
  tier: hard
  statement: |
    单个折射球面，物方焦距$f_1$、像方焦距$f_2$。（1）证明横向放大率$m=-\frac{n_1s'}{n_2s}$。（2）把物距、像距改从焦点量起：$x=s-f_1$，$x'=s'-f_2$。证明成像公式可以写成$xx'=f_1f_2$。
  hints:
    - |
      （1）用从物体顶端射向顶点的光线，那里的法线就是光轴。
    - |
      （2）把成像公式除以$\Phi$：$\frac{f_1}{s}+\frac{f_2}{s'}=1$。
    - |
      $\frac{f_1}{s}+\frac{f_2}{s'}=1$两边乘以$ss'$，再把$(s-f_1)(s'-f_2)$展开比较。
  reference: |
    （1）物体顶端$Q$高$y$，从$Q$射向顶点$V$的光线，入射角$\theta_1\approx\frac ys$；它折射后射到像的顶端$Q'$，$Q'$的高$y'$（倒立时为负），折射光线和光轴的夹角约为$-\frac{y'}{s'}$，这也是折射角。近轴的折射定律$n_1\theta_1=n_2\theta_2$给出$n_1\frac ys=-n_2\frac{y'}{s'}$，所以$m=\frac{y'}{y}=-\frac{n_1s'}{n_2s}$。

    （2）由$\frac{n_1}{s}+\frac{n_2}{s'}=\Phi$和$f_1=\frac{n_1}{\Phi}$、$f_2=\frac{n_2}{\Phi}$，得$\frac{f_1}{s}+\frac{f_2}{s'}=1$，即$f_1s'+f_2s=ss'$。而$(s-f_1)(s'-f_2)=ss'-f_2s-f_1s'+f_1f_2=f_1f_2$，所以$xx'=f_1f_2$。这是牛顿形式的成像公式：物点在物方焦点外侧（$x>0$）时，像在像方焦点外侧（$x'>0$），物点越靠近焦点，像退得越远。

- id: p6
  tier: hard
  statement: |
    一个实心玻璃球，半径$R$，折射率$n$（$1<n<2$），放在空气里。近轴的平行光沿一条直径射来。（1）逐个球面求像，证明光会聚在球心后$\frac{nR}{2(n-1)}$处。（2）$n=1.5$时，会聚点在球外多远？
  hints:
    - |
      第一个球面：$n_1=1$，$n_2=n$，$R_1=+R$，$s_1\to\infty$，像距$s_1'=\frac{nR}{n-1}$。
    - |
      第一个球面的像是第二个球面的物：离第二个顶点$s_1'-2R$，在出射一侧，$s_2=2R-s_1'$；第二个球面$n_1=n$，$n_2=1$，球心在玻璃里，$R_2=-R$。
    - |
      算出$s_2'=\frac{R(2-n)}{2(n-1)}$，加上球心到第二个顶点的$R$。
  reference: |
    （1）第一个球面：$\frac{n}{s_1'}=\frac{n-1}{R}$，$s_1'=\frac{nR}{n-1}$；$1<n<2$时$s_1'>2R$，光还没会聚就射到第二个球面上了。第二个球面看到的光正会聚向它后面$s_1'-2R$处，所以$s_2=2R-s_1'=\frac{(n-2)R}{n-1}$，是负的（虚物）。第二个球面上$n_1=n$、$n_2=1$、$R_2=-R$：$\frac{n}{s_2}+\frac{1}{s_2'}=\frac{1-n}{-R}=\frac{n-1}{R}$，代入$\frac{n}{s_2}=\frac{n(n-1)}{(n-2)R}$，得$\frac1{s_2'}=\frac{n-1}{R}\Bigl(1-\frac{n}{n-2}\Bigr)=\frac{2(n-1)}{(2-n)R}$，$s_2'=\frac{(2-n)R}{2(n-1)}$。会聚点到球心的距离是$R+s_2'=\frac{2(n-1)R+(2-n)R}{2(n-1)}=\frac{nR}{2(n-1)}$。

    （2）$n=1.5$时会聚点在球心后$1.5R$，在球外$0.5R$处。玻璃球是一个焦距很短的透镜，焦距和球的大小相当；水珠、玻璃珠能把阳光聚成小亮点，就是这个道理。

- id: p7
  tier: thinking
  statement: |
    设角膜前表面的半径是$7.8\,\mathrm{mm}$、折射率是$1.376$，水的折射率是$1.333$。（1）比较这个表面在空气里和在水里的光焦度。（2）为什么不戴潜水镜在水下睁眼，看什么都模糊？（3）潜水镜为什么能解决这个问题？
  hints:
    - |
      $\Phi=\frac{n_2-n_1}{R}$，水里$n_1=1.333$。
    - |
      眼睛的光焦度大部分来自角膜的前表面，晶状体能调节的范围有限。
    - |
      潜水镜在眼睛前面保留了一层空气。
  reference: |
    （1）空气里$\Phi=\frac{1.376-1}{0.0078\,\mathrm m}\approx48.2\,\mathrm D$（第 4 题）；水里$\Phi=\frac{1.376-1.333}{0.0078\,\mathrm m}\approx5.5\,\mathrm D$，几乎没有了。

    （2）眼睛的光焦度大部分来自角膜和空气的界面。在水里这个界面两边的折射率几乎相同，光焦度一下少了四十多屈光度，晶状体调节的那点光焦度补不回来，远处的物体成像在视网膜后面很远处，视网膜上只有一片模糊的光斑。

    （3）潜水镜的平玻璃前后都是平面，光焦度为零，它在角膜前面保留了一层空气，角膜又是和空气接触，恢复了原来的光焦度，所以能看清（只是水和平玻璃组成的平面使物体看上去近了一些、大了一些）。

- id: p8
  tier: thinking
  statement: |
    （1）分别算出$\theta=5^\circ$、$10^\circ$、$20^\circ$时，用$\theta$代替$\sin\theta$和$\tan\theta$的相对误差。（2）如果一个球面成像时用了离光轴很远的光线，像会怎样？（3）照相机把光圈调小，为什么像往往更清晰？
  hints:
    - |
      角度要换成弧度；相对误差用$\frac{\theta-\sin\theta}{\sin\theta}$、$\frac{\tan\theta-\theta}{\theta}$这样的比值。
    - |
      近轴的成像公式里，$h$消去了；不用近似时，射到不同高度的光线和光轴的交点不同。
    - |
      光圈小，就只让离光轴近的光线通过。
  reference: |
    （1）$5^\circ$：$\sin$差约$0.13\%$，$\tan$差约$0.25\%$；$10^\circ$：约$0.51\%$、$1.03\%$；$20^\circ$：约$2.1\%$、$4.3\%$。误差大致随角度的平方增大。

    （2）射到离光轴远的地方的光线，偏折得比近轴公式算出的多，和光轴交得更靠近球面。从同一物点发出的光不再会聚到一点，而是沿光轴拉成一段，像点变成一个模糊的光斑，这是球差（spherical aberration，见[像差](lesson:physics.optics.aberrations)）。

    （3）光圈只让离光轴近的光线进入镜头，这些光线满足近轴近似，会聚得好，球差就小，像更清晰；代价是进来的光少了，要曝光更长的时间。
