  <line x1="370.0" y1="72.6" x2="400.0" y2="65.1" style="stroke: var(--muted, #6b7280)" stroke-width="1.1" />
  <text x="560.0" y="32.7" style="fill: var(--muted, #6b7280)">4</text>
  <line x1="250.0" y1="330.0" x2="370.0" y2="330.0" style="stroke: currentColor" stroke-width="1.0" />
  <line x1="250.0" y1="325.0" x2="250.0" y2="335.0" style="stroke: currentColor" stroke-width="1.0" />
  <line x1="370.0" y1="325.0" x2="370.0" y2="335.0" style="stroke: currentColor" stroke-width="1.0" />
  <text x="310.0" y="326.0" fill="currentColor" text-anchor="middle"><tspan font-style="italic">d</tspan></text>
  <text x="40.0" y="92.0" fill="currentColor">后一束比前一束：</text>
  <text x="40.0" y="117.0" fill="currentColor">振幅乘 <tspan font-style="italic">R</tspan></text>
  <text x="40.0" y="142.0" fill="currentColor">相位落后 <tspan font-style="italic">δ</tspan></text>
</svg>
