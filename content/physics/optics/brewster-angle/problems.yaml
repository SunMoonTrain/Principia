- id: p1
  tier: easy
  statement: |
    光从空气射到钻石的表面上，钻石的折射率是$2.42$，空气的折射率按$1$算。布儒斯特角是多少度？保留三位有效数字。
  answer:
    type: number
    value: atan(2.42)*180/pi
    unit: |
      $^\circ$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      布儒斯特角满足$\tan\theta_{\mathrm B}=\frac{n_2}{n_1}$。
    - |
      $\theta_{\mathrm B}=\arctan2.42$。
    - |
      $\theta_{\mathrm B}\approx67.5^\circ$。
  solution: |
    $\tan\theta_{\mathrm B}=\frac{2.42}{1}$，$\theta_{\mathrm B}=\arctan2.42\approx67.5^\circ$。折射率越大，布儒斯特角越大，越接近掠射；这时折射角是$90^\circ-67.5^\circ\approx22.5^\circ$，反射光和折射光互相垂直。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        自然光以布儒斯特角射到玻璃上，反射光是电场在入射面内的线偏振光
      - |
        自然光以布儒斯特角射到玻璃上，折射光是线偏振光
      - |
        光从水（$n=1.33$）射向空气的布儒斯特角，和光从空气射向水的布儒斯特角，加起来是$90^\circ$
      - |
        以布儒斯特角入射时，s 偏振的反射率也是零
      - |
        自然光以布儒斯特角射到玻璃上，用偏振片看反射光，偏振片转一圈，会有两次全黑
    value: [3, 5]
  hints:
    - |
      以布儒斯特角入射时，哪种偏振不反射？反射光里剩下的是哪种？
    - |
      两个布儒斯特角的正切分别是$1.33$和$\frac1{1.33}$；线偏振光透过转动的偏振片，透振方向和偏振方向垂直时全黑。
    - |
      C、E 对；A、B、D 错。
  solution: |
    C 对：$\tan\theta_1=1.33$，$\tan\theta_2=\frac1{1.33}=\cot\theta_1$，所以$\theta_1+\theta_2=90^\circ$。E 对：反射光是线偏振光，偏振片的透振方向转到和它垂直时全黑，一圈里有两个这样的位置，相隔$180^\circ$。

    A 错：不反射的是 p 偏振，反射光只剩 s 偏振，电场垂直于入射面。B 错：折射光里 p 偏振全部透过，s 偏振也大部分透过，是部分偏振光。D 错：这时$r_{\mathrm s}=\frac{n_1^2-n_2^2}{n_1^2+n_2^2}$，不为零。

- id: p3
  tier: medium
  statement: |
    自然光以布儒斯特角射到平静的水面上，水的折射率取$1.33$。反射光的光强是入射光强的百分之几？保留三位有效数字。
  answer:
    type: number
    value: 0.5*((1.33^2 - 1)/(1.33^2 + 1))^2*100
    unit: |
      $\%$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      反射光里只有 s 偏振，自然光里 s 偏振占一半。
    - |
      布儒斯特角下$r_{\mathrm s}=\frac{n_1^2-n_2^2}{n_1^2+n_2^2}$，反射率$R_{\mathrm s}=r_{\mathrm s}^2$。
    - |
      $R_{\mathrm s}=\Bigl(\frac{0.7689}{2.7689}\Bigr)^2\approx0.0771$，反射光占$\frac12R_{\mathrm s}\approx3.86\%$。
  solution: |
    $r_{\mathrm s}=\frac{1-1.33^2}{1+1.33^2}=\frac{-0.7689}{2.7689}\approx-0.278$，$R_{\mathrm s}\approx0.0771$。自然光里 s 偏振、p 偏振各占一半，p 偏振不反射，反射光是入射光的$\frac12\times0.0771\approx3.86\%$。也可以先算$\theta_{\mathrm B}\approx53.1^\circ$、$\theta_{\mathrm T}\approx36.9^\circ$，代入菲涅耳公式，结果一样。反射光虽然完全偏振，却只有入射光的几十分之一。

- id: p4
  tier: medium
  statement: |
    自然光以$45^\circ$的入射角从空气射到玻璃上，玻璃的折射率是$1.52$。反射光的偏振度是多少？保留三位有效数字。
  answer:
    type: number
    value: (((sqrt(0.5) - 1.52*sqrt(1 - 0.5/1.52^2))/(sqrt(0.5) + 1.52*sqrt(1 - 0.5/1.52^2)))^2 - ((sqrt(1 - 0.5/1.52^2) - 1.52*sqrt(0.5))/(sqrt(1 - 0.5/1.52^2) + 1.52*sqrt(0.5)))^2)/(((sqrt(0.5) - 1.52*sqrt(1 - 0.5/1.52^2))/(sqrt(0.5) + 1.52*sqrt(1 - 0.5/1.52^2)))^2 + ((sqrt(1 - 0.5/1.52^2) - 1.52*sqrt(0.5))/(sqrt(1 - 0.5/1.52^2) + 1.52*sqrt(0.5)))^2)
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      先由折射定律求$\cos\theta_{\mathrm T}$，再用菲涅耳公式求$r_{\mathrm s}$、$r_{\mathrm p}$。
    - |
      自然光入射时，反射光的偏振度$P=\frac{R_{\mathrm s}-R_{\mathrm p}}{R_{\mathrm s}+R_{\mathrm p}}$。
    - |
      $\cos\theta_{\mathrm T}\approx0.8852$，$R_{\mathrm s}\approx0.0967$，$R_{\mathrm p}\approx0.00936$，$P\approx0.824$。
  solution: |
    $\sin\theta_{\mathrm T}=\frac{\sin45^\circ}{1.52}\approx0.4652$，$\cos\theta_{\mathrm T}\approx0.8852$。$r_{\mathrm s}=\frac{0.7071-1.52\times0.8852}{0.7071+1.52\times0.8852}\approx-0.311$，$R_{\mathrm s}\approx0.0967$；$r_{\mathrm p}=\frac{0.8852-1.52\times0.7071}{0.8852+1.52\times0.7071}\approx-0.0967$，$R_{\mathrm p}\approx0.00936$。自然光里两种偏振各占一半，转动偏振片时$I_{\max}\propto R_{\mathrm s}$，$I_{\min}\propto R_{\mathrm p}$，$P=\frac{0.0967-0.00936}{0.0967+0.00936}\approx0.824$：离布儒斯特角还有十来度，反射光已经大部分偏振了。

- id: p5
  tier: hard
  statement: |
    （1）证明以布儒斯特角入射时，s 偏振的振幅反射系数$r_{\mathrm s}=\frac{n_1^2-n_2^2}{n_1^2+n_2^2}$。

    （2）把$N$块平行玻璃板（$n=1.50$）叠成一摞，自然光以布儒斯特角射入，不计吸收和板之间的多次反射。证明透射光的偏振度是$P=\frac{1-T^N}{1+T^N}$，$T=(1-R_{\mathrm s})^2$；要使$P\ge0.9$，至少要几块？

    （3）实际上板与板之间、板内两个表面之间的多次反射不能完全忽略。考虑多次反射，透射光的偏振度比（2）的结果大还是小？
  hints:
    - |
      布儒斯特角下$\theta_{\mathrm I}+\theta_{\mathrm T}=90^\circ$，$\cos\theta_{\mathrm T}=\sin\theta_{\mathrm I}$，$\tan\theta_{\mathrm I}=\frac{n_2}{n_1}$。
    - |
      p 偏振在每个表面上都不反射；s 偏振每块板透过$(1-R_{\mathrm s})^2$，$R_{\mathrm s}\approx0.148$。
    - |
      $T^N\le\frac{1-0.9}{1+0.9}$，$N\ge\frac{\ln0.0526}{\ln0.726}\approx9.2$。
  reference: |
    （1）$\tan\theta_{\mathrm I}=\frac{n_2}{n_1}$，所以$\sin\theta_{\mathrm I}=\frac{n_2}{\sqrt{n_1^2+n_2^2}}$，$\cos\theta_{\mathrm I}=\frac{n_1}{\sqrt{n_1^2+n_2^2}}$；又$\cos\theta_{\mathrm T}=\sin\theta_{\mathrm I}$。代入$r_{\mathrm s}=\frac{n_1\cos\theta_{\mathrm I}-n_2\cos\theta_{\mathrm T}}{n_1\cos\theta_{\mathrm I}+n_2\cos\theta_{\mathrm T}}=\frac{n_1^2-n_2^2}{n_1^2+n_2^2}$。

    （2）进入第一块板的折射角$\theta_{\mathrm T}$满足$\tan\theta_{\mathrm T}=\frac{n_1}{n_2}$，正是玻璃射向空气的布儒斯特角，射出后又以$\theta_{\mathrm B}$射向下一块，所以 p 偏振在每个表面上都不反射，全部透过。s 偏振在两个方向的界面上$r_{\mathrm s}$只差正负号，每个表面透过$1-R_{\mathrm s}$，每块板透过$T=(1-R_{\mathrm s})^2$，$N$块透过$T^N$。自然光入射时，透射光里 p 偏振占入射光的$\frac12$，s 偏振占$\frac12T^N$，转动偏振片，$I_{\max}=\frac12$，$I_{\min}=\frac12T^N$，所以$P=\frac{1-T^N}{1+T^N}$。

    $n=1.50$时$r_{\mathrm s}=\frac{1-2.25}{3.25}\approx-0.385$，$R_{\mathrm s}\approx0.148$，$T\approx0.726$。$P\ge0.9$要求$T^N\le\frac1{19}\approx0.0526$，$N\ge9.2$，至少$10$块，这时$P\approx0.92$。

    （3）偏振度会变小。被反射掉的 s 偏振光，有一部分在别的表面上再反射一次，又转回前进的方向，跟着透射光出来，透射光里的 s 偏振就比$T^N$多；p 偏振没有这部分的影响。所以实际的玻璃片堆要用更多的板，才能达到同样的偏振度。

- id: p6
  tier: hard
  statement: |
    氦氖激光器的放电管两端各封着一块平行玻璃板作窗口（$n=1.50$），窗口斜放，使管里的光以布儒斯特角射到窗口上；两面反射镜在管外，光在两镜之间来回反射（见[激光](lesson:physics.optics.lasers)）。

    （1）证明光以布儒斯特角射入平行玻璃板后，在第二个表面上的入射角正好是玻璃射向空气的布儒斯特角。（2）光在两镜之间来回一趟，要穿过窗口几次、经过几个表面？不计吸收，s 偏振和 p 偏振来回一趟各剩下多少？

    （3）放电管里的光每走一趟只能放大百分之几，为什么这样的激光器射出的光是线偏振的？偏振方向沿什么方向？
  hints:
    - |
      第二个表面上的入射角等于第一个表面上的折射角$\theta_{\mathrm T}$，看$\tan\theta_{\mathrm T}$是多少。
    - |
      来回一趟，两块窗口各穿过两次，每次两个表面；s 偏振每个表面透过$1-R_{\mathrm s}$，$R_{\mathrm s}\approx0.148$。
    - |
      来回一趟，s 偏振剩下$(1-0.148)^8\approx0.28$，p 偏振不受损失。
  reference: |
    （1）第一个表面上$\theta_{\mathrm I}+\theta_{\mathrm T}=90^\circ$，$\tan\theta_{\mathrm T}=\cot\theta_{\mathrm I}=\frac1{1.50}$。两个表面平行，光在第二个表面上的入射角就是$\theta_{\mathrm T}$，而玻璃射向空气的布儒斯特角满足$\tan\theta=\frac1{1.50}$，两者相等。

    （2）来回一趟，两块窗口各穿过两次，共$4$次、$8$个表面。p 偏振在每个表面上都不反射，来回一趟没有损失；s 偏振每个表面反射$R_{\mathrm s}=\Bigl(\frac{1-2.25}{3.25}\Bigr)^2\approx0.148$，来回一趟剩下$(1-0.148)^8\approx0.28$。

    （3）激光要靠光在两镜之间来回走许多趟、一趟趟放大才建立起来，每趟的损失必须小于放大的那几个百分点。s 偏振每趟损失七成多，根本放大不起来；p 偏振在窗口上没有损失，能够起振。所以射出的光是 p 偏振的线偏振光，电场在由管轴和窗口法线确定的入射面内。这样的窗口叫布儒斯特窗，它既避免了窗口反射造成的损失，又顺带让激光成为线偏振光。

- id: p7
  tier: thinking
  statement: |
    隔着商店的橱窗拍里面的东西，玻璃上总映着街景。摄影师常在镜头前加一片偏振镜，转到某个角度，斜着拍。

    （1）为什么斜着拍、转动偏振镜能把玻璃的反光去掉大半？（2）大约从什么角度拍效果最好？偏振镜的透振方向该怎样放？（3）正对着橱窗拍，偏振镜还有用吗？
  hints:
    - |
      反光里 s 偏振和 p 偏振各有多少，随入射角怎样变？
    - |
      玻璃的布儒斯特角约$56^\circ$；反光的电场垂直于入射面。
    - |
      垂直入射时，两种偏振的反射率相同。
  reference: |
    （1）街景的光射到橱窗上再反射进镜头，反射光里 s 偏振比 p 偏振多得多，是偏振度很高的部分偏振光。偏振镜的透振方向转到和反光的电场垂直，就能挡掉它的大部分；橱窗里的东西发出的光透过玻璃，大体还是自然光，只损失一半左右。

    （2）从和玻璃的法线成约$56^\circ$（玻璃的布儒斯特角）的方向拍，反光几乎全是 s 偏振，偏振度接近$1$，几乎能完全挡掉。反光的电场垂直于入射面：竖直的橱窗、水平地斜着拍时，入射面是水平的，反光的电场沿竖直方向，偏振镜的透振方向就该转到水平方向。

    （3）用处很小。垂直入射时 s 偏振和 p 偏振的反射率一样，反光基本不偏振，转动偏振镜挡掉的反光和透过的景物同样都是一半，反光照样在。所以想去掉反光，要斜着拍，离布儒斯特角越近越好。

- id: p8
  tier: thinking
  statement: |
    用偶极子的图像想一想：（1）天空的散射光在和太阳方向成$90^\circ$的那一圈偏振最强（见[电偶极辐射](lesson:physics.electromagnetism.dipole-radiation)第 7 题），这和以布儒斯特角反射的光完全偏振，是不是同一个道理？（2）对 s 偏振，有没有一个入射角使反射光为零？（3）偏振太阳镜的透振方向是竖直的。开车时，旁边车辆竖直的侧窗玻璃反射过来的阳光，它能挡住吗？
  hints:
    - |
      两件事里，都有一个方向正好沿着振荡电偶极子的轴线。
    - |
      s 偏振时偶极子垂直于入射面振动，入射面里有没有沿它轴线的方向？
    - |
      侧窗是竖直的，从旁边射过来的光，入射面是水平的。
  reference: |
    （1）是同一个道理。阳光推动空气分子里的电子沿垂直于阳光的方向振动；在和阳光成$90^\circ$的方向上看，沿视线方向振动的那部分偶极子正对着眼睛，沿轴线不辐射，只有另一个方向振动的偶极子把光送过来，散射光就是线偏振的。布儒斯特角下，p 偏振的偶极子正好沿着反射方向，同样沿轴线不辐射，反射光只剩一种偏振。

    （2）没有。s 偏振时偶极子垂直于入射面振动，入射面里所有方向都和它的轴线垂直，偶极子朝这些方向都辐射，反射光不会在哪个角度消失；菲涅耳公式里不显磁性的介质$r_{\mathrm s}$也只在$n_1=n_2$时为零。

    （3）挡不住。侧窗是竖直的，阳光从旁边射来、反射到眼里，入射面大致是水平的，反光里占多数的 s 偏振电场垂直于入射面，是竖直的，正好沿着太阳镜的透振方向，能透过去。偏振太阳镜是按水平的湖面、路面设计的，那时入射面竖直，反光的电场才是水平的。
