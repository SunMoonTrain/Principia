<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-size="14">
  <!-- 布儒斯特角：自然光以布儒斯特角 θB 从空气射到玻璃上（n2/n1 = 1.5），纸面是入射面。反射光和折射光互相垂直。入射光里电场垂直纸面的 s 偏振（点）和在纸面内的 p 偏振（短线）都有；折射光里两种都有；p 偏振的折射光推着玻璃里的电子沿垂直于折射光的方向振动，这个方向正好沿着反射光，振荡的偶极子沿轴线不辐射，所以反射光里没有 p 偏振，只剩 s 偏振。 -->
