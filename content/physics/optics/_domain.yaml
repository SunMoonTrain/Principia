id: physics.optics
title: |
  光学
proofPolicy: sketch
macros:
  \vb: |
    \mathbf{#1}
  \dd: |
    \mathop{}\!\mathrm{d}
  \dv: |
    \frac{\mathrm{d} #1}{\mathrm{d} #2}
glossary:
  - id: physics.optics.refractive-index
    zh: |
      折射率
    en: |
      refractive index
    brief: |
      真空中的光速和光在介质里的速度之比$n=\frac cv$；光从一种介质进入另一种时偏折多少，由两边的折射率按折射定律决定。
    definedIn: physics.optics.reflection-refraction
    anchor: def-refractive-index
  - id: physics.optics.law-of-reflection
    zh: |
      反射定律
    en: |
      law of reflection
    brief: |
      反射光线在入射面内，和入射光线分居法线两侧，反射角等于入射角。
    definedIn: physics.optics.reflection-refraction
    anchor: thm-reflection
  - id: physics.optics.law-of-refraction
    zh: |
      折射定律
    en: |
      law of refraction
    brief: |
      折射光线在入射面内，和入射光线分居法线两侧，入射角和折射角满足$n_1\sin\theta_1=n_2\sin\theta_2$；也叫斯涅耳定律。
    definedIn: physics.optics.reflection-refraction
    anchor: thm-snell
  - id: physics.optics.reversibility
    zh: |
      光路可逆
    en: |
      principle of reversibility
    brief: |
      光沿某条路径从一点传到另一点，从后一点沿这条路径反向射出的光，也会沿原路传回前一点。
    definedIn: physics.optics.reflection-refraction
    anchor: thm-reversibility
  - id: physics.optics.dispersion
    zh: |
      色散
    en: |
      dispersion
    brief: |
      介质的折射率随光的波长变化的现象；玻璃、水在可见光范围里波长越短折射率越大，白光经过棱镜因此分成彩色。
    definedIn: physics.optics.prisms-dispersion
    anchor: def-dispersion
  - id: physics.optics.abbe-number
    zh: |
      阿贝数
    en: |
      Abbe number
    brief: |
      $V=\frac{n_{\mathrm d}-1}{n_{\mathrm F}-n_{\mathrm C}}$，用玻璃对 d 线的折射率和 F、C 两条谱线的折射率之差算出；阿贝数越大，偏折同样多时颜色分得越少。
    definedIn: physics.optics.prisms-dispersion
    anchor: def-abbe-number
  - id: physics.optics.thin-prism
    zh: |
      薄棱镜
    en: |
      thin prism
    brief: |
      顶角很小的棱镜；光接近垂直地射入时，偏向角约为$(n-1)\alpha$，和入射角无关。
    definedIn: physics.optics.prisms-dispersion
    anchor: def-thin-prism
  - id: physics.optics.crown-glass
    zh: |
      冕牌玻璃
    en: |
      crown glass
    brief: |
      阿贝数大、色散小的光学玻璃，例如阿贝数约为$64$的 N-BK7。
    definedIn: physics.optics.prisms-dispersion
    anchor: def-crown-flint
  - id: physics.optics.flint-glass
    zh: |
      火石玻璃
    en: |
      flint glass
    brief: |
      阿贝数小、色散大的光学玻璃，例如阿贝数约为$36$的 N-F2；折射率一般也比冕牌玻璃大。
    definedIn: physics.optics.prisms-dispersion
    anchor: def-crown-flint
  - id: physics.optics.critical-angle
    zh: |
      临界角
    en: |
      critical angle
    brief: |
      光从折射率较大的介质射向折射率较小的介质时，折射角等于$90^\circ$的那个入射角，$\sin\theta_{\mathrm c}=\frac{n_2}{n_1}$；入射角比它大就没有折射光。
    definedIn: physics.optics.total-internal-reflection
    anchor: def-critical-angle
  - id: physics.optics.total-internal-reflection
    zh: |
      全反射
    en: |
      total internal reflection
    brief: |
      光从折射率较大的介质射向折射率较小的介质，入射角大于临界角时，在界面上全部反射、没有折射光的现象。
    definedIn: physics.optics.total-internal-reflection
    anchor: def-tir
  - id: physics.optics.numerical-aperture
    zh: |
      数值孔径
    en: |
      numerical aperture
    abbr: |
      NA
    brief: |
      能被光纤收下、靠全反射传下去的光，在端面外和轴的最大夹角的正弦；纤芯、包层的折射率为$n_1$、$n_2$时等于$\sqrt{n_1^2-n_2^2}$。
    definedIn: physics.optics.total-internal-reflection
    anchor: def-numerical-aperture
  - id: physics.optics.optical-axis
    zh: |
      光轴
    en: |
      optical axis
    brief: |
      过球面的球心和顶点的直线；各个球面的球心都在同一条直线上时，这条直线是整个光学系统的光轴，也是它的对称轴。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-optical-axis
  - id: physics.optics.paraxial-approximation
    zh: |
      近轴近似
    en: |
      paraxial approximation
    brief: |
      只考虑和光轴夹角小、离光轴近的光线，把角度的正弦、正切换成角度本身；这时一点发出的光经过球面会聚到一点。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-paraxial
  - id: physics.optics.paraxial-ray
    zh: |
      近轴光线
    en: |
      paraxial ray
    brief: |
      和光轴的夹角很小、离光轴也很近的光线；只考虑这样的光线，就能用近轴近似处理成像。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-paraxial
  - id: physics.optics.real-image
    zh: |
      实像
    en: |
      real image
    brief: |
      从物点发出的光经过光学系统以后真正会聚而成的像，能用屏接住。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-image
  - id: physics.optics.virtual-image
    zh: |
      虚像
    en: |
      virtual image
    brief: |
      射出的光并不会聚，只是它们的反向延长线交于一点所成的像；屏接不到，眼睛看得见，平面镜里的像就是虚像。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-image
  - id: physics.optics.object-distance
    zh: |
      物距
    en: |
      object distance
    brief: |
      物点到球面顶点（或透镜中心）沿光轴的距离$s$；按符号规则，物在入射一侧时为正。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-sign-convention
  - id: physics.optics.image-distance
    zh: |
      像距
    en: |
      image distance
    brief: |
      像点到球面顶点（或透镜中心）沿光轴的距离$s'$；按符号规则，像在出射一侧时为正，是实像，为负时是虚像。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-sign-convention
  - id: physics.optics.sign-convention
    zh: |
      符号规则
    en: |
      sign convention
    brief: |
      光从左向右射来；物在入射一侧时物距为正，像在出射一侧时像距为正，球心在出射一侧时半径为正，物、像在光轴上方时高度为正。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-sign-convention
  - id: physics.optics.virtual-object
    zh: |
      虚物
    en: |
      virtual object
    brief: |
      射来的光正会聚向一点、还没会聚就遇到了球面或透镜时，这一点就是虚物；它在出射一侧，物距为负。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-sign-convention
  - id: physics.optics.focal-point
    zh: |
      焦点
    en: |
      focal point
    brief: |
      平行于光轴射来的光经过光学系统后会聚的点（像方焦点），或者发出的光经过系统后变成平行光的点（物方焦点）。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-focal
  - id: physics.optics.focal-length
    zh: |
      焦距
    en: |
      focal length
    brief: |
      焦点到球面顶点（或透镜中心）的距离；单个球面的像方焦距$f_2=\frac{n_2R}{n_2-n_1}$，物方焦距$f_1=\frac{n_1R}{n_2-n_1}$。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-focal
  - id: physics.optics.optical-power
    zh: |
      光焦度
    en: |
      optical power
    brief: |
      表示把光偏折得多厉害的量，单个球面$\Phi=\frac{n_2-n_1}{R}$；单位是$\mathrm m^{-1}$，叫作屈光度。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-power
  - id: physics.optics.diopter
    zh: |
      屈光度
    en: |
      diopter
    brief: |
      光焦度的单位，记作$\mathrm D$，等于$\mathrm m^{-1}$；光焦度越大，把光偏折得越厉害。
    definedIn: physics.optics.paraxial-refraction
    anchor: def-power
  - id: physics.optics.lateral-magnification
    zh: |
      横向放大率
    en: |
      lateral magnification
    brief: |
      像高和物高之比$m=\frac{y'}{y}$；$m<0$时像倒立，$|m|>1$时像比物大。
    definedIn: physics.optics.paraxial-refraction
    anchor: thm-magnification
  - id: physics.optics.thin-lens
    zh: |
      薄透镜
    en: |
      thin lens
    brief: |
      厚度比两面的半径、物距、像距都小得多的透镜，把两个折射面看作在同一个位置；成像公式是$\frac1s+\frac1{s'}=\frac1f$。
    definedIn: physics.optics.thin-lenses
    anchor: def-thin-lens
  - id: physics.optics.optical-center
    zh: |
      光心
    en: |
      optical center
    brief: |
      薄透镜两个面和光轴交点处的那一点；过光心的光线穿过透镜时方向不变。
    definedIn: physics.optics.thin-lenses
    anchor: def-thin-lens
  - id: physics.optics.lensmakers-equation
    zh: |
      磨镜者公式
    en: |
      lensmaker's equation
    brief: |
      空气中的薄透镜焦距$\frac1f=(n-1)\Bigl(\frac1{R_1}-\frac1{R_2}\Bigr)$，由玻璃的折射率和两面的半径决定。
    definedIn: physics.optics.thin-lenses
    anchor: thm-lensmaker
  - id: physics.optics.aberration
    zh: |
      像差
    en: |
      aberration
    brief: |
      实际的光学系统所成的像和近轴理论预言的理想像之间的偏差，例如球差和色差。
    definedIn: physics.optics.aberrations
    anchor: def-aberration
  - id: physics.optics.spherical-aberration
    zh: |
      球差
    en: |
      spherical aberration
    brief: |
      离光轴远近不同的平行光线经过球面后会聚到光轴上不同的点，像点拉成一段；离光轴越远的光线会聚得越靠近镜面或透镜。
    definedIn: physics.optics.aberrations
    anchor: def-spherical-aberration
  - id: physics.optics.aperture-stop
    zh: |
      光阑
    en: |
      aperture stop
    brief: |
      光学系统里限制光束粗细的开孔，例如照相机的光圈；缩小光阑可以挡掉离光轴远的光、减小球差。
    definedIn: physics.optics.aberrations
    anchor: def-stop
  - id: physics.optics.chromatic-aberration
    zh: |
      色差
    en: |
      chromatic aberration
    brief: |
      透镜对不同颜色的折射率不同、焦距不同，不同颜色的像成在不同位置；单透镜的 C、F 线焦距之差约为焦距除以阿贝数。
    definedIn: physics.optics.aberrations
    anchor: def-chromatic-aberration
  - id: physics.optics.angular-magnification
    zh: |
      角放大率
    en: |
      angular magnification
    brief: |
      通过仪器看到的像对眼睛所张的角和不用仪器直接看物体时所张的角之比；像倒立时为负。
    definedIn: physics.optics.optical-instruments
    anchor: def-angular-magnification
  - id: physics.optics.ray-transfer-matrix
    zh: |
      光线传输矩阵
    en: |
      ray transfer matrix
    brief: |
      近轴光线从一个参考面到另一个参考面时，把高度和角度变成新的高度和角度的$2\times2$矩阵，也叫 ABCD 矩阵。
    definedIn: physics.optics.ray-transfer-matrices
    anchor: def-ray-transfer-matrix
  - id: physics.optics.effective-focal-length
    zh: |
      等效焦距
    en: |
      effective focal length
    brief: |
      光学系统对平行光的作用和一块薄透镜相同时，这块薄透镜的焦距；由系统矩阵左下角的元素算出，$f=-\frac1C$。
    definedIn: physics.optics.ray-transfer-matrices
    anchor: thm-read-matrix
  - id: physics.optics.optical-path-length
    zh: |
      光程
    en: |
      optical path length
    brief: |
      折射率和几何路程的乘积$ns$，几段相加；等于同样时间里光在真空中走的路程，比较光程就是比较用时。
    definedIn: physics.optics.fermat-principle
    anchor: def-optical-path
  - id: physics.optics.fermat-principle
    zh: |
      费马原理
    en: |
      Fermat's principle
    brief: |
      光从一点传到另一点，沿光程取极值的路径传播；多数情况下是最小值，即光走用时最短的路径。
    definedIn: physics.optics.fermat-principle
    anchor: def-fermat
  - id: physics.optics.graded-index
    zh: |
      渐变折射率
    en: |
      graded index
    abbr: |
      GRIN
    brief: |
      折射率在介质里连续变化，而不是只在界面上突变；这样的介质里光线不走直线，向折射率大的一侧连续弯曲。
    definedIn: physics.optics.graded-index
    anchor: def-grin
  - id: physics.optics.wavefront
    zh: |
      波阵面
    en: |
      wavefront
    brief: |
      波传播时，同一时刻振动相位相同的各点连成的面；在各向同性的介质里，光线和波阵面处处垂直。
    definedIn: physics.optics.huygens-principle
    anchor: def-wavefront
  - id: physics.optics.huygens-principle
    zh: |
      惠更斯原理
    en: |
      Huygens' principle
    brief: |
      波阵面上每一点都可以看作发出次波的波源，过一段时间，这些次波的包络就是新的波阵面。
    definedIn: physics.optics.huygens-principle
    anchor: def-huygens
  - id: physics.optics.secondary-wavelet
    zh: |
      次波
    en: |
      secondary wavelet
    brief: |
      惠更斯原理里，从波阵面上每一点发出、以波在那里的速度向外传播的球面波。
    definedIn: physics.optics.huygens-principle
    anchor: def-huygens
  - id: physics.optics.interference
    zh: |
      干涉
    en: |
      interference
    brief: |
      两列相干光叠加时，有的地方加强、有的地方减弱，叠加后的光强不等于两列光强之和。
    definedIn: physics.optics.two-beam-interference
    anchor: def-interference
  - id: physics.optics.coherent-light
    zh: |
      相干光
    en: |
      coherent light
    brief: |
      频率相同、相位差保持不变、能产生干涉的光；两个独立的普通光源发出的光不相干。
    definedIn: physics.optics.two-beam-interference
    anchor: def-interference
  - id: physics.optics.optical-path-difference
    zh: |
      光程差
    en: |
      optical path difference
    brief: |
      两条路径的光程之差$\Delta$，对应的相位差是$\frac{2\pi\Delta}{\lambda}$，$\lambda$是真空中的波长。
    definedIn: physics.optics.two-beam-interference
    anchor: def-opd
  - id: physics.optics.young-double-slit
    zh: |
      杨氏双缝干涉
    en: |
      Young's double-slit interference
    brief: |
      光穿过两条靠得很近的平行细缝，在远处的屏上叠加成等间距的明暗条纹，条纹间距$\frac{L\lambda}d$。
    definedIn: physics.optics.two-beam-interference
    anchor: thm-young
  - id: physics.optics.fringe-visibility
    zh: |
      条纹可见度
    en: |
      fringe visibility
    brief: |
      干涉条纹最亮处和最暗处光强之差与两者之和的比$V=\frac{I_{\max}-I_{\min}}{I_{\max}+I_{\min}}$，在$0$到$1$之间，越大条纹越清楚。
    definedIn: physics.optics.coherence
    anchor: def-visibility
  - id: physics.optics.coherence-length
    zh: |
      相干长度
    en: |
      coherence length
    brief: |
      一束光分成两束再会合，光程差增大到条纹基本看不见时的光程差，约为$\frac{\lambda^2}{\Delta\lambda}$；光的波长范围越窄，相干长度越长。
    definedIn: physics.optics.coherence
    anchor: def-coherence-length
  - id: physics.optics.coherence-time
    zh: |
      相干时间
    en: |
      coherence time
    brief: |
      光在真空中走过相干长度所用的时间$\tau_c=\frac{l_c}c$，约为光的频率范围的倒数$\frac1{\Delta\nu}$。
    definedIn: physics.optics.coherence
    anchor: def-coherence-length
  - id: physics.optics.temporal-coherence
    zh: |
      时间相干性
    en: |
      temporal coherence
    brief: |
      一束光和它自己延迟一段时间后的光能够干涉的性质，由光的波长范围决定，用相干长度或相干时间衡量。
    definedIn: physics.optics.coherence
    anchor: def-coherence-length
  - id: physics.optics.coherence-width
    zh: |
      相干宽度
    en: |
      coherence width
    brief: |
      光源不动，把双缝间距增大到条纹基本看不见时的缝间距，约为$\frac{\lambda}{\theta_s}$，$\theta_s$是光源对双缝张的角。
    definedIn: physics.optics.coherence
    anchor: def-spatial-coherence
  - id: physics.optics.spatial-coherence
    zh: |
      空间相干性
    en: |
      spatial coherence
    brief: |
      同一波阵面上横向分开的两点的光振动能够干涉的性质，由光源对观察处张的角决定，用相干宽度衡量。
    definedIn: physics.optics.coherence
    anchor: def-spatial-coherence
  - id: physics.optics.diffraction
    zh: |
      衍射
    en: |
      diffraction
    brief: |
      光遇到障碍物，或穿过小孔、窄缝时，偏离直线传播、进入几何阴影的现象；缝宽为$a$时，光偏离的角度约为$\frac\lambda a$。
    definedIn: physics.optics.single-slit-diffraction
    anchor: def-diffraction
  - id: physics.optics.huygens-fresnel-principle
    zh: |
      惠更斯-菲涅耳原理
    en: |
      Huygens–Fresnel principle
    brief: |
      波阵面上各点发出的次波按到达时的相位叠加，叠加的结果就是空间各点的光振动；由它可以算出衍射图样。
    definedIn: physics.optics.single-slit-diffraction
    anchor: def-huygens-fresnel
  - id: physics.optics.fraunhofer-diffraction
    zh: |
      夫琅禾费衍射
    en: |
      Fraunhofer diffraction
    brief: |
      平行光照到障碍物上、在足够远处观察（对宽为$a$的缝，距离远大于$\frac{a^2}\lambda$）的衍射；到达观察点的各条光线可以看成互相平行。
    definedIn: physics.optics.single-slit-diffraction
    anchor: def-fraunhofer
  - id: physics.optics.half-wave-loss
    zh: |
      半波损失
    en: |
      half-wave loss
    brief: |
      光接近垂直入射、从折射率小的介质射向折射率大的介质反射时，相位突变$\pi$，相当于多走了半个波长；反过来反射时没有。
    definedIn: physics.optics.thin-film-interference
    anchor: def-half-wave-loss
  - id: physics.optics.thin-film-interference
    zh: |
      薄膜干涉
    en: |
      thin-film interference
    brief: |
      薄膜上下两个表面反射（或透射）的光相互干涉；光程差$2nt\cos\theta_t$，两次反射里恰有一次半波损失时再加半个波长。
    definedIn: physics.optics.thin-film-interference
    anchor: def-thin-film
  - id: physics.optics.antireflection-coating
    zh: |
      增透膜
    en: |
      antireflection coating
    brief: |
      镀在玻璃表面、折射率介于空气和玻璃之间、厚度为$\frac\lambda{4n}$的膜，上下两个表面的反射光相互抵消，反射减少、透射增加。
    definedIn: physics.optics.thin-film-interference
    anchor: def-ar-coating
  - id: physics.optics.equal-thickness-fringes
    zh: |
      等厚条纹
    en: |
      fringes of equal thickness
    brief: |
      膜厚各处不同、光接近垂直入射时，沿膜厚相同的地方分布的干涉条纹；相邻两条亮纹处膜厚相差$\frac\lambda{2n}$。
    definedIn: physics.optics.thin-film-interference
    anchor: def-equal-thickness
  - id: physics.optics.newtons-rings
    zh: |
      牛顿环
    en: |
      Newton's rings
    brief: |
      平凸透镜放在平板玻璃上，两者之间的空气层产生的同心圆环形等厚条纹；从反射光看，第$m$个暗环的半径为$\sqrt{mR\lambda}$。
    definedIn: physics.optics.thin-film-interference
    anchor: def-newtons-rings
  - id: physics.optics.diffraction-grating
    zh: |
      衍射光栅
    en: |
      diffraction grating
    brief: |
      刻有大量等宽、等间距平行狭缝（或反射刻痕）的平板；各缝的光叠加，在少数几个方向上形成又细又亮的亮纹，用来分光。
    definedIn: physics.optics.diffraction-gratings
    anchor: def-grating
  - id: physics.optics.grating-constant
    zh: |
      光栅常量
    en: |
      grating constant
    brief: |
      光栅上相邻两条缝对应点之间的距离$d$，常见的光栅在微米量级。
    definedIn: physics.optics.diffraction-gratings
    anchor: def-grating
  - id: physics.optics.grating-equation
    zh: |
      光栅方程
    en: |
      grating equation
    brief: |
      平行光垂直照射时，光栅各缝的光相互加强的方向满足$d\sin\theta=m\lambda$，$m$是整数。
    definedIn: physics.optics.diffraction-gratings
    anchor: thm-grating-equation
  - id: physics.optics.principal-maximum
    zh: |
      主极大
    en: |
      principal maximum
    brief: |
      光栅衍射中满足光栅方程的方向上，所有缝的光同相，形成的又细又亮的亮纹；整数$m$是它的级次。
    definedIn: physics.optics.diffraction-gratings
    anchor: def-principal-maximum
  - id: physics.optics.missing-order
    zh: |
      缺级
    en: |
      missing order
    brief: |
      某一级主极大的方向正好落在单缝衍射的暗纹上，这一级看不到；光栅常量是缝宽的$k$倍时，第$k$、$2k$……级缺级。
    definedIn: physics.optics.diffraction-gratings
    anchor: def-missing-order
  - id: physics.optics.chromatic-resolving-power
    zh: |
      色分辨本领
    en: |
      chromatic resolving power
    brief: |
      光栅刚好能分开的两条谱线，波长与波长差之比$R=\frac\lambda{\Delta\lambda}$；在第$m$级、照亮$N$条缝时$R=mN$。
    definedIn: physics.optics.diffraction-gratings
    anchor: def-chromatic-resolving-power
  - id: physics.optics.multiple-beam-interference
    zh: |
      多光束干涉
    en: |
      multiple-beam interference
    brief: |
      光在两个平行表面之间多次反射，分出的许多束光相互叠加产生的干涉；表面反射率高时，透射峰变得又细又尖。
    definedIn: physics.optics.fabry-perot
    anchor: def-multiple-beam
  - id: physics.optics.fabry-perot-interferometer
    zh: |
      法布里-珀罗干涉仪
    en: |
      Fabry–Pérot interferometer
    brief: |
      两块平行玻璃板相对的表面镀上高反射膜，利用透射光的多光束干涉精密测量波长的装置。
    definedIn: physics.optics.fabry-perot
    anchor: def-fabry-perot
  - id: physics.optics.finesse
    zh: |
      精细度
    en: |
      finesse
    brief: |
      相邻两个透射峰的间隔和一个峰在一半高度处的宽度之比；反射率$R$接近$1$时为$\frac{\pi\sqrt R}{1-R}$。
    definedIn: physics.optics.fabry-perot
    anchor: def-finesse
  - id: physics.optics.free-spectral-range
    zh: |
      自由光谱范围
    en: |
      free spectral range
    brief: |
      相邻两个透射峰对应的频率差，垂直入射时为$\frac c{2nd}$；谱线的频率差超过它，不同级的峰会混在一起。
    definedIn: physics.optics.fabry-perot
    anchor: def-fsr
  - id: physics.optics.fiber-core
    zh: |
      纤芯
    en: |
      core
    brief: |
      光纤中心传光的部分，折射率比外面的包层稍大，光在它和包层的界面上全反射，一路传下去。
    definedIn: physics.optics.total-internal-reflection
    anchor: def-core-cladding
  - id: physics.optics.cladding
    zh: |
      包层
    en: |
      cladding
    brief: |
      包在光纤纤芯外面、折射率稍小的一层玻璃，把发生全反射的界面保护在玻璃里面。
    definedIn: physics.optics.total-internal-reflection
    anchor: def-core-cladding
  - id: physics.optics.interference-order
    zh: |
      级次
    en: |
      order
    brief: |
      两束光的光程差含有的整波长数$m$，用来给干涉条纹编号：光程差为$m\lambda$的亮纹是第$m$级，光程差为零的是零级。
    definedIn: physics.optics.two-beam-interference
    anchor: def-order
  - id: physics.optics.reflectance
    zh: |
      反射率
    en: |
      reflectance
    brief: |
      反射光强和入射光强之比；垂直入射时等于$\Bigl(\frac{n_1-n_2}{n_1+n_2}\Bigr)^2$，空气中的玻璃每个表面约$4\%$。
    definedIn: physics.optics.thin-film-interference
    anchor: def-reflectance
