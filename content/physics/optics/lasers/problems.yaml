- id: p1
  tier: easy
  statement: |
    一台激光器的两面反射镜相距$42.0\,\mathrm{cm}$，腔里的折射率按$1$算，光速取$3.00\times10^8\,\mathrm{m/s}$。相邻两个纵模的频率相差多少？以$\mathrm{MHz}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 3.00e8/(2*0.420)/1e6
    unit: |
      $\mathrm{MHz}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      纵模的频率是$\nu_m=\frac{mc}{2L}$。
    - |
      相邻两个纵模相差$\frac c{2L}$。
    - |
      $\frac{3.00\times10^8}{2\times0.420}\,\mathrm{Hz}\approx3.57\times10^8\,\mathrm{Hz}=357\,\mathrm{MHz}$。
  solution: |
    相邻纵模相差$\frac c{2L}=\frac{3.00\times10^8}{0.840}\,\mathrm{Hz}\approx3.57\times10^8\,\mathrm{Hz}=357\,\mathrm{MHz}$。光的频率约$5\times10^{14}\,\mathrm{Hz}$，纵模的级次$m$约有一百多万；相邻两个模的频率只差百万分之一左右，挨得很近。

- id: p2
  tier: easy
  statement: |
    下面关于激光的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        增益系数为负的介质，会把穿过它的这个频率的光放大
      - |
        只要泵浦足够强，只有两个能级的原子用光泵浦也能实现粒子数反转
      - |
        激光器两面反射镜的反射率都做成$1$，输出的激光最强
      - |
        腔长加倍，相邻纵模的频率差减半
      - |
        两台腔长相同的激光器，增益曲线高出阈值的频率范围更宽的那台，可能同时起振的纵模更多
    value: [4, 5]
  hints:
    - |
      增益系数正比于$N_2-N_1$；泵浦光引起的吸收和受激辐射一样多。
    - |
      纵模相差$\frac c{2L}$；能起振的纵模要落在增益高出阈值的频率范围里。
    - |
      D、E 对；A、B、C 错。
  solution: |
    D 对：纵模相差$\frac c{2L}$，和$L$成反比。E 对：纵模间隔相同，频率范围越宽，里面装得下的纵模越多。

    A 错：增益系数为负说明$N_2<N_1$，吸收多于受激辐射，光被减弱。B 错：泵浦光同样会引起受激辐射，吸收和受激辐射的系数相等，最多做到$N_2=N_1$。C 错：两面都全反射时光出不来，没有输出；输出镜要稍微透光。

- id: p3
  tier: medium
  statement: |
    一台激光器的增益介质和谐振腔一样长，$L=40.0\,\mathrm{cm}$，一面反射镜的反射率是$1.00$，另一面是$0.95$，不计别的损耗。增益系数至少要多大，才能起振？以$\mathrm m^{-1}$为单位，保留三位有效数字。
  answer:
    type: number
    value: ln(1/(1.00*0.95))/(2*0.400)
    unit: |
      $\mathrm m^{-1}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      光在腔里来回一趟，光强变成原来的$R_1R_2e^{2gL}$倍。
    - |
      起振要求$R_1R_2e^{2gL}\ge1$，即$g\ge\frac1{2L}\ln\frac1{R_1R_2}$。
    - |
      $\frac{\ln(1/0.95)}{0.800}\,\mathrm m^{-1}\approx\frac{0.0513}{0.800}\,\mathrm m^{-1}\approx0.0641\,\mathrm m^{-1}$。
  solution: |
    $g_{\mathrm{th}}=\frac1{2L}\ln\frac1{R_1R_2}=\frac{1}{0.800}\ln\frac1{0.95}\,\mathrm m^{-1}\approx\frac{0.0513}{0.800}\,\mathrm m^{-1}\approx0.0641\,\mathrm m^{-1}$，光每走一米要放大约$6.4\%$以上。输出镜每次漏出$5\%$，放大得不够多的介质就起不了振；增益小的氦氖激光器，输出镜要透过得更少。

- id: p4
  tier: medium
  statement: |
    一台气体激光器的腔长是$48.0\,\mathrm{cm}$（腔里的折射率按$1$算），增益高出阈值的频率范围宽$1.50\,\mathrm{GHz}$，光速取$3.00\times10^8\,\mathrm{m/s}$。最多可能有几个纵模同时起振？
  answer:
    type: number
    value: 5
  hints:
    - |
      先算相邻纵模的间隔$\frac c{2L}$。
    - |
      间隔是$312.5\,\mathrm{MHz}$；$n$个纵模占的频率范围是$(n-1)$个间隔。
    - |
      $(n-1)\times0.3125\,\mathrm{GHz}\le1.50\,\mathrm{GHz}$，$n\le5.8$，最多$5$个。
  solution: |
    纵模间隔$\frac{3.00\times10^8}{2\times0.480}\,\mathrm{Hz}=312.5\,\mathrm{MHz}$。$n$个相邻纵模从第一个到最后一个跨$(n-1)\times312.5\,\mathrm{MHz}$，要放进$1.50\,\mathrm{GHz}$的范围，$n-1\le4.8$，最多$5$个；纵模在这段范围里的位置不巧时，也可能只有$4$个。

- id: p5
  tier: hard
  statement: |
    （1）只有两个能级$E_1$、$E_2$的原子，用频率$\nu=\frac{E_2-E_1}h$的光泵浦。吸收和受激辐射的速率都正比于泵浦光的强度，比例系数相同，自发辐射的速率是$AN_2$。写出$N_2$变化的方程，证明稳定时$N_2<N_1$，泵浦再强也不行。

    （2）四能级系统（见这一节的「几何图像」）里，为什么泵浦得不多就能实现$E_2$、$E_1$之间的反转？（3）红宝石激光器是三能级系统，激光的下能级就是基态。为什么它要用很强的闪光灯泵浦？至少要把多少原子送上去？
  hints:
    - |
      $\dv{N_2}t=W(N_1-N_2)-AN_2$，$W$正比于泵浦光的强度。
    - |
      四能级系统的激光下能级$E_1$高于基态，原子到了那里很快落回基态。
    - |
      三能级系统里，$N_1$就是基态上的原子数。
  reference: |
    （1）$\dv{N_2}t=W(N_1-N_2)-AN_2$，$W$是吸收（也是受激辐射）的速率系数，正比于泵浦光的强度。稳定时$\dv{N_2}t=0$，$\frac{N_2}{N_1}=\frac{W}{W+A}<1$；$W$再大，比值也只趋于$1$。原因是泵浦光把原子送上去的同时，也同样多地把原子「请」下来。

    （2）四能级系统的泵浦把原子送到$E_3$，原子很快落到$E_2$并在那里停得较久；激光的下能级$E_1$在基态上方，原子到了$E_1$很快落回基态，$N_1$几乎为零。这样，$E_2$上只要有一些原子，就有$N_2>N_1$，泵浦一点点就够了，氦氖激光器、钕玻璃激光器都是这样。

    （3）红宝石里激光的下能级就是基态，开始时几乎所有原子都在基态上，$N_1$很大。要$N_2>N_1$，得把一半以上的原子送到上能级，这需要极强的泵浦，所以梅曼用螺旋形的闪光灯紧紧包住红宝石棒，在闪光的一瞬间产生脉冲激光。

- id: p6
  tier: hard
  statement: |
    谐振腔的两面反射镜都是半径为$R$的凹面镜，相距$L$。光在腔里来回反射，相当于依次穿过一排焦距为$\frac R2$、间距为$L$的薄透镜（凹面镜的焦距是半径的一半，见[球面镜成像](lesson:physics.optics.spherical-mirrors)）。

    （1）为什么可以这样看？

    （2）[光线传输矩阵](lesson:physics.optics.ray-transfer-matrices)第 6 题证明了：一排焦距为$f$、间距为$d$的薄透镜，$0<d<4f$时近轴光线一直留在光轴附近，$d>4f$时越走越偏。由此求出这种谐振腔能把光留住的条件。

    （3）两面平面镜组成的腔（$R\to\infty$）属于哪种情况？为什么实用的激光器多用凹面镜？
  hints:
    - |
      把来回的光路「展开」成一直往前走的光路，每次反射换成穿过一块透镜。
    - |
      $f=\frac R2$，$d=L$，代入$0<d<4f$。
    - |
      $R\to\infty$时$f\to\infty$，没有把光线拉回光轴的作用。
  reference: |
    （1）凹面镜对近轴光线的作用和焦距为$\frac R2$的会聚透镜一样，只是把光反射回来。把每次反射后的光路沿镜面翻过去，来回的光路就展开成一直往前走的光路，相邻两次反射之间走过$L$，所以腔就相当于一排焦距$\frac R2$、间距$L$的透镜。

    （2）代入$0<d<4f$：$0<L<2R$。两镜间距小于凹面镜半径的两倍时，近轴光线被一次次拉回光轴附近，留在腔里一趟趟放大；$L>2R$时，光线越走越偏，几趟就跑出腔外，谐振腔留不住光，损耗太大，起不了振。$L=R$（两镜的焦点重合，共焦腔）正在这个范围的中间。

    （3）两面平面镜时$f\to\infty$，透镜没有把光线拉回光轴的作用，光线只要和轴有一点点夹角，就会一趟趟走偏，正处在留住和留不住的边界上，镜子稍有一点不平行就会损失很多光，调起来极难。凹面镜的腔对镜子的倾斜、不平行宽容得多，所以实用的激光器多用凹面镜，或者一面平面镜、一面凹面镜。

- id: p7
  tier: thinking
  statement: |
    （1）[相干性](lesson:physics.optics.coherence)第 3 题里那台激光器，相干长度约$200\,\mathrm m$，它的频率范围大约多宽？氦氖激光器增益曲线宽约$1.5\,\mathrm{GHz}$，激光的频率范围为什么能窄得多？

    （2）一个灯泡发出约$5\,\mathrm W$的可见光，向四面八方射出；一支激光笔发出$1\,\mathrm{mW}$的光，光束直径约$1\,\mathrm{mm}$。人在$1\,\mathrm m$外看它们，瞳孔直径约$3\,\mathrm{mm}$，分别有多少光功率进入眼睛？

    （3）进入眼睛的光会聚在视网膜上，为什么激光的危险还要再大得多？
  hints:
    - |
      $\Delta\nu\approx\frac c{l_c}$；谐振腔只让纵模的频率来回加强。
    - |
      灯泡的光均匀地铺在半径$1\,\mathrm m$的球面上，瞳孔只截下其中一小块面积。
    - |
      激光几乎是平行光，眼睛把平行光会聚成一个很小的点。
  reference: |
    （1）$\Delta\nu\approx\frac c{l_c}=\frac{3.0\times10^8}{200}\,\mathrm{Hz}=1.5\times10^6\,\mathrm{Hz}$，约$1.5\,\mathrm{MHz}$，只有增益曲线宽度的千分之一。增益曲线只决定哪些频率能放大，真正起振的只有落在里面的纵模；只剩一个纵模时，这个模的频率由谐振腔决定，受激辐射不断补充损失，谱线比腔本身的透射峰还窄。

    （2）灯泡：瞳孔面积约$7\times10^{-6}\,\mathrm m^2$，球面面积$4\pi\,\mathrm m^2$，进入眼睛的约$5\times\frac{7\times10^{-6}}{12.6}\,\mathrm W\approx3\times10^{-6}\,\mathrm W$。激光笔：光束比瞳孔还细，$1\,\mathrm{mW}$几乎全部进入眼睛，是灯泡的约三百倍。

    （3）灯泡有一定大小，眼睛把它成像为视网膜上一个零点几毫米的光斑；激光几乎是平行光，眼睛把它会聚成一个只有几微米、受衍射限制的小点。功率又大几百倍，单位面积上的功率就比看灯泡时大上百万倍，足以灼伤视网膜，所以绝不能直视激光，也不能用它照别人的眼睛。

- id: p8
  tier: thinking
  statement: |
    （1）爱因斯坦在 1917 年就提出了受激辐射，第一台激光器却到 1960 年才出现。难在哪里？

    （2）1954 年汤斯（Charles Townes）等人先做出了微波波段的「激射器」（maser）。为什么在微波波段比在可见光波段容易？（3）自发辐射和受激辐射的系数之比正比于$\nu^3$。按这一点，做 X 射线激光器会更容易还是更难？
  hints:
    - |
      要有粒子数反转，还要有能把光一趟趟送回介质的谐振腔。
    - |
      自发辐射会白白消耗掉高能级上的原子，它和频率有什么关系？
    - |
      频率高一千倍，自发辐射相对于受激辐射强多少？
  reference: |
    （1）受激辐射在热平衡时总敌不过吸收，要放大光必须先造出粒子数反转，这需要找到合适的能级结构（寿命长的上能级、很快排空的下能级）和泵浦办法；还要想到用谐振腔反复放大，并做出反射率很高的镜子。这些想法和技术在 1950 年代才凑齐：汤斯、肖洛（Arthur Schawlow）在 1958 年提出了用法布里-珀罗腔做光频激射器的方案。

    （2）微波的频率低，自发辐射极弱，高能级上的原子不会被自发辐射很快地耗掉，反转容易维持；微波的谐振腔就是一个金属空腔，尺寸和波长相当，比做可见光的高反射镜容易。汤斯用氨分子，把处在高能级的分子分选出来送进谐振腔，做成了第一台激射器。

    （3）更难。频率越高，自发辐射相对于受激辐射越强，正比于$\nu^3$：X 射线的频率比可见光高约一千倍，自发辐射相对强约十亿倍，高能级上的原子转眼就自发地跳下来，要维持反转需要极强的泵浦；X 射线又几乎没有好的反射镜做谐振腔。现在的 X 射线激光主要靠「自由电子激光」，用高速电子束而不是原子的能级来产生。
