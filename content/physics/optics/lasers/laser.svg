<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" font-size="14">
  <!-- 激光器的原理：左边是四能级系统，绿点表示各能级上原子的多少，基态 E0 上最多。泵浦把原子从基态 E0 送到 E3，原子很快落到寿命较长的 E2；E1 上的原子很快落回基态，几乎是空的，于是 E2 和 E1 之间实现粒子数反转，E2 到 E1 的受激辐射放大光。右边是激光器：增益介质放在两面相对的反射镜之间，左边的反射镜几乎全反射，右边的部分透射；光沿轴线来回反射、一趟趟被放大，从右边的镜子漏出一部分，就是激光。 -->
  <line x1="40.0" y1="250.0" x2="230.0" y2="250.0" style="stroke: currentColor" stroke-width="2.0" />
  <text x="238.0" y="255.0" fill="currentColor"><tspan font-style="italic">E</tspan><tspan dy="4" font-size="11">0</tspan></text>
  <line x1="40.0" y1="190.0" x2="230.0" y2="190.0" style="stroke: currentColor" stroke-width="3.0" />
  <text x="238.0" y="195.0" fill="currentColor"><tspan font-style="italic">E</tspan><tspan dy="4" font-size="11">1</tspan></text>
  <line x1="40.0" y1="95.0" x2="230.0" y2="95.0" style="stroke: currentColor" stroke-width="3.0" />
  <text x="238.0" y="100.0" fill="currentColor"><tspan font-style="italic">E</tspan><tspan dy="4" font-size="11">2</tspan></text>
  <line x1="40.0" y1="50.0" x2="230.0" y2="50.0" style="stroke: currentColor" stroke-width="2.0" />
  <text x="238.0" y="55.0" fill="currentColor"><tspan font-style="italic">E</tspan><tspan dy="4" font-size="11">3</tspan></text>
