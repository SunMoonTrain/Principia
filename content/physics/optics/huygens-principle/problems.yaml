- id: p1
  tier: easy
  statement: |
    平面光波从空气斜射进折射率$1.60$的玻璃。波阵面的一端已经到达界面，另一端还要在空气里走$4.0\,\mathrm{cm}$才到界面。这段时间里，先到界面的那一端在玻璃里发出的次波半径是多少？以$\mathrm{cm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 4.0/1.60
    unit: |
      $\mathrm{cm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      同一段时间里，次波在玻璃里走的路程是$v_2t$，另一端在空气里走$v_1t$。
    - |
      $\frac{v_2}{v_1}=\frac{n_1}{n_2}=\frac{1}{1.60}$。
    - |
      半径$\frac{4.0}{1.60}\,\mathrm{cm}=2.50\,\mathrm{cm}$。
  solution: |
    同一段时间$t$里，空气里的那一端走$v_1t=4.0\,\mathrm{cm}$，玻璃里的次波走$v_2t=\frac{v_1t}{1.60}=2.50\,\mathrm{cm}$。次波比空气里那一段短，新的波阵面就向法线转过来。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        平面波在均匀介质里传播，按惠更斯原理，新的波阵面仍是平面
      - |
        光从空气射进水里，同一段时间里次波在水里的半径比在空气里大
      - |
        由惠更斯原理推出折射定律时，要求光在折射率大的介质里速度小
      - |
        惠更斯原理本身能说明为什么波不向后传
      - |
        光从空气进入水里，频率不变，波长变短
    value: [1, 3, 5]
  hints:
    - |
      平面上各点发出的次波半径相同，包络是一个平行的平面。
    - |
      $\frac{\sin\theta_1}{\sin\theta_2}=\frac{v_1}{v_2}$，光偏向法线说明$v_2<v_1$。
    - |
      A、C、E 对；B、D 错。
  solution: |
    A 对：平面上各点的次波半径相同，包络是平行的平面。C 对：$\frac{\sin\theta_1}{\sin\theta_2}=\frac{v_1}{v_2}=\frac{n_2}{n_1}$，折射率大处速度小。E 对：频率由波源决定，速度变成$\frac cn$，波长$\frac{v}{f}$随之变短。

    B 错：水里光速小，次波小。D 错：次波向后也传，惠更斯原理说明不了为什么没有向后的波，要靠菲涅耳给次波加上随方向变化的强弱。

- id: p3
  tier: medium
  statement: |
    钠黄光在真空中的波长是$589\,\mathrm{nm}$。它进入折射率$1.33$的水里，相邻两个相位相同的波阵面相距多少？以$\mathrm{nm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 589/1.33
    unit: |
      $\mathrm{nm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      相邻两个相位相同的波阵面相距一个波长。
    - |
      频率不变，速度变成$\frac cn$，波长变成真空中的$\frac1n$。
    - |
      $\frac{589}{1.33}\,\mathrm{nm}\approx443\,\mathrm{nm}$。
  solution: |
    一个周期里次波走一个波长。频率不变，水里的速度是$\frac c{1.33}$，所以水里的波长$\lambda=\frac{589\,\mathrm{nm}}{1.33}\approx443\,\mathrm{nm}$，相邻两个相位相同的波阵面相距这么远。光的颜色由频率决定，在水里看起来仍是黄色。

- id: p4
  tier: medium
  statement: |
    声波在$20\,^\circ\mathrm C$的空气里速度约$343\,\mathrm{m/s}$，在水里约$1480\,\mathrm{m/s}$。声波从空气斜射到水面上，入射角大于多少度时，就不再有声波进入水里？保留三位有效数字。
  answer:
    type: number
    value: asin(343/1480)*180/pi
    unit: |
      $^\circ$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      惠更斯作图对声波一样适用：$\frac{\sin\theta_1}{\sin\theta_2}=\frac{v_1}{v_2}$。
    - |
      水里声速大，折射角比入射角大；折射角到$90^\circ$时，$\sin\theta_1=\frac{v_1}{v_2}$。
    - |
      $\sin\theta_1=\frac{343}{1480}\approx0.232$，$\theta_1\approx13.4^\circ$。
  solution: |
    次波在水里走得比在空气里快，$\frac{\sin\theta_1}{\sin\theta_2}=\frac{343}{1480}$，折射角比入射角大。折射角达到$90^\circ$时，$\sin\theta_1=\frac{343}{1480}\approx0.232$，$\theta_1\approx13.4^\circ$；入射角再大，声波全部反射回空气。这和光从水射向空气时的全反射（total internal reflection）是同一回事，只是对声波来说，空气是「慢」的一边。

- id: p5
  tier: hard
  statement: |
    （1）用惠更斯原理说明：均匀介质里，平面波阵面过一段时间仍是平行的平面，球面波阵面仍是同心的球面。（2）平面波以入射角$\theta_1$射到平面镜上，用次波作图证明反射角等于入射角，并说明作图里为什么只要画一个次波。
  hints:
    - |
      均匀介质里各点的次波半径都是$vt$。
    - |
      波阵面一端$A$先到镜面，另一端$B$再走$vt$到$B'$；$A$的次波半径也是$vt$。
    - |
      直角三角形$ABB'$和$B'A'A$斜边相同、一条直角边相等。
  reference: |
    （1）均匀介质里波速处处是$v$，经过时间$t$，波阵面上各点的次波半径都是$vt$。平面上各点为圆心、同样半径的球面，包络是和原平面平行、相距$vt$的平面；球面上各点为圆心、同样半径的球面，包络是半径增大$vt$的同心球面。所以波沿垂直于波阵面的直线前进。

    （2）波阵面$AB$斜射到镜面上，$A$先到，$B$再走$vt$到达镜面上的$B'$。这段时间里$A$的次波半径是$vt$。$A$、$B'$之间的点$C$在$AC=s$处，晚$\frac{s\sin\theta_1}{v}$被照到，它的次波半径是$vt-s\sin\theta_1$，正好是$C$到直线$A'B'$的距离（$A'$是从$B'$作$A$的次波的切点）：这些次波都和$A'B'$相切。所以只要画$A$一个次波，从$B'$作切线就行。

    直角三角形$ABB'$和$B'A'A$共用斜边$AB'$，$BB'=AA'=vt$，两个三角形全等，$\angle BAB'=\angle A'B'A$，入射波阵面和反射波阵面与镜面的夹角相等，所以反射角等于入射角。

- id: p6
  tier: hard
  statement: |
    一种透明介质里，光速随高度增大，越往上越快（折射率越往上越小）。

    一束沿水平方向传播的光，波阵面是竖直的。（1）用次波说明，过一小段时间，波阵面会怎样倾斜。（2）由此说明光线向哪一侧弯。（3）这和费马原理（Fermat's principle）给出的结论一致吗？
  hints:
    - |
      波阵面上高处的点次波半径大，低处的小。
    - |
      波阵面向慢的一侧倾斜，光线垂直于波阵面。
    - |
      光线向折射率大的一侧弯，见[渐变折射率与光线弯曲](lesson:physics.optics.graded-index)。
  reference: |
    （1）波阵面上高处的点光速大，经过时间$t$，次波半径大；低处的次波半径小。包络就成了上面走得远、下面走得近的倾斜面，波阵面的上端向前倒。

    （2）光线垂直于波阵面。波阵面上端向前倒，垂直于它的方向就向下偏，光线向下弯，也就是向光速小、折射率大的一侧弯。

    （3）一致。按费马原理，折射率只随高度变化时$n\sin\theta$不变，光线向折射率大的一侧弯（见[渐变折射率与光线弯曲](lesson:physics.optics.graded-index)）。惠更斯原理和费马原理从两个角度描述同一件事：一个看波阵面怎样前进，一个看光线的光程（optical path length）取极值。

- id: p7
  tier: thinking
  statement: |
    1838 年，阿拉戈（François Arago）提出：比较光在水里和在空气里谁快，就能判断光是粒子还是波。1850 年，傅科做出了这个实验。

    （1）牛顿的微粒说怎样解释光射进水里偏向法线？它预言光在水里快还是慢？（2）为什么只要比较两种介质里谁快，不必测出光速的数值，就能分出两种说法？（3）傅科的结果支持哪一种说法？
  hints:
    - |
      微粒说认为水把光的微粒往里拉，平行于界面的速度分量不变。
    - |
      同一个折射角，两种说法给出的速度之比互为倒数（例 2）。
    - |
      傅科测得光在水里比在空气里慢。
  reference: |
    （1）微粒说认为，光的微粒到达水面时受到水的吸引，垂直于界面的速度分量增大，平行于界面的分量不变：$v_1\sin\theta_1=v_2\sin\theta_2$。光偏向法线，$\theta_2<\theta_1$，于是$v_2>v_1$，预言光在水里更快。

    （2）对同一个折射现象，波动的说法给出$\frac{v_2}{v_1}=\frac{\sin\theta_2}{\sin\theta_1}<1$，微粒说给出$\frac{v_2}{v_1}=\frac{\sin\theta_1}{\sin\theta_2}>1$，一个比$1$小，一个比$1$大。所以只要比较谁快，不用知道光速的准确数值。

    （3）傅科用转镜测得光在水里比在空气里慢，支持波动的说法，和惠更斯原理的预言一致。

- id: p8
  tier: thinking
  statement: |
    隔着墙角，能听见拐角那边的人说话，却看不见他。（1）声音在空气里的速度约$343\,\mathrm{m/s}$，说话的声音频率在几百赫兹，估算它的波长；可见光的波长约$0.5\,\mu\mathrm m$。（2）用次波说明，波遇到大小和波长相近的障碍或缺口时，为什么会绕到障碍后面去。（3）为什么光在日常生活里好像总是走直线？
  hints:
    - |
      $343\,\mathrm{Hz}$的声波波长$\frac{343}{343}\,\mathrm m=1\,\mathrm m$。
    - |
      缺口很窄时，只剩下缺口里的几个次波，它们的包络是向四面散开的球面。
    - |
      门、墙角都有一米上下，比声波的波长差不多大，比光的波长大得多。
  reference: |
    （1）几百赫兹的声波，波长约$\frac{343\,\mathrm{m/s}}{300\,\mathrm{Hz}}\approx1\,\mathrm m$，和门、墙角的大小差不多；可见光的波长只有约$0.5\,\mu\mathrm m$，小了约两百万倍。

    （2）波阵面被障碍挡住一部分，只剩没挡住的那部分发出次波。缺口很宽时，次波的包络大部分仍是平面，只在边缘处弯一点；缺口窄到和波长差不多时，只剩少数几个次波，包络接近一个向各个方向散开的球面，波就绕到了障碍的后面。

    （3）门、窗、墙角比光的波长大几百万倍，光在边缘处绕进去的部分极窄，几乎看不出来，所以光看起来走直线。用很窄的缝或很小的孔，就能看到光也会绕过去，这就是衍射（diffraction，见[单缝衍射](lesson:physics.optics.single-slit-diffraction)）。
