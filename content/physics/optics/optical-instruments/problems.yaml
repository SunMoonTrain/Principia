- id: p1
  tier: easy
  statement: |
    一块焦距$4.0\,\mathrm{cm}$的放大镜，眼睛紧靠透镜，调整物的位置，使正立的虚像成在明视距离处。角放大率是多少？保留三位有效数字。
  answer:
    type: number
    value: 1 + 25/4.0
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      像在明视距离处时，$M=1+\frac{25\,\mathrm{cm}}{f}$。
    - |
      $M=1+\frac{25}{4.0}$。
    - |
      $M=7.25$。
  solution: |
    $M=1+\frac{25\,\mathrm{cm}}{4.0\,\mathrm{cm}}=7.25$。这时物离透镜$s=\frac{1}{\frac1{4.0}+\frac1{25}}\,\mathrm{cm}\approx3.45\,\mathrm{cm}$，在焦点以内。把物移到焦点上，像在无穷远，$M=\frac{25}{4.0}=6.25$，小一点，但眼睛不用调节。

- id: p2
  tier: easy
  statement: |
    下面关于透镜组和光学仪器的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        显微镜的物镜成倒立、放大的实像
      - |
        放大镜的焦距越长，角放大率越大
      - |
        两块透镜相距$d$，第一个像落在第二块透镜后面时，它对第二块透镜的物距是负的
      - |
        伽利略望远镜的目镜是会聚透镜
      - |
        开普勒望远镜里看到的像是倒的
    value: [1, 3, 5]
  hints:
    - |
      显微镜的物体放在物镜的焦点稍外；放大镜的$M=\frac{25\,\mathrm{cm}}{f}$。
    - |
      第二块透镜的物距$s_2=d-s_1'$；伽利略望远镜的像是正的，$M=-\frac{f_1}{f_2}>0$。
    - |
      A、C、E 对；B、D 错。
  solution: |
    A 对：物体在物镜的一倍焦距和两倍焦距之间、靠近焦点，成倒立、放大的实像。C 对：$s_1'>d$时$s_2=d-s_1'<0$，第一个像是虚物。E 对：物镜成倒立的中间像，目镜像放大镜一样看它，不改变正倒。

    B 错：$M=\frac{25\,\mathrm{cm}}{f}$，焦距越短放大率越大。D 错：伽利略望远镜的目镜是发散透镜，$f_2<0$，$M=-\frac{f_1}{f_2}>0$，像是正的。

- id: p3
  tier: medium
  statement: |
    一块焦距$20\,\mathrm{cm}$的会聚透镜和一块焦距$-20\,\mathrm{cm}$的发散透镜相距$10\,\mathrm{cm}$，光先射到会聚透镜上。远处物体的像成在发散透镜后面多远处？以$\mathrm{cm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 1/(1/(-20) - 1/(10 - 20))
    unit: |
      $\mathrm{cm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      会聚透镜把平行光会聚在它后面$20\,\mathrm{cm}$处，这一点在发散透镜后面。
    - |
      对发散透镜，$s_2=10-20=-10\,\mathrm{cm}$，是虚物。
    - |
      $\frac1{s_2'}=\frac1{-20}-\frac1{-10}=\frac1{20}\,\mathrm{cm^{-1}}$，$s_2'=20.0\,\mathrm{cm}$。
  solution: |
    第一块：物在无穷远，$s_1'=20\,\mathrm{cm}$。这一点在发散透镜后面$10\,\mathrm{cm}$，$s_2=-10\,\mathrm{cm}$，是虚物。第二块：$\frac1{s_2'}=\frac1{-20}-\frac1{-10}=\frac1{20}\,\mathrm{cm^{-1}}$，$s_2'=20.0\,\mathrm{cm}$，是实像。

    再看像的大小：物体的视角为$\theta$时，第一个像是倒立的，高$f_1\theta=(20\,\mathrm{cm})\,\theta$；发散透镜的$m_2=-\frac{20}{-10}=2$，最后的像高$(40\,\mathrm{cm})\,\theta$，和一块焦距$40\,\mathrm{cm}$的透镜所成的像一样大，可是从第一块透镜到像只有$30\,\mathrm{cm}$。长焦镜头用前面会聚、后面发散的两组透镜，就是为了让镜头比焦距短。

- id: p4
  tier: medium
  statement: |
    设显微镜物镜的焦距是$8.0\,\mathrm{mm}$，目镜的焦距是$20\,\mathrm{mm}$，物镜的像方焦点到中间像的距离是$160\,\mathrm{mm}$，中间像落在目镜的焦点上。显微镜的角放大率的大小是多少？保留三位有效数字。
  answer:
    type: number
    value: 160/8.0*250/20
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      $M=-\frac{L}{f_{\mathrm o}}\cdot\frac{25\,\mathrm{cm}}{f_{\mathrm e}}$，长度统一用毫米。
    - |
      物镜$\frac{160}{8.0}=20$，目镜$\frac{250}{20}=12.5$。
    - |
      $|M|=20\times12.5=250$。
  solution: |
    物镜的横向放大率$m_{\mathrm o}=-\frac{160}{8.0}=-20$，目镜的角放大率$\frac{250\,\mathrm{mm}}{20\,\mathrm{mm}}=12.5$，$M=-20\times12.5=-250$，大小是$250$。物镜的像距$s'=8.0+160=168\,\mathrm{mm}$，物距$s=\frac1{\frac1{8.0}-\frac1{168}}\,\mathrm{mm}=8.4\,\mathrm{mm}$，物体只在焦点外$0.4\,\mathrm{mm}$，所以调焦时物镜只要移动很小的距离。

- id: p5
  tier: hard
  statement: |
    （1）伽利略望远镜的物镜焦距为$f_1$，目镜是焦距为$f_2$的发散透镜（$f_2<0$），两者相距$f_1+f_2$。用逐个成像的方法说明，远处射来的平行光经过它仍是平行光，并证明$M=-\frac{f_1}{f_2}$，像是正的。（2）用焦距$40\,\mathrm{cm}$的物镜做角放大率大小为$8$的望远镜，开普勒式和伽利略式的镜筒各多长？
  hints:
    - |
      物镜把平行光会聚到它后面$f_1$处；这一点在目镜后面，对目镜的物距$s_2=(f_1+f_2)-f_1=f_2$。
    - |
      $s_2=f_2$代进成像公式，$\frac1{s_2'}=\frac1{f_2}-\frac1{f_2}=0$；出射光和「虚物点与目镜光心的连线」平行。
    - |
      （2）目镜焦距的大小是$5\,\mathrm{cm}$，镜筒分别长$45\,\mathrm{cm}$和$35\,\mathrm{cm}$。
  reference: |
    （1）远处射来、和光轴成$\theta$的平行光，经过物镜本应会聚在它后面$f_1$处、离光轴$f_1\tan\theta$的一点，这一点和入射光来的方向在光轴两侧：光从光轴上方斜向下射来时，它在光轴下方。目镜在物镜后面$f_1+f_2=f_1-|f_2|$处，光还没有会聚就射到了目镜上，这一点对目镜是虚物，物距$s_2=(f_1+f_2)-f_1=f_2$，也就是说虚物在目镜的物方焦平面上（发散透镜的物方焦点在出射一侧）。由$\frac1{s_2}+\frac1{s_2'}=\frac1{f_2}$得$\frac1{s_2'}=0$，射出的是平行光。

    射向虚物点的光里，射向目镜光心的那条不偏折，所以出射光的方向和「目镜光心到虚物点的连线」相同。虚物点在光轴下方、目镜右边，这条连线斜向下，和入射光向同一侧倾斜，像是正的；它和光轴的夹角满足$\tan\theta'=\frac{f_1\tan\theta}{|f_2|}$。小角度时$M=\frac{f_1}{|f_2|}=-\frac{f_1}{f_2}>0$。

    （2）$|f_2|=\frac{40}{8}\,\mathrm{cm}=5\,\mathrm{cm}$。开普勒式的目镜焦距为$5\,\mathrm{cm}$，镜筒长$40+5=45\,\mathrm{cm}$；伽利略式的目镜焦距为$-5\,\mathrm{cm}$，镜筒长$40-5=35\,\mathrm{cm}$，短一些，像也是正的，但视野比开普勒式小。

- id: p6
  tier: hard
  statement: |
    开普勒望远镜的物镜直径为$D$、焦距为$f_1$，目镜焦距为$f_2$，两者相距$f_1+f_2$。（1）求目镜所成的物镜的像（出瞳，exit pupil）的位置和直径。（2）说明从物镜射进来的光，射出目镜后都要穿过出瞳，所以眼睛的瞳孔应该放在这里。

    （3）双筒望远镜上的「$8\times42$」表示角放大率为$8$、物镜直径为$42\,\mathrm{mm}$。它的出瞳直径是多少？
  hints:
    - |
      把物镜当作物体，它对目镜的物距是$f_1+f_2$。
    - |
      像距$s'=\frac{f_2(f_1+f_2)}{f_1}$，横向放大率$-\frac{f_2}{f_1}$，出瞳直径$\frac{f_2}{f_1}D=\frac{D}{|M|}$。
    - |
      $\frac{42}{8}\,\mathrm{mm}=5.25\,\mathrm{mm}$。
  reference: |
    （1）物镜对目镜的物距$s=f_1+f_2$，$\frac1{s'}=\frac1{f_2}-\frac1{f_1+f_2}=\frac{f_1}{f_2(f_1+f_2)}$，$s'=f_2\Bigl(1+\frac{f_2}{f_1}\Bigr)$，在目镜后面、比$f_2$稍远处。横向放大率$m=-\frac{s'}{s}=-\frac{f_2}{f_1}$，出瞳直径$\frac{f_2}{f_1}D=\frac{D}{|M|}$。

    （2）目镜把物镜所在的平面成像到出瞳所在的平面上：穿过物镜上某一点的光线，射出目镜后都穿过这一点的像。任何一条射进望远镜的光线都要穿过物镜上的某一点，所以也都穿过出瞳，整束光在这里最窄。瞳孔放在这里，视野里各个方向来的光都能进入眼睛；离得太远或太近，视野边缘的光就进不来，看到的视野变小。

    （3）$\frac{42}{8}\,\mathrm{mm}=5.25\,\mathrm{mm}$。出瞳比瞳孔大时，多出来的那部分光进不了眼睛；在暗处瞳孔张大，出瞳大的望远镜看起来就亮。

- id: p7
  tier: thinking
  statement: |
    （1）开普勒望远镜里的像为什么是倒的？天文观测为什么不在乎这一点？

    （2）一种常见的双筒望远镜在物镜和目镜之间放了两块等腰直角棱镜（Porro 棱镜）。光垂直射进棱镜的斜面，在两个直角面上各反射一次，再从斜面射出。设玻璃的折射率（refractive index）是$1.5$，这两次反射靠的是什么？为什么直角面上不用镀反射膜？

    （3）两块棱镜互相垂直地放，为什么能把像倒正，还让镜身变短？
  hints:
    - |
      倒立的是物镜所成的中间像。
    - |
      光射到直角面上的入射角是$45^\circ$，和玻璃的临界角（critical angle）比较。
    - |
      一块棱镜里的两次反射，把像沿一个方向翻过来；两块互相垂直，两个方向各翻一次。
  reference: |
    （1）物镜把远处的物体成倒立的实像，目镜像放大镜一样看这个像，不改变正倒，所以看到的像上下、左右都颠倒，相当于转了$180^\circ$。天上的星星、行星没有上下之分，观测关心的是位置、亮度和形状，像倒过来不影响。

    （2）光垂直射进斜面，不偏折，射到直角面上的入射角是$45^\circ$。玻璃的临界角$\arcsin\frac1{1.5}\approx41.8^\circ$，$45^\circ$比它大，发生全反射（total internal reflection），光几乎全部反射回来，所以不用镀膜（见[全反射](lesson:physics.optics.total-internal-reflection)）。

    （3）光在一块棱镜里反射两次，掉头往回走，像在反射所在的平面里翻了一次，在和它垂直的方向上不变；第二块棱镜转过$90^\circ$，把另一个方向也翻过来。两个方向各翻一次，等于转了$180^\circ$，正好抵消物镜造成的颠倒，像就正了。光在两块棱镜里来回走，物镜到目镜的长光路折叠在短的镜身里，所以双筒望远镜比同样焦距的直筒望远镜短得多。

- id: p8
  tier: thinking
  statement: |
    有人说，只要把目镜的焦距做得足够短，显微镜的放大率想多大就有多大，什么细节都看得清。

    （1）物镜把物体上的一点成像为一个小光斑，而不是一个点，像差是原因之一（见[像差](lesson:physics.optics.aberrations)）。两个靠得很近的点，在中间像上的光斑重叠成一片，换一个焦距更短的目镜，能把它们分开吗？（2）这种说法错在哪里？（3）想看清更小的细节，应该在哪块透镜上下功夫？
  hints:
    - |
      目镜放大的是整个中间像，光斑的大小和光斑之间的距离放大同样的倍数。
    - |
      中间像上已经没有的细节，目镜变不出来。
    - |
      能分辨的细节在物镜成像时就定下来了。
  reference: |
    （1）不能。目镜把中间像整个放大，两个光斑的大小和它们的间距放大同样的倍数，重叠的部分仍然重叠，放大以后只是一片更大的模糊。

    （2）放大率只决定看到的像有多大，能分辨的细节在物镜成像时就定下来了。目镜的放大率只要能把中间像上最细的细节放大到眼睛分辨得出的视角就够了；再往上加，放大的只是模糊的光斑，不增加细节，是无效放大（empty magnification）。

    （3）要在物镜上下功夫：减小物镜的像差，并且让它收进角度更大的光。即使完全没有像差，光的衍射（diffraction）也会让每一点成为一个光斑，物镜收光的角度越大，这个光斑越小（见[圆孔衍射与分辨本领](lesson:physics.optics.resolving-power)）。
