- id: p1
  tier: easy
  statement: |
    一面凹面镜的半径是$30\,\mathrm{cm}$，物体在镜前$45\,\mathrm{cm}$处的光轴上。按近轴近似，像距是多少？以$\mathrm{cm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 1/(2/30 - 1/45)
    unit: |
      $\mathrm{cm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      $f=\frac R2=15\,\mathrm{cm}$，$\frac1s+\frac1{s'}=\frac1f$。
    - |
      $\frac1{s'}=\frac1{15}-\frac1{45}=\frac2{45}$。
    - |
      $s'=22.5\,\mathrm{cm}$。
  solution: |
    $f=\frac R2=15\,\mathrm{cm}$，$\frac1{s'}=\frac1{15}-\frac1{45}=\frac{2}{45}\,\mathrm{cm^{-1}}$，$s'=22.5\,\mathrm{cm}$。像在镜前，是实像；物在球心以外，像在焦点和球心之间，$m=-\frac{22.5}{45}=-0.5$，倒立、缩小一半。

- id: p2
  tier: easy
  statement: |
    下面关于球面镜的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        把一面凹面镜浸到水里，它的焦距不变
      - |
        凹面镜的半径越大，把平行光会聚得越靠近镜面
      - |
        凸面镜也能成倒立的实像，只要物离得足够远
      - |
        用凹面镜成实像时，物离焦点越近，像离镜子越远、也越大
      - |
        凸面镜对实物成的像一定在镜后，离顶点不超过焦距的大小
    value: [1, 4, 5]
  hints:
    - |
      反射时光不离开原来的介质；$f=\frac R2$。
    - |
      $\frac1{s'}=\frac1f-\frac1s$，$m=-\frac{s'}{s}$；凸面镜$f<0$。
    - |
      A、D、E 对；B、C 错。
  solution: |
    A 对：反射前后光在同一种介质里，镜面成像公式里没有折射率，$f=\frac R2$只由形状决定。D 对：$s$减小到接近$f$时，$\frac1{s'}=\frac1f-\frac1s$趋于零，$s'$趋于无穷，$|m|=\frac{s'}{s}$也越来越大。E 对：实物$s>0$，$f<0$时$\frac1{s'}=\frac1f-\frac1s<\frac1f<0$，$s'$为负且$|s'|<|f|$；对虚物（virtual object）就不一定，会聚的光射向凸面镜、虚物在镜后焦距以内时，成镜前的实像。

    B 错：焦距$\frac R2$随半径增大，平行光会聚得离镜面更远。C 错：凸面镜对实物总成正立、缩小的虚像。

- id: p3
  tier: medium
  statement: |
    化妆镜是一面凹面镜。脸在镜前$15\,\mathrm{cm}$处，想看到正立、放大$2$倍的像，镜子的半径应该是多少？以$\mathrm{cm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 2/(1/15 - 1/30)
    unit: |
      $\mathrm{cm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      正立、放大的像是虚像，$m=-\frac{s'}{s}=+2$，所以$s'=-2s$。
    - |
      $s=15\,\mathrm{cm}$，$s'=-30\,\mathrm{cm}$，$\frac1f=\frac1{15}-\frac1{30}$。
    - |
      $f=30\,\mathrm{cm}$，$R=2f=60.0\,\mathrm{cm}$。
  solution: |
    正立的像$m=+2$，由$m=-\frac{s'}{s}$得$s'=-30\,\mathrm{cm}$，是镜后的虚像。$\frac1f=\frac1{15}-\frac1{30}=\frac1{30}\,\mathrm{cm^{-1}}$，$f=30\,\mathrm{cm}$，$R=60.0\,\mathrm{cm}$。脸在焦点以内，这正是凹面镜成正立放大虚像的条件。

- id: p4
  tier: medium
  statement: |
    路口的凸面反光镜焦距为$-0.40\,\mathrm m$。一个身高$1.8\,\mathrm m$的人站在镜前$4.0\,\mathrm m$处。按近轴近似，他在镜中的像有多高？以$\mathrm{cm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 180*(-(1/(-1/0.40 - 1/4.0))/4.0)
    unit: |
      $\mathrm{cm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      $\frac1{s'}=\frac1f-\frac1s$，凸面镜$f=-0.40\,\mathrm m$。
    - |
      $\frac1{s'}=-2.5-0.25=-2.75\,\mathrm{m^{-1}}$，$s'\approx-0.364\,\mathrm m$。
    - |
      $m=-\frac{s'}{s}\approx0.0909$，像高约$16.4\,\mathrm{cm}$。
  solution: |
    $\frac1{s'}=\frac1{-0.40}-\frac1{4.0}=-2.75\,\mathrm{m^{-1}}$，$s'\approx-0.364\,\mathrm m$，像在镜后约$36\,\mathrm{cm}$处。$m=-\frac{s'}{s}=\frac{0.364}{4.0}\approx0.0909$，像高$1.8\,\mathrm m\times0.0909\approx16.4\,\mathrm{cm}$，正立。

- id: p5
  tier: hard
  statement: |
    一面凹面镜，半径$R$。一条平行于光轴的光线在高$h$处射到镜面上（不做近轴近似）。

    （1）证明反射光线和光轴的交点离顶点$R-\frac{R}{2\cos\theta}$，$\sin\theta=\frac hR$。（2）$h$比$R$小得多时，证明这个距离约为$\frac R2-\frac{h^2}{4R}$。（3）$R=1.00\,\mathrm m$，$h=0.10\,\mathrm m$和$h=0.30\,\mathrm m$的光线，交点各离顶点多远？
  hints:
    - |
      法线过球心$C$，入射角和反射角都是$\theta$；反射光线和光轴的交点$F$与$C$、$P$构成三角形。
    - |
      三角形$CPF$在$C$、$P$两处的角都是$\theta$，是等腰三角形，从$F$向$CP$作垂线。
    - |
      $\frac1{\cos\theta}\approx1+\frac{\theta^2}2$，$\theta\approx\frac hR$。
  reference: |
    （1）光线射到镜面上的$P$点，法线$CP$过球心，长$R$。入射光线平行于光轴，它和法线的夹角是入射角$\theta$，所以$CP$和光轴的夹角也是$\theta$（内错角），$\sin\theta=\frac hR$。反射光线和法线的夹角也是$\theta$，三角形$CPF$在$C$和$P$两处的角都是$\theta$，$CF=PF$。从$F$向$CP$作垂线，垂足是$CP$的中点，所以$CF=\frac{R/2}{\cos\theta}$，交点离顶点$R-\frac{R}{2\cos\theta}$。

    （2）$\frac{1}{\cos\theta}\approx1+\frac{\theta^2}{2}$，交点离顶点约$R-\frac R2\Bigl(1+\frac{\theta^2}2\Bigr)=\frac R2-\frac{R\theta^2}{4}\approx\frac R2-\frac{h^2}{4R}$。离光轴越远的光线，交点越靠近镜面，这就是球面镜的球差（spherical aberration）。

    （3）$h=0.10\,\mathrm m$：$\cos\theta=\sqrt{1-0.01}\approx0.99499$，交点离顶点$1-\frac{1}{2\times0.99499}\approx0.4975\,\mathrm m$，近似式给$0.4975\,\mathrm m$。$h=0.30\,\mathrm m$：$\cos\theta=\sqrt{0.91}\approx0.95394$，交点离顶点约$0.4759\,\mathrm m$，近似式给$0.4775\,\mathrm m$，偏离$\frac R2=0.50\,\mathrm m$约$2.4\,\mathrm{cm}$。

- id: p6
  tier: hard
  statement: |
    抛物线$y^2=4fx$（$f>0$）绕$x$轴转成抛物面镜，镜面朝$x$轴正方向。（1）证明平行于$x$轴射来的光线，反射后都经过点$(f,0)$。（2）证明这个抛物面在顶点附近和半径为$2f$的球面几乎重合，并说明为什么这和球面镜的$f=\frac R2$一致。
  hints:
    - |
      抛物线上每一点到点$(f,0)$的距离，等于它到直线$x=-f$的距离。
    - |
      设光线射到$P$点，$D$是$P$在直线$x=-f$上的垂足，$F=(f,0)$；三角形$PDF$是等腰三角形，切线平分$\angle DPF$。
    - |
      在顶点附近把半径为$R$、球心在$(R,0)$的圆写成$x\approx\frac{y^2}{2R}$，和$x=\frac{y^2}{4f}$比较。
  reference: |
    （1）设$P=(x_0,y_0)$在抛物线上，$F=(f,0)$，$D=(-f,y_0)$是$P$在直线$x=-f$上的垂足。$PF^2=(x_0-f)^2+y_0^2=(x_0-f)^2+4fx_0=(x_0+f)^2=PD^2$，所以$PF=PD$，三角形$PDF$是等腰三角形。$P$点的切线斜率$\dv yx=\frac{2f}{y_0}$，而$DF$的斜率是$\frac{0-y_0}{2f}$，两者乘积为$-1$，切线垂直于$DF$，它就是$DF$的中垂线，平分$\angle DPF$。射来的光线沿$DP$的反方向（平行于$x$轴）到达$P$，它和切线的夹角等于$PF$和切线的夹角。

    由反射定律，反射光线正沿$PF$射向$F$。对每一点都成立，所以平行光都会聚到$F$。

    （2）球心在$(R,0)$、过原点的圆$(x-R)^2+y^2=R^2$，在顶点附近$x$很小，$x^2$可以略去，得$x\approx\frac{y^2}{2R}$。抛物线是$x=\frac{y^2}{4f}$，$R=2f$时两者在顶点附近一致，差别从$y^4$那一项才出现。所以近轴的光线感受不到两者的差别，半径为$2f$的球面镜焦距也是$\frac R2=f$；离轴远的光线才分得出两者，球面镜有球差，抛物面镜没有。

- id: p7
  tier: thinking
  statement: |
    世界上最大的天文望远镜都是反射望远镜，而不是用透镜会聚光的折射望远镜。从光学和制造两方面，说出几条理由。
  hints:
    - |
      透镜对不同颜色的光折射率不同；镜子反射时呢？
    - |
      光要穿过透镜，镜子只用一个表面。
    - |
      大块的透镜只能在边缘托住，镜子可以从背面托住。
  reference: |
    光学上：反射对各种颜色的光都一样，镜子没有色散带来的颜色偏差，牛顿造反射望远镜正是为此；光不用穿过玻璃，玻璃内部有没有气泡、条纹，对什么波长透明都无所谓，紫外、红外也能用；镜面可以做成抛物面等形状，消除球差。

    制造和结构上：透镜有两个面都要磨准，还要整块玻璃均匀透明，镜子只需磨好一个面；透镜只能托住边缘，口径大了会在自重下变形，镜子可以从背面用许多点托住，口径可以做得很大，还可以拼成多块。所以要收集更多的光、看得更清楚，大口径的望远镜都用反射镜。

- id: p8
  tier: thinking
  statement: |
    手电筒的灯泡放在凹面反射镜的焦点上。（1）射出的是什么样的光？（2）把灯泡往镜子方向挪近一点，或者往外挪一点，光束分别会怎样？（3）有的手电筒能转动头部调节光斑的大小，是什么道理？
  hints:
    - |
      光路可逆（principle of reversibility）：从焦点发出的光反射后平行于光轴。
    - |
      灯泡在焦点以内时，它的像是镜后的虚像；在焦点以外时，像是镜前的实像。
    - |
      转动头部改变了灯泡和镜子的距离。
  reference: |
    （1）从焦点发出的光，反射后平行于光轴，射出一束平行光，照得远，光斑大小几乎不变（灯泡不是一个点，实际光束略有发散）。

    （2）灯泡挪到焦点以内，它的像是镜后的虚像，反射光好像从镜后的那一点发出，光束发散，光斑大而暗。挪到焦点以外，反射光会聚到镜前的实像处，过了那一点再散开，近处光斑先变小，远处光斑反而变大。

    （3）转动头部改变灯泡离镜子的距离，在焦点附近前后移动，光束就在会聚、平行、发散之间变化，近处的光斑因此可大可小。
