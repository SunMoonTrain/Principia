- id: p1
  tier: easy
  statement: |
    一架天文望远镜物镜的直径是$20.0\,\mathrm{cm}$，对波长$500\,\mathrm{nm}$的光，它的最小分辨角是多少角秒？保留三位有效数字。
  answer:
    type: number
    value: 1.22*500e-9/0.200*180/pi*3600
    unit: |
      $''$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      按瑞利判据，最小分辨角$\theta_{\min}=1.22\frac\lambda D$。
    - |
      $\theta_{\min}=1.22\times\frac{500\times10^{-9}}{0.200}\,\mathrm{rad}=3.05\times10^{-6}\,\mathrm{rad}$，$1^\circ=3600''$。
    - |
      $3.05\times10^{-6}\times\frac{180}\pi\times3600''\approx0.629''$。
  solution: |
    $\theta_{\min}=1.22\frac\lambda D=1.22\times\frac{500\times10^{-9}}{0.200}\,\mathrm{rad}=3.05\times10^{-6}\,\mathrm{rad}$，换成角秒约$0.629''$。地面上大气的抖动通常让星像模糊到$1''$左右，这架望远镜在好的夜晚才能接近它的衍射极限。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        望远镜物镜的口径加倍，最小分辨角减半
      - |
        同一架望远镜，用红光观察比用蓝光能分辨更小的角度
      - |
        显微镜换一个放大率更高的目镜，能分辨的最小距离就变小
      - |
        两颗星对望远镜张的角比最小分辨角小得多时，望远镜里看到的只是一个光斑
      - |
        把显微镜物镜和标本之间的空气换成折射率为$1.5$的油，其他不变，能分辨的最小距离变为原来的$\frac23$
    value: [1, 4, 5]
  hints:
    - |
      $\theta_{\min}=1.22\frac\lambda D$；显微镜$d_{\min}=0.61\frac\lambda{n\sin u}$。
    - |
      能分辨的细节在物镜成像时就定下来了，目镜放大的是整个像。
    - |
      A、D、E 对；B、C 错。
  solution: |
    A 对：$\theta_{\min}$和$D$成反比。D 对：两个艾里斑几乎完全重叠，合起来是一个略拉长的光斑，分不出两颗。E 对：$d_{\min}$和$n$成反比，$n$从$1$变成$1.5$，$d_{\min}$变成原来的$\frac23$。

    B 错：$\theta_{\min}$和波长成正比，红光波长长，最小分辨角更大，分辨得更差。C 错：物镜成的像里两个艾里斑已经重叠，目镜把它们和它们的间距放大同样的倍数，重叠的照样重叠。

- id: p3
  tier: medium
  statement: |
    夜里迎面开来一辆汽车，两盏车灯相距$1.20\,\mathrm m$。眼睛的瞳孔直径按$5.0\,\mathrm{mm}$、光的波长按$550\,\mathrm{nm}$算，只考虑瞳孔的衍射，汽车在多远以内，眼睛才能分辨出两盏灯？以$\mathrm{km}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 1.20/(1.22*550e-9/5.0e-3)/1000
    unit: |
      $\mathrm{km}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      两盏灯对眼睛张的角不小于最小分辨角时才能分辨。
    - |
      $\theta_{\min}=1.22\frac\lambda D$，距离为$L$时两盏灯张的角约为$\frac{1.20\,\mathrm m}L$。
    - |
      $\theta_{\min}\approx1.342\times10^{-4}\,\mathrm{rad}$，$L=\frac{1.20}{1.342\times10^{-4}}\,\mathrm m\approx8.94\,\mathrm{km}$。
  solution: |
    $\theta_{\min}=1.22\times\frac{550\times10^{-9}}{5.0\times10^{-3}}\,\mathrm{rad}\approx1.342\times10^{-4}\,\mathrm{rad}$。两盏灯张的角$\frac{1.20}L\ge\theta_{\min}$，$L\le\frac{1.20}{1.342\times10^{-4}}\,\mathrm m\approx8.94\times10^3\,\mathrm m=8.94\,\mathrm{km}$。实际上大气的抖动、视网膜上感光细胞的间距都会让这个距离再短一些，这只是衍射给的上限。

- id: p4
  tier: medium
  statement: |
    显微镜的油浸物镜，油的折射率$1.52$，物镜收进的光锥半顶角$64.0^\circ$。用波长$450\,\mathrm{nm}$的蓝光照明，按$d_{\min}=0.61\frac{\lambda}{n\sin u}$，能分辨的最小距离是多少？以$\mathrm{nm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 0.61*450/(1.52*sin(64*pi/180))
    unit: |
      $\mathrm{nm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      数值孔径是$n\sin u$。
    - |
      $n\sin u=1.52\times\sin64.0^\circ\approx1.366$。
    - |
      $d_{\min}=\frac{0.61\times450\,\mathrm{nm}}{1.366}\approx201\,\mathrm{nm}$。
  solution: |
    数值孔径$n\sin u=1.52\times0.8988\approx1.366$，$d_{\min}=0.61\times\frac{450\,\mathrm{nm}}{1.366}\approx201\,\mathrm{nm}$，约$0.2\,\mu\mathrm m$。换成波长短的蓝光、用油浸，正是为了把这个距离压小；可见光显微镜大致就到这里为止。

- id: p5
  tier: hard
  statement: |
    显微镜的标本放在物镜的焦点附近，物镜的直径为$D$、焦距为$f$，从标本上一点看，物镜收进的光锥半顶角为$u$。

    （1）用望远镜的最小分辨角$1.22\frac\lambda D$说明：$u$不大时，物镜能分辨的两点最小距离约为$0.61\frac\lambda{\sin u}$。（2）标本和物镜之间是折射率为$n$的油时，为什么要把$\lambda$换成$\frac\lambda n$？

    （3）用$550\,\mathrm{nm}$的光，要分辨$0.15\,\mu\mathrm m$的细节，数值孔径至少要多大？做得到吗？做不到的话该怎么办？
  hints:
    - |
      标本在焦点附近，两点相距$d$，对物镜张的角约为$\frac df$。
    - |
      $\tan u=\frac{D}{2f}$，$u$小时$\sin u\approx\tan u$。光从标本发出、穿过油时的波长是多少？
    - |
      $n\sin u\ge\frac{0.61\times550}{150}\approx2.2$。
  reference: |
    （1）标本在物镜的焦点附近，两点相距$d$，对物镜张的角约为$\frac df$，物镜把它们各自成像为艾里斑。按瑞利判据，$\frac df\ge1.22\frac\lambda D$，即$d\ge1.22\frac{\lambda f}D=0.61\frac\lambda{D/(2f)}$。$\tan u=\frac D{2f}$，$u$小时$\sin u\approx\tan u$，所以$d_{\min}\approx0.61\frac\lambda{\sin u}$；$u$大时严格的结果仍是$\sin u$（要用到更细致的成像理论，这里不证）。

    （2）衍射发生在光离开标本、穿过油进入物镜的这一段，光在油里的波长是$\frac\lambda n$，把它代进上式，就是$d_{\min}=0.61\frac\lambda{n\sin u}$。油的折射率和玻璃接近，光从标本出来几乎不偏折，能收进的光锥也更大。

    （3）$n\sin u\ge0.61\times\frac{550}{150}\approx2.24$。$\sin u<1$，油的折射率也只有$1.5$左右，数值孔径最多约$1.4$，做不到。要么换更短的波长：用$1.4$的数值孔径，波长要短到$\frac{150\times1.4}{0.61}\,\mathrm{nm}\approx344\,\mathrm{nm}$以下，是紫外光；要么改用电子显微镜，电子的波长比光短得多。

- id: p6
  tier: hard
  statement: |
    （1）两条互不相干的线光源经过同一条狭缝，在远处各成一个单缝衍射图样$I_0\Bigl(\frac{\sin\beta}\beta\Bigr)^2$。两者正好相距到「一个的中心落在另一个的第一条暗纹上」，即$\beta$相差$\pi$。证明两个中心之间正中央的光强是一个中心处光强的$\frac8{\pi^2}\approx81\%$。

    （2）对圆孔，按瑞利判据刚好分辨时，正中央是峰值的约$74\%$。比较两者，说明这个判据为什么只是一种约定。

    （3）两颗星一亮一暗，亮度相差$10$倍，角距离正好等于最小分辨角，还能像两颗一样亮的星那样分辨吗？
  hints:
    - |
      一个中心在$\beta=0$，另一个在$\beta=\pi$；正中央两个图样都在$\beta=\frac\pi2$处。
    - |
      一个中心处，另一个图样正好是暗纹，光强为零。
    - |
      暗星的艾里斑叠在亮星艾里斑的外缘上，中间会不会出现凹陷？
  reference: |
    （1）一个中心处，自己的光强是$I_0$，另一个图样在它的第一条暗纹上，是$0$，合计$I_0$。正中央两个图样都在$\beta=\frac\pi2$处，各为$I_0\Bigl(\frac{1}{\pi/2}\Bigr)^2=\frac{4I_0}{\pi^2}$，合计$\frac{8I_0}{\pi^2}\approx0.81I_0$。两个中心处的导数恰好为零，那里就是峰，所以凹陷到峰值的约$81\%$。

    （2）同样是「一个的中心落在另一个的第一个暗处」，单缝凹陷到$81\%$，圆孔凹陷到$74\%$，凹陷的深浅随孔的形状变，并没有一个统一的「刚好看得出」的光强比。判据选第一个暗处，只是因为它好算、好记，大致对应眼睛能看出中间暗缝的程度；换个人、换种仪器，标准可以不同，比如有人把「中间的凹陷刚好消失」作为极限，那时两点还能更近一些。

    （3）不能那样分辨。暗星的艾里斑叠在亮星艾里斑的外缘上，合起来的光强从亮星的中心向外一路下降，到暗星的位置只是稍稍鼓起一点，中间不会出现明显的凹陷，眼睛看不出是两颗；要分开它们，角距离得比最小分辨角大。瑞利判据默认两个光源差不多亮，亮度悬殊时并不适用。

- id: p7
  tier: thinking
  statement: |
    （1）一台口径$100\,\mathrm m$的射电望远镜观测波长$21\,\mathrm{cm}$的射电波，最小分辨角大约多少？和口径$10\,\mathrm{cm}$的光学望远镜（$550\,\mathrm{nm}$）比，哪个分辨得清？（2）天文学家把相隔几千公里的射电望远镜同时对准同一个天体，把记录下来的信号合起来分析，为什么能大大提高分辨本领？（3）这和[相干性](lesson:physics.optics.coherence)第 7 题里迈克耳孙和皮斯量参宿四的办法有什么相似之处？
  hints:
    - |
      $\theta_{\min}=1.22\frac\lambda D$，把两者的$\frac\lambda D$比一比。
    - |
      决定分辨本领的是能收到同一波阵面的两点相隔多远。
    - |
      两面反射镜隔开$3\,\mathrm m$，相当于一架多大口径的望远镜？
  reference: |
    （1）射电望远镜：$1.22\times\frac{0.21}{100}\,\mathrm{rad}\approx2.6\times10^{-3}\,\mathrm{rad}$，约$9'$；光学望远镜：$1.22\times\frac{550\times10^{-9}}{0.10}\,\mathrm{rad}\approx6.7\times10^{-6}\,\mathrm{rad}$，约$1.4''$。口径小一千倍的光学望远镜，分辨得反而清楚几百倍，因为射电波的波长长了约四十万倍。

    （2）衍射极限$\frac\lambda D$里的$D$，说的是同一波阵面上相隔多远的两点的波能够叠加比较。几台望远镜同时记录，再把信号按到达时间对齐、叠加，相当于收集了整个大圆面里分散几处的波，最远的两台相隔多远，就有多大的「口径」。相隔$10^4\,\mathrm{km}$、在毫米波段观测，分辨角可达$10^{-10}\,\mathrm{rad}$量级，2019 年公布的第一张黑洞照片就是这样拍出来的（事件视界望远镜，Event Horizon Telescope）。代价是只在几个点上收光，收到的光少，要靠计算把图像恢复出来。

    （3）原理相同。迈克耳孙和皮斯用横梁上相隔几米的两面反射镜代替整个镜面，条纹的可见度随间距的变化告诉他们星的角大小，分辨本领由间距而不是望远镜的口径决定；射电干涉阵用的也是同一波阵面上两个远处的点的光能否干涉，只是把「两面反射镜」换成了几千公里外的两台望远镜。

- id: p8
  tier: thinking
  statement: |
    （1）一架口径$10\,\mathrm m$的地面望远镜，对$500\,\mathrm{nm}$的光最小分辨角约$0.013''$；可地面上大气的抖动让星像模糊成约$0.5''$到$1''$的光斑。这时决定它分辨本领的是什么？天文学家有哪些办法？

    （2）瑞利判据是不是分辨能力不可逾越的界限？

    （3）2014 年的诺贝尔化学奖授给了「超分辨荧光显微镜」：让样品里的荧光分子一批批、零零星星地发光，每次只亮少数几个。这样做为什么能看清比$0.2\,\mu\mathrm m$小得多的结构？
  hints:
    - |
      比较$0.013''$和$0.5''$。
    - |
      事先知道光源就是两个点、亮度相近时，测得的光强分布里有更多信息。
    - |
      一个孤立的艾里斑，中心的位置能测得比艾里斑的半径准得多。
  reference: |
    （1）大气的抖动比衍射极限大几十倍，分辨本领实际由大气决定。办法有：把望远镜放到太空里，如哈勃空间望远镜；把望远镜建在高山上、空气稳定干燥的地方；用自适应光学，实时测量星光波阵面被大气扭曲的样子，用能变形的镜子每秒调整几百次，把它校正回来。

    （2）不是。它是「眼睛看得出中间有暗缝」的一种约定。如果事先知道是两个点光源，就可以拿两个艾里斑相加的模型去拟合测得的光强分布，求出两者的位置，角距离比$\theta_{\min}$小一些也能分开，只是光强测得越准、噪声越小才行。真正的限制来自测量的噪声，而不是一条截然的界线。

    （3）同时发光的分子之间相隔都很远，各自的艾里斑互不重叠。一个孤立的艾里斑，虽然有约$0.2\,\mu\mathrm m$宽，它中心的位置却能从光强分布测得准得多，收到的光子越多越准，可以到几纳米到几十纳米。一批批地定出每个分子的位置，再把它们拼在一起，就得到远比衍射极限精细的图像。它没有推翻瑞利判据：任一时刻相互靠近的两个分子并不同时发光。
