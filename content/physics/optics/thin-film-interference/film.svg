  <text x="60.0" y="216.0" fill="currentColor"><tspan font-style="italic">n</tspan></text>
  <text x="60.0" y="286.0" fill="currentColor"><tspan font-style="italic">n</tspan><tspan dy="4" font-size="11">s</tspan></text>
  <line x1="123.6" y1="55.1" x2="212.8" y2="161.4" style="stroke: currentColor" stroke-width="1.4" />
