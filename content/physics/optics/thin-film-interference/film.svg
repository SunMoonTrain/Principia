<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" width="660" height="310" font-size="14">
  <!-- 薄膜干涉：光以入射角 i 射到厚为 t、折射率为 n 的薄膜上。一部分在上表面 A 点反射，成为光线 1；一部分折射进膜，在下表面 B 点反射，再从上表面 C 点射出，成为光线 2，和光线 1 平行。过 C 作光线 1 的垂线，垂足为 D，从 C、D 往后两束光走的路程相同；两束光的光程差是 n(AB + BC) − n0·AD，等于 2nt cosθt，θt 是膜里的折射角。 -->
  <path d="M 40.0 170.0 L 580.0 170.0 L 580.0 250.0 L 40.0 250.0 Z" style="fill: var(--muted, #6b7280); stroke: none" fill="var(--muted, #6b7280)" stroke-width="0.0" stroke-linejoin="round" fill-opacity="0.12" />
  <line x1="40.0" y1="170.0" x2="580.0" y2="170.0" style="stroke: currentColor" stroke-width="1.4" />
  <line x1="40.0" y1="250.0" x2="580.0" y2="250.0" style="stroke: currentColor" stroke-width="1.4" />
