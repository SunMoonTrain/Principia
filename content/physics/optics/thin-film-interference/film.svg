  <line x1="220.0" y1="170.0" x2="251.4" y2="132.6" style="stroke: var(--accent, #2563eb)" stroke-width="3.2" />
  <line x1="220.0" y1="100.0" x2="220.0" y2="250.0" style="stroke: var(--muted, #6b7280)" stroke-width="0.8" stroke-dasharray="2 3" />
