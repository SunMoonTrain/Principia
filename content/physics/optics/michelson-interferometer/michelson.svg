  <line x1="248.0" y1="70.0" x2="248.0" y2="92.0" style="stroke: currentColor" stroke-width="1.0" />
  <line x1="244.0" y1="70.0" x2="252.0" y2="70.0" style="stroke: currentColor" stroke-width="1.0" />
  <line x1="244.0" y1="92.0" x2="252.0" y2="92.0" style="stroke: currentColor" stroke-width="1.0" />
  <text x="242.0" y="86.0" fill="currentColor" text-anchor="end"><tspan font-style="italic">d</tspan></text>
