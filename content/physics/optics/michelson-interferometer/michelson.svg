<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-size="14">
  <!-- 迈克耳孙干涉仪：光源 S 发出的光射到斜放 45° 的分束器 G1 上，一半反射向上到反射镜 M1，一半透过向右，穿过补偿板 G2 到反射镜 M2；两路光各自原路反射回来，在 G1 上会合，一起射向下方的观察者。从观察者这边看，M2 在 G1 里的像 M2′ 和 M1 平行、相距 d，干涉仪相当于 M1 和 M2′ 之间一层厚为 d 的空气膜。 -->
  <circle cx="70.0" cy="220.0" r="9.0" style="stroke: currentColor" fill="none" stroke-width="1.4" />
  <text x="70.0" y="248.0" fill="currentColor" text-anchor="middle"><tspan font-style="italic">S</tspan></text>
  <text x="70.0" y="270.0" fill="currentColor" text-anchor="middle">扩展光源</text>
  <line x1="276.0" y1="244.0" x2="324.0" y2="196.0" style="stroke: currentColor" stroke-width="4.0" />
  <line x1="279.0" y1="247.0" x2="327.0" y2="199.0" style="stroke: var(--accent, #2563eb)" stroke-width="1.6" />
  <text x="270.0" y="264.0" fill="currentColor" text-anchor="end"><tspan font-style="italic">G</tspan><tspan dy="4" font-size="11">1</tspan></text>
  <text x="270.0" y="289.0" fill="currentColor" text-anchor="end">分束器</text>
  <line x1="356.0" y1="244.0" x2="404.0" y2="196.0" style="stroke: currentColor" stroke-width="4.0" />
  <text x="384.0" y="264.0" fill="currentColor" text-anchor="middle"><tspan font-style="italic">G</tspan><tspan dy="4" font-size="11">2</tspan></text>
  <text x="384.0" y="289.0" fill="currentColor" text-anchor="middle">补偿板</text>
  <line x1="260.0" y1="70.0" x2="340.0" y2="70.0" style="stroke: currentColor" stroke-width="4.0" />
  <text x="348.0" y="75.0" fill="currentColor"><tspan font-style="italic">M</tspan><tspan dy="4" font-size="11">1</tspan></text>
