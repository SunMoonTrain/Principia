  <text x="500.0" y="190.0" fill="currentColor"><tspan font-style="italic">M</tspan><tspan dy="4" font-size="11">2</tspan></text>
  <line x1="260.0" y1="92.0" x2="340.0" y2="92.0" style="stroke: var(--muted, #6b7280)" stroke-width="1.4" stroke-dasharray="5 3" />
