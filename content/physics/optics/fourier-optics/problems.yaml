- id: p1
  tier: easy
  statement: |
    一块很宽的光栅，透过的光的振幅沿$x$方向按余弦起伏，周期是$2.0\,\mu\mathrm m$（没有一条条的缝）。用波长$500\,\mathrm{nm}$的平行光垂直照射，除了正前方，远处还有衍射光的方向偏离原方向多少度？保留三位有效数字。
  answer:
    type: number
    value: asin(500e-9/2.0e-6)*180/pi
    unit: |
      $^\circ$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      周期为$d$的余弦起伏，空间频率是$\frac1d$。
    - |
      空间频率为$\frac1d$的成分把光送往$\sin\theta=\frac\lambda d$的方向（正负两边各一个）。
    - |
      $\sin\theta=\frac{0.50}{2.0}=0.25$，$\theta\approx14.5^\circ$。
  solution: |
    孔径函数是常数加上一个周期为$d$的余弦，余弦只有$\pm\frac1d$两个空间频率，把光送往$\sin\theta=\pm\frac\lambda d=\pm0.25$，即偏离原方向约$14.5^\circ$的两侧，再没有别的级。一条条缝组成的光栅，在同样的方向上是第一级，另外还有第二级、第三级等等。

- id: p2
  tier: easy
  statement: |
    下面关于夫琅禾费衍射的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        把一块光栅在它的平面里沿垂直于缝的方向平移半个光栅常量，远处各级主极大的位置和亮度都不变
      - |
        缝宽比波长大得多时，把单缝的宽度加倍，中央亮纹的角宽度减半
      - |
        透过率按$\cos^2\frac{\pi x}d$变化的宽光栅，远处只有零级和正负一级主极大
      - |
        一根细丝和同样宽的单缝，在原方向附近的衍射光强也相同
      - |
        孔径函数里空间频率高于$\frac1\lambda$的成分，会把光衍射到很大的角度上
    value: [1, 2, 3]
  hints:
    - |
      平移只让傅里叶变换乘一个模为$1$的因子；孔径函数拉宽，变换就缩窄。
    - |
      $\cos^2\frac{\pi x}d=\frac12\Bigl(1+\cos\frac{2\pi x}d\Bigr)$；$\sin\theta$不能大于$1$。
    - |
      A、B、C 对；D、E 错。
  solution: |
    A 对：平移让$T$乘$e^{-iqx_0}$，模不变，光强处处不变。B 对：缝宽为$a$时变换是$a\frac{\sin(qa/2)}{qa/2}$，缝宽加倍，第一个零点的$q$减半；缝宽比波长大得多时角度小，$\sin\theta\approx\theta$，中央亮纹的角宽度也减半。C 对：$\cos^2\frac{\pi x}d=\frac12+\frac12\cos\frac{2\pi x}d$，只有$0$和$\pm\frac1d$三个空间频率，和例 1 一样只有三级。

    D 错：按巴比涅原理，两者只在原方向附近以外相同；原方向附近，单缝的中央亮纹和细丝旁边没被挡住的直射光不一样。E 错：空间频率高于$\frac1\lambda$的成分要求$\sin\theta>1$，它的光传不到远处，远处的图样里看不到它。

- id: p3
  tier: medium
  statement: |
    一块光栅的缝宽是光栅常量的$\frac13$，平行光垂直照射。第一级主极大的光强是零级的多少倍？保留三位有效数字。
  answer:
    type: number
    value: (sin(pi/3)/(pi/3))^2
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      光栅是一条缝和一排间距为$d$的细线的卷积，各级主极大的亮度由一条缝的衍射因子决定。
    - |
      第$m$级在$\frac{d\sin\theta}\lambda=m$，一条缝的因子是$\Bigl(\frac{\sin\beta}\beta\Bigr)^2$，$\beta=\frac{\pi a\sin\theta}\lambda=\frac{\pi m a}d$。
    - |
      $\beta=\frac\pi3$，$\Bigl(\frac{\sin(\pi/3)}{\pi/3}\Bigr)^2\approx0.684$。
  solution: |
    由卷积定理，各级主极大的光强之比就是一条缝的衍射因子在各级方向上的值之比。零级$\beta=0$，因子为$1$；第一级$\frac{d\sin\theta}\lambda=1$，$\beta=\frac{\pi a}d=\frac\pi3$，因子$\Bigl(\frac{\sqrt3/2}{\pi/3}\Bigr)^2=\frac{27}{4\pi^2}\approx0.684$。第三级$\beta=\pi$，因子为零，缺级。

- id: p4
  tier: medium
  statement: |
    一块光栅的光栅常量是$2.0\,\mu\mathrm m$，现在每隔一条缝盖上一层透明膜，使透过这些缝的光相位落后$\pi$，其余不变。用波长$600\,\mathrm{nm}$的平行光垂直照射，远处离正前方最近的亮纹偏离原方向多少度？保留三位有效数字。
  answer:
    type: number
    value: asin(600e-9/(2*2.0e-6))*180/pi
    unit: |
      $^\circ$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      盖膜以后，孔径函数的周期变成$2d$，主极大可能出现在$\sin\theta=\frac{m\lambda}{2d}$。
    - |
      一个周期里是一条$t=1$的缝和一条$t=-1$的缝，相距$d$，这个单元的变换正比于$1-e^{-iqd}$；$q=k\sin\theta=\frac{\pi m}d$时它等于$1-(-1)^m$。
    - |
      $m$为偶数（包括$0$）时为零，只剩奇数级：$\sin\theta=\frac{\lambda}{2d}=0.15$，$\theta\approx8.63^\circ$。
  solution: |
    $t$按$+1$、$-1$交替，周期是$2d=4.0\,\mu\mathrm m$，排列决定主极大只可能在$\sin\theta=\frac{m\lambda}{2d}$。一个周期的单元是相距$d$、一正一负的两条缝，变换是一条缝的变换乘$1-e^{-iqd}$，在$\sin\theta=\frac{m\lambda}{2d}$处$qd=\pi m$，因子为$1-(-1)^m$：$m$为偶数时为零，零级也没有了。离正前方最近的是$m=\pm1$，$\sin\theta=\frac{600\times10^{-9}}{4.0\times10^{-6}}=0.15$，$\theta\approx8.63^\circ$，比原来光栅的第一级（$17.5^\circ$）近了一半。

- id: p5
  tier: hard
  statement: |
    （1）证明卷积定理：$f*g$的傅里叶变换等于$F(q)G(q)$。（2）$N$条一样的缝，中心分别在$x_1,\dots,x_N$。用（1）或傅里叶变换的平移性质证明：远处的光强等于「一条缝的衍射因子」乘「只由$x_1,\dots,x_N$决定的因子」。（3）两个互补的屏孔径函数之和为$1$，用傅里叶变换证明巴比涅原理。
  hints:
    - |
      $\int e^{-iqx}\int f(x-x')g(x')\,\dd x'\,\dd x$，交换两重积分的次序，再令$u=x-x'$。
    - |
      $N$条缝的孔径函数是$\sum_jt_1(x-x_j)$，$t_1$是一条中心在原点的缝。
    - |
      傅里叶变换是线性的；没有遮挡时，夫琅禾费衍射的光只在原方向附近。
  reference: |
    （1）$\int_{-\infty}^{\infty}e^{-iqx}\int_{-\infty}^{\infty}f(x-x')g(x')\,\dd x'\,\dd x$。两个函数都可积时，可以交换积分的次序（见[二重积分](lesson:math.vector-calculus.double-integrals)），先对$x$积分：令$u=x-x'$，$\int f(x-x')e^{-iqx}\,\dd x=e^{-iqx'}\int f(u)e^{-iqu}\,\dd u=e^{-iqx'}F(q)$。再对$x'$积分，得$F(q)\int g(x')e^{-iqx'}\,\dd x'=F(q)G(q)$。

    （2）$t(x)=\sum_jt_1(x-x_j)$，由平移性质，$T(q)=T_1(q)\sum_je^{-iqx_j}$，光强正比于$|T_1|^2\Bigl|\sum_je^{-iqx_j}\Bigr|^2$。第一个因子是一条缝的衍射因子，第二个只由各缝的位置决定。也可以把$t$看成$t_1$和$N$个很窄、面积为$1$的尖峰的卷积，尖峰的变换就是$\sum_je^{-iqx_j}$，用（1）得到同样的结果。等间距$x_j=jd$时，第二个因子是$\Bigl(\frac{\sin N\gamma}{\sin\gamma}\Bigr)^2$，回到光栅的公式。

    （3）$t_1+t_2=1$，线性给出$T_1+T_2=T_{\text{无}}$，$T_{\text{无}}$是没有遮挡（照明范围宽为$W$）时的变换，只在$|q|\lesssim\frac{2\pi}W$的很窄范围里不为零，即只在原方向附近有光。在其余的方向上$T_2=-T_1$，$|T_2|^2=|T_1|^2$，两个屏的衍射图样相同。

- id: p6
  tier: hard
  statement: |
    光沿$z$轴传播，孔在$xy$平面里，远处的方向用$\sin\theta_x$、$\sin\theta_y$表示（分别是传播方向和$z$轴在$xz$、$yz$平面里的夹角的正弦，角度小）。二维的孔径函数$t(x,y)$同样决定远处的振幅：$\iint t(x,y)e^{ik(x\sin\theta_x+y\sin\theta_y)}\,\dd x\,\dd y$。

    （1）长$a$（沿$x$）、宽$b$（沿$y$）的矩形孔，证明光强正比于$\Bigl(\frac{\sin\beta_x}{\beta_x}\Bigr)^2\Bigl(\frac{\sin\beta_y}{\beta_y}\Bigr)^2$，$\beta_x=\frac{\pi a\sin\theta_x}\lambda$，$\beta_y=\frac{\pi b\sin\theta_y}\lambda$。（2）$a=2b$时，中央亮斑沿哪个方向更长？长几倍？（3）透过一块纱窗（两组互相垂直的细丝，间距都是$d$）看远处的路灯，会看到什么？
  hints:
    - |
      矩形孔的孔径函数是$t(x,y)=t_a(x)t_b(y)$，积分分成两个一维积分的乘积。
    - |
      中央亮斑沿$x$方向到$\sin\theta_x=\frac\lambda a$，沿$y$方向到$\sin\theta_y=\frac\lambda b$。
    - |
      纱窗是一个小方孔在两个方向上的周期排列。
  reference: |
    （1）$t(x,y)=t_a(x)t_b(y)$，二重积分分成$\int t_a(x)e^{ikx\sin\theta_x}\,\dd x\cdot\int t_b(y)e^{iky\sin\theta_y}\,\dd y$，两个都是单缝的积分，分别正比于$\frac{\sin\beta_x}{\beta_x}$和$\frac{\sin\beta_y}{\beta_y}$，光强是它们的平方相乘。

    （2）中央亮斑沿$x$方向伸到$\sin\theta_x=\pm\frac\lambda a$，沿$y$方向伸到$\sin\theta_y=\pm\frac\lambda b$；$a=2b$时，沿$y$方向的范围是沿$x$方向的$2$倍。孔沿$x$方向长，衍射图样反而沿$y$方向长：孔窄的方向，光散得开。

    （3）纱窗是一个小方孔在$x$、$y$两个方向上以间距$d$重复排列，二维的卷积定理照样成立：衍射图样是一排排亮点，位置在$\sin\theta_x=\frac{m\lambda}d$、$\sin\theta_y=\frac{n\lambda}d$（$m$、$n$是整数），组成一个方形的点阵，亮度由一个小方孔的衍射因子决定，越往外越暗。白光的路灯会被拉成一个十字形排列的彩色点阵，每个点的外侧偏红。

- id: p7
  tier: thinking
  statement: |
    （1）把一块光栅放在透镜前面，用平行光照射，透镜的焦平面上看到一排亮点。为什么焦平面上的光强分布就是光栅孔径函数的傅里叶变换的模的平方？

    （2）在焦平面上放一块挡板，只让零级和正负一级通过，再用另一块透镜把光重新会聚成光栅的像。像和原来的光栅有什么不同？只让零级通过呢？

    （3）阿贝（Ernst Abbe）据此认为：显微镜的物镜至少要收进物体衍射出的零级和一级，才能在像里看出周期为$d$的结构。由此估计能看清的最小周期和物镜收光的角度有什么关系。
  hints:
    - |
      透镜把同一方向的平行光会聚到焦平面上同一点，焦平面上一点对应远处的一个方向。
    - |
      挡掉高的空间频率，像里就少了对应的细节；只留零级，像里只剩均匀的照明。
    - |
      物镜能收进的最大角度为$u$时，要求一级的$\sin\theta=\frac\lambda d\le\sin u$。
  reference: |
    （1）透镜把沿同一方向传播的平行光会聚到焦平面上的同一点（离光轴$f\tan\theta$），焦平面上每一点对应远处的一个方向。远处的光强分布是孔径函数的傅里叶变换的模的平方，所以焦平面上看到的也是，这时透镜把「无限远」搬到了焦平面上，焦平面就叫傅里叶平面。

    （2）只留零级和正负一级，像只含空间频率$0$和$\pm\frac1d$，是一个按余弦平滑起伏的明暗条纹，周期还是$d$，但原来缝的边缘那种陡的变化没有了；只留零级，像里只有均匀的亮光，看不出任何条纹。挡掉哪些空间频率，像里就少掉对应的细节，这叫空间滤波，相衬显微镜、图像处理都用它。

    （3）周期为$d$的结构，一级衍射在$\sin\theta=\frac\lambda d$。物镜收光的半角为$u$时，要收进一级，需$\frac\lambda d\le\sin u$，即$d\ge\frac\lambda{\sin u}$；斜着照明、让零级从一侧进去时，还能再好一倍，到$\frac\lambda{2\sin u}$。这和[圆孔衍射与分辨本领](lesson:physics.optics.resolving-power)里$0.61\frac\lambda{n\sin u}$是同一个量级，说法不同，系数不同，都说明分辨的极限由波长和收光的角度决定。

- id: p8
  tier: thinking
  statement: |
    （1）X 射线照到晶体上，后面的底片上出现一个个排列整齐的斑点。用卷积定理说说：斑点的位置和斑点的亮度各由晶体的什么决定？

    （2）底片只记下光强，也就是傅里叶变换的模的平方，丢掉了相位。为什么这样就不能直接把晶胞里原子的分布算回来？举一个两种不同的孔径函数给出同样衍射图样的例子。

    （3）晶体学家是怎样克服这个困难的？说一种你能想到的办法。
  hints:
    - |
      晶体是一个晶胞按点阵重复排列而成。
    - |
      $t(x)$和$t(-x)$、$t(x)$和$t(x-x_0)$的变换的模有什么关系？
    - |
      如果晶胞里有一个位置已知、散射特别强的原子……
  reference: |
    （1）晶体是晶胞和点阵的卷积，衍射图样是点阵的变换乘晶胞的变换。点阵的变换是一个个尖锐的斑点，决定斑点的位置，由点阵的形状和间距决定；晶胞的变换在各个斑点处的大小决定斑点的亮度，由晶胞里原子怎样分布决定。

    （2）傅里叶变换可以算回原来的函数，但要知道每个$q$处的模和相位。只有模的话，许多不同的函数都对得上：$t(x)$和$t(-x)$（左右翻过来）的变换互为共轭，模相同；$t(x-x_0)$只多了一个相位因子，模也相同；更一般地，把各个$q$处的相位随便换一换，就得到一个模相同、样子却完全不同的函数。所以由光强不能唯一地确定原子的分布，这叫「相位问题」。

    （3）办法之一是在晶体里引入一个重原子（比如汞、铂），它散射得特别强，先由衍射图样定出它的位置，再以它的散射为参照，推出别的斑点的相位；也可以先猜一个大致的结构，算出它的衍射图样和测量的比较，反复修改，直到吻合。1952 年富兰克林（Rosalind Franklin）拍下的 DNA 的 X 射线衍射照片呈 X 形，正是螺旋结构的标志，帮助沃森和克里克确定了双螺旋。
