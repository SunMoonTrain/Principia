- id: p1
  tier: easy
  statement: |
    一束光从空气射到玻璃上，入射角是$60^\circ$，玻璃的折射率是$1.50$，空气的折射率取$1$。折射角是多少度？保留三位有效数字。
  answer:
    type: number
    value: asin(sin(60*pi/180)/1.50)*180/pi
    unit: |
      $^\circ$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      用折射定律$n_1\sin\theta_1=n_2\sin\theta_2$，空气一侧$n_1=1$。
    - |
      $\sin\theta_2=\frac{\sin60^\circ}{1.50}\approx\frac{0.8660}{1.50}$。
    - |
      $\sin\theta_2\approx0.5774$，$\theta_2\approx35.3^\circ$。
  solution: |
    由折射定律，$\sin\theta_2=\frac{\sin60^\circ}{1.50}\approx0.5774$，$\theta_2\approx35.3^\circ$。折射角比入射角小，光线偏向法线。

- id: p2
  tier: easy
  statement: |
    下面的说法哪些对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        光从空气斜射进折射率为$1.5$的玻璃，不管入射角多大，折射角都小于$42^\circ$
      - |
        黄光从空气进入水中，速度变小，波长不变
      - |
        光在折射率为$1.5$的玻璃里的速度约为$2.0\times10^8\,\mathrm{m/s}$
      - |
        光从水斜射进折射率比水大的玻璃，折射光线偏向法线
      - |
        入射角增大到原来的$2$倍，折射角也增大到原来的$2$倍
    value: [1, 3, 4]
  hints:
    - |
      折射定律$n_1\sin\theta_1=n_2\sin\theta_2$；折射率$n=\frac cv$。
    - |
      入射角最大接近$90^\circ$；光的频率在界面上不变，速度等于波长乘以频率。
    - |
      A、C、D 对；B、E 错。
  solution: |
    A 对：入射角最大接近$90^\circ$，$\sin\theta_2<\frac1{1.5}\approx0.667$，$\theta_2<41.8^\circ$。C 对：$v=\frac cn=\frac{3.0\times10^8}{1.5}\,\mathrm{m/s}=2.0\times10^8\,\mathrm{m/s}$。D 对：$n_2>n_1$，$\sin\theta_2<\sin\theta_1$。

    B 错：频率不变，速度变成$\frac cn$，波长也变成真空中的$\frac1n$。E 错：成比例的是正弦而不是角度本身，例如从空气射进$n=1.5$的玻璃，入射角$20^\circ$时折射角约$13.2^\circ$，$40^\circ$时约$25.4^\circ$，不是$2$倍。

- id: p3
  tier: medium
  statement: |
    一块平行玻璃板厚$1.0\,\mathrm{cm}$，折射率$1.50$，放在空气里。一束光以$45^\circ$的入射角射到板上，从另一面射出，射出的光线和入射光线平行。求两条光线之间的距离（侧移），以$\mathrm{mm}$为单位，保留三位有效数字。
  answer:
    type: number
    value: 10*sin(pi/4 - asin(sin(pi/4)/1.50))/cos(asin(sin(pi/4)/1.50))
    unit: |
      $\mathrm{mm}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      先由折射定律求板里的折射角$\theta_2$。
    - |
      光在板里走过的路程是$\frac{d}{\cos\theta_2}$，它偏离原来方向的角度是$\theta_1-\theta_2$，侧移$\Delta=\frac{d\sin(\theta_1-\theta_2)}{\cos\theta_2}$。
    - |
      $\theta_2\approx28.13^\circ$，$\Delta=\frac{10\times\sin16.87^\circ}{\cos28.13^\circ}\,\mathrm{mm}\approx3.29\,\mathrm{mm}$。
  solution: |
    $\sin\theta_2=\frac{\sin45^\circ}{1.50}\approx0.4714$，$\theta_2\approx28.13^\circ$。光在板里走过$\frac{d}{\cos\theta_2}$，方向比原来偏了$\theta_1-\theta_2\approx16.87^\circ$，所以侧移$\Delta=\frac{d\sin(\theta_1-\theta_2)}{\cos\theta_2}=\frac{10\times0.2902}{0.8819}\,\mathrm{mm}\approx3.29\,\mathrm{mm}$。板越厚、入射角越大，侧移越大；垂直入射时没有侧移。

- id: p4
  tier: medium
  statement: |
    两块平面镜竖直放置，镜面互成$60^\circ$角，像一本半开的书。一束水平的光先射到一块镜子上，反射后再射到另一块镜子上，然后射出。射出光线的传播方向和最初的传播方向之间的夹角是多少度？
  answer:
    type: number
    value: 120
    unit: |
      $^\circ$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      光线和镜面的夹角为$\beta$时，反射后传播方向改变$2\beta$。
    - |
      两块镜子和两次反射之间的那段光线围成一个三角形，两次反射处的夹角满足$\beta_1+\beta_2=180^\circ-60^\circ$。
    - |
      方向一共改变$2(\beta_1+\beta_2)=240^\circ$，也就是朝另一边转了$120^\circ$。
  solution: |
    光线和镜面的夹角为$\beta$时，入射角是$90^\circ-\beta$，反射后方向改变$180^\circ-2(90^\circ-\beta)=2\beta$。两块镜子和两次反射之间的那段光线围成三角形，镜子的夹角$60^\circ$加上两处的$\beta_1$、$\beta_2$是$180^\circ$，所以$\beta_1+\beta_2=120^\circ$，方向一共改变$240^\circ$，等于朝另一边转$120^\circ$。射出光线和最初的传播方向夹角是$120^\circ$，和光射到第一块镜子的角度无关；镜子成$90^\circ$时就是$180^\circ$，光沿原方向返回。

- id: p5
  tier: hard
  statement: |
    （1）仿照讲解里推折射定律的波阵面作图，证明反射角等于入射角。（2）平面镜前一点$S$发出的光射到镜面上，证明每条反射光线反向延长都经过镜后和$S$关于镜面对称的点$S'$。
  hints:
    - |
      反射光和入射光在同一种介质里，同一段时间里走过的路程相同。
    - |
      作图里两个直角三角形有公共的斜边，还有一条直角边相等，所以全等。
    - |
      （2）设光射到镜面上的$P$点，三角形$SPS'$是等腰三角形，镜面是它的对称轴。
  reference: |
    （1）平行光的波阵面$AB$斜着射到镜面上，$A$先到。$B$点的光再走$vt$到达镜面上的$B'$，同一段时间里$A$点的光反射回原来的介质，也走了$vt$到$A'$，反射光的波阵面是$A'B'$。直角三角形$ABB'$和$B'A'A$有公共斜边$AB'$，直角边$BB'=AA'=vt$，所以全等，波阵面和镜面的夹角相等，也就是反射角等于入射角。两条光线和法线都在同一个平面内，反射光线在入射面内、和入射光线分居法线两侧。

    （2）设$S$离镜面$h$，$S'$在镜后离镜面$h$，两点的连线垂直于镜面。$S$发出的光射到镜面上的$P$点，$PS=PS'$，镜面平分$\angle SPS'$，所以$S'P$和法线的夹角等于$SP$和法线的夹角，即入射角。反射光线在法线的另一侧、和法线夹角等于入射角，正好是$S'P$过$P$的延长线。对每个$P$都这样，所以所有反射光线都像是从$S'$发出的。

- id: p6
  tier: hard
  statement: |
    三块平面镜两两垂直，像房间的一个墙角那样拼在一起，叫作角反射器（corner reflector）。证明：光在三块镜子上各反射一次以后，射出的光线和入射光线平行、方向相反。1969 年，阿波罗 11 号的宇航员在月面上放了一块装着$100$个角反射器的板，地面射去的激光脉冲碰到它就沿原方向返回，量出往返的时间就能测出地月距离，这块板至今仍在使用。
  hints:
    - |
      取三块镜子的法线为$x$、$y$、$z$轴，光的传播方向用单位矢量$\vb d$表示。
    - |
      在法线为$\vb u$（单位矢量）的镜面上反射，$\vb d$变成$\vb d-2(\vb d\cdot\vb u)\vb u$：沿法线的分量变号，平行于镜面的分量不变。
    - |
      三次反射分别把$d_x$、$d_y$、$d_z$变号，最后$\vb d$变成$-\vb d$，和反射的先后顺序无关。
  reference: |
    把$\vb d$分成沿法线和平行于镜面的两部分。由反射定律，反射后平行于镜面的部分不变，沿法线的部分大小不变、方向相反，所以$\vb d'=\vb d-2(\vb d\cdot\vb u)\vb u$。取三块镜子的法线为坐标轴，在法线为$x$轴的镜子上反射，$(d_x,d_y,d_z)$变成$(-d_x,d_y,d_z)$；另外两块镜子分别把$d_y$、$d_z$变号。三次反射以后$\vb d'=(-d_x,-d_y,-d_z)=-\vb d$，射出的光线和入射光线平行、方向相反，和光先射到哪块镜子无关。

    射出的光线并不和入射光线重合，而是错开一点，错开的距离和角反射器的大小相当。所以从月面返回的光只回到发射点附近，地面的望远镜既当发射器又当接收器。只有两块互相垂直的镜子时，只有垂直于两块镜子交线的那个分量和原来相反（第 4 题夹角取$90^\circ$的情形）。

- id: p7
  tier: thinking
  statement: |
    岸上的人和水里的鱼互相看。（1）鱼看到的人，比人实际的位置高还是低？（2）人看到的鱼，比鱼实际的位置深还是浅？（3）人能看到鱼的眼睛时，鱼一定也能看到人的眼睛吗？
  hints:
    - |
      光从空气斜射进水里偏向法线，从水里斜射出来偏离法线；眼睛沿射进眼睛的光线反向延长去找物体。
    - |
      鱼看人时，从人射来的光进入水后变得更陡，反向延长后指向哪里？
    - |
      光路可逆。
  reference: |
    （1）偏高。人身上发出的光斜射进水里，偏向法线，射进鱼眼时比原来更陡；鱼沿这条光线反向延长，找到的点比人实际的位置高。

    （2）偏浅。鱼发出的光斜射出水面，偏离法线，射进人眼时比原来更平；人沿它反向延长，看到的点在鱼的上方，竖直往下看时深度约为实际的$\frac1{1.33}$（例 2），斜着看更浅。

    （3）一定。人能看到鱼的眼睛，说明有一条光路从鱼眼到人眼；由光路可逆，从人眼沿这条路反向射出的光会到达鱼眼。两者「看到」的都是对方的虚像，位置都不在对方真实的地方，可光路是同一条。

- id: p8
  tier: thinking
  statement: |
    手边有一个装满水的透明方形水缸、一把刻度尺、一枚硬币和一支激光笔。（1）设计一个测水的折射率的方法。（2）如果用「看上去的深度」来测，为什么必须尽量竖直往下看？（3）怎样减小测量的误差？
  hints:
    - |
      可以直接用折射定律，量出入射角和折射角的正弦；也可以用例 2 的结论$h'\approx\frac hn$。
    - |
      例 2 里用了$\tan\theta\approx\sin\theta$，角度越大，这个近似越差。
    - |
      多测几组、取不同的入射角，看$\frac{\sin\theta_1}{\sin\theta_2}$是不是常数。
  reference: |
    （1）方法一：让激光笔的光斜射到水面上，在缸壁上标出入射点、水底的光斑，用刻度尺量出水平和竖直的距离，算出$\sin\theta_1$和$\sin\theta_2$，$n=\frac{\sin\theta_1}{\sin\theta_2}$（空气按$1$算）。方法二：把硬币放在缸底，竖直往下看，用一支铅笔在缸外上下移动，找到和硬币的像对齐的位置，量出看到的深度$h'$和水深$h$，$n\approx\frac h{h'}$。

    （2）方法二用了$\tan\theta\approx\sin\theta$。竖直往下看时进入眼睛的光线和法线的夹角很小，近似很好；斜着看时角度大，$\frac{\tan\theta_2}{\tan\theta_1}$和$\frac{\sin\theta_2}{\sin\theta_1}$相差明显，算出的$n$偏大。

    （3）取几个不同的入射角重复测量，检查$\frac{\sin\theta_1}{\sin\theta_2}$是否不变、再取平均；距离量得长一些，相对误差就小；激光要射在缸里水的中部，避开缸壁的玻璃引起的偏移。光斑、硬币的像有一定大小，读数时对准中心。
