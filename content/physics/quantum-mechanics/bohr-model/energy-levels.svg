  <text x="114" y="93" fill="currentColor" text-anchor="end"><tspan font-style="italic">n</tspan> = 3</text>
  <text x="498" y="93" fill="currentColor">−1.51 eV</text>
  <line x1="130" y1="135.2" x2="480" y2="135.2" style="stroke: currentColor" stroke-width="1.6" />
  <line x1="118" y1="135.2" x2="128" y2="135.2" style="stroke: var(--muted, #6b7280)" stroke-width="0.9" />
  <line x1="482" y1="135.2" x2="494" y2="135.2" style="stroke: var(--muted, #6b7280)" stroke-width="0.9" />
  <text x="114" y="140.2" fill="currentColor" text-anchor="end"><tspan font-style="italic">n</tspan> = 2</text>
  <text x="498" y="140.2" fill="currentColor">−3.40 eV</text>
