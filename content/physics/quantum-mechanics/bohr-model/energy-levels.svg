<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 446" width="640" height="446" font-size="14">
  <!-- 氢原子的能级图，能级的高低按能量的比例画：从下往上是 n = 1（−13.6 eV）、n = 2（−3.40 eV）、n = 3（−1.51 eV）、n = 4（−0.85 eV）、n = 5（−0.54 eV）和 n = ∞（0），越往上越密。向下的箭头是发射：落到 n = 1 的四根是莱曼系，落到 n = 2 的三根是巴耳末系，落到 n = 3 的两根是帕邢系。向上的一根箭头是吸收，从 n = 1 到 n = 2。 -->
  <line x1="130" y1="40" x2="480" y2="40" style="stroke: currentColor" stroke-width="1.2" stroke-dasharray="6 4" />
  <line x1="118" y1="22" x2="128" y2="40" style="stroke: var(--muted, #6b7280)" stroke-width="0.9" />
  <line x1="482" y1="40" x2="494" y2="22" style="stroke: var(--muted, #6b7280)" stroke-width="0.9" />
  <text x="114" y="27" fill="currentColor" text-anchor="end"><tspan font-style="italic">n</tspan> = ∞</text>
  <text x="498" y="27" fill="currentColor">0</text>
  <line x1="130" y1="55.2" x2="480" y2="55.2" style="stroke: currentColor" stroke-width="1.6" />
