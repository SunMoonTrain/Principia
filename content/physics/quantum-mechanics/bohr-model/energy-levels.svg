  <line x1="482" y1="55.2" x2="494" y2="44" style="stroke: var(--muted, #6b7280)" stroke-width="0.9" />
  <text x="114" y="49" fill="currentColor" text-anchor="end"><tspan font-style="italic">n</tspan> = 5</text>
  <text x="498" y="49" fill="currentColor">−0.54 eV</text>
  <line x1="130" y1="63.8" x2="480" y2="63.8" style="stroke: currentColor" stroke-width="1.6" />
