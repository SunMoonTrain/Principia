- id: p1
  tier: easy
  statement: |
    一支绿色激光笔发出波长为$532\,\mathrm{nm}$的光，功率是$5.0\,\mathrm{mW}$。它每秒发出多少个光子？以$10^{16}$个每秒为单位，结果保留三位有效数字。
  answer:
    type: number
    value: 5.0e-3*532e-9/(6.62607015e-34*299792458)/1e16
    unit: |
      $10^{16}\,\mathrm{s^{-1}}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      功率是每秒发出的能量。每个光子带多少能量？
    - |
      一个光子的能量$E=h\nu=\frac{hc}\lambda$，每秒的光子数$N=\frac PE=\frac{P\lambda}{hc}$。
    - |
      $E=\frac{6.626\times10^{-34}\times2.998\times10^8}{532\times10^{-9}}\,\mathrm J\approx3.73\times10^{-19}\,\mathrm J$，$N=\frac{5.0\times10^{-3}}{3.73\times10^{-19}}\,\mathrm{s^{-1}}\approx1.34\times10^{16}\,\mathrm{s^{-1}}$。
  solution: |
    一个光子的能量$E=\frac{hc}\lambda=\frac{6.626\times10^{-34}\times2.998\times10^8}{532\times10^{-9}}\,\mathrm J\approx3.73\times10^{-19}\,\mathrm J$，约$2.33\,\mathrm{eV}$。每秒发出的能量是$5.0\times10^{-3}\,\mathrm J$，所以每秒的光子数$N=\frac PE\approx1.34\times10^{16}$，即$1.34\times10^{16}\,\mathrm{s^{-1}}$。

- id: p2
  tier: easy
  statement: |
    下面哪些说法正确？
  answer:
    type: choice
    multiple: true
    options:
      - |
        波长为$500\,\mathrm{nm}$的光照射逸出功为$2.3\,\mathrm{eV}$的金属，打不出光电子
      - |
        同一束光先后照射两种金属，都能打出光电子，那么逸出功小的那种金属遏止电压大
      - |
        某金属的截止频率是$\nu_{\mathrm c}$，用频率为$2\nu_{\mathrm c}$的光照射时，光电子的最大动能是用$4\nu_{\mathrm c}$的光照射时的一半
      - |
        蓝光和红光照射同样大的面积、光强相同时，每秒打到金属表面的蓝光光子比红光光子少
      - |
        原来不带电的孤立金属球，被频率高于截止频率的光一直照射，只要照得够久，它的电势就能升到任意高
    value: [2, 4]
  hints:
    - |
      每个选项都用$E=h\nu$和光电效应方程$K_{\max}=h\nu-W_0$判断。光强相同、面积相同，就是每秒照到的能量相同。
    - |
      $500\,\mathrm{nm}$的光子能量是$\frac{1240}{500}\,\mathrm{eV}$；$e\Delta\varphi_{\mathrm c}=h\nu-W_0$；每秒的光子数等于每秒照到的能量除以$h\nu$。金属球失去电子后带正电，会把飞出去的电子往回拉。
    - |
      A 错：光子能量约$2.48\,\mathrm{eV}$，比$2.3\,\mathrm{eV}$大，能打出光电子。B 对：$h\nu$相同，$W_0$小的$h\nu-W_0$大，遏止电压$\frac{h\nu-W_0}e$也大。C 错：$K_{\max}$分别是$2h\nu_{\mathrm c}-h\nu_{\mathrm c}=h\nu_{\mathrm c}$和$3h\nu_{\mathrm c}$，前者是后者的$\frac13$。

      D 对：每秒照到的能量相同，蓝光的$h\nu$大，光子就少。E 错：球带正电以后，电势为$\varphi$时，动能小于$e\varphi$的电子飞不远，又被拉回来；$e\varphi$达到$h\nu-W_0$时，最快的也跑不掉，电势就不再升高，和遏止电压是同一个道理。
  solution: |
    选 B、D。A 错：光子能量$\frac{1240}{500}\,\mathrm{eV}\approx2.48\,\mathrm{eV}$，比逸出功$2.3\,\mathrm{eV}$大，能打出光电子。B 对：同一束光的$h\nu$相同，由$e\Delta\varphi_{\mathrm c}=h\nu-W_0$，逸出功小的遏止电压大。C 错：$W_0=h\nu_{\mathrm c}$，两种情况的最大动能分别是$h\nu_{\mathrm c}$和$3h\nu_{\mathrm c}$，前者是后者的$\frac13$；最大动能随频率线性增加，但不和频率成正比。

    D 对：光强相同、面积相同，每秒照到的能量相同；蓝光的频率高，每个光子的能量大，光子数就少。E 错：取无穷远处电势为零，球的电势为$\varphi>0$时，电子要有$e\varphi$以上的动能才飞得出去。$e\varphi$达到$h\nu-W_0$以后，最快的光电子也被拉回来，电势就停在$\frac{h\nu-W_0}e$附近，正是这束光的遏止电压。

- id: p3
  tier: medium
  statement: |
    铯的逸出功取$2.14\,\mathrm{eV}$。用波长为$405\,\mathrm{nm}$的紫光照射铯，打出的光电子速率最大是多少？以$10^5\,\mathrm{m/s}$为单位，结果保留三位有效数字。
  answer:
    type: number
    value: sqrt(2*(6.62607015e-34*299792458/405e-9/1.602176634e-19 - 2.14)*1.602176634e-19/9.1093837139e-31)/1e5
    unit: |
      $10^5\,\mathrm{m/s}$
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      先求光子的能量，再用光电效应方程求最大动能，最后由动能求速率。
    - |
      $h\nu=\frac{1240\,\mathrm{eV\cdot nm}}{405\,\mathrm{nm}}$，$K_{\max}=h\nu-W_0$；速率比光速小得多，$K_{\max}=\frac12m_{\mathrm e}v^2$，电子的质量$m_{\mathrm e}=9.109\times10^{-31}\,\mathrm{kg}$（[电势](lesson:physics.electromagnetism.electric-potential)例 2 写作$m_e$）。
    - |
      $h\nu\approx3.062\,\mathrm{eV}$，$K_{\max}\approx3.062\,\mathrm{eV}-2.14\,\mathrm{eV}=0.922\,\mathrm{eV}\approx1.477\times10^{-19}\,\mathrm J$，$v=\sqrt{\frac{2K_{\max}}{m_{\mathrm e}}}\approx5.69\times10^5\,\mathrm{m/s}$。
  solution: |
    光子的能量$h\nu=\frac{1240\,\mathrm{eV\cdot nm}}{405\,\mathrm{nm}}\approx3.062\,\mathrm{eV}$，比逸出功大，能打出光电子。最大动能$K_{\max}=h\nu-W_0\approx0.922\,\mathrm{eV}\approx1.477\times10^{-19}\,\mathrm J$。由$K_{\max}=\frac12m_{\mathrm e}v^2$，$v=\sqrt{\frac{2\times1.477\times10^{-19}}{9.109\times10^{-31}}}\,\mathrm{m/s}\approx5.69\times10^5\,\mathrm{m/s}$，约为光速的$0.2\%$，不用考虑相对论效应。

- id: p4
  tier: medium
  statement: |
    用两种频率的光照射同一种金属，测得遏止电压：频率为$8.21\times10^{14}\,\mathrm{Hz}$时是$1.49\,\mathrm V$，频率为$5.49\times10^{14}\,\mathrm{Hz}$时是$0.36\,\mathrm V$。只用这两组数据，不代入$h$的值，求这种金属的逸出功（以$\mathrm{eV}$为单位）和截止频率（以$10^{14}\,\mathrm{Hz}$为单位），按这个顺序填写，结果都保留三位有效数字。
  answer:
    type: tuple
    value: [1.13/2.72*8.21 - 1.49, 8.21 - 1.49*2.72/1.13]
  tolerance: { rel: 5.0e-3 }
  hints:
    - |
      由光电效应方程，$e\Delta\varphi_{\mathrm c}=h\nu-W_0$，遏止电压是频率的一次函数，两组数据定出一条直线。
    - |
      两式相减消去$W_0$，得到斜率$\frac he=\frac{1.49\,\mathrm V-0.36\,\mathrm V}{(8.21-5.49)\times10^{14}\,\mathrm{Hz}}$；代回任一式求$\frac{W_0}e$。截止频率是直线和横轴的交点，$\nu_{\mathrm c}=\frac{W_0}h$。
    - |
      $\frac he=\frac{1.13}{2.72\times10^{14}}\,\mathrm{V\cdot s}\approx4.154\times10^{-15}\,\mathrm{V\cdot s}$。代入第一组，$\frac{W_0}e=4.154\times10^{-15}\times8.21\times10^{14}\,\mathrm V-1.49\,\mathrm V\approx1.92\,\mathrm V$，逸出功约$1.92\,\mathrm{eV}$。$\nu_{\mathrm c}=\frac{W_0/e}{h/e}=\frac{1.92}{4.154\times10^{-15}}\,\mathrm{Hz}\approx4.62\times10^{14}\,\mathrm{Hz}$。
  solution: |
    两组数据都满足$e\Delta\varphi_{\mathrm c}=h\nu-W_0$，相减得$\frac he=\frac{1.13\,\mathrm V}{2.72\times10^{14}\,\mathrm{Hz}}\approx4.154\times10^{-15}\,\mathrm{V\cdot s}$。代入第一组，$\frac{W_0}e=4.154\times10^{-15}\times8.21\times10^{14}\,\mathrm V-1.49\,\mathrm V\approx1.92\,\mathrm V$，所以$W_0\approx1.92\,\mathrm{eV}$。截止频率$\nu_{\mathrm c}=\frac{W_0/e}{h/e}\approx4.62\times10^{14}\,\mathrm{Hz}$，也可以直接写成$8.21\times10^{14}\,\mathrm{Hz}-\frac{1.49}{1.13}\times2.72\times10^{14}\,\mathrm{Hz}\approx4.62\times10^{14}\,\mathrm{Hz}$。

    1916 年，密立根（Robert Millikan）就是这样做的：用几种频率的光测遏止电压，连成一条直线，斜率给出$\frac he$，和普朗克由热辐射定出的$h$相符，光电效应方程由此得到证实。

- id: p5
  tier: hard
  statement: |
    按经典的波动图像，估算光电效应的「延迟」。光强为$1.0\times10^{-2}\,\mathrm{W/m^2}$（每秒照到每平方米上的能量）的光垂直照到钠的表面上，钠的逸出功取$2.3\,\mathrm{eV}$。设一个电子只能吸收照在以它为中心、半径为$0.10\,\mathrm{nm}$（约一个原子的大小）的圆面上的光能。

    （1）这个电子要攒多长时间，才攒够逸出功？

    （2）实验上，光一照上，不超过$10^{-9}\,\mathrm s$就有光电子射出。要在这么短的时间里攒够，电子得从多大半径的圆面上收集光能？用光子的图像说明为什么用不着攒。

    （3）把光再减弱到原来的百分之一（频率不变，仍高于截止频率），经典的图像和光子的图像各预言会看到什么？
  hints:
    - |
      照到小圆面上的功率是光强乘面积，攒够逸出功的时间是$W_0$除以这个功率。
    - |
      圆面积$\pi r^2\approx3.1\times10^{-20}\,\mathrm{m^2}$，功率约$3.1\times10^{-22}\,\mathrm W$，$W_0=2.3\times1.60\times10^{-19}\,\mathrm J$。时间变为原来的几分之一，面积就要变为原来的几倍。光子的图像里，一个电子吸收一个光子，能量一次给足。
    - |
      （1）照到圆面上的功率$P=1.0\times10^{-2}\times\pi\times(1.0\times10^{-10})^2\,\mathrm W\approx3.1\times10^{-22}\,\mathrm W$，攒够$W_0=2.3\times1.60\times10^{-19}\,\mathrm J\approx3.7\times10^{-19}\,\mathrm J$要$t=\frac{W_0}P\approx1.2\times10^3\,\mathrm s$，约 20 分钟。

      （2）把时间缩短到$10^{-9}\,\mathrm s$，面积要放大约$1.2\times10^{12}$倍，半径要放大约$1.1\times10^6$倍，即约$0.1\,\mathrm{mm}$。这片面积相当于上万亿个原子，一个电子不可能收集这么大一片上的光能。按光子的图像，能量一份一份地来，一个电子吸收一个光子，就一次得到全部的$h\nu$；只要$h\nu>W_0$，它立刻就能出来，第一个光子被吸收时就有光电子，用不着攒。

      （3）经典的图像：攒够逸出功的时间变为 100 倍，约$1.2\times10^5\,\mathrm s$，也就是一天多，在这之前一个光电子也没有；光电子出来时的动能也该更小。光子的图像：每秒射来的光子少到$\frac1{100}$，每秒打出的光电子也少到$\frac1{100}$，光电流变小；可每个光电子仍是吸收一个光子就出来，一照上就有，最大动能$h\nu-W_0$也不变。实验支持后者。
  reference: |
    （1）$P=1.0\times10^{-2}\times\pi\times10^{-20}\,\mathrm W\approx3.14\times10^{-22}\,\mathrm W$，$t=\frac{W_0}P=\frac{2.3\times1.602\times10^{-19}}{3.14\times10^{-22}}\,\mathrm s\approx1.17\times10^3\,\mathrm s$，约 20 分钟。

    （2）要$10^{-9}\,\mathrm s$，面积放大$1.17\times10^{12}$倍，半径放大$1.08\times10^6$倍，约$0.11\,\mathrm{mm}$，包含约$10^{12}$个原子的面积，不合理。光子：一个电子吸收一个光子，一次得到$h\nu$，$h\nu>W_0$即可立刻逸出，无需积累。

    （3）经典：延迟变为 100 倍（约$1.2\times10^5\,\mathrm s$，一天多），之前没有光电子。光子：光子数每秒少到$\frac1{100}$，光电流成比例减小，但光电子一照上就有，最大动能不变。实验支持光子的图像。

- id: p6
  tier: hard
  statement: |
    「反过来的光电效应」：在 X 射线管（X-ray tube）里，电子从静止开始，经过$30.0\,\mathrm{kV}$的电势差加速，打到金属靶上，放出 X 射线。1915 年，杜安（William Duane）和亨特（Franklin Hunt）发现，放出的 X 射线的波长有一个最小值，它只由加速电势差决定，和靶用什么金属无关。

    （1）用光子的图像说明为什么有最小波长，并求出它。

    （2）按经典电磁学，减速的电子放出电磁波（见[拉莫尔公式](lesson:physics.electromagnetism.larmor-formula)），为什么不该有这样一个只由电势差决定的界限？

    （3）他们改变电势差、测出最小波长，由此能定出哪个常量的值？
  hints:
    - |
      一个电子打到靶上，至多把它的全部动能交给一个光子。
    - |
      电子的动能是$e\Delta\varphi$，靶的逸出功只有几个电子伏特，比它小得多；$h\nu\le e\Delta\varphi$，所以$\lambda\ge\frac{hc}{e\Delta\varphi}$。经典电磁学里，波的频率和它带的能量多少互不相干。
    - |
      （1）电子打到靶上前的动能是$e\Delta\varphi=30.0\,\mathrm{keV}$，靶的逸出功只有几个电子伏特，可以不计。按光子的图像，X 射线由一个个光子组成，每个光子都是某一个电子减速时放出的，能量至多是这个电子的全部动能：$h\nu\le e\Delta\varphi$。所以$\lambda=\frac{hc}{h\nu}\ge\frac{hc}{e\Delta\varphi}=\frac{1240\,\mathrm{eV\cdot nm}}{3.00\times10^4\,\mathrm{eV}}\approx4.13\times10^{-2}\,\mathrm{nm}$，即约$41.3\,\mathrm{pm}$。式子里只有$e\Delta\varphi$，和靶的材料无关。

      （2）经典电磁学里，减速的电子放出的电磁波含有哪些频率，取决于它怎样减速、减速得多快；电子的动能只限制放出的总能量，这些能量可以分给任意高的频率，每个频率分得少一些就行。波的频率和它带的能量多少互不相干，所以没有理由出现$\nu=\frac{e\Delta\varphi}h$这样一个只由电势差决定的界限。

      （3）由$\lambda_{\min}=\frac{hc}{e\Delta\varphi}$，测出$\lambda_{\min}$和$\Delta\varphi$，就得到$\frac he=\frac{\lambda_{\min}\Delta\varphi}c$；$e$已知，就定出了普朗克常量$h$。他们得到的$h$和别的办法定出的相近。
  reference: |
    （1）$e\Delta\varphi=30.0\,\mathrm{keV}$，逸出功可不计；每个光子由一个电子放出，$h\nu\le e\Delta\varphi$，$\lambda_{\min}=\frac{hc}{e\Delta\varphi}=\frac{1239.84}{30000}\,\mathrm{nm}\approx41.3\,\mathrm{pm}$，只依赖$\Delta\varphi$，与靶无关（杜安-亨特定律）。

    （2）经典辐射的频谱由减速的快慢决定，动能只限制总辐射能，能量可分配到任意高的频率，没有只由$e\Delta\varphi$决定的频率上限。

    （3）$\frac he=\frac{\lambda_{\min}\Delta\varphi}c$，由此定$h$，与当时别的测量（如密立根的光电效应实验）相近。

- id: p7
  tier: thinking
  statement: |
    讲解里光电流随电势差变化的图（光电管那张图的右半）有几处值得追问。

    （1）反向电势差从零逐渐加大时，光电流是逐渐减小到零的，不是到了遏止电压才突然降为零。这说明光电子的动能是怎样的？

    （2）光电效应方程为什么只说最大动能？电子吸收了一个光子的能量$h\nu$，这些能量还可能花在哪里？

    （3）电势差为正、但还不大时，光电流为什么还没有饱和？
  hints:
    - |
      反向电势差的大小为$\Delta\varphi_1$时，只有动能（两极是平行平板时，准确地说是朝着阳极的那部分运动对应的动能）大于$e\Delta\varphi_1$的光电子才到得了阳极。
    - |
      金属里的电子并不都处在同样的能量上，逸出功只是最容易出来的那些电子要花的能量；在表面以下吸收光子的电子，跑到表面的路上还会和金属里的粒子碰撞。光电子从阴极射出时朝着各个方向。
    - |
      （1）反向电势差越大，能到达阳极的光电子越少：先被挡住的是动能小的，最后只剩最快的。光电流逐渐减小，说明光电子的动能有大有小，从接近零一直分布到$K_{\max}$，射出的方向也各不相同；平板电极之间，只有朝着阳极的速度分量才帮得上忙。遏止电压量的只是其中最快的那些，所以方程里说的是最大动能，而不是每个光电子的动能。

      （2）金属里的电子能量有高有低，逸出功是最松的那些电子出来要花的能量，深一些的电子要花得更多，出来时动能就小。在表面以下吸收光子的电子，往外跑时会和金属里的粒子碰撞，一路损失能量，变成金属的内能；有的根本出不来，有的出来时已经慢了。只有离表面最近、最松的电子不受损失，才能带着$h\nu-W_0$出来。

      （3）光电子向各个方向射出，电势差为正但不大时，侧着飞、往回飞的电子有的落回阴极或落到管壁上，没被阳极收集；在两极之间的电子还会互相排斥。电势差加大，电场把越来越多的电子拉到阳极，全部收集到时，光电流就不再增加，这就是饱和电流。所以饱和电流数的才是每秒打出的全部光电子。
  reference: |
    （1）电流随反向电势差逐渐减小，说明光电子的动能（和方向）有分布，从近零到$K_{\max}$；$\Delta\varphi_{\mathrm c}$只量出最大动能。平板几何里，起作用的是沿电场方向的速度分量。

    （2）金属中电子占据一段能量，$W_0$只对应最高的那些；更深的电子要更多能量。表面以下的电子在出来途中与晶格、电子碰撞损失能量（转为内能），有的出不来。只有表面附近最松的电子能以$h\nu-W_0$出来，故方程只给最大值。

    （3）光电子方向各异，小的正向电势差收集不全（部分回到阴极或打到管壁），还有空间电荷的排斥。电势差足够大时全部被收集，电流饱和；饱和电流对应每秒打出的光电子总数。

- id: p8
  tier: thinking
  statement: |
    日常生活里，看不出光是一份一份的。

    （1）一盏灯向四面八方均匀地发光，可见光的功率是$1\,\mathrm W$，波长都按$550\,\mathrm{nm}$算。站在$5\,\mathrm m$外，直径$5\,\mathrm{mm}$的瞳孔每秒接收多少个光子？

    （2）光子一个个地到达，为什么看起来是连续、稳定的？

    （3）什么情况下「一份一份」会显露出来？日常生活里有没有只用光强说不通、要按每个光子的能量才说得通的事？
  hints:
    - |
      先求一个光子的能量和灯每秒发出的光子数，再看瞳孔接收到的占半径为$5\,\mathrm m$的整个球面的多少。
    - |
      一个光子约$3.6\times10^{-19}\,\mathrm J$，灯每秒发出约$2.8\times10^{18}$个；瞳孔的面积占球面面积$4\pi r^2$的比例是$\frac{\pi\times(2.5\times10^{-3})^2}{4\pi\times5^2}$。眼睛的感觉是对大约$0.1\,\mathrm s$里收到的光累积起来的。
    - |
      （1）一个光子的能量$E=\frac{hc}\lambda\approx3.6\times10^{-19}\,\mathrm J$，约$2.25\,\mathrm{eV}$；灯每秒发出$\frac{1}{3.6\times10^{-19}}\approx2.8\times10^{18}$个。瞳孔的面积占半径$5\,\mathrm m$的球面的$\frac{(2.5\times10^{-3})^2}{4\times25}=6.25\times10^{-8}$，每秒接收约$1.7\times10^{11}$个光子。

      （2）眼睛的感觉是把大约$0.1\,\mathrm s$里收到的光累积起来的，这段时间里有上百亿个光子。光子什么时候到达有些随机，每段时间到达的个数有起伏，可和这么大的数比，起伏小得察觉不到，看起来就是连续、稳定的。

      （3）光极弱时，例如远处很暗的星，或者在极暗处做实验：完全适应黑暗以后，视网膜上的视杆细胞（rod cell）吸收一个光子就能产生反应；光电倍增管（photomultiplier tube）等探测器能一个个地数光子；极弱的光照到照相底片上，留下的是零散的点。

      日常生活里也有痕迹，靠的是光电效应那样的门槛：要看每个光子的能量够不够，而不是光有多强。冲洗黑白照片的暗室可以开红灯，红光的光子能量太小，几乎不能让相纸感光；晒伤靠的是紫外线，它的光子能量大，能直接破坏皮肤细胞里的分子，可见光的光子能量小，主要只是让皮肤发热。
  reference: |
    （1）$E=\frac{hc}\lambda=3.61\times10^{-19}\,\mathrm J$（$2.25\,\mathrm{eV}$），每秒$2.77\times10^{18}$个；瞳孔占球面$\frac{\pi(2.5\times10^{-3})^2}{4\pi\cdot25}=6.25\times10^{-8}$，每秒约$1.7\times10^{11}$个。

    （2）眼睛的响应时间约$0.1\,\mathrm s$，累积约$10^{10}$个光子，个数的起伏相对很小，所以看起来连续。

    （3）极弱光：适应黑暗的视杆细胞对单个光子有反应，光电倍增管能数光子，底片上出现零散的点。日常的门槛现象：暗室红灯不使相纸感光（光子能量不够），紫外线晒伤而可见光只使皮肤发热——取决于单个光子的能量，不是光强。
