  <line x1="588.8" y1="142" x2="588.8" y2="148" style="stroke: currentColor" stroke-width="1.2" />
  <text x="588.8" y="164" fill="currentColor" text-anchor="middle">700</text>
  <text x="370" y="188" fill="currentColor" text-anchor="middle">波长（nm）</text>
</svg>
