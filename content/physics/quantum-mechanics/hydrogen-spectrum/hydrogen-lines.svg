<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 198" width="640" height="198" font-size="14">
  <!-- 上：连续谱，白光经棱镜展开成从紫到红连成一片的彩带。下：氢的线状谱，只有四条彩色亮线，从左到右是 Hδ（410.2 nm）、Hγ（434.0 nm）、Hβ（486.1 nm）、Hα（656.3 nm），都是空气中的波长。横轴是波长，从 400 nm 到 720 nm。彩带和谱线的颜色是光本身的颜色，用固定的颜色画。 -->
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.0000" stop-color="#8300b5" />
      <stop offset="0.0313" stop-color="#7e00db" />
      <stop offset="0.0625" stop-color="#6a00ff" />
      <stop offset="0.0938" stop-color="#3d00ff" />
      <stop offset="0.1250" stop-color="#0000ff" />
      <stop offset="0.1563" stop-color="#0046ff" />
      <stop offset="0.1875" stop-color="#007bff" />
      <stop offset="0.2188" stop-color="#00a9ff" />
      <stop offset="0.2500" stop-color="#00d5ff" />
      <stop offset="0.2813" stop-color="#00ffff" />
      <stop offset="0.3125" stop-color="#00ff92" />
      <stop offset="0.3438" stop-color="#00ff00" />
      <stop offset="0.3750" stop-color="#36ff00" />
      <stop offset="0.4063" stop-color="#5eff00" />
      <stop offset="0.4375" stop-color="#81ff00" />
      <stop offset="0.4688" stop-color="#a3ff00" />
      <stop offset="0.5000" stop-color="#c3ff00" />
      <stop offset="0.5313" stop-color="#e1ff00" />
      <stop offset="0.5625" stop-color="#ffff00" />
      <stop offset="0.5938" stop-color="#ffdf00" />
      <stop offset="0.6250" stop-color="#ffbe00" />
      <stop offset="0.6563" stop-color="#ff9b00" />
      <stop offset="0.6875" stop-color="#ff7700" />
      <stop offset="0.7188" stop-color="#ff4f00" />
      <stop offset="0.7500" stop-color="#ff2100" />
      <stop offset="0.7813" stop-color="#ff0000" />
      <stop offset="0.8125" stop-color="#ff0000" />
      <stop offset="0.8438" stop-color="#ff0000" />
      <stop offset="0.8750" stop-color="#ff0000" />
      <stop offset="0.9063" stop-color="#ff0000" />
      <stop offset="0.9375" stop-color="#ff0000" />
      <stop offset="0.9688" stop-color="#ed0000" />
      <stop offset="1.0000" stop-color="#db0000" />
    </linearGradient>
  </defs>
  <rect x="120" y="14" width="500" height="36" fill="url(#spectrum)" style="stroke: currentColor" stroke-width="1" stroke-opacity="0.5" />
  <rect x="120" y="66" width="500" height="36" style="fill: var(--muted, #6b7280); stroke: currentColor" fill-opacity="0.16" stroke-width="1" stroke-opacity="0.5" />
  <line x1="135.9" y1="67" x2="135.9" y2="101" style="stroke: #7d00db" stroke-width="3.5" />
  <line x1="173.1" y1="67" x2="173.1" y2="101" style="stroke: #2800ff" stroke-width="3.5" />
  <line x1="254.5" y1="67" x2="254.5" y2="101" style="stroke: #00efff" stroke-width="3.5" />
  <line x1="520.5" y1="67" x2="520.5" y2="101" style="stroke: #ff0000" stroke-width="3.5" />
  <text x="110" y="37" fill="currentColor" text-anchor="end">连续谱</text>
  <text x="110" y="89" fill="currentColor" text-anchor="end">氢的线状谱</text>
  <text x="135.9" y="122" fill="currentColor" text-anchor="middle">H<tspan dy="4" font-size="11">δ</tspan></text>
  <text x="173.1" y="122" fill="currentColor" text-anchor="middle">H<tspan dy="4" font-size="11">γ</tspan></text>
  <text x="254.5" y="122" fill="currentColor" text-anchor="middle">H<tspan dy="4" font-size="11">β</tspan></text>
  <text x="520.5" y="122" fill="currentColor" text-anchor="middle">H<tspan dy="4" font-size="11">α</tspan></text>
  <line x1="120" y1="142" x2="620" y2="142" style="stroke: currentColor" stroke-width="1.2" />
  <line x1="120" y1="142" x2="120" y2="148" style="stroke: currentColor" stroke-width="1.2" />
  <text x="120" y="164" fill="currentColor" text-anchor="middle">400</text>
  <line x1="276.3" y1="142" x2="276.3" y2="148" style="stroke: currentColor" stroke-width="1.2" />
  <text x="276.3" y="164" fill="currentColor" text-anchor="middle">500</text>
  <line x1="432.5" y1="142" x2="432.5" y2="148" style="stroke: currentColor" stroke-width="1.2" />
