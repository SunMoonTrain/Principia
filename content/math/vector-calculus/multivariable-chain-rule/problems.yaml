- id: p1
  tier: easy
  statement: |
    $z=x^2+3xy$，$x=2t$，$y=t^2$。求$t=1$时的$\dv zt$。
  answer:
    type: number
    value: 26
  hints:
    - |
      $\dv zt=z_x\dv xt+z_y\dv yt$。
    - |
      $t=1$时$x=2$、$y=1$；$z_x=2x+3y=7$，$z_y=3x=6$；$\dv xt=2$，$\dv yt=2t=2$。
    - |
      $\dv zt=7\cdot2+6\cdot2=26$。验算：$z=4t^2+6t^3$，$z'(1)=8+18=26$。
  solution: |
    $\dv zt=(2x+3y)\cdot2+3x\cdot2t$，$t=1$时是$14+12=26$。

- id: p2
  tier: easy
  statement: |
    $z=e^{xy}$，$x=s+t$，$y=s-t$。求$(s,t)=(1,0)$时的$\pdv zs$。
  answer:
    type: number
    value: 2*e
  hints:
    - |
      画出依赖关系图：$z$经过$x$、$y$依赖$s$，有两条路径。
    - |
      $\pdv zs=z_x\pdv xs+z_y\pdv ys=ye^{xy}\cdot1+xe^{xy}\cdot1$。
    - |
      $(s,t)=(1,0)$时$x=y=1$，$\pdv zs=e+e=2e\approx5.44$。验算：$z=e^{s^2-t^2}$，$\pdv zs=2se^{s^2-t^2}=2e$。
  solution: |
    $\pdv zs=(x+y)e^{xy}$，在$x=y=1$处是$2e$。

- id: p3
  tier: medium
  statement: |
    曲线$x^2+xy+y^3=3$过点$(1,1)$，在这一点附近$y$是$x$的可导函数。求这一点处的$\dv yx$。
  answer:
    type: number
    value: -3/4
  hints:
    - |
      令$F(x,y)=x^2+xy+y^3$，沿曲线$F\bigl(x,y(x)\bigr)=3$，两边对$x$求导。
    - |
      由链式法则，$F_x+F_y\dv yx=0$，$F_x=2x+y$，$F_y=x+3y^2$。
    - |
      在$(1,1)$处$F_x=3$、$F_y=4$，$\dv yx=-\frac34$。
  solution: |
    $\dv yx=-\frac{F_x}{F_y}=-\frac{2x+y}{x+3y^2}$，在$(1,1)$处是$-\frac34$。

- id: p4
  tier: medium
  statement: |
    $z=x^2-y^2$，$x=r\cos\theta$，$y=r\sin\theta$。求$r=2$、$\theta=\frac\pi6$时的$\pdv z\theta$。
  answer:
    type: number
    value: -4*sqrt(3)
  hints:
    - |
      $\pdv z\theta=z_x\pdv x\theta+z_y\pdv y\theta$，$\pdv x\theta=-r\sin\theta$，$\pdv y\theta=r\cos\theta$。
    - |
      $\pdv z\theta=2x(-r\sin\theta)-2y\,r\cos\theta=-2r^2(\cos\theta\sin\theta+\sin\theta\cos\theta)=-2r^2\sin2\theta$。
    - |
      $r=2$、$\theta=\frac\pi6$时是$-8\sin\frac\pi3=-4\sqrt3\approx-6.93$。验算：$z=r^2\cos2\theta$，对$\theta$求导得$-2r^2\sin2\theta$。
  solution: |
    $\pdv z\theta=-2r^2\sin2\theta=-8\cdot\frac{\sqrt3}2=-4\sqrt3$。

- id: p5
  tier: hard
  statement: |
    $z=f(x,y)$的二阶偏导数（second-order partial derivative）连续，$x=r\cos\theta$，$y=r\sin\theta$。证明在$r>0$处$f_{xx}+f_{yy}=z_{rr}+\frac1rz_r+\frac1{r^2}z_{\theta\theta}$。
  hints:
    - |
      先求$z_r$、$z_\theta$；再对它们分别求$r$、$\theta$的偏导数，这时$f_x$、$f_y$本身也是$x$、$y$的函数，又要用一次链式法则。
    - |
      $z_r=f_x\cos\theta+f_y\sin\theta$，$z_{rr}=f_{xx}\cos^2\theta+2f_{xy}\sin\theta\cos\theta+f_{yy}\sin^2\theta$，其中用到混合偏导数（mixed partial derivative）连续时相等。
    - |
      $z_\theta=-rf_x\sin\theta+rf_y\cos\theta$，$z_{\theta\theta}=r^2(f_{xx}\sin^2\theta-2f_{xy}\sin\theta\cos\theta+f_{yy}\cos^2\theta)-r(f_x\cos\theta+f_y\sin\theta)$。所以$\frac1{r^2}z_{\theta\theta}=f_{xx}\sin^2\theta-2f_{xy}\sin\theta\cos\theta+f_{yy}\cos^2\theta-\frac1rz_r$，和$z_{rr}$相加再加$\frac1rz_r$，得$f_{xx}+f_{yy}$。
  reference: |
    由链式法则，$z_r=f_x\cos\theta+f_y\sin\theta$。再对$r$求导：$f_x$、$f_y$经过$x$、$y$依赖$r$，$\pdv{}{r}f_x=f_{xx}\cos\theta+f_{xy}\sin\theta$，$\pdv{}{r}f_y=f_{yx}\cos\theta+f_{yy}\sin\theta$。二阶偏导数连续，$f_{xy}=f_{yx}$，所以$z_{rr}=f_{xx}\cos^2\theta+2f_{xy}\sin\theta\cos\theta+f_{yy}\sin^2\theta$。

    $z_\theta=-rf_x\sin\theta+rf_y\cos\theta$。对$\theta$求导，既要对$\sin\theta$、$\cos\theta$求导，又要对$f_x$、$f_y$用链式法则（$\pdv{}{\theta}f_x=-rf_{xx}\sin\theta+rf_{xy}\cos\theta$，$f_y$同理）：$z_{\theta\theta}=r^2(f_{xx}\sin^2\theta-2f_{xy}\sin\theta\cos\theta+f_{yy}\cos^2\theta)-r(f_x\cos\theta+f_y\sin\theta)$。

    最后一个括号就是$z_r$，所以$\frac1{r^2}z_{\theta\theta}=f_{xx}\sin^2\theta-2f_{xy}\sin\theta\cos\theta+f_{yy}\cos^2\theta-\frac1rz_r$。于是$z_{rr}+\frac1rz_r+\frac1{r^2}z_{\theta\theta}=f_{xx}(\cos^2\theta+\sin^2\theta)+f_{yy}(\sin^2\theta+\cos^2\theta)=f_{xx}+f_{yy}$。

- id: p6
  tier: hard
  statement: |
    可微函数$f(x,y)$满足：对所有$t>0$和所有$(x,y)$，$f(tx,ty)=t^kf(x,y)$。这样的$f$叫作$k$次齐次函数（homogeneous function）。证明$xf_x+yf_y=kf$，并用$f(x,y)=x^3-2xy^2$验证。
  hints:
    - |
      把等式两边都看成$t$的函数，对$t$求导，再令$t=1$。
    - |
      左边$f(tx,ty)$对$t$求导，由链式法则是$xf_x(tx,ty)+yf_y(tx,ty)$；右边是$kt^{k-1}f(x,y)$。
    - |
      令$t=1$得$xf_x(x,y)+yf_y(x,y)=kf(x,y)$。验证：$f=x^3-2xy^2$是$3$次齐次的，$xf_x+yf_y=x(3x^2-2y^2)+y(-4xy)=3x^3-6xy^2=3f$。
  reference: |
    固定$(x,y)$，令$g(t)=f(tx,ty)$。由链式法则，$g'(t)=f_x(tx,ty)\cdot x+f_y(tx,ty)\cdot y$。另一方面$g(t)=t^kf(x,y)$，$g'(t)=kt^{k-1}f(x,y)$。令$t=1$，得$xf_x+yf_y=kf$。

    验证：$f(tx,ty)=t^3x^3-2t^3xy^2=t^3f(x,y)$，$k=3$。$f_x=3x^2-2y^2$，$f_y=-4xy$，$xf_x+yf_y=3x^3-2xy^2-4xy^2=3x^3-6xy^2=3f$。这叫欧拉齐次函数定理（Euler's homogeneous function theorem），热学里的内能、熵对广延量是一次齐次的，常用到它。

- id: p7
  tier: thinking
  statement: |
    $g$是可导的一元函数，$c$是常数，$u(x,t)=g(x-ct)$。验证$u_t+cu_x=0$。站在一个以速度$c$移动的点上，即$x=x_0+ct$，看到的$u$怎样随时间变化？这说明方程$u_t+cu_x=0$描述的是什么现象？
  hints:
    - |
      $u_t=-cg'(x-ct)$，$u_x=g'(x-ct)$。
    - |
      沿$x=x_0+ct$，$U(t)=u(x_0+ct,t)$。由链式法则，$U'(t)=u_x\cdot c+u_t$。
    - |
      $U'(t)=cu_x+u_t=0$，所以沿每条直线$x=x_0+ct$，$u$保持不变：初始的波形$g$不变形地以速度$c$向右平移。反过来，满足方程的$u$沿这些直线都不变，由它在$t=0$时的值决定。
  reference: |
    $u_t=-cg'(x-ct)$，$u_x=g'(x-ct)$，所以$u_t+cu_x=0$。

    沿$x=x_0+ct$，令$U(t)=u(x_0+ct,t)$。由链式法则，$U'(t)=u_x\dv{x}{t}+u_t=cu_x+u_t=0$，所以$U$不变：以速度$c$移动的观察者看到的$u$始终是$u(x_0,0)=g(x_0)$。整个波形$g$不变形地以速度$c$向右平移，例如河水把一团染料匀速向下游带走。

    反过来，任何可微的$u$满足$u_t+cu_x=0$时，沿每条直线$x=x_0+ct$都有$U'=0$，$u$在这些直线上是常数，由$t=0$时的值决定。这些直线叫特征线（characteristic line），以后在[输运方程与特征线法](lesson:math.pde.transport-equation)里讲。

- id: p8
  tier: thinking
  statement: |
    $f$的二阶偏导数连续，$g(t)=f(a+th,b+tk)$，$h$、$k$是常数。求$g'(t)$和$g''(t)$。$g''(0)$和一元函数的二阶导数有什么关系？$g''(0)$为什么能对某些方向为正、对另一些方向为负？
  hints:
    - |
      $g'(t)=f_xh+f_yk$，偏导数在$(a+th,b+tk)$处取值。再对$t$求导时，$f_x$、$f_y$又要用一次链式法则。
    - |
      $g''(t)=f_{xx}h^2+2f_{xy}hk+f_{yy}k^2$（用到$f_{xy}=f_{yx}$）。
    - |
      $g''(0)$是$f$限制在过$(a,b)$、方向为$(h,k)$的直线上以后，这个一元函数的二阶导数，说的是沿这个方向截线的弯曲。它是$h$、$k$的二次式，系数是三个二阶偏导数；例如$f=x^2-y^2$在原点沿$x$轴是$2$，沿$y$轴是$-2$，原点附近图像沿一个方向向上弯、沿另一个方向向下弯。
  reference: |
    由链式法则，$g'(t)=f_x(a+th,b+tk)h+f_y(a+th,b+tk)k$。再求一次：$\dv{}{t}f_x(a+th,b+tk)=f_{xx}h+f_{xy}k$，$\dv{}{t}f_y(a+th,b+tk)=f_{yx}h+f_{yy}k$，所以$g''(t)=f_{xx}h^2+2f_{xy}hk+f_{yy}k^2$，二阶偏导数连续保证了$f_{xy}=f_{yx}$。

    $g$是$f$限制在过$(a,b)$、方向为$(h,k)$的直线上得到的一元函数，$g''(0)$就是这条截线在$(a,b)$处的二阶导数，说明截线向上弯还是向下弯。它是$h$、$k$的二次式，系数由三个二阶偏导数决定，所以不同方向可以有不同的符号：$f=x^2-y^2$在原点，$g''(0)=2h^2-2k^2$，沿$x$轴为正，沿$y$轴为负，图像像马鞍。下面[多元泰勒公式与黑塞矩阵](lesson:math.vector-calculus.taylor-multivariable)正是从这个二次式出发的。
