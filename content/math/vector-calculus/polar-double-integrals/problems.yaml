- id: p1
  tier: easy
  statement: |
    $D$是单位圆盘$x^2+y^2\le1$。求$\iint_D(x^2+y^2)\,\dd A$。
  answer:
    type: number
    value: pi/2
  hints:
    - |
      换成极坐标：$x^2+y^2=r^2$，$\dd A=r\,\dd r\dd\theta$，$0\le r\le1$，$0\le\theta\le2\pi$。
    - |
      $\int_0^{2\pi}\int_0^1r^2\cdot r\,\dd r\dd\theta$，里层$\int_0^1r^3\dd r=\frac14$。
    - |
      $2\pi\cdot\frac14=\frac\pi2\approx1.571$。
  solution: |
    $\iint_D(x^2+y^2)\,\dd A=\int_0^{2\pi}\int_0^1r^3\dd r\dd\theta=2\pi\cdot\frac14=\frac\pi2$。

- id: p2
  tier: easy
  statement: |
    用极坐标下的二重积分求区域$1\le x^2+y^2\le4$、$x\ge0$、$y\ge0$的面积。
  answer:
    type: number
    value: 3*pi/4
  hints:
    - |
      区域是第一象限里的四分之一圆环：$1\le r\le2$，$0\le\theta\le\frac\pi2$。
    - |
      面积$=\int_0^{\pi/2}\int_1^2r\,\dd r\dd\theta$，里层$\int_1^2r\,\dd r=\frac{4-1}2=\frac32$。
    - |
      $\frac\pi2\cdot\frac32=\frac{3\pi}4\approx2.356$。
  solution: |
    面积$=\int_0^{\pi/2}\int_1^2r\,\dd r\dd\theta=\frac\pi2\cdot\frac32=\frac{3\pi}4$。

- id: p3
  tier: medium
  statement: |
    $D$是圆盘$x^2+y^2\le4$。求$\iint_De^{-(x^2+y^2)}\,\dd A$。
  answer:
    type: number
    value: pi*(1 - exp(-4))
  hints:
    - |
      被积函数只依赖$r^2$，换成极坐标：$\int_0^{2\pi}\int_0^2e^{-r^2}r\,\dd r\dd\theta$。
    - |
      $\int_0^2e^{-r^2}r\,\dd r=\Bigl[-\frac12e^{-r^2}\Bigr]_0^2=\frac12\bigl(1-e^{-4}\bigr)$。
    - |
      $2\pi\cdot\frac12\bigl(1-e^{-4}\bigr)=\pi\bigl(1-e^{-4}\bigr)\approx3.084$。
  solution: |
    $\int_0^{2\pi}\int_0^2e^{-r^2}r\,\dd r\dd\theta=\pi\bigl(1-e^{-4}\bigr)\approx3.084$。

- id: p4
  tier: medium
  statement: |
    $D$是区域$1\le x^2+y^2\le4$、$x\ge0$、$y\ge0$。求$\iint_D\sqrt{x^2+y^2}\,\dd A$。
  answer:
    type: number
    value: 7*pi/6
  hints:
    - |
      $\sqrt{x^2+y^2}=r$，面积元是$r\,\dd r\dd\theta$，被积的是$r\cdot r$。
    - |
      $\int_0^{\pi/2}\int_1^2r^2\,\dd r\dd\theta$，里层$\int_1^2r^2\dd r=\frac{8-1}3=\frac73$。
    - |
      $\frac\pi2\cdot\frac73=\frac{7\pi}6\approx3.665$。
  solution: |
    $\int_0^{\pi/2}\int_1^2r\cdot r\,\dd r\dd\theta=\frac\pi2\cdot\frac73=\frac{7\pi}6\approx3.665$。

- id: p5
  tier: hard
  statement: |
    用高斯积分的办法求$\int_{-\infty}^{\infty}x^2e^{-x^2}\dd x$：把$\iint_{\R^2}x^2e^{-x^2-y^2}\dd A$分别在直角坐标和极坐标下算一次。
  hints:
    - |
      直角坐标下被积函数是$x^2e^{-x^2}$乘以$e^{-y^2}$，平面上的积分等于$\int_{-\infty}^{\infty}x^2e^{-x^2}\dd x\cdot\sqrt\pi$。
    - |
      极坐标下$x^2=r^2\cos^2\theta$，积分是$\int_0^{2\pi}\cos^2\theta\dd\theta\cdot\int_0^\infty r^3e^{-r^2}\dd r$。对$-\frac12(r^2+1)e^{-r^2}$求导得$r^3e^{-r^2}$。
    - |
      $\int_0^{2\pi}\cos^2\theta\dd\theta=\pi$，$\int_0^\infty r^3e^{-r^2}\dd r=\frac12$，所以平面上的积分是$\frac\pi2$，$\int_{-\infty}^{\infty}x^2e^{-x^2}\dd x=\frac{\pi/2}{\sqrt\pi}=\frac{\sqrt\pi}2$。
  reference: |
    $f(x,y)=x^2e^{-x^2-y^2}\ge0$且连续，平面上的反常二重积分可以用正方形或圆盘逼近，结果一样。

    正方形$S_R$上，$\iint_{S_R}f\,\dd A=\int_{-R}^Rx^2e^{-x^2}\dd x\cdot\int_{-R}^Re^{-y^2}\dd y$，$R\to\infty$时趋于$J\sqrt\pi$，其中$J=\int_{-\infty}^{\infty}x^2e^{-x^2}\dd x$（$|x|\ge2$时$x^2e^{-x^2}\le e^{-|x|}$，收敛）。

    圆盘$D_R$上换成极坐标：$\iint_{D_R}f\,\dd A=\int_0^{2\pi}\cos^2\theta\dd\theta\int_0^Rr^3e^{-r^2}\dd r=\pi\Bigl[-\frac12(r^2+1)e^{-r^2}\Bigr]_0^R$，$R\to\infty$时趋于$\frac\pi2$。

    两者相等：$J\sqrt\pi=\frac\pi2$，$J=\frac{\sqrt\pi}2$。被积函数是偶函数，$\int_0^\infty x^2e^{-x^2}\dd x=\frac{\sqrt\pi}4$，和[含参变量积分](lesson:math.analysis.parameter-integrals)里$a=1$的结果$\frac{\sqrt\pi}4a^{-3/2}$一致。

- id: p6
  tier: hard
  statement: |
    用极坐标下的二重积分证明半径为$R$的球的体积是$\frac43\pi R^3$。
  hints:
    - |
      球$x^2+y^2+z^2\le R^2$在圆盘$x^2+y^2\le R^2$上方和下方各占一半，上半球的高度是$\sqrt{R^2-x^2-y^2}$。
    - |
      $V=2\iint_{x^2+y^2\le R^2}\sqrt{R^2-x^2-y^2}\,\dd A=2\int_0^{2\pi}\int_0^R\sqrt{R^2-r^2}\,r\,\dd r\dd\theta$。
    - |
      对$-\frac13(R^2-r^2)^{3/2}$求导得$\sqrt{R^2-r^2}\,r$，所以里层是$\frac13R^3$，$V=2\cdot2\pi\cdot\frac13R^3=\frac43\pi R^3$。
  reference: |
    球关于$xy$平面对称，体积是上半球的两倍；上半球是圆盘$D:x^2+y^2\le R^2$上方、高度$\sqrt{R^2-x^2-y^2}$的立体。所以$V=2\iint_D\sqrt{R^2-x^2-y^2}\,\dd A$。

    换成极坐标：$V=2\int_0^{2\pi}\int_0^R\sqrt{R^2-r^2}\,r\,\dd r\dd\theta$。由$\dv{}{r}\Bigl[-\frac13(R^2-r^2)^{3/2}\Bigr]=r\sqrt{R^2-r^2}$，里层$=\frac13R^3$，所以$V=2\cdot2\pi\cdot\frac{R^3}3=\frac43\pi R^3$。用直角坐标写，里层是$\int\sqrt{R^2-x^2-y^2}\dd y$，要用三角代换才积得出来；极坐标下区域和被积函数都只和$r$有关，一步就积完了。

- id: p7
  tier: thinking
  statement: |
    正态分布（normal distribution）的密度是$\frac1{\sqrt{2\pi}\,\sigma}e^{-x^2/(2\sigma^2)}$。由高斯积分说明它在整条数轴上的积分是$1$。前面的$\frac1{\sqrt{2\pi}\,\sigma}$是从哪里来的？如果换成$e^{-ax^2}$（$a>0$），积分是多少？
  hints:
    - |
      令$x=\sqrt2\,\sigma u$（换元，见[换元积分法](lesson:math.calculus.substitution)），把$e^{-x^2/(2\sigma^2)}$变成$e^{-u^2}$。
    - |
      $\int_{-\infty}^{\infty}e^{-x^2/(2\sigma^2)}\dd x=\sqrt2\,\sigma\int_{-\infty}^{\infty}e^{-u^2}\dd u=\sqrt{2\pi}\,\sigma$。
    - |
      所以除以$\sqrt{2\pi}\,\sigma$正好使总积分为$1$。同样$\int_{-\infty}^{\infty}e^{-ax^2}\dd x=\sqrt{\frac\pi a}$：$a$越大，钟形越窄，面积越小。
  reference: |
    令$x=\sqrt2\,\sigma u$，$\dd x=\sqrt2\,\sigma\dd u$，$\int_{-\infty}^{\infty}e^{-x^2/(2\sigma^2)}\dd x=\sqrt2\,\sigma\int_{-\infty}^{\infty}e^{-u^2}\dd u=\sqrt{2\pi}\,\sigma$。所以$\frac1{\sqrt{2\pi}\,\sigma}e^{-x^2/(2\sigma^2)}$的总积分是$1$，可以当概率密度；系数里的$\sqrt\pi$就是高斯积分，$\sqrt2\,\sigma$是把钟形拉宽的倍数。

    一般地，令$x=\frac u{\sqrt a}$，$\int_{-\infty}^{\infty}e^{-ax^2}\dd x=\frac1{\sqrt a}\sqrt\pi=\sqrt{\frac\pi a}$。钟形的宽度和$\frac1{\sqrt a}$成正比，高度总是$1$，面积随宽度变化。这个式子在概率论的[正态分布](lesson:math.probability.normal-distribution)、热学的配分函数里都会用到。

- id: p8
  tier: thinking
  statement: |
    求圆盘$x^2+y^2\le R^2$上的$\iint\sin(x^2+y^2)\,\dd A$。$R\to\infty$时它有没有极限？讲解里为什么要求$f\ge0$才用圆盘的极限定义整个平面上的积分？
  hints:
    - |
      换成极坐标，$\sin(x^2+y^2)=\sin r^2$。
    - |
      $\int_0^R\sin(r^2)\,r\,\dd r=\Bigl[-\frac12\cos r^2\Bigr]_0^R=\frac12\bigl(1-\cos R^2\bigr)$，整个积分是$\pi\bigl(1-\cos R^2\bigr)$。
    - |
      $\pi(1-\cos R^2)$在$0$和$2\pi$之间来回摆，没有极限。被积函数正负交替，圆盘一圈圈加大时，新加进来的圆环时正时负；$f\ge0$时积分随区域增大单调不减，才能放心地取极限、换一族区域去逼近。
  reference: |
    极坐标下，$\iint_{x^2+y^2\le R^2}\sin(x^2+y^2)\,\dd A=\int_0^{2\pi}\int_0^R\sin(r^2)\,r\,\dd r\dd\theta=\pi\bigl(1-\cos R^2\bigr)$。$R^2$跑过$2k\pi$和$(2k+1)\pi$时它分别是$0$和$2\pi$，所以没有极限。

    $f\ge0$时，区域越大积分越大，积分随$R$单调不减，有界就有极限；正方形被两个圆盘夹住，极限也一样。$f$变号时这两条都不成立：加进来的圆环一会儿贡献正的、一会儿贡献负的。事实上，用正方形$[-R,R]^2$去逼近，这个积分趋于$\pi$（要用到$\int_{-\infty}^\infty\sin x^2\dd x=\int_{-\infty}^\infty\cos x^2\dd x=\sqrt{\frac\pi2}$，这里不证），而用圆盘逼近却没有极限。所以对变号的函数，「整个平面上的积分」要先说清用什么区域去逼近，一般要求$|f|$的积分有限，结果才和逼近的方式无关。
