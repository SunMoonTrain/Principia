<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-size="13">
  <!-- 斜视图：x 朝前下方（每单位左 90、下 75 像素），y 向右（170 像素/单位），z 向上（160 像素/单位），原点 (250, 220) -->
  <path d="M 250 220 L 160 295 L 420 220 Z" style="stroke: var(--good, #0f8a5f); fill: var(--good, #0f8a5f)" stroke-width="1.2" fill-opacity="0.14" />
  <line x1="250" y1="220" x2="160" y2="295" style="stroke: var(--muted, #6b7280)" stroke-width="1" stroke-dasharray="4 3" />
  <line x1="250" y1="220" x2="420" y2="220" style="stroke: var(--muted, #6b7280)" stroke-width="1" stroke-dasharray="4 3" />
  <line x1="250" y1="220" x2="250" y2="60" style="stroke: var(--muted, #6b7280)" stroke-width="1" stroke-dasharray="4 3" />
  <line x1="160" y1="295" x2="139.15" y2="312.38" stroke="currentColor" stroke-width="1.1" />
  <path d="M 133 317.5 L 136.59 309.31 L 141.71 315.45 Z" fill="currentColor" />
  <line x1="420" y1="220" x2="466.4" y2="220" stroke="currentColor" stroke-width="1.1" />
  <path d="M 474.4 220 L 466.4 224 L 466.4 216 Z" fill="currentColor" />
  <line x1="250" y1="60" x2="250" y2="32.8" stroke="currentColor" stroke-width="1.1" />
  <path d="M 250 24.8 L 254 32.8 L 246 32.8 Z" fill="currentColor" />
  <text x="125" y="327.5" text-anchor="end" font-size="14" fill="currentColor"><tspan font-style="italic">x</tspan></text>
  <text x="476.4" y="211" font-size="14" fill="currentColor"><tspan font-style="italic">y</tspan></text>
  <text x="241" y="28.8" text-anchor="end" font-size="14" fill="currentColor"><tspan font-style="italic">z</tspan></text>
  <path d="M 214 154 L 318 124 L 250 124 Z" style="stroke: var(--warn, #a8661a); fill: var(--warn, #a8661a)" stroke-width="1.4" fill-opacity="0.3" />
  <line x1="257" y1="242.5" x2="257" y2="162.5" style="stroke: var(--accent, #2563eb)" stroke-width="2.6" />
  <circle cx="257" cy="242.5" r="3.5" style="fill: var(--good, #0f8a5f)" />
  <circle cx="257" cy="162.5" r="3.5" style="fill: var(--accent, #2563eb)" />
  <path d="M 160 295 L 420 220 L 250 60 Z" style="stroke: var(--accent, #2563eb); fill: var(--accent, #2563eb)" stroke-width="1.6" fill-opacity="0.1" />
  <text x="154" y="287" text-anchor="end" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">1</text>
  <text x="422" y="237" text-anchor="middle" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">1</text>
  <text x="258" y="64" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">1</text>
  <text x="330" y="238" text-anchor="middle" font-size="14" style="fill: var(--good, #0f8a5f)" fill="currentColor"><tspan font-style="italic">D</tspan></text>
  <text x="369.4" y="159.2" style="fill: var(--accent, #2563eb)" fill="currentColor"><tspan font-style="italic">x</tspan> + <tspan font-style="italic">y</tspan> + <tspan font-style="italic">z</tspan> = 1</text>
  <text x="328" y="128" style="fill: var(--warn, #a8661a)" fill="currentColor"><tspan font-style="italic">z</tspan> = 0.6</text>
  <text x="320" y="346" text-anchor="middle" fill="currentColor">穿线：在 <tspan font-style="italic">D</tspan> 里取一点，<tspan font-style="italic">z</tspan> 从 0 积到 1 − <tspan font-style="italic">x</tspan> − <tspan font-style="italic">y</tspan></text>
  <text x="320" y="370" text-anchor="middle" fill="currentColor">切片：高度 <tspan font-style="italic">z</tspan> 处的截面是三角形 <tspan font-style="italic">x</tspan> + <tspan font-style="italic">y</tspan> ≤ 1 − <tspan font-style="italic">z</tspan></text>
</svg>
