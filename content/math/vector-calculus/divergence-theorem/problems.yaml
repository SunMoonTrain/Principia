- id: p1
  tier: easy
  statement: |
    求$\vb F=(2x,\ 3y,\ -z)$穿过单位立方体$[0,1]^3$的表面、往外的通量。
  answer:
    type: number
    value: 4
  hints:
    - |
      用散度定理：通量等于$\iiint\divg\vb F\,\dd V$。
    - |
      $\divg\vb F=2+3-1=4$，是常数。
    - |
      通量$=4\times$立方体体积$=4$。
  solution: |
    $\divg\vb F=4$，由散度定理，通量$=4\times1=4$。

- id: p2
  tier: easy
  statement: |
    求$\vb F=(x,y,z)$穿过圆柱体$x^2+y^2\le1$、$0\le z\le2$的整个表面（侧面和上下底）、往外的通量。
  answer:
    type: number
    value: 6*pi
  hints:
    - |
      用散度定理，$\divg\vb F=3$。
    - |
      圆柱体的体积是$\pi\cdot1^2\cdot2=2\pi$。
    - |
      通量$=3\cdot2\pi=6\pi$。
  solution: |
    $\divg\vb F=3$，通量$=3\times2\pi=6\pi$。

- id: p3
  tier: medium
  statement: |
    $V$是抛物面$z=x^2+y^2$和平面$z=1$围成的区域。求$\vb F=(x,\ y,\ z^2)$穿过$V$的整个边界、往外的通量。
  answer:
    type: number
    value: 5*pi/3
  hints:
    - |
      用散度定理，$\divg\vb F=1+1+2z=2+2z$。
    - |
      用柱坐标（cylindrical coordinates）：$z$从$s^2$到$1$，$s$从$0$到$1$，$\dd V=s\,\dd s\dd\varphi\dd z$。
    - |
      $\int_0^{2\pi}\int_0^1\int_{s^2}^1(2+2z)\dd z\,s\,\dd s\dd\varphi=2\pi\int_0^1(3-2s^2-s^4)s\,\dd s=2\pi\cdot\frac56=\frac{5\pi}3$。
  solution: |
    $\divg\vb F=2+2z$。在柱坐标下，$\int_{s^2}^1(2+2z)\dd z=3-2s^2-s^4$，通量$=2\pi\int_0^1(3-2s^2-s^4)s\,\dd s=2\pi\bigl(\frac32-\frac12-\frac16\bigr)=\frac{5\pi}3$。

- id: p4
  tier: medium
  statement: |
    求$\vb F=(0,0,z)$穿过上半球面$x^2+y^2+z^2=4$（$z\ge0$，外法向）的通量。提示：先补上底面，用散度定理。
  answer:
    type: number
    value: 16*pi/3
  hints:
    - |
      上半球面加上底面圆盘$x^2+y^2\le4$（$z=0$，外法向朝下），围成半球体。
    - |
      $\divg\vb F=1$，穿过整个闭曲面的通量是半球体的体积$\frac23\pi\cdot2^3=\frac{16\pi}3$。
    - |
      底面上$z=0$，$\vb F=\vb 0$，通量为零。所以上半球面的通量是$\frac{16\pi}3$。
  solution: |
    补上底面围成半球体，$\divg\vb F=1$，闭曲面的通量$=\frac{16\pi}3$。底面上$\vb F=\vb 0$，没有通量，所以上半球面的通量是$\frac{16\pi}3$。

- id: p5
  tier: hard
  statement: |
    $V$是长方体$[a_1,b_1]\times[a_2,b_2]\times[a_3,b_3]$，$\vb F=(P,Q,R)$在$V$上有连续的偏导数。不用一般的定理，直接证明$\oint_{\partial V}\vb F\cdot\dd\vb a=\iiint_V\divg\vb F\,\dd V$。
  hints:
    - |
      分开证三部分，例如$\iiint_VR_z\,\dd V$等于$(0,0,R)$穿过六个面的通量。
    - |
      先对$z$积分：$\iiint_VR_z\,\dd V=\iint\bigl[R(x,y,b_3)-R(x,y,a_3)\bigr]\dd x\dd y$，用牛顿-莱布尼茨公式（Newton–Leibniz formula）。
    - |
      顶面外法向$(0,0,1)$，通量$\iint R(x,y,b_3)\dd x\dd y$；底面外法向$(0,0,-1)$，通量$-\iint R(x,y,a_3)\dd x\dd y$；四个侧面上$(0,0,R)$和法向垂直，通量为零。$P$、$Q$同理，相加即得。
  reference: |
    由牛顿-莱布尼茨公式，$\iiint_VR_z\,\dd V=\int_{a_1}^{b_1}\int_{a_2}^{b_2}\bigl[R(x,y,b_3)-R(x,y,a_3)\bigr]\dd y\dd x$。顶面$z=b_3$的外法向是$(0,0,1)$，$(0,0,R)$穿过它的通量是$\iint R(x,y,b_3)\dd x\dd y$；底面的外法向是$(0,0,-1)$，通量是$-\iint R(x,y,a_3)\dd x\dd y$；四个侧面的外法向是$(\pm1,0,0)$或$(0,\pm1,0)$，和$(0,0,R)$垂直，通量为零。所以$(0,0,R)$穿过整个表面的通量等于$\iiint_VR_z\,\dd V$。

    同理，$(P,0,0)$的通量等于$\iiint_VP_x\,\dd V$，$(0,Q,0)$的通量等于$\iiint_VQ_y\,\dd V$。通量对$\vb F$是线性的，三部分相加，得$\oint_{\partial V}\vb F\cdot\dd\vb a=\iiint_V(P_x+Q_y+R_z)\dd V$。

- id: p6
  tier: hard
  statement: |
    $\vb F=\frac{\vb r}{r^3}$（$r\ne0$）。$S$是一张包住原点的分片光滑闭曲面（外法向），它不经过原点。证明$\oint_S\vb F\cdot\dd\vb a=4\pi$；如果$S$不包住原点，结果又是多少？
  hints:
    - |
      $\vb F$在原点以外处处无散。原点在$S$里面时，散度定理不能直接用在$S$包住的区域上。
    - |
      取一个很小的球面$S_\varepsilon$包住原点、整个在$S$里面。对$S$和$S_\varepsilon$之间的区域用散度定理，那里$\vb F$有连续的偏导数。
    - |
      这块区域的边界是$S$（外法向朝外）和$S_\varepsilon$（外法向指向原点）。$0=\oint_S\vb F\cdot\dd\vb a-\oint_{S_\varepsilon}\vb F\cdot\dd\vb a$（后者按指向外面算），而小球面上的通量是$4\pi$。不包住原点时，散度定理直接用在$S$包住的区域上，结果是$0$。
  reference: |
    $\divg\frac{\vb r}{r^3}=0$（$r\ne0$）。原点在$S$里面时，取半径$\varepsilon$足够小的球面$S_\varepsilon$，整个落在$S$包住的区域里。

    记$W$是$S$和$S_\varepsilon$之间的区域，它不含原点，$\vb F$在$W$上有连续的偏导数。$W$的边界是$S$（法向朝外）和$S_\varepsilon$（$W$的外法向指向原点）。由散度定理，$\oint_S\vb F\cdot\dd\vb a-\oint_{S_\varepsilon}\vb F\cdot\dd\vb a=\iiint_W0\,\dd V=0$，其中第二项按球面朝外的法向算。

    球面$S_\varepsilon$上$\vb F\cdot\vb n=\frac1{\varepsilon^2}$，通量$=4\pi$，所以$\oint_S\vb F\cdot\dd\vb a=4\pi$，和$S$的形状无关。$S$不包住原点时，$\vb F$在$S$包住的整个区域上有连续的偏导数，直接用散度定理得$0$。

    这正是高斯定律的数学内容：点电荷的电场穿过任何包住它的闭曲面，电通量都一样；不包住时为零。

- id: p7
  tier: thinking
  statement: |
    物体里的温度是$T(\vb r,t)$，它对位置有连续的二阶偏导数（second-order partial derivative），$\pdv Tt$也连续。热量从热的地方流向冷的地方，热流$\vb q=-k\nabla T$（$k>0$是导热系数（thermal conductivity））；单位体积的内能是$c\rho T$（$c$、$\rho$是常数）。仿照连续性方程的推导，说明$T$满足$\pdv Tt=\frac k{c\rho}\divg(\nabla T)$。为什么$\divg(\nabla T)>0$的地方温度会升高？
  hints:
    - |
      内能是守恒的量：密度$c\rho T$，流动用$\vb q$描述，代进连续性方程。
    - |
      $\pdv{}t(c\rho T)+\divg\vb q=0$，即$c\rho\pdv Tt-k\,\divg(\nabla T)=0$。
    - |
      所以$\pdv Tt=\frac k{c\rho}\divg(\nabla T)$。$\divg(\nabla T)$就是拉普拉斯算子（Laplacian，见[向量微分恒等式与拉普拉斯算子](lesson:math.vector-calculus.vector-identities)），它为正说明这一点比周围的平均温度低，四周的热量流进来，温度升高。
  reference: |
    内能既不产生也不消失（没有热源），它的密度是$c\rho T$，流动是$\vb q=-k\nabla T$。由连续性方程，$\pdv{}t(c\rho T)+\divg(-k\nabla T)=0$，$c$、$\rho$、$k$都是常数，所以$\pdv Tt=\frac k{c\rho}\divg(\nabla T)$。这就是热方程。

    $\divg(\nabla T)$是$T$的拉普拉斯算子$\lap T$，它量的是一点和周围平均值的差：$\lap T>0$时这一点比周围冷。热流$-k\nabla T$从四周指向这里，流进的热多于流出的，温度升高；$\lap T<0$时反过来降温。

    用散度定理看得更直接：在一个小球上，$\oint\vb q\cdot\dd\vb a=-k\iiint\lap T\,\dd V$，$\lap T>0$时净流出的热为负，也就是热量净流入。

- id: p8
  tier: thinking
  statement: |
    $\vb F$有连续的偏导数，$B_\varepsilon$是以点$\vb p$为球心、半径为$\varepsilon$的球。证明$\divg\vb F(\vb p)=\lim_{\varepsilon\to0}\frac3{4\pi\varepsilon^3}\oint_{\partial B_\varepsilon}\vb F\cdot\dd\vb a$。这样写的散度有什么好处？
  hints:
    - |
      由散度定理，通量$=\iiint_{B_\varepsilon}\divg\vb F\,\dd V$。
    - |
      $\divg\vb F$连续，$\Bigl|\iiint_{B_\varepsilon}\divg\vb F\,\dd V-\divg\vb F(\vb p)\cdot\frac43\pi\varepsilon^3\Bigr|\le\max_{B_\varepsilon}|\divg\vb F-\divg\vb F(\vb p)|\cdot\frac43\pi\varepsilon^3$。
    - |
      除以$\frac43\pi\varepsilon^3$，右边趋于零。这个说法只用通量和体积，和坐标系无关：转动坐标轴，散度的值不变。
  reference: |
    记$g=\divg\vb F$，它连续。由散度定理，$\oint_{\partial B_\varepsilon}\vb F\cdot\dd\vb a=\iiint_{B_\varepsilon}g\,\dd V$，所以$\Bigl|\frac3{4\pi\varepsilon^3}\oint_{\partial B_\varepsilon}\vb F\cdot\dd\vb a-g(\vb p)\Bigr|\le\max_{B_\varepsilon}|g-g(\vb p)|\to0$。

    散度原来是用坐标定义的$P_x+Q_y+R_z$；这个极限只用到「通量」和「体积」，两者都和坐标系的取法无关，所以转动、平移坐标轴，散度不变。它也把[散度与旋度](lesson:math.vector-calculus.curl-divergence)里「源的强度」说得更准确：单位体积每秒冒出的量。
