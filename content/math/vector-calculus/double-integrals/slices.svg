<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-size="13">
  <!-- 左：斜视图，x 朝前下方（每单位左 50、下 30 像素），y 向右（90 像素/单位），z 向上（45 像素/单位）；右：三角形区域，180 像素/单位，原点 (400, 270) -->
  <line x1="112" y1="250" x2="46.36" y2="289.38" stroke="currentColor" stroke-width="1.1" />
  <path d="M 39.5 293.5 L 44.3 285.95 L 48.42 292.81 Z" fill="currentColor" />
  <line x1="112" y1="250" x2="324.5" y2="250" stroke="currentColor" stroke-width="1.1" />
  <path d="M 332.5 250 L 324.5 254 L 324.5 246 Z" fill="currentColor" />
  <line x1="112" y1="250" x2="112" y2="51" stroke="currentColor" stroke-width="1.1" />
  <path d="M 112 43 L 116 51 L 108 51 Z" fill="currentColor" />
  <text x="31.5" y="303.5" text-anchor="end" font-size="14" fill="currentColor"><tspan font-style="italic">x</tspan></text>
  <text x="336.5" y="242" font-size="14" fill="currentColor"><tspan font-style="italic">y</tspan></text>
  <text x="104" y="47" text-anchor="end" font-size="14" fill="currentColor"><tspan font-style="italic">z</tspan></text>
  <path d="M 112 250 L 62 280 L 242 280 L 292 250 Z" fill="none" style="stroke: var(--muted, #6b7280)" stroke-width="1" />
  <line x1="62" y1="280" x2="62" y2="145" style="stroke: var(--muted, #6b7280)" stroke-width="1.2" />
  <line x1="242" y1="280" x2="242" y2="235" style="stroke: var(--muted, #6b7280)" stroke-width="1.2" />
  <line x1="292" y1="250" x2="292" y2="160" style="stroke: var(--muted, #6b7280)" stroke-width="1.2" />
  <path d="M 87 265 L 267 265 L 267 197.5 L 87 107.5 Z" style="stroke: var(--accent, #2563eb); fill: var(--accent, #2563eb)" stroke-width="1.6" fill-opacity="0.22" />
  <path d="M 112 70 L 62 145 L 242 235 L 292 160 Z" fill="none" style="stroke: var(--accent, #2563eb)" stroke-width="2" />
  <text x="300" y="148" style="fill: var(--accent, #2563eb)" fill="currentColor"><tspan font-style="italic">z</tspan> = 4 − <tspan font-style="italic">x</tspan> − <tspan font-style="italic">y</tspan></text>
  <text x="120" y="160" style="fill: var(--accent, #2563eb)" fill="currentColor"><tspan font-style="italic">A</tspan>(0.5)</text>
  <text x="54" y="284" text-anchor="end" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">1</text>
  <text x="242" y="297" text-anchor="middle" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">(1, 2, 0)</text>
  <line x1="384" y1="270" x2="606" y2="270" stroke="currentColor" stroke-width="1.1" />
  <path d="M 614 270 L 606 274 L 606 266 Z" fill="currentColor" />
  <line x1="400" y1="286" x2="400" y2="64" stroke="currentColor" stroke-width="1.1" />
  <path d="M 400 56 L 404 64 L 396 64 Z" fill="currentColor" />
  <text x="620" y="275" font-size="14" fill="currentColor"><tspan font-style="italic">x</tspan></text>
  <text x="392" y="60" text-anchor="end" font-size="14" fill="currentColor"><tspan font-style="italic">y</tspan></text>
  <path d="M 400 270 L 580 270 L 580 90 Z" style="stroke: var(--good, #0f8a5f); fill: var(--good, #0f8a5f)" stroke-width="1.6" fill-opacity="0.14" />
  <path d="M 504.4 270 L 511.6 270 L 511.6 158.4 L 504.4 165.6 Z" style="stroke: var(--accent, #2563eb); fill: var(--accent, #2563eb)" stroke-width="1.2" fill-opacity="0.45" />
  <path d="M 450.4 219.6 L 580 219.6 L 580 212.4 L 457.6 212.4 Z" style="stroke: var(--warn, #a8661a); fill: var(--warn, #a8661a)" stroke-width="1.2" fill-opacity="0.45" />
  <text x="469.6" y="172" text-anchor="end" style="fill: var(--good, #0f8a5f)" fill="currentColor"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">x</tspan></text>
  <text x="580" y="287" text-anchor="middle" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">1</text>
  <text x="392" y="94" text-anchor="end" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">1</text>
  <line x1="400" y1="90" x2="580" y2="90" style="stroke: var(--muted, #6b7280)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="409" y="118.8" style="fill: var(--accent, #2563eb)" fill="currentColor">竖条：<tspan font-style="italic">y</tspan> 从 0 到 <tspan font-style="italic">x</tspan></text>
  <text x="409" y="140.4" style="fill: var(--warn, #a8661a)" fill="currentColor">横条：<tspan font-style="italic">x</tspan> 从 <tspan font-style="italic">y</tspan> 到 1</text>
  <text x="320" y="318" text-anchor="middle" fill="currentColor">左：平面 <tspan font-style="italic">x</tspan> = 0.5 截出的截面面积是 <tspan font-style="italic">A</tspan>(0.5)；先对 <tspan font-style="italic">y</tspan> 积出 <tspan font-style="italic">A</tspan>(<tspan font-style="italic">x</tspan>)，再对 <tspan font-style="italic">x</tspan> 积</text>
  <text x="320" y="342" text-anchor="middle" fill="currentColor">右：同一个三角形，竖着切读出一组积分限，横着切读出另一组</text>
</svg>
