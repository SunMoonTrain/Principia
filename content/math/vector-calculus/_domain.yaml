id: math.vector-calculus
title: |
  多变量微积分与向量分析
proofPolicy: sketch
macros:
  \R: |
    \mathbb{R}
  \vb: |
    \mathbf{#1}
  \uv: |
    \hat{\mathbf{#1}}
  \dd: |
    \mathop{}\!\mathrm{d}
  \dv: |
    \frac{\mathrm{d} #1}{\mathrm{d} #2}
  \pdv: |
    \frac{\partial #1}{\partial #2}
  \divg: |
    \nabla\cdot
  \curl: |
    \nabla\times
  \lap: |
    \nabla^2
glossary:
  - id: math.vector-calculus.multivariable-function
    zh: |
      多元函数
    en: |
      function of several variables
    brief: |
      自变量是$\R^n$中的点（$n\ge2$）的函数，例如二元函数$z=f(x,y)$：每个点对应唯一一个实数。
    definedIn: math.vector-calculus.functions-of-several-variables
    anchor: def-multivariable-function
  - id: math.vector-calculus.level-curve
    zh: |
      等值线
    en: |
      level curve
    brief: |
      二元函数$f$取同一个值$c$的点组成的曲线$f(x,y)=c$；地图上的等高线就是海拔的等值线。
    definedIn: math.vector-calculus.functions-of-several-variables
    anchor: def-level-curve
  - id: math.vector-calculus.level-surface
    zh: |
      等值面
    en: |
      level surface
    brief: |
      三元函数$f$取同一个值$c$的点组成的曲面$f(x,y,z)=c$，例如空间里温度相同的点组成的面。
    definedIn: math.vector-calculus.functions-of-several-variables
    anchor: def-level-surface
  - id: math.vector-calculus.double-limit
    zh: |
      二重极限
    en: |
      double limit
    brief: |
      点$(x,y)$不论从哪个方向、沿什么路径趋近$(a,b)$，$f(x,y)$都趋于同一个数$L$，记作$\lim_{(x,y)\to(a,b)}f(x,y)=L$。
    definedIn: math.vector-calculus.multivariable-limits
    anchor: def-double-limit
  - id: math.vector-calculus.continuous
    zh: |
      连续
    en: |
      continuous
    brief: |
      $\lim_{(x,y)\to(a,b)}f(x,y)=f(a,b)$时，说多元函数$f$在$(a,b)$处连续：求极限可以直接代入。
    definedIn: math.vector-calculus.multivariable-limits
    anchor: def-continuous
  - id: math.vector-calculus.extreme-value-theorem
    zh: |
      最值定理
    en: |
      extreme value theorem
    brief: |
      多元函数在有界闭区域上连续时，一定能取到最大值和最小值；有界、闭两个条件少一个都可能取不到。
    definedIn: math.vector-calculus.multivariable-limits
    anchor: thm-extreme-value
  - id: math.vector-calculus.partial-derivative
    zh: |
      偏导数
    en: |
      partial derivative
    brief: |
      固定其余变量、只让一个变量变动时的导数，如$f_x(a,b)=\lim_{h\to0}\frac{f(a+h,b)-f(a,b)}h$，也记作$\pdv fx$。
    definedIn: math.vector-calculus.partial-derivatives
    anchor: def-partial-derivative
  - id: math.vector-calculus.second-partial-derivative
    zh: |
      二阶偏导数
    en: |
      second-order partial derivative
    brief: |
      对一阶偏导数再求一次偏导数，如$f_{xx}=\frac{\partial^2f}{\partial x^2}$、$f_{xy}=(f_x)_y$；下标从左往右是求导的次序。
    definedIn: math.vector-calculus.partial-derivatives
    anchor: def-second-partials
  - id: math.vector-calculus.mixed-partial-derivative
    zh: |
      混合偏导数
    en: |
      mixed partial derivative
    brief: |
      对不同变量先后求导得到的二阶偏导数$f_{xy}$、$f_{yx}$；它们在一点附近存在并在这一点连续时相等。
    definedIn: math.vector-calculus.partial-derivatives
    anchor: def-second-partials
  - id: math.vector-calculus.schwarz-theorem
    zh: |
      施瓦茨定理
    en: |
      Schwarz's theorem
    brief: |
      混合偏导数$f_{xy}$、$f_{yx}$在一点附近都存在、在这一点连续时，两者在这一点相等：求导的先后可以交换。
    definedIn: math.vector-calculus.partial-derivatives
    anchor: thm-schwarz
  - id: math.vector-calculus.differentiable
    zh: |
      可微
    en: |
      differentiable
    brief: |
      存在常数$A$、$B$，使$f(a+h,b+k)=f(a,b)+Ah+Bk+r$，误差$r$比位移的长度$\sqrt{h^2+k^2}$小得多。
    definedIn: math.vector-calculus.differentiability
    anchor: def-differentiable
  - id: math.vector-calculus.total-differential
    zh: |
      全微分
    en: |
      total differential
    brief: |
      可微时函数改变量的一次部分$\dd f=f_x\dd x+f_y\dd y$，是改变量的一阶近似。
    definedIn: math.vector-calculus.differentiability
    anchor: def-total-differential
  - id: math.vector-calculus.tangent-plane
    zh: |
      切平面
    en: |
      tangent plane
    brief: |
      平面$z=f(a,b)+f_x(a,b)(x-a)+f_y(a,b)(y-b)$：可微时曲面$z=f(x,y)$在切点附近贴近它。别的曲面在一点的切平面同理，是在这一点附近贴近曲面的平面。
    definedIn: math.vector-calculus.differentiability
    anchor: def-tangent-plane
  - id: math.vector-calculus.chain-rule
    zh: |
      链式法则
    en: |
      chain rule
    brief: |
      $f$可微时，$\dv{}{t}f\bigl(x(t),y(t)\bigr)=f_x\dv xt+f_y\dv yt$：沿依赖关系的每条路径，把偏导数相乘再相加。
    definedIn: math.vector-calculus.multivariable-chain-rule
    anchor: thm-chain-rule
  - id: math.vector-calculus.total-derivative
    zh: |
      全导数
    en: |
      total derivative
    brief: |
      $z=f(x,y,t)$而$x$、$y$又随$t$变时，$z$对$t$的导数$f_x\dv xt+f_y\dv yt+\pdv ft$，不只是$\pdv ft$。
    definedIn: math.vector-calculus.multivariable-chain-rule
    anchor: def-total-derivative
  - id: math.vector-calculus.directional-derivative
    zh: |
      方向导数
    en: |
      directional derivative
    brief: |
      沿单位向量$\vb u$每走单位距离函数的变化率$D_{\vb u}f$；$f$可微时等于$\nabla f\cdot\vb u$。
    definedIn: math.vector-calculus.gradient
    anchor: def-directional-derivative
  - id: math.vector-calculus.gradient
    zh: |
      梯度
    en: |
      gradient
    brief: |
      由偏导数组成的向量$\nabla f=(f_x,f_y)$：指向函数增长最快的方向，长度是最大变化率，垂直于等值线。
    definedIn: math.vector-calculus.gradient
    anchor: def-gradient
  - id: math.vector-calculus.stationary-point
    zh: |
      驻点
    en: |
      stationary point
    brief: |
      各个一阶偏导数都为零的点，二元时就是$f_x=f_y=0$的点。可微函数在定义域内部的局部极值点都是驻点，反过来不一定。
    definedIn: math.vector-calculus.taylor-multivariable
    anchor: def-stationary-point
  - id: math.vector-calculus.saddle-point
    zh: |
      鞍点
    en: |
      saddle point
    brief: |
      不是局部极值点的驻点：它附近既有函数值更大的点，也有更小的点。例如$x^2-y^2$的原点，图像在那里像马鞍。
    definedIn: math.vector-calculus.taylor-multivariable
    anchor: def-saddle-point
  - id: math.vector-calculus.vector-valued-function
    zh: |
      向量值函数
    en: |
      vector-valued function
    brief: |
      把$\R^n$中的点对应到$\R^m$中的点的函数$\vb f=(f_1,\dots,f_m)$，每个分量函数是一个多元函数。
    definedIn: math.vector-calculus.jacobian
    anchor: def-vector-valued-function
  - id: math.vector-calculus.jacobian-matrix
    zh: |
      雅可比矩阵
    en: |
      Jacobian matrix
    brief: |
      第$i$行第$j$列是$\pdv{f_i}{x_j}$的矩阵$J_{\vb f}$；可微时$\vb f(\vb a+\vb h)\approx\vb f(\vb a)+J_{\vb f}(\vb a)\vb h$。
    definedIn: math.vector-calculus.jacobian
    anchor: def-jacobian-matrix
  - id: math.vector-calculus.local-linear-approximation
    zh: |
      局部线性近似
    en: |
      local linear approximation
    brief: |
      各分量函数在$\vb a$处可微时，$\vb f(\vb a+\vb h)\approx\vb f(\vb a)+J_{\vb f}(\vb a)\vb h$，误差比$|\vb h|$小得多：映射在一点附近像一个线性变换。
    definedIn: math.vector-calculus.jacobian
    anchor: thm-local-linear
  - id: math.vector-calculus.taylor-formula
    zh: |
      多元泰勒公式
    en: |
      Taylor's formula
    brief: |
      二阶时$f(a+h,b+k)\approx f(a,b)+f_xh+f_yk+\frac12\bigl(f_{xx}h^2+2f_{xy}hk+f_{yy}k^2\bigr)$，误差比$h^2+k^2$小得多；二次项由黑塞矩阵给出。
    definedIn: math.vector-calculus.taylor-multivariable
    anchor: thm-taylor
  - id: math.vector-calculus.hessian-matrix
    zh: |
      黑塞矩阵
    en: |
      Hessian matrix
    brief: |
      第$i$行第$j$列是先对$x_i$、再对$x_j$求的二阶偏导数$f_{x_ix_j}$的矩阵$H_f$，给出泰勒公式的二次项；驻点处它决定附近的形状。
    definedIn: math.vector-calculus.taylor-multivariable
    anchor: def-hessian
  - id: math.vector-calculus.legendre-transform
    zh: |
      勒让德变换
    en: |
      Legendre transform
    brief: |
      把严格凸的$f(x)$换成以斜率$p=f'(x)$为自变量的$f^*(p)=px-f(x)$；$(f^*)'(p)=x$，变换两次回到$f$。
    definedIn: math.vector-calculus.legendre-transform
    anchor: def-legendre-transform
  - id: math.vector-calculus.double-integral
    zh: |
      二重积分
    en: |
      double integral
    brief: |
      把区域分成小块、作黎曼和$\sum f(x_k^*,y_k^*)\Delta A_k$，小块越分越细时的极限，记作$\iint_Df\,\dd A$；$f\ge0$时是曲面下的体积。
    definedIn: math.vector-calculus.double-integrals
    anchor: def-double-integral
  - id: math.vector-calculus.area-element
    zh: |
      面积元
    en: |
      area element
    brief: |
      二重积分$\iint_Df\,\dd A$里的$\dd A$，表示分出的小块的面积；直角坐标下也写成$\dd x\dd y$。曲面上一小块的面积也叫面积元，记作$\dd a$。
    definedIn: math.vector-calculus.double-integrals
    anchor: def-double-integral
  - id: math.vector-calculus.iterated-integral
    zh: |
      累次积分
    en: |
      iterated integral
    brief: |
      先对一个变量积、再对另一个变量积，如$\int_a^b\int_c^df(x,y)\dd y\dd x$，里层的积分号和最靠里的$\dd y$配对；$f$连续时它等于二重积分。
    definedIn: math.vector-calculus.double-integrals
    anchor: def-iterated-integral
  - id: math.vector-calculus.fubini-theorem
    zh: |
      富比尼定理
    en: |
      Fubini's theorem
    brief: |
      $f$在闭矩形$[a,b]\times[c,d]$上连续时，二重积分可以化成累次积分，先对$x$还是先对$y$积结果一样。
    definedIn: math.vector-calculus.double-integrals
    anchor: thm-fubini
  - id: math.vector-calculus.triple-integral
    zh: |
      三重积分
    en: |
      triple integral
    brief: |
      把立体分成小块、作黎曼和$\sum f\,\Delta V_k$，小块越分越细时的极限，记作$\iiint_\Omega f\,\dd V$；$f$是密度时是质量，$f\equiv1$时是体积。
    definedIn: math.vector-calculus.triple-integrals
    anchor: def-triple-integral
  - id: math.vector-calculus.volume-element
    zh: |
      体积元
    en: |
      volume element
    brief: |
      三重积分$\iiint_\Omega f\,\dd V$里的$\dd V$，表示分出的小块的体积；直角坐标下也写成$\dd x\dd y\dd z$。
    definedIn: math.vector-calculus.triple-integrals
    anchor: def-triple-integral
  - id: math.vector-calculus.improper-double-integral
    zh: |
      反常二重积分
    en: |
      improper double integral
    brief: |
      $f\ge0$在整个平面上连续时，圆盘$x^2+y^2\le R^2$上的二重积分在$R\to\infty$时的极限；换成正方形去逼近，极限也一样。
    definedIn: math.vector-calculus.polar-double-integrals
    anchor: def-improper-double
  - id: math.vector-calculus.gaussian-integral
    zh: |
      高斯积分
    en: |
      Gaussian integral
    brief: |
      $\int_{-\infty}^{\infty}e^{-x^2}\dd x=\sqrt\pi$：平方成平面上$e^{-x^2-y^2}$的积分，换到极坐标就积得出来。
    definedIn: math.vector-calculus.polar-double-integrals
    anchor: thm-gaussian
  - id: math.vector-calculus.cylindrical-coordinates
    zh: |
      柱坐标
    en: |
      cylindrical coordinates
    brief: |
      用$(s,\varphi,z)$表示空间的点：$x=s\cos\varphi$，$y=s\sin\varphi$，$s$是到$z$轴的距离；体积元$\dd V=s\,\dd s\dd\varphi\dd z$。
    definedIn: math.vector-calculus.cylindrical-spherical
    anchor: def-cylindrical
  - id: math.vector-calculus.spherical-coordinates
    zh: |
      球坐标
    en: |
      spherical coordinates
    brief: |
      用$(r,\theta,\varphi)$表示空间的点：$z=r\cos\theta$，$x=r\sin\theta\cos\varphi$，$y=r\sin\theta\sin\varphi$，$\theta$是从$z$轴正向量起的角；体积元$r^2\sin\theta\,\dd r\dd\theta\dd\varphi$。
    definedIn: math.vector-calculus.cylindrical-spherical
    anchor: def-spherical
  - id: math.vector-calculus.jacobian-determinant
    zh: |
      雅可比行列式
    en: |
      Jacobian determinant
    brief: |
      变换$x(u,v)$、$y(u,v)$的雅可比矩阵的行列式$\frac{\partial(x,y)}{\partial(u,v)}$；它的绝对值是这一点附近面积放大的倍数，换元时乘在$\dd u\dd v$上。
    definedIn: math.vector-calculus.change-of-variables
    anchor: def-jacobian-determinant
  - id: math.vector-calculus.change-of-variables-formula
    zh: |
      重积分的换元公式
    en: |
      change of variables formula
    brief: |
      $\iint_Df\,\dd x\dd y=\iint_Ef\bigl(x(u,v),y(u,v)\bigr)\left|\frac{\partial(x,y)}{\partial(u,v)}\right|\dd u\dd v$：换元时乘上雅可比行列式的绝对值。
    definedIn: math.vector-calculus.change-of-variables
    anchor: thm-change-of-variables
  - id: math.vector-calculus.inverse-function-theorem
    zh: |
      反函数定理
    en: |
      inverse function theorem
    brief: |
      $\vb f$有连续的偏导数、在$\vb a$处雅可比矩阵的行列式不为$0$时，$\vb f$在$\vb a$附近一一对应，反过来的映射的雅可比矩阵是原来的逆矩阵。
    definedIn: math.vector-calculus.inverse-implicit
    anchor: thm-inverse-function
  - id: math.vector-calculus.implicit-function-theorem
    zh: |
      隐函数定理
    en: |
      implicit function theorem
    brief: |
      $F(a,b)=0$、$F_y(a,b)\ne0$、偏导数连续时，$a$附近由$F(x,y)=0$能唯一地解出有连续导数的$y(x)$，并且$y'=-\frac{F_x}{F_y}$。
    definedIn: math.vector-calculus.inverse-implicit
    anchor: thm-implicit-function
  - id: math.vector-calculus.lagrange-multipliers
    zh: |
      拉格朗日乘数法
    en: |
      method of Lagrange multipliers
    brief: |
      求$f$在条件$g=c$下的极值：$\nabla g\ne\vb0$时，极值点满足$\nabla f=\lambda\nabla g$，即两个梯度平行；$\lambda$叫作拉格朗日乘子。
    definedIn: math.vector-calculus.lagrange-multipliers
    anchor: thm-lagrange
  - id: math.vector-calculus.vector-field
    zh: |
      向量场
    en: |
      vector field
    brief: |
      给区域里每一点配一个向量$\vb F(x,y)=(P,Q)$，例如流体的速度场、力场；画成格点上的箭头。
    definedIn: math.vector-calculus.vector-fields
    anchor: def-vector-field
  - id: math.vector-calculus.gradient-field
    zh: |
      梯度场
    en: |
      gradient field
    brief: |
      某个函数的梯度$\nabla f$组成的向量场；箭头处处和$f$的等值线垂直，指向$f$增大的一侧。
    definedIn: math.vector-calculus.vector-fields
    anchor: def-gradient-field
  - id: math.vector-calculus.flow-line
    zh: |
      流线
    en: |
      flow line
    brief: |
      速度处处等于场的曲线：$\vb r'(t)=\vb F\bigl(\vb r(t)\bigr)$，处处和场的箭头相切；速度场里被带着走的点走出的就是流线。
    definedIn: math.vector-calculus.vector-fields
    anchor: def-flow-line
  - id: math.vector-calculus.divergence
    zh: |
      散度
    en: |
      divergence
    brief: |
      向量场$\vb F=(P,Q,R)$的$\divg\vb F=P_x+Q_y+R_z$：一点处往外冒的强度，等于随流动的一小块体积的相对变化率。平面上是$P_x+Q_y$，量的是面积的相对变化率。
    definedIn: math.vector-calculus.curl-divergence
    anchor: def-divergence
  - id: math.vector-calculus.divergence-free-field
    zh: |
      无散场
    en: |
      divergence-free field
    brief: |
      散度处处为零的向量场；当成速度场时，随流动的每一小块体积都不变。
    definedIn: math.vector-calculus.curl-divergence
    anchor: def-divergence-free
  - id: math.vector-calculus.curl
    zh: |
      旋度
    en: |
      curl
    brief: |
      $\curl\vb F=(R_y-Q_z,\ P_z-R_x,\ Q_x-P_y)$：一点处打转的强度；速度场的旋度是当地小块转动角速度的两倍。平面上只看$Q_x-P_y$，叫平面旋度。
    definedIn: math.vector-calculus.curl-divergence
    anchor: def-curl
  - id: math.vector-calculus.irrotational-field
    zh: |
      无旋场
    en: |
      irrotational field
    brief: |
      旋度处处为零的向量场；当成速度场时，每一小块都只被拉伸、不转动。
    definedIn: math.vector-calculus.curl-divergence
    anchor: def-irrotational
  - id: math.vector-calculus.laplacian
    zh: |
      拉普拉斯算子
    en: |
      Laplacian
    brief: |
      梯度的散度$\lap f=\divg(\nabla f)=f_{xx}+f_{yy}+f_{zz}$；量的是$f$在一点和周围的平均值差多少。
    definedIn: math.vector-calculus.vector-identities
    anchor: def-laplacian
  - id: math.vector-calculus.velocity-vector
    zh: |
      速度向量
    en: |
      velocity vector
    brief: |
      $\vb r'(t)=\bigl(x'(t),y'(t),z'(t)\bigr)$：位移除以时间、时间趋于零的极限；方向沿曲线的走向，长度是速率。
    definedIn: math.vector-calculus.space-curves
    anchor: def-velocity-vector
  - id: math.vector-calculus.tangent-vector
    zh: |
      切向量
    en: |
      tangent vector
    brief: |
      曲线$\vb r(t)$在一点不为零的导数$\vb r'(t)$，方向沿曲线在这一点的走向。
    definedIn: math.vector-calculus.space-curves
    anchor: def-tangent-vector
  - id: math.vector-calculus.unit-tangent-vector
    zh: |
      单位切向量
    en: |
      unit tangent vector
    brief: |
      $\vb T=\frac{\vb r'(t)}{|\vb r'(t)|}$：长度为$1$、沿曲线走向的向量。
    definedIn: math.vector-calculus.space-curves
    anchor: def-tangent-vector
  - id: math.vector-calculus.smooth-curve
    zh: |
      光滑曲线
    en: |
      smooth curve
    brief: |
      参数化$\vb r(t)$的导数连续且处处不为零的曲线：每一点都有确定的切线方向，没有尖角。
    definedIn: math.vector-calculus.space-curves
    anchor: def-tangent-vector
  - id: math.vector-calculus.piecewise-smooth
    zh: |
      分段光滑
    en: |
      piecewise smooth
    brief: |
      由有限段光滑曲线首尾相接组成，例如三角形、正方形的边界。
    definedIn: math.vector-calculus.space-curves
    anchor: def-tangent-vector
  - id: math.vector-calculus.arc-length-line-integral
    zh: |
      对弧长的曲线积分
    en: |
      line integral with respect to arc length
    brief: |
      $\int_Cf\,\dd s=\int_a^bf\bigl(\vb r(t)\bigr)|\vb r'(t)|\dd t$：沿曲线一小段一小段地累加$f\Delta s$；$f$是线密度时得到质量，和走向无关。
    definedIn: math.vector-calculus.line-integrals
    anchor: def-arc-length-integral
  - id: math.vector-calculus.line-integral
    zh: |
      曲线积分
    en: |
      line integral
    brief: |
      向量场沿有向曲线的积分$\int_C\vb F\cdot\dd\vb r=\int_a^b\vb F\bigl(\vb r(t)\bigr)\cdot\vb r'(t)\dd t$；$\vb F$是力时就是做的功，反着走变号。
    definedIn: math.vector-calculus.line-integrals
    anchor: def-line-integral
  - id: math.vector-calculus.oriented-curve
    zh: |
      有向曲线
    en: |
      oriented curve
    brief: |
      规定了从哪一端走到哪一端的曲线；反着走记作$-C$，向量场沿它的积分变号。
    definedIn: math.vector-calculus.line-integrals
    anchor: def-oriented-curve
  - id: math.vector-calculus.closed-curve
    zh: |
      闭曲线
    en: |
      closed curve
    brief: |
      起点和终点重合的曲线，例如圆、三角形的边界。
    definedIn: math.vector-calculus.line-integrals
    anchor: def-circulation
  - id: math.vector-calculus.circulation
    zh: |
      环量
    en: |
      circulation
    brief: |
      向量场沿有向闭曲线的曲线积分$\oint_C\vb F\cdot\dd\vb r$：速度场沿这一圈总体上转了多少。
    definedIn: math.vector-calculus.line-integrals
    anchor: def-circulation
  - id: math.vector-calculus.fundamental-theorem-line-integrals
    zh: |
      曲线积分基本定理
    en: |
      fundamental theorem for line integrals
    brief: |
      $\int_C\nabla f\cdot\dd\vb r=f(B)-f(A)$：梯度场的曲线积分只由起点$A$和终点$B$决定，沿闭曲线为零。
    definedIn: math.vector-calculus.conservative-fields
    anchor: thm-fundamental
  - id: math.vector-calculus.conservative-field
    zh: |
      保守场
    en: |
      conservative field
    brief: |
      曲线积分只由起点、终点决定（路径无关）的向量场；等价地，沿每条闭曲线环量为零，也等价于是某个函数的梯度。
    definedIn: math.vector-calculus.conservative-fields
    anchor: def-conservative
  - id: math.vector-calculus.potential-function
    zh: |
      势函数
    en: |
      potential function
    brief: |
      满足$\nabla f=\vb F$的函数$f$；有势函数的场就是保守场，在一个区域上势函数最多差一个常数。
    definedIn: math.vector-calculus.conservative-fields
    anchor: thm-potential
  - id: math.vector-calculus.simply-connected-region
    zh: |
      单连通区域
    en: |
      simply connected region
    brief: |
      每一条闭曲线都能在区域里连续缩成一点的区域；平面上就是没有洞的区域，在它上面无旋场都是保守场。
    definedIn: math.vector-calculus.conservative-fields
    anchor: def-simply-connected
  - id: math.vector-calculus.parametric-surface
    zh: |
      参数曲面
    en: |
      parametric surface
    brief: |
      两个参数描出的曲面$\vb r(u,v)=\bigl(x(u,v),y(u,v),z(u,v)\bigr)$，例如用两个角描出的球面。
    definedIn: math.vector-calculus.parametric-surfaces
    anchor: def-parametric-surface
  - id: math.vector-calculus.smooth-surface
    zh: |
      光滑曲面
    en: |
      smooth surface
    brief: |
      $\vb r_u$、$\vb r_v$连续且$\vb r_u\times\vb r_v\ne\vb 0$的参数曲面：每一点都有切平面，法向量是$\vb r_u\times\vb r_v$。
    definedIn: math.vector-calculus.parametric-surfaces
    anchor: def-smooth-surface
  - id: math.vector-calculus.piecewise-smooth-surface
    zh: |
      分片光滑
    en: |
      piecewise smooth
    brief: |
      曲面由有限块光滑曲面拼成，例如立方体的表面。
    definedIn: math.vector-calculus.parametric-surfaces
    anchor: def-smooth-surface
  - id: math.vector-calculus.simple-closed-curve
    zh: |
      简单闭曲线
    en: |
      simple closed curve
    brief: |
      自己不相交的闭曲线，例如圆、三角形的边界；「8」字形不是。
    definedIn: math.vector-calculus.greens-theorem
    anchor: def-positive-orientation
  - id: math.vector-calculus.greens-theorem
    zh: |
      格林公式
    en: |
      Green's theorem
    brief: |
      $\oint_{\partial D}P\,\dd x+Q\,\dd y=\iint_D(Q_x-P_y)\dd A$（边界取正向）：沿边界的环量等于区域里平面旋度之和。
    definedIn: math.vector-calculus.greens-theorem
    anchor: thm-green
  - id: math.vector-calculus.surface-integral-area
    zh: |
      对面积的曲面积分
    en: |
      surface integral with respect to area
    brief: |
      $\iint_Sf\,\dd a=\iint_Df\bigl(\vb r(u,v)\bigr)|\vb r_u\times\vb r_v|\,\dd u\dd v$：在曲面上一小块一小块地累加$f\Delta a$，例如由面密度求质量。
    definedIn: math.vector-calculus.surface-integrals
    anchor: def-surface-integral-area
  - id: math.vector-calculus.oriented-surface
    zh: |
      有向曲面
    en: |
      oriented surface
    brief: |
      处处选定一个随点连续变化的单位法向量$\vb n$的曲面，说清了哪一面是「正面」；莫比乌斯带选不出来。
    definedIn: math.vector-calculus.surface-integrals
    anchor: def-oriented-surface
  - id: math.vector-calculus.closed-surface
    zh: |
      闭曲面
    en: |
      closed surface
    brief: |
      包住一块空间的曲面，例如球面、立方体的表面；上面的单位法向量默认指向外面，叫外法向。
    definedIn: math.vector-calculus.surface-integrals
    anchor: def-oriented-surface
  - id: math.vector-calculus.outward-normal
    zh: |
      外法向
    en: |
      outward normal
    brief: |
      闭曲面（如球面）上指向外面的单位法向量；闭曲面上的通量默认取它，算的是净流出的量。
    definedIn: math.vector-calculus.surface-integrals
    anchor: def-oriented-surface
  - id: math.vector-calculus.vector-area-element
    zh: |
      有向面积元
    en: |
      vector area element
    brief: |
      $\dd\vb a=\vb n\,\dd a$：方向是曲面的法向量，长度是一小块的面积；参数曲面上是$\pm(\vb r_u\times\vb r_v)\dd u\dd v$。
    definedIn: math.vector-calculus.surface-integrals
    anchor: def-vector-area-element
  - id: math.vector-calculus.flux
    zh: |
      通量
    en: |
      flux
    brief: |
      向量场穿过有向曲面的$\iint_S\vb F\cdot\vb n\,\dd a$：速度场时是每秒穿过曲面的流体，只有沿法向的分量起作用。平面上穿过一条曲线的通量同理。
    definedIn: math.vector-calculus.surface-integrals
    anchor: def-flux
  - id: math.vector-calculus.divergence-theorem
    zh: |
      散度定理
    en: |
      divergence theorem
    brief: |
      也叫高斯公式：$\oint_{\partial V}\vb F\cdot\dd\vb a=\iiint_V\divg\vb F\,\dd V$（外法向）；闭曲面上净流出的量等于里面各处散度之和。
    definedIn: math.vector-calculus.divergence-theorem
    anchor: thm-divergence
