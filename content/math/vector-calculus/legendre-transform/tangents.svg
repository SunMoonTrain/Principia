  <text x="420" y="92" fill="currentColor"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">px</tspan> − <tspan font-style="italic">f</tspan>*(<tspan font-style="italic">p</tspan>)</text>
  <line x1="420" y1="120" x2="446" y2="120" style="stroke: var(--good, #0f8a5f)" stroke-width="1.6" stroke-dasharray="6 4" />
  <text x="454" y="124" style="fill: var(--good, #0f8a5f)" fill="currentColor"><tspan font-style="italic">p</tspan> = 1/2，截距 −<tspan font-style="italic">f</tspan>*(<tspan font-style="italic">p</tspan>) ≈ 0.85</text>
  <line x1="420" y1="144" x2="446" y2="144" style="stroke: var(--warn, #a8661a)" stroke-width="1.6" stroke-dasharray="6 4" />
  <text x="454" y="148" style="fill: var(--warn, #a8661a)" fill="currentColor"><tspan font-style="italic">p</tspan> = 1，截距 −<tspan font-style="italic">f</tspan>*(<tspan font-style="italic">p</tspan>) = 1</text>
  <line x1="420" y1="168" x2="446" y2="168" style="stroke: var(--muted, #6b7280)" stroke-width="1.6" stroke-dasharray="6 4" />
  <text x="454" y="172" style="fill: var(--muted, #6b7280)" fill="currentColor"><tspan font-style="italic">p</tspan> = 2，截距 −<tspan font-style="italic">f</tspan>*(<tspan font-style="italic">p</tspan>) ≈ 0.61</text>
  <text x="320" y="340" text-anchor="middle" fill="currentColor">每个斜率 <tspan font-style="italic">p</tspan> 对应一条切线，截距是 −<tspan font-style="italic">f</tspan>*(<tspan font-style="italic">p</tspan>)；知道了 <tspan font-style="italic">f</tspan>*，就能画出全部切线</text>
  <text x="320" y="366" text-anchor="middle" fill="currentColor">曲线是这些切线的包络，所以换成以斜率为自变量，不丢信息</text>
</svg>
