  <path d="M 51.6 296.71 L 358.5 143.26" fill="none" style="stroke: var(--good, #0f8a5f)" stroke-width="1.6" stroke-dasharray="6 4" />
  <circle cx="207.02" cy="219" r="3.5" style="fill: var(--good, #0f8a5f)" />
  <circle cx="250" cy="197.51" r="3.5" style="fill: var(--good, #0f8a5f)" />
