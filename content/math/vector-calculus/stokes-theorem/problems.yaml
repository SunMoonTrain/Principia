- id: p1
  tier: easy
  statement: |
    $S$是上半球面$x^2+y^2+z^2=4$（$z\ge0$），法向量朝外，$\vb F=(-2y,\ 3x,\ z)$。求$\iint_S(\curl\vb F)\cdot\dd\vb a$。
  answer:
    type: number
    value: 20*pi
  hints:
    - |
      用斯托克斯公式化成沿边界的环量：边界是$z=0$上半径为$2$的圆，法向量朝外时从上往下看逆时针。
    - |
      取$\vb r(t)=(2\cos t,\ 2\sin t,\ 0)$，$0\le t\le2\pi$，边界上$\vb F=(-4\sin t,\ 6\cos t,\ 0)$。
    - |
      $\vb F\cdot\vb r'=8\sin^2t+12\cos^2t$，积分是$8\pi+12\pi=20\pi$。
  solution: |
    由斯托克斯公式，结果等于沿边界圆（从上往下看逆时针）的环量：$\int_0^{2\pi}(8\sin^2t+12\cos^2t)\dd t=20\pi$。也可以换成边界相同的圆盘$x^2+y^2\le4$：$\curl\vb F=(0,0,5)$，通量$=5\cdot4\pi=20\pi$。

- id: p2
  tier: easy
  statement: |
    $S$是圆柱面$x^2+y^2=1$、$0\le z\le3$（不含上下底），法向量朝外，$\vb F=(-y,\ x,\ 0)$。$\partial S$取和外法向配套的正向，求$\vb F$沿上面那一圈（$z=3$）的环量。
  answer:
    type: number
    value: -2*pi
  hints:
    - |
      头朝外法向、沿边界走，让曲面在左手边。在点$(1,0,3)$处，外法向是$(1,0,0)$，曲面在这一圈的下方。
    - |
      在$(1,0,3)$处要往$-y$方向走，曲面才在左手边：从上往下看，上面一圈是顺时针。
    - |
      逆时针一圈，$\oint(-y\,\dd x+x\,\dd y)=2\pi$；顺时针走，结果是它的相反数$-2\pi$。
  solution: |
    上面一圈从上往下看是顺时针，环量是$-2\pi$；下面一圈是逆时针，环量是$2\pi$。两圈加起来是$0$，和$\iint_S(\curl\vb F)\cdot\dd\vb a=\iint_S(0,0,2)\cdot(x,y,0)\,\dd a=0$一致。

- id: p3
  tier: medium
  statement: |
    $A=(1,0,0)$，$B=(0,1,0)$，$C=(0,0,1)$，$\vb F=(z^2,\ x^2,\ y^2)$。求$\vb F$沿三角形边界$A\to B\to C\to A$的环量。
  answer:
    type: number
    value: 1
  hints:
    - |
      用斯托克斯公式，曲面取三角形本身，法向量和$A\to B\to C$的走向按右手定则配套。
    - |
      $(B-A)\times(C-A)=(1,1,1)$，所以单位法向量是$\frac{(1,1,1)}{\sqrt3}$；$\curl\vb F=(2y,\ 2z,\ 2x)$。
    - |
      三角形上$x+y+z=1$，$(\curl\vb F)\cdot\vb n=\frac{2(x+y+z)}{\sqrt3}=\frac2{\sqrt3}$；三角形的面积是$\frac{\sqrt3}2$，环量是$1$。
  solution: |
    由斯托克斯公式，环量$=\iint_T(\curl\vb F)\cdot\vb n\,\dd a=\frac2{\sqrt3}\cdot\frac{\sqrt3}2=1$。直接算也一样：$A\to B$上$\vb r=(1-t,\ t,\ 0)$，$\vb F\cdot\vb r'=(1-t)^2$，积分是$\frac13$；另两条边轮换对称，各是$\frac13$，合计$1$。

- id: p4
  tier: medium
  statement: |
    $S$是圆锥面$z=1-\sqrt{x^2+y^2}$在$z\ge0$的部分，法向量朝上，$\vb F=(-3y+z\sin x,\ x+z^3,\ xyz)$。求$\iint_S(\curl\vb F)\cdot\dd\vb a$。
  answer:
    type: number
    value: 4*pi
  hints:
    - |
      不必在锥面上积分：结果只看边界。边界是$z=0$上的单位圆，法向量朝上时从上往下看逆时针。
    - |
      边界上$z=0$，$\vb F=(-3y,\ x,\ 0)$，$\vb F\cdot\dd\vb r=-3y\,\dd x+x\,\dd y$。
    - |
      换成单位圆盘，只用旋度的$z$分量$Q_x-P_y=1-(-3)=4$，结果是$4\cdot\pi=4\pi$。
  solution: |
    由斯托克斯公式，结果等于沿单位圆（逆时针）的环量：用$\vb r=(\cos t,\sin t,0)$，$\vb F\cdot\vb r'=3\sin^2t+\cos^2t$，积分是$3\pi+\pi=4\pi$。

- id: p5
  tier: hard
  statement: |
    $S$是函数$z=g(x,y)$（$(x,y)\in D$）的图像，$g$有连续的二阶偏导数（second-order partial derivative），法向量朝上；$D$的边界$\partial D$是分段光滑的简单闭曲线（simple closed curve），逆时针。$\vb F=(P,Q,R)$有连续的偏导数。用格林公式证明$\oint_{\partial S}\vb F\cdot\dd\vb r=\iint_S(\curl\vb F)\cdot\dd\vb a$。
  hints:
    - |
      $\partial S$是把$\partial D$抬到曲面上：沿它走时$z=g(x,y)$，$\dd z=g_x\dd x+g_y\dd y$。
    - |
      左边$=\oint_{\partial D}(P+Rg_x)\dd x+(Q+Rg_y)\dd y$，$P$、$Q$、$R$在$\bigl(x,y,g(x,y)\bigr)$处取值；对它用格林公式。
    - |
      用链式法则展开$\pdv{}x(Q+Rg_y)-\pdv{}y(P+Rg_x)$，含$g_{xy}$的两项抵消，剩下$(\curl\vb F)\cdot(-g_x,-g_y,1)$；图像取朝上的法向量时$\dd\vb a=(-g_x,-g_y,1)\dd x\dd y$。
  reference: |
    沿$\partial S$走时$z=g(x,y)$，$\vb F\cdot\dd\vb r=P\,\dd x+Q\,\dd y+R(g_x\dd x+g_y\dd y)$，所以左边$=\oint_{\partial D}(P+Rg_x)\dd x+(Q+Rg_y)\dd y$。由格林公式，它等于$\iint_D\bigl[\pdv{}x(Q+Rg_y)-\pdv{}y(P+Rg_x)\bigr]\dd x\dd y$。

    链式法则给出$\pdv{}x\bigl[Q(x,y,g)\bigr]=Q_x+Q_zg_x$，$\pdv{}x(Rg_y)=(R_x+R_zg_x)g_y+Rg_{yx}$；对$y$求导的两项同理。相减，$R_zg_xg_y$和$Rg_{xy}$两对抵消（$g_{xy}=g_{yx}$），剩下$(Q_x-P_y)+g_x(Q_z-R_y)+g_y(R_x-P_z)$，正是$(\curl\vb F)\cdot(-g_x,-g_y,1)$。

    图像取朝上的法向量时$\dd\vb a=(-g_x,-g_y,1)\dd x\dd y$（见[曲面积分与通量](lesson:math.vector-calculus.surface-integrals)第 5 题），所以上式就是$\iint_S(\curl\vb F)\cdot\dd\vb a$。

- id: p6
  tier: hard
  statement: |
    $S_1$、$S_2$是两张有向曲面，边界都是闭曲线$C$，$C$对两张曲面都是正向；$\vb A$在包住它们的区域上有连续的二阶偏导数，$\vb B=\curl\vb A$。

    （1）用斯托克斯公式说明$\iint_{S_1}\vb B\cdot\dd\vb a=\iint_{S_2}\vb B\cdot\dd\vb a$。（2）两张曲面不相交时，用[高斯公式（散度定理）](lesson:math.vector-calculus.divergence-theorem)再说明一次。（3）物理里磁场$\vb B$处处满足$\divg\vb B=0$。为什么可以说「穿过一个线圈的磁通量」，不必说穿过哪张曲面？
  hints:
    - |
      （1）两边都等于沿$C$的环量$\oint_C\vb A\cdot\dd\vb r$。
    - |
      （2）把$S_2$的法向量反过来，和$S_1$拼成一张闭曲面$\Sigma$，法向量都朝外；$\divg\vb B=\divg(\curl\vb A)=0$（见[向量微分恒等式与拉普拉斯算子](lesson:math.vector-calculus.vector-identities#thm-two-zeros)）。
    - |
      （3）（2）的论证只用到$\divg\vb B=0$：以线圈为边界的两张曲面拼成的闭曲面上，净通量为零。
  reference: |
    （1）$C$对两张曲面都是正向，由斯托克斯公式，$\iint_{S_1}\vb B\cdot\dd\vb a=\oint_C\vb A\cdot\dd\vb r=\iint_{S_2}\vb B\cdot\dd\vb a$。

    （2）两张曲面不相交时，它们围住一块区域$V$。$C$对两张曲面都是正向，所以在$S_1$、$S_2$中，一张的法向量朝$V$外，另一张朝$V$里；把朝里的那张反过来，就拼成取外法向的闭曲面$\partial V$。由散度定理，$\oint_{\partial V}\vb B\cdot\dd\vb a=\iiint_V\divg(\curl\vb A)\,\dd V=0$（旋度的散度恒为零，见[向量微分恒等式与拉普拉斯算子](lesson:math.vector-calculus.vector-identities#thm-two-zeros)），即两张曲面上的通量相等。

    （3）（2）只用到$\divg\vb B=0$。磁场穿过以线圈为边界的任意两张曲面，通量都一样，所以「穿过线圈的磁通量」只由线圈决定。

- id: p7
  tier: thinking
  statement: |
    $\vb F$有连续的偏导数，$\vb p$是一点。对单位向量$\vb n$，记$c(\vb n)$是垂直于$\vb n$的平面上、绕$\vb p$的单位面积环量，也就是讲解里那个极限。

    （1）$\vb n$取什么方向时$c(\vb n)$最大？最大值是多少？

    （2）刚体（rigid body）绕过原点的轴转动，角速度向量是$\boldsymbol\omega$，速度$\vb v=\boldsymbol\omega\times\vb r$。哪个方向的小圆盘上单位面积的环量最大？直接算一个这样的小圆盘上的环量来验证。
  hints:
    - |
      $c(\vb n)=(\curl\vb F)(\vb p)\cdot\vb n=|\curl\vb F(\vb p)|\cos\alpha$，$\alpha$是两个向量的夹角。
    - |
      $\curl\vb F(\vb p)\ne\vb 0$时，$\vb n$和它同向时最大，最大值是$|\curl\vb F(\vb p)|$；$\curl\vb F(\vb p)=\vb 0$时各个方向都是零。
    - |
      刚体转动时$\curl\vb v=2\boldsymbol\omega$（见[散度与旋度](lesson:math.vector-calculus.curl-divergence)例 2）。垂直于$\boldsymbol\omega$、半径为$\varepsilon$的小圆上，$\boldsymbol\omega\times\vb h$沿圆周，大小是$|\boldsymbol\omega|\varepsilon$。
  reference: |
    （1）由讲解，$c(\vb n)=(\curl\vb F)(\vb p)\cdot\vb n=|\curl\vb F(\vb p)|\cos\alpha$。$\curl\vb F(\vb p)\ne\vb 0$时，$\vb n=\frac{\curl\vb F(\vb p)}{|\curl\vb F(\vb p)|}$时最大，最大值是$|\curl\vb F(\vb p)|$；反方向时最小，是它的相反数。所以旋度的方向是「环量最大的那个平面」的法向，长度是那个最大值。

    （2）$\curl\vb v=2\boldsymbol\omega$，所以$\vb n$和$\boldsymbol\omega$同向时最大，单位面积的环量是$2|\boldsymbol\omega|$。验证：圆心$\vb p$，半径$\varepsilon$，圆周上的点$\vb p+\vb h$，$\vb h\perp\boldsymbol\omega$。$\vb v=\boldsymbol\omega\times\vb p+\boldsymbol\omega\times\vb h$，常向量$\boldsymbol\omega\times\vb p$沿闭曲线的环量是零；$\boldsymbol\omega\times\vb h$沿圆周、大小$|\boldsymbol\omega|\varepsilon$，环量是$|\boldsymbol\omega|\varepsilon\cdot2\pi\varepsilon$，除以面积$\pi\varepsilon^2$得$2|\boldsymbol\omega|$。

- id: p8
  tier: thinking
  statement: |
    在去掉$z$轴的空间里，$\vb G=\frac{(-y,\ x,\ 0)}{x^2+y^2}$。

    （1）验证$\curl\vb G=\vb 0$。（2）求沿圆$C_1$：$x^2+y^2=1$，$z=0$（从上往下看逆时针）的环量。（3）以$C_1$为边界的曲面（例如单位圆盘），为什么用不上斯托克斯公式？圆心在$(3,0,0)$、半径为$1$的水平圆$C_2$呢？
  hints:
    - |
      （1）前两个分量里没有$z$，也没有含$z$的项，都是零；第三个分量里，$\pdv{}x\frac x{x^2+y^2}$和$\pdv{}y\frac{-y}{x^2+y^2}$都等于$\frac{y^2-x^2}{(x^2+y^2)^2}$，相减为零。
    - |
      （2）用$\vb r=(\cos t,\sin t,0)$，$\vb G\cdot\vb r'=1$，环量是$2\pi$。
    - |
      （3）假如有一张以$C_1$为边界的曲面不碰$z$轴，对它用斯托克斯公式，环量就是$\iint\vb 0\cdot\dd\vb a=0$，和（2）矛盾。$C_2$围住的圆盘离$z$轴至少$2$。
  reference: |
    （1）$\vb G=(P,Q,0)$，$P$、$Q$不含$z$，旋度的前两个分量$-\pdv Qz$、$\pdv Pz$都是零；第三个分量$Q_x-P_y=\frac{y^2-x^2}{(x^2+y^2)^2}-\frac{y^2-x^2}{(x^2+y^2)^2}=0$。

    （2）$\vb G\bigl(\vb r(t)\bigr)=(-\sin t,\cos t,0)$，$\vb r'=(-\sin t,\cos t,0)$，点积是$1$，环量是$2\pi$。

    （3）斯托克斯公式要求曲面整个落在$\vb G$有连续偏导数的区域里。假如有一张以$C_1$为边界、不碰$z$轴的有向曲面，公式给出环量$=\iint\vb 0\cdot\dd\vb a=0$，和$2\pi$矛盾；所以以$C_1$为边界的每一张曲面都要穿过$z$轴，单位圆盘就在原点处碰到$z$轴。$C_2$围住的水平圆盘上$x\ge2$，不碰$z$轴，可以用斯托克斯公式，沿$C_2$的环量是$0$。这正是去掉$z$轴的空间不单连通的表现：$C_1$绕着$z$轴，缩不成一点；$C_2$可以。
