- id: p1
  tier: easy
  statement: |
    求$\iiint_{\R^3}(x+y^2+z^3)\,\delta^3(\vb r-\vb a)\dd V$，$\vb a=(2,-1,1)$。
  answer:
    type: number
    value: 4
  hints:
    - |
      被积函数连续，积分区域是全空间，一定包住$\vb a$，用筛选性质。
    - |
      结果就是被积函数在$\vb a=(2,-1,1)$处的值。
    - |
      $2+(-1)^2+1^3=4$。
  solution: |
    由筛选性质，积分等于$x+y^2+z^3$在$(2,-1,1)$处的值：$2+1+1=4$。

- id: p2
  tier: easy
  statement: |
    $V$是以原点为球心、半径为$2$的球。求$\iiint_V(x^2+y^2+z^2)\,\delta^3(\vb r-\vb a)\dd V$，$\vb a=(1,1,1)$。
  answer:
    type: number
    value: 3
  hints:
    - |
      先看$\vb a$在不在$V$里：$|\vb a|=\sqrt3$。
    - |
      $\sqrt3<2$，$\vb a$在球里面，可以用筛选性质。
    - |
      结果是$x^2+y^2+z^2$在$(1,1,1)$处的值$3$。
  solution: |
    $|\vb a|=\sqrt3<2$，$\vb a$在$V$里面，由筛选性质，积分等于$1+1+1=3$。

- id: p3
  tier: medium
  statement: |
    $\vb a=\bigl(\frac\pi6,\frac\pi6,0\bigr)$。求$\iiint_{\R^3}\cos(x+y+z)\,\lap\frac1{|\vb r-\vb a|}\dd V$。
  answer:
    type: number
    value: -2*pi
  hints:
    - |
      $\lap\frac1{|\vb r-\vb a|}=-4\pi\delta^3(\vb r-\vb a)$（对$\vb r$求导）。
    - |
      积分变成$-4\pi\iiint\cos(x+y+z)\,\delta^3(\vb r-\vb a)\dd V$，用筛选性质。
    - |
      $\cos\bigl(\frac\pi6+\frac\pi6+0\bigr)=\cos\frac\pi3=\frac12$，结果是$-2\pi$。
  solution: |
    由$\lap\frac1{|\vb r-\vb a|}=-4\pi\delta^3(\vb r-\vb a)$和筛选性质，积分$=-4\pi\cos\frac\pi3=-2\pi$。

- id: p4
  tier: medium
  statement: |
    $\vb b=(0,0,5)$，$\vb F=3\frac{\uv r}{r^2}+\frac{\vb r-\vb b}{|\vb r-\vb b|^3}$。求$\vb F$穿过以原点为球心、半径为$2$的球面（外法向）的通量。
  answer:
    type: number
    value: 12*pi
  hints:
    - |
      $\divg\vb F=3\cdot4\pi\delta^3(\vb r)+4\pi\delta^3(\vb r-\vb b)$：两个点源，一个在原点，一个在$\vb b$。
    - |
      由散度定理，通量等于$\divg\vb F$在球里的积分，只有包在球里的点源算数。
    - |
      原点在球里，$\vb b$离原点$5>2$，在球外；结果是$3\cdot4\pi=12\pi$。
  solution: |
    由散度定理，通量$=\iiint_V\divg\vb F\,\dd V=12\pi\iiint_V\delta^3(\vb r)\dd V+4\pi\iiint_V\delta^3(\vb r-\vb b)\dd V=12\pi+0=12\pi$。第二项的场在球上处处光滑、散度为零，穿过球面的通量是零。

- id: p5
  tier: hard
  statement: |
    平面上记$\delta^2(\vb r)=\delta(x)\delta(y)$，它在原点以外为零，在包住原点的区域上积分为$1$。证明$\divg\frac{(x,y)}{x^2+y^2}=2\pi\delta^2(\vb r)$：对平面上原点不在边界上的区域$D$，往外的通量$\oint_{\partial D}\vb F\cdot\vb n\,\dd s$在原点属于$D$时是$2\pi$，不属于时是$0$。
  hints:
    - |
      原点不在$D$里时，$\vb F$在$D$上光滑；算一下$\vb F$的散度，再用格林公式（Green's theorem）的通量形式。
    - |
      原点在$D$里时，挖掉以原点为圆心、半径为$\varepsilon$的小圆盘，剩下的区域里散度为零。
    - |
      小圆上往外的单位法向量（unit normal vector）是$\frac{(x,y)}\varepsilon$，$\vb F\cdot\vb n=\frac1\varepsilon$，周长$2\pi\varepsilon$。
  reference: |
    $\vb F=\frac{(x,y)}{x^2+y^2}$在原点以外$P_x+Q_y=\frac{y^2-x^2}{(x^2+y^2)^2}+\frac{x^2-y^2}{(x^2+y^2)^2}=0$。原点不在$D$里时，由[格林公式](lesson:math.vector-calculus.greens-theorem)的通量形式，通量$=\iint_D0\,\dd A=0$。

    原点在$D$里时，挖掉半径为$\varepsilon$的小圆盘$D_\varepsilon$（$\varepsilon$小到$D_\varepsilon$整个在$D$里），对剩下的区域用通量形式：穿过$\partial D$往外的通量减去穿过小圆往外的通量等于$0$。小圆上$\vb F\cdot\vb n=\frac1\varepsilon$，通量$=\frac1\varepsilon\cdot2\pi\varepsilon=2\pi$。

    所以通量是$2\pi\iint_D\delta^2(\vb r)\dd A$，即$\divg\vb F=2\pi\delta^2(\vb r)$。这是三维$\divg\frac{\uv r}{r^2}=4\pi\delta^3(\vb r)$在平面上的样子：$2\pi$是单位圆的周长，$4\pi$是单位球面的面积。

- id: p6
  tier: hard
  statement: |
    $\delta_\varepsilon$在以原点为球心、半径为$\varepsilon$的球里等于$\frac3{4\pi\varepsilon^3}$，球外为零。

    （1）$f$在原点附近连续，证明$\lim_{\varepsilon\to0}\iiint_{\R^3}f\,\delta_\varepsilon\dd V=f(\vb 0)$。（2）$V$是上半空间$z>0$，原点在它的边界上，求$\lim_{\varepsilon\to0}\iiint_V\delta_\varepsilon\dd V$。
  hints:
    - |
      （1）$\iiint f\delta_\varepsilon\dd V$是$f$在小球上的平均值，它和$f(\vb 0)$的差不超过$f$在小球上和$f(\vb 0)$的最大偏差。
    - |
      $f$在原点连续，小球缩小时，这个最大偏差趋于零。
    - |
      （2）上半空间正好切走半个小球，积分是半个小球的体积乘$\frac3{4\pi\varepsilon^3}$。
  reference: |
    （1）$\delta_\varepsilon$在小球$B_\varepsilon$里是常数，球的体积是$\frac43\pi\varepsilon^3$，所以$\iiint f\delta_\varepsilon\dd V=\frac1{|B_\varepsilon|}\iiint_{B_\varepsilon}f\,\dd V$是$f$在小球上的平均值。于是$\bigl|\iiint f\delta_\varepsilon\dd V-f(\vb 0)\bigr|\le\max_{B_\varepsilon}|f-f(\vb 0)|$，$f$在原点连续，右边趋于零。

    （2）$V\cap B_\varepsilon$是半个小球，体积$\frac23\pi\varepsilon^3$，积分是$\frac23\pi\varepsilon^3\cdot\frac3{4\pi\varepsilon^3}=\frac12$，和$\varepsilon$无关，极限是$\frac12$。原点落在区域的边界上时，结果要看边界在原点附近的形状（八分之一空间就是$\frac18$），所以积分区域的边界不经过点源。

- id: p7
  tier: thinking
  statement: |
    $\rho$是连续分布的密度，$f(\vb r)=\frac1{4\pi}\iiint\frac{\rho(\vb r')}{|\vb r-\vb r'|}\dd V'$。

    （1）形式地推导$\lap f=-\rho$。

    （2）$\rho$在单位球里是$1$、外面是$0$。验证$f=\frac{3-r^2}6$（$r\le1$）、$f=\frac1{3r}$（$r\ge1$）在球里满足$\lap f=-1$、在球外满足$\lap f=0$，并且$f$和$f'$在$r=1$处都连续。

    （3）远处$f$像总量$Q$的点源，$f\approx\frac Q{4\pi r}$。对（2）核对这一点。
  hints:
    - |
      （1）对$\vb r$求拉普拉斯算子，移进积分号，$\lap\frac1{|\vb r-\vb r'|}=-4\pi\delta^3(\vb r-\vb r')$，再对$\vb r'$用筛选性质。
    - |
      （2）只依赖$r$的函数$\lap f=f''+\frac2rf'$（见[柱坐标与球坐标下的梯度、散度和旋度](lesson:math.vector-calculus.curvilinear-coordinates)）。球里$f''+\frac2rf'=-\frac13-\frac23=-1$；球外$\lap\frac1r=0$。
    - |
      （3）总量$Q=\frac43\pi$，$\frac Q{4\pi r}=\frac1{3r}$。
  reference: |
    （1）$\lap f=\frac1{4\pi}\iiint\rho(\vb r')\lap\frac1{|\vb r-\vb r'|}\dd V'=\frac1{4\pi}\iiint\rho(\vb r')\bigl(-4\pi\delta^3(\vb r-\vb r')\bigr)\dd V'=-\rho(\vb r)$。这里把$\delta^3$当普通函数移进积分号，是形式推导；$\rho$连续时结论成立，严格的证明这里不给。

    （2）球里$f=\frac{3-r^2}6$，$f'=-\frac r3$，$f''=-\frac13$，$\lap f=-\frac13+\frac2r\bigl(-\frac r3\bigr)=-1$；球外$f=\frac1{3r}$，在原点以外调和。$r=1$处，球里$f=\frac13$、$f'=-\frac13$，球外$f=\frac13$、$f'=-\frac1{3r^2}=-\frac13$，两边接上。

    （3）$Q=\iiint\rho\,\dd V=\frac43\pi$，$\frac Q{4\pi r}=\frac1{3r}$，正是球外的$f$：从外面看，一团分布和把它全部挤到球心的点源一样。

- id: p8
  tier: thinking
  statement: |
    （1）$\lambda\ne0$，证明在积分的意义下$\delta^3(\lambda\vb r)=\frac1{|\lambda|^3}\delta^3(\vb r)$。（2）长度用米作单位时，$\delta^3(\vb r)$的单位是什么？点电荷的电荷密度（charge density）$q\,\delta^3(\vb r-\vb a)$的单位对不对？（3）一维的$\delta(\lambda x)$是$\delta(x)$的几倍？
  hints:
    - |
      （1）在$\iiint f(\vb r)\,\delta^3(\lambda\vb r)\dd V$里换元$\vb u=\lambda\vb r$，体积元（volume element）$\dd V=\frac{\dd V_u}{|\lambda|^3}$。
    - |
      （2）$\iiint\delta^3\dd V=1$没有单位，$\dd V$的单位是$\mathrm m^3$。
    - |
      （3）同样换元，一维只除一次$|\lambda|$。
  reference: |
    （1）换元$\vb u=\lambda\vb r$，$\dd V=\frac{\dd V_u}{|\lambda|^3}$（每个方向伸缩$|\lambda|$倍，雅可比行列式的绝对值是$|\lambda|^3$），$\iiint f(\vb r)\delta^3(\lambda\vb r)\dd V=\frac1{|\lambda|^3}\iiint f\bigl(\frac{\vb u}\lambda\bigr)\delta^3(\vb u)\dd V_u=\frac{f(\vb 0)}{|\lambda|^3}$，和$\frac1{|\lambda|^3}\delta^3(\vb r)$积出来一样。

    （2）$\iiint\delta^3\dd V=1$是纯数，所以$\delta^3$的单位是$\mathrm m^{-3}$。$q\,\delta^3$的单位是$\mathrm{C/m^3}$，正是电荷密度的单位。

    （3）$\delta(\lambda x)=\frac1{|\lambda|}\delta(x)$。$\delta^3(\lambda\vb r)=\delta(\lambda x)\delta(\lambda y)\delta(\lambda z)$，三个因子各贡献一个$\frac1{|\lambda|}$，和（1）一致。
