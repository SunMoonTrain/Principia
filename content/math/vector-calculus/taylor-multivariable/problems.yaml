- id: p1
  tier: easy
  statement: |
    $f(x,y)=x^3y+2y^2$。求$f$在$(1,1)$处的黑塞矩阵，按行填写四个元素。
  answer:
    type: tuple
    value: [6, 3, 3, 4]
  hints:
    - |
      黑塞矩阵是$\begin{pmatrix}f_{xx}&f_{xy}\\f_{yx}&f_{yy}\end{pmatrix}$。
    - |
      $f_x=3x^2y$，$f_y=x^3+4y$；$f_{xx}=6xy$，$f_{xy}=3x^2$，$f_{yy}=4$。
    - |
      在$(1,1)$处是$\begin{pmatrix}6&3\\3&4\end{pmatrix}$。
  solution: |
    $f_{xx}=6xy=6$，$f_{xy}=f_{yx}=3x^2=3$，$f_{yy}=4$，填 `6, 3, 3, 4`。

- id: p2
  tier: easy
  statement: |
    写出$f(x,y)=\cos(x+2y)$在$(0,0)$处的二阶泰勒多项式（Taylor polynomial）。其中$xy$项的系数是多少？
  answer:
    type: number
    value: -2
  hints:
    - |
      二次项是$\frac12\bigl(f_{xx}x^2+2f_{xy}xy+f_{yy}y^2\bigr)$，$xy$项的系数是$f_{xy}(0,0)$。
    - |
      $f_x=-\sin(x+2y)$，$f_{xy}=-2\cos(x+2y)$。
    - |
      $f_{xy}(0,0)=-2$。整个二阶泰勒多项式是$1-\frac12(x^2+4xy+4y^2)=1-\frac12(x+2y)^2$，$xy$项的系数是$-2$。
  solution: |
    二阶泰勒多项式是$1-\frac12(x+2y)^2=1-\frac12x^2-2xy-2y^2$，$xy$项的系数是$-2$。

- id: p3
  tier: medium
  statement: |
    用$f(x,y)=\ln(1+x+2y)$在$(0,0)$处的二阶泰勒多项式估计$f(0.1,0.05)$（写成小数）。
  answer:
    type: number
    value: 0.18
  tolerance: { abs: 0.0005 }
  hints:
    - |
      求$f$在$(0,0)$处的一阶、二阶偏导数。
    - |
      $f_x=\frac1{1+x+2y}=1$，$f_y=2$；$f_{xx}=-1$，$f_{xy}=-2$，$f_{yy}=-4$。二阶泰勒多项式是$x+2y-\frac12(x+2y)^2$。
    - |
      $x+2y=0.2$，估计值$0.2-\frac12\cdot0.04=0.18$；实际值$\ln1.2\approx0.1823$。
  solution: |
    二阶泰勒多项式$x+2y-\frac12(x+2y)^2$，代入得$0.2-0.02=0.18$。

- id: p4
  tier: medium
  statement: |
    下面每个函数在原点都是驻点。哪些在原点取严格局部极小（原点附近别处的函数值都比原点处大）？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $2x^2+2xy+y^2$
      - |
        $x^2+4xy+3y^2$
      - |
        $3x^2-2xy+y^2+x^3$
      - |
        $-x^2-y^2$
      - |
        $x^2+y^4$
    value: [1, 3, 5]
  hints:
    - |
      先看黑塞矩阵：$f_{xx}>0$、$f_{xx}f_{yy}-f_{xy}^2>0$时是严格局部极小。黑塞矩阵判断不了时，直接看函数值。
    - |
      选项 A：$f_{xx}=4$，$4\cdot2-2^2=4>0$；选项 B：$2\cdot6-4^2=-4<0$；选项 C：$H=\begin{pmatrix}6&-2\\-2&2\end{pmatrix}$，$12-4=8>0$；选项 D：$f_{xx}<0$；选项 E：$H=\begin{pmatrix}2&0\\0&0\end{pmatrix}$，$f_{xx}f_{yy}-f_{xy}^2=0$，判断不了。
    - |
      A、C 满足条件，是严格局部极小。B 是鞍点，D 是极大。E 的黑塞矩阵判断不了，可$(x,y)\ne(0,0)$时$x^2+y^4>0$，也是严格局部极小。所以选 A、C、E。
  solution: |
    选项 A、C 由黑塞矩阵判断是严格局部极小；选项 E 的黑塞矩阵判断不了，但原点以外$x^2+y^4>0$，也是。选项 B 是鞍点，选项 D 是极大。

- id: p5
  tier: hard
  statement: |
    设$a>0$、$ac-b^2>0$。证明存在$m>0$，使对所有$(h,k)$都有$ah^2+2bhk+ck^2\ge m(h^2+k^2)$。由此说明：驻点处$f_{xx}>0$、$f_{xx}f_{yy}-f_{xy}^2>0$时，讲解里「黑塞矩阵与极小」的条件成立。
  hints:
    - |
      先看$m=0$：$ah^2+2bhk+ck^2=a\bigl(h+\frac bak\bigr)^2+\frac{ac-b^2}ak^2\ge0$。
    - |
      对$(a-m)h^2+2bhk+(c-m)k^2$同样配方，需要$a-m>0$、$(a-m)(c-m)-b^2>0$。$m=0$时这两个数都为正。
    - |
      $a-m$和$(a-m)(c-m)-b^2$都随$m$连续变化，$m=0$时为正，所以取足够小的$m>0$它们仍为正。这时$(a-m)h^2+2bhk+(c-m)k^2\ge0$，即$ah^2+2bhk+ck^2\ge m(h^2+k^2)$。取$a=f_{xx}$、$b=f_{xy}$、$c=f_{yy}$，就是讲解里定理的条件。
  reference: |
    对$a'>0$，$a'h^2+2bhk+c'k^2=a'\Bigl(h+\frac b{a'}k\Bigr)^2+\frac{a'c'-b^2}{a'}k^2$，所以$a'c'-b^2\ge0$时它对所有$(h,k)$都不小于$0$。

    令$a'=a-m$、$c'=c-m$。$p(m)=a-m$和$q(m)=(a-m)(c-m)-b^2$都是$m$的多项式，$p(0)=a>0$，$q(0)=ac-b^2>0$，由连续性，取足够小的$m>0$仍有$p(m)>0$、$q(m)>0$（例如$m$小于$a$，并小于$q$的较小的正根）。于是$(a-m)h^2+2bhk+(c-m)k^2\ge0$，即$ah^2+2bhk+ck^2\ge m(h^2+k^2)$。

    取$a=f_{xx}$、$b=f_{xy}$、$c=f_{yy}$（在驻点处取值），左边正是$\sum_{i,j}H_{ij}h_ih_j$，所以定理的条件成立，驻点是严格局部极小点。

- id: p6
  tier: hard
  statement: |
    $f(x,y)=x^2-xy+y^2+x^3$。求它的全部驻点，并判断每个驻点是严格局部极小点、严格局部极大点还是鞍点。
  hints:
    - |
      解$f_x=2x-y+3x^2=0$、$f_y=-x+2y=0$。
    - |
      由第二个方程$y=\frac x2$，代入第一个得$x\bigl(\frac32+3x\bigr)=0$，驻点是$(0,0)$和$\bigl(-\frac12,-\frac14\bigr)$。
    - |
      $H=\begin{pmatrix}2+6x&-1\\-1&2\end{pmatrix}$。在$(0,0)$处$f_{xx}=2>0$、$f_{xx}f_{yy}-f_{xy}^2=3>0$，严格局部极小；在$\bigl(-\frac12,-\frac14\bigr)$处$H=\begin{pmatrix}-1&-1\\-1&2\end{pmatrix}$，$-2-1=-3<0$，是鞍点。
  reference: |
    $f_x=2x-y+3x^2$，$f_y=-x+2y$。由$f_y=0$得$y=\frac x2$，代入$f_x=0$得$\frac32x+3x^2=0$，$x=0$或$x=-\frac12$，驻点是$(0,0)$和$\bigl(-\frac12,-\frac14\bigr)$。

    $H=\begin{pmatrix}2+6x&-1\\-1&2\end{pmatrix}$。在$(0,0)$处是$\begin{pmatrix}2&-1\\-1&2\end{pmatrix}$，$f_{xx}=2>0$，$4-1=3>0$，严格局部极小点。在$\bigl(-\frac12,-\frac14\bigr)$处是$\begin{pmatrix}-1&-1\\-1&2\end{pmatrix}$，$f_{xx}f_{yy}-f_{xy}^2=-2-1=-3<0$：沿$x$方向二阶导数$f_{xx}=-1<0$，沿$y$方向$f_{yy}=2>0$，函数值沿一个方向变小、沿另一个方向变大，是鞍点。

- id: p7
  tier: thinking
  statement: |
    $x^2+y^4$、$x^2-y^4$、$x^2+y^3$在原点都是驻点，黑塞矩阵都是$\begin{pmatrix}2&0\\0&0\end{pmatrix}$。原点分别是什么点？为什么二阶泰勒公式判断不了？
  hints:
    - |
      沿$x$轴三个函数都是$x^2$；差别在沿$y$轴的方向上。
    - |
      二次项$x^2$沿$y$轴方向是$0$，那个方向上起作用的是$y^4$、$-y^4$、$y^3$这些高阶项。
    - |
      $x^2+y^4$：原点以外都为正，严格局部极小。$x^2-y^4$：沿$y$轴为负、沿$x$轴为正，鞍点。$x^2+y^3$：沿$y$轴$y^3$在$y>0$时为正、$y<0$时为负，原点不是极值点，所以也是鞍点；和$x^2-y^4$不同，它沿哪条直线看都不是极大。二次项沿$y$方向为零，余项$r$在那个方向上就不再「比二次项小」，符号由更高阶的项决定，二阶泰勒公式管不了。
  reference: |
    $x^2+y^4$在原点以外都大于$0$，原点是严格局部极小点。$x^2-y^4$沿$x$轴是$x^2>0$，沿$y$轴是$-y^4<0$，原点是鞍点。

    $x^2+y^3$沿$x$轴为正，沿$y$轴在$y<0$一侧为负，原点不是极值点，所以也是鞍点。和$x^2-y^4$不同，它沿哪条过原点的直线看都不是极大：沿$y$轴单调地穿过$0$；沿别的方向$(\cos\alpha,\sin\alpha)$是$t^2\cos^2\alpha+t^3\sin^3\alpha$，$t^2$那一项占上风，是极小。所以鞍点不一定「沿一个方向极大、沿另一个方向极小」。

    三者的黑塞矩阵都是$\begin{pmatrix}2&0\\0&0\end{pmatrix}$，二次项$\frac12\sum_{i,j}H_{ij}h_ih_j=h^2$，沿$y$方向$(h,k)=(0,k)$为零。讲解里的定理要求二次项至少是$m|\vb h|^2$，才能压过比$|\vb h|^2$小得多的余项；沿$y$方向二次项为零，余项就成了主角，它是正是负由更高阶的项决定。这时要看三阶、四阶项，或者直接分析函数本身。

- id: p8
  tier: thinking
  statement: |
    变分法里会遇到这样的情形：$F(y,p)$的二阶偏导数连续，固定一点$(y_0,p_0)$和一对数$(\eta,\zeta)$，令$g(\varepsilon)=F(y_0+\varepsilon\eta,\ p_0+\varepsilon\zeta)$。求$g''(0)$，并用黑塞矩阵写出来。如果$F_{yy}>0$、$F_{yy}F_{pp}-F_{yp}^2>0$（在$(y_0,p_0)$处取值），$g''(0)$的符号是什么？
  hints:
    - |
      和二阶泰勒公式的证明一样，沿方向$(\eta,\zeta)$对$\varepsilon$求两次导数。
    - |
      $g''(0)=F_{yy}\eta^2+2F_{yp}\eta\zeta+F_{pp}\zeta^2=(\eta,\zeta)\,H_F\begin{pmatrix}\eta\\\zeta\end{pmatrix}$。
    - |
      由第 5 题，条件满足时存在$m>0$，使$g''(0)\ge m(\eta^2+\zeta^2)$，所以$(\eta,\zeta)\ne(0,0)$时$g''(0)>0$：沿任何方向，$F$在$(y_0,p_0)$附近都向上弯。变分法里$\eta$、$\zeta$换成$\eta(x)$、$\eta'(x)$，再对$x$积分，就得到第二变分（second variation）。
  reference: |
    由链式法则，$g'(\varepsilon)=F_y\eta+F_p\zeta$，$g''(\varepsilon)=F_{yy}\eta^2+2F_{yp}\eta\zeta+F_{pp}\zeta^2$（偏导数在$(y_0+\varepsilon\eta,p_0+\varepsilon\zeta)$处取值，$F_{yp}=F_{py}$）。所以$g''(0)=(\eta,\zeta)H_F(y_0,p_0)\begin{pmatrix}\eta\\\zeta\end{pmatrix}$，正是二阶泰勒公式里二次项的两倍。

    $F_{yy}>0$、$F_{yy}F_{pp}-F_{yp}^2>0$时，由第 5 题，$g''(0)\ge m(\eta^2+\zeta^2)$，$(\eta,\zeta)\ne(0,0)$时为正。变分法里取$\eta=\eta(x)$、$\zeta=\eta'(x)$，被积函数$F\bigl(x,y+\varepsilon\eta,y'+\varepsilon\eta'\bigr)$对$\varepsilon$的二阶导数就是这个二次式，对$x$积分得到第二变分，见[第二变分与勒让德条件](lesson:math.calculus-of-variations.second-variation)。
