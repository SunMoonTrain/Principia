- id: p1
  tier: easy
  statement: |
    求$f(x,y)=x^2+y^2-4x+6y$的驻点，按$(x,y)$的顺序填写。
  answer:
    type: tuple
    value: [2, -3]
  hints:
    - |
      驻点满足$f_x=0$、$f_y=0$。
    - |
      $f_x=2x-4$，$f_y=2y+6$。
    - |
      $x=2$，$y=-3$，填 `2, -3`。
  solution: |
    $f_x=2x-4=0$，$f_y=2y+6=0$，驻点是$(2,-3)$。配方$f=(x-2)^2+(y+3)^2-13$，它是最小值点，最小值$-13$。

- id: p2
  tier: easy
  statement: |
    原点是$f(x,y)=x^2-3xy+y^2$的驻点。原点是什么点？
  answer:
    type: choice
    multiple: false
    options:
      - |
        严格局部极小点
      - |
        严格局部极大点
      - |
        鞍点
      - |
        用二阶导数判别法判断不了
    value: 3
  hints:
    - |
      算$f_{xx}$、$f_{yy}$、$f_{xy}$，再算$D=f_{xx}f_{yy}-f_{xy}^2$。
    - |
      $f_{xx}=2$，$f_{yy}=2$，$f_{xy}=-3$，$D=4-9=-5$。
    - |
      $D<0$，原点是鞍点，选 C。验算：沿直线$y=x$，$f=-x^2$；沿$x$轴，$f=x^2$。
  solution: |
    $D=2\cdot2-(-3)^2=-5<0$，原点是鞍点，选 C。沿$y=x$，$f=-x^2$变小；沿$x$轴，$f=x^2$变大。

- id: p3
  tier: medium
  statement: |
    $f(x,y)=x^3+y^3-3xy$。求它全部的驻点并分类，填写它的局部极小值。
  answer:
    type: number
    value: -1
  hints:
    - |
      $f_x=3x^2-3y$，$f_y=3y^2-3x$。由$f_x=0$得$y=x^2$，代入$f_y=0$。
    - |
      $x^4=x$，$x=0$或$x=1$，驻点是$(0,0)$和$(1,1)$。$f_{xx}=6x$，$f_{yy}=6y$，$f_{xy}=-3$。
    - |
      原点处$D=-9<0$，是鞍点；$(1,1)$处$D=36-9=27>0$、$f_{xx}=6>0$，是严格局部极小点，局部极小值$f(1,1)=1+1-3=-1$。
  solution: |
    驻点$(0,0)$、$(1,1)$。原点处$D=-9<0$，鞍点；$(1,1)$处$D=27>0$、$f_{xx}=6>0$，严格局部极小，极小值$-1$。

- id: p4
  tier: medium
  statement: |
    求$f(x,y)=x^2+y^2-2x$在闭圆盘$x^2+y^2\le4$上的最大值和最小值，按「最大值, 最小值」的顺序填写。
  answer:
    type: tuple
    value: [8, -1]
  hints:
    - |
      先求圆盘内部的驻点，再看边界$x^2+y^2=4$。
    - |
      内部驻点$(1,0)$，$f=-1$。边界上$x^2+y^2=4$，$f=4-2x$，$x$从$-2$到$2$。
    - |
      边界上$f$的最大值是$x=-2$时的$8$，最小值是$x=2$时的$0$。和$-1$比较：最大值$8$，最小值$-1$，填 `8, -1`。
  solution: |
    内部驻点$(1,0)$处$f=-1$；边界上$f=4-2x\in[0,8]$。所以最大值$8$（在$(-2,0)$），最小值$-1$（在$(1,0)$）。

- id: p5
  tier: hard
  statement: |
    设$f$在驻点$\vb a$附近有连续的二阶偏导数，$f_{xx}f_{yy}-f_{xy}^2<0$（在$\vb a$处取值）。证明：沿某个方向$f$在$\vb a$严格局部极小，沿另一个方向严格局部极大，所以$\vb a$是鞍点。
  hints:
    - |
      沿方向$\vb h=(h,k)$，$g(t)=f(\vb a+t\vb h)$满足$g'(0)=0$，$g''(0)=Q(h,k)=f_{xx}h^2+2f_{xy}hk+f_{yy}k^2$。
    - |
      $f_{xx}\ne0$时，比较$Q(1,0)=f_{xx}$和$Q(-f_{xy},f_{xx})$；$f_{xx}=0$时，看$Q(1,t)$。
    - |
      $Q(-f_{xy},f_{xx})=f_{xx}\bigl(f_{xx}f_{yy}-f_{xy}^2\bigr)$，和$f_{xx}$异号。$g''(0)>0$的方向上，由一元的泰勒公式$g(t)>g(0)$（$t\ne0$很小）；$g''(0)<0$的方向上$g(t)<g(0)$。
  reference: |
    沿方向$\vb h=(h,k)$，令$g(t)=f(\vb a+t\vb h)$。由链式法则，$g'(0)=f_xh+f_yk=0$（驻点），$g''(0)=Q(h,k)=f_{xx}h^2+2f_{xy}hk+f_{yy}k^2$。记$D=f_{xx}f_{yy}-f_{xy}^2<0$。

    $f_{xx}\ne0$时：$Q(1,0)=f_{xx}$；$Q(-f_{xy},f_{xx})=f_{xx}f_{xy}^2-2f_{xy}^2f_{xx}+f_{yy}f_{xx}^2=f_{xx}D$，和$f_{xx}$异号。$f_{xx}=0$时：$D=-f_{xy}^2<0$，$f_{xy}\ne0$，$Q(1,t)=2f_{xy}t+f_{yy}t^2$，$|t|$很小时符号和$f_{xy}t$相同，取$t$为正、为负就得到两个符号相反的方向。

    沿$Q(\vb h)>0$的方向：$g$在$0$附近二阶连续可导，由一元的泰勒公式$g(t)=g(0)+\frac12g''(\xi)t^2$，$\xi$在$0$和$t$之间，$t$很小时$g''(\xi)>0$，所以$g(t)>g(0)$，$f$沿这条直线在$\vb a$严格局部极小。沿$Q<0$的方向同理严格局部极大。$\vb a$附近既有比$f(\vb a)$大的值，也有比它小的值，不是极值点，所以是鞍点。

- id: p6
  tier: hard
  statement: |
    用直线$y=ax+b$拟合三个数据点$(0,1)$、$(1,3)$、$(2,4)$：求使误差平方和$S(a,b)=\sum_i(y_i-ax_i-b)^2$最小的$a$、$b$，并用二阶导数判别法说明它确实是极小点。
  hints:
    - |
      $S$是$a$、$b$的二次函数。令$S_a=0$、$S_b=0$。
    - |
      $S_a=-2\sum x_i(y_i-ax_i-b)$，$S_b=-2\sum(y_i-ax_i-b)$。代入数据：$\sum x_i=3$，$\sum x_i^2=5$，$\sum y_i=8$，$\sum x_iy_i=11$，得$5a+3b=11$、$3a+3b=8$。
    - |
      $a=\frac32$，$b=\frac76$。$S_{aa}=2\sum x_i^2=10$，$S_{bb}=2\cdot3=6$，$S_{ab}=2\sum x_i=6$，$D=60-36=24>0$、$S_{aa}>0$，是严格局部极小点。
  reference: |
    $S(a,b)=(1-b)^2+(3-a-b)^2+(4-2a-b)^2$。$S_a=-2(3-a-b)-4(4-2a-b)=0$即$5a+3b=11$；$S_b=-2(1-b)-2(3-a-b)-2(4-2a-b)=0$即$3a+3b=8$。相减得$2a=3$，$a=\frac32$，$b=\frac76$。

    $S_{aa}=10$，$S_{bb}=6$，$S_{ab}=6$，$D=24>0$且$S_{aa}>0$，所以$\bigl(\frac32,\frac76\bigr)$是严格局部极小点；$S$是二次函数，二阶偏导数是常数，这个判断在整个平面上都成立，它就是最小值点，最小的误差平方和是$\frac16$。

    这正是线性代数里[最小二乘法](lesson:math.linear-algebra.least-squares)的法方程：两种办法从「误差平方和最小」出发，得到同一组方程。

- id: p7
  tier: thinking
  statement: |
    一元的连续可导函数（continuously differentiable function）在区间上只有一个驻点、又是极小点时，它就是最小值点。二元时还对吗？看$f(x,y)=x^2+y^2(1-x)^3$：求它的驻点并分类，再算$f(4,1)$。
  hints:
    - |
      $f_y=2y(1-x)^3=0$给出$y=0$或$x=1$。分别代入$f_x=2x-3y^2(1-x)^2=0$。
    - |
      $x=1$时$f_x=2\ne0$；$y=0$时$x=0$。唯一的驻点是原点，$f_{xx}=2$、$f_{yy}=2$、$f_{xy}=0$，$D=4>0$，是严格局部极小点，$f(0,0)=0$。
    - |
      $f(4,1)=16+(-27)=-11<0$，比原点的值小。原点是唯一的驻点、是局部极小点，却不是最小值点：$x$很大时$(1-x)^3$很负，$f$可以任意小。
  reference: |
    $f_x=2x-3y^2(1-x)^2$，$f_y=2y(1-x)^3$。$f_y=0$时$y=0$或$x=1$；$x=1$时$f_x=2\ne0$，$y=0$时$f_x=2x=0$，所以唯一的驻点是$(0,0)$。那里$f_{xx}=2$、$f_{yy}=2(1-x)^3=2$、$f_{xy}=-6y(1-x)^2=0$，$D=4>0$，是严格局部极小点。可$f(4,1)=16-27=-11<0=f(0,0)$，$y=1$时$x\to+\infty$还有$f\to-\infty$，所以原点不是最小值点。

    一元时的论证是：如果别处还有更小的值，在极小点和那一点之间就会有一个局部极大点，也就是另一个驻点。二元时，从原点「下山」到$(4,1)$可以绕开所有的山头，不必翻过一个驻点，这个论证就失效了。所以多元函数求最值，不能只看驻点是不是唯一，要按讲解的办法在有界闭区域上比较，或者另外说明函数在远处变大。

- id: p8
  tier: thinking
  statement: |
    原点是$f(x,y)=x^2+3xy+y^2$的鞍点。等值线$f=0$在原点附近是什么样子？为什么鞍点处等值线会交叉，而在一阶偏导数不全为零的点，等值线不会交叉？
  hints:
    - |
      $x^2+3xy+y^2$可以分解成两个一次式的乘积：令$y=mx$，$1+3m+m^2=0$。
    - |
      $m=\frac{-3\pm\sqrt5}2$，所以$f=0$是过原点的两条直线$y=m_1x$、$y=m_2x$，在原点交叉。
    - |
      一阶偏导数不全为零时，附近的等值线是一条光滑曲线，有确定的切线方向（和偏导数组成的向量垂直）。鞍点处两个一阶偏导数都为零，没有这个限制，等值线可以从几个方向穿过它。
  reference: |
    $D=4-9<0$，原点是鞍点。$x^2+3xy+y^2=(y-m_1x)(y-m_2x)$，$m_{1,2}=\frac{-3\pm\sqrt5}2$，所以$f=0$是两条过原点的直线，在原点交叉；它们把平面分成四块，$f$在相对的两块为正、另两块为负，这正是「沿一些方向变大、沿另一些方向变小」。

    等值线$f=c$过点$\vb p$、$\vb p$处一阶偏导数不全为零时，在$\vb p$附近它是一条光滑的曲线，曲线的速度和$(f_x,f_y)$垂直，只有一个切线方向，不会交叉（这要用到[反函数定理与隐函数定理](lesson:math.vector-calculus.inverse-implicit)里的隐函数定理）。鞍点处$f_x=f_y=0$，这条理由不成立；一般的鞍点，若$D<0$，经过它的等值线由两条曲线在那里交叉组成，切线方向就是二次项$Q=0$的两个方向。
