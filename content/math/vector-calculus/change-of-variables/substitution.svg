  <text x="230" y="237" text-anchor="middle" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">2</text>
  <text x="42" y="134" text-anchor="end" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">1</text>
