  <text x="568" y="151" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">(1.5, 0.5)</text>
  <text x="456" y="269" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">(0.5, −0.5)</text>
