  <text x="42" y="93.5" text-anchor="end" font-size="14" fill="currentColor"><tspan font-style="italic">v</tspan></text>
  <path d="M 50 220 L 230 220 L 230 130 L 50 130 Z" style="stroke: var(--accent, #2563eb); fill: var(--accent, #2563eb)" stroke-width="1.6" fill-opacity="0.14" />
