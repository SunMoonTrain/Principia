  <text x="387" y="61" text-anchor="end" font-size="14" fill="currentColor"><tspan font-style="italic">y</tspan></text>
  <path d="M 395 200 L 505 90 L 560 145 L 450 255 Z" style="stroke: var(--good, #0f8a5f); fill: var(--good, #0f8a5f)" stroke-width="1.6" fill-opacity="0.14" />
