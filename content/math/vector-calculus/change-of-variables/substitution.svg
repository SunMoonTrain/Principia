  <text x="310" y="142" text-anchor="middle" fill="currentColor"><tspan font-style="italic">y</tspan> = (<tspan font-style="italic">u</tspan> − <tspan font-style="italic">v</tspan>)/2</text>
  <text x="320" y="306" text-anchor="middle" fill="currentColor">左边一个小格的面积是 0.25，变到右边，面积缩小一半</text>
  <text x="320" y="330" text-anchor="middle" fill="currentColor">雅可比行列式是 −1/2，取绝对值，面积元 d<tspan font-style="italic">x</tspan> d<tspan font-style="italic">y</tspan> = (1/2) d<tspan font-style="italic">u</tspan> d<tspan font-style="italic">v</tspan></text>
</svg>
