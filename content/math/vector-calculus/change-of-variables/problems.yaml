- id: p1
  tier: easy
  statement: |
    $x=2u+v$，$y=u-3v$。求雅可比行列式$\frac{\partial(x,y)}{\partial(u,v)}$。
  answer:
    type: number
    value: -7
  hints:
    - |
      $\frac{\partial(x,y)}{\partial(u,v)}=\det\begin{pmatrix}x_u&x_v\\y_u&y_v\end{pmatrix}$。
    - |
      $x_u=2$，$x_v=1$，$y_u=1$，$y_v=-3$。
    - |
      $2\cdot(-3)-1\cdot1=-7$。
  solution: |
    $\det\begin{pmatrix}2&1\\1&-3\end{pmatrix}=-6-1=-7$。

- id: p2
  tier: easy
  statement: |
    用换元$x=3u$、$y=2v$求椭圆$\frac{x^2}9+\frac{y^2}4\le1$的面积。
  answer:
    type: number
    value: 6*pi
  hints:
    - |
      换元后区域变成单位圆盘$u^2+v^2\le1$。
    - |
      $\frac{\partial(x,y)}{\partial(u,v)}=\det\begin{pmatrix}3&0\\0&2\end{pmatrix}=6$。
    - |
      面积$=\iint_{u^2+v^2\le1}6\,\dd u\dd v=6\pi\approx18.85$。
  solution: |
    $\frac{\partial(x,y)}{\partial(u,v)}=6$，面积$=6\cdot\pi=6\pi$。一般地，半轴为$a$、$b$的椭圆面积是$\pi ab$。

- id: p3
  tier: medium
  statement: |
    $D$是第一象限里由曲线$xy=1$、$xy=2$和直线$y=x$、$y=3x$围成的区域。用换元$u=xy$、$v=\frac yx$求$D$的面积。
  answer:
    type: number
    value: ln(3)/2
  hints:
    - |
      新区域是矩形$1\le u\le2$、$1\le v\le3$。手里只有$u$、$v$用$x$、$y$表示的式子，先算$\frac{\partial(u,v)}{\partial(x,y)}$。
    - |
      $\frac{\partial(u,v)}{\partial(x,y)}=\det\begin{pmatrix}y&x\\-\frac y{x^2}&\frac1x\end{pmatrix}=\frac yx+\frac yx=2v$，所以$\left|\frac{\partial(x,y)}{\partial(u,v)}\right|=\frac1{2v}$。
    - |
      面积$=\int_1^2\int_1^3\frac1{2v}\dd v\dd u=1\cdot\frac12\ln3=\frac{\ln3}2\approx0.549$。
  solution: |
    $\frac{\partial(u,v)}{\partial(x,y)}=2v$，面积$=\int_1^2\int_1^3\frac{\dd v}{2v}\dd u=\frac{\ln3}2\approx0.549$。

- id: p4
  tier: medium
  statement: |
    $D$是三角形$x\ge0$、$y\ge0$、$x+y\le1$。求$\iint_De^{\frac{x-y}{x+y}}\,\dd A$（被积函数在原点没有定义，但在原点附近有界，不影响积分）。
  answer:
    type: number
    value: (e - exp(-1))/4
  hints:
    - |
      令$u=x-y$、$v=x+y$；三角形变成$0\le v\le1$、$-v\le u\le v$。
    - |
      $\frac{\partial(u,v)}{\partial(x,y)}=\det\begin{pmatrix}1&-1\\1&1\end{pmatrix}=2$，所以$\left|\frac{\partial(x,y)}{\partial(u,v)}\right|=\frac12$。
    - |
      $\int_0^1\int_{-v}^ve^{u/v}\cdot\frac12\dd u\dd v=\int_0^1\frac v2\bigl(e-e^{-1}\bigr)\dd v=\frac{e-e^{-1}}4\approx0.588$。
  solution: |
    换元$u=x-y$、$v=x+y$，$|J|=\frac12$：$\int_0^1\int_{-v}^v\frac12e^{u/v}\dd u\dd v=\int_0^1\frac{v(e-e^{-1})}2\dd v=\frac{e-e^{-1}}4\approx0.588$。

- id: p5
  tier: hard
  statement: |
    证明椭球$\frac{x^2}{a^2}+\frac{y^2}{b^2}+\frac{z^2}{c^2}\le1$的体积是$\frac43\pi abc$。
  hints:
    - |
      令$x=au$、$y=bv$、$z=cw$，椭球变成单位球$u^2+v^2+w^2\le1$。
    - |
      $\frac{\partial(x,y,z)}{\partial(u,v,w)}=\det\begin{pmatrix}a&0&0\\0&b&0\\0&0&c\end{pmatrix}=abc$。
    - |
      $V=\iiint_{\text{单位球}}abc\,\dd u\dd v\dd w=abc\cdot\frac43\pi$。
  reference: |
    令$x=au$、$y=bv$、$z=cw$（$a,b,c>0$），它把单位球$u^2+v^2+w^2\le1$一对一地变成椭球。雅可比矩阵是对角矩阵，行列式$abc$，所以$V=\iiint_{u^2+v^2+w^2\le1}abc\,\dd u\dd v\dd w=abc\cdot\frac43\pi$。

    几何上，这个变换沿三个坐标方向分别拉伸$a$、$b$、$c$倍，体积处处放大$abc$倍，单位球的体积$\frac43\pi$就变成$\frac43\pi abc$。也可以把它和球坐标合起来，$x=ar\sin\theta\cos\varphi$等，雅可比行列式是$abc\,r^2\sin\theta$，结果一样。

- id: p6
  tier: hard
  statement: |
    证明$\iint_{\R^2}e^{-(x^2+xy+y^2)}\dd A=\frac{2\pi}{\sqrt3}$。提示：先配方，把$x^2+xy+y^2$写成两个平方之和。
  hints:
    - |
      $x^2+xy+y^2=\Bigl(x+\frac y2\Bigr)^2+\frac34y^2$。令$u=x+\frac y2$、$v=\frac{\sqrt3}2y$，指数变成$-(u^2+v^2)$。
    - |
      $\frac{\partial(u,v)}{\partial(x,y)}=\det\begin{pmatrix}1&\frac12\\0&\frac{\sqrt3}2\end{pmatrix}=\frac{\sqrt3}2$，所以$\left|\frac{\partial(x,y)}{\partial(u,v)}\right|=\frac2{\sqrt3}$。
    - |
      $\iint_{\R^2}e^{-(u^2+v^2)}\dd u\dd v=\pi$，乘以$\frac2{\sqrt3}$得$\frac{2\pi}{\sqrt3}\approx3.628$。
  reference: |
    配方：$x^2+xy+y^2=\Bigl(x+\frac y2\Bigr)^2+\frac34y^2$。令$u=x+\frac y2$、$v=\frac{\sqrt3}2y$，这是平面到平面的一对一线性变换，$\frac{\partial(u,v)}{\partial(x,y)}=\frac{\sqrt3}2$，所以$\left|\frac{\partial(x,y)}{\partial(u,v)}\right|=\frac2{\sqrt3}$。

    被积函数为正，整个平面上的积分可以用越来越大的区域逼近，换元后$\iint_{\R^2}e^{-(x^2+xy+y^2)}\dd A=\frac2{\sqrt3}\iint_{\R^2}e^{-(u^2+v^2)}\dd u\dd v=\frac2{\sqrt3}\cdot\pi=\frac{2\pi}{\sqrt3}$，其中$\iint_{\R^2}e^{-(u^2+v^2)}\dd u\dd v=\pi$由[高斯积分](lesson:math.vector-calculus.polar-double-integrals)得到。

    指数是一个正定的二次型，换元把它化成平方和，代价是乘上雅可比行列式。概率论里多元正态分布的归一化常数就是这样算出来的，二次型的矩阵是$\begin{pmatrix}1&\frac12\\\frac12&1\end{pmatrix}$，行列式$\frac34$，结果$\frac\pi{\sqrt{3/4}}$正是$\frac{2\pi}{\sqrt3}$。

- id: p7
  tier: thinking
  statement: |
    用$x=r\cos\theta$、$y=r\sin\theta$算半径为$1$的圆盘的面积，如果让$\theta$从$0$积到$4\pi$，会得到什么？换元公式的哪个条件被破坏了？再看换元$x=r\sin\theta$、$y=r\cos\theta$：它的雅可比行列式是多少，公式里为什么要取绝对值？
  hints:
    - |
      $\int_0^{4\pi}\int_0^1r\,\dd r\dd\theta=2\pi$，是面积的两倍。
    - |
      $\theta$走两圈，同一块区域被覆盖了两次，$T$不是一对一的。
    - |
      $x=r\sin\theta$、$y=r\cos\theta$时$\frac{\partial(x,y)}{\partial(r,\theta)}=\sin\theta\cdot(-r\sin\theta)-r\cos\theta\cdot\cos\theta=-r$。它把小块的朝向翻了过来，面积仍是$r\,\dd r\dd\theta$，所以要取绝对值。
  reference: |
    $\int_0^{4\pi}\int_0^1r\,\dd r\dd\theta=4\pi\cdot\frac12=2\pi$，是圆盘面积$\pi$的两倍。换元公式要求$T$把$E$一对一地变成$D$；$\theta$跑两圈时每一点都被覆盖两次，右边的积分把$D$算了两遍。

    $x=r\sin\theta$、$y=r\cos\theta$是从$y$轴正方向起、顺时针量角，$\frac{\partial(x,y)}{\partial(r,\theta)}=\det\begin{pmatrix}\sin\theta&r\cos\theta\\\cos\theta&-r\sin\theta\end{pmatrix}=-r$。负号说明从$(r,\theta)$到$(x,y)$的小块被翻了个面（朝向反了），面积仍是$r\,\Delta r\Delta\theta$。不取绝对值，圆盘的面积会算成$-\pi$。所以公式里用的是$\left|\frac{\partial(x,y)}{\partial(u,v)}\right|$：积分要的是面积，不是有向面积。

- id: p8
  tier: thinking
  statement: |
    线性代数里，线性变换把每一块区域的面积都放大同样的$|\det A|$倍。非线性的$T(u,v)=(u^2,v)$把矩形$[1,2]\times[0,1]$变成什么区域？它在各处把面积放大多少倍？用换元公式算出像的面积，和直接看出来的比较。
  hints:
    - |
      $x=u^2$从$1$变到$4$，$y=v$从$0$变到$1$，像是矩形$[1,4]\times[0,1]$，面积是$3$。
    - |
      $\frac{\partial(x,y)}{\partial(u,v)}=\det\begin{pmatrix}2u&0\\0&1\end{pmatrix}=2u$：靠近$u=1$的地方放大$2$倍，靠近$u=2$的地方放大$4$倍。
    - |
      $\int_0^1\int_1^22u\,\dd u\dd v=4-1=3$，和直接看出来的一致。放大倍数逐点不同，要把每一小块的放大倍数积起来。
  reference: |
    $T(u,v)=(u^2,v)$把$[1,2]\times[0,1]$一对一地变成$[1,4]\times[0,1]$，面积$3$。雅可比行列式是$2u$，在$u=1$附近面积放大$2$倍，在$u=2$附近放大$4$倍；原来的面积是$1$，像的面积却是$3$，介于$2$和$4$之间。

    换元公式：像的面积$=\iint_E|J|\,\dd u\dd v=\int_0^1\int_1^22u\,\dd u\dd v=3$。线性变换的雅可比矩阵处处是同一个$A$，放大倍数处处是$|\det A|$，所以像的面积等于原面积乘$|\det A|$；非线性的变换只在每一点附近像线性变换，放大倍数逐点变化，整体的放大要把局部的倍数积起来。这正是雅可比行列式的意思：局部的、逐点的$|\det|$。
