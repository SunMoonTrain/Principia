- id: p1
  tier: easy
  statement: |
    在约束$x^2+y^2=2$下，求$f=x+y$的最大值。
  answer:
    type: number
    value: 2
  hints:
    - |
      $\nabla f=(1,1)$，$\nabla g=(2x,2y)$，列出$1=2\lambda x$、$1=2\lambda y$、$x^2+y^2=2$。
    - |
      由前两式$x=y=\frac1{2\lambda}$，代入约束得$x=y=\pm1$。
    - |
      $(1,1)$处$f=2$，$(-1,-1)$处$f=-2$。圆有界、闭，最大值一定取到，是$2$。
  solution: |
    $x=y=\pm1$，$f(1,1)=2$，$f(-1,-1)=-2$，最大值$2$。

- id: p2
  tier: easy
  statement: |
    在约束$x+y=4$下，求$f=x^2+y^2$的最小值。
  answer:
    type: number
    value: 8
  hints:
    - |
      $(2x,2y)=\lambda(1,1)$，所以$x=y$。
    - |
      代入$x+y=4$得$x=y=2$。
    - |
      $f=4+4=8$。直线上离原点越远$f$越大，所以这是最小值。
  solution: |
    $x=y=2$，最小值$f=8$，就是原点到直线$x+y=4$的距离$2\sqrt2$的平方。

- id: p3
  tier: medium
  statement: |
    长方体的长、宽、高之和是$12$。体积最大是多少？
  answer:
    type: number
    value: 64
  hints:
    - |
      求$f=xyz$在$x+y+z=12$（$x,y,z\ge0$）下的最大值。
    - |
      $(yz,xz,xy)=\lambda(1,1,1)$，所以$yz=xz=xy$；$x,y,z>0$时得$x=y=z$。
    - |
      $x=y=z=4$，体积$64$；某条棱为$0$时体积为$0$，所以最大值是$64$。
  solution: |
    $yz=xz=xy=\lambda$，得$x=y=z=4$，最大体积$4^3=64$，是正方体。

- id: p4
  tier: medium
  statement: |
    求$f=xy$在椭圆$x^2+4y^2=8$上的最大值和最小值，按「最大值, 最小值」的顺序填写。
  answer:
    type: tuple
    value: [2, -2]
  hints:
    - |
      $(y,x)=\lambda(2x,8y)$，即$y=2\lambda x$、$x=8\lambda y$。
    - |
      两式相乘消去，$x\ne0$时得$\lambda^2=\frac1{16}$，$y=\pm\frac x2$；代入约束$2x^2=8$，$x=\pm2$。
    - |
      四个候选点$(2,1)$、$(-2,-1)$处$f=2$，$(2,-1)$、$(-2,1)$处$f=-2$。椭圆有界、闭，最大值$2$，最小值$-2$，填 `2, -2`。
  solution: |
    候选点$(\pm2,\pm1)$，$f=\pm2$；$x=0$时由约束$y=\pm\sqrt2$，但那里$\nabla f=(\pm\sqrt2,0)$和$\nabla g=(0,\pm8\sqrt2)$不平行，不是候选点。最大值$2$，最小值$-2$。

- id: p5
  tier: hard
  statement: |
    圆柱面$x^2+y^2=1$和平面$x+y+z=1$交成一个椭圆。求这个椭圆上$z$的最大值和最小值。
  hints:
    - |
      两个约束$g_1=x^2+y^2=1$、$g_2=x+y+z=1$，$\nabla f=\lambda_1\nabla g_1+\lambda_2\nabla g_2$，$f=z$。
    - |
      $(0,0,1)=\lambda_1(2x,2y,0)+\lambda_2(1,1,1)$：由第三个分量$\lambda_2=1$，于是$2\lambda_1x=-1$、$2\lambda_1y=-1$，$x=y$。
    - |
      $x=y=\pm\frac1{\sqrt2}$，$z=1-x-y=1\mp\sqrt2$。最大值$1+\sqrt2$，最小值$1-\sqrt2$。
  reference: |
    $\nabla g_1=(2x,2y,0)$，$\nabla g_2=(1,1,1)$，在椭圆上不平行（前者的第三个分量是$0$、自身不为零）。由$\nabla f=\lambda_1\nabla g_1+\lambda_2\nabla g_2$：第三个分量给出$\lambda_2=1$，前两个给出$2\lambda_1x=-1=2\lambda_1y$，所以$x=y$，再由$x^2+y^2=1$得$x=y=\pm\frac1{\sqrt2}$，$z=1\mp\sqrt2$。

    椭圆有界、闭，$z$的最值一定取到，所以最大值$1+\sqrt2$（在$x=y=-\frac1{\sqrt2}$），最小值$1-\sqrt2$。验算：令$x=\cos t$、$y=\sin t$，$z=1-(\cos t+\sin t)$，而$\cos t+\sin t$的取值范围是$[-\sqrt2,\sqrt2]$，一致。

- id: p6
  tier: hard
  statement: |
    用拉格朗日乘数法证明：正数$x$、$y$、$z$满足$x+y+z=s$时，$xyz\le\Bigl(\frac s3\Bigr)^3$，从而$\sqrt[3]{xyz}\le\frac{x+y+z}3$。
  hints:
    - |
      求$f=xyz$在$x+y+z=s$、$x,y,z\ge0$上的最大值。这个区域是三角形，有界、闭，最大值一定取到。
    - |
      边上（某个变量为$0$）$f=0$；内部由$(yz,xz,xy)=\lambda(1,1,1)$得$x=y=z=\frac s3$。
    - |
      所以最大值$\Bigl(\frac s3\Bigr)^3$，$xyz\le\Bigl(\frac{x+y+z}3\Bigr)^3$，两边开立方。
  reference: |
    在三角形$\{x+y+z=s,\ x,y,z\ge0\}$上考虑$f=xyz$。它有界、闭，$f$连续，最大值一定取到。边上至少一个变量为$0$，$f=0$；最大值是正的，所以在内部取到，那里是条件极值，满足$\nabla f=\lambda\nabla g$，$\nabla g=(1,1,1)\ne\vb0$。

    $(yz,xz,xy)=\lambda(1,1,1)$，$x,y,z>0$，由$yz=xz$得$x=y$，同理$y=z$，所以$x=y=z=\frac s3$，最大值$\Bigl(\frac s3\Bigr)^3$。于是对正数有$xyz\le\Bigl(\frac{x+y+z}3\Bigr)^3$，即三个数的几何平均不超过算术平均，等号当且仅当三数相等。

- id: p7
  tier: thinking
  statement: |
    在曲线$y^2=x^3$上求$f=x$的最小值。直接看曲线，最小值在哪里？用拉格朗日乘数法列方程，能找到它吗？为什么？
  hints:
    - |
      曲线上$x=y^{2/3}\ge0$，最小值显然是$0$，在原点取到。
    - |
      $g=y^2-x^3$，$\nabla g=(-3x^2,2y)$；$\nabla f=(1,0)=\lambda(-3x^2,2y)$要求$2\lambda y=0$、$-3\lambda x^2=1$。
    - |
      $\lambda\ne0$，所以$y=0$，再由约束$x=0$，这时$-3\lambda x^2=0\ne1$，方程组无解。原点处$\nabla g=\vb0$，不满足定理的条件，乘数法漏掉了它。
  reference: |
    曲线$y^2=x^3$上$x\ge0$，原点处$x=0$，所以最小值是$0$，在原点取到。

    方程组$1=-3\lambda x^2$、$0=2\lambda y$、$y^2=x^3$：第一式说$\lambda\ne0$，第二式得$y=0$，约束得$x=0$，代回第一式得$1=0$，矛盾，无解。乘数法一个候选点也没给出，最小值点却存在。

    原因在定理的条件$\nabla g(P)\ne\vb0$：原点处$\nabla g=(0,0)$，曲线在那里有一个尖点（cusp），不是光滑曲线，证明里「约束曲线是一条有非零速度的光滑曲线」那一步不成立。所以用乘数法时，要把$\nabla g=\vb0$的点单独拿出来检查。

- id: p8
  tier: thinking
  statement: |
    把例 1 的约束改成$x+2y=c$（$c>0$）。最大值$M(c)$是多少？算出$\dv Mc$，和乘子$\lambda$比较。乘子有什么意义？
  hints:
    - |
      和例 1 一样，$y=\lambda$、$x=2\lambda$，代入约束得$\lambda=\frac c4$。
    - |
      最大值点$\Bigl(\frac c2,\frac c4\Bigr)$，$M(c)=\frac{c^2}8$，$\dv Mc=\frac c4$。
    - |
      $\dv Mc=\lambda$：乘子是约束的值每放宽一个单位，最大值增加多少。$c=6$时$\lambda=1.5$，和例 1 一致。
  reference: |
    $y=\lambda$、$x=2\lambda$，$4\lambda=c$，$\lambda=\frac c4$，最大值点$\Bigl(\frac c2,\frac c4\Bigr)$，$M(c)=\frac{c^2}8$。$\dv Mc=\frac c4=\lambda$。

    这不是巧合。一般地，设最大值点$P(c)$随$c$可导，$M(c)=f\bigl(P(c)\bigr)$，由链式法则$\dv Mc=\nabla f\cdot P'(c)=\lambda\nabla g\cdot P'(c)$；又$g\bigl(P(c)\bigr)=c$，求导得$\nabla g\cdot P'(c)=1$，所以$\dv Mc=\lambda$。乘子度量约束的「松紧」：约束的值增加$\Delta c$，最优值约增加$\lambda\Delta c$。经济学里把它叫影子价格（shadow price）；力学里乘子给出约束力，见[拉格朗日乘子与约束力](lesson:physics.analytical-mechanics.constraint-forces)。
