- id: p1
  tier: easy
  statement: |
    $f(x,y)=\sqrt{25-x^2-y^2}$的等值线$f=4$是以原点为圆心的圆。求它的半径。
  answer:
    type: number
    value: 3
  hints:
    - |
      等值线$f=4$就是方程$\sqrt{25-x^2-y^2}=4$的解集。
    - |
      两边平方，整理成$x^2+y^2=r^2$的样子。
    - |
      $25-x^2-y^2=16$，即$x^2+y^2=9$，半径是$3$。
  solution: |
    平方得$x^2+y^2=25-16=9$，半径是$3$。

- id: p2
  tier: easy
  statement: |
    $f(x,y)=x^2+2y$。下面哪些点和$(1,2)$在同一条等值线上？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $(-1,2)$
      - |
        $(2,1)$
      - |
        $(3,-2)$
      - |
        $(0,5)$
      - |
        $(\sqrt5,0)$
    value: [1, 3, 5]
  hints:
    - |
      同一条等值线上的点，函数值相同。先算$f(1,2)$。
    - |
      $f(1,2)=5$。逐个算各选项的函数值，看是不是$5$。
    - |
      选项 A：$1+4=5$；选项 B：$4+2=6$；选项 C：$9-4=5$；选项 D：$0+10=10$；选项 E：$5+0=5$。所以 A、C、E 和$(1,2)$都在等值线$f=5$上。
  solution: |
    $f(1,2)=5$。选项 A、C、E 处的函数值也是$5$，选项 B、D 处分别是$6$、$10$。

- id: p3
  tier: medium
  statement: |
    $f(x,y)=\frac{x^2+y^2}{x}$（$x\ne0$）。等值线$f=6$是一个去掉了原点的圆。按顺序填写圆心的横坐标、纵坐标和半径。
  answer:
    type: tuple
    value: [3, 0, 3]
  hints:
    - |
      把$f=6$去分母，得到关于$x$、$y$的二次方程。
    - |
      $x^2+y^2=6x$，再对$x$配方。
    - |
      $(x-3)^2+y^2=9$，圆心$(3,0)$，半径$3$。原点满足这个方程，却不在定义域里，所以要去掉。
  solution: |
    $x^2+y^2=6x$，即$(x-3)^2+y^2=9$，填 `3, 0, 3`。

- id: p4
  tier: medium
  statement: |
    三元函数$f(x,y,z)=x^2+y^2+z^2-4z$的等值面$f=12$是一个球面。求它的半径。
  answer:
    type: number
    value: 4
  hints:
    - |
      对$z$配方，把等值面的方程写成球面的标准形式。
    - |
      $z^2-4z=(z-2)^2-4$。
    - |
      $x^2+y^2+(z-2)^2=12+4=16$，球心$(0,0,2)$，半径$4$。
  solution: |
    配方得$x^2+y^2+(z-2)^2=16$，半径是$4$。

- id: p5
  tier: hard
  statement: |
    $f(x,y)=x^2-2x+y^2+4y$。证明$f$的每条等值线都是以同一点为圆心的圆，或者只是这一个点，或者是空集；求出这个点和$f$的最小值，并说明$c$取什么值时，等值线$f=c$分别是空集、一个点、一个圆。
  hints:
    - |
      对$x$、$y$分别配方。
    - |
      $f(x,y)=(x-1)^2+(y+2)^2-5$。
    - |
      $f=c$等价于$(x-1)^2+(y+2)^2=c+5$。$c<-5$时右边为负，等值线是空集；$c=-5$时只有点$(1,-2)$；$c>-5$时是圆心为$(1,-2)$、半径为$\sqrt{c+5}$的圆。左边总不小于$0$，所以$f\ge-5$，最小值$-5$在$(1,-2)$处取到。
  reference: |
    配方：$f(x,y)=(x-1)^2+(y+2)^2-5$。等值线$f=c$就是$(x-1)^2+(y+2)^2=c+5$。

    $c<-5$时右边为负，没有点满足，是空集；$c=-5$时只有$(1,-2)$；$c>-5$时是圆心为$(1,-2)$、半径为$\sqrt{c+5}$的圆，这些圆的圆心都是$(1,-2)$。

    因为$(x-1)^2+(y+2)^2\ge0$，处处有$f\ge-5$，等号只在$(1,-2)$处成立，所以$f$的最小值是$-5$。

- id: p6
  tier: hard
  statement: |
    $f(x,y)=\sqrt{x^2+y^2}$，$g(x,y)=x^2+y^2$。分别求出它们$c=1,2,3,4$的等值线，比较相邻两圈的间距。从图像上看，间距的这种差别说明了什么？
  hints:
    - |
      两个函数的等值线都是以原点为圆心的圆，分别求出半径。
    - |
      $f=c$的半径是$c$，$g=c$的半径是$\sqrt c$。
    - |
      $f$的四圈半径是$1,2,3,4$，间距都是$1$；$g$的是$1$、$\sqrt2\approx1.41$、$\sqrt3\approx1.73$、$2$，间距约为$0.41$、$0.32$、$0.27$，越来越小。$f$的图像是圆锥面，沿任何一条从原点出发的射线，高度和到原点的距离$r$相等，每走一步升高得一样多，所以等值线等间距；$g$的图像$z=r^2$越往外越陡，函数值每增加$1$，需要走的距离越来越短，等值线越来越密。
  reference: |
    $f=c$即$x^2+y^2=c^2$，半径为$c$：四圈半径$1,2,3,4$，相邻间距都是$1$。$g=c$即$x^2+y^2=c$，半径为$\sqrt c$：四圈半径约$1$、$1.41$、$1.73$、$2$，间距约$0.41$、$0.32$、$0.27$。

    记$r=\sqrt{x^2+y^2}$。沿任何一条从原点出发的射线，$f=r$，图像是倾斜程度处处一样的圆锥面，高度每增加$1$要走同样远，所以等值线等间距。$g=r^2$，沿射线的变化率是$2r$，越往外越大，图像越来越陡，高度每增加$1$要走的路越来越短，所以等值线越来越密。等值线等间隔地取$c$时，间距小的地方就是图像陡的地方。

- id: p7
  tier: thinking
  statement: |
    地图上，陡崖处的几条等高线常常画得几乎重合，甚至挤成一条线。这和「不同的等值线没有公共点」矛盾吗？如果山体有一处向外伸出的悬崖，上面的岩石悬在下面的空中，海拔还能看成两个水平坐标的函数吗？
  hints:
    - |
      「不同的等值线没有公共点」靠的是：一个水平位置只有一个海拔。陡崖上的情形是怎样的？
    - |
      坡越陡，相邻两条等高线在水平方向上离得越近；崖壁完全竖直时，同一个水平位置对应一整段高度。悬崖处，从上面往下看，同一个水平位置有几个地面？
    - |
      不矛盾。很陡的坡上，等高线在水平方向上挨得很近，但仍是不同的点，地图比例尺小，画出来就像重合了。崖壁完全竖直时，同一个水平位置上有一整段高度，这一处的地面已经不是两个坐标的函数的图像，等高线在投影上真的重合。悬崖处，同一条竖直线和地面交于好几点（悬崖顶、悬崖下面的岩石底面、谷底），海拔不是水平坐标的函数，只能把地面拆成几块，每块分别是函数的图像。
  reference: |
    不矛盾。「不同的等值线没有公共点」的前提是：每个水平位置只有一个海拔，即地面是一个二元函数的图像。

    坡很陡时，相邻两条等高线在水平方向上离得很近，但仍是不同的点；地图的比例尺小，画出来就几乎重合。崖壁完全竖直时，同一个水平位置对应一整段高度，这一处的地面不再是函数的图像，不同高度的等高线投影下来正好落在同一条线上，所以地图上它们重合。

    悬崖（岩石向外伸出）处，同一条竖直线和地面交于三处：悬崖顶上、伸出岩石的底面、下面的谷底。海拔不是水平坐标的函数，只能把地面拆成几块，每块分别看成函数的图像。投影到地图上，悬崖顶上的等高线和下面谷底的等高线甚至会交叉，这时交叉的两条线属于不同的「块」，各自仍然没有公共点。

- id: p8
  tier: thinking
  statement: |
    $f(x,y)=x^2+y^2$和$g(x,y)=e^{-(x^2+y^2)}$的等值线都是以原点为圆心的圆。只给出一族等值线、不标$c$的值，能不能确定函数？每条等值线都标上$c$的值，又能确定到什么程度？
  hints:
    - |
      $g$的等值线$g=c$（$0<c\le1$）是什么？它和$f$的哪一条等值线是同一个圆？
    - |
      $g=c$就是$x^2+y^2=-\ln c$，也就是$f=-\ln c$。只看圆，分不出是$f$还是$g$。
    - |
      不能。$f$、$g$的等值线是同一族圆，可$f$越往外越大，$g$越往外越小；把$f$代进任何一个严格单调的函数，得到的新函数都有这同一族等值线。每个点恰好在一条等值线上，所以每一条都标上$c$，函数就完全确定了；地图只画出有限几条，中间的值要估计。
  reference: |
    不能。$0<c\le1$时，$g=c$即$x^2+y^2=-\ln c$，正是$f$的等值线$f=-\ln c$，两族圆完全一样；可$f$越往外越大，$g$越往外越小，连增大的方向都看不出来。一般地，$\varphi$严格单调时，$\varphi\bigl(f(x,y)\bigr)$和$f$的等值线一样，只是标的值不同。

    反过来，如果每一条等值线都标上了$c$，每个点恰好落在一条等值线上，它的函数值就是那条线标的$c$，函数完全确定。地图只画出等间隔的有限几条，两条之间的海拔只能按疏密估计。
