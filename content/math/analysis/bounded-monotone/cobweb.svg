<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-size="14">
  <!-- 蛛网图：aₙ₊₁ = √(2 + aₙ)，a₁ = 0。坐标 px = 60 + 125x，py = 300 − 125y -->
  <!-- 坐标轴 -->
  <line x1="60" y1="300" x2="392" y2="300" stroke="currentColor" stroke-width="1.5" />
  <path d="M 404 300 L 390 294 L 390 306 Z" fill="currentColor" />
  <text x="410" y="305" font-style="italic" fill="currentColor">x</text>
  <line x1="60" y1="300" x2="60" y2="22" stroke="currentColor" stroke-width="1.5" />
  <path d="M 60 10 L 54 24 L 66 24 Z" fill="currentColor" />
  <text x="70" y="18" font-style="italic" fill="currentColor">y</text>
  <line x1="54" y1="175" x2="60" y2="175" stroke="currentColor" stroke-width="1.2" />
  <text x="48" y="180" text-anchor="end" fill="currentColor">1</text>
  <line x1="54" y1="50" x2="60" y2="50" stroke="currentColor" stroke-width="1.2" />
  <text x="48" y="55" text-anchor="end" fill="currentColor">2</text>
  <!-- y = x -->
  <line x1="60" y1="300" x2="347.5" y2="12.5" stroke="currentColor" stroke-width="1.3" opacity="0.7" />
  <text x="150" y="230" fill="currentColor"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">x</tspan></text>
  <!-- y = √(2 + x) -->
  <polyline points="60,123.22 72.5,118.86 85,114.6 97.5,110.43 110,106.35 122.5,102.36 135,98.44 147.5,94.6 160,90.83 172.5,87.13 185,83.49 197.5,79.91 210,76.39 222.5,72.93 235,69.51 247.5,66.15 260,62.83 272.5,59.56 285,56.33 297.5,53.14 310,50 322.5,46.89 335,43.83 347.5,40.79 360,37.8" fill="none" stroke-width="2.2" style="stroke: var(--good, #059669)" />
  <text x="366" y="42" style="fill: var(--good, #059669)"><tspan font-style="italic">y</tspan> = √(2 + <tspan font-style="italic">x</tspan>)</text>
  <!-- 蛛网：竖直走到曲线，水平走到 y = x -->
  <path d="M 60 300 V 123.22 H 236.78 V 69.03 H 290.97 V 54.8 H 305.2 V 51.2 H 308.8 V 50.3 H 309.7 V 50.08 H 309.92" fill="none" stroke-width="1.6" stroke-linejoin="round" style="stroke: var(--accent, #2563eb)" />
  <line x1="236.78" y1="123.22" x2="236.78" y2="300" stroke-width="1" stroke-dasharray="3 3" style="stroke: var(--accent, #2563eb)" />
  <line x1="290.97" y1="69.03" x2="290.97" y2="300" stroke-width="1" stroke-dasharray="3 3" style="stroke: var(--accent, #2563eb)" />
  <g style="fill: var(--accent, #2563eb)">
    <circle cx="60" cy="300" r="4" />
    <circle cx="236.78" cy="300" r="4" />
    <circle cx="290.97" cy="300" r="4" />
    <circle cx="305.2" cy="300" r="3.5" />
    <circle cx="308.8" cy="300" r="3" />
  </g>
  <text x="66" y="320" fill="currentColor"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="10">1</tspan></text>
  <text x="236.78" y="320" text-anchor="middle" fill="currentColor"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="10">2</tspan></text>
  <text x="286" y="320" text-anchor="middle" fill="currentColor"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="10">3</tspan></text>
  <!-- 不动点 -->
  <circle cx="310" cy="50" r="4.5" fill="currentColor" />
  <text x="300" y="34" text-anchor="end" fill="currentColor">(2, 2)</text>
  <!-- 说明 -->
  <text x="430" y="120" fill="currentColor">从 <tspan font-style="italic">a</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> = 0 出发：</tspan></text>
  <text x="430" y="146" fill="currentColor">竖直走到曲线，得到下一项；</text>
  <text x="430" y="172" fill="currentColor">水平走到 <tspan font-style="italic">y</tspan> = <tspan font-style="italic">x</tspan>，把它搬回横轴。</text>
  <text x="430" y="198" fill="currentColor">台阶越走越小，</text>
  <text x="430" y="224" fill="currentColor">停在两条线的交点 (2, 2)。</text>
</svg>
