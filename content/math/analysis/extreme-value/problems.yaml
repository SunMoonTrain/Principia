- id: p1
  tier: easy
  statement: |
    下面哪些函数在所给的区间上取到最大值？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $f(x)=x$，区间$[0,1)$
      - |
        $f(x)=\frac1x$，区间$[1,2]$
      - |
        $f(x)=-x^2$，区间$(-1,1)$
      - |
        $f(x)=x$（$0\le x<1$），$f(1)=0$，区间$[0,1]$
    value: [2, 3]
  hints:
    - |
      :term[最值定理]{id="math.analysis.extreme-value-theorem"}（extreme value theorem）只给充分条件：闭区间上的连续函数一定取到最大值，不满足条件的函数也可能取到。逐个找最大值，或者说明它取不到。
    - |
      A、D 的函数值都往$1$挤，看看有没有哪个$x$使$f(x)=1$。B 在闭区间上连续。C 的函数值都不超过$0$，$0$被取到了吗？
    - |
      A：函数值的上确界是$1$，可$[0,1)$里没有$x$使$x=1$，取不到最大值。B：$[1,2]$上连续，由最值定理取到最大值，就是$f(1)=1$。

      C：$-x^2\le0=f(0)$，在$0$处取到最大值$0$，虽然区间是开的。D：上确界也是$1$，可$x<1$时$f(x)=x<1$，$f(1)=0$，取不到；它在$1$处不连续。答案是 B 和 C。
  solution: |
    B 在闭区间上连续，最大值是$f(1)=1$；C 在$0$处取到最大值$0$。A、D 的上确界都是$1$，却没有一点取到$1$。

- id: p2
  tier: easy
  statement: |
    设$f(x)=x-\lfloor x\rfloor$（$\lfloor x\rfloor$是不超过$x$的最大整数），定义在$[0,2]$上。求$\sup_{x\in[0,2]}f(x)$。
  answer:
    type: number
    value: 1
  hints:
    - |
      $f(x)$是$x$的小数部分。分别看$[0,1)$、$[1,2)$和$x=2$上它等于什么。
    - |
      $0\le x<1$时$f(x)=x$，$1\le x<2$时$f(x)=x-1$，$f(2)=0$。函数值都小于$1$，又能任意接近$1$。
    - |
      $0\le x<1$时$f(x)=x$，$1\le x<2$时$f(x)=x-1$，$f(2)=0$，所以每个函数值都小于$1$，$1$是上界。任给$\varepsilon\in(0,1)$，取$x=1-\frac\varepsilon2$，则$f(x)=1-\frac\varepsilon2>1-\varepsilon$，比$1$小的数都不是上界。所以上确界是$1$。

      这个上确界取不到，$f$没有最大值。这和:term[最值定理]{id="math.analysis.extreme-value-theorem"}不矛盾：$f$在$x=1$和$x=2$处不:term[连续]{id="math.analysis.continuous-function"}。
  solution: |
    函数值都小于$1$，在$x\to1^-$时又任意接近$1$，所以上确界是$1$。它取不到；这和最值定理不矛盾，因为$f$在$1$、$2$处不连续，最值定理用不上。

- id: p3
  tier: medium
  statement: |
    求$f(x)=x^3-3x$在$\bigl[-2,\frac32\bigr]$上的最大值和最小值，按（最大值, 最小值）的顺序填写。
  answer:
    type: tuple
    value: [2, -2]
  hints:
    - |
      先算几个点：两个端点，再加上$x=\pm1$。猜出最大值和最小值以后，再证明$f(x)$不超过、不低于它们。
    - |
      $f(-2)=-2$，$f(-1)=2$，$f(1)=-2$，$f\bigl(\frac32\bigr)=-\frac98$。可以验证$f(x)-2=(x+1)^2(x-2)$，$f(x)+2=(x-1)^2(x+2)$。
    - |
      $f(x)-2=x^3-3x-2=(x+1)^2(x-2)$。在$\bigl[-2,\frac32\bigr]$上$x-2<0$，所以$f(x)\le2$，等号在$x=-1$处成立，最大值是$2$。

      $f(x)+2=x^3-3x+2=(x-1)^2(x+2)$。在这个区间上$x+2\ge0$，所以$f(x)\ge-2$，等号在$x=-2$和$x=1$处成立，最小值是$-2$。答案是$(2,-2)$：最大值在区间里面取到，最小值在一个端点和区间里面的一点处都取到。
  solution: |
    由$f(x)-2=(x+1)^2(x-2)\le0$和$f(x)+2=(x-1)^2(x+2)\ge0$，最大值是$f(-1)=2$，最小值是$f(-2)=f(1)=-2$，填 `2, -2`。

- id: p4
  tier: medium
  statement: |
    对每个实数$t$，$|x^2-tx|$在$[0,1]$上连续，由:term[最值定理]{id="math.analysis.extreme-value-theorem"}，它在$[0,1]$上有最大值，记作$g(t)$。求$g(t)$在所有实数$t$里的最小值。
  answer:
    type: number
    value: 3 - 2*sqrt(2)
  hints:
    - |
      先看$0<t<1$：$x^2-tx=x(x-t)$在$[0,t]$上不大于$0$，在$[t,1]$上不小于$0$。分别求两段上$|x^2-tx|$的最大值。
    - |
      $0<t<1$时，$[0,t]$上的最大值是$\frac{t^2}{4}$（在$x=\frac t2$处），$[t,1]$上的最大值是$1-t$（在$x=1$处），所以$g(t)=\max\bigl\{\frac{t^2}{4},1-t\bigr\}$。前一个随$t$增大，后一个随$t$减小。再看$t\le0$和$t\ge1$。
    - |
      设$0<t<1$。在$[0,t]$上$|x^2-tx|=x(t-x)=\frac{t^2}{4}-\bigl(x-\frac t2\bigr)^2$，最大值$\frac{t^2}4$；在$[t,1]$上$|x^2-tx|=x(x-t)$随$x$增大，最大值$1-t$。所以$g(t)=\max\bigl\{\frac{t^2}{4},1-t\bigr\}$。$\frac{t^2}4$递增、$1-t$递减，最小值在两者相等处：$t^2+4t-4=0$，$t=2\sqrt2-2\approx0.828$，这时$g(t)=1-t=3-2\sqrt2\approx0.172$。

      $t\le0$时，$x=1$处$|1-t|\ge1$，所以$g(t)\ge1$；$t\ge1$时，$x=\frac12$处$\bigl|\frac14-\frac t2\bigr|\ge\frac14$，所以$g(t)\ge\frac14$。它们都比$3-2\sqrt2$大。所以$g(t)$的最小值是$3-2\sqrt2$。
  solution: |
    $0<t<1$时$g(t)=\max\bigl\{\frac{t^2}{4},1-t\bigr\}$，两者相等时最小，$t=2\sqrt2-2$，$g=3-2\sqrt2$；$t\le0$时$g\ge1$，$t\ge1$时$g\ge\frac14$，都更大。

- id: p5
  tier: hard
  statement: |
    不用:term[致密性定理]{id="math.analysis.bolzano-weierstrass"}（Bolzano-Weierstrass theorem），而用:term[有界性定理]{id="math.analysis.boundedness-theorem"}（boundedness theorem）证明最值定理的「取到最大值」：设$f$在$[a,b]$上:term[连续]{id="math.analysis.continuous-function"}，$M=\sup_{x\in[a,b]}f(x)$，证明有$\xi\in[a,b]$使$f(\xi)=M$。
  hints:
    - |
      用反证法。如果$M$取不到，那么每个$f(x)$都严格小于$M$，$M-f(x)$处处为正。构造一个用它做分母的连续函数。
    - |
      令$g(x)=\frac{1}{M-f(x)}$，它在$[a,b]$上连续。由有界性定理，$g$有界，设$g(x)\le K$。由此推出$f(x)\le M-\frac1K$，和$M$是上确界矛盾。
    - |
      假设没有$\xi$使$f(\xi)=M$。$M$是上界，所以每个$x\in[a,b]$都有$f(x)<M$，$M-f(x)>0$。于是$g(x)=\frac{1}{M-f(x)}$是两个连续函数的商，分母处处不为零，在$[a,b]$上连续。

      由有界性定理，有$K>0$使$g(x)\le K$对所有$x\in[a,b]$成立，即$M-f(x)\ge\frac1K$，$f(x)\le M-\frac1K$。这说明$M-\frac1K$是函数值的上界，它比$M$小，和$M$是上确界矛盾。所以$M$被取到。

      这个证明把「取到最大值」归结为「有界」：取不到上确界的函数，总能变出一个无界的连续函数。有界性定理本身的证明，还是要用到致密性定理（或别的完备性的说法）。
  reference: |
    若$M$取不到，则$M-f(x)>0$，$g=\frac1{M-f}$在$[a,b]$上连续，由有界性定理$g\le K$，于是$f\le M-\frac1K$，与$M$为上确界矛盾。

- id: p6
  tier: hard
  statement: |
    设$f$在$[a,b]$上:term[连续]{id="math.analysis.continuous-function"}，并且对每个$x\in[a,b]$，都有$y\in[a,b]$使$|f(y)|\le\frac12|f(x)|$。证明$f$在$[a,b]$上有零点。
  hints:
    - |
      $|f|$也是连续函数。由:term[最值定理]{id="math.analysis.extreme-value-theorem"}，它在某一点取到最小值。这个最小值能是正数吗？
    - |
      设$|f|$在$x_0$处取到最小值。若$|f(x_0)|>0$，由条件，有$y$使$|f(y)|\le\frac12|f(x_0)|<|f(x_0)|$。
    - |
      $|f(x)|$是连续函数$f$和连续函数$|u|$的复合，在$[a,b]$上连续。由最值定理，有$x_0\in[a,b]$使$|f(x)|\ge|f(x_0)|$对所有$x\in[a,b]$成立。

      假设$|f(x_0)|>0$。由条件，有$y\in[a,b]$使$|f(y)|\le\frac12|f(x_0)|<|f(x_0)|$，和$|f(x_0)|$是最小值矛盾。所以$|f(x_0)|=0$，$x_0$就是$f$的零点。

      如果区间换成开的，结论可能不对：$f(x)=x$在$(0,1)$上满足条件（取$y=\frac x2$），却没有零点。条件只给出一串越来越小的函数值，要「取到」最小值，靠的是闭区间上的最值定理。
  reference: |
    $|f|$连续，由最值定理在$x_0$取到最小值；若$|f(x_0)|>0$，则有$y$使$|f(y)|\le\frac12|f(x_0)|<|f(x_0)|$，矛盾，故$f(x_0)=0$。开区间上$f(x)=x$是反例。

- id: p7
  tier: thinking
  statement: |
    :term[最值定理]{id="math.analysis.extreme-value-theorem"}的证明里，「闭区间」的作用是：其中的数列有收敛的子列，并且极限还在区间里。把$[a,b]$换成别的集合$D$，例如$[0,1]\cup[2,3]$、$\Q\cap[0,1]$、$\bigl\{1,\frac12,\frac13,\dots\bigr\}$、$\{0\}\cup\bigl\{1,\frac12,\frac13,\dots\bigr\}$，$D$上的连续函数还一定取到最大值、最小值吗？什么样的$D$才行？
  hints:
    - |
      对每个集合，试一试$f(x)=x$，或者一个在$D$外面某点「爆掉」的函数，比如$\frac{1}{x-c}$。
    - |
      $\Q\cap[0,1]$上，试$\frac{1}{x-\frac{\sqrt2}{2}}$。$\bigl\{1,\frac12,\frac13,\dots\bigr\}$上，$f(x)=x$的最小值在哪里？证明用到的是：$D$里的每个数列都有收敛的子列，并且子列的极限仍在$D$里。
    - |
      $[0,1]\cup[2,3]$可以：$D$里的数列有界，有收敛的子列；这个子列有无穷多项落在同一段里，它们仍收敛于同一个极限，而那一段是闭区间，所以极限在那一段里。证明照搬。$\{0\}\cup\bigl\{1,\frac12,\dots\bigr\}$也可以：$D$里的收敛数列，极限要么是$0$，要么是某个$\frac1m$（它附近只有自己这一个点），都在$D$里。

      $\Q\cap[0,1]$不行：$\frac{1}{x-\sqrt2/2}$在它上面连续（$\frac{\sqrt2}2$不在里面），却无界。$\bigl\{1,\frac12,\frac13,\dots\bigr\}$不行：$f(x)=x$的下确界$0$不在$D$里，取不到最小值。

      一般地，$D$要有界（数列才有收敛的子列），还要「闭」：$D$里的收敛数列，极限仍在$D$里。有界闭集（bounded closed set）上的连续函数一定取到最值，这在拓扑里叫紧致性（compactness），见[列紧性](lesson:math.topology.sequential-compactness)和[紧致性](lesson:math.topology.compactness)。
  reference: |
    $[0,1]\cup[2,3]$与$\{0\}\cup\{1/n\}$可以，$\Q\cap[0,1]$（$\frac{1}{x-\sqrt2/2}$无界）与$\{1/n\}$（$x$取不到最小值）不行。条件是$D$有界且闭（收敛数列的极限仍在$D$中），即列紧/紧致。

- id: p8
  tier: thinking
  statement: |
    二元函数（function of two variables）也有最值定理：$f(x,y)$在闭圆盘（closed disk）$x^2+y^2\le1$上连续，就一定取到最大值和最小值。这一节的证明要怎样改，才能用到平面上？哪一步需要换成平面上的结论？
  hints:
    - |
      逐句看定理 1、定理 2 的证明：数列换成平面上的点列（sequence of points）$(x_n,y_n)$以后，哪些句子照样成立，哪一句要用平面上的新结论？
    - |
      要换的是致密性定理：需要「有界的平面点列有收敛的子列」，这在[子列与致密性定理](lesson:math.analysis.subsequences)第 7 题里证过（先对横坐标、再对纵坐标各挑一次）。还要「闭圆盘里的点列的极限仍在闭圆盘里」。
    - |
      照搬时，点列$(x_n,y_n)$在闭圆盘里，坐标都在$[-1,1]$里，是有界点列。用平面上的致密性定理，先在横坐标里挑出收敛的子列，再在对应的纵坐标里挑一次，得到收敛于某点$(\xi,\eta)$的子列。由$x_{n_k}^2+y_{n_k}^2\le1$和保不等式性，$\xi^2+\eta^2\le1$，极限点仍在闭圆盘里。

      剩下的步骤（$f$在$(\xi,\eta)$处连续，于是$f(x_{n_k},y_{n_k})\to f(\xi,\eta)$；上确界、夹逼、极限唯一）都不用改，只要把$|x-a|$换成两点间的距离。开圆盘（open disk）$x^2+y^2<1$就不行，比如$\frac{1}{1-x^2-y^2}$在上面无界。

      这就是多元函数（function of several variables）求最值时，先要确认区域有界、闭的原因，见[多元函数的极值](lesson:math.vector-calculus.extrema)。
  reference: |
    把数列换成平面点列：有界点列由平面致密性定理（逐个坐标取子列）有收敛子列，闭圆盘使极限点仍在其中；其余步骤（连续、上确界、夹逼）不变，距离换成平面距离。开圆盘上$\frac{1}{1-x^2-y^2}$无界。
