id: math.analysis
title: |
  数学分析
proofPolicy: full
macros:
  \R: |
    \mathbb{R}
  \Q: |
    \mathbb{Q}
  \N: |
    \mathbb{N}
  \Z: |
    \mathbb{Z}
  \dd: |
    \mathop{}\!\mathrm{d}
glossary:
  - id: math.analysis.sequence-limit
    zh: |
      数列的极限
    en: |
      limit of a sequence
    abbr: |
      lim
    brief: |
      数列$\{a_n\}$趋于$L$：任给$\varepsilon>0$，都有正整数$N$，使$n>N$时$|a_n-L|<\varepsilon$。
    definedIn: math.analysis.sequences-limits
    anchor: def-limit
  - id: math.analysis.convergent-sequence
    zh: |
      收敛数列
    en: |
      convergent sequence
    brief: |
      有极限的数列：存在实数$L$使$\lim_{n\to\infty}a_n=L$，也说它收敛于$L$。
    definedIn: math.analysis.sequences-limits
    anchor: def-limit
  - id: math.analysis.divergent-sequence
    zh: |
      发散数列
    en: |
      divergent sequence
    brief: |
      不收敛的数列：没有任何实数是它的极限，例如$\{(-1)^n\}$和$\{n\}$。
    definedIn: math.analysis.sequences-limits
    anchor: def-divergent
  - id: math.analysis.neighborhood
    zh: |
      邻域
    en: |
      neighborhood
    brief: |
      以$a$为中心、$\varepsilon$为半径的开区间$(a-\varepsilon,a+\varepsilon)$，叫作$a$的$\varepsilon$邻域。
    definedIn: math.analysis.sequences-limits
    anchor: def-neighborhood
  - id: math.analysis.bounded-sequence
    zh: |
      有界数列
    en: |
      bounded sequence
    brief: |
      存在正数$M$，使每一项都满足$|a_n|\le M$的数列；收敛数列一定有界。
    definedIn: math.analysis.limit-properties
    anchor: def-bounded
  - id: math.analysis.sign-preservation
    zh: |
      保号性
    en: |
      sign-preserving property
    brief: |
      若$a_n\to L$且$L>0$，则从某一项起$a_n>0$；$L<0$时同理。极限为零时推不出符号。
    definedIn: math.analysis.limit-properties
    anchor: thm-sign-preserving
  - id: math.analysis.order-limit-theorem
    zh: |
      保不等式性
    en: |
      order limit theorem
    brief: |
      若$a_n\to a$，$b_n\to b$，且从某一项起$a_n\le b_n$，则$a\le b$；严格的$<$取极限后只保得住$\le$。
    definedIn: math.analysis.limit-properties
    anchor: thm-order-limit
  - id: math.analysis.algebraic-limit-theorem
    zh: |
      极限的四则运算法则
    en: |
      algebraic limit theorem
    brief: |
      若$a_n\to a$，$b_n\to b$，则$a_n\pm b_n\to a\pm b$，$a_nb_n\to ab$；$b\ne0$时$\frac{a_n}{b_n}\to\frac ab$。
    definedIn: math.analysis.limit-arithmetic
    anchor: thm-limit-arithmetic
  - id: math.analysis.squeeze-theorem
    zh: |
      夹逼定理
    en: |
      squeeze theorem
    brief: |
      若从某一项起$b_n\le a_n\le c_n$，且$b_n$、$c_n$都趋于$L$，则$a_n$也趋于$L$。
    definedIn: math.analysis.limit-arithmetic
    anchor: thm-squeeze
  - id: math.analysis.monotone-sequence
    zh: |
      单调数列
    en: |
      monotone sequence
    brief: |
      每一项都不小于前一项（单调递增），或都不大于前一项（单调递减）的数列。
    definedIn: math.analysis.bounded-monotone
    anchor: def-monotone
  - id: math.analysis.monotone-convergence-theorem
    zh: |
      单调有界原理
    en: |
      monotone convergence theorem
    brief: |
      单调递增且有上界的数列收敛于项的上确界；单调递减且有下界的数列收敛于项的下确界。
    definedIn: math.analysis.bounded-monotone
    anchor: thm-monotone-convergence
  - id: math.analysis.nested-intervals
    zh: |
      闭区间套
    en: |
      nested intervals
    brief: |
      一串一个套一个、长度趋于$0$的闭区间$[a_n,b_n]$，即$[a_{n+1},b_{n+1}]\subseteq[a_n,b_n]$。
    definedIn: math.analysis.nested-intervals
    anchor: def-nested-intervals
  - id: math.analysis.nested-interval-theorem
    zh: |
      闭区间套定理
    en: |
      nested interval theorem
    brief: |
      闭区间套恰有一个公共点$\xi$，并且左、右端点都趋于$\xi$。
    definedIn: math.analysis.nested-intervals
    anchor: thm-nested-intervals
  - id: math.analysis.subsequence
    zh: |
      子列
    en: |
      subsequence
    brief: |
      从数列里按原来的顺序取出无穷多项组成的数列$\{a_{n_k}\}$，下标满足$n_1<n_2<\cdots$。
    definedIn: math.analysis.subsequences
    anchor: def-subsequence
  - id: math.analysis.bolzano-weierstrass
    zh: |
      致密性定理
    en: |
      Bolzano-Weierstrass theorem
    brief: |
      有界数列一定有收敛的子列。也叫波尔查诺-魏尔斯特拉斯定理。
    definedIn: math.analysis.subsequences
    anchor: thm-bolzano-weierstrass
  - id: math.analysis.cauchy-sequence
    zh: |
      柯西列
    en: |
      Cauchy sequence
    brief: |
      任给$\varepsilon>0$，都有正整数$N$，使$m,n>N$时$|a_m-a_n|<\varepsilon$的数列；定义里不出现极限。
    definedIn: math.analysis.cauchy-sequences
    anchor: def-cauchy-sequence
  - id: math.analysis.cauchy-criterion
    zh: |
      柯西收敛准则
    en: |
      Cauchy criterion
    brief: |
      数列收敛当且仅当它是柯西列：不用知道极限就能判断收敛，这也是实数完备性的一种说法。
    definedIn: math.analysis.cauchy-sequences
    anchor: thm-cauchy-criterion
  - id: math.analysis.limit-superior
    zh: |
      上极限
    en: |
      limit superior
    abbr: |
      lim sup
    brief: |
      $\sup_{k\ge n}a_k$当$n\to\infty$时的极限，记作$\limsup_{n\to\infty}a_n$；有界数列的上极限是最大的子列极限。
    definedIn: math.analysis.limsup-liminf
    anchor: def-limsup
  - id: math.analysis.limit-inferior
    zh: |
      下极限
    en: |
      limit inferior
    abbr: |
      lim inf
    brief: |
      $\inf_{k\ge n}a_k$当$n\to\infty$时的极限，记作$\liminf_{n\to\infty}a_n$；有界数列的下极限是最小的子列极限。
    definedIn: math.analysis.limsup-liminf
    anchor: def-limsup
  - id: math.analysis.punctured-neighborhood
    zh: |
      去心邻域
    en: |
      punctured neighborhood
    brief: |
      从$a$的$\delta$邻域里去掉$a$本身得到的集合$\{x:0<|x-a|<\delta\}$。
    definedIn: math.analysis.function-limits
    anchor: def-punctured-neighborhood
  - id: math.analysis.function-limit
    zh: |
      函数的极限
    en: |
      limit of a function
    brief: |
      $\lim_{x\to a}f(x)=L$：任给$\varepsilon>0$，有$\delta>0$，使$0<|x-a|<\delta$时$|f(x)-L|<\varepsilon$。
    definedIn: math.analysis.function-limits
    anchor: def-function-limit
  - id: math.analysis.heine-theorem
    zh: |
      海涅定理
    en: |
      Heine's theorem
    brief: |
      $\lim_{x\to a}f(x)=L$当且仅当对每个趋于$a$、各项都不等于$a$的数列$\{x_n\}$，都有$f(x_n)\to L$。
    definedIn: math.analysis.function-limits
    anchor: thm-heine
  - id: math.analysis.one-sided-limit
    zh: |
      单侧极限
    en: |
      one-sided limit
    brief: |
      只让$x$从一侧趋于$a$的极限：右极限只看$a<x<a+\delta$，左极限只看$a-\delta<x<a$。
    definedIn: math.analysis.function-limits
    anchor: def-one-sided-limit
  - id: math.analysis.continuous-function
    zh: |
      连续函数
    en: |
      continuous function
    brief: |
      $f$在$a$处连续：任给$\varepsilon>0$，有$\delta>0$，使$|x-a|<\delta$时$|f(x)-f(a)|<\varepsilon$；在区间每一点都连续就叫连续函数。
    definedIn: math.analysis.continuity
    anchor: def-continuous
  - id: math.analysis.bolzano-theorem
    zh: |
      零点定理
    en: |
      Bolzano's theorem
    brief: |
      $f$在$[a,b]$上连续，$f(a)$与$f(b)$异号，则有$\xi\in(a,b)$使$f(\xi)=0$。
    definedIn: math.analysis.intermediate-value
    anchor: thm-bolzano
  - id: math.analysis.intermediate-value-theorem
    zh: |
      介值定理
    en: |
      intermediate value theorem
    brief: |
      $f$在$[a,b]$上连续，$c$严格介于$f(a)$与$f(b)$之间，则有$\xi\in(a,b)$使$f(\xi)=c$。
    definedIn: math.analysis.intermediate-value
    anchor: thm-intermediate-value
  - id: math.analysis.bounded-function
    zh: |
      有界函数
    en: |
      bounded function
    brief: |
      存在$M>0$，使定义域里所有$x$都满足$|f(x)|\le M$的函数；有界不有界和定义在哪个集合上有关。
    definedIn: math.analysis.extreme-value
    anchor: def-bounded-function
  - id: math.analysis.boundedness-theorem
    zh: |
      有界性定理
    en: |
      boundedness theorem
    brief: |
      闭区间$[a,b]$上的连续函数一定有界。
    definedIn: math.analysis.extreme-value
    anchor: thm-boundedness
  - id: math.analysis.extreme-value-theorem
    zh: |
      最值定理
    en: |
      extreme value theorem
    brief: |
      闭区间$[a,b]$上的连续函数一定取到最大值和最小值。
    definedIn: math.analysis.extreme-value
    anchor: thm-extreme-value
  - id: math.analysis.uniform-continuity
    zh: |
      一致连续
    en: |
      uniform continuity
    brief: |
      任给$\varepsilon>0$，有只依赖$\varepsilon$的$\delta>0$，使区间里任意两点$|x-y|<\delta$时$|f(x)-f(y)|<\varepsilon$。
    definedIn: math.analysis.uniform-continuity
    anchor: def-uniform-continuity
  - id: math.analysis.heine-cantor-theorem
    zh: |
      康托尔定理
    en: |
      Heine-Cantor theorem
    brief: |
      闭区间$[a,b]$上的连续函数一定一致连续。
    definedIn: math.analysis.uniform-continuity
    anchor: thm-heine-cantor
  - id: math.analysis.upper-bound
    zh: |
      上界
    en: |
      upper bound
    brief: |
      不小于集合里每一个元素的数：对所有$a\in A$都有$a\le M$，就说$M$是$A$的上界。
    definedIn: math.analysis.completeness
    anchor: def-upper-bound
  - id: math.analysis.supremum
    zh: |
      上确界
    en: |
      supremum
    abbr: |
      sup
    brief: |
      有上界的非空实数集的最小上界，记作$\sup A$；它不一定属于$A$。
    definedIn: math.analysis.completeness
    anchor: def-supremum
  - id: math.analysis.infimum
    zh: |
      下确界
    en: |
      infimum
    abbr: |
      inf
    brief: |
      有下界的非空实数集的最大下界，记作$\inf A$。
    definedIn: math.analysis.completeness
    anchor: def-infimum
  - id: math.analysis.maximum
    zh: |
      最大元
    en: |
      maximum
    abbr: |
      max
    brief: |
      属于集合本身的上界；有最大元时，它就是上确界。
    definedIn: math.analysis.completeness
    anchor: def-maximum
  - id: math.analysis.supremum-principle
    zh: |
      确界原理
    en: |
      least-upper-bound property
    brief: |
      $\R$的每个有上界的非空子集都在$\R$中有上确界；这正是「实数轴没有洞」的精确说法。
    definedIn: math.analysis.completeness
    anchor: def-supremum-principle
  - id: math.analysis.real-completeness
    zh: |
      实数的完备性
    en: |
      completeness of the real numbers
    brief: |
      实数轴「没有洞」的性质，通常用确界原理来表述；单调有界原理、闭区间套定理是它的另外几种说法。
    definedIn: math.analysis.completeness
    anchor: def-supremum-principle
  - id: math.analysis.archimedean-property
    zh: |
      阿基米德性质
    en: |
      Archimedean property
    brief: |
      对任意实数$x$，都有正整数$n>x$；也就是说，正整数集没有上界。
    definedIn: math.analysis.completeness
    anchor: def-archimedean
  - id: math.analysis.differentiable-function
    zh: |
      可导函数
    en: |
      differentiable function
    brief: |
      $f$在$a$处可导：差商$\frac{f(a+h)-f(a)}{h}$在$h\to0$时有极限$f'(a)$；在区间上每一点都可导的函数叫可导函数。
    definedIn: math.analysis.differentiability
    anchor: def-differentiable
  - id: math.analysis.linear-approximation
    zh: |
      线性近似
    en: |
      linear approximation
    brief: |
      $f(a+h)=f(a)+f'(a)h+r(h)$，误差满足$\frac{r(h)}{h}\to0$；$f$在$a$处可导，当且仅当能这样近似。
    definedIn: math.analysis.differentiability
    anchor: thm-linear-approximation
  - id: math.analysis.chain-rule
    zh: |
      链式法则
    en: |
      chain rule
    brief: |
      $g$在$a$处可导、$f$在$g(a)$处可导，则$f\circ g$在$a$处可导，$(f\circ g)'(a)=f'(g(a))\,g'(a)$。
    definedIn: math.analysis.differentiability
    anchor: thm-chain-rule
  - id: math.analysis.fermat-theorem
    zh: |
      费马定理
    en: |
      Fermat's theorem
    brief: |
      $f$在$c$处取到极大值或极小值（$c$两边都有定义域里的点），并且在$c$处可导，则$f'(c)=0$。
    definedIn: math.analysis.mean-value-proofs
    anchor: thm-fermat
  - id: math.analysis.rolle-theorem
    zh: |
      罗尔定理
    en: |
      Rolle's theorem
    brief: |
      $f$在$[a,b]$上连续、在$(a,b)$内可导、$f(a)=f(b)$，则有$\xi\in(a,b)$使$f'(\xi)=0$。
    definedIn: math.analysis.mean-value-proofs
    anchor: thm-rolle
  - id: math.analysis.mean-value-theorem
    zh: |
      拉格朗日中值定理
    en: |
      mean value theorem
    brief: |
      $f$在$[a,b]$上连续、在$(a,b)$内可导，则有$\xi\in(a,b)$使$f'(\xi)=\frac{f(b)-f(a)}{b-a}$。
    definedIn: math.analysis.mean-value-proofs
    anchor: thm-mean-value
  - id: math.analysis.cauchy-mean-value-theorem
    zh: |
      柯西中值定理
    en: |
      Cauchy's mean value theorem
    brief: |
      $f$、$g$在$[a,b]$上连续、在$(a,b)$内可导，$g'\ne0$，则有$\xi\in(a,b)$使$\frac{f(b)-f(a)}{g(b)-g(a)}=\frac{f'(\xi)}{g'(\xi)}$。
    definedIn: math.analysis.mean-value-proofs
    anchor: thm-cauchy-mean-value
  - id: math.analysis.partition
    zh: |
      分割
    en: |
      partition
    brief: |
      $[a,b]$上有限个点$a=x_0<x_1<\cdots<x_n=b$，它们把区间分成$n$个小区间。
    definedIn: math.analysis.riemann-integral
    anchor: def-darboux-sums
  - id: math.analysis.upper-sum
    zh: |
      上和
    en: |
      upper sum
    brief: |
      有界函数$f$关于分割$P$的上和$U(f,P)=\sum M_i\Delta x_i$，$M_i$是$f$在第$i$段上的上确界。
    definedIn: math.analysis.riemann-integral
    anchor: def-darboux-sums
  - id: math.analysis.lower-sum
    zh: |
      下和
    en: |
      lower sum
    brief: |
      有界函数$f$关于分割$P$的下和$L(f,P)=\sum m_i\Delta x_i$，$m_i$是$f$在第$i$段上的下确界。
    definedIn: math.analysis.riemann-integral
    anchor: def-darboux-sums
  - id: math.analysis.refinement
    zh: |
      加细
    en: |
      refinement
    brief: |
      分割$P^*$包含分割$P$的所有分点；加细以后上和不增、下和不减。
    definedIn: math.analysis.riemann-integral
    anchor: def-refinement
  - id: math.analysis.riemann-integral
    zh: |
      黎曼积分
    en: |
      Riemann integral
    brief: |
      有界函数$f$的下和的上确界等于上和的下确界时，说$f$可积，这个公共值就是积分$\int_a^bf(x)\dd x$。
    definedIn: math.analysis.riemann-integral
    anchor: def-riemann-integral
  - id: math.analysis.integrability-criterion
    zh: |
      可积准则
    en: |
      Riemann's criterion
    brief: |
      有界函数$f$在$[a,b]$上可积，当且仅当任给$\varepsilon>0$，都有分割$P$使$U(f,P)-L(f,P)<\varepsilon$。
    definedIn: math.analysis.riemann-integral
    anchor: thm-integrability-criterion
  - id: math.analysis.variable-upper-limit-integral
    zh: |
      变上限积分
    en: |
      integral with variable upper limit
    brief: |
      $f$在$[a,b]$上可积时，$F(x)=\int_a^xf(t)\dd t$；它在$[a,b]$上连续，在$f$的连续点处可导。
    definedIn: math.analysis.ftc-proof
    anchor: def-variable-upper-limit
  - id: math.analysis.fundamental-theorem-of-calculus
    zh: |
      微积分基本定理
    en: |
      fundamental theorem of calculus
    brief: |
      $f$在$[a,b]$上可积、在$x_0$处连续，则变上限积分$F$在$x_0$处可导，并且$F'(x_0)=f(x_0)$。
    definedIn: math.analysis.ftc-proof
    anchor: thm-ftc
  - id: math.analysis.newton-leibniz-formula
    zh: |
      牛顿-莱布尼茨公式
    en: |
      Newton-Leibniz formula
    brief: |
      $F$在$[a,b]$上可导，并且$F'$可积，则$\int_a^bF'(x)\dd x=F(b)-F(a)$。
    definedIn: math.analysis.ftc-proof
    anchor: thm-newton-leibniz
  - id: math.analysis.series
    zh: |
      级数
    en: |
      series
    brief: |
      数列的各项依次相加写成的$\sum a_n$；它的和定义成部分和数列的极限。
    definedIn: math.analysis.series-cauchy
    anchor: def-series
  - id: math.analysis.partial-sum
    zh: |
      部分和
    en: |
      partial sum
    brief: |
      级数前$n$项的和$S_n=a_1+a_2+\cdots+a_n$。
    definedIn: math.analysis.series-cauchy
    anchor: def-series
  - id: math.analysis.convergent-series
    zh: |
      收敛级数
    en: |
      convergent series
    brief: |
      部分和数列收敛的级数；部分和的极限叫作级数的和。
    definedIn: math.analysis.series-cauchy
    anchor: def-series
  - id: math.analysis.divergent-series
    zh: |
      发散级数
    en: |
      divergent series
    brief: |
      部分和数列发散的级数，如$1-1+1-\cdots$和调和级数$\sum\frac1n$。
    definedIn: math.analysis.series-cauchy
    anchor: def-series
  - id: math.analysis.series-cauchy-criterion
    zh: |
      级数的柯西准则
    en: |
      Cauchy criterion for series
    brief: |
      $\sum a_n$收敛，当且仅当任给$\varepsilon>0$有$N$，使$n>m>N$时$|a_{m+1}+\cdots+a_n|<\varepsilon$。
    definedIn: math.analysis.series-cauchy
    anchor: thm-series-cauchy
  - id: math.analysis.absolute-convergence
    zh: |
      绝对收敛
    en: |
      absolute convergence
    brief: |
      $\sum|a_n|$收敛时，说$\sum a_n$绝对收敛；绝对收敛的级数一定收敛。
    definedIn: math.analysis.series-cauchy
    anchor: def-absolute-convergence
  - id: math.analysis.conditional-convergence
    zh: |
      条件收敛
    en: |
      conditional convergence
    brief: |
      $\sum a_n$收敛而$\sum|a_n|$发散，如$1-\frac12+\frac13-\cdots$。
    definedIn: math.analysis.series-cauchy
    anchor: def-absolute-convergence
  - id: math.analysis.comparison-test
    zh: |
      比较判别法
    en: |
      comparison test
    brief: |
      从某一项起$0\le a_n\le b_n$：$\sum b_n$收敛则$\sum a_n$收敛，$\sum a_n$发散则$\sum b_n$发散。
    definedIn: math.analysis.series-cauchy
    anchor: thm-comparison
  - id: math.analysis.rearrangement
    zh: |
      重排
    en: |
      rearrangement
    brief: |
      每个正整数恰好是一个$\sigma(n)$时，$\sum a_{\sigma(n)}$叫作$\sum a_n$的重排：各项都用上，只换次序。
    definedIn: math.analysis.rearrangement
    anchor: def-rearrangement
  - id: math.analysis.riemann-rearrangement-theorem
    zh: |
      黎曼重排定理
    en: |
      Riemann rearrangement theorem
    brief: |
      条件收敛的级数，对任意实数$L$，都有一个重排收敛到$L$。
    definedIn: math.analysis.rearrangement
    anchor: thm-riemann-rearrangement
  - id: math.analysis.cauchy-product
    zh: |
      柯西乘积
    en: |
      Cauchy product
    brief: |
      $\sum a_n$与$\sum b_n$的柯西乘积是$\sum c_n$，$c_n=\sum_{k=0}^na_kb_{n-k}$；两者都绝对收敛时，和是两个和之积。
    definedIn: math.analysis.rearrangement
    anchor: def-cauchy-product
  - id: math.analysis.pointwise-convergence
    zh: |
      逐点收敛
    en: |
      pointwise convergence
    brief: |
      对每个$x\in D$，数列$\{f_n(x)\}$都收敛于$f(x)$；$N$可以随$x$变。
    definedIn: math.analysis.uniform-convergence
    anchor: def-pointwise
  - id: math.analysis.uniform-convergence
    zh: |
      一致收敛
    en: |
      uniform convergence
    brief: |
      任给$\varepsilon>0$有$N$，使$n>N$时对所有$x\in D$都有$|f_n(x)-f(x)|<\varepsilon$。
    definedIn: math.analysis.uniform-convergence
    anchor: def-uniform-convergence
  - id: math.analysis.uniform-distance
    zh: |
      上确界距离
    en: |
      uniform distance
    brief: |
      $\|f-g\|_\infty=\sup_{x\in D}|f(x)-g(x)|$；$f_n$一致收敛于$f$，当且仅当$\|f_n-f\|_\infty\to0$。
    definedIn: math.analysis.uniform-convergence
    anchor: def-uniform-distance
  - id: math.analysis.function-series
    zh: |
      函数项级数
    en: |
      series of functions
    brief: |
      各项都是函数的级数$\sum u_n(x)$；它的收敛、一致收敛指部分和函数列的收敛、一致收敛。
    definedIn: math.analysis.function-series
    anchor: def-function-series
  - id: math.analysis.uniform-cauchy-criterion
    zh: |
      一致收敛的柯西准则
    en: |
      Cauchy criterion for uniform convergence
    brief: |
      $\{f_n\}$在$D$上一致收敛，当且仅当任给$\varepsilon>0$有$N$，使$m,n>N$时对所有$x\in D$都有$|f_m(x)-f_n(x)|<\varepsilon$。
    definedIn: math.analysis.function-series
    anchor: thm-uniform-cauchy
  - id: math.analysis.weierstrass-m-test
    zh: |
      魏尔斯特拉斯判别法
    en: |
      Weierstrass M-test
    brief: |
      对所有$x\in D$都有$|u_n(x)|\le M_n$，并且$\sum M_n$收敛，则$\sum u_n(x)$在$D$上一致收敛。
    definedIn: math.analysis.function-series
    anchor: thm-weierstrass-m-test
  - id: math.analysis.bernstein-polynomial
    zh: |
      伯恩斯坦多项式
    en: |
      Bernstein polynomial
    brief: |
      $B_nf(x)=\sum_{k=0}^nf\bigl(\frac kn\bigr)\binom nkx^k(1-x)^{n-k}$，是$f$在节点处的值的加权平均。
    definedIn: math.analysis.weierstrass-approximation
    anchor: def-bernstein
  - id: math.analysis.weierstrass-approximation-theorem
    zh: |
      魏尔斯特拉斯逼近定理
    en: |
      Weierstrass approximation theorem
    brief: |
      闭区间上的连续函数，都有一列多项式在这个区间上一致收敛于它。
    definedIn: math.analysis.weierstrass-approximation
    anchor: thm-weierstrass-approximation
  - id: math.analysis.power-series
    zh: |
      幂级数
    en: |
      power series
    brief: |
      形如$\sum_{n=0}^\infty a_n(x-x_0)^n$的级数，各项是$x-x_0$的幂乘系数；收敛的$x$组成以$x_0$为中心的区间。
    definedIn: math.analysis.power-series-theory
    anchor: def-power-series
  - id: math.analysis.radius-of-convergence
    zh: |
      收敛半径
    en: |
      radius of convergence
    brief: |
      一个数$R$（可以是$0$或$+\infty$）：$|x|<R$时$\sum a_nx^n$绝对收敛，$|x|>R$时发散。
    definedIn: math.analysis.power-series-theory
    anchor: def-radius
  - id: math.analysis.cauchy-hadamard-formula
    zh: |
      柯西-阿达马公式
    en: |
      Cauchy-Hadamard formula
    brief: |
      幂级数$\sum a_nx^n$的收敛半径$R=\frac{1}{\limsup_{n\to\infty}\sqrt[n]{|a_n|}}$。
    definedIn: math.analysis.power-series-theory
    anchor: thm-cauchy-hadamard
  - id: math.analysis.locally-uniform-convergence
    zh: |
      内闭一致收敛
    en: |
      uniform convergence on compact subsets
    brief: |
      在区间里的每个闭子区间上都一致收敛；幂级数在收敛区间内就是这样。
    definedIn: math.analysis.power-series-theory
    anchor: def-locally-uniform
