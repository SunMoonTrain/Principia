- id: p1
  tier: easy
  statement: |
    设$a_n=(-1)^n+\frac1n$。分别求偶数项子列$\{a_{2k}\}$和奇数项子列$\{a_{2k-1}\}$的极限，按（偶数项子列的极限, 奇数项子列的极限）的顺序填写。
  answer:
    type: tuple
    value: [1, -1]
  hints:
    - |
      分别写出$a_{2k}$和$a_{2k-1}$的式子，它们里面已经没有$(-1)^n$了。
    - |
      $a_{2k}=1+\frac{1}{2k}$，$a_{2k-1}=-1+\frac{1}{2k-1}$。
    - |
      $a_{2k}=1+\frac{1}{2k}\to1$，$a_{2k-1}=-1+\frac{1}{2k-1}\to-1$。答案是$(1,-1)$。两个:term[子列]{id="math.analysis.subsequence"}的极限不同，所以$\{a_n\}$发散。
  solution: |
    偶数项$1+\frac{1}{2k}\to1$，奇数项$-1+\frac{1}{2k-1}\to-1$，填 `1, -1`。两个子列极限不同，所以原数列发散。

- id: p2
  tier: easy
  statement: |
    下面哪些是数列$\{a_n\}$的:term[子列]{id="math.analysis.subsequence"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $a_1,a_4,a_9,a_{16},\dots$（第$k$项是$a_{k^2}$）
      - |
        $a_2,a_1,a_4,a_3,a_6,a_5,\dots$
      - |
        $a_2,a_4,a_6,a_8,\dots$
      - |
        $a_1,a_1,a_2,a_2,a_3,a_3,\dots$
    value: [1, 3]
  hints:
    - |
      子列要按原来的顺序取无穷多项，下标$n_1<n_2<n_3<\cdots$必须严格递增。逐个写出每个选项的下标串。
    - |
      A 的下标是$1,4,9,16,\dots$；B 是$2,1,4,3,\dots$；C 是$2,4,6,\dots$；D 是$1,1,2,2,\dots$。
    - |
      A 的下标$k^2$严格递增，是子列。B 的下标先$2$后$1$，顺序变了，不是。C 的下标$2k$严格递增，是子列。D 的下标$1,1$重复，不严格递增，不是。

      答案是 A 和 C。
  solution: |
    A（下标$k^2$）和 C（下标$2k$）的下标严格递增，是子列。B 调换了顺序，D 重复了项，都不是。

- id: p3
  tier: medium
  statement: |
    数列$a_n=\frac{n}{n+1}\cos\frac{2n\pi}{3}$的收敛子列，极限可能是哪些数？把所有可能的极限都填上，每个数只填一次。
  answer:
    type: set
    value: [-1/2, 1]
  hints:
    - |
      $\cos\frac{2n\pi}{3}$随$n$每 3 个一循环。按$n$除以$3$的余数把项分成三组，每组都是一个子列。
    - |
      $n=3k$时$\cos\frac{2n\pi}{3}=1$；$n=3k+1$、$n=3k+2$时它等于$-\frac12$。三组分别收敛于$1$、$-\frac12$、$-\frac12$。再想一想：为什么任何一个收敛的子列，极限都只能是这几个数之一？
    - |
      三组子列：$a_{3k}=\frac{3k}{3k+1}\to1$；$a_{3k+1}=-\frac12\cdot\frac{3k+1}{3k+2}\to-\frac12$；$a_{3k+2}=-\frac12\cdot\frac{3k+2}{3k+3}\to-\frac12$。所以$1$和$-\frac12$都是某个子列的极限。

      反过来，设子列$\{a_{n_j}\}$收敛于$L'$。它的下标里，一定有无穷多个属于同一组（三组里至少有一组含无穷多个下标）。这些项组成$\{a_{n_j}\}$的一个子列，所以收敛于$L'$；它又是那一组子列的子列，所以收敛于那一组的极限。由极限的唯一性，$L'$只能是$1$或$-\frac12$。

      答案是$\left\{-\frac12,1\right\}$，填 `-1/2, 1`。
  solution: |
    $n=3k$的项趋于$1$，其余的项趋于$-\frac12$。任何收敛子列都有无穷多项落在同一组里，所以它的极限只能是$1$或$-\frac12$。填 `-1/2, 1`。

- id: p4
  tier: medium
  statement: |
    对数列$a_n=(-1)^n\left(1+\frac1n\right)$，按致密性定理的证明来二分：$I_1=[-2,2]$；每次把$I_k$平分成左右两个闭区间，留下含有无穷多项（即有无穷多个$n$使$a_n$在里面）的那一半，两半都含无穷多项时留下右边那一半。求$I_4$，按（左端点, 右端点）的顺序填写。
  answer:
    type: tuple
    value: [1, 3/2]
  hints:
    - |
      先弄清各项落在哪里：奇数项是$-\left(1+\frac1n\right)$，偶数项是$1+\frac1n$。再逐次判断左右两半各含不含无穷多项。
    - |
      奇数项都在$[-2,-1)$里，偶数项都在$(1,1.5]$里。$[-2,2]$的两半都含无穷多项，留下右边的$[0,2]$。
    - |
      $I_1=[-2,2]$的两半$[-2,0]$、$[0,2]$分别含全部奇数项、全部偶数项，都有无穷多项，按规则留下$I_2=[0,2]$。

      $I_2$的两半：$[0,1]$里一项也没有（偶数项都大于$1$，奇数项都是负数），$[1,2]$含全部偶数项，所以$I_3=[1,2]$。

      $I_3$的两半：$[1,1.5]$含全部偶数项（$1+\frac1n\le1.5$），$[1.5,2]$只含$a_2=1.5$这一项，所以$I_4=[1,1.5]$。答案是$(1,1.5)$。
  solution: |
    依次留下$I_2=[0,2]$、$I_3=[1,2]$、$I_4=[1,1.5]$，填 `1, 1.5`。区间一直缩向偶数项挤向的$1$。

- id: p5
  tier: hard
  statement: |
    设数列$\{a_n\}$的偶数项子列$\{a_{2k}\}$和奇数项子列$\{a_{2k-1}\}$都收敛于$L$。证明$a_n\to L$。
  hints:
    - |
      任给$\varepsilon>0$，两个子列各给出一个$K$。要找一个$N$，使不论$n>N$是偶数还是奇数，都能落进对应子列的「$k>K$」范围。
    - |
      设$k>K_1$时$|a_{2k}-L|<\varepsilon$，$k>K_2$时$|a_{2k-1}-L|<\varepsilon$。取$N=2\max\{K_1,K_2\}$，分$n=2k$和$n=2k-1$两种情况看$k$有多大。
    - |
      任给$\varepsilon>0$。由$a_{2k}\to L$，有$K_1$使$k>K_1$时$|a_{2k}-L|<\varepsilon$；由$a_{2k-1}\to L$，有$K_2$使$k>K_2$时$|a_{2k-1}-L|<\varepsilon$。令$K=\max\{K_1,K_2\}$，$N=2K$。

      设$n>N$。若$n=2k$是偶数，则$2k>2K$，$k>K\ge K_1$，所以$|a_n-L|<\varepsilon$。若$n=2k-1$是奇数，则$2k-1>2K$，$k>K+\frac12$，又$k$是整数，所以$k\ge K+1>K_2$，于是$|a_n-L|<\varepsilon$。

      所以$n>N$时总有$|a_n-L|<\varepsilon$，即$a_n\to L$。这个结论能成立，是因为偶数项和奇数项两个:term[子列]{id="math.analysis.subsequence"}合起来用尽了所有的项。
  reference: |
    取$K_1$、$K_2$分别使$k>K_1$时$|a_{2k}-L|<\varepsilon$、$k>K_2$时$|a_{2k-1}-L|<\varepsilon$，令$N=2\max\{K_1,K_2\}$。$n>N$时，$n=2k$得$k>K_1$，$n=2k-1$得$k\ge\max\{K_1,K_2\}+1>K_2$，都有$|a_n-L|<\varepsilon$。

- id: p6
  tier: hard
  statement: |
    证明：每个数列都有单调的子列。由此给出:term[致密性定理]{id="math.analysis.bolzano-weierstrass"}的另一个证明。
  hints:
    - |
      把满足「它后面的项都不比它大」的位置叫作「峰」（peak）：若对所有$n>m$都有$a_n\le a_m$，就说$m$是峰。分两种情况：峰有无穷多个，或者只有有限个。
    - |
      峰有无穷多个时，把它们从小到大排好，对应的项单调递减。峰只有有限个时，从最后一个峰之后的某个位置出发，每个位置都不是峰，后面总有更大的项，可以一步步往后找。
    - |
      称$m$是峰，如果对所有$n>m$都有$a_n\le a_m$。

      情形 1：峰有无穷多个，从小到大记为$m_1<m_2<m_3<\cdots$。因为$m_k$是峰而$m_{k+1}>m_k$，所以$a_{m_{k+1}}\le a_{m_k}$，子列$\{a_{m_k}\}$单调递减。

      情形 2：峰只有有限个（包括一个也没有）。取正整数$N$大于所有的峰，令$n_1=N+1$。$n_1$不是峰，所以有$n_2>n_1$使$a_{n_2}>a_{n_1}$；$n_2>N$也不是峰，所以有$n_3>n_2$使$a_{n_3}>a_{n_2}$；这样一直取下去，得到严格递增的子列$\{a_{n_k}\}$。

      两种情形都得到单调的子列。若$\{a_n\}$有界，这个单调子列也有界，由:term[单调有界原理]{id="math.analysis.monotone-convergence-theorem"}（monotone convergence theorem），它收敛。这就是致密性定理的另一个证明：它不用闭区间套，而直接用单调有界原理。
  reference: |
    称$m$为峰若$a_n\le a_m$对所有$n>m$成立。峰无穷多时，峰对应的项构成递减子列；峰有限时，从最后一个峰之后出发，每个位置后面都有更大的项，归纳地得到严格递增子列。有界时单调子列由单调有界原理收敛，即得致密性定理。

- id: p7
  tier: thinking
  statement: |
    :term[致密性定理]{id="math.analysis.bolzano-weierstrass"}在有理数里还成立吗？换到平面上呢：有界的平面点列$(x_n,y_n)$（两个坐标都有界）一定有收敛的子列吗？这个定理在别的领域里会以什么面目出现？
  hints:
    - |
      在$\Q$里，想一想$\sqrt2$的不足近似值$1,1.4,1.41,1.414,\dots$的子列。在平面上，试着先只管横坐标。
    - |
      $\sqrt2$的不足近似值在$\R$里收敛于$\sqrt2$，它的每个子列也都收敛于$\sqrt2$。平面上：先对$\{x_n\}$用致密性定理挑出收敛的子列，再在这个子列里对纵坐标挑一次。
    - |
      在$\Q$里不成立：$\sqrt2$的不足近似值有界，它在$\R$里收敛于$\sqrt2$，所以每个子列在$\R$里也收敛于$\sqrt2$；如果某个子列在$\Q$里收敛于有理数$q$，由极限唯一$q=\sqrt2$，矛盾。所以它没有在$\Q$里收敛的子列。致密性定理和单调有界原理一样，背后靠的是实数的完备性（completeness of the real numbers）。

      在平面上成立：先由致密性定理从$\{x_n\}$里挑出收敛的子列$\{x_{n_k}\}$；对应的纵坐标$\{y_{n_k}\}$有界，再挑一次，得到$\{y_{n_{k_j}}\}$收敛，而$\{x_{n_{k_j}}\}$是收敛数列的子列，也收敛。于是点列$(x_{n_{k_j}},y_{n_{k_j}})$两个坐标都收敛。同样的办法对任意有限个坐标都行。

      在拓扑里，「每个点列都有收敛的子列」叫作列紧（sequentially compact）；致密性定理说的是$\R$里有界闭区间是列紧的，见[列紧性](lesson:math.topology.sequential-compactness)。分析里很多「存在最好的那一个」的结论（如闭区间上连续函数能取到最大值）都要先用它挑出收敛的子列。
  reference: |
    $\Q$中不成立：$\sqrt2$的不足近似值有界，但所有子列在$\R$中都收敛于$\sqrt2$，在$\Q$中无极限。平面中成立：先对横坐标、再对纵坐标各取一次收敛子列。推广为有界闭集的列紧性（拓扑），是最值定理等存在性结论的工具。

- id: p8
  tier: thinking
  statement: |
    数列$\{\sin n\}$有界，由致密性定理，它一定有收敛的子列。你能具体写出一个吗，比如一个收敛于$0$的子列？为什么致密性定理本身给不出具体的子列？
  hints:
    - |
      $\sin n$接近$0$，说明$n$接近$\pi$的某个整数倍。哪些分数很接近$\pi$？
    - |
      $\pi\approx\frac{22}{7}$，所以$22\approx7\pi$，$\sin22\approx-0.0089$；$\pi\approx\frac{355}{113}$，所以$355\approx113\pi$，$\sin355\approx-0.00003$。要说明这样的整数有无穷多个，而且$\sin$的值能任意小。
    - |
      致密性定理的证明每一步只说「两半中至少有一个含无穷多项」，可没说是哪一个，也没给出怎么判断，所以它只保证子列存在，造不出具体的下标。

      要具体造出来，得用到$\pi$的性质。若整数$p$、$q\ge1$满足$|q\pi-p|<\delta$，则$|\sin p|=|\sin(p-q\pi)|\le|p-q\pi|<\delta$（因为$\sin p=(-1)^q\sin(p-q\pi)$，又$|\sin x|\le|x|$）。很接近$\pi$的分数$\frac pq$就给出这样的$p$：把$\pi$展开成连分数（continued fraction），得到的渐近分数（convergent）依次是$\frac31,\ \frac{22}{7},\ \frac{333}{106},\ \frac{355}{113},\ \frac{103993}{33102},\dots$，分子对应的$\sin p$依次约为$0.14,\ -0.0089,\ -0.0088,\ -0.00003,\ -0.00002$。

      为什么有无穷多个：把$\pi,2\pi,\dots,Q\pi$的小数部分和$0$放在一起，共$Q+1$个数落在$[0,1)$里；把$[0,1)$分成$Q$段，必有两个落在同一段，相减就得到$1\le q\le Q$和整数$p$使$|q\pi-p|<\frac1Q$，这一步用的是抽屉原理（pigeonhole principle）。让$Q$越来越大，就得到$|\sin p|<\frac1Q$的无穷多个$p$，从中挑出递增的一串，就是收敛于$0$的子列。其实$[-1,1]$里的每个数都是$\{\sin n\}$某个子列的极限，那要用到$\pi$是无理数，证明更长。
  reference: |
    致密性定理的二分只断言某一半含无穷多项，不可构造。具体子列：若$|q\pi-p|<\delta$则$|\sin p|<\delta$；$p$取$\pi$渐近分数的分子$3,22,333,355,103993,\dots$，或由抽屉原理对每个$Q$找$|q\pi-p|<\frac1Q$，得收敛于$0$的子列。
