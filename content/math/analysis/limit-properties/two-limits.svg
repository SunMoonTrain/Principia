<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" font-size="14">
  <!-- 示意图：L₁、L₂ 各自的 ε 邻域（ε 取两者距离的一半）在中点相接，没有公共部分；数列的项从第 N 项以后全在上面那条带子里 -->
  <!-- L₁ 的 ε 邻域 -->
  <rect x="50" y="35" width="560" height="90" style="fill: var(--accent, #2563eb); opacity: 0.13" />
  <line x1="50" y1="35" x2="610" y2="35" stroke-width="1.2" stroke-dasharray="5 4" style="stroke: var(--accent, #2563eb)" />
  <!-- L₂ 的 ε 邻域 -->
  <rect x="50" y="125" width="560" height="90" style="fill: var(--good, #059669); opacity: 0.13" />
  <line x1="50" y1="215" x2="610" y2="215" stroke-width="1.2" stroke-dasharray="5 4" style="stroke: var(--good, #059669)" />
  <!-- 两条带子相接处 -->
  <line x1="50" y1="125" x2="610" y2="125" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" />
  <line x1="50" y1="80" x2="610" y2="80" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" opacity="0.5" />
  <line x1="50" y1="170" x2="610" y2="170" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" opacity="0.5" />
  <!-- 坐标轴 -->
  <line x1="50" y1="250" x2="612" y2="250" stroke="currentColor" stroke-width="1.5" />
  <path d="M 624 250 L 610 244 L 610 256 Z" fill="currentColor" />
  <text x="630" y="255" font-style="italic" fill="currentColor">n</text>
  <line x1="50" y1="250" x2="50" y2="28" stroke="currentColor" stroke-width="1.5" />
  <path d="M 50 16 L 44 30 L 56 30 Z" fill="currentColor" />
  <text x="42" y="85" text-anchor="end" fill="currentColor"><tspan font-style="italic">L</tspan><tspan dy="4" font-size="10">1</tspan></text>
  <text x="42" y="175" text-anchor="end" fill="currentColor"><tspan font-style="italic">L</tspan><tspan dy="4" font-size="10">2</tspan></text>
  <!-- 右边：两段半宽都是 ε -->
  <line x1="620" y1="85" x2="620" y2="120" stroke="currentColor" stroke-width="1.2" />
  <path d="M 620 80 L 616 88 L 624 88 Z M 620 125 L 616 117 L 624 117 Z" fill="currentColor" />
  <text x="628" y="107" font-style="italic" fill="currentColor">ε</text>
  <line x1="620" y1="130" x2="620" y2="165" stroke="currentColor" stroke-width="1.2" />
  <path d="M 620 125 L 616 133 L 624 133 Z M 620 170 L 616 162 L 624 162 Z" fill="currentColor" />
  <text x="628" y="152" font-style="italic" fill="currentColor">ε</text>
  <!-- 第 N 项 -->
  <line x1="204" y1="28" x2="204" y2="250" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 4" />
  <text x="204" y="269" text-anchor="middle" font-style="italic" fill="currentColor">N</text>
  <g style="fill: var(--muted, #6b7280)">
    <circle cx="72" cy="205" r="4" />
    <circle cx="94" cy="52" r="4" />
    <circle cx="116" cy="160" r="4" />
    <circle cx="138" cy="100" r="4" />
    <circle cx="160" cy="138" r="4" />
    <circle cx="182" cy="66" r="4" />
    <circle cx="204" cy="112" r="4" />
  </g>
  <g style="fill: var(--accent, #2563eb)">
    <circle cx="226" cy="92" r="4" />
    <circle cx="248" cy="70" r="4" />
    <circle cx="270" cy="88" r="4" />
    <circle cx="292" cy="74" r="4" />
    <circle cx="314" cy="86" r="4" />
    <circle cx="336" cy="76" r="4" />
    <circle cx="358" cy="84" r="4" />
    <circle cx="380" cy="77.5" r="4" />
    <circle cx="402" cy="83" r="4" />
    <circle cx="424" cy="78.5" r="4" />
    <circle cx="446" cy="82" r="4" />
    <circle cx="468" cy="79" r="4" />
    <circle cx="490" cy="81.5" r="4" />
    <circle cx="512" cy="79.5" r="4" />
    <circle cx="534" cy="81" r="4" />
    <circle cx="556" cy="79.8" r="4" />
    <circle cx="578" cy="80.7" r="4" />
    <circle cx="600" cy="80" r="4" />
  </g>
  <text x="410" y="56" text-anchor="middle" fill="currentColor"><tspan font-style="italic">n</tspan> &gt; <tspan font-style="italic">N</tspan> 的项全在 <tspan font-style="italic">L</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> 的 </tspan><tspan font-style="italic">ε</tspan> 邻域里</text>
  <text x="410" y="194" text-anchor="middle" fill="currentColor"><tspan font-style="italic">L</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> 的 </tspan><tspan font-style="italic">ε</tspan> 邻域：从某一项起，再也进不来</text>
</svg>
