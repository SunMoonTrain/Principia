- id: p1
  tier: easy
  statement: |
    用二分法逼近$\sqrt3$：令$[a_1,b_1]=[1,2]$；已有$[a_n,b_n]$时取中点$m$，若$m^2\le3$，令$[a_{n+1},b_{n+1}]=[m,b_n]$，否则令$[a_{n+1},b_{n+1}]=[a_n,m]$。求$[a_4,b_4]$，按$(a_4,b_4)$的顺序填写。
  answer:
    type: tuple
    value: [13/8, 7/4]
  hints:
    - |
      按规则做三次二分，每次只要把中点的平方和$3$比较。
    - |
      第一次的中点是$1.5$，$1.5^2=2.25\le3$，留下$[1.5,2]$；第二次的中点是$1.75$。
    - |
      $[1,2]$的中点$1.5$：$2.25\le3$，留下$[1.5,2]$。中点$1.75$：$3.0625>3$，留下$[1.5,1.75]$。中点$1.625$：$2.640625\le3$，留下$[1.625,1.75]$。

      所以$[a_4,b_4]=[1.625,1.75]$，填 `1.625, 1.75`。
  solution: |
    三次二分依次留下$[1.5,2]$、$[1.5,1.75]$、$[1.625,1.75]$，所以$(a_4,b_4)=(1.625,1.75)$。$\sqrt3\approx1.732$确实在这个区间里。

- id: p2
  tier: easy
  statement: |
    下面哪些区间族（$n=1,2,3,\dots$）的所有区间，公共点恰好只有一个？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\left[-\frac1n,\frac1n\right]$
      - |
        $\left(0,\frac1n\right)$
      - |
        $\left[0,1+\frac1n\right]$
      - |
        $\left[1-\frac1n,1+\frac{1}{n^2}\right]$
    value: [1, 4]
  hints:
    - |
      先看每一族是不是闭区间、是不是一个套一个、长度是不是趋于$0$；满足的用:term[闭区间套定理]{id="math.analysis.nested-interval-theorem"}，不满足的直接找公共点。
    - |
      A、D 都是闭区间套。B 不是闭区间；C 的长度趋于$1$。
    - |
      A：一个套一个，长度$\frac2n\to0$，公共点只有$0$。

      B：$0$不属于任何一个区间；任何$x>0$，在$\frac1n\le x$以后就不属于$\left(0,\frac1n\right)$，所以没有公共点。

      C：每个区间都包含$[0,1]$，而大于$1$的$x$在$1+\frac1n<x$以后就不在区间里，公共部分是$[0,1]$，有无穷多个点。

      D：左端点$1-\frac1n$递增，右端点$1+\frac{1}{n^2}$递减，长度$\frac1n+\frac{1}{n^2}\to0$，是闭区间套，公共点只有$1$。

      答案是 A 和 D。
  solution: |
    A、D 是闭区间套，公共点分别只有$0$和$1$。B 是开区间，没有公共点；C 的长度不趋于$0$，公共部分是整个$[0,1]$。

- id: p3
  tier: medium
  statement: |
    设$f(x)=x^3+x-1$，$f(0)<0<f(1)$。令$[a_1,b_1]=[0,1]$；已有$[a_n,b_n]$时取中点$m$，若$f(m)<0$，令$[a_{n+1},b_{n+1}]=[m,b_n]$，否则令$[a_{n+1},b_{n+1}]=[a_n,m]$。求$[a_5,b_5]$，按$(a_5,b_5)$的顺序填写。
  answer:
    type: tuple
    value: [5/8, 11/16]
  hints:
    - |
      做四次二分，每次算出中点处$f$的符号。
    - |
      四个中点依次是$0.5$、$0.75$、$0.625$、$0.6875$；$f(0.5)<0$，$f(0.75)>0$。
    - |
      $f(0.5)=-0.375<0$，留下$[0.5,1]$。$f(0.75)=0.171875>0$，留下$[0.5,0.75]$。$f(0.625)=-0.130859375<0$，留下$[0.625,0.75]$。$f(0.6875)=0.012451171875>0$，留下$[0.625,0.6875]$。

      所以$(a_5,b_5)=(0.625,0.6875)$，也就是$\left(\frac58,\frac{11}{16}\right)$。方程的根约为$0.6823$，确实在这个区间里。
  solution: |
    四个中点处$f$的符号依次是负、正、负、正，留下的区间依次是$[0.5,1]$、$[0.5,0.75]$、$[0.625,0.75]$、$[0.625,0.6875]$，填 `0.625, 0.6875`。

- id: p4
  tier: medium
  statement: |
    用二分法从$[a_1,b_1]=[1,2]$开始逼近$\sqrt2$，第$n$个区间$[a_n,b_n]$的长度是$\frac{1}{2^{n-1}}$，它的中点记作$c_n$。假如不知道$\sqrt2$的值，只知道它在$[a_n,b_n]$里，那么要保证$|c_n-\sqrt2|<10^{-6}$，$n$最小是多少？
  answer:
    type: number
    value: 20
  hints:
    - |
      只知道$\sqrt2$在区间里时，中点到它的距离最坏能有多大？
    - |
      中点到区间里任何一点的距离都不超过长度的一半，即$\frac{1}{2^n}$，而且这个界在端点附近几乎能达到。所以要找最小的$n$使$\frac{1}{2^n}<10^{-6}$。
    - |
      $|c_n-\sqrt2|\le\frac{b_n-a_n}{2}=\frac{1}{2^n}$；只知道$\sqrt2$在区间里时，它可能就在端点附近，误差可以接近$\frac{1}{2^n}$。所以要保证误差小于$10^{-6}$，需要$\frac{1}{2^n}<10^{-6}$，即$2^n>10^6$。

      $2^{19}=524288<10^6$，$2^{20}=1048576>10^6$，所以$n$最小是$20$。
  solution: |
    中点的误差不超过半个区间长$\frac{1}{2^n}$，而$2^{19}<10^6<2^{20}$，所以$n=20$。实际算下去，$n=19$时的误差碰巧已经小于$10^{-6}$，但只看区间长度保证不了这一点。

- id: p5
  tier: hard
  statement: |
    设闭区间$[a_n,b_n]$一个套一个：$[a_{n+1},b_{n+1}]\subseteq[a_n,b_n]$，但不要求长度趋于$0$。证明$\{a_n\}$、$\{b_n\}$都收敛；记$\alpha=\lim a_n$，$\beta=\lim b_n$，则所有区间的公共部分恰好是闭区间$[\alpha,\beta]$（特别地，公共部分不是空集）。
  hints:
    - |
      和定理的证明一样，先用:term[单调有界原理]{id="math.analysis.monotone-convergence-theorem"}得到$\alpha$、$\beta$。然后分两步：$[\alpha,\beta]$里的点都在每个区间里；每个区间都含的点都在$[\alpha,\beta]$里。
    - |
      关键是$\alpha\le\beta$：对任意$n$、$m$都有$a_n\le b_m$（取$k=\max\{n,m\}$，则$a_n\le a_k\le b_k\le b_m$）。
    - |
      由$a_1\le a_n\le a_{n+1}\le b_{n+1}\le b_n\le b_1$，$\{a_n\}$单调递增、以$b_1$为上界，$\{b_n\}$单调递减、以$a_1$为下界。由单调有界原理，$a_n\to\alpha=\sup\{a_n\}$，$b_n\to\beta=\inf\{b_n\}$。

      对任意$n$、$m$，取$k=\max\{n,m\}$，则$a_n\le a_k\le b_k\le b_m$。固定$m$，让$n\to\infty$，由保不等式性得$\alpha\le b_m$；再让$m\to\infty$，得$\alpha\le\beta$。所以$[\alpha,\beta]$是一个闭区间（$\alpha=\beta$时只有一个点）。

      若$x\in[\alpha,\beta]$，则对每个$n$，$a_n\le\alpha\le x\le\beta\le b_n$，$x$属于每个区间。反过来，若$x$属于每个区间，则$a_n\le x\le b_n$对所有$n$成立，由保不等式性得$\alpha\le x\le\beta$。所以公共部分恰好是$[\alpha,\beta]$。长度趋于$0$时$\alpha=\beta$，就回到闭区间套定理。
  reference: |
    $a_n$递增有上界$b_1$，$b_n$递减有下界$a_1$，分别收敛于$\alpha=\sup a_n$、$\beta=\inf b_n$。由$a_n\le a_k\le b_k\le b_m$（$k=\max\{n,m\}$）取极限得$\alpha\le\beta$。$[\alpha,\beta]$中的点满足$a_n\le\alpha\le x\le\beta\le b_n$；反之每个区间都含的$x$满足$a_n\le x\le b_n$，取极限得$x\in[\alpha,\beta]$。

- id: p6
  tier: hard
  statement: |
    设$f$定义在$[0,1]$上，取值也都在$[0,1]$里，并且单调递增：$x\le y$时$f(x)\le f(y)$（不要求$f$连续）。证明存在$\xi\in[0,1]$使$f(\xi)=\xi$。
  hints:
    - |
      用二分法构造闭区间套$[a_n,b_n]$，始终保持$f(a_n)\ge a_n$、$f(b_n)\le b_n$。一开始的$[0,1]$就满足这两条。
    - |
      取中点$m$：若$f(m)\ge m$，留下$[m,b_n]$，否则留下$[a_n,m]$（这时$f(m)<m$）。公共点$\xi$满足$a_n\le\xi\le b_n$，用单调性把$f(\xi)$和$f(a_n)$、$f(b_n)$比较。
    - |
      令$[a_1,b_1]=[0,1]$。$f$的值在$[0,1]$里，所以$f(0)\ge0$、$f(1)\le1$。已有满足$f(a_n)\ge a_n$、$f(b_n)\le b_n$的$[a_n,b_n]$时，取中点$m$：若$f(m)\ge m$，令$[a_{n+1},b_{n+1}]=[m,b_n]$；否则$f(m)<m$，令$[a_{n+1},b_{n+1}]=[a_n,m]$。两个条件一直保持，长度$\frac{1}{2^{n-1}}\to0$，所以这是:term[闭区间套]{id="math.analysis.nested-intervals"}，有公共点$\xi$，并且$a_n\to\xi$、$b_n\to\xi$。

      因为$a_n\le\xi\le b_n$，由单调性$f(a_n)\le f(\xi)\le f(b_n)$。于是

      $$
      a_n\le f(a_n)\le f(\xi),\qquad f(\xi)\le f(b_n)\le b_n .
      $$

      对第一串不等式让$n\to\infty$，由保不等式性得$\xi\le f(\xi)$；对第二串，得$f(\xi)\le\xi$。所以$f(\xi)=\xi$。

      整个证明没有用到$f$连续，只用了单调性和:term[闭区间套定理]{id="math.analysis.nested-interval-theorem"}。
  reference: |
    二分构造闭区间套并保持$f(a_n)\ge a_n$、$f(b_n)\le b_n$。公共点$\xi$满足$a_n\le f(a_n)\le f(\xi)$与$f(\xi)\le f(b_n)\le b_n$，取极限得$\xi\le f(\xi)\le\xi$。不需要连续性。

- id: p7
  tier: thinking
  statement: |
    例 2 说明$[0,1]$里的实数排不成一列。可是$[0,1]$里的有理数能排成一列：按分母从小到大、分母相同时按分子从小到大，写成$0,1,\frac12,\frac13,\frac23,\frac14,\frac34,\dots$（约分后重复的跳过）。把例 2 的论证原样用在这一列有理数上，会在哪一步卡住？这说明了什么？
  hints:
    - |
      例 2 的每一步在这里都能照做吗？最后由闭区间套定理得到的$\xi$，是有理数吗？
    - |
      三等分、躲开$x_n$这些步骤照样能做，最后也确实得到$\xi$；可$\xi$不等于这一列里的任何一项，而这一列包含了$[0,1]$里的所有有理数。
    - |
      每一步都照做得了：三等分，选一个不含$x_n$的闭区间，得到一个闭区间套。在$\R$里，闭区间套定理给出公共点$\xi$，它不等于任何$x_n$；而$\{x_n\}$包含了$[0,1]$里所有的有理数，所以$\xi$一定是无理数。论证没有出错，结论「$\xi$不在这一列里」也不矛盾，只说明它不是有理数。

      如果只在$\Q$里讨论，就卡在最后一步：这串区间在$\Q$里没有公共点，闭区间套定理在$\Q$里不成立。两件事放在一起看：有理数能排成一列，实数不能，差别正好来自完备性。实数比有理数「多得多」，多出来的正是补洞用的无理数。
  reference: |
    前面各步照做，在$\R$中得到的公共点$\xi$不等于任何有理数，故是无理数，不矛盾。在$\Q$中卡在最后一步：区间套没有有理公共点，定理不成立。有理数可列而实数不可列，差别来自完备性。

- id: p8
  tier: thinking
  statement: |
    二分法每一步把区间长度减半；[单调有界数列](lesson:math.analysis.bounded-monotone)例 2 的巴比伦算法（Babylonian method）$a_{n+1}=\frac12\left(a_n+\frac{2}{a_n}\right)$收敛得快得多。比较一下：要把$\sqrt2$算到误差小于$10^{-12}$，两种方法各大约要多少步？二分法有什么巴比伦算法没有的好处？
  hints:
    - |
      二分法第$n$个区间的中点误差小于$\frac{1}{2^n}$。对巴比伦算法，试着把$a_{n+1}-\sqrt2$用$a_n-\sqrt2$表示出来。
    - |
      $a_{n+1}-\sqrt2=\frac{(a_n-\sqrt2)^2}{2a_n}$：误差大致每步平方一次，准确的位数每步约翻一倍。二分法每步只多一位二进制数字。
    - |
      二分法：要$\frac{1}{2^n}<10^{-12}$，需要$2^n>10^{12}$，即$n\ge40$，大约 40 步。

      巴比伦算法：$a_{n+1}-\sqrt2=\frac{(a_n-\sqrt2)^2}{2a_n}$。从$a_1=2$出发，误差依次约为$0.59$、$0.086$、$0.0025$、$2.1\times10^{-6}$、$1.6\times10^{-12}$、$10^{-24}$量级，大约 5 步。

      二分法的好处：每一步都确切知道答案在哪个区间里，误差上界有保证；只要能判断「大了还是小了」（比如函数值的符号）就能用，不需要方程有特殊的结构或可以求导；从任何一个含根的区间出发都一定成功。巴比伦算法是牛顿法（Newton's method）的一个特例，收敛快，可对一般的方程，初值选得不好可能不收敛，误差也要另外估计。实际计算里常把两者结合：先用二分法缩小范围，再用快的方法收尾。
  reference: |
    二分法约需 40 步（$2^{40}>10^{12}$）；巴比伦算法误差满足$e_{n+1}=\frac{e_n^2}{2a_n}$，约 5 步。二分法每步都有确定的误差界，只需判断符号，总能成功；快速算法依赖初值和方程结构。
