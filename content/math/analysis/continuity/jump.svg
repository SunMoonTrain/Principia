<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-size="14">
  <!-- 跳跃间断：x < 2 时 f(x) = 0.25x + 0.9，x ≥ 2 时 f(x) = 0.25x + 1.9；横坐标 px = 100 + 130(x − 0.2)，纵坐标 py = 300 − 85y -->
  <!-- 横带：f(2) ± ε₀，f(2) = 2.4，ε₀ = 0.5；竖带：2 ± δ，δ = 0.45 -->
  <rect x="90" y="53.5" width="510" height="85" style="fill: var(--accent, #2563eb)" fill-opacity="0.12" />
  <rect x="275.5" y="26" width="117" height="274" style="fill: var(--good, #059669)" fill-opacity="0.14" />
  <line x1="90" y1="300" x2="610" y2="300" stroke="currentColor" stroke-width="1.2" />
  <line x1="90" y1="300" x2="90" y2="22" stroke="currentColor" stroke-width="1.2" />
  <text x="618" y="304" fill="currentColor"><tspan font-style="italic">x</tspan></text>
  <line x1="90" y1="138.5" x2="600" y2="138.5" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6" />
  <line x1="90" y1="96" x2="600" y2="96" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6" />
  <line x1="90" y1="53.5" x2="600" y2="53.5" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6" />
  <line x1="275.5" y1="26" x2="275.5" y2="300" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6" />
  <line x1="334" y1="26" x2="334" y2="300" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6" />
  <line x1="392.5" y1="26" x2="392.5" y2="300" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6" />
  <line x1="113" y1="217.12" x2="334" y2="181" stroke="currentColor" stroke-width="1.6" />
  <line x1="334" y1="96" x2="594" y2="53.5" stroke="currentColor" stroke-width="1.6" />
  <line x1="275.5" y1="190.56" x2="334" y2="181" stroke-width="3.2" style="stroke: var(--accent, #2563eb)" />
  <circle cx="334" cy="181" r="4.5" style="fill: var(--bg, #ffffff)" stroke="currentColor" stroke-width="1.6" />
  <circle cx="334" cy="96" r="4.5" fill="currentColor" />
  <g text-anchor="end" font-size="13" fill="currentColor">
    <text x="84" y="58.5"><tspan font-style="italic">f</tspan>(<tspan font-style="italic">a</tspan>) + <tspan font-style="italic">ε</tspan><tspan dy="4" font-size="10">0</tspan></text>
    <text x="84" y="101"><tspan font-style="italic">f</tspan>(<tspan font-style="italic">a</tspan>)</text>
    <text x="84" y="143.5"><tspan font-style="italic">f</tspan>(<tspan font-style="italic">a</tspan>) − <tspan font-style="italic">ε</tspan><tspan dy="4" font-size="10">0</tspan></text>
  </g>
  <g text-anchor="middle" font-size="13" fill="currentColor">
    <text x="269.5" y="320"><tspan font-style="italic">a</tspan> − <tspan font-style="italic">δ</tspan></text>
    <text x="334" y="320"><tspan font-style="italic">a</tspan></text>
    <text x="398.5" y="320"><tspan font-style="italic">a</tspan> + <tspan font-style="italic">δ</tspan></text>
  </g>
  <text x="236" y="218" fill="currentColor" font-size="13">竖带左半边的函数值都在横带下面</text>
</svg>
