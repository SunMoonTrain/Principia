  <text x="613" y="206" text-anchor="middle" font-size="12" fill="currentColor"><tspan font-style="italic">x</tspan> = 1：发散</text>
  <text x="495" y="80" text-anchor="middle" font-size="12" fill="currentColor">Σ <tspan font-style="italic">x</tspan><tspan baseline-shift="super" font-size="9"><tspan font-style="italic">n</tspan></tspan>/<tspan font-style="italic">n</tspan>，收敛半径 <tspan font-style="italic">R</tspan> = 1</text>
  <text x="495" y="284" text-anchor="middle" font-size="12" fill="currentColor">端点要单独判断</text>
