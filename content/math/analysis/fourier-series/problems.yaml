- id: p1
  tier: easy
  statement: |
    设$f(x)=x^2$（$-\pi\le x\le\pi$）。求它的:term[傅里叶系数]{id="math.analysis.fourier-coefficients"}$a_0$。
  answer:
    type: number
    value: 2*pi^2/3
  hints:
    - |
      $a_0=\frac1\pi\int_{-\pi}^{\pi}f(x)\cos0x\dd x$，而$\cos0x=1$。
    - |
      $a_0=\frac1\pi\int_{-\pi}^{\pi}x^2\dd x$。
    - |
      $a_0=\frac1\pi\int_{-\pi}^{\pi}x^2\dd x=\frac1\pi\cdot\frac{2\pi^3}{3}=\frac{2\pi^2}{3}\approx6.580$。
  solution: |
    $a_0=\frac1\pi\int_{-\pi}^{\pi}x^2\dd x=\frac{2\pi^2}{3}$，填 `2*pi^2/3`。

- id: p2
  tier: easy
  statement: |
    设$f(x)=3+2\cos4x-\sin5x$。求它的傅里叶系数$a_0$和$a_4$，按$a_0$、$a_4$的顺序填。
  answer:
    type: tuple
    value: [6, 2]
  hints:
    - |
      $f$是三角多项式，用定理 2。注意常数项和$a_0$的关系。
    - |
      傅里叶级数的常数项是$\frac{a_0}{2}$。
    - |
      由定理 2，$f$的傅里叶系数就是它自己的系数：常数项$\frac{a_0}{2}=3$，所以$a_0=6$；$\cos4x$的系数是$2$，所以$a_4=2$。也可以直接算$a_0=\frac1\pi\int_{-\pi}^{\pi}f(x)\dd x=\frac1\pi\cdot3\cdot2\pi=6$。
  solution: |
    常数项$\frac{a_0}{2}=3$，所以$a_0=6$；$a_4=2$。填 `6, 2`。

- id: p3
  tier: medium
  statement: |
    设$f(x)=|x|$（$-\pi\le x\le\pi$）。求它的傅里叶系数$a_3$。
  answer:
    type: number
    value: -4/(9*pi)
  hints:
    - |
      $f$是偶函数，用定理 3 化成$[0,\pi]$上的积分，再分部积分。
    - |
      $a_n=\frac2\pi\int_0^\pi x\cos nx\dd x$，$x\cos nx$的一个原函数是$\frac{x\sin nx}{n}+\frac{\cos nx}{n^2}$。
    - |
      由定理 3，$a_n=\frac2\pi\int_0^\pi x\cos nx\dd x=\frac2\pi\Bigl[\frac{x\sin nx}{n}+\frac{\cos nx}{n^2}\Bigr]_0^\pi=\frac{2\bigl((-1)^n-1\bigr)}{\pi n^2}$。$n=3$时$(-1)^3-1=-2$，所以$a_3=-\frac{4}{9\pi}\approx-0.1415$。
  solution: |
    $a_n=\frac{2((-1)^n-1)}{\pi n^2}$，所以$a_3=-\frac{4}{9\pi}$，填 `-4/(9*pi)`。

- id: p4
  tier: medium
  statement: |
    把$f(t)=1-t^2$（$-1\le t\le1$）看成周期为$2$的函数的一段，求它的傅里叶系数$a_0$和$a_1$，按$a_0$、$a_1$的顺序填。
  answer:
    type: tuple
    value: [4/3, 4/pi^2]
  hints:
    - |
      这里$L=1$，$a_n=\int_{-1}^{1}f(t)\cos n\pi t\dd t$。
    - |
      $a_0=\int_{-1}^{1}(1-t^2)\dd t$；$n\ge1$时$\int_{-1}^1\cos n\pi t\dd t=0$，所以$a_n=-\int_{-1}^{1}t^2\cos n\pi t\dd t$，分部积分两次。
    - |
      $a_0=\int_{-1}^{1}(1-t^2)\dd t=2-\frac23=\frac43$。分部积分两次得$\int_{-1}^1t^2\cos n\pi t\dd t=\frac{4(-1)^n}{n^2\pi^2}$，所以$a_n=-\frac{4(-1)^n}{n^2\pi^2}$，$a_1=\frac{4}{\pi^2}\approx0.4053$。
  solution: |
    $a_0=\frac43$，$a_n=-\frac{4(-1)^n}{n^2\pi^2}$，$a_1=\frac{4}{\pi^2}$。填 `4/3, 4/pi^2`。

- id: p5
  tier: hard
  statement: |
    设$f$在$[-\pi,\pi]$上有:term[连续]{id="math.analysis.continuous-function"}（continuous）的导数。证明有常数$C$，使$f$的傅里叶系数对所有$n\ge1$满足$|a_n|\le\frac Cn$、$|b_n|\le\frac Cn$。
  hints:
    - |
      对$a_n=\frac1\pi\int_{-\pi}^{\pi}f(x)\cos nx\dd x$分部积分，把导数挪到$f$上。
    - |
      $a_n=\frac1\pi\Bigl[\frac{f(x)\sin nx}{n}\Bigr]_{-\pi}^{\pi}-\frac{1}{n\pi}\int_{-\pi}^{\pi}f'(x)\sin nx\dd x$，第一项是$0$。$b_n$的边界项不一定是$0$，但绝对值不超过$\frac{|f(\pi)|+|f(-\pi)|}{n\pi}$。
    - |
      分部积分：$a_n=-\frac{1}{n\pi}\int_{-\pi}^{\pi}f'(x)\sin nx\dd x$（边界项里$\sin(\pm n\pi)=0$），所以$|a_n|\le\frac{1}{n\pi}\int_{-\pi}^{\pi}|f'(x)|\dd x$。$b_n=\frac1\pi\Bigl[-\frac{f(x)\cos nx}{n}\Bigr]_{-\pi}^{\pi}+\frac{1}{n\pi}\int_{-\pi}^{\pi}f'(x)\cos nx\dd x$，所以$|b_n|\le\frac{|f(\pi)|+|f(-\pi)|}{n\pi}+\frac{1}{n\pi}\int_{-\pi}^{\pi}|f'(x)|\dd x$。

      取$C=\frac1\pi\Bigl(|f(\pi)|+|f(-\pi)|+\int_{-\pi}^{\pi}|f'(x)|\dd x\Bigr)$即可。$f'$连续，$|f'|$可积，$C$是有限数。函数越光滑，系数衰减得越快：例 1 的锯齿波（周期延拓后有跳跃）系数是$\frac1n$量级，第 3 题的$|x|$（延拓后连续，只有尖角）系数是$\frac{1}{n^2}$量级。
  reference: |
    分部积分得$a_n=-\frac{1}{n\pi}\int f'\sin nx\dd x$，$b_n=\frac{(-1)^{n+1}(f(\pi)-f(-\pi))}{n\pi}+\frac{1}{n\pi}\int f'\cos nx\dd x$。

    所以$|a_n|,|b_n|\le\frac Cn$，$C=\frac1\pi\bigl(|f(\pi)|+|f(-\pi)|+\int_{-\pi}^{\pi}|f'|\bigr)$。

- id: p6
  tier: hard
  statement: |
    设$f$以$2\pi$为周期，在每个有限区间上可积。(1) 证明$\int_a^{a+2\pi}f(x)\dd x$与$a$无关。(2) 记$g(x)=f(x+c)$（$c$是常数），证明$g$和$f$的傅里叶系数满足$a_n(g)^2+b_n(g)^2=a_n(f)^2+b_n(f)^2$。
  hints:
    - |
      (1) 把$\int_a^{a+2\pi}$拆成$\int_a^\pi+\int_\pi^{a+2\pi}$，在第二段里令$x=t+2\pi$。(2) 先由 (1) 和换元写出$a_n(g)$、$b_n(g)$。
    - |
      $a_n(g)=\frac1\pi\int_{-\pi}^{\pi}f(t)\cos n(t-c)\dd t$，展开$\cos n(t-c)$。
    - |
      (1) 不妨设$-\pi\le a\le\pi$（一般情形先平移若干个周期）。$\int_a^{a+2\pi}f=\int_a^\pi f+\int_\pi^{a+2\pi}f$，在第二段令$x=t+2\pi$，由周期性它等于$\int_{-\pi}^{a}f$，两段相加是$\int_{-\pi}^{\pi}f$，与$a$无关。

      (2) 令$t=x+c$，由 (1)（被积函数仍以$2\pi$为周期），$a_n(g)=\frac1\pi\int_{-\pi}^{\pi}f(x+c)\cos nx\dd x=\frac1\pi\int_{-\pi}^{\pi}f(t)\cos n(t-c)\dd t$。展开得$a_n(g)=a_n(f)\cos nc+b_n(f)\sin nc$；同理$b_n(g)=b_n(f)\cos nc-a_n(f)\sin nc$。

      这是把$(a_n(f),b_n(f))$旋转了角$nc$，长度不变，所以$a_n(g)^2+b_n(g)^2=a_n(f)^2+b_n(f)^2$。平移只改变每个频率的相位（phase），不改变振幅（amplitude）。
  reference: |
    (1) $\int_a^{a+2\pi}f=\int_a^\pi f+\int_\pi^{a+2\pi}f$，第二段平移$2\pi$后等于$\int_{-\pi}^af$，相加为$\int_{-\pi}^\pi f$。

    (2) 由 (1) 换元，$a_n(g)=a_n\cos nc+b_n\sin nc$，$b_n(g)=b_n\cos nc-a_n\sin nc$，是$(a_n,b_n)$转过角$nc$，平方和不变。

- id: p7
  tier: thinking
  statement: |
    泰勒级数和傅里叶级数都把函数展开成一串简单函数之和。它们对函数的要求有什么不同？系数分别由函数的哪些信息决定？以$f(x)=|x|$为例说说。
  hints:
    - |
      泰勒系数是$\frac{f^{(n)}(0)}{n!}$，傅里叶系数是积分。各要$f$满足什么条件才有定义？
    - |
      $|x|$在$0$处不:term[可导]{id="math.analysis.differentiable-function"}（differentiable），没有泰勒展开；它的傅里叶系数却都算得出来（第 3 题）。泰勒系数只看一点附近，傅里叶系数看整个周期。
    - |
      泰勒级数要$f$在一点任意阶可导，系数$\frac{f^{(n)}(0)}{n!}$只由$f$在这一点附近的样子决定：改动远处的$f$，系数不变。傅里叶级数只要$f$在一个周期上可积，系数是整个周期上的积分，改动任何一段都可能改变每一个系数，改动单独一点却什么都不改变。

      $|x|$在$0$处不可导，没有泰勒展开；它的傅里叶系数却照样算得出来（第 3 题），对尖角毫不在乎。反过来，泰勒级数适合描述一点附近的局部行为，傅里叶级数适合描述整体的周期行为，比如把信号分解成不同频率的成分。
  reference: |
    泰勒：要求任意阶可导，系数由一点处的各阶导数决定，是局部信息。傅里叶：只要求可积，系数是整个周期上的积分，是整体信息；改变一点不影响系数，改变一段影响所有系数。

    $|x|$没有泰勒展开（$0$处不可导），却有傅里叶级数（系数见第 3 题）。

- id: p8
  tier: thinking
  statement: |
    把$\int_{-\pi}^{\pi}f(x)g(x)\dd x$看成函数的「点积」。在这个类比下，三角函数系像什么？傅里叶系数又像什么？有限维的向量和函数比，哪里不一样？
  hints:
    - |
      空间里的向量在一组两两垂直的单位向量（unit vector）下，坐标怎样用点积求出来？
    - |
      把$\frac{1}{\sqrt{2\pi}},\frac{\cos nx}{\sqrt\pi},\frac{\sin nx}{\sqrt\pi}$看成「单位向量」，它们两两正交、长度都是$1$。
    - |
      空间向量$\mathbf v$在两两垂直的单位向量$\mathbf e_1,\mathbf e_2,\mathbf e_3$下的坐标是$\mathbf v\cdot\mathbf e_i$，并且$\mathbf v=\sum(\mathbf v\cdot\mathbf e_i)\mathbf e_i$。函数也一样：$\frac{1}{\sqrt{2\pi}},\frac{\cos nx}{\sqrt\pi},\frac{\sin nx}{\sqrt\pi}$两两正交、「长度」都是$1$（定理 1），$f$与$\frac{\cos nx}{\sqrt\pi}$的点积是$\sqrt\pi\,a_n$，傅里叶系数就是坐标（只差一个常数因子）。

      不一样的地方：这里有无穷多个「坐标轴」，$f=\sum(\text{坐标})\cdot(\text{单位向量})$变成了无穷级数，要问它收敛不收敛、收敛到什么，这正是后面两节的问题。另外，长度为$0$的「向量」不一定是零函数（在有限个点上不为$0$也行），所以「坐标相同的函数相等」也要打折扣。这个类比在[贝塞尔不等式与帕塞瓦尔等式](lesson:math.analysis.parseval)里会严格化。
  reference: |
    三角函数系（归一化以后）像一组两两垂直的单位向量；傅里叶系数像坐标（差一个常数因子），由点积求出。

    不同：坐标轴有无穷多个，展开式是无穷级数，有收敛问题；「长度」为$0$的函数不一定处处为$0$。帕塞瓦尔等式是这个类比里的勾股定理。
