<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" font-size="14">
  <!-- 乘法法则的几何意义：aₙbₙ − ab 是大矩形减去小矩形，正好拆成两条窄带 b(aₙ − a) 和 aₙ(bₙ − b) -->
  <!-- 两条窄带 -->
  <rect x="420" y="90" width="60" height="160" style="fill: var(--accent, #2563eb); opacity: 0.28" />
  <rect x="120" y="50" width="360" height="40" style="fill: var(--good, #059669); opacity: 0.28" />
  <!-- 小矩形 a × b 和大矩形 aₙ × bₙ -->
  <rect x="120" y="90" width="300" height="160" fill="none" stroke="currentColor" stroke-width="1.6" />
  <rect x="120" y="50" width="360" height="200" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" />
  <text x="270" y="176" text-anchor="middle" font-size="16" fill="currentColor"><tspan font-style="italic">ab</tspan></text>
  <text x="300" y="75" text-anchor="middle" fill="currentColor"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="10" font-style="italic">n</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">b</tspan><tspan dy="4" font-size="10" font-style="italic">n</tspan><tspan dy="-4"> − </tspan><tspan font-style="italic">b</tspan>)</text>
  <!-- 右边窄带的标注引到外面 -->
  <line x1="480" y1="170" x2="508" y2="170" stroke="currentColor" stroke-width="1" />
  <text x="514" y="175" fill="currentColor"><tspan font-style="italic">b</tspan>(<tspan font-style="italic">a</tspan><tspan dy="4" font-size="10" font-style="italic">n</tspan><tspan dy="-4"> − </tspan><tspan font-style="italic">a</tspan>)</text>
  <!-- 底边：a 和 aₙ − a -->
  <line x1="120" y1="262" x2="120" y2="276" stroke="currentColor" stroke-width="1" />
  <line x1="420" y1="262" x2="420" y2="276" stroke="currentColor" stroke-width="1" />
  <line x1="480" y1="262" x2="480" y2="276" stroke="currentColor" stroke-width="1" />
  <line x1="120" y1="269" x2="420" y2="269" stroke="currentColor" stroke-width="1" />
  <line x1="420" y1="269" x2="480" y2="269" stroke="currentColor" stroke-width="1" />
  <text x="270" y="293" text-anchor="middle" font-style="italic" fill="currentColor">a</text>
  <text x="450" y="293" text-anchor="middle" fill="currentColor"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="10" font-style="italic">n</tspan><tspan dy="-4"> − </tspan><tspan font-style="italic">a</tspan></text>
  <!-- 左边：b 和 bₙ − b -->
  <line x1="94" y1="250" x2="108" y2="250" stroke="currentColor" stroke-width="1" />
  <line x1="94" y1="90" x2="108" y2="90" stroke="currentColor" stroke-width="1" />
  <line x1="94" y1="50" x2="108" y2="50" stroke="currentColor" stroke-width="1" />
  <line x1="101" y1="90" x2="101" y2="250" stroke="currentColor" stroke-width="1" />
  <line x1="101" y1="50" x2="101" y2="90" stroke="currentColor" stroke-width="1" />
  <text x="88" y="175" text-anchor="end" font-style="italic" fill="currentColor">b</text>
  <text x="88" y="75" text-anchor="end" fill="currentColor"><tspan font-style="italic">b</tspan><tspan dy="4" font-size="10" font-style="italic">n</tspan><tspan dy="-4"> − </tspan><tspan font-style="italic">b</tspan></text>
  <text x="300" y="30" text-anchor="middle" style="fill: var(--muted, #6b7280)">虚线框是 <tspan font-style="italic">a</tspan><tspan dy="4" font-size="10" font-style="italic">n</tspan><tspan dy="-4"> × </tspan><tspan font-style="italic">b</tspan><tspan dy="4" font-size="10" font-style="italic">n</tspan><tspan dy="-4">，实线框是 </tspan><tspan font-style="italic">a</tspan> × <tspan font-style="italic">b</tspan></text>
</svg>
