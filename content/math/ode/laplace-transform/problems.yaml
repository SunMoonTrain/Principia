- id: p1
  tier: easy
  statement: |
    求$f(t)=e^{2t}$的:term[拉普拉斯变换]{id="math.ode.laplace-transform"}（Laplace transform）在$s=5$处的值。
  answer:
    type: number
    value: 1/3
  hints:
    - |
      $\int_0^{+\infty}e^{-st}e^{2t}\dd t=\int_0^{+\infty}e^{-(s-2)t}\dd t$。
    - |
      $s>2$时这个积分等于$\frac{1}{s-2}$。
    - |
      $\int_0^{+\infty}e^{-(s-2)t}\dd t=\Bigl[-\frac{e^{-(s-2)t}}{s-2}\Bigr]_0^{+\infty}=\frac{1}{s-2}$（$s>2$），在$s=5$处等于$\frac13$。
  solution: |
    $F(s)=\frac{1}{s-2}$，$F(5)=\frac13$，填 `1/3`。

- id: p2
  tier: easy
  statement: |
    求$f(t)=t^2$的拉普拉斯变换在$s=2$处的值。
  answer:
    type: number
    value: 1/4
  hints:
    - |
      查表：$\mathcal L\{t^n\}=\frac{n!}{s^{n+1}}$。
    - |
      $n=2$时$F(s)=\frac{2}{s^3}$。
    - |
      $\mathcal L\{t^2\}=\frac{2!}{s^3}=\frac{2}{s^3}$，$s=2$时等于$\frac28=\frac14$。也可以分部积分两次直接算。
  solution: |
    $F(s)=\frac{2}{s^3}$，$F(2)=\frac14$，填 `1/4`。

- id: p3
  tier: medium
  statement: |
    求$f(t)=e^{-t}\cos2t$的拉普拉斯变换在$s=2$处的值。
  answer:
    type: number
    value: 3/13
  hints:
    - |
      先写出$\mathcal L\{\cos2t\}$，再用平移：乘$e^{-t}$相当于把$s$换成$s+1$。
    - |
      $\mathcal L\{\cos2t\}=\frac{s}{s^2+4}$，所以$\mathcal L\{e^{-t}\cos2t\}=\frac{s+1}{(s+1)^2+4}$。
    - |
      由平移，$F(s)=\frac{s+1}{(s+1)^2+4}$，$F(2)=\frac{3}{9+4}=\frac{3}{13}$。
  solution: |
    $F(s)=\frac{s+1}{(s+1)^2+4}$，$F(2)=\frac{3}{13}$，填 `3/13`。

- id: p4
  tier: medium
  statement: |
    设$F(s)=\frac{2}{(s+3)^3}$，求它的:term[拉普拉斯逆变换]{id="math.ode.inverse-laplace-transform"}（inverse Laplace transform）$f(t)$在$t=1$处的值。
  answer:
    type: number
    value: exp(-3)
  hints:
    - |
      $\frac{2}{s^3}$是谁的变换？$s$换成$s+3$又对应什么？
    - |
      $\mathcal L\{t^2\}=\frac{2}{s^3}$；把$s$换成$s+3$，对应乘上$e^{-3t}$。
    - |
      $\frac{2}{(s+3)^3}$是$\frac{2}{s^3}$平移到$s+3$的结果，所以$f(t)=t^2e^{-3t}$，$f(1)=e^{-3}\approx0.04979$。
  solution: |
    $f(t)=t^2e^{-3t}$，$f(1)=e^{-3}$，填 `exp(-3)`。

- id: p5
  tier: hard
  statement: |
    设$f$在$[0,+\infty)$上连续，$f'$分段连续，并且$|f(t)|\le Me^{at}$对所有$t\ge0$成立。证明：$s>a$时$\mathcal L\{f'\}=sF(s)-f(0)$。
  hints:
    - |
      在$[0,T]$上分部积分，再让$T\to+\infty$。$f'$只是分段连续时，在每一段上分别分部积分。
    - |
      $\int_0^Te^{-st}f'(t)\dd t=e^{-sT}f(T)-f(0)+s\int_0^Te^{-st}f(t)\dd t$，看$e^{-sT}f(T)$的极限。
    - |
      设$f'$在$0=t_0<t_1<\dots<t_k=T$的每一段上连续，在每一段上分部积分再相加；$f$连续，中间各点的边界项两两抵消，得$\int_0^Te^{-st}f'(t)\dd t=e^{-sT}f(T)-f(0)+s\int_0^Te^{-st}f(t)\dd t$。

      $|e^{-sT}f(T)|\le Me^{-(s-a)T}\to0$（$s>a$），而$\int_0^Te^{-st}f(t)\dd t\to F(s)$。所以左边当$T\to+\infty$时也有极限，就是$\mathcal L\{f'\}=sF(s)-f(0)$。
  reference: |
    分段分部积分，中间的边界项因$f$连续而抵消，得$\int_0^Te^{-st}f'\dd t=e^{-sT}f(T)-f(0)+s\int_0^Te^{-st}f\dd t$。$s>a$时$e^{-sT}f(T)\to0$，令$T\to+\infty$即得。

- id: p6
  tier: hard
  statement: |
    用归纳法证明$\mathcal L\{t^n\}=\frac{n!}{s^{n+1}}$（$s>0$，$n=0,1,2,\dots$）。
  hints:
    - |
      $n=0$已知。从$t^{n}$到$t^{n+1}$，用分部积分，或者用导数的变换。
    - |
      $f=t^{n+1}$满足$f'=(n+1)t^n$、$f(0)=0$，所以$\mathcal L\{f'\}=s\mathcal L\{f\}$。
    - |
      $n=0$时$\mathcal L\{1\}=\frac1s$。设对$n$成立。$f(t)=t^{n+1}$连续、是指数阶的（$t^{n+1}\le C_ne^{t}$），$f(0)=0$，由导数的变换，$\mathcal L\{(n+1)t^n\}=s\mathcal L\{t^{n+1}\}$。所以$\mathcal L\{t^{n+1}\}=\frac{n+1}{s}\cdot\frac{n!}{s^{n+1}}=\frac{(n+1)!}{s^{n+2}}$。

      直接分部积分也一样：$\int_0^{+\infty}e^{-st}t^{n+1}\dd t=\Bigl[-\frac{t^{n+1}e^{-st}}{s}\Bigr]_0^{+\infty}+\frac{n+1}{s}\int_0^{+\infty}e^{-st}t^n\dd t$，边界项为零，因为$s>0$时$t^{n+1}e^{-st}\to0$。
  reference: |
    $n=0$时为$\frac1s$。由$\mathcal L\{(t^{n+1})'\}=s\mathcal L\{t^{n+1}\}-0$得$\mathcal L\{t^{n+1}\}=\frac{n+1}{s}\mathcal L\{t^n\}=\frac{(n+1)!}{s^{n+2}}$。

- id: p7
  tier: thinking
  statement: |
    为什么$e^{t^2}$没有拉普拉斯变换？$\frac1t$呢？由此说说「指数阶」这个条件管的是什么，还有什么它管不到。
  hints:
    - |
      $e^{-st}e^{t^2}=e^{t^2-st}$，$t$很大时它趋于什么？
    - |
      $t^2-st\to+\infty$，被积函数不趋于$0$。$\frac1t$的问题在$t=0$附近。
    - |
      对任何$s$，$t>s$以后$t^2-st>0$，$e^{t^2-st}>1$，积分在$+\infty$处发散，所以$e^{t^2}$没有变换：它比任何$e^{at}$长得都快，不是指数阶的。

      $\frac1t$在远处很小，是指数阶的，可它在$0$附近$\int_0^1\frac{\dd t}{t}$发散，变换同样不存在。指数阶只管$t\to+\infty$时增长得快不快；在有限的地方，还要求$f$可积，例如分段连续。
  reference: |
    $e^{t^2-st}$在$t>s$后大于$1$，积分发散，$e^{t^2}$不是指数阶。$\frac1t$是指数阶，但在$0$附近不可积。指数阶只管无穷远处的增长，有限处还要可积。

- id: p8
  tier: thinking
  statement: |
    [幂级数](lesson:math.calculus.power-series)（power series）$\sum_{n=0}^{\infty}a_nx^n$把一列数$a_n$变成一个函数。如果把下标$n$换成连续的$t$，求和换成积分，$x^n$换成$x^t$，会得到什么？它和拉普拉斯变换有什么关系？
  hints:
    - |
      写出$\int_0^{+\infty}f(t)x^t\dd t$，再令$x=e^{-s}$。
    - |
      $x^t=e^{t\ln x}$，$x=e^{-s}$时$x^t=e^{-st}$。
    - |
      $\sum a_nx^n$的连续版本是$\int_0^{+\infty}f(t)x^t\dd t$。令$x=e^{-s}$，$x^t=e^{-st}$，它就是$\int_0^{+\infty}e^{-st}f(t)\dd t=F(s)$。$0<x<1$对应$s>0$，幂级数在$|x|<1$里收敛，对应变换在$s>0$的范围存在。

      两者的很多性质也对得上：幂级数逐项求导（term-by-term differentiation）、移位下标，对应拉普拉斯变换里的「乘以$s$」和「平移」。所以拉普拉斯变换可以看成「连续的幂级数」，用一个函数$F(s)$把整个$f$编码起来。
  reference: |
    连续版本是$\int_0^{+\infty}f(t)x^t\dd t$，令$x=e^{-s}$即得$F(s)$；$|x|<1$对应$s>0$。拉普拉斯变换是幂级数的连续类比，求导、平移对应级数的运算。
