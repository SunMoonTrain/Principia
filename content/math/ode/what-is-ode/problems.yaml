- id: p1
  tier: easy
  statement: |
    已知$y=x^r$（$x>0$）是方程$x^2y''-2xy'+2y=0$的解。求$r$所有可能的值。
  answer:
    type: set
    value: [1, 2]
  hints:
    - |
      把$y=x^r$代进方程，看$r$要满足什么条件。
    - |
      $y'=rx^{r-1}$，$y''=r(r-1)x^{r-2}$，代入后每一项都含$x^r$。
    - |
      代入得$r(r-1)x^r-2rx^r+2x^r=(r^2-3r+2)x^r=0$。$x>0$时$x^r\ne0$，所以$r^2-3r+2=0$，$r=1$或$r=2$。
  solution: |
    代入得$(r^2-3r+2)x^r=0$，所以$r=1$或$2$，填 `1, 2`。

- id: p2
  tier: easy
  statement: |
    下面哪些是二阶:term[常微分方程]{id="math.ode.ode"}（ordinary differential equation，ODE）？这里$y$是$x$的函数，$u$是$x$、$y$的函数。
  answer:
    type: choice
    multiple: true
    options:
      - |
        $y''=(y')^3+x$
      - |
        $(y')^2+y^2=1$
      - |
        $\frac{\partial^2u}{\partial x^2}+\frac{\partial^2u}{\partial y^2}=0$
      - |
        $xy''+y'-y=e^x$
    value: [1, 4]
  hints:
    - |
      先看未知函数有几个自变量，再看出现的导数最高是几阶。
    - |
      B 里只有一阶导数；C 的未知函数$u$有两个自变量，出现的是[偏导数](lesson:math.vector-calculus.partial-derivatives)。
    - |
      A、D 的未知函数只有一个自变量，最高出现$y''$，是二阶常微分方程。B 只有$y'$（平方不改变阶数），是一阶的。C 是偏微分方程。答案是 A 和 D。
  solution: |
    A、D 是二阶常微分方程；B 是一阶的；C 是偏微分方程。答案是 A、D。

- id: p3
  tier: medium
  statement: |
    对每个常数$c$，$y=\frac{1}{c-x}$都是$y'=y^2$的解。满足$y(0)=\frac12$的那个解，定义在包含$0$的最大区间上，这个区间的右端点是多少？
  answer:
    type: number
    value: 2
  hints:
    - |
      先用初始条件定出$c$，再看解在哪里没有定义。
    - |
      $\frac1c=\frac12$，所以$c=2$，解是$y=\frac{1}{2-x}$。
    - |
      由$y(0)=\frac1c=\frac12$得$c=2$，解是$y=\frac{1}{2-x}$。它在$x=2$处没有定义，包含$0$的最大区间是$(-\infty,2)$，右端点是$2$。$x\to2^-$时$y\to+\infty$：方程的右边处处光滑，解却在有限的地方跑到无穷。
  solution: |
    $c=2$，解$y=\frac{1}{2-x}$在$(-\infty,2)$上有定义，右端点是$2$，填 `2`。

- id: p4
  tier: medium
  statement: |
    方程$y'=y-x^2$有一个解是抛物线$y=ax^2+bx+c$。求$a$、$b$、$c$，按这个顺序填。
  answer:
    type: tuple
    value: [1, 2, 2]
  hints:
    - |
      把$y=ax^2+bx+c$代进方程，两边是$x$的多项式，比较同次项的系数。
    - |
      左边$y'=2ax+b$，右边$y-x^2=(a-1)x^2+bx+c$。
    - |
      比较系数：$x^2$项$0=a-1$，$x$项$2a=b$，常数项$b=c$。所以$a=1$，$b=2$，$c=2$，解是$y=x^2+2x+2$；代回去验证：$y'=2x+2$，$y-x^2=2x+2$。
  solution: |
    比较系数得$a=1$、$b=2$、$c=2$，填 `1, 2, 2`。

- id: p5
  tier: hard
  statement: |
    设$y$是$y'=-y^2$在某个区间$I$上的解。证明：要么$y$在$I$上恒等于$0$，要么有常数$C$使$y=\frac{1}{x+C}$在$I$上成立（并且$-C\notin I$）。
  hints:
    - |
      先看$y$在$I$上处处不为$0$的情形：$\bigl(\frac1y\bigr)'$是什么？再说明$y$不能在某处为$0$、在别处不为$0$。
    - |
      $y\ne0$时$\bigl(\frac1y\bigr)'=-\frac{y'}{y^2}=1$，所以$\frac1y=x+C$。若$y(x_1)\ne0$而$y(x_0)=0$，看从$x_1$往$x_0$走时$y$第一次变成$0$的地方。
    - |
      若$y$在$I$上处处不为$0$，则$\bigl(\frac1y\bigr)'=-\frac{y'}{y^2}=1$，在区间上导数为$1$的函数是$x+C$，所以$y=\frac{1}{x+C}$，并且$x+C$在$I$上不为$0$。

      若$y$既有零点又有非零点，不妨设$y(x_1)\ne0$、$y(x_0)=0$、$x_0<x_1$（另一种情形对称）。令$s=\sup\{x\in[x_0,x_1]:y(x)=0\}$是零点集的上确界（supremum，见[实数的完备性](lesson:math.analysis.completeness#def-supremum)），由$y$连续，$y(s)=0$，并且$y$在$(s,x_1]$上不为$0$。由上一段，在$(s,x_1]$上$y=\frac{1}{x+C}$，可$x\to s^+$时$\frac{1}{x+C}$趋于$\frac{1}{s+C}\ne0$或趋于无穷，不会趋于$y(s)=0$，矛盾。
  reference: |
    处处不为$0$时$\bigl(\frac1y\bigr)'=1$，得$y=\frac{1}{x+C}$。

    若有零点也有非零点，取零点集在$[x_0,x_1]$里的[上确界](lesson:math.analysis.completeness#def-supremum)$s$，则$y(s)=0$而$y$在$(s,x_1]$上等于$\frac{1}{x+C}$，后者在$s$处的极限不是$0$，与连续性矛盾。所以只有这两种解。

- id: p6
  tier: hard
  statement: |
    (1) 证明：方程$y'=f(x,y)$的斜率为$c$的等倾线$f(x,y)=c$里，如果有一段是解曲线，这一段一定是斜率为$c$的直线段。(2) 求$y'=(y-x)^2$所有是直线的解曲线。
  hints:
    - |
      (1) 设这一段是解$y=g(x)$的图像，它同时在等倾线上。$g'(x)$等于什么？
    - |
      $g'(x)=f(x,g(x))=c$，所以$g$是斜率为$c$的一次函数。(2) 直线解的斜率$a$要等于它所在等倾线的$c$。
    - |
      (1) 设解$y=g(x)$在区间$J$上的图像落在等倾线$f(x,y)=c$上，则$g'(x)=f(x,g(x))=c$，在区间$J$上导数恒为$c$的函数是$cx+d$，图像是斜率为$c$的直线段。

      (2) 直线解$y=ax+b$代入得$a=(ax+b-x)^2$对所有$x$成立。右边是$x$的二次式$(a-1)^2x^2+2(a-1)bx+b^2$，所以$a=1$，再由$a=b^2$得$b=\pm1$。直线解是$y=x+1$和$y=x-1$，它们都落在斜率为$1$的等倾线$(y-x)^2=1$上，和 (1) 一致。
  reference: |
    (1) $g'(x)=f(x,g(x))=c$，导数恒为$c$，所以是斜率为$c$的直线段。

    (2) $a=(ax+b-x)^2$对所有$x$成立，得$a=1$、$b^2=1$，直线解是$y=x\pm1$，都在斜率为$1$的等倾线$(y-x)^2=1$上。

- id: p7
  tier: thinking
  statement: |
    很多自然规律写成微分方程（例如衰变$m'=-km$），而不是直接写出「$m$等于什么」。为什么？微分方程描述的规律和直接给出的函数，各自说了什么？
  hints:
    - |
      衰变规律对哪一段时间、哪一份物质都成立？$m(t)=5e^{-kt}$呢？
    - |
      微分方程说的是「每一刻，变化率怎样由当时的状态决定」，和起点无关；具体的函数还要加上起点。
    - |
      规律通常是局部的：此时此地，变化率由当时的状态决定。$m'=-km$对任何样品、任何时刻都成立，它就是衰变的「规律」本身。一个具体的$m(t)=5e^{-kt}$只描述某一份样品，换一份就得换一个函数，它是「规律加上初始条件」的产物。

      所以微分方程把「普遍的规律」和「具体的初始状态」分开了：前者是方程，后者是初始条件。这也是为什么解微分方程总是得到一族解，要靠初始条件挑出其中一个；物理里，牛顿第二定律也是这样一条把加速度和受力联系起来的方程。
  reference: |
    微分方程描述局部的、普遍的规律：每一时刻变化率怎样由当时的状态决定，与样品和起点无关；具体的函数是规律加上初始条件的结果。微分方程把规律和初始状态分开，所以解是一族，要用初始条件挑出一个。

- id: p8
  tier: thinking
  statement: |
    二阶方程$y''=-y$能像$y'=f(x,y)$那样，在$xy$平面上画一个方向场吗？如果不能，怎样换一种画法，让「每一点只有一个方向」重新成立？
  hints:
    - |
      经过$xy$平面上同一点$(x_0,y_0)$的解，斜率能不能不同？试试$y=\sin(x-x_0)$乘不同的倍数，再加上$\cos$。
    - |
      经过同一点的解有无穷多条，斜率$y'(x_0)$可以随便取，所以$xy$平面上一点决定不了方向。把$y'$也当成一个未知量$v$。
    - |
      经过$(x_0,y_0)$的解$y=y_0\cos(x-x_0)+s\sin(x-x_0)$对每个斜率$s$都成立，$xy$平面上的一点决定不了切线方向，画不出方向场。二阶方程要同时知道$y$和$y'$才能定下以后的走向。

      令$v=y'$，方程变成一阶方程组$y'=v$、$v'=-y$。在$yv$平面上，每一点$(y,v)$处的方向$(v,-y)$唯一确定，可以画出一个方向场，解变成绕原点转的圆。这正是以后[一阶线性方程组](lesson:math.ode.first-order-systems)和相图要用的办法。
  reference: |
    不能：经过$xy$平面上同一点的解可以有任意斜率（$y=y_0\cos(x-x_0)+s\sin(x-x_0)$），一点决定不了方向。

    令$v=y'$化成$y'=v$、$v'=-y$，在$yv$平面上每一点的方向$(v,-y)$唯一，解是绕原点的圆；这就是一阶方程组和相图的做法。
