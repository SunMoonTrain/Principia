- id: p1
  tier: easy
  statement: |
    求自治方程$y'=y^2-4y+3$的所有:term[平衡点]{id="math.ode.equilibrium-point"}（equilibrium point）。
  answer:
    type: set
    value: [1, 3]
  hints:
    - |
      平衡点是右边等于$0$的$y$。
    - |
      $y^2-4y+3=(y-1)(y-3)$。
    - |
      $y^2-4y+3=(y-1)(y-3)=0$，平衡点是$1$和$3$。顺带看稳定性：$f'(y)=2y-4$，$f'(1)=-2<0$，$1$稳定；$f'(3)=2>0$，$3$不稳定。
  solution: |
    $(y-1)(y-3)=0$，平衡点是$1$、$3$，填 `1, 3`。

- id: p2
  tier: easy
  statement: |
    自治方程$y'=y(2-y)$有一个稳定的平衡点和一个不稳定的平衡点。稳定的是哪一个？
  answer:
    type: number
    value: 2
  hints:
    - |
      先求平衡点，再用判别法看$f'$的符号。
    - |
      平衡点是$0$和$2$，$f'(y)=2-2y$。
    - |
      $f'(0)=2>0$，$0$不稳定；$f'(2)=-2<0$，$2$稳定。也可以看相线：$0<y<2$时$f>0$，$y>2$时$f<0$，箭头都指向$2$。
  solution: |
    $f'(2)=-2<0$，稳定的平衡点是$2$，填 `2`。

- id: p3
  tier: medium
  statement: |
    设$y$是$y'=(y-1)(y-2)^2$满足$y(0)=1.5$的解。求$\lim_{t\to+\infty}y(t)$。
  answer:
    type: number
    value: 2
  hints:
    - |
      画相线：平衡点是哪些？$1$和$2$之间$f$是正是负？
    - |
      $1<y<2$时$(y-1)>0$、$(y-2)^2>0$，$f>0$，$y$增大；它不会越过平衡点$2$。
    - |
      平衡点是$1$和$2$。在$(1,2)$里$f>0$，解严格递增，又不会越过平衡点$2$，有界单调，由相线上的解的性质 (3)，它趋于一个平衡点，只能是$2$。注意$2$是半稳定的：$f$在$2$的两侧都是正的，下面的解升向它，上面的解离开它。
  solution: |
    在$(1,2)$里$f>0$，解递增趋于平衡点$2$（半稳定），填 `2`。

- id: p4
  tier: medium
  statement: |
    鱼塘里鱼的数量$y$以:term[环境容纳量]{id="math.ode.carrying-capacity"}（carrying capacity）为单位，满足$y'=y(1-y)-0.21$，这里$0.21$是每年捕捞的量。若$y(0)=0.5$，求$\lim_{t\to+\infty}y(t)$。
  answer:
    type: number
    value: 0.7
  hints:
    - |
      先求平衡点：$y(1-y)=0.21$。
    - |
      $y^2-y+0.21=0$，平衡点是$0.3$和$0.7$；$0.5$在它们之间，$f(0.5)$是正是负？
    - |
      $y^2-y+0.21=(y-0.3)(y-0.7)=0$，平衡点是$0.3$和$0.7$。$f(0.5)=0.25-0.21=0.04>0$，解从$0.5$开始增大，被夹在$0.3$和$0.7$之间，单调有界，趋于$0.7$。也可以用判别法：$f'(y)=1-2y$，$f'(0.7)=-0.4<0$，$0.7$稳定，$f'(0.3)=0.4>0$，$0.3$不稳定。
  solution: |
    平衡点$0.3$（不稳定）、$0.7$（稳定）；$f(0.5)>0$，解递增趋于$0.7$，填 `0.7`。

- id: p5
  tier: hard
  statement: |
    设$f$连续可导，承认解的唯一性（经过每一点的解只有一条）。证明：$y'=f(y)$的非常数解$y(t)$严格单调；如果它在$[0,+\infty)$上有界，那么$\lim_{t\to+\infty}y(t)=L$存在，并且$f(L)=0$。
  hints:
    - |
      先说明$f(y(t))$不会等于$0$：若某时刻$y(t_1)=y^*$是平衡点，会怎样？
    - |
      $f(y(t))$连续、处处不为$0$，所以不变号。有界单调的函数有极限$L$；若$f(L)\ne0$，看$y'(t)$在$t$很大时接近什么。
    - |
      若某时刻$f(y(t_1))=0$，记$y^*=y(t_1)$，常数函数$y^*$也是经过$(t_1,y^*)$的解，由唯一性$y\equiv y^*$，和「非常数」矛盾。所以$f(y(t))$处处不为$0$；它是$t$的连续函数，由介值定理（intermediate value theorem）不变号，$y'=f(y)$不变号，$y$严格单调。

      有界单调，所以极限$L$存在。若$f(L)\ne0$，不妨设$f(L)>0$。由$f$连续，$t$足够大时$y'(t)=f(y(t))>\frac{f(L)}{2}$，于是$y(t)$至少按$\frac{f(L)}{2}$的速度一直增长，趋于$+\infty$，和有界矛盾；$f(L)<0$时同理。所以$f(L)=0$，$L$是平衡点。
  reference: |
    $f(y(t))$若某处为$0$，由唯一性解就是常数，矛盾；所以它连续且不为$0$，不变号，$y$严格单调。有界单调有极限$L$；若$f(L)\ne0$，$t$大时$|y'|>\frac{|f(L)|}{2}$，$y$无界，矛盾，所以$f(L)=0$。

- id: p6
  tier: hard
  statement: |
    设$f$连续可导，$f(y^*)=0$，$f'(y^*)<0$。证明：有$\delta>0$，从$(y^*-\delta,y^*+\delta)$里出发的解都趋于$y^*$。
  hints:
    - |
      $f'(y^*)<0$说明$f$在$y^*$附近从正变负。
    - |
      取$\delta$使$(y^*-\delta,y^*)$上$f>0$、$(y^*,y^*+\delta)$上$f<0$，再用相线上的解的性质。
    - |
      $f'(y^*)=\lim_{y\to y^*}\frac{f(y)}{y-y^*}<0$，所以有$\delta>0$，使$0<|y-y^*|<\delta$时$\frac{f(y)}{y-y^*}<0$：$y^*$左边$f>0$，右边$f<0$，这个区间里没有别的平衡点。

      从$(y^*,y^*+\delta)$出发的解，$f<0$，单调递减，又不会越过平衡点$y^*$，有界单调，由第 5 题，它趋于一个平衡点，在$[y^*,y^*+\delta)$里只有$y^*$。左边同理，解递增趋于$y^*$。从$y^*$出发的就是平衡解，所以$y^*$渐近稳定。
  reference: |
    由$f'(y^*)<0$，存在$\delta$使$y^*$左侧$f>0$、右侧$f<0$。两侧出发的解分别单调递增、递减，不越过$y^*$，由第 5 题趋于该区间里唯一的平衡点$y^*$。

- id: p7
  tier: thinking
  statement: |
    一维自治方程$y'=f(y)$的解能不能来回振荡，比如像$\sin t$那样？单摆却会来回摆动，它的方程和这里的有什么不同？
  hints:
    - |
      想想相线：一个点在一条直线上只能往一个方向走，要掉头必须在哪里停下来？
    - |
      掉头意味着$y'$变号，要先经过$y'=0$，也就是到达平衡点。单摆的状态需要角度和角速度两个数。
    - |
      不能。解要掉头，$y'=f(y)$必须变号，中间要经过$f(y)=0$，也就是到达平衡点；可由唯一性，非常数的解到不了平衡点。所以一维自治方程的解只能单调地走，最终停在平衡点附近或跑到无穷。

      单摆的方程$\theta''=-\frac gl\sin\theta$是二阶的，状态要用角度和角速度两个数描述，化成一阶方程组以后，是平面上的运动。在平面上，点可以绕着平衡点转圈，不必停下来掉头，所以能来回摆动。这正是以后[平面线性系统的相图](lesson:math.ode.phase-plane-linear)要讲的。
  reference: |
    不能：掉头要$y'$变号，必须经过平衡点，而非常数解到不了平衡点，所以解单调。单摆是二阶方程，状态是平面上的点，可以绕平衡点转圈而不停下，于是能振荡。

- id: p8
  tier: thinking
  statement: |
    $y'=-y$的解从$1$出发，要无限长的时间才到达平衡点$0$；可$y'=-\sqrt{|y|}$的解从$1$出发，在有限时间内就到了$0$。这和「非常数的解不会到达平衡点」矛盾吗？
  hints:
    - |
      解出$y'=-\sqrt{y}$（$y>0$）满足$y(0)=1$的解。
    - |
      $(\sqrt y)'=-\frac12$，$\sqrt y=1-\frac t2$，$t=2$时到达$0$。相线上的解的性质用到了什么条件？
    - |
      $y>0$时$(\sqrt y)'=\frac{y'}{2\sqrt y}=-\frac12$，所以$y=\bigl(1-\frac t2\bigr)^2$，$t=2$时到达$0$，之后可以一直停在$0$。

      不矛盾：「非常数的解不会到达平衡点」用到了唯一性，而唯一性要求$f$连续可导，至少要满足:term[利普希茨条件]{id="math.ode.lipschitz-condition"}（Lipschitz condition）。$f(y)=-\sqrt{|y|}$在$0$处导数无穷大，唯一性不成立：解$y=(1-\frac t2)^2$接上$y=0$，和平衡解$y\equiv0$在$t=2$处交在一起。$f$连续可导时，平衡点附近$|f(y)|\le L|y-y^*|$，速度至多和距离成正比，距离缩小得不会比$e^{-Lt}$快，永远到不了。
  reference: |
    $y'=-\sqrt y$的解$(1-\frac t2)^2$在$t=2$到达$0$。不矛盾：那条性质依赖唯一性，要求$f$连续可导（或利普希茨），$-\sqrt{|y|}$在$0$处不满足，解可以在有限时间内并入平衡解。$f$可导时速度至多与距离成正比，只能指数趋近。
