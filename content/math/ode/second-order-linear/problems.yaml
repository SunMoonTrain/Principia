- id: p1
  tier: easy
  statement: |
    求$\cos3x$和$\sin3x$的:term[朗斯基行列式]{id="math.ode.wronskian"}（Wronskian）$W(\cos3x,\sin3x)$。
  answer:
    type: number
    value: 3
  hints:
    - |
      按定义，$W(y_1,y_2)=y_1y_2'-y_1'y_2$。
    - |
      $(\cos3x)'=-3\sin3x$，$(\sin3x)'=3\cos3x$。
    - |
      $W=\cos3x\cdot3\cos3x-(-3\sin3x)\cdot\sin3x=3(\cos^23x+\sin^23x)=3$。它是常数，这和阿贝尔公式一致：两者都是$y''+9y=0$的解，$p=0$。
  solution: |
    $W=3\cos^23x+3\sin^23x=3$，填 `3`。

- id: p2
  tier: easy
  statement: |
    $e^x$、$e^{-x}$是$y''-y=0$的:term[基本解组]{id="math.ode.fundamental-set"}（fundamental set of solutions）。求满足$y(0)=3$、$y'(0)=1$的解在$x=\ln2$处的值。
  answer:
    type: number
    value: 9/2
  hints:
    - |
      设$y=C_1e^x+C_2e^{-x}$，用两个初值列出$C_1$、$C_2$的方程。
    - |
      $C_1+C_2=3$，$C_1-C_2=1$。
    - |
      $C_1=2$，$C_2=1$，$y=2e^x+e^{-x}$，所以$y(\ln2)=2\cdot2+\frac12=\frac92$。
  solution: |
    $C_1=2$、$C_2=1$，$y(\ln2)=4+\frac12=\frac92$，填 `9/2`。

- id: p3
  tier: medium
  statement: |
    设$y_1$、$y_2$是$x^2y''+xy'-y=0$（$x>0$）的两个解，它们的朗斯基行列式在$x=1$处等于$6$。求它在$x=3$处的值。
  answer:
    type: number
    value: 2
  hints:
    - |
      先化成标准形式$y''+py'+qy=0$，看$p$是什么，再用阿贝尔公式。
    - |
      $p=\frac1x$，取原函数$P=\ln x$，$W=Ce^{-\ln x}=\frac Cx$。
    - |
      两边除以$x^2$，$p=\frac1x$，由:term[阿贝尔公式]{id="math.ode.abel-formula"}（Abel's formula），$W=\frac Cx$。$W(1)=C=6$，所以$W(3)=2$。用具体的解核对：$x$和$\frac1x$都是解，$W(x,\frac1x)=x\cdot\bigl(-\frac1{x^2}\bigr)-1\cdot\frac1x=-\frac2x$，也是$\frac Cx$的形式。
  solution: |
    $W=\frac Cx$，$C=6$，$W(3)=2$，填 `2`。

- id: p4
  tier: medium
  statement: |
    已知$y_1=x$是$x^2y''-xy'+y=0$（$x>0$）的一个解。求满足$y(1)=0$、$y'(1)=1$的解在$x=e$处的值。
  answer:
    type: number
    value: e
  hints:
    - |
      先求另一个与$x$线性无关的解：设$y_2=vx$，用$\bigl(\frac{y_2}{y_1}\bigr)'=\frac{W}{y_1^2}$和阿贝尔公式。
    - |
      $p=-\frac1x$，$W=Ce^{\ln x}=Cx$，$v'=\frac{Cx}{x^2}=\frac Cx$。
    - |
      $v'=\frac Cx$，取$C=1$，$v=\ln x$，$y_2=x\ln x$，通解$y=C_1x+C_2x\ln x$。$y(1)=C_1=0$；$y'=C_1+C_2(\ln x+1)$，$y'(1)=C_2=1$。所以$y=x\ln x$，$y(e)=e$。
  solution: |
    另一个解是$x\ln x$；由初值得$y=x\ln x$，$y(e)=e$，填 `e`。

- id: p5
  tier: hard
  statement: |
    设$p$、$q$在区间$I$上连续，$y_1$、$y_2$是$y''+py'+qy=0$在$I$上的解。证明：(1) $W'=-pW$；(2) 若在某个$x_0\in I$处$W(x_0)=0$，则$y_1$、$y_2$线性相关。
  hints:
    - |
      (1) 直接对$W=y_1y_2'-y_1'y_2$求导，再用方程消去二阶导数。
    - |
      (2) 要找不全为零的$C_1$、$C_2$，使$z=C_1y_1+C_2y_2$在$x_0$处的值和导数都为零，再用唯一性。
    - |
      (1) $W'=y_1'y_2'+y_1y_2''-y_1''y_2-y_1'y_2'=y_1y_2''-y_1''y_2$。代入$y_i''=-py_i'-qy_i$，$W'=y_1(-py_2'-qy_2)-(-py_1'-qy_1)y_2=-p(y_1y_2'-y_1'y_2)=-pW$。

      (2) 取$(C_1,C_2)=(y_2(x_0),-y_1(x_0))$，则$z(x_0)=0$，$z'(x_0)=y_2(x_0)y_1'(x_0)-y_1(x_0)y_2'(x_0)=-W(x_0)=0$。若这组数是$(0,0)$，改取$(y_2'(x_0),-y_1'(x_0))$，同样两式都为零；两组都是$(0,0)$时，$y_1$、$y_2$在$x_0$处的值和导数全为零，由唯一性都恒为零。所以总有不全为零的$C_1$、$C_2$使$z(x_0)=z'(x_0)=0$；零函数也满足这组初值，由唯一性$z\equiv0$，$y_1$、$y_2$线性相关。

      由(1)，$W=Ce^{-P}$，所以$W$要么处处为零、要么处处不为零，这就是阿贝尔公式的两种情形。
  reference: |
    (1) 求导得$W'=y_1y_2''-y_1''y_2$，代入方程消去二阶导数，得$W'=-pW$。(2) 取$(C_1,C_2)=(y_2(x_0),-y_1(x_0))$（为零时改取导数的那一组），$z=C_1y_1+C_2y_2$满足$z(x_0)=z'(x_0)=0$，由唯一性$z\equiv0$。

- id: p6
  tier: hard
  statement: |
    设$p$、$q$在区间$I$上连续，$y_1$、$y_2$是$y''+py'+qy=0$的基本解组。证明：$y_1$的两个相邻零点之间，$y_2$恰好有一个零点。
  hints:
    - |
      设$a<b$是$y_1$的相邻零点，$W(a)$、$W(b)$分别等于什么？
    - |
      $W(a)=-y_1'(a)y_2(a)$，$W(b)=-y_1'(b)y_2(b)$；$W$不变号，而$y_1'(a)$、$y_1'(b)$的符号相反。
    - |
      由阿贝尔公式，$W$在$I$上处处不为零，所以不变号。不妨设$(a,b)$上$y_1>0$，则$y_1'(a)>0$、$y_1'(b)<0$：它们不能为零，否则$y_1$在那一点的值和导数都为零，由唯一性$y_1\equiv0$。$W(a)=-y_1'(a)y_2(a)$和$W(b)=-y_1'(b)y_2(b)$同号，所以$y_2(a)$、$y_2(b)$异号，由介值定理（intermediate value theorem），$y_2$在$(a,b)$里有零点。

      若有两个零点$c<d$，对调$y_1$、$y_2$的角色，$y_1$在$(c,d)$里又有零点，和$a$、$b$相邻矛盾。所以恰好有一个。例如$y''+y=0$的解$\cos x$、$\sin x$，零点一个接一个地交替出现。
  reference: |
    $W$不变号；$y_1$在相邻零点$a$、$b$处的导数异号，故$y_2(a)$、$y_2(b)$异号，由介值定理$y_2$在其间有零点。若有两个，对调角色得出$y_1$在其间也有零点，矛盾。

- id: p7
  tier: thinking
  statement: |
    $x^2y''-2xy'+2y=0$有解$x$和$x^2$。在$x_0=0$处给初值$y(0)=0$、$y'(0)=0$，满足它的解有多少个？给$y(0)=1$呢？$W(x,x^2)$在$x=0$处是多少，这和本节的定理矛盾吗？
  hints:
    - |
      $C_1x+C_2x^2$都是解；把$x=0$代进方程本身，又能看出什么？
    - |
      标准形式里$p=-\frac2x$、$q=\frac2{x^2}$，在$0$处不连续。
    - |
      $y=C_1x+C_2x^2$满足$y(0)=0$、$y'(0)=C_1$，所以$y(0)=y'(0)=0$的解至少有$C_2x^2$这无穷多个。把$x=0$代进方程，得$2y(0)=0$，所以$y(0)=1$的解一个也没有。$W(x,x^2)=x\cdot2x-1\cdot x^2=x^2$，在$0$处为零，在别处不为零。

      不矛盾：本节的定理要求方程能写成标准形式，$p$、$q$在区间上连续，也就是首项系数不为零。这里首项系数$x^2$在$0$处为零，除不过去，存在唯一性和阿贝尔公式在含$0$的区间上都不适用。首项系数为零的点要专门讨论，见以后的[弗罗贝尼乌斯方法](lesson:math.ode.frobenius)。
  reference: |
    $y(0)=y'(0)=0$的解有$C_2x^2$等无穷多个；$y(0)=1$的解不存在（方程在$x=0$处给出$y(0)=0$）。$W(x,x^2)=x^2$在$0$处为零而别处不为零。不矛盾：首项系数在$0$处为零，$p$、$q$不连续，定理不适用。

- id: p8
  tier: thinking
  statement: |
    函数$\sin x$和$x\sin x$在$(-1,1)$上线性无关，可它们的朗斯基行列式在$x=0$处为零。它们能不能是某个$y''+p(x)y'+q(x)y=0$（$p$、$q$在$(-1,1)$上连续）的两个解？
  hints:
    - |
      先算出$W(\sin x,x\sin x)$。
    - |
      $W=\sin^2x$，在$0$处为零，在别处不为零。阿贝尔公式怎么说？
    - |
      $W=\sin x(\sin x+x\cos x)-\cos x\cdot x\sin x=\sin^2x$。若它们是这样一个方程的两个解，由阿贝尔公式，$W$要么处处为零、要么处处不为零，可$\sin^2x$只在$0$处为零，矛盾，所以不能。

      这说明「$W$在一点为零就线性相关」只对同一个系数连续的齐次方程的两个解成立；对一般的函数，$W$在某点为零推不出线性相关。硬要找一个以它们为解的方程，由$W'=-pW$得$p=-\frac{W'}{W}=-\frac{2\cos x}{\sin x}$，在$x=0$处趋于无穷，系数不连续。
  reference: |
    $W=\sin^2x$只在$0$处为零。由阿贝尔公式，同一个系数连续的方程的两个解，$W$要么处处为零、要么处处不为零，所以不能。这类方程的$p=-\frac{W'}{W}$在$0$处无界。
