- id: p1
  tier: easy
  statement: |
    解初值问题$y'+3y=6$，$y(0)=0$，求$y(1)$。
  answer:
    type: number
    value: 2*(1 - exp(-3))
  hints:
    - |
      积分因子是什么？
    - |
      $\mu=e^{3x}$，$(e^{3x}y)'=6e^{3x}$。
    - |
      乘上:term[积分因子]{id="math.ode.integrating-factor"}$e^{3x}$得$(e^{3x}y)'=6e^{3x}$，所以$e^{3x}y=2e^{3x}+C$，$y=2+Ce^{-3x}$。由$y(0)=0$得$C=-2$，$y=2(1-e^{-3x})$，$y(1)=2(1-e^{-3})\approx1.900$。
  solution: |
    $y=2(1-e^{-3x})$，$y(1)=2(1-e^{-3})\approx1.900$，填 `2*(1-exp(-3))`。

- id: p2
  tier: easy
  statement: |
    解初值问题$y'-y=e^{2x}$，$y(0)=2$，求$y(\ln2)$。
  answer:
    type: number
    value: 6
  hints:
    - |
      这里$p(x)=-1$，积分因子是$e^{-x}$。
    - |
      $(e^{-x}y)'=e^{-x}e^{2x}=e^x$。
    - |
      $(e^{-x}y)'=e^x$，所以$e^{-x}y=e^x+C$，$y=e^{2x}+Ce^x$。由$y(0)=1+C=2$得$C=1$，$y=e^{2x}+e^x$。所以$y(\ln2)=4+2=6$。
  solution: |
    $y=e^{2x}+e^x$，$y(\ln2)=4+2=6$，填 `6`。

- id: p3
  tier: medium
  statement: |
    一个水箱装着$100$升清水。从$t=0$起，每升含盐$2$克的盐水以每分钟$5$升的速度流进来，搅匀后的混合液也以每分钟$5$升的速度流出去。箱里的盐从$0$增加到$100$克，要多少分钟？
  answer:
    type: number
    value: 20*ln(2)
  hints:
    - |
      设$x(t)$是箱里的盐（克）。盐的变化率 = 流进的盐 − 流出的盐；流出的混合液每升含盐多少？
    - |
      流进$5\times2=10$克每分钟；水量一直是$100$升，流出$5\times\frac{x}{100}=\frac{x}{20}$克每分钟。所以$x'+\frac{x}{20}=10$，$x(0)=0$。
    - |
      $x'+\frac{x}{20}=10$是一阶线性方程，积分因子$e^{t/20}$，得$x=200+Ce^{-t/20}$，由$x(0)=0$得$x=200\bigl(1-e^{-t/20}\bigr)$。$x=100$时$e^{-t/20}=\frac12$，$t=20\ln2\approx13.86$分钟。
  solution: |
    $x'+\frac{x}{20}=10$，$x=200(1-e^{-t/20})$；令$x=100$得$t=20\ln2\approx13.86$，填 `20*ln(2)`。

- id: p4
  tier: medium
  statement: |
    解初值问题$y'+\frac{y}{x}=x^2$（$x>0$），$y(1)=1$，求$y(2)$。
  answer:
    type: number
    value: 19/8
  hints:
    - |
      $p(x)=\frac1x$，积分因子是$e^{\ln x}$。
    - |
      $\mu=x$，$(xy)'=x^3$。
    - |
      乘以$x$得$(xy)'=x^3$，所以$xy=\frac{x^4}{4}+C$。由$y(1)=1$得$C=\frac34$，$y=\frac{x^3}{4}+\frac{3}{4x}$。所以$y(2)=2+\frac38=\frac{19}{8}=2.375$。
  solution: |
    $xy=\frac{x^4}{4}+\frac34$，$y(2)=\frac{19}{8}$，填 `19/8`。

- id: p5
  tier: hard
  statement: |
    形如$y'+p(x)y=q(x)y^n$（$n\ne0,1$）的方程叫作伯努利方程（Bernoulli equation）。(1) 证明：在$y>0$的地方，令$v=y^{1-n}$，方程化成关于$v$的一阶线性方程。(2) 解初值问题$y'+y=y^3$，$y(0)=\frac12$。
  hints:
    - |
      (1) 算$v'=(1-n)y^{-n}y'$，把方程两边乘以$(1-n)y^{-n}$。
    - |
      得$v'+(1-n)p(x)v=(1-n)q(x)$。(2) $n=3$，$v=y^{-2}$，$v'-2v=-2$。
    - |
      (1) $y>0$时，方程两边乘以$(1-n)y^{-n}$：$(1-n)y^{-n}y'+(1-n)p\,y^{1-n}=(1-n)q$，即$v'+(1-n)p(x)v=(1-n)q(x)$，是关于$v$的:term[一阶线性方程]{id="math.ode.linear-first-order-equation"}（first-order linear equation）。

      (2) $n=3$，$v=y^{-2}$满足$v'-2v=-2$，$v(0)=4$。积分因子$e^{-2x}$，$(e^{-2x}v)'=-2e^{-2x}$，$e^{-2x}v=e^{-2x}+C$，$v=1+Ce^{2x}$；由$v(0)=4$得$C=3$。所以$y=\frac{1}{\sqrt{1+3e^{2x}}}$，代回原方程可以验证。
  reference: |
    (1) 乘以$(1-n)y^{-n}$得$v'+(1-n)pv=(1-n)q$，是线性方程。

    (2) $v=y^{-2}$，$v'-2v=-2$，$v(0)=4$，解得$v=1+3e^{2x}$，$y=(1+3e^{2x})^{-1/2}$。

- id: p6
  tier: hard
  statement: |
    设$p$、$q$在$[0,+\infty)$上连续，并且$p(x)\ge a>0$。证明：$y'+p(x)y=q(x)$的任意两个解$y_1$、$y_2$满足$|y_1(x)-y_2(x)|\le|y_1(0)-y_2(0)|e^{-ax}$。这说明了什么？
  hints:
    - |
      两个解之差满足什么方程？
    - |
      $w=y_1-y_2$满足$w'+pw=0$，所以$w=w(0)e^{-P(x)}$，$P(x)=\int_0^xp$。
    - |
      由定理 2 的证明，$w=y_1-y_2$满足齐次线性方程$w'+p(x)w=0$，所以$w(x)=w(0)e^{-P(x)}$，这里$P(x)=\int_0^xp(t)\dd t\ge ax$。于是$|w(x)|=|w(0)|e^{-P(x)}\le|w(0)|e^{-ax}$。

      这说明：无论$q$是什么，所有解随着$x$增大都按指数挤到一起，系统「忘记」了初始状态，最后的行为只由$q$决定。几何图像里不同起点的解汇到同一条周期曲线上，就是这个道理（那里$p=k>0$）。
  reference: |
    $w=y_1-y_2$满足$w'+pw=0$，$w=w(0)e^{-\int_0^xp}$，而$\int_0^xp\ge ax$，所以$|w|\le|w(0)|e^{-ax}$。所有解按指数靠拢，长期行为与初始条件无关。

- id: p7
  tier: thinking
  statement: |
    定理 1 说：$p$、$q$在区间$I$上连续时，一阶线性方程的解在整个$I$上都存在。可$y'=y^2$的右边处处光滑，解却会在有限的地方跑到无穷。是什么让线性方程的解不会「爆破」（blow-up）？
  hints:
    - |
      看定理 1 给出的解的公式，它在哪里可能没有定义？
    - |
      $y=\frac{F+C}{\mu}$，$\mu=e^{P}$处处为正、有限，$F$在$I$上处处有限。$y'=y^2$里$y$越大长得越快。
    - |
      线性方程的解是$\frac{F(x)+C}{\mu(x)}$：$\mu=e^{P}$在$I$上连续且处处为正，$F$是连续函数的原函数，也处处有限，所以解在整个$I$上有定义。从增长的角度看，$|y'|\le|p||y|+|q|$，增长率至多和$|y|$成正比，最坏也就是指数增长，不会在有限时间内跑到无穷。

      $y'=y^2$的增长率和$y^2$成正比，比线性快，于是越长越快，在有限时间内爆破（[可分离变量的方程](lesson:math.ode.separable)第 8 题）。所以「线性」不只是解法方便，还保证了解的整体存在；非线性方程一般只能保证解在初始点附近存在，见[解的存在唯一性](lesson:math.ode.existence-uniqueness)。
  reference: |
    解的公式$\frac{F+C}{\mu}$在$p$、$q$连续的整个区间上有定义；增长率至多和$|y|$线性相关，最多指数增长，不会有限时间爆破。$y'=y^2$是超线性增长，会爆破。线性保证了整体存在，非线性一般只有局部存在。

- id: p8
  tier: thinking
  statement: |
    解$y'+p(x)y=q(x)$还有一种办法：先解齐次线性方程得$y=Ce^{-P(x)}$，再把常数$C$换成待定的函数$C(x)$，代回原方程求$C(x)$。这样做能得到什么？它和积分因子法是什么关系？
  hints:
    - |
      把$y=C(x)e^{-P(x)}$代入$y'+py=q$，$C(x)$满足什么？
    - |
      代入后$p$那两项抵消，剩下$C'(x)e^{-P(x)}=q(x)$。
    - |
      代入得$C'e^{-P}-Cpe^{-P}+pCe^{-P}=q$，即$C'(x)=q(x)e^{P(x)}=\mu q$，所以$C(x)=F(x)+C_0$，$y=\frac{F(x)+C_0}{\mu(x)}$，和定理 1 完全一样。

      两种办法是同一件事的两种说法：积分因子法说「乘上$\mu$，左边变成$(\mu y)'$」；这种办法说「解写成$\frac{C(x)}{\mu}$，$C(x)$正是$\mu y$」。后一种叫常数变易法（variation of parameters），以后解高阶线性方程时它更好推广，见[常数变易法](lesson:math.ode.variation-of-parameters)。
  reference: |
    代入得$C'(x)=\mu(x)q(x)$，$C=F+C_0$，结果与积分因子法相同；$C(x)$就是$\mu y$。这是常数变易法，它更容易推广到高阶线性方程。
