- id: p1
  tier: easy
  statement: |
    由零点定理，能断定方程$x^3-4x+1=0$在下面哪些区间里有根？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $(-3,-2)$
      - |
        $(-2,-1)$
      - |
        $(-1,0)$
      - |
        $(0,1)$
      - |
        $(1,2)$
    value: [1, 4, 5]
  hints:
    - |
      $f(x)=x^3-4x+1$是多项式，处处连续。算出它在$-3$、$-2$、$-1$、$0$、$1$、$2$处的值。
    - |
      $f(-3)=-14$，$f(-2)=1$，$f(-1)=4$，$f(0)=1$，$f(1)=-2$，$f(2)=1$。哪些区间两端异号？
    - |
      两端异号的是$(-3,-2)$、$(0,1)$、$(1,2)$，选 A、D、E。
  solution: |
    $f(-3)=-14$，$f(-2)=1$，$f(-1)=4$，$f(0)=1$，$f(1)=-2$，$f(2)=1$。两端异号的区间是$(-3,-2)$、$(0,1)$、$(1,2)$，由零点定理，里面各有一个根。B、C 两端同号，零点定理断定不了（这两个区间里其实也没有根）。

- id: p2
  tier: easy
  statement: |
    用二分法找$x^2-3=0$在$[1,2]$里的根：每一步取区间的中点，留下两端函数值异号的那一半。从$[1,2]$开始做两步，留下的区间是什么？依次填左端点、右端点。
  answer:
    type: tuple
    value: [3/2, 7/4]
  hints:
    - |
      $f(1)=-2<0$，$f(2)=1>0$。第一步的中点是$1.5$。
    - |
      $f(1.5)=-0.75<0$，留下$[1.5,2]$；第二步的中点是$1.75$。
    - |
      $f(1.75)=0.0625>0$，留下$[1.5,1.75]$。
  solution: |
    $f(1.5)=2.25-3<0$，和$f(2)>0$异号，留下$[1.5,2]$。$f(1.75)=3.0625-3>0$，和$f(1.5)<0$异号，留下$[1.5,1.75]$。所以填$1.5$、$1.75$。

- id: p3
  tier: medium
  statement: |
    $f$在$[0,3]$上连续，$f(0)=2$，$f(3)=-4$。对多少个整数$c$，能断定方程$f(x)=c$在开区间$(0,3)$内有解？
  answer:
    type: number
    value: 5
  hints:
    - |
      介值定理对严格介于$f(0)$和$f(3)$之间的$c$给出$(0,3)$内的解。
    - |
      $c=2$或$c=-4$时，端点$x=0$或$x=3$是解，可开区间里不一定有解；更大或更小的$c$也断定不了。
    - |
      严格介于$-4$和$2$之间的整数是$-3$、$-2$、$-1$、$0$、$1$，共$5$个。
  solution: |
    由介值定理，$-4<c<2$时方程在$(0,3)$内有解，这样的整数有$-3,-2,-1,0,1$，共$5$个。$c=2$、$c=-4$时只知道端点是解；$c>2$或$c<-4$时，$f$也可能根本取不到$c$。

- id: p4
  tier: medium
  statement: |
    求$f(x)=|x-1|+|x+2|$在$[-3,3]$上的最小值和最大值，依次填写。
  answer:
    type: tuple
    value: [3, 7]
  hints:
    - |
      $f$连续，$[-3,3]$是闭区间，最值一定取得到。按$x=-2$和$x=1$把区间分成三段，去掉绝对值。
    - |
      $-3\le x<-2$时$f=-2x-1$；$-2\le x\le1$时$f=3$；$1<x\le3$时$f=2x+1$。
    - |
      中间一段恒为$3$，两边各自单调，端点处$f(-3)=5$、$f(3)=7$。最小值$3$，最大值$7$。
  solution: |
    分段：$[-3,-2)$上$f=-2x-1$，从$5$减到$3$；$[-2,1]$上$f\equiv3$；$(1,3]$上$f=2x+1$，从$3$增到$7$。所以最小值是$3$，最大值是$f(3)=7$。

- id: p5
  tier: hard
  statement: |
    $f$在$[0,2]$上连续，$f(0)=f(2)$。证明有$x\in[0,1]$，使$f(x)=f(x+1)$。
  hints:
    - |
      看$g(x)=f(x+1)-f(x)$，它定义在$[0,1]$上，并且连续。
    - |
      $g(0)+g(1)=f(2)-f(0)=0$，所以$g(0)$和$g(1)$要么有一个是$0$，要么异号。
    - |
      $g(x)=f(x+1)-f(x)$在$[0,1]$上连续（连续函数的差，复合以后仍连续）。$g(0)+g(1)=f(1)-f(0)+f(2)-f(1)=0$。若$g(0)=0$，取$x=0$即可；否则$g(1)=-g(0)$和$g(0)$异号，由零点定理，有$\xi\in(0,1)$使$g(\xi)=0$，即$f(\xi)=f(\xi+1)$。
  reference: |
    令$g(x)=f(x+1)-f(x)$，$x\in[0,1]$。$f$在$[0,2]$上连续，$x\mapsto x+1$连续，所以$g$在$[0,1]$上连续。

    $g(0)=f(1)-f(0)$，$g(1)=f(2)-f(1)=f(0)-f(1)=-g(0)$。若$g(0)=0$，$x=0$满足要求；否则$g(0)$、$g(1)$异号，由零点定理有$\xi\in(0,1)$使$g(\xi)=0$。

    含义：首尾等高的一段连续曲线上，总能找到水平距离为$1$、高度相同的两点。

- id: p6
  tier: hard
  statement: |
    $f$在$[0,1]$上连续，并且它的值都在$[0,1]$里。（1）证明有$c\in[0,1]$，使$f(c)=c$。（2）举例说明：把$[0,1]$都换成开区间$(0,1)$，结论可能不成立。
  hints:
    - |
      （1）看$g(x)=f(x)-x$在两个端点的符号。
    - |
      （1）$g(0)=f(0)\ge0$，$g(1)=f(1)-1\le0$。（2）找一个把$(0,1)$映到$(0,1)$里、却处处$f(x)\ne x$的连续函数，比如让$f(x)<x$。
    - |
      （1）$g(x)=f(x)-x$在$[0,1]$上连续，$g(0)=f(0)\ge0$，$g(1)=f(1)-1\le0$。若有一个是$0$，对应的端点就是$c$；否则$g(0)>0>g(1)$，由零点定理有$c\in(0,1)$使$g(c)=0$。

      （2）$f(x)=x^2$在$(0,1)$上连续，值都在$(0,1)$里，可$x^2=x$只有$x=0$和$x=1$两个解，都不在$(0,1)$里。
  reference: |
    （1）$g(x)=f(x)-x$连续。$f(0)\ge0$推出$g(0)\ge0$；$f(1)\le1$推出$g(1)\le0$。等号成立时端点就是所求；否则$g(0)>0>g(1)$，零点定理给出$c\in(0,1)$，$f(c)=c$。图像上：曲线从左边$x=0$的竖线连到右边$x=1$的竖线，又不出正方形，总要碰到对角线$y=x$。

    （2）$f(x)=x^2$（或$f(x)=\frac x2$）：在$(0,1)$上连续、值在$(0,1)$里，$f(x)<x$处处成立，没有不动点。开区间去掉了端点，$g$在两端的符号就推不出来了。

- id: p7
  tier: thinking
  statement: |
    （1）举一个在$[0,1]$上处处有定义、却处处不连续的函数，它照样取得到最大值和最小值。（2）举一个在开区间上连续、有界，却取不到最大值的函数，不要用讲解里的例子。（3）对照最值定理的道理说一说：（1）为什么和定理不矛盾？（2）卡在了哪一步？
  hints:
    - |
      （1）可以只取两个值，比如有理数处一个值、无理数处另一个值。
    - |
      （2）想一个在开区间上一路增大、越来越靠近某个数的连续函数，比如$\sin x$在$\bigl(0,\frac\pi2\bigr)$上。
    - |
      （1）$x$是有理数时$f(x)=1$，无理数时$f(x)=0$。任何区间里两种数都有，$f$处处不连续，可最大值$1$、最小值$0$都取到了。

      （2）$\sin x$在$\bigl(0,\frac\pi2\bigr)$上连续、有界，函数值越来越靠近$1$，却取不到$1$。

      （3）最值定理是充分条件：条件满足一定取到，条件不满足也可能取到，所以（1）不矛盾。（2）里让函数值靠近$1$的点挤向$\frac\pi2$，可$\frac\pi2$不在开区间里，「挤到的那一点还在范围里」这一步断了。
  reference: |
    （1）有理数处取$1$、无理数处取$0$的函数：每一点附近两种值都有，处处不连续；最大值$1$、最小值$0$都取得到。定理说「连续、闭区间$\Rightarrow$取到最值」，没说反过来。

    （2）$\sin x$在$\bigl(0,\frac\pi2\bigr)$上，或$\frac{x}{1+x}$在$(0,1)$上：连续、有界，值往一个数挤却取不到。

    （3）道理的三步：取一串让函数值靠近最高处的点；它们挤向一点$c$；$c$在范围里，由连续得$f(c)$是最大值。（2）里$c=\frac\pi2$落在区间外，第三步断了；（1）里第三步的「连续」不成立，可最值碰巧还是取到了。

- id: p8
  tier: thinking
  statement: |
    （1）若$f$在$[a,b]$上取遍$f(a)$与$f(b)$之间的每一个值，$f$一定连续吗？（2）若$f$在$[a,b]$上连续，并且只取有理数值，$f$会是什么样的函数？
  hints:
    - |
      （1）介值定理的逆命题。试着让函数在中间跳一下，但跳之前已经把要取的值都取完了。
    - |
      （2）如果$f$取到两个不同的值，由介值定理，它还要取到这两个值之间的哪些数？
    - |
      （1）不一定。在$[0,2]$上令$x\le1$时$f(x)=x$，$x>1$时$f(x)=x-1$：$f(0)=0$，$f(2)=1$，$[0,1]$里的每个值在$[0,1]$这一段上都取到了，可$f$在$x=1$处跳跃，不连续。

      （2）只能是常数。若$f(x_1)\ne f(x_2)$，两数之间有无理数，由介值定理$f$要在$x_1$、$x_2$之间取到它，和「只取有理数值」矛盾。
  reference: |
    （1）不一定。反例：$[0,2]$上$f(x)=x$（$x\le1$）、$f(x)=x-1$（$x>1$）。$f(0)=0$、$f(2)=1$之间的每个值都在$[0,1]$上取到，可$\lim_{x\to1^+}f(x)=0\ne1=f(1)$，不连续。「取遍中间值」比「连续」弱。

    （2）常数。若有两点函数值不同，它们之间夹着无理数，介值定理逼$f$取到这个无理数，矛盾。这说明连续函数的值域是「没有空隙」的一整段，取值只在有理数里的连续函数，值域只能缩成一个点。
