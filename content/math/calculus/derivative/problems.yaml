- id: p1
  tier: easy
  statement: |
    用导数的定义求$f(x)=3x^2-x$在$x=2$处的导数$f'(2)$。
  answer:
    type: number
    value: 11
  hints:
    - |
      写出差商$\frac{f(2+h)-f(2)}{h}$，化简后再让$h\to0$。
    - |
      $f(2+h)-f(2)=3(2+h)^2-(2+h)-10=11h+3h^2$。
    - |
      差商是$11+3h$，$h\to0$时趋于$11$。
  solution: |
    $f(2+h)-f(2)=12+12h+3h^2-2-h-10=11h+3h^2$，差商$\frac{11h+3h^2}{h}=11+3h\to11$，所以$f'(2)=11$。

- id: p2
  tier: easy
  statement: |
    一个物体的位移$s=t^2+t$（$s$单位是米，$t$单位是秒）。求$t$从$2$到$2.1$的平均速度，以及$t=2$时的瞬时速度，依次填写。
  answer:
    type: tuple
    value: [5.1, 5]
    unit: |
      $\mathrm{m/s}$
  hints:
    - |
      平均速度是差商$\frac{s(2.1)-s(2)}{0.1}$；瞬时速度是$h\to0$时差商的极限。
    - |
      $s(2)=6$，$s(2.1)=6.51$；一般地，$s(2+h)-s(2)=5h+h^2$。
    - |
      平均速度$\frac{0.51}{0.1}=5.1$；瞬时速度$\lim_{h\to0}(5+h)=5$。
  solution: |
    $s(2.1)-s(2)=6.51-6=0.51$，平均速度是$5.1\,\mathrm{m/s}$。$\frac{s(2+h)-s(2)}{h}=\frac{5h+h^2}{h}=5+h\to5$，瞬时速度是$5\,\mathrm{m/s}$。

- id: p3
  tier: medium
  statement: |
    求曲线$y=x^3-3x$在$x=2$处的切线。依次填切线的斜率和它在$y$轴上的截距。
  answer:
    type: tuple
    value: [9, -16]
  hints:
    - |
      先用定义求$x=2$处的导数，它就是切线的斜率；切点是$(2,2)$。
    - |
      $\frac{(2+h)^3-3(2+h)-2}{h}=\frac{9h+6h^2+h^3}{h}=9+6h+h^2$。
    - |
      斜率是$9$，切线$y=2+9(x-2)=9x-16$，截距是$-16$。
  solution: |
    $f(2)=8-6=2$。$\frac{f(2+h)-f(2)}{h}=9+6h+h^2\to9$，所以斜率是$9$。切线$y=2+9(x-2)$，即$y=9x-16$，截距是$-16$。

- id: p4
  tier: medium
  statement: |
    $f$在$a$处可导，$f'(a)=3$。求$\lim_{h\to0}\frac{f(a+2h)-f(a-h)}{h}$。
  answer:
    type: number
    value: 9
  hints:
    - |
      在分子里减去再加上$f(a)$，拆成两个差商。
    - |
      $\frac{f(a+2h)-f(a)}{h}=2\cdot\frac{f(a+2h)-f(a)}{2h}$，$\frac{f(a)-f(a-h)}{h}=\frac{f(a-h)-f(a)}{-h}$。
    - |
      两项分别趋于$2f'(a)=6$和$f'(a)=3$，和是$9$。
  solution: |
    原式$=2\cdot\frac{f(a+2h)-f(a)}{2h}+\frac{f(a-h)-f(a)}{-h}$。$h\to0$时$2h\to0$、$-h\to0$，两个差商都趋于$f'(a)=3$，所以极限是$2\cdot3+3=9$。

- id: p5
  tier: hard
  statement: |
    $x$是有理数时$f(x)=x^2$，$x$是无理数时$f(x)=0$。证明$f$只在$x=0$处可导，并求$f'(0)$。（任何区间里都既有有理数又有无理数。）
  hints:
    - |
      $x=0$处：差商$\frac{f(h)-f(0)}{h}=\frac{f(h)}{h}$，它的绝对值不超过什么？
    - |
      $a\ne0$处：先看$f$在$a$处连不连续。
    - |
      $x=0$：$|f(h)|\le h^2$，所以$\left|\frac{f(h)}{h}\right|\le|h|\to0$，由夹逼定理$f'(0)=0$。

      $a\ne0$：$a$附近的有理数处$f(x)=x^2$靠近$a^2\ne0$，无理数处$f(x)=0$，$\lim_{x\to a}f(x)$不存在，$f$在$a$处不连续。可导一定连续，所以$f$在$a$处不可导。
  reference: |
    $x=0$：$f(0)=0$，$\left|\frac{f(h)-f(0)}h\right|=\frac{|f(h)|}{|h|}\le\frac{h^2}{|h|}=|h|\to0$，所以$f'(0)=0$。

    $a\ne0$：沿有理数靠近$a$，$f\to a^2$；沿无理数靠近$a$，$f=0$。$a^2\ne0$，极限不存在，$f$在$a$处不连续，由「可导必连续」，不可导。

    这个函数只在一点连续、也只在这一点可导：导数只看一点附近的情况，和别处多么不规则无关。

- id: p6
  tier: hard
  statement: |
    函数$f$对所有实数$x$、$y$满足$f(x+y)=f(x)+f(y)+2xy$，并且$f'(0)=1$。（1）求$f(0)$。（2）证明$f$处处可导，并求$f'(x)$。（3）猜出$f(x)$的表达式，并验证它满足条件。
  hints:
    - |
      （1）取$x=y=0$。
    - |
      （2）在差商$\frac{f(x+h)-f(x)}{h}$里用条件：$f(x+h)=f(x)+f(h)+2xh$。
    - |
      （1）$f(0)=2f(0)$，所以$f(0)=0$。

      （2）$\frac{f(x+h)-f(x)}{h}=\frac{f(h)+2xh}{h}=\frac{f(h)-f(0)}{h}+2x$，$h\to0$时趋于$f'(0)+2x=1+2x$，所以$f$处处可导，$f'(x)=1+2x$。

      （3）$(x^2)'=2x$，$(x)'=1$，猜$f(x)=x^2+x$。验证：$(x+y)^2+(x+y)=x^2+x+y^2+y+2xy$，并且$f'(0)=1$。
  reference: |
    （1）令$x=y=0$：$f(0)=2f(0)$，$f(0)=0$。

    （2）$\frac{f(x+h)-f(x)}h=\frac{f(h)}h+2x=\frac{f(h)-f(0)}h+2x\to f'(0)+2x=1+2x$。只用了$0$处的可导性，就推出了每一点的可导性。

    （3）$f(x)=x^2+x$满足方程和$f'(0)=1$。要证明它是唯一的，需要「导数处处相同的两个函数只差一个常数」，这要用以后的[微分中值定理](lesson:math.calculus.mean-value-theorem)；加上$f(0)=0$，常数就是$0$。

- id: p7
  tier: thinking
  statement: |
    （1）为什么不把切线定义成「和曲线只有一个公共点的直线」？举出两种不同的失效情形。（2）对圆来说，两种说法为什么一致？（3）$y=|x|$在原点处有没有切线？
  hints:
    - |
      （1）一种是真正的切线和曲线有不止一个公共点，另一种是只有一个公共点的直线不是切线。
    - |
      （2）圆在每一点都「往同一侧弯」。（3）原点两侧的割线趋于什么？
    - |
      （1）$y=x^3$在原点的切线$y=0$穿过曲线；$y=x^3$在$x=1$处的切线$y=3x-2$还和曲线交于$x=-2$。反过来，竖直线和抛物线只碰一点，却不是切线。

      （2）圆整个落在每条切线的一侧，切线和圆只碰一点；割线的极限位置正好是垂直于半径的那条直线，两种定义得到同一条线。

      （3）没有。$Q$从右边靠近原点时割线斜率一直是$1$，从左边靠近时一直是$-1$，割线没有共同的极限位置。
  reference: |
    （1）失效一：切线可以和曲线有多个公共点，例如$y=x^3$在$(1,1)$处的切线$y=3x-2$，$x^3-3x+2=(x-1)^2(x+2)$，还交于$x=-2$；在原点的切线$y=0$穿过曲线。失效二：只碰一点的直线不一定是切线，例如抛物线的竖直线、$y=|x|$在原点的直线$y=\frac x2$也只碰原点一次。

    （2）圆是凸的，切线（垂直于半径）只在切点碰圆，其余部分全在一侧；对凸的封闭曲线两种说法一致，一般曲线不行。「割线的极限」只看一点附近，是局部的定义，更可靠。

    （3）左、右两侧的割线分别是$y=-x$、$y=x$，没有共同的极限位置，原点处没有切线（也不可导）。

- id: p8
  tier: thinking
  statement: |
    气温$T$（单位$^\circ\mathrm C$）随时间$t$（单位：小时）变化。（1）$T'(t)$的单位是什么，表示什么？（2）只知道每个整点的气温，能求出$T'(10)$吗？

    （3）只知道$T(9)$、$T(10)$、$T(11)$，用$\frac{T(11)-T(9)}{2}$还是$T(11)-T(10)$估计$T'(10)$更好？用$T(t)=t^2$试一试。
  hints:
    - |
      （1）导数是差商的极限，差商的单位是「$y$的单位除以$x$的单位」。
    - |
      （2）只有离散的数据，就只能算差商，不能让$h\to0$。（3）分别算出两个差商和$T'(10)$比较。
    - |
      （1）单位是$^\circ\mathrm C/\mathrm h$，表示那一刻气温升高的快慢。

      （2）求不出来，只能用差商近似；误差来自一小时内气温的变化不均匀。

      （3）$T=t^2$时$T'(10)=20$；$\frac{121-81}{2}=20$，正好相等，$121-100=21$，差$1$。两边对称地取，误差在左右两侧抵消了一部分，所以前者通常更好。
  reference: |
    （1）$\frac{\Delta T}{\Delta t}$的单位是$^\circ\mathrm C/\mathrm h$，$T'(t)$是瞬时的升温速率。

    （2）严格说求不出，导数要$h\to0$，数据只给$h=1$小时。可以用差商估计，前提是气温在一小时内大致均匀地变化。

    （3）对$T=t^2$：$\frac{T(10+h)-T(10-h)}{2h}=20$对任何$h$都准确，而$\frac{T(10+h)-T(10)}h=20+h$有误差$h$。一般地，两侧对称的差商误差小得多，这是数值计算里求导常用它的原因。
