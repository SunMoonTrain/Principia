- id: p1
  tier: easy
  statement: |
    $f(x)=x^4-3x^3+x$，求$f''(2)$。
  answer:
    type: number
    value: 12
  hints:
    - |
      先求$f'$，再对$f'$求导。
    - |
      $f'(x)=4x^3-9x^2+1$，$f''(x)=12x^2-18x$。
    - |
      $f''(2)=48-36=12$。
  solution: |
    $f'(x)=4x^3-9x^2+1$，$f''(x)=12x^2-18x$，所以$f''(2)=48-36=12$。

- id: p2
  tier: easy
  statement: |
    质点沿直线运动，$t$秒时的位置是$s(t)=t^3-6t^2+9t$米。求$t=3$时的速度和加速度，依次填写（单位分别是米每秒、米每二次方秒）。
  answer:
    type: tuple
    value: [0, 6]
  hints:
    - |
      速度是位置的导数，加速度是位置的二阶导数（second derivative）。
    - |
      $v(t)=3t^2-12t+9$，$a(t)=6t-12$。
    - |
      $v(3)=27-36+9=0$，$a(3)=18-12=6$。
  solution: |
    $v(t)=s'(t)=3t^2-12t+9$，$a(t)=s''(t)=6t-12$，所以$v(3)=0$，$a(3)=6$。这一刻质点停住了，可加速度不是零，它马上又会动起来。

- id: p3
  tier: medium
  statement: |
    $f(x)=\cos2x$，求$f^{(10)}(0)$。
  answer:
    type: number
    value: -1024
  hints:
    - |
      由链式法则，每求一次导多一个因子$2$；$\cos$每求一次导，相当于自变量加$\frac\pi2$。
    - |
      $f^{(n)}(x)=2^n\cos\bigl(2x+\frac{n\pi}2\bigr)$。
    - |
      $f^{(10)}(0)=2^{10}\cos5\pi=-1024$。
  solution: |
    $f'(x)=-2\sin2x=2\cos\bigl(2x+\frac\pi2\bigr)$，每求一次导，前面乘$2$、括号里加$\frac\pi2$，所以$f^{(n)}(x)=2^n\cos\bigl(2x+\frac{n\pi}2\bigr)$。$f^{(10)}(0)=2^{10}\cos5\pi=-1024$。

- id: p4
  tier: medium
  statement: |
    $f(x)=x^2e^{-x}$，求$f^{(8)}(0)$。
  answer:
    type: number
    value: 56
  hints:
    - |
      用莱布尼茨公式（Leibniz rule），$u=e^{-x}$，$v=x^2$；$x^2$的三阶及以上导数都是$0$。
    - |
      $(e^{-x})^{(m)}=(-1)^me^{-x}$。在$x=0$处，带$x^2$、$2x$的项都是$0$。
    - |
      只剩$\binom82\cdot2\cdot(e^{-x})^{(6)}$，在$0$处等于$28\cdot2\cdot1=56$。
  solution: |
    由莱布尼茨公式，$f^{(8)}=x^2(e^{-x})^{(8)}+\binom81\cdot2x(e^{-x})^{(7)}+\binom82\cdot2(e^{-x})^{(6)}$。代入$x=0$，前两项为$0$，$(e^{-x})^{(6)}=e^{-x}$，所以$f^{(8)}(0)=28\cdot2=56$。

- id: p5
  tier: hard
  statement: |
    $f(x)=e^x\sin x$。（1）证明$f'(x)=\sqrt2\,e^x\sin\bigl(x+\frac\pi4\bigr)$。（2）用数学归纳法证明$f^{(n)}(x)=(\sqrt2)^ne^x\sin\bigl(x+\frac{n\pi}4\bigr)$。（3）求$f^{(8)}(x)$和$f^{(100)}(0)$。
  hints:
    - |
      （1）$\sin x+\cos x=\sqrt2\sin\bigl(x+\frac\pi4\bigr)$。（2）对$e^x\sin(x+c)$求导，和（1）一样。
    - |
      $\bigl(e^x\sin(x+c)\bigr)'=e^x\bigl(\sin(x+c)+\cos(x+c)\bigr)=\sqrt2e^x\sin\bigl(x+c+\frac\pi4\bigr)$。
    - |
      （1）$f'=e^x(\sin x+\cos x)=\sqrt2e^x\sin\bigl(x+\frac\pi4\bigr)$。

      （2）$n=1$时就是（1）。设$f^{(n)}=(\sqrt2)^ne^x\sin\bigl(x+\frac{n\pi}4\bigr)$，令$c=\frac{n\pi}4$，由上面的式子，$f^{(n+1)}=(\sqrt2)^n\cdot\sqrt2e^x\sin\bigl(x+c+\frac\pi4\bigr)=(\sqrt2)^{n+1}e^x\sin\bigl(x+\frac{(n+1)\pi}4\bigr)$。

      （3）$f^{(8)}=16e^x\sin(x+2\pi)=16e^x\sin x$。$f^{(100)}(0)=2^{50}\sin25\pi=0$。
  reference: |
    （1）$\sin x+\cos x=\sqrt2\sin(x+\frac\pi4)$。

    （2）归纳：每求一次导乘$\sqrt2$、相位加$\frac\pi4$。

    （3）$f^{(8)}=16e^x\sin x$；$f^{(100)}(0)=0$。

- id: p6
  tier: hard
  statement: |
    $f(x)=(x^2-1)^n$，$n$是正整数。（1）证明$k<n$时$f^{(k)}(1)=f^{(k)}(-1)=0$。（2）证明$f^{(n)}(1)=2^nn!$，并求$f^{(n)}(-1)$。
  hints:
    - |
      把$f$写成$(x-1)^n(x+1)^n$，用莱布尼茨公式。
    - |
      $\bigl((x-1)^n\bigr)^{(j)}$在$j<n$时含因子$(x-1)^{n-j}$，在$x=1$处为$0$；$j=n$时等于$n!$。
    - |
      （1）$f^{(k)}=\sum_{j=0}^k\binom kj\bigl((x-1)^n\bigr)^{(j)}\bigl((x+1)^n\bigr)^{(k-j)}$。$k<n$时每一项的$j\le k<n$，$\bigl((x-1)^n\bigr)^{(j)}=\frac{n!}{(n-j)!}(x-1)^{n-j}$在$x=1$处为$0$，所以$f^{(k)}(1)=0$；对$(x+1)^n$同理得$f^{(k)}(-1)=0$。

      （2）$k=n$时，在$x=1$处只有$j=n$那一项不为零：$\binom nn\cdot n!\cdot(1+1)^n=2^nn!$。在$x=-1$处只有$(x+1)^n$求$n$次导的那一项留下：$n!\cdot(-2)^n$，所以$f^{(n)}(-1)=(-1)^n2^nn!$。
  reference: |
    （1）每项含$(x-1)^{n-j}$（$j<n$）。

    （2）$f^{(n)}(1)=n!\,2^n$，$f^{(n)}(-1)=(-2)^nn!$。$\frac1{2^nn!}\bigl((x^2-1)^n\bigr)^{(n)}$是勒让德多项式，在$x=1$处取值$1$。

- id: p7
  tier: thinking
  statement: |
    （1）位置的三阶导数（加速度的变化率）在物理里叫急动度（jerk）。电梯启动、刹车时，为什么设计者在意的不只是加速度，还有急动度？

    （2）$f''(x_0)$存在时，$f'$在$x_0$处一定连续（continuous）吗？$f$呢？

    （3）$f''(x_0)>0$，$f$在$x_0$附近的图像大致是什么样？和$f'(x_0)$的正负有关吗？
  hints:
    - |
      （1）人感到的「推力」和加速度成正比，加速度突然变化会怎样？（2）$f''(x_0)$存在，说明$f'$在$x_0$处可导。
    - |
      （3）$f''$是切线斜率的变化率；分别想$f'(x_0)>0$、$=0$、$<0$三种情况。
    - |
      （1）乘客感到的推力和加速度成正比；加速度一下子从$0$跳到很大，推力也突然出现，人会被「顿」一下。急动度小，推力是慢慢加上去的，坐着才舒服。

      （2）$f''(x_0)$存在，$f'$在$x_0$处可导，所以连续；$f'$在$x_0$附近有定义，$f$在那里可导，当然也连续。

      （3）$f''(x_0)>0$说明切线斜率在$x_0$附近增大，曲线向上弯，像碗的一部分。$f'(x_0)>0$时曲线在上升、越升越快；$f'(x_0)=0$时像碗底；$f'(x_0)<0$时在下降、越降越慢。弯的方向由$f''$定，升降由$f'$定，以后讲凹凸性时再细说。
  reference: |
    （1）推力正比于加速度，急动度大则推力突变。

    （2）$f'$连续，$f$也连续（可导）。

    （3）向上弯；$f'$的正负决定升降。

- id: p8
  tier: thinking
  statement: |
    （1）多项式求够了次数，导数就恒为$0$。反过来，$f^{(n)}$恒为$0$的函数一定是多项式吗？你需要什么样的定理才能证明？

    （2）有没有不是零的函数满足$f'=f$？满足$f''=-f$的呢？

    （3）对多项式$p(x)=a_0+a_1x+\cdots+a_mx^m$，用$p$在$0$处的各阶导数表示系数$a_k$。这对一般的函数有什么启发？
  hints:
    - |
      （1）先想$n=1$：导数恒为$0$的函数是常数吗？这要用[微分中值定理](lesson:math.calculus.mean-value-theorem)（mean value theorem）。
    - |
      （2）想想$e^x$、$\sin x$、$\cos x$。（3）对$p$求$k$次导再代入$0$，哪些项留下？
    - |
      （1）在一个区间上是。$n=1$时，「导数恒为$0$的函数是常数」要用微分中值定理；有了它，$f^{(n-1)}$是常数，再往回推，$f$是次数小于$n$的多项式。只在不连通的集合上就不对了，比如$x<0$时取$0$、$x>0$时取$1$的函数，导数恒为$0$，却不是多项式。

      （2）$f=Ce^x$满足$f'=f$；$\sin x$、$\cos x$以及它们的组合$A\sin x+B\cos x$满足$f''=-f$。

      （3）$p^{(k)}(0)=k!\,a_k$，所以$a_k=\frac{p^{(k)}(0)}{k!}$：多项式完全由它在一点处的各阶导数决定。对一般的函数，可以用$\sum\frac{f^{(k)}(0)}{k!}x^k$去逼近它，这就是以后的泰勒多项式。
  reference: |
    （1）区间上是（中值定理推出导数为零即常数，逐次积分）；不连通集合上不是。

    （2）$Ce^x$；$A\sin x+B\cos x$。

    （3）$a_k=\frac{p^{(k)}(0)}{k!}$，引出泰勒多项式。
