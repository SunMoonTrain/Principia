- id: p1
  tier: easy
  statement: |
    $f(x)=(3x-2)^5$，求$f'(1)$。
  answer:
    type: number
    value: 15
  hints:
    - |
      外层是$u^5$，里层是$u=3x-2$，用链式法则（chain rule）。
    - |
      $f'(x)=5(3x-2)^4\cdot3$。
    - |
      $f'(1)=5\cdot1^4\cdot3=15$。
  solution: |
    由链式法则，$f'(x)=5(3x-2)^4\cdot(3x-2)'=15(3x-2)^4$，所以$f'(1)=15$。

- id: p2
  tier: easy
  statement: |
    $f(x)=\sqrt{x^2+9}$，求$f'(4)$。
  answer:
    type: number
    value: 4/5
  hints:
    - |
      外层是$\sqrt u$，里层是$u=x^2+9$；$(\sqrt u)'=\frac1{2\sqrt u}$。
    - |
      $f'(x)=\frac{2x}{2\sqrt{x^2+9}}=\frac{x}{\sqrt{x^2+9}}$。
    - |
      $f'(4)=\frac4{\sqrt{25}}=\frac45$。
  solution: |
    $f'(x)=\frac1{2\sqrt{x^2+9}}\cdot2x=\frac{x}{\sqrt{x^2+9}}$，所以$f'(4)=\frac45$。

- id: p3
  tier: medium
  statement: |
    曲线$y=\frac1{(x^2+1)^2}$在$x=1$处的切线是$y=kx+b$。求$k$和$b$，依次填写。
  answer:
    type: tuple
    value: [-1/2, 3/4]
  hints:
    - |
      把$y$写成$(x^2+1)^{-2}$，外层用整数次幂的幂法则，里层是$x^2+1$。切线过$(1,y(1))$，斜率是$y'(1)$。
    - |
      $y'=-2(x^2+1)^{-3}\cdot2x=-\frac{4x}{(x^2+1)^3}$；$y(1)=\frac14$。
    - |
      $k=y'(1)=-\frac48=-\frac12$。切线$y=\frac14-\frac12(x-1)=-\frac12x+\frac34$，所以$b=\frac34$。
  solution: |
    $y'=-2(x^2+1)^{-3}\cdot2x=-\frac{4x}{(x^2+1)^3}$，$k=y'(1)=-\frac12$。切线过$\bigl(1,\frac14\bigr)$：$y=\frac14-\frac12(x-1)=-\frac12x+\frac34$，所以$b=\frac34$。

- id: p4
  tier: medium
  statement: |
    已知$f(1)=2$，$f'(1)=4$，$f'(2)=6$，$g(1)=2$，$g'(1)=3$，$g'(2)=-1$。令$h(x)=f(g(x))$，$k(x)=g(f(x))$，求$h'(1)$和$k'(1)$，依次填写。
  answer:
    type: tuple
    value: [18, -4]
  hints:
    - |
      $h'(1)=f'(g(1))\,g'(1)$，$k'(1)=g'(f(1))\,f'(1)$：外层的导数要在里层的值处取。
    - |
      $g(1)=2$，所以$h'(1)=f'(2)\cdot g'(1)$；$f(1)=2$，所以$k'(1)=g'(2)\cdot f'(1)$。
    - |
      $h'(1)=6\cdot3=18$，$k'(1)=(-1)\cdot4=-4$。
  solution: |
    由链式法则，$h'(1)=f'(g(1))g'(1)=f'(2)\cdot3=18$，$k'(1)=g'(f(1))f'(1)=g'(2)\cdot4=-4$。复合的次序一换，导数就不同了。

- id: p5
  tier: hard
  statement: |
    不假定$\Delta u\ne0$，证明链式法则。设$g$在$x_0$处可导，$f$在$u_0=g(x_0)$处可导，令$\varphi(u)=\frac{f(u)-f(u_0)}{u-u_0}$（$u\ne u_0$），$\varphi(u_0)=f'(u_0)$。（1）证明$\varphi$在$u_0$处连续，并且对$u_0$附近所有的$u$（包括$u=u_0$）都有$f(u)-f(u_0)=\varphi(u)(u-u_0)$。（2）由此证明$x\to x_0$时$\frac{f(g(x))-f(g(x_0))}{x-x_0}\to f'(u_0)g'(x_0)$。
  hints:
    - |
      （1）连续就是$\lim_{u\to u_0}\varphi(u)=\varphi(u_0)$，这正是导数的定义。等式在$u=u_0$时两边都是$0$。
    - |
      （2）在等式里代入$u=g(x)$：$f(g(x))-f(g(x_0))=\varphi(g(x))\bigl(g(x)-g(x_0)\bigr)$，两边除以$x-x_0$。$g$在$x_0$处连续。
    - |
      （1）$u\ne u_0$时$\varphi(u)$就是$f$的差商，$u\to u_0$时趋于$f'(u_0)=\varphi(u_0)$，所以$\varphi$在$u_0$处连续。$u\ne u_0$时等式就是$\varphi$的定义乘出来；$u=u_0$时两边都是$0$。

      （2）$\frac{f(g(x))-f(g(x_0))}{x-x_0}=\varphi(g(x))\cdot\frac{g(x)-g(x_0)}{x-x_0}$，对所有$x\ne x_0$都成立，不用除以$g(x)-g(x_0)$。$g$在$x_0$处可导所以连续，$g(x)\to u_0$；$\varphi$在$u_0$处连续，所以$\varphi(g(x))\to\varphi(u_0)=f'(u_0)$（[连续与间断](lesson:math.calculus.continuity)里复合函数的连续性，外层连续时不用要求$g(x)\ne u_0$）。第二个因子趋于$g'(x_0)$，乘起来就是$f'(u_0)g'(x_0)$。
  reference: |
    （1）$\lim_{u\to u_0}\varphi(u)=f'(u_0)=\varphi(u_0)$；等式在$u\ne u_0$时由定义，$u=u_0$时两边为$0$。

    （2）$\frac{f(g(x))-f(g(x_0))}{x-x_0}=\varphi(g(x))\frac{g(x)-g(x_0)}{x-x_0}$；$g(x)\to u_0$，$\varphi$在$u_0$连续，故$\varphi(g(x))\to f'(u_0)$；乘积趋于$f'(u_0)g'(x_0)$。关键：把「除以$\Delta u$」换成「乘以连续函数$\varphi$」，$\Delta u=0$时也成立。

- id: p6
  tier: hard
  statement: |
    设$f$在$\R$上可导。

    （1）证明：$f$是偶函数时，$f'$是奇函数；$f$是奇函数时，$f'$是偶函数。

    （2）$f$以$T$为周期时，$f'$也以$T$为周期吗？说明理由。

    （3）$f'$是偶函数时，$f$一定是奇函数吗？
  hints:
    - |
      （1）对恒等式$f(-x)=f(x)$两边求导，左边是复合函数，里层是$-x$。（2）对$f(x+T)=f(x)$两边求导。
    - |
      $\bigl(f(-x)\bigr)'=-f'(-x)$，$\bigl(f(x+T)\bigr)'=f'(x+T)$。（3）找一个导数是常数、本身却不是奇函数的函数。
    - |
      （1）$f$是偶函数：两边求导得$-f'(-x)=f'(x)$，即$f'(-x)=-f'(x)$，$f'$是奇函数。$f$是奇函数：$f(-x)=-f(x)$，求导得$-f'(-x)=-f'(x)$，$f'$是偶函数。

      （2）是：$f'(x+T)=f'(x)$。

      （3）不一定：$f(x)=x+1$，$f'=1$是偶函数，$f(0)=1\ne0$，$f$不是奇函数。差一个常数，奇偶性就没了。
  reference: |
    （1）$-f'(-x)=f'(x)$；$-f'(-x)=-f'(x)$。

    （2）$f'(x+T)=f'(x)$，是。

    （3）否，$f=x+1$。（$f'$是奇函数时$f$一定是偶函数，要用「导数为零的函数是常数」，见微分中值定理。）

- id: p7
  tier: thinking
  statement: |
    链式法则要求里层、外层都可导。

    （1）$g(x)=|x|$，$f(u)=u^2$：$f(g(x))$在$0$处可导吗？能不能用链式法则算？

    （2）$f(u)=|u|$，$g(x)=x^2$呢？

    （3）这说明链式法则的条件是什么性质的条件？能不能找一个例子，里层、外层在相关的点处都不可导，复合函数却可导？
  hints:
    - |
      （1）（2）先把复合函数化简出来。
    - |
      （1）$|x|^2=x^2$；（2）$|x^2|=x^2$。（3）试着让外层的「拐角」正好把里层的「拐角」抵消掉：里层在$0$的两侧斜率是$1$和$2$，外层呢？
    - |
      （1）$f(g(x))=x^2$在$0$处可导，导数是$0$；但$|x|$在$0$处不可导，链式法则用不上。（2）$f(g(x))=x^2$可导；外层$|u|$在$u=g(0)=0$处不可导，链式法则同样用不上。

      （3）链式法则的条件是充分条件：满足就一定可导，不满足时要另外判断。例子：$g(x)=x$（$x\ge0$），$g(x)=2x$（$x<0$）；$f(u)=u$（$u\ge0$），$f(u)=\frac u2$（$u<0$）。两个在$0$处都有拐角，复合起来$f(g(x))=x$，处处可导。
  reference: |
    （1）$x^2$，可导；$|x|$在 0 不可导，不能套链式法则。

    （2）$x^2$，可导；$|u|$在 0 不可导。

    （3）充分非必要。例：$g=x$（$x\ge0$）、$2x$（$x<0$），$f=u$（$u\ge0$）、$\frac u2$（$u<0$），$f\circ g=x$。

- id: p8
  tier: thinking
  statement: |
    （1）一个球形气球的半径每秒增加$2\,\mathrm{cm}$。半径是$10\,\mathrm{cm}$时，体积每秒增加多少？

    （2）把时间的单位从秒换成分钟，$\dv Vt$的数值变成原来的多少倍？用链式法则说明。

    （3）举一个生活里「变化率相乘」的例子，说明它为什么就是链式法则。
  hints:
    - |
      （1）体积$V=\frac43\pi r^3$，$r$是时间$t$的函数，$V$对$t$的导数用链式法则。（2）设$s$是以秒计的时间，$m$是以分钟计的时间，$s=60m$。
    - |
      （1）$\dv Vt=\dv Vr\cdot\dv rt=4\pi r^2\cdot\dv rt$。（2）$\dv Vm=\dv Vs\cdot\dv sm$。
    - |
      （1）$\dv Vt=4\pi\cdot100\cdot2=800\pi\approx2513\,\mathrm{cm}^3/\mathrm{s}$。半径增加的速度不变，体积却越增越快，因为$\dv Vr=4\pi r^2$越来越大。

      （2）$\dv Vm=\dv Vs\cdot60$，数值变成原来的$60$倍：每分钟增加的是每秒增加的$60$倍。

      （3）例如汽车每公里耗油$0.08$升，每小时走$60$公里，每小时耗油$0.08\times60=4.8$升：油量是路程的函数，路程是时间的函数，「升每小时」=「升每公里」×「公里每小时」。
  reference: |
    （1）$800\pi\,\mathrm{cm}^3/\mathrm{s}$。

    （2）$60$倍（$s=60m$，$\dv sm=60$）。

    （3）任何「A 随 B 变、B 随 C 变」的单位换算都可以，关键是各层的变化率相乘。
