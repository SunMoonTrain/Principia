<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-size="14">
  <!-- 三条数轴上的小区间长 20、60、120 像素：g′(x) = 3，f′(u) = 2 -->
  <line x1="150" y1="60" x2="440" y2="60" stroke="currentColor" stroke-width="1.2" />
  <line x1="150" y1="150" x2="440" y2="150" stroke="currentColor" stroke-width="1.2" />
  <line x1="150" y1="240" x2="440" y2="240" stroke="currentColor" stroke-width="1.2" />
  <text x="136" y="65" font-size="13" text-anchor="end" fill="currentColor" ><tspan font-style="italic">x</tspan></text>
  <text x="136" y="155" font-size="13" text-anchor="end" fill="currentColor" ><tspan font-style="italic">u</tspan> = <tspan font-style="italic">g</tspan>(<tspan font-style="italic">x</tspan>)</text>
  <text x="136" y="245" font-size="13" text-anchor="end" fill="currentColor" ><tspan font-style="italic">y</tspan> = <tspan font-style="italic">f</tspan>(<tspan font-style="italic">u</tspan>)</text>
  <line x1="300" y1="60" x2="280" y2="150" stroke="currentColor" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.7" />
  <line x1="320" y1="60" x2="340" y2="150" stroke="currentColor" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.7" />
  <line x1="280" y1="150" x2="250" y2="240" stroke="currentColor" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.7" />
  <line x1="340" y1="150" x2="370" y2="240" stroke="currentColor" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.7" />
  <line x1="300" y1="60" x2="320" y2="60" style="stroke: var(--accent, #2563eb)" stroke-width="5" stroke-linecap="butt"/>
  <line x1="300" y1="54" x2="300" y2="66" stroke="currentColor" stroke-width="1.2" />
  <line x1="320" y1="54" x2="320" y2="66" stroke="currentColor" stroke-width="1.2" />
  <line x1="280" y1="150" x2="340" y2="150" style="stroke: var(--accent, #2563eb)" stroke-width="5" stroke-linecap="butt"/>
  <line x1="280" y1="144" x2="280" y2="156" stroke="currentColor" stroke-width="1.2" />
  <line x1="340" y1="144" x2="340" y2="156" stroke="currentColor" stroke-width="1.2" />
  <line x1="250" y1="240" x2="370" y2="240" style="stroke: var(--good, #059669)" stroke-width="5" stroke-linecap="butt"/>
  <line x1="250" y1="234" x2="250" y2="246" stroke="currentColor" stroke-width="1.2" />
  <line x1="370" y1="234" x2="370" y2="246" stroke="currentColor" stroke-width="1.2" />
  <text x="310" y="46" font-size="13" text-anchor="middle" fill="currentColor" >Δ<tspan font-style="italic">x</tspan></text>
  <text x="352" y="140" font-size="13" text-anchor="start" fill="currentColor" >Δ<tspan font-style="italic">u</tspan> ≈ <tspan font-style="italic">g</tspan>′(<tspan font-style="italic">x</tspan>) Δ<tspan font-style="italic">x</tspan></text>
  <text x="310" y="266" font-size="13" text-anchor="middle" fill="currentColor" >Δ<tspan font-style="italic">y</tspan> ≈ <tspan font-style="italic">f</tspan>′(<tspan font-style="italic">u</tspan>) Δ<tspan font-style="italic">u</tspan></text>
  <text x="448" y="110" font-size="13" text-anchor="start" fill="currentColor" >放大 <tspan font-style="italic">g</tspan>′(<tspan font-style="italic">x</tspan>) 倍</text>
  <text x="448" y="200" font-size="13" text-anchor="start" fill="currentColor" >放大 <tspan font-style="italic">f</tspan>′(<tspan font-style="italic">u</tspan>) 倍</text>
  <text x="280" y="286" font-size="13" text-anchor="middle" fill="currentColor" >合起来，Δ<tspan font-style="italic">y</tspan> ≈ <tspan font-style="italic">f</tspan>′(<tspan font-style="italic">u</tspan>) <tspan font-style="italic">g</tspan>′(<tspan font-style="italic">x</tspan>) Δ<tspan font-style="italic">x</tspan></text>
</svg>
