id: math.calculus
title: |
  单变量微积分
proofPolicy: sketch
macros:
  \R: |
    \mathbb{R}
  \dd: |
    \mathop{}\!\mathrm{d}
  \dv: |
    \frac{\mathrm{d} #1}{\mathrm{d} #2}
glossary:
  - id: math.calculus.limit
    zh: |
      极限
    en: |
      limit
    abbr: |
      lim
    brief: |
      $x$从两侧无限靠近$a$（$x\ne a$）时，$f(x)$无限接近的数$L$，记作$\lim_{x\to a}f(x)=L$；和$f(a)$无关。
    definedIn: math.calculus.limits-intuition
    anchor: def-limit
  - id: math.calculus.left-limit
    zh: |
      左极限
    en: |
      left-hand limit
    brief: |
      只让$x$从左边（$x<a$）无限靠近$a$时$f(x)$无限接近的数，记作$\lim_{x\to a^-}f(x)$。
    definedIn: math.calculus.limits-intuition
    anchor: def-one-sided-limit
  - id: math.calculus.right-limit
    zh: |
      右极限
    en: |
      right-hand limit
    brief: |
      只让$x$从右边（$x>a$）无限靠近$a$时$f(x)$无限接近的数，记作$\lim_{x\to a^+}f(x)$。
    definedIn: math.calculus.limits-intuition
    anchor: def-one-sided-limit
  - id: math.calculus.one-sided-limit
    zh: |
      单侧极限
    en: |
      one-sided limit
    brief: |
      左极限和右极限的统称；两者都存在并且相等时，极限才存在。
    definedIn: math.calculus.limits-intuition
    anchor: def-one-sided-limit
  - id: math.calculus.infinity
    zh: |
      无穷大
    en: |
      infinity
    brief: |
      $x\to a$时$|f(x)|$无限增大，记作$\lim_{x\to a}f(x)=\infty$；这时极限不存在，记号只说明它怎样不存在。
    definedIn: math.calculus.limits-intuition
    anchor: def-infinity
  - id: math.calculus.limit-laws
    zh: |
      极限的四则运算法则
    en: |
      limit laws
    brief: |
      $\lim f=A$、$\lim g=B$都存在时，$f\pm g$、$fg$的极限是$A\pm B$、$AB$；$B\ne0$时$\frac fg$的极限是$\frac AB$。
    definedIn: math.calculus.limit-laws
    anchor: thm-limit-laws
  - id: math.calculus.zero-over-zero
    zh: |
      $\frac00$型
    en: |
      indeterminate form 0/0
    brief: |
      $x\to a$时分子、分母都趋于$0$的分式；四则运算法则对它不起作用，要先约分、有理化等变形再求极限。
    definedIn: math.calculus.limit-laws
    anchor: def-zero-over-zero
  - id: math.calculus.direct-substitution
    zh: |
      代入法
    en: |
      direct substitution
    brief: |
      多项式在$a$处的极限等于它在$a$处的值；分母在$a$处不为零的有理函数、开方也一样，求极限直接代入。
    definedIn: math.calculus.limit-laws
    anchor: thm-substitution
  - id: math.calculus.squeeze-theorem
    zh: |
      夹逼定理
    en: |
      squeeze theorem
    brief: |
      在$a$附近$g\le f\le h$，并且$g$、$h$的极限都是$L$，则$f$的极限也是$L$。
    definedIn: math.calculus.limit-laws
    anchor: thm-squeeze
  - id: math.calculus.continuous
    zh: |
      连续
    en: |
      continuous
    brief: |
      $f$在$a$处连续：$\lim_{x\to a}f(x)=f(a)$，图像在那里不断开；区间上每一点都连续的函数叫连续函数。
    definedIn: math.calculus.continuity
    anchor: def-continuous
  - id: math.calculus.elementary-function
    zh: |
      初等函数
    en: |
      elementary function
    brief: |
      由常数和基本初等函数（幂、指数、对数、三角、反三角函数）经有限次四则运算和复合得到、用一个式子表示的函数。
    definedIn: math.calculus.continuity
    anchor: def-elementary-function
  - id: math.calculus.discontinuity
    zh: |
      间断点
    en: |
      point of discontinuity
    brief: |
      $f$在$a$附近有定义（$a$本身可以除外），却在$a$处不连续，$a$就叫$f$的间断点。
    definedIn: math.calculus.continuity
    anchor: def-discontinuity
  - id: math.calculus.removable-discontinuity
    zh: |
      可去间断点
    en: |
      removable discontinuity
    brief: |
      极限存在，但$f(a)$没有定义或不等于这个极限的间断点；把$f(a)$改成这个极限，间断就去掉了。
    definedIn: math.calculus.continuity
    anchor: def-removable
  - id: math.calculus.jump-discontinuity
    zh: |
      跳跃间断点
    en: |
      jump discontinuity
    brief: |
      左极限、右极限都存在但不相等的间断点，例如$\lfloor x\rfloor$的每个整数点。
    definedIn: math.calculus.continuity
    anchor: def-jump
  - id: math.calculus.infinite-discontinuity
    zh: |
      无穷间断点
    en: |
      infinite discontinuity
    brief: |
      $x$从某一侧趋于$a$时$f(x)$是无穷大的间断点，例如$\frac1x$的$x=0$。
    definedIn: math.calculus.continuity
    anchor: def-infinite-discontinuity
  - id: math.calculus.limit-at-infinity
    zh: |
      无穷远处的极限
    en: |
      limit at infinity
    brief: |
      $x$无限增大时$f(x)$无限接近$L$，记作$\lim_{x\to+\infty}f(x)=L$；$x\to-\infty$类似，两个方向都是$L$时记作$x\to\infty$。
    definedIn: math.calculus.limits-at-infinity
    anchor: def-limit-at-infinity
  - id: math.calculus.sequence-limit
    zh: |
      数列的极限
    en: |
      limit of a sequence
    brief: |
      $n$无限增大时$a_n$无限接近的数$L$，记作$\lim_{n\to\infty}a_n=L$，例如$\frac1n\to0$。
    definedIn: math.calculus.limits-at-infinity
    anchor: def-sequence-limit
  - id: math.calculus.convergent-sequence
    zh: |
      收敛数列
    en: |
      convergent sequence
    brief: |
      有极限的数列；极限是$L$时也说它收敛于$L$。
    definedIn: math.calculus.limits-at-infinity
    anchor: def-sequence-limit
  - id: math.calculus.divergent-sequence
    zh: |
      发散数列
    en: |
      divergent sequence
    brief: |
      没有极限的数列，例如$\{(-1)^n\}$；趋于无穷大的数列$\{n\}$也是发散数列。
    definedIn: math.calculus.limits-at-infinity
    anchor: def-sequence-limit
  - id: math.calculus.horizontal-asymptote
    zh: |
      水平渐近线
    en: |
      horizontal asymptote
    brief: |
      $\lim_{x\to+\infty}f(x)=L$或$\lim_{x\to-\infty}f(x)=L$时，直线$y=L$叫曲线$y=f(x)$的水平渐近线。
    definedIn: math.calculus.limits-at-infinity
    anchor: def-horizontal-asymptote
  - id: math.calculus.vertical-asymptote
    zh: |
      竖直渐近线
    en: |
      vertical asymptote
    brief: |
      $x$从某一侧趋于$a$时$f(x)$是无穷大，直线$x=a$就叫曲线$y=f(x)$的竖直渐近线。
    definedIn: math.calculus.limits-at-infinity
    anchor: def-vertical-asymptote
  - id: math.calculus.first-special-limit
    zh: |
      第一个重要极限
    en: |
      limit of $\frac{\sin x}{x}$
    brief: |
      $\lim_{x\to0}\frac{\sin x}{x}=1$（$x$用弧度），由单位圆上的面积比较和夹逼定理得到。
    definedIn: math.calculus.special-limits
    anchor: thm-sin-limit
  - id: math.calculus.second-special-limit
    zh: |
      第二个重要极限
    en: |
      limit defining $e$
    brief: |
      $\lim_{x\to\infty}\left(1+\frac1x\right)^x=e\approx2.71828$，也写成$\lim_{t\to0}(1+t)^{\frac1t}=e$。
    definedIn: math.calculus.special-limits
    anchor: thm-e-limit
  - id: math.calculus.bounded-function
    zh: |
      有界函数
    en: |
      bounded function
    brief: |
      存在正数$M$，使区间里所有$x$都满足$|f(x)|\le M$的函数；有界不有界和考虑的区间有关。
    definedIn: math.calculus.closed-interval-properties
    anchor: def-bounded
  - id: math.calculus.extreme-value-theorem
    zh: |
      最值定理
    en: |
      extreme value theorem
    brief: |
      闭区间$[a,b]$上的连续函数一定有界，并且取得到最大值和最小值。
    definedIn: math.calculus.closed-interval-properties
    anchor: thm-extreme-value
  - id: math.calculus.intermediate-value-theorem
    zh: |
      介值定理
    en: |
      intermediate value theorem
    brief: |
      $f$在$[a,b]$上连续，$c$严格介于$f(a)$与$f(b)$之间，则有$\xi\in(a,b)$使$f(\xi)=c$。
    definedIn: math.calculus.closed-interval-properties
    anchor: thm-intermediate-value
  - id: math.calculus.zero-theorem
    zh: |
      零点定理
    en: |
      Bolzano's theorem
    brief: |
      $f$在$[a,b]$上连续，$f(a)$与$f(b)$异号，则有$\xi\in(a,b)$使$f(\xi)=0$。
    definedIn: math.calculus.closed-interval-properties
    anchor: thm-zero
  - id: math.calculus.infinitesimal
    zh: |
      无穷小
    en: |
      infinitesimal
    brief: |
      $x\to a$时趋于$0$的函数，例如$x\to0$时的$x^2$；说的是一个过程，不是很小的数。
    definedIn: math.calculus.infinitesimal-orders
    anchor: def-infinitesimal
  - id: math.calculus.higher-order-infinitesimal
    zh: |
      高阶无穷小
    en: |
      infinitesimal of higher order
    brief: |
      $\alpha$、$\beta$都是无穷小，$\frac\alpha\beta\to0$时说$\alpha$是比$\beta$高阶的无穷小，记作$\alpha=o(\beta)$。
    definedIn: math.calculus.infinitesimal-orders
    anchor: def-higher-order
  - id: math.calculus.same-order-infinitesimal
    zh: |
      同阶无穷小
    en: |
      infinitesimals of the same order
    brief: |
      比值趋于一个不为零的数的两个无穷小，例如$x\to2$时的$x^2-4$和$x-2$（比值趋于$4$）。
    definedIn: math.calculus.infinitesimal-orders
    anchor: def-same-order
  - id: math.calculus.equivalent-infinitesimal
    zh: |
      等价无穷小
    en: |
      equivalent infinitesimals
    brief: |
      比值趋于$1$的两个无穷小，记作$\alpha\sim\beta$，例如$x\to0$时$\sin x\sim x$；乘除的因子可以互相替换。
    definedIn: math.calculus.infinitesimal-orders
    anchor: def-equivalent
  - id: math.calculus.infinitesimal-order
    zh: |
      $k$阶无穷小
    en: |
      infinitesimal of order k
    brief: |
      与$(x-a)^k$同阶的无穷小，例如$x\to0$时$1-\cos x$是$x$的二阶无穷小。
    definedIn: math.calculus.infinitesimal-orders
    anchor: def-order-k
  - id: math.calculus.difference-quotient
    zh: |
      差商
    en: |
      difference quotient
    brief: |
      $\frac{f(a+h)-f(a)}{h}$（$h\ne0$），$f$在$a$到$a+h$之间的平均变化率，也是过这两点的割线的斜率。
    definedIn: math.calculus.derivative
    anchor: def-difference-quotient
  - id: math.calculus.derivative
    zh: |
      导数
    en: |
      derivative
    brief: |
      差商在$h\to0$时的极限$f'(a)=\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$；它是切线的斜率，也是瞬时变化率。
    definedIn: math.calculus.derivative
    anchor: def-derivative
  - id: math.calculus.differentiable
    zh: |
      可导
    en: |
      differentiable
    brief: |
      差商$\frac{f(a+h)-f(a)}{h}$在$h\to0$时有极限，就说$f$在$a$处可导；可导一定连续，反过来不对。
    definedIn: math.calculus.derivative
    anchor: def-derivative
  - id: math.calculus.secant-line
    zh: |
      割线
    en: |
      secant line
    brief: |
      曲线上两点$(a,f(a))$、$(a+h,f(a+h))$连成的直线，斜率是差商。
    definedIn: math.calculus.derivative
    anchor: def-secant
  - id: math.calculus.tangent-line
    zh: |
      切线
    en: |
      tangent line
    brief: |
      过$(a,f(a))$、斜率为$f'(a)$的直线$y=f(a)+f'(a)(x-a)$；$f$连续而差商是无穷大时，切线是竖直线$x=a$。
    definedIn: math.calculus.derivative
    anchor: def-tangent
  - id: math.calculus.derivative-function
    zh: |
      导函数
    en: |
      derivative function
    brief: |
      让每个$x$对应$f'(x)$得到的新函数，简称导数，记作$f'$、$y'$或$\dv yx$。
    definedIn: math.calculus.derivative
    anchor: def-derivative-function
  - id: math.calculus.product-rule
    zh: |
      乘积法则
    en: |
      product rule
    brief: |
      $u$、$v$可导时$(uv)'=u'v+uv'$；乘积的导数不是导数的乘积。
    definedIn: math.calculus.derivative-rules
    anchor: thm-product-rule
  - id: math.calculus.quotient-rule
    zh: |
      商法则
    en: |
      quotient rule
    brief: |
      $u$、$v$可导、$v\ne0$时$\left(\frac uv\right)'=\frac{u'v-uv'}{v^2}$，分子的顺序不能换。
    definedIn: math.calculus.derivative-rules
    anchor: thm-quotient-rule
  - id: math.calculus.power-rule
    zh: |
      幂法则
    en: |
      power rule
    brief: |
      $(x^n)'=nx^{n-1}$，这里$n$是整数，$n\le0$时要求$x\ne0$。
    definedIn: math.calculus.derivative-rules
    anchor: thm-power-rule
  - id: math.calculus.linear-approximation
    zh: |
      线性近似
    en: |
      linear approximation
    brief: |
      一次函数$L(x)=f(a)+f'(a)(x-a)$，图像是$a$处的切线；$x$靠近$a$时用它近似$f(x)$，误差比$x-a$小得多。
    definedIn: math.calculus.differentials
    anchor: def-linear-approximation
  - id: math.calculus.differential
    zh: |
      微分
    en: |
      differential
    brief: |
      $f$可导时$\dd y=f'(x)\dd x$，自变量的微分$\dd x$就是增量$\Delta x$；它是沿切线的增量，$\Delta x$很小时近似等于$\Delta y$。
    definedIn: math.calculus.differentials
    anchor: def-differential
  - id: math.calculus.chain-rule
    zh: |
      链式法则
    en: |
      chain rule
    brief: |
      $\bigl(f(g(x))\bigr)'=f'(g(x))\,g'(x)$：复合函数的导数是外层导数（在$g(x)$处取值）乘里层导数。
    definedIn: math.calculus.chain-rule
    anchor: thm-chain-rule
  - id: math.calculus.local-maximum
    zh: |
      极大值
    en: |
      local maximum
    brief: |
      有$\delta>0$，使$|x-x_0|<\delta$时都有$f(x)\le f(x_0)$，就说$f(x_0)$是极大值；只和附近的点比。
    definedIn: math.calculus.local-extrema
    anchor: def-local-extremum
  - id: math.calculus.local-minimum
    zh: |
      极小值
    en: |
      local minimum
    brief: |
      有$\delta>0$，使$|x-x_0|<\delta$时都有$f(x)\ge f(x_0)$，就说$f(x_0)$是极小值；只和附近的点比。
    definedIn: math.calculus.local-extrema
    anchor: def-local-extremum
  - id: math.calculus.local-extremum
    zh: |
      极值
    en: |
      local extremum
    brief: |
      极大值和极小值的统称；只和附近的点比，不同于和整个定义域比的最大值、最小值。
    definedIn: math.calculus.local-extrema
    anchor: def-local-extremum
  - id: math.calculus.extremum-point
    zh: |
      极值点
    en: |
      extremum point
    brief: |
      取到极值的点，即极大值点、极小值点的统称；它两侧都要有定义，区间的端点不算。
    definedIn: math.calculus.local-extrema
    anchor: def-local-extremum
  - id: math.calculus.fermat-theorem
    zh: |
      费马定理
    en: |
      Fermat's theorem
    brief: |
      $x_0$是$f$的极值点、$f$在$x_0$处可导时，$f'(x_0)=0$：可导函数的极值点都是驻点。
    definedIn: math.calculus.local-extrema
    anchor: thm-fermat
  - id: math.calculus.stationary-point
    zh: |
      驻点
    en: |
      stationary point
    brief: |
      使$f'(x_0)=0$的点。可导函数的极值点都是驻点，反过来不对，驻点不一定是极值点。
    definedIn: math.calculus.local-extrema
    anchor: def-stationary-point
  - id: math.calculus.second-derivative
    zh: |
      二阶导数
    en: |
      second derivative
    brief: |
      导函数$f'$的导数，记作$f''$或$\dv{^2y}{x^2}$；位置的二阶导数是加速度。
    definedIn: math.calculus.higher-derivatives
    anchor: def-second-derivative
  - id: math.calculus.higher-derivative
    zh: |
      高阶导数
    en: |
      higher-order derivative
    brief: |
      二阶和二阶以上的导数；$n-1$阶导数的导数叫$n$阶导数，记作$f^{(n)}$。
    definedIn: math.calculus.higher-derivatives
    anchor: def-higher-derivative
  - id: math.calculus.leibniz-formula
    zh: |
      莱布尼茨公式
    en: |
      Leibniz rule
    brief: |
      乘积的$n$阶导数$(uv)^{(n)}=\sum_{k=0}^n\binom nku^{(n-k)}v^{(k)}$，系数是二项式系数。
    definedIn: math.calculus.higher-derivatives
    anchor: thm-leibniz
  - id: math.calculus.hyperbolic-sine
    zh: |
      双曲正弦
    en: |
      hyperbolic sine
    abbr: |
      sinh
    brief: |
      $\sinh x=\frac{e^x-e^{-x}}2$，是$e^x$的奇的部分；$(\sinh x)'=\cosh x$。
    definedIn: math.calculus.hyperbolic-functions
    anchor: def-hyperbolic
  - id: math.calculus.hyperbolic-cosine
    zh: |
      双曲余弦
    en: |
      hyperbolic cosine
    abbr: |
      cosh
    brief: |
      $\cosh x=\frac{e^x+e^{-x}}2$，是$e^x$的偶的部分，$\cosh x\ge1$；$(\cosh x)'=\sinh x$。
    definedIn: math.calculus.hyperbolic-functions
    anchor: def-hyperbolic
  - id: math.calculus.hyperbolic-tangent
    zh: |
      双曲正切
    en: |
      hyperbolic tangent
    abbr: |
      tanh
    brief: |
      $\tanh x=\frac{\sinh x}{\cosh x}$，值在$-1$和$1$之间；$(\tanh x)'=1-\tanh^2x$。
    definedIn: math.calculus.hyperbolic-functions
    anchor: def-hyperbolic
  - id: math.calculus.implicit-function
    zh: |
      隐函数
    en: |
      implicit function
    brief: |
      在$(x_0,y_0)$附近，方程对每个$x$恰有一个解$y$时所确定的函数$y(x)$；不要求写得出式子。
    definedIn: math.calculus.implicit-differentiation
    anchor: def-implicit-function
  - id: math.calculus.inverse-function-rule
    zh: |
      反函数的求导法则
    en: |
      inverse function rule
    brief: |
      $f$在区间上连续、严格单调，在$x_0$处可导且$f'(x_0)\ne0$时，$(f^{-1})'(f(x_0))=\frac1{f'(x_0)}$。
    definedIn: math.calculus.implicit-differentiation
    anchor: thm-inverse-derivative
  - id: math.calculus.rolle-theorem
    zh: |
      罗尔定理
    en: |
      Rolle's theorem
    brief: |
      $f$在$[a,b]$上连续、在$(a,b)$内可导、$f(a)=f(b)$时，有$\xi\in(a,b)$使$f'(\xi)=0$。
    definedIn: math.calculus.mean-value-theorem
    anchor: thm-rolle
  - id: math.calculus.mean-value-theorem
    zh: |
      拉格朗日中值定理
    en: |
      mean value theorem
    brief: |
      $f$在$[a,b]$上连续、在$(a,b)$内可导时，有$\xi\in(a,b)$使$f(b)-f(a)=f'(\xi)(b-a)$：某处切线平行于弦。
    definedIn: math.calculus.mean-value-theorem
    anchor: thm-mean-value
  - id: math.calculus.antiderivative
    zh: |
      原函数
    en: |
      antiderivative
    brief: |
      区间上满足$F'=f$的可导函数$F$；同一个函数在区间上的原函数只差一个常数。
    definedIn: math.calculus.antiderivatives
    anchor: def-antiderivative
  - id: math.calculus.indefinite-integral
    zh: |
      不定积分
    en: |
      indefinite integral
    brief: |
      $f$在区间上的全体原函数，记作$\int f(x)\,\dd x=F(x)+C$，$F$是其中任一个。
    definedIn: math.calculus.antiderivatives
    anchor: def-indefinite-integral
  - id: math.calculus.integrand
    zh: |
      被积函数
    en: |
      integrand
    brief: |
      $\int f(x)\,\dd x$里积分号后面的函数$f(x)$，即要求原函数的那个函数。
    definedIn: math.calculus.antiderivatives
    anchor: def-indefinite-integral
  - id: math.calculus.constant-of-integration
    zh: |
      积分常数
    en: |
      constant of integration
    brief: |
      $\int f(x)\,\dd x=F(x)+C$里的任意常数$C$；给定一点处的函数值，就能把它定下来。
    definedIn: math.calculus.antiderivatives
    anchor: def-indefinite-integral
  - id: math.calculus.arcsine
    zh: |
      反正弦函数
    en: |
      arcsine
    brief: |
      $\sin x$在$\bigl[-\frac\pi2,\frac\pi2\bigr]$上的反函数$\arcsin x$，定义在$[-1,1]$上；导数是$\frac1{\sqrt{1-x^2}}$。
    definedIn: math.calculus.implicit-differentiation
    anchor: def-inverse-trig
  - id: math.calculus.arccosine
    zh: |
      反余弦函数
    en: |
      arccosine
    brief: |
      $\cos x$在$[0,\pi]$上的反函数$\arccos x$，定义在$[-1,1]$上；导数是$-\frac1{\sqrt{1-x^2}}$。
    definedIn: math.calculus.implicit-differentiation
    anchor: def-inverse-trig
  - id: math.calculus.arctangent
    zh: |
      反正切函数
    en: |
      arctangent
    brief: |
      $\tan x$在$\bigl(-\frac\pi2,\frac\pi2\bigr)$上的反函数$\arctan x$，定义在整条数轴上；导数是$\frac1{1+x^2}$。
    definedIn: math.calculus.implicit-differentiation
    anchor: def-inverse-trig
  - id: math.calculus.inverse-trigonometric-functions
    zh: |
      反三角函数
    en: |
      inverse trigonometric functions
    brief: |
      $\arcsin x$、$\arccos x$、$\arctan x$等的统称：三角函数截取严格单调的一段后得到的反函数。
    definedIn: math.calculus.implicit-differentiation
    anchor: def-inverse-trig
  - id: math.calculus.hyperbolic-functions
    zh: |
      双曲函数
    en: |
      hyperbolic functions
    brief: |
      $\sinh x$、$\cosh x$、$\tanh x$等的统称；$\cosh^2x-\sinh^2x=1$，点$(\cosh t,\sinh t)$在双曲线上。
    definedIn: math.calculus.hyperbolic-functions
    anchor: def-hyperbolic
