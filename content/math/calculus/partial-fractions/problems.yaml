- id: p1
  tier: easy
  statement: |
    求$\int_0^1\frac{\dd x}{x^2+3x+2}$。
  answer:
    type: number
    value: ln(4/3)
  hints:
    - |
      先把分母分解因式。
    - |
      $x^2+3x+2=(x+1)(x+2)$，$\frac1{(x+1)(x+2)}=\frac1{x+1}-\frac1{x+2}$。
    - |
      一个原函数（antiderivative）是$\ln\frac{x+1}{x+2}$。
  solution: |
    拆成部分分式（partial fractions）$\frac1{x+1}-\frac1{x+2}$，原函数是$\ln\frac{x+1}{x+2}$，代入上下限得$\ln\frac23-\ln\frac12=\ln\frac43\approx0.288$。

- id: p2
  tier: easy
  statement: |
    把$\frac{3x+1}{(x-1)(x+1)}$写成$\frac A{x-1}+\frac B{x+1}$。依次填$A$、$B$。
  answer:
    type: tuple
    value: [2, 1]
  hints:
    - |
      两边乘以$(x-1)(x+1)$。
    - |
      得$3x+1=A(x+1)+B(x-1)$，对所有$x$成立。
    - |
      代入$x=1$和$x=-1$，各消掉一个未知数。
  solution: |
    $3x+1=A(x+1)+B(x-1)$。代入$x=1$得$4=2A$，$A=2$；代入$x=-1$得$-2=-2B$，$B=1$。

- id: p3
  tier: medium
  statement: |
    求$\int_0^1\frac{x^3}{x^2+1}\,\dd x$。
  answer:
    type: number
    value: (1 - ln(2))/2
  hints:
    - |
      这是假分式（improper fraction），先做多项式除法。
    - |
      $\frac{x^3}{x^2+1}=x-\frac x{x^2+1}$。
    - |
      $\int\frac{x\,\dd x}{x^2+1}=\frac12\ln\bigl(x^2+1\bigr)+C$。
  solution: |
    $\int_0^1\Bigl(x-\frac x{x^2+1}\Bigr)\dd x=\Bigl(\frac{x^2}2-\frac12\ln\bigl(x^2+1\bigr)\Bigr)\Big|_0^1=\frac{1-\ln2}2\approx0.153$。

- id: p4
  tier: medium
  statement: |
    求$\int_0^1\frac{\dd x}{x^2+2x+2}$。
  answer:
    type: number
    value: atan(2) - pi/4
  hints:
    - |
      分母的判别式$4-8<0$，不可约（irreducible），先配方。
    - |
      $x^2+2x+2=(x+1)^2+1$，令$u=x+1$。
    - |
      $x$从$0$到$1$时，$u$从$1$到$2$，原式等于$\int_1^2\frac{\dd u}{u^2+1}$。
  solution: |
    $\int_0^1\frac{\dd x}{(x+1)^2+1}=\int_1^2\frac{\dd u}{u^2+1}=\arctan2-\frac\pi4\approx0.322$。

- id: p5
  tier: hard
  statement: |
    记$J_m=\int\frac{\dd u}{(u^2+1)^m}$，$m$是正整数。

    （1）验证$\Bigl[\frac u{(u^2+1)^m}\Bigr]'=\frac{1-2m}{(u^2+1)^m}+\frac{2m}{(u^2+1)^{m+1}}$。

    （2）由此得到递推公式$J_{m+1}=\frac1{2m}\Bigl[\frac u{(u^2+1)^m}+(2m-1)J_m\Bigr]$。

    （3）求$\int_0^1\frac{\dd u}{(u^2+1)^2}$。
  hints:
    - |
      （1）写成$u(u^2+1)^{-m}$，用乘积法则（product rule）和链式法则（chain rule）。
    - |
      （1）求导后出现$\frac{-2mu^2}{(u^2+1)^{m+1}}$，把$u^2$写成$(u^2+1)-1$。（2）把（1）的两边积分。
    - |
      （1）$\bigl[u(u^2+1)^{-m}\bigr]'=(u^2+1)^{-m}-2mu^2(u^2+1)^{-m-1}$，而$u^2=(u^2+1)-1$，整理即得。

      （2）两边积分：$\frac u{(u^2+1)^m}=(1-2m)J_m+2mJ_{m+1}$，解出$J_{m+1}$。

      （3）$m=1$：$J_2=\frac12\Bigl[\frac u{u^2+1}+\arctan u\Bigr]+C$，所以$\int_0^1\frac{\dd u}{(u^2+1)^2}=\frac12\Bigl(\frac12+\frac\pi4\Bigr)=\frac14+\frac\pi8$。
  reference: |
    （1）乘积法则，再用$u^2=(u^2+1)-1$。

    （2）对（1）积分，解出$J_{m+1}$。

    （3）$\frac14+\frac\pi8\approx0.643$。

- id: p6
  tier: hard
  statement: |
    （1）设$Q(x)=(x-a_1)(x-a_2)\cdots(x-a_n)$，$a_1,\dots,a_n$互不相同，多项式$P$的次数小于$n$，$\frac{P(x)}{Q(x)}=\sum_{i=1}^n\frac{A_i}{x-a_i}$。证明$A_i=\frac{P(a_i)}{Q'(a_i)}$。

    （2）把$\frac{x^2+1}{(x-1)(x-2)(x-3)}$拆成部分分式。
  hints:
    - |
      （1）两边乘以$x-a_i$，再让$x\to a_i$。
    - |
      （1）右边乘以$x-a_i$以后，除了$A_i$，别的项都带着因子$x-a_i$，趋于$0$。左边的$\frac{x-a_i}{Q(x)}$：$Q(a_i)=0$，所以$\frac{Q(x)}{x-a_i}=\frac{Q(x)-Q(a_i)}{x-a_i}$。
    - |
      （1）$x\to a_i$时，$\frac{Q(x)-Q(a_i)}{x-a_i}\to Q'(a_i)$，它不为$0$（$Q'(a_i)$等于其余$n-1$个因子在$a_i$处的乘积），所以左边趋于$\frac{P(a_i)}{Q'(a_i)}$，右边趋于$A_i$。

      （2）$Q'(1)=(1-2)(1-3)=2$，$Q'(2)=(2-1)(2-3)=-1$，$Q'(3)=(3-1)(3-2)=2$，所以$A_1=\frac22=1$，$A_2=\frac5{-1}=-5$，$A_3=\frac{10}2=5$，即$\frac1{x-1}-\frac5{x-2}+\frac5{x-3}$。
  reference: |
    （1）乘以$x-a_i$后令$x\to a_i$，$\frac{Q(x)}{x-a_i}\to Q'(a_i)$。

    （2）$\frac1{x-1}-\frac5{x-2}+\frac5{x-3}$。

- id: p7
  tier: thinking
  statement: |
    （1）部分分式有四种，它们的原函数各是什么样的函数？

    （2）为什么说有理函数的原函数都是初等函数（elementary function）？这和$e^{-x^2}$有什么不同？

    （3）$\frac1{x^4+1}$的原函数也是初等函数吗？
  hints:
    - |
      （1）看讲解里的「逐项积分」。（3）$x^4+1$能不能分解成两个实系数的二次因式？
    - |
      （3）$x^4+1=\bigl(x^2+1\bigr)^2-2x^2=\bigl(x^2+\sqrt2x+1\bigr)\bigl(x^2-\sqrt2x+1\bigr)$。
    - |
      （1）$\frac A{x-a}$积成对数；$\frac A{(x-a)^k}$积成有理函数；$\frac{Bx+C}{x^2+px+q}$积成对数加反正切；二次因式的高次幂用递推，积成有理函数加反正切。

      （2）每个有理函数都能拆成这四种项，所以原函数总是有理函数、对数、反正切的组合。$e^{-x^2}$不是有理函数，这个结论管不到它；它的原函数确实写不成初等函数。

      （3）是。两个二次因式的判别式都是$2-4<0$，不可约，$\frac1{x^4+1}$拆成两个$\frac{Bx+C}{x^2\pm\sqrt2x+1}$，每一项都积成对数加反正切。
  reference: |
    （1）对数；有理函数；对数加反正切；有理函数加反正切。

    （2）有理函数都能拆成这四种项；$e^{-x^2}$不是有理函数。

    （3）是：$x^4+1=\bigl(x^2+\sqrt2x+1\bigr)\bigl(x^2-\sqrt2x+1\bigr)$。

- id: p8
  tier: thinking
  statement: |
    （1）$x\to1$时，$\frac{x+5}{(x-1)(x+2)}$主要像它的哪一个部分分式？用这一点说明$A=\lim_{x\to1}(x-1)\frac{x+5}{(x-1)(x+2)}$。

    （2）$\frac x{(x-1)^2}$为什么要设成$\frac A{x-1}+\frac B{(x-1)^2}$两项？只设$\frac B{(x-1)^2}$会怎样？

    （3）分母是$n$次多项式时，待定的常数一共几个？为什么正好够用？
  hints:
    - |
      （1）两个部分分式里，哪一个在$x\to1$时冲向无穷？
    - |
      （2）分子写成$x=(x-1)+1$。（3）两边乘以分母以后，比较的是两个次数小于$n$的多项式。
    - |
      （1）$\frac2{x-1}$冲向无穷，$-\frac1{x+2}$趋于$-\frac13$，所以主要像$\frac2{x-1}$。乘以$x-1$，得$2-\frac{x-1}{x+2}\to2$，正是$A$。

      （2）$\frac x{(x-1)^2}=\frac{(x-1)+1}{(x-1)^2}=\frac1{x-1}+\frac1{(x-1)^2}$。只设$\frac B{(x-1)^2}$，就要$x=B$对所有$x$成立，做不到。

      （3）一次因式的$k$次幂给$k$个常数，二次因式的$m$次幂给$2m$个，总数是$n$。乘以分母后，两边都是次数小于$n$的多项式，比较系数得到$n$个方程，正好定出$n$个常数。
  reference: |
    （1）像$\frac2{x-1}$；乘以$x-1$后极限是$2$。

    （2）$\frac x{(x-1)^2}=\frac1{x-1}+\frac1{(x-1)^2}$，少一项对不上。

    （3）$n$个常数，$n$个方程。
