- id: p1
  tier: easy
  statement: |
    曲线$y=\frac{2x^2+3x}{x+1}$的斜渐近线（oblique asymptote）是$y=kx+b$。求$(k,b)$。
  answer:
    type: tuple
    value: [2, 1]
  hints:
    - |
      $k=\lim_{x\to\infty}\frac{f(x)}x$，$b=\lim_{x\to\infty}\bigl[f(x)-kx\bigr]$；也可以做多项式除法。
    - |
      $\frac{f(x)}x=\frac{2x+3}{x+1}\to2$。
    - |
      $f(x)-2x=\frac{2x^2+3x-2x^2-2x}{x+1}=\frac{x}{x+1}\to1$。
  solution: |
    做除法，$\frac{2x^2+3x}{x+1}=2x+1-\frac1{x+1}$，最后一项在$x\to\pm\infty$时趋于$0$，所以斜渐近线是$y=2x+1$，$(k,b)=(2,1)$。

- id: p2
  tier: easy
  statement: |
    求曲线$y=e^{-x^2}$的拐点（inflection point）的横坐标。
  answer:
    type: set
    value: [-1/sqrt(2), 1/sqrt(2)]
  hints:
    - |
      求二阶导数（second derivative），用链式法则（chain rule）。
    - |
      $y'=-2xe^{-x^2}$，$y''=(4x^2-2)e^{-x^2}$。
    - |
      $e^{-x^2}>0$，$y''$的正负和$4x^2-2$一样，在$x=\pm\frac1{\sqrt2}$处变号。
  solution: |
    $y''=(4x^2-2)e^{-x^2}$。$|x|<\frac1{\sqrt2}$时$y''<0$，$|x|>\frac1{\sqrt2}$时$y''>0$，所以拐点的横坐标是$\pm\frac1{\sqrt2}=\pm\frac{\sqrt2}2$。

- id: p3
  tier: medium
  statement: |
    关于曲线$y=\frac{x^2-4}{x^2-1}$，下面哪些说法对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        有两条竖直渐近线$x=\pm1$。
      - |
        $y=1$是它的水平渐近线。
      - |
        $f(0)=4$是极大值。
      - |
        曲线和$x$轴交于$(\pm2,0)$。
    value: [1, 2, 4]
  hints:
    - |
      看分母为$0$处的极限，以及$x\to\pm\infty$时的极限。
    - |
      $y=1-\frac3{x^2-1}$，$y'=\frac{6x}{(x^2-1)^2}$。
    - |
      $y'$在$0$左侧为负、右侧为正。
  solution: |
    A：$x\to\pm1$时分子趋于$-3$、分母趋于$0$，所以$x=\pm1$是竖直渐近线。B：$y=1-\frac3{x^2-1}\to1$，$y=1$是水平渐近线。D：$x=\pm2$时$y=0$。C 不对：$y'=\frac{6x}{(x^2-1)^2}$在$0$处左负右正，所以$f(0)=4$是极小值。

- id: p4
  tier: medium
  statement: |
    求$y=x+\frac4{x^2}$的极小值，并写出它的渐近线。
  answer:
    type: number
    value: 3
  hints:
    - |
      $y'=1-\frac8{x^3}$，找驻点并看两侧的正负。
    - |
      驻点只有$x=2$；$x<0$时$y'>0$，$0<x<2$时$y'<0$，$x>2$时$y'>0$。
    - |
      极小值是$y(2)=2+1$。$x\to0$时$y\to+\infty$；$y-x=\frac4{x^2}\to0$。
  solution: |
    $y'=1-\frac8{x^3}$，驻点只有$2$，它左边附近$y'<0$、右边$y'>0$，所以极小值是$y(2)=3$。$x=0$是竖直渐近线，$y=x$是两个方向的斜渐近线；$x<0$时$y'>0$，那一段没有极值。

- id: p5
  tier: hard
  statement: |
    画出$y=\frac{x^3}{x^2-1}$的草图：写出渐近线、单调区间、极值、凹凸区间和拐点。
  hints:
    - |
      它是奇函数（odd function），先看$x\ge0$。做除法：$\frac{x^3}{x^2-1}=x+\frac{x}{x^2-1}$。
    - |
      $y'=\frac{x^2(x^2-3)}{(x^2-1)^2}$，$y''=\frac{2x(x^2+3)}{(x^2-1)^3}$。
    - |
      渐近线：$x=\pm1$，$y=x$（两个方向）。

      单调：$y'$的正负和$x^2-3$一样（$x\ne0$）。$y$在$(-\infty,-\sqrt3]$、$[\sqrt3,+\infty)$上严格递增，在$[-\sqrt3,-1)$、$(-1,1)$、$(1,\sqrt3]$上严格递减；$0$是驻点，两侧$y'<0$，不是极值点。极大值$y(-\sqrt3)=-\frac{3\sqrt3}2$，极小值$y(\sqrt3)=\frac{3\sqrt3}2$。

      凹凸：$y''$的正负和$\frac{x}{x^2-1}$一样。曲线在$(-1,0]$、$(1,+\infty)$上凸，在$(-\infty,-1)$、$[0,1)$上凹；$(0,0)$是拐点。
  reference: |
    渐近线$x=\pm1$、$y=x$。极大值$-\frac{3\sqrt3}2$（在$-\sqrt3$），极小值$\frac{3\sqrt3}2$（在$\sqrt3$），$0$是驻点但不是极值点。拐点$(0,0)$；$(-1,0]$、$(1,+\infty)$上凸，$(-\infty,-1)$、$[0,1)$上凹。

- id: p6
  tier: hard
  statement: |
    画出$y=\sqrt{x^2+2x}$的草图。

    （1）定义域是什么？在$x\to+\infty$和$x\to-\infty$两个方向上各有什么渐近线？

    （2）写出单调区间和凹凸区间。
  hints:
    - |
      （1）$x^2+2x\ge0$。$x^2+2x=(x+1)^2-1$，远处$y$接近$|x+1|$。
    - |
      （1）$x\to+\infty$时，$\sqrt{x^2+2x}-(x+1)=\frac{-1}{\sqrt{x^2+2x}+x+1}$。（2）$y'=\frac{x+1}{\sqrt{x^2+2x}}$，$y''=-\frac1{(x^2+2x)^{3/2}}$。
    - |
      （1）定义域是$(-\infty,-2]\cup[0,+\infty)$。$x\to+\infty$时$y-(x+1)\to0$，渐近线是$y=x+1$；$x\to-\infty$时$y-(-x-1)=\frac{-1}{\sqrt{x^2+2x}-(x+1)}\to0$，渐近线是$y=-x-1$。两个方向不同。

      （2）$y'$在$x>0$时为正、$x<-2$时为负：$y$在$[0,+\infty)$上严格递增，在$(-\infty,-2]$上严格递减。$y''<0$，两支各自是凹的。两支从$(0,0)$、$(-2,0)$出发，那里切线（tangent line）竖直，分别贴着两条渐近线的下方伸向远处：它是双曲线$(x+1)^2-y^2=1$的上半支。
  reference: |
    （1）$(-\infty,-2]\cup[0,+\infty)$；$x\to+\infty$时$y=x+1$，$x\to-\infty$时$y=-x-1$。

    （2）$[0,+\infty)$上严格递增，$(-\infty,-2]$上严格递减；两支都凹。

- id: p7
  tier: thinking
  statement: |
    （1）只在$x=0,\pm1,\pm2,\dots$这些点上描点，画$y=\sin2\pi x$，会画出什么？

    （2）先求出$y'$的零点，再描点，为什么就不会出这种错？

    （3）计算机画函数图像，也是在很多点上算值、再连线。它可能犯什么错，怎样减少？
  hints:
    - |
      （1）$\sin2\pi k=0$。
    - |
      （2）$y'=2\pi\cos2\pi x$的零点在$x=\frac14+\frac k2$，相邻两个零点之间函数单调。
    - |
      （1）所有描出的点都在$x$轴上，连起来是一条直线，完全看不出振动。

      （2）把驻点（以及拐点、渐近线）作为必须描的点，相邻两点之间函数单调、凹凸不变，连线的走向就有了保证，不会漏掉中间的起伏。

      （3）取的点比函数的起伏稀时，也会漏掉振动，甚至画出假的规律；在一段很小的区间里剧烈变化的函数（比如$\sin\frac1x$在$0$附近）更难画。办法是加密取点，或者先像本节一样分析单调区间、极值和渐近线，再决定在哪里多取点。
  reference: |
    （1）一条直线$y=0$。

    （2）驻点之间函数单调，连线不会漏掉起伏。

    （3）取点太稀会漏掉起伏；加密取点，或先做分析。

- id: p8
  tier: thinking
  statement: |
    （1）画出$y=x^3-3x^2$的草图，标出极值。

    （2）由草图讨论：$c$取什么值时，方程$x^3-3x^2=c$有三个、两个、一个实根？

    （3）为什么「数直线$y=c$和曲线的交点」是可靠的？要用到哪些定理？
  hints:
    - |
      （1）$y'=3x(x-2)$，极大值在$x=0$，极小值在$x=2$。
    - |
      （2）水平直线$y=c$和曲线的交点个数就是实根的个数。极大值是$0$，极小值是$-4$。
    - |
      （1）$y$在$(-\infty,0]$上严格递增到极大值$0$，在$[0,2]$上严格递减到极小值$-4$，在$[2,+\infty)$上严格递增；$x\to\pm\infty$时$y\to\pm\infty$。

      （2）$-4<c<0$时三个实根；$c=0$或$c=-4$时两个；$c>0$或$c<-4$时一个。

      （3）在每个严格单调的区间上，连续函数（continuous function）取遍两端之间的值，由零点定理（Bolzano's theorem）或介值定理（intermediate value theorem），至少有一个根，严格单调又保证至多一个。所以把三段的取值范围和$c$比一比，就数出了根的个数。
  reference: |
    （1）极大值$0$（$x=0$），极小值$-4$（$x=2$）。

    （2）$-4<c<0$：三个；$c\in\{0,-4\}$：两个；其他：一个。

    （3）每个严格单调段上，介值定理给出至少一个根，严格单调给出至多一个。
