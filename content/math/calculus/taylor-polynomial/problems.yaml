- id: p1
  tier: easy
  statement: |
    求$e^{2x}$的麦克劳林多项式（Maclaurin polynomial）中$x^3$的系数。
  answer:
    type: number
    value: 4/3
  hints:
    - |
      $x^3$的系数是$\frac{f'''(0)}{3!}$。
    - |
      $(e^{2x})'''=8e^{2x}$，在$0$处是$8$。也可以把$e^u$的展开里的$u$换成$2x$。
    - |
      $\frac8{3!}=\frac86$。
  solution: |
    $f'''(x)=8e^{2x}$，$f'''(0)=8$，系数是$\frac8{3!}=\frac43$。也可以在$e^u=1+u+\frac{u^2}2+\frac{u^3}6+o(u^3)$里取$u=2x$，$x^3$项是$\frac{(2x)^3}6=\frac43x^3$。

- id: p2
  tier: easy
  statement: |
    写出$\ln x$在$1$处的$3$阶泰勒多项式$T_3(x)$，求$T_3(1.1)$。
  answer:
    type: number
    value: 1/10 - 1/200 + 1/3000
  hints:
    - |
      $f(x)=\ln x$，求$f'(1)$、$f''(1)$、$f'''(1)$。
    - |
      $f'=\frac1x$，$f''=-\frac1{x^2}$，$f'''=\frac2{x^3}$，在$1$处是$1$、$-1$、$2$。
    - |
      $T_3(x)=(x-1)-\frac{(x-1)^2}2+\frac{(x-1)^3}3$，代入$x-1=0.1$。
  solution: |
    $T_3(x)=(x-1)-\frac{(x-1)^2}2+\frac{(x-1)^3}3$，所以$T_3(1.1)=0.1-0.005+\frac{0.001}3\approx0.095333$。$\ln1.1=0.0953102\cdots$，误差约$2\times10^{-5}$。

- id: p3
  tier: medium
  statement: |
    $\sqrt[3]{1+x}$的$2$阶麦克劳林多项式是$1+a_1x+a_2x^2$。求$(a_1,a_2)$。
  answer:
    type: tuple
    value: [1/3, -1/9]
  hints:
    - |
      用$(1+x)^\alpha$的展开，$\alpha=\frac13$。
    - |
      $a_1=\alpha$，$a_2=\frac{\alpha(\alpha-1)}{2!}$。
    - |
      $a_2=\frac{\frac13\cdot\bigl(-\frac23\bigr)}2$。
  solution: |
    $\alpha=\frac13$，$a_1=\frac13$，$a_2=\frac{\frac13\cdot(-\frac23)}{2}=-\frac19$。于是$\sqrt[3]{1+x}=1+\frac x3-\frac{x^2}9+o(x^2)$，比如$\sqrt[3]{1.03}\approx1+0.01-0.0001=1.0099$。

- id: p4
  tier: medium
  statement: |
    求$e^{-x^2}$的$6$阶麦克劳林多项式中$x^6$的系数。
  answer:
    type: number
    value: -1/6
  hints:
    - |
      在$e^u$的展开里把$u$换成$-x^2$，不必求六阶导数。
    - |
      $e^u=1+u+\frac{u^2}2+\frac{u^3}6+o(u^3)$，$u=-x^2$时$o(u^3)=o(x^6)$。
    - |
      $x^6$项来自$\frac{u^3}6=\frac{(-x^2)^3}6$。
  solution: |
    $e^{-x^2}=1-x^2+\frac{x^4}2-\frac{x^6}6+o(x^6)$，$x^6$的系数是$-\frac16$。由泰勒多项式的唯一性（见[用泰勒公式求极限](lesson:math.calculus.taylor-limits)），它就是$\frac{f^{(6)}(0)}{6!}$。

- id: p5
  tier: hard
  statement: |
    设$f$在$a$处二阶可导。

    （1）用带佩亚诺余项的泰勒公式证明：$h\to0$时$\frac{f(a+h)+f(a-h)-2f(a)}{h^2}\to f''(a)$。

    （2）取$f(x)=x^4$、$a=1$，直接算出这个分式，验证（1）。
  hints:
    - |
      （1）分别写出$f(a+h)$和$f(a-h)$展开到$h^2$的式子。
    - |
      （1）$f(a\pm h)=f(a)\pm f'(a)h+\frac{f''(a)}2h^2+o(h^2)$，相加时一次项抵消。
    - |
      （1）两式相加，$f(a+h)+f(a-h)-2f(a)=f''(a)h^2+o(h^2)$，除以$h^2$，再令$h\to0$。

      （2）$(1+h)^4+(1-h)^4=2+12h^2+2h^4$，分式等于$12+2h^2\to12=f''(1)$。
  reference: |
    （1）展开到$h^2$，一次项抵消，得$f''(a)h^2+o(h^2)$。

    （2）$12+2h^2\to12$。

- id: p6
  tier: hard
  statement: |
    （1）写出$(1+u)^{-\frac12}$展开到$u^2$的式子（带佩亚诺余项）。

    （2）$\varepsilon\to0$时，把$\frac1{\sqrt{1-2\varepsilon\cos\theta+\varepsilon^2}}$展开到$\varepsilon^2$项。
  hints:
    - |
      （1）$\alpha=-\frac12$：$\alpha(\alpha-1)/2=\frac38$。（2）令$u=\varepsilon^2-2\varepsilon\cos\theta$，它趋于$0$。
    - |
      （2）$u^2=4\varepsilon^2\cos^2\theta+o(\varepsilon^2)$，$o(u^2)=o(\varepsilon^2)$。
    - |
      （1）$(1+u)^{-\frac12}=1-\frac u2+\frac38u^2+o(u^2)$。

      （2）代入$u=\varepsilon^2-2\varepsilon\cos\theta$：$-\frac u2=\varepsilon\cos\theta-\frac{\varepsilon^2}2$，$\frac38u^2=\frac32\varepsilon^2\cos^2\theta+o(\varepsilon^2)$。合起来是$1+\varepsilon\cos\theta+\frac{3\cos^2\theta-1}2\varepsilon^2+o(\varepsilon^2)$。电磁学里算一个电荷在远处产生的电势，正要这样展开，$\varepsilon$是电荷到原点的距离和场点到原点的距离之比。
  reference: |
    （1）$1-\frac u2+\frac38u^2+o(u^2)$。

    （2）$1+\varepsilon\cos\theta+\frac{3\cos^2\theta-1}2\varepsilon^2+o(\varepsilon^2)$。

- id: p7
  tier: thinking
  statement: |
    （1）用$e^x$在$0$处的$T_2(x)=1+x+\frac{x^2}2$分别近似$e^{0.1}$和$e^5$，误差各是多少？

    （2）要近似$e^5$，在哪里展开更好？

    （3）有没有一个多项式，能在整个$[0,5]$上都把$e^x$近似得很好？它和泰勒多项式有什么不同？
  hints:
    - |
      （1）$e^{0.1}\approx1.10517$，$e^5\approx148.41$。
    - |
      （2）展开点离要算的点越近越好，展开点处的函数值、导数又要好算。
    - |
      （1）$T_2(0.1)=1.105$，误差约$0.00017$；$T_2(5)=18.5$，误差约$130$，差得离谱。

      （2）在离$5$近、又好算的点展开。比如在$\ln150\approx5.01$处展开，那里$e^x=150$，$e^5\approx150e^{-0.01}$。泰勒多项式只在展开点附近好用。

      （3）有。数学分析的[魏尔斯特拉斯逼近定理](lesson:math.analysis.weierstrass-approximation)说，闭区间上的连续函数（continuous function）都能用多项式一致地逼近；那种多项式顾及整个区间，不是只在一点附近和函数的各阶导数对齐。
  reference: |
    （1）约$0.00017$和$130$。

    （2）在$5$附近展开。

    （3）有（魏尔斯特拉斯逼近）；泰勒多项式只顾展开点附近。

- id: p8
  tier: thinking
  statement: |
    设$x\ne0$时$f(x)=e^{-1/x^2}$，$f(0)=0$。已知$f$在$0$处任意阶可导，各阶导数都是$0$。

    （1）$f$在$0$处的各阶麦克劳林多项式是什么？

    （2）带佩亚诺余项的泰勒公式对$f$说了什么？和$f$不恒为$0$矛盾吗？

    （3）函数在一点的泰勒多项式能决定这个函数吗？
  hints:
    - |
      （1）所有系数$\frac{f^{(k)}(0)}{k!}$都是$0$。
    - |
      （2）余项就是$f$自己，泰勒公式说$f(x)=o(x^n)$对每个$n$都成立。
    - |
      （1）都是零多项式。

      （2）它说$x\to0$时$f(x)$比任何$x^n$都小得快，这对$e^{-1/x^2}$是对的：$x=0.1$时它是$e^{-100}$，小得惊人。不矛盾，佩亚诺余项只管$x\to0$，不说$f$在别处等于$T_n$。

      （3）不能。$f$和零函数在$0$处的泰勒多项式完全一样，可它们不是同一个函数。泰勒多项式只记住了函数在一点附近「趋于零的方式」，要知道它离开这一点后怎样，还得看余项（见[泰勒公式的余项与误差估计](lesson:math.calculus.taylor-remainder)）。
  reference: |
    （1）零多项式。

    （2）$f(x)=o(x^n)$对所有$n$成立，不矛盾。

    （3）不能：$f$和$0$的泰勒多项式相同。
