- id: p1
  tier: easy
  statement: |
    设

    $$
    f(x)=\begin{cases}2x+1,&x<2,\\7,&x=2,\\x^2+1,&x>2.\end{cases}
    $$

    求$\lim_{x\to2}f(x)$。
  answer:
    type: number
    value: 5
  hints:
    - |
      分段点两侧用的式子不同，分别求左极限和右极限。
    - |
      左边用$2x+1$，右边用$x^2+1$，$x$靠近$2$时它们各靠近多少？$f(2)=7$要不要管？
    - |
      左极限$2\cdot2+1=5$，右极限$2^2+1=5$，两者相等，极限是$5$；$f(2)=7$不影响极限。
  solution: |
    左极限是$2\cdot2+1=5$，右极限是$2^2+1=5$，两者相等，所以$\lim_{x\to2}f(x)=5$。极限只看$x\ne2$的点，$f(2)=7$和它无关。

- id: p2
  tier: easy
  statement: |
    下面哪些说法对？
  answer:
    type: choice
    multiple: true
    options:
      - |
        若$f(2)=5$，则$\lim_{x\to2}f(x)=5$。
      - |
        若$\lim_{x\to2^-}f(x)=\lim_{x\to2^+}f(x)=5$，$f(2)=7$，则$\lim_{x\to2}f(x)=5$。
      - |
        若$x\ne2$时$f(x)=g(x)$，而$f(2)\ne g(2)$，则$\lim_{x\to2}f(x)$和$\lim_{x\to2}g(x)$要么都不存在，要么都存在并且相等。
      - |
        若$\lim_{x\to2}f(x)=5$，则只要$x$足够靠近$2$（$x\ne2$），$f(x)$就都在$4.9$和$5.1$之间。
      - |
        若$x=1.9$、$1.99$、$1.999$时$f(x)$依次是$4.9$、$4.99$、$4.999$，则$\lim_{x\to2^-}f(x)=5$。
    value: [2, 3, 4]
  hints:
    - |
      极限只看$x\ne2$、又靠近$2$的那些点，和$f(2)$无关。
    - |
      A 里$f(2)$能不能和附近的值合不上？E 只告诉了三个点的值，别的点呢？
    - |
      B、C、D 对。A 错：比如$x\ne2$时$f(x)=x$，$f(2)=5$，极限是$2$。E 错：$f$在这三个点取给定的值、在别的点都等于$0$，它的左极限是$0$。
  solution: |
    B 对：左、右极限都是$5$，极限就是$5$，$f(2)$不影响。C 对：极限只看$x\ne2$的点，那里$f$和$g$一样。D 对：「无限接近$5$」包括相差不到$0.1$。

    A 错：$x\ne2$时$f(x)=x$、$f(2)=5$的函数，极限是$2$。E 错：只知道三个点，说明不了别的点；比如$f$在这三个点取给定的值、在别的点都等于$0$，它的左极限是$0$。

- id: p3
  tier: medium
  statement: |
    求$\lim_{x\to-2}\frac{x^3+8}{x+2}$。
  answer:
    type: number
    value: 12
  hints:
    - |
      $x=-2$时分子、分母都是$0$，代不进去。先想想$x\ne-2$时式子能不能化简。
    - |
      $x^3+8=(x+2)(x^2-2x+4)$。
    - |
      $x\ne-2$时原式等于$x^2-2x+4$，$x\to-2$时它靠近$4+4+4=12$。
  solution: |
    $x\ne-2$时$\frac{x^3+8}{x+2}=\frac{(x+2)(x^2-2x+4)}{x+2}=x^2-2x+4$。$x\to-2$时它靠近$(-2)^2-2\cdot(-2)+4=12$，所以极限是$12$。

- id: p4
  tier: medium
  statement: |
    用计算器算出$\frac{2^x-1}{x}$在$x=\pm0.1$、$\pm0.01$、$\pm0.001$处的值，猜出$x\to0$时它的极限，结果保留三位小数。
  answer:
    type: number
    value: ln(2)
  tolerance: { abs: 5.0e-4 }
  hints:
    - |
      把六个值按$x>0$和$x<0$分成两组，看各组往哪里走。
    - |
      $x=0.1$、$0.01$、$0.001$时约是$0.7177$、$0.6956$、$0.6934$；$x=-0.1$、$-0.01$、$-0.001$时约是$0.6697$、$0.6908$、$0.6929$。
    - |
      两组从上下两边挤向同一个数，约为$0.6931$，保留三位小数是$0.693$。
  solution: |
    $x>0$的一组依次约为$0.7177$、$0.6956$、$0.6934$，在减小；$x<0$的一组约为$0.6697$、$0.6908$、$0.6929$，在增大。两组从两边挤向同一个数，大约是$0.6931$，所以填$0.693$。这个极限正好是$\ln2$，原因见[两个重要极限](lesson:math.calculus.special-limits)。

- id: p5
  tier: hard
  statement: |
    $x$是有理数时$f(x)=x$，$x$是无理数时$f(x)=0$。已知任何一个区间里都既有有理数，又有无理数。

    （1）说明$\lim_{x\to0}f(x)=0$。（2）说明$\lim_{x\to1}f(x)$不存在。
  hints:
    - |
      （1）不管$x$是有理数还是无理数，$|f(x)|$和$|x|$比，哪个大？
    - |
      （2）$1$附近既有有理数又有无理数。在这两种点上，$f(x)$各靠近什么数？
    - |
      （1）总有$|f(x)|\le|x|$：有理数处$|f(x)|=|x|$，无理数处$f(x)=0$。$x$离$0$足够近时$|x|$要多小有多小，$|f(x)|$也就要多小有多小，所以极限是$0$。

      （2）假设极限是$L$。$1$附近的无理数处$f(x)=0$，$L$要离$0$任意近，只能$L=0$；$1$附近的有理数处$f(x)=x$靠近$1$，又只能$L=1$。两者矛盾，所以极限不存在。
  reference: |
    （1）有理数处$|f(x)|=|x|$，无理数处$f(x)=0$，总有$|f(x)|\le|x|$。要$|f(x)|$小于任何给定的正数$d$，只要$0<|x|<d$，所以$\lim_{x\to0}f(x)=0$。

    （2）假设$\lim_{x\to1}f(x)=L$。$1$的任何一侧附近都有无理数，那里$f(x)=0$，所以$L$离$0$任意近，$L=0$。$1$附近也都有有理数，那里$f(x)=x$离$1$任意近，所以$L=1$。矛盾，极限不存在。

    同样的论证说明：$a\ne0$时$\lim_{x\to a}f(x)$都不存在，这个函数只在$0$处有极限。

- id: p6
  tier: hard
  statement: |
    $\lfloor x\rfloor$表示不超过$x$的最大整数，例如$\lfloor2.5\rfloor=2$，$\lfloor-2.5\rfloor=-3$。设$f(x)=\lfloor x\rfloor+\lfloor-x\rfloor$。求$f$在每一点$a$处的极限，并和$f(a)$比较。
  hints:
    - |
      先分$x$是整数、不是整数两种情况，算出$f(x)$。
    - |
      $x$不是整数时，写成$x=n+t$，$n$是整数，$0<t<1$，那么$-x=(-n-1)+(1-t)$，而$0<1-t<1$。
    - |
      $x$是整数时$f(x)=x+(-x)=0$；不是整数时$\lfloor x\rfloor=n$，$\lfloor-x\rfloor=-n-1$，$f(x)=-1$。

      任取$a$，离$a$足够近的点里，除了$a$本身都不是整数（$a$是整数时离它不到$1$的点就行），这些点上$f=-1$，所以$\lim_{x\to a}f(x)=-1$。$a$是整数时$f(a)=0$，和极限不等；$a$不是整数时$f(a)=-1$，和极限相等。
  reference: |
    整数$x$：$\lfloor x\rfloor=x$，$\lfloor-x\rfloor=-x$，$f(x)=0$。非整数$x=n+t$（$0<t<1$）：$\lfloor x\rfloor=n$；$-x=(-n-1)+(1-t)$，$0<1-t<1$，所以$\lfloor-x\rfloor=-n-1$，$f(x)=-1$。

    任取$a$。$a$是整数时，$0<|x-a|<1$的$x$都不是整数；$a$不是整数时，离$a$比最近的整数还近的$x$都不是整数。所以在$a$附近（去掉$a$）$f\equiv-1$，$\lim_{x\to a}f(x)=-1$。

    比较：整数点$f(a)=0\ne-1$，极限存在但不等于函数值；非整数点$f(a)=-1$，两者相等。

- id: p7
  tier: thinking
  statement: |
    极限的定义要求$x\ne a$。假如把$x=a$也算进来，即要求$x$靠近$a$（包括等于$a$）时，$f(x)$都无限接近$L$。

    （1）这样改了以后，$\frac{x^2-1}{x-1}$在$1$处还有极限吗？例 1 的$f$在$1$处呢？（2）改了以后，有极限的点上，极限和函数值是什么关系？

    （3）导数（derivative）要用差商（difference quotient）$\frac{f(a+h)-f(a)}{h}$在$h\to0$时的极限来定义（见[导数的定义](lesson:math.calculus.derivative)），差商在$h=0$处没有定义。按改过的定义会怎样？
  hints:
    - |
      （1）新的要求里，$f(a)$必须有定义，而且$f(a)$本身也要离$L$任意近。
    - |
      （2）$f(a)$是一个固定的数，它要离$L$任意近，只能怎样？
    - |
      （1）$\frac{x^2-1}{x-1}$在$1$处没有定义，按新的要求没有极限。例 1 的$f(1)=3$要离$L$任意近，所以$L=3$；可$1$附近的值靠近$1$，$L$又得是$1$，矛盾，也没有极限。

      （2）有极限时一定$L=f(a)$：极限只剩下「附近的值都靠近函数值」这一种，函数值和附近合不上的点都没有极限。

      （3）差商在$h=0$处没有定义，按新的定义永远没有极限，一个导数也求不出来。排除$x=a$，正是为了研究「在这一点没法直接算」的走向。
  reference: |
    （1）新定义要求$f(a)$有定义并且$|f(a)-L|$任意小。$\frac{x^2-1}{x-1}$在$1$处无定义，没有极限。例 1 的$f(1)=3$，$|3-L|$任意小推出$L=3$；而$1$附近的值靠近$1$，推出$L=1$，矛盾，没有极限。

    （2）$|f(a)-L|$是一个固定的数，它小于任何正数，只能是$0$，所以$L=f(a)$。新定义下「有极限」就是「附近的值靠近函数值」，可去的那种断开（$f(a)$和附近合不上、或没有定义）全都算作没有极限。

    （3）差商在$h=0$处无定义，新定义下极限永远不存在，导数无从谈起。原来的定义排除$x=a$，才能处理$\frac00$这类「代不进去」的式子。

- id: p8
  tier: thinking
  statement: |
    设$f(x)=\frac{x^2}{x^2+10^{-8}}$。

    （1）用计算器算$x=10^{-1}$、$10^{-2}$、$10^{-3}$处的值。只看这三个数，你会猜$x\to0$时的极限是多少？

    （2）再算$x=10^{-4}$、$10^{-5}$、$10^{-6}$处的值。极限到底是多少，为什么？（3）这对用数值表猜极限有什么提醒？
  hints:
    - |
      （1）三个值约是$0.999999$、$0.9999$、$0.9901$。
    - |
      （2）后三个值约是$0.5$、$0.0099$、$0.0001$。$x$很小时，分子$x^2$和分母里的$10^{-8}$比，哪个大？
    - |
      （1）会猜是$1$。

      （2）后三个值约是$0.5$、$0.0099$、$0.0001$。$x\to0$时分子靠近$0$，分母靠近$10^{-8}$，所以极限是$0$。前三个点上$x^2$比$10^{-8}$大得多，$f\approx1$；只有$x$比$10^{-4}$小得多时，$10^{-8}$才占上风。

      （3）表里只有几个点，「足够近」到底要多近，表里看不出来。有了猜测，还要用约分、比较大小这样的办法确认。
  reference: |
    （1）$x=10^{-1}$：$\frac{10^{-2}}{10^{-2}+10^{-8}}\approx0.999999$；$x=10^{-2}$：$\approx0.9999$；$x=10^{-3}$：$\frac{10^{-6}}{10^{-6}+10^{-8}}\approx0.9901$。照这三个数会猜极限是$1$。

    （2）$x=10^{-4}$：$\frac{10^{-8}}{2\cdot10^{-8}}=0.5$；$x=10^{-5}$：$\approx0.0099$；$x=10^{-6}$：$\approx0.0001$。$x\to0$时分子$x^2\to0$，分母$\to10^{-8}\ne0$，极限是$0$。$x^2$和$10^{-8}$相当的地方在$x\approx10^{-4}$，比它大得多时$f\approx1$，小得多时$f\approx0$。

    （3）数值表取的点不够近，就会把「中途的样子」当成极限。表能帮我们猜，确认要靠化简、估计这样的推理。
