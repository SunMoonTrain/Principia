- id: p1
  tier: easy
  statement: |
    $x\ne1$时$f(x)=\frac{x^3-1}{x-1}$，$f(1)=k$。$k$取什么值时，$f$在$x=1$处连续？
  answer:
    type: number
    value: 3
  hints:
    - |
      连续要求$f(1)$等于$x\to1$时的极限。先求这个极限。
    - |
      $x^3-1=(x-1)(x^2+x+1)$，$x\ne1$时约掉$x-1$。
    - |
      $x\to1$时$x^2+x+1\to3$，所以$k=3$。
  solution: |
    $x\ne1$时$f(x)=x^2+x+1$，$\lim_{x\to1}f(x)=3$。连续要求$f(1)=3$，所以$k=3$。

- id: p2
  tier: easy
  statement: |
    下面的函数里，哪些以$x=0$为跳跃间断点？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\frac{x}{|x|}+x$
      - |
        $\frac{x^2+x}{x}$
      - |
        $\frac{1}{x^2-x}$
      - |
        $\lfloor x\rfloor^2$（$\lfloor x\rfloor$是不超过$x$的最大整数）
      - |
        $\frac{|x|}{x}\cdot x$
    value: [1, 4]
  hints:
    - |
      跳跃间断点要求左极限、右极限都存在，但不相等。对每个函数，分别算$0$两侧的极限。
    - |
      B、E 在$x\ne0$时可以化简；$\lfloor x\rfloor$在$0$的左边、右边各等于多少，平方以后呢？C 的分母在$0$处是多少？
    - |
      A 的左、右极限是$-1$和$1$；D 的是$1$和$0$，都是跳跃。B 化简为$x+1$、E 化简为$|x|$，极限都存在，是可去间断点；C 的分母$x(x-1)$趋于$0$、分子是$1$，是无穷间断点。
  solution: |
    A：$x>0$时等于$1+x\to1$，$x<0$时等于$-1+x\to-1$，跳跃。D：$-1<x<0$时$\lfloor x\rfloor^2=(-1)^2=1$，$0\le x<1$时为$0$，左、右极限是$1$和$0$，跳跃。

    B 在$x\ne0$时等于$x+1$，E 在$x\ne0$时等于$|x|$，极限分别是$1$和$0$，$x=0$处没有定义，都是可去间断点。C 的分母$x(x-1)$在$x\to0$时趋于$0$、分子是$1$，$|f|$无限增大，是无穷间断点。所以选 A、D。

- id: p3
  tier: medium
  statement: |
    设

    $$
    f(x)=\begin{cases}ax+b,&x<1,\\x^2+1,&1\le x\le2,\\bx+a,&x>2.\end{cases}
    $$

    $a$、$b$取什么值时，$f$处处连续？依次填$a$、$b$。
  answer:
    type: tuple
    value: [-1, 3]
  hints:
    - |
      三段都是多项式，只要检查分段点$x=1$和$x=2$。
    - |
      $x=1$处：左极限$a+b$要等于$f(1)=2$。$x=2$处：右极限$2b+a$要等于$f(2)=5$。
    - |
      解$a+b=2$、$a+2b=5$，得$b=3$、$a=-1$。
  solution: |
    $x=1$处，左极限是$a+b$，$f(1)=1+1=2$，连续要求$a+b=2$。$x=2$处，$f(2)=5$，右极限是$2b+a$，要求$a+2b=5$。两式相减得$b=3$，$a=-1$。

- id: p4
  tier: medium
  statement: |
    $f(x)=\frac{x^2-1}{x^3-x}$有几个间断点？其中有几个是可去间断点？依次填写。
  answer:
    type: tuple
    value: [3, 2]
  hints:
    - |
      $f$是初等函数，间断点只可能是分母的零点。把分母分解因式。
    - |
      $x^3-x=x(x-1)(x+1)$，分母有三个零点；$x\ne0,\pm1$时$f(x)=\frac1x$。
    - |
      $x=\pm1$处极限分别是$1$和$-1$，存在，是可去间断点；$x=0$处是无穷间断点。共$3$个，可去的$2$个。
  solution: |
    分母$x(x-1)(x+1)$在$0$、$1$、$-1$处为零，$f$在这三点没有定义，而附近都有定义，所以有$3$个间断点。$x\ne0,\pm1$时$f(x)=\frac{(x-1)(x+1)}{x(x-1)(x+1)}=\frac1x$：$x\to1$、$x\to-1$时极限是$1$、$-1$，这两个是可去间断点；$x\to0$时是无穷大，是无穷间断点。

- id: p5
  tier: hard
  statement: |
    设$f$在$a$处连续，$f(a)>0$。

    （1）说明$a$附近有一个区间，区间里的$x$都满足$f(x)>\frac{f(a)}2$。（2）由此说明：如果$f$在$[0,1]$上连续，并且在$[0,1]$里的每个有理数处都等于$0$，那么$f$在$[0,1]$上处处等于$0$。（任何区间里都有有理数。）
  hints:
    - |
      （1）连续就是$x$靠近$a$时$f(x)$靠近$f(a)$，可以要求它们相差不到$\frac{f(a)}2$。
    - |
      （2）反证：如果某一点$b$处$f(b)\ne0$，不妨设$f(b)>0$（否则换成$-f$），用（1）。
    - |
      （1）$\lim_{x\to a}f(x)=f(a)$，所以$x$离$a$足够近时$|f(x)-f(a)|<\frac{f(a)}2$，也就是$f(x)>f(a)-\frac{f(a)}2=\frac{f(a)}2$。$x=a$时这也成立，于是得到一个以$a$为中心的区间。

      （2）假设$f(b)>0$，$b\in[0,1]$。由（1），$b$附近有一段区间（$b$是端点时取$[0,1]$里的那半边），上面$f>\frac{f(b)}2>0$；这段区间里有有理数，那里$f=0$，矛盾。$f(b)<0$时对$-f$同样论证。所以$f$处处为$0$。
  reference: |
    （1）由连续，$x\to a$时$f(x)\to f(a)$。要求相差不到$\frac{f(a)}2$：$x$离$a$足够近（比如$|x-a|<\delta$）时，$|f(x)-f(a)|<\frac{f(a)}2$，于是$f(x)>\frac{f(a)}2>0$。这叫连续函数的保号性。

    （2）设有$b\in[0,1]$使$f(b)\ne0$，用$-f$代替$f$可设$f(b)>0$。由（1）（$b$是端点时用单侧连续，区间取在$[0,1]$里），有一段长度为正的区间，上面$f>\frac{f(b)}2>0$。区间里有有理数，那里$f=0$，矛盾。所以$f\equiv0$。

- id: p6
  tier: hard
  statement: |
    （1）设$f$在$a$处连续，说明$|f|$也在$a$处连续。（2）反过来不对：$x$是有理数时$g(x)=1$，$x$是无理数时$g(x)=-1$。说明$|g|$处处连续，$g$却处处不连续（任何区间里都既有有理数又有无理数）。（3）$h(x)=x\,g(x)$在哪些点连续？
  hints:
    - |
      （1）$|f|$是$|u|$和$f$复合而成的；$|u|=\sqrt{u^2}$在哪里连续？
    - |
      （2）$g$在任何一点附近的值都有$1$也有$-1$。（3）$|h(x)|=|x|$，分$a=0$和$a\ne0$看。
    - |
      （1）$|u|=\sqrt{u^2}$是初等函数，处处连续；$f$在$a$处连续，由复合函数的定理，$|f|$在$a$处连续。也可以用$\bigl||f(x)|-|f(a)|\bigr|\le|f(x)-f(a)|$。

      （2）$|g|\equiv1$，处处连续。任取$a$，$a$附近$g$的值有$1$也有$-1$，不会都靠近同一个数，$\lim_{x\to a}g(x)$不存在，$g$在$a$处不连续。

      （3）$a=0$：$|h(x)-h(0)|=|x|\to0$，连续。$a\ne0$：附近有理数处$h(x)=x$靠近$a$，无理数处$h(x)=-x$靠近$-a\ne a$，极限不存在。所以$h$只在$0$处连续。
  reference: |
    （1）$|u|=\sqrt{u^2}$处处连续，由复合函数的极限（$f$在$a$处连续，$|u|$在$f(a)$处连续），$|f|$在$a$处连续；或者由$\bigl||f(x)|-|f(a)|\bigr|\le|f(x)-f(a)|\to0$。

    （2）$|g|$恒为$1$，连续。任取$a$：每个包含$a$的区间里都有使$g=1$和使$g=-1$的点，$g(x)$不能靠近同一个数，极限不存在，所以不连续。

    （3）$h(0)=0$，$|h(x)|=|x|$，夹逼得$\lim_{x\to0}h(x)=0=h(0)$，连续。$a\ne0$时，有理数处$h\to a$、无理数处$h\to-a$，$a\ne-a$，极限不存在。$h$只在$x=0$处连续。

- id: p7
  tier: thinking
  statement: |
    （1）$f$、$g$都在$a$处不连续，$f+g$会在$a$处连续吗？$fg$呢？各举一例，或说明不可能。

    （2）$f$在$a$处连续、$g$在$a$处不连续，$f+g$一定不连续吗？$fg$呢？
  hints:
    - |
      （1）试试让两个跳跃互相抵消，比如$g=-f$。乘积可以试两个一样的跳跃函数。
    - |
      （2）如果$f+g$连续，$g=(f+g)-f$会怎样？乘积要分$f(a)\ne0$和$f(a)=0$两种情形。
    - |
      （1）能。$f=\lfloor x\rfloor$、$g=-\lfloor x\rfloor$在$0$处都不连续，$f+g\equiv0$连续。$f=g=s$，$s(x)=1$（$x\ge0$）、$s(x)=-1$（$x<0$），$fg\equiv1$连续。

      （2）$f+g$一定不连续：否则$g=(f+g)-f$是两个连续函数的差，连续，矛盾。$fg$：$f(a)\ne0$时一定不连续，因为$a$附近$f\ne0$（第 5 题（1）），$g=\frac{fg}{f}$；$f(a)=0$时可能连续，比如$a=0$，$f=x$，$g=\lfloor x\rfloor$，$fg$在$0$处的极限是$0=f(0)g(0)$。
  reference: |
    （1）都能。和：$\lfloor x\rfloor+(-\lfloor x\rfloor)\equiv0$。积：$s$在$x\ge0$时为$1$、$x<0$时为$-1$，$s^2\equiv1$。

    （2）和一定不连续：若$f+g$连续，$g=(f+g)-f$连续，矛盾。积：$f(a)\ne0$时，由保号性$a$附近$f\ne0$，若$fg$连续则$g=\frac{fg}f$连续，矛盾，所以不连续；$f(a)=0$时可能连续，例如$x\lfloor x\rfloor$：$-1<x<0$时它是$-x$，$0\le x<1$时是$0$，在$0$处的极限是$0$，等于函数值。

    一句话：和、差能「倒回去」，乘积只在因子不为零时能倒回去，这和[极限的运算法则与夹逼定理](lesson:math.calculus.limit-laws)第 8 题是同一件事。

- id: p8
  tier: thinking
  statement: |
    （1）只改函数在一个点的值，能消掉哪一类间断点？只改$a$和它左边（$x\le a$）的函数值、右边不动呢？

    （2）$\frac1x$在它的定义域上连续吗？$0$是不是它的间断点？这两句话矛盾吗？

    （3）为什么$\sin\frac1x$的$0$不属于可去、跳跃、无穷三类中的任何一类？
  hints:
    - |
      （1）改一个点不影响左、右极限；改$a$和它的左边，可以换掉左极限和$f(a)$。
    - |
      （2）「连续」说的是定义域里的点，「间断点」只要求附近有定义。
    - |
      （1）改一个点只能消掉可去间断点：左、右极限都不受影响。改$a$和它左边的值，可以随意换掉左极限和$f(a)$：只要右极限存在（是一个数），把左极限和$f(a)$都换成它，跳跃间断点、只有左侧是无穷大的无穷间断点也能修好；右极限不存在或是无穷大时修不好。

      （2）$\frac1x$在$(-\infty,0)$和$(0,+\infty)$上处处连续。$0$不在定义域里，可$0$附近有定义，$f$在$0$处不连续，所以$0$是它的（无穷）间断点。两句话说的是不同的点，不矛盾。

      （3）$\sin\frac1x$在$0$两侧都来回摆动，左、右极限都不存在，所以不是可去或跳跃；它的值始终在$-1$和$1$之间，不是无穷大，所以也不是无穷间断点。
  reference: |
    （1）改一点：左、右极限不变，只有「极限存在、只是函数值不对或没有」的可去间断点能消掉。改$a$和左边一侧：左极限和$f(a)$都可以换成任何数，于是只要右极限是一个数，把两者都换成它就接上了：跳跃间断点、只有左侧是无穷大的无穷间断点都能修好；右极限不存在或是无穷大时修不好。只改$x<a$、不改$f(a)$就不够了：比如$x<0$时$f=0$、$f(0)=5$、$x>0$时$f=1$，左边怎么改，$0$处都还是间断点。

    （2）连续性按定义域里的点逐点说，$\frac1x$在定义域的每个区间上连续。间断点的定义只要求$f$在$a$附近有定义（$a$可以除外），$0$满足这一点且$f$在$0$处不连续，是无穷间断点。两者不矛盾。

    （3）可去、跳跃都要求左、右极限存在，无穷间断点要求有一侧是无穷大；$\sin\frac1x$两侧都摆动、有界，三条都不满足。
