- id: p1
  tier: easy
  statement: |
    求$f(x)=x^4-2x^2$在$[-1,2]$上的最大值。
  answer:
    type: number
    value: 8
  hints:
    - |
      在端点和区间内的驻点（stationary point）处算函数值，再比较。
    - |
      $f'(x)=4x^3-4x=4x(x-1)(x+1)$，区间内的驻点是$0$和$1$（$-1$是端点）。
    - |
      $f(-1)=-1$，$f(0)=0$，$f(1)=-1$，$f(2)=8$。
  solution: |
    $f$处处可导，$f'(x)=4x(x-1)(x+1)$。比较端点和驻点处的值：$f(-1)=-1$，$f(0)=0$，$f(1)=-1$，$f(2)=8$，所以最大值是$8$，在端点$2$处取到。

- id: p2
  tier: easy
  statement: |
    求$f(x)=x^2+\frac{16}x$在$[1,4]$上的最小值。
  answer:
    type: number
    value: 12
  hints:
    - |
      $f$在$[1,4]$上连续、可导，求驻点。
    - |
      $f'(x)=2x-\frac{16}{x^2}=0$，即$x^3=8$，$x=2$。
    - |
      $f(1)=17$，$f(2)=12$，$f(4)=20$。
  solution: |
    $f'(x)=2x-\frac{16}{x^2}$，在$[1,4]$内只有驻点$x=2$。比较$f(1)=17$、$f(2)=12$、$f(4)=20$，最小值是$12$。

- id: p3
  tier: medium
  statement: |
    靠一面足够长的直墙围一块矩形菜地，靠墙的一边不用篱笆，另外三边共用$120\,\mathrm{m}$长的篱笆。菜地的面积最大是多少平方米？
  answer:
    type: number
    value: 1800
  hints:
    - |
      设垂直于墙的两边各长$x\,\mathrm{m}$，平行于墙的一边就是$(120-2x)\,\mathrm{m}$。
    - |
      面积$S(x)=x(120-2x)$，$0<x<60$。
    - |
      $S'(x)=120-4x$，唯一的驻点是$x=30$，它左边$S'>0$、右边$S'<0$。
  solution: |
    设垂直于墙的边长$x\,\mathrm{m}$，面积$S(x)=x(120-2x)$，$0<x<60$。$S'(x)=120-4x$在区间内只有驻点$30$，并且$S'$在它左边为正、右边为负，所以$S(30)=30\times60=1800$是最大值，单位是$\mathrm{m^2}$。

- id: p4
  tier: medium
  statement: |
    求曲线$y=\sqrt x$上的点到点$(3,0)$的最短距离。
  answer:
    type: number
    value: sqrt(11)/2
  hints:
    - |
      曲线上的点是$(x,\sqrt x)$，$x\ge0$。距离最短，等价于距离的平方最小，平方没有根号，好算。
    - |
      距离的平方是$D(x)=(x-3)^2+x=x^2-5x+9$。
    - |
      $D'(x)=2x-5$，在$[0,+\infty)$上只有驻点$\frac52$，它左边$D'<0$、右边$D'>0$。
  solution: |
    距离的平方$D(x)=(x-3)^2+(\sqrt x)^2=x^2-5x+9$，$x\ge0$。$D'(x)=2x-5$，唯一的驻点$\frac52$是极小值点，所以$D\bigl(\frac52\bigr)=\frac{11}4$是最小值。最短距离是$\frac{\sqrt{11}}2\approx1.658$。

- id: p5
  tier: hard
  statement: |
    做一个容积为$V$的有盖圆柱形罐子，底面半径是$r$，高是$h$。

    （1）罐底、罐盖和侧面用同样的材料，$r$和$h$怎样取，用料最省？

    （2）如果罐底和罐盖的材料每单位面积的价钱是侧面的$2$倍，怎样取最省钱？
  hints:
    - |
      由$\pi r^2h=V$把$h$写成$r$的函数：$h=\frac V{\pi r^2}$，于是表面积只含$r$。
    - |
      （1）表面积$S(r)=2\pi r^2+2\pi rh=2\pi r^2+\frac{2V}r$，$r>0$。（2）造价和$4\pi r^2+2\pi rh=4\pi r^2+\frac{2V}r$成正比。
    - |
      （1）$S'(r)=4\pi r-\frac{2V}{r^2}=0$，得$r^3=\frac V{2\pi}$。这是$(0,+\infty)$上唯一的驻点，左负右正，是最小值点。这时$V=2\pi r^3$，$h=\frac{V}{\pi r^2}=2r$：高等于底面直径。

      （2）$8\pi r-\frac{2V}{r^2}=0$，得$r^3=\frac V{4\pi}$，同理是最小值点。这时$h=\frac V{\pi r^2}=4r$：高是底面直径的$2$倍。
  reference: |
    （1）$r=\sqrt[3]{\frac V{2\pi}}$，$h=2r$。

    （2）$r=\sqrt[3]{\frac V{4\pi}}$，$h=4r$。

- id: p6
  tier: hard
  statement: |
    救生员站在岸上的点$A$，离笔直的岸线$a$；溺水的人在水中的点$B$，离岸线$b$；$A$、$B$沿岸线方向相距$d$。救生员在岸上跑的速度是$v_1$，在水里游的速度是$v_2$。他先跑到岸线上的点$P$，再游到$B$。

    （1）记$A$在岸线上的垂足为$O$，设$OP=x$，$P$在$O$和$B$的垂足之间（$0\le x\le d$）。写出所用的时间$T(x)$。

    （2）证明：用时最短时，$\frac{\sin\theta_1}{v_1}=\frac{\sin\theta_2}{v_2}$，$\theta_1$、$\theta_2$是$AP$、$PB$和岸线的垂线所成的角。

    （3）为什么满足（2）的$x$只有一个？
  hints:
    - |
      （1）$AP=\sqrt{a^2+x^2}$，$PB=\sqrt{b^2+(d-x)^2}$。
    - |
      （2）由链式法则求$T'(x)$；$\frac{x}{\sqrt{a^2+x^2}}=\sin\theta_1$，$\frac{d-x}{\sqrt{b^2+(d-x)^2}}=\sin\theta_2$。
    - |
      （1）$T(x)=\frac{\sqrt{a^2+x^2}}{v_1}+\frac{\sqrt{b^2+(d-x)^2}}{v_2}$。

      （2）$T'(x)=\frac{x}{v_1\sqrt{a^2+x^2}}-\frac{d-x}{v_2\sqrt{b^2+(d-x)^2}}$，即$T'(x)=\frac{\sin\theta_1}{v_1}-\frac{\sin\theta_2}{v_2}$。$T'(0)<0<T'(d)$，最小值不在端点，在区间内部取到，那里$T'=0$，就是要证的等式。

      （3）$x$从$0$增大到$d$时，$\theta_1$变大、$\theta_2$变小，$T'$严格递增，所以只有一个零点。光从空气射入水中时，走的正是用时最短的路，这个等式就是光的折射定律（见光学的[费马原理](lesson:physics.optics.fermat-principle)）。
  reference: |
    （1）$T(x)=\frac{\sqrt{a^2+x^2}}{v_1}+\frac{\sqrt{b^2+(d-x)^2}}{v_2}$。

    （2）$T'(x)=\frac{\sin\theta_1}{v_1}-\frac{\sin\theta_2}{v_2}$；$T'(0)<0<T'(d)$，最小值在内部，$T'=0$。

    （3）$T'$随$x$严格递增；和折射定律同形。

- id: p7
  tier: thinking
  statement: |
    （1）最值定理要求闭区间。开区间上的连续函数，一定没有最大值吗？

    （2）$f(x)=\frac1x$在$(0,1]$上有最大值、最小值吗？

    （3）实际问题的定义域是开区间时，除了「区间上唯一的极值点」，还有什么办法说明找到的是最值？
  hints:
    - |
      （1）看$\sin x$在$(0,2\pi)$上。（2）$x\to0^+$时$\frac1x$怎样变？
    - |
      （3）把区间两端补上，看端点处的函数值或极限（limit，lim）。
    - |
      （1）不一定。$\sin x$在$(0,2\pi)$上的最大值$1$、最小值$-1$都取得到；最值定理只保证闭区间上一定有，没说开区间上一定没有。

      （2）最小值是$f(1)=1$；$x\to0^+$时$\frac1x$无限增大，没有最大值。

      （3）如果函数能连续地延拓到闭区间上，就在闭区间上比较；比如盒子的容积$V(x)=x(30-2x)^2$在$x=0$、$15$处补上值$0$，在$[0,15]$上比较端点和驻点。函数在一端趋于无穷大（infinity）时，那一端没有最大值，可能仍有最小值，要看驻点处的值。
  reference: |
    （1）不一定，$\sin x$在$(0,2\pi)$上。

    （2）有最小值$1$，无最大值。

    （3）延拓到闭区间比较；或看两端的极限。

- id: p8
  tier: thinking
  statement: |
    设$f$在$[a,b]$上可导（端点处是单侧导数，one-sided derivative）。

    （1）如果$f$在$[a,b]$上的最大值在左端点$a$取到，$f'(a)$能是正的吗？

    （2）最大值在右端点$b$取到时，$f'(b)$的正负有什么限制？

    （3）为什么求最值时，不要求端点处导数为$0$？
  hints:
    - |
      （1）右导数（right derivative）$f'(a)>0$时，$a$右边附近的$f(x)$和$f(a)$谁大？
    - |
      （1）差商（difference quotient）$\frac{f(x)-f(a)}{x-a}$在$x$靠近$a$时接近$f'(a)$。
    - |
      （1）不能。$f'(a)>0$时，$x$略大于$a$，差商为正，$f(x)>f(a)$，$f(a)$就不是最大值。所以$f'(a)\le0$。

      （2）同理$f'(b)\ge0$：在右端点取最大值，只要求从左边走过来不下降。

      （3）端点只有一侧，费马定理用不上，最大值点处只要求「往区间里面走，函数值不增大」，这是一个不等式，不是$f'=0$。所以端点要单独拿出来比较。
  reference: |
    （1）不能，$f'(a)\le0$。

    （2）$f'(b)\ge0$。

    （3）端点处的条件是单侧的不等式，不是$f'=0$。
