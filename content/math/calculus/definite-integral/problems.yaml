- id: p1
  tier: easy
  statement: |
    把$[0,2]$等分成$4$段，每段取右端点，求$f(x)=x^2$的这个黎曼和（Riemann sum）。
  answer:
    type: number
    value: 15/4
  hints:
    - |
      每段长$\Delta x=\frac12$，右端点是$\frac12$、$1$、$\frac32$、$2$。
    - |
      黎曼和是$\bigl(f(\frac12)+f(1)+f(\frac32)+f(2)\bigr)\cdot\frac12$。
    - |
      $\frac14+1+\frac94+4=\frac{15}2$，再乘$\frac12$。
  solution: |
    $\Delta x=\frac12$，右端点处的函数值是$\frac14$、$1$、$\frac94$、$4$，和是$\frac{15}2$，所以黎曼和是$\frac{15}2\cdot\frac12=\frac{15}4$。它比$\int_0^2x^2\,\dd x$大，因为$x^2$递增，右端点处的值是每段上最大的。

- id: p2
  tier: easy
  statement: |
    用几何意义求$\int_0^4|x-1|\,\dd x$。
  answer:
    type: number
    value: 5
  hints:
    - |
      画出$y=|x-1|$在$[0,4]$上的图像：两条线段，在$x=1$处折一下。
    - |
      图像和$x$轴围成两个三角形：$[0,1]$上一个，$[1,4]$上一个。
    - |
      两个三角形的面积是$\frac12\cdot1\cdot1$和$\frac12\cdot3\cdot3$。
  solution: |
    $|x-1|\ge0$，积分就是面积。$[0,1]$上是直角边为$1$的等腰直角三角形，面积$\frac12$；$[1,4]$上是直角边为$3$的，面积$\frac92$。所以积分是$\frac12+\frac92=5$。

- id: p3
  tier: medium
  statement: |
    已知$1^3+2^3+\cdots+n^3=\Bigl(\frac{n(n+1)}2\Bigr)^2$。用等分、取右端点的黎曼和求$\int_0^1x^3\,\dd x$。
  answer:
    type: number
    value: 1/4
  hints:
    - |
      把$[0,1]$等分成$n$段，$\xi_k=\frac kn$，$\Delta x=\frac1n$。
    - |
      黎曼和是$\sum_{k=1}^n\frac{k^3}{n^3}\cdot\frac1n=\frac{1^3+2^3+\cdots+n^3}{n^4}$。
    - |
      $\frac{1}{n^4}\cdot\frac{n^2(n+1)^2}4=\frac{(n+1)^2}{4n^2}$，$n\to\infty$时的极限。
  solution: |
    $x^3$在$[0,1]$上连续，可积。等分、取右端点，黎曼和是$\frac{1^3+\cdots+n^3}{n^4}=\frac{(n+1)^2}{4n^2}$，$n\to\infty$时趋于$\frac14$，所以$\int_0^1x^3\,\dd x=\frac14$。

- id: p4
  tier: medium
  statement: |
    $\lfloor x\rfloor$表示不超过$x$的最大整数。求$\int_0^3\bigl(x-\lfloor x\rfloor\bigr)\dd x$。
  answer:
    type: number
    value: 3/2
  hints:
    - |
      $x-\lfloor x\rfloor$在$[0,3]$上只有两个跳跃间断点$1$、$2$，可积。画出它的图像。
    - |
      在每个$[k,k+1)$上，它就是$x-k$，图像是一条从$0$升到接近$1$的线段。
    - |
      图像和$x$轴围成三个一样的三角形，每个面积$\frac12$；跳跃处的一个点不影响面积。
  solution: |
    被积函数只有有限个跳跃间断点，可积。它在$[0,1)$、$[1,2)$、$[2,3)$上分别是$x$、$x-1$、$x-2$，和$x$轴围成三个底和高都是$1$的三角形，积分是$3\times\frac12=\frac32$。

- id: p5
  tier: hard
  statement: |
    任取$[1,2]$的一个分割$1=x_0<x_1<\cdots<x_n=2$，在每个小区间里取$\xi_i=\sqrt{x_{i-1}x_i}$。

    （1）证明$f(x)=\frac1{x^2}$的这个黎曼和恰好等于$\frac12$。

    （2）由此求$\int_1^2\frac{\dd x}{x^2}$。

    （3）$\xi_i=\sqrt{x_{i-1}x_i}$真的在$[x_{i-1},x_i]$里吗？为什么允许这样取？
  hints:
    - |
      （1）$f(\xi_i)\Delta x_i=\frac{x_i-x_{i-1}}{x_{i-1}x_i}$，拆成两个分数的差。
    - |
      （1）$\frac{x_i-x_{i-1}}{x_{i-1}x_i}=\frac1{x_{i-1}}-\frac1{x_i}$，相加时中间的项两两抵消。
    - |
      （1）黎曼和是$\sum_{i=1}^n\Bigl(\frac1{x_{i-1}}-\frac1{x_i}\Bigr)=\frac1{x_0}-\frac1{x_n}=1-\frac12=\frac12$，和分割无关。

      （2）$\frac1{x^2}$在$[1,2]$上连续，可积，任何一种取点方式在分割越来越细时都趋于积分。这种取法的黎曼和永远是$\frac12$，所以积分是$\frac12$。

      （3）两个正数的几何平均数在它们之间：$x_{i-1}=\sqrt{x_{i-1}^2}\le\sqrt{x_{i-1}x_i}\le\sqrt{x_i^2}=x_i$。定义允许在每个小区间里任意取点，聪明地取，可以让和式正好能求出来。
  reference: |
    （1）$f(\xi_i)\Delta x_i=\frac1{x_{i-1}}-\frac1{x_i}$，求和后只剩$1-\frac12$。

    （2）$\frac12$。

    （3）在区间里（几何平均数）；定义允许任意取点。

- id: p6
  tier: hard
  statement: |
    一辆车从静止出发，$t$秒时的速度是$v(t)=t^2$（单位：$\mathrm{m/s}$），$0\le t\le3$。

    （1）把这$3$秒里走的路程写成定积分。

    （2）把$[0,3]$等分成$3$段，分别取左端点、右端点，算出两个黎曼和。真正的路程在它们之间吗？

    （3）用等分成$n$段、取右端点的黎曼和，求出路程。
  hints:
    - |
      （1）路程是速度在时间上的「积累」。（2）$v$在$[0,3]$上递增。
    - |
      （2）左端点：$(0^2+1^2+2^2)\cdot1$；右端点：$(1^2+2^2+3^2)\cdot1$。
    - |
      （1）$s=\int_0^3t^2\,\dd t$。

      （2）左端点得$5$，右端点得$14$。$v$递增，每一段上左端点的速度最小、右端点的最大，真正的路程在$5\,\mathrm{m}$和$14\,\mathrm{m}$之间。

      （3）$\sum_{k=1}^n\Bigl(\frac{3k}n\Bigr)^2\frac3n=\frac{27}{n^3}\cdot\frac{n(n+1)(2n+1)}6=\frac{9(n+1)(2n+1)}{2n^2}\to9$，路程是$9\,\mathrm{m}$。
  reference: |
    （1）$\int_0^3t^2\,\dd t$。

    （2）$5$和$14$，路程在中间。

    （3）$9\,\mathrm{m}$。

- id: p7
  tier: thinking
  statement: |
    定积分的定义要求「不管怎样分割、怎样取点」，黎曼和都趋于同一个数。

    （1）如果只用等分、取右端点来定义积分，对$[0,1]$上「$x$是有理数时取$1$、无理数时取$0$」的函数，会得到什么？

    （2）换成每段都取一个无理数作$\xi_i$呢？

    （3）为什么定义要那么严？
  hints:
    - |
      （1）等分时右端点$\frac kn$都是有理数。（2）每个小区间里都有无理数。
    - |
      （1）每一项都是$1\cdot\frac1n$。（2）每一项都是$0$。
    - |
      （1）右端点都是有理数，函数值都是$1$，和是$1$，「积分」是$1$。

      （2）全取无理数时和是$0$。同一个函数，两种取法得到不同的结果。

      （3）这个函数在任何一小段上都在$0$和$1$之间来回跳，说不清它「下面的面积」。只用一种取法，会给它安上一个随取法而变的值；要求所有取法都趋于同一个数，这种函数就被排除了，留下的才配叫面积。
  reference: |
    （1）$1$。

    （2）$0$。

    （3）结果依赖取法的函数没有合理的面积，严格的定义把它们排除在可积之外。

- id: p8
  tier: thinking
  statement: |
    （1）中学的面积公式对多边形成立。由曲线围成的图形，「面积」本身是什么意思？

    （2）定积分是在计算一个早已定义好的面积，还是在给曲边梯形（curvilinear trapezoid）的面积下定义？

    （3）$\int_{-r}^r\sqrt{r^2-x^2}\,\dd x$和圆的面积公式$\pi r^2$是什么关系？
  hints:
    - |
      （1）（2）多边形能切成三角形，曲边梯形不能；想想用长方形从里面、外面逼近。
    - |
      （3）$\sqrt{r^2-x^2}$的图像是什么？
    - |
      （1）对曲线围成的图形，没有现成的公式；直观上，面积应当夹在里面拼的多边形和外面盖的多边形的面积之间。

      （2）可以说是在下定义：分割越来越细时，黎曼和趋于的那个数，就定义为曲边梯形的面积。它对长方形、三角形给出原来的结果，所以和中学的面积不矛盾。

      （3）$\sqrt{r^2-x^2}$的图像是上半圆，积分等于半圆的面积$\frac{\pi r^2}2$。反过来，用积分也能推出圆的面积公式，这要用到以后的积分方法。
  reference: |
    （1）用多边形从里外逼近。

    （2）定积分可以看成曲边图形面积的定义，和多边形面积一致。

    （3）它是半圆面积$\frac{\pi r^2}2$。
