- id: p1
  tier: easy
  statement: |
    求$\int_0^\pi\sin\frac x2\,\dd x$。
  answer:
    type: number
    value: 2
  hints:
    - |
      令$u=\frac x2$，用第一类换元法（substitution of the first kind）。
    - |
      $\dd u=\frac12\,\dd x$，即$\dd x=2\,\dd u$；$x$从$0$到$\pi$时，$u$从$0$到$\frac\pi2$。
    - |
      原式等于$2\int_0^{\pi/2}\sin u\,\dd u$。
  solution: |
    $\int_0^\pi\sin\frac x2\,\dd x=2\int_0^{\pi/2}\sin u\,\dd u$，而$-2\cos u\Big|_0^{\pi/2}=2$。

- id: p2
  tier: easy
  statement: |
    求$\int_0^1\frac{x\,\dd x}{\sqrt{1+x^2}}$。
  answer:
    type: number
    value: sqrt(2) - 1
  hints:
    - |
      $x\,\dd x$差一个常数倍就是$1+x^2$的导数乘$\dd x$。
    - |
      令$u=1+x^2$，$\dd u=2x\,\dd x$；$x$从$0$到$1$时，$u$从$1$到$2$。
    - |
      原式等于$\frac12\int_1^2\frac{\dd u}{\sqrt u}$。
  solution: |
    令$u=1+x^2$，$\int_0^1\frac{x\,\dd x}{\sqrt{1+x^2}}=\frac12\int_1^2u^{-1/2}\,\dd u$，而$\sqrt u\Big|_1^2=\sqrt2-1\approx0.414$。

- id: p3
  tier: medium
  statement: |
    求$\int_1^e\frac{(\ln x)^2}x\,\dd x$。
  answer:
    type: number
    value: 1/3
  hints:
    - |
      被积函数（integrand）里有$\frac1x$，它是谁的导数？
    - |
      令$u=\ln x$，$\dd u=\frac{\dd x}x$。
    - |
      $x$从$1$到$e$时，$u$从$0$到$1$，原式等于$\int_0^1u^2\,\dd u$。
  solution: |
    令$u=\ln x$，$\int_1^e\frac{(\ln x)^2}x\,\dd x=\int_0^1u^2\,\dd u=\frac13$。

- id: p4
  tier: medium
  statement: |
    求$\int_0^3\frac{x\,\dd x}{\sqrt{x+1}}$。
  answer:
    type: number
    value: 8/3
  hints:
    - |
      用第二类换元法（substitution of the second kind）去掉根号：令$t=\sqrt{x+1}$。
    - |
      $x=t^2-1$，$\dd x=2t\,\dd t$；$x$从$0$到$3$时，$t$从$1$到$2$。
    - |
      原式等于$\int_1^2\frac{t^2-1}t\cdot2t\,\dd t=2\int_1^2(t^2-1)\,\dd t$。
  solution: |
    令$x=t^2-1$（$t\ge0$），原式等于$2\int_1^2(t^2-1)\,\dd t=2\Bigl(\frac{t^3}3-t\Bigr)\Big|_1^2$，即$2\Bigl(\frac23+\frac23\Bigr)=\frac83$。

- id: p5
  tier: hard
  statement: |
    （1）设$f$在$[0,a]$上连续（continuous），证明$\int_0^af(x)\,\dd x=\int_0^af(a-x)\,\dd x$。

    （2）求$\int_0^{\pi/2}\frac{\sin x}{\sin x+\cos x}\,\dd x$。

    （3）求$\int_0^{\pi/2}\frac{\sin^3x}{\sin^3x+\cos^3x}\,\dd x$。
  hints:
    - |
      （1）在右边令$u=a-x$。（2）不要直接找原函数（antiderivative），用（1）。
    - |
      （2）用（1），$\sin\bigl(\frac\pi2-x\bigr)=\cos x$，记原式为$I$，得$I=\int_0^{\pi/2}\frac{\cos x}{\cos x+\sin x}\,\dd x$。
    - |
      （1）$u=a-x$，$\dd u=-\dd x$，$x$从$0$到$a$时$u$从$a$到$0$，右边等于$-\int_a^0f(u)\,\dd u=\int_0^af(u)\,\dd u$。

      （2）把$I$的两种写法相加，被积函数变成$1$，$2I=\frac\pi2$，$I=\frac\pi4$。

      （3）同样，$I$和$\int_0^{\pi/2}\frac{\cos^3x}{\cos^3x+\sin^3x}\,\dd x$相等，两者之和是$\frac\pi2$，所以$I=\frac\pi4$。
  reference: |
    （1）令$u=a-x$。

    （2）$\frac\pi4$：$I$等于把$\sin$、$\cos$对调后的积分，两者相加是$\frac\pi2$。

    （3）$\frac\pi4$，道理相同。

- id: p6
  tier: hard
  statement: |
    （1）设$f$在$\R$上连续，以$T$为周期。证明：对任何$a$，$\int_a^{a+T}f(x)\,\dd x=\int_0^Tf(x)\,\dd x$。

    （2）求$\int_0^{100\pi}|\sin x|\,\dd x$。
  hints:
    - |
      （1）设$a$在$[kT,(k+1)T)$里，用区间可加性（additivity over intervals）把左边拆开，再对其中一段平移换元。
    - |
      （1）也可以把左边看成$a$的函数$\Phi(a)$，求$\Phi'(a)$。（2）$|\sin x|$以$\pi$为周期。
    - |
      （1）$\Phi(a)=\int_a^{a+T}f(x)\,\dd x=\int_0^{a+T}f(x)\,\dd x-\int_0^af(x)\,\dd x$，由微积分基本定理（fundamental theorem of calculus），$\Phi'(a)=f(a+T)-f(a)=0$，所以$\Phi$是常数，等于$\Phi(0)=\int_0^Tf(x)\,\dd x$。

      （2）由（1）和区间可加性，原式是$100$个$\int_0^\pi\sin x\,\dd x=2$之和，等于$200$。
  reference: |
    （1）$\Phi(a)=\int_a^{a+T}f$，$\Phi'(a)=f(a+T)-f(a)=0$，或者拆开后平移换元。

    （2）$200$。

- id: p7
  tier: thinking
  statement: |
    （1）积分变量（variable of integration）换个字母，$\int_0^1f(x)\,\dd x=\int_0^1f(t)\,\dd t$，不用乘任何因子；令$x=t^2$换元，却要写成$\int_0^1f(t^2)\cdot2t\,\dd t$。两者有什么不同？

    （2）从图上解释因子$2t$：$t$轴上的一小段$[t,t+\Delta t]$，对应$x$轴上多长的一段？

    （3）取$f=1$验证：$\int_0^1\dd x$和$\int_0^12t\,\dd t$相等吗？$t$在$[0,\frac12]$和$[\frac12,1]$上，$x$各走过多少？
  hints:
    - |
      （1）换字母时，$x$和$t$是同一个数；令$x=t^2$时，$x$是$t$的函数，两者不相等。
    - |
      （2）$(t+\Delta t)^2-t^2=2t\Delta t+(\Delta t)^2$。
    - |
      （1）换字母只是改名字，变量的范围、每一小段的长度都没变。$x=t^2$把$t$轴上的区间映到$x$轴上的区间，长度变了，要乘上伸缩的倍数。

      （2）长约$2t\Delta t$，所以$\dd x=2t\,\dd t$：$t<\frac12$的地方，$x$的一小段比$t$的一小段短，$t>\frac12$的地方比它长。

      （3）都等于$1$。$t$在$[0,\frac12]$上时$x$只走过$\frac14$，在$[\frac12,1]$上走过$\frac34$；乘上$2t$，正好把这种不均匀补回来。
  reference: |
    （1）换字母不改变区间和长度；$x=t^2$改变了长度，要乘伸缩倍数$\psi'(t)$。

    （2）约$2t\Delta t$。

    （3）都等于$1$；$t$的前一半只对应$x$的$\frac14$。

- id: p8
  tier: thinking
  statement: |
    （1）用$u=\sin t$算$\int_0^\pi\sin^2t\cos t\,\dd t$。$\sin t$在$[0,\pi]$上不单调，这样换元得到的结果对吗？直接用原函数验算。

    （2）有人把$\int_{-1}^1x^2\,\dd x$令$u=x^2$，写成$\int_1^1\frac{\sqrt u}2\,\dd u=0$。错在哪里？怎样改？

    （3）定积分的换元公式从左往右用、从右往左用，各要注意什么？
  hints:
    - |
      （1）$u$的上下限都是$0$。原函数是$\frac{\sin^3t}3$。
    - |
      （2）$x^2\,\dd x=\frac x2\,\dd u$，$x$在$[-1,0]$上等于$-\sqrt u$。
    - |
      （1）换元得$\int_0^0u^2\,\dd u=0$，直接算$\frac{\sin^3t}3\Big|_0^\pi=0$，一致。从左往右用公式，只要被积函数是$f(\varphi(t))\varphi'(t)$的样子、$\varphi'$连续，不需要单调。

      （2）错在把$x$一律写成$\sqrt u$。在$[0,1]$上$x=\sqrt u$，$\int_0^1x^2\,\dd x=\int_0^1\frac{\sqrt u}2\,\dd u=\frac13$；在$[-1,0]$上$x=-\sqrt u$，$\int_{-1}^0x^2\,\dd x=\int_1^0\Bigl(-\frac{\sqrt u}2\Bigr)\dd u=\frac13$。合起来是$\frac23$。

      （3）从左往右（第一类）：被积函数要整个写成$f(\varphi(t))\varphi'(t)$。从右往左（第二类）：令$x=\varphi(t)$时，$t$走过$[\alpha,\beta]$，$x$要从$a$走到$b$，被积函数里的每个$x$都要换成$\varphi(t)$。
  reference: |
    （1）对，都是$0$；从左往右用不需要单调。

    （2）$x$在$[-1,0]$上是$-\sqrt u$，要分两段换，结果是$\frac23$。

    （3）第一类要凑成$f(\varphi(t))\varphi'(t)$；第二类要上下限对应、每个$x$都换掉。
