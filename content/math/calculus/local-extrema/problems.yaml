- id: p1
  tier: easy
  statement: |
    求$f(x)=x^3-9x^2+24x-5$的所有驻点（stationary point）。
  answer:
    type: set
    value: [2, 4]
  hints:
    - |
      驻点就是$f'(x)=0$的点。
    - |
      $f'(x)=3x^2-18x+24=3(x^2-6x+8)$。
    - |
      $3(x-2)(x-4)=0$，驻点是$2$和$4$。
  solution: |
    $f'(x)=3x^2-18x+24=3(x-2)(x-4)$，所以驻点是$x=2$和$x=4$。

- id: p2
  tier: easy
  statement: |
    下面的函数里，哪些以$x=0$为极值点（extremum point）？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $x^4$
      - |
        $x^3+x$
      - |
        $|x|+x$
      - |
        $\frac{1}{1+x^2}$
      - |
        $x^2-2x$
    value: [1, 3, 4]
  hints:
    - |
      按定义，看$0$附近的函数值是不是都$\le f(0)$，或都$\ge f(0)$。可导的函数，先看$f'(0)$是不是$0$。
    - |
      B 的导数$3x^2+1$处处为正；E 的导数在$0$处是$-2$。C 在$x<0$时恒为$0$，在$x>0$时是$2x$。
    - |
      A：$x^4\ge0=f(0)$，极小值点。C：$|x|+x\ge0=f(0)$，也是极小值点（左边一段和$f(0)$相等，按定义里的$\ge$也算）。D：$\frac1{1+x^2}\le1=f(0)$，极大值点。B、E 在$0$处可导、导数不为零，由费马定理不是极值点。
  solution: |
    A：$x^4\ge0$，$0$是极小值点。C：$x<0$时$|x|+x=0$，$x\ge0$时为$2x\ge0$，所以处处$\ge f(0)=0$，$0$是极小值点。D：$\frac1{1+x^2}\le1=f(0)$，$0$是极大值点。

    B：$f'(0)=1\ne0$；E：$f'(0)=-2\ne0$。由费马定理，$0$都不是它们的极值点。所以选 A、C、D。

- id: p3
  tier: medium
  statement: |
    求$f(x)=x^2(x-3)^2$的极大值。
  answer:
    type: number
    value: 81/16
  hints:
    - |
      先求驻点；$f\ge0$，哪些驻点显然是极小值点？
    - |
      $f'(x)=2x(x-3)(2x-3)$，驻点是$0$、$\frac32$、$3$；$f(0)=f(3)=0$是最小值。把$f$写成$[x(x-3)]^2$看$\frac32$。
    - |
      $x(x-3)=\bigl(x-\frac32\bigr)^2-\frac94$，在$[0,3]$上它在$-\frac94$和$0$之间，$|x(x-3)|$在$x=\frac32$处最大，所以$\frac32$是极大值点，极大值是$\bigl(\frac94\bigr)^2=\frac{81}{16}$。
  solution: |
    $f'(x)=2x(x-3)^2+2x^2(x-3)=2x(x-3)(2x-3)$，驻点是$0$、$\frac32$、$3$。$f\ge0=f(0)=f(3)$，所以$0$、$3$是极小值点。

    $f(x)=[x(x-3)]^2$，而$x(x-3)=\bigl(x-\frac32\bigr)^2-\frac94$。$x\in[0,3]$时它在$\bigl[-\frac94,0\bigr]$里，平方在$x=\frac32$处最大，所以$\frac32$是极大值点，极大值是$f\bigl(\frac32\bigr)=\frac{81}{16}$。

- id: p4
  tier: medium
  statement: |
    $f(x)=x^3+ax^2+bx$在$x=2$处取得极值$-4$。求$a$和$b$，依次填写。
  answer:
    type: tuple
    value: [-3, 0]
  hints:
    - |
      两个条件：$f'(2)=0$（费马定理），$f(2)=-4$。解出$a$、$b$以后，还要验证$x=2$确实是极值点。
    - |
      $f'(2)=12+4a+b=0$，$f(2)=8+4a+2b=-4$。
    - |
      解得$a=-3$，$b=0$，$f(x)=x^3-3x^2$。$f(x)-f(2)=x^3-3x^2+4=(x-2)^2(x+1)$，$x$靠近$2$时它$\ge0$，所以$x=2$确实是极小值点。
  solution: |
    由费马定理，$f'(2)=12+4a+b=0$；又$f(2)=8+4a+2b=-4$，即$2a+b=-6$。两式相减得$2a=-6$，$a=-3$，$b=0$。

    验证：$f(x)=x^3-3x^2$，$f(x)-f(2)=x^3-3x^2+4=(x-2)^2(x+1)$，在$x>-1$时$\ge0$，所以$x=2$是极小值点，极小值是$-4$。费马定理只给出必要条件，这一步不能省。

- id: p5
  tier: hard
  statement: |
    设$f$在$[a,b]$上可导（端点处指单侧导数），$f'(a)<0<f'(b)$。（1）证明$f$在$[a,b]$上的最小值不在端点处取到。（2）利用最值定理（extreme value theorem，见[闭区间上连续函数的性质](lesson:math.calculus.closed-interval-properties)），证明有$\xi\in(a,b)$使$f'(\xi)=0$。（3）由此证明：只要$f'(a)<c<f'(b)$，就有$\xi\in(a,b)$使$f'(\xi)=c$。
  hints:
    - |
      （1）$f'(a)<0$说明什么：$a$右边附近的函数值和$f(a)$比，谁大？（3）对$g(x)=f(x)-cx$用（2）。
    - |
      （1）右导数$\lim_{h\to0^+}\frac{f(a+h)-f(a)}h<0$，所以$h$很小时差商为负，$f(a+h)<f(a)$。同理$b$左边附近有比$f(b)$小的值。（2）$f$可导所以连续（continuous），最小值存在，又不在端点。
    - |
      （1）$f'(a)<0$：$h>0$很小时$\frac{f(a+h)-f(a)}h<0$，即$f(a+h)<f(a)$，$f(a)$不是最小值。$f'(b)>0$：$h<0$、$|h|$很小时$\frac{f(b+h)-f(b)}h>0$，分母为负，所以$f(b+h)<f(b)$，$f(b)$也不是最小值。

      （2）$f$在$[a,b]$上连续，由最值定理取到最小值；由（1），取到最小值的点$\xi$在$(a,b)$内部。$\xi$附近的函数值都$\ge f(\xi)$，所以$\xi$是极小值点，又是可导点，由费马定理$f'(\xi)=0$。

      （3）$g(x)=f(x)-cx$在$[a,b]$上可导，$g'(a)=f'(a)-c<0<f'(b)-c=g'(b)$，由（2）有$\xi$使$g'(\xi)=0$，即$f'(\xi)=c$。这说明导函数即使不连续，也像连续函数那样取遍两端之间的值（达布定理，Darboux's theorem）。
  reference: |
    （1）$f'(a)<0\Rightarrow$ 小$h>0$时$f(a+h)<f(a)$；$f'(b)>0\Rightarrow$ 小$h<0$时$f(b+h)<f(b)$。

    （2）最小值存在且在内部，内部最小值点是极小值点，费马定理给$f'(\xi)=0$。

    （3）$g=f-cx$。达布定理：导函数有介值性。

- id: p6
  tier: hard
  statement: |
    （1）设$f$在$x_0$处可导，$f'(x_0)>0$。证明：有$\delta>0$，使$x_0<x<x_0+\delta$时$f(x)>f(x_0)$，$x_0-\delta<x<x_0$时$f(x)<f(x_0)$。

    （2）用（1）重新说明费马定理。

    （3）（1）是不是说$f$在$x_0$附近递增？考虑$f(x)=x+2x^2\sin\frac1x$（$x\ne0$），$f(0)=0$：$f'(0)=1$，而$x\ne0$时$f'(x)=1+4x\sin\frac1x-2\cos\frac1x$（这个式子要用链式法则（chain rule，见[链式法则](lesson:math.calculus.chain-rule)）和正弦、余弦的导数，这里直接给出）。
  hints:
    - |
      （1）差商的极限是正数，$h$很小时差商也是正数；再看$h$的正负。（3）在$x_k=\frac1{2k\pi}$处算$f'$。
    - |
      （1）取$\delta$使$0<|h|<\delta$时$\frac{f(x_0+h)-f(x_0)}h>0$。（2）$f'(x_0)\ne0$时，（1）（或把$f$换成$-f$）说明$x_0$两侧都有比$f(x_0)$大和小的值。
    - |
      （1）$\frac{f(x_0+h)-f(x_0)}h\to f'(x_0)>0$，所以有$\delta$使$0<|h|<\delta$时差商$>0$：$h>0$时分子$>0$，$h<0$时分子$<0$，就是结论。

      （2）$x_0$是极值点又可导时，若$f'(x_0)>0$，由（1）$x_0$右边有更大的值、左边有更小的值，不是极值点；$f'(x_0)<0$时对$-f$用（1），同样矛盾。所以$f'(x_0)=0$。

      （3）不是。$f'(0)=0+1=1>0$，可在$x_k=\frac1{2k\pi}$处$\sin\frac1{x_k}=0$、$\cos\frac1{x_k}=1$，$f'(x_k)=1-2=-1<0$，而$x_k\to0$。所以$0$的任何附近都有$f$在减小的地方：（1）只拿$x_0$和两侧的点比，不比两侧的点之间。
  reference: |
    （1）差商极限为正，小$|h|$时差商为正，分子与$h$同号。

    （2）$f'(x_0)\ne0$时由（1）两侧一大一小，不是极值点。

    （3）不是；$f'(\frac1{2k\pi})=-1$。「在一点的导数为正」只说明和这一点相比两侧一高一低，不说明附近单调。

- id: p7
  tier: thinking
  statement: |
    极值和最值。

    （1）函数在区间内部取到最大值时，这一点是不是极大值点？在端点取到呢？

    （2）能不能有极大值，却没有最大值？能不能有无穷多个极大值点？

    （3）极值点处函数一定连续吗？
  hints:
    - |
      （1）对照极大值的定义：要比较的是$x_0$附近的点。（2）想想$x^3-3x$在整条数轴上，以及$\sin x$。
    - |
      （3）试试$f(0)=1$、$x\ne0$时$f(x)=0$。
    - |
      （1）在内部取到最大值的点，附近的函数值当然都不比它大，是极大值点；在端点取到时，按定义端点不算极值点。所以闭区间上的最大值点要么是极大值点，要么是端点。

      （2）能。$x^3-3x$在$x=-1$处有极大值$2$，可它在整条数轴上没有最大值。$\sin x$在$\frac\pi2+2k\pi$处都取极大值$1$，极大值点有无穷多个。

      （3）不一定。$f(0)=1$、$x\ne0$时$f(x)=0$，$0$是极大值点，$f$在$0$处却不连续。极值的定义只比较大小，不要求连续，更不要求可导。
  reference: |
    （1）内部最大值点是极大值点；端点不算。闭区间上求最值只需比较端点、驻点、不可导点。

    （2）能；能。

    （3）不一定。

- id: p8
  tier: thinking
  statement: |
    光学里的[费马原理](lesson:physics.optics.fermat-principle)（Fermat's principle）说，光从一点传到另一点，走的是光程取驻值的路径（导数为零，stationary value）。

    （1）为什么不直接说「光程最小的路径」？

    （2）在单变量的情形，「导数为零」和「最小」差在哪里？各举一个例子。

    （3）物理里还有哪些「最省」「最快」的说法，其实只要求导数为零？
  hints:
    - |
      （1）读一读那一节的边界情况：凹面镜里的实际光路。（2）驻点可以是极小值点、极大值点，也可以都不是。
    - |
      （2）$x^2$、$-x^2$、$x^3$在$0$处的导数都是$0$。
    - |
      （1）有的实际光路是光程的极大值（凹面镜），甚至既不是极大也不是极小；它们的共同点只是光程对路径的导数为零。「最小」太强，「驻值」才对。

      （2）驻点是导数为零的点，$x^2$、$-x^2$、$x^3$在$0$处都是；可$0$分别是极小值点、极大值点、不是极值点。费马定理只说可导函数的极值点是驻点，不说驻点是极值点，更不说是最小值点。

      （3）分析力学里的最小作用量原理（principle of least action），严格说也是作用量取驻值；平衡位置是势能的驻点，而稳定的平衡才要求势能取极小值。
  reference: |
    （1）实际光路可以是极大或鞍点，只有「驻值」普遍成立。

    （2）$x^2$、$-x^2$、$x^3$。

    （3）最小作用量原理（驻值作用量）；平衡位置是势能驻点，稳定性另看。
