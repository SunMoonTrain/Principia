- id: p1
  tier: easy
  statement: |
    求$\lim_{x\to\infty}\frac{9x^3-x+2}{2x^3+7x^2}$。
  answer:
    type: number
    value: 9/2
  hints:
    - |
      分子、分母都是三次多项式，$x$很大时起作用的是最高次项。
    - |
      分子、分母同除以$x^3$。
    - |
      得$\frac{9-\frac1{x^2}+\frac2{x^3}}{2+\frac7x}$，$x\to\infty$时趋于$\frac92$。
  solution: |
    分子、分母同除以$x^3$：$\frac{9-x^{-2}+2x^{-3}}{2+7x^{-1}}\to\frac92$。次数相同，极限是最高次项系数之比。

- id: p2
  tier: easy
  statement: |
    求$\lim_{n\to\infty}\frac{(n+1)(2n-3)}{5n^2+n}$。
  answer:
    type: number
    value: 2/5
  hints:
    - |
      把分子展开，看最高次项。
    - |
      分子是$2n^2-n-3$，分母是$5n^2+n$，次数都是$2$。
    - |
      极限是最高次项系数之比$\frac25$。
  solution: |
    分子$=2n^2-n-3$。分子、分母同除以$n^2$，得$\frac{2-\frac1n-\frac3{n^2}}{5+\frac1n}\to\frac25$。

- id: p3
  tier: medium
  statement: |
    求$\lim_{x\to-\infty}\bigl(\sqrt{x^2+6x}+x\bigr)$。
  answer:
    type: number
    value: -3
  hints:
    - |
      $x\to-\infty$时两项一个是正无穷大、一个是负无穷大，先有理化：乘以$\sqrt{x^2+6x}-x$再除回去。
    - |
      得$\frac{6x}{\sqrt{x^2+6x}-x}$。注意$x<0$时$\sqrt{x^2+6x}=|x|\sqrt{1+\frac6x}=-x\sqrt{1+\frac6x}$。
    - |
      原式$=\frac{6x}{-x\sqrt{1+\frac6x}-x}=\frac{-6}{\sqrt{1+\frac6x}+1}\to\frac{-6}{2}=-3$。
  solution: |
    $x$足够小（$x<-6$）时，$\sqrt{x^2+6x}+x=\frac{(x^2+6x)-x^2}{\sqrt{x^2+6x}-x}=\frac{6x}{\sqrt{x^2+6x}-x}$。$x<0$时$\sqrt{x^2+6x}=-x\sqrt{1+\frac6x}$，代入并约去$-x$，得$\frac{-6}{\sqrt{1+\frac6x}+1}$，$x\to-\infty$时趋于$-3$。

- id: p4
  tier: medium
  statement: |
    曲线$y=\frac{\sqrt{25x^2+1}}{x+4}$有一条竖直渐近线$x=c$；$x\to+\infty$、$x\to-\infty$时各有一条水平渐近线$y=L_1$、$y=L_2$。依次填$c$、$L_1$、$L_2$。
  answer:
    type: tuple
    value: [-4, 5, -5]
  hints:
    - |
      竖直渐近线找分母的零点，看分子在那里是不是$0$。水平渐近线分$x\to+\infty$和$x\to-\infty$两边算。
    - |
      $\sqrt{25x^2+1}=|x|\sqrt{25+\frac1{x^2}}$，$x>0$和$x<0$时$|x|$分别是$x$和$-x$。
    - |
      $x=-4$时分子是$\sqrt{401}\ne0$，所以$c=-4$。$x\to+\infty$时$y\to5$；$x\to-\infty$时$y=\frac{-x\sqrt{25+x^{-2}}}{x+4}\to-5$。
  solution: |
    $x\to-4$时分子趋于$\sqrt{401}$、分母趋于$0$，$y$是无穷大，$c=-4$。$x>0$时$y=\frac{x\sqrt{25+x^{-2}}}{x+4}=\frac{\sqrt{25+x^{-2}}}{1+4x^{-1}}\to5$；$x<0$时$\sqrt{25x^2+1}=-x\sqrt{25+x^{-2}}$，$y=\frac{-\sqrt{25+x^{-2}}}{1+4x^{-1}}\to-5$。所以填$-4$、$5$、$-5$。

- id: p5
  tier: hard
  statement: |
    $a_n=\frac{1}{n^2}+\frac{2}{n^2}+\cdots+\frac{n}{n^2}$。

    （1）求$\lim_{n\to\infty}a_n$。（2）每一项$\frac{k}{n^2}$在$n\to\infty$时都趋于$0$，为什么$a_n$的极限不是$0$？
  hints:
    - |
      （1）先把和算出来：$1+2+\cdots+n=\frac{n(n+1)}2$。
    - |
      （2）和的法则说的是两个（或固定个数的）函数相加。这里相加的项数是多少？
    - |
      （1）$a_n=\frac{n(n+1)}{2n^2}=\frac{n+1}{2n}\to\frac12$。

      （2）四则运算法则只管固定个数的项相加；$a_n$里有$n$项，项数随$n$增大。每一项都很小，可项越来越多，加起来不一定小：后一半的项都大于$\frac1{2n}$，约有$\frac n2$项，和至少约$\frac14$。
  reference: |
    （1）$a_n=\frac{1}{n^2}(1+2+\cdots+n)=\frac{n(n+1)}{2n^2}=\frac12+\frac1{2n}\to\frac12$。

    （2）「逐项取极限再相加」只对固定个数的项成立（由和的法则，项数固定时可以重复用）。$a_n$的项数是$n$，随$n$变：每一项都趋于$0$，可项数越来越多。例如$k>\frac n2$的那些项都大于$\frac{1}{2n}$，有$\frac n2$左右项，和至少约$\frac14$，所以$a_n$不会趋于$0$。

- id: p6
  tier: hard
  statement: |
    求$\lim_{n\to\infty}\left(\frac{1}{\sqrt{n^2+1}}+\frac{1}{\sqrt{n^2+2}}+\cdots+\frac{1}{\sqrt{n^2+n}}\right)$，并说明理由。
  hints:
    - |
      $n$项里哪一项最大、哪一项最小？用它们把和夹住。
    - |
      每一项都在$\frac1{\sqrt{n^2+n}}$和$\frac1{\sqrt{n^2+1}}$之间，一共$n$项。
    - |
      和$b_n$满足$\frac{n}{\sqrt{n^2+n}}\le b_n\le\frac{n}{\sqrt{n^2+1}}$。两边同除以$n$后分母分别是$\sqrt{1+\frac1n}$、$\sqrt{1+\frac1{n^2}}$，都趋于$1$，所以两边都趋于$1$，由夹逼定理，极限是$1$。
  reference: |
    第$k$项$\frac1{\sqrt{n^2+k}}$随$k$增大而减小，最大的是$k=1$、最小的是$k=n$。$n$项相加：$\frac{n}{\sqrt{n^2+n}}\le b_n\le\frac{n}{\sqrt{n^2+1}}$。

    $\frac{n}{\sqrt{n^2+n}}=\frac{1}{\sqrt{1+\frac1n}}\to1$，$\frac{n}{\sqrt{n^2+1}}=\frac{1}{\sqrt{1+\frac1{n^2}}}\to1$。由数列的夹逼定理，$b_n\to1$。

    这里也不能逐项取极限：每一项都趋于$0$，可有$n$项（和第 5 题同一个道理）。

- id: p7
  tier: thinking
  statement: |
    （1）一条曲线$y=f(x)$最多能有几条水平渐近线？竖直渐近线呢？（2）说明$y=\frac{\sin x}{x}$以$y=0$为水平渐近线，并且穿过它无穷多次。

    （3）$y=x+\frac1x$在$x\to\infty$时有没有水平渐近线？它的图像远处贴着什么？
  hints:
    - |
      （1）水平渐近线来自$x\to+\infty$和$x\to-\infty$两个方向；竖直渐近线想想$\tan x$。
    - |
      （2）$|\sin x|\le1$，用夹逼定理；$\sin x$的零点在哪里？
    - |
      （1）水平渐近线最多两条，两个方向各一条；竖直渐近线可以有无穷多条，比如$\tan x$在每个$x=\frac\pi2+k\pi$处。

      （2）$\left|\frac{\sin x}{x}\right|\le\frac1{|x|}\to0$，由夹逼定理极限是$0$，$y=0$是水平渐近线。$x=k\pi$（$k\ne0$）处$\frac{\sin x}x=0$，曲线在这些地方穿过$y=0$，有无穷多个。

      （3）$y\to\pm\infty$，没有水平渐近线；但$y-x=\frac1x\to0$，曲线远处贴着直线$y=x$。这种斜的直线叫作斜渐近线（slant asymptote），画函数图时会用到。
  reference: |
    （1）$x\to+\infty$、$x\to-\infty$各最多一个极限，所以水平渐近线至多两条（可以重合成一条）。竖直渐近线没有上限：$\tan x$有无穷多条。

    （2）$-\frac1{|x|}\le\frac{\sin x}{x}\le\frac1{|x|}$，两边趋于$0$，夹逼得$\lim_{x\to\infty}\frac{\sin x}x=0$。曲线在$x=k\pi$（$k=\pm1,\pm2,\dots$）处等于$0$，并且在相邻零点之间正负交替，确实穿过$y=0$无穷多次。渐近线只说「远处越来越近」，不说「不相交」。

    （3）$\lim_{x\to\pm\infty}\bigl(x+\frac1x\bigr)=\pm\infty$，没有水平渐近线；$\bigl(x+\frac1x\bigr)-x=\frac1x\to0$，曲线和直线$y=x$的竖直距离趋于零，$y=x$是斜渐近线。

- id: p8
  tier: thinking
  statement: |
    设$a_n=f(n)$。

    （1）为什么$\lim_{x\to+\infty}f(x)=L$能推出$a_n\to L$？（2）如果数列$\{a_n\}$发散，$\lim_{x\to+\infty}f(x)$可能存在吗？（3）怎样借数列说明$\lim_{x\to+\infty}\sin(\pi x)$不存在？
  hints:
    - |
      （1）「$x$足够大时$f(x)$靠近$L$」对所有足够大的实数成立，正整数也在其中。
    - |
      （2）用（1）反过来想。（3）找两串趋于$+\infty$的$x$，让$\sin(\pi x)$分别靠近不同的数。
    - |
      （1）对足够大的所有实数$x$，$f(x)$都离$L$任意近，足够大的正整数$n$也包括在内，所以$a_n\to L$。

      （2）不可能：如果$\lim_{x\to+\infty}f(x)$存在，由（1）数列就收敛，和发散矛盾。

      （3）$x=n$时$\sin(\pi n)=0$；$x=2n+\frac12$时$\sin(\pi x)=1$。如果$\sin(\pi x)$有极限$L$，由（1）的道理，沿这两串$x$都得趋于$L$，于是$L=0$又$L=1$，矛盾。
  reference: |
    （1）函数的极限说的是所有足够大的实数，数列只取其中的整数，结论自然保留。

    （2）不可能，这正是（1）的逆否命题：$f$在$+\infty$有极限，$f(n)$就收敛。

    （3）沿$x_n=n$，$\sin(\pi x_n)=0\to0$；沿$x_n=2n+\frac12$，$\sin(\pi x_n)=1\to1$。两串都趋于$+\infty$，若函数有极限$L$，两串的函数值都要趋于$L$，矛盾，所以极限不存在。反过来，只看一串（比如$x=n$）得到$0$，并不能说明极限是$0$。
