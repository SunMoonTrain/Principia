- id: p1
  tier: easy
  statement: |
    $e^{2x}$的麦克劳林级数（Maclaurin series）里，$x^3$的系数是多少？
  answer:
    type: number
    value: 4/3
  hints:
    - |
      $e^u=\sum_{n=0}^\infty\frac{u^n}{n!}$对一切$u$成立，把$u=2x$代进去。
    - |
      含$x^3$的一项是$\frac{(2x)^3}{3!}$。
    - |
      $\frac{2^3}{3!}=\frac86$。
  solution: |
    $e^{2x}=\sum_{n=0}^\infty\frac{(2x)^n}{n!}$，即$\sum_{n=0}^\infty\frac{2^n}{n!}x^n$，$x^3$的系数是$\frac{2^3}{3!}=\frac43$。也可以直接算：$\frac{f'''(0)}{3!}=\frac{8}{6}$。

- id: p2
  tier: easy
  statement: |
    下列展开式中，在$x=1.5$处成立的有哪些？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $e^x=\sum_{n=0}^\infty\frac{x^n}{n!}$
      - |
        $\cos x=\sum_{n=0}^\infty\frac{(-1)^nx^{2n}}{(2n)!}$
      - |
        $\ln(1+x)=\sum_{n=1}^\infty\frac{(-1)^{n+1}x^n}n$
      - |
        $\frac1{1-x}=\sum_{n=0}^\infty x^n$
    value: [1, 2]
  hints:
    - |
      每个展开式在什么范围里成立？
    - |
      $e^x$、$\cos x$的展开式对一切$x$成立。
    - |
      $\ln(1+x)$的展开式要$-1<x\le1$，几何级数要$|x|<1$。
  solution: |
    $e^x$、$\cos x$的展开式处处成立，A、B 对。$\ln(1+x)$的展开式只在$-1<x\le1$成立，$1.5$不在里面，级数发散；$\sum x^n$在$|x|\ge1$时发散。选 A、B。

- id: p3
  tier: medium
  statement: |
    求$\sum_{n=0}^\infty\frac{(-1)^n\pi^{2n+1}}{2^{2n+1}(2n+1)!}$。
  answer:
    type: number
    value: 1
  hints:
    - |
      $\frac{\pi^{2n+1}}{2^{2n+1}}=\bigl(\frac\pi2\bigr)^{2n+1}$。
    - |
      $\sin x=\sum_{n=0}^\infty\frac{(-1)^nx^{2n+1}}{(2n+1)!}$对一切$x$成立。
    - |
      这是$\sin x$的级数在$x=\frac\pi2$处的值。
  solution: |
    级数是$\sum_{n=0}^\infty\frac{(-1)^n}{(2n+1)!}\bigl(\frac\pi2\bigr)^{2n+1}$，正是$\sin x$的麦克劳林级数在$x=\frac\pi2$处的值，等于$\sin\frac\pi2=1$。

- id: p4
  tier: medium
  statement: |
    求$\sum_{n=1}^\infty\frac1{n\cdot2^n}$。
  answer:
    type: number
    value: ln(2)
  hints:
    - |
      和$\ln(1+x)=\sum_{n=1}^\infty\frac{(-1)^{n+1}x^n}n$比一比，取哪个$x$？
    - |
      取$x=-\frac12$，它在$-1<x\le1$里。
    - |
      $\frac{(-1)^{n+1}(-1/2)^n}n=-\frac1{n\cdot2^n}$。
  solution: |
    取$x=-\frac12$，$\ln\frac12=\sum_{n=1}^\infty\frac{(-1)^{n+1}(-1/2)^n}n$，右边每一项都是$-\frac1{n\cdot2^n}$，所以所求的和是$-\ln\frac12=\ln2$。这里$x=-\frac12$在$-1<x<0$那一段，用的是积分形式的余项估计。

- id: p5
  tier: hard
  statement: |
    证明$e$是无理数。（提示用$e=\sum_{n=0}^\infty\frac1{n!}$。）
  hints:
    - |
      假设$e=\frac pq$，$p$、$q$是正整数。两边乘$q!$。
    - |
      $q!\,e$等于$q!\sum_{n=0}^q\frac1{n!}$加上$q!\sum_{n=q+1}^\infty\frac1{n!}$，前两个都是整数。
    - |
      $q!\sum_{n=q+1}^\infty\frac1{n!}$展开是$\frac1{q+1}+\frac1{(q+1)(q+2)}+\cdots$，第$k$项不超过$\frac1{(q+1)^k}$，所以它大于$0$、小于$\sum_{k=1}^\infty\frac1{(q+1)^k}$，后者等于$\frac1q$。
  reference: |
    设$e=\frac pq$。$q!\,e=(q-1)!\,p$是整数，$q!\sum_{n=0}^q\frac1{n!}$也是整数，所以$r=q!\sum_{n=q+1}^\infty\frac1{n!}$是整数。可是$0<r<\sum_{k=1}^\infty\frac1{(q+1)^k}=\frac1q\le1$，没有这样的整数，矛盾。所以$e$是无理数。

- id: p6
  tier: hard
  statement: |
    （1）证明$|x|<1$时$\ln\frac{1+x}{1-x}=2\Bigl(x+\frac{x^3}3+\frac{x^5}5+\cdots\Bigr)$。

    （2）取$x=\frac13$，用括号里的前$3$项算$\ln2$，误差大约是多少？和用$1-\frac12+\frac13-\cdots$的前$3$项比一比。
  hints:
    - |
      （1）$\ln(1-x)=\ln\bigl(1+(-x)\bigr)$，$|x|<1$时$-x$也在$-1<-x\le1$里。
    - |
      （1）两个收敛的级数逐项相减：$\ln(1+x)-\ln(1-x)$，偶数次项抵消，奇数次项加倍。
    - |
      （2）$\frac{1+1/3}{1-1/3}=2$。前$3$项是$2\bigl(\frac13+\frac1{81}+\frac1{1215}\bigr)$。
  reference: |
    （1）$\ln(1+x)=x-\frac{x^2}2+\frac{x^3}3-\cdots$，$\ln(1-x)=-x-\frac{x^2}2-\frac{x^3}3-\cdots$，两式相减得$2\bigl(x+\frac{x^3}3+\frac{x^5}5+\cdots\bigr)$。

    （2）$2\bigl(\frac13+\frac1{81}+\frac1{1215}\bigr)\approx0.69300$，$\ln2\approx0.69315$，误差约$0.00014$。交错调和级数的前$3$项是$1-\frac12+\frac13\approx0.833$，误差约$0.14$，前者的误差约是后者的$\frac1{1000}$：$x=\frac13$时各项按$\frac19$的比例缩小，收敛快得多。

- id: p7
  tier: thinking
  statement: |
    $\ln3$有定义，可$\ln(1+x)$的展开式在$x=2$处不成立。

    （1）在$x=2$处，级数$\sum\frac{(-1)^{n+1}x^n}n$为什么发散？这和$\ln(1+x)$在$x=2$附近好不好，有关系吗？

    （2）怎样仍然用级数算$\ln3$？说出两种办法。
  hints:
    - |
      （1）$x=2$时通项的绝对值是$\frac{2^n}n$。收敛半径由什么决定？
    - |
      （2）$\ln3=\ln2+\ln\frac32$，两个都能用$\ln(1+x)$的展开式算。
    - |
      （2）第 6 题的公式里，$\frac{1+x}{1-x}=3$时$x=\frac12$。
  reference: |
    （1）$\frac{2^n}n\to+\infty$，通项不趋于$0$，发散。收敛半径是$1$，和$\ln(1+x)$在$x=2$附近光滑不光滑无关：以$0$为中心的展开式在离$0$为$1$的地方就停住了，而$x=-1$处$\ln(1+x)$没有定义，正好离中心为$1$。

    （2）一种是$\ln3=\ln2+\ln1.5$，分别取$x=1$和$x=0.5$（$x=1$的级数收敛很慢，最好也换成第 6 题的办法）；另一种是用第 6 题的公式，取$x=\frac12$，$\ln3=2\bigl(\frac12+\frac1{24}+\frac1{160}+\cdots\bigr)$。

- id: p8
  tier: thinking
  statement: |
    （1）用几何级数写出$\frac1{1+x^2}$的麦克劳林级数，它在哪些$x$处收敛？

    （2）$\frac1{1+x^2}$对一切实数$x$都有定义，各阶导数也都存在，为什么它的展开式只在一个有限的区间里成立？和$\frac1{1+x}$比一比。

    （3）$e^x$的展开式处处成立。两者的差别在哪里？
  hints:
    - |
      （1）把$\frac1{1-q}=\sum q^n$里的$q$换成$-x^2$。
    - |
      （2）$\frac1{1+x}$在$x=-1$处没有定义，所以收敛半径不会超过$1$。$\frac1{1+x^2}$在实数里找不到这样的点。
    - |
      （2）在复数里，$1+x^2=0$有根$\pm i$，它们到$0$的距离是$1$。
  reference: |
    （1）$\frac1{1+x^2}=\sum_{n=0}^\infty(-1)^nx^{2n}$，即$1-x^2+x^4-\cdots$，$|x|<1$时收敛，$|x|\ge1$时通项不趋于$0$，发散。

    （2）只看实数找不到原因；把$x$换成复数，$\frac1{1+x^2}$在$\pm i$处变成无穷大，以$0$为中心、半径大于$1$的圆会碰到这两点，收敛半径是到最近的这种点的距离$1$。$\frac1{1+x}$的这种点$-1$就在实轴上，看得见。这要到复分析里才讲清楚。

    （3）$e^x$在复数里也处处有定义、没有变成无穷大的点，所以收敛半径是$+\infty$。实数上「处处光滑」不足以保证展开式处处成立。
