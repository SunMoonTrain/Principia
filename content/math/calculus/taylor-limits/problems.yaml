- id: p1
  tier: easy
  statement: |
    用泰勒公式（Taylor's formula）求$\lim_{x\to0}\frac{\sin x-x+\frac{x^3}6}{x^5}$。
  answer:
    type: number
    value: 1/120
  hints:
    - |
      分母是$x^5$，把$\sin x$展开到$x^5$。
    - |
      $\sin x=x-\frac{x^3}6+\frac{x^5}{120}+o(x^5)$。
    - |
      分子是$\frac{x^5}{120}+o(x^5)$。
  solution: |
    $\sin x=x-\frac{x^3}{6}+\frac{x^5}{120}+o(x^5)$，所以分子等于$\frac{x^5}{120}+o(x^5)$，极限是$\frac1{120}$。

- id: p2
  tier: easy
  statement: |
    $x\to0$时，$\ln(1+x^2)-x^2$和$cx^k$等价（equivalent）。求$(c,k)$。
  answer:
    type: tuple
    value: [-1/2, 4]
  hints:
    - |
      在$\ln(1+u)$的展开里取$u=x^2$。
    - |
      $\ln(1+u)=u-\frac{u^2}2+o(u^2)$，$o(u^2)=o(x^4)$。
    - |
      $\ln(1+x^2)-x^2=-\frac{x^4}2+o(x^4)$。
  solution: |
    $\ln(1+x^2)=x^2-\frac{x^4}2+o(x^4)$，所以$\ln(1+x^2)-x^2=-\frac{x^4}2+o(x^4)$，和$-\frac12x^4$等价，$(c,k)=\bigl(-\frac12,4\bigr)$。

- id: p3
  tier: medium
  statement: |
    求$\lim_{x\to+\infty}\Bigl[x-x^2\ln\Bigl(1+\frac1x\Bigr)\Bigr]$。
  answer:
    type: number
    value: 1/2
  hints:
    - |
      令$t=\frac1x$，$t\to0^+$，原式变成$\frac1t-\frac{\ln(1+t)}{t^2}=\frac{t-\ln(1+t)}{t^2}$。
    - |
      分母是$t^2$，把$\ln(1+t)$展开到$t^2$。
    - |
      $t-\ln(1+t)=\frac{t^2}2+o(t^2)$。
  solution: |
    令$t=\frac1x\to0^+$，原式等于$\frac{t-\ln(1+t)}{t^2}$。由$\ln(1+t)=t-\frac{t^2}2+o(t^2)$，分子是$\frac{t^2}2+o(t^2)$，所以极限是$\frac12$。

- id: p4
  tier: medium
  statement: |
    求常数$a$、$b$，使$x\to0$时$x-(a+b\cos x)\sin x$是比$x^3$高阶的无穷小。答案写成$(a,b)$。
  answer:
    type: tuple
    value: [4/3, -1/3]
  hints:
    - |
      把$(a+b\cos x)\sin x$展开到$x^3$，让$x$和$x^3$的系数都和$x$里的相同。
    - |
      $(a+b\cos x)\sin x=\Bigl(a+b-\frac b2x^2+o(x^2)\Bigr)\Bigl(x-\frac{x^3}6+o(x^3)\Bigr)$。
    - |
      $x$的系数是$a+b$，$x^3$的系数是$-\frac{a+b}6-\frac b2$。要$a+b=1$，$-\frac16-\frac b2=0$。
  solution: |
    $(a+b\cos x)\sin x=(a+b)x-\Bigl(\frac{a+b}6+\frac b2\Bigr)x^3+o(x^3)$。要$x-(a+b\cos x)\sin x=o(x^3)$，须$a+b=1$且$\frac{a+b}6+\frac b2=0$，解得$b=-\frac13$，$a=\frac43$。

- id: p5
  tier: hard
  statement: |
    设$f(x)=\frac1{1+x^2}$。

    （1）用$\frac1{1+u}$的展开，写出$f$的$8$阶麦克劳林多项式。

    （2）求$f^{(8)}(0)$和$f^{(7)}(0)$。
  hints:
    - |
      （1）$\frac1{1+u}=1-u+u^2-u^3+u^4+o(u^4)$，取$u=x^2$。
    - |
      （2）由唯一性，$x^k$的系数乘以$k!$就是$f^{(k)}(0)$。
    - |
      （1）$f(x)=1-x^2+x^4-x^6+x^8+o(x^8)$，由唯一性，$T_8(x)=1-x^2+x^4-x^6+x^8$。

      （2）$x^8$的系数是$1$，$f^{(8)}(0)=8!=40320$；没有$x^7$项，$f^{(7)}(0)=0$（$f$是偶函数（even function），奇数阶导数在$0$处都是$0$）。直接求八阶导数要繁得多。
  reference: |
    （1）$1-x^2+x^4-x^6+x^8$。

    （2）$f^{(8)}(0)=40320$，$f^{(7)}(0)=0$。

- id: p6
  tier: hard
  statement: |
    用泰勒公式重算[洛必达法则](lesson:math.calculus.lhopital)第 5 题：求$\lim_{x\to0}\frac{(1+x)^{\frac1x}-e}{x}$。

    （1）把$\frac{\ln(1+x)}x$展开到$x$项。

    （2）由此把$(1+x)^{\frac1x}$展开到$x$项，求出极限。

    （3）和用洛必达法则比，哪种更省事？
  hints:
    - |
      （1）$\ln(1+x)=x-\frac{x^2}2+o(x^2)$，除以$x$。
    - |
      （2）$(1+x)^{\frac1x}=e^{\frac{\ln(1+x)}x}=e\cdot e^{-\frac x2+o(x)}$，再用$e^u=1+u+o(u)$。
    - |
      （1）$\frac{\ln(1+x)}x=1-\frac x2+o(x)$。

      （2）$(1+x)^{\frac1x}=e\cdot e^{u}$，$u=-\frac x2+o(x)\to0$，$e^u=1+u+o(u)=1-\frac x2+o(x)$。所以$(1+x)^{\frac1x}=e-\frac e2x+o(x)$，极限是$-\frac e2\approx-1.359$。

      （3）泰勒公式只用两个现成的展开，不用求$\bigl(e^{\ln(1+x)/x}\bigr)'$，也不用再用一次洛必达法则。
  reference: |
    （1）$1-\frac x2+o(x)$。

    （2）$-\frac e2$。

    （3）泰勒公式更省事。

- id: p7
  tier: thinking
  statement: |
    （1）为什么$o(x^2)-o(x^2)$不能写成$0$？

    （2）求$\lim_{x\to0}\frac{e^x-1-x}{x^2}$时，如果$e^x$只展开到$x$项，会怎样？

    （3）一般该展开到几阶？展开得太多有坏处吗？
  hints:
    - |
      （1）$o(x^2)$代表一类量，不是一个数。（2）$e^x=1+x+o(x)$，分子是$o(x)$。
    - |
      （2）$\frac{o(x)}{x^2}$可以趋于任何数，也可以没有极限。
    - |
      （1）两个$o(x^2)$可以是不同的量，比如$x^3$和$2x^3$，差是$-x^3$。能说的只是差还是$o(x^2)$。

      （2）分子成了$o(x)$，除以$x^2$以后什么也定不下来：$x^3$、$x^2$、$x^{1.5}$都是$o(x)$，除以$x^2$分别趋于$0$、$1$、$\infty$。要展开到$x^2$项，分子是$\frac{x^2}2+o(x^2)$，极限是$\frac12$。

      （3）展开到分子、分母都出现第一个不抵消的项为止；分母是$x^k$时，分子展开到$x^k$。多展开几项不会算错，只是多算，多出来的项最后都并进$o$。
  reference: |
    （1）两个$o(x^2)$可以不同，差仍是$o(x^2)$。

    （2）分子只剩$o(x)$，定不出极限；要展开到$x^2$。

    （3）到第一个不抵消的项；多展开不错，只是多算。

- id: p8
  tier: thinking
  statement: |
    （1）$\lim_{x\to+\infty}\frac{\ln x}x$能用泰勒公式求吗？

    （2）$\lim_{x\to0}\frac{x-\sin x}{x^3}$用洛必达法则要几步？用泰勒公式呢？

    （3）什么时候用洛必达法则方便，什么时候用泰勒公式方便？
  hints:
    - |
      （1）泰勒公式说的是一点附近的情形；$x\to+\infty$时$\ln x$在哪里展开？
    - |
      （2）洛必达法则见[洛必达法则](lesson:math.calculus.lhopital)例 1。
    - |
      （1）不方便。泰勒公式描述函数在一点附近怎样变，$x\to+\infty$时$\ln x$没有可以展开的点；换成$t=\frac1x$得$-t\ln t$，$\ln t$在$t\to0^+$时也没有泰勒展开。这里用洛必达法则一步就出来。

      （2）洛必达法则要连用三次；泰勒公式一步：$x-\sin x=\frac{x^3}6+o(x^3)$，极限是$\frac16$。

      （3）$x\to a$、函数在$a$附近有现成的展开，特别是有加减抵消、复合函数时，泰勒公式省事；$\frac\infty\infty$型、$x\to\infty$时的对数、指数比较，洛必达法则更直接。两种办法可以混着用。
  reference: |
    （1）不方便，没有展开点；用洛必达法则。

    （2）三次求导对一次展开。

    （3）一点附近的抵消用泰勒公式；无穷远处的增长比较用洛必达法则。
