- id: p1
  tier: easy
  statement: |
    $f(x)=\sqrt x$在$[1,9]$上满足拉格朗日中值定理（mean value theorem）的条件。求定理中的$\xi$。
  answer:
    type: number
    value: 4
  hints:
    - |
      $\xi$满足$f'(\xi)=\frac{f(9)-f(1)}{9-1}$，并且$1<\xi<9$。
    - |
      $\frac{3-1}8=\frac14$，$f'(\xi)=\frac1{2\sqrt\xi}$。
    - |
      $\frac1{2\sqrt\xi}=\frac14$，$\sqrt\xi=2$，$\xi=4$。
  solution: |
    弦的斜率是$\frac{3-1}{9-1}=\frac14$，$f'(\xi)=\frac1{2\sqrt\xi}=\frac14$，所以$\sqrt\xi=2$，$\xi=4$，在$(1,9)$里。它不是区间的中点$5$。

- id: p2
  tier: easy
  statement: |
    $f(x)=x^3-4x$在$[-2,2]$上满足罗尔定理（Rolle's theorem）的条件。求出$(-2,2)$内所有满足$f'(\xi)=0$的$\xi$。
  answer:
    type: set
    value: [-2/sqrt(3), 2/sqrt(3)]
  hints:
    - |
      先验证$f(-2)=f(2)$，再解$f'(x)=0$。
    - |
      $f(\pm2)=0$；$f'(x)=3x^2-4$。
    - |
      $3x^2=4$，$\xi=\pm\frac2{\sqrt3}\approx\pm1.155$，都在$(-2,2)$里。
  solution: |
    $f(-2)=f(2)=0$，$f$是多项式，连续、可导。$f'(x)=3x^2-4=0$得$\xi=\pm\frac2{\sqrt3}$，两个都在$(-2,2)$里。

- id: p3
  tier: medium
  statement: |
    对$f(x)=\ln x$在$[1,e]$上用拉格朗日中值定理，求$\xi$。
  answer:
    type: number
    value: e - 1
  hints:
    - |
      $f'(\xi)=\frac{\ln e-\ln1}{e-1}$。
    - |
      $f'(x)=\frac1x$，弦的斜率是$\frac1{e-1}$。
    - |
      $\frac1\xi=\frac1{e-1}$，$\xi=e-1\approx1.718$。
  solution: |
    弦的斜率是$\frac{1-0}{e-1}=\frac1{e-1}$，而$f'(\xi)=\frac1\xi$，所以$\xi=e-1\approx1.718$，在$(1,e)$里。

- id: p4
  tier: medium
  statement: |
    $f$在$[0,2]$上可导，$f(0)=1$，并且对所有$x\in[0,2]$都有$|f'(x)|\le3$。$f(2)$最大可能是多少？最小可能是多少？依次填写。
  answer:
    type: tuple
    value: [7, -5]
  hints:
    - |
      由中值定理，$f(2)-f(0)=f'(\xi)\cdot2$。
    - |
      $|f'(\xi)|\le3$，所以$|f(2)-1|\le6$。还要找出真正取到这两个界的函数。
    - |
      $-5\le f(2)\le7$；$f(x)=1+3x$取到$7$，$f(x)=1-3x$取到$-5$。
  solution: |
    由中值定理，$f(2)-f(0)=2f'(\xi)$，$|f'(\xi)|\le3$，所以$-6\le f(2)-1\le6$，即$-5\le f(2)\le7$。这两个界都取得到：$f(x)=1+3x$和$f(x)=1-3x$满足条件，$f(2)$分别是$7$和$-5$。所以最大是$7$，最小是$-5$。

- id: p5
  tier: hard
  statement: |
    （1）证明：对所有实数$x$，$e^x\ge1+x$，等号只在$x=0$时成立。（2）设$0<a<b$，$n\ge2$是整数，证明$na^{n-1}(b-a)<b^n-a^n<nb^{n-1}(b-a)$。（3）由（1）证明：对每个正整数$n$，$\left(1+\frac1n\right)^n<e$。
  hints:
    - |
      （1）$x\ne0$时，对$e^t$在$0$和$x$之间用中值定理，分$x>0$、$x<0$两种情况。（2）对$t^n$在$[a,b]$上用中值定理。
    - |
      （1）$e^x-1=e^\xi x$，$\xi$在$0$和$x$之间。（3）在（1）里取$x=\frac1n$。
    - |
      （1）$x>0$时，$e^x-e^0=e^\xi x$，$0<\xi<x$，$e^\xi>1$，所以$e^x-1>x$。$x<0$时，$x<\xi<0$，$0<e^\xi<1$，而$x<0$，所以$e^\xi x>x$，同样$e^x-1>x$。$x=0$时等号成立。

      （2）$b^n-a^n=n\xi^{n-1}(b-a)$，$a<\xi<b$；$n\ge2$时$t^{n-1}$在$t>0$上严格递增，所以$a^{n-1}<\xi^{n-1}<b^{n-1}$，乘以$n(b-a)>0$即得。

      （3）由（1），$e^{1/n}>1+\frac1n>0$，两边$n$次方得$e>\left(1+\frac1n\right)^n$。这和[两个重要极限](lesson:math.calculus.special-limits)里$(1+\frac1n)^n$递增、趋于$e$对得上：数列从下面逼近$e$。
  reference: |
    （1）$e^x-1=e^\xi x$，按$x$的符号比较$e^\xi$和$1$。

    （2）$b^n-a^n=n\xi^{n-1}(b-a)$，$a<\xi<b$。

    （3）$e^{1/n}>1+\frac1n$，$n$次方。

- id: p6
  tier: hard
  statement: |
    （1）设$f$在$\R$上可导，$f'=f$，$f(0)=1$。证明$f(x)=e^x$。

    （2）设$f'=kf$（$k$是常数），证明$f(x)=f(0)e^{kx}$。

    （3）[导数的定义](lesson:math.calculus.derivative)第 6 题求出：满足$f(x+y)=f(x)+f(y)+2xy$、$f'(0)=1$的函数处处可导，$f(0)=0$，$f'(x)=1+2x$。证明这样的函数只有$f(x)=x^2+x$一个。
  hints:
    - |
      （1）考虑$g(x)=\frac{f(x)}{e^x}$，求它的导数。（3）用推论 2。
    - |
      （1）$g'=\frac{f'e^x-fe^x}{e^{2x}}=0$。（2）考虑$f(x)e^{-kx}$，它的导数要用[链式法则](lesson:math.calculus.chain-rule)（chain rule）。
    - |
      （1）$g(x)=\frac{f(x)}{e^x}$，由商法则（quotient rule）$g'=\frac{(f'-f)e^x}{e^{2x}}=0$；$\R$是区间，由推论 1，$g$是常数，$g(x)=g(0)=1$，所以$f=e^x$。

      （2）$h(x)=f(x)e^{-kx}$，$h'=f'e^{-kx}-kfe^{-kx}=(f'-kf)e^{-kx}=0$，$h$是常数$h(0)=f(0)$，所以$f(x)=f(0)e^{kx}$。

      （3）$f$和$x^2+x$的导数都是$1+2x$，由推论 2，$f(x)=x^2+x+C$；代入$f(0)=0$得$C=0$。
  reference: |
    （1）$\frac{f}{e^x}$导数为零，在$\R$上为常数 1。

    （2）$fe^{-kx}$导数为零。

    （3）推论 2 加$f(0)=0$。这补上了导数的定义第 6 题（3）留下的唯一性。

- id: p7
  tier: thinking
  statement: |
    高速公路的「区间测速」：一辆车$9{:}00$经过第一个测速点，$9{:}06$经过$10\,\mathrm{km}$外的第二个测速点，限速$90\,\mathrm{km/h}$。

    （1）车主说「我每次被拍到时都没超速」，为什么照样能判他超速？用中值定理说明。

    （2）这里用到了中值定理的哪些条件，现实中它们成立吗？

    （3）中值定理能不能告诉你他是在哪一刻超速的？
  hints:
    - |
      （1）算平均速度。（2）位置是时间的函数，它连续吗？可导吗？
    - |
      （1）$\frac{10\,\mathrm{km}}{0.1\,\mathrm h}=100\,\mathrm{km/h}$。（3）定理只说$\xi$存在。
    - |
      （1）平均速度是$100\,\mathrm{km/h}$。把位置看成时间的函数$s(t)$，由中值定理，有某一时刻$\xi$，瞬时速度$s'(\xi)$正好等于$100\,\mathrm{km/h}>90\,\mathrm{km/h}$。两次被拍到时没超速，不妨碍中间某一刻超速。

      （2）要$s(t)$在$[9{:}00,9{:}06]$上连续、在中间可导：车不会瞬移，位置连续变化；速度表有读数，就是位置可导。这在现实里都成立。

      （3）不能。定理只保证这样的时刻存在，不说在哪里，可能有好几个；但「至少有一刻超速」就足够了。
  reference: |
    （1）平均速度 100，中值定理给出某时刻瞬时速度 100。

    （2）位置连续、可导，现实成立。

    （3）只给存在性。

- id: p8
  tier: thinking
  statement: |
    （1）中值定理要求$f$在闭区间$[a,b]$上连续，却只要求在开区间$(a,b)$内可导。为什么端点处不要求可导？用$f(x)=\sqrt{1-x^2}$在$[-1,1]$上说明。

    （2）由中值定理说明：如果在区间上处处$f'(x)>0$，那么$f$在这个区间上严格递增。

    （3）反过来，$f$严格递增，能推出$f'(x)>0$吗？
  hints:
    - |
      （1）证明里用到端点处的什么？罗尔定理里最值点在内部。（2）任取$x_1<x_2$，看$f(x_2)-f(x_1)$的符号。
    - |
      （3）看$x^3$在$0$处。
    - |
      （1）证明只用到$f$在内部的极值点处可导，端点只用到连续（保证最值存在、$\varphi(a)=\varphi(b)$）。$\sqrt{1-x^2}$在$\pm1$处切线竖直、不可导，可它在$[-1,1]$上连续、在$(-1,1)$内可导，两端都是$0$，罗尔定理照样给出$\xi=0$。

      （2）$x_1<x_2$时$f(x_2)-f(x_1)=f'(\xi)(x_2-x_1)>0$，所以严格递增。这就是以后[单调性与极值的判别](lesson:math.calculus.monotonicity)的出发点。

      （3）不能。$x^3$严格递增，可$f'(0)=0$。严格递增只能推出$f'\ge0$。
  reference: |
    （1）端点只需连续；$\sqrt{1-x^2}$为例。

    （2）$f(x_2)-f(x_1)=f'(\xi)(x_2-x_1)>0$。

    （3）否，$x^3$。
