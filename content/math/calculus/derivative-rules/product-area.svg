<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-size="14">
  <!-- 长方形边长 u = 220、v = 150 像素，增量 Δu = 64、Δv = 46 像素；左下角在 (80, 240) -->
  <rect x="80" y="90" width="220" height="150" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <rect x="300" y="90" width="64" height="150" style="fill: var(--accent, #2563eb)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.3"/>
  <rect x="80" y="44" width="220" height="46" style="fill: var(--good, #059669)" fill-opacity="0.2" stroke="currentColor" stroke-width="1.3"/>
  <rect x="300" y="44" width="64" height="46" style="fill: var(--accent, #2563eb)" fill-opacity="0.4" stroke="currentColor" stroke-width="1.3"/>
  <text x="190" y="170" font-size="15" text-anchor="middle" fill="currentColor" ><tspan font-style="italic">u</tspan><tspan font-style="italic">v</tspan></text>
  <text x="332" y="170" font-size="13" text-anchor="middle" fill="currentColor" ><tspan font-style="italic">v</tspan>Δ<tspan font-style="italic">u</tspan></text>
  <text x="190" y="72" font-size="13" text-anchor="middle" fill="currentColor" ><tspan font-style="italic">u</tspan>Δ<tspan font-style="italic">v</tspan></text>
  <text x="332" y="72" font-size="13" text-anchor="middle" fill="currentColor" >Δ<tspan font-style="italic">u</tspan>Δ<tspan font-style="italic">v</tspan></text>
  <text x="190" y="260" font-size="13" text-anchor="middle" fill="currentColor" ><tspan font-style="italic">u</tspan></text>
  <text x="332" y="260" font-size="13" text-anchor="middle" fill="currentColor" >Δ<tspan font-style="italic">u</tspan></text>
  <text x="70" y="170" font-size="13" text-anchor="end" fill="currentColor" ><tspan font-style="italic">v</tspan></text>
  <text x="70" y="72" font-size="13" text-anchor="end" fill="currentColor" >Δ<tspan font-style="italic">v</tspan></text>
  <text x="80" y="292" font-size="13" text-anchor="start" fill="currentColor" >面积从 <tspan font-style="italic">u</tspan><tspan font-style="italic">v</tspan> 变成 (<tspan font-style="italic">u</tspan> + Δ<tspan font-style="italic">u</tspan>)(<tspan font-style="italic">v</tspan> + Δ<tspan font-style="italic">v</tspan>)，增量是 <tspan font-style="italic">v</tspan>Δ<tspan font-style="italic">u</tspan> + <tspan font-style="italic">u</tspan>Δ<tspan font-style="italic">v</tspan> + Δ<tspan font-style="italic">u</tspan>Δ<tspan font-style="italic">v</tspan></text>
  <text x="80" y="314" font-size="13" text-anchor="start" fill="currentColor" >Δ<tspan font-style="italic">x</tspan> → 0 时，角上的小块 Δ<tspan font-style="italic">u</tspan>Δ<tspan font-style="italic">v</tspan> 比两条长条小得多</text>
</svg>
