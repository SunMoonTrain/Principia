- id: p1
  tier: easy
  statement: |
    $f(x)=2x^4-3x^2+5x-7$，求$f'(1)$。
  answer:
    type: number
    value: 7
  hints:
    - |
      多项式逐项求导，每一项用幂法则。
    - |
      $f'(x)=8x^3-6x+5$。
    - |
      $f'(1)=8-6+5=7$。
  solution: |
    $f'(x)=2\cdot4x^3-3\cdot2x+5=8x^3-6x+5$，$f'(1)=7$。

- id: p2
  tier: easy
  statement: |
    $f(x)=\frac{x+1}{x-1}$，求$f'(5)$。
  answer:
    type: number
    value: -1/8
  hints:
    - |
      用商法则，$u=x+1$，$v=x-1$，$u'=v'=1$。
    - |
      $f'(x)=\frac{1\cdot(x-1)-(x+1)\cdot1}{(x-1)^2}=\frac{-2}{(x-1)^2}$。
    - |
      $f'(5)=\frac{-2}{16}=-\frac18$。
  solution: |
    由商法则，$f'(x)=\frac{(x-1)-(x+1)}{(x-1)^2}=-\frac{2}{(x-1)^2}$，所以$f'(5)=-\frac2{16}=-\frac18$。

- id: p3
  tier: medium
  statement: |
    已知$u(2)=3$，$u'(2)=-1$，$v(2)=4$，$v'(2)=5$。求$(uv)'(2)$和$\left(\frac uv\right)'(2)$，依次填写。
  answer:
    type: tuple
    value: [11, -19/16]
  hints:
    - |
      乘积法则$(uv)'=u'v+uv'$，商法则$\left(\frac uv\right)'=\frac{u'v-uv'}{v^2}$，都在$x=2$处代值。
    - |
      $(uv)'(2)=(-1)\cdot4+3\cdot5$；$\left(\frac uv\right)'(2)=\frac{(-1)\cdot4-3\cdot5}{4^2}$。
    - |
      $(uv)'(2)=-4+15=11$，$\left(\frac uv\right)'(2)=\frac{-4-15}{16}=-\frac{19}{16}$。
  solution: |
    $(uv)'(2)=u'(2)v(2)+u(2)v'(2)=-4+15=11$。$\left(\frac uv\right)'(2)=\frac{u'(2)v(2)-u(2)v'(2)}{v(2)^2}=\frac{-4-15}{16}=-\frac{19}{16}$。

- id: p4
  tier: medium
  statement: |
    曲线$y=x^3-2x^2+x$上，哪些点处的切线平行于直线$y=x$？填出这些点的横坐标。
  answer:
    type: set
    value: [0, 4/3]
  hints:
    - |
      切线平行于$y=x$，就是切线的斜率等于$1$，即$y'=1$。
    - |
      $y'=3x^2-4x+1$，解$3x^2-4x+1=1$。
    - |
      $3x^2-4x=0$，$x=0$或$x=\frac43$。
  solution: |
    $y'=3x^2-4x+1$。切线平行于$y=x$要求$y'=1$，即$3x^2-4x=x(3x-4)=0$，所以$x=0$或$x=\frac43$。

- id: p5
  tier: hard
  statement: |
    （1）由乘积法则证明：$u$、$v$、$w$都可导时，$(uvw)'=u'vw+uv'w+uvw'$。（2）用乘积法则和数学归纳法，重新证明$n$是正整数时$(x^n)'=nx^{n-1}$。（3）猜出$n$个可导函数乘积的求导公式。
  hints:
    - |
      （1）把$uvw$看成$(uv)\cdot w$，用两次乘积法则。
    - |
      （2）$x^{n+1}=x^n\cdot x$，假设$(x^n)'=nx^{n-1}$，用乘积法则算$(x^{n+1})'$。
    - |
      （1）$(uvw)'=(uv)'w+(uv)w'=(u'v+uv')w+uvw'=u'vw+uv'w+uvw'$。

      （2）$n=1$时$(x)'=1$成立。设$(x^n)'=nx^{n-1}$，则$(x^{n+1})'=(x^n)'x+x^n\cdot1=nx^n+x^n=(n+1)x^n$，对$n+1$也成立。

      （3）$(u_1u_2\cdots u_n)'=u_1'u_2\cdots u_n+u_1u_2'\cdots u_n+\cdots+u_1u_2\cdots u_n'$：每次只对一个因子求导，其余不动，再把$n$项加起来。
  reference: |
    （1）$(uvw)'=[(uv)w]'=(uv)'w+uvw'=(u'v+uv')w+uvw'$。

    （2）归纳：$n=1$成立；若$(x^n)'=nx^{n-1}$，则$(x^{n+1})'=(x^n\cdot x)'=nx^{n-1}\cdot x+x^n=(n+1)x^n$。

    （3）$(u_1\cdots u_n)'=\sum_{k=1}^nu_1\cdots u_{k-1}u_k'u_{k+1}\cdots u_n$，同样可以由$(u_1\cdots u_{n-1})\cdot u_n$归纳证明。所有$u_k$都等于$x$时，正好得到$n$项$x^{n-1}$，就是（2）。

- id: p6
  tier: hard
  statement: |
    $f(x)=x(x-1)(x-2)\cdots(x-100)$。求$f'(0)$和$f'(1)$，并说明理由。
  hints:
    - |
      把$f$写成$x\cdot g(x)$，$g(x)=(x-1)(x-2)\cdots(x-100)$，用乘积法则，再代入$x=0$。
    - |
      $f'(x)=g(x)+xg'(x)$，$x=0$时第二项为$0$，所以$f'(0)=g(0)$。求$f'(1)$时，把因子$x-1$单独提出来，做法一样。
    - |
      $f'(0)=g(0)=(-1)(-2)\cdots(-100)=100!$（$100$个负号，乘积为正）。

      写$f=(x-1)k(x)$，$k(x)=x(x-2)(x-3)\cdots(x-100)$，$f'(x)=k(x)+(x-1)k'(x)$，所以$f'(1)=k(1)=1\cdot(-1)(-2)\cdots(-99)=-99!$（$99$个负号）。
  reference: |
    $f=x\,g(x)$，$f'=g+xg'$，$f'(0)=g(0)=\prod_{k=1}^{100}(-k)=(-1)^{100}100!=100!$。

    $f=(x-1)k(x)$，$f'=k+(x-1)k'$，$f'(1)=k(1)=1\cdot\prod_{j=2}^{100}(1-j)=\prod_{m=1}^{99}(-m)=(-1)^{99}99!=-99!$。

    要点：在$f$的一个零点$r$处求导，只有「对因子$x-r$求导」的那一项留下，别的项都带着因子$x-r$，代入$r$后为零。展开$f$再逐项求导会是一场灾难。

- id: p7
  tier: thinking
  statement: |
    有人这样「推导」商法则：设$q=\frac uv$，则$u=qv$；两边求导，$u'=q'v+qv'$，解出$q'=\frac{u'-qv'}{v}=\frac{u'v-uv'}{v^2}$。（1）这个推导默认了什么？（2）讲解里的推导是怎样避开这个问题的？（3）推导哪一步用到了$v\ne0$？
  hints:
    - |
      （1）对$qv$用乘积法则，要先知道$q$怎样？
    - |
      （2）讲解先从定义算出$\frac1v$的导数，再用乘积法则，乘积法则只用到了已知可导的$u$和$\frac1v$。
    - |
      （1）默认了$q=\frac uv$可导，否则不能对$qv$用乘积法则。结论对，但这样只说明了「如果$q$可导，导数一定是这个式子」，没有证明$q$可导。

      （2）讲解直接用定义算出$\frac1v$的差商的极限，证明了$\frac1v$可导；$\frac uv=u\cdot\frac1v$是两个可导函数的乘积，乘积法则保证它可导。

      （3）解出$q'$时除以$v$；讲解里$\frac1v$的差商要除以$v(x+h)v(x)$，由$v(x)\ne0$和$v$的连续性，$x+h$离$x$足够近时$v(x+h)\ne0$。
  reference: |
    （1）用乘积法则对$qv$求导，前提是$q$、$v$都可导；$q$可导正是要证的一部分，推导循环了。它能告诉我们：一旦知道$q$可导，导数只能是$\frac{u'v-uv'}{v^2}$。

    （2）讲解先由定义证明$\frac1v$可导、导数是$-\frac{v'}{v^2}$，再对$u\cdot\frac1v$用乘积法则，每一步用到的函数都已知可导。

    （3）上面的推导在「除以$v$」时用到；讲解里在$\frac1{v(x+h)v(x)}$处用到，并且要用$v$的连续性保证$x$附近$v\ne0$。这类「先假设可导、再求导」的写法以后在隐函数求导时还会见到，那时可导性由别的定理保证。

- id: p8
  tier: thinking
  statement: |
    （1）多项式求导以后次数降低$1$。有理函数（两个多项式之比）求导以后还是有理函数吗？（2）有没有不是多项式的有理函数，它的导数却是多项式？
  hints:
    - |
      （1）用商法则，看分子、分母是什么样的式子。
    - |
      （2）设$f=\frac PQ$已约到最简，$Q(r)=0$。写$Q=(x-r)^mR$，$R(r)\ne0$，用商法则算$f'$，看$x\to r$时$f'$怎样。
    - |
      （1）是：$\left(\frac PQ\right)'=\frac{P'Q-PQ'}{Q^2}$，分子、分母都是多项式，定义域和$f$一样。

      （2）没有。把$Q=(x-r)^mR$代入化简，得$f'=\frac{(x-r)(P'R-PR')-mPR}{(x-r)^{m+1}R^2}$。$x=r$时分子是$-mP(r)R(r)\ne0$，所以$x\to r$时$f'$是无穷大；而多项式在$r$附近有界，$f'$不可能是多项式。
  reference: |
    （1）$\left(\frac PQ\right)'=\frac{P'Q-PQ'}{Q^2}$，仍是有理函数。分母变成$Q^2$，所以分母为零的点不会消失。

    （2）没有。设$f=\frac PQ$最简、不是多项式，于是$Q$有零点$r$，$P(r)\ne0$。写$Q=(x-r)^mR$（$m\ge1$，$R(r)\ne0$），$Q'=(x-r)^{m-1}[mR+(x-r)R']$，代入商法则：$f'=\frac{(x-r)^{m-1}[(x-r)(P'R-PR')-mPR]}{(x-r)^{2m}R^2}=\frac{(x-r)(P'R-PR')-mPR}{(x-r)^{m+1}R^2}$。

    $x=r$处分子等于$-mP(r)R(r)\ne0$，分母为零，$f'$在$r$处是无穷大，在$r$附近无界，而多项式在$r$附近有界。所以$f'$不是多项式：「分母为零」的点求导以后还在，而且「更陡」了，$m$阶变成$m+1$阶。
