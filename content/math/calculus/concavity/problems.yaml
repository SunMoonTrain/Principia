- id: p1
  tier: easy
  statement: |
    求曲线$y=x^3-6x^2+9x+2$的拐点（inflection point）。
  answer:
    type: tuple
    value: [2, 4]
  hints:
    - |
      求二阶导数（second derivative），看它在哪里变号。
    - |
      $y'=3x^2-12x+9$，$y''=6x-12$。
    - |
      $y''$在$x=2$处由负变正，拐点的纵坐标是$y(2)$。
  solution: |
    $y''=6x-12$，在$x<2$时为负、$x>2$时为正，所以曲线在$(-\infty,2]$上凹、在$[2,+\infty)$上凸。拐点是$\bigl(2,y(2)\bigr)=(2,4)$。

- id: p2
  tier: easy
  statement: |
    用二阶导数判别法（second derivative test）求$f(x)=x^3-3x^2-9x+1$的极大值。
  answer:
    type: number
    value: 6
  hints:
    - |
      先求驻点：解$f'(x)=0$。
    - |
      $f'(x)=3x^2-6x-9=3(x-3)(x+1)$，驻点是$-1$和$3$；$f''(x)=6x-6$。
    - |
      $f''(-1)=-12<0$，所以$-1$是极大值点。
  solution: |
    驻点是$-1$和$3$。$f''(-1)=-12<0$，$f(-1)=-1-3+9+1=6$是极大值；$f''(3)=12>0$，$f(3)=-26$是极小值。

- id: p3
  tier: medium
  statement: |
    点$(1,3)$是曲线$y=ax^3+bx^2$的拐点。求$(a,b)$。
  answer:
    type: tuple
    value: [-3/2, 9/2]
  hints:
    - |
      两个条件：点在曲线上；$y''$在$x=1$处为$0$。
    - |
      $y''=6ax+2b$，所以$6a+2b=0$；又$a+b=3$。
    - |
      解得$a=-\frac32$，$b=\frac92$。再验证$y''$在$x=1$两侧变号。
  solution: |
    由$y(1)=a+b=3$和$y''(1)=6a+2b=0$，解得$a=-\frac32$，$b=\frac92$。这时$y''=-9x+9$，在$x=1$两侧由正变负，$(1,3)$确实是拐点。

- id: p4
  tier: medium
  statement: |
    下面哪些函数在$(0,+\infty)$上是凸函数（convex function）？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $e^{-x}$
      - |
        $\ln x$
      - |
        $x\ln x$
      - |
        $\sin x$
    value: [1, 3]
  hints:
    - |
      逐个求二阶导数，看它在$(0,+\infty)$上是不是处处$\ge0$。
    - |
      $(e^{-x})''=e^{-x}$；$(\ln x)''=-\frac1{x^2}$；$(x\ln x)'=\ln x+1$。
    - |
      $(x\ln x)''=\frac1x>0$；$(\sin x)''=-\sin x$在$(0,\pi)$内为负。
  solution: |
    A、C：$e^{-x}$和$x\ln x$的二阶导数$e^{-x}$、$\frac1x$在$(0,+\infty)$上处处为正，都是严格凸的。B 不对：$\ln x$的二阶导数$-\frac1{x^2}<0$，是凹的。D 不对：$\sin x$在$(0,\pi)$上凹、在$(\pi,2\pi)$上凸，在整个$(0,+\infty)$上不是凸函数。

- id: p5
  tier: hard
  statement: |
    （1）设$f$在区间$I$上凸，$x_1$、$x_2\in I$。说明$f\bigl(\frac{x_1+x_2}2\bigr)\le\frac{f(x_1)+f(x_2)}2$，并说出它的几何意思。

    （2）用$\ln x$的凹凸性证明：$a$、$b>0$时$\frac{a+b}2\ge\sqrt{ab}$。
  hints:
    - |
      （1）在凸函数的定义里取$x$为$x_1$、$x_2$的中点。（2）$\ln x$在$(0,+\infty)$上凹，不等号反过来。
    - |
      （1）弦在中点处的高度是$\frac{f(x_1)+f(x_2)}2$。（2）$\ln\frac{a+b}2\ge\frac{\ln a+\ln b}2=\ln\sqrt{ab}$。
    - |
      （1）$x_1=x_2$时两边相等。$x_1<x_2$时，取$x=\frac{x_1+x_2}2$，定义里的右边等于$f(x_1)+\frac{f(x_2)-f(x_1)}2=\frac{f(x_1)+f(x_2)}2$，所以不等式成立；$x_1>x_2$时交换两点。几何上，弦的中点不低于曲线上横坐标相同的点。

      （2）$(\ln x)''=-\frac1{x^2}<0$，$\ln x$在$(0,+\infty)$上凹，（1）里的不等号反过来：$\ln\frac{a+b}2\ge\frac{\ln a+\ln b}2=\ln\sqrt{ab}$。$\ln x$严格递增，所以$\frac{a+b}2\ge\sqrt{ab}$。
  reference: |
    （1）定义中取中点；弦的中点在曲线上方。

    （2）$\ln$凹，$\ln\frac{a+b}2\ge\ln\sqrt{ab}$，再用$\ln$递增。

- id: p6
  tier: hard
  statement: |
    设$f$在区间$I$上二阶可导，并且$f''\ge0$。

    （1）证明：曲线$y=f(x)$在每一点的切线（tangent line）都不高于曲线，即对$I$里的$x_0$、$x$，$f(x)\ge f(x_0)+f'(x_0)(x-x_0)$。

    （2）由此证明：对所有$x$，$e^x\ge1+x$；对所有$x>0$，$\ln x\le x-1$。
  hints:
    - |
      （1）令$g(x)=f(x)-f(x_0)-f'(x_0)(x-x_0)$，它在$x_0$处等于$0$，看$g$的单调性。
    - |
      （1）$g'(x)=f'(x)-f'(x_0)$。$f''\ge0$，所以$f'$递增。（2）分别取$f=e^x$、$x_0=0$和$f=\ln x$（凹，不等号反过来）、$x_0=1$。
    - |
      （1）$f'$递增，$x<x_0$时$g'(x)\le0$，$x>x_0$时$g'(x)\ge0$，所以$g$在$x_0$左侧递减、右侧递增，$g(x)\ge g(x_0)=0$。

      （2）$e^x$凸，在$0$处的切线是$y=1+x$，所以$e^x\ge1+x$。$\ln x$凹，对$-\ln x$用（1）：$\ln x$在$1$处的切线是$y=x-1$，曲线不高于它，即$\ln x\le x-1$。
  reference: |
    （1）$g(x_0)=0$，$g'=f'(x)-f'(x_0)$在$x_0$左负右正（不严格），$g\ge0$。

    （2）$e^x$在$0$处、$\ln x$在$1$处的切线。

- id: p7
  tier: thinking
  statement: |
    $s(t)$是一辆车沿直线行驶的位置。

    （1）$s''>0$说的是什么？位置图像向上弯，和「越开越快」是一回事吗？

    （2）车往回开、速度为负时，$s''>0$又说明什么？

    （3）位置图像的拐点，在运动上对应什么时刻？
  hints:
    - |
      $s'$是速度，$s''$是加速度（见[高阶导数](lesson:math.calculus.higher-derivatives)）。
    - |
      $s''>0$说明速度$s'$在增加；速度为负时，「增加」意味着绝对值变小。
    - |
      （1）$s''>0$，速度在增大，图像凸，切线越来越陡。车往前开、速度为正时，这就是越开越快；可「速度增大」和「越开越快」不总是一回事。

      （2）速度为负、$s''>0$时，速度从比如$-5$增大到$-3$，车往回开得越来越慢，快要停下或掉头。

      （3）拐点处加速度变号，速度在那一刻取极值：从加速变成减速（或反过来），那一刻速度最大（或最小）。
  reference: |
    （1）速度增大；速度为正时才是越开越快。

    （2）往回开得越来越慢。

    （3）加速度变号、速度取极值的时刻。

- id: p8
  tier: thinking
  statement: |
    二阶导数判别法在$f'(x_0)=f''(x_0)=0$时失效。

    （1）看$x^3$、$x^4$、$-x^4$、$x^5$在$0$处：各自第一个不为$0$的导数是几阶的，$0$是不是极值点？

    （2）猜一个规律：$f'(x_0)=\cdots=f^{(k-1)}(x_0)=0$、$f^{(k)}(x_0)\ne0$时，$k$是偶数、奇数各会怎样？

    （3）这个规律和二阶导数判别法、和「驻点不一定是极值点」有什么关系？
  hints:
    - |
      （1）$x^n$在$0$处的前$n-1$阶导数都是$0$，第$n$阶导数是$n!$。
    - |
      （1）$x^4$、$-x^4$的$0$分别是极小值点、极大值点，$x^3$、$x^5$的$0$不是极值点。
    - |
      （1）$x^3$：第$3$阶，不是极值点；$x^4$：第$4$阶，导数为正，极小值点；$-x^4$：第$4$阶，导数为负，极大值点；$x^5$：第$5$阶，不是极值点。

      （2）$k$是偶数时，$x_0$是极值点：$f^{(k)}(x_0)>0$是极小值点，$<0$是极大值点；$k$是奇数时不是极值点。以后的泰勒公式（Taylor's formula，见[泰勒公式](lesson:math.calculus.taylor-polynomial)）会说明原因：$x_0$附近$f(x)-f(x_0)$的主要部分是$\frac{f^{(k)}(x_0)}{k!}(x-x_0)^k$，偶次幂不变号，奇次幂在$x_0$两侧变号。

      （3）$k=2$就是二阶导数判别法；$k$是奇数的驻点，正是「驻点不是极值点」的情形，$x^3$就是$k=3$。
  reference: |
    （1）$3$、$4$、$4$、$5$阶；只有$x^4$、$-x^4$的$0$是极值点。

    （2）偶数阶是极值点（正为极小，负为极大），奇数阶不是。

    （3）$k=2$即二阶导数判别法；奇数阶的驻点不是极值点。
