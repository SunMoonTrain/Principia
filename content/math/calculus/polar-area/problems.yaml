- id: p1
  tier: easy
  statement: |
    极坐标（polar coordinates）为$\bigl(2,\frac{2\pi}3\bigr)$的点，直角坐标是多少？依次填$x$、$y$。
  answer:
    type: tuple
    value: [-1, sqrt(3)]
  hints:
    - |
      $x=r\cos\theta$，$y=r\sin\theta$。
    - |
      $\cos\frac{2\pi}3=-\frac12$，$\sin\frac{2\pi}3=\frac{\sqrt3}2$。
    - |
      $x=2\cdot\Bigl(-\frac12\Bigr)$，$y=2\cdot\frac{\sqrt3}2$。
  solution: |
    $x=2\cos\frac{2\pi}3=-1$，$y=2\sin\frac{2\pi}3=\sqrt3$，点在第二象限。

- id: p2
  tier: easy
  statement: |
    阿基米德螺线$r=\theta$从$\theta=0$转到$\theta=\pi$，和极轴的反向延长线围成一块图形。求它的面积。
  answer:
    type: number
    value: pi^3/6
  hints:
    - |
      图形由曲线$r=\theta$和射线$\theta=0$、$\theta=\pi$围成。
    - |
      $A=\frac12\int_0^\pi\theta^2\,\dd\theta$。
    - |
      $\int_0^\pi\theta^2\,\dd\theta=\frac{\pi^3}3$。
  solution: |
    $A=\frac12\int_0^\pi\theta^2\,\dd\theta=\frac{\pi^3}6\approx5.17$。

- id: p3
  tier: medium
  statement: |
    四叶玫瑰线$r=\cos2\theta$的一片叶子对应$-\frac\pi4\le\theta\le\frac\pi4$。求一片叶子的面积。
  answer:
    type: number
    value: pi/8
  hints:
    - |
      $A=\frac12\int_{-\pi/4}^{\pi/4}\cos^22\theta\,\dd\theta$。
    - |
      $\cos^22\theta=\frac{1+\cos4\theta}2$。
    - |
      $\bigl(\frac{\sin4\theta}4\bigr)'=\cos4\theta$，所以$\cos4\theta$在$\bigl[-\frac\pi4,\frac\pi4\bigr]$上积分是$0$。
  solution: |
    $A=\frac12\int_{-\pi/4}^{\pi/4}\frac{1+\cos4\theta}2\,\dd\theta=\frac14\cdot\frac\pi2$，即$\frac\pi8\approx0.393$。

- id: p4
  tier: medium
  statement: |
    求在圆$r=1$里面、在心形线$r=1-\cos\theta$外面的那部分面积。
  answer:
    type: number
    value: 2 - pi/4
  hints:
    - |
      先求交点：$1=1-\cos\theta$。
    - |
      $\cos\theta=0$，$\theta=\pm\frac\pi2$；$-\frac\pi2<\theta<\frac\pi2$时$1-\cos\theta<1$，圆在外面。
    - |
      $A=\frac12\int_{-\pi/2}^{\pi/2}\bigl[1-(1-\cos\theta)^2\bigr]\dd\theta=\frac12\int_{-\pi/2}^{\pi/2}\bigl(2\cos\theta-\cos^2\theta\bigr)\dd\theta$。
  solution: |
    $\int_{-\pi/2}^{\pi/2}2\cos\theta\,\dd\theta=4$；$\int_{-\pi/2}^{\pi/2}\cos^2\theta\,\dd\theta=\int_{-\pi/2}^{\pi/2}\frac{1+\cos2\theta}2\,\dd\theta$，由$\bigl(\frac{\sin2\theta}2\bigr)'=\cos2\theta$，它等于$\frac\pi2$。所以$A=\frac12\Bigl(4-\frac\pi2\Bigr)=2-\frac\pi4\approx1.215$。

- id: p5
  tier: hard
  statement: |
    质点在平面上运动，极坐标是$r(t)$、$\theta(t)$，$\theta$随时间增加。记$A(t)$为从时刻$0$到$t$，质点和极点的连线扫过的面积。

    （1）证明$A'(t)=\frac12r^2\theta'(t)$。

    （2）设$r^2\theta'(t)$是常数$h$，质点沿一条闭合曲线绕极点一周用时$T$，曲线围成的面积是$S$。证明$T=\frac{2S}h$。
  hints:
    - |
      （1）$A(t)=\frac12\int_{\theta(0)}^{\theta(t)}r^2\,\dd\theta$，这里把$r$看成$\theta$的函数。
    - |
      （1）变上限积分（integral with variable upper limit）配上链式法则（chain rule）。（2）在$[0,T]$上积分$A'(t)$。
    - |
      （1）设$\Phi(u)=\frac12\int_{\theta(0)}^ur^2\,\dd\theta$，由微积分基本定理（fundamental theorem of calculus），$\Phi'(u)=\frac12r^2$；$A(t)=\Phi(\theta(t))$，所以$A'(t)=\frac12r^2\theta'(t)$。

      （2）$A'(t)=\frac h2$，一周扫过的面积$S=A(T)=\frac h2T$，所以$T=\frac{2S}h$。
  reference: |
    （1）$A(t)=\Phi(\theta(t))$，$\Phi'=\frac12r^2$，再用链式法则。

    （2）$S=\frac h2T$。这正是开普勒第二定律（Kepler's second law）：扫过面积的快慢不变。

- id: p6
  tier: hard
  statement: |
    双纽线的极坐标方程是$r^2=2a^2\cos2\theta$（$a>0$）。

    （1）把它化成直角坐标方程。

    （2）$\theta$在什么范围里曲线有定义？求它围成的总面积。
  hints:
    - |
      （1）$\cos2\theta=\cos^2\theta-\sin^2\theta$，两边乘以$r^2$。
    - |
      （2）要$\cos2\theta\ge0$。右边一圈是$-\frac\pi4\le\theta\le\frac\pi4$，左边一圈是$\frac{3\pi}4\le\theta\le\frac{5\pi}4$，两圈一样大。
    - |
      （1）$r^4=2a^2\bigl(r^2\cos^2\theta-r^2\sin^2\theta\bigr)$，即$\bigl(x^2+y^2\bigr)^2=2a^2\bigl(x^2-y^2\bigr)$。

      （2）右边一圈的面积是$\frac12\int_{-\pi/4}^{\pi/4}2a^2\cos2\theta\,\dd\theta=a^2\cdot\frac{\sin2\theta}2\Big|_{-\pi/4}^{\pi/4}=a^2$（求导验证$\bigl(\frac{\sin2\theta}2\bigr)'=\cos2\theta$），两圈共$2a^2$。
  reference: |
    （1）$\bigl(x^2+y^2\bigr)^2=2a^2\bigl(x^2-y^2\bigr)$。

    （2）$\cos2\theta\ge0$；总面积$2a^2$。

- id: p7
  tier: thinking
  statement: |
    （1）有的书允许$r$取负值，规定$(r,\theta)$和$(-r,\theta+\pi)$是同一个点。照这个规定，$r=2a\cos\theta$在$\frac\pi2<\theta<\frac{3\pi}2$上画出的是哪一部分？

    （2）由此解释常见误区里的$2\pi a^2$。

    （3）用面积公式时，$\theta$的范围该怎样选？
  hints:
    - |
      （1）$\theta=\pi$时$r=-2a$，对应哪个点？
    - |
      （1）把$(r,\theta)$换成$(-r,\theta+\pi)$，再看$\theta+\pi$的范围。
    - |
      （1）$\theta=\pi$时$(-2a,\pi)$就是$(2a,0)$。一般地，$\frac\pi2<\theta<\frac{3\pi}2$时这些点和$\theta-\pi\in\bigl(-\frac\pi2,\frac\pi2\bigr)$画出的点相同，又把整个圆画了一遍。

      （2）公式里是$r^2$，负的$r$也贡献正的面积，所以从$0$积到$2\pi$，得到的是圆面积的$2$倍。

      （3）选$\theta$的范围，使$r\ge0$，并且曲线围成的图形正好被扫过一遍。
  reference: |
    （1）又画了一遍整个圆。

    （2）$r^2$不管正负，圆被算了两遍。

    （3）$r\ge0$，图形只扫过一遍。

- id: p8
  tier: thinking
  statement: |
    （1）用三角形面积说明：圆心角为$\dd\theta$、半径为$r$的细扇形，面积约为$\frac12r^2\,\dd\theta$。

    （2）$r(\theta)$在$[\theta,\theta+\dd\theta]$上变化时，为什么用$\frac12r(\theta)^2\,\dd\theta$作微元（differential element）仍然可以？

    （3）圆$x^2+y^2\le a^2$用直角坐标求面积要积$\sqrt{a^2-x^2}$，用极坐标呢？哪个省事？
  hints:
    - |
      （1）两条半径夹的三角形，底约为弧长$r\,\dd\theta$。
    - |
      （2）这一片夹在两个扇形之间，半径是$r$在这一小段上的最小值和最大值。
    - |
      （1）三角形的两边是$r$、$r$，夹角$\dd\theta$，面积$\frac12r^2\sin\dd\theta$，和$\frac12r^2\,\dd\theta$之比趋于$1$。

      （2）设$r$在这一小段上的最小值、最大值是$m$、$M$，这一片的面积在$\frac12m^2\,\dd\theta$和$\frac12M^2\,\dd\theta$之间；$r$连续，$m$、$M$都趋于$r(\theta)$，误差和$\dd\theta$相比趋于$0$。

      （3）极坐标下$r=a$是常数，$A=\frac12\int_0^{2\pi}a^2\,\dd\theta=\pi a^2$，一步算完；直角坐标要用到半圆面积或三角代换。
  reference: |
    （1）$\frac12r^2\sin\dd\theta\approx\frac12r^2\,\dd\theta$。

    （2）夹在半径为最小值、最大值的两个扇形之间。

    （3）极坐标一步得$\pi a^2$。
