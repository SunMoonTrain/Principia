- id: p1
  tier: easy
  statement: |
    $f(x)=2x^3-3x^2-12x+5$的严格递减区间是$[a,b]$。求$(a,b)$。
  answer:
    type: tuple
    value: [-1, 2]
  hints:
    - |
      求导数（derivative），看它在哪里为负。
    - |
      $f'(x)=6x^2-6x-12=6(x-2)(x+1)$。
    - |
      $-1<x<2$时$f'(x)<0$，两边$f'>0$。
  solution: |
    $f'(x)=6(x-2)(x+1)$，在$(-1,2)$内为负、在两侧为正。$f$在$[-1,2]$上连续，所以在$[-1,2]$上严格递减，$(a,b)=(-1,2)$。

- id: p2
  tier: easy
  statement: |
    求$f(x)=xe^x$的极小值（local minimum）。
  answer:
    type: number
    value: -1/e
  hints:
    - |
      用乘积法则（product rule）求$f'$，找驻点（stationary point）。
    - |
      $f'(x)=(1+x)e^x$，驻点是$-1$。
    - |
      $x<-1$时$f'<0$，$x>-1$时$f'>0$，所以$-1$是极小值点。
  solution: |
    $f'(x)=e^x+xe^x=(1+x)e^x$，$e^x>0$，所以$f'$的正负和$1+x$一样：在$-1$左侧为负、右侧为正。由一阶导数判别法，$-1$是极小值点，极小值是$f(-1)=-\frac1e\approx-0.368$。

- id: p3
  tier: medium
  statement: |
    下面哪些函数在$\R$上严格递增（strictly increasing）？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $x+\sin x$
      - |
        $x^2+x$
      - |
        $e^x-x$
      - |
        $x^5+x^3+x$
    value: [1, 4]
  hints:
    - |
      逐个求导数，看它是不是处处$\ge0$，为$0$的点是不是孤立的。
    - |
      $(x+\sin x)'=1+\cos x\ge0$，只在$x=\pi+2k\pi$处为$0$；$(x^2+x)'=2x+1$；$(e^x-x)'=e^x-1$。
    - |
      $(x^5+x^3+x)'=5x^4+3x^2+1>0$。$2x+1$、$e^x-1$在$x$很小时为负。
  solution: |
    A：$1+\cos x\ge0$，为$0$的点彼此隔开，在任何一小段区间上都不恒为$0$，所以$x+\sin x$严格递增。D：导数$5x^4+3x^2+1$处处为正，严格递增。B、C 不对：$x^2+x$的导数$2x+1$在$x<-\frac12$时为负，$e^x-x$的导数$e^x-1$在$x<0$时为负，它们在那里递减。

- id: p4
  tier: medium
  statement: |
    $f(x)=x^3+ax^2+bx$在$x=2$处取极值$-10$。求$(a,b)$，并判断$x=2$是极大值点还是极小值点。
  answer:
    type: tuple
    value: [-3/2, -6]
  hints:
    - |
      $f$处处可导，极值点是驻点：$f'(2)=0$；再加上$f(2)=-10$。
    - |
      $f'(2)=12+4a+b=0$，$f(2)=8+4a+2b=-10$。
    - |
      解得$a=-\frac32$、$b=-6$。这时$f'(x)=3x^2-3x-6=3(x-2)(x+1)$，看$2$两侧的正负。
  solution: |
    由$f'(2)=12+4a+b=0$和$f(2)=8+4a+2b=-10$，解得$a=-\frac32$，$b=-6$。这时$f'(x)=3(x-2)(x+1)$，在$2$左侧附近为负、右侧为正，所以$x=2$是极小值点，极小值确实是$f(2)=8-6-12=-10$。

- id: p5
  tier: hard
  statement: |
    （1）证明：$x>1$时$\ln x>\frac{2(x-1)}{x+1}$。

    （2）由此说明$\ln2>\frac23$。
  hints:
    - |
      （1）令$g(x)=\ln x-\frac{2(x-1)}{x+1}$，算出$g(1)$，再看$g$在$[1,+\infty)$上的单调性。
    - |
      （1）$\Bigl(\frac{2(x-1)}{x+1}\Bigr)'=\frac{4}{(x+1)^2}$，所以$g'(x)=\frac1x-\frac4{(x+1)^2}$，通分。
    - |
      （1）$g'(x)=\frac{(x+1)^2-4x}{x(x+1)^2}=\frac{(x-1)^2}{x(x+1)^2}$，$x>1$时为正。$g$在$[1,+\infty)$上连续，在内部$g'>0$，所以严格递增；$x>1$时$g(x)>g(1)=0$。

      （2）取$x=2$：$\ln2>\frac{2\cdot1}{3}=\frac23$。
  reference: |
    （1）$g(1)=0$，$g'(x)=\frac{(x-1)^2}{x(x+1)^2}>0$，$g$严格递增。

    （2）$x=2$代入。$\ln2\approx0.693>0.667$。

- id: p6
  tier: hard
  statement: |
    （1）用例 2 的结论，比较$e^\pi$和$\pi^e$的大小。

    （2）设$e\le a<b$，比较$a^b$和$b^a$的大小，并验证$3^4$和$4^3$。

    （3）$2^4$和$4^2$相等，和（2）矛盾吗？
  hints:
    - |
      两边取对数：$a^b>b^a$等价于$b\ln a>a\ln b$，即$\frac{\ln a}a>\frac{\ln b}b$。
    - |
      $\frac{\ln x}x$在$[e,+\infty)$上严格递减。
    - |
      （1）$e<\pi$，所以$\frac{\ln e}e>\frac{\ln\pi}\pi$，即$\pi>e\ln\pi$，于是$e^\pi>\pi^e$。

      （2）$e\le a<b$时$\frac{\ln a}a>\frac{\ln b}b$，所以$a^b>b^a$。$3^4=81>64=4^3$，符合。

      （3）不矛盾：$2<e$，不在$\frac{\ln x}x$严格递减的范围里。$\frac{\ln2}2=\frac{\ln4}4$，两个点分在最高点$e$的两侧，函数值正好相等。
  reference: |
    （1）$e^\pi>\pi^e$。

    （2）$a^b>b^a$；$81>64$。

    （3）不矛盾，$2<e$，$2$和$4$在$e$的两侧。

- id: p7
  tier: thinking
  statement: |
    设$f(x)=x+2x^2\sin\frac1x$（$x\ne0$），$f(0)=0$。已知$x\ne0$时$f'(x)=1+4x\sin\frac1x-2\cos\frac1x$。

    （1）用导数的定义求$f'(0)$。

    （2）在$x=\frac1{2k\pi}$（$k$是正整数）处，$f'$是正是负？

    （3）$f$在$0$附近递增吗？这说明「$f'(x_0)>0$」和「$f'$在一个区间上为正」有什么不同？
  hints:
    - |
      （1）差商（difference quotient）是$\frac{f(h)-f(0)}h=1+2h\sin\frac1h$。
    - |
      （2）$\sin2k\pi=0$，$\cos2k\pi=1$。
    - |
      （1）$\bigl|2h\sin\frac1h\bigr|\le2|h|\to0$，所以$f'(0)=1$。

      （2）$f'\bigl(\frac1{2k\pi}\bigr)=1+0-2=-1<0$。

      （3）不递增。$k$越大，$\frac1{2k\pi}$离$0$越近，所以$0$的任何一小段邻近里都有$f'<0$的点；$f'$在这点附近连续，$f$在它附近的一小段上严格递减。一点处导数为正，只说明$f(x)$在$x_0$两侧近处分别小于、大于$f(x_0)$，不说明$f$在一个区间上递增；定理要的是整个区间上$f'>0$。
  reference: |
    （1）$f'(0)=1$。

    （2）$-1$。

    （3）不递增，$0$附近处处有使$f'<0$的点；一点的导数为正推不出附近单调。

- id: p8
  tier: thinking
  statement: |
    求单调区间时，在相邻两个分界点之间只取一个点，看$f'$的正负。

    （1）为什么这样做就够了？

    （2）如果$f'$在某一段里本来就有正有负，却没有为$0$的点，会怎样？这样的可导函数（differentiable function）存在吗？

    （3）$f(x)=\frac1x$的导数处处为负，它没有驻点，可「在$-1$和$1$之间取一点」又不行，为什么？
  hints:
    - |
      （1）（2）回忆[极值与费马定理](lesson:math.calculus.local-extrema)第 5 题：导函数（derivative function）有介值性。
    - |
      （3）分界点除了驻点、不可导的点，还有定义域断开的地方。
    - |
      （1）在两个相邻分界点之间，$f'$处处存在、又不为$0$。导函数有介值性：如果它在两点一正一负，中间就有一点使$f'=0$，矛盾。所以$f'$在这一段上不变号，取一个点就知道整段的符号。

      （2）不会发生：有正有负，就一定经过$0$，那一点是驻点，本该列为分界点。这和$f'$连不连续无关，可导函数的导数都有介值性。

      （3）$0$不在定义域里，定义域断成$(-\infty,0)$和$(0,+\infty)$两个区间，各自分开讨论；单调区间只能在一个区间里谈。
  reference: |
    （1）导函数有介值性，相邻分界点之间不为零就不变号。

    （2）不存在这样的可导函数。

    （3）$0$处定义域断开，也是分界点。
