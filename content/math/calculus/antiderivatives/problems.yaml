- id: p1
  tier: easy
  statement: |
    $F$是$f(x)=3x^2+2x-5$的原函数（antiderivative），并且$F(0)=1$。求$F(2)$。
  answer:
    type: number
    value: 3
  hints:
    - |
      先求出全体原函数$F(x)=\int f(x)\,\dd x$，再用$F(0)=1$定出常数。
    - |
      $F(x)=x^3+x^2-5x+C$，$F(0)=C=1$。
    - |
      $F(2)=8+4-10+1=3$。
  solution: |
    $F(x)=x^3+x^2-5x+C$，由$F(0)=1$得$C=1$，所以$F(2)=8+4-10+1=3$。

- id: p2
  tier: easy
  statement: |
    $F$是$\sqrt x$在$[0,+\infty)$上的原函数，$F(0)=0$。求$F(4)$。
  answer:
    type: number
    value: 16/3
  hints:
    - |
      $\sqrt x=x^{\frac12}$，用$\int x^a\,\dd x=\frac{x^{a+1}}{a+1}+C$。
    - |
      $F(x)=\frac23x^{\frac32}+C$，$F(0)=0$给出$C=0$。
    - |
      $F(4)=\frac23\cdot4^{\frac32}=\frac23\cdot8=\frac{16}3$。
  solution: |
    $F(x)=\frac{x^{3/2}}{3/2}+C=\frac23x^{\frac32}+C$，$F(0)=0$，所以$C=0$，$F(4)=\frac23\cdot8=\frac{16}3$。

- id: p3
  tier: medium
  statement: |
    $x>0$时$F'(x)=\frac{(1+x)^2}{x}$，并且$F(1)=0$。求$F(e)$。
  answer:
    type: number
    value: 2*e + e^2/2 - 3/2
  hints:
    - |
      先把$\frac{(1+x)^2}x$展开成几项，每一项都在基本积分表里。
    - |
      $\frac{1+2x+x^2}x=\frac1x+2+x$，所以$F(x)=\ln x+2x+\frac{x^2}2+C$。
    - |
      $F(1)=2+\frac12+C=0$，$C=-\frac52$；$F(e)=1+2e+\frac{e^2}2-\frac52=2e+\frac{e^2}2-\frac32\approx7.631$。
  solution: |
    $\frac{(1+x)^2}x=\frac1x+2+x$，所以$F(x)=\ln x+2x+\frac{x^2}2+C$（$x>0$）。由$F(1)=0$得$C=-\frac52$，于是$F(e)=1+2e+\frac{e^2}2-\frac52=2e+\frac{e^2}2-\frac32\approx7.631$。

- id: p4
  tier: medium
  statement: |
    曲线$y=F(x)$经过点$(0,1)$，在每一点处切线的斜率是$2^x$。求$F(1)$。
  answer:
    type: number
    value: 1 + 1/ln(2)
  hints:
    - |
      $F'(x)=2^x$，所以$F$是$2^x$的一个原函数；用$\int a^x\,\dd x=\frac{a^x}{\ln a}+C$。
    - |
      $F(x)=\frac{2^x}{\ln2}+C$，$F(0)=\frac1{\ln2}+C=1$。
    - |
      $C=1-\frac1{\ln2}$，$F(1)=\frac2{\ln2}+1-\frac1{\ln2}=1+\frac1{\ln2}\approx2.443$。
  solution: |
    $F(x)=\frac{2^x}{\ln2}+C$。由$F(0)=1$得$C=1-\frac1{\ln2}$，所以$F(1)=\frac2{\ln2}+1-\frac1{\ln2}=1+\frac1{\ln2}\approx2.443$。

- id: p5
  tier: hard
  statement: |
    （1）写出$\frac1x$在$\R$去掉$0$以后的集合上的全体原函数，说明为什么不能写成一个式子$\ln|x|+C$。（2）证明：$x<0$时取$0$、$x\ge0$时取$1$的函数在$\R$上没有原函数。（3）求$|x|$在$\R$上的一个原函数，并验证它在$0$处可导。
  hints:
    - |
      （1）在$x<0$、$x>0$两个区间上分别用定理。（2）假设有原函数$F$，$F'$只取$0$和$1$两个值，用[极值与费马定理](lesson:math.calculus.local-extrema)第 5 题的结论。（3）分两段求原函数，再调整常数让两段在$0$处接上。
    - |
      （3）试试$F(x)=\frac{x|x|}2$：$x>0$时是$\frac{x^2}2$，$x<0$时是$-\frac{x^2}2$。
    - |
      （1）在$(-\infty,0)$上原函数是$\ln(-x)+C_1$，在$(0,+\infty)$上是$\ln x+C_2$，$C_1$、$C_2$各自任取。定义域不是一个区间，推论 2 不能跨过$0$用，两边的常数不必相同，所以要写两个常数。

      （2）若$F'$等于这个函数，则$F'(-1)=0<\frac12<1=F'(1)$。由那道题的结论，导函数在$[-1,1]$上取遍$0$和$1$之间的值，应当有一点使$F'=\frac12$，可$F'$只取$0$、$1$，矛盾。

      （3）$F(x)=\frac{x|x|}2$：$x\ne0$时，$x>0$的一段导数是$x$，$x<0$的一段导数是$-x$，都等于$|x|$。在$0$处，$\frac{F(h)-F(0)}h=\frac{|h|}2\to0=|0|$，也成立。所以$F$是$|x|$在$\R$上的原函数，全体原函数是$\frac{x|x|}2+C$。
  reference: |
    （1）$\ln(-x)+C_1$（$x<0$），$\ln x+C_2$（$x>0$）；两段常数独立。

    （2）导函数有介值性（达布），台阶函数没有。

    （3）$\frac{x|x|}2$，在$0$处差商$\frac{|h|}2\to0$。

- id: p6
  tier: hard
  statement: |
    求原函数常常是「先猜，再求导验证」。

    （1）验证$\int\ln x\,\dd x=x\ln x-x+C$。

    （2）由（1）求$\int\log_2x\,\dd x$。

    （3）猜出$\int xe^x\,\dd x$并验证。

    （4）$\int x^2e^x\,\dd x$呢？和[初等函数的导数](lesson:math.calculus.elementary-derivatives)第 6 题有什么关系？
  hints:
    - |
      （1）对右边求导。（2）换底：$\log_2x=\frac{\ln x}{\ln2}$。（3）猜原函数的形状是$(ax+b)e^x$，求导后比较系数。
    - |
      （3）$\bigl((ax+b)e^x\bigr)'=(ax+a+b)e^x$，要等于$xe^x$。（4）猜$(ax^2+bx+c)e^x$。
    - |
      （1）$(x\ln x-x)'=\ln x+x\cdot\frac1x-1=\ln x$，对。

      （2）$\int\log_2x\,\dd x=\frac1{\ln2}\int\ln x\,\dd x=\frac{x\ln x-x}{\ln2}+C$。

      （3）$(ax+a+b)e^x=xe^x$要求$a=1$、$a+b=0$，所以$\int xe^x\,\dd x=(x-1)e^x+C$；验证：$\bigl((x-1)e^x\bigr)'=e^x+(x-1)e^x=xe^x$。

      （4）$\int x^2e^x\,\dd x=(x^2-2x+2)e^x+C$。那道题找的正是使$(Pe^x)'=x^2e^x$的多项式$P$，就是这里的原函数；它还证明了这样的多项式只有一个。
  reference: |
    （1）求导验证。

    （2）$\frac{x\ln x-x}{\ln2}+C$。

    （3）$(x-1)e^x+C$。

    （4）$(x^2-2x+2)e^x+C$。以后的分部积分法把「猜」变成系统的办法。

- id: p7
  tier: thinking
  statement: |
    （1）只知道一辆车每一刻的速度，能确定它每一刻在哪里吗？还缺什么？（2）只知道加速度呢，要补上几个条件才能确定位置？（3）为什么一个函数的全体原函数，图像是一族上下平移的曲线，而不是左右平移的曲线？
  hints:
    - |
      （1）位置是速度的原函数，原函数只差一个常数。（2）先由加速度求速度，再由速度求位置，每一步各有一个常数。
    - |
      （3）$F(x)+C$和$F(x+C)$的导数各是什么？
    - |
      （1）不能。位置是速度的一个原函数，原函数之间差一个常数，还要知道某一刻的位置（比如出发点）才能定下它。

      （2）要两个条件，比如某一刻的速度和位置：由加速度求速度时多一个常数，由速度求位置时又多一个。这就是物理里要给初始条件的原因。

      （3）$F(x)+C$的导数还是$f(x)$，所以上下平移得到的仍是原函数；$F(x+C)$的导数是$f(x+C)$，一般不等于$f(x)$。在同一个$x$处，所有原函数的切线斜率都是$f(x)$，它们只能在竖直方向上错开。
  reference: |
    （1）不能，缺一个位置。

    （2）两个（速度、位置各一个）。

    （3）竖直平移保持导数不变，水平平移一般不保持。

- id: p8
  tier: thinking
  statement: |
    （1）求导几乎是机械的：初等函数的导数总能按法则算出来，还是初等函数。求原函数也是这样吗？试试$e^{-x^2}$。

    （2）找不到初等的原函数，是不是说这个函数没有原函数？

    （3）既然求原函数这么难，为什么还值得研究？
  hints:
    - |
      （1）回忆[初等函数的导数](lesson:math.calculus.elementary-derivatives)第 8 题。（2）区分「没有原函数」和「原函数写不成初等函数的式子」。
    - |
      （2）以后的[微积分基本定理](lesson:math.calculus.fundamental-theorem)会说：区间上的连续函数（continuous function）都有原函数。
    - |
      （1）不是。$e^{-x^2}$、$\frac{\sin x}x$、$\frac1{\ln x}$的原函数都不能用有限个初等函数加减乘除、复合写出来（证明超出了微积分）。求导有一套法则把复杂函数拆开，求原函数没有通用的法则。

      （2）不是。它们都是连续函数，有原函数，只是原函数不是初等函数；概率里常用的误差函数（error function），乘上一个常数因子就是$e^{-x^2}$的原函数，专门起了名字。

      （3）因为物理和几何里的问题，大多是「已知变化率求总量」：由速度求路程、由力求功、由密度求质量。能求出来的就有公式，求不出来的也可以按定义近似计算。
  reference: |
    （1）否，$e^{-x^2}$无初等原函数。

    （2）否，连续函数有原函数（基本定理）。

    （3）已知变化率求总量是最常见的问题。
