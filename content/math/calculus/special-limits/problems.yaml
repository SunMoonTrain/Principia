- id: p1
  tier: easy
  statement: |
    求$\lim_{x\to0}\frac{\sin5x}{2x}$。
  answer:
    type: number
    value: 5/2
  hints:
    - |
      想办法凑出$\frac{\sin u}{u}$的样子，$u=5x$。
    - |
      $\frac{\sin5x}{2x}=\frac52\cdot\frac{\sin5x}{5x}$。
    - |
      $x\to0$时$5x\to0$，$\frac{\sin5x}{5x}\to1$，所以极限是$\frac52$。
  solution: |
    $\frac{\sin5x}{2x}=\frac52\cdot\frac{\sin5x}{5x}$。令$u=5x$，$x\to0$时$u\to0$，$\frac{\sin u}{u}\to1$，所以极限是$\frac52$。

- id: p2
  tier: easy
  statement: |
    求$\lim_{x\to\infty}\left(1+\frac3x\right)^x$。
  answer:
    type: number
    value: exp(3)
  hints:
    - |
      想办法凑出$\left(1+\frac1t\right)^t$的样子。
    - |
      令$t=\frac x3$，则$x=3t$，$\left(1+\frac3x\right)^x=\left[\left(1+\frac1t\right)^t\right]^3$。
    - |
      方括号里趋于$e$，所以极限是$e^3$，填`e^3`。
  solution: |
    令$t=\frac x3$，$x\to\infty$时$t\to\infty$，$\left(1+\frac3x\right)^x=\left[\left(1+\frac1t\right)^t\right]^3\to e^3$。

- id: p3
  tier: medium
  statement: |
    求$\lim_{x\to0}\frac{1-\cos4x}{x\sin x}$。
  answer:
    type: number
    value: 8
  hints:
    - |
      分子用倍角公式化成正弦的平方：$1-\cos4x=2\sin^22x$。
    - |
      原式$=\frac{2\sin^22x}{x\sin x}=2\cdot\left(\frac{\sin2x}{x}\right)^2\cdot\frac{x}{\sin x}$。
    - |
      $\frac{\sin2x}{x}=2\cdot\frac{\sin2x}{2x}\to2$，$\frac{x}{\sin x}\to1$，所以极限是$2\cdot2^2\cdot1=8$。
  solution: |
    $1-\cos4x=2\sin^22x$，原式$=2\left(\frac{\sin2x}{x}\right)^2\frac{x}{\sin x}$。$\frac{\sin2x}{x}=2\cdot\frac{\sin2x}{2x}\to2$，$\frac{x}{\sin x}\to1$，极限是$2\cdot4\cdot1=8$。

- id: p4
  tier: medium
  statement: |
    求$\lim_{x\to0}(1-2x)^{\frac3x}$。
  answer:
    type: number
    value: exp(-6)
  hints:
    - |
      底数趋于$1$、指数趋于无穷大。凑成$(1+t)^{\frac1t}$，$t=-2x$。
    - |
      $(1-2x)^{\frac3x}=\left[(1-2x)^{\frac{1}{-2x}}\right]^{-6}$。
    - |
      方括号里趋于$e$，所以极限是$e^{-6}$，填`e^(-6)`。
  solution: |
    令$t=-2x$，$x\to0$时$t\to0$，$\frac3x=-\frac6t$，所以$(1-2x)^{\frac3x}=\left[(1+t)^{\frac1t}\right]^{-6}\to e^{-6}$。

- id: p5
  tier: hard
  statement: |
    已知$\lim_{n\to\infty}\left(1+\frac1n\right)^n=e$。

    （1）证明$\lim_{x\to+\infty}\left(1+\frac1x\right)^x=e$：取整数$n$使$n\le x<n+1$，把$\left(1+\frac1x\right)^x$夹在两个只含$n$的式子之间。（2）由（1）证明$\lim_{x\to-\infty}\left(1+\frac1x\right)^x=e$。
  hints:
    - |
      （1）$\frac1{n+1}<\frac1x\le\frac1n$，底数放大一次、指数放大一次；缩小也一样。
    - |
      （2）令$x=-y$，$y\to+\infty$：$\left(1-\frac1y\right)^{-y}=\left(\frac{y}{y-1}\right)^y=\left(1+\frac1{y-1}\right)^y$。
    - |
      （1）设$x\ge1$，$n\le x<n+1$。底数满足$1+\frac1{n+1}<1+\frac1x\le1+\frac1n$，指数满足$n\le x<n+1$，所以$\left(1+\frac1{n+1}\right)^n<\left(1+\frac1x\right)^x<\left(1+\frac1n\right)^{n+1}$。左边$=\left(1+\frac1{n+1}\right)^{n+1}\Big/\left(1+\frac1{n+1}\right)\to e$，右边$=\left(1+\frac1n\right)^n\left(1+\frac1n\right)\to e$；$x\to+\infty$时$n\to\infty$，由夹逼定理得证。

      （2）令$x=-y$、$s=y-1$，$x\to-\infty$时$s\to+\infty$。$\left(1+\frac1x\right)^x=\left(1+\frac1s\right)^{s+1}=\left(1+\frac1s\right)^s\left(1+\frac1s\right)$，由（1）趋于$e\cdot1=e$。
  reference: |
    （1）$x\ge1$，$n=\lfloor x\rfloor$。因为$1<1+\frac1{n+1}<1+\frac1x\le1+\frac1n$，而底数大于$1$时指数越大幂越大，所以$\left(1+\frac1{n+1}\right)^n<\left(1+\frac1x\right)^x<\left(1+\frac1n\right)^{n+1}$。左边是$\frac{(1+\frac1{n+1})^{n+1}}{1+\frac1{n+1}}$，右边是$(1+\frac1n)^n(1+\frac1n)$，$n\to\infty$时都趋于$e$。$x\to+\infty$时$n\to\infty$，夹逼得极限为$e$。

    （2）$x<-1$时令$y=-x>1$，$\left(1+\frac1x\right)^x=\left(\frac{y-1}{y}\right)^{-y}=\left(1+\frac1{y-1}\right)^y$。再令$s=y-1\to+\infty$，得$\left(1+\frac1s\right)^s\cdot\left(1+\frac1s\right)\to e$。两个方向都是$e$，所以$\lim_{x\to\infty}\left(1+\frac1x\right)^x=e$。

- id: p6
  tier: hard
  statement: |
    设$x\ne0$。

    （1）证明$\sin x=2^n\sin\frac{x}{2^n}\cdot\cos\frac x2\cos\frac x4\cdots\cos\frac x{2^n}$。（2）求$\lim_{n\to\infty}\cos\frac x2\cos\frac x4\cdots\cos\frac x{2^n}$。（3）取$x=\frac\pi2$，写出$\frac2\pi$的一个无穷乘积（infinite product），也就是（2）里$n\to\infty$时的极限。
  hints:
    - |
      （1）反复用$\sin2\theta=2\sin\theta\cos\theta$，从$\sin\frac{x}{2^n}$往回乘。
    - |
      （2）由（1），乘积等于$\frac{\sin x}{2^n\sin(x/2^n)}$。$2^n\sin\frac{x}{2^n}$趋于什么？
    - |
      （1）$2\sin\frac{x}{2^n}\cos\frac{x}{2^n}=\sin\frac{x}{2^{n-1}}$，再乘$2\cos\frac{x}{2^{n-1}}$得$\sin\frac{x}{2^{n-2}}$……乘$n$次得$\sin x$。

      （2）$2^n\sin\frac{x}{2^n}=x\cdot\frac{\sin(x/2^n)}{x/2^n}$，$\frac{x}{2^n}\to0$，所以它趋于$x$，乘积趋于$\frac{\sin x}{x}$。

      （3）$x=\frac\pi2$时极限是$\frac2\pi$。由半角公式$2\cos\frac\theta2=\sqrt{2+2\cos\theta}$，各因子依次是$\frac{\sqrt2}2$、$\frac{\sqrt{2+\sqrt2}}2$、$\frac{\sqrt{2+\sqrt{2+\sqrt2}}}2$……，所以$\frac2\pi=\frac{\sqrt2}2\cdot\frac{\sqrt{2+\sqrt2}}2\cdot\frac{\sqrt{2+\sqrt{2+\sqrt2}}}2\cdots$。
  reference: |
    （1）对$n$归纳，或直接反复用倍角公式：$2^n\sin\frac{x}{2^n}\prod_{k=1}^{n}\cos\frac{x}{2^k}$里先把$2\sin\frac{x}{2^n}\cos\frac{x}{2^n}$合成$\sin\frac{x}{2^{n-1}}$，依次合并，最后得到$\sin x$。

    （2）$2^n\sin\frac x{2^n}\ne0$（$n$足够大时$0<\frac{|x|}{2^n}<\pi$），乘积$=\frac{\sin x}{2^n\sin(x/2^n)}$。令$u=\frac{x}{2^n}\to0$，$2^n\sin\frac{x}{2^n}=x\frac{\sin u}{u}\to x$，所以极限是$\frac{\sin x}x$。

    （3）$x=\frac\pi2$，$\cos\frac\pi4=\frac{\sqrt2}2$，用$\cos\frac\theta2=\frac12\sqrt{2+2\cos\theta}$依次得$\cos\frac\pi8=\frac{\sqrt{2+\sqrt2}}2$等，得韦达公式$\frac2\pi=\frac{\sqrt2}2\cdot\frac{\sqrt{2+\sqrt2}}2\cdot\frac{\sqrt{2+\sqrt{2+\sqrt2}}}2\cdots$。

- id: p7
  tier: thinking
  statement: |
    用角度量角时，记$\sin x^\circ$为$x$度角的正弦。

    （1）求$\lim_{x\to0}\frac{\sin x^\circ}{x}$。（2）为什么微积分里一律用弧度？从单位圆上的弧长或扇形面积说一说。（3）以后会知道，弧度制下$\sin x$的导数是$\cos x$（[初等函数的导数](lesson:math.calculus.elementary-derivatives)）；换成角度制，这个公式会变成什么样？
  hints:
    - |
      （1）$x$度等于$\frac{\pi x}{180}$弧度。
    - |
      （2）半径为$1$、圆心角为$\theta$弧度的弧长是$\theta$，扇形面积是$\frac\theta2$；角度制下呢？
    - |
      （1）$\frac{\sin x^\circ}{x}=\frac{\sin(\pi x/180)}{x}=\frac\pi{180}\cdot\frac{\sin u}{u}$，$u=\frac{\pi x}{180}\to0$，极限是$\frac\pi{180}$。

      （2）弧度制里单位圆上的角就是弧长，扇形面积是角的一半，所以$\sin x<x<\tan x$里的$x$既是角又是长度，比较起来不带比例因子；角度制下处处要乘$\frac\pi{180}$。

      （3）会多出因子$\frac\pi{180}$：角度制下$\sin x^\circ$的导数是$\frac\pi{180}\cos x^\circ$。弧度让这些公式不带多余的常数。
  reference: |
    （1）$\sin x^\circ=\sin\frac{\pi x}{180}$，$\frac{\sin x^\circ}x=\frac\pi{180}\cdot\frac{\sin u}u\to\frac\pi{180}\approx0.01745$。

    （2）弧度的定义就是「弧长除以半径」，单位圆上的角等于弧长，扇形面积$\frac12\theta$。第一个重要极限的证明里，扇形面积$\frac12x$夹在两个三角形之间，靠的正是这一点。角度制下扇形面积是$\frac{\pi x}{360}$，极限变成$\frac\pi{180}$。

    （3）$\sin x^\circ$的导数是$\frac\pi{180}\cos x^\circ$；求导一次多一个$\frac\pi{180}$。弧度是让「$\sin x\approx x$」不带常数的唯一选择。

- id: p8
  tier: thinking
  statement: |
    （1）年利率为$r$，一年分$n$次结息，年底本息是本金的$\left(1+\frac rn\right)^n$倍。$n\to\infty$时它趋于多少？（2）求$\left(1+\frac1n\right)^{n^2}$和$\left(1+\frac1{n^2}\right)^n$在$n\to\infty$时的极限。同是「$1^\infty$」，为什么结果不同？
  hints:
    - |
      （1）令$t=\frac nr$（$r\ne0$），凑出$\left(1+\frac1t\right)^t$。
    - |
      （2）$\left(1+\frac1n\right)^{n^2}=\left[\left(1+\frac1n\right)^n\right]^n$，$\left(1+\frac1{n^2}\right)^n=\left[\left(1+\frac1{n^2}\right)^{n^2}\right]^{\frac1n}$。方括号里各趋于什么？
    - |
      （1）$\left(1+\frac rn\right)^n=\left[\left(1+\frac1t\right)^t\right]^r\to e^r$；$r=0$时恒为$1=e^0$。

      （2）方括号里都趋于$e$，并且$\left(1+\frac1n\right)^n\ge2$，所以前者$\ge2^n\to+\infty$。后者在$1$和$e^{\frac1n}$之间（$\left(1+\frac1{m}\right)^m$递增趋于$e$，总小于$e$），$e^{\frac1n}\to1$，所以趋于$1$。

      差别在于底数趋于$1$和指数趋于无穷大谁快：把「底数减$1$」乘上指数，前者是$\frac1n\cdot n^2=n\to\infty$，后者是$\frac1{n^2}\cdot n\to0$，第二个重要极限里正好是$1$，结果是$e^1$。
  reference: |
    （1）$r\ne0$时令$t=\frac nr$，$\left(1+\frac rn\right)^n=\left[\left(1+\frac1t\right)^t\right]^r\to e^r$（$r<0$时$t\to-\infty$，用两个方向的结论）。这叫连续复利。

    （2）$\left(1+\frac1n\right)^{n^2}=\left[\left(1+\frac1n\right)^n\right]^n\ge2^n\to+\infty$。$1<\left(1+\frac1{n^2}\right)^n=\left[\left(1+\frac1{n^2}\right)^{n^2}\right]^{1/n}<e^{1/n}\to1$，夹逼得$1$。

    「$1^\infty$」的结果由「底数减$1$」乘指数的极限$c$决定：$c$是有限数时极限是$e^c$，$c=+\infty$时是$+\infty$，$c=0$时是$1$。这个说法的道理是$\left(1+u\right)^{v}=\left[(1+u)^{\frac1u}\right]^{uv}$。
