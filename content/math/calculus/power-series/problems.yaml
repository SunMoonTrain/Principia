- id: p1
  tier: easy
  statement: |
    求幂级数（power series）$\sum_{n=1}^\infty\frac{n\,x^n}{5^n}$的收敛半径（radius of convergence）。
  answer:
    type: number
    value: 5
  hints:
    - |
      $a_n=\frac n{5^n}$，求$\Bigl|\frac{a_n}{a_{n+1}}\Bigr|$的极限。
    - |
      $\frac{a_n}{a_{n+1}}=\frac{n}{5^n}\cdot\frac{5^{n+1}}{n+1}$。
    - |
      化简得$\frac{5n}{n+1}$。
  solution: |
    $\Bigl|\frac{a_n}{a_{n+1}}\Bigr|=\frac{5n}{n+1}\to5$，收敛半径是$5$。

- id: p2
  tier: easy
  statement: |
    $\sum_{n=1}^\infty\frac{x^n}{n\cdot4^n}$的收敛域（domain of convergence）是哪一个？
  answer:
    type: choice
    multiple: false
    options:
      - |
        $(-4,4)$
      - |
        $[-4,4)$
      - |
        $(-4,4]$
      - |
        $[-4,4]$
    value: 2
  hints:
    - |
      先求收敛半径：$\Bigl|\frac{a_n}{a_{n+1}}\Bigr|=\frac{4(n+1)}n$。
    - |
      $R=4$。再把$x=4$和$x=-4$分别代进去。
    - |
      $x=4$时是$\sum\frac1n$；$x=-4$时是$\sum\frac{(-1)^n}n$。
  solution: |
    $R=4$。$x=4$时级数是调和级数，发散；$x=-4$时是$\sum\frac{(-1)^n}n$，由交错级数判别法收敛。收敛域是$[-4,4)$，选 B。

- id: p3
  tier: medium
  statement: |
    求$\sum_{n=0}^\infty\frac{(2n)!}{(n!)^2}x^n$的收敛半径。
  answer:
    type: number
    value: 1/4
  hints:
    - |
      $\frac{a_n}{a_{n+1}}=\frac{(2n)!}{(n!)^2}\cdot\frac{\bigl((n+1)!\bigr)^2}{(2n+2)!}$。
    - |
      $\frac{(n+1)!}{n!}=n+1$，$\frac{(2n+2)!}{(2n)!}=(2n+1)(2n+2)$。
    - |
      化简得$\frac{(n+1)^2}{(2n+1)(2n+2)}$。
  solution: |
    $\Bigl|\frac{a_n}{a_{n+1}}\Bigr|=\frac{(n+1)^2}{(2n+1)(2n+2)}=\frac{n+1}{2(2n+1)}\to\frac14$，收敛半径是$\frac14$。

- id: p4
  tier: medium
  statement: |
    $\sum_{n=1}^\infty\frac{(3x-1)^n}{n^2}$的收敛域是一个区间，左右端点依次是$a$、$b$。求$a$、$b$（答案依次写$a$、$b$）。
  answer:
    type: tuple
    value: [0, 2/3]
  hints:
    - |
      记$u=3x-1$，先看$\sum\frac{u^n}{n^2}$对哪些$u$收敛。
    - |
      $\sum\frac{u^n}{n^2}$的收敛半径是$1$；$u=\pm1$时$\Bigl|\frac{u^n}{n^2}\Bigr|=\frac1{n^2}$。
    - |
      $-1\le3x-1\le1$。
  solution: |
    $\sum\frac{u^n}{n^2}$在$|u|<1$时绝对收敛，$|u|>1$时通项不趋于$0$，发散；$u=\pm1$时绝对收敛。所以要$-1\le3x-1\le1$，即$0\le x\le\frac23$，$a=0$，$b=\frac23$。它是以$\frac13$为中心、收敛半径为$\frac13$的幂级数。

- id: p5
  tier: hard
  statement: |
    幂级数$\sum_{n=0}^\infty a_nx^n$的系数是：$n$为偶数时$a_n=2^n$，$n$为奇数时$a_n=3^n$。

    （1）$\Bigl|\frac{a_n}{a_{n+1}}\Bigr|$有极限吗？

    （2）求它的收敛半径。
  hints:
    - |
      （1）$n$为偶数时$\frac{a_n}{a_{n+1}}=\frac{2^n}{3^{n+1}}$，$n$为奇数时是$\frac{3^n}{2^{n+1}}$。
    - |
      （2）把级数拆成偶数次项$\sum(2x)^{2k}$和奇数次项$\sum(3x)^{2k+1}$两部分。
    - |
      （2）$|x|<\frac13$时两部分都绝对收敛；$\frac13\le|x|$时奇数次项的通项不趋于$0$。
  reference: |
    （1）偶数$n$时比值趋于$0$，奇数$n$时趋于$+\infty$，没有极限，比值的方法用不上。

    （2）$|x|<\frac13$时，$|a_nx^n|\le|3x|^n$，和公比为$|3x|<1$的几何级数比较，绝对收敛。$|x|\ge\frac13$时，奇数项$|a_nx^n|=|3x|^n\ge1$，通项不趋于$0$，发散。所以收敛半径是$\frac13$：由系数里长得快的那一半决定。

- id: p6
  tier: hard
  statement: |
    设$\sum_{n=0}^\infty a_nx^n$在$x=3$处条件收敛（conditional convergence）。

    （1）证明它的收敛半径恰好是$3$。

    （2）它在$x=2$处绝对收敛吗？在$x=-3$处呢？
  hints:
    - |
      （1）在$x=3$处收敛，由讲解里的定理，$|x|<3$时都绝对收敛，所以$R\ge3$。
    - |
      （1）如果$R>3$，在$x=3$处会怎样？
    - |
      （2）$x=-3$是端点，看看$a_n=\frac{(-1)^n}{n\cdot3^n}$（$n\ge1$）这个例子在两个端点的情况；再看只含偶次幂的$\sum_{n=1}^\infty\frac{(-1)^nx^{2n}}{n\cdot9^n}$。
  reference: |
    （1）由讲解里的定理，$|x|<3$时绝对收敛，$R\ge3$。如果$R>3$，那么$3$在收敛区间里面，级数在$x=3$处绝对收敛，和「条件收敛」矛盾。所以$R=3$。

    （2）$x=2$在收敛区间里面，绝对收敛。$x=-3$是端点，不能确定：$a_n=\frac{(-1)^n}{n\cdot3^n}$时，$x=3$处是$\sum\frac{(-1)^n}n$，条件收敛，$x=-3$处是调和级数，发散；只含偶次幂的$\sum_{n=1}^\infty\frac{(-1)^nx^{2n}}{n\cdot9^n}$，相邻非零项之比的绝对值趋于$\frac{x^2}9$，收敛半径也是$3$，在$x=3$和$x=-3$处都是$\sum\frac{(-1)^n}n$，两端都条件收敛。只能说在$x=-3$处不会绝对收敛（否则在$x=3$处也绝对收敛）。

- id: p7
  tier: thinking
  statement: |
    （1）为什么每个幂级数都在它的中心收敛？

    （2）以$0$为中心的幂级数，收敛域可不可能是$(-1,1]\cup\{5\}$？可不可能是$(0,1)$？

    （3）说说「收敛半径」这个名字里的「半径」是什么意思。
  hints:
    - |
      （1）把$x=x_0$代进去，各项是什么？
    - |
      （2）在$x=5$处收敛，由讲解里的定理，$|x|<5$的点会怎样？
    - |
      （3）收敛与否只取决于$|x-x_0|$。
  reference: |
    （1）$x=x_0$时除第一项$a_0$外都是$0$，和是$a_0$。

    （2）都不可能。在$5$处收敛，则$|x|<5$时都绝对收敛，收敛域至少含$(-5,5)$；而$(0,1)$不含中心$0$。收敛域总是以中心为中点的区间，再加上或不加端点（$R=0$时只有中心一点）。

    （3）收敛的点到中心的距离都不超过$R$，离中心比$R$近的点都收敛、比$R$远的都发散，就像以中心为圆心、$R$为半径画一个「圆」；在数轴上它是一个区间，到了复数里就真是一个圆。

- id: p8
  tier: thinking
  statement: |
    考虑$\sum_{n=1}^\infty\frac{x^n}{n^p}$，$p$是实数。

    （1）它的收敛半径和$p$有没有关系？

    （2）按$p$分情况写出它的收敛域。

    （3）从（1）、（2）看，系数里的$n^p$这类因子影响什么，不影响什么？
  hints:
    - |
      （1）$\Bigl|\frac{a_n}{a_{n+1}}\Bigr|=\Bigl(\frac{n+1}n\Bigr)^p$。
    - |
      （2）$x=1$时是$\sum\frac1{n^p}$；$x=-1$时是$\sum\frac{(-1)^n}{n^p}$，$p>0$时可以用交错级数判别法。
    - |
      （2）分$p\le0$、$0<p\le1$、$p>1$三种情况。
  reference: |
    （1）没有关系，收敛半径总是$1$。

    （2）$p\le0$时两端通项都不趋于$0$，收敛域是$(-1,1)$；$0<p\le1$时$x=1$处发散、$x=-1$处收敛，是$[-1,1)$；$p>1$时两端都绝对收敛，是$[-1,1]$。

    （3）$n^p$这类长得比几何级数慢的因子不改变收敛半径，只影响端点处收敛不收敛。
