- id: p1
  tier: easy
  statement: |
    对下面哪几族集合，写得出一条能证明管用的规则，从族里的每个集合中各挑出一个元素？
  answer:
    type: choice
    multiple: true
    options:
      - |
        所有恰由两个不同的映射$\R\to\R$组成的集合
      - |
        所有由整数组成的非空集合
      - |
        所有恰由三个不同的实数组成的集合
      - |
        所有由$\N$的子集组成的非空集合
      - |
        所有恰由两个不同的映射$\N\to\N$组成的集合
    value: [2, 3, 5]
  hints:
    - |
      规则要一口气说清，对族里的每个集合都指得出挑的是哪一个。数可以比大小；别的对象，先想办法给它们分先后，再看每个集合里是不是总有排在最前面的。
    - |
      B 里的集合不一定有最小的数，先比绝对值呢？E 里两个映射总有取值不同的自然数，其中有最小的；A 里还能这样说吗？D 里的集合，元素是$\N$的子集，不是数。
    - |
      B：挑绝对值最小的数，有两个时挑正的；绝对值都是自然数，由:term[良序原理]{id="math.logic-sets.well-ordering-principle"}（每个数加$1$化成正整数）有最小的。C：挑中间的那个数。E：两个映射取值不同的自然数里，最小的记作$n$，挑在$n$处取值较小的那个。

      A：两个映射取值不同的实数里不一定有最小的，说不出「第一个不同的地方」，照 E 的办法分不出先后。D：给两个子集分先后，可以看只属于其中一个的最小的数，让含有它的排在前面；可$\N\setminus\{0\}$、$\N\setminus\{1\}$、$\N\setminus\{2\}$、……里，后一个总排在前一个前面，没有排在最前面的。反过来让不含它的排在前面，$\{0\}$、$\{1\}$、$\{2\}$、……里也没有。这只说明这几条规则不行；别的能证明管用的规则也写不出来，和讲解里$\R$的全体非空子集一样，这是集合论的定理，这里不证，所以选 B、C、E。
  solution: |
    B：挑绝对值最小的数，有两个时挑正的；绝对值都是自然数，由:term[良序原理]{id="math.logic-sets.well-ordering-principle"}（每个数加$1$化成正整数）有最小的。C：三个实数排得出大小，挑中间的。E：两个不同的映射，取值不同的自然数里有最小的，记作$n$，挑在$n$处取值较小的那个。

    A：取值不同的实数里不一定有最小的，照 E 的办法分不出两个映射的先后。D：$\N$的子集倒分得出先后，看只属于其中一个的最小的数就行，可让含有它的排在前面时，$\N\setminus\{0\}$、$\N\setminus\{1\}$、$\N\setminus\{2\}$、……里没有排在最前面的，反过来规定时，$\{0\}$、$\{1\}$、$\{2\}$、……里没有。这只说明这几条规则不行；别的能证明管用的规则也写不出来，和讲解里$\R$的全体非空子集一样，这是集合论的定理，这里不证。选 B、C、E。

    写不出规则，不等于没有选择函数：由:term[选择公理]{id="math.logic-sets.axiom-of-choice"}，A、D 也有选择函数。

- id: p2
  tier: easy
  statement: |
    $A_1=\{1,2,3\}$，$A_2=\{1,2,3,4\}$，$A_3=\{5,6\}$。:term[集族]{id="math.logic-sets.family-of-sets"}$\{A_i\}_{i\in\{1,2,3\}}$有几个选择函数？
  answer:
    type: number
    value: 24
    exact: true
  hints:
    - |
      一个选择函数$f$由$f(1)$、$f(2)$、$f(3)$完全确定。它们各可以取哪些元素，互相之间有没有限制？
    - |
      要求只有$f(1)\in A_1$，$f(2)\in A_2$，$f(3)\in A_3$，此外没有别的：$f(1)$和$f(2)$可以相同。
    - |
      $f(1)$有$3$种取法，$f(2)$有$4$种，$f(3)$有$2$种，互不影响。由乘法原理（multiplication principle），选择函数有$3\times4\times2=24$个。
  solution: |
    选择函数只要求每个$i$都有$f(i)\in A_i$，所以$f(1)$、$f(2)$、$f(3)$依次有$3$、$4$、$2$种取法，互不影响。由乘法原理（multiplication principle），选择函数有$3\times4\times2=24$个。

    不同的指标可以挑中同一个元素，例如$f(1)=f(2)=1$也行；以为$f(1)$和$f(2)$必须不同，就会少数。

- id: p3
  tier: medium
  statement: |
    下面的:term[偏序集]{id="math.logic-sets.poset"}都不空，哪些满足:term[佐恩引理]{id="math.logic-sets.zorn-lemma"}的条件，即每条非空的链在其中都有上界？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\N$的所有至多有$5$个元素的子集，按$\subseteq$
      - |
        $\N$的所有由有限个数组成的子集，按$\subseteq$
      - |
        $\N$的所有不等于$\N$的子集，按$\subseteq$
      - |
        $\N^+$，按整除
      - |
        $\N^+$，规定$a\preceq b$当且仅当$b\mid a$
    value: [1, 5]
  hints:
    - |
      先试着找一条越来越大、没有尽头的链，看它有没有上界，上界要在这个偏序集里；找不到，就给任意一条非空的链说出一个上界。
    - |
      A：链里两个不同的集合，元素个数能相同吗？B、C：看$\{0\}$、$\{0,1\}$、$\{0,1,2\}$、……。D：看$1,2,4,8,\dots$。E：有没有一个数$u$，使每个$a$都满足$a\preceq u$？
    - |
      A 满足：链里两个不同的集合，一个真包含另一个，元素个数不同；个数只能是$0$到$5$，所以链里至多有$6$个集合，其中元素最多的包含其余每一个，就是上界。E 满足：$1$整除每个$a$，即每个$a\preceq1$，$1$是任何子集的上界。

      B、C 不满足：$\{0\}$、$\{0,1\}$、$\{0,1,2\}$、……组成链，上界要含有每个自然数，只能是$\N$，它不在 B 里，也不在 C 里。D 不满足：$1,2,4,8,\dots$组成链，上界$u$要是每个$2^k$的倍数，可$0<u<2^u$，$u$不是$2^u$的倍数。所以选 A、E。
  solution: |
    A：链里两个不同的集合，一个真包含另一个，元素个数不同，个数又只能是$0$到$5$，所以链里至多有$6$个集合，元素最多的那个就是上界，满足。E：这个序把整除倒了过来，$1$整除每个数，所以每个$a\preceq1$，$1$是任何子集的上界，满足。

    B、C：$\{0\}$、$\{0,1\}$、$\{0,1,2\}$、……组成链，上界要含有每个自然数，只能是$\N$，它不在这两个偏序集里，不满足。D：$1,2,4,8,\dots$组成链，上界$u$要是每个$2^k$的倍数，可$0<u<2^u$，$u$不是$2^u$的倍数，不满足。选 A、E。

    条件不满足，也可能有极大元：C 里，从$\N$去掉一个数得到的集合都极大，再添就是$\N$了。佐恩引理只说条件满足时一定有。

- id: p4
  tier: medium
  statement: |
    $I=\{1,2,3\}$，$A_1$、$A_2$、$A_3$分别有$2$、$3$、$2$个元素。照讲解里证「由佐恩引理可以推出选择公理」的办法组成:term[偏序集]{id="math.logic-sets.poset"}$P$：它的元素是$(J,f)$，$J$是$I$的非空子集，$f$是$\{A_i\}_{i\in J}$的选择函数；$J\subseteq K$并且$f$、$g$在$J$上处处相同时，规定$(J,f)\preceq(K,g)$。$P$有几个元素，几个:term[极小元]{id="math.logic-sets.minimal-element"}（minimal element），几个:term[极大元]{id="math.logic-sets.maximal-element"}？按（元素个数，极小元个数，极大元个数）的顺序填。
  answer:
    type: tuple
    value: [35, 7, 12]
    exact: true
  hints:
    - |
      $P$的一个元素，就是给三个指标里的一个、两个或三个各挑好了一个元素，别的指标还没挑。先想怎样数得不重不漏；极大的不能再多挑，极小的不能再少挑。
    - |
      把「还没挑」也算作一种情形，指标$1$就有$2+1$种，指标$2$、$3$呢？别忘了去掉三个指标都没挑的。极小元的$J$有几个元素，极大元的$J$是什么？
    - |
      连「还没挑」在内，指标$1$、$2$、$3$各有$3$、$4$、$3$种情形，由乘法原理（multiplication principle）共$3\times4\times3=36$种，去掉三个指标都没挑的$1$种，$P$有$35$个元素。

      $J$不止一个指标时，丢掉一个指标就得到更小的元素，所以极小元的$J$只有一个指标，有$2+3+2=7$个。$J\ne I$时还能再挑一个，所以极大元的$J=I$，有$2\times3\times2=12$个。填$(35,7,12)$。
  solution: |
    每个指标或者还没挑，或者挑好了一个元素，三个指标各有$3$、$4$、$3$种情形。由乘法原理（multiplication principle）共$3\times4\times3=36$种，其中三个都没挑的那一种不算（$J$要非空），所以$P$有$36-1=35$个元素。

    $J$不止一个指标时，丢掉其中一个，就得到比它小的元素；$J$只有一个指标时，没有比它小的。所以极小元有$2+3+2=7$个。$J\ne I$时还能再挑一个，得到比它大的元素；$J=I$时不能再挑，所以极大元就是$\{A_i\}_{i\in I}$的全部选择函数，有$2\times3\times2=12$个。答案是$(35,7,12)$。

- id: p5
  tier: hard
  statement: |
    （1）设策梅洛的说法成立：一些两两不相交的非空集合，总有一个集合，和其中每一个恰有一个公共元素。证明:term[选择公理]{id="math.logic-sets.axiom-of-choice"}：$\{A_i\}_{i\in I}$由非空集合组成（不要求两两不相交）时，它有选择函数。

    （2）设良序定理成立，证明选择公理。

    （3）用:term[佐恩引理]{id="math.logic-sets.zorn-lemma"}证明：非空的偏序集里有极大的链（maximal chain），即不是别的链的真子集（proper subset）的链。
  hints:
    - |
      （1）不同的$A_i$可能有公共元素；先给每个元素做上记号，记下它取自哪一个$A_i$，就分开了。（2）只在一个集合上用一次良序定理，这个集合要装得下所有的$A_i$。（3）把链当作元素，按$\subseteq$排成一个新的偏序集。
    - |
      （1）令$B_i=\{i\}\times A_i$；和$B_i$的公共元素是:term[有序对]{id="math.logic-sets.ordered-pair"}（ordered pair）$(i,a)$，$a$就是给$i$挑的。（2）在$\bigcup_{i\in I}A_i$上取一个良序定理说的全序，每个$A_i$都是它的非空子集。

      （3）取一些非空的链，其中任意两条都一条包含另一条，并起来还是链吗？并里的两个元素各在某一条链里，能不能让它们同在一条链里？
    - |
      （1）对每个$i\in I$，令$B_i=\{i\}\times A_i$，它由所有的有序对$(i,a)$（$a\in A_i$）组成，不空。$i\ne j$时，$B_i$、$B_j$的元素第一个分量不同，所以$B_i\cap B_j=\varnothing$。由策梅洛的说法，有集合$C$和每个$B_i$恰有一个公共元素，它是某个$(i,a)$，$a\in A_i$；令$f(i)=a$，$f$就是$\{A_i\}_{i\in I}$的选择函数。

      由讲解提到的「每个满射都有右逆」（右逆见[复合映射与逆映射](lesson:math.logic-sets.composition-inverse#def-one-sided-inverse)）也这样推：$(i,a)\mapsto i$是从各个$B_i$的并到$I$的满射，它的右逆把每个$i$送到某个$(i,a)$，$a\in A_i$。

      （2）由良序定理，$\bigcup_{i\in I}A_i$上有一个全序，使得按这个序，它的每个非空子集都有最小元。每个$A_i$都是它的非空子集，令$f(i)$为$A_i$的最小元，最小元只有一个，所以$f$是映射，并且$f(i)\in A_i$。

      （3）设$P$是非空的偏序集，$\mathcal L$由$P$的全部非空的链组成，按$\subseteq$排成偏序集。取$x\in P$，$\{x\}$是链，所以$\mathcal L$不空。设$\mathcal K$是$\mathcal L$的非空的链，即$\mathcal K$由$P$的一些非空的链组成，其中任意两条都一条包含另一条；记$U$为$\mathcal K$中各条链的并。

      任取$x,y\in U$，有$C,D\in\mathcal K$使$x\in C$，$y\in D$。$C\subseteq D$时，$x$、$y$都在链$D$里，可比；$D\subseteq C$时同样。所以$U$是$P$的链，它不空，$U\in\mathcal L$，又包含$\mathcal K$中的每一条，是$\mathcal K$的上界。由佐恩引理，$\mathcal L$有极大元$M$：没有比$M$大的非空的链，所以$M$不是别的链的真子集。
  reference: |
    （1）$B_i=\{i\}\times A_i$非空、两两不相交；取$C$，$C\cap B_i$的唯一元素为$(i,f(i))$。（满射有右逆$\Rightarrow$选择公理：$\bigcup_iB_i\to I$，$(i,a)\mapsto i$。）

    （2）在$\bigcup_iA_i$上取一个使每个非空子集都有最小元的全序，$f(i)=\min A_i$；只用一次，之后是统一的规则。

    （3）$\mathcal L$为全体非空链，按$\subseteq$，含$\{x\}$，不空。链$\mathcal K$的并$U$是链：$x\in C$、$y\in D$，$C\subseteq D$或$D\subseteq C$，同在大的那条里，可比。$U$是上界，佐恩引理给极大元；空链不是极大的链（$P$非空），不影响。

    （3）就是豪斯多夫极大原理（Hausdorff maximal principle），它也能推回佐恩引理：极大的链的上界是极大元。

- id: p6
  tier: hard
  statement: |
    设${(P,\preceq)}$是非空的偏序集，每条非空的链都有上界。承认:term[选择公理]{id="math.logic-sets.axiom-of-choice"}，按下面四步证明$P$有极大元。用$\mathcal C$记$P$的全部链（连同空集）组成的集合；对$C\in\mathcal C$，令$E(C)=\{x\in P\setminus C:C\cup\{x\}\text{ 是链}\}$。

    （1）用选择公理造一个映射$g:\mathcal C\to\mathcal C$：$E(C)$不空时，$g(C)$是在$C$里添上$E(C)$的一个元素；$E(C)$是空集时，$g(C)=C$。再证明：若$g(M)=M$，则$M$不空，并且$M$的每个上界都是$P$的极大元。

    （2）$\mathcal C$的子集$\mathcal T$满足下面三条时，本题里叫作塔（tower）：$\varnothing\in\mathcal T$；$C\in\mathcal T$时，$g(C)\in\mathcal T$；$\mathcal T$的非空子集$\mathcal K$中任意两个集合都一个包含另一个时，$\mathcal K$中各集合的并属于$\mathcal T$。证明$\mathcal C$是塔，全部塔的:term[交]{id="math.logic-sets.family-intersection"}（intersection of a family）$\mathcal T_0$也是塔。

    （3）证明$\mathcal T_0$中任意两个集合，一个包含另一个。

    （4）记$M$为$\mathcal T_0$中各集合的并。证明$g(M)=M$，由此得出$P$有极大元。
  hints:
    - |
      $\mathcal T_0$就是讲解里说的「从空链出发一直添」得到的那些链，（3）说其中任意两条，一条包含另一条。（1）要证$u$极大，设有比$u$大的$v$，看$M\cup\{v\}$。（2）三条对每个塔都成立，对交呢？

      （3）$\mathcal T_0$包含于每个塔：$\mathcal T_0$的子集只要是塔，就是整个$\mathcal T_0$。（4）$M$自己在不在$\mathcal T_0$里？
    - |
      （1）对$E(C)$不空的那些$C$，给集族$\{E(C)\}$取一个选择函数。$g(C)$至多比$C$多一个元素，后面要用。（2）并里的两个元素，同在较大的那条链里。

      （3）若每个$A\in\mathcal T_0$都满足$A\subseteq C$或$C\subseteq A$，就说$C$是好的。先证：$C$是好的时，满足「$A\subseteq C$或$g(C)\subseteq A$」的$A$组成塔，所以每个$A\in\mathcal T_0$都这样；再证好的集合组成塔。

      （4）由（3）和塔的第三条，$M\in\mathcal T_0$，于是$g(M)\in\mathcal T_0$。
    - |
      （1）集族$\{E(C)\}$的指标取遍使$E(C)$不空的$C$，由选择公理，它有选择函数$e$，$e(C)\in E(C)$。$E(C)$不空时令$g(C)=C\cup\{e(C)\}$，它是链；$E(C)$是空集时令$g(C)=C$。所以$g$是$\mathcal C\to\mathcal C$的映射，总有$C\subseteq g(C)$，$g(C)$至多比$C$多一个元素。

      设$g(M)=M$，则$E(M)$是空集，不然$g(M)$比$M$多一个元素。$P$不空，取$x\in P$，$\{x\}$是链，$E(\varnothing)$不空，所以$M\ne\varnothing$。设$u$是$M$的上界，假如有$v\in P$使$u\prec v$：$M$的每个元素都不超过$u$，也就不超过$v$，所以$M\cup\{v\}$是链；$v\notin M$，否则$v\preceq u$。于是$v\in E(M)$，和$E(M)$是空集矛盾，所以$u$是极大元。

      （2）先看$\mathcal C$：$\varnothing\in\mathcal C$；$C\in\mathcal C$时，$g(C)\in\mathcal C$。设$\mathcal K$是$\mathcal C$的非空子集，其中任意两个都一个包含另一个：并里的两个元素各在$\mathcal K$的某条链里，也就同在较大的那条里，可比，所以并是链，属于$\mathcal C$。于是$\mathcal C$是塔，至少有一个塔，交取得成。

      再看$\mathcal T_0$。$\varnothing$属于每个塔；$C$属于每个塔时，$g(C)$也属于每个塔；$\mathcal K\subseteq\mathcal T_0$时，$\mathcal K$包含于每个塔，它的并也属于每个塔。所以$\mathcal T_0$是塔，并且包含于每个塔；$\mathcal T_0$的子集要是塔，就等于$\mathcal T_0$。

      （3）设$C\in\mathcal T_0$，若每个$A\in\mathcal T_0$都满足$A\subseteq C$或$C\subseteq A$，就说$C$是好的。要证$\mathcal T_0$中的集合都是好的。先证：$C$是好的时，每个$A\in\mathcal T_0$都满足$A\subseteq C$或$g(C)\subseteq A$。用$\mathcal U$记$\mathcal T_0$中满足它的$A$组成的集合，证$\mathcal U$是塔就行。

      $\varnothing\subseteq C$，所以$\varnothing\in\mathcal U$。设$A\in\mathcal U$：若$g(C)\subseteq A$，则$g(C)\subseteq g(A)$；若$A=C$，则$g(A)=g(C)$；剩下的是$A\subsetneq C$。这时$C$是好的，所以$g(A)\subseteq C$或$C\subseteq g(A)$；后者成立时，$A\subsetneq C\subseteq g(A)$，而$g(A)$至多比$A$多一个元素，所以$C=g(A)$，也有$g(A)\subseteq C$。三种情形都有$g(A)\in\mathcal U$。

      设$\mathcal K$是$\mathcal U$的非空子集，其中任意两个都一个包含另一个，它的并在$\mathcal T_0$里。$\mathcal K$中的集合都包含于$C$时，并包含于$C$；否则有一个$K\in\mathcal K$使$g(C)\subseteq K$，并包含$g(C)$。所以并属于$\mathcal U$，$\mathcal U$是塔，$\mathcal U=\mathcal T_0$。

      再证全部好的集合组成塔。$\varnothing$包含于每个集合，是好的。设$C$是好的，由刚证的，每个$A\in\mathcal T_0$都满足$A\subseteq C\subseteq g(C)$或$g(C)\subseteq A$，所以$g(C)$是好的。

      设$\mathcal K$由好的集合组成，不空，其中任意两个都一个包含另一个，它的并在$\mathcal T_0$里；任取$A\in\mathcal T_0$。$\mathcal K$中的集合都包含于$A$时，并包含于$A$；否则有一个$K\in\mathcal K$不包含于$A$，$K$是好的，所以$A\subseteq K$，$A$包含于并。于是并是好的。好的集合组成塔，所以$\mathcal T_0$中的集合都是好的，（3）得证。

      （4）$\mathcal T_0$不空，由（3），其中任意两个集合都一个包含另一个，在塔的第三条里取$\mathcal K=\mathcal T_0$，就有$M\in\mathcal T_0$。于是$g(M)\in\mathcal T_0$，$g(M)\subseteq M$；又有$M\subseteq g(M)$，所以$g(M)=M$。由（1），$M$是非空的链，由条件它有上界，这个上界就是$P$的极大元。
  reference: |
    （1）对$\{E(C)\}$（$E(C)\ne\varnothing$的$C$）用一次选择公理。$g(M)=M\iff E(M)=\varnothing$。$M\ne\varnothing$因为$E(\varnothing)=P\ne\varnothing$。上界$u$、$u\prec v$给出$v\in E(M)$，矛盾。

    （2）$\mathcal C$满足三条（链的并是链）；塔的交满足三条；$\mathcal T_0$是最小的塔。

    （3）好：与$\mathcal T_0$中每个集合可比。引理：$C$好$\Rightarrow$每个$A\in\mathcal T_0$有$A\subseteq C$或$g(C)\subseteq A$（这样的$A$组成塔；关键是$A\subsetneq C\subseteq g(A)$时$C=g(A)$，用到$g(A)$至多多一个元素）。于是$g(C)$好；好的集合的并也好；好的集合组成塔，等于$\mathcal T_0$。

    （4）$M\in\mathcal T_0$，$g(M)\subseteq M\subseteq g(M)$，再用（1）。

    选择公理只在（1）用了一次，（2）到（4）没有再挑。这是策梅洛、克内泽尔（Kneser）的论证，Halmos《朴素集合论》用它证佐恩引理；先得到不能再长的链（豪斯多夫极大原理），再取上界。另一种证法用良序和超限递归，本站没有讲。

- id: p7
  tier: thinking
  statement: |
    设$X$是非空集合，对每个$x\in X$都给定了一个非空的$B_x\subseteq X$。想要一列$x_0,x_1,x_2,\dots$，各项都在$X$里，并且每个$x_{n+1}\in B_{x_n}$。

    （1）有人说：「取$x_0\in X$，再取$x_1\in B_{x_0}$，再取$x_2\in B_{x_1}$，依此类推。」用:term[数学归纳法]{id="math.logic-sets.mathematical-induction"}（mathematical induction），能由此证出什么？为什么还得不出想要的那一列？

    （2）用:term[选择公理]{id="math.logic-sets.axiom-of-choice"}和[递归定理](lesson:math.logic-sets.peano-axioms#thm-recursion)（recursion theorem）证明这样的一列存在。选择公理用了几次，用在哪个集族上？

    （3）讲解里说，证海涅定理的后一半，靠的是指标集为正整数集的选择公理。这里为什么不直接对集族$\{B_{x_n}\}_{n\in\N}$用它？

    （4）设非空的偏序集${(P,\preceq)}$没有极大元，由（2）说明$P$里有一列$x_0\prec x_1\prec x_2\prec\cdots$。由此说出一个保证非空的偏序集有极大元的条件，不提链，也不提上界。
  hints:
    - |
      （1）把归纳证明的那句话写出来，看它说的是「有一列」，还是「对每个$n$，有一串」。（2）出发以前，把每一步怎么走都定好。（3）对一个集族用选择公理，这个集族先得给定。（4）让$B_x$由比$x$大的元素组成。
    - |
      （1）归纳证的是：对每个$n$，有一串$x_0,x_1,\dots,x_n$，每一项都取自前一项给出的集合。不同的$n$，用的是不是同一串？（2）$\{B_x\}_{x\in X}$的选择函数$g$是$X\to X$的映射，递归定理里的起点和规则就都有了。

      （3）$B_{x_1}$是$X$的哪一个子集，要等什么取定了才知道？证海涅定理时，第$n$个集合呢？（4）没有极大元，是说每个$x$都有比它大的元素。
    - |
      （1）能证出：对每个$n\in\N$，有一串$x_0,x_1,\dots,x_n$，使$k<n$时都有$x_{k+1}\in B_{x_k}$。$n=0$时取一个$x_0\in X$；设$n$时有这样一串，$B_{x_n}$不空，取一个$x_{n+1}\in B_{x_n}$接上，$n+1$时也有了。可不同的$n$可以用完全不同的串。「对每个$n$，有一串」推不出「有一列，对每个$n$都管用」，量词（quantifier）的次序不能这样换，见[多重量词](lesson:math.logic-sets.nested-quantifiers#thm-quantifier-order)。

      （2）$\{B_x\}_{x\in X}$由非空集合组成，由选择公理，它有选择函数$g$。$g(x)\in B_x\subseteq X$，$g$可以看作$X\to X$的映射。取一个$x_0\in X$，由递归定理，有映射$h:\N\to X$，使$h(0)=x_0$，并且每个$n$都有$h(n+1)=g(h(n))$；令$x_n=h(n)$，就有$x_{n+1}=g(x_n)\in B_{x_n}$。选择公理只用了一次，用在$\{B_x\}_{x\in X}$上；取$x_0$是从一个非空集合里取一个元素，用不着它。

      （3）证海涅定理时，第$n$个集合事先就定好了，和前面取了哪些数无关，指标集为正整数集的集族是现成的。这里$B_{x_1}$是哪一个子集，要等$x_1$取定才知道，$x_1$又要从$B_{x_0}$里取；$\{B_{x_n}\}_{n\in\N}$要等整列都有了才写得出，而这一列正是要证存在的。第（2）问改成给所有的$x\in X$一次挑好，走不到的也先挑好，$\{B_x\}_{x\in X}$是现成的，剩下的只是照规则走。

      （4）令$B_x=\{y\in P:x\prec y\}$。$P$没有极大元，每个$B_x$都不空，在（2）里取$X=P$，就得到一列$x_n$，每个$x_{n+1}\in B_{x_n}$，即$x_n\prec x_{n+1}$。也就是说，非空的偏序集里要是没有这样一列，就一定有极大元；有限的偏序集就是这样，这一列的各项互不相同，有限个元素排不出来。
  reference: |
    （1）归纳得$\forall n\,\exists$长为$n+1$的串，得不到$\exists$一列$\forall n$。不同$n$的串不必相容。

    （2）$g$是$\{B_x\}_{x\in X}$的选择函数，递归定理取$c=x_0$、规则$g$。选择公理用一次，对整个$X$。

    （3）$\{B_{x_n}\}$不是事先给定的族：$x_{n+1}$依赖$x_n$。海涅定理里的族$\{x:0<|x-a|<\frac1n,\ |f(x)-L|\ge\varepsilon_0\}$事先给定。这正是依赖选择公理（axiom of dependent choice）与可数选择公理的差别，前者更强；不要求说出名字。

    （4）$B_x=\{y:x\prec y\}$。条件：没有无穷的严格上升列（升链条件）。反过来不必：有极大元的偏序集里也可以有严格上升列，如在$\N$外添一个最大元。

- id: p8
  tier: thinking
  statement: |
    良序定理说，每个集合上都有一个:term[全序]{id="math.logic-sets.total-order"}，使得按这个序，每个非空子集都有:term[最小元]{id="math.logic-sets.least-element"}。

    （1）在$\N\times\N$上规定$(a,b)\preceq(c,d)$当且仅当$a<c$，或者$a=c$且$b\le d$；照[偏序与全序](lesson:math.logic-sets.partial-orders)例 1 (2)，它是全序。证明按这个序，每个非空子集都有最小元，并由此给$\N\times\N$的全体非空子集写出一个选择函数。

    （2）$\Q$按$\le$为什么不是这样的序？在$\Q$上写出一个这样的全序。

    （3）$\N$按$\le$，每个数前面只有有限个数。按（1）的序，$(1,0)$前面有多少个元素？能不能把$\N\times\N$的元素和自然数一个对一个地配起来，排在前面的总配到较小的数？你在（2）里写的序呢？

    （4）有人说：「由良序定理，$\R$上有这样的序，所以能把全体实数从第一个、第二个、第三个起，一个不漏地排成一列。」这句话错在哪里？
  hints:
    - |
      （1）先比第一个分量，再比第二个，每次都是在一些自然数里取最小的。（2）要说不是，找一个没有最小元的非空子集；要写出一个，先给每个有理数配一个正整数，使同一个正整数只配给有限个有理数。（3）写出$(1,0)$前面的元素。（4）按（1）的序，从第一个起一个一个数，数得到每一个吗？
    - |
      （1）设$S$是非空子集，$S$中第一个分量最小的是$a$；第一个分量是$a$的那些元素里，第二个分量最小的是$b$。（2）看全体正有理数；每个有理数写成最简分数$\frac pq$（$q>0$），$|p|+q$取同一个值的只有有限个。

      （3）若$(1,0)$配到$n$，它前面的元素都要配到比$n$小的数，比$n$小的数有几个？（4）「每个非空子集都有最小元」有没有说，每个元素前面只有有限个元素？
    - |
      （1）设$S$是$\N\times\N$的非空子集。由良序原理（每个数加$1$化成正整数），$S$中元素的第一个分量里有最小的，记作$a$；第一个分量是$a$的那些元素，第二个分量里有最小的，记作$b$。任取$(c,d)\in S$，则$a\le c$；$a<c$时$(a,b)\preceq(c,d)$，$a=c$时$b\le d$，也有$(a,b)\preceq(c,d)$。所以$(a,b)$是$S$的最小元；把每个非空子集送到它的最小元，就是一个选择函数。

      （2）全体正有理数里没有最小的，$x>0$时$\frac x2$更小。每个有理数恰有一种写法$\frac pq$，$p$、$q$是整数，$q>0$，没有大于$1$的公因数；规定先比$|p|+q$，小的在前，相同时再比$p$，小的在前。$|p|+q$和$p$都相同，就是同一个数，所以这是全序。$S$是非空子集时，$S$中各数的$|p|+q$里有最小的，取到它的只有有限个数，其中$p$最小的就是$S$的最小元。

      （3）$(0,0),(0,1),(0,2),\dots$都在$(1,0)$前面，有无穷多个。配不起来：若$(1,0)$配到$n$，这无穷多个元素要配到比$n$小的不同的数，可比$n$小的自然数只有$n$个。第（2）问里的序配得起来：每个有理数前面只有有限个数，前面恰有$k$个数的配到$k$，排在最前面的$0$配到$0$。你写的序，要是每个数前面都只有有限个，也配得起来。

      （4）从第一个起，第二个、第三个……确实都有，每次都是剩下的里面的最小元；可这样数下去，未必数得到每一个。按（1）的序，从第一个起依次数出$(0,0),(0,1),(0,2),\dots$，永远数不到$(1,0)$。良序定理没有说每个元素前面只有有限个元素，由它推不出实数能排成一列。实数能不能排成一列是另一回事，见[不可数集与对角线论证](lesson:math.logic-sets.uncountable-sets)。
  reference: |
    （1）先取第一分量的最小值$a$，再在第一分量为$a$的元素中取第二分量的最小值$b$。选择函数：取最小元。

    （2）正有理数无最小元。例如按$(|p|+q,\ p)$比，每一档$|p|+q=s$只有有限个（$|p|<s$，$q=s-|p|$）。

    （3）无穷多个；配不起来（$(1,0)$前面要塞进$n$个位置）。（2）的序每个元素前面有限，从小到大配成$\N$。

    （4）「每个非空子集有最小元」给出第一个、第二个、……，但不保证有限步走到每个元素；（1）的序就是反例。所以使每个非空子集都有最小元的全序不止一种样子，它们的分类（序数）不讲。若（4）的推理对，$\R$就可数了，与不可数矛盾。
