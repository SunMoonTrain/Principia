<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" width="680" height="190" font-size="14">
  <!-- 六个互不相交的椭圆（一族两两不相交的非空集合），每个里面有几个圆点；强调色的带子 C 依次经过每个椭圆，在每个椭圆里恰好盖住一个点（强调色），别的点离带子的中线都在 27 像素以上；右端三个小点表示后面还有 -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <ellipse cx="92" cy="96" rx="46" ry="64" />
    <ellipse cx="196" cy="82" rx="38" ry="50" />
    <ellipse cx="296" cy="100" rx="42" ry="68" />
    <ellipse cx="396" cy="78" rx="36" ry="46" />
    <ellipse cx="492" cy="104" rx="40" ry="64" />
    <ellipse cx="584" cy="86" rx="34" ry="52" />
  </g>
  <!-- 带子 C -->
  <path d="M 34 106 C 44.7 107.0, 71.7 116.7, 98 112 C 124.3 107.3, 158.3 77.0, 192 78 C 225.7 79.0, 266.3 119.3, 300 118 C 333.7 116.7, 362.0 71.0, 394 70 C 426.0 69.0, 460.7 109.7, 492 112 C 523.3 114.3, 558.0 86.3, 582 84 C 606.0 81.7, 627.0 95.7, 636 98" fill="none" stroke-width="18" stroke-linecap="round" stroke-opacity="0.22" style="stroke: var(--accent, #2563eb)" />
  <!-- 没有挑中的点 -->
  <g fill="currentColor">
    <circle cx="76" cy="68" r="4" />
    <circle cx="106" cy="62" r="4" />
    <circle cx="80" cy="142" r="4" />
    <circle cx="206" cy="52" r="4" />
    <circle cx="188" cy="112" r="4" />
    <circle cx="282" cy="64" r="4" />
    <circle cx="310" cy="78" r="4" />
    <circle cx="284" cy="152" r="4" />
    <circle cx="404" cy="106" r="4" />
    <circle cx="482" cy="66" r="4" />
    <circle cx="510" cy="76" r="4" />
    <circle cx="486" cy="150" r="4" />
    <circle cx="592" cy="54" r="4" />
    <circle cx="578" cy="118" r="4" />
  </g>
  <!-- 挑中的点 -->
  <g style="fill: var(--accent, #2563eb)">
    <circle cx="98" cy="112" r="5.5" />
    <circle cx="192" cy="78" r="5.5" />
    <circle cx="300" cy="118" r="5.5" />
    <circle cx="394" cy="70" r="5.5" />
    <circle cx="492" cy="112" r="5.5" />
    <circle cx="582" cy="84" r="5.5" />
  </g>
  <!-- 后面还有 -->
  <g fill="currentColor">
    <circle cx="654" cy="88" r="2.2" />
    <circle cx="664" cy="88" r="2.2" />
    <circle cx="674" cy="88" r="2.2" />
  </g>
  <text x="12" y="111" font-size="17" font-style="italic" text-anchor="middle" style="fill: var(--accent, #2563eb)">C</text>
</svg>
