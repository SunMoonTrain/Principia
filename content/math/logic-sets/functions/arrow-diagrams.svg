<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 252" width="600" height="252" font-size="14">
  <!-- 三幅箭头图，左边的椭圆是 A = {1, 2, 3}，右边的椭圆是 B = {a, b, c, d}。左：1、2 都指向 a，3 指向 c，是映射，像集 {a, c} 的元素用强调色；中：1 同时指向 a、b（强调色），不是映射；右：3 没有箭头（3 用强调色），不是映射 -->
  <!-- 第 1 幅 -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <ellipse cx="50" cy="112" rx="27" ry="70" />
    <ellipse cx="150" cy="112" rx="27" ry="70" />
  </g>
  <g fill="currentColor" font-size="16" font-style="italic" text-anchor="middle">
    <text x="50" y="30">A</text>
    <text x="150" y="30">B</text>
  </g>
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="50" y="83">1</text>
    <text x="50" y="117">2</text>
    <text x="50" y="151">3</text>
    <text x="150" y="100" font-style="italic">b</text>
    <text x="150" y="168" font-style="italic">d</text>
  </g>
  <g font-size="15" text-anchor="middle" style="fill: var(--accent, #2563eb)">
    <text x="150" y="66" font-style="italic">a</text>
    <text x="150" y="134" font-style="italic">c</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="59" y1="78" x2="132.23" y2="59.92" />
    <line x1="59" y1="112" x2="133.12" y2="68.08" />
    <line x1="59" y1="146" x2="132.17" y2="130.64" />
  </g>
  <g fill="currentColor">
    <polygon points="140,58 133.1,63.41 131.37,56.42" />
    <polygon points="140,64 134.95,71.18 131.28,64.98" />
    <polygon points="140,129 132.91,134.17 131.43,127.12" />
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="100" y="216">是映射：像集 {<tspan font-style="italic">a</tspan>, <tspan font-style="italic">c</tspan><tspan dx="2">}</tspan></text>
    <text x="100" y="239">陪域 {<tspan font-style="italic">a</tspan>, <tspan font-style="italic">b</tspan>, <tspan font-style="italic">c</tspan>, <tspan font-style="italic">d</tspan><tspan dx="2">}</tspan></text>
  </g>
  <!-- 第 2 幅 -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <ellipse cx="250" cy="112" rx="27" ry="70" />
    <ellipse cx="350" cy="112" rx="27" ry="70" />
  </g>
  <g fill="currentColor" font-size="16" font-style="italic" text-anchor="middle">
    <text x="250" y="30">A</text>
    <text x="350" y="30">B</text>
  </g>
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="250" y="83">1</text>
    <text x="250" y="117">2</text>
    <text x="250" y="151">3</text>
    <text x="350" y="66" font-style="italic">a</text>
    <text x="350" y="100" font-style="italic">b</text>
    <text x="350" y="134" font-style="italic">c</text>
    <text x="350" y="168" font-style="italic">d</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="259" y1="112" x2="332.17" y2="127.36" />
    <line x1="259" y1="146" x2="332.17" y2="161.36" />
  </g>
  <g fill="currentColor">
    <polygon points="340,129 331.43,130.88 332.91,123.83" />
    <polygon points="340,163 331.43,164.88 332.91,157.83" />
  </g>
  <g stroke-width="1.6" style="stroke: var(--accent, #2563eb)">
    <line x1="259" y1="75" x2="332.12" y2="62.36" />
    <line x1="259" y1="81" x2="332.12" y2="93.64" />
  </g>
  <g style="fill: var(--accent, #2563eb)">
    <polygon points="340,61 332.73,65.91 331.5,58.82" />
    <polygon points="340,95 331.5,97.18 332.73,90.09" />
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="300" y="216">不是映射：</text>
    <text x="300" y="239">1 对应了两个元素</text>
  </g>
  <!-- 第 3 幅 -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <ellipse cx="450" cy="112" rx="27" ry="70" />
    <ellipse cx="550" cy="112" rx="27" ry="70" />
  </g>
  <g fill="currentColor" font-size="16" font-style="italic" text-anchor="middle">
    <text x="450" y="30">A</text>
    <text x="550" y="30">B</text>
  </g>
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="450" y="83">1</text>
    <text x="450" y="117">2</text>
    <text x="550" y="66" font-style="italic">a</text>
    <text x="550" y="100" font-style="italic">b</text>
    <text x="550" y="134" font-style="italic">c</text>
    <text x="550" y="168" font-style="italic">d</text>
  </g>
  <g font-size="15" text-anchor="middle" style="fill: var(--accent, #2563eb)">
    <text x="450" y="151">3</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="459" y1="78" x2="532.17" y2="62.64" />
    <line x1="459" y1="112" x2="532.17" y2="96.64" />
  </g>
  <g fill="currentColor">
    <polygon points="540,61 532.91,66.17 531.43,59.12" />
    <polygon points="540,95 532.91,100.17 531.43,93.12" />
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="500" y="216">不是映射：</text>
    <text x="500" y="239">3 没有对应的元素</text>
  </g>
</svg>
