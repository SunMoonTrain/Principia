- id: p1
  tier: easy
  statement: |
    下面每一条都规定了一个对应，前一个集合当定义域，后一个集合当陪域。哪些是:term[映射]{id="math.logic-sets.map"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        从$\Q$到$\Z$：把有理数$\frac pq$（$p$、$q$是整数，$q>0$）对应到$p$
      - |
        从$\Z$到$\Z$：$n\mapsto\frac n2$
      - |
        从$\R$到$\R$：$x\mapsto|x|$
      - |
        从$\N$到$\N$：$n\mapsto n^2$
      - |
        从$\R$到$\R$：$x\mapsto\sqrt x$
    value: [3, 4]
  hints:
    - |
      逐条查两件事：前一个集合的每个元素都有对应的元素吗？对应的元素是不是只有一个，并且在后一个集合里？
    - |
      A：同一个有理数能写成几个这样的分数？B：$n=1$对应的是什么数？E：$x=-1$对应什么？
    - |
      A：$\frac12=\frac24$，同一个有理数既对应$1$又对应$2$，不是映射。B：$1\mapsto\frac12$，而$\frac12\notin\Z$，不是映射。C：每个实数恰有一个绝对值，它还是实数，是映射。

      D：自然数的平方还是自然数，是映射。E：$-1$没有实数平方根，没有对应的元素，不是映射。所以选 C、D。
  solution: |
    A 不是映射：$\frac12$和$\frac24$是同一个有理数，按规定却分别对应$1$和$2$，这个有理数对应了两个整数。B 不是映射：$1$对应$\frac12$，不在陪域$\Z$里。

    C 是映射：每个实数$x$恰有一个绝对值$|x|$，它是实数。D 是映射：每个自然数$n$恰有一个平方$n^2$，仍是自然数。E 不是映射：负数没有实数平方根，例如$-1$没有对应的元素。选 C、D。

- id: p2
  tier: easy
  statement: |
    设$f:[-1,3]\to\R$，$f(x)=|x-1|$。$f$的:term[像集]{id="math.logic-sets.range"}是闭区间$[m,M]$，按$(m,M)$的顺序填。
  answer:
    type: tuple
    value: [0, 2]
    exact: true
  hints:
    - |
      像集是$f$实际取到的值组成的集合。$x$取遍$[-1,3]$时，$x-1$在什么范围里？
    - |
      $x-1$取遍$[-2,2]$，它的绝对值最小是多少、最大是多少？两端都取得到吗？
    - |
      $x\in[-1,3]$时$-2\le x-1\le2$，所以$0\le|x-1|\le2$，像集包含于$[0,2]$。反过来，任取$y\in[0,2]$，令$x=1+y$，则$x\in[1,3]$，$f(x)=|y|=y$，所以$[0,2]$包含于像集。像集是$[0,2]$，填$(0,2)$。
  solution: |
    $x\in[-1,3]$时$-2\le x-1\le2$，所以$f(x)=|x-1|\in[0,2]$，即$f([-1,3])\subseteq[0,2]$。

    反过来，任取$y\in[0,2]$，取$x=1+y\in[1,3]$，则$f(x)=y$，所以$[0,2]\subseteq f([-1,3])$。两边互相包含，像集是$[0,2]$，答案是$(0,2)$。

- id: p3
  tier: medium
  statement: |
    从$\{1,2,3,4\}$到$\{1,2,3\}$的:term[映射]{id="math.logic-sets.map"}中，:term[像集]{id="math.logic-sets.range"}恰好是$\{1,2,3\}$的有几个？
  answer:
    type: number
    value: 36
    exact: true
  hints:
    - |
      像集是$\{1,2,3\}$，就是$1$、$2$、$3$都要是某个元素的像。$4$个元素的像落在$3$个值上，每个值至少被取一次，取的次数怎样分配？
    - |
      $4$个元素分给$3$个值、每个值至少一个，只能是一个值被两个元素取到，另外两个值各被一个元素取到。先选被取两次的值，再选取到它的两个元素，剩下两个元素怎样配给另外两个值？
    - |
      被取两次的值有$3$种选法；取到它的两个元素从$4$个里选，有$\frac{4\times3}{2}=6$种选法；剩下两个元素分别取另外两个值，有$2$种配法。不同的选法给出不同的映射，由乘法原理，一共$3\times6\times2=36$个。
  solution: |
    像集恰好是$\{1,2,3\}$，就是$1$、$2$、$3$都被取到。$4$个元素分给$3$个值、每个值至少一个，次数只能是$2$、$1$、$1$：恰有一个值被两个元素取到。

    这个值有$3$种选法，取到它的两个元素有$\frac{4\times3}{2}=6$种选法，剩下两个元素配给另外两个值有$2$种配法。不同的选法给出不同的映射，每个这样的映射也都由一种选法得到，由乘法原理共$3\times6\times2=36$个。

- id: p4
  tier: medium
  statement: |
    下面每一组给出两个:term[映射]{id="math.logic-sets.map"}$f$、$g$。哪几组里$f=g$？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $f:\R\to\R$，$f(x)=\sqrt{x^2}$；$g:\R\to\R$，$g(x)=|x|$
      - |
        $f:\{0,1\}\to\R$，$f(x)=x^2$；$g:\{0,1\}\to\R$，$g(x)=x$
      - |
        $f:\R\to\R$，$f(x)=x^3$；$g:\R\to\R$，$g(x)=x$
      - |
        $f:[0,1]\to\R$，$f(x)=x$；$g:[0,2]\to\R$，$g(x)=x$
      - |
        $f:\R\to\R$，$f(x)=(x+1)^2-x^2$；$g:\R\to\R$，$g(x)=2x+1$
    value: [1, 2, 5]
  hints:
    - |
      两个映射相等，要:term[定义域]{id="math.logic-sets.domain"}相同、:term[陪域]{id="math.logic-sets.codomain"}相同，并且定义域里的每个$x$都有$f(x)=g(x)$；式子长得不一样没关系。
    - |
      D 先看定义域。B 的定义域只有两个元素，逐个代入。C 找一个$x$使$x^3\ne x$。A、E 把$f$的式子化简。
    - |
      A：对每个实数$x$，$\sqrt{x^2}=|x|$，定义域、陪域也相同，$f=g$。B：$0^2=0$，$1^2=1$，定义域里只有这两个数，$f=g$。C：$f(2)=8$，$g(2)=2$，$f\ne g$。

      D：定义域$[0,1]$和$[0,2]$不同，$f\ne g$。E：$(x+1)^2-x^2=2x+1$对每个实数成立，$f=g$。选 A、B、E。
  solution: |
    A、B、C、E 的两个映射定义域、陪域都相同，只要逐点比较。A：$\sqrt{x^2}=|x|$对每个实数成立，相等。B：$0^2=0$，$1^2=1$，相等，尽管在$\R$上$x^2$和$x$不是一回事。C：$2^3=8\ne2$，不相等。

    D 的定义域不同，不相等，尽管在$[0,1]$上两者的值一样。E：展开得$(x+1)^2-x^2=2x+1$，相等。选 A、B、E。

- id: p5
  tier: hard
  statement: |
    设$A$、$B$是集合，$G$是:term[笛卡儿积]{id="math.logic-sets.cartesian-product"}$A\times B$的:term[子集]{id="math.logic-sets.subset"}。证明：$G$是某个:term[映射]{id="math.logic-sets.map"}$f:A\to B$的图像$\{(x,f(x)):x\in A\}$，当且仅当每个$x\in A$都恰有一个$y\in B$使$(x,y)\in G$。再证明条件成立时，图像是$G$的映射$f:A\to B$只有一个。
  hints:
    - |
      两个方向分开证，「恰有一个」拆成「至少一个」和「至多一个」。反方向要自己造出$f$：每个$x$该对应到哪个$y$？
    - |
      若$G$是$f$的图像、$(x,y)\in G$，则有$x'\in A$使$(x,y)=(x',f(x'))$，由:term[有序对]{id="math.logic-sets.ordered-pair"}相等的规定得$x=x'$、$y=f(x)$。反方向：把那个唯一的$y$记作$f(x)$，先说明$f$是映射，再证它的图像和$G$互相包含。只有一个：设$f$、$g$的图像都是$G$，看$(x,g(x))$。
    - |
      设$G=\{(x,f(x)):x\in A\}$，任取$x\in A$。$(x,f(x))\in G$，所以至少有一个$y$。若$(x,y)\in G$，则有$x'\in A$使$(x,y)=(x',f(x'))$，由有序对相等的规定$x=x'$，$y=f(x')=f(x)$，所以至多有一个。

      反过来，设每个$x\in A$都恰有一个$y\in B$使$(x,y)\in G$，把这个$y$记作$f(x)$。于是$A$的每个元素都恰好对应$B$的一个元素，$f:A\to B$是映射。图像的元素$(x,f(x))$按$f(x)$的取法属于$G$；反过来，若$(x,y)\in G$，则$x\in A$，由唯一性$y=f(x)$，$(x,y)$属于图像。两边互相包含，$G$就是$f$的图像。

      最后证只有一个。设$f:A\to B$、$g:A\to B$的图像都是$G$，任取$x\in A$，$(x,g(x))$属于$g$的图像，也就属于$f$的图像，由第一段证的「至多一个」得$g(x)=f(x)$。两者定义域、陪域都相同，在每一点的值也相同，所以$f=g$。
  reference: |
    （⇒）设$G=\{(x,f(x)):x\in A\}$。对$x\in A$，$(x,f(x))\in G$；若$(x,y)\in G$，则$(x,y)=(x',f(x'))$，由有序对相等的规定$x=x'$、$y=f(x)$。故恰有一个$y$。

    （⇐）令$f(x)$为那个唯一的$y$，则$f:A\to B$是映射。$(x,f(x))\in G$；若$(x,y)\in G$，则$x\in A$且$y=f(x)$。故$G=\{(x,f(x)):x\in A\}$。

    唯一性：$f$、$g$的图像都是$G$时，$(x,g(x))\in G$，由（⇒）得$g(x)=f(x)$；定义域、陪域相同，故$f=g$。关键是用有序对相等的规定把$(x,y)=(x',f(x'))$拆成两个等式。

- id: p6
  tier: hard
  statement: |
    设$f:\R\to\R$，$f(x)=\frac{x}{1+|x|}$。证明$f$的:term[像集]{id="math.logic-sets.range"}是开区间$(-1,1)$。
  hints:
    - |
      证两个集合相等，就证互相包含：每个$f(x)$都在$(-1,1)$里；$(-1,1)$里的每个$y$都有$x$使$f(x)=y$。
    - |
      $|f(x)|=\frac{|x|}{1+|x|}$，分子比分母小。解$f(x)=y$时，$f(x)$和$x$同号，可以先设$y\ge0$解出$x$，再看$y<0$；两种情形能合写成$x=\frac{y}{1-|y|}$。
    - |
      先证$f(\R)\subseteq(-1,1)$。任取$x\in\R$，分子$|x|$比分母$1+|x|$小，所以$|f(x)|=\frac{|x|}{1+|x|}<1$，$f(x)\in(-1,1)$。

      再证$(-1,1)\subseteq f(\R)$。任取$y\in(-1,1)$，这时$1-|y|>0$，令$x=\frac{y}{1-|y|}$，则$|x|=\frac{|y|}{1-|y|}$，$1+|x|=\frac{1}{1-|y|}$。于是$f(x)=\frac{y}{1-|y|}\cdot(1-|y|)=y$。

      两边互相包含，所以$f$的像集是$(-1,1)$。
  reference: |
    $|f(x)|=\frac{|x|}{1+|x|}<1$，故$f(\R)\subseteq(-1,1)$。

    对$y\in(-1,1)$，令$x=\frac{y}{1-|y|}$（$1-|y|>0$），则$|x|=\frac{|y|}{1-|y|}$，$1+|x|=\frac1{1-|y|}$，$f(x)=y$，故$(-1,1)\subseteq f(\R)$。

    两边互相包含，像集是$(-1,1)$。关键是反解时注意$f(x)$与$x$同号，用$|y|$把两种情形合成一个式子。

- id: p7
  tier: thinking
  statement: |
    有的书把:term[映射]{id="math.logic-sets.map"}直接定义成它的图像：$A\times B$的子集$G$，只要每个$x\in A$都恰有一个$y\in B$使$(x,y)\in G$，$G$本身就叫作从$A$到$B$的一个映射。

    （1）照这种定义，$\R\to\R$的$x\mapsto x^2$和$\R\to[0,+\infty)$的$x\mapsto x^2$还是两个映射吗？

    （2）只给出集合$G$、不告诉你$A$和$B$，能从$G$读出:term[定义域]{id="math.logic-sets.domain"}吗？能读出:term[像集]{id="math.logic-sets.range"}吗？能读出:term[陪域]{id="math.logic-sets.codomain"}吗？

    （3）照这种定义，「像集是否等于陪域」这个问题还说得清吗？怎样改这种定义，才能把陪域也记下来？
  hints:
    - |
      （1）分别写出两个映射的图像，看它们是不是同一个集合。（2）$G$里每个有序对的第一个分量、第二个分量各是什么？
    - |
      （2）$G\subseteq A\times B$对哪些$B$成立？只要$B$包含哪个集合就行？（3）同一个$G$配上不同的$B$，「像集是否等于陪域」的答案会不会变？
    - |
      （1）两者的图像都是$\{(x,x^2):x\in\R\}$，是同一个集合，照这种定义就是同一个映射；按讲解的定义，陪域不同，是两个映射。

      （2）能读出定义域：每个$x\in A$都在$G$里作为第一个分量出现，$G$里的第一个分量又都属于$A$，所以定义域就是$G$里所有第一个分量组成的集合。能读出像集：它就是所有第二个分量组成的集合。读不出陪域：$G\subseteq A\times B$只要求$B$包含像集，凡是包含像集的$B$都行，例如（1）里的$G$既是$\R\times\R$的子集，也是$\R\times[0,+\infty)$的子集。

      （3）说不清：同一个$G$，取$B$等于像集时像集等于陪域，取更大的$B$时就不等，可$G$本身记不下$B$是哪个。补救的办法是把陪域和图像一起记下来，例如把映射定义成有序对$(G,B)$或:term[三元组]{id="math.logic-sets.tuple"}（triple）$(A,B,G)$，定义域能从$G$读出，记不记都行。用图像当定义的书，问「是否取遍」时也总要另外说明是取遍哪个集合。
  reference: |
    （1）两者的图像都是$\{(x,x^2):x\in\R\}$，照这种定义是同一个映射；按讲解的定义陪域不同，是两个映射。

    （2）定义域是$G$里所有第一个分量组成的集合，像集是所有第二个分量组成的集合，都能读出。陪域读不出：$G\subseteq A\times B$对一切包含像集的$B$都成立。

    （3）「像集是否等于陪域」依赖于$B$，而$G$不记$B$，所以问题没有意义。补救：把映射定义成$(A,B,G)$或$(G,B)$，或者约定说「$f$是$A$到$B$的映射」时总带上$B$。这说明讲解为什么把陪域算作映射的一部分：满射这类性质离不开它。

- id: p8
  tier: thinking
  statement: |
    按:term[映射]{id="math.logic-sets.map"}的定义逐字检查，回答下面的问题。

    （1）从:term[空集]{id="math.logic-sets.empty-set"}（empty set）$\varnothing$到集合$B$的映射有几个？$B$也可以是空集。

    （2）从非空集合$A$到$\varnothing$的映射有几个？

    （3）$m$、$n$是正整数时，由乘法原理，有$n$个元素的集合到有$m$个元素的集合的映射有$m^n$个。约定$0^0=1$，$m$、$n$中有$0$时这个式子还对吗？
  hints:
    - |
      映射要求定义域的每个元素都恰好对应陪域的一个元素。定义域是空集时，这句话还有没有可查的元素？陪域是空集时，定义域的元素能对应到哪里？
    - |
      （1）先说明至少有一个：图像是$\varnothing\times B$的子集，$\varnothing\times B$是什么？讲解里图像的刻画（第 5 题）对它说什么？再用映射相等的定义说明至多有一个：两个这样的映射，「每个$x\in\varnothing$都有$f(x)=g(x)$」成立吗？
    - |
      （1）恰有一个。$\varnothing\times B=\varnothing$，它的子集只有$\varnothing$；「每个$x\in\varnothing$都恰有一个$y\in B$使$(x,y)\in\varnothing$」没有元素可查、找不到反例（counterexample），为真，所以由第 5 题，$\varnothing$是一个映射$\varnothing\to B$的图像，这个映射叫作空映射（empty map）。任取两个从$\varnothing$到$B$的映射$f$、$g$，定义域、陪域都相同，「每个$x\in\varnothing$都有$f(x)=g(x)$」也为真，所以$f=g$。$B=\varnothing$时也一样，这个映射就是$\mathrm{id}_\varnothing$。

      （2）一个也没有。$A$非空，取$a\in A$，$a$要对应$\varnothing$的一个元素，可$\varnothing$没有元素。

      （3）对。$n=0$时，由（1），映射恰有$1$个，而$m^0=1$，$m=0$时按约定也是$0^0=1$。$m=0$、$n\ge1$时，由（2），映射有$0$个，而$0^n=0$。所以约定$0^0=1$以后，$m^n$对所有自然数$m$、$n$都对。
  reference: |
    （1）恰有一个：$\varnothing\times B=\varnothing$，它唯一的子集$\varnothing$满足「每个$x\in\varnothing$恰有一个$y$」（没有元素可查，为真），由第 5 题它是一个映射$\varnothing\to B$的图像（空映射）；任意两个这样的映射定义域、陪域相同，「对每个$x\in\varnothing$，$f(x)=g(x)$」同理为真，故相等。$B=\varnothing$时它就是$\mathrm{id}_\varnothing$。

    （2）没有：取$a\in A$，$a$在$\varnothing$里没有像。

    （3）对：$n=0$时有$1=m^0$个（含$0^0=1$）；$m=0$、$n\ge1$时有$0=0^n$个。约定$0^0=1$以后，这个计数公式在边界上也成立。
