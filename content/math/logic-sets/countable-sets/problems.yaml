- id: p1
  tier: easy
  statement: |
    把整数排成$0,1,-1,2,-2,3,-3,\dots$，从第$1$位数起。$-37$排在第几位？第$50$位是哪个整数？按（前者，后者）的顺序填。
  answer:
    type: tuple
    value: [75, 25]
    exact: true
  hints:
    - |
      正整数排在什么样的位置上？负整数呢？写出前几个，看各排在奇数位还是偶数位。
    - |
      $1$、$2$、$3$依次在第$2$、$4$、$6$位，$-1$、$-2$、$-3$依次在第$3$、$5$、$7$位。$k$是正整数时，$k$和$-k$各在第几位？
    - |
      $k$是正整数时，$k$在第$2k$位，$-k$在第$2k+1$位。所以$-37$在第$2\times37+1=75$位；由$2k=50$，第$50$位是$25$。填$(75,25)$。
  solution: |
    $k$是正整数时，$k$在第$2k$位，$-k$在第$2k+1$位，所以$-37$在第$75$位，第$50$位是$25$。填$(75,25)$。

    也可以用讲解里的$f$和$g$：编号从$0$起，$g(-37)=74$，$-37$前面有$74$个数，排在第$75$位；第$50$位前面有$49$个数，编号是$49$，$f(49)=25$。

- id: p2
  tier: easy
  statement: |
    照本节的定义，下面哪些是:term[可数集]{id="math.logic-sets.countable-set"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\{(-1)^n:n\in\N\}$
      - |
        $\{\frac1n:n\in\N^+\}$
      - |
        $\{x\in\R:\sin x=0\}$
      - |
        $\Z\times\Z$
      - |
        $\{n\in\N:n\le10^{100}\}$
    value: [2, 3, 4]
  hints:
    - |
      可数集要和$\N$等势，本节说的可数集不包括:term[有限集]{id="math.logic-sets.finite-set"}。先看每个集合有哪些元素，是不是有限集。
    - |
      A 里$n$取遍$\N$，得到的不同的数有几个？B 和$\N^+$怎样配？C 的解都是$\pi$的整数倍，和哪个集合好配？D 能用讲解里的哪条定理？
    - |
      A 只有$1$和$-1$两个元素，E 恰有$10^{100}+1$个元素，都是有限集。

      B：$n\mapsto\frac1n$是从$\N^+$到它的双射，$\N^+$可数。C：$\sin x=0$的解恰是$k\pi$（$k\in\Z$），$k\mapsto k\pi$是从$\Z$到它的双射，$\Z$可数。D：$\Z$可数，由讲解里笛卡儿积的那条定理，$\Z\times\Z$可数。所以选 B、C、D。
  solution: |
    B、C 各和一个可数集等势：$n\mapsto\frac1n$是从$\N^+$到 B 的双射；$\sin x=0$的解恰是$k\pi$（$k\in\Z$），$k\mapsto k\pi$是从$\Z$到 C 的双射。D 是两个可数集的笛卡儿积。所以选 B、C、D。

    A 只有$1$和$-1$两个元素：数列$1,-1,1,-1,\dots$有无穷多项，各项组成的集合却是有限集，排成一列要求不重复。E 的元素再多，也恰有$10^{100}+1$个，是有限集。

- id: p3
  tier: medium
  statement: |
    照$f(m,n)=\frac{(m+n)(m+n+1)}2+n$给$\N\times\N$的元素编号。编号是$50$的是哪一个？按$(m,n)$的顺序填。
  answer:
    type: tuple
    value: [4, 5]
    exact: true
  hints:
    - |
      先看它在哪一条斜线上，也就是$m+n$是多少。
    - |
      $m+n=s$的那些$(m,n)$，编号从$\frac{s(s+1)}2$（$n=0$）起，到$\frac{s(s+1)}2+s$（$n=s$）止。$50$落在哪个$s$的这一段里？
    - |
      $s=9$时从$45$到$54$，$50$在里面。所以$m+n=9$，$n=50-45=5$，$m=9-5=4$，填$(4,5)$。
  solution: |
    $m+n=s$的那条斜线上，编号从$\frac{s(s+1)}2$到$\frac{s(s+1)}2+s$，下一条从$\frac{(s+1)(s+2)}2$起，正好接上。$\frac{9\times10}2=45\le50$，$\frac{10\times11}2=55>50$，所以$s=9$。于是$n=50-45=5$，$m=9-5=4$，答案是$(4,5)$。

    每个编号都这样倒推得出唯一的$(m,n)$，这就是$f$是双射的道理，一般的证明见第 6 题。

- id: p4
  tier: medium
  statement: |
    下面哪些:term[映射]{id="math.logic-sets.map"}（map）是:term[双射]{id="math.logic-sets.bijective"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\N\to\N\times\{0,1\}$，把$n$送到（$n$除以$2$的商，$n$除以$2$的余数）
      - |
        $\Z\to\N$，$n\ge0$时把$n$送到$2n$，$n<0$时把$n$送到$1-2n$
      - |
        $\N\times\N\to\N^+$，$(m,n)\mapsto3^m(3n+1)$
      - |
        $\{(m,n)\in\N\times\N:m\le n\}\to\N\times\N$，$(m,n)\mapsto(m,n-m)$
      - |
        $\Pow(\N)\to\Pow(\N^+)$，$S\mapsto\{k+1:k\in S\}$
    value: [1, 4, 5]
  hints:
    - |
      要说是双射，写出:term[逆映射]{id="math.logic-sets.inverse-map"}最省事；要说不是，找两个像相同的元素，或者一个不是像的元素。
    - |
      A：由商和余数怎样算回$n$？D：$(m,n-m)=(a,b)$时，$m$、$n$各是多少？E：由右边的子集怎样还原$S$？B、C：从最小的数查起，看哪个数不是像。
    - |
      A：由带余除法（division with remainder），每个$n$恰有一种写法$n=2q+r$，$q\in\N$，$r\in\{0,1\}$，逆映射是$(q,r)\mapsto2q+r$。B：$n\ge0$时的值是偶数，$n<0$时的值是$3,5,7,\dots$，$1$不是像。C：$m\ge1$时的值是$3$的倍数，$m=0$时的值是$3n+1$，$2$不是像。

      D：$m\le n$保证$n-m\in\N$，逆映射是$(a,b)\mapsto(a,a+b)$。E：逆映射是$T\mapsto\{k-1:k\in T\}$，先加$1$再减$1$、先减$1$再加$1$都回到原处。所以选 A、D、E。
  solution: |
    A、D、E 都写得出逆映射：A 是$(q,r)\mapsto2q+r$（带余除法，division with remainder）；D 是$(a,b)\mapsto(a,a+b)$，它满足$a\le a+b$；E 是$T\mapsto\{k-1:k\in T\}$。D 说明点阵里满足$m\le n$的那一半，和整个$\N\times\N$等势。

    B、C 是:term[单射]{id="math.logic-sets.injective"}，不是:term[满射]{id="math.logic-sets.surjective"}：B 的值里奇数从$3$起，没有$1$，讲解里的$g$把正数送到奇数，正好从$1$起；C 的值是$3$的倍数，或者除以$3$余$1$，没有$2$。$2^m(2n+1)$能取遍正整数，是因为不是$2$的倍数的数都能写成$2n+1$，不是$3$的倍数的数却不都能写成$3n+1$。选 A、D、E。

- id: p5
  tier: hard
  statement: |
    证明讲解里关于:term[有限集]{id="math.logic-sets.finite-set"}的三条事实。

    （1）设$m$、$n$是正整数，有从$\{1,2,\dots,m\}$到$\{1,2,\dots,n\}$的:term[单射]{id="math.logic-sets.injective"}。证明$m\le n$；由此说明，$\{1,2,\dots,m\}$与$\{1,2,\dots,n\}$等势只在$m=n$时成立。再说明空集和它们都不等势，所以有限集的元素个数是确定的。

    （2）证明：有限集添上一个不在里面的元素，还是有限集，元素个数加$1$。

    （3）证明：有限集的子集也是有限集，元素个数不超过原来的。
  hints:
    - |
      （1）对$n$归纳，结论要对每个$m$说。从$n$到$n+1$，麻烦的是可能有一个元素被送到了$n+1$：能不能去掉:term[定义域]{id="math.logic-sets.domain"}（domain）里的一个元素，再改一处，使值都落在$1$到$n$里？（2）把已有的双射延长一步。（3）对元素个数归纳，先去掉一个元素。
    - |
      （1）设$f(j)=n+1$。把$m$从定义域里去掉；$j$要是还在，它的新值改取$f(m)$。得到的映射还是单射吗？（2）设$p:\{1,\dots,n\}\to A$是双射，规定$p(n+1)=b$；$A$是空集时另说。

      （3）设$A$有$n+1$个元素，$b$是其中一个，$A'=A\setminus\{b\}$有$n$个元素。任取$S\subseteq A$，分$b\notin S$和$b\in S$两种情形，后一种用（2）。
    - |
      （1）对$n$归纳，证明：对每个正整数$m$，有从$\{1,\dots,m\}$到$\{1,\dots,n\}$的单射，就有$m\le n$。$n=1$时所有元素都被送到$1$，$m\ge2$的话$1$和$2$的像相同，不是单射，所以$m=1$。设$n$时成立，$f$是从$\{1,\dots,m\}$到$\{1,\dots,n+1\}$的单射。若$n+1$不是像，$f$的值都在$\{1,\dots,n\}$里，由归纳假设，$m\le n$，更有$m\le n+1$。

      若$f(j)=n+1$，$m=1$时当然$m\le n+1$。$m\ge2$时规定$g:\{1,\dots,m-1\}\to\{1,\dots,n\}$：$i\ne j$时$g(i)=f(i)$；$j\le m-1$时，再令$g(j)=f(m)$。$g$在不同的元素处，取的是$f$在不同的元素处的值，这些元素都不是$j$，所以值不会是$n+1$，也互不相同，$g$是单射。由归纳假设，$m-1\le n$，即$m\le n+1$。

      $\{1,\dots,m\}$与$\{1,\dots,n\}$等势时，双射和它的逆映射是两个方向的单射，所以$m\le n$，$n\le m$，$m=n$。空集和$\{1,\dots,m\}$不等势，因为非空集合到空集连映射都没有（见[映射](lesson:math.logic-sets.functions)第 8 题）。一个集合要是和$\{1,\dots,m\}$、$\{1,\dots,n\}$都等势，由等势的定理，这两个也等势，$m=n$，所以元素个数是确定的。给元素编上号，（1）就说从有限个元素的集合到元素比它少的集合没有单射，[单射、满射与双射](lesson:math.logic-sets.injective-surjective)第 5 题用的正是这一条。

      （2）设$A$有$n$个元素，$b\notin A$。$n=0$时$A\cup\{b\}=\{b\}$，$1\mapsto b$是从$\{1\}$到它的双射。$n\ge1$时取双射$p:\{1,\dots,n\}\to A$，再规定$p(n+1)=b$：$A$的元素和$b$都取到了，$b\notin A$，所以$p(n+1)$和别的值都不同。这是从$\{1,\dots,n+1\}$到$A\cup\{b\}$的双射，$A\cup\{b\}$有$n+1$个元素。

      （3）对$n$归纳，证明有$n$个元素的集合$A$的子集都是有限集，元素个数不超过$n$。$n=0$时$A=\varnothing$，子集只有$\varnothing$。设$n$时成立，$A$有$n+1$个元素，取双射$p:\{1,\dots,n+1\}\to A$，令$b=p(n+1)$，$A'=A\setminus\{b\}$。$n\ge1$时$p$把$1$到$n$一个对一个地送到$A'$的元素，$n=0$时$A'=\varnothing$，所以$A'$有$n$个元素。

      任取$S\subseteq A$。$b\notin S$时$S\subseteq A'$，由归纳假设，$S$是有限集，元素个数不超过$n$。$b\in S$时，$S\setminus\{b\}\subseteq A'$，是有限集，元素个数不超过$n$，添上$b$就是$S$，由（2），$S$是有限集，元素个数不超过$n+1$。
  reference: |
    （1）对$n$归纳，命题是「对每个正整数$m$，有从$\{1,\dots,m\}$到$\{1,\dots,n\}$的单射，就有$m\le n$」。$n=1$：值只有$1$，$m\ge2$时$f(1)=f(2)$。递推：$n+1$不是像时用归纳假设得$m\le n$；$f(j)=n+1$时（$m\ge2$），$g(i)=f(i)$（$i\ne j$），$g(j)=f(m)$（$j\le m-1$），$g:\{1,\dots,m-1\}\to\{1,\dots,n\}$单，$m-1\le n$。

    等势给两个方向的单射，故$m=n$；非空集合到空集连映射都没有（映射第 8 题），故空集和$\{1,\dots,m\}$不等势。（1）也就是说，从$m$个元素的集合到元素更少的集合没有单射，单射、满射与双射第 5 题用的是它。

    （2）双射延长一步：$p(n+1)=b$，$b\notin A$保证单；$n=0$单说。

    （3）对$n$归纳，去掉$b=p(n+1)$；$b\notin S$用归纳假设，$b\in S$时对$S\setminus\{b\}$用归纳假设，再用（2）。

    常见的漏洞：（1）里直接说「$m>n$时两个元素撞到一处」，那正是要证的；（3）里把子集「从小到大排成$a_1,\dots,a_k$」，没有说明为什么排得完。

- id: p6
  tier: hard
  statement: |
    （1）证明：$f(m,n)=\frac{(m+n)(m+n+1)}2+n$是$\N\times\N\to\N$的:term[双射]{id="math.logic-sets.bijective"}。

    （2）设$k$是不小于$2$的整数。由讲解里的定理证明$\N^k$是:term[可数集]{id="math.logic-sets.countable-set"}。
  hints:
    - |
      （1）记$T(s)=\frac{s(s+1)}2$，则$f(m,n)=T(m+n)+n$。任给$N\in\N$，要找$m$、$n$使$T(m+n)+n=N$，先想怎样由$N$定出$m+n$。（2）对$k$归纳，$\N^{k+1}$的元素和$\N^k\times\N$的元素怎样配？
    - |
      （1）$T(s+1)=T(s)+s+1$。先证任给$N\in\N$，恰有一个$s\in\N$使$T(s)\le N<T(s+1)$，至少有一个可以对$N$归纳。$f(m,n)=N$时，$m+n$是不是这个$s$？（2）把$(a_1,\dots,a_k,a_{k+1})$送到$((a_1,\dots,a_k),a_{k+1})$。
    - |
      （1）记$T(s)=\frac{s(s+1)}2$（$s\in\N$），则$T(0)=0$，$T(s+1)=T(s)+s+1$，$f(m,n)=T(m+n)+n$。先证：任给$N\in\N$，至少有一个$s\in\N$使$T(s)\le N<T(s+1)$。对$N$归纳，$N=0$时$s=0$满足，因为$T(0)=0$，$T(1)=1$。设$s$对$N$满足，则$N+1\le T(s+1)$：$N+1<T(s+1)$时，$s$对$N+1$也满足；$N+1=T(s+1)$时，因为$T(s+1)<T(s+2)$，$s+1$对$N+1$满足。

      这样的$s$至多有一个：设$s<s'$都满足，则$s+1\le s'$，$T$越来越大，$T(s+1)\le T(s')\le N$，和$N<T(s+1)$矛盾。

      $f$是满射：任给$N$，取这个$s$，令$n=N-T(s)$。由$T(s)\le N<T(s+1)$，$0\le n<T(s+1)-T(s)=s+1$，即$0\le n\le s$。再令$m=s-n$，则$m$、$n$都是自然数，$f(m,n)=T(s)+n=N$。

      $f$是单射：设$f(m,n)=N$。$0\le n<m+n+1$，所以$T(m+n)\le T(m+n)+n<T(m+n)+(m+n)+1$，即$T(m+n)\le N<T(m+n+1)$，$m+n$就是上面那个唯一的$s$，由$N$定出。于是$n=N-T(s)$、$m=s-n$也由$N$定出，不同的$(m,n)$不会有相同的值。

      （2）对$k$归纳，$k=2$时就是$\N\times\N$。设$\N^k$可数。把$(a_1,\dots,a_k,a_{k+1})$送到$((a_1,\dots,a_k),a_{k+1})$，是从$\N^{k+1}$到$\N^k\times\N$的双射：由右边的有序对，恰好认得出左边的$k+1$个分量。由讲解里笛卡儿积的那条定理，$\N^k\times\N$可数，所以$\N^{k+1}$也可数。
  reference: |
    （1）$T(s)=\frac{s(s+1)}2$，$T(s+1)-T(s)=s+1$。任给$N$恰有一个$s$使$T(s)\le N<T(s+1)$（存在对$N$归纳，或取满足$T(s)\le N$的最大的$s$；唯一由$T$严格递增）。满：$n=N-T(s)\le s$，$m=s-n$。单：$T(m+n)\le f(m,n)<T(m+n+1)$定出$m+n$，再定出$n$、$m$。

    另一种证法：证$f(m,n)+1$等于$f(m-1,n+1)$（$m\ge1$）或$f(n+1,0)$（$m=0$），由归纳得满射；单射仍用上面的不等式。

    （2）$\N^{k+1}$与$\N^k\times\N$等势，归纳用讲解里「两个可数集的笛卡儿积可数」。

- id: p7
  tier: thinking
  statement: |
    希尔伯特旅馆（Hilbert's hotel）有房间$0,1,2,\dots$，每间住着一位客人。

    （1）又来了一批新客人，编号也是$0,1,2,\dots$。怎样调房，使每人一间，而且没有空房？

    （2）换成来了一列火车，有车厢$0,1,2,\dots$，每节车厢里有客人$0,1,2,\dots$。怎样调房，使每人一间，而且没有空房？

    （3）老客人嫌麻烦，每位只肯搬到房号和原来相差不超过$d$的房间，$d$是取定的正整数。仍要每人一间，至多能住进几位新客人？证明你的结论。

    （4）在（1）里，每位老客人也只搬了有限间，为什么和（3）不矛盾？用量词（quantifier）的次序说清楚。
  hints:
    - |
      （1）让老客人腾出无穷多间房来。（2）把老客人当作一节车厢，问题就成了给所有的（车厢号，客人号）编号。（3）先看怎样让出几间；要说不能再多，看前$N$位老客人搬完以后挤在哪些房间里。（4）把「搬了有限间」写成带量词的句子。
    - |
      （1）老客人都住偶数号房。（2）讲解里有一个$\N\times\N\to\N$的双射。（3）原来住$0$到$N-1$号房的$N$位老客人，搬完以后房号都不超过$N-1+d$；假如住进了$d+1$位新客人，取$N$比他们的房号都大，数一数人数和房间数。（4）比较「每位客人，都有一个界」和「有一个界，管住每位客人」。
    - |
      （1）原来住$n$号房的搬到$2n$号房，新来的$k$号客人住$2k+1$号房。每个自然数不是偶数就是奇数，恰能写成一个$2n$或者一个$2k+1$，所以每人一间，没有空房。

      （2）讲解里$(m,n)\mapsto2^m(2n+1)-1$是$\N\times\N\to\N$的双射。把老客人当作第$0$节车厢，来的车厢号都加$1$：原来住$n$号房的搬到$2^0(2n+1)-1=2n$号房，第$k$节车厢的$n$号客人住$2^{k+1}(2n+1)-1$号房。因为是双射，每人一间，没有空房。

      （3）至多$d$位。住进$d$位做得到：每位老客人往后搬$d$间，空出$0$到$d-1$号房。

      再证住不进$d+1$位。假如住进了$d+1$位，取$N$比他们的房号都大。原来住$0$到$N-1$号房的$N$位老客人，搬完以后房号都不超过$N-1+d$；这$d+1$位新客人的房号也都小于$N$。于是$N+d+1$个人各住一间，住的都是$0$到$N+d-1$号这$N+d$间，这就有从$N+d+1$个元素的集合到$N+d$个元素的集合的单射，和第 5 题（1）矛盾。

      （4）在（1）里，原来住$n$号房的搬了$n$间。「每位都只搬了有限间」是$\forall n\,\exists d$：对每个$n$，都有一个$d$，使$n$号老客人搬的间数不超过$d$；$d$可以随$n$变，取$d=n$就行。而（3）要的是$\exists d\,\forall n$：有一个$d$，管住所有的老客人，（1）里没有这样的$d$。

      搬到任何一间房，搬的间数总是一个自然数，所以前一句对什么安排都成立，等于没有要求；后一句才是真的限制，见[多重量词](lesson:math.logic-sets.nested-quantifiers#thm-quantifier-order)。
  reference: |
    （1）$n\mapsto2n$，$k\mapsto2k+1$。

    （2）$(m,n)\mapsto2^m(2n+1)-1$，老客人为$m=0$，第$k$节车厢为$m=k+1$。别的双射（如按斜线编号）也行。

    （3）恰是$d$。上界：取$N$大于$d+1$位新客人的房号，$N$位老客人和$d+1$位新客人都住在$0,\dots,N+d-1$号，人数$N+d+1$超过房间数$N+d$，和第 5 题（1）矛盾。下界：$n\mapsto n+d$。允许有空房，结论一样。

    （4）$\forall n\,\exists d\,(\text{搬的间数}\le d)$恒真；（3）是$\exists d\,\forall n$。在（1）里搬$n$间，没有公共的界。可以对照数学分析里逐点有界和一致有界的分别。

- id: p8
  tier: thinking
  statement: |
    不超过$N$的自然数里，偶数约占一半；按等势来比，非负偶数和自然数却一样多。

    （1）这两种比法各在比什么？

    （2）把自然数重新排成$1,3,0,5,7,2,9,11,4,\dots$，每两个奇数后面排一个偶数。照这个次序看前$N$个，$N$很大时偶数约占多少？

    （3）任取$0<r<1$，能不能把自然数重新排成一列，使偶数在前$N$个里占的比例随$N$增大而接近$r$？能不能接近$1$？

    （4）「占多少」依赖什么？等势依赖什么？:term[有限集]{id="math.logic-sets.finite-set"}里为什么看不出这个分别？
  hints:
    - |
      （1）一种要先取前$N$个来数，一种只问能不能配对。（2）三个三个地看。（3）一边排一边看比例：偶数少了就排偶数，偶数多了就排奇数。（4）看（2）和（3）里变的是什么，没变的是什么。
    - |
      （3）记前$N$个里偶数有$e_N$个。$e_N\le rN$时，下一个排还没用过的最小的偶数，否则排还没用过的最小的奇数；对$N$归纳，证明$e_N$和$rN$至多差$1$，再说明偶数、奇数都会一直排下去。要接近$1$，就让奇数出现得越来越稀。（4）有限集的元素全排完以后，子集占多少？
    - |
      （1）「占多少」先数前$N$个数里有几个偶数，除以$N$，再看$N$越来越大时这个比值接近多少，用到了这些数的次序。等势只问能不能一个配一个，$n\mapsto2n$就配好了，不管谁先谁后。

      （2）每三个里恰有一个偶数，约占三分之一。每个自然数还是恰出现一次，换个次序，一半就变成了三分之一。

      （3）能。一个一个地排：若$e_N\le rN$，下一个排还没用过的最小的偶数，否则排还没用过的最小的奇数，从$e_0=0$开始。先证$-1\le e_N-rN\le1$，对$N$归纳，$N=0$时是$0$。设$N$时成立：$e_N\le rN$时，$e_N-rN$在$-1$和$0$之间，下一个排偶数，差变大$1-r$，落在$-r$和$1-r$之间；$e_N>rN$时，差在$0$和$1$之间，下一个排奇数，差变小$r$，也落在$-r$和$1-r$之间，都在$-1$和$1$之间。

      所以$\frac{e_N}N$和$r$至多差$\frac1N$，$N$很大时就很接近。偶数、奇数都会一直排下去：要是从某处起只排偶数，差每次变大$1-r$，迟早大于$1$；只排奇数，差每次变小$r$，迟早小于$-1$，都不可能。所以每个自然数恰排到一次。

      接近$1$也能：第$1,2,4,8,\dots$位依次放奇数，其余各位依次放偶数。$2^k\le N<2^{k+1}$时，前$N$个里只有$k+1$个奇数，占的比例不超过$\frac{k+1}{2^k}$，$N$很大时接近$0$，偶数的比例就接近$1$。对调奇偶，偶数的比例就接近$0$。

      （4）「占多少」依赖这些数排的次序，换一种次序，答案可以是$0$到$1$之间的任何数；说「偶数占一半」，是说好了从小到大排。等势只看两个集合之间有没有双射，和次序无关，怎样重排，集合还是那两个集合。有限集的元素全排完以后，子集占的比例就是两个元素个数之比，怎样排都一样，所以看不出这个分别。

      第（3）问的办法和数学分析[级数的重排](lesson:math.analysis.rearrangement#thm-riemann-rearrangement)里证黎曼重排定理（Riemann rearrangement theorem）是同一个想法：一边排，一边朝着目标调整。
  reference: |
    （1）「占多少」是前$N$个里的比例（$N\to\infty$时的极限，即自然密度），依赖次序；等势只看有没有双射。

    （2）$\frac13$。

    （3）能。贪心：$D_N=e_N-rN$，$D_N\le0$排偶数，否则排奇数，归纳得$-r\le D_N\le1-r$，故比例与$r$差不超过$\frac1N$；两类数都无穷次出现，否则$D_N$单调变化，出界。$r=1$（或$0$）：把一类数放在第$2^k$位。要点是每个自然数恰出现一次，漏证「两类都会一直排下去」算不完整。

    （4）「占多少」依赖排法，等势只依赖集合。有限集全排完，比例是元素个数之比，与排法无关；无限集永远排不完，只看得到前$N$个，次序就起作用。和条件收敛的级数换序会改变和是同一个道理。
