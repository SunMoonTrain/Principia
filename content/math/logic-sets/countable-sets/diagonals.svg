<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 306" width="600" height="306" font-size="14">
  <!-- 左：N × N 的点阵，m 横、n 纵，各从 0 到 4，(m, n) 画在 (78 + 50m, 268 - 50n)；m + n 不超过 4 的 15 个点右上角写编号 (m + n)(m + n + 1)/2 + n，其余的点画小。强调色的斜线从 (s, 0) 指向 (0, s)，s = 1 到 4，编号沿箭头增大。右：同样的编号按 m + n 分行，每行开头的数（强调色）是 s(s + 1)/2 -->
  <!-- 斜线 -->
  <g stroke-width="1.6" style="stroke: var(--accent, #2563eb)">
    <line x1="123.05" y1="263.05" x2="87.9" y2="227.9" />
    <line x1="173.05" y1="263.05" x2="87.9" y2="177.9" />
    <line x1="223.05" y1="263.05" x2="87.9" y2="127.9" />
    <line x1="273.05" y1="263.05" x2="87.9" y2="77.9" />
  </g>
  <g style="fill: var(--accent, #2563eb)">
    <polygon points="82.6,222.6 91.08,225.42 85.42,231.08" />
    <polygon points="82.6,172.6 91.08,175.42 85.42,181.08" />
    <polygon points="82.6,122.6 91.08,125.42 85.42,131.08" />
    <polygon points="82.6,72.6 91.08,75.42 85.42,81.08" />
  </g>
  <!-- 没有编号的点 -->
  <g fill="currentColor" opacity="0.4">
    <circle cx="128" cy="68" r="2.2" />
    <circle cx="178" cy="68" r="2.2" />
    <circle cx="228" cy="68" r="2.2" />
    <circle cx="278" cy="68" r="2.2" />
    <circle cx="178" cy="118" r="2.2" />
    <circle cx="228" cy="118" r="2.2" />
    <circle cx="278" cy="118" r="2.2" />
    <circle cx="228" cy="168" r="2.2" />
    <circle cx="278" cy="168" r="2.2" />
    <circle cx="278" cy="218" r="2.2" />
  </g>
  <!-- 有编号的点 -->
  <g fill="currentColor">
    <circle cx="78" cy="268" r="4.5" />
    <circle cx="128" cy="268" r="4.5" />
    <circle cx="178" cy="268" r="4.5" />
    <circle cx="228" cy="268" r="4.5" />
    <circle cx="278" cy="268" r="4.5" />
    <circle cx="78" cy="218" r="4.5" />
    <circle cx="128" cy="218" r="4.5" />
    <circle cx="178" cy="218" r="4.5" />
    <circle cx="228" cy="218" r="4.5" />
    <circle cx="78" cy="168" r="4.5" />
    <circle cx="128" cy="168" r="4.5" />
    <circle cx="178" cy="168" r="4.5" />
    <circle cx="78" cy="118" r="4.5" />
    <circle cx="128" cy="118" r="4.5" />
    <circle cx="78" cy="68" r="4.5" />
  </g>
  <g fill="currentColor">
    <text x="85" y="261">0</text>
    <text x="135" y="261">1</text>
    <text x="185" y="261">3</text>
    <text x="235" y="261">6</text>
    <text x="285" y="261">10</text>
    <text x="85" y="211">2</text>
    <text x="135" y="211">4</text>
    <text x="185" y="211">7</text>
    <text x="235" y="211">11</text>
    <text x="85" y="161">5</text>
    <text x="135" y="161">8</text>
    <text x="185" y="161">12</text>
    <text x="85" y="111">9</text>
    <text x="135" y="111">13</text>
    <text x="85" y="61">14</text>
  </g>
  <!-- 两个方向的坐标 -->
  <g fill="currentColor" text-anchor="middle" opacity="0.75">
    <text x="78" y="294">0</text>
    <text x="128" y="294">1</text>
    <text x="178" y="294">2</text>
    <text x="228" y="294">3</text>
    <text x="278" y="294">4</text>
    <text x="316" y="294" font-style="italic">m</text>
  </g>
  <g fill="currentColor" text-anchor="end" opacity="0.75">
    <text x="58" y="273">0</text>
    <text x="58" y="223">1</text>
    <text x="58" y="173">2</text>
    <text x="58" y="123">3</text>
    <text x="58" y="73">4</text>
    <text x="58" y="40" font-style="italic">n</text>
  </g>
  <!-- 右：按 m + n 分行 -->
  <line x1="402" y1="50" x2="402" y2="262" stroke="currentColor" stroke-width="1" opacity="0.5" />
  <g fill="currentColor" text-anchor="middle">
    <text x="372" y="66"><tspan font-style="italic">m</tspan> + <tspan font-style="italic">n</tspan></text>
    <text x="434" y="66">编号</text>
    <text x="372" y="98">0</text>
    <text x="372" y="130">1</text>
    <text x="372" y="162">2</text>
    <text x="372" y="194">3</text>
    <text x="372" y="226">4</text>
    <text x="372" y="254">…</text>
    <text x="462" y="130">2</text>
    <text x="462" y="162">4</text>
    <text x="496" y="162">5</text>
    <text x="462" y="194">7</text>
    <text x="496" y="194">8</text>
    <text x="530" y="194">9</text>
    <text x="462" y="226">11</text>
    <text x="496" y="226">12</text>
    <text x="530" y="226">13</text>
    <text x="564" y="226">14</text>
    <text x="428" y="254">…</text>
  </g>
  <g style="fill: var(--accent, #2563eb)" text-anchor="middle">
    <text x="428" y="98">0</text>
    <text x="428" y="130">1</text>
    <text x="428" y="162">3</text>
    <text x="428" y="194">6</text>
    <text x="428" y="226">10</text>
  </g>
</svg>
