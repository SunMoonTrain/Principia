id: math.logic-sets
title: |
  逻辑与集合
proofPolicy: full
macros:
  \N: |
    \mathbb{N}
  \Z: |
    \mathbb{Z}
  \Q: |
    \mathbb{Q}
  \R: |
    \mathbb{R}
  \Pow: |
    \mathcal{P}
  \vb: |
    \mathbf{#1}
glossary:
  - id: math.logic-sets.truth-value
    zh: |
      真值
    en: |
      truth value
    brief: |
      命题的真假：成立的命题真值为真，不成立的命题真值为假。
    definedIn: math.logic-sets.propositions
    anchor: def-proposition
  - id: math.logic-sets.negation
    zh: |
      否定
    en: |
      negation
    brief: |
      命题$P$的否定$\neg P$读作「非$P$」：$P$真时它假，$P$假时它真。
    definedIn: math.logic-sets.propositions
    anchor: def-negation
  - id: math.logic-sets.conjunction
    zh: |
      合取
    en: |
      conjunction
    brief: |
      $P\land Q$读作「$P$且$Q$」，只有$P$、$Q$都真时它才真。
    definedIn: math.logic-sets.propositions
    anchor: def-and-or
  - id: math.logic-sets.disjunction
    zh: |
      析取
    en: |
      disjunction
    brief: |
      $P\lor Q$读作「$P$或$Q$」，$P$、$Q$至少有一个真时它就真，两个都真也算真。
    definedIn: math.logic-sets.propositions
    anchor: def-and-or
  - id: math.logic-sets.connective
    zh: |
      逻辑联结词
    en: |
      logical connective
    brief: |
      「非」「且」「或」这样由命题造出新命题的词，分别记作$\neg$、$\land$、$\lor$，简称联结词。
    definedIn: math.logic-sets.propositions
    anchor: def-connective
  - id: math.logic-sets.compound-proposition
    zh: |
      复合命题
    en: |
      compound proposition
    brief: |
      用逻辑联结词连成的命题，如$P\land\neg Q$；它的真假只由组成它的命题的真假决定。
    definedIn: math.logic-sets.propositions
    anchor: def-connective
  - id: math.logic-sets.truth-table
    zh: |
      真值表
    en: |
      truth table
    brief: |
      把各命题的真假组合逐行列出、写出复合命题在每一行的真假的表；$n$个字母有$2^n$行。
    definedIn: math.logic-sets.propositions
    anchor: def-truth-table
  - id: math.logic-sets.logical-equivalence
    zh: |
      逻辑等价
    en: |
      logical equivalence
    brief: |
      两个复合命题在真值表的每一行真假都相同，记作${\iff}$，读作「等价于」。
    definedIn: math.logic-sets.propositions
    anchor: def-logical-equivalence
  - id: math.logic-sets.de-morgan-laws
    zh: |
      德摩根律
    en: |
      De Morgan's laws
    brief: |
      $\neg(P\land Q)\iff\neg P\lor\neg Q$，$\neg(P\lor Q)\iff\neg P\land\neg Q$：否定「且」得「或」、否定「或」得「且」，每部分各取否定。
    definedIn: math.logic-sets.propositions
    anchor: thm-de-morgan
  - id: math.logic-sets.implication
    zh: |
      蕴含
    en: |
      implication
    brief: |
      复合命题「若$P$则$Q$」，记作$P\Rightarrow Q$：$P$真、$Q$假时为假，其余三种情形都为真。
    definedIn: math.logic-sets.implication
    anchor: def-implication
  - id: math.logic-sets.converse
    zh: |
      逆命题
    en: |
      converse
    brief: |
      交换$P\Rightarrow Q$的条件和结论得到的$Q\Rightarrow P$；它和原命题不一定同真同假。
    definedIn: math.logic-sets.implication
    anchor: def-converse-contrapositive
  - id: math.logic-sets.contrapositive
    zh: |
      逆否命题
    en: |
      contrapositive
    brief: |
      $P\Rightarrow Q$的逆否命题是$\neg Q\Rightarrow\neg P$，它和原命题逻辑等价。
    definedIn: math.logic-sets.implication
    anchor: def-converse-contrapositive
  - id: math.logic-sets.sufficient-condition
    zh: |
      充分条件
    en: |
      sufficient condition
    brief: |
      $P\Rightarrow Q$成立时，说$P$是$Q$的充分条件：有了$P$，$Q$就一定成立。
    definedIn: math.logic-sets.implication
    anchor: def-sufficient-necessary
  - id: math.logic-sets.necessary-condition
    zh: |
      必要条件
    en: |
      necessary condition
    brief: |
      $P\Rightarrow Q$成立时，说$Q$是$P$的必要条件：$Q$不成立，$P$就不成立。
    definedIn: math.logic-sets.implication
    anchor: def-sufficient-necessary
  - id: math.logic-sets.necessary-sufficient-condition
    zh: |
      充要条件
    en: |
      necessary and sufficient condition
    brief: |
      $P\Rightarrow Q$和$Q\Rightarrow P$都成立时，说$P$是$Q$的充要条件，记作$P\iff Q$，读作「$P$当且仅当$Q$」。
    definedIn: math.logic-sets.implication
    anchor: def-iff
  - id: math.logic-sets.universal-quantifier
    zh: |
      全称量词
    en: |
      universal quantifier
    brief: |
      「对所有」「任意」「任给」这类表示「每一个都」的词，记作$\forall$。
    definedIn: math.logic-sets.quantifiers
    anchor: def-universal
  - id: math.logic-sets.universal-statement
    zh: |
      全称量词命题
    en: |
      universal statement
    brief: |
      形如$\forall x\in A,\ P(x)$的命题：$A$中每个元素都使$P(x)$成立时为真，有一个不成立就为假。
    definedIn: math.logic-sets.quantifiers
    anchor: def-universal
  - id: math.logic-sets.existential-quantifier
    zh: |
      存在量词
    en: |
      existential quantifier
    brief: |
      「存在」「有一个」「至少有一个」这类词，记作$\exists$。
    definedIn: math.logic-sets.quantifiers
    anchor: def-existential
  - id: math.logic-sets.existential-statement
    zh: |
      存在量词命题
    en: |
      existential statement
    brief: |
      形如$\exists x\in A,\ P(x)$的命题：$A$中至少有一个元素使$P(x)$成立时为真，一个也没有就为假。
    definedIn: math.logic-sets.quantifiers
    anchor: def-existential
  - id: math.logic-sets.direct-proof
    zh: |
      直接证明
    en: |
      direct proof
    brief: |
      从条件出发，每一步都由条件、已经推出的结论或已知的定义、定理得到，一步步推出结论的证明。
    definedIn: math.logic-sets.direct-proof
    anchor: def-direct-proof
  - id: math.logic-sets.proof-by-cases
    zh: |
      分情况讨论
    en: |
      proof by cases
    brief: |
      已知$P\lor Q$成立，又分别由$P$、由$Q$推出$R$，从而断定$R$成立的证法；情形多于两种时，只要合起来不漏。
    definedIn: math.logic-sets.direct-proof
    anchor: thm-cases
  - id: math.logic-sets.remainder-uniqueness
    zh: |
      余数的唯一性
    en: |
      uniqueness of remainder
    brief: |
      设$n$是正整数，把整数$a$写成$a=qn+r$（$q$、$r$是整数，$0\le r<n$）的写法只有一种，所以$a$除以$n$的余数说得清是哪个数。
    definedIn: math.logic-sets.direct-proof
    anchor: thm-remainder-unique
  - id: math.logic-sets.proof-by-contradiction
    zh: |
      反证法
    en: |
      proof by contradiction
    brief: |
      要证$P$，先假设$P$不成立，推出某个命题和它的否定都成立，从而断定$P$成立的证法。
    definedIn: math.logic-sets.proof-methods
    anchor: def-proof-by-contradiction
  - id: math.logic-sets.subset
    zh: |
      子集
    en: |
      subset
    brief: |
      集合$A$的每个元素都属于集合$B$时，说$A$是$B$的子集，记作$A\subseteq B$。
    definedIn: math.logic-sets.sets
    anchor: def-subset
  - id: math.logic-sets.proper-subset
    zh: |
      真子集
    en: |
      proper subset
    brief: |
      $A\subseteq B$且$A\ne B$时，说$A$是$B$的真子集，记作$A\subsetneq B$。
    definedIn: math.logic-sets.sets
    anchor: def-proper-subset
  - id: math.logic-sets.venn-diagram
    zh: |
      韦恩图
    en: |
      Venn diagram
    brief: |
      用平面上封闭曲线围成的区域表示集合、区域里的点表示元素的示意图，课本写作 Venn 图。
    definedIn: math.logic-sets.sets
    anchor: def-venn
  - id: math.logic-sets.empty-set
    zh: |
      空集
    en: |
      empty set
    brief: |
      不含任何元素的集合，记作$\varnothing$；它是任何集合的子集，并且只有一个。
    definedIn: math.logic-sets.sets
    anchor: def-empty-set
  - id: math.logic-sets.power-set
    zh: |
      幂集
    en: |
      power set
    brief: |
      集合$A$的所有子集组成的集合，记作$\Pow(A)$；有$n$个元素的集合有$2^n$个子集。
    definedIn: math.logic-sets.sets
    anchor: def-power-set
  - id: math.logic-sets.mathematical-induction
    zh: |
      数学归纳法
    en: |
      mathematical induction
    brief: |
      证明$P(n)$对所有整数$n\ge n_0$成立的方法：先证$P(n_0)$，再对每个$k\ge n_0$证由$P(k)$能推出$P(k+1)$。
    definedIn: math.logic-sets.induction
    anchor: def-induction
  - id: math.logic-sets.strong-induction
    zh: |
      强归纳法
    en: |
      strong induction
    brief: |
      证明$P(n)$对所有整数$n\ge n_0$成立的方法：先证$P(n_0)$，再对每个$k\ge n_0$，由$n_0\le m\le k$时$P(m)$都成立推出$P(k+1)$；也叫第二数学归纳法。
    definedIn: math.logic-sets.induction
    anchor: thm-strong-induction
  - id: math.logic-sets.union
    zh: |
      并集
    en: |
      union
    brief: |
      属于$A$或属于$B$的元素组成的集合，记作$A\cup B$；同时属于两者的元素也在其中。
    definedIn: math.logic-sets.set-operations
    anchor: def-union-intersection
  - id: math.logic-sets.intersection
    zh: |
      交集
    en: |
      intersection
    brief: |
      既属于$A$又属于$B$的元素组成的集合，记作$A\cap B$。
    definedIn: math.logic-sets.set-operations
    anchor: def-union-intersection
  - id: math.logic-sets.disjoint
    zh: |
      不相交
    en: |
      disjoint
    brief: |
      两个集合没有公共元素，即$A\cap B=\varnothing$；也说互不相交。
    definedIn: math.logic-sets.set-operations
    anchor: def-disjoint
  - id: math.logic-sets.set-difference
    zh: |
      差集
    en: |
      set difference
    brief: |
      属于$A$而不属于$B$的元素组成的集合，记作$A\setminus B$；$B$不必是$A$的子集。
    definedIn: math.logic-sets.set-operations
    anchor: def-difference
  - id: math.logic-sets.universal-set
    zh: |
      全集
    en: |
      universal set
    brief: |
      一个问题里讨论的集合都是它的子集时，这个集合叫全集，常记作$U$；补集要相对全集来取。
    definedIn: math.logic-sets.set-operations
    anchor: def-complement
  - id: math.logic-sets.complement
    zh: |
      补集
    en: |
      complement
    brief: |
      全集$U$中不属于$A$的元素组成的集合，记作$A^{\mathrm c}$，即$U\setminus A$；全集换了，补集也跟着变。
    definedIn: math.logic-sets.set-operations
    anchor: def-complement
  - id: math.logic-sets.family-of-sets
    zh: |
      集族
    en: |
      family of sets
    brief: |
      对指标集$I$的每个元素$i$都给定一个集合$A_i$，这样的一组集合记作$\{A_i\}_{i\in I}$；不同的指标可以给出同一个集合。
    definedIn: math.logic-sets.indexed-families
    anchor: def-family
  - id: math.logic-sets.index-set
    zh: |
      指标集
    en: |
      index set
    brief: |
      集族$\{A_i\}_{i\in I}$里给集合编号用的集合$I$，可以是$\{1,2,\dots,n\}$、$\N$、全体正实数等任意集合。
    definedIn: math.logic-sets.indexed-families
    anchor: def-family
  - id: math.logic-sets.pairwise-disjoint
    zh: |
      两两不相交
    en: |
      pairwise disjoint
    brief: |
      集族中任意两个指标不同的集合都不相交：$i\ne j$时$A_i\cap A_j=\varnothing$；对一些集合组成的集合，就是其中任意两个不同的集合都不相交。
    definedIn: math.logic-sets.indexed-families
    anchor: def-pairwise-disjoint
  - id: math.logic-sets.ordered-pair
    zh: |
      有序对
    en: |
      ordered pair
    brief: |
      两个对象按先后排成的一对$(a,b)$；规定$(a,b)=(c,d)$当且仅当$a=c$且$b=d$。
    definedIn: math.logic-sets.cartesian-product
    anchor: def-ordered-pair
  - id: math.logic-sets.tuple
    zh: |
      $n$元组
    en: |
      n-tuple
    brief: |
      $n$个对象按先后排成的$(a_1,a_2,\dots,a_n)$，如三元组$(a,b,c)$；两个$n$元组相等当且仅当对应的分量都相等。
    definedIn: math.logic-sets.cartesian-product
    anchor: def-ordered-pair
  - id: math.logic-sets.cartesian-product
    zh: |
      笛卡儿积
    en: |
      Cartesian product
    brief: |
      所有有序对$(a,b)$（$a\in A$，$b\in B$）组成的集合，记作$A\times B$；平面$\R^2$就是$\R\times\R$。
    definedIn: math.logic-sets.cartesian-product
    anchor: def-cartesian-product
  - id: math.logic-sets.binary-relation
    zh: |
      二元关系
    en: |
      binary relation
    brief: |
      笛卡儿积$A\times B$的子集$R$叫作从$A$到$B$的二元关系，简称关系；$(a,b)\in R$时记作$a\mathrel{R}b$。
    definedIn: math.logic-sets.cartesian-product
    anchor: def-binary-relation
  - id: math.logic-sets.reflexive
    zh: |
      自反性
    en: |
      reflexivity
    brief: |
      集合$A$上的关系$R$对每个$a\in A$都有$a\mathrel{R}a$时，说$R$具有自反性，也说$R$是自反的。
    definedIn: math.logic-sets.cartesian-product
    anchor: def-reflexive
  - id: math.logic-sets.transitive
    zh: |
      传递性
    en: |
      transitivity
    brief: |
      集合$A$上的关系$R$对所有$a,b,c\in A$，只要$a\mathrel{R}b$且$b\mathrel{R}c$就有$a\mathrel{R}c$时，说$R$具有传递性。
    definedIn: math.logic-sets.cartesian-product
    anchor: def-transitive
  - id: math.logic-sets.symmetric
    zh: |
      对称性
    en: |
      symmetry
    brief: |
      集合$A$上的关系$R$对所有$a,b\in A$，只要$a\mathrel{R}b$就有$b\mathrel{R}a$时，说$R$具有对称性，也说$R$是对称的。
    definedIn: math.logic-sets.equivalence-relations
    anchor: def-symmetric
  - id: math.logic-sets.equivalence-relation
    zh: |
      等价关系
    en: |
      equivalence relation
    brief: |
      集合上自反、对称、传递的二元关系，常记作$\sim$，如整数的模$n$同余、实数的相等。
    definedIn: math.logic-sets.equivalence-relations
    anchor: def-equivalence-relation
  - id: math.logic-sets.equivalence-class
    zh: |
      等价类
    en: |
      equivalence class
    brief: |
      $A$上的等价关系$\sim$下，与$a$等价的元素组成的集合$[a]=\{x\in A:x\sim a\}$；两个等价类要么相等，要么不相交。
    definedIn: math.logic-sets.equivalence-relations
    anchor: def-equivalence-class
  - id: math.logic-sets.representative
    zh: |
      代表元
    en: |
      representative
    brief: |
      把一个等价类写成$[a]$时所取的元素$a$；类里每个元素都能当代表元，$[a]=[b]$当且仅当$a\sim b$。
    definedIn: math.logic-sets.equivalence-relations
    anchor: def-representative
  - id: math.logic-sets.quotient-set
    zh: |
      商集
    en: |
      quotient set
    brief: |
      集合$A$关于等价关系$\sim$的全部等价类组成的集合，记作$A/{\sim}$；它的元素是$A$的子集。
    definedIn: math.logic-sets.equivalence-relations
    anchor: def-quotient-set
  - id: math.logic-sets.partition
    zh: |
      划分
    en: |
      partition
    brief: |
      集合的划分：集合$A$的一些两两不相交的非空子集，并起来是$A$；等价关系的全部等价类就组成$A$的一个划分。
    definedIn: math.logic-sets.equivalence-relations
    anchor: def-partition
  - id: math.logic-sets.map
    zh: |
      映射
    en: |
      map
    brief: |
      设$A$、$B$是集合，$A$的每个元素$x$都恰好对应$B$的一个元素$f(x)$，这样的对应$f:A\to B$叫作从$A$到$B$的映射。
    definedIn: math.logic-sets.functions
    anchor: def-map
  - id: math.logic-sets.domain
    zh: |
      定义域
    en: |
      domain
    brief: |
      映射$f:A\to B$里的集合$A$：$A$的每个元素$x$都要有像$f(x)$；定义域不同，就是不同的映射。
    definedIn: math.logic-sets.functions
    anchor: def-map
  - id: math.logic-sets.codomain
    zh: |
      陪域
    en: |
      codomain
    brief: |
      映射$f:A\to B$里的集合$B$：所有的像都在$B$里，但不必取遍$B$；陪域不同，就是不同的映射。
    definedIn: math.logic-sets.functions
    anchor: def-map
  - id: math.logic-sets.range
    zh: |
      像集
    en: |
      range
    brief: |
      映射$f:A\to B$的所有像组成的集合$f(A)=\{f(x):x\in A\}$，是陪域的子集；数集之间的映射的像集就是值域。
    definedIn: math.logic-sets.functions
    anchor: def-range
  - id: math.logic-sets.identity-map
    zh: |
      恒等映射
    en: |
      identity map
    brief: |
      把集合$A$的每个元素映成它自己的映射$\mathrm{id}_A:A\to A$，$x\mapsto x$。
    definedIn: math.logic-sets.functions
    anchor: def-identity-map
  - id: math.logic-sets.antisymmetric
    zh: |
      反对称性
    en: |
      antisymmetry
    brief: |
      集合$A$上的关系$R$对所有$a,b\in A$，只要$a\mathrel{R}b$且$b\mathrel{R}a$就有$a=b$时，说$R$具有反对称性，也说$R$是反对称的。
    definedIn: math.logic-sets.partial-orders
    anchor: def-antisymmetric
  - id: math.logic-sets.partial-order
    zh: |
      偏序
    en: |
      partial order
    brief: |
      集合上自反、反对称、传递的二元关系，也叫偏序关系，常记作$\preceq$，如$\Pow(X)$上的$\subseteq$、$\N^+$上的整除。
    definedIn: math.logic-sets.partial-orders
    anchor: def-partial-order
  - id: math.logic-sets.poset
    zh: |
      偏序集
    en: |
      partially ordered set
    abbr: |
      poset
    brief: |
      集合$P$连同它上面的一个偏序$\preceq$，记作${(P,\preceq)}$；同一个集合上可以有不同的偏序，所以要写明是哪一个。
    definedIn: math.logic-sets.partial-orders
    anchor: def-partial-order
  - id: math.logic-sets.total-order
    zh: |
      全序
    en: |
      total order
    brief: |
      任意两个元素都可比的偏序，也叫线性序，如$\R$上的$\le$；带着全序的集合叫全序集。
    definedIn: math.logic-sets.partial-orders
    anchor: def-total-order
  - id: math.logic-sets.comparable
    zh: |
      可比
    en: |
      comparable
    brief: |
      偏序集的两个元素$a$、$b$，$a\preceq b$或$b\preceq a$成立时说它们可比；按整除，$2$和$3$就不可比。
    definedIn: math.logic-sets.partial-orders
    anchor: def-total-order
  - id: math.logic-sets.chain
    zh: |
      链
    en: |
      chain
    brief: |
      偏序集的一个子集，其中任意两个元素都可比；空集和只含一个元素的集合也是链。
    definedIn: math.logic-sets.partial-orders
    anchor: def-chain
  - id: math.logic-sets.hasse-diagram
    zh: |
      哈斯图
    en: |
      Hasse diagram
    brief: |
      有限偏序集的图：每个元素画成一点，$a\prec b$并且两者之间没有别的元素时，把$b$画在$a$的上方并连一条线。
    definedIn: math.logic-sets.partial-orders
    anchor: def-hasse-diagram
  - id: math.logic-sets.injective
    zh: |
      单射
    en: |
      injective
    brief: |
      把不同的元素总送到不同的像的映射$f$：由$f(x_1)=f(x_2)$推出$x_1=x_2$，即每个方程$f(x)=y$至多有一个解。
    definedIn: math.logic-sets.injective-surjective
    anchor: def-injective
  - id: math.logic-sets.surjective
    zh: |
      满射
    en: |
      surjective
    brief: |
      像集等于陪域的映射$f:A\to B$：$B$的每个元素都是某个元素的像，即每个方程$f(x)=y$（$y\in B$）至少有一个解。
    definedIn: math.logic-sets.injective-surjective
    anchor: def-surjective
  - id: math.logic-sets.bijective
    zh: |
      双射
    en: |
      bijective
    brief: |
      既是单射又是满射的映射：陪域的每个元素恰是一个元素的像，也就是中学说的一一对应。
    definedIn: math.logic-sets.injective-surjective
    anchor: def-bijective
  - id: math.logic-sets.constant-map
    zh: |
      常值映射
    en: |
      constant map
    brief: |
      把$A$的每个元素都映成$B$的同一个元素$b$的映射$A\to B$。
    definedIn: math.logic-sets.functions
    anchor: def-constant-inclusion
  - id: math.logic-sets.inclusion-map
    zh: |
      包含映射
    en: |
      inclusion map
    brief: |
      $A\subseteq B$时，把$A$的元素当作$B$的元素的映射$A\to B$，$x\mapsto x$。
    definedIn: math.logic-sets.functions
    anchor: def-constant-inclusion
  - id: math.logic-sets.peano-axioms
    zh: |
      皮亚诺公理
    en: |
      Peano axioms
    brief: |
      刻画自然数的五条公理：有$0$；每个数有后继；$0$不是后继；后继相同则数相同；含$0$、又含有其中每个数的后继的子集就是全体。
    definedIn: math.logic-sets.peano-axioms
    anchor: def-peano-axioms
  - id: math.logic-sets.successor
    zh: |
      后继
    en: |
      successor
    brief: |
      皮亚诺公理里，自然数$n$后面紧跟着的那个数$S(n)$；定义了加法以后，它就是$n+1$。
    definedIn: math.logic-sets.peano-axioms
    anchor: def-peano-axioms
  - id: math.logic-sets.recursion-theorem
    zh: |
      递归定理
    en: |
      recursion theorem
    brief: |
      给定$c\in X$和映射$g:X\to X$，恰有一个映射$h:\N\to X$，使$h(0)=c$，并且每个$n$都有$h(S(n))=g(h(n))$，这里$S(n)$是$n$的后继。
    definedIn: math.logic-sets.peano-axioms
    anchor: thm-recursion
  - id: math.logic-sets.recursive-definition
    zh: |
      递归定义
    en: |
      recursive definition
    brief: |
      给出$h(0)\in X$和由$h(n)$得到$h(S(n))$的规则$g:X\to X$来规定映射$h:\N\to X$的办法，$S(n)$是$n$的后继；由递归定理，这样的$h$恰有一个。
    definedIn: math.logic-sets.peano-axioms
    anchor: def-recursive-definition
  - id: math.logic-sets.induction-principle
    zh: |
      归纳原理
    en: |
      principle of mathematical induction
    brief: |
      若$P(0)$成立，并且对每个$k\in\N$，由$P(k)$成立能推出$P(k+1)$成立，则$P(n)$对所有$n\in\N$都成立。
    definedIn: math.logic-sets.induction
    anchor: thm-induction-principle
  - id: math.logic-sets.induction-hypothesis
    zh: |
      归纳假设
    en: |
      induction hypothesis
    brief: |
      用数学归纳法时，为推出$P(k+1)$而假设成立的$P(k)$；强归纳法里，是从起点到$k$的各个命题都成立。
    definedIn: math.logic-sets.induction
    anchor: def-induction
  - id: math.logic-sets.preimage
    zh: |
      原像
    en: |
      preimage
    brief: |
      映射$f:X\to Y$下，被送进$Y$的子集$B$的元素组成的集合$f^{-1}(B)=\{x\in X:f(x)\in B\}$，也叫逆像，任何映射都能取；$f^{-1}(\{y\})$的元素也叫$y$的原像。
    definedIn: math.logic-sets.image-preimage
    anchor: def-preimage
  - id: math.logic-sets.family-union
    zh: |
      集族的并
    en: |
      union of a family
    brief: |
      属于集族$\{A_i\}_{i\in I}$中某一个$A_i$的元素组成的集合，记作$\bigcup_{i\in I}A_i$；指标是$1,2,3,\dots$时叫可数并。
    definedIn: math.logic-sets.indexed-families
    anchor: def-family-union-intersection
  - id: math.logic-sets.family-intersection
    zh: |
      集族的交
    en: |
      intersection of a family
    brief: |
      $I$不是空集时，属于集族$\{A_i\}_{i\in I}$中每一个$A_i$的元素组成的集合，记作$\bigcap_{i\in I}A_i$；指标是$1,2,3,\dots$时叫可数交。
    definedIn: math.logic-sets.indexed-families
    anchor: def-family-union-intersection
  - id: math.logic-sets.composite-map
    zh: |
      复合映射
    en: |
      composite map
    brief: |
      设$f:A\to B$，$g:B\to C$，先做$f$、再做$g$的映射$A\to C$，$x\mapsto g(f(x))$，记作$g\circ f$，先做的写在右边；函数之间的就是复合函数。
    definedIn: math.logic-sets.composition-inverse
    anchor: def-composite
  - id: math.logic-sets.inverse-map
    zh: |
      逆映射
    en: |
      inverse map
    brief: |
      对$f:A\to B$，满足$g\circ f=\mathrm{id}_A$和$f\circ g=\mathrm{id}_B$的映射$g:B\to A$，记作$f^{-1}$；$f$是双射时才有，而且只有一个。数集之间的就是反函数。
    definedIn: math.logic-sets.composition-inverse
    anchor: def-inverse
  - id: math.logic-sets.right-inverse
    zh: |
      右逆
    en: |
      right inverse
    brief: |
      对$f:A\to B$，映射$h:B\to A$满足$f\circ h=\mathrm{id}_B$时，说$h$是$f$的右逆：先做$h$、再做$f$，$B$的每个元素都回到原处。
    definedIn: math.logic-sets.composition-inverse
    anchor: def-one-sided-inverse
  - id: math.logic-sets.greatest-element
    zh: |
      最大元
    en: |
      greatest element
    brief: |
      设$S$是偏序集的子集，$g\in S$，每个$x\in S$都有$x\preceq g$时，$g$叫$S$的最大元；它至多有一个，存在时记作$\max S$。
    definedIn: math.logic-sets.maximal-elements
    anchor: def-greatest
  - id: math.logic-sets.least-element
    zh: |
      最小元
    en: |
      least element
    brief: |
      设$S$是偏序集的子集，$s\in S$，每个$x\in S$都有$s\preceq x$时，$s$叫$S$的最小元；它至多有一个，存在时记作$\min S$。
    definedIn: math.logic-sets.maximal-elements
    anchor: def-greatest
  - id: math.logic-sets.maximal-element
    zh: |
      极大元
    en: |
      maximal element
    brief: |
      设$S$是偏序集的子集，$m\in S$，$S$中没有比$m$大的元素，即$x\in S$且$m\preceq x$推出$x=m$时，$m$叫$S$的极大元；可以有好几个，也可以没有。
    definedIn: math.logic-sets.maximal-elements
    anchor: def-maximal
  - id: math.logic-sets.minimal-element
    zh: |
      极小元
    en: |
      minimal element
    brief: |
      设$S$是偏序集的子集，$m\in S$，$S$中没有比$m$小的元素，即$x\in S$且$x\preceq m$推出$x=m$时，$m$叫$S$的极小元；可以有好几个，也可以没有。
    definedIn: math.logic-sets.maximal-elements
    anchor: def-maximal
  - id: math.logic-sets.upper-bound
    zh: |
      上界
    en: |
      upper bound
    brief: |
      设$S$是偏序集$P$的子集，$u\in P$，每个$x\in S$都有$x\preceq u$时，$u$叫$S$的上界；$u$不必属于$S$，上界可以有很多个，也可以没有。
    definedIn: math.logic-sets.maximal-elements
    anchor: def-upper-bound
  - id: math.logic-sets.lower-bound
    zh: |
      下界
    en: |
      lower bound
    brief: |
      设$S$是偏序集$P$的子集，$l\in P$，每个$x\in S$都有$l\preceq x$时，$l$叫$S$的下界；$l$不必属于$S$，下界可以有很多个，也可以没有。
    definedIn: math.logic-sets.maximal-elements
    anchor: def-upper-bound
  - id: math.logic-sets.cancellation-law
    zh: |
      消去律
    en: |
      cancellation law
    brief: |
      等式两边同加（或同乘）的数可以消去的性质，如自然数的加法：由$m+k=n+k$能推出$m=n$；乘法里消去的数不能是$0$。
    definedIn: math.logic-sets.natural-arithmetic
    anchor: thm-cancellation
  - id: math.logic-sets.equinumerous
    zh: |
      等势
    en: |
      equinumerous
    brief: |
      集合$A$与$B$之间有双射时，说它们等势，记作$|A|=|B|$；对有限集，就是元素个数相同。
    definedIn: math.logic-sets.countable-sets
    anchor: def-equinumerous
  - id: math.logic-sets.finite-set
    zh: |
      有限集
    en: |
      finite set
    brief: |
      空集，或和某个$\{1,2,\dots,n\}$（$n$是正整数）之间有双射的集合；$n$就是它的元素个数，空集的元素个数是$0$。
    definedIn: math.logic-sets.countable-sets
    anchor: def-finite-set
  - id: math.logic-sets.infinite-set
    zh: |
      无限集
    en: |
      infinite set
    brief: |
      不是有限集的集合，也叫无穷集，如$\N$、$\Z$、$\R$。
    definedIn: math.logic-sets.countable-sets
    anchor: def-finite-set
  - id: math.logic-sets.countable-set
    zh: |
      可数集
    en: |
      countable set
    brief: |
      和$\N$等势的集合，也叫可列集：它的元素能不重复、不遗漏地排成一列$a_1,a_2,a_3,\dots$；不包括有限集。
    definedIn: math.logic-sets.countable-sets
    anchor: def-countable
  - id: math.logic-sets.at-most-countable
    zh: |
      至多可数集
    en: |
      at most countable set
    brief: |
      有限集和可数集的统称；有的书说的可数集就是它。
    definedIn: math.logic-sets.countable-sets
    anchor: def-countable
  - id: math.logic-sets.well-defined
    zh: |
      良定义
    en: |
      well-defined
    brief: |
      借代表元规定商集上的映射或运算时，换成同一等价类里别的代表元，结果都不变，就说这个规定是良定义的。
    definedIn: math.logic-sets.number-constructions
    anchor: def-well-defined
  - id: math.logic-sets.axiom-of-choice
    zh: |
      选择公理
    en: |
      axiom of choice
    brief: |
      由非空集合组成的集族$\{A_i\}_{i\in I}$都有选择函数，即有映射$f$，对每个$i\in I$都有$f(i)\in A_i$；它只断言存在，不给出怎样挑。
    definedIn: math.logic-sets.axiom-of-choice
    anchor: def-axiom-of-choice
  - id: math.logic-sets.zorn-lemma
    zh: |
      佐恩引理
    en: |
      Zorn's lemma
    brief: |
      非空的偏序集里，每条非空的链都有上界时，一定有极大元；和选择公理可以互相推出。
    definedIn: math.logic-sets.axiom-of-choice
    anchor: thm-zorn
  - id: math.logic-sets.well-ordering-principle
    zh: |
      良序原理
    en: |
      well-ordering principle
    brief: |
      正整数组成的非空集合里一定有最小的数；它和归纳原理可以互相推出。
    definedIn: math.logic-sets.induction
    anchor: def-well-ordering
  - id: math.logic-sets.uncountable-set
    zh: |
      不可数集
    en: |
      uncountable set
    brief: |
      不是至多可数集的集合，如$\R$：任给它的一列元素，总有元素不在其中。
    definedIn: math.logic-sets.uncountable-sets
    anchor: def-uncountable
  - id: math.logic-sets.cantor-theorem
    zh: |
      康托尔定理
    en: |
      Cantor's theorem
    brief: |
      任何集合都和它的幂集不等势。
    definedIn: math.logic-sets.uncountable-sets
    anchor: thm-cantor
  - id: math.logic-sets.diagonal-argument
    zh: |
      对角线论证
    en: |
      diagonal argument
    brief: |
      任给一列对象，造一个同类的对象，让它和第$n$个在第$n$处不同，由此断定这一列没有排全；编号也可以用别的集合的元素。
    definedIn: math.logic-sets.uncountable-sets
    anchor: def-diagonal-argument
  - id: math.logic-sets.indicator-function
    zh: |
      指示函数
    en: |
      indicator function
    brief: |
      集合$A$的子集$S$的指示函数$\mathbf 1_S:A\to\{0,1\}$：在$S$的元素处取$1$，其余元素处取$0$；也叫示性函数。
    definedIn: math.logic-sets.functions
    anchor: def-indicator-function
