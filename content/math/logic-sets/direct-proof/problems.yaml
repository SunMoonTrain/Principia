- id: p1
  tier: easy
  statement: |
    下面哪些是命题「对所有正整数$n$，$2^n>n^2$」的反例？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $n=1$
      - |
        $n=2$
      - |
        $n=3$
      - |
        $n=4$
      - |
        $n=-1$
    value: [2, 3, 4]
  hints:
    - |
      反例要满足两条：在取值范围里，这里就是正整数；并且使$2^n>n^2$不成立。
    - |
      逐个比较：$n=1,2,3,4$时，$2^n$依次是$2,4,8,16$，$n^2$依次是$1,4,9,16$。E 的$n=-1$在取值范围里吗？
    - |
      $n=1$时$2>1$，$2^n>n^2$成立，不是反例；$n=2$、$n=4$时两边相等，$n=3$时$8<9$，$2^n>n^2$都不成立，是反例。$n=-1$时$2^{-1}=\frac12<1$，可$-1$不是正整数，不在取值范围里，不算反例。所以选 B、C、D。
  solution: |
    反例是取值范围里使$2^n>n^2$不成立的元素，这里要是正整数。$n=1$时$2^1=2>1$，不等式成立，不是反例。$n=2$时$4>4$不成立，$n=3$时$8>9$不成立，$n=4$时$16>16$不成立，这三个都是反例。$n=-1$虽然使$2^{-1}=\frac12>1$不成立，可它不是正整数，不算反例；选 B、C、D。

- id: p2
  tier: easy
  statement: |
    设$a$、$b$是实数。要用改证逆否命题的办法证明「若$a+b$是无理数，则$a$、$b$中至少有一个是无理数」，应当证明下面哪个命题？
  answer:
    type: choice
    multiple: false
    options:
      - |
        若$a$、$b$中至少有一个是有理数，则$a+b$是有理数
      - |
        若$a+b$是有理数，则$a$、$b$都是有理数
      - |
        若$a$、$b$都是有理数，则$a+b$是有理数
      - |
        若$a$、$b$中至少有一个是无理数，则$a+b$是无理数
    value: 3
  hints:
    - |
      $P\Rightarrow Q$的:term[逆否命题]{id="math.logic-sets.contrapositive"}是$\neg Q\Rightarrow\neg P$：条件、结论都换成否定，再交换位置。
    - |
      这里$P$是「$a+b$是无理数」，$Q$是「$a$、$b$中至少有一个是无理数」。实数不是有理数就是无理数，「至少有一个是无理数」的否定是什么？
    - |
      $\neg Q$是「$a$、$b$都是有理数」，$\neg P$是「$a+b$是有理数」，所以逆否命题是「若$a$、$b$都是有理数，则$a+b$是有理数」，选 C。A 把「至少有一个是无理数」否定错了；B 只换成否定、没有交换；D 是逆命题。
  solution: |
    记$P$为「$a+b$是无理数」，$Q$为「$a$、$b$中至少有一个是无理数」。实数不是有理数就是无理数，由:term[德摩根律]{id="math.logic-sets.de-morgan-laws"}，$\neg Q$是「$a$、$b$都是有理数」，$\neg P$是「$a+b$是有理数」。:term[逆否命题]{id="math.logic-sets.contrapositive"}$\neg Q\Rightarrow\neg P$是「若$a$、$b$都是有理数，则$a+b$是有理数」，选 C；它一行就证完：两个有理数的和是有理数。A 的条件不是$\neg Q$，B 是$\neg P\Rightarrow\neg Q$，D 是:term[逆命题]{id="math.logic-sets.converse"}$Q\Rightarrow P$，都不是逆否命题。

- id: p3
  tier: medium
  statement: |
    整数的平方除以$8$，余数可能是哪些数？把所有可能的余数都填上。
  answer:
    type: set
    value: [0, 1, 4]
    exact: true
  hints:
    - |
      整数不是偶数就是奇数，分情况讨论；偶数的情形还要再分一次。
    - |
      $n=2k+1$时$n^2=4k(k+1)+1$，而$k(k+1)$是两个相邻整数的积；$n=2k$时$n^2=4k^2$，再按$k$是偶数还是奇数分。
    - |
      $n$是奇数时，$k(k+1)$是偶数，记作$2j$，$n^2=8j+1$，余$1$。$n=2k$、$k=2j$时$n^2=16j^2=8\cdot2j^2$，余$0$；$k=2j+1$时$n^2=4(4j^2+4j+1)=8(2j^2+2j)+4$，余$4$。这些余数都在$0$到$7$之间，由余数的唯一性，余数只可能是$0$、$1$、$4$，而$n=0,1,2$分别给出这三个，所以填$0$、$1$、$4$。
  solution: |
    分情况讨论。$n=2k+1$时，$n^2=4k(k+1)+1$，两个相邻整数的积$k(k+1)$是偶数，记作$2j$，于是$n^2=8j+1$，余$1$。$n=2k$时，$n^2=4k^2$：$k=2j$时$n^2=8\cdot2j^2$，余$0$；$k=2j+1$时$n^2=8(2j^2+2j)+4$，余$4$。

    这些写法里的余数都在$0$到$7$之间，由余数的唯一性，整数的平方除以$8$的余数只能是$0$、$1$、$4$；$n=0,1,2$时依次取到$0$、$1$、$4$。

- id: p4
  tier: medium
  statement: |
    求最小的正整数$N$，使所有大于$N$的整数$n$都满足$n^2>20n+100$。
  answer:
    type: number
    value: 24
    exact: true
  hints:
    - |
      要说明某个$N$够用，得对所有大于它的整数$n$证明这个不等式，要任取一个来证；要说明比它小的不够用，各举一个反例就行。
    - |
      配方：$n^2-20n-100=(n-10)^2-200$。$n$比$10$大多少时，$(n-10)^2$才超过$200$？
    - |
      $14^2=196<200<225=15^2$。$n\ge25$时$(n-10)^2\ge225>200$，不等式成立，所以$N=24$够用。$n=24$时$24^2=576$，$20\times24+100=580$，不等式不成立；$N\le23$时$24$大于$N$，是「所有大于$N$的整数都满足不等式」的反例。所以最小的$N$是$24$。
  solution: |
    $n^2-20n-100=(n-10)^2-200$。任取大于$24$的整数$n$，则$n\ge25$，$(n-10)^2\ge15^2=225>200$，所以$n^2>20n+100$，$N=24$够用。$N\le23$时，$n=24$大于$N$，却有$24^2=576<580=20\times24+100$，是反例，这样的$N$都不够用。所以最小的$N$是$24$。

- id: p5
  tier: hard
  statement: |
    证明：整数$n$是$3$的倍数，当且仅当$n^2$是$3$的倍数。
  hints:
    - |
      两个方向分开证。「若$n$是$3$的倍数，则$n^2$是$3$的倍数」直接算；反方向从「$n^2$是$3$的倍数」出发推不动，看它的:term[逆否命题]{id="math.logic-sets.contrapositive"}。
    - |
      由带余除法，$n$除以$3$的余数是$0$、$1$、$2$之一；$n$不是$3$的倍数时，余数是$1$或$2$，$n$可以写成$3k+1$或$3k+2$。分这两种情形，看$n^2$除以$3$余几。
    - |
      先证「若$n$是$3$的倍数，则$n^2$是$3$的倍数」：$n=3k$时$n^2=3\cdot3k^2$。

      再证「若$n^2$是$3$的倍数，则$n$是$3$的倍数」，改证逆否命题「若$n$不是$3$的倍数，则$n^2$不是$3$的倍数」。这时$n=3k+1$或$n=3k+2$，$k$是整数：$n=3k+1$时$n^2=3(3k^2+2k)+1$，$n=3k+2$时$n^2=3(3k^2+4k+1)+1$。由余数的唯一性，两种情形下$n^2$除以$3$都余$1$，不余$0$，所以$n^2$不是$3$的倍数，两个方向都证完了。
  reference: |
    「若$n$是$3$的倍数，则$n^2$是$3$的倍数」：设$n=3k$，$k$是整数，则$n^2=9k^2=3\cdot3k^2$，$3k^2$是整数，所以$n^2$是$3$的倍数。

    「若$n^2$是$3$的倍数，则$n$是$3$的倍数」：改证逆否命题「若$n$不是$3$的倍数，则$n^2$不是$3$的倍数」。由带余除法，$n=3k+r$，$k$是整数，$r$是$0$、$1$、$2$之一；$r=0$时$n=3k$是$3$的倍数，所以$n$不是$3$的倍数时，$r$是$1$或$2$。

    $r=1$时$n^2=9k^2+6k+1=3(3k^2+2k)+1$；$r=2$时$n^2=9k^2+12k+4=3(3k^2+4k+1)+1$。两种情形下$n^2$都写成了「$3$的倍数加$1$」，由余数的唯一性，$n^2$除以$3$余$1$；而$3$的倍数除以$3$余$0$，所以$n^2$不是$3$的倍数。由分情况讨论，逆否命题成立，这个方向也就成立；两个方向合起来，就是要证的「当且仅当」。

- id: p6
  tier: hard
  statement: |
    每个正整数都能写成$2^km$的样子，其中$k$是非负整数，$m$是奇数，例如$24=2^3\cdot3$、$7=2^0\cdot7$。证明这样的写法只有一种：若$2^km=2^lm'$，其中$k$、$l$是非负整数，$m$、$m'$是奇数，则$k=l$且$m=m'$。
  hints:
    - |
      这是唯一性：设有两种写法，推出它们是同一种。两种写法的地位一样，可以不妨设其中一个指数不大于另一个，写的时候说清为什么可以。
    - |
      不妨设$k\le l$，两边除以$2^k$，得$m=2^{l-k}m'$。$l-k\ge1$时，右边是奇数还是偶数？
    - |
      把两种写法对调（$k$和$l$对调，$m$和$m'$对调），条件和要证的结论都不变，所以不妨设$k\le l$。两边除以$2^k$得$m=2^{l-k}m'$。若$l-k\ge1$，则$m=2\cdot2^{l-k-1}m'$是偶数；可$m$是奇数，由余数的唯一性，奇数不是偶数，对「若$l-k\ge1$，则$m$是偶数」用逆否命题，$l-k\ge1$不成立。于是$l=k$，再由$m=2^0m'$得$m=m'$。
  reference: |
    两种写法的地位一样：把$k$和$l$对调、$m$和$m'$对调，条件$2^km=2^lm'$和要证的结论「$k=l$且$m=m'$」都不变，所以不妨设$k\le l$。

    两边除以$2^k$（它不是$0$），得$m=2^{l-k}m'$，这里$l-k$是非负整数。若$l-k\ge1$，则$m=2\cdot\bigl(2^{l-k-1}m'\bigr)$，括号里是整数，$m$是偶数。可$m$是奇数，由余数的唯一性，一个整数不能既是奇数又是偶数；对「若$l-k\ge1$，则$m$是偶数」用逆否命题，$l-k\ge1$不成立。

    于是$l-k=0$，即$k=l$；代回去，$m=2^0m'=m'$。所以两种写法相同，写法只有一种。

- id: p7
  tier: thinking
  statement: |
    「不妨设」省掉了一种情形，省得对不对，要看那种情形能不能化成写出来的这一种。

    （1）证明「若实数$x$、$y$满足$x+y>0$，则$x>0$或$y>0$」时，写「不妨设$x\ge y$」可以吗？在这个假设下把证明写完。

    （2）证明「对实数$a$、$b$，$|a|-|b|\le|a-b|$」时，有人写「不妨设$|a|\ge|b|$」，然后只证了这一种情形。交换$a$、$b$，要证的式子还是原来那个吗？他省掉的情形要不要另外交代，怎样补一句？

    （3）要证「非负实数$a$、$b$、$c$满足$a+b+c=3$时，$a^2b+b^2c+c^2a\le4$」（本题不用证它）。把$a$、$b$、$c$依次换成$b$、$c$、$a$，叫作轮换（cyclic permutation），条件和结论都不变；交换$a$、$b$，左边却变成$b^2a+a^2c+c^2b$。证明时能不能「不妨设$a$最大」？能不能「不妨设$a\ge b\ge c$」？
  hints:
    - |
      先看交换两个字母或者轮换以后，条件和要证的结论变不变。
    - |
      （1）交换$x$、$y$，条件$x+y>0$和结论「$x>0$或$y>0$」都不变；在$x\ge y$下，$2x\ge x+y$。（2）交换以后是$|b|-|a|\le|b-a|$，左边换了号；$|a|<|b|$时，原式左边是正是负？（3）$b$最大时轮换一次，$c$最大时轮换两次，最大的数到了哪个位置？$a$最大时还有$a\ge b\ge c$、$a\ge c\ge b$两种次序，轮换能把后一种变成前一种吗？
    - |
      （1）可以：交换$x$、$y$，条件和结论都不变，$x<y$的情形把两个字母的名字对调，就成了$x\ge y$的情形。设$x\ge y$，则$2x\ge x+y>0$，所以$x>0$，结论成立。

      （2）交换以后是$|b|-|a|\le|b-a|$，左边换了号，和原式不是同一句话，所以$|a|<|b|$的情形不能靠对调字母化过来。好在这种情形一眼就能看出成立：左边$|a|-|b|<0$，右边$|a-b|\ge0$。补一句「$|a|<|b|$时左边是负数，式子显然成立，所以不妨设$|a|\ge|b|$」，漏掉的情形就交代了。

      （3）能不妨设$a$最大：轮换下条件和结论都不变，$b$最大时把$a$、$b$、$c$依次换成$b$、$c$、$a$，$c$最大时依次换成$c$、$a$、$b$，最大的数都到了$a$的位置。不能不妨设$a\ge b\ge c$：$a$最大时还有$a\ge c\ge b$这种次序，轮换只能把它变成$c\ge b\ge a$或$b\ge a\ge c$，变不成$a\ge b\ge c$；要变成$a\ge b\ge c$得交换$b$、$c$，可那样左边就变了。所以只能写「不妨设$a$最大」，$b\ge c$和$c\ge b$两种情形还要分别证，或者另找理由把一种化成另一种。
  reference: |
    （1）可以。交换$x$、$y$，条件$x+y>0$和结论「$x>0$或$y>0$」都不变，所以$x<y$的情形把两个字母的名字对调，就成了$x\ge y$的情形。设$x\ge y$，则$2x\ge x+y>0$，所以$x>0$，结论成立。也可以不用不妨设，照证「或」的办法：设$x\le0$，则$y=(x+y)-x>0$。

    （2）交换$a$、$b$得$|b|-|a|\le|b-a|$，即$|b|-|a|\le|a-b|$，左边换了号，和原式不是同一句话，$|a|<|b|$的情形不能靠对调字母化成$|a|\ge|b|$。但这种情形本身显然成立：左边$|a|-|b|<0\le|a-b|$。所以要补一句「$|a|<|b|$时左边小于$0$，式子显然成立」，再不妨设$|a|\ge|b|$，这样就不漏情形了。

    （3）可以不妨设$a$最大。条件「$a$、$b$、$c$非负，$a+b+c=3$」和结论在轮换下都不变，把$a$、$b$、$c$依次换成$b$、$c$、$a$以后还是原来那个命题；$b$最大时轮换一次，$c$最大时轮换两次（依次换成$c$、$a$、$b$），最大的数就到了$a$的位置，化成了$a$最大的情形。

    不能不妨设$a\ge b\ge c$。六种大小次序在轮换下分成两组：$a\ge b\ge c$、$c\ge a\ge b$、$b\ge c\ge a$一组，$a\ge c\ge b$、$c\ge b\ge a$、$b\ge a\ge c$一组，轮换只在组内互变；从一组到另一组要交换两个字母，而交换以后左边变成$b^2a+a^2c+c^2b$，不是原来的命题。所以写「不妨设$a\ge b\ge c$」会把$a\ge c\ge b$那一组漏掉，只能写「不妨设$a$最大」，再分$b\ge c$、$c\ge b$两种情形。

    对这个不等式，后一组其实另有理由化过来：$(a^2b+b^2c+c^2a)-(a^2c+c^2b+b^2a)=(a-b)(b-c)(a-c)$，$a\ge c\ge b$时它不大于$0$，左边不超过把$b$、$c$对调后的值，而对调后的三个数是$a\ge b\ge c$的次序。这条理由要另外写出来，不能只写一句「不妨设」。

- id: p8
  tier: thinking
  statement: |
    要证$\sqrt2+\sqrt7<\sqrt3+\sqrt6$，有人这样写：「要证$\sqrt2+\sqrt7<\sqrt3+\sqrt6$，两边平方，只要证$9+2\sqrt{14}<9+2\sqrt{18}$，即$\sqrt{14}<\sqrt{18}$，即$14<18$，这显然成立。」

    （1）这是从结论往回推。把它倒过来，写成从$14<18$出发的直接证明，并指出哪一步倒过来时要用到「两边都是正数」。

    （2）解方程$\sqrt{x+2}=x$时，两边平方得$x^2-x-2=0$，解得$x=2$或$x=-1$，可$x=-1$并不满足原方程。用「若……则……」说说，平方这一步证明了什么、没证明什么，为什么最后要把解代回去检验。

    （3）由此说说：往回推的草稿满足什么条件，才能改写成证明？
  hints:
    - |
      往回推时，每一步写的是「要证甲，只要证乙」；这句话要成立，需要的是由乙能推出甲。
    - |
      （1）对正数$u$、$v$，$u<v$和$u^2<v^2$可以互推；$\sqrt2+\sqrt7$、$\sqrt3+\sqrt6$都是正数。（2）由$\sqrt{x+2}=x$能推出$x^2=x+2$；反过来，由$x^2=x+2$能推出什么？$x$是负数时呢？
    - |
      （1）由$14<18$得$\sqrt{14}<\sqrt{18}$，两边乘$2$再加$9$，得$9+2\sqrt{14}<9+2\sqrt{18}$，也就是$(\sqrt2+\sqrt7)^2<(\sqrt3+\sqrt6)^2$。两个底数都是正数，平方小的那个本身也小，所以$\sqrt2+\sqrt7<\sqrt3+\sqrt6$。最后这一步要用到两边都是正数：$(-3)^2>2^2$，可$-3<2$。

      （2）平方这一步证明的是「若$\sqrt{x+2}=x$，则$x=2$或$x=-1$」：「$x=2$或$x=-1$」只是$x$为解的:term[必要条件]{id="math.logic-sets.necessary-condition"}（necessary condition），解只可能在这两个数里。反过来不一定成立：由$x^2=x+2$只能得到$\sqrt{x+2}=|x|$，$x$是负数时它不等于$x$。所以要把两个数代回去，$x=2$满足，$x=-1$不满足，方程只有一个解$x=2$。

      （3）每一步「要证甲，只要证乙」都要由乙能推出甲；这样从最后那个成立的式子倒着读回去，就是一个直接证明。只做到由甲推出乙的步骤（比如不管正负就两边平方），倒过来不一定成立，得补上条件，或者像解方程那样最后检验。
  reference: |
    （1）倒过来写：由$14<18$，两边开平方得$\sqrt{14}<\sqrt{18}$；两边乘$2$再加$9$，得$9+2\sqrt{14}<9+2\sqrt{18}$，即$(\sqrt2+\sqrt7)^2<(\sqrt3+\sqrt6)^2$。对正数$u$、$v$，$u\ge v$时$u^2\ge v^2$，由逆否命题，$u^2<v^2$时$u<v$；$\sqrt2+\sqrt7$和$\sqrt3+\sqrt6$都是正数，所以$\sqrt2+\sqrt7<\sqrt3+\sqrt6$。最后这一步用到了两边都是正数，对负数不行，例如$(-3)^2>2^2$，可$-3<2$；开平方保持非负数的大小顺序，乘正数、加同一个数也不改变不等号的方向。

    （2）由$\sqrt{x+2}=x$平方得$x+2=x^2$，所以平方这一步证明的是「若$\sqrt{x+2}=x$，则$x^2-x-2=0$」，即「若$x$是解，则$x=2$或$x=-1$」：「$x=2$或$x=-1$」是「$x$是解」的必要条件（necessary condition），不是充分条件（sufficient condition）。反方向不成立：由$x^2=x+2$只能得到$\sqrt{x+2}=\sqrt{x^2}=|x|$，$x<0$时$|x|\ne x$。所以最后要检验：$x=2$时$\sqrt4=2$，是解；$x=-1$时$\sqrt1=1\ne-1$，不是解，方程只有一个解$x=2$。

    （3）往回推的每一步写的是「要证甲，只要证乙」，它要成立，需要由乙能推出甲。每一步都这样时，从最后那个显然成立的式子出发倒着读回去，每一步都是一个成立的「若……则……」，接起来就是一个直接证明，只是草稿上写的顺序反了。只做到由甲推出乙的步骤，例如不管正负就两边平方，倒过来不一定成立：要么补上让它能倒过来的条件（如两边都是正数），要么像解方程那样，把得到的候选代回去检验。
