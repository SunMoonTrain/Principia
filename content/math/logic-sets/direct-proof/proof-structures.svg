<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-size="14">
  <!-- 三幅论证的结构图：左是直接证明（设 P → Q₁ → Q₂ → 得到 Q），中是证明逆否命题（设 ¬Q → … → 得到 ¬P），右是分情况讨论（已知 P ∨ Q 分成设 P、设 Q 两支，各自走到 R） -->
  <!-- 标题 -->
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="100" y="22">直接证明</text>
    <text x="300" y="22">证明逆否命题</text>
    <text x="500" y="22">分情况讨论</text>
  </g>
  <!-- 方框 -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="50" y="40" width="100" height="32" rx="6" />
    <rect x="50" y="104" width="100" height="32" rx="6" />
    <rect x="50" y="168" width="100" height="32" rx="6" />
    <rect x="250" y="40" width="100" height="32" rx="6" />
    <rect x="250" y="136" width="100" height="32" rx="6" />
    <rect x="448" y="40" width="104" height="32" rx="6" />
    <rect x="414" y="136" width="74" height="32" rx="6" />
    <rect x="512" y="136" width="74" height="32" rx="6" />
  </g>
  <!-- 走到的终点：强调色的框 -->
  <g fill="none" stroke-width="1.5" style="stroke: var(--accent, #2563eb)">
    <rect x="50" y="232" width="100" height="32" rx="6" />
    <rect x="250" y="232" width="100" height="32" rx="6" />
    <rect x="414" y="232" width="74" height="32" rx="6" />
    <rect x="512" y="232" width="74" height="32" rx="6" />
  </g>
  <!-- 箭头：线段加三角形的头 -->
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="100" y1="73" x2="100" y2="95" />
    <line x1="100" y1="137" x2="100" y2="159" />
    <line x1="100" y1="201" x2="100" y2="223" />
    <line x1="300" y1="73" x2="300" y2="127" />
    <line x1="300" y1="169" x2="300" y2="223" />
    <line x1="500" y1="73" x2="456.58" y2="127.94" />
    <line x1="500" y1="73" x2="543.42" y2="127.94" />
    <line x1="451" y1="169" x2="451" y2="223" />
    <line x1="549" y1="169" x2="549" y2="223" />
  </g>
  <g fill="currentColor">
    <polygon points="100,103 95.5,94 104.5,94" />
    <polygon points="100,167 95.5,158 104.5,158" />
    <polygon points="100,231 95.5,222 104.5,222" />
    <polygon points="300,135 295.5,126 304.5,126" />
    <polygon points="300,231 295.5,222 304.5,222" />
    <polygon points="451,135 460.11,130.73 453.05,125.15" />
    <polygon points="549,135 546.95,125.15 539.89,130.73" />
    <polygon points="451,231 446.5,222 455.5,222" />
    <polygon points="549,231 544.5,222 553.5,222" />
    <!-- 中图中间的「……」：三个小圆点 -->
    <circle cx="290" cy="152" r="2" />
    <circle cx="300" cy="152" r="2" />
    <circle cx="310" cy="152" r="2" />
  </g>
  <!-- 方框里的字 -->
  <g fill="currentColor" text-anchor="middle">
    <text x="100" y="61">设 <tspan font-style="italic">P</tspan></text>
    <text x="100" y="125"><tspan font-style="italic">Q</tspan><tspan font-size="10" dy="4">1</tspan></text>
    <text x="100" y="189"><tspan font-style="italic">Q</tspan><tspan font-size="10" dy="4">2</tspan></text>
    <text x="100" y="253">得到 <tspan font-style="italic">Q</tspan></text>
    <text x="300" y="61">设 ¬<tspan font-style="italic">Q</tspan></text>
    <text x="300" y="253">得到 ¬<tspan font-style="italic">P</tspan></text>
    <text x="500" y="61">已知 <tspan font-style="italic">P</tspan> ∨ <tspan font-style="italic">Q</tspan></text>
    <text x="451" y="157">设 <tspan font-style="italic">P</tspan></text>
    <text x="549" y="157">设 <tspan font-style="italic">Q</tspan></text>
    <text x="451" y="253">得到 <tspan font-style="italic">R</tspan></text>
    <text x="549" y="253">得到 <tspan font-style="italic">R</tspan></text>
  </g>
  <!-- 底下的说明：证出了什么 -->
  <g text-anchor="middle" style="fill: var(--accent, #2563eb)">
    <text x="100" y="292">证出 <tspan font-style="italic">P</tspan> ⇒ <tspan font-style="italic">Q</tspan></text>
    <text x="300" y="292">证出 ¬<tspan font-style="italic">Q</tspan> ⇒ ¬<tspan font-style="italic">P</tspan>，</text>
    <text x="300" y="314">也就证出 <tspan font-style="italic">P</tspan> ⇒ <tspan font-style="italic">Q</tspan></text>
    <text x="500" y="292">两支都得到 <tspan font-style="italic">R</tspan>，</text>
    <text x="500" y="314">证出 <tspan font-style="italic">R</tspan></text>
  </g>
</svg>
