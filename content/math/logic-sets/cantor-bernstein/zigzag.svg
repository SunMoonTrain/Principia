<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 436" width="620" height="436" font-size="14">
  <!-- 左列 A（x = 196），右列 B（x = 400）。f 的箭头是实线、向右，g 的箭头是虚线、向左。上面一串：a₀ 不是 g 的值，f：aₙ → bₙ，g：bₙ → aₙ₊₁，左边的点都在 C 里（强调色）；下面一串：y₀ 不是 f 的值，g：yₙ → xₙ，f：xₙ → yₙ₊₁，左边的点都不在 C 里。横的箭头画粗，是 h 配成的对：aₙ 配 bₙ，xₙ 配 yₙ。两串的最后各有半截箭头和三个小点，表示还有 -->
  <!-- C 的框 -->
  <rect x="146" y="50" width="64" height="176" rx="12" fill="none" stroke-width="1.3" style="stroke: var(--accent, #2563eb)" />
  <!-- 上面一串：f（粗、实线、强调色），g（细、虚线） -->
  <g stroke-width="2.8" style="stroke: var(--accent, #2563eb)">
    <line x1="204" y1="70" x2="383" y2="70" />
    <line x1="204" y1="122" x2="383" y2="122" />
    <line x1="204" y1="174" x2="383" y2="174" />
  </g>
  <g style="fill: var(--accent, #2563eb)">
    <polygon points="392,70 383,74.4 383,65.6" />
    <polygon points="392,122 383,126.4 383,117.6" />
    <polygon points="392,174 383,178.4 383,169.6" />
  </g>
  <g stroke="currentColor" stroke-width="1.3" stroke-dasharray="6 4">
    <line x1="393.5" y1="76" x2="211.31" y2="114.16" />
    <line x1="393.5" y1="128" x2="211.31" y2="166.16" />
    <line x1="393.5" y1="180" x2="294.18" y2="200.8" />
  </g>
  <g fill="currentColor">
    <polygon points="202.5,116 210.53,110.44 212.09,117.87" />
    <polygon points="202.5,168 210.53,162.44 212.09,169.87" />
  </g>
  <!-- 下面一串：g（粗、虚线），f（细、实线） -->
  <g stroke="currentColor" stroke-width="2.8" stroke-dasharray="8 5">
    <line x1="392" y1="276" x2="213" y2="276" />
    <line x1="392" y1="328" x2="213" y2="328" />
    <line x1="392" y1="380" x2="213" y2="380" />
  </g>
  <g fill="currentColor">
    <polygon points="204,276 213,271.6 213,280.4" />
    <polygon points="204,328 213,323.6 213,332.4" />
    <polygon points="204,380 213,375.6 213,384.4" />
  </g>
  <g stroke="currentColor" stroke-width="1.3">
    <line x1="202.5" y1="282" x2="384.69" y2="320.16" />
    <line x1="202.5" y1="334" x2="384.69" y2="372.16" />
    <line x1="202.5" y1="386" x2="301.82" y2="406.8" />
  </g>
  <g fill="currentColor">
    <polygon points="393.5,322 383.91,323.87 385.47,316.44" />
    <polygon points="393.5,374 383.91,375.87 385.47,368.44" />
  </g>
  <!-- 点：C 的点用强调色 -->
  <g style="fill: var(--accent, #2563eb)">
    <circle cx="196" cy="70" r="5" />
    <circle cx="196" cy="122" r="5" />
    <circle cx="196" cy="174" r="5" />
    <circle cx="196" cy="200" r="1.7" />
    <circle cx="196" cy="208" r="1.7" />
    <circle cx="196" cy="216" r="1.7" />
  </g>
  <g fill="currentColor">
    <circle cx="400" cy="70" r="5" />
    <circle cx="400" cy="122" r="5" />
    <circle cx="400" cy="174" r="5" />
    <circle cx="400" cy="200" r="1.7" />
    <circle cx="400" cy="208" r="1.7" />
    <circle cx="400" cy="216" r="1.7" />
    <circle cx="400" cy="276" r="5" />
    <circle cx="400" cy="328" r="5" />
    <circle cx="400" cy="380" r="5" />
    <circle cx="196" cy="276" r="5" />
    <circle cx="196" cy="328" r="5" />
    <circle cx="196" cy="380" r="5" />
    <circle cx="196" cy="406" r="1.7" />
    <circle cx="196" cy="414" r="1.7" />
    <circle cx="196" cy="422" r="1.7" />
    <circle cx="400" cy="406" r="1.7" />
    <circle cx="400" cy="414" r="1.7" />
    <circle cx="400" cy="422" r="1.7" />
  </g>
  <!-- 集合的名字 -->
  <g fill="currentColor" font-size="16" font-style="italic" text-anchor="middle">
    <text x="196" y="34">A</text>
    <text x="400" y="34">B</text>
  </g>
  <text x="132" y="146" font-size="16" font-style="italic" text-anchor="end" style="fill: var(--accent, #2563eb)">C</text>
  <!-- 点的名字 -->
  <g fill="currentColor" font-size="15" text-anchor="end">
    <text x="182" y="75"><tspan font-style="italic">a</tspan><tspan font-size="10" dy="4">0</tspan></text>
    <text x="182" y="127"><tspan font-style="italic">a</tspan><tspan font-size="10" dy="4">1</tspan></text>
    <text x="182" y="179"><tspan font-style="italic">a</tspan><tspan font-size="10" dy="4">2</tspan></text>
    <text x="182" y="281"><tspan font-style="italic">x</tspan><tspan font-size="10" dy="4">0</tspan></text>
    <text x="182" y="333"><tspan font-style="italic">x</tspan><tspan font-size="10" dy="4">1</tspan></text>
    <text x="182" y="385"><tspan font-style="italic">x</tspan><tspan font-size="10" dy="4">2</tspan></text>
  </g>
  <g fill="currentColor" font-size="15">
    <text x="414" y="75"><tspan font-style="italic">b</tspan><tspan font-size="10" dy="4">0</tspan></text>
    <text x="414" y="127"><tspan font-style="italic">b</tspan><tspan font-size="10" dy="4">1</tspan></text>
    <text x="414" y="179"><tspan font-style="italic">b</tspan><tspan font-size="10" dy="4">2</tspan></text>
    <text x="414" y="281"><tspan font-style="italic">y</tspan><tspan font-size="10" dy="4">0</tspan></text>
    <text x="414" y="333"><tspan font-style="italic">y</tspan><tspan font-size="10" dy="4">1</tspan></text>
    <text x="414" y="385"><tspan font-style="italic">y</tspan><tspan font-size="10" dy="4">2</tspan></text>
  </g>
  <!-- 说明 -->
  <g fill="currentColor">
    <text x="136" y="75" text-anchor="end">不是 <tspan font-style="italic">g</tspan> 的值</text>
    <text x="136" y="333" text-anchor="end">不在 <tspan font-style="italic">C</tspan> 里</text>
    <text x="448" y="281">不是 <tspan font-style="italic">f</tspan> 的值</text>
  </g>
  <!-- 图例 -->
  <line x1="470" y1="97" x2="508" y2="97" stroke="currentColor" stroke-width="1.3" />
  <line x1="470" y1="125" x2="508" y2="125" stroke="currentColor" stroke-width="1.3" stroke-dasharray="6 4" />
  <line x1="470" y1="153" x2="508" y2="153" stroke="currentColor" stroke-width="2.8" />
  <g fill="currentColor">
    <text x="518" y="102"><tspan font-style="italic">f</tspan> 的箭头</text>
    <text x="518" y="130"><tspan font-style="italic">g</tspan> 的箭头</text>
    <text x="518" y="158"><tspan font-style="italic">h</tspan> 配成的对</text>
  </g>
</svg>
