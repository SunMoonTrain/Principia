<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 432" width="620" height="432" font-size="14">
  <!-- 画出 h : [0, 1] → (0, 1) 的各点 (x, h(x))。点 (u, v) 画在 (78 + 330u, 372 − 330v)，坐标轴往外挪了 20。线段 y = x 上挖掉 C 的点：0、1/3、4/9、13/27 和 1、2/3、5/9、14/27（空心圈，中间更密的不画）；C 的点挪到虚线 y = (x + 1)/3 上（强调色圆点）。强调色折线从空心圈竖着走到虚线，再横着走到下一个空心圈。右边是图例 -->
  <!-- 坐标轴 -->
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="58" y1="392" x2="434" y2="392" />
    <line x1="58" y1="392" x2="58" y2="16" />
  </g>
  <g fill="currentColor">
    <polygon points="442,392 434,395.6 434,388.4" />
    <polygon points="58,8 61.6,16 54.4,16" />
  </g>
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="78" y1="392" x2="78" y2="397" />
    <line x1="188" y1="392" x2="188" y2="397" />
    <line x1="224.67" y1="392" x2="224.67" y2="397" />
    <line x1="261.33" y1="392" x2="261.33" y2="397" />
    <line x1="298" y1="392" x2="298" y2="397" />
    <line x1="408" y1="392" x2="408" y2="397" />
    <line x1="58" y1="372" x2="53" y2="372" />
    <line x1="58" y1="262" x2="53" y2="262" />
    <line x1="58" y1="225.33" x2="53" y2="225.33" />
    <line x1="58" y1="188.67" x2="53" y2="188.67" />
    <line x1="58" y1="152" x2="53" y2="152" />
    <line x1="58" y1="42" x2="53" y2="42" />
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="78" y="414">0</text>
    <text x="188" y="414">1/3</text>
    <text x="224.67" y="414">4/9</text>
    <text x="261.33" y="414">5/9</text>
    <text x="298" y="414">2/3</text>
    <text x="408" y="414">1</text>
  </g>
  <g fill="currentColor" text-anchor="end">
    <text x="46" y="377">0</text>
    <text x="46" y="267">1/3</text>
    <text x="46" y="230.33">4/9</text>
    <text x="46" y="193.67">5/9</text>
    <text x="46" y="157">2/3</text>
    <text x="46" y="47">1</text>
  </g>
  <g fill="currentColor" font-size="15">
    <text x="448" y="397" font-style="italic">x</text>
    <text x="70" y="20"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">h</tspan><tspan dx="1">(</tspan><tspan font-style="italic">x</tspan><tspan dx="1">)</tspan></text>
  </g>
  <!-- 虚线 y = (x + 1)/3 -->
  <line x1="78" y1="262" x2="408" y2="152" stroke-width="1.2" stroke-dasharray="5 4" style="stroke: var(--muted, #6b7280)" />
  <!-- 线段 y = x，挖掉 C 的点 -->
  <g stroke="currentColor" stroke-width="2">
    <line x1="80.97" y1="369.03" x2="185.03" y2="264.97" />
    <line x1="190.97" y1="259.03" x2="221.7" y2="228.3" />
    <line x1="227.64" y1="222.36" x2="233.92" y2="216.08" />
    <line x1="239.86" y1="210.14" x2="246.14" y2="203.86" />
    <line x1="252.08" y1="197.92" x2="258.36" y2="191.64" />
    <line x1="264.3" y1="185.7" x2="295.03" y2="154.97" />
    <line x1="300.97" y1="149.03" x2="405.03" y2="44.97" />
  </g>
  <!-- 折线：空心圈 → 圆点 → 下一个空心圈 -->
  <g stroke-width="1.4" style="stroke: var(--accent, #2563eb)">
    <line x1="78" y1="367.8" x2="78" y2="266.2" />
    <line x1="82.2" y1="262" x2="183.8" y2="262" />
    <line x1="188" y1="257.8" x2="188" y2="229.53" />
    <line x1="192.2" y1="225.33" x2="220.47" y2="225.33" />
    <line x1="224.67" y1="221.13" x2="224.67" y2="217.31" />
    <line x1="228.87" y1="213.11" x2="232.69" y2="213.11" />
    <line x1="408" y1="46.2" x2="408" y2="147.8" />
    <line x1="403.8" y1="152" x2="302.2" y2="152" />
    <line x1="298" y1="156.2" x2="298" y2="184.47" />
    <line x1="293.8" y1="188.67" x2="265.53" y2="188.67" />
    <line x1="261.33" y1="192.87" x2="261.33" y2="196.69" />
    <line x1="257.13" y1="200.89" x2="253.31" y2="200.89" />
  </g>
  <!-- 空心圈 -->
  <g fill="none" stroke="currentColor" stroke-width="1.4">
    <circle cx="78" cy="372" r="4.2" />
    <circle cx="188" cy="262" r="4.2" />
    <circle cx="224.67" cy="225.33" r="4.2" />
    <circle cx="236.89" cy="213.11" r="4.2" />
    <circle cx="249.11" cy="200.89" r="4.2" />
    <circle cx="261.33" cy="188.67" r="4.2" />
    <circle cx="298" cy="152" r="4.2" />
    <circle cx="408" cy="42" r="4.2" />
  </g>
  <!-- 圆点 (c, f(c)) -->
  <g style="fill: var(--accent, #2563eb)">
    <circle cx="78" cy="262" r="4.6" />
    <circle cx="188" cy="225.33" r="4.6" />
    <circle cx="224.67" cy="213.11" r="4.6" />
    <circle cx="408" cy="152" r="4.6" />
    <circle cx="298" cy="188.67" r="4.6" />
    <circle cx="261.33" cy="200.89" r="4.6" />
  </g>
  <!-- 两条线的名字 -->
  <g fill="currentColor">
    <text x="350" y="82" text-anchor="end"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">x</tspan></text>
    <text x="322" y="208"><tspan font-style="italic">y</tspan> = (<tspan font-style="italic">x</tspan> + 1)/3</text>
  </g>
  <!-- 图例 -->
  <line x1="474" y1="97" x2="512" y2="97" stroke="currentColor" stroke-width="2" />
  <circle cx="493" cy="125" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4" />
  <circle cx="493" cy="153" r="4.6" style="fill: var(--accent, #2563eb)" />
  <g fill="currentColor">
    <text x="522" y="102"><tspan font-style="italic">C</tspan> 外的数</text>
    <text x="522" y="130">挖掉的点</text>
    <text x="522" y="158">挪到的点</text>
  </g>
</svg>
