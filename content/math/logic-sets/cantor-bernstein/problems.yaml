- id: p1
  tier: easy
  statement: |
    设$A$、$B$是集合。下面哪些条件能保证$A$与$B$:term[等势]{id="math.logic-sets.equinumerous"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        有从$A$到$B$的单射，它不是满射
      - |
        有从$A$到$B$的某个真子集的双射
      - |
        $A\subseteq B$，并且有从$B$到$A$的单射
      - |
        有从$A$到$B$的单射，又有从$B$到$A$的某个子集的双射
      - |
        有一个集合$M$，使$|A|\le|M|$，$|M|\le|B|$，$|B|\le|A|$
    value: [3, 4, 5]
  hints:
    - |
      要用定理，两个方向都要有:term[单射]{id="math.logic-sets.injective"}。逐条看：手里有哪几个方向的单射？
    - |
      选项 A、B 只有从$A$到$B$的，拿只有一两个元素的集合试一试。选项 C 的另一个方向有现成的单射。选项 D 里到$A$的某个子集的双射，看成到整个$A$的，还是单射吗？选项 E 先把前两个接起来。
    - |
      选项 A、B 不能保证：取$A=\{1\}$，$B=\{1,2\}$，$1\mapsto1$是从$A$到$B$的单射，不是满射，也是从$A$到$B$的真子集$\{1\}$的双射，可两者元素个数不同，不等势。

      选项 C：$A\subseteq B$，包含映射是从$A$到$B$的单射，又有从$B$到$A$的单射，由定理等势。选项 D：从$B$到$A$的某个子集的双射，看成到整个$A$的，就是从$B$到$A$的单射，两个方向都有了。选项 E：由$|A|\le|M|$、$|M|\le|B|$得$|A|\le|B|$，又$|B|\le|A|$。所以选 C、D、E。
  solution: |
    选项 C、D、E 都给出了两个方向的单射，由定理，$A$与$B$等势。选项 C 的一个方向是包含映射；选项 D 里到$A$的某个子集的双射，看成到整个$A$的，仍是单射；选项 E 由前两个得$|A|\le|B|$。

    选项 A、B 只有从$A$到$B$的，保证不了：$A=\{1\}$，$B=\{1,2\}$时，$1\mapsto1$就满足这两个条件，可两者不等势。它们也否定不了等势：$A=B=\N$时，$n\mapsto n+1$同样满足这两个条件。选 C、D、E。

- id: p2
  tier: easy
  statement: |
    设$A=B=\N$，$f(n)=n+2$，$g(n)=n+1$。这时定理证明里的$C$由$\N$中全体$3$的倍数组成（$0$也算，可以自己验证）。照证明造出$h$，求$h(9)$和$h(10)$，按（前者，后者）的顺序填。
  answer:
    type: tuple
    value: [11, 9]
    exact: true
  hints:
    - |
      $h$在$C$上和在$C$外的规定不一样。$9$和$10$在不在$C$里？
    - |
      $9\in C$，用$f$；$10\notin C$，要找被$g$送到$10$的那个数。
    - |
      $9$是$3$的倍数，所以$h(9)=f(9)=11$。$10$不是$3$的倍数，$h(10)$是满足$g(y)=10$的$y$，由$y+1=10$得$y=9$。填$(11,9)$。
  solution: |
    $9\in C$，$h(9)=f(9)=11$。$10\notin C$，$h(10)$是被$g$送到$10$的数，$y+1=10$，$y=9$。答案是$(11,9)$。

    验证$C$：$\N\setminus g(\N)=\{0\}$，$g(f(n))=n+3$，从$0$出发走到的就是$0,3,6,9,\dots$。这个$h$把$3k$送到$3k+2$，把$3k+1$、$3k+2$各送到小$1$的数，确实是双射。

- id: p3
  tier: medium
  statement: |
    设$A=B=\N$，$f(n)=2n$，$g(n)=n+2$。定理证明里的$C$有几个小于$100$的元素？
  answer:
    type: number
    value: 12
    exact: true
  hints:
    - |
      $C$里先得有哪些元素？有了一个元素，接着又得有哪一个？
    - |
      先求$\N\setminus g(\N)$，它不止一个元素。再写出$g(f(n))$，从这几个元素出发各走下去，走到不小于$100$为止。
    - |
      $g(n)=n+2$取遍不小于$2$的自然数，所以$\N\setminus g(\N)=\{0,1\}$。$g(f(n))=2n+2$，从$0$出发得$0,2,6,14,30,62,126,\dots$，从$1$出发得$1,4,10,22,46,94,190,\dots$。小于$100$的各有$6$个，没有重复，一共$12$个。
  solution: |
    $\N\setminus g(\N)=\{0,1\}$，$g(f(n))=2n+2$。从$0$、$1$出发反复做$n\mapsto2n+2$，走到的是$0,2,6,14,30,62,126,\dots$和$1,4,10,22,46,94,190,\dots$，小于$100$的各有$6$个。

    两串没有公共的数：$n\mapsto2n+2$是单射，取不到$0$、$1$。两串要是碰到一处，一步步同时倒回去，不是得到$0=1$，就是$0$、$1$中有一个成了某个数的像，都不可能。所以一共$12$个；只从$0$出发，会漏掉一半。

- id: p4
  tier: medium
  statement: |
    下面哪些集合和开区间$(0,1)$:term[等势]{id="math.logic-sets.equinumerous"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        平面上的单位圆周$\{(x,y)\in\R^2:x^2+y^2=1\}$
      - |
        $[0,1]\cup[2,3]$
      - |
        $\R\setminus\Z$
      - |
        $\{x\in\R:x\le x^2\le x^3\le1\}$
      - |
        $\{(x,y)\in\R^2:x^2+y^2\le2x-1\}$
    value: [1, 2, 3]
  hints:
    - |
      等势的不必写出双射，看它能不能夹在两个等势的集合中间，或者两个方向各找一个:term[单射]{id="math.logic-sets.injective"}。也要当心，有的集合看着像一整段、一整片，其实没有几个元素。
    - |
      选项 B、C 各含有哪个开区间，又是哪个集合的子集？选项 A：怎样把$(0,1)$的数放到圆周上，又怎样把圆周上的点放进$\R$，使不同的点在不同的地方？选项 D、E：直接求出有哪些元素。
    - |
      由例 1，$(0,1)$与$\R$等势；选项 B、C 都含有$(0,1)$，又都是$\R$的子集，夹在中间，和$(0,1)$等势。选项 A：$t\mapsto(t,\sqrt{1-t^2})$是从$(0,1)$到圆周的单射；反过来，$y\ge0$时把$(x,y)$送到$x$，$y<0$时送到$x+3$，前一类的值在$[-1,1]$里，后一类的在$(2,4)$里，每一类里由$x$认得出$y$，所以这是从圆周到$\R$的单射。$\R$与$(0,1)$等势，由定理，圆周和$(0,1)$等势。

      选项 D：$x\le x^2$要求$x\le0$或$x\ge1$，$x^2\le x^3$要求$x=0$或$x\ge1$，$x^3\le1$要求$x\le1$，合起来只有$0$和$1$。选项 E：条件就是$(x-1)^2+y^2\le0$，只有$(1,0)$一个点。两者都是有限集，$(0,1)$却和它的真子集$\bigl(0,\frac12\bigr)$等势，所以是无限集（见[等势与可数集](lesson:math.logic-sets.countable-sets#thm-naturals-infinite)的定理和例 1），和它们都不等势。选 A、B、C。
  solution: |
    选项 B、C 都含有$(0,1)$，又都是$\R$的子集，而$(0,1)$与$\R$等势，它们夹在中间，都和$(0,1)$等势。选项 A：$t\mapsto(t,\sqrt{1-t^2})$是从$(0,1)$到圆周的单射；把圆周上$y\ge0$的点$(x,y)$送到$x$、$y<0$的点送到$x+3$，是从圆周到$\R$的单射，由定理等势。也可以看角度：$\theta\mapsto(\cos\theta,\sin\theta)$是从$[0,2\pi)$到圆周的双射，$[0,2\pi)$夹在$(0,2\pi)$和$\R$之间。

    选项 D 看着像一段区间，其实只有两个数：三个不等号依次要求「$x\le0$或$x\ge1$」「$x=0$或$x\ge1$」「$x\le1$」，合起来只有$0$和$1$。选项 E 看着像一个圆盘，配方得$(x-1)^2+y^2\le0$，只有$(1,0)$一个点。$(0,1)$是无限集，和这两个有限集都不等势。选 A、B、C。

- id: p5
  tier: hard
  statement: |
    用$F$记从$\N$到$\N$的全体:term[映射]{id="math.logic-sets.map"}（map）组成的集合，用$H$记从$\N$到$\N$的全体:term[双射]{id="math.logic-sets.bijective"}组成的集合。

    （1）证明$F$与:term[幂集]{id="math.logic-sets.power-set"}$\Pow(\N)$等势。

    （2）证明$H$与$\Pow(\N)$等势。
  hints:
    - |
      不必写双射，两个方向各造一个:term[单射]{id="math.logic-sets.injective"}；要说明是单射，就看由像认不认得出原来的东西。（1）由$\N$的一个子集，能造出什么映射？一个映射$f$的全部信息，都在:term[有序对]{id="math.logic-sets.ordered-pair"}（ordered pair）$(n,f(n))$里。（2）一个方向是现成的；另一个方向，要由一个子集造出一个双射，还要认得出来。
    - |
      （1）子集$S$对应「在$S$的元素处取$1$、别处取$0$」的映射；映射$f$对应$\{(n,f(n)):n\in\N\}$，它是$\N\times\N$的子集，再借一个双射$\N\times\N\to\N$搬到$\N$上。（2）把自然数两个两个分组，$2n$和$2n+1$一组，一共有$0,1,2,\dots$号组；用$S$来决定哪几组要对调。
    - |
      （1）先找从$\Pow(\N)$到$F$的单射。对$S\subseteq\N$，令$u_S:\N\to\N$在$S$的元素处取$1$，在别处取$0$。由$u_S$认得出$S$，就是取值为$1$的那些数，所以$S\mapsto u_S$是单射，$|\Pow(\N)|\le|F|$。

      再找从$F$到$\Pow(\N)$的单射。对$f\in F$，令$T_f=\{(n,f(n)):n\in\N\}$，它是$\N\times\N$的子集；由$T_f$认得出$f$，$f(n)$就是使$(n,k)\in T_f$的唯一的$k$。所以$f\mapsto T_f$是从$F$到$\Pow(\N\times\N)$的单射。

      由[等势与可数集](lesson:math.logic-sets.countable-sets#thm-pairs-countable)，有双射$p:\N\times\N\to\N$。$p$是单射，所以对每个$T\subseteq\N\times\N$都有$p^{-1}(p(T))=T$（[像与原像](lesson:math.logic-sets.image-preimage)第 5 题（2）），由$p(T)$认得出$T$，$T\mapsto p(T)$是从$\Pow(\N\times\N)$到$\Pow(\N)$的单射。两个单射复合起来，就有$|F|\le|\Pow(\N)|$；由定理，$F$与$\Pow(\N)$等势。

      （2）双射也是映射，$H\subseteq F$，所以$|H|\le|F|$；由（1），$F$与$\Pow(\N)$等势，所以$|H|\le|\Pow(\N)|$。

      反过来，每个自然数恰能写成$2n$或$2n+1$中的一种，$n\in\N$。对$S\subseteq\N$，规定$\sigma_S:\N\to\N$：$n\in S$时$\sigma_S(2n)=2n+1$，$\sigma_S(2n+1)=2n$；$n\notin S$时这两个数都不动。对调两次就复原，$\sigma_S\circ\sigma_S=\mathrm{id}_{\N}$，所以$\sigma_S$是双射，$\sigma_S\in H$。

      由$\sigma_S$认得出$S$：$n\in S$当且仅当$\sigma_S(2n)=2n+1$。所以$S\mapsto\sigma_S$是从$\Pow(\N)$到$H$的单射，$|\Pow(\N)|\le|H|$，由定理，$H$与$\Pow(\N)$等势。两问都没有写出双射，要直接写就麻烦多了。
  reference: |
    （1）$S\mapsto u_S$（$S$上取$1$，别处取$0$）是$\Pow(\N)\to F$的单射。$f\mapsto\{(n,f(n)):n\in\N\}$是$F\to\Pow(\N\times\N)$的单射，$\N\times\N$与$\N$等势给出$\Pow(\N\times\N)\to\Pow(\N)$的单射（取像）。也可以一步写成$f\mapsto\{2^n3^{f(n)}:n\in\N\}$，由例 2 的单射认得出每一对$(n,f(n))$。

    （2）$H\subseteq F$得$|H|\le|F|=|\Pow(\N)|$；$S\mapsto\sigma_S$（$n\in S$时对调$2n$、$2n+1$）是$\Pow(\N)\to H$的单射。

    要点是每个方向都说清「由像认得出原来的」。常见的漏洞：只给一个方向；（2）造的映射不是双射；由$f$的值的集合去认$f$（不同的$f$可以有相同的值的集合）。

- id: p6
  tier: hard
  statement: |
    设$\Phi:\Pow(A)\to\Pow(A)$保持包含，即对$A$的任意子集$X$、$Y$，$X\subseteq Y$时$\Phi(X)\subseteq\Phi(Y)$。满足$\Phi(X)=X$的$X$叫作$\Phi$的不动点（fixed point）。

    （1）令$C$为满足$\Phi(X)\subseteq X$的所有$X\subseteq A$的:term[交]{id="math.logic-sets.family-intersection"}，$M$为满足$X\subseteq\Phi(X)$的所有$X\subseteq A$的:term[并]{id="math.logic-sets.family-union"}（union of a family）。证明$C$、$M$都是不动点，并且每个不动点$X$都满足$C\subseteq X\subseteq M$。

    （2）设$f:A\to B$、$g:B\to A$是单射，$\Phi(X)=A\setminus g(B\setminus f(X))$。证明$\Phi$保持包含。再证明：$X$是不动点，当且仅当下面两条都成立：$A\setminus X\subseteq g(B)$；在$X$上用$f$、在$A\setminus X$上把$g$倒着走，拼成的是从$A$到$B$的双射。

    （3）设$A=B=\Z$，$f$、$g$都是$n\mapsto n+1$，$\Phi$照（2）取。求全部不动点，它们拼成几个不同的双射？讲解里的$C$是哪一个不动点？
  hints:
    - |
      （1）照讲解里对$C$的论证，把$(A\setminus g(B))\cup g(f(X))$换成$\Phi(X)$；对$M$，把包含的方向全部倒过来。（2）$X$是不动点，就是$A\setminus X=g(B\setminus f(X))$，$A$、$B$各切成了两块，哪块配哪块？（3）先把$\Phi(X)$算出来。
    - |
      （1）先证$\Phi(C)\subseteq C$，再两边取$\Phi$，看$\Phi(C)$是不是也在取交的那些集合里。（2）取:term[补集]{id="math.logic-sets.complement"}（complement）会把包含倒过来，这里取了两次。由那两条推出$X$是不动点时，设拼成的双射是$k$，$k(X)$和$k(A\setminus X)$各是什么？（3）$\Phi(X)=\{n+2:n\in X\}$，哪些$X$整个往右挪$2$不变？
    - |
      （1）先看$C$。$\Phi(A)\subseteq A$，取交的集合至少有$A$一个，交有意义。任取满足$\Phi(X)\subseteq X$的$X$，$C\subseteq X$，所以$\Phi(C)\subseteq\Phi(X)\subseteq X$；对每个这样的$X$都成立，所以$\Phi(C)\subseteq C$。两边再取$\Phi$，得$\Phi(\Phi(C))\subseteq\Phi(C)$，$\Phi(C)$也是取交的集合之一，所以$C\subseteq\Phi(C)$，于是$\Phi(C)=C$。

      再看$M$，包含的方向全倒过来。任取满足$X\subseteq\Phi(X)$的$X$，$X\subseteq M$，所以$X\subseteq\Phi(X)\subseteq\Phi(M)$；对每个这样的$X$都成立，所以它们的并$M\subseteq\Phi(M)$。两边再取$\Phi$，得$\Phi(M)\subseteq\Phi(\Phi(M))$，$\Phi(M)$也是取并的集合之一，所以$\Phi(M)\subseteq M$，于是$\Phi(M)=M$。不动点$X$既满足$\Phi(X)\subseteq X$，又满足$X\subseteq\Phi(X)$，所以$C\subseteq X\subseteq M$。

      （2）设$X\subseteq Y$。像保持包含，$f(X)\subseteq f(Y)$，取补集得$B\setminus f(Y)\subseteq B\setminus f(X)$；再取像，$g(B\setminus f(Y))\subseteq g(B\setminus f(X))$，再取一次补集，就是$\Phi(X)\subseteq\Phi(Y)$。

      设$X$是不动点，即$A\setminus X=g(B\setminus f(X))$，当然$A\setminus X\subseteq g(B)$。$f$是单射，$x\mapsto f(x)$是从$X$到$f(X)$的双射；$g$是单射，$y\mapsto g(y)$是从$B\setminus f(X)$到$A\setminus X$的双射，倒着走就是从$A\setminus X$到$B\setminus f(X)$的双射。$X$和$A\setminus X$不重叠地合成$A$，$f(X)$和$B\setminus f(X)$不重叠地合成$B$，两个双射拼起来，是从$A$到$B$的双射。

      反过来，设$A\setminus X\subseteq g(B)$，拼成的$k:A\to B$是双射。$k(X)=f(X)$；$k$是双射，取遍$B$，又不把$X$的元素和$A\setminus X$的元素送到一处，所以$k(A\setminus X)=B\setminus f(X)$。$x\in A\setminus X$时$g(k(x))=x$，所以$A\setminus X=g(k(A\setminus X))=g(B\setminus f(X))$，即$\Phi(X)=X$。

      （3）$g$是$\Z\to\Z$的双射，所以$\Z\setminus g(\Z\setminus f(X))=g(f(X))$，即$\Phi(X)=\{n+2:n\in X\}$。$\Phi(X)=X$就是：$n\in X$当且仅当$n+2\in X$，所以偶数要么全在$X$里，要么全不在，奇数也一样。不动点有四个：$\varnothing$、全体偶数、全体奇数、$\Z$。

      拼成的双射把$X$中的$n$送到$n+1$，把别的$n$送到$n-1$，四个不动点给出四个不同的双射。$\varnothing$给出$n\mapsto n-1$，$\Z$给出$n\mapsto n+1$；全体偶数给出「$2j$和$2j+1$对调」，全体奇数给出「$2j-1$和$2j$对调」。

      讲解里的$C$是满足 (i)、(ii) 的$X$的交。$g$是单射，$g(B\setminus f(X))=g(B)\setminus g(f(X))$，所以$\Phi(X)=(A\setminus g(B))\cup g(f(X))$，(i)、(ii) 合起来就是$\Phi(X)\subseteq X$，讲解里的$C$就是（1）的$C$，是最小的不动点。这里它是$\varnothing$：没有元素非用$f$不可，$h$处处把$g$倒着走。每一串两头都没有尽头，整串用$f$、整串把$g$倒着走都行，所以拼法不只一种。
  reference: |
    （1）$\Phi(C)\subseteq\Phi(X)\subseteq X$对每个满足$\Phi(X)\subseteq X$的$X$成立，故$\Phi(C)\subseteq C$；取$\Phi$得$\Phi(C)$也在取交的集合里，故$C\subseteq\Phi(C)$。$M$对偶。不动点同时属于两族，夹在$C$、$M$之间。（这是克纳斯特-塔斯基不动点定理用在幂集上。）

    （2）两次取补，包含方向倒两次。（⇒）$A=X\cup g(B\setminus f(X))$、$B=f(X)\cup(B\setminus f(X))$都是不相交的并，两块分别由$f$、$g$配好。（⇐）$k(A\setminus X)=B\setminus k(X)=B\setminus f(X)$，而$g(k(x))=x$，故$A\setminus X=g(B\setminus f(X))$。

    （3）$\Phi(X)=X+2$，不动点是$\varnothing$、偶数、奇数、$\Z$，四个不同的双射；$C=\varnothing$，$M=\Z$。

    $\Phi(X)=A\setminus g(B\setminus f(X))=(A\setminus g(B))\cup g(f(X))$用到$g$单。一般地，拼法由那些往回追不到头的串各自选用$f$还是倒着走$g$决定；没有这样的串时$C=M$，拼法只有一种。

- id: p7
  tier: thinking
  statement: |
    设$f:A\to B$、$g:B\to A$是单射，$h:A\to B$是定理证明里造出的双射。

    （1）说明：对每个$x\in A$，$h(x)=f(x)$和$g(h(x))=x$至少有一个成立。

    （2）旅馆来了一批客人，客人和房间都可以有无穷多。已经知道：能给每位客人分一间他愿意住的房，不同的客人不同的房，也许有空房；又能给每间房配一位愿意住它的客人，不同的房不同的客人，也许有客人落空。能不能让每位客人住进一间他愿意住的房，每人一间，并且没有空房？

    （3）设$A$、$B$都是$\R$的子集，$f$、$g$都严格递增。一定有从$A$到$B$的严格递增的双射吗？试$A=[0,1]$，$B=(0,1)$。

    （4）「愿意住」这一条，拼成的$h$保得住；「严格递增」这一条，$h$保不住。差别在哪里？
  hints:
    - |
      （1）照$h$的规定，分$x\in C$和$x\notin C$。（2）两种已知的安排各给出一个单射，第（1）问正好派上用场。（3）$[0,1]$里有最小的数，$(0,1)$里呢？（4）要查一条性质成不成立，一次得看几个元素？
    - |
      （2）令$f$把客人送到分给他的房，$g$把房送到配给它的客人。$h(x)=f(x)$时，$g(h(x))=x$时，客人$x$各为什么愿意住$h(x)$？（3）假如$k:[0,1]\to(0,1)$是严格递增的双射，$\frac{k(0)}2$是谁的像？（4）在讲解的例子里找一个$x_1\in C$、一个$x_2\notin C$，比一比它们的像。
    - |
      （1）$x\in C$时$h(x)=f(x)$；$x\notin C$时$h(x)$是被$g$送到$x$的那个元素，即$g(h(x))=x$。

      （2）能。记$A$为全体客人，$B$为全体房间，$f$把客人送到分给他的房，$g$把房送到配给它的客人，两个都是单射；$h$是双射，所以照$h$来住，每人一间，没有空房。对每位客人$x$，由（1），$h(x)=f(x)$或者$g(h(x))=x$：前一种情形，$h(x)$是分给他的房，他愿意住；后一种情形，他是配给$h(x)$这间房的客人，也愿意住它。

      （3）不一定。取$A=[0,1]$，$B=(0,1)$，$f(x)=\frac{x+1}3$，$g(y)=y$，两个单射都严格递增。假如$k:[0,1]\to(0,1)$是严格递增的双射，则$k(0)>0$，$\frac{k(0)}2\in(0,1)$，有$x\in[0,1]$使$k(x)=\frac{k(0)}2$。$\frac{k(0)}2\ne k(0)$，所以$x\ne0$，即$x>0$，于是$k(x)>k(0)$，和$k(x)=\frac{k(0)}2<k(0)$矛盾。

      （4）「客人$x$愿意住房间$h(x)$」只看一个元素和它的像，每个$x$单独查。$h(x)$不是照$f$来的，就是照$g$倒着来的，两边都合格，$h$就合格。一般地，设$R$是从$A$到$B$的:term[关系]{id="math.logic-sets.binary-relation"}（binary relation），每个$x\in A$都有$x\mathrel{R}f(x)$，每个$y\in B$都有$g(y)\mathrel{R}y$，那么每个$x\in A$都有$x\mathrel{R}h(x)$。

      「严格递增」要把两个元素放在一起比。$x_1<x_2$都在$C$里，或者都不在$C$里时，像的次序还保得住；一个在$C$里、一个不在时，一个照$f$挪，一个照$g$倒着挪，没有什么管住两者的先后。在讲解的例子里，$\frac13\in C$，而$C$中的数都写得成分母是$3$的幂的分数，所以$\frac25\notin C$；$\frac13<\frac25$，可$h\bigl(\frac13\bigr)=\frac49$比$h\bigl(\frac25\bigr)=\frac25$大。所以互相放得进对方，只保证一样多，不保证能照原来的次序一个对一个地配起来。
  reference: |
    （1）由$h$的定义。

    （2）能：$f$、$g$分别由两种安排给出，$h$双射；$h(x)=f(x)$或$x=g(h(x))$，两种情形$x$都愿意住$h(x)$。图论的说法：二部图（两边可以无穷）有覆盖左边的匹配和覆盖右边的匹配，就有完美匹配。

    （3）不一定。$[0,1]$有最小的数，$(0,1)$没有；$k(0)/2$无处可来。别的例子：$A=[0,1)$、$B=(0,1]$的严格递增映射互相放得进（缩小、挪进中间），却没有严格递增的双射。

    （4）前者是$x$与$h(x)$之间的关系，逐点检查，$h$的每一点都取自$f$或$g$的某一个箭头；后者牵涉两个点，分属两块时没有约束。类似地，连续、保持距离、保持加法都牵涉许多点，互相放得进不保证有这样的双射；$h$只能保住「一个箭头就看得出」的性质。

- id: p8
  tier: thinking
  statement: |
    讲解里「$A$比$B$少」的说法，本题叫甲：有从$A$到$B$的单射，没有从$A$到$B$的双射。有人改成乙：有从$A$到$B$的单射，没有从$B$到$A$的单射。

    （1）证明甲、乙等价。哪一个方向用到了康托尔-伯恩斯坦定理？

    （2）反过来，假如还不知道这个定理，只知道甲、乙对任意两个集合都等价，能不能推出定理？

    （3）用甲来说「少」，怎样排除「$A$比$B$少，$B$又比$A$少」？用乙呢？改用乙，是不是就用不着定理了？

    （4）设$A$比$B$少，$B$不比$E$多，证明$A$比$E$少。用甲、用乙各怎样证，哪一种用到了定理？
  hints:
    - |
      （1）有了双射，就有哪些方向的单射？（2）设两个方向都有单射，这时乙成不成立，甲呢？（3）（4）把每一句「少」「不比……多」都翻译成有没有某个方向的单射或双射，再看推得出什么。
    - |
      （1）双射的逆映射是另一个方向的单射；由甲推乙时，两个方向都有单射会怎样？（2）乙不成立，甲也就不成立，是甲的哪一半不成立？

      （3）照乙，「不比……多」是不是仍然就是「少」或者等势？（4）先得$|A|\le|E|$；用甲，假如$A$与$E$等势，$B$和$A$比会怎样？用乙，假如有从$E$到$A$的单射，和哪个单射复合？
    - |
      （1）由乙推甲：假如有从$A$到$B$的双射，它的逆映射就是从$B$到$A$的单射，和乙矛盾，所以没有这样的双射，甲成立。由甲推乙：假如有从$B$到$A$的单射，又有从$A$到$B$的单射，由定理$A$与$B$等势，和甲矛盾，所以没有从$B$到$A$的单射，乙成立。用到定理的是由甲推乙。

      （2）能。设有从$A$到$B$的单射，又有从$B$到$A$的单射，这时乙不成立，甲、乙等价，所以甲也不成立。甲的前一半是成立的，只能是后一半不成立，即有从$A$到$B$的双射，这就是定理。所以「甲、乙等价」和定理说的是同一件事。

      （3）用甲：$A$比$B$少，$B$又比$A$少，则两个方向都有单射，由定理等势，和甲矛盾；没有定理，单看甲排除不了。用乙：$A$比$B$少，就没有从$B$到$A$的单射，$B$比$A$少又说有，立刻矛盾。

      改用乙，困难只是换了个地方。「$A$不比$B$多」应当就是「$A$比$B$少，或者等势」：照甲，这由定义就有；照乙，$A$不比$B$多、又不比$B$少，只说明两个方向都有单射，要说两者等势，还得用定理。假如有两个集合互相有单射却不等势，照乙它们谁也不比谁少，又不一样多，大小还是说不清。

      （4）两种说法都先由$|A|\le|B|$、$|B|\le|E|$得$|A|\le|E|$。用甲：假如$A$与$E$等势，则$|E|\le|A|$，所以$|B|\le|E|\le|A|$，又$|A|\le|B|$，由定理$A$与$B$等势，和$A$比$B$少矛盾；所以$A$比$E$少，用到了定理。用乙：假如有从$E$到$A$的单射，先做从$B$到$E$的单射，再做它，就是从$B$到$A$的单射，和$A$比$B$少矛盾；所以$A$比$E$少，没有用到定理。
  reference: |
    （1）乙⇒甲：双射的逆是反方向的单射，不用定理。甲⇒乙：两个方向都有单射，由定理有双射，矛盾，用定理。

    （2）能。两个方向都有单射时乙假，故甲假，而甲的前半真，所以有双射。两者等价。

    （3）甲要用定理才排除；乙由定义直接排除，但「不比……多等于少或等势」照乙要用定理。没有定理，可能出现「互相不比对方多、又不等势」的情形，两种说法都说不圆。

    （4）甲：$A$与$E$等势则$|B|\le|E|\le|A|$，与$|A|\le|B|$合用定理，矛盾。乙：$B\to E\to A$的复合是单射，矛盾，不用定理。

    要点：定理就是「$\le$」和「$<$」能配得上（三条性质）的保证，放在哪一步用由定义决定，省不掉。任意两个集合可比（至少有一个方向有单射）是另一回事，要用选择公理。
