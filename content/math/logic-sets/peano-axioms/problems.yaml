- id: p1
  tier: easy
  statement: |
    下面每一项给出一个集合、一个起点（当作公理里的$0$）和后继$S$。哪些满足五条:term[皮亚诺公理]{id="math.logic-sets.peano-axioms"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\Z$，从$0$起，$S(n)=n+1$
      - |
        $\N$，从$0$起，$S(n)=2n+1$
      - |
        $\N$，从$1$起，$n$是奇数时$S(n)=n-1$，$n$是偶数时$S(n)=n+3$
      - |
        $\Z$，从$0$起，$S(n)=|n|+1$
      - |
        $\Z$，从$0$起，$n>0$时$S(n)=-n$，$n\le0$时$S(n)=1-n$
    value: [3, 5]
  hints:
    - |
      五项都满足 (1)、(2)，逐项查 (3)、(4)、(5)：起点是不是某个元素的后继？有没有两个不同的元素后继相同？从起点一步步走，走得到每个元素吗？
    - |
      先从起点走几步。A 走出$0,1,2,3,\dots$，B 走出$0,1,3,7,\dots$，各有走不到的吗？D 里$1$和$-1$的后继各是什么？C 走出$1,0,3,2,\dots$，E 走出$0,1,-1,2,\dots$，再往下走走看。
    - |
      A：$S(-1)=0$，不满足 (3)；$\N$含$0$，又含其中每个数的后继，却不是$\Z$，也不满足 (5)。B：$0$和全体正奇数组成的子集含$0$，其中每个数的后继是正奇数、也在里面，它却不是$\N$，不满足 (5)。D：$S(1)=S(-1)=2$，不满足 (4)。

      C：奇数的后继是偶数，偶数的后继是不小于$3$的奇数，所以起点$1$不是后继；后继相同的两个数奇偶相同，由式子看它们相等，(3)、(4) 成立。设子集$M$含$1$，又含其中每个数的后继：$1\in M$；$2k+1\in M$时，$2k\in M$，$2k+3\in M$；对$k$归纳，$\N$里的奇数、偶数都在$M$里，(5) 成立。

      E：正数的后继是负数，$0$和负数的后继是正数，所以$0$不是后继，(4) 也像 C 那样成立。设子集$M$含$0$，又含其中每个数的后继：$-k\in M$（$k\in\N$）时，$k+1\in M$，$-(k+1)\in M$；对$k$归纳，$M=\Z$，(5) 成立。选 C、E。
  solution: |
    A 不满足 (3)：$S(-1)=0$；也不满足 (5)，从$0$走不到负数。B 不满足 (5)：从$0$走出$0,1,3,7,\dots$，走不到$2$，$0$和全体正奇数就组成一个满足条件而不是$\N$的子集。D 不满足 (4)：$S(1)=S(-1)=2$；从$0$也走不到负数。

    C 依次走出$1,0,3,2,5,4,\dots$，不重复、不遗漏：$2k+1$后面是$2k$，再后面是$2k+3$。$1$不是哪个数的后继，后继相同的两个数也只能相等，五条都满足。E 依次走出$0,1,-1,2,-2,\dots$，同样五条都满足。选 C、E。

    同样是$\Z$，后继规定得不同，可以满足，也可以不满足：公理管的是一个接一个的样子，不是集合里有哪些对象。

- id: p2
  tier: easy
  statement: |
    :term[映射]{id="math.logic-sets.map"}$h:\N\to\Z$由$h(0)=3$，$h(S(n))=2h(n)-1$（$n\in\N$）:term[递归定义]{id="math.logic-sets.recursive-definition"}。求$h(6)$。
  answer:
    type: number
    value: 129
    exact: true
  hints:
    - |
      $6$是从$0$起走六步到的数，$h(6)$就是从$h(0)$起，照规则算六次。
    - |
      $h(1)=2\times3-1=5$，$h(2)=2\times5-1=9$，接着算$h(3)$、$h(4)$、$h(5)$、$h(6)$。
    - |
      $h(0),h(1),\dots,h(6)$依次是$3,5,9,17,33,65,129$，所以$h(6)=129$。
  solution: |
    这是:term[递归定理]{id="math.logic-sets.recursion-theorem"}里$X=\Z$、$c=3$、$g(x)=2x-1$的情形，这样的$h$恰有一个。照规则一步步算，$h(0)$到$h(6)$依次是$3,5,9,17,33,65,129$，所以$h(6)=129$。

    也可以归纳证明$h(n)=2^{n+1}+1$：$n=0$时是$3$；设$h(n)=2^{n+1}+1$，则$h(S(n))=2(2^{n+1}+1)-1=2^{n+2}+1$。

- id: p3
  tier: medium
  statement: |
    数列$a_0=a_1=1$，$a_{n+2}=a_{n+1}+2a_n$（$n\in\N$）。照例 1 的办法，取$X=\Z\times\Z$，令$h(n)=(a_n,a_{n+1})$，用:term[递归定理]{id="math.logic-sets.recursion-theorem"}定出这个数列。$g$该怎样取？求$h(5)$，按两个分量的先后填。
  answer:
    type: tuple
    value: [21, 43]
    exact: true
  hints:
    - |
      $h(n+1)=(a_{n+1},a_{n+2})$。它的两个分量，怎样由$h(n)=(a_n,a_{n+1})$的两个分量算出来？
    - |
      后一个:term[有序对]{id="math.logic-sets.ordered-pair"}的第一个分量，就是前一个的第二个分量；第二个分量是$a_{n+1}+2a_n$。所以$g(x,y)=(y,y+2x)$，从$h(0)=(1,1)$起用五次$g$。
    - |
      取$c=(1,1)$，$g(x,y)=(y,y+2x)$。$h(0)$到$h(5)$依次是$(1,1),(1,3),(3,5),(5,11),(11,21),(21,43)$，填$(21,43)$。
  solution: |
    取$c=(1,1)$，$g(x,y)=(y,y+2x)$，$g$是$\Z\times\Z\to\Z\times\Z$的映射，由:term[递归定理]{id="math.logic-sets.recursion-theorem"}，恰有一个$h$使$h(0)=c$，$h(n+1)=g(h(n))$。$h(n)$的第一个分量记作$a_n$，第二个分量就是$a_{n+1}$，正是题里的数列。

    从$(1,1)$起用五次$g$，依次得$(1,3),(3,5),(5,11),(11,21),(21,43)$，所以$h(5)=(21,43)$，即$a_5=21$，$a_6=43$。

- id: p4
  tier: medium
  statement: |
    在集合$\{0,1,2,3\}$上，给每个元素$n$规定一个后继$S(n)\in\{0,1,2,3\}$，一共有$4^4$种规定。其中满足归纳公理，即:term[皮亚诺公理]{id="math.logic-sets.peano-axioms"} (5) 的有几种？这几种里又满足公理 (4) 的有几种？按（前者，后者）的顺序填。
  answer:
    type: tuple
    value: [24, 6]
    exact: true
  hints:
    - |
      从$0$起一直取后继，走到的元素组成一个子集。它满足归纳公理的条件吗？归纳公理要它是什么？
    - |
      归纳公理成立，当且仅当从$0$起走得到全部四个元素。走过$1$、$2$、$3$的次序有几种？最后走到的那个元素，后继可以取哪些；还要满足公理 (4) 时，又能取哪些？
    - |
      从$0$走到的元素组成的子集含$0$，又含其中每个元素的后继，归纳公理要它是全部；反过来，从$0$走得到全部时，满足归纳公理条件的子集含$0$，也就含走到的每一个，只能是全部。所以只要数从$0$走得到全部的规定：走过$1$、$2$、$3$的次序有$3\times2\times1=6$种，最后走到的那个元素的后继有$4$种取法，共$6\times4=24$种。

      这样走时，前三个元素的后继是$1$、$2$、$3$，互不相同；公理 (4) 要最后那个元素的后继和它们都不同，只能是$0$，所以有$6$种。填$(24,6)$。
  solution: |
    从$0$一直取后继，走到的元素组成的子集满足归纳公理的条件，所以归纳公理要求从$0$走得到全部；反过来，走得到全部时，满足条件的子集只能是全部。于是只要数从$0$走得到全部四个元素的规定。

    走过$1$、$2$、$3$的次序有$3\times2\times1=6$种，最后走到的那个元素，后继取四个中的哪一个都行，共$6\times4=24$种。公理 (4) 要四个后继互不相同，最后那个元素的后继只能是$0$，有$6$种。填$(24,6)$。

    这$6$种都绕回$0$，不满足 (3)；另外$18$种最后走进$1$、$2$、$3$中的某一个，不满足 (4)。四个元素的集合上，没有一种规定能同时满足 (3)、(4)、(5)。

- id: p5
  tier: hard
  statement: |
    只用五条:term[皮亚诺公理]{id="math.logic-sets.peano-axioms"}证明：

    （1）每个$n\ne0$恰是一个自然数的后继。

    （2）对每个$n\in\N$，$S(n)\ne n$。

    （3）设$a\in\N$。看$\N$的满足「$S(a)\in B$，并且对每个$n\in B$都有$S(n)\in B$」的:term[子集]{id="math.logic-sets.subset"}$B$，把所有这样的$B$的交记作$B_a$，它由从$a$走一步、再一直走下去走得到的数组成。证明$a\notin B_a$，也就是从$a$走出去，再也回不到$a$。
  hints:
    - |
      （1）、（2）都取满足要证的话的$n$组成的子集$A$，验证公理 (5) 的条件，（1）的$A$里把$0$也放进去。（3）对$a$归纳，$a=0$时，先找一个不含$0$的$B$。
    - |
      （1）取$A=\{0\}\cup\{S(k):k\in\N\}$；只有一个，用公理 (4)。（2）取$A=\{n\in\N:S(n)\ne n\}$，$0\in A$用公理 (3)，再由公理 (4) 看$S(S(n))=S(n)$会推出什么。

      （3）$a=0$时取$B=\N\setminus\{0\}$。设$a\notin B_a$，看$C=\{S(n):n\in B_a\}$：把$a$换成$S(a)$，$C$是不是一个满足那两个条件的子集？$S(a)$在不在$C$里？
    - |
      （1）令$A=\{0\}\cup\{S(k):k\in\N\}$，由公理 (1)、(2)，它是$\N$的子集。$0\in A$；$n\in A$时，$S(n)$是后继，所以$S(n)\in A$。由公理 (5)，$A=\N$，所以$n\ne0$时，$n$是某个自然数的后继。若$n=S(k)=S(l)$，由公理 (4)，$k=l$，所以只是一个自然数的后继。

      （2）令$A=\{n\in\N:S(n)\ne n\}$。由公理 (3)，$S(0)\ne0$，$0\in A$。设$n\in A$，由公理 (2)，$S(n)\in\N$；若$S(S(n))=S(n)$，由公理 (4)，$S(n)=n$，矛盾，所以$S(S(n))\ne S(n)$，即$S(n)\in A$。由公理 (5)，$A=\N$。

      （3）由公理 (2)，$\N$本身满足那两个条件，所以交取得成；两个条件对每个$B$都成立，对$B_a$也成立。令$A=\{a\in\N:a\notin B_a\}$。由公理 (2)、(3)，每个$S(n)$都是不为$0$的自然数，所以$a=0$时$B=\N\setminus\{0\}$满足那两个条件，$B_0\subseteq\N\setminus\{0\}$，$0\in A$。

      设$a\in A$，令$C=\{S(n):n\in B_a\}$。$S(a)\in B_a$，所以$S(S(a))\in C$；$C$的每个元素都写成$S(n)$，$n\in B_a$，这时$S(n)\in B_a$，所以它的后继$S(S(n))$也在$C$里。把$a$换成$S(a)$，$C$就满足那两个条件，所以$B_{S(a)}\subseteq C$。

      若$S(a)\in B_{S(a)}$，则$S(a)\in C$，有$n\in B_a$使$S(a)=S(n)$，由公理 (4)，$a=n\in B_a$，和$a\in A$矛盾。所以$S(a)\notin B_{S(a)}$，即$S(a)\in A$。由公理 (5)，$A=\N$。
  reference: |
    （1）$A=\{0\}\cup\{S(k):k\in\N\}\subseteq\N$，$0\in A$，对后继走得下去，由 (5) $A=\N$；$n=S(k)=S(l)$由 (4) 得$k=l$。

    （2）$A=\{n:S(n)\ne n\}$。$0\in A$由 (3)；$n\in A$而$S(S(n))=S(n)$时由 (4) 得$S(n)=n$，矛盾。

    （3）$B_a$是含$S(a)$、对$S$走得下去的最小的子集。由 (2)、(3)，$B_0\subseteq\N\setminus\{0\}$。设$a\notin B_a$；$C=\{S(n):n\in B_a\}$含$S(S(a))$、对$S$走得下去，故$B_{S(a)}\subseteq C$；$S(a)\in C$给出$S(a)=S(n)$，$n\in B_a$，由 (4) $a=n\in B_a$，矛盾。由 (5)，对每个$a$成立。

    （2）是（3）的特例：$S(a)=a$时$a\in B_a$。先用递归定理定义「从$a$走$n$步」，再证$n\ne0$时不回到$a$，也对。

- id: p6
  tier: hard
  statement: |
    设$(\N,0,S)$和$(N',0',S')$都满足五条:term[皮亚诺公理]{id="math.logic-sets.peano-axioms"}，后者指把公理里的$\N$、$0$、$S$换成$N'$、$0'$、$S'$。

    （1）证明恰有一个:term[映射]{id="math.logic-sets.map"}$h:\N\to N'$，使$h(0)=0'$，并且对每个$n\in\N$，$h(S(n))=S'(h(n))$。

    （2）证明$N'$的每个元素恰是$\N$的一个元素在$h$下的像（image）。
  hints:
    - |
      （1）是:term[递归定理]{id="math.logic-sets.recursion-theorem"}的一次应用，$X$、$c$、$g$各取什么？（2）递归定理的证明只用了五条公理，所以对$(N',0',S')$也成立。能不能再造一个从$N'$回到$\N$的映射？
    - |
      （1）取$X=N'$，$c=0'$，$g=S'$。（2）由递归定理，恰有一个映射$q:N'\to\N$，使$q(0')=0$，并且对每个$x\in N'$，$q(S'(x))=S(q(x))$。看映射$n\mapsto q(h(n))$：$0$处的值是什么，$S(n)$处的值怎样由$n$处的值得到？还有哪个映射也满足这两条？
    - |
      （1）由公理 (1)、(2)，$0'\in N'$，$S'$是$N'\to N'$的映射。在递归定理里取$X=N'$，$c=0'$，$g=S'$，就得到要证的。

      （2）递归定理的证明只用了五条公理，所以把$\N$换成$N'$也成立。取$X=\N$，$c=0$，$g=S$，恰有一个映射$q:N'\to\N$，使$q(0')=0$，并且对每个$x\in N'$，$q(S'(x))=S(q(x))$。

      看$\N\to\N$的映射$n\mapsto q(h(n))$：$q(h(0))=q(0')=0$，$q(h(S(n)))=q(S'(h(n)))=S(q(h(n)))$。:term[恒等映射]{id="math.logic-sets.identity-map"}（identity map）$n\mapsto n$也满足这两条：$0$处的值是$0$，$S(n)$处的值是$n$处的值的后继。由递归定理（取$X=\N$，$c=0$，$g=S$），这样的映射只有一个，所以对每个$n$，$q(h(n))=n$；同样，对每个$x\in N'$，$h(q(x))=x$。

      任取$x\in N'$。$h(q(x))=x$，所以$x$是$q(x)$的像；若$h(n)=x$，则$n=q(h(n))=q(x)$，所以只是这一个元素的像。
  reference: |
    （1）递归定理，$X=N'$，$c=0'$，$g=S'$。

    （2）做法一（唯一性）：由递归定理有$q:N'\to\N$，$q(0')=0$，$q(S'(x))=S(q(x))$；$n\mapsto q(h(n))$与$\mathrm{id}_\N$满足同样的递归条件，故$q(h(n))=n$；同理$h(q(x))=x$。于是每个$x$恰是$q(x)$一个元素的像。

    做法二（直接用公理）：至少一个：$\{x\in N':x\text{ 是某个 }h(n)\}$含$0'$、对$S'$走得下去，由$N'$的 (5) 是全部。至多一个：令$A=\{n:\text{对每个 }m，h(m)=h(n)\text{ 推出 }m=n\}$；$n=0$：$m\ne0$时由第 5 题（1）$m=S(k)$，$h(m)=S'(h(k))\ne0'$；递推：$h(m)=h(S(n))=S'(h(n))\ne0'$，故$m\ne0$，$m=S(k)$，$S'(h(k))=S'(h(n))$，由 (4) $h(k)=h(n)$，$k=n$。由 (5) $A=\N$。

- id: p7
  tier: thinking
  statement: |
    有人说，递归定理用不着讲解那样证：「令$A$为使$h(n)$有定义的$n$组成的集合。$h(0)=c$有定义，所以$0\in A$；$h(n)$有定义时，$h(S(n))=g(h(n))$也有定义，所以$n\in A$推出$S(n)\in A$。由归纳公理，$A=\N$，$h$就造好了。」

    （1）说「$h(n)$有定义」的时候，$h$是什么？

    （2）这段话没有用到公理 (3)、(4)。讲解里缺 (3) 的反例，即$\{0,1,2\}$、$S(2)=0$的那个，别的四条都满足。取$X=\N$，$c=0$，$g(x)=x+1$，有没有映射$h:\{0,1,2\}\to\N$，使$h(0)=0$，并且对每个$n$都有$h(S(n))=h(n)+1$？这说明那段话怎么样？

    （3）仍取这组$X$、$c$、$g$。在讲解的三个反例里，照讲解的办法取交，$T$各由哪些:term[有序对]{id="math.logic-sets.ordered-pair"}组成？讲解证的「恰有一个$x$使$(n,x)\in T$」，各在哪里不成立？
  hints:
    - |
      （1）要造的是什么？（2）依次算出$h(1)$、$h(2)$、$h(S(2))$，和$S(2)=0$对一对。（3）从$(0,0)$起，照$(n,x)\mapsto(S(n),x+1)$一步步走，走得到的就是$T$。
    - |
      （1）$h$还没有造出来，「使$h(n)$有定义的$n$」指哪些$n$？（2）$h(1)=1$，$h(2)=2$，那么$h(S(2))=3$，可$S(2)=0$。再想：那段话对这个反例，是不是一字不改照样能说？

      （3）三个反例里，缺 (3) 的依次走出$(0,0),(1,1),(2,2),(0,3),\dots$；缺 (4) 的走出$(0,0),(1,1),(2,2),(2,3),\dots$；缺 (5) 的走出$(0,0),(1,1),(2,2),(3,3),\dots$。看每个元素各配到几个$x$。
    - |
      （1）还没有$h$，要造的正是它。「使$h(n)$有定义的$n$组成的集合」说的是一个还不存在的映射，$A$是哪个集合说不清；「$h(S(n))=g(h(n))$」是想让$h$满足的条件，不是能拿来推理的事实。

      （2）没有。若有，则$h(1)=1$，$h(2)=2$，$h(S(2))=3$；可$S(2)=0$，$h(0)=0$，矛盾。那段话没有用到 (3)、(4)，对这个反例一字不改照样能说，「造好」的$h$却不存在，所以那段话一定有错。

      （3）缺 (3) 时，从$(0,0)$一圈圈走，$T$由所有使$x-n$是$3$的倍数的$(n,x)$组成，每个$n$都配到无穷多个$x$。缺 (4) 时，$T$由$(0,0)$、$(1,1)$和所有的$(2,x)$（$x\ge2$）组成，$2$配到无穷多个$x$。这两处都是「至多一个」不成立，讲解的证明也正是在证「至多一个」时用了公理 (3)、(4)。

      缺 (5) 时，$T$由所有的$(n,n)$（$n\in\N$）组成，$a$一个$x$也没有配到，是「至少一个」不成立：归纳只管得了从$0$走得到的元素。满足条件的$h$在三个反例里都没有，后两个里会要求$h(2)=h(2)+1$、$h(a)=h(a)+1$。所以 (3)、(4)、(5) 在递归定理里各有各的用处，只靠归纳是不够的。
  reference: |
    （1）$h$尚未造出，「$h(n)$有定义」没有所指，$A$说不清；论证把要造的对象当成已有的。

    （2）没有：$h(1)=1$，$h(2)=2$，$h(0)=h(S(2))=3\ne0$。论证只用 (1)、(2)、(5)，在此模型里同样「成立」而结论为假，故论证错误（不必先指出错在哪一句）。

    （3）缺 (3)：$T$是所有使$x-n$为$3$的倍数的$(n,x)$，每个$n$有无穷多个$x$。缺 (4)：$T=\{(0,0),(1,1)\}\cup\{(2,x):x\ge2\}$，$n=2$处无穷多个。缺 (5)：$T=\{(n,n):n\in\N\}$，$a$处没有。

    前两个「至多一个」失败，对应讲解证明里用 (3)（去掉的不是$(0,c)$、推出的不是$(0,d)$）、用 (4)（$S(m)=S(n)$推出$m=n$）的地方；第三个「至少一个」失败。三个模型里都没有满足条件的$h$。

- id: p8
  tier: thinking
  statement: |
    :term[递归定理]{id="math.logic-sets.recursion-theorem"}里，后一项由前一项按同一条规则$g$得到，$g$对$X$的每个元素都有意义。下面的递推不合这个样子。

    （1）要用前面所有的项：$a_0=b$，$a_{n+1}=f(a_0,a_1,\dots,a_n)$，其中$b\in Y$，$f$给$Y$的元素排成的每个:term[元组]{id="math.logic-sets.tuple"}（tuple，分量至少一个，个数不限）规定$Y$的一个元素。怎样取$X$、$c$、$g$，用递归定理说明这样的数列有而且只有一个？

    （2）[数学归纳法](lesson:math.logic-sets.induction#thm-strong-induction)里，:term[强归纳法]{id="math.logic-sets.strong-induction"}（strong induction）是由归纳原理证出来的。那里的证明和（1）的办法有什么相同的地方？

    （3）规则不是处处有意义：讲解里的$a_{n+1}=\frac1{a_n-1}$从$a_0=1$起，第一步就断了。从$a_0=\sqrt2$起呢？从哪些实数$a_0$起，会在某一步断掉？有没有一个$X$，从每个不会断的$a_0$起，都能取它来用递归定理？
  hints:
    - |
      （1）递归定理里的$X$可以是任何集合，它的一个元素可以是一整串前面的项。（2）证强归纳法时，$Q(n)$取的是什么？（3）断掉，就是有一项等于$1$；往回推，它的前一项是多少，再前一项呢？
    - |
      （1）取$X$为$Y$的元素排成的所有元组组成的集合，$g$在元组末尾添上$f$的值。（2）$Q(n)$是「$n_0\le m\le n$时$P(m)$都成立」，也是把前面的装在一起。

      （3）$x$是无理数时，$\frac1{x-1}$是有理数还是无理数？$\frac1{x-1}=1$时$x=2$，$\frac1{x-1}=2$时$x=\frac32$，再往回推几步，和例 1 的数列比一比。
    - |
      （1）取$X$为$Y$的元素排成的所有元组组成的集合，$c=(b)$只有一个分量，$g(y_0,\dots,y_n)=(y_0,\dots,y_n,f(y_0,\dots,y_n))$，它是$X\to X$的映射。由递归定理恰有一个$h:\N\to X$，使$h(0)=c$，$h(n+1)=g(h(n))$。令$a_n$为$h(n)$的最后一个分量，$h(n+1)$是在$h(n)$末尾添上$a_{n+1}$，归纳得$h(n)=(a_0,\dots,a_n)$，所以$a_0=b$，$a_{n+1}=f(a_0,\dots,a_n)$。反过来，数列只要满足条件，$n\mapsto(a_0,\dots,a_n)$就满足递归定理的两个条件，所以只有一个；规则随$n$变也包括在内，$n$就是分量个数减$1$。

      （2）都是打包。证强归纳法时，把$P(n_0)$到$P(n)$装成一个$Q(n)$，对$Q(n)$用只看前一个的归纳原理；这里把$a_0$到$a_n$装成一个元组，对元组用只看前一项的递归定理。「能用上前面所有的」并不要更强的原理。

      （3）从$\sqrt2$起不会断：$x$是无理数时，$x-1$是无理数、不是$0$，$\frac1{x-1}$也是无理数。取$X$为全体无理数，$c=\sqrt2$，$g(x)=\frac1{x-1}$，就能用递归定理。

      再看会断的。断掉就是走到了$1$；记$F_n$为例 1 的数列，对$k$归纳证明：从$a_0$起走$k$步正好到$1$，当且仅当$a_0=\frac{F_{k+2}}{F_{k+1}}$。$k=0$时就是$a_0=1=\frac{F_2}{F_1}$。设对$k$和每个起点都成立，从$a_0$起走$k+1$步到$1$，就是从$\frac1{a_0-1}$起走$k$步到$1$，即$\frac1{a_0-1}=\frac{F_{k+2}}{F_{k+1}}$，也就是$a_0=1+\frac{F_{k+1}}{F_{k+2}}=\frac{F_{k+3}}{F_{k+2}}$。

      所以会断的$a_0$恰是$1,2,\frac32,\frac53,\frac85,\dots$。这样的$X$有，就是去掉这些数以后剩下的实数组成的集合：$x\in X$时$x\ne1$，$\frac1{x-1}$有意义；若它是去掉的数，由上面的计算，$x$也是去掉的数，矛盾，所以$\frac1{x-1}\in X$。于是$g(x)=\frac1{x-1}$是$X\to X$的映射，从$X$里任何一个$a_0$起都能用递归定理。
  reference: |
    （1）$X=\bigcup_{k=1}^{\infty}Y^k$，$c=(b)$，$g(y_0,\dots,y_n)=(y_0,\dots,y_n,f(y_0,\dots,y_n))$。归纳：$h(n)$有$n+1$个分量，$h(n+1)$延长$h(n)$，令$a_n$为$h(n)$的末分量，$h(n)=(a_0,\dots,a_n)$。唯一：满足条件的数列使$n\mapsto(a_0,\dots,a_n)$满足递归定理的条件。规则随$n$变也包括在内（$n$是分量个数减$1$）。

    （2）强归纳法：$Q(n)$＝「$n_0\le m\le n$时$P(m)$成立」，对$Q$用普通归纳。两处都是把「前面所有的」打包成一个，化到「只看前一个」。

    （3）无理数对$g(x)=\frac1{x-1}$封闭，故从$\sqrt2$起处处有定义。$a_k=1\iff a_0=\frac{F_{k+2}}{F_{k+1}}$：$k=0$显然；$a_{k+1}=1\iff$从$a_1$起第$k$项为$1\iff\frac1{a_0-1}=\frac{F_{k+2}}{F_{k+1}}\iff a_0=\frac{F_{k+3}}{F_{k+2}}$。会断的起点集合$E=\{1,2,\frac32,\frac53,\dots\}$；$X=\R\setminus E$对$g$封闭，从每个不会断的起点都能取它。一般地，规则只在$D$上有意义时，数列有定义当且仅当有$X\subseteq D$含$a_0$并且$g(X)$的元素都在$X$里（必要时取$X=\{a_n:n\in\N\}$）。
