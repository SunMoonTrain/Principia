<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 306" width="600" height="306" font-size="14">
  <!-- 上排：0、1、2、3、4 和省略号，后继箭头 S 一个接一个。下排三幅：缺 (3)，0 → 1 → 2 → 0 成环，回到 0 的箭头用强调色；缺 (4)，0 → 1 → 2，2 指向自己，指向 2 的两支箭头用强调色；缺 (5)，0 → 1 → 2 → …，另有一个 a 指向自己，a 用强调色 -->
  <!-- 上排 -->
  <text x="32" y="26" fill="currentColor" font-size="15">从 0 起，一个接一个，走得到的就是全部</text>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="50" cy="72" r="18" />
    <circle cx="150" cy="72" r="18" />
    <circle cx="250" cy="72" r="18" />
    <circle cx="350" cy="72" r="18" />
    <circle cx="450" cy="72" r="18" />
  </g>
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="50" y="77">0</text>
    <text x="150" y="77">1</text>
    <text x="250" y="77">2</text>
    <text x="350" y="77">3</text>
    <text x="450" y="77">4</text>
  </g>
  <g fill="currentColor" font-style="italic" text-anchor="middle">
    <text x="97" y="61">S</text>
    <text x="197" y="61">S</text>
    <text x="297" y="61">S</text>
    <text x="397" y="61">S</text>
    <text x="492" y="61">S</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="69.5" y1="72" x2="122.5" y2="72" />
    <line x1="169.5" y1="72" x2="222.5" y2="72" />
    <line x1="269.5" y1="72" x2="322.5" y2="72" />
    <line x1="369.5" y1="72" x2="422.5" y2="72" />
    <line x1="469.5" y1="72" x2="512.5" y2="72" />
  </g>
  <g fill="currentColor">
    <polygon points="130.5,72 122.5,76 122.5,68" />
    <polygon points="230.5,72 222.5,76 222.5,68" />
    <polygon points="330.5,72 322.5,76 322.5,68" />
    <polygon points="430.5,72 422.5,76 422.5,68" />
    <polygon points="520.5,72 512.5,76 512.5,68" />
    <circle cx="535" cy="72" r="2" />
    <circle cx="547" cy="72" r="2" />
    <circle cx="559" cy="72" r="2" />
  </g>
  <!-- 下排左：缺 (3) -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="100" cy="150" r="16" />
    <circle cx="148" cy="222" r="16" />
    <circle cx="52" cy="222" r="16" />
  </g>
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="100" y="155">0</text>
    <text x="148" y="227">1</text>
    <text x="52" y="227">2</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="109.71" y1="164.56" x2="133.86" y2="200.78" />
    <line x1="130.5" y1="222" x2="77.5" y2="222" />
  </g>
  <g fill="currentColor">
    <polygon points="138.29,207.44 130.53,203 137.18,198.56" />
    <polygon points="69.5,222 77.5,218 77.5,226" />
  </g>
  <line x1="61.71" y1="207.44" x2="85.86" y2="171.22" stroke-width="1.8" style="stroke: var(--accent, #2563eb)" />
  <polygon points="90.29,164.56 89.18,173.44 82.53,169" style="fill: var(--accent, #2563eb)" />
  <g fill="currentColor" text-anchor="middle">
    <text x="100" y="268">缺 <tspan style="fill: var(--accent, #2563eb)">(3)</tspan>：绕成一圈</text>
    <text x="100" y="292"><tspan font-style="italic">S</tspan>(2) = 0</text>
  </g>
  <!-- 下排中：缺 (4) -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="236" cy="196" r="16" />
    <circle cx="300" cy="196" r="16" />
    <circle cx="364" cy="196" r="16" />
  </g>
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="236" y="201">0</text>
    <text x="300" y="201">1</text>
    <text x="364" y="201">2</text>
  </g>
  <line x1="253.5" y1="196" x2="274.5" y2="196" stroke="currentColor" stroke-width="1.4" />
  <polygon points="282.5,196 274.5,200 274.5,192" fill="currentColor" />
  <g fill="none" stroke-width="1.8" style="stroke: var(--accent, #2563eb)">
    <line x1="317.5" y1="196" x2="338.5" y2="196" />
    <path d="M 353.96 181.66 C 338 140, 390 140, 376.9 174.19" />
  </g>
  <g style="fill: var(--accent, #2563eb)">
    <polygon points="346.5,196 338.5,200 338.5,192" />
    <polygon points="374.04,181.66 373.17,172.76 380.64,175.62" />
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="300" y="268">缺 <tspan style="fill: var(--accent, #2563eb)">(4)</tspan>：停在 2</text>
    <text x="300" y="292"><tspan font-style="italic">S</tspan>(1) = <tspan font-style="italic">S</tspan>(2) = 2</text>
  </g>
  <!-- 下排右：缺 (5) -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="424" cy="160" r="15" />
    <circle cx="476" cy="160" r="15" />
    <circle cx="528" cy="160" r="15" />
  </g>
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="424" y="165">0</text>
    <text x="476" y="165">1</text>
    <text x="528" y="165">2</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="440.5" y1="160" x2="451.5" y2="160" />
    <line x1="492.5" y1="160" x2="503.5" y2="160" />
    <line x1="544.5" y1="160" x2="549.5" y2="160" />
  </g>
  <g fill="currentColor">
    <polygon points="459.5,160 451.5,164 451.5,156" />
    <polygon points="511.5,160 503.5,164 503.5,156" />
    <polygon points="557.5,160 549.5,164 549.5,156" />
    <circle cx="567" cy="160" r="1.8" />
    <circle cx="576" cy="160" r="1.8" />
    <circle cx="585" cy="160" r="1.8" />
  </g>
  <g fill="none" stroke-width="1.8" style="stroke: var(--accent, #2563eb)">
    <circle cx="476" cy="222" r="15" />
    <path d="M 490.29 213.75 C 530 196, 530 250, 497.59 233.51" />
  </g>
  <polygon points="490.29,230.25 499.23,229.86 495.96,237.17" style="fill: var(--accent, #2563eb)" />
  <text x="476" y="227" font-size="15" font-style="italic" text-anchor="middle" style="fill: var(--accent, #2563eb)">a</text>
  <g fill="currentColor" text-anchor="middle">
    <text x="500" y="268">缺 <tspan style="fill: var(--accent, #2563eb)">(5)</tspan>：多出走不到的</text>
    <text x="500" y="292"><tspan font-style="italic">S</tspan>(<tspan font-style="italic">a</tspan>) = <tspan font-style="italic">a</tspan></text>
  </g>
</svg>
