- id: p1
  tier: easy
  statement: |
    用$m\ast0=m$，$m\ast S(n)=S(S(m\ast n))$（$m,n\in\N$）:term[递归定义]{id="math.logic-sets.recursive-definition"}自然数的运算$\ast$。求$3\ast4$和$4\ast3$，按这个顺序填。
  answer:
    type: tuple
    value: [11, 10]
    exact: true
  hints:
    - |
      和加法比一比：右边的数每加$1$，加法取一次后继，这里取几次？
    - |
      求$3\ast4$，从$3\ast0=3$起，$3\ast1=S(S(3))=5$，接着算$3\ast2$、$3\ast3$、$3\ast4$。求$4\ast3$，要从$4\ast0=4$另外算起。
    - |
      $3\ast0$到$3\ast4$依次是$3,5,7,9,11$，$4\ast0$到$4\ast3$依次是$4,6,8,10$，所以填$(11,10)$。
  solution: |
    对每个取定的$m$，这是:term[递归定理]{id="math.logic-sets.recursion-theorem"}里$X=\N$、$c=m$、$g(x)=S(S(x))$的情形：从$m$起，右边的数每加$1$，就多走两步。$m=3$时依次得$3,5,7,9,11$，$m=4$时依次得$4,6,8,10$，所以$3\ast4=11$，$4\ast3=10$，填$(11,10)$。

    两个数不同，可见照右边的数递归定义出来的运算，不一定满足交换律；加法满足，是要证的。

- id: p2
  tier: easy
  statement: |
    下面哪些等式，不用归纳，只把加法的定义$m+0=m$、$m+S(n)=S(m+n)$用有限次就能证出？这里$2=S(S(0))$，$3$、$4$也照这样展开。
  answer:
    type: choice
    multiple: true
    options:
      - |
        对所有$m,n\in\N$，$(m+n)+2=m+(n+2)$
      - |
        对所有$m,n\in\N$，$(m+2)+n=m+(2+n)$
      - |
        $0+4=4$
      - |
        对所有$m\in\N$，$m+3=S(S(S(m)))$
      - |
        对所有$m\in\N$，$3+m=S(S(S(m)))$
    value: [1, 3, 4]
  hints:
    - |
      定义拆得动的是右边的数：它是$0$，或者是某个数的后继。逐项看每个加号的右边是什么。
    - |
      A 的$n+2$先拆成$S(S(n))$，这时$m+S(S(n))$的右边就是后继了。C 从$0+1=S(0+0)$起，一步步算到$0+4$。B、E 里有的加号右边只是一个字母，它拆得动吗？
    - |
      A：右边是$2$，拆两次得$(m+n)+2=S(S(m+n))$；同样$n+2=S(S(n))$，再拆两次，$m+S(S(n))=S(S(m+n))$，两边相等。C：$0+1=S(0+0)=1$，接下去$0+2=S(0+1)=2$，$0+3=3$，$0+4=4$。D：$m+1=S(m)$，$m+2=S(m+1)=S(S(m))$，$m+3=S(m+2)=S(S(S(m)))$。

      B 的左边只拆得到$S(S(m))+n$，右边的$2+n$也拆不动：字母$n$不知道是$0$还是后继，要对$n$归纳。E 的$3+m$也一样，要对$m$归纳。选 A、C、D。
  solution: |
    A、C、D 里要拆的加号，右边都是$2$、$3$、$4$这样具体的数，或者拆出来是后继，拆有限次就到头。A 的两边都拆成$S(S(m+n))$；C 依次得$0+1=1$，$0+2=2$，$0+3=3$，$0+4=4$；D 拆三次就是$S(S(S(m)))$。左边的字母不碍事，定义本来就对每个$m$成立。

    B、E 也都对，B 是结合律的特例，E 由讲解的第一个定理得到。可$S(S(m))+n$、$2+n$和$3+m$的右边是字母，定义用不上，要对它归纳。能不能换个办法避开归纳，见第 7 题（4）。选 A、C、D。

- id: p3
  tier: medium
  statement: |
    用$m\star0=m$，$m\star(n+1)=(m\star n)+m$（$m,n\in\N$）:term[递归定义]{id="math.logic-sets.recursive-definition"}运算$\star$。下面哪些等式对所有自然数$m$、$n$、$k$都成立？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $m\star n=n\star m$
      - |
        $(m\star n)\star k=(m\star k)\star n$
      - |
        $(m\star n)\star k=m\star(n\star k)$
      - |
        $m\star(n+k)=(m\star n)+(m\star k)$
      - |
        $(m+n)\star k=(m\star k)+(n\star k)$
    value: [2, 5]
  hints:
    - |
      先看清$\star$算的是什么：写出$m\star0$、$m\star1$、$m\star2$，和乘法比一比。不成立的等式，拿$0$、$1$代进去就看得出来。
    - |
      $m\star n=m(n+1)$，因为$n\mapsto m(n+1)$满足同样的两条，由:term[递归定理]{id="math.logic-sets.recursion-theorem"}只能是它。把每一项的两边都换成加法和乘法，再用运算律比较。
    - |
      先证$m\star n=m(n+1)$。$m(0+1)=m$，$m((n+1)+1)=m(n+1)+m$，所以$n\mapsto m(n+1)$和$n\mapsto m\star n$满足同样的两条，由递归定理，两者相等。

      A：$1\star0=1$，$0\star1=0$，不成立。C：$(1\star0)\star1=1\star1=2$，$1\star(0\star1)=1\star0=1$，不成立。D：$1\star(0+0)=1$，$(1\star0)+(1\star0)=2$，不成立。

      B：两边分别是$(m(n+1))(k+1)$和$(m(k+1))(n+1)$，由乘法的结合律、交换律，它们相等。E：左边是$(m+n)(k+1)$，由分配律和交换律，它等于$m(k+1)+n(k+1)$，就是右边。选 B、E。
  solution: |
    $m\star0=m=m\cdot1$，右边的数每加$1$，就多加一个$m$，所以$m\star n$是$n+1$个$m$相加，即$m(n+1)$；严格地说，$n\mapsto m(n+1)$满足同样的两条，由:term[递归定理]{id="math.logic-sets.recursion-theorem"}，它就是$n\mapsto m\star n$。

    A、C、D 各用小的数推翻：$1\star0=1$而$0\star1=0$；$(1\star0)\star1=2$而$1\star(0\star1)=1$；$1\star(0+0)=1$而$(1\star0)+(1\star0)=2$。

    B 的两边是$(m(n+1))(k+1)$和$(m(k+1))(n+1)$，由乘法的结合律、交换律相等。E 的左边是$(m+n)(k+1)$，由分配律和交换律等于$m(k+1)+n(k+1)$，就是右边。选 B、E。

- id: p4
  tier: medium
  statement: |
    在集合$\{0,1,2,3\}$上规定$S(0)=1$，$S(1)=2$，$S(2)=3$，$S(3)=2$，它满足:term[皮亚诺公理]{id="math.logic-sets.peano-axioms"} (5)，不满足 (4)。照加法的定义，这个集合上恰有一个运算$+$，使所有元素$m$、$n$都满足$m+0=m$，$m+S(n)=S(m+n)$。求$3+3$，再数出分量都取自这个集合、满足$m\ne n$和$m+k=n+k$的:term[三元组]{id="math.logic-sets.tuple"}（triple）$(m,n,k)$有几个，按（前者，后者）的顺序填。
  answer:
    type: tuple
    value: [2, 10]
    exact: true
  hints:
    - |
      $1=S(0)$，$2=S(1)$，$3=S(2)$。照定义，$m+1$、$m+2$、$m+3$各怎样由$m$得到？
    - |
      $m+1=S(m)$，$m+2=S(S(m))$，$m+3=S(S(S(m)))$。取定$k$，把$m=0,1,2,3$时的$m+k$排成一行：$k=0$时是$0,1,2,3$，$k=1$时是$1,2,3,2$。再写出另外两行，看每行里哪些位置的数相同。
    - |
      $k=2$时是$2,3,2,3$，$k=3$时是$3,2,3,2$，所以$3+3=2$。再找每行里相同的数：$k=0$时没有；$k=1$时是$1$、$3$两处；$k=2$、$k=3$时都是$0$、$2$两处和$1$、$3$两处。

      一共$1+2+2=5$对，每一对里两个数可以对调，给出两个三元组，所以有$10$个。填$(2,10)$。
  solution: |
    由定义，$m+1=S(m)$，$m+2=S(S(m))$，$m+3=S(S(S(m)))$。$m=0,1,2,3$时，$m+k$在$k=0$时依次是$0,1,2,3$，$k=1$时是$1,2,3,2$，$k=2$时是$2,3,2,3$，$k=3$时是$3,2,3,2$。还要对得上$S(3)=2$，即$S(m+3)=m+2$：最后一行各取后继，正是$2,3,2,3$。

    所以$3+3=2$。满足$m+k=n+k$的不同的两个数，$k=0$时没有；$k=1$时是$1$和$3$；$k=2$、$k=3$时都是$0$和$2$、$1$和$3$。一共$5$对，每一对对调给出两个三元组，共$10$个，填$(2,10)$。

    消去律在这里不成立：$S(1)=S(3)$，所以$1+1=3+1$，讲解的证明正是在这一步用了公理 (4)。结合律、交换律的证明只用定义和归纳，归纳靠的是公理 (5)，所以在这里照样成立。

- id: p5
  tier: hard
  statement: |
    用例 2 的两个等式和讲解里证过的运算律，证明：对所有自然数$m$、$n$、$k$，

    （1）$mn=nm$；

    （2）$(mn)k=m(nk)$；

    （3）$(m+n)k=mk+nk$，这一问不用（1），直接归纳。
  hints:
    - |
      照讲解的样子，先选好对谁归纳：乘法的定义管的是右边的数，让归纳的变量出现在右边，别的字母先取定。
    - |
      （1）对$n$归纳，两步各用例 2 的一个等式。（2）对$k$归纳，$m(nk)+mn$可以用分配律合成一项。（3）对$k$归纳，$(mk+nk)+(m+n)$要重新配对，用加法的结合律、交换律。
    - |
      （1）取定$m$，对$n$归纳。$n=0$时，$m\cdot0=0$是乘法的定义，$0\cdot m=0$是例 2 的前一个等式，两边相等。设$mn=nm$，则$m(n+1)=mn+m=nm+m$。由例 2 的后一个等式，把那里的$m$、$n$换成$n$、$m$，$(n+1)m=nm+m$，所以$m(n+1)=(n+1)m$。

      （2）取定$m$、$n$，对$k$归纳。$k=0$时，左边是$0$，右边是$m(n\cdot0)=m\cdot0=0$。设$(mn)k=m(nk)$，则$(mn)(k+1)=(mn)k+mn=m(nk)+mn$。由分配律，它等于$m(nk+n)$，而$nk+n=n(k+1)$，所以$(mn)(k+1)=m(n(k+1))$。

      （3）取定$m$、$n$，对$k$归纳。$k=0$时两边都是$0$。设$(m+n)k=mk+nk$，则$(m+n)(k+1)=(m+n)k+(m+n)$，它等于$(mk+nk)+(m+n)$。由加法的结合律、交换律，$nk+(m+n)=m+(nk+n)$，所以它又等于$(mk+m)+(nk+n)$，即$m(k+1)+n(k+1)$。
  reference: |
    （1）对$n$归纳：$m\cdot0=0=0\cdot m$；$m(n+1)=mn+m=nm+m=(n+1)m$（乘法的定义、归纳假设、例 2）。

    （2）对$k$归纳：$(mn)\cdot0=0=m(n\cdot0)$；$(mn)(k+1)=(mn)k+mn=m(nk)+mn=m(nk+n)=m(n(k+1))$（分配律）。

    （3）对$k$归纳：两边在$k=0$时都是$0$；$(m+n)(k+1)=(mk+nk)+(m+n)=(mk+m)+(nk+n)$。也可以由（1）和分配律：$(m+n)k=k(m+n)=km+kn=mk+nk$，题目要求不这样做。

    （1）另一种做法见第 7 题（3）。（2）对$k$归纳最省事；对$m$或$n$归纳，要先有（1）或（3）。

- id: p6
  tier: hard
  statement: |
    （1）证明：任意两个自然数$m$、$n$，总有自然数$k$使$n=m+k$或者$m=n+k$。

    （2）证明：若$m\le n$且$n\le m$，则$m=n$。

    （3）设$k$是自然数。证明：$m\le n$当且仅当$m+k\le n+k$。
  hints:
    - |
      （1）取定$m$，对$n$归纳；从$n$到$n+1$时，按归纳假设里的两种情形分开看。（2）把两个条件写成等式，合成一个，再用消去律。（3）把$m\le n$写成等式，两个方向分开证。
    - |
      （1）$m=n+k$时再分$k=0$和$k\ne0$；$k\ne0$时，$k$是某个数的后继。（2）设$m+a=n$，$n+b=m$，先证$a+b=0$，再证$b=0$。（3）$m+j=n$时，$(m+j)+k$等于$(m+k)+j$；反过来用消去律。
    - |
      （1）取定$m$，对$n$归纳。$n=0$时，由讲解的第一个定理，$m=0+m$，取$k=m$，后一种成立。设$n$时成立，看$n+1$。若$n=m+k$，则$n+1=(m+k)+1=m+(k+1)$，前一种成立。

      若$m=n+k$，再分两种。$k=0$时$m=n$，$n+1=m+1$，前一种成立。$k\ne0$时，由[皮亚诺公理与递归定义](lesson:math.logic-sets.peano-axioms)第 5 题（1），$k$是某个$j$的后继，$k=j+1$。于是$m=n+(j+1)=(n+j)+1$，由讲解的第一个定理，它等于$(n+1)+j$，后一种成立。

      （2）设$m+a=n$，$n+b=m$。由结合律，$m+(a+b)=(m+a)+b=n+b$，它等于$m$，也就是$m+0$；由交换律和消去律，$a+b=0$。若$b\ne0$，则$b=j+1$，$a+b=(a+j)+1$是后继，由皮亚诺公理 (3)，它不是$0$，矛盾。所以$b=0$，$m=n+0=n$。

      （3）设$m\le n$，有$j$使$m+j=n$。由结合律、交换律，$(m+k)+j=(m+j)+k=n+k$，所以$m+k\le n+k$。反过来，设有$j$使$(m+k)+j=n+k$，左边等于$(m+j)+k$，由消去律，$m+j=n$，所以$m\le n$。
  reference: |
    （1）固定$m$对$n$归纳。$n=0$：$m=0+m$。步：$n=m+k$时$n+1=m+(k+1)$；$m=n+0$时$n+1=m+1$；$m=n+(j+1)$时$m=(n+j)+1=(n+1)+j$。非零的数是后继：皮亚诺公理与递归定义第 5 题（1）。

    （2）$m+a=n$，$n+b=m$，得$m+(a+b)=m+0$，消去得$a+b=0$；$b=j+1$时$a+b=(a+j)+1\ne0$（公理 (3)），故$b=0$。

    （3）⇒：$m+j=n$，$(m+k)+j=n+k$。⇐：$(m+k)+j=n+k$，即$(m+j)+k=n+k$，消去$k$。反方向要用消去律，也就是要用公理 (4)：在$\{0,1,2\}$、$S(1)=S(2)=2$里，$2+1=2\le1+1=2$，可没有$j$使$2+j=1$。

- id: p7
  tier: thinking
  statement: |
    讲解里的加法照右边的数递归。有人改成照左边的数递归：$0\oplus n=n$，$S(m)\oplus n=S(m\oplus n)$（$m,n\in\N$）。

    （1）取定$n$，怎样用:term[递归定理]{id="math.logic-sets.recursion-theorem"}得到映射$m\mapsto m\oplus n$？

    （2）不用交换律，证明$m\oplus n=m+n$，再证明$m\oplus n=n+m$。用到的是递归定理的「至少有一个」还是「至多有一个」？

    （3）由（2）就得到加法的交换律，没有再归纳一次。归纳藏到哪里去了？照这个办法，由例 2 的两个等式证明乘法的交换律。

    （4）归纳真的省不掉吗？在$\N$外面添两个不同的对象$a$、$b$，令$S(a)=a$，$S(b)=b$，:term[皮亚诺公理]{id="math.logic-sets.peano-axioms"} (1) 到 (4) 仍成立。在添了它们以后的集合上，能不能规定一种加法，使$x+0=x$和$x+S(y)=S(x+y)$对所有元素$x$、$y$都成立，却有$0+a\ne a$？只添一个$a$行不行？
  hints:
    - |
      （1）（2）递归定理说，满足$h(0)=c$和$h(S(m))=g(h(m))$的映射恰有一个；看看$m\mapsto m+n$、$m\mapsto n+m$各满足什么。（3）递归定理的「至多有一个」是怎样证的？（4）$S(a)=a$，把$y=a$代进第二条看看。
    - |
      （1）取$X=\N$，$c=n$，$g=S$。（2）讲解的第一个定理说$0+n=n$，$S(m)+n=S(m+n)$；加法的定义说$n+0=n$，$n+S(m)=S(n+m)$。（3）$m\mapsto mn$和$m\mapsto nm$各满足怎样的两条？（4）由第二条，$x+a=x+S(a)=S(x+a)$，后继等于自己的元素有哪些？
    - |
      （1）取$X=\N$，$c=n$，$g=S$，由递归定理，恰有一个映射$h:\N\to\N$，使$h(0)=n$，并且对每个$m$，$h(S(m))=S(h(m))$。把$h(m)$写成$m\oplus n$，就是规定的两条。

      （2）取定$n$。由讲解的第一个定理，$0+n=n$，$S(m)+n=S(m+n)$，所以$m\mapsto m+n$满足（1）里对$h$的两条要求，由「至多有一个」，$m\oplus n=m+n$。由加法的定义，$n+0=n$，$n+S(m)=S(n+m)$，所以$m\mapsto n+m$也满足这两条，同样$m\oplus n=n+m$。两次用的都是「至多有一个」。

      （3）合起来，$m+n=n+m$。归纳藏在两处：讲解第一个定理的两个等式是归纳证出来的；递归定理的「至多有一个」是用公理 (5) 证的，也是归纳。后一次归纳，对满足同样两条的任何两个映射已经一起做完，交换律用不着自己再归纳。

      乘法也这样证。取定$n$，由例 2，$0\cdot n=0$，$(m+1)n=mn+n$；由乘法的定义，$n\cdot0=0$，$n(m+1)=nm+n$。所以$m\mapsto mn$和$m\mapsto nm$都是递归定理里取$X=\N$、$c=0$、$g(x)=x+n$得到的映射，由「至多有一个」，$mn=nm$。

      （4）能。$y$是自然数$n$时，$x+n$由两条完全定出，就是从$x$走$n$步，$a+n=a$，$b+n=b$。$y=a$时，第二条要求$x+a=S(x+a)$。自然数的后继不等于自己（[皮亚诺公理与递归定义](lesson:math.logic-sets.peano-axioms)第 5 题（2）），所以$x+a$只能是$a$或$b$，取哪一个，第二条都成立；$x+b$也一样。

      例如对每个$x$规定$x+a=b$，$x+b=a$，这时$0+a=b\ne a$；$a+0=a$，和$0+a$也不相等，交换律不成立。只添一个$a$不行：后继等于自己的元素只有$a$，$x+a$只能是$a$，于是$0+a=a$。

      添两个的例子说明，公理 (1) 到 (4) 连同加法的两条，推不出$0+n=n$，也推不出交换律。第 2 题的选项 B、E 在这里也不成立：B 里取$m=0$、$n=a$，$(0+2)+a=b$，而$0+(2+a)=0+b=a$；E 里取$m=a$，$3+a=b$，而$S(S(S(a)))=a$。讲解里的归纳，也就是公理 (5)，是省不掉的，证这两项也一样。
  reference: |
    （1）$X=\N$，$c=n$，$g=S$。

    （2）$m\mapsto m+n$由讲解第一个定理满足$h(0)=n$、$h(S(m))=S(h(m))$；$m\mapsto n+m$由加法的定义满足同样两条。两次都用唯一性。

    （3）交换律由此得出；归纳在第一个定理的两个等式里，也在递归定理的唯一性里（令$A=\{m:h(m)=h'(m)\}$，用公理 (5)）。乘法：$m\mapsto mn$（例 2）与$m\mapsto nm$（定义）都满足$h(0)=0$、$h(m+1)=h(m)+n$，故相等。

    （4）能：$x+n$照旧（$a+n=a$，$b+n=b$），$x+a=b$，$x+b=a$。逐条验证：$y=n$时由$x+n$的规定；$y=a$时$x+S(a)=x+a=b=S(b)=S(x+a)$；$y=b$同理。$0+a=b\ne a=a+0$。

    只添一个点时$x+a$是后继等于自己的元素，只能是$a$，$0+a=a$，加法仍交换（$a+n=a=n+a$，$a+a=a$）；不过$0+a=1+a$，消去律不成立，可见消去律也少不得归纳。第 2 题的选项 B、E 在添两个点的例子里也不成立：B 里取$m=0$、$n=a$，$(0+2)+a=b$而$0+(2+a)=0+b=a$；E 里取$m=a$，$3+a=b$而$S(S(S(a)))=a$。结论：公理 (1) 到 (4) 连同定义的两条推不出$0+n=n$、交换律和第 2 题的 B、E，非用归纳不可。

- id: p8
  tier: thinking
  statement: |
    照加法、乘法的样子，用$m^0=1$，$m^{n+1}=m^n\cdot m$（$m,n\in\N$）:term[递归定义]{id="math.logic-sets.recursive-definition"}乘方（power）。

    （1）证明：对所有自然数$m$、$n$、$k$，$m^{n+k}=m^n\cdot m^k$，$(m^n)^k=m^{nk}$。

    （2）加法、乘法都满足交换律，乘方不满足，例如$2^3\ne3^2$。照讲解和第 5 题的办法去证$m^n=n^m$，卡在哪里？加法、乘法有、乘方没有的，是什么样的等式？

    （3）按定义，$0^0$是多少？[映射](lesson:math.logic-sets.functions)第 8 题说，有$n$个元素的集合到有$m$个元素的集合的映射有$m^n$个，那里约定$0^0=1$，和这里对得上吗？从数映射看，定义的两条和（1）的两个等式各说的是什么？
  hints:
    - |
      （1）都对$k$归纳。（2）照第 5 题（1）的证明一步步改成乘方：$n=0$时成立吗？从$n$到$n+1$要用哪个等式？（3）给:term[定义域]{id="math.logic-sets.domain"}（domain）添一个元素，映射的个数变成原来的几倍？
    - |
      （1）$m^{n+(k+1)}=m^{n+k}\cdot m$；证后一个等式时，用前一个。（2）$n=0$时，$m^0$和$0^m$各是多少？从$n$到$n+1$，要用$(n+1)^m=n^m\cdot m$，拿很小的数试试；加法、乘法里和它对应的等式是什么？（3）把定义域分成两块，在两块上各给一个映射。
    - |
      （1）取定$m$、$n$，对$k$归纳。前一个等式：$k=0$时，$m^n\cdot m^0=m^n\cdot1=m^n$。设$k$时成立，则$m^{n+(k+1)}=m^{n+k}\cdot m=(m^n\cdot m^k)\cdot m$，由乘法的结合律，它等于$m^n\cdot(m^k\cdot m)$，即$m^n\cdot m^{k+1}$。

      后一个等式：$k=0$时两边都是$1$。设$k$时成立，则$(m^n)^{k+1}=(m^n)^k\cdot m^n=m^{nk}\cdot m^n$，由前一个等式，它等于$m^{nk+n}$，即$m^{n(k+1)}$。

      （2）$n=0$时就不成立：$m^0=1$，可$m\ne0$时$0^m=0$。从$n$到$n+1$也走不通：设$m^n=n^m$，则$m^{n+1}=m^n\cdot m=n^m\cdot m$，要它等于$(n+1)^m$，就得有$(n+1)^m=n^m\cdot m$；可$m=n=2$时，归纳假设$2^2=2^2$成立，$(n+1)^m=3^2=9$，$n^m\cdot m=2^2\cdot2=8$，并不相等，这就是题干里的$2^3\ne3^2$。

      加法、乘法里，和$(n+1)^m=n^m\cdot m$对应的等式是$(n+1)+m=(n+m)+1$和$(n+1)m=nm+m$，正是讲解的第一个定理和例 2：左边的数加$1$，和右边的数加$1$，结果的变法一样。乘方里，指数加$1$，结果乘以底数；底数加$1$，结果却不是乘以指数，这条路就断了。

      （3）由第一条，$0^0=1$，对得上。$m^0=1$说，:term[空集]{id="math.logic-sets.empty-set"}（empty set）到任何集合的映射恰有$1$个，到空集也是。$m^{n+1}=m^n\cdot m$说，给定义域添一个元素，原来的每个映射都有$m$种办法给它挑一个像（image），映射的个数变成原来的$m$倍。

      $m^{n+k}=m^n\cdot m^k$说，把定义域分成$n$个和$k$个元素的两块，在两块上各给一个映射，合起来就是整个定义域上的一个映射。$(m^n)^k=m^{nk}$说，把定义域的$nk$个元素排成$k$组，每组$n$个，每组上有$m^n$个映射可挑，$k$组各挑一个。所以$0^0=1$不是勉强的约定，照递归定义和照数映射，得到的都是它。
  reference: |
    （1）对$k$归纳：$m^{n+(k+1)}=m^{n+k}m=(m^nm^k)m=m^n(m^km)=m^nm^{k+1}$；$(m^n)^{k+1}=(m^n)^km^n=m^{nk}m^n=m^{nk+n}=m^{n(k+1)}$。

    （2）$n=0$：$m^0=1$，$0^m=0$（$m\ne0$）。从$n$到$n+1$需要$(n+1)^m=n^m\cdot m$，不成立：$m=n=2$时归纳假设$2^2=2^2$成立，可$3^2=9$，$2^2\cdot2=8$。加法、乘法靠的是$(n+1)+m=(n+m)+1$、$(n+1)m=nm+m$，即照左边的数递归的等式和照右边的数递归的定义同形；由第 7 题，这就给出交换律。乘方只有照指数递归的式子，底数加$1$时没有同形的式子，例如$1^2$到$2^2$乘$4$，$2^2$到$3^2$乘$\frac94$。

    （3）$0^0=1$，与约定一致。$m^0=1$：空映射唯一；$m^{n+1}=m^n\cdot m$：新元素的像有$m$种挑法；$m^{n+k}=m^nm^k$：定义域分两块；$(m^n)^k=m^{nk}$：定义域排成$k$组、每组$n$个。反过来，归纳地数映射就证明了映射的个数公式，含$m$、$n$为$0$的情形。
