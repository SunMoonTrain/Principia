- id: p1
  tier: easy
  statement: |
    下面每一项在一个集合上规定了一个:term[关系]{id="math.logic-sets.binary-relation"}$\preceq$。哪些是:term[偏序]{id="math.logic-sets.partial-order"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        在$\N^+$上，$a\preceq b$当且仅当$a$的每个素因数都整除$b$
      - |
        在$\{2,3,5,6,10,15,30\}$上，$a\preceq b$当且仅当$a$的每个素因数都整除$b$
      - |
        在$\N^+$上，$a\preceq b$当且仅当有正整数$k$使$b=a^k$
      - |
        在$\N^+$上，$a\preceq b$当且仅当$a^2\mid b$
      - |
        在$\Pow(\{1,2,3\})$上，$X\preceq Y$当且仅当$X\subseteq Y$，并且$Y$至多比$X$多一个元素
    value: [2, 3]
  hints:
    - |
      逐条查自反、反对称、传递，有一条不成立就不是偏序；不成立的，举出一个反例（counterexample）就够了。A 和 B 的规定一样，只是集合不同。
    - |
      自反要每个元素都满足，D 看$2$和它自己。反对称看有没有两个不同的元素互相有这个关系：A 试$2$和$4$，B 看有没有两个数的素因数完全相同；C 设$b=a^k$、$a=b^l$，代到一起看。传递看能不能一步步接下去，E 从$\varnothing$起试试。
    - |
      A：$2$和$4$的素因数都只有$2$，$2\preceq4$、$4\preceq2$都成立，可$2\ne4$，不反对称。B：这七个数分解成素数的乘积，每个素因数都只出现一次，所以「$a$的每个素因数都整除$b$」就是$a\mid b$，这个关系就是整除，是偏序。C：$a=a^1$，自反；$b=a^k$、$c=b^l$时$c=a^{kl}$，传递。再设$b=a^k$、$a=b^l$，则$a=a^{kl}$：$a=1$时$b=1$，$a>1$时$kl=1$、$k=1$、$b=a$，所以反对称，是偏序。

      D：$a=2$时$a^2=4$，$4$不整除$2$，$2\preceq2$不成立，不自反。E：$\varnothing\preceq\{1\}$，$\{1\}\preceq\{1,2\}$，可$\{1,2\}$比$\varnothing$多两个元素，$\varnothing\preceq\{1,2\}$不成立，不传递。所以选 B、C。
  solution: |
    A：$2$和$4$的素因数都只有$2$，$2\preceq4$、$4\preceq2$都成立，可$2\ne4$，不反对称。B：这七个数分解成素数的乘积，每个素因数都只出现一次，所以「$a$的每个素因数都整除$b$」就是$a\mid b$，这个关系就是整除，是偏序。规定和 A 一样，可这七个数里，没有两个的素因数完全相同。

    C：$a=a^1$，自反；$b=a^k$、$c=b^l$时$c=a^{kl}$，传递；$b=a^k$、$a=b^l$时$a=a^{kl}$，$a=1$则$b=1$，$a>1$则$kl=1$、$k=1$，都有$a=b$，反对称，所以是偏序。D：自反要每个$a$都有$a^2\mid a$，可$4$不整除$2$，不自反。E：$\varnothing\preceq\{1\}$、$\{1\}\preceq\{1,2\}$成立，$\{1,2\}$却比$\varnothing$多两个元素，$\varnothing\preceq\{1,2\}$不成立，不传递。选 B、C。

- id: p2
  tier: easy
  statement: |
    把$\{1,2,\dots,8\}$按整除看成:term[偏序集]{id="math.logic-sets.poset"}，它的:term[哈斯图]{id="math.logic-sets.hasse-diagram"}里有几条线？
  answer:
    type: number
    value: 8
    exact: true
  hints:
    - |
      哈斯图只连紧挨着的两个数：$a\mid b$，$a\ne b$，并且除了$a$、$b$自己，没有$c$使$a\mid c$、$c\mid b$。从小到大，逐个数出每个数往上连的线。
    - |
      $1$整除每个数，可$1$和$4$、$6$、$8$之间都夹着$2$。$2$和$8$之间夹着哪个数？
    - |
      从$1$往上连$2$、$3$、$5$、$7$，$4$、$6$、$8$和$1$之间夹着$2$，不连。从$2$往上连$4$、$6$，$8$和$2$之间夹着$4$，不连；从$3$往上连$6$，从$4$往上连$8$；$5$、$6$、$7$、$8$往上没有线。一共$4+2+1+1=8$条。
  solution: |
    满足$a\mid b$、$a\ne b$的一对数，$a=1$时有$7$对，$a=2$时有$3$对（$b$是$4$、$6$、$8$），$a=3$、$a=4$时各有$1$对（$b$依次是$6$、$8$），共$12$对。其中$1$和$4$、$6$、$8$之间都夹着$2$，$2$和$8$之间夹着$4$，这$4$对不连线。其余$8$对中间没有别的数：$1$连$2$、$3$、$5$、$7$，$2$连$4$、$6$，$3$连$6$，$4$连$8$，所以有$8$条线。

- id: p3
  tier: medium
  statement: |
    ${(\Pow(\{1,2,3,4\}),\subseteq)}$里，元素最多的:term[链]{id="math.logic-sets.chain"}有几个元素？这样的链有几条？按（元素个数，条数）的顺序填。
  answer:
    type: tuple
    value: [5, 24]
    exact: true
  hints:
    - |
      链里任意两个集合，总有一个包含另一个。两个不同的集合，一个包含另一个，它们的元素个数能相同吗？
    - |
      链里各个集合的元素个数互不相同，只能是$0,1,2,3,4$里的数，所以链至多有几个元素？取到这么多时，从$\varnothing$起，每往上一步只能怎样变？
    - |
      链里两个不同的集合$X$、$Y$，若$X\subseteq Y$，则$Y$比$X$多出元素，元素个数不同；元素个数都在$0$到$4$之间，所以链至多有$5$个元素。恰有$5$个时，它们的元素个数依次是$0,1,2,3,4$，从$\varnothing$起，每一步添进一个新元素，最后到$\{1,2,3,4\}$。

      第一步有$4$种添法，以后依次有$3$、$2$、$1$种，不同的添法给出不同的链，由乘法原理（multiplication principle），有$4\times3\times2\times1=24$条。所以填$(5,24)$。
  solution: |
    设$X$、$Y$是链里两个不同的集合，$X\subseteq Y$，则$Y$的元素比$X$多，所以链里各个集合的元素个数互不相同，都在$0$到$4$之间，链至多有$5$个元素。恰有$5$个元素的链，从$\varnothing$起，每一步添进一个新元素，最后到$\{1,2,3,4\}$，例如$\varnothing$、$\{3\}$、$\{1,3\}$、$\{1,3,4\}$、$\{1,2,3,4\}$。

    这样的链由四个元素添进去的先后完全确定，不同的先后给出不同的链，由乘法原理，有$4\times3\times2\times1=24$条，答案是$(5,24)$。

- id: p4
  tier: medium
  statement: |
    集合$\{1,2,3\}$上一共有多少个不同的:term[偏序]{id="math.logic-sets.partial-order"}？其中有几个是:term[全序]{id="math.logic-sets.total-order"}？按（偏序的个数，全序的个数）的顺序填。
  answer:
    type: tuple
    value: [19, 6]
    exact: true
  hints:
    - |
      由自反，每个数都和自己有关系；还要定的只是不同的数之间哪些可比、谁小。按三对数里有几对可比来分类，画出哈斯图的样子，再查传递。
    - |
      可比的对数可以是$0$、$1$、$2$、$3$。恰有两对可比时，这两对有一个公共的数，记作$m$；另外两个数能不能一个比$m$小、一个比$m$大？
    - |
      由反对称，不同的$a$、$b$之间$a\prec b$和$b\prec a$至多有一个成立。没有一对可比，只有相等关系这$1$个。恰有一对可比，选哪一对有$3$种，谁小有$2$种，共$6$个，没有两步可接，都传递。恰有两对可比，设公共的数是$m$，要是$a\prec m$、$m\prec b$，由传递$a\prec b$，三对就都可比了；所以另两个数都比$m$大，或者都比$m$小，共$3\times2=6$个，没有两步可接，都传递。

      三对都可比就是全序，把三个数从小到大排成一队，有$3\times2\times1=6$种排法。一共$1+6+6+6=19$个偏序，其中全序$6$个，填$(19,6)$。
  solution: |
    按三对数$\{1,2\}$、$\{1,3\}$、$\{2,3\}$里有几对可比分类，每一对可比时，$a\prec b$和$b\prec a$恰有一个成立。没有一对可比：只有相等关系，$1$个，它也自反、反对称、传递。恰有一对可比：$3\times2=6$个，都传递。恰有两对可比：公共的数$m$有$3$种选法，另两个数或者都比$m$大，或者都比$m$小，共$6$个，没有两步可接，都传递；要是一个小、一个大，由传递，第三对也可比。

    三对都可比：就是全序，三个数排成一队，有$3\times2\times1=6$个。所以偏序有$1+6+6+6=19$个，全序有$6$个，答案是$(19,6)$。画成哈斯图，这几类依次是三个散点，一条线加一个散点，开口朝上或朝下的「V」，一条竖线。

- id: p5
  tier: hard
  statement: |
    设$P$是集合。

    （1）设$\preceq$是$P$上的:term[偏序]{id="math.logic-sets.partial-order"}，$a\prec b$表示$a\preceq b$且$a\ne b$。证明：没有$a\in P$使$a\prec a$，并且$\prec$是传递的。满足这两条的关系叫作严格偏序（strict partial order）。

    （2）反过来，设$\prec$是$P$上的严格偏序，规定$a\preceq b$当且仅当$a\prec b$或$a=b$。证明$\preceq$是偏序。

    （3）证明两种做法互相还原：由偏序照（1）得到严格偏序，再照（2）做，得到的就是原来的偏序；由严格偏序照（2）得到偏序，再照（1）做，得到的就是原来的严格偏序。
  hints:
    - |
      （1）要证$a\prec c$，得证$a\preceq c$，还要证$a\ne c$，后一半用反证法（proof by contradiction）。（2）反对称也用反证法；传递按有没有相等分情形。（3）两个关系相同，就是对所有$a$、$b$同真同假，把规定代进去比一比。
    - |
      （1）设$a\prec b$、$b\prec c$而$a=c$，这时$b\preceq c$就是$b\preceq a$。（2）设$a\preceq b$、$b\preceq a$而$a\ne b$，由规定得到$a\prec b$、$b\prec a$，再用传递性。（3）前一半比较「$a\prec b$或$a=b$」和$a\preceq b$；后一半比较「$a\preceq b$且$a\ne b$」和$a\prec b$。
    - |
      （1）$a\prec a$要求$a\ne a$，不可能。设$a\prec b$、$b\prec c$，由$a\preceq b$、$b\preceq c$和传递性得$a\preceq c$。若$a=c$，则$b\preceq c$就是$b\preceq a$，连同$a\preceq b$，由反对称性得$a=b$，和$a\prec b$矛盾。所以$a\ne c$，$a\prec c$，$\prec$是传递的。

      （2）自反：$a=a$，所以$a\preceq a$。反对称：设$a\preceq b$、$b\preceq a$，若$a\ne b$，由规定得$a\prec b$、$b\prec a$，由传递性得$a\prec a$，不可能；所以$a=b$。传递：设$a\preceq b$、$b\preceq c$，若$a=b$，则$a\preceq c$就是$b\preceq c$；若$b=c$，则$a\preceq c$就是$a\preceq b$；若都不相等，则$a\prec b$、$b\prec c$，由传递性$a\prec c$，所以$a\preceq c$。

      （3）从偏序$\preceq$出发，照（1）（2）做，得到的关系是「$a\prec b$或$a=b$」。它成立时，$a\prec b$按定义给出$a\preceq b$，$a=b$由自反性给出$a\preceq b$；反过来，$a\preceq b$成立时，不是$a=b$，就是$a\ne b$，后者就是$a\prec b$。所以它和$a\preceq b$同真同假，是原来的偏序。

      从严格偏序$\prec$出发，照（2）（1）做，得到的关系是「$a\preceq b$且$a\ne b$」，即「$a\prec b$或$a=b$」和$a\ne b$都成立，这时只能是$a\prec b$。反过来，$a\prec b$成立时$a\preceq b$；又没有元素满足$a\prec a$，所以$a\ne b$。它和$a\prec b$同真同假，是原来的严格偏序。
  reference: |
    （1）$a\prec a$要求$a\ne a$，不成立。设$a\prec b$、$b\prec c$：由传递$a\preceq c$；若$a=c$，则$b\preceq a$，与$a\preceq b$由反对称得$a=b$，矛盾；故$a\prec c$。关键是传递性里$a\ne c$这一半要用反对称。

    （2）自反：$a=a$。反对称：$a\ne b$而$a\preceq b$、$b\preceq a$，则$a\prec b\prec a$，传递得$a\prec a$，矛盾。传递：$a=b$、$b=c$、都不等三种情形分别得$a\preceq c$。

    （3）由$\preceq$得$\prec$再得「$a\prec b$或$a=b$」：$a\preceq b\iff(a\preceq b\land a\ne b)\lor a=b$（$a=b$时用自反），就是原来的$\preceq$。由$\prec$得$\preceq$再得「$(a\prec b\lor a=b)\land a\ne b$」：它等价于$a\prec b\land a\ne b$，而$a\prec b$推出$a\ne b$，所以就是$a\prec b$。偏序和严格偏序一个对一个，用哪一种都行。

- id: p6
  tier: hard
  statement: |
    设$P$是有限的:term[偏序集]{id="math.logic-sets.poset"}。

    （1）证明：若$a\prec b$，则在$P$的:term[哈斯图]{id="math.logic-sets.hasse-diagram"}里从$a$出发，每一步沿着线往上，能走到$b$。

    （2）由此证明：同一个有限集合上的两个偏序，如果哈斯图相同，即哪两个元素之间有线、谁在上面都相同，就是同一个偏序。
  hints:
    - |
      （1）$a$、$b$之间没有别的元素时，两者之间就有线；有的话，取一个夹在中间的$c$，先从$a$走到$c$，再从$c$走到$b$。这样一层层分下去，为什么不会没完没了？（2）$a\prec b$和「从$a$沿着线往上走得到$b$」有什么关系？
    - |
      （1）对满足$a\prec x\prec b$的$x$的个数，用[强归纳法](lesson:math.logic-sets.induction#thm-strong-induction)（strong induction）。夹在$a$、$c$之间的元素都夹在$a$、$b$之间吗，$c$自己呢？（2）先证$a\prec b$当且仅当从$a$沿着线往上走至少一步能走到$b$。
    - |
      （1）记$n(a,b)$为满足$a\prec x\prec b$的$x$的个数，$P$有限，所以它是自然数。对$n(a,b)$用强归纳法，从$0$起，证明从$a$能走到$b$。$n(a,b)=0$时，没有元素夹在$a$、$b$之间，由哈斯图的画法，两者之间有线，$b$在上面，走一步就到。

      设个数不超过$k$时都走得到，看$n(a,b)=k+1$的情形，取一个$c$使$a\prec c\prec b$。$\prec$是传递的（第 5 题（1）），所以满足$a\prec x\prec c$的$x$也都满足$a\prec x\prec b$；$c$自己满足$a\prec c\prec b$，却不满足$a\prec c\prec c$，于是$n(a,c)\le k$。同样，$n(c,b)\le k$。由归纳假设（induction hypothesis），从$a$能走到$c$，从$c$能走到$b$，接起来就从$a$走到了$b$。

      （2）每条线的下端都比上端小，$\prec$又是传递的，所以从$a$沿着线往上走至少一步能走到$b$时，$a\prec b$；反过来就是（1）。于是$a\prec b$当且仅当从$a$沿着线往上走至少一步能走到$b$。哈斯图相同的两个偏序，「走得到」是一回事，所以$a\prec b$同真同假；$a\preceq b$就是$a\prec b$或$a=b$，也同真同假，两个偏序是同一个关系。
  reference: |
    （1）对$n(a,b)=$满足$a\prec x\prec b$的$x$的个数用强归纳法。$n(a,b)=0$时$a$、$b$之间有线。$n(a,b)\ge1$时取$a\prec c\prec b$；$\{x:a\prec x\prec c\}$、$\{x:c\prec x\prec b\}$都含于$\{x:a\prec x\prec b\}$（$\prec$传递），又都不含$c$（没有$c\prec c$），所以$n(a,c),n(c,b)<n(a,b)$，由归纳假设分别走得到，接起来即可。关键是找一个每次变小的自然数。

    （2）走得到（至少一步）推出$a\prec b$：每一步下端$\prec$上端，用传递性。连同（1），$a\prec b\iff$走得到，右边只由哈斯图决定；$a\preceq b\iff a\prec b\lor a=b$。所以偏序由哈斯图决定。

- id: p7
  tier: thinking
  statement: |
    全班按总分排名次：规定$x\preceq y$当且仅当学生$x$的总分不超过学生$y$的总分。

    （1）它自反、传递吗？任意两个学生$x$、$y$，$x\preceq y$和$y\preceq x$总有一个成立吗？什么情形下它不是:term[偏序]{id="math.logic-sets.partial-order"}？

    （2）改成：$x\preceq y$当且仅当$x=y$，或者$x$的总分小于$y$的总分。这是偏序吗？什么时候是:term[全序]{id="math.logic-sets.total-order"}？两个学生不可比，说的是什么？

    （3）想要任意两个学生都可比，可以补一条什么规则？和（2）比，多定了什么？

    （4）还可以把总分相同的学生看成一个，见[等价关系与商集](lesson:math.logic-sets.equivalence-relations)，这时排的是什么？从（2）到（4）的三种办法，各是怎样让反对称成立的？
  hints:
    - |
      （1）三条性质逐条查，留意两个不同的学生可以总分相同。（2）「总分小于」是不是第 5 题里的严格偏序？（3）总分分不出先后时，再比一样人人不同的东西。（4）看看（1）里破坏反对称的是哪些学生，三种办法各把他们怎么办了。
    - |
      （1）$x\preceq y$、$y\preceq x$都成立，说的是总分相同；这时$x=y$吗？（2）没有学生的总分小于自己的总分，「小于」又能一步步接下去，用第 5 题（2）。

      （3）照例 1 (2) 的样子，先比总分，相同再比学号。（4）总分相同的两个不同的学生，在三种办法里，是互相都没有关系，只有一个方向的关系，还是成了同一个？
    - |
      （1）每个学生的总分不超过自己的总分，自反；总分之间的$\le$能一步步接下去，传递；两个总分总有一个不超过另一个，所以$x\preceq y$和$y\preceq x$总有一个成立。有两个不同的学生总分相同时，两个都成立，可$x\ne y$，不反对称，这时它不是偏序。所有学生的总分都不同时，$x\preceq y$、$y\preceq x$推出总分相同，也就是$x=y$，它是偏序，而且是全序。

      （2）没有学生的总分小于自己的总分，「总分小于」又能一步步接下去，它是严格偏序，由第 5 题（2），规定出来的是偏序。两个不同的学生可比，当且仅当总分不同，所以没有两个学生总分相同时是全序。两个学生不可比，说的是他们总分相同：并列，谁也不排在谁的前面。

      （3）例如总分相同时再比学号：$x\preceq y$当且仅当$x$的总分小于$y$的总分，或者总分相同而$x$的学号不超过$y$的学号。这和例 1 (2) 是同一种比法，学号又各不相同，所以它是全序。多定的是并列的学生之间的先后，这个先后不是从总分来的；有并列的时候，换一条规则，比如总分相同时让学号大的排在前面，得到的就是另一个全序。

      （4）「总分相同」是学生之间的等价关系（equivalence relation），每个等价类（equivalence class）是一个分数档；按总分排这些类，不同的类总分不同，任意两类都比得出，是全序，排的是分数档，不是学生。在（1）里，反对称不成立，是因为总分相同的两个不同的学生互相都有这个关系。第（2）问让他们互相都没有关系，第（3）问只留一个方向，第（4）问把他们算成同一个，反对称就都成立了。
  reference: |
    （1）自反、传递、任意两个都有关系都由实数的$\le$得到。有两个不同的学生总分相同时不反对称，不是偏序；总分都不同时是全序。

    （2）「总分小于」是严格偏序，由第 5 题（2）是偏序；总分都不同时是全序；不同的学生不可比当且仅当总分相同，即并列。

    （3）例如总分相同再比学号（先比总分、再比学号，同例 1 (2)），是全序；比（2）多定了并列者之间的先后，这个先后和总分无关，规则不同，得到的全序也不同。

    （4）「总分相同」是等价关系，等价类（分数档）按总分排是全序。要点：互相有关系的两个不同对象破坏反对称，处理办法有三种，两个方向都去掉（不可比、并列）、去掉一个方向（硬分先后）、把两者算成同一个（商集）。一般地，自反、传递的关系$R$都可以照（4）做：$a\mathrel{R}b$且$b\mathrel{R}a$是等价关系，商集上由$R$得到偏序。

- id: p8
  tier: thinking
  statement: |
    给无限的:term[偏序集]{id="math.logic-sets.poset"}，也可以照:term[哈斯图]{id="math.logic-sets.hasse-diagram"}的规定连线：$a\prec b$并且没有$c$使$a\prec c\prec b$时，在$a$、$b$之间连一条线，$b$在上面。

    （1）${(\Z,\le)}$里哪些数之间有线？$a<b$时，能从$a$沿着线往上走到$b$吗？

    （2）${(\Q,\le)}$里呢？在$\Q$上另举一个偏序，使它连出的线和$\le$连出的完全一样。

    （3）在$\N$里添一个元素$w$，自然数之间照旧按$\le$比，再规定$w$比每个自然数都大。哪些元素之间有线？从$0$走得到$w$吗？要是规定$w$和每个自然数都不可比，连出的线有什么变化？

    （4）第 6 题（1）的证明在哪里用到了「有限」？换成一个较弱的条件，使结论对${(\Z,\le)}$、${(\N^+,\mid)}$也成立；这个条件是必要的吗？
  hints:
    - |
      （1）（2）两个数之间有线，就是它们之间没有别的数。（3）看$n$和$w$之间夹着什么；从$0$出发，走有限步能走到哪些元素？（4）第 6 题（1）对哪个数归纳，它为什么是自然数？
    - |
      （1）$n$和$n+1$之间没有整数。（2）$a<b$时，$\frac{a+b}2$在哪里？哪一个偏序里，任意两个不同的数都不可比？

      （3）$n$和$w$之间夹着$n+1$。（4）归纳的是满足$a\prec x\prec b$的$x$的个数，只要它有限；要看条件必不必要，在$a$、$b$之间放无穷多个两两不可比的元素试试。
    - |
      （1）$n$和$n+1$之间没有别的整数，有线；$b\ge a+2$时，$a$、$b$之间夹着$a+1$，没有线。$a<b$时，从$a$起每步加$1$，走$b-a$步就走到$b$。

      （2）一条线也没有：$a<b$时，$\frac{a+b}2$是有理数，夹在$a$、$b$之间，所以从$a$一步也走不了，走不到$b$。相等关系$=$也是$\Q$上的偏序，任意两个不同的数都不可比，同样一条线也没有。两个偏序连出的线一样，却不是同一个偏序，光看线认不出原来的序。

      （3）$n$和$n+1$之间有线；$n$和$w$之间夹着$n+1$，所以没有线连到$w$。从$0$沿着线往上走，每一步从$n$走到$n+1$，走有限步总停在某个自然数上，走不到$w$。规定$w$和每个自然数都不可比时，连出的线一条也不变：$w$和谁都不相连，光看线分不清它是比所有自然数都大，还是和它们都不可比。

      （4）归纳用到了「满足$a\prec x\prec b$的$x$的个数」是自然数，所以只要对任意$a\prec b$，夹在中间的元素都只有有限个，第 6 题的证明就照样走得通。${(\Z,\le)}$里夹在$a$、$b$之间的有$b-a-1$个，${(\N^+,\mid)}$里夹在中间的都不超过$b$，满足这个条件；而（2）里任意$a<b$之间、（3）里$0$和$w$之间都有无穷多个元素，不满足。

      这个条件不是必要的。设$P$由$a$、$b$和无穷多个两两不可比的元素$x_0,x_1,x_2,\dots$组成，$a$比别的元素都小，$b$比别的元素都大。夹在$a$、$b$之间的元素有无穷多个，可从$a$走到$x_0$、再走到$b$，两步就到，别的可比的两个元素之间都有线。
  reference: |
    （1）$n$与$n+1$；走得到，$b-a$步。

    （2）任意两个有理数之间还有有理数，一条线也没有，从$a$走不到$b$；相等关系（或$\ge$）连出的线也是一条没有。所以无限时，哈斯图（连线）一般不能还原序。

    （3）$n$与$n+1$有线，没有线连到$w$（$n\prec n+1\prec w$）；从$0$出发每步加$1$，有限步到不了$w$。$w$与所有自然数不可比时连线完全相同，是两个不同的偏序、同一张图。

    （4）用在「$a$、$b$之间的元素个数是自然数」。换成「任意$a\prec b$之间只有有限个元素」（局部有限，locally finite）就够，${(\Z,\le)}$、${(\N^+,\mid)}$满足。不是必要的：$a$、$b$之间有无穷多个两两不可比的元素时，两步就从$a$走到$b$。充要的说法就是结论本身：每一对$a\prec b$都能走有限步连起来。
