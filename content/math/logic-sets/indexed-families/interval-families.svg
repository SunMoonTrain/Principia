<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 262" width="580" height="262" font-size="15">
  <!-- 左：开区间 (−r, r)，r = 1, 0.6, 0.35, 0.2, 0.1，横坐标 x = 145 + 95u；交是 {0}。右：闭区间 [r, 1]，r = 0.8, 0.5, 0.3, 0.15, 0.05，横坐标 x = 330 + 200u；并是 (0, 1]。两幅的数轴都在 y = 190 -->
  <!-- 标题 -->
  <g fill="currentColor" text-anchor="middle">
    <text x="145" y="24">开区间 (−<tspan font-style="italic">r</tspan>, <tspan font-style="italic">r</tspan>)</text>
    <text x="435" y="24">闭区间 [<tspan font-style="italic">r</tspan>, 1]</text>
  </g>
  <!-- 左图：0 处的竖虚线，表示 0 在每一个区间里 -->
  <line x1="145" y1="40" x2="145" y2="184" stroke-width="1.2" stroke-dasharray="3 3" style="stroke: var(--muted, #6b7280)" />
  <!-- 左图：五个开区间 -->
  <g stroke="currentColor" stroke-width="2">
    <line x1="50" y1="50" x2="240" y2="50" />
    <line x1="88" y1="72" x2="202" y2="72" />
    <line x1="111.75" y1="94" x2="178.25" y2="94" />
    <line x1="126" y1="116" x2="164" y2="116" />
    <line x1="135.5" y1="138" x2="154.5" y2="138" />
  </g>
  <g stroke="currentColor" stroke-width="1.5" style="fill: var(--bg, #ffffff)">
    <circle cx="50" cy="50" r="3.5" />
    <circle cx="240" cy="50" r="3.5" />
    <circle cx="88" cy="72" r="3.5" />
    <circle cx="202" cy="72" r="3.5" />
    <circle cx="111.75" cy="94" r="3.5" />
    <circle cx="178.25" cy="94" r="3.5" />
    <circle cx="126" cy="116" r="3.5" />
    <circle cx="164" cy="116" r="3.5" />
    <circle cx="135.5" cy="138" r="3.5" />
    <circle cx="154.5" cy="138" r="3.5" />
  </g>
  <!-- 右图：五个闭区间 -->
  <g stroke="currentColor" stroke-width="2">
    <line x1="490" y1="50" x2="530" y2="50" />
    <line x1="430" y1="72" x2="530" y2="72" />
    <line x1="390" y1="94" x2="530" y2="94" />
    <line x1="360" y1="116" x2="530" y2="116" />
    <line x1="340" y1="138" x2="530" y2="138" />
  </g>
  <g fill="currentColor">
    <circle cx="490" cy="50" r="3.5" />
    <circle cx="530" cy="50" r="3.5" />
    <circle cx="430" cy="72" r="3.5" />
    <circle cx="530" cy="72" r="3.5" />
    <circle cx="390" cy="94" r="3.5" />
    <circle cx="530" cy="94" r="3.5" />
    <circle cx="360" cy="116" r="3.5" />
    <circle cx="530" cy="116" r="3.5" />
    <circle cx="340" cy="138" r="3.5" />
    <circle cx="530" cy="138" r="3.5" />
  </g>
  <!-- 右图：并 (0, 1]，粗线，0 处空心、1 处实心 -->
  <line x1="330" y1="164" x2="530" y2="164" stroke-width="4" style="stroke: var(--accent, #2563eb)" />
  <circle cx="330" cy="164" r="4.5" stroke-width="2" style="fill: var(--bg, #ffffff); stroke: var(--accent, #2563eb)" />
  <circle cx="530" cy="164" r="4.5" style="fill: var(--accent, #2563eb)" />
  <!-- 两幅的数轴和刻度 -->
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="26" y1="190" x2="264" y2="190" />
    <line x1="50" y1="185" x2="50" y2="195" />
    <line x1="145" y1="185" x2="145" y2="195" />
    <line x1="240" y1="185" x2="240" y2="195" />
    <line x1="318" y1="190" x2="556" y2="190" />
    <line x1="330" y1="185" x2="330" y2="195" />
    <line x1="430" y1="185" x2="430" y2="195" />
    <line x1="530" y1="185" x2="530" y2="195" />
  </g>
  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="50" y="212">−1</text>
    <text x="145" y="212">0</text>
    <text x="240" y="212">1</text>
    <text x="330" y="212">0</text>
    <text x="430" y="212">0.5</text>
    <text x="530" y="212">1</text>
  </g>
  <!-- 左图：交只剩 0，数轴上 0 处的圆点 -->
  <circle cx="145" cy="190" r="4.5" style="fill: var(--accent, #2563eb)" />
  <!-- 结论 -->
  <g text-anchor="middle" style="fill: var(--accent, #2563eb)">
    <text x="145" y="246">交：{0}</text>
    <text x="435" y="246">并：(0, 1]</text>
  </g>
</svg>
