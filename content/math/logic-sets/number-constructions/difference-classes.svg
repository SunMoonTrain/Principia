<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-size="14">
  <!-- 点阵 N × N，a、b 各画 0 到 5，间距 42。左：(a, b) 在 x = 50 + 42a、y = 300 − 42b；a − b = −2、−1、0、1、2 的五条斜线，最左一列和最下一行的点用强调色、连成折线。右：x 起点换成 372；−1、2、1 三条斜线，虚线矩形的顶点是 (0,0)、(0,1)、(2,1)、(2,0)，实线平行四边形的顶点是 (0,0)、(2,3)、(5,4)、(3,1) -->
  <g fill="currentColor" text-anchor="middle">
    <text x="155" y="30">一条斜线是一个整数</text>
    <text x="477" y="30">−1 + 2 = 1，换代表元也一样</text>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="50" y="327">0</text>
    <text x="92" y="327">1</text>
    <text x="134" y="327">2</text>
    <text x="176" y="327">3</text>
    <text x="218" y="327">4</text>
    <text x="260" y="327">5</text>
    <text x="372" y="327">0</text>
    <text x="414" y="327">1</text>
    <text x="456" y="327">2</text>
    <text x="498" y="327">3</text>
    <text x="540" y="327">4</text>
    <text x="582" y="327">5</text>
  </g>
  <g fill="currentColor" text-anchor="end">
    <text x="34" y="305">0</text>
    <text x="34" y="263">1</text>
    <text x="34" y="221">2</text>
    <text x="34" y="179">3</text>
    <text x="34" y="137">4</text>
    <text x="34" y="95">5</text>
    <text x="356" y="305">0</text>
    <text x="356" y="263">1</text>
    <text x="356" y="221">2</text>
    <text x="356" y="179">3</text>
    <text x="356" y="137">4</text>
    <text x="356" y="95">5</text>
  </g>
  <g fill="currentColor" font-size="15" font-style="italic" text-anchor="middle">
    <text x="288" y="327">a</text>
    <text x="30" y="66">b</text>
    <text x="610" y="327">a</text>
    <text x="352" y="66">b</text>
  </g>
  <!-- 左：折过来的数轴 -->
  <polyline points="50,90 50,300 260,300" fill="none" stroke-width="8" opacity="0.22" stroke-linejoin="round" style="stroke: var(--accent, #2563eb)" />
  <!-- 左：五条斜线 -->
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="50" y1="216" x2="190" y2="76" />
    <line x1="50" y1="258" x2="232" y2="76" />
    <line x1="50" y1="300" x2="274" y2="76" />
    <line x1="92" y1="300" x2="274" y2="118" />
    <line x1="134" y1="300" x2="274" y2="160" />
  </g>
  <g fill="currentColor">
    <text x="195" y="74">−2</text>
    <text x="237" y="74">−1</text>
    <text x="279" y="74">0</text>
    <text x="279" y="116">1</text>
    <text x="279" y="158">2</text>
  </g>
  <!-- 左：斜线上的点 -->
  <g fill="currentColor">
    <circle cx="92" cy="258" r="4" />
    <circle cx="92" cy="216" r="4" />
    <circle cx="92" cy="174" r="4" />
    <circle cx="134" cy="258" r="4" />
    <circle cx="134" cy="216" r="4" />
    <circle cx="134" cy="174" r="4" />
    <circle cx="134" cy="132" r="4" />
    <circle cx="176" cy="258" r="4" />
    <circle cx="176" cy="216" r="4" />
    <circle cx="176" cy="174" r="4" />
    <circle cx="176" cy="132" r="4" />
    <circle cx="176" cy="90" r="4" />
    <circle cx="218" cy="216" r="4" />
    <circle cx="218" cy="174" r="4" />
    <circle cx="218" cy="132" r="4" />
    <circle cx="218" cy="90" r="4" />
    <circle cx="260" cy="174" r="4" />
    <circle cx="260" cy="132" r="4" />
    <circle cx="260" cy="90" r="4" />
  </g>
  <!-- 左：其余的点 -->
  <g fill="currentColor" opacity="0.4">
    <circle cx="92" cy="132" r="2" />
    <circle cx="92" cy="90" r="2" />
    <circle cx="134" cy="90" r="2" />
    <circle cx="218" cy="258" r="2" />
    <circle cx="260" cy="258" r="2" />
    <circle cx="260" cy="216" r="2" />
  </g>
  <!-- 左：最左一列和最下一行的点 -->
  <g style="fill: var(--accent, #2563eb)">
    <circle cx="50" cy="300" r="5.5" />
    <circle cx="50" cy="258" r="5.5" />
    <circle cx="50" cy="216" r="5.5" />
    <circle cx="50" cy="174" r="5.5" />
    <circle cx="50" cy="132" r="5.5" />
    <circle cx="50" cy="90" r="5.5" />
    <circle cx="92" cy="300" r="5.5" />
    <circle cx="134" cy="300" r="5.5" />
    <circle cx="176" cy="300" r="5.5" />
    <circle cx="218" cy="300" r="5.5" />
    <circle cx="260" cy="300" r="5.5" />
  </g>
  <!-- 右：点阵 -->
  <g fill="currentColor" opacity="0.4">
    <circle cx="372" cy="300" r="2" />
    <circle cx="372" cy="216" r="2" />
    <circle cx="372" cy="174" r="2" />
    <circle cx="372" cy="132" r="2" />
    <circle cx="372" cy="90" r="2" />
    <circle cx="414" cy="300" r="2" />
    <circle cx="414" cy="258" r="2" />
    <circle cx="414" cy="216" r="2" />
    <circle cx="414" cy="174" r="2" />
    <circle cx="414" cy="132" r="2" />
    <circle cx="414" cy="90" r="2" />
    <circle cx="456" cy="216" r="2" />
    <circle cx="456" cy="132" r="2" />
    <circle cx="456" cy="90" r="2" />
    <circle cx="498" cy="300" r="2" />
    <circle cx="498" cy="216" r="2" />
    <circle cx="498" cy="174" r="2" />
    <circle cx="498" cy="132" r="2" />
    <circle cx="498" cy="90" r="2" />
    <circle cx="540" cy="300" r="2" />
    <circle cx="540" cy="258" r="2" />
    <circle cx="540" cy="216" r="2" />
    <circle cx="540" cy="174" r="2" />
    <circle cx="540" cy="132" r="2" />
    <circle cx="540" cy="90" r="2" />
    <circle cx="582" cy="300" r="2" />
    <circle cx="582" cy="258" r="2" />
    <circle cx="582" cy="216" r="2" />
    <circle cx="582" cy="174" r="2" />
    <circle cx="582" cy="90" r="2" />
  </g>
  <!-- 右：−1、2 两条斜线和标 1 的斜线（强调色） -->
  <g stroke="currentColor" stroke-width="1.1" opacity="0.6">
    <line x1="372" y1="258" x2="554" y2="76" />
    <line x1="456" y1="300" x2="596" y2="160" />
  </g>
  <line x1="414" y1="300" x2="596" y2="118" stroke-width="2.2" style="stroke: var(--accent, #2563eb)" />
  <g fill="currentColor">
    <text x="559" y="74">−1</text>
    <text x="601" y="158">2</text>
  </g>
  <text x="601" y="116" font-weight="bold" style="fill: var(--accent, #2563eb)">1</text>
  <!-- 右：两个平行四边形 -->
  <polygon points="372,300 372,258 456,258 456,300" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" />
  <polygon points="372,300 456,174 582,132 498,258" fill="none" stroke="currentColor" stroke-width="1.6" />
  <g fill="currentColor">
    <circle cx="372" cy="258" r="5" />
    <circle cx="456" cy="300" r="5" />
    <circle cx="456" cy="174" r="5" />
    <circle cx="498" cy="258" r="5" />
  </g>
  <g style="fill: var(--accent, #2563eb)">
    <circle cx="456" cy="258" r="6.5" />
    <circle cx="582" cy="132" r="6.5" />
  </g>
</svg>
