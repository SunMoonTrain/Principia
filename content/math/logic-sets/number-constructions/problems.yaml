- id: p1
  tier: easy
  statement: |
    自然数$n$满足$[(7,12)]=[(n,9)]$，$n$是多少？
  answer:
    type: number
    value: 4
    exact: true
  hints:
    - |
      两个:term[等价类]{id="math.logic-sets.equivalence-class"}相等，当且仅当所取的:term[代表元]{id="math.logic-sets.representative"}等价。
    - |
      $[(7,12)]=[(n,9)]$就是$(7,12)\sim(n,9)$，照$\sim$的规定写成一个只有加法的等式。
    - |
      $(7,12)\sim(n,9)$就是$7+9=12+n$，即$16=12+n$，所以$n=4$。
  solution: |
    $[(7,12)]=[(n,9)]$当且仅当$(7,12)\sim(n,9)$，即$7+9=12+n$，所以$n=4$。收入$7$、支出$12$是净欠$5$，收入$4$、支出$9$也是净欠$5$：收入、支出各少了$3$，净值不变。

- id: p2
  tier: easy
  statement: |
    照整数乘法的规定，$[(2,5)]\cdot[(4,1)]=[(0,k)]$，自然数$k$是多少？
  answer:
    type: number
    value: 9
    exact: true
  hints:
    - |
      先照规定算出一个:term[有序对]{id="math.logic-sets.ordered-pair"}，再换成第一个分量是$0$的:term[代表元]{id="math.logic-sets.representative"}。
    - |
      规定是$[(a,b)]\cdot[(c,d)]=[(ac+bd,\ ad+bc)]$，这里$a=2$，$b=5$，$c=4$，$d=1$。
    - |
      $ac+bd=2\times4+5\times1=13$，$ad+bc=2\times1+5\times4=22$，积是$[(13,22)]$。$(13,22)\sim(0,k)$就是$13+k=22+0$，所以$k=9$。
  solution: |
    照规定，两个分量是$2\times4+5\times1=13$和$2\times1+5\times4=22$，积是$[(13,22)]$。$(13,22)\sim(0,k)$就是$13+k=22+0$，所以$k=9$。

    先换:term[代表元]{id="math.logic-sets.representative"}再算，结果一样：$[(2,5)]=[(0,3)]$，$[(4,1)]=[(3,0)]$，两个分量是$0\times3+3\times0=0$和$0\times0+3\times3=9$，积是$[(0,9)]$，也就是$(-3)\times3=-9$。

- id: p3
  tier: medium
  statement: |
    下面每一项都借代表元$(a,b)$、$(c,d)$规定一个映射。哪些规定是:term[良定义]{id="math.logic-sets.well-defined"}的？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\Z\to\Z$，$[(a,b)]\mapsto[(a^2+b^2,\ 2ab)]$
      - |
        $\Z\to\N$，$[(a,b)]\mapsto k$，其中$k$是使$a=b+k$或$b=a+k$的自然数
      - |
        $\Z\times\Z\to\Z$，$([(a,b)],[(c,d)])\mapsto[(ad,\ bc)]$
      - |
        $\Z\to\Z$，$[(a,b)]\mapsto[(2a+b,\ a+b)]$
      - |
        $\Z\to\{0,1\}$，$[(a,b)]\mapsto a+b$除以$2$的余数
    value: [1, 2, 5]
  hints:
    - |
      不是良定义的，找同一个整数的两个代表元，算出不同的结果。是良定义的，要对任意两个代表元证，或者认出它是由讲解里验证过的运算得来的。
    - |
      A：和$[(a,b)]\cdot[(a,b)]$比一比。B：先看这样的$k$是不是恰有一个；再设$a+b'=b+a'$，由$a=b+k$能推出$a'$和$b'$有什么关系？C、D：拿$[(0,0)]=[(1,1)]$试一试，C 里另一个整数取$[(1,0)]$。E：设$a+b'=b+a'$，$(a+b)+(a'+b')$是奇数还是偶数？
    - |
      A：照乘法的规定，$[(a,b)]\cdot[(a,b)]=[(a^2+b^2,\ ab+ba)]$，所以它就是$x\mapsto x\cdot x$；乘法是良定义的，它也是。B：由讲解，每个有序对都有这样的$k$；由消去律，每种情形里只有一个，$a=b+k$、$b=a+l$都成立时，$a=a+(l+k)$，所以$l+k=0$，$k$、$l$都是$0$。设$a+b'=b+a'$。若$a=b+k$，则$b+k+b'=b+a'$，消去$b$，$a'=b'+k$；若$b=a+k$，同样得$b'=a'+k$，换了代表元，$k$不变。

      C：$[(0,0)]=[(1,1)]$，可它们和$[(1,0)]$放在一起，算出的是$[(0,0)]$和$[(0,1)]$，不相等。D：$[(0,0)]=[(1,1)]$，算出的是$[(0,0)]$和$[(3,2)]$，不相等。E：设$a+b'=b+a'$，则$(a+b)+(a'+b')=(a+b')+(b+a')=2(a+b')$是偶数，所以$a+b$和$a'+b'$奇偶相同，余数不变。选 A、B、E。
  solution: |
    A：照乘法的规定，$[(a,b)]\cdot[(a,b)]=[(a^2+b^2,\ 2ab)]$，它就是$x\mapsto x\cdot x$；乘法是良定义的，它也是，不用另外验证。

    B：由讲解，每个有序对都有这样的$k$，由消去律，每种情形里只有一个；两种情形同时成立，$a=b+k$、$b=a+l$时，$a=a+(l+k)$，所以$l+k=0$，$k$、$l$都是$0$。再换代表元，设$a+b'=b+a'$：由$a=b+k$得$b+k+b'=b+a'$，$a'=b'+k$；由$b=a+k$同样得$b'=a'+k$。所以$k$不变，它就是这个整数的绝对值。

    C：$[(0,0)]=[(1,1)]$，和$[(1,0)]$放在一起，前者给出$[(0,0)]$，后者给出$[(0,1)]$，不相等。$(a,b)$换成$(a+1,b+1)$，$ad$、$bc$分别添了$d$、$c$，只要$c\ne d$，添得不一样多，类就变了。D：$(2a+b)+0=(a+b)+a$，所以$(2a+b,\ a+b)\sim(a,0)$，它是讲解里的「收入」换了一个样子，$[(0,0)]=[(1,1)]$就给出不同的结果。

    E：设$a+b'=b+a'$，则$(a+b)+(a'+b')=(a+b')+(b+a')=2(a+b')$是偶数，所以$a+b$和$a'+b'$奇偶相同，余数不变。$a+b$本身随代表元变，它的奇偶不变。选 A、B、E。

- id: p4
  tier: medium
  statement: |
    $A=\{1,2,3,4,5\}$上有一个:term[等价关系]{id="math.logic-sets.equivalence-relation"}，它的:term[等价类]{id="math.logic-sets.equivalence-class"}是$\{1,2,3\}$和$\{4,5\}$；$x$所在的类记作$[x]$，:term[商集]{id="math.logic-sets.quotient-set"}记作$B$。设$g:A\to A$是:term[映射]{id="math.logic-sets.map"}。

    （1）规定$F:B\to A$，$F([x])=g(x)$。使它良定义的$g$有几个？

    （2）规定$G:B\to B$，$G([x])=[g(x)]$。使它良定义的$g$有几个？

    按（前者，后者）的顺序填。
  answer:
    type: tuple
    value: [25, 455]
    exact: true
  hints:
    - |
      取同一个类里的两个元素，算出的结果要一样。（1）的结果是$A$的元素，（2）的结果是类，要求不同。
    - |
      （1）要$g(1)=g(2)=g(3)$，$g(4)=g(5)$。（2）只要$g(1)$、$g(2)$、$g(3)$在同一个类里，$g(4)$、$g(5)$在同一个类里，按落在哪个类里分开数。
    - |
      （1）$g(1)$、$g(2)$、$g(3)$共用一个值，$g(4)$、$g(5)$共用一个值，各有$5$种取法，由乘法原理（multiplication principle），有$5\times5=25$个。

      （2）$g(1)$、$g(2)$、$g(3)$都在$\{1,2,3\}$里，有$3^3=27$种，都在$\{4,5\}$里，有$2^3=8$种，共$35$种。$g(4)$、$g(5)$同样有$3^2+2^2=13$种。所以有$35\times13=455$个，填$(25,455)$。
  solution: |
    （1）换代表元，$g(x)$不能变，所以$g$在每个类上只取一个值：$\{1,2,3\}$上的值、$\{4,5\}$上的值各有$5$种取法，由乘法原理（multiplication principle），有$5\times5=25$个。

    （2）换代表元，$g(x)$可以变，只要不离开原来落进的类：$\{1,2,3\}$的三个元素都落进$\{1,2,3\}$有$3^3$种，都落进$\{4,5\}$有$2^3$种，共$35$种；$\{4,5\}$的两个元素有$3^2+2^2=13$种。共$35\times13=455$个，答案是$(25,455)$。

    $F$良定义时$G$也良定义，反过来不一定：$g$是:term[恒等映射]{id="math.logic-sets.identity-map"}（identity map）时，$G([x])=[x]$良定义，$F([x])=x$却随代表元变。

- id: p5
  tier: hard
  statement: |
    设$x$、$y$、$z$是整数。用讲解里的规定和自然数的运算律（见[自然数的加法与乘法](lesson:math.logic-sets.natural-arithmetic)，乘法的交换律、结合律在那里的第 5 题），证明：

    （1）$x+y=y+x$，$xy=yx$；

    （2）$(xy)z=x(yz)$；

    （3）$x(y+z)=xy+xz$；

    （4）$x+0=x$，$x+(-x)=0$，$x\cdot1=x$。

    （5）不再取:term[代表元]{id="math.logic-sets.representative"}，只由前四条和加法的结合律证明：满足$x+u=0$的整数$u$只有$-x$；再证$x\cdot0=0$和$(-1)x=-x$。
  hints:
    - |
      （1）到（4）都把三个整数写成$[(a,b)]$、$[(c,d)]$、$[(e,f)]$，照规定算出两边，再比较有序对。（5）要证$u=-x$，从$u=u+0$出发；要证$x\cdot0=0$，从$0+0=0$出发；要证$(-1)x=-x$，看$x+(-1)x$是多少。
    - |
      （2）两边的第一个分量展开都是$ace+bde+adf+bcf$，第二个分量呢？（4）$x+(-x)=[(a+b,\ b+a)]$，这个有序对和$(0,0)$等价吗？（5）证第一条，把$0$写成$x+(-x)$；证$x\cdot0=0$，用分配律拆开$x(0+0)$，两边再同加$-(x\cdot0)$；证$(-1)x=-x$，用分配律合并$x\cdot1+x(-1)$。
    - |
      设$x=[(a,b)]$，$y=[(c,d)]$，$z=[(e,f)]$。规定都是良定义的，取这一组代表元来算就行。

      （1）$x+y=[(a+c,\ b+d)]$，$y+x=[(c+a,\ d+b)]$；$xy=[(ac+bd,\ ad+bc)]$，$yx=[(ca+db,\ cb+da)]$。由自然数加法、乘法的交换律，两边的有序对分别相同。

      （2）$xy=[(ac+bd,\ ad+bc)]$，所以$(xy)z$的两个分量是$(ac+bd)e+(ad+bc)f$和$(ac+bd)f+(ad+bc)e$。$yz=[(ce+df,\ cf+de)]$，所以$x(yz)$的两个分量是$a(ce+df)+b(cf+de)$和$a(cf+de)+b(ce+df)$。由分配律、乘法的结合律展开，第一个分量都是$ace$、$bde$、$adf$、$bcf$的和，第二个分量都是$acf$、$bdf$、$ade$、$bce$的和。再由加法的交换律、结合律，两边的有序对相同。

      （3）$y+z=[(c+e,\ d+f)]$，所以$x(y+z)$的两个分量是$a(c+e)+b(d+f)$和$a(d+f)+b(c+e)$。$xy+xz$的两个分量是$(ac+bd)+(ae+bf)$和$(ad+bc)+(af+be)$。由分配律展开，再重排，两边的有序对相同。

      （4）$0=[(0,0)]$，$x+0=[(a+0,\ b+0)]=x$。$x+(-x)=[(a+b,\ b+a)]$，$(a+b)+0=(b+a)+0$，所以它等于$[(0,0)]$，即$0$。$1=[(1,0)]$，$x\cdot1=[(a\cdot1+b\cdot0,\ a\cdot0+b\cdot1)]$，就是$[(a,b)]$。

      （5）设$x+u=0$。由（4）和结合律，$u=u+(x+(-x))=(u+x)+(-x)$；由（1），$u+x=x+u=0$，所以$u=0+(-x)=-x$。

      再证$x\cdot0=0$。$0+0=0$，由（3），$x\cdot0=x(0+0)=x\cdot0+x\cdot0$。两边同加$-(x\cdot0)$，左边是$0$，右边由结合律是$x\cdot0$。

      最后，由（1）（4），$x+(-1)x=x\cdot1+x(-1)$；由（3），它等于$x(1+(-1))=x\cdot0=0$。满足$x+u=0$的$u$只有$-x$，所以$(-1)x=-x$。
  reference: |
    （1）到（4）：代入代表元直接算。（2）两边都是$[(ace+bde+adf+bcf,\ acf+bdf+ade+bce)]$；（3）两边都是$[(ac+ae+bd+bf,\ ad+af+bc+be)]$；（4）$[(a+b,b+a)]=[(0,0)]$，因为$(a+b)+0=(b+a)+0$。

    （5）$u=u+(x+(-x))=(u+x)+(-x)=0+(-x)=-x$。$x\cdot0=x\cdot0+x\cdot0$，同加相反数得$x\cdot0=0$；$x+(-1)x=x(1+(-1))=0$，由唯一性$(-1)x=-x$。取$x=-1$，$(-1)(-1)=-(-1)=1$：「负负得正」由运算律就能推出，不依赖怎样造整数。

    直接算也行：$(-1)x=[(0,1)]\cdot[(a,b)]=[(b,a)]$，但题目要求不取代表元。

- id: p6
  tier: hard
  statement: |
    （1）设$m$、$n$是自然数，$m\ne0$，$n\ne0$。证明$mn\ne0$。

    （2）设$x$、$y$是整数，$x\ne0$，$y\ne0$。证明$xy\ne0$。

    （3）设$x$、$y$、$z$是整数，$z\ne0$，并且$xz=yz$。证明$x=y$。
  hints:
    - |
      （1）非零的自然数都是某个数加$1$。（2）每个整数都等于某个$[(n,0)]$或$[(0,n)]$，分情形算积。（3）整数里有减法，把$xz=yz$化成「某个积等于$0$」。
    - |
      （1）设$m=j+1$，$n=l+1$，用乘法的定义拆开$m(l+1)$，看它是不是某个数加$1$。（2）$x=[(m,0)]$或$[(0,m)]$，$x\ne0$就是$m\ne0$。（3）先由乘法的规定直接看出$(-y)z=-(yz)$，再看$(x-y)z$。
    - |
      （1）由[皮亚诺公理与递归定义](lesson:math.logic-sets.peano-axioms)第 5 题（1），非零的自然数都是后继（successor），设$m=j+1$，$n=l+1$。由乘法的定义，$mn=m(l+1)=ml+m$；由加法的定义，$ml+m=ml+(j+1)=(ml+j)+1$。它是后继，由:term[皮亚诺公理]{id="math.logic-sets.peano-axioms"}（Peano axioms）(3)，$mn\ne0$。

      （2）由讲解，$x$是某个$[(m,0)]$或$[(0,m)]$，$y$是某个$[(n,0)]$或$[(0,n)]$。$x\ne0$，$y\ne0$，所以$m\ne0$，$n\ne0$，由（1），$mn\ne0$。照规定算，$[(m,0)]\cdot[(n,0)]$和$[(0,m)]\cdot[(0,n)]$都是$[(mn,0)]$，$[(m,0)]\cdot[(0,n)]$和$[(0,m)]\cdot[(n,0)]$都是$[(0,mn)]$。

      $[(mn,0)]=[(0,0)]$就是$mn+0=0+0$，$[(0,mn)]=[(0,0)]$就是$0+0=mn+0$，都要求$mn=0$。所以两种积都不等于$[(0,0)]$，即$xy\ne0$。

      （3）先证$(-y)z=-(yz)$。设$y=[(c,d)]$，$z=[(e,f)]$，则$(-y)z=[(d,c)]\cdot[(e,f)]=[(de+cf,\ df+ce)]$。$yz=[(ce+df,\ cf+de)]$，对调两个分量，$-(yz)=[(cf+de,\ ce+df)]$，由加法的交换律，两者相等。

      由分配律和交换律，$(x-y)z=xz+(-y)z=xz+(-(yz))$；$xz=yz$，所以$(x-y)z=0$。$z\ne0$，若$x-y\ne0$，由（2），$(x-y)z\ne0$，矛盾，所以$x-y=0$。于是$x=x+((-y)+y)=(x-y)+y$，就是$0+y=y$。
  reference: |
    （1）$m=j+1$，$n=l+1$，$mn=ml+m=(ml+j)+1$，是后继，公理 (3) 给出$mn\ne0$。

    （2）$x=[(m,0)]$或$[(0,m)]$，$y=[(n,0)]$或$[(0,n)]$，$m,n\ne0$；积是$[(mn,0)]$或$[(0,mn)]$，$mn\ne0$，所以不是$[(0,0)]$。

    （3）$(x+(-y))z=xz+(-(yz))=0$，由（2）$x+(-y)=0$，$x=y$。也可以由第 5 题（5）：$(-y)z=((-1)y)z=(-1)(yz)=-(yz)$。

    不经（2）也行：$z=[(n,0)]$或$[(0,n)]$，$n\ne0$，$xz=yz$化成$(a+d)n=(b+c)n$，再用自然数乘法的消去律，后者又由（1）和「任两个自然数总有$k$使一个等于另一个加$k$」推出。

- id: p7
  tier: thinking
  statement: |
    也可以不用等价类造整数：整数就是自然数，再给每个非零的自然数$n$另造一个记号$-n$。

    （1）照这种造法规定$x+y$，要分哪几种情形，各等于什么？

    （2）直接验证$(x+y)+z=x+(y+z)$，按$x$、$y$、$z$各是不是另造的记号来分，有多少种？$x=m$、$y=n$是自然数、$z=-p$的这一种，还要再分成几种？挑一种验证。

    （3）把自然数$n$和讲解里的$[(n,0)]$配起来，把$-n$和$[(0,n)]$配起来。证明配起来以后，两边的加法对得上，由此说明（2）里的验证可以全部省掉。

    （4）和等价类的造法比，这种造法省了什么，多了什么？
  hints:
    - |
      （1）一个是自然数、一个是另造的记号时，要比大小。（2）左边先看$m+n$和$p$谁大，右边先看$n$和$p$谁大。（3）记$\varphi(n)=[(n,0)]$，$\varphi(-n)=[(0,n)]$，对得上就是$\varphi(x+y)=\varphi(x)+\varphi(y)$。
    - |
      （1）$m=n+k$时$m+(-n)$应当是多少，$n=m+k$、$k\ne0$时呢？（2）看$n\ge p$；$n<p$而$m+n\ge p$；$m+n<p$。

      （3）$\varphi(m)+\varphi(-n)=[(m,n)]$，按（1）的情形换代表元。再想：两个新造的整数不同时，配的整数会不会相同？（4）两种造法里，各要验证什么、各要分什么情形？
    - |
      （1）设$m$、$n$是自然数。都是自然数时，和就是$m+n$；都是另造的记号时，$(-m)+(-n)=-(m+n)$。一个是$m$、一个是$-n$时，不论次序，$m=n+k$就令和为$k$，$n=m+k$而$k\ne0$就令和为$-k$。

      （2）三个数各有两种可能，共$2^3=8$种。$x=m$、$y=n$、$z=-p$时，左边$(m+n)+(-p)$要比$m+n$和$p$；右边先比$n$和$p$，$n<p$时还要再比一次。合起来分三种：$n\ge p$；$n<p$而$m+n\ge p$；$m+n<p$。

      验证中间一种：设$p=n+j$，$j\ne0$，$m=j+k$。左边，$m+n=(j+k)+n=p+k$，所以$(m+n)+(-p)=k$。右边，$n+(-p)=-j$，$m+(-j)=k$，两边相等。

      （3）记$\varphi(n)=[(n,0)]$，$\varphi(-n)=[(0,n)]$。照整数加法的规定，$\varphi(m)+\varphi(n)=[(m+n,0)]=\varphi(m+n)$，$\varphi(-m)+\varphi(-n)=[(0,m+n)]=\varphi(-(m+n))$。$\varphi(m)+\varphi(-n)=[(m,n)]$，$m=n+k$时它是$[(k,0)]=\varphi(k)$，$n=m+k$而$k\ne0$时它是$[(0,k)]=\varphi(-k)$，次序倒过来由交换律。所以总有$\varphi(x+y)=\varphi(x)+\varphi(y)$。

      不同的新整数配着不同的整数：$[(m,0)]=[(n,0)]$、$[(0,m)]=[(0,n)]$都给出$m=n$，$[(m,0)]=[(0,n)]$给出$m+n=0$，$n\ne0$时不可能。讲解里的加法满足结合律，所以$\varphi((x+y)+z)$和$\varphi(x+(y+z))$都等于$\varphi(x)+\varphi(y)+\varphi(z)$，于是$(x+y)+z=x+(y+z)$。八种情形一种也不用再分。

      （4）省了等价关系、等价类，每个整数只有一种写法，不用验证良定义。多了分情形：每规定一种运算、每直接验证一条运算律，都要按是不是另造的记号来分，规定加法、验证加法的结合律和乘法对加法的分配律时还要比大小。等价类的造法用一条公式管住所有情形，代价是每次借代表元规定都要验证良定义；规定运算、证第 5 题那些运算律都不用分情形，要分的只是个别地方，如第 6 题（2）用「每个整数等于某个$[(n,0)]$或$[(0,n)]$」证非零整数的积不是$0$。
  reference: |
    （1）同为自然数：$m+n$；同为记号：$-(m+n)$；一个一种：$m=n+k$时为$k$，$n=m+k$（$k\ne0$）时为$-k$。

    （2）$8$种；$(m,n,-p)$再分$n\ge p$、$n<p\le m+n$、$m+n<p$三种。六种混合的情形每种都要再分。

    （3）$\varphi$保持加法（四种情形直接算，关键是$[(m,n)]$等于$[(k,0)]$或$[(0,k)]$），又把不同的元素送到不同的整数，所以新造的加法的结合律由$\Z$的结合律得到。乘法同样。两种造法只差名字，各有各的好处：一个写法唯一，一个公式统一。

    （4）省了良定义，多了分情形。一般的道理：从每个类里挑定一个代表元，运算以后要再化回挑定的代表元，麻烦就出在这一步。

- id: p8
  tier: thinking
  statement: |
    把讲解里的加法换成取较大的数：用$\max\{a,b\}$代替$a+b$。它也满足交换律、结合律，$\max\{a,0\}=a$。照样在$\N\times\N$上规定$(a,b)\approx(c,d)$当且仅当$\max\{a,d\}=\max\{b,c\}$。

    （1）用$(0,0)$、$(5,5)$、$(3,4)$说明$\approx$不是:term[传递]{id="math.logic-sets.transitive"}的。讲解里证传递性的哪一步，在这里走不通？

    （2）把规定放宽：有自然数$k$使$\max\{a,d,k\}=\max\{b,c,k\}$，就把$(a,b)$和$(c,d)$看成一样。这是:term[等价关系]{id="math.logic-sets.equivalence-relation"}吗？有几个:term[等价类]{id="math.logic-sets.equivalence-class"}？$n\mapsto[(n,0)]$还把不同的自然数送到不同的类吗？

    （3）加法也照这样放宽：有自然数$k$使$a+d+k=b+c+k$，就把$(a,b)$和$(c,d)$看成一样。得到的关系和$\sim$一样吗？不用:term[消去律]{id="math.logic-sets.cancellation-law"}，能不能证明它是传递的？

    （4）换别的造法，能不能绕开消去律？设有一个数系，加法满足结合律，$x+0=x$，每个$x$都有相反数$-x$，使$x+(-x)=0$；再把每个自然数$n$送到它的一个数$n^*$，使取较大的数对得上加法，即总有$(\max\{m,n\})^*=m^*+n^*$。证明所有的$n^*$都是$0$。造整数时，消去律管的究竟是什么？
  hints:
    - |
      （1）逐对代进去比；讲解把两个等式加起来以后，又做了什么？（2）把$k$取得很大，两边各是多少？

      （3）有了消去律，$k$去得掉吗？把两个放宽的等式加起来，中间那一团还用不用消去？（4）取$m=n$看看。
    - |
      （1）讲解从$(a+f)+(c+d)=(b+e)+(c+d)$消去了$c+d$；取较大的数时，由$\max\{0,5\}=\max\{3,5\}$消得去$5$吗？（2）取$k$不小于$a$、$b$、$c$、$d$。

      （3）设$a+d+k=b+c+k$，$c+f+l=d+e+l$，两式相加，把$c+d+k+l$当作新的$k$。（4）$n^*+n^*=n^*$，两边同加$-n^*$。再想：把取较大的数换回加法，由$m+k=n+k$能推出什么？
    - |
      （1）$\max\{0,5\}=\max\{0,5\}$，所以$(0,0)\approx(5,5)$；$\max\{5,4\}=\max\{5,3\}$，所以$(5,5)\approx(3,4)$。可$\max\{0,4\}=4$，$\max\{0,3\}=3$，$(0,0)\approx(3,4)$不成立，$\approx$不传递。照讲解的办法，由两个等式得到$\max\{a,f,c,d\}=\max\{b,e,c,d\}$，走不通的是从两边消去$c$、$d$：取较大的数没有消去律，$\max\{0,5\}=\max\{3,5\}$，可$0\ne3$。

      （2）任给两个有序对，取$k$不小于$a$、$b$、$c$、$d$，两边都等于$k$，所以任意两个有序对都看成一样。这个关系自反、对称、传递，是等价关系，只有一个等价类。每个$[(n,0)]$都是这一个类，所有自然数都送到了一处，粘成了一个。

      （3）$a+d=b+c$时，取$k=0$就满足放宽的规定；反过来，由$a+d+k=b+c+k$和消去律，$a+d=b+c$。所以得到的关系就是$\sim$。

      传递性不用消去律也能证。设$a+d+k=b+c+k$，$c+f+l=d+e+l$，两式相加、重排，得$a+f+(c+d+k+l)=b+e+(c+d+k+l)$，把$c+d+k+l$当作新的$k$，就是$(a,b)$和$(e,f)$看成一样。这里只用了交换律、结合律，所以换成取较大的数，放宽以后也传递。

      （4）取$m=n$，$n^*=(\max\{n,n\})^*=n^*+n^*$。两边同加$-n^*$，左边是$0$，右边由结合律是$n^*+(n^*+(-n^*))=n^*+0$，即$n^*$，所以$n^*=0$。不管怎样造，取较大的数都放不进有相反数的数系，除非把自然数全粘成一个。

      换回加法，要是放进去以后对得上、不同的自然数还不同，那么由$m+k=n+k$得$m^*+k^*=n^*+k^*$，两边同加$-k^*$，$m^*=n^*$，所以$m=n$：自然数的加法非满足消去律不可，哪种造法都绕不开。所以消去律管的是不同的自然数放进去以后还不同。讲解用它来证传递性，是因为$\sim$的规定里没有带$k$；由（3），有了消去律，带不带都一样。
  reference: |
    （1）$(0,0)\approx(5,5)$，$(5,5)\approx(3,4)$，$(0,0)\not\approx(3,4)$（$4\ne3$）。走不通的是消去$c+d$那一步。

    （2）$k\ge a,b,c,d$时两边都是$k$，任意两对有关系，只有一类，$n\mapsto[(n,0)]$是常值的。

    （3）有消去律时带不带$k$一样，就是$\sim$。传递性：两式相加，取$c+d+k+l$，只用交换律、结合律。

    （4）$n^*=n^*+n^*$，同加$-n^*$得$n^*=0$。一般地，满足交换律、结合律、有零元的运算都能照（3）造出带相反数的数系（以后叫格罗滕迪克群，Grothendieck group），原来的元素不粘在一起，当且仅当消去律成立：放宽以后$[(m,0)]=[(n,0)]$就是有$k$使$m+k=n+k$；必要性不依赖造法，同加$-k^*$即可。
