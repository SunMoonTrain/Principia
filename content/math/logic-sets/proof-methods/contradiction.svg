<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-size="14">
  <!-- 两幅反证法的结构图：左图从「假设 ¬P」推出 R 和 ¬R，合起来矛盾；右图证 P ⇒ Q，假设 P 和 ¬Q，从 ¬Q 推出 ¬P，和 P 合起来矛盾，虚线框里从 ¬Q 到 ¬P 的一段就是逆否命题 ¬Q ⇒ ¬P 的证明 -->
  <!-- 标题 -->
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="150" y="22">用反证法证 <tspan font-style="italic">P</tspan></text>
    <text x="450" y="22">用反证法证 <tspan font-style="italic">P</tspan> ⇒ <tspan font-style="italic">Q</tspan></text>
  </g>
  <!-- 虚线框：从 ¬Q 走到 ¬P 的一段 -->
  <rect x="458" y="34" width="114" height="174" rx="8" fill="none" stroke-width="1.2" stroke-dasharray="5 4" style="stroke: var(--muted, #6b7280)" />
  <!-- 方框 -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="95" y="40" width="110" height="32" rx="6" />
    <rect x="110" y="104" width="80" height="32" rx="6" />
    <rect x="60" y="168" width="70" height="32" rx="6" />
    <rect x="170" y="168" width="70" height="32" rx="6" />
    <rect x="345" y="40" width="80" height="32" rx="6" />
    <rect x="470" y="40" width="90" height="32" rx="6" />
    <rect x="475" y="104" width="80" height="32" rx="6" />
    <rect x="465" y="168" width="100" height="32" rx="6" />
  </g>
  <!-- 推出矛盾的地方：强调色的框 -->
  <g fill="none" stroke-width="1.5" style="stroke: var(--accent, #2563eb)">
    <rect x="60" y="232" width="180" height="32" rx="6" />
    <rect x="350" y="232" width="200" height="32" rx="6" />
  </g>
  <!-- 箭头：线段加三角形的头 -->
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="150" y1="73" x2="150" y2="95" />
    <line x1="150" y1="137" x2="102.02" y2="163.17" />
    <line x1="150" y1="137" x2="197.98" y2="163.17" />
    <line x1="95" y1="201" x2="95" y2="223" />
    <line x1="205" y1="201" x2="205" y2="223" />
    <line x1="515" y1="73" x2="515" y2="95" />
    <line x1="515" y1="137" x2="515" y2="159" />
    <line x1="515" y1="201" x2="515" y2="223" />
    <line x1="385" y1="73" x2="385" y2="223" />
  </g>
  <g fill="currentColor">
    <polygon points="150,103 145.5,94 154.5,94" />
    <polygon points="95,167 100.75,158.74 105.06,166.64" />
    <polygon points="205,167 194.94,166.64 199.25,158.74" />
    <polygon points="95,231 90.5,222 99.5,222" />
    <polygon points="205,231 200.5,222 209.5,222" />
    <polygon points="515,103 510.5,94 519.5,94" />
    <polygon points="515,167 510.5,158 519.5,158" />
    <polygon points="515,231 510.5,222 519.5,222" />
    <polygon points="385,231 380.5,222 389.5,222" />
    <!-- 「……」：三个小圆点 -->
    <circle cx="140" cy="120" r="2" />
    <circle cx="150" cy="120" r="2" />
    <circle cx="160" cy="120" r="2" />
    <circle cx="505" cy="120" r="2" />
    <circle cx="515" cy="120" r="2" />
    <circle cx="525" cy="120" r="2" />
  </g>
  <!-- 方框里的字 -->
  <g fill="currentColor" text-anchor="middle">
    <text x="150" y="61">假设 ¬<tspan font-style="italic">P</tspan></text>
    <text x="95" y="189"><tspan font-style="italic">R</tspan></text>
    <text x="205" y="189">¬<tspan font-style="italic">R</tspan></text>
    <text x="150" y="253">矛盾：<tspan font-style="italic">R</tspan> ∧ ¬<tspan font-style="italic">R</tspan> 总为假</text>
    <text x="385" y="61">假设 <tspan font-style="italic">P</tspan></text>
    <text x="515" y="61">假设 ¬<tspan font-style="italic">Q</tspan></text>
    <text x="515" y="189">得到 ¬<tspan font-style="italic">P</tspan></text>
    <text x="450" y="253">矛盾：<tspan font-style="italic">P</tspan> ∧ ¬<tspan font-style="italic">P</tspan> 总为假</text>
  </g>
  <!-- 底下的说明：证出了什么 -->
  <g text-anchor="middle" style="fill: var(--accent, #2563eb)">
    <text x="150" y="292">所以 ¬<tspan font-style="italic">P</tspan> 为假，<tspan font-style="italic">P</tspan> 成立</text>
    <text x="450" y="292">所以 <tspan font-style="italic">P</tspan> ∧ ¬<tspan font-style="italic">Q</tspan> 为假，<tspan font-style="italic">P</tspan> ⇒ <tspan font-style="italic">Q</tspan> 成立</text>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="450" y="314">虚线框里是 ¬<tspan font-style="italic">Q</tspan> ⇒ ¬<tspan font-style="italic">P</tspan> 的证明</text>
  </g>
</svg>
