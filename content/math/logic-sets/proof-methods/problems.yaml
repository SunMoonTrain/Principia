    （1）推理里每一步本身都对：若$n>1$，则$n^2=n\cdot n>n$，$n^2$是比$n$大的正整数，和「$n$最大」矛盾，所以$n\le1$，即$n=1$。错在前提「设$n$是最大的正整数」暗含「最大的正整数存在」，这一点没有证明，而且是假的。推理只得出「如果最大的正整数存在，它就是$1$」，不能得出「$1$是最大的正整数」（$2>1$）。

    （2）它证明的是「对每个正整数$n$，若$n$是最大的正整数，则$n=1$」，也就是「若最大的正整数存在，则它等于$1$」。这是真命题，而且真得空洞：没有哪个$n$是最大的正整数，每个$n$都使条件为假，蕴含按定义为真。把它当成「最大的正整数是$1$」，就是把「若$P$则$Q$」误当成了「$P$且$Q$」。

    （3）反证：设$n$是最大的正整数，则$n+1$也是正整数，且$n+1>n$，和$n$最大矛盾，所以没有最大的正整数。教训：「设$x$是最大（最小）的……」本身就假设了这样的对象存在。不在反证中用时，必须先说明它存在，常用的理由是只有有限个：有限个（至少一个）实数里一定有最大的、最小的，讲解里证素因数时能取「最小的」大于$1$的因数，就是因为它们至少有一个、又只有有限个。在反证里把存在当假设、推出矛盾，结论是「不存在」，之后就不能再使用这个对象。
