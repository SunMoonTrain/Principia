- id: p1
  tier: easy
  statement: |
    把$\{2,3,4,5,6,10,12,15,30\}$按整除看成:term[偏序集]{id="math.logic-sets.poset"}。它有几个:term[极大元]{id="math.logic-sets.maximal-element"}，几个:term[极小元]{id="math.logic-sets.minimal-element"}？按（极大元的个数，极小元的个数）的顺序填。
  answer:
    type: tuple
    value: [2, 3]
    exact: true
  hints:
    - |
      极大元在这个集合里没有别的倍数，极小元在这个集合里没有别的因数。从小到大，逐个数看一遍。
    - |
      找极大元，去掉有别的倍数的：$2\mid4$，$3\mid6$，接着看$4$、$5$、$6$、$10$、$12$、$15$，当心$12$整不整除$30$。找极小元，再从全部九个数起，去掉有别的因数的：哪些数是$2$、$3$、$5$中某一个的倍数，又不是它自己？
    - |
      $2\mid4$，$3\mid6$，$4\mid12$，$5\mid10$，$6\mid12$，$10\mid30$，$15\mid30$，这七个数都有别的倍数。$12$不整除$30$，$12$、$30$都没有别的倍数，所以极大元是$12$、$30$，有$2$个。

      $4$、$6$、$10$、$12$、$30$是$2$的倍数，$15$是$3$的倍数，这六个数都有别的因数。$2$、$3$、$5$没有别的因数，所以极小元是$2$、$3$、$5$，有$3$个，填$(2,3)$。
  solution: |
    有别的倍数的是$2$、$3$、$4$、$5$、$6$、$10$、$15$：$2\mid4$，$3\mid6$，$4\mid12$，$5\mid10$，$6\mid12$，$10\mid30$，$15\mid30$。剩下的$12$、$30$没有，$12$不整除$30$，所以极大元有$2$个。

    $4$、$6$、$10$、$12$、$30$是$2$的倍数，$15$是$3$的倍数，都有别的因数。剩下的$2$、$3$、$5$没有，所以极小元有$3$个，答案是$(2,3)$。极大元、极小元都不止一个，由讲解里的定理，这个偏序集既没有最大元，也没有最小元。

- id: p2
  tier: easy
  statement: |
    ${(\N^+,\mid)}$里，$\{12,18,30\}$的上确界、下确界各是多少？按（上确界，下确界）的顺序填。
  answer:
    type: tuple
    value: [180, 6]
    exact: true
  hints:
    - |
      按整除，$u$是上界，就是$12$、$18$、$30$都整除$u$；$l$是下界，就是$l$整除这三个数。上界、下界各叫作三个数的什么？
    - |
      公倍数都是最小公倍数的倍数，公因数都是最大公因数的因数，所以要求的就是三个数的最小公倍数和最大公因数。分解开来：$12=2^2\cdot3$，$18=2\cdot3^2$，$30=2\cdot3\cdot5$。
    - |
      最小公倍数里，每个素数取最高的次数：$2^2\cdot3^2\cdot5=180$。最大公因数里，取三个数都有的素数，每个取最低的次数：$2\cdot3=6$。所以上确界是$180$，下确界是$6$，填$(180,6)$。
  solution: |
    按整除，上界就是公倍数，它们都是最小公倍数$2^2\cdot3^2\cdot5=180$的倍数，所以上确界是$180$；下界就是公因数，它们都是最大公因数$2\cdot3=6$的因数，所以下确界是$6$。答案是$(180,6)$，两个数都不在$\{12,18,30\}$里。

    换成${(\N^+,\le)}$，同一个集合有最大元$30$、最小元$12$，上确界、下确界就是它们。序不同，答案也不同，所以要写明是哪个序。

- id: p3
  tier: medium
  statement: |
    $\{1,2,3,4,5,6\}$的非空子集里，元素之和不超过$8$的那些，按$\subseteq$组成:term[偏序集]{id="math.logic-sets.poset"}。它有几个:term[极大元]{id="math.logic-sets.maximal-element"}？
  answer:
    type: number
    value: 7
    exact: true
  hints:
    - |
      一个这样的子集是极大元，就是再往里添任何一个数，和都超过$8$。要逐个数去试吗？先想添哪一个数最省。
    - |
      缺的数里最小的那一个添进去都超，添别的更超；和不必正好是$8$。按缺的数里最小的是$1$、$2$、$3$、$4$分类，每一类里，和至少要多大？
    - |
      设$S$是这样的子集，缺的数里最小的是$k$。若有比$S$大的这样的子集，把它比$S$多出的一个数添进$S$，和也不超过$8$；多出的数都不小于$k$，所以添$k$也不超过$8$。于是$S$是极大元，当且仅当它的元素之和加$k$超过$8$。

      缺$1$的，和是$8$：$\{2,6\}$、$\{3,5\}$。有$1$缺$2$的，和至少是$7$：$\{1,6\}$、$\{1,3,4\}$。有$1$、$2$缺$3$的，和至少是$6$：$\{1,2,4\}$、$\{1,2,5\}$。有$1$、$2$、$3$的，和已经是$6$，再添$4$就超过$8$，只有$\{1,2,3\}$，一共$2+2+2+1=7$个。
  solution: |
    极大元是再添任何一个数、和都超过$8$的子集；只要缺的数里最小的那个$k$添不进，别的就都添不进。所以按$k$分类：$k=1$时和是$8$，有$\{2,6\}$、$\{3,5\}$；$k=2$时和至少是$7$，有$\{1,6\}$、$\{1,3,4\}$；$k=3$时和至少是$6$，有$\{1,2,4\}$、$\{1,2,5\}$；$k=4$时只有$\{1,2,3\}$。

    一共$7$个。$\{1,2,3\}$的和只有$6$，$\{1,6\}$、$\{1,2,4\}$的和只有$7$，它们照样是极大元：和没有到$8$，不等于还能再添。

- id: p4
  tier: medium
  statement: |
    设$S$、$T$是:term[偏序集]{id="math.logic-sets.poset"}$P$的非空子集。不管$P$、$S$、$T$怎样取，下面哪些一定成立？
  answer:
    type: choice
    multiple: true
    options:
      - |
        若$m$是$S$的极大元，并且$S$的每个元素都与$m$可比，则$m$是$S$的最大元
      - |
        若$S$有上确界，并且$\sup S\in S$，则$\sup S$是$S$的最大元
      - |
        若$S$、$T$都有最大元，则$S\cup T$也有最大元
      - |
        若$T\subseteq S$，并且$S$、$T$都有上确界，则$\sup T\preceq\sup S$
      - |
        若$S$有最大元，$T\subseteq S$，则$T$有极大元
    value: [1, 2, 4]
  hints:
    - |
      成立的照定义证，不成立的举一个反例（counterexample）。找反例时，先在${(\N^+,\mid)}$的小集合里试，再想想有无穷多个元素的集合。
    - |
      选项 A：任取$x\in S$，$x$与$m$可比有两种可能，极大元的定义管住了哪一种？选项 B：上确界首先是上界。选项 C：让$S$、$T$各只有一个元素。

      选项 D：$\sup S$是$T$的什么？选项 E：定理说非空的有限偏序集有极大元，$T$却可以有无穷多个元素。
    - |
      选项 A 成立：任取$x\in S$，或者$x\preceq m$，或者$m\preceq x$；后者由$m$极大得$x=m$，所以总有$x\preceq m$。选项 B 成立：$\sup S$是上界，每个$x\in S$都有$x\preceq\sup S$，它又属于$S$。选项 C 不一定：按整除取$S=\{4\}$、$T=\{9\}$，各有最大元，$\{4,9\}$却没有。

      选项 D 成立：$S$的上界也是$T$的上界，所以$\sup S$是$T$的上界；$\sup T$是$T$的上界里最小的，所以$\sup T\preceq\sup S$。选项 E 不一定：在${(\R,\le)}$里取$S=[0,1]$、$T=[0,1)$，$1$是$S$的最大元，可对每个$t\in T$，$\frac{t+1}2$也属于$T$，又比$t$大，$T$没有极大元。所以选 A、B、D。
  solution: |
    选项 A 成立：$m$极大，$m\preceq x$只能是$x=m$；别的$x$既然与$m$可比，就有$x\preceq m$。讲解里「链的极大元就是最大元」只用到这一点。选项 B 成立：上确界是上界，属于$S$的上界按定义就是最大元。选项 D 成立：$S$的上界也是$T$的上界，$\sup S$是$T$的上界，$\sup T$是其中最小的。

    选项 C 不一定成立：按整除，$\{4\}$、$\{9\}$各有最大元，并起来，$4$、$9$互不整除，没有最大元。选项 E 不一定成立：$[0,1]$有最大元$1$，它的子集$[0,1)$却没有极大元，每个$t$都比$\frac{t+1}2$小。$T$只有有限个元素时，由讲解里的定理，它倒是有极大元；元素有无穷多个就不一定。选 A、B、D。

- id: p5
  tier: hard
  statement: |
    设$P$是非空的有限:term[偏序集]{id="math.logic-sets.poset"}。

    （1）证明：对每个$x\in P$，都有$P$的:term[极大元]{id="math.logic-sets.maximal-element"}$m$使$x\preceq m$。

    （2）由（1）证明：若$P$只有一个极大元，则它是$P$的:term[最大元]{id="math.logic-sets.greatest-element"}。

    （3）去掉「有限」，（2）就不一定成立：举一个偏序集，它只有一个极大元，却没有最大元。
  hints:
    - |
      （1）只看满足$x\preceq y$的那些$y$，在里面用讲解里的定理；还要说明，找到的极大元放回整个$P$里仍然极大。（2）任取$x\in P$，用（1）。（3）让一串元素越来越大、没有尽头，极大元放在别处。
    - |
      （1）令$T=\{y\in P:x\preceq y\}$，它为什么不空？设$m$是$T$的极大元，$z\in P$，$m\preceq z$，$z$在不在$T$里？（2）由（1）得到的$m$只能是哪一个？（3）在${(\Z,\le)}$外面添一个元素，让它和每个整数都不可比。
    - |
      （1）令$T=\{y\in P:x\preceq y\}$。$x\in T$，所以$T$不空；它是有限偏序集的子集，按同一个序也是有限的偏序集，由讲解里的定理，它有极大元$m$，并且$x\preceq m$。再看$m$在$P$里也极大：设$z\in P$，$m\preceq z$，由传递性$x\preceq z$，所以$z\in T$；$m$在$T$里极大，所以$z=m$。

      （2）设$m_0$是$P$的唯一的极大元。任取$x\in P$，由（1），有极大元$m$使$x\preceq m$；极大元只有$m_0$，所以$m=m_0$，$x\preceq m_0$。$x$是任取的，所以$m_0$是最大元。

      （3）在$\Z$里添一个元素$w$，整数之间照旧按$\le$比，$w$只和它自己可比。自反、反对称显然；传递也成立，因为和$w$有关系的只有$w$自己，别的都是整数之间的$\le$。每个整数$n$都比$n+1$小，不是极大元；没有比$w$大的元素，$w$是唯一的极大元。要是有最大元，由讲解里的定理，它就是唯一的极大元$w$，可$0\preceq w$不成立，所以没有最大元。
  reference: |
    （1）对$T=\{y\in P:x\preceq y\}$（含$x$，有限）用「非空有限偏序集有极大元」，得$T$的极大元$m$；$m\preceq z$时$x\preceq m\preceq z$，$z\in T$，所以$z=m$，$m$在$P$里极大。

    （2）任取$x$，由（1）$x\preceq m$，$m$极大，只能是$m_0$。所以非空有限偏序集有最大元，当且仅当只有一个极大元（另一个方向是讲解的定理）。

    （3）$\Z\cup\{w\}$，$w$与每个整数不可比：整数都不极大，$w$是唯一的极大元，但不是最大元。有限性用在（1）：$T$无限时可以没有极大元，这里从$0$往上走永远走不到极大元。举例不唯一。

- id: p6
  tier: hard
  statement: |
    设:term[偏序集]{id="math.logic-sets.poset"}$P$满足：任取两个元素$a$、$b$，集合$\{a,b\}$都有上确界。

    （1）设$S\subseteq P$有上确界，$a\in P$。证明$S\cup\{a\}$也有上确界，并且$\sup(S\cup\{a\})=\sup\{\sup S,a\}$。

    （2）用:term[数学归纳法]{id="math.logic-sets.mathematical-induction"}（mathematical induction）证明：$P$的每个非空的有限子集都有上确界。

    （3）举例说明，有无穷多个元素的子集不一定有上确界。
  hints:
    - |
      （1）要证一个元素是上确界，分两步：它是上界；它不超过每一个上界。（2）对子集的元素个数归纳，去掉一个元素，用（1）。（3）找一个任意两个元素都有上确界、整个集合却没有上界的偏序集。
    - |
      （1）记$t=\sup\{\sup S,a\}$。$S$的元素都不超过$\sup S$，和$t$比呢？设$u$是$S\cup\{a\}$的上界，为什么$\sup S\preceq u$，再为什么$t\preceq u$？

      （2）把有$n+1$个元素的子集写成$S\cup\{a\}$，$S$有$n$个元素。（3）看${(\N,\le)}$。
    - |
      （1）由条件，$\{\sup S,a\}$有上确界，记作$t$。$t$是$S\cup\{a\}$的上界：$x\in S$时$x\preceq\sup S\preceq t$，由传递性$x\preceq t$；又有$a\preceq t$。再设$u$是$S\cup\{a\}$的任意一个上界：$u$是$S$的上界，所以$\sup S\preceq u$；又有$a\preceq u$，所以$u$是$\{\sup S,a\}$的上界，$t\preceq u$。这就是说，$t$是$S\cup\{a\}$的全部上界里的最小元，即上确界。

      （2）对子集的元素个数归纳。只有一个元素$a$时，$a$是最大元，由讲解里的定理，上确界就是$a$。设有$n$个元素的子集都有上确界，任取有$n+1$个元素的子集，去掉一个元素$a$，剩下的$S$有$n$个元素，由归纳假设，它有上确界，再由（1），$S\cup\{a\}$也有上确界。由数学归纳法，每个非空的有限子集都有上确界。

      （3）${(\N,\le)}$里，$\{a,b\}$的上确界是两个数中较大的一个，$\N$的子集$\N$自己却没有上界，也就没有上确界。${(\Q,\le)}$里的$\{x\in\Q:x^2<2\}$有上界，仍然没有上确界，见[实数的完备性](lesson:math.analysis.completeness)。也有总能取到上确界的：${(\Pow(X),\subseteq)}$里，任意一些子集的上确界就是它们的并，即至少属于其中一个的元素组成的集合。数学分析用有理数的集合造实数，就是这样取上确界的，见[用戴德金分割构造实数](lesson:math.analysis.real-construction#thm-cut-supremum)。
  reference: |
    （1）$t=\sup\{\sup S,a\}$存在。$x\in S\Rightarrow x\preceq\sup S\preceq t$，$a\preceq t$，所以$t$是上界；$u$是$S\cup\{a\}$的上界$\Rightarrow\sup S\preceq u$、$a\preceq u\Rightarrow t\preceq u$。所以$t$是最小的上界。关键是「$\sup S\preceq u$当且仅当$u$是$S$的上界」。

    （2）归纳奠基$n=1$：$\sup\{a\}=a$；递推用（1）。例如$(\N^+,\mid)$里$\operatorname{lcm}(a,b,c)=\operatorname{lcm}(\operatorname{lcm}(a,b),c)$，$(\Pow(X),\subseteq)$里有限个集合的并。

    （3）$(\N,\le)$里的$\N$；$(\Q,\le)$里的$\{x\in\Q:x^2<2\}$（有上界）。也可以取$\N$的全体有限子集按$\subseteq$：两个的上确界是并，全体没有上界。

- id: p7
  tier: thinking
  statement: |
    讲解里的定义，$S$是:term[空集]{id="math.logic-sets.empty-set"}（empty set）时也读得通。设${(P,\preceq)}$是非空的:term[偏序集]{id="math.logic-sets.poset"}，把$\varnothing$看成$P$的子集。

    （1）$\varnothing$的上界是$P$的哪些元素？它有上确界，当且仅当$P$有什么？这个上确界是哪一个元素？

    （2）${(\Pow(X),\subseteq)}$、${(\N^+,\mid)}$、${(\R,\le)}$里，$\sup\varnothing$各是什么？和[实数的完备性](lesson:math.analysis.completeness#def-maximum)里说的「空集没有上确界」对得上吗？

    （3）$\inf\varnothing$呢？把${(\N^+,\mid)}$换成${(\N,\mid)}$，$\sup\varnothing$、$\inf\varnothing$又各是什么？

    （4）有人说：「$S$有上确界，也有下确界时，总有$\inf S\preceq\sup S$。」对空集，这句话什么时候成立？通常的证明在哪一步用到了$S$不空？
  hints:
    - |
      （1）逐字读定义：「每个$x\in\varnothing$都有$x\preceq u$」对哪些$u$成立？（2）（3）把（1）的结论和倒过来的结论用到每个偏序集上，看它有没有最小元、最大元。（4）先认清$\inf\varnothing$、$\sup\varnothing$各是$P$的什么元。
    - |
      （1）空集里没有元素，「每个……都……」自动为真，见[集合与子集](lesson:math.logic-sets.sets#thm-empty-subset)。（2）$\R$有最小的数吗？（3）倒过来，$\inf\varnothing$要是存在，就是$P$的最大元；按整除，每个自然数和$0$是什么关系？

      （4）$\varnothing$的上确界、下确界不都存在时，这句话的条件满足吗？$S$不空时，取一个$x\in S$，拿它同时和$\inf S$、$\sup S$比。
    - |
      （1）$\varnothing$里没有元素，对任何$u\in P$，「每个$x\in\varnothing$都有$x\preceq u$」都为真，所以$P$的每个元素都是$\varnothing$的上界。上确界是全部上界的最小元，这里就是整个$P$的最小元：$\varnothing$有上确界，当且仅当$P$有最小元，这时$\sup\varnothing=\min P$。

      （2）${(\Pow(X),\subseteq)}$的最小元是$\varnothing$，所以$\sup\varnothing=\varnothing$；${(\N^+,\mid)}$里$1$整除每个数，$\sup\varnothing=1$；$\R$没有最小的数，${(\R,\le)}$里$\varnothing$没有上确界。这和「空集没有上确界」对得上，那里说的是${(\R,\le)}$，理由也一样：每个实数都是上界，上界里没有最小的。

      （3）倒过来，$P$的每个元素都是$\varnothing$的下界，$\varnothing$有下确界，当且仅当$P$有最大元，这时$\inf\varnothing=\max P$。${(\Pow(X),\subseteq)}$里$\inf\varnothing=X$；${(\N^+,\mid)}$里每个$n$都整除$2n$而$2n\ne n$，没有最大元，${(\R,\le)}$也没有，所以都没有$\inf\varnothing$。${(\N,\mid)}$也是偏序集：$0$只整除它自己，每个自然数$n$都整除$0$（$0=n\cdot0$），添上$0$以后三条性质照样成立。$0$是最大元，$1$仍是最小元，所以$\sup\varnothing=1$，$\inf\varnothing=0$。

      （4）$P$没有最小元，或没有最大元时，$\varnothing$的上确界、下确界不都存在，条件不满足，这句话自动成立；两者都有时，$\inf\varnothing=\max P$，$\sup\varnothing=\min P$，这句话说的是最大元不超过最小元。它成立时，每个$x\in P$都有$\min P\preceq x\preceq\max P\preceq\min P$，由反对称性$x=\min P$，所以$P$只有一个元素；反过来，$P$只有一个元素时它成立。$X$不空时，$\Pow(X)$里$\inf\varnothing=X$就不包含在$\sup\varnothing=\varnothing$里。通常的证明是取一个$x\in S$，由$\inf S\preceq x\preceq\sup S$得出结论，「取一个$x\in S$」用到了$S$不空。
  reference: |
    （1）空真：每个$u\in P$都是上界，所以$\sup\varnothing$存在当且仅当$P$有最小元，且等于它。

    （2）$\varnothing$；$1$；不存在。与实数的完备性一节一致（$\R$没有最小元）。

    （3）$\inf\varnothing$存在当且仅当$P$有最大元：$X$；$(\N^+,\mid)$、$(\R,\le)$都没有。$(\N,\mid)$是偏序集（$0\mid b$只有$b=0$），$0$是最大元、$1$是最小元，所以$\sup\varnothing=1$、$\inf\varnothing=0$，相当于约定「没有数的最小公倍数是$1$、最大公因数是$0$」。$\Pow(X)$里$\inf\varnothing=X$对应集族的交在相对全集时对空族的约定（集族的并与交一节第 7 题）。

    （4）$P$没有最小元或没有最大元时条件不满足，自动成立（空真）；两者都有时是$\max P\preceq\min P$，当且仅当$P$只有一个元素。非空时夹一个$x$。要点：空集约束最少，上界最多，上确界反而最小、下确界反而最大；$T\subseteq S$时$\sup T\preceq\sup S$、$\inf S\preceq\inf T$，取$T=\varnothing$正是这样。

- id: p8
  tier: thinking
  statement: |
    上确界是全部上界中的:term[最小元]{id="math.logic-sets.least-element"}。把「最小元」换成「:term[极小元]{id="math.logic-sets.minimal-element"}」：全部上界中的极小元，姑且叫作极小上界（minimal upper bound）。设$S$是偏序集$P$的子集。

    （1）$P$是全序集时，极小上界和上确界有区别吗？

    （2）几何图像的右图里，$\{a,b\}$有几个极小上界？$P$有限、$S$有上界时，$S$一定有极小上界吗？

    （3）$S$有上确界时，极小上界是不是只有它一个？反过来，$S$只有一个极小上界，它一定是上确界吗？$P$有限时呢？

    （4）$P$无限、$S$有上界时，$S$一定有极小上界吗？看${(\Q,\le)}$里的$\{x\in\Q:x^2<2\}$（见[实数的完备性](lesson:math.analysis.completeness)）。

    （5）要是把定义改成「极小上界恰有一个时，就把它叫作上确界」，第 6 题（1）的证明在哪一步走不通？由此说说，用「最小元」来定义上确界，换来了什么？
  hints:
    - |
      每一问都把全部上界组成的集合当作一个偏序集，记作$U$：上确界是$U$的最小元，极小上界是$U$的极小元。讲解和第 5 题里关于最大元、极大元的结论，倒过来就能用在$U$上。
    - |
      （1）全序集的子集都是链。（2）$P$有限、$S$有上界时，$U$是非空的有限偏序集。（3）前一半用「有最大元时，它是唯一的极大元」倒过来；后一半看第 5 题（2）和（3），要造一个$U$，它只有一个极小元，却没有最小元。

      （4）$\Q$按$\le$是全序集，用（1）。（5）第 6 题（1）的证明里，哪几处由「$u$是上界」得出了上确界不超过$u$？拿（3）造的例子里那个唯一的极小上界来试，还推得出吗？
    - |
      记$U$为$S$的全部上界组成的集合，上确界是$U$的最小元，极小上界是$U$的极小元。

      （1）没有区别。$U$是全序集的子集，是链；由讲解里的定理倒过来，链的极小元就是最小元，最小元也总是极小元。所以两者有一个存在，另一个也存在，并且相等。

      （2）右图里$U=\{c,d\}$，$c$、$d$不可比，两个都极小，有两个极小上界。$P$有限、$S$有上界时，$U$是非空的有限偏序集，由讲解里的定理一定有极小元，所以一定有极小上界。

      （3）$S$有上确界时，$U$有最小元，由讲解里的定理倒过来，它是$U$的唯一的极小元，所以极小上界只有它一个。反过来不一定：令$P$由两个不可比的元素$a$、$b$，全体整数和另一个元素$w$组成，整数之间按$\le$比，$w$和每个整数都不可比，$a$、$b$比所有整数和$w$都小；除去$a$、$b$，就是第 5 题（3）那样的偏序集，在它下面添上$a$、$b$，三条性质照样成立。$\{a,b\}$的上界是全体整数和$w$，每个整数$n$都不极小，因为$n-1$也是上界；比$w$小的只有$a$、$b$，都不是上界，所以极小上界只有$w$，可$w\preceq0$不成立，它不是上确界。$P$有限时一定是：$U$是非空的有限偏序集，把第 5 题（2）倒过来，唯一的极小元就是最小元。

      （4）不一定。${(\Q,\le)}$是全序集，由（1），极小上界就是上确界，而这个集合在$\Q$里没有上确界：[实数的完备性](lesson:math.analysis.completeness)里证过，每个有理上界都还能再往下压。

      （5）走不通的一步，是由「$u$是上界」得出上确界不超过$u$，第 6 题（1）的证明里用了两次：$\sup S\preceq u$和$t\preceq u$。极小只保证没有比它更小的上界，别的上界可以和它不可比：（3）的例子里，$\{a,b\}$的极小上界只有$w$，$0$也是$\{a,b\}$的上界，$w\preceq0$却不成立。

      换一种证法也不行，第 6 题（1）的等式本身就会不成立。在（3）的$P$里再添一个比其余都大的元素$v$，仍是偏序集；照改过的定义，任意两个元素都有上确界，合乎第 6 题的条件：可比的两个元素，极小上界只有其中大的那个；$a$和$b$的只有$w$；$w$和一个整数的上界只有$v$。可$\{a,b,0\}$的极小上界只有$0$，于是$\sup\{a,b,0\}=0$，而$\sup\{\sup\{a,b\},0\}=\sup\{w,0\}=v$，两者不相等。

      所以用「最小元」换来的是：$\sup S\preceq u$当且仅当$u$是$S$的上界。要证上确界不超过$u$，只要验证$u$是上界，第 6 题一个一个地添元素求上确界，靠的就是它。$P$有限时，由（3），改不改都一样，差别在无限的$P$上。
  reference: |
    记$U$为$S$的上界集。上确界$=\min U$，极小上界$=U$的极小元，于是都是讲解结论的对偶。

    （1）$U$是链，极小元即最小元。（2）两个；有限时$U$非空有限，必有极小元。

    （3）有最小元则它是唯一的极小元。反过来不成立：$U=\Z\cup\{w\}$（第 5 题（3）那样的偏序集，整数没有极小的，$w$孤立）；有限时由第 5 题（2）的对偶成立。注意例子里要验证这是偏序：$a$、$b$在最下面，其余是$\Z$按$\le$和孤立的$w$。

    （4）$\Q$全序，极小上界就是上确界，不存在。（5）走不通的是「$u$是上界，所以上确界$\preceq u$」（$\sup S\preceq u$、$t\preceq u$两处）：（3）的例子里，$\{a,b\}$唯一的极小上界$w$和上界$0$不可比。再添一个最大元$v$，任意两个元素都恰有一个极小上界，可$\{a,b,0\}$的是$0$，$\{w,0\}$的是$v$，等式也不成立。换来的是「$\sup S\preceq u$当且仅当$u$是$S$的上界」；$P$有限时由（3）两种定义一致。
