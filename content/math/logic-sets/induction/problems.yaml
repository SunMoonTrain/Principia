- id: p1
  tier: easy
  statement: |
    设$P(n)$是含有变量$n$的语句，$n$取正整数。下面哪几组条件能保证$P(n)$对所有正整数$n$都成立？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $P(100)$成立，并且对每个正整数$k$，由$P(k)$能推出$P(k+1)$
      - |
        $P(1)$成立，并且对每个正整数$k$，由$P(k+1)$能推出$P(k)$
      - |
        $P(1)$成立，并且对每个正整数$k$，由$P(k)$能推出$P(2k)$和$P(2k+1)$
      - |
        $P(1)$成立，并且对每个正整数$k$，由$P(k)$能推出$P(k+2)$
      - |
        $P(1)$、$P(2)$都成立，并且对每个正整数$k$，由$P(k)$能推出$P(k+2)$
    value: [3, 5]
  hints:
    - |
      像推骨牌那样，从已知成立的那几个$n$出发，照条件一步一步往下推，能推到哪些正整数？每个正整数都推得到才够；有推不到的，就找一个满足条件、却在那里不成立的$P(n)$。
    - |
      A 从$100$出发，只能往大推。B 是由后一个推前一个，从$P(1)$出发推得出别的吗？D 从$1$出发每次加$2$，推得到偶数吗？C 由$P(1)$推出$P(2)$、$P(3)$，再由它们推出$P(4)$到$P(7)$……
    - |
      A 只推出$n\ge100$的情形：取$P(n)$为「$n\ge100$」，条件都满足，$P(1)$却不成立。B 由$P(1)$推不出别的：取$P(n)$为「$n=1$」，每个$P(k+1)$都不成立，「由$P(k+1)$推出$P(k)$」自动为真，$P(2)$却不成立。D 只推出奇数：取$P(n)$为「$n$是奇数」，$P(2)$不成立。

      C 够：设$1\le m\le k$时$P(m)$都成立，$k+1\ge2$除以$2$的商记作$j$，则$1\le j\le k$，$k+1$是$2j$或$2j+1$，由$P(j)$得$P(k+1)$；由:term[强归纳法]{id="math.logic-sets.strong-induction"}，$P(n)$对所有正整数$n$成立。E 也够：对$m$归纳，由$P(1)$得到每个$P(2m+1)$，由$P(2)$得到每个$P(2m+2)$。选 C、E。
  solution: |
    A 只推出$n\ge100$的情形，「$n\ge100$」满足条件，在$n=1$时却不成立；B 由$P(1)$推不出别的，「$n=1$」满足条件，在$n=2$时却不成立；D 只推出奇数，「$n$是奇数」满足条件，在$n=2$时却不成立。这三组都不够。

    C 够：每个$n\ge2$除以$2$的商$j$满足$1\le j<n$，$n$是$2j$或$2j+1$，由$P(j)$推出$P(n)$，用:term[强归纳法]{id="math.logic-sets.strong-induction"}就得到$P(n)$对所有正整数$n$成立。E 也够：由$P(1)$和递推，对$m$归纳得到每个奇数$2m+1$的情形；由$P(2)$同样得到每个偶数$2m+2$的情形。选 C、E。

- id: p2
  tier: easy
  statement: |
    求$\frac1{1\times2}+\frac1{2\times3}+\frac1{3\times4}+\dots+\frac1{99\times100}$。
  answer:
    type: number
    value: 99/100
  hints:
    - |
      先算前几个和：只取第一项、取前两项、取前三项，各是多少？由此猜出前$n$项的和。
    - |
      前$1$、$2$、$3$项的和依次是$\frac12$、$\frac23$、$\frac34$，猜前$n$项的和是$\frac n{n+1}$。用:term[数学归纳法]{id="math.logic-sets.mathematical-induction"}证明：设前$k$项的和是$\frac k{k+1}$，加上第$k+1$项$\frac1{(k+1)(k+2)}$，通分化简。
    - |
      $n=1$时和是$\frac1{1\times2}=\frac12$，猜的式子成立。设前$k$项的和是$\frac k{k+1}$，加上$\frac1{(k+1)(k+2)}$，通分后分子是$k(k+2)+1=(k+1)^2$，约去$k+1$得$\frac{k+1}{k+2}$，式子对$k+1$也成立。由数学归纳法，前$n$项的和是$\frac n{n+1}$，$n=99$时是$\frac{99}{100}$。
  solution: |
    前$1$、$2$、$3$项的和依次是$\frac12$、$\frac23$、$\frac34$，猜前$n$项的和是$\frac n{n+1}$，用:term[数学归纳法]{id="math.logic-sets.mathematical-induction"}证明。$n=1$时成立；设前$k$项的和是$\frac k{k+1}$，加上第$k+1$项$\frac1{(k+1)(k+2)}$，通分后分子是$k(k+2)+1=(k+1)^2$，约去$k+1$得$\frac{k+1}{k+2}$，对$k+1$也成立。所以前$99$项的和是$\frac{99}{100}$。

    也可以直接算：$\frac1{k(k+1)}=\frac1k-\frac1{k+1}$，加起来中间各项正负相消，只剩$1-\frac1{100}=\frac{99}{100}$。

- id: p3
  tier: medium
  statement: |
    求最小的正整数$N$，使所有整数$n\ge N$都满足$3^n>n^3$。
  answer:
    type: number
    value: 4
    exact: true
  hints:
    - |
      先算几个：$n=1,2,3,4,5$时，$3^n$和$n^3$各是多少？哪个$n$不满足？再想想从哪个$n$起，能用:term[数学归纳法]{id="math.logic-sets.mathematical-induction"}证明以后都满足。
    - |
      $n=3$时$27>27$不成立，所以$N\ge4$。看$N=4$够不够：奠基$n=4$，$81>64$；递推设$3^k>k^3$，则$3^{k+1}=3\cdot3^k>3k^3$，只要说明$k\ge4$时$3k^3\ge(k+1)^3$。
    - |
      $3k^3\ge(k+1)^3$就是$\bigl(1+\frac1k\bigr)^3\le3$。$k\ge4$时$\bigl(1+\frac1k\bigr)^3\le\bigl(\frac54\bigr)^3$，而$\bigl(\frac54\bigr)^3=\frac{125}{64}<3$，所以由$3^k>k^3$能推出$3^{k+1}>(k+1)^3$。奠基也成立，由数学归纳法，所有$n\ge4$都满足$3^n>n^3$；而$n=3$不满足，所以$N=4$。
  solution: |
    $n=1,2,3,4,5$时，$3^n$依次是$3,9,27,81,243$，$n^3$依次是$1,8,27,64,125$；$n=3$时$27>27$不成立，所以$N\ge4$。

    再证所有$n\ge4$都满足，用从$n_0=4$起的:term[数学归纳法]{id="math.logic-sets.mathematical-induction"}。奠基：$81>64$。递推：设$k\ge4$且$3^k>k^3$，则$3^{k+1}=3\cdot3^k>3k^3$；而$3k^3\ge(k+1)^3$就是$\bigl(1+\frac1k\bigr)^3\le3$，$k\ge4$时左边不超过$\frac{125}{64}$，成立，所以$3^{k+1}>(k+1)^3$。于是$N=4$。

    $n=1$、$2$时也满足，可它们在$3$的前面，不影响$N$：要的是从$N$起的每个$n$都满足。

- id: p4
  tier: medium
  statement: |
    有的正整数能写成若干个$3$与若干个$5$之和，例如$11=3+3+5$；$3$和$5$的个数都可以是$0$，但不能都是$0$。不能这样写的正整数里，最大的是几？
  answer:
    type: number
    value: 7
    exact: true
  hints:
    - |
      先从小到大试一试：$1$到$12$里，哪些能这样写，哪些不能？
    - |
      $1$、$2$、$4$、$7$不能写，$8=3+5$、$9=3+3+3$、$10=5+5$都能写。$n\ge11$时，$n-3$比$n$小，又不小于$8$，能不能由$n-3$的写法得到$n$的写法？
    - |
      用:term[强归纳法]{id="math.logic-sets.strong-induction"}证明每个$n\ge8$都能写，$n_0=8$。$8=3+5$；设$8\le m\le k$时$m$都能写，看$k+1$：它是$9$或$10$时，$9=3+3+3$，$10=5+5$；$k+1\ge11$时，$8\le k+1-3\le k$，在$k+1-3$的写法里再加一个$3$，就是$k+1$的写法。$7$不能写：不用$5$时，$3$的倍数里没有$7$；用一个$5$，剩下的$2$不是$3$的倍数；用两个$5$已经超过$7$。所以最大的是$7$。
  solution: |
    $1$、$2$、$4$、$7$不能写：比如$7$，不用$5$时，$3$的倍数里没有$7$；用一个$5$，剩下的$2$不是$3$的倍数；用两个$5$已经超过$7$。

    每个$n\ge8$都能写，用:term[强归纳法]{id="math.logic-sets.strong-induction"}证明，$n_0=8$。$8=3+5$；设$8\le m\le k$时都能写，看$k+1$：$9=3+3+3$，$10=5+5$；$k+1\ge11$时$8\le k+1-3\le k$，在$k+1-3$的写法里加一个$3$就行。所以不能写的正整数里，最大的是$7$。

- id: p5
  tier: hard
  statement: |
    讲解里说，良序原理和归纳原理可以互相推出。

    （1）用:term[强归纳法]{id="math.logic-sets.strong-induction"}证明良序原理：正整数组成的非空集合里一定有最小的数。

    （2）反过来，承认良序原理，证明讲解里从$n_0$起的数学归纳法：$n_0$是整数，若$P(n_0)$成立，并且对每个整数$k\ge n_0$，由$P(k)$能推出$P(k+1)$，则$P(n)$对所有整数$n\ge n_0$成立。
  hints:
    - |
      两问都用:term[反证法]{id="math.logic-sets.proof-by-contradiction"}（proof by contradiction）。（1）设正整数组成的非空集合$S$里没有最小的数，证明每个正整数都不在$S$里。（2）设有使$P(n)$不成立的整数$n\ge n_0$，在这些$n$里取最小的一个。
    - |
      （1）对$n$用强归纳法证「$n$不在$S$里」：$1$在$S$里的话，它就是最小的；设$1$到$k$都不在$S$里，$k+1$在$S$里的话，它又是什么？

      （2）不成立的$n$未必是正整数，把它们换成$n-n_0+1$，就得到正整数组成的非空集合，其中最小的数对应最小的不成立的$n$，记作$m$。$m$能是$n_0$吗？$P(m-1)$成立吗？
    - |
      （1）反证：设正整数组成的非空集合$S$里没有最小的数。记$Q(n)$为「$n$不在$S$里」，对正整数$n$用强归纳法，$n_0=1$。若$1$在$S$里，$S$里的数都是正整数、都不小于$1$，$1$就是最小的，矛盾，所以$Q(1)$成立。设$1\le m\le k$时$Q(m)$都成立，若$k+1$在$S$里，$S$里的数都不是$1$到$k$，都不小于$k+1$，$k+1$就是最小的，矛盾，所以$Q(k+1)$成立。

      于是每个正整数都不在$S$里，$S$里一个数也没有，和$S$非空矛盾。所以$S$里有最小的数。

      （2）反证：设有整数$n\ge n_0$使$P(n)$不成立。把每个这样的$n$换成$n-n_0+1$，得到正整数组成的非空集合，由良序原理，其中有最小的数，它对应的$n$就是使$P(n)$不成立的最小的整数，记作$m$。$P(n_0)$成立，所以$m\ne n_0$，$m-1\ge n_0$；$m-1$比$m$小，所以$P(m-1)$成立。取$k=m-1$，由条件，$P(m)$成立，矛盾。
  reference: |
    （1）设$S$是正整数组成的非空集合，反设$S$里没有最小的数。对正整数$n$，记$Q(n)$为「$n\notin S$」，用强归纳法（$n_0=1$）证$Q(n)$都成立。奠基：若$1\in S$，因为$S$的元素都是正整数、都$\ge1$，$1$就是$S$里最小的数，矛盾，所以$Q(1)$成立。递推：设$1\le m\le k$时$Q(m)$都成立，即$1,\dots,k$都不在$S$里；若$k+1\in S$，则$S$的元素都$\ge k+1$，$k+1$是最小的，矛盾，所以$Q(k+1)$成立。

    由强归纳法，每个正整数都不在$S$里，$S$是空的，和非空矛盾。所以$S$有最小的数。强归纳法是讲解里由归纳原理证出来的，所以这就是由归纳原理推出了良序原理。

    （2）设$P(n_0)$成立，且对每个$k\ge n_0$有$P(k)\Rightarrow P(k+1)$。反设有整数$n\ge n_0$使$P(n)$不成立。集合「$n-n_0+1$：$n\ge n_0$且$P(n)$不成立」由正整数组成、非空，由良序原理有最小的数$d$；$m=d+n_0-1$是使$P(n)$不成立的最小的整数（$n\mapsto n-n_0+1$保持大小顺序）。

    $m\ne n_0$（$P(n_0)$成立），所以$m\ge n_0+1$，$k=m-1\ge n_0$，且$k<m$，由$m$的最小性，$P(k)$成立；由条件$P(k+1)=P(m)$成立，矛盾。所以$P(n)$对所有$n\ge n_0$成立。取$n_0=0$就得到归纳原理本身。

- id: p6
  tier: hard
  statement: |
    斐波那契数列（Fibonacci sequence）由$F_0=0$、$F_1=1$、$F_{n+2}=F_{n+1}+F_n$（$n\in\N$）给出，前几项是$0,1,1,2,3,5,8,13$。

    （1）证明：对每个正整数$n$，$F_n\ge\left(\frac32\right)^{n-2}$。

    （2）证明里只验证$n=1$、不单独验证$n=2$，行不行？$n=0$时这个不等式成立吗？
  hints:
    - |
      （1）$F_{k+1}=F_k+F_{k-1}$要用前两项，所以用:term[强归纳法]{id="math.logic-sets.strong-induction"}，起点$n_0=1$；记$P(n)$为「$F_n\ge\left(\frac32\right)^{n-2}$」，递推时用归纳假设里的$P(k)$和$P(k-1)$。（2）$k=1$时，$P(k-1)$是哪一个命题？
    - |
      （1）$\left(\frac32\right)^{k-2}+\left(\frac32\right)^{k-3}=\left(\frac32\right)^{k-3}\cdot\frac52$，而$\left(\frac32\right)^{k-1}=\left(\frac32\right)^{k-3}\cdot\frac94$，比较$\frac52$和$\frac94$。这样的递推只在$k\ge2$时能用，$k=1$时要证的$P(2)$直接验证。（2）$F_0=0$，而$\left(\frac32\right)^{-2}=\frac49$。
    - |
      （1）用强归纳法，$n_0=1$。奠基：$F_1=1$，$\left(\frac32\right)^{-1}=\frac23$，$1\ge\frac23$。递推：设$1\le m\le k$时$P(m)$都成立，证$P(k+1)$。$k=1$时，$F_2=1=\left(\frac32\right)^0$，直接成立。

      $k\ge2$时，$k$和$k-1$都在$1$到$k$之间，由归纳假设，$F_{k+1}=F_k+F_{k-1}\ge\left(\frac32\right)^{k-2}+\left(\frac32\right)^{k-3}$，右边等于$\left(\frac32\right)^{k-3}\cdot\frac52$。而$\frac52>\frac94=\left(\frac32\right)^2$，所以$F_{k+1}\ge\left(\frac32\right)^{k-1}$，这正是$P(k+1)$。由强归纳法，$P(n)$对所有正整数$n$成立。

      （2）不行。递推由$P(k)$、$P(k-1)$推$P(k+1)$，$k=1$时要用的$P(0)$不在归纳假设里，它其实也不成立：$F_0=0<\frac49=\left(\frac32\right)^{-2}$。只靠$P(1)$，由$F_2=F_1+F_0$只能得到$F_2\ge\frac23$，证不出$F_2\ge1$，所以$P(2)$要单独验证。递推用到前两项时，奠基也要验证开头两项，或者像上面那样把$k=1$单独处理。
  reference: |
    （1）记$P(n)$为$F_n\ge(3/2)^{n-2}$，用强归纳法，$n_0=1$。奠基$P(1)$：$F_1=1\ge2/3$。递推：设$P(1),\dots,P(k)$都成立（$k\ge1$），证$P(k+1)$；$k=1$时，$F_2=1\ge(3/2)^0=1$，直接成立。

    $k\ge2$时$k-1\ge1$，由归纳假设$F_k\ge(3/2)^{k-2}$、$F_{k-1}\ge(3/2)^{k-3}$，相加得$F_{k+1}\ge(3/2)^{k-3}(3/2+1)=(3/2)^{k-3}\cdot5/2$。又$5/2=10/4>9/4=(3/2)^2$，所以$F_{k+1}\ge(3/2)^{k-1}$，即$P(k+1)$。由强归纳法，$P(n)$对所有正整数成立。

    （2）不行。$k=1$时递推要用$P(0)$，它不在归纳假设（$n_0=1$起）里，而且是假的：$F_0=0<4/9$；只用$P(1)$只能得$F_2=F_1+F_0\ge2/3$，推不出$F_2\ge1$。所以$P(2)$必须单独验证，等价于两个奠基$P(1)$、$P(2)$，递推从$k\ge2$起。

    教训：递推要用前$r$项时，开头$r$个情形都要单独验证；起点也不能往前挪到$n=0$，那里命题本身就不成立。

- id: p7
  tier: thinking
  statement: |
    有人说：「数学归纳法的递推一开始就假设$P(k)$成立，可$P(k)$正是要证的结论，这是拿结论证结论。」

    （1）递推证明的到底是一个什么样的命题？用量词（quantifier）写出来，和要证的「对所有整数$n\ge n_0$，$P(n)$成立」比一比。

    （2）真正拿结论证结论的论证是什么样的？举一个例子，说说它和归纳递推差在哪里。

    （3）证「由$P(k)$能推出$P(k+1)$」时，并不知道$P(k)$是真是假。$P(k)$对某个$k$不成立时，这一步证出的东西为什么照样成立？只有递推、不验证奠基时，使$P(n)$成立的整数$n\ge n_0$可能是哪些？
  hints:
    - |
      （1）递推的结论是「对每个整数$k\ge n_0$，若$P(k)$则$P(k+1)$」，量词后面是一个:term[蕴含]{id="math.logic-sets.implication"}（implication）；要证的结论里，量词后面是什么？（3）回想「若$P$则$Q$」在$P$假时的真假；有使$P(n)$成立的$n$时，看其中最小的那个。
    - |
      （1）两句写成符号是$\forall k\ge n_0,\ \bigl(P(k)\Rightarrow P(k+1)\bigr)$和$\forall n\ge n_0,\ P(n)$。证前一句时任取一个$k$，设$P(k)$，推出$P(k+1)$，这是[直接证明与逆否证明](lesson:math.logic-sets.direct-proof)里证「若……则……」的做法。（2）拿结论证结论，是论证里用到了要证的结论本身，比如证「对所有$n$都有$P(n)$」时，中途写「因为对所有$m$都有$P(m)$」。

      （3）$P(k)$不成立时，不管$P(k+1)$是真是假，$P(k)\Rightarrow P(k+1)$都为真。设有使$P(n)$成立的$n$，其中最小的一个记作$n_1$：$n\ge n_1$时$P(n)$怎样？$n_0\le n<n_1$时呢？
    - |
      （1）递推证的是$\forall k\ge n_0,\ \bigl(P(k)\Rightarrow P(k+1)\bigr)$，要证的是$\forall n\ge n_0,\ P(n)$。前者没有断言哪一个$P(k)$成立，只断言了一串「若……则……」；证它时设$P(k)$成立，是证蕴含的通常做法，证$P\Rightarrow Q$只需讨论$P$成立的情形，并没有假设要证的全称命题（universal statement）。

      （2）循环论证（circular reasoning）是在论证里用到了要证的结论本身。例如要证「对所有正整数$n$，$P(n)$」，写「任取$n$，因为对所有正整数$m$都有$P(m)$，取$m=n$就得$P(n)$」，用的正是要证的那句话。归纳递推只拿一个$k$上的$P(k)$当条件，证一个蕴含；奠基和递推合起来，再由归纳原理，才说到所有的$n$。

      （3）$P(k)$不成立时，$P(k)\Rightarrow P(k+1)$的条件为假，按定义为真，不管$P(k+1)$是真是假；对这个$k$，递推里的论证只是用不上，证出的蕴含照样成立。所以递推对每个$k$都成立，并不要求哪一个$P(k)$成立。

      只有递推时，使$P(n)$成立的$n$要么一个也没有，要么是从某个整数$n_1\ge n_0$起的全部整数。若有这样的$n$，把它们都换成$n-n_0+1$，得到正整数组成的非空集合，由良序原理，其中有最小的数，它对应的$n$记作$n_1$。$n_0\le n<n_1$时$P(n)$都不成立；以$P(n_1)$为奠基、递推照用，由数学归纳法，$n\ge n_1$时$P(n)$都成立。

      两种都可能。讲解里的「$n>n+1$」一个也没有；取$n_0=0$、$P(n)$为「$n\ge5$」时，$k\ge5$则$k+1\ge5$，$k<5$时条件不成立、自动为真，递推对每个$k$都成立，$P(0)$到$P(4)$却都不成立，「成立」从$P(5)$起往下传，把奠基换成$P(5)$，就证出了$P(n)$对所有$n\ge5$成立。奠基定下「成立」从哪里传起：验证了$P(n_0)$，$n_1$就是$n_0$，结论才管住所有$n\ge n_0$。
  reference: |
    （1）递推证明$\forall k\ge n_0,\ (P(k)\Rightarrow P(k+1))$，要证的是$\forall n\ge n_0,\ P(n)$。两者形式不同：前者是关于每个$k$的蕴含，不断言任何$P(k)$为真。证蕴含$P(k)\Rightarrow P(k+1)$时设$P(k)$成立，只讨论条件成立的情形（条件不成立时蕴含自动为真），这是直接证明蕴含的标准做法，不是假设了全称结论。

    （2）循环论证：论证的前提里（明的或暗的）含有要证的结论。例：「任取正整数$n$，因为所有正整数$m$都满足$P(m)$，所以$P(n)$。」或者证「$\sqrt2$是无理数」时写「因为$\sqrt2$不能写成分数，所以……」。区别：归纳递推的假设是单个的$P(k)$，作为蕴含的条件用一次，结论是另一个命题$P(k+1)$；要得到$\forall n\,P(n)$，还要奠基和归纳原理，任何一步都没有用到$\forall n\,P(n)$本身。

    （3）$P(k)$假时$P(k)\Rightarrow P(k+1)$为真（蕴含的定义），对这样的$k$，递推里的论证不提供信息，但也不出错。只有递推时，使$P(n)$成立的$n$要么没有，要么恰是某个$n_1\ge n_0$起的全部整数：若有，由良序原理取其中最小的$n_1$，比它小的都不成立，以$P(n_1)$为奠基归纳，$n\ge n_1$都成立。两种都可能：「$n>n+1$」一个也没有，$n_0=0$时「$n\ge5$」恰从$5$起成立。奠基$P(n_0)$把起点钉在$n_0$；递推本身只保证「传得下去」，不保证「有东西可传」，也不决定从哪里传起。

- id: p8
  tier: thinking
  statement: |
    设$P(x)$是含有变量$x$的语句，$x$取非负实数。有人想照数学归纳法证明$P(x)$对所有$x\ge0$成立：先证$P(0)$，再证对每个$x\ge0$，由$P(x)$能推出$P(x+1)$。

    （1）这两步够不够？够的话说明理由，不够的话举一个例子。

    （2）把「先证$P(0)$」换成什么，这样的两步就够了？说明理由。

    （3）为什么对自然数这两步就够，对非负实数却不够？从「从起点出发，一步一步能走到哪些数」来想。
  hints:
    - |
      （1）从$0$出发，每次加$1$，能走到哪些数？找一个对这些数都成立、对别的非负实数不成立的$P(x)$。
    - |
      （1）取$P(x)$为「$x$是整数」试试。（2）每个$x\ge0$都能写成$x=t+m$，$m$是自然数，即$x$的整数部分，$0\le t<1$，这要用数学分析里的[阿基米德性质](lesson:math.analysis.completeness#def-archimedean)（Archimedean property）：对任意实数$y$，都有正整数$n>y$。$t$固定时，对$m$归纳要什么奠基？
    - |
      （1）不够。取$P(x)$为「$x$是整数」：$P(0)$成立；$x$是整数时$x+1$也是，$x$不是整数时条件不成立、「若……则……」自动为真，所以对每个$x\ge0$，由$P(x)$能推出$P(x+1)$。可$P\bigl(\frac12\bigr)$不成立。从$0$出发每次加$1$，只走得到$0,1,2,\dots$，走不到两个整数之间的数。

      （2）把奠基换成「对每个满足$0\le t<1$的$t$，$P(t)$成立」就够了。任取$x\ge0$，由阿基米德性质，有正整数$N>x$，在$0,1,\dots,N$里不超过$x$的数中取最大的一个，记作$m$，则$m$是自然数，$m\le x<m+1$；记$t=x-m$，则$x=t+m$，$0\le t<1$。固定这个$t$，对$j\in\N$记$Q(j)$为「$P(t+j)$成立」：$Q(0)$即$P(t)$，成立；由$P(t+j)$能推出$P(t+j+1)$，即$Q(j)$能推出$Q(j+1)$；由归纳原理，$Q(j)$对所有$j\in\N$成立，取$j=m$就是$P(x)$。

      （3）归纳原理说的是：自然数从$0$起一次加$1$，每一个都能在有限步内走到，没有走不到的。非负实数不是这样，$0$和$1$之间就有无穷多个数，从$0$起每次加$1$永远走不到它们。所以数学归纳法靠的是自然数的这个性质，换到实数上，要像（2）那样先把问题化成对整数部分的归纳。这样化又要靠阿基米德性质：把满足$0\le t<1$的$t$都当起点，每个$x\ge0$都能在有限步内走到；没有这条性质，就可能有比所有整数都大的数，从哪个起点出发都走不到。
  reference: |
    （1）不够。反例$P(x)$：「$x$是整数」。$P(0)$真；对每个$x\ge0$，$x$是整数则$x+1$是整数，$x$不是整数时蕴含自动为真，所以$P(x)\Rightarrow P(x+1)$对每个$x$成立；但$P(1/2)$假。两步只能推出$P(0),P(1),P(2),\dots$，即只管到非负整数。

    （2）奠基换成「对所有$t\in[0,1)$，$P(t)$」。任取$x\ge0$，由阿基米德性质有正整数$N>x$，令$m$为$0,1,\dots,N$中不超过$x$的最大者（即$x$的整数部分，$m\in\N$），$t=x-m\in[0,1)$。对固定的$t$，令$Q(j)$为$P(t+j)$（$j\in\N$），$Q(0)$即$P(t)$，为真；$Q(j)\Rightarrow Q(j+1)$由递推（用在$t+j$上）；由归纳原理$Q(j)$对所有$j\in\N$成立，取$j=m$即得$P(x)$。没有阿基米德性质，就可能有比所有整数都大的$x$，它没有整数部分，这样改了奠基也管不到它。

    （3）归纳原理是自然数的性质：从$0$出发、每次加$1$，有限步能走到每一个自然数（皮亚诺公理正是这样刻画自然数）。非负实数里$0$和$1$之间有无穷多个数，从$0$出发每次加$1$永远到不了。同理，良序原理对非负实数不成立（如所有正实数组成的集合没有最小的数），「取最小反例」的办法也搬不过去。要在实数上用归纳，得像（2）那样借助整数部分（要用阿基米德性质），把问题化回自然数，或者改用别的工具（例如以后在数学分析里用到的实数的完备性）。
