- id: p1
  tier: easy
  statement: |
    下面哪些:term[映射]{id="math.logic-sets.map"}是:term[单射]{id="math.logic-sets.injective"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\Z\to\Z\times\Z$，$n\mapsto(n^2,n^3)$
      - |
        $\R\to\R$，$x\mapsto x+|x|$
      - |
        $\Z\times\Z\to\Z$，$(m,n)\mapsto2m+4n$
      - |
        $\{0,1,2,3,4\}\to\{0,1,2,3,4\}$，把$n$送到$3n$除以$5$的余数
      - |
        $\Pow(\{1,2,3\})\to\N$，把$S$送到$S$的元素之和（$\varnothing$的元素之和规定为$0$）
    value: [1, 4]
  hints:
    - |
      单射要求不同的元素总有不同的像。要说不是单射，找出两个不同的元素、像相同；要说是单射，设两个元素的像相同，推出它们相等，元素不多时也可以把像逐个写出来。
    - |
      A 比较两个有序对（ordered pair）的第二个分量；B 试两个负数；C 里$m$加$2$、$n$减$1$，值变不变？D 把五个像逐个写出来；E 有没有两个不同的子集，元素之和相等？
    - |
      A：设$(n^2,n^3)=(k^2,k^3)$，则$n^3=k^3$，而$x^3$严格递增，所以$n=k$，是单射。B：$-1$和$-2$的像都是$0$，不是单射。C：$(2,0)$和$(0,1)$的像都是$4$，不是单射。

      D：$0,1,2,3,4$的像依次是$0,3,1,4,2$，两两不同，是单射。E：$\{3\}$和$\{1,2\}$的像都是$3$，不是单射。所以选 A、D。
  solution: |
    A：$(n^2,n^3)=(k^2,k^3)$时，第二个分量给出$n^3=k^3$，$x^3$严格递增，所以$n=k$，是单射，尽管单看$n^2$分不清$n$和$-n$。B：$x<0$时$x+|x|=0$，负数的像都是$0$，不是单射。C：$(2,0)$和$(0,1)$的像都是$4$，不是单射。

    D：像依次是$0,3,1,4,2$，两两不同，是单射。E：$\{3\}$和$\{1,2\}$的元素之和都是$3$，不是单射。选 A、D。

- id: p2
  tier: easy
  statement: |
    从$\{1,2,3\}$到$\{1,2,3,4,5\}$的:term[单射]{id="math.logic-sets.injective"}有几个？
  answer:
    type: number
    value: 60
    exact: true
  hints:
    - |
      给出一个映射，就是给$1$、$2$、$3$各挑一个像。单射还要求这三个像怎样？
    - |
      先给$1$挑，有$5$种；挑定以后，$2$的像不能和$1$的像相同，还剩几种？再给$3$挑。
    - |
      三个像要两两不同：$1$的像有$5$种挑法，$2$的像有$4$种，$3$的像有$3$种。由乘法原理（multiplication principle），单射有$5\times4\times3=60$个。
  solution: |
    给出一个映射，就是依次给$1$、$2$、$3$各挑一个像；它是单射，当且仅当三个像两两不同。$1$的像有$5$种挑法，$2$的像不能和它相同，有$4$种，$3$的像不能和前两个相同，有$3$种。由乘法原理（multiplication principle），单射有$5\times4\times3=60$个。

- id: p3
  tier: medium
  statement: |
    设$a$是整数，$-5\le a\le5$，$f:\R\to\R$规定为：$x\le1$时$f(x)=x+a$，$x>1$时$f(x)=3x-5$。使$f$是:term[单射]{id="math.logic-sets.injective"}的$a$有几个？使$f$是:term[满射]{id="math.logic-sets.surjective"}的$a$有几个？按（前者，后者）的顺序填。
  answer:
    type: tuple
    value: [3, 9]
    exact: true
  hints:
    - |
      两段分开看：$x\le1$的那一段恰好取到哪些值，$x>1$的那一段恰好取到哪些值？
    - |
      左段恰好取遍$(-\infty,1+a]$，右段恰好取遍$(-2,+\infty)$，每一段里不同的$x$有不同的像。$f$是单射，要看这两段值有没有公共的数；$f$是满射，要看它们合起来是不是$\R$。
    - |
      左段：$x\le1$时$x+a\le1+a$，反过来每个$y\le1+a$都是$x=y-a\le1$的像，所以恰好取遍$(-\infty,1+a]$。右段：$x>1$时$3x-5>-2$，反过来每个$y>-2$都是$x=\frac{y+5}3>1$的像，所以恰好取遍$(-2,+\infty)$。两段各自严格递增，同一段里不同的$x$有不同的像。

      所以$f$是单射，当且仅当$(-\infty,1+a]$和$(-2,+\infty)$没有公共的数，即$1+a\le-2$，$a\le-3$，$a$可以是$-5,-4,-3$，有$3$个。$f$是满射，当且仅当两者合起来是$\R$，即$1+a\ge-2$，$a\ge-3$，$a$可以是$-3,-2,\dots,5$，有$9$个。填$(3,9)$。
  solution: |
    左段$x\le1$时$x+a\le1+a$，每个$y\le1+a$又都是$x=y-a\le1$的像，所以左段恰好取遍$(-\infty,1+a]$。右段$x>1$时$3x-5>-2$，每个$y>-2$又都是$x=\frac{y+5}3>1$的像，所以右段恰好取遍$(-2,+\infty)$。两段各自严格递增，同一段里不会有两个不同的$x$像相同。

    $f$是单射，当且仅当左段和右段没有公共的值，即$1+a\le-2$，$a=-5,-4,-3$，有$3$个。$f$是满射，当且仅当两段的值合起来是$\R$，即$1+a\ge-2$，$a=-3,-2,\dots,5$，有$9$个。答案是$(3,9)$；$a=-3$时两样都成立，是双射。

- id: p4
  tier: medium
  statement: |
    设$f:A\to B$，$S\subseteq A$。$f$在$S$上的限制（restriction）指$S\to B$的映射$x\mapsto f(x)$。不管$A$、$B$、$f$、$S$怎样取，下面哪些一定成立？
  answer:
    type: choice
    multiple: true
    options:
      - |
        若$f$是满射，则$f$在$S$上的限制是满射
      - |
        若$f$在$S$和$A\setminus S$上的限制都是单射，并且$S$中任一元素的像都不等于$A\setminus S$中任一元素的像，则$f$是单射
      - |
        若$f$在$S$和$A\setminus S$上的限制都不是满射，则$f$不是满射
      - |
        若$f$是单射，则$f$在$S$上的限制是单射
      - |
        若$f$在$S$上的限制是满射，则$f$是满射
    value: [2, 4, 5]
  hints:
    - |
      限制只把定义域改小，留下来的元素像不变。能成立的照定义证；不成立的，在只有两个元素的集合上找反例。
    - |
      选项 A：留下来的元素够不够用？选项 B：任取$x_1\ne x_2$，分「在同一块里」和「各在一块里」来看。选项 C：两块各自取不遍$B$，合起来会不会正好补上？
    - |
      选项 A 不一定：取$A=B=\{1,2\}$，$f$是恒等映射，$S=\{1\}$，限制取不到$2$。选项 B 成立：任取$A$中的$x_1\ne x_2$，都在$S$里或都在$A\setminus S$里时，那一块上的限制是单射，像不同；各在一块里时，由条件，像也不同。选项 C 不一定：还是上面的$A$、$B$、$f$、$S$，两块上的限制各漏掉一个数，$f$却是满射。

      选项 D 成立：$S$中不同的元素也是$A$中不同的元素，像不同。选项 E 成立：$B$的每个元素都是$S$中某个元素的像，这个元素也属于$A$。所以选 B、D、E。
  solution: |
    选项 A 不一定成立：$A=B=\{1,2\}$，$f$是恒等映射，$S=\{1\}$，$f$是满射，限制却取不到$2$。选项 B 成立：任取$x_1\ne x_2$，两者在同一块里时，用那一块上的限制是单射；各在一块里时，用「像都不相等」那个条件。选项 C 不一定成立：同一个例子里，$f$在$\{1\}$、$\{2\}$上的限制都不是满射，合起来却取遍了$\{1,2\}$。

    选项 D 成立：单射的条件对$A$中任意两个不同的元素成立，对$S$中的当然也成立。选项 E 成立：$S$的元素都属于$A$，它们的像已经取遍了$B$。选 B、D、E。定义域改小，单射还是单射，满射却可能变得不满；讲解里把陪域换大，单射也还是单射，满射却一定变得不满。

- id: p5
  tier: hard
  statement: |
    设$n$是正整数，$A$、$B$都恰有$n$个元素，$f:A\to B$。可以用抽屉原理（pigeonhole principle，小学叫「鸽巢问题」）：从有限个元素的集合到元素比它少的集合，没有单射。

    （1）证明：$f$是单射，当且仅当$f$是满射。

    （2）$A$、$B$有无穷多个元素时，（1）的两个方向都不再总成立：各举一个$\N\to\N$的映射说明。
  hints:
    - |
      （1）两个方向都用反证法（proof by contradiction）：结论不成立时，设法造出一个从$n$个元素的集合到$n-1$个元素的集合的单射。（2）把每个自然数往后挪一位，像就漏了一个；往前挪一位，$0$怎么办？
    - |
      （1）$f$是单射而不是满射时，有$b\in B$不是像，把$f$看成$A\to B\setminus\{b\}$的映射。$f$是满射而$f(x_1)=f(x_2)$、$x_1\ne x_2$时，去掉$x_1$，$A\setminus\{x_1\}$的元素的像仍取遍$B$；给每个$y\in B$在$A\setminus\{x_1\}$里挑一个像是$y$的元素，这样得到的$B\to A\setminus\{x_1\}$的映射有什么性质？（2）试$n\mapsto n+1$。
    - |
      （1）设$f$是单射，反证：假设$f$不是满射，有$b\in B$不是像。这时$f$的值都在$B\setminus\{b\}$里，把陪域换成$B\setminus\{b\}$，仍是单射。可$A$有$n$个元素，$B\setminus\{b\}$只有$n-1$个，和抽屉原理矛盾，所以$f$是满射。

      反过来，设$f$是满射，反证：假设$f$不是单射，有$x_1\ne x_2$使$f(x_1)=f(x_2)$。每个$y\in B$都是某个元素的像，这个元素要是$x_1$，就换成$x_2$，像不变；所以可以给每个$y$在$A\setminus\{x_1\}$里挑一个元素$h(y)$，使$f(h(y))=y$。$B$只有$n$个元素，一个一个挑就行。

      这样得到映射$h:B\to A\setminus\{x_1\}$。若$h(y)=h(y')$，两边用$f$送回去，得$y=y'$，所以$h$是单射；可$B$有$n$个元素，$A\setminus\{x_1\}$只有$n-1$个，和抽屉原理矛盾，所以$f$是单射。

      （2）$n\mapsto n+1$是单射，$0$却不是像，不是满射。把$0$送到$0$、把$n\ge1$送到$n-1$，每个自然数$m$都是$m+1$的像，是满射，可$0$和$1$的像都是$0$，不是单射。线性代数[线性映射的核与像](lesson:math.linear-algebra.kernel-image)第 8 题的乘$x$和求导，一个把次数升一，一个把次数降一，正像这里的两个例子；抽屉原理的证明见[等势与可数集](lesson:math.logic-sets.countable-sets)第 5 题。
  reference: |
    （1）单⇒满：否则$f$的值落在$B\setminus\{b\}$（$n-1$个元素），换陪域后仍单，与抽屉原理矛盾（$n=1$时$B\setminus\{b\}=\varnothing$，连映射都没有，同样矛盾）。满⇒单：否则$f(x_1)=f(x_2)$，$x_1\ne x_2$，$f$在$A\setminus\{x_1\}$上的限制仍满，对每个$y$挑$h(y)\in A\setminus\{x_1\}$使$f(h(y))=y$，$h$单，又与抽屉原理矛盾。有限个$y$，挑选用不着选择公理。

    （2）$n\mapsto n+1$单而不满；$0\mapsto0$、$n\mapsto n-1$（$n\ge1$）满而不单。别的例子如$n\mapsto2n$、$n\mapsto$除以$2$的商也行。有限这个条件用在抽屉原理上：$\N$和$\N\setminus\{0\}$之间有双射，无穷时少一个元素也配得上。

- id: p6
  tier: hard
  statement: |
    设$f:\R\to\R$对每个实数$x$都满足$f(f(x))=2x+1$。

    （1）证明$f$是单射。

    （2）证明$f$是满射。

    （3）求$f(-1)$，再写出一个满足条件的一次函数$f$，说明这样的$f$确实有。
  hints:
    - |
      （1）设$f(a)=f(b)$，两边再用一次$f$。（2）任取$y$，要找$x$使$f(x)=y$；条件说，每个$2t+1$都是某个数的像。（3）$f(f(f(x)))$可以用两种办法算。
    - |
      （1）$f(f(a))=f(f(b))$，代入条件。（2）先取$t$使$2t+1=y$，这时$y=f(f(t))$，它是谁的像？（3）$f(f(f(x)))$既是$f(2x+1)$，又是$2f(x)+1$；取哪个$x$，$2x+1$正好等于$x$？一次函数设成$f(x)=kx+b$。
    - |
      （1）设$f(a)=f(b)$，两边再用$f$，得$f(f(a))=f(f(b))$，即$2a+1=2b+1$，所以$a=b$。$f$是单射。

      （2）任取实数$y$，令$t=\frac{y-1}2$，则$f(f(t))=2t+1=y$。取$x=f(t)$，就有$f(x)=y$，所以$f$是满射。

      （3）把条件里的$x$换成$f(x)$，得$f(f(f(x)))=2f(x)+1$；对条件两边用$f$，得$f(f(f(x)))=f(2x+1)$。所以每个$x$都有$f(2x+1)=2f(x)+1$。取$x=-1$，$f(-1)=2f(-1)+1$，所以$f(-1)=-1$。

      设$f(x)=kx+b$，则$f(f(x))=k^2x+kb+b$，要$k^2=2$，$(k+1)b=1$。取$k=\sqrt2$，$b=\frac1{\sqrt2+1}=\sqrt2-1$，$f(x)=\sqrt2\,x+\sqrt2-1$满足条件，$f(-1)=-1$也对得上。
  reference: |
    （1）$f(a)=f(b)\Rightarrow2a+1=f(f(a))=f(f(b))=2b+1\Rightarrow a=b$。

    （2）$y=f\bigl(f(\frac{y-1}2)\bigr)$，所以$y$是$f(\frac{y-1}2)$的像。

    （3）$f(2x+1)=f(f(f(x)))=2f(x)+1$，取$x=-1$得$f(-1)=-1$。例子：$f(x)=\sqrt2\,x+\sqrt2-1$，或$k=-\sqrt2$、$b=\frac1{1-\sqrt2}=-1-\sqrt2$。关键：$f\circ f$是双射，可以把两半分别推给里层的$f$（单射）和外层的$f$（满射）。

- id: p7
  tier: thinking
  statement: |
    设$A$、$B$都不是空集，$f:A\to B$。在「$f(x)=y$」前面放一个管$x$、一个管$y$的量词（quantifier），一个用$\forall$，一个用$\exists$，有四种放法：

    甲：$\forall x\in A,\ \exists y\in B,\quad f(x)=y$；乙：$\exists y\in B,\ \forall x\in A,\quad f(x)=y$；

    丙：$\forall y\in B,\ \exists x\in A,\quad f(x)=y$；丁：$\exists x\in A,\ \forall y\in B,\quad f(x)=y$。

    （1）四句话各说了$f$的什么？哪一句对每个映射都成立？

    （2）有人把「$f$是满射」写成丁。丁什么时候成立？它和满射差在哪里？

    （3）举两个$\{1,2,3\}\to\{1,2,3,4\}$的映射，一个是单射，一个不是，四句话对它们的真假却完全一样。满射用一个$x$、一个$y$就说得出来，单射为什么不行？把单射写成量词式，要用几个$x$？
  hints:
    - |
      （1）按[多重量词](lesson:math.logic-sets.nested-quantifiers)里的读法，写在后面的可以随写在前面的变。（2）$f(x)$只是$B$的一个元素，一个$x$能不能照顾到所有的$y$？（3）先想哪些映射使甲真，乙、丙、丁都假。
    - |
      （1）甲：每个$x$都有像；乙：所有的$x$共用一个像。（2）丁要有一个$x$，$B$的每个元素都等于$f(x)$。（3）$B$有四个元素而$A$只有三个，丙、丁自动为假；再让$f$的像至少有两个。「至多有一个」照[恰有一个](lesson:math.logic-sets.nested-quantifiers#def-exactly-one)的定义怎样写？
    - |
      （1）甲说每个$x$都有像，映射的定义保证它，对每个映射都成立。乙说有一个$y$，所有的$x$都被送到它，即$f$是:term[常值映射]{id="math.logic-sets.constant-map"}。丙说每个$y$都是某个$x$的像，即$f$是满射。丁说有一个$x$，它的像等于$B$的每一个元素。

      （2）$f(x)$只是一个元素，$B$的每个元素都等于它，$B$就只有一个元素；反过来，$B$恰有一个元素时，任取$x\in A$都行。所以丁成立，当且仅当$B$恰有一个元素。满射（丙）里$x$可以随$y$变，丁里一个$x$要管所有的$y$；由[多重量词](lesson:math.logic-sets.nested-quantifiers#thm-quantifier-order)里的定理，丁推出丙，反过来不行，例如$\{1,2\}$上的恒等映射是满射，丁却不成立。

      （3）取$f_1$：$1\mapsto1$，$2\mapsto2$，$3\mapsto3$；$f_2$：$1\mapsto1$，$2\mapsto1$，$3\mapsto2$。$f_1$是单射，$f_2$不是。对两者都是甲真；像不止一个，乙假；$4$不是像，丙假；$B$不止一个元素，丁假。

      所以只看这四句话，分不出是不是单射。满射说的是「至少有一个解」，造出一个$x$就够了；单射说的是「至多有一个解」，照定义是任取两个解，它们一定相等，要两个$x$一起出场：$\forall x_1\in A,\ \forall x_2\in A,\quad f(x_1)=f(x_2)\Rightarrow x_1=x_2$。四句话对$x$只会说「有一个」「每一个」，说不出「有两个不同的」。
  reference: |
    （1）甲：恒真（映射的定义）；乙：常值映射；丙：满射；丁：$B$恰有一个元素。

    （2）丁要求一个$x$的像等于$B$的所有元素，所以$B$只有一个元素；丙里$x$随$y$变。丁$\Rightarrow$丙，反之不然。

    （3）例如$f_1(k)=k$，$f_2:1,2\mapsto1$，$3\mapsto2$，两者都是甲真、乙丙丁假。四句话只涉及一个$x$和一个$y$的配对，看不出两个$x$是否共用一个像；单射是关于两个$x$的话，$\forall x_1\,\forall x_2\,(f(x_1)=f(x_2)\Rightarrow x_1=x_2)$，「至多一个」正是这样两个变量的话。举例不唯一，只要一单一不单、都不是常值映射（到四个元素的集合自动不满）。

- id: p8
  tier: thinking
  statement: |
    线性代数里，线性映射$T$是单射，当且仅当$T(\vb v)=\vb0$只有$\vb v=\vb0$一个解（见[线性映射的核与像](lesson:math.linear-algebra.kernel-image#thm-injective-kernel)），只查一个值就够了。

    （1）举一个$\R\to\R$的映射$f$，$f(x)=0$恰有一个解，$f$却不是单射。

    （2）设$f:\R\to\R$对所有实数$x$、$y$都满足$f(x+y)=f(x)+f(y)$。证明：只要有一个数$y_0$（不必是$0$），使方程$f(x)=y_0$恰有一个解，$f$就是单射。

    （3）设$f:\Z\to\Z$对所有整数$m$、$n$都满足$f(m+n)=f(m)+f(n)$。证明：只要$1$是某个整数的像，$f$就是满射。

    （4）在（2）和（3）里，凭什么只查一个值就够了？在（1）里为什么不行？
  hints:
    - |
      （1）讲解里就有。（2）先求$f(0)$，再看$f(-x)$和$f(x)$的关系；设$f(a)=f(b)$，怎样由$f(x)=y_0$的那个解造出另一个解？（3）把像是$1$的那个整数加上许多次。
    - |
      （2）$f(0)=f(0+0)$；$0=f(0)=f(x+(-x))$。设$f(x_0)=y_0$，$f(a)=f(b)$，算$f(x_0+a-b)$。

      （3）设$f(k)=1$，$f(k+k)$、$f(k+k+k)$各是多少？负整数怎样得到？（4）像（1）里那样的映射，知道了$f(0)$，能推出$f(1)$吗？
    - |
      （1）讲解里的$f(x)=x^2$就是：$x^2=0$只有$x=0$一个解，可$1$和$-1$的像都是$1$；$f(x)=|x|$也行。

      （2）取$x=y=0$，$f(0)=2f(0)$，所以$f(0)=0$；于是$0=f(x+(-x))=f(x)+f(-x)$，$f(-x)=-f(x)$。设$f(x_0)=y_0$，并且$f(a)=f(b)$，则$f(x_0+a-b)=f(x_0)+f(a)-f(b)=y_0$。$f(x)=y_0$只有一个解，所以$x_0+a-b=x_0$，即$a=b$，$f$是单射。

      （3）设$f(k)=1$。$n$是正整数时，$nk$是$n$个$k$相加，所以$f(nk)=n$；严格地写，用数学归纳法（mathematical induction，见[数学归纳法](lesson:math.logic-sets.induction#def-induction)），递推一步是$f((n+1)k)=f(nk)+f(k)=n+1$。和（2）一样，$f(0)=0$，$f(-nk)=-f(nk)=-n$。每个整数都是像，$f$是满射。

      （4）保持加法，就把各点的值联系在一起。$f(x)=y$有一个解$x_0$时，它的全部解就是$x_0$加上$f(t)=0$的各个解$t$，所以看一个有解的方程，就知道了每个有解的方程解的个数；知道了$f(k)$，也就知道了$k$的所有倍数的像。一般的映射没有这种联系，各点的值可以互不相干，查一个值说明不了别的值，（1）就是例子。以后[群同态与同构](lesson:math.abstract-algebra.homomorphisms)一节还会这样判断单射。
  reference: |
    （1）$x\mapsto|x|$、$x\mapsto x^2$都行。

    （2）$f(0)=0$，$f(-x)=-f(x)$；$f(a)=f(b)$时$x_0+a-b$也是$f(x)=y_0$的解，由唯一得$a=b$。取$y_0=0$就是核只有$0$的判别法。

    （3）$f(k)=1\Rightarrow f(nk)=n$（归纳），$f(0)=0$，$f(-nk)=-n$。

    （4）加性使$f(x)=y_0$的解集是$x_0+\{t:f(t)=0\}$，各个有解的方程解的个数一样多；单射性只看$\{t:f(t)=0\}$。像集对加减法封闭，含$1$就是整个$\Z$。一般映射没有结构可用。以后抽象代数讲同态（homomorphism）的核与像，就是这个道理。
