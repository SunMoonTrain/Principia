<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" font-size="14">
  <!-- 数轴：涂色的是使 P(x)：x² < 2x + 3 成立的 x，即 −1 < x < 3（两端空心）；下面三条线段是三个取值范围 A，右边两列是全称、存在量词命题的真假 -->
  <!-- 涂色带（先画，别的压在上面）：−1 < x < 3 -->
  <rect x="168" y="70" width="152" height="158" style="fill: var(--accent, #2563eb); opacity: 0.12" />
  <!-- 数轴和刻度：x 每差 1 隔 38 -->
  <g stroke="currentColor" fill="none">
    <line x1="115" y1="70" x2="452" y2="70" stroke-width="1.5" />
    <line x1="130" y1="65" x2="130" y2="75" />
    <line x1="168" y1="65" x2="168" y2="75" />
    <line x1="206" y1="65" x2="206" y2="75" />
    <line x1="244" y1="65" x2="244" y2="75" />
    <line x1="282" y1="65" x2="282" y2="75" />
    <line x1="320" y1="65" x2="320" y2="75" />
    <line x1="358" y1="65" x2="358" y2="75" />
    <line x1="396" y1="65" x2="396" y2="75" />
    <line x1="434" y1="65" x2="434" y2="75" />
  </g>
  <polygon points="460,70 450,65.5 450,74.5" fill="currentColor" />
  <!-- 使 P(x) 成立的部分：粗线，两端空心圆 -->
  <line x1="168" y1="70" x2="320" y2="70" stroke-width="5" style="stroke: var(--accent, #2563eb)" />
  <circle cx="168" cy="70" r="5" stroke-width="2" style="fill: var(--bg, #fff); stroke: var(--accent, #2563eb)" />
  <circle cx="320" cy="70" r="5" stroke-width="2" style="fill: var(--bg, #fff); stroke: var(--accent, #2563eb)" />
  <!-- 刻度数字（写在数轴上方，免得压到涂色带的边） -->
  <g fill="currentColor" text-anchor="middle">
    <text x="130" y="55">−2</text>
    <text x="168" y="55">−1</text>
    <text x="206" y="55">0</text>
    <text x="244" y="55">1</text>
    <text x="282" y="55">2</text>
    <text x="320" y="55">3</text>
    <text x="358" y="55">4</text>
    <text x="396" y="55">5</text>
    <text x="434" y="55">6</text>
  </g>
  <text x="467" y="75" fill="currentColor" font-style="italic">x</text>
  <!-- 标题 -->
  <text x="115" y="24" fill="currentColor"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">x</tspan>)：<tspan font-style="italic">x</tspan>² &lt; 2<tspan font-style="italic">x</tspan> + 3，涂色部分是使它成立的 <tspan font-style="italic">x</tspan></text>
  <!-- 三个取值范围：线段加两端的实心圆点 -->
  <g stroke="currentColor" stroke-width="3">
    <line x1="206" y1="136" x2="282" y2="136" />
    <line x1="282" y1="176" x2="358" y2="176" />
    <line x1="320" y1="216" x2="396" y2="216" />
  </g>
  <g fill="currentColor">
    <circle cx="206" cy="136" r="4.5" />
    <circle cx="282" cy="136" r="4.5" />
    <circle cx="282" cy="176" r="4.5" />
    <circle cx="358" cy="176" r="4.5" />
    <circle cx="320" cy="216" r="4.5" />
    <circle cx="396" cy="216" r="4.5" />
  </g>
  <g fill="currentColor" text-anchor="end">
    <text x="150" y="141"><tspan font-style="italic">A</tspan> = [0, 2]</text>
    <text x="150" y="181"><tspan font-style="italic">A</tspan> = [2, 4]</text>
    <text x="150" y="221"><tspan font-style="italic">A</tspan> = [3, 5]</text>
  </g>
  <!-- 右边两列：全称量词命题、存在量词命题的真假 -->
  <g fill="currentColor" text-anchor="middle">
    <text x="530" y="104">∀<tspan font-style="italic">x</tspan> ∈ <tspan font-style="italic">A</tspan>, <tspan font-style="italic">P</tspan>(<tspan font-style="italic">x</tspan>)</text>
    <text x="625" y="104">∃<tspan font-style="italic">x</tspan> ∈ <tspan font-style="italic">A</tspan>, <tspan font-style="italic">P</tspan>(<tspan font-style="italic">x</tspan>)</text>
    <text x="530" y="141">真</text>
    <text x="625" y="141">真</text>
    <text x="530" y="181">假</text>
    <text x="625" y="181">真</text>
    <text x="530" y="221">假</text>
    <text x="625" y="221">假</text>
  </g>
</svg>
