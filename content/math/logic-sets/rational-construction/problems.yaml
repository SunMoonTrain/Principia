- id: p1
  tier: easy
  statement: |
    整数$n$满足$[(6,-4)]=[(n,10)]$，$n$是多少？
  answer:
    type: number
    value: -15
    exact: true
  hints:
    - |
      两个:term[等价类]{id="math.logic-sets.equivalence-class"}相等，当且仅当所取的:term[代表元]{id="math.logic-sets.representative"}等价。
    - |
      $[(6,-4)]=[(n,10)]$就是$(6,-4)\sim(n,10)$，照$\sim$的规定写成一个只有乘法的等式。
    - |
      $(6,-4)\sim(n,10)$就是$6\times10=(-4)\times n$，即$60=-4n$，所以$n=-15$。
  solution: |
    $[(6,-4)]=[(n,10)]$当且仅当$(6,-4)\sim(n,10)$，即$6\times10=(-4)\times n$，所以$n=-15$。也可以先约再乘：$(6,-4)$的两个分量同约去$-2$，得$(-3,2)$，再同乘$5$，得$(-15,10)$。

- id: p2
  tier: easy
  statement: |
    拿$(2,3)$、$(5,-4)$当:term[代表元]{id="math.logic-sets.representative"}，照加法的规定算$[(2,3)]+[(5,-4)]$，得到的:term[有序对]{id="math.logic-sets.ordered-pair"}是什么？不约分，按（第一个分量，第二个分量）的顺序填。
  answer:
    type: tuple
    value: [7, -12]
    exact: true
  hints:
    - |
      规定是$[(a,b)]+[(c,d)]=[(ad+bc,\ bd)]$，先认出$a$、$b$、$c$、$d$各是多少。
    - |
      $a=2$，$b=3$，$c=5$，$d=-4$，算$ad+bc$和$bd$；$d$是负的，照样代进去。
    - |
      $ad+bc=2\times(-4)+3\times5=7$，$bd=3\times(-4)=-12$，填$(7,-12)$。
  solution: |
    照规定，第一个分量是$2\times(-4)+3\times5=7$，第二个分量是$3\times(-4)=-12$，得到$(7,-12)$。

    中学先把$\frac5{-4}$写成$-\frac54$，再算$\frac23-\frac54=-\frac7{12}$，对应的代表元是$(-7,12)$。$7\times12=(-12)\times(-7)$，所以$(7,-12)\sim(-7,12)$，是同一个有理数。

- id: p3
  tier: medium
  statement: |
    下面每一项都借:term[代表元]{id="math.logic-sets.representative"}$(a,b)$规定一个:term[映射]{id="math.logic-sets.map"}。哪些规定是:term[良定义]{id="math.logic-sets.well-defined"}的？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\Q\to\Q$，$[(a,b)]\mapsto[(a+b,\ b)]$
      - |
        $\Q\to\Q$，$[(a,b)]\mapsto[(a+1,\ b)]$
      - |
        $\Q\to\Q$，$[(a,b)]\mapsto[(ab,\ a^2+b^2)]$
      - |
        $\Q\to\Q$，$[(a,b)]\mapsto[(|a|,\ b)]$
      - |
        $\Q\to\{0,1\}$，$[(a,b)]\mapsto ab$除以$2$的余数
    value: [1, 3]
  hints:
    - |
      不是良定义的，找同一个有理数的两个代表元，算出不同的结果；两个分量可以同乘任何非零整数，别忘了负数。是良定义的，要对任意两个代表元证，或者认出它由讲解里验证过的运算得来；还要看右边的第二个分量会不会是$0$。
    - |
      A：和$[(a,b)]+[(1,1)]$比一比。B：拿$(0,1)$、$(0,2)$试。C：$b\ne0$时$a^2+b^2$会是$0$吗？设$ab'=ba'$，把$(ab)(a'^2+b'^2)$和$(a^2+b^2)(a'b')$都拆成两项来比。

      D：拿$(1,2)$、$(-1,-2)$试。E：拿$(1,1)$、$(2,2)$试。
    - |
      A：$[(a,b)]+[(1,1)]=[(a\cdot1+b\cdot1,\ b\cdot1)]$，就是$[(a+b,\ b)]$，所以它是$x\mapsto x+1$；加法是良定义的，它也是。B：$[(0,1)]=[(0,2)]$，算出的是$[(1,1)]$和$[(1,2)]$，$1\times2\ne1\times1$，不相等。

      C：$b\ne0$，所以$a^2+b^2\ne0$。设$ab'=ba'$，则$(ab)a'^2=(aa')(ba')$，把$ba'$换成$ab'$，就是$a^2(a'b')$；$(ab)b'^2=(bb')(ab')$，把$ab'$换成$ba'$，就是$b^2(a'b')$。相加得$(ab)(a'^2+b'^2)=(a^2+b^2)(a'b')$，是良定义的。

      D：$[(1,2)]=[(-1,-2)]$，算出的是$[(1,2)]$和$[(1,-2)]$，$1\times(-2)\ne2\times1$，不相等。E：$[(1,1)]=[(2,2)]$，余数却是$1$和$0$。选 A、C。
  solution: |
    A：照加法的规定，$[(a,b)]+[(1,1)]=[(a+b,\ b)]$，它就是$x\mapsto x+1$；加法是良定义的，它也是，不用另外验证。B：$[(0,1)]=[(0,2)]$，算出的却是$[(1,1)]$和$[(1,2)]$，不相等；分子加$1$，加上的是$\frac1b$，多少要看写法。

    C：$b\ne0$，第二个分量$a^2+b^2$不是$0$。设$ab'=ba'$，$(ab)(a'^2+b'^2)$的两项是$(aa')(ba')$和$(bb')(ab')$，前一项的$ba'$换成$ab'$，后一项的$ab'$换成$ba'$，成了$a^2(a'b')$和$b^2(a'b')$，合起来是$(a^2+b^2)(a'b')$，是良定义的。它就是$x\mapsto\frac x{x^2+1}$。

    D：$(1,2)\sim(-1,-2)$，算出的是$[(1,2)]$和$[(1,-2)]$，一正一负。两个分量同乘正整数时看不出毛病，同乘负整数才露出来；改成$[(|a|,\ |b|)]$就是良定义的，它是绝对值。E：$(1,1)\sim(2,2)$，$ab$的余数是$1$和$0$；造整数时$a+b$的奇偶不随代表元变，这里$ab$的奇偶却随它变。选 A、C。

- id: p4
  tier: medium
  statement: |
    第一个分量$a$取$-2,-1,0,1,2$，第二个分量$b$取$-4,-3,-2,-1,1,2,3,4$，一共有$40$个:term[有序对]{id="math.logic-sets.ordered-pair"}$(a,b)$。

    （1）它们一共表示多少个不同的有理数？

    （2）这些有理数里，小于$[(1,2)]$的有几个？

    按（前者，后者）的顺序填。
  answer:
    type: tuple
    value: [13, 9]
    exact: true
  hints:
    - |
      先把第二个分量都化成正的，再看哪些有序对表示同一个有理数。
    - |
      $(a,b)\sim(-a,-b)$，所以只要看$b=1,2,3,4$的$20$个。$b=1$时有$5$个有理数；$b=2$、$3$、$4$时，各添上几个前面没有的？
    - |
      $b=1$：$-2,-1,0,1,2$，共$5$个。$b=2$：$a=0$、$a=\pm2$的前面有了，新的是$\pm\frac12$。$b=3$：新的是$\pm\frac13$、$\pm\frac23$。$b=4$：$a=\pm2$的就是$\pm\frac12$，新的是$\pm\frac14$。

      一共$5+2+4+2=13$个。从小到大，$\frac12$的前面是$-2,-1,-\frac23,-\frac12,-\frac13,-\frac14,0,\frac14,\frac13$，有$9$个。填$(13,9)$。
  solution: |
    $(a,b)\sim(-a,-b)$，第二个分量是负的那$20$个，没有添出新的有理数。$b=1$给出$5$个整数，$b=2$添上$\pm\frac12$，$b=3$添上$\pm\frac13$、$\pm\frac23$，$b=4$添上$\pm\frac14$，一共$5+2+4+2=13$个。

    小于$\frac12$的，有$6$个负的，有$0$，还有$\frac14$、$\frac13$，共$9$个。答案是$(13,9)$。

- id: p5
  tier: hard
  statement: |
    设$x$、$y$、$z$是有理数。用[整数的运算律](lesson:math.logic-sets.number-constructions#thm-integer-laws)和讲解里的规定，证明：

    （1）$xy=yx$，$(xy)z=x(yz)$；

    （2）$(x+y)+z=x+(y+z)$；

    （3）$x(y+z)=xy+xz$；

    （4）$x+0=x$，$x\cdot1=x$，$x+(-1)x=0$。

    （5）不再取:term[代表元]{id="math.logic-sets.representative"}，只由前四条、「$0$乘任何有理数都是$0$」和「非零的有理数都有倒数」证明：$x\ne0$时，满足$xu=y$的有理数$u$恰有一个；$x\ne0$、$y\ne0$时，$xy\ne0$。
  hints:
    - |
      （1）到（4）把三个有理数写成$[(a,b)]$、$[(c,d)]$、$[(e,f)]$，照规定算出两边，再比较有序对。（3）两边的有序对并不相同，看看差了什么公因数。（5）两边同乘$x$的倒数。
    - |
      （2）两边的第一个分量展开，都是$adf+bcf+bde$，第二个分量呢？（3）左边是$[(a(cf+de),\ b(df))]$，右边的第二个分量是$(bd)(bf)$，两个分量各提出一个$b$，再用$(ka,kb)\sim(a,b)$。

      （4）先算$(-1)x$，这里的$-1$就是$[(-1,1)]$。（5）后一半，看方程$xu=0$有哪些解。
    - |
      设$x=[(a,b)]$，$y=[(c,d)]$，$z=[(e,f)]$。规定都是良定义的，取这一组代表元来算就行。

      （1）$xy=[(ac,\ bd)]$，$yx=[(ca,\ db)]$，由整数乘法的交换律，两边的有序对相同。$(xy)z=[((ac)e,\ (bd)f)]$，$x(yz)=[(a(ce),\ b(df))]$，由乘法的结合律，也相同。

      （2）$x+y=[(ad+bc,\ bd)]$，所以$(x+y)+z$的两个分量是$(ad+bc)f+(bd)e$和$(bd)f$。$y+z=[(cf+de,\ df)]$，所以$x+(y+z)$的两个分量是$a(df)+b(cf+de)$和$b(df)$。由分配律展开，第一个分量都是$adf+bcf+bde$，第二个分量都是$bdf$，两边的有序对相同。

      （3）$y+z=[(cf+de,\ df)]$，所以$x(y+z)=[(acf+ade,\ bdf)]$。$xy=[(ac,\ bd)]$，$xz=[(ae,\ bf)]$，所以$xy+xz$的两个分量是$(ac)(bf)+(bd)(ae)$和$(bd)(bf)$，即$b(acf+ade)$和$b(bdf)$。$b\ne0$，由$(ka)b=(kb)a$，两个分量同乘非零整数，有理数不变，所以它等于$[(acf+ade,\ bdf)]$，就是$x(y+z)$。

      （4）要用整数的$b\cdot0=0$和$(-1)a=-a$（见[用等价类构造整数](lesson:math.logic-sets.number-constructions)第 5 题（5））。$0=[(0,1)]$，$x+0=[(a\cdot1+b\cdot0,\ b\cdot1)]$，就是$[(a,b)]$；$1=[(1,1)]$，$x\cdot1=[(a\cdot1,\ b\cdot1)]$，也是$[(a,b)]$。$(-1)x=[(-1,1)]\cdot[(a,b)]=[(-a,b)]$，所以$x+(-1)x=[(ab+b(-a),\ bb)]$。$ab+b(-a)=b(a+(-a))=0$，而$0\cdot1=bb\cdot0$，所以它是$[(0,\ bb)]=[(0,1)]$，即$0$。

      （5）设$x\ne0$，把它的倒数记作$w$，$xw=1$。令$u=wy$，则$xu=x(wy)=(xw)y=1\cdot y$，由交换律和$y\cdot1=y$，它就是$y$，所以这样的$u$至少有一个。反过来，若$xu=y$，两边同乘$w$，$wy=w(xu)=(wx)u=1\cdot u=u$，所以$u$只能是$wy$，至多有一个。

      再设$y\ne0$。要是$xy=0$，方程$xu=0$就有$u=y$和$u=0$两个不同的解，和恰有一个矛盾，所以$xy\ne0$。
  reference: |
    （1）代入，用整数的交换律、结合律。（2）两边都是$[(adf+bcf+bde,\ bdf)]$。（3）左边$[(acf+ade,\ bdf)]$，右边$[(b(acf+ade),\ b(bdf))]$，由$(ka,kb)\sim(a,b)$相等。（4）$(-1)x=[(-a,b)]$，$x+(-1)x=[(0,\ bb)]=[(0,1)]$。

    （5）$xw=1$：$u=wy$满足；$xu=y\Rightarrow u=wy$。$xu=0$恰有一个解，$u=0$已经是，所以$y\ne0$时$xy\ne0$。和整数对比：整数是先证非零的积不是$0$，再得消去律；这里有了倒数，除法做得成而且只有一个结果，非零的积不是$0$跟着就有。

- id: p6
  tier: hard
  statement: |
    整数的大小和不等式的性质照中学学过的用，例如：$k$是正整数时，$m<n$当且仅当$km<kn$；任意两个整数$m$、$n$，$m<n$、$m=n$、$n<m$恰有一个成立。

    （1）证明讲解里「小于」的规定，和分母为正的:term[代表元]{id="math.logic-sets.representative"}的选取无关。

    （2）设$x$、$y$、$z$是有理数。证明：$x<y$、$x=y$、$y<x$恰有一个成立；$x<y$并且${y<z}$时，$x<z$。

    （3）设$x=[(a,b)]$，$y=[(c,d)]$，$b$、$d$是正整数，$x<y$。证明$x<[(a+c,\ b+d)]$，$[(a+c,\ b+d)]<y$。

    （4）上一问用的正是讲解里的$\oplus$，它的结果随代表元变。把$y$的代表元换成$(kc,\ kd)$，$k=1,2,3,\dots$，由上一问证明$x$、$y$之间有无穷多个有理数。
  hints:
    - |
      （1）换代表元就是$ab'=ba'$，$cd'=dc'$，要证$ad<bc$和$a'd'<b'c'$同时成立或同时不成立。（2）（3）都先写成整数之间的等式、不等式。（4）$k$不同，得到的有理数会不会相同？
    - |
      （1）$ad<bc$两边同乘正整数$b'd'$，再用$ab'=ba'$、$cd'=dc'$换掉一部分，约去正整数$bd$。（2）后一半：$ad<bc$两边同乘$f$，$cf<de$两边同乘$b$，接起来。

      （3）$x<[(a+c,\ b+d)]$就是$a(b+d)<b(a+c)$，化简看看。（4）对不同的$k$、$l$，比较$(a+kc)(b+ld)$和$(b+kd)(a+lc)$。
    - |
      （1）设$b$、$d$、$b'$、$d'$都是正整数，$ab'=ba'$，$cd'=dc'$。$b'd'$是正整数，所以$ad<bc$当且仅当$(ad)(b'd')<(bc)(b'd')$。左边是$(ab')(dd')=(ba')(dd')$，即$(bd)(a'd')$；右边是$(cd')(bb')=(dc')(bb')$，即$(bd)(b'c')$。$bd$是正整数，约去它，又当且仅当$a'd'<b'c'$。

      （2）每个有理数都有分母为正的代表元，设$x=[(a,b)]$，$y=[(c,d)]$，$z=[(e,f)]$，$b$、$d$、$f$都是正整数。$x<y$、$x=y$、$y<x$分别是$ad<bc$、$ad=bc$、$bc<ad$，对整数$ad$、$bc$恰有一个成立。

      若$ad<bc$，$cf<de$，前者两边同乘$f$，后者两边同乘$b$，得$adf<bcf$，$bcf<bde$。所以$adf<bde$，约去正整数$d$，$af<be$，即$x<z$。

      （3）$b+d$是正整数。$x<[(a+c,\ b+d)]$就是$a(b+d)<b(a+c)$，两边减去$ab$，就是$ad<bc$。$[(a+c,\ b+d)]<y$就是$(a+c)d<(b+d)c$，两边减去$cd$，也是$ad<bc$。所以两个都成立。

      （4）$(kc,\ kd)$也是$y$的代表元，$kd$是正整数，由（3），$z_k=[(a+kc,\ b+kd)]$在$x$、$y$之间。$z_k=z_l$就是$(a+kc)(b+ld)=(b+kd)(a+lc)$，展开，两边都有$ab+klcd$，剩下$lad+kbc=kad+lbc$，即$(k-l)(bc-ad)=0$。

      $bc-ad\ne0$，非零整数的积不是$0$，所以$k=l$：$k$不同，$z_k$就不同，$x$、$y$之间有无穷多个有理数。$\oplus$的结果随代表元变，在这里正好派上用场。
  reference: |
    （1）乘$b'd'>0$，用$ab'=ba'$、$cd'=dc'$代换，约去$bd>0$。（2）三种情形就是整数$ad$与$bc$的三种情形；传递：$adf<bcf<bde$，约去$d>0$。（3）两个不等式都化成$ad<bc$。

    （4）$z_k=[(a+kc,\ b+kd)]$，$z_k=z_l$化成$(k-l)(bc-ad)=0$，故$k\mapsto z_k$把不同的$k$送到不同的有理数。不用$z_k$也行：反复用（3），或者取平均$[(ad+bc,\ 2bd)]$，再说「之间只有有限个时取其中最小的，它和$x$之间还有一个」，矛盾。

- id: p7
  tier: thinking
  statement: |
    要是只排除$(0,0)$，第二个分量可以是$0$：在$\Z\times\Z$去掉$(0,0)$以后的集合上，照样规定$(a,b)\approx(c,d)$当且仅当$ad=bc$。

    （1）它还是:term[等价关系]{id="math.logic-sets.equivalence-relation"}吗？讲解的证明约去了$d$，$d=0$时怎么办？

    （2）和$\Q$比，多出了哪些:term[等价类]{id="math.logic-sets.equivalence-class"}？在几何图像的第一幅图上，多出来的是什么，它和水平线$b=1$有没有交点？

    （3）加法、乘法的规定照旧，哪些算式算不出结果？

    （4）把多出来的类记作$\infty$。对调$0$的两个分量就得到$\infty$，有人因此补一条$0\cdot\infty=1$，让$0$也有倒数。证明这样一来，乘法就不满足结合律了。要是想让$\infty$有相反数（opposite），即有$w$使$w+\infty=0$，加法会出什么毛病？
  hints:
    - |
      （1）按$d$是不是$0$分开。（2）第二个分量是$0$的有序对，彼此有没有这个关系，和别的呢？（3）看算出的有序对会不会是$(0,0)$。（4）找一个算式，两种结合的次序算出的结果不同。
    - |
      （1）$d=0$时$c\ne0$，由$ad=bc$、$cf=de$各得到什么？（2）$(a,0)\approx(c,0)$总成立。（3）加法要看$bd=0$并且$ad+bc=0$，乘法要看$bd=0$并且$ac=0$。（4）比较${(2\cdot0)\cdot\infty}$和${2\cdot(0\cdot\infty)}$；加法先算$\infty+1$。
    - |
      （1）是：自反、对称的证明照旧。设$ad=bc$，$cf=de$，$d\ne0$时照讲解约去$d$，得$af=be$。$d=0$时$c\ne0$，由$bc=ad=0$得$b=0$，由$cf=de=0$得$f=0$，所以$af$、$be$都是$0$。可见讲解里不传递的例子，坏就坏在$(0,0)$身上。

      （2）第二个分量是$0$的，第一个分量都不是$0$。$(a,0)\approx(c,0)$总成立；$d\ne0$时，$(a,0)\approx(c,d)$要求$ad=0$，不成立。所以只多出一个类，由全部$(a,0)$（$a\ne0$）组成，别的类和原来一样。

      图上它是$b=0$那一行去掉原点，也在一条过原点的直线上，这条直线和水平线$b=1$平行，没有交点。别的直线越接近水平，和$b=1$的交点就离得越远，难怪把这个类记作$\infty$。

      （3）算不出，就是算出的有序对是$(0,0)$。加法要$bd=0$并且$ad+bc=0$：$b=0$时$a\ne0$，由$ad=0$得$d=0$；$d=0$时同样得$b=0$。所以只有$\infty+\infty$算不出。

      乘法要$bd=0$并且$ac=0$：$a=0$时$b\ne0$，由$bd=0$得$d=0$；$c=0$时同样得$b=0$。所以只有$0\cdot\infty$、$\infty\cdot0$算不出。别的都算得出，取哪个代表元都行：$b\ne0$时$[(a,b)]+[(c,0)]=[(bc,0)]$，$a\ne0$时$[(a,b)]\cdot[(c,0)]=[(ac,0)]$，都还是$\infty$。

      （4）补上$0\cdot\infty=1$以后，$(2\cdot0)\cdot\infty=0\cdot\infty=1$，$2\cdot(0\cdot\infty)=2\cdot1=2$，两种次序的结果不同。把$1$换成别的非零有理数$r$，得到$r$和$2r$，也不相等。

      加法：设$w+\infty=0$，$0+1=1$照旧。由结合律，$1=(w+\infty)+1=w+(\infty+1)$，$\infty+1=\infty$，所以它又等于$w+\infty=0$，矛盾。所以要留着$\infty$的相反数，加法就不满足结合律。

      添了$\infty$，除以$0$好像也说得通了，代价是丢掉运算律，所以有理数里不要它。复分析的[分式线性变换](lesson:math.complex-analysis.mobius#def-extended-plane)一节也添了一个$\infty$，那里只用它来说映射的值，$\infty-\infty$、$0\cdot\infty$照样没有意义。
  reference: |
    （1）是。$d=0$时$c\ne0$，$b=f=0$，$af=be=0$。

    （2）只多一类$\{(a,0):a\ne0\}$，是水平的那条直线去掉原点，和$b=1$平行、不相交。（连同$\Q$的各类，就是过原点、经过别的格点的全部直线，即有理数域上的射影直线。）

    （3）加法只有$\infty+\infty$，乘法只有$0\cdot\infty$、$\infty\cdot0$落在$(0,0)$上；其余$\infty+x=\infty$，$x\cdot\infty=\infty$（$x\ne0$）。

    （4）$(2\cdot0)\cdot\infty=1$，$2\cdot(0\cdot\infty)=2$。$1=0+1=(w+\infty)+1=w+(\infty+1)=w+\infty=0$。一般地，满足运算律、又不止一个元素的数系里，$0$乘任何数都是$0$，$0$不可能有倒数。

- id: p8
  tier: thinking
  statement: |
    造有理数，只用到整数的加法、乘法和它们的运算律。换一个数系，第二个分量取其中不是$0$的，照样规定$(a,b)\approx(c,d)$当且仅当$ad=bc$，再照样规定加法、乘法。

    （1）只用偶数。得到的和$\Q$是不是一回事？偶数里没有$1$，$a\mapsto[(a,1)]$该换成什么？

    （2）用$\Q$自己再造一遍，会多出新的数吗？

    （3）用模$6$同余（congruent modulo $6$）的六个类，加法、乘法见[等价关系与商集](lesson:math.logic-sets.equivalence-relations)第 6 题。用$([1],[3])$、$([3],[3])$、$([1],[1])$说明$\approx$不是:term[传递]{id="math.logic-sets.transitive"}的。加法、乘法的规定还行不行？

    （4）要照样造得出来，数系得满足什么？实系数多项式满足吗？用它来造，$[(x^2-1,\ x-1)]=[(x+1,\ 1)]$；可[映射](lesson:math.logic-sets.functions#def-map-equality)一节说，$\frac{x^2-1}{x-1}$和$x+1$不相等。矛盾吗？
  hints:
    - |
      （1）每个有理数都有两个分量全是偶数的代表元吗？（2）每个类里有没有第二个分量是$1$的？（3）逐对代进去比；再看两个第二个分量乘起来是什么。（4）讲解的证明里，哪几步用到第二个分量不是$0$？
    - |
      （1）$[(m,n)]=[(2m,2n)]$；$a$是偶数时，想一想哪个分量全是偶数的有序对表示$a$。（2）$y\ne0$，把$y$的倒数记作$w$，$(x,y)$和$(xw,1)$有没有关系？（3）$[3]\cdot[3]$、$[2]\cdot[3]$各是哪个类？

      （4）传递性里消去$d$，加法、乘法里$bd\ne0$，倒数里$a'\ne0$，靠的是同一条性质。两个非零多项式相乘，最高次项的系数是多少？比一比「作为类相等」和「作为映射相等」各看什么。
    - |
      （1）是一回事。每个有理数$[(m,n)]=[(2m,2n)]$，都有分量全是偶数的代表元；两对偶数在新的规定下有关系，就是$ad=bc$，也就是它们表示同一个有理数。所以新造的类和有理数一个对一个，加法、乘法的式子又一样，算出来也对得上。$a\mapsto[(a,1)]$换成$a\mapsto[(2a,2)]$；把$2$换成别的非零偶数$c$，$(ca)\cdot2=c\cdot(2a)$，$[(ca,\ c)]$还是它。

      （2）不会。设$x$、$y$是有理数，$y\ne0$，$w$是$y$的倒数，则$x\cdot1=y(xw)$，所以$(x,y)\approx(xw,1)$：每个类里都有第二个分量是$1$的，而$(u,1)\approx(v,1)$就是$u=v$。所以新造的类和$\Q$一个对一个，运算也对得上。造分数是为了让除法做得成，$\Q$里除以非零的数已经做得成，再造一遍就没有新的了；要得到$\sqrt2$，得换办法。

      （3）$[1]\cdot[3]=[3]$，$[3]\cdot[3]=[9]=[3]$，所以$([1],[3])\approx([3],[3])$；$[3]\cdot[1]=[3]\cdot[1]$，所以$([3],[3])\approx([1],[1])$。可$[1]\cdot[1]=[1]$，$[3]\cdot[1]=[3]$，$([1],[3])\approx([1],[1])$不成立，$\approx$不传递，讲解里从两边消去$d$的那一步走不通。加法、乘法也不行：$[2]$、$[3]$都不是$[0]$，$[2]\cdot[3]=[0]$，拿它们当第二个分量，和、积的第二个分量就成了$[0]$。

      （4）设加法、乘法的交换律、结合律，分配律，$x+0=x$，$x+(-x)=0$照旧成立，并且有不是$0$的元素，那么只要再有一条：两个不是$0$的元素，积也不是$0$。有了它，由$xz=yz$、$z\ne0$得$(x-y)z=0$，所以$x=y$，消去律就有了；传递性里消去$d$，加法、乘法里$bd\ne0$，倒数里$a'\ne0$，都靠它。反过来，有两个不是$0$的元素积是$0$，拿它们当第二个分量，加法就做不成。这样的数系再加上有不等于$0$的$1$，以后在[环、整环与域](lesson:math.abstract-algebra.rings)里叫作整环（integral domain）。

      实系数多项式满足：两个非零多项式的最高次项系数都不是$0$，积的最高次项系数是它们的积，也不是$0$。$(x^2-1)\cdot1=(x-1)(x+1)$，所以两个类相等。不矛盾：作为类相等，比的是多项式相乘的结果，$x$不代进任何数；作为映射相等，要定义域相同，$\frac{x^2-1}{x-1}$在$x=1$处没有意义，和$x+1$就不相等。
  reference: |
    （1）一回事：$[(m,n)]=[(2m,2n)]$，关系和运算的式子都一样；$a\mapsto[(ca,\ c)]$，$c$是任意非零偶数。

    （2）不会：$(x,y)\approx(xy^{-1},1)$，每类恰有一个第二个分量是$1$的元素。（域的分式域是自己。）

    （3）$[1][3]=[3]=[3][3]$，$[3][1]=[3][1]$，但$[1][1]=[1]\ne[3]=[3][1]$。$[2][3]=[0]$，分母相乘出了$[0]$。模素数$p$时没有这个毛病，可造出来的还是原来的$p$个类（同（2））。

    （4）非零元素的积非零（等价于非零元素可以消去），再加上交换、结合、分配律，$x+0=x$，$x+(-x)=0$，有非零元素，不要求有$1$；必要性：$xy=0$时$[(0,x)]+[(0,y)]$的第二个分量是$0$。多项式：首项系数相乘。造出来的是有理分式，作为形式的分式$\frac{x^2-1}{x-1}=x+1$，作为函数要看定义域。
