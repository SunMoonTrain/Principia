<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 344" width="600" height="344" font-size="14">
  <!-- 两张 4×4 方格：行是 x = 1..4（从上到下），列是 y = 1..4（从左到右），涂色的格子是使 P(x, y) 成立的 (x, y) -->
  <!-- 左图 x + y = 5，右图 x ≤ y；每格 44，左图左上角 (86, 78)，右图左上角 (386, 78) -->
  <!-- 涂色（先画，格线压在上面） -->
  <g style="fill: var(--accent, #2563eb); opacity: 0.35">
    <!-- 左图：x + y = 5 -->
    <rect x="218" y="78" width="44" height="44" />
    <rect x="174" y="122" width="44" height="44" />
    <rect x="130" y="166" width="44" height="44" />
    <rect x="86" y="210" width="44" height="44" />
    <!-- 右图：x ≤ y -->
    <rect x="386" y="78" width="44" height="44" />
    <rect x="430" y="78" width="44" height="44" />
    <rect x="474" y="78" width="44" height="44" />
    <rect x="518" y="78" width="44" height="44" />
    <rect x="430" y="122" width="44" height="44" />
    <rect x="474" y="122" width="44" height="44" />
    <rect x="518" y="122" width="44" height="44" />
    <rect x="474" y="166" width="44" height="44" />
    <rect x="518" y="166" width="44" height="44" />
    <rect x="518" y="210" width="44" height="44" />
    <!-- 图例 -->
    <rect x="218" y="321" width="14" height="14" />
  </g>
  <!-- 格线 -->
  <g fill="none" stroke="currentColor">
    <rect x="86" y="78" width="176" height="176" stroke-width="1.5" />
    <line x1="130" y1="78" x2="130" y2="254" />
    <line x1="174" y1="78" x2="174" y2="254" />
    <line x1="218" y1="78" x2="218" y2="254" />
    <line x1="86" y1="122" x2="262" y2="122" />
    <line x1="86" y1="166" x2="262" y2="166" />
    <line x1="86" y1="210" x2="262" y2="210" />
    <rect x="386" y="78" width="176" height="176" stroke-width="1.5" />
    <line x1="430" y1="78" x2="430" y2="254" />
    <line x1="474" y1="78" x2="474" y2="254" />
    <line x1="518" y1="78" x2="518" y2="254" />
    <line x1="386" y1="122" x2="562" y2="122" />
    <line x1="386" y1="166" x2="562" y2="166" />
    <line x1="386" y1="210" x2="562" y2="210" />
    <rect x="218" y="321" width="14" height="14" stroke-width="1" />
  </g>
  <!-- 右图 y = 4 那一列整列涂满：用强调色框出来 -->
  <rect x="518" y="78" width="44" height="176" fill="none" stroke-width="3" style="stroke: var(--accent, #2563eb)" />
  <!-- 标题 -->
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="174" y="30"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">x</tspan>, <tspan font-style="italic">y</tspan>)：<tspan font-style="italic">x</tspan> + <tspan font-style="italic">y</tspan> = 5</text>
    <text x="474" y="30"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">x</tspan>, <tspan font-style="italic">y</tspan>)：<tspan font-style="italic">x</tspan> ≤ <tspan font-style="italic">y</tspan></text>
  </g>
  <!-- 列号（y） -->
  <g fill="currentColor" text-anchor="middle">
    <text x="108" y="66"><tspan font-style="italic">y</tspan> = 1</text>
    <text x="152" y="66"><tspan font-style="italic">y</tspan> = 2</text>
    <text x="196" y="66"><tspan font-style="italic">y</tspan> = 3</text>
    <text x="240" y="66"><tspan font-style="italic">y</tspan> = 4</text>
    <text x="408" y="66"><tspan font-style="italic">y</tspan> = 1</text>
    <text x="452" y="66"><tspan font-style="italic">y</tspan> = 2</text>
    <text x="496" y="66"><tspan font-style="italic">y</tspan> = 3</text>
    <text x="540" y="66"><tspan font-style="italic">y</tspan> = 4</text>
  </g>
  <!-- 行号（x） -->
  <g fill="currentColor" text-anchor="end">
    <text x="78" y="105"><tspan font-style="italic">x</tspan> = 1</text>
    <text x="78" y="149"><tspan font-style="italic">x</tspan> = 2</text>
    <text x="78" y="193"><tspan font-style="italic">x</tspan> = 3</text>
    <text x="78" y="237"><tspan font-style="italic">x</tspan> = 4</text>
    <text x="378" y="105"><tspan font-style="italic">x</tspan> = 1</text>
    <text x="378" y="149"><tspan font-style="italic">x</tspan> = 2</text>
    <text x="378" y="193"><tspan font-style="italic">x</tspan> = 3</text>
    <text x="378" y="237"><tspan font-style="italic">x</tspan> = 4</text>
  </g>
  <!-- 每张图下面两行：两句话的真假 -->
  <g fill="currentColor" text-anchor="middle">
    <text x="174" y="284">每行都有涂色：∀<tspan font-style="italic">x</tspan> ∃<tspan font-style="italic">y</tspan> 真</text>
    <text x="174" y="307">没有涂满的列：∃<tspan font-style="italic">y</tspan> ∀<tspan font-style="italic">x</tspan> 假</text>
    <text x="474" y="284">每行都有涂色：∀<tspan font-style="italic">x</tspan> ∃<tspan font-style="italic">y</tspan> 真</text>
    <text x="474" y="307"><tspan font-style="italic">y</tspan> = 4 一列涂满：∃<tspan font-style="italic">y</tspan> ∀<tspan font-style="italic">x</tspan> 真</text>
  </g>
  <text x="240" y="333" fill="currentColor">涂色的格子：<tspan font-style="italic">P</tspan>(<tspan font-style="italic">x</tspan>, <tspan font-style="italic">y</tspan>) 成立</text>
</svg>
