    （1）由第 5 题（1），「有无穷多个$n$使$Q(n)$」和$\forall N\in\N^+,\ \exists n>N,\quad Q(n)$同真同假（取$Q(n)$为$\neg P(n)$时就是正文那一段）。所以乙是$\forall N\in\N^+,\ \exists n>N,\quad P(n)$，丁是$\forall N\in\N^+,\ \exists n>N,\quad\neg P(n)$。甲$\exists N\in\N^+,\ \forall n>N,\quad P(n)$的否定形式正是丁，丙$\exists N\in\N^+,\ \forall n>N,\quad\neg P(n)$的否定形式正是乙（$\neg\neg P(n)$就是$P(n)$）。所以甲与丁、乙与丙互为否定。

    （2）甲、丙不能都真：若大于$N_1$的$n$都满足$P(n)$、大于$N_2$的$n$都满足$\neg P(n)$，则$n=N_1+N_2+1$两者都满足，矛盾。甲、丙可以都假：$P(n)$为「$n$是偶数」，偶数、奇数都没有最后一个。乙、丁：由（1），乙真即丙假，丁真即甲假；乙、丁都真即丙、甲都假，可以（同一例子）；乙、丁都假即丙、甲都真，不可能。所以乙、丁可以都真，不能都假。

