- id: p1
  tier: easy
  statement: |
    设$x_1=\frac49$，$x_2=\frac12$，$x_3=0.454545\cdots$，$x_4=\frac59$，后面的$x_n$也都给定了。照讲解里证明$\R$不可数的办法造$x=0.d_1d_2d_3\cdots$，按$(d_1,d_2,d_3,d_4)$的顺序填。
  answer:
    type: tuple
    value: [5, 4, 5, 4]
    exact: true
  hints:
    - |
      对每个$x_n$先问：它等于某个只含$4$、$5$的无限小数吗？等于的话看它的第$n$位，不等于的话，讲解里规定取几？
    - |
      $\frac49=0.444\cdots$，$\frac59=0.555\cdots$。$\frac12$呢？第一位是$4$的这种小数，最大是$0.4555\cdots$；第一位是$5$的，最小是$0.5444\cdots$。
    - |
      $x_1=0.444\cdots$，第$1$位是$4$，$d_1=5$。$x_2=\frac12$比$0.4555\cdots$大，比$0.5444\cdots$小，不等于任何只含$4$、$5$的无限小数，$d_2=4$。$x_3$的第$3$位是$4$，$d_3=5$；$x_4=0.555\cdots$，第$4$位是$5$，$d_4=4$。填$(5,4,5,4)$。
  solution: |
    $x_1=0.444\cdots$，第$1$位的$4$换成$5$；$x_3=0.4545\cdots$，第$3$位的$4$换成$5$；$x_4=0.555\cdots$，第$4$位的$5$换成$4$。

    $\frac12$写成小数是$0.5000\cdots$，也是$0.4999\cdots$，都有别的数字；只含$4$、$5$的无限小数，第一位是$4$的不超过$0.4555\cdots$，第一位是$5$的不小于$0.5444\cdots$，$\frac12$夹在当中，不等于任何一个，照规定$d_2=4$。造出的$x=0.5454\cdots$和$x_1$、$x_3$、$x_4$各在第$1$、$3$、$4$位不同；它只含$4$、$5$，也不会是$\frac12$。答案是$(5,4,5,4)$。

- id: p2
  tier: easy
  statement: |
    下面哪些是:term[不可数集]{id="math.logic-sets.uncountable-set"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\{[m,m+n]:m\in\Z,\ n\in\N^+\}$，它的元素是闭区间
      - |
        $\Pow(\Pow(\{1,2,3\}))$
      - |
        每一项都是$0$或$1$、后一项总不小于前一项的数列，全体组成的集合
      - |
        $\{[r,r+1]:r\in\R\}$，它的元素也是闭区间
      - |
        $\{S\in\Pow(\N):0\in S\}$
    value: [4, 5]
  hints:
    - |
      不可数集既不是:term[有限集]{id="math.logic-sets.finite-set"}，也不是:term[可数集]{id="math.logic-sets.countable-set"}。先找出有限集，再看每个集合的元素能和哪个熟悉的集合的元素一个对一个地配起来。
    - |
      A、D：要数的是闭区间，不是闭区间里的数；一个闭区间由哪些数定出来？B：$\Pow(\{1,2,3\})$有几个元素？C：这样的数列从第几项起是$1$？E：去掉$0$，$S$就成了$\N^+$的子集。
    - |
      A：$(m,n)\mapsto[m,m+n]$把$\Z\times\N^+$的元素和这些闭区间一个对一个地配起来，$\Z\times\N^+$可数，所以 A 可数。B：$\Pow(\{1,2,3\})$有$8$个元素，B 有$2^8=256$个，是有限集。C：这样的数列要么全是$0$，要么从某一项起都是$1$，前者配$0$，从第$k$项起是$1$的配$k$，就和$\N$配好了，C 可数。

      D：$r\mapsto[r,r+1]$把$\R$的元素和这些闭区间一个对一个地配起来，D 与$\R$等势，不可数。E：$S\mapsto S\setminus\{0\}$把 E 的元素和$\N^+$的子集一个对一个地配起来，E 与$\Pow(\N^+)$等势。$\N^+$的一列子集就是一个从$\N^+$到$\Pow(\N^+)$的映射，由康托尔定理不是满射，总有漏的，所以$\Pow(\N^+)$不可数，E 也不可数。所以选 D、E。
  solution: |
    D 与$\R$等势，所以不可数：左端点$r$定出闭区间，$r$取遍实数。E：去掉$0$、添上$0$把 E 和$\Pow(\N^+)$一个对一个地配起来；从$\N^+$到$\Pow(\N^+)$的映射都不是满射，$\N^+$的一列子集总有漏的，所以$\Pow(\N^+)$不可数，和它等势的 E 也不可数。

    A 与$\Z\times\N^+$等势，可数：每个闭区间里的数都排不成一列，闭区间却只有可数个。B 是有限集，有$2^8=256$个元素：康托尔定理只说:term[幂集]{id="math.logic-sets.power-set"}更多，有限集的幂集还是有限集。C 与$\N$等势；对它照例 1 的办法对调对角线，得到的数列未必在 C 里，说明不了漏。选 D、E。

- id: p3
  tier: medium
  statement: |
    设$A=\{1,2,3\}$，考虑使$f(1)$、$f(2)$、$f(3)$都不是空集的:term[映射]{id="math.logic-sets.map"}$f:A\to\Pow(A)$。照康托尔定理的证明，由$f$得到$D$。使$D$恰有两个元素的$f$有几个？
  answer:
    type: number
    value: 108
    exact: true
  hints:
    - |
      $x$在不在$D$里，只看$f$把$x$送到了哪个子集。先数：$f(x)$有几种取法使$x\in D$，有几种使$x\notin D$？
    - |
      $x\in D$就是$x\notin f(x)$。$A$的非空子集里，含$x$的、不含$x$的各有几个？先定$D$是哪两个元素，再给$f(1)$、$f(2)$、$f(3)$分别数取法。
    - |
      含$x$的子集有$4$个，都不是空集；不含$x$的非空子集有$3$个。$D$取哪两个元素，有$3$种；取定以后，对$D$里的两个$x$，$f(x)$取不含$x$的非空子集，各有$3$种，对不在$D$里的那个$x$，$f(x)$取含$x$的子集，有$4$种。由乘法原理（multiplication principle），一共$3\times3\times3\times4=108$个。
  solution: |
    $x\in D$当且仅当$x\notin f(x)$。不含$x$的非空子集，是另外两个元素的非空子集，有$2^2-1=3$个；含$x$的子集，另外两个元素可取可不取，有$4$个。$D$是哪两个元素，有$3$种，取定以后$f$有$3\times3\times4=36$个，所以一共有$3\times36=108$个。

    $D$只看每个$f(x)$含不含$x$自己，也就是表里对角线上的格子，别的格子怎样都行。把$D$记反，当成由满足$x\in f(x)$的$x$组成，会得到$144$；忘了$f(x)$不是空集，会得到$192$。

- id: p4
  tier: medium
  statement: |
    任给一列只含$4$、$5$的无限小数$x_1,x_2,x_3,\dots$，$x_n=0.a_{n1}a_{n2}a_{n3}\cdots$，要造一个只含$4$、$5$的$x=0.d_1d_2d_3\cdots$。把一个数字「换一下」，指$4$换成$5$、$5$换成$4$。下面哪些造法，不管给的是怎样的一列，都保证$x$不等于其中任何一个？
  answer:
    type: choice
    multiple: true
    options:
      - |
        对每个$n$，把$a_{n,2n}$换一下当作$d_{2n}$；第$1,3,5,\dots$位都取$4$
      - |
        对每个$n$，把$a_{n,n+1}$换一下当作$d_n$
      - |
        对每个$n$，把$a_{2n,n}$换一下当作$d_n$
      - |
        每个正整数$k$恰有一种写法$k=2^m(2n-1)$，$m\in\N$，$n\in\N^+$，把$a_{n,k}$换一下当作$d_k$
      - |
        $d_1=4$；$n\ge2$时，把$a_{nn}$换一下当作$d_n$
    value: [1, 4]
  hints:
    - |
      由讲解的定理，只含$4$、$5$的无限小数只要有一位不同，就不是同一个数。逐条看：对每个$n$，有没有哪一位，保证$x$和$x_n$不同？
    - |
      要比的是同一位：$d_n$和$a_{n,n+1}$不同，说的却是$x$的第$n$位和$x_n$的第$n+1$位。没有保证的，试着找一列，使造出的$x$正好是$x_1$。D 里给定$n$，取$m=0$，看是哪一位。
    - |
      A：$d_{2n}\ne a_{n,2n}$，$x$和$x_n$在第$2n$位不同，保证得了。D：给定$n$，取$m=0$，$k=2n-1$，$d_{2n-1}\ne a_{n,2n-1}$，$x$和$x_n$在第$2n-1$位不同，保证得了。

      B 比的不是同一位。每个$x_n$都是$0.4545\cdots$时，$n$是奇数，$a_{n,n+1}=5$，$d_n=4$；$n$是偶数，$a_{n,n+1}=4$，$d_n=5$；所以$x=0.4545\cdots$，就是$x_1$。

      C 只躲开了$x_2,x_4,x_6,\dots$。$n$是偶数时$x_n=0.444\cdots$，$n$是奇数时$x_n=0.555\cdots$，那么$d_n$都是$5$，$x=0.555\cdots$，就是$x_1$。

      E 只躲开了$x_2,x_3,x_4,\dots$。$x_1=0.4555\cdots$，别的都是$0.444\cdots$，那么$d_1=4$，其余$d_n=5$，$x$就是$x_1$。所以选 A、D。
  solution: |
    要紧的不是对角线，是每个$x_n$都有一位归它管，$x$在那一位和它不同。A 里归$x_n$管的是第$2n$位。D 里归$x_n$管的有很多位，第$2n-1$位就是一位。

    B、C、E 都做不到。B 比的是$x$的第$n$位和$x_n$的第$n+1$位，每个$x_n$都是$0.4545\cdots$时，造出的$x$也是它；C 没有管奇数下标的，偶数下标的都取$0.444\cdots$、奇数下标的都取$0.555\cdots$，造出的$x=0.555\cdots=x_1$；E 没有管$x_1$，$x_1=0.4555\cdots$、别的都是$0.444\cdots$时，造出的$x$就是$x_1$。选 A、D。

- id: p5
  tier: hard
  statement: |
    可以用[可数集的子集与有理数集](lesson:math.logic-sets.countable-subsets)的三个结论：两个:term[可数集]{id="math.logic-sets.countable-set"}的并集（union）是可数集；可数集的子集都:term[至多可数]{id="math.logic-sets.at-most-countable"}；$\Q$是可数集。

    （1）设$A$是:term[不可数集]{id="math.logic-sets.uncountable-set"}，$B$是$A$的子集，并且至多可数。证明：$A\setminus B$是不可数集。

    （2）证明：全体无理数组成的集合是不可数集。

    （3）设$a<b$。证明：$(a,b)$里的全体无理数组成的集合是不可数集。
  hints:
    - |
      （1）假如$A\setminus B$至多可数，它和$B$合起来是谁？（2）、（3）看（1）里的$A$、$B$各取什么。
    - |
      （1）$A=(A\setminus B)\cup B$。两部分各可能是有限集、可数集，分情形说明$A$至多可数；一部分有限、另一部分可数时，把有限的那些一个一个地添进去。（2）取$A=\R$。（3）取$A=(a,b)$，它不可数是例 2 说的。
    - |
      （1）假设$A\setminus B$至多可数，$A=(A\setminus B)\cup B$。两部分都是可数集时，由两个可数集的并集的结论，$A$可数。一部分可数、另一部分有限时，$A$是往一个可数集里添有限个不在里面的元素，由[等势与可数集](lesson:math.logic-sets.countable-sets)例 2，每添一个仍可数，所以$A$可数。两部分都有限时，由那一节[关于元素个数的事实](lesson:math.logic-sets.countable-sets#thm-finite-counting) (2)，往有限集里一个一个地添，总是有限集，$A$有限。

      三种情形里$A$都至多可数，和$A$不可数矛盾，所以$A\setminus B$不可数。

      （2）取$A=\R$，$B=\Q$。$\R$不可数，$\Q$可数，由（1），$\R\setminus\Q$不可数，它就是全体无理数组成的集合。

      （3）取$A=(a,b)$，$B=(a,b)\cap\Q$。由例 2，$(a,b)$不可数；$B$是$\Q$的子集，至多可数。由（1），$(a,b)\setminus B$不可数，它就是$(a,b)$里的全体无理数组成的集合。

      一个无理数也没有写出来，就知道任意短的一段里都有无理数，而且排不成一列。
  reference: |
    （1）$A=(A\setminus B)\cup B$，假设$A\setminus B$至多可数，分三种情形（都可数：可数集的并；一有限一可数：逐个添元素，等势与可数集例 2；都有限：仍有限），$A$都至多可数，矛盾。

    （2）$A=\R$，$B=\Q$。（3）$A=(a,b)$（例 2），$B=(a,b)\cap\Q$是可数集的子集，至多可数。

    也可以在（1）里用「至多可数集与可数集的并可数」一次处理。常见的漏洞：只写两部分都可数，漏了有限的情形；（3）没有说明$(a,b)\cap\Q$为什么至多可数，或者拿「$(a,b)$含有不可数子集」当理由循环论证。

- id: p6
  tier: hard
  statement: |
    设$c_1,c_2,c_3,\dots$都是$0$或$2$，令$s_n=\frac{c_1}3+\frac{c_2}{3^2}+\cdots+\frac{c_n}{3^n}$。数列$s_1,s_2,s_3,\dots$的极限，就是只含$0$、$2$的三进制小数$0.c_1c_2c_3\cdots$表示的数。全体这样的数组成的集合$K$，叫作康托尔集（Cantor set）。

    （1）证明：这样的极限都存在，都在$[0,1]$里。

    （2）证明：两串数字只要有一位不同，得到的数就不同。

    （3）证明：$K$是:term[不可数集]{id="math.logic-sets.uncountable-set"}。

    （4）证明：任给$\varepsilon>0$，都能用有限个闭区间盖住$K$，它们的总长小于$\varepsilon$。
  hints:
    - |
      （1）照讲解里只含$4$、$5$的小数那条定理的 (1)：$s_n$递增，再找一个它们都不超过的数。（2）照它的 (2)：看第一处不同的那一位。（3）照例 1 的办法，把对角线上的$0$、$2$对调。（4）前$n$位取定以后，这样的数挤在多长的一段里？
    - |
      （1）$s_n\le2\bigl(\frac13+\cdots+\frac1{3^n}\bigr)=1-\frac1{3^n}$。（2）设第$j$位第一次不同，第$j$位让一个多出$\frac2{3^j}$，后面的第$k$位至多让它少$\frac2{3^k}$，这些加起来小于$\frac1{3^j}$。（4）前$n$位有$2^n$种取法，后面各位加起来不超过$\frac1{3^n}$。
    - |
      （1）$s_n$随$n$递增，$0\le s_n\le\frac23+\frac2{3^2}+\cdots+\frac2{3^n}=1-\frac1{3^n}<1$。由单调有界原理，极限存在；由保不等式性，极限在$[0,1]$里。

      （2）设第$j$位第一次不同，一个是$2$，另一个是$0$；$n>j$时，截到第$n$位分别是$s_n$、$t_n$。因为$\frac2{3^{j+1}}+\cdots+\frac2{3^n}=\frac1{3^j}-\frac1{3^n}<\frac1{3^j}$，所以

      $$
      s_n-t_n\ge\frac2{3^j}-\Bigl(\frac2{3^{j+1}}+\cdots+\frac2{3^n}\Bigr)>\frac2{3^j}-\frac1{3^j}=\frac1{3^j} .
      $$

      两边取极限，两个数至少相差$\frac1{3^j}$，所以不同。

      （3）$K$不空。任给$K$的一列元素$x_1,x_2,x_3,\dots$，由（2），$x_n$的写法只有一种，各位记作$c_{n1},c_{n2},c_{n3},\dots$。令$c_n=2-c_{nn}$，它是$0$或$2$，不等于$c_{nn}$。由$c_1,c_2,c_3,\dots$得到的数在$K$里，它和$x_n$在第$n$位不同，由（2），不等于$x_n$；任给一列都有漏的，由讲解的第一个定理，$K$不可数。

      （4）取定前$n$位，它们给出$s_n$。$N>n$时，$s_n\le s_N\le s_n+\frac2{3^{n+1}}+\cdots+\frac2{3^N}<s_n+\frac1{3^n}$，所以得到的数在闭区间$\bigl[s_n,s_n+\frac1{3^n}\bigr]$里。前$n$位有$2^n$种取法，$2^n$个这样的闭区间盖住了$K$，总长是$\bigl(\frac23\bigr)^n$。由[数列的极限](lesson:math.analysis.sequences-limits)例 2，$\bigl(\frac23\bigr)^n$的极限是$0$，取足够大的$n$，总长就小于$\varepsilon$。

      $K$怎样排都排不成一列，却能用总长任意小的几段盖住：按排不排得成一列来比，和按占多长来比，是两回事。数学分析[哪些函数可积](lesson:math.analysis.integrable-functions)第 7 题提到的不可数的零测集（set of measure zero），$K$就是一个。
  reference: |
    （1）$s_n$递增，$\le1-3^{-n}$，单调有界原理、保不等式性。（2）$s_n-t_n\ge\frac2{3^j}-\sum_{k=j+1}^n\frac2{3^k}=\frac1{3^j}+\frac1{3^n}>\frac1{3^j}$，取极限。

    （3）由（2）写法唯一，对角线上$0$、$2$对调，仍在$K$里；或由（2）说明$K$与「每一项是$0$或$2$的数列全体」等势，再用例 1。

    （4）前$n$位取定，$s_N\in[s_n,s_n+3^{-n}]$，$2^n$段，总长$(2/3)^n$。

    常见的漏洞：（2）直接对无限和相减而不取极限；（3）没有用（2）说明写法唯一，或没有说明造出的数仍在$K$里；（4）只说「去掉的总长是$1$」，没有给出盖住$K$的有限个闭区间。

- id: p7
  tier: thinking
  statement: |
    能用一段有限长的文字说出来的实数，如「二的算术平方根」「圆的周长和直径之比」，本题里叫作说得出的实数。文字都由有限种符号写成。

    （1）有限种符号写成的有限长的串，全体是:term[可数集]{id="math.logic-sets.countable-set"}，见[可数集的子集与有理数集](lesson:math.logic-sets.countable-subsets)例 1。由此说明：说得出的实数至多可数，所以有说不出的实数。

    （2）把说得出的实数排成一列，照讲解的办法造出$x$。「照那一列造出来的数」不也是一段有限长的文字吗？那么$x$说得出，却不在这一列里。矛盾出在哪里？

    （3）换一种说法：先取定一套规则，它规定哪些文字说出一个实数，说出的是哪一个，并且照它至少说得出一个实数。把照这套规则说得出的实数排成一列（可以重复），造出$x$。$x$照这套规则说得出吗？能不能另立一套规则，使$x$说得出？

    （4）由（3），每套规则都漏掉一些实数。是不是有一个实数，哪一套规则都说不出？
  hints:
    - |
      （1）给每个说得出的实数取一段说出它的文字；不同的实数，文字会一样吗？（2）「照那一列造出来的数」这段文字说出的数，自己该不该排在那一列里？

      （3）规则取定以后，这段文字还能说出$x$吗？再添一条规定试试。（4）把「每套规则都漏掉一些实数」和要问的那一句，都写成带量词（quantifier）的句子。
    - |
      （1）一段文字至多说出一个实数。（2）假如这段文字也算说出了一个实数，排在第$k$个，看$x$的第$k$位。（3）$x$不在这一列里，说的是什么？（4）一句是「对每套规则，都有实数……」，一句是「有实数，对每套规则……」；任取一个实数$r$，能不能立一套规则，使$r$说得出？
    - |
      （1）给每个说得出的实数取一段说出它的文字，有好几段时，取在全体串排成的那一列里最靠前的。一段文字至多说出一个实数，所以不同的实数取的文字不同，这是从说得出的实数到全体串的单射。全体串可数，有到可数集的单射的集合至多可数（见[可数集的子集与有理数集](lesson:math.logic-sets.countable-subsets#thm-injection-countable)），所以说得出的实数至多可数；$\R$不可数，不会全都说得出。

      （2）在（1）和（2）里，都默认了哪一段文字说出哪个实数是早就定好的，其实没有。要知道那一列，先得知道「照那一列造出来的数」说没说出实数、说出的是哪一个，它的意思要靠它自己来定。假如它说出的实数排在第$k$个，即$x=x_k$，照造法，$x$的第$k$位又和$x_k$的第$k$位不同，做不到，所以它没有说定任何数。「说得出」没有确切的意思，「说得出的实数」也就不是一个确定的集合，这叫理查德悖论（Richard's paradox）。

      （3）规则取定以后，（1）的推理没有毛病，照它说得出的实数至多可数，又至少有一个，排得成一列（可以重复），造出的$x$是确定的实数。$x$不在这一列里，就是说照这套规则说不出；「照那一列造出来的数」这段文字，规则要么没有让它说出实数，要么让它说出了别的。另立一套规则，只改一处，规定这段文字说出$x$，$x$就说得出了。可新规则有新的一列，照新的一列造出的数，新规则又说不出。

      （4）不是。任取一个实数$r$，总能立一套规则，规定「甲」这个字说出$r$，所以没有哪个实数是每套规则都说不出的。而（3）说的是「对每套规则，都有实数说不出」，漏掉的是哪些，随规则变；这推不出「有实数，对每套规则都说不出」，见[多重量词](lesson:math.logic-sets.nested-quantifiers#thm-quantifier-order)。对角线论证没有错：对取定的一列，造出的$x$确实不在其中。
  reference: |
    （1）说得出的实数$\mapsto$说出它的、最靠前的串，单射到可数集，至多可数。

    （2）「说得出」没有确切的定义：「照那一列造出来的数」的意思依赖那一列，那一列又依赖它说出的是什么。若它说出$x_k$，则$x=x_k$而第$k$位不同，矛盾。理查德悖论；（1）的结论同样依赖这个不确切的说法，要换成（3）的说法才严格。

    （3）固定规则$G$（至少说得出一个实数）：照$G$说得出的实数至多可数，排得成一列（可以重复），$x$不在其中；$G'$由$G$改一段文字得到，照$G'$说得出$x$，但$G'$有自己的对角线数。与「元语言」「对象语言」的区分是一回事，不要求说出名词。

    （4）不是：$\forall G\,\exists r$推不出$\exists r\,\forall G$；对任一$r$取规则「甲」$\mapsto r$。

    常见的漏洞：把矛盾归咎于对角线论证或归咎于实数不可数；（4）答「有，因为实数比文字多」。

- id: p8
  tier: thinking
  statement: |
    讲解造$x$时把$4$、$5$对调，例 1 把$0$、$1$对调，康托尔定理把「属于」「不属于」对调，动手的地方都在对角线上。设$A$、$B$、$C$都不是:term[空集]{id="math.logic-sets.empty-set"}，$M$由从$C$到$B$的全体映射组成；任给映射$F:A\to M$，$a\in A$的像是一个从$C$到$B$的映射，记作$F_a$。

    （1）设$C=A$，映射$\sigma:B\to B$使每个$b\in B$都有$\sigma(b)\ne b$。证明$F$不是:term[满射]{id="math.logic-sets.surjective"}。例 1 和康托尔定理里，$A$、$B$、$\sigma$、$F_a$各是什么？

    （2）$B$有几个元素时，才有这样的$\sigma$？没有的时候，$F$会不会是满射？

    （3）$\sigma$照旧，$C$不必等于$A$。怎样给每个$a\in A$挑一个动手的地方，就能照样证出$F$不是满射？没有这样的挑法时，$F$可不可能是满射？举例说明。

    （4）有人用$0$到$9$十个数字造$x=0.d_1d_2d_3\cdots$：把$x_n$写成无限小数，小数点后第$n$位是$d$，就取$d_n=d+1$，$d=9$时取$d_n=0$。由（1），$x$的这串数字和每个$x_n$的都不同。举一列实数，连同各自的写法，使$x$偏偏和其中一个是同一个数。再约定：有两种写法的数，一律取末尾全是$0$的那一种；这样造出的$x$还会和某个$x_n$是同一个数吗，为什么？
  hints:
    - |
      （1）照例 1 写：要造一个$g:A\to B$，在$a$处和$F_a$不同，$g(a)$该取什么？（2）$\sigma(b)\ne b$，至少要有别的元素可取。（3）在$C$里给$a$指定一处，两个不同的$a$能不能指定同一处？（4）同一个数什么时候有两种写法，两种写法的末尾各是什么样子？
    - |
      （1）$g(a)=\sigma(F_a(a))$；康托尔定理里，子集$f(a)$换成它的指示函数。（2）$B$恰有一个元素时，从$C$到$B$的映射有几个？

      （3）挑地方的办法是一个映射$p:A\to C$，它要是什么样的映射，$g$在$p(a)$处的值才不会定两次？举例时让$C$只有一个元素。

      （4）让$x$写成$0.5000\cdots$，它还有一种写法。有了约定，$x$的那一串会不会末尾全是$9$？假如$x=x_n$，找出两串第一次不同的那一位；第$n$位在它前面、正好是它、在它后面，分别看$d_n$合不合造法。
    - |
      （1）令$g(a)=\sigma(F_a(a))$，$g$是从$A$到$B$的映射，$g\in M$。对每个$a\in A$，$g(a)=\sigma(F_a(a))\ne F_a(a)$，所以$g\ne F_a$。$g$不是任何$a$的像，$F$不是满射。

      例 1 里$A=\N^+$，$B=\{0,1\}$，$\sigma$对调$0$、$1$，$F_n$是这一列里的第$n$个数列。康托尔定理里$A$就是那个集合，$B=\{0,1\}$，$\sigma$对调$0$、$1$，$F_a$是子集$f(a)$的指示函数，造出的$g$是$D$的指示函数。

      （2）至少有两个元素时。取$B$中的$b_0\ne b_1$，$b\ne b_0$时令$\sigma(b)=b_0$，再令$\sigma(b_0)=b_1$，就有$\sigma(b)\ne b$。$B$恰有一个元素时，$\sigma$只能把它送到自己，没有这样的$\sigma$；这时从$C$到$B$的映射只有一个，$M$只有一个元素，$A$又不空，$F$总是满射。

      （3）不同的$a$要在不同的地方动手，也就是挑一个:term[单射]{id="math.logic-sets.injective"}$p:A\to C$。任取$b_0\in B$，令$g(p(a))=\sigma(F_a(p(a)))$，$C$的其余元素处都取$b_0$；$p$是单射，每一处至多定一次，$g$是从$C$到$B$的映射。$g$和$F_a$在$p(a)$处不同，所以$g\ne F_a$，$F$不是满射；对角线只是$p$取:term[恒等映射]{id="math.logic-sets.identity-map"}（identity map）的情形。

      没有从$A$到$C$的单射时，$F$可能是满射，也可能不是。$A=\{1,2\}$，$C=\{1\}$，$B=\{0,1\}$时，从$C$到$B$的映射恰有两个，让$F$把$1$、$2$各送到一个，就是满射。$A=\{1,2,3\}$，$C=\{1,2\}$，$B=\{0,1\}$时，$M$有$4$个元素，$A$只有$3$个，$F$不会是满射。

      （4）$x_1$是$\frac12$，写成$0.4999\cdots$；$x_2,x_3,x_4,\dots$都是$1$，写成$0.9999\cdots$。$d_1=4+1=5$，以后的$d_n$都是$9$换成的$0$，$x=0.5000\cdots=\frac12=x_1$。两串数字每一位都不同，表示的却是同一个数。

      有了约定就不会。可不能只说「约定以后写法唯一，两串不同就是两个数」：约定只管各个$x_n$，$x$的那一串照样可能末尾全是$9$，如每个$x_n$都是$0.888\cdots$的时候。假如$x=x_n$，因为$x\ge0$，$x_n$不是负数；整数部分算第$0$位，设两串第$j$位第一次不同。

      照讲解里只含$4$、$5$的小数那条定理的 (2) 那样估计：第$j$位让一个至少多出$10^{-j}$，后面的第$k$位至多让它少$9\cdot10^{-k}$，加起来至多是$10^{-j}$。两个数要相等，就处处都得正好：两串的第$j$位恰好差$1$，以后各位，第$j$位大的那一串都是$0$，小的那一串都是$9$。照约定，末尾全是$9$的不会是$x_n$的那一串，只能是$x$的。

      记$x_n$小数点后第$n$位为$a_{nn}$，于是$n<j$时$d_n=a_{nn}$，$n=j$时$d_n=a_{nn}-1$，$n>j$时$a_{nn}=0$、$d_n=9$。可照造法，$a_{nn}=9$时$d_n=0$，别的时候$d_n=a_{nn}+1$，三种情形都对不上，所以$x$不等于任何一个$x_n$。从「两串数字不同」到「两个数不同」总要有理由：讲解靠只用$4$、$5$，这里靠约定和这一段证明。
  reference: |
    （1）$g(a)=\sigma(F_a(a))$，$g\in M$，$g\ne F_a$。例 1：$A=\N^+$，$B=\{0,1\}$，$\sigma(b)=1-b$，$F_n$是第$n$个数列。康托尔定理：$F_a=\mathbf 1_{f(a)}$，$g=\mathbf 1_D$。讲解造$x$：$B=\{4,5\}$，$x_n$不是只含$4$、$5$的小数时，$F_n$随便取（规定取全$5$的那一串，就是$d_n=4$）。

    （2）$|B|\ge2$。$|B|=1$时$|M|=1$，$F$必是满射。

    （3）$p:A\to C$单射。没有单射时可以满（$|A|=2$，$|C|=1$，$|B|=2$），也可以不满（$|A|=3$，$|C|=2$，$|B|=2$）。只要$M$里映射的个数不比$A$多就可能满。

    （4）$x_1=0.4999\cdots$，其余$0.999\cdots$，$x=0.5000\cdots=x_1$。约定以后不会：设$x=x_n$，两串不同，是同一个数的两种写法，照约定$x_n$末尾全是$0$，$x$末尾全是$9$；设第$j$位（整数部分算第$0$位）第一次不同，$n<j$时$d_n=a_{nn}$，$n=j$时$d_n=a_{nn}-1$，$n>j$时$a_{nn}=0$、$d_n=9$，都和造法矛盾。常见的漏洞：只说约定以后写法唯一，没看到约定管不到$x$（$x_n$都是$0.888\cdots$时$x=0.999\cdots$）；漏了整数部分就不同的情形（$x=0.999\cdots$，$x_n=1.000\cdots$）。

    一般的（1）是罗韦尔（Lawvere）不动点定理在集合里的样子：有满射$A\to B^A$，则每个$\sigma:B\to B$都有不动点；不要求知道。
