<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 344" width="600" height="344" font-size="18">
  <!-- 五个只含 4、5 的小数的前六位，一行一个；第 n 行第 n 位（对角线）加方框，依次是 5、5、4、5、5。每个方框往下有一条浅色的带子，通到最下面一行：那一行是 x，第 n 位是把方框里的数字换成另一个，依次是 4、4、5、4、4 -->
  <!-- 浅色的带子 -->
  <g style="fill: var(--accent, #2563eb)" fill-opacity="0.1">
    <rect x="133" y="78" width="34" height="218" />
    <rect x="185" y="120" width="34" height="176" />
    <rect x="237" y="162" width="34" height="134" />
    <rect x="289" y="204" width="34" height="92" />
    <rect x="341" y="246" width="34" height="50" />
  </g>
  <!-- 对角线上的方框 -->
  <g stroke-width="2" fill-opacity="0.2" style="fill: var(--accent, #2563eb); stroke: var(--accent, #2563eb)">
    <rect x="133" y="42" width="34" height="34" />
    <rect x="185" y="84" width="34" height="34" />
    <rect x="237" y="126" width="34" height="34" />
    <rect x="289" y="168" width="34" height="34" />
    <rect x="341" y="210" width="34" height="34" />
  </g>
  <!-- 最下面一行的方框 -->
  <g stroke-width="2" fill="none" style="stroke: var(--accent, #2563eb)">
    <rect x="133" y="296" width="34" height="34" />
    <rect x="185" y="296" width="34" height="34" />
    <rect x="237" y="296" width="34" height="34" />
    <rect x="289" y="296" width="34" height="34" />
    <rect x="341" y="296" width="34" height="34" />
  </g>
  <!-- 第几位 -->
  <g fill="currentColor" font-size="14" opacity="0.75">
    <text x="90" y="24" text-anchor="end">第几位</text>
    <text x="150" y="24" text-anchor="middle">1</text>
    <text x="202" y="24" text-anchor="middle">2</text>
    <text x="254" y="24" text-anchor="middle">3</text>
    <text x="306" y="24" text-anchor="middle">4</text>
    <text x="358" y="24" text-anchor="middle">5</text>
    <text x="410" y="24" text-anchor="middle">6</text>
  </g>
  <!-- 五行小数 -->
  <g fill="currentColor">
    <text x="90" y="66" text-anchor="end"><tspan font-style="italic">x</tspan>₁ =</text>
    <text x="110" y="66" text-anchor="middle">0.</text>
    <text x="150" y="66" text-anchor="middle">5</text>
    <text x="202" y="66" text-anchor="middle">4</text>
    <text x="254" y="66" text-anchor="middle">4</text>
    <text x="306" y="66" text-anchor="middle">5</text>
    <text x="358" y="66" text-anchor="middle">4</text>
    <text x="410" y="66" text-anchor="middle">4</text>
    <text x="458" y="66" text-anchor="middle">⋯</text>
    <text x="90" y="108" text-anchor="end"><tspan font-style="italic">x</tspan>₂ =</text>
    <text x="110" y="108" text-anchor="middle">0.</text>
    <text x="150" y="108" text-anchor="middle">4</text>
    <text x="202" y="108" text-anchor="middle">5</text>
    <text x="254" y="108" text-anchor="middle">5</text>
    <text x="306" y="108" text-anchor="middle">4</text>
    <text x="358" y="108" text-anchor="middle">5</text>
    <text x="410" y="108" text-anchor="middle">4</text>
    <text x="458" y="108" text-anchor="middle">⋯</text>
    <text x="90" y="150" text-anchor="end"><tspan font-style="italic">x</tspan>₃ =</text>
    <text x="110" y="150" text-anchor="middle">0.</text>
    <text x="150" y="150" text-anchor="middle">5</text>
    <text x="202" y="150" text-anchor="middle">5</text>
    <text x="254" y="150" text-anchor="middle">4</text>
    <text x="306" y="150" text-anchor="middle">4</text>
    <text x="358" y="150" text-anchor="middle">4</text>
    <text x="410" y="150" text-anchor="middle">5</text>
    <text x="458" y="150" text-anchor="middle">⋯</text>
    <text x="90" y="192" text-anchor="end"><tspan font-style="italic">x</tspan>₄ =</text>
    <text x="110" y="192" text-anchor="middle">0.</text>
    <text x="150" y="192" text-anchor="middle">4</text>
    <text x="202" y="192" text-anchor="middle">4</text>
    <text x="254" y="192" text-anchor="middle">5</text>
    <text x="306" y="192" text-anchor="middle">5</text>
    <text x="358" y="192" text-anchor="middle">4</text>
    <text x="410" y="192" text-anchor="middle">4</text>
    <text x="458" y="192" text-anchor="middle">⋯</text>
    <text x="90" y="234" text-anchor="end"><tspan font-style="italic">x</tspan>₅ =</text>
    <text x="110" y="234" text-anchor="middle">0.</text>
    <text x="150" y="234" text-anchor="middle">5</text>
    <text x="202" y="234" text-anchor="middle">4</text>
    <text x="254" y="234" text-anchor="middle">5</text>
    <text x="306" y="234" text-anchor="middle">4</text>
    <text x="358" y="234" text-anchor="middle">5</text>
    <text x="410" y="234" text-anchor="middle">5</text>
    <text x="458" y="234" text-anchor="middle">⋯</text>
  </g>
  <!-- 下面还有 -->
  <g fill="currentColor">
    <circle cx="68" cy="254" r="1.8" />
    <circle cx="68" cy="264" r="1.8" />
    <circle cx="68" cy="274" r="1.8" />
  </g>
  <!-- 新造的 x -->
  <g style="fill: var(--accent, #2563eb)">
    <text x="90" y="320" text-anchor="end"><tspan font-style="italic">x</tspan><tspan dx="3"> =</tspan></text>
    <text x="110" y="320" text-anchor="middle">0.</text>
    <text x="150" y="320" text-anchor="middle">4</text>
    <text x="202" y="320" text-anchor="middle">4</text>
    <text x="254" y="320" text-anchor="middle">5</text>
    <text x="306" y="320" text-anchor="middle">4</text>
    <text x="358" y="320" text-anchor="middle">4</text>
    <text x="410" y="320" text-anchor="middle">⋯</text>
    <text x="444" y="319" font-size="15">4 换成 5，5 换成 4</text>
  </g>
</svg>
