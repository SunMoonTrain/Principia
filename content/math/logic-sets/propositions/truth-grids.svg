<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 344" width="540" height="344" font-size="14">
  <!-- 六个 2×2 方格：左列 P 真、右列 P 假，上行 Q 真、下行 Q 假；涂色的格子是这个命题为真的情形 -->
  <!-- 涂色（先画，格线压在上面） -->
  <g style="fill: var(--accent, #2563eb); opacity: 0.35">
    <!-- 第一行：P -->
    <rect x="60" y="40" width="52" height="40" />
    <rect x="60" y="80" width="52" height="40" />
    <!-- 第一行：Q -->
    <rect x="240" y="40" width="52" height="40" />
    <rect x="292" y="40" width="52" height="40" />
    <!-- 第一行：P ∧ Q -->
    <rect x="420" y="40" width="52" height="40" />
    <!-- 第二行：P ∨ Q -->
    <rect x="60" y="202" width="52" height="40" />
    <rect x="112" y="202" width="52" height="40" />
    <rect x="60" y="242" width="52" height="40" />
    <!-- 第二行：¬(P ∧ Q) -->
    <rect x="292" y="202" width="52" height="40" />
    <rect x="240" y="242" width="52" height="40" />
    <rect x="292" y="242" width="52" height="40" />
    <!-- 第二行：¬P ∨ ¬Q -->
    <rect x="472" y="202" width="52" height="40" />
    <rect x="420" y="242" width="52" height="40" />
    <rect x="472" y="242" width="52" height="40" />
    <!-- 图例 -->
    <rect x="175" y="322" width="14" height="14" />
  </g>
  <!-- 格线 -->
  <g fill="none" stroke="currentColor">
    <rect x="60" y="40" width="104" height="80" stroke-width="1.5" />
    <line x1="112" y1="40" x2="112" y2="120" />
    <line x1="60" y1="80" x2="164" y2="80" />
    <rect x="240" y="40" width="104" height="80" stroke-width="1.5" />
    <line x1="292" y1="40" x2="292" y2="120" />
    <line x1="240" y1="80" x2="344" y2="80" />
    <rect x="420" y="40" width="104" height="80" stroke-width="1.5" />
    <line x1="472" y1="40" x2="472" y2="120" />
    <line x1="420" y1="80" x2="524" y2="80" />
    <rect x="60" y="202" width="104" height="80" stroke-width="1.5" />
    <line x1="112" y1="202" x2="112" y2="282" />
    <line x1="60" y1="242" x2="164" y2="242" />
    <rect x="240" y="202" width="104" height="80" stroke-width="1.5" />
    <line x1="292" y1="202" x2="292" y2="282" />
    <line x1="240" y1="242" x2="344" y2="242" />
    <rect x="420" y="202" width="104" height="80" stroke-width="1.5" />
    <line x1="472" y1="202" x2="472" y2="282" />
    <line x1="420" y1="242" x2="524" y2="242" />
    <rect x="175" y="322" width="14" height="14" stroke-width="1" />
  </g>
  <!-- 每行第一个方格上的行列标签 -->
  <g fill="currentColor">
    <text x="86" y="28" text-anchor="middle"><tspan font-style="italic">P</tspan> 真</text>
    <text x="138" y="28" text-anchor="middle"><tspan font-style="italic">P</tspan> 假</text>
    <text x="52" y="65" text-anchor="end"><tspan font-style="italic">Q</tspan> 真</text>
    <text x="52" y="105" text-anchor="end"><tspan font-style="italic">Q</tspan> 假</text>
    <text x="86" y="190" text-anchor="middle"><tspan font-style="italic">P</tspan> 真</text>
    <text x="138" y="190" text-anchor="middle"><tspan font-style="italic">P</tspan> 假</text>
    <text x="52" y="227" text-anchor="end"><tspan font-style="italic">Q</tspan> 真</text>
    <text x="52" y="267" text-anchor="end"><tspan font-style="italic">Q</tspan> 假</text>
  </g>
  <!-- 标题 -->
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="112" y="146" font-style="italic">P</text>
    <text x="292" y="146" font-style="italic">Q</text>
    <text x="472" y="146"><tspan font-style="italic">P</tspan> ∧ <tspan font-style="italic">Q</tspan></text>
    <text x="112" y="308"><tspan font-style="italic">P</tspan> ∨ <tspan font-style="italic">Q</tspan></text>
    <text x="292" y="308">¬(<tspan font-style="italic">P</tspan> ∧ <tspan font-style="italic">Q</tspan>)</text>
    <text x="472" y="308">¬<tspan font-style="italic">P</tspan> ∨ ¬<tspan font-style="italic">Q</tspan></text>
  </g>
  <text x="197" y="334" fill="currentColor">涂色：这个命题为真的情形</text>
</svg>
