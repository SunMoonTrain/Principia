<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 264" width="624" height="264" font-size="14">
  <!-- 左图三个椭圆 A = {1, 2, 3}、B = {p, q, r}、C = {u, v, w}，f：1、2 ↦ p，3 ↦ q；g：p ↦ v，q ↦ u，r ↦ w。右图是 g∘f：1、2 ↦ v，3 ↦ u。从 3 出发的一路（3 → q → u，3 → u）用强调色 -->
  <!-- 椭圆 -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <ellipse cx="58" cy="140" rx="27" ry="62" />
    <ellipse cx="188" cy="140" rx="27" ry="62" />
    <ellipse cx="318" cy="140" rx="27" ry="62" />
    <ellipse cx="446" cy="140" rx="27" ry="62" />
    <ellipse cx="566" cy="140" rx="27" ry="62" />
  </g>
  <!-- 集合的名字，和名字之间的箭头 -->
  <g fill="currentColor" font-size="16" font-style="italic" text-anchor="middle">
    <text x="58" y="45">A</text>
    <text x="188" y="45">B</text>
    <text x="318" y="45">C</text>
    <text x="446" y="45">A</text>
    <text x="566" y="45">C</text>
    <text x="123" y="28">f</text>
    <text x="253" y="28">g</text>
    <text x="506" y="28">g<tspan font-style="normal"> ∘ </tspan>f</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="74" y1="40" x2="163.5" y2="40" />
    <line x1="204" y1="40" x2="293.5" y2="40" />
    <line x1="462" y1="40" x2="541.5" y2="40" />
  </g>
  <g fill="currentColor">
    <polygon points="172,40 163.5,43.6 163.5,36.4" />
    <polygon points="302,40 293.5,43.6 293.5,36.4" />
    <polygon points="550,40 541.5,43.6 541.5,36.4" />
  </g>
  <!-- 元素之间的箭头 -->
  <g stroke="currentColor" stroke-width="1.4">
    <line x1="68" y1="106" x2="167.5" y2="103.24" />
    <line x1="68" y1="140" x2="167.83" y2="111.35" />
    <line x1="198" y1="106" x2="297.89" y2="137.45" />
    <line x1="198" y1="174" x2="297.5" y2="174" />
    <line x1="456" y1="106" x2="545.9" y2="134.44" />
    <line x1="456" y1="140" x2="545.5" y2="142.74" />
  </g>
  <g fill="currentColor">
    <polygon points="176,103 167.6,106.83 167.4,99.64" />
    <polygon points="176,109 168.82,114.81 166.84,107.88" />
    <polygon points="306,140 296.81,140.88 298.97,134.01" />
    <polygon points="306,174 297.5,177.6 297.5,170.4" />
    <polygon points="554,137 544.81,137.87 546.98,131" />
    <polygon points="554,143 545.39,146.34 545.61,139.14" />
  </g>
  <!-- 从 3 出发的一路：强调色 -->
  <g stroke-width="2" style="stroke: var(--accent, #2563eb)">
    <line x1="68" y1="174" x2="167.89" y2="142.55" />
    <line x1="198" y1="140" x2="297.89" y2="108.55" />
    <line x1="456" y1="174" x2="547.02" y2="110.85" />
  </g>
  <g style="fill: var(--accent, #2563eb)">
    <polygon points="176,140 168.97,145.99 166.81,139.12" />
    <polygon points="306,106 298.97,111.99 296.81,105.12" />
    <polygon points="554,106 549.07,113.8 544.96,107.89" />
  </g>
  <!-- 元素 -->
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="58" y="111">1</text>
    <text x="58" y="145">2</text>
    <text x="188" y="111" font-style="italic">p</text>
    <text x="188" y="179" font-style="italic">r</text>
    <text x="318" y="145" font-style="italic">v</text>
    <text x="318" y="179" font-style="italic">w</text>
    <text x="446" y="111">1</text>
    <text x="446" y="145">2</text>
    <text x="566" y="145" font-style="italic">v</text>
    <text x="566" y="179" font-style="italic">w</text>
  </g>
  <g font-size="15" text-anchor="middle" style="fill: var(--accent, #2563eb)">
    <text x="58" y="179">3</text>
    <text x="188" y="145" font-style="italic">q</text>
    <text x="318" y="111" font-style="italic">u</text>
    <text x="446" y="179">3</text>
    <text x="566" y="111" font-style="italic">u</text>
  </g>
  <!-- 图下面的说明 -->
  <g fill="currentColor" text-anchor="middle">
    <text x="188" y="230">先做 <tspan font-style="italic">f</tspan>，再做 <tspan font-style="italic">g</tspan>：走两步</text>
    <text x="506" y="230"><tspan font-style="italic">g</tspan> ∘ <tspan font-style="italic">f</tspan>：一步走到</text>
  </g>
  <g text-anchor="middle" style="fill: var(--accent, #2563eb)">
    <text x="188" y="253">3 先到 <tspan font-style="italic">q</tspan>，再到 <tspan font-style="italic">u</tspan></text>
    <text x="506" y="253">3 直接到 <tspan font-style="italic">u</tspan></text>
  </g>
</svg>
