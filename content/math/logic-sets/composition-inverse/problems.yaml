- id: p1
  tier: easy
  statement: |
    设$f:\R\to\R$，$f(x)=2x-1$；$g:\R\to\R$，$g(x)=x^2+1$。求$(g\circ f)(2)$和$(f\circ g)(2)$，按（前者，后者）的顺序填。
  answer:
    type: tuple
    value: [10, 9]
    exact: true
  hints:
    - |
      $g\circ f$先做的是哪一个？
    - |
      先做的写在右边：$(g\circ f)(2)=g(f(2))$，先算$f(2)$，再把结果代进$g$；$(f\circ g)(2)$先算$g(2)$，再代进$f$。
    - |
      $f(2)=3$，所以$(g\circ f)(2)=g(3)=3^2+1=10$。$g(2)=5$，所以$(f\circ g)(2)=f(5)=2\times5-1=9$。填$(10,9)$。
  solution: |
    先做的写在右边。$(g\circ f)(2)=g(f(2))$，$f(2)=3$，$g(3)=10$；$(f\circ g)(2)=f(g(2))$，$g(2)=5$，$f(5)=9$。答案是$(10,9)$，次序读反了就会填成$(9,10)$。

- id: p2
  tier: easy
  statement: |
    已知$f:\R\to\R$，$f(x)=x^3+2x$是:term[双射]{id="math.logic-sets.bijective"}。求$f^{-1}(33)$和$f^{-1}(-72)$，按（前者，后者）的顺序填。
  answer:
    type: tuple
    value: [3, -4]
    exact: true
  hints:
    - |
      $f^{-1}(33)$就是被$f$送到$33$的那个数；不用写出$f^{-1}$的式子，它也不是$\frac1{f(33)}$。
    - |
      要解$x^3+2x=33$和$x^3+2x=-72$，拿几个整数试一试。$f$是双射，试到一个解，它就是唯一的解。
    - |
      $3^3+2\times3=33$，即$f(3)=33$，所以$f^{-1}(33)=3$。$(-4)^3+2\times(-4)=-72$，即$f(-4)=-72$，所以$f^{-1}(-72)=-4$。填$(3,-4)$。
  solution: |
    $f^{-1}(y)$是方程$f(x)=y$的唯一解。$f(3)=27+6=33$，所以$f^{-1}(33)=3$；$f(-4)=-64-8=-72$，所以$f^{-1}(-72)=-4$。答案是$(3,-4)$，求这两个值用不着写出$f^{-1}$的式子。

- id: p3
  tier: medium
  statement: |
    设$f:A\to B$，$g:B\to C$。不管$A$、$B$、$C$、$f$、$g$怎样取，下面哪些一定成立？
  answer:
    type: choice
    multiple: true
    options:
      - |
        若$g\circ f$是单射，则$g$是单射
      - |
        若$g\circ f$是单射，则$f$是单射
      - |
        若$g\circ f$是满射，则$f$是满射
      - |
        若$g\circ f$是满射，则$g$是满射
      - |
        若$g\circ f$是单射，并且$f$是满射，则$g$是双射
    value: [2, 4]
  hints:
    - |
      成立的，照:term[单射]{id="math.logic-sets.injective"}、:term[满射]{id="math.logic-sets.surjective"}的定义证；不成立的，用只有一两个元素的集合找反例（counterexample）。$g\circ f$只用到$g$在$f$的:term[像集]{id="math.logic-sets.range"}（range）的元素处的取值。
    - |
      选项 B：设$f(x_1)=f(x_2)$，两边用$g$送过去。选项 D：$C$中的$z=g(f(x))$，它是$B$的哪个元素在$g$下的像？选项 A、C：取$A=C=\{1\}$，$B=\{1,2\}$。选项 E：$g$是单射推不推得出来，是满射呢？
    - |
      选项 B 成立：设$f(x_1)=f(x_2)$，则$g(f(x_1))=g(f(x_2))$，$g\circ f$是单射，所以$x_1=x_2$。选项 D 成立：任取$z\in C$，有$x\in A$使$g(f(x))=z$，$z$就是$f(x)$在$g$下的像。选项 A、C 不一定：取$A=C=\{1\}$，$B=\{1,2\}$，$f(1)=1$，$g$把$1$、$2$都送到$1$，则$g\circ f=\mathrm{id}_A$，$g$不是单射，$f$不是满射。

      选项 E 不一定。这时$g$确实是单射：设$g(y_1)=g(y_2)$，$f$是满射，可以写$y_1=f(x_1)$，$y_2=f(x_2)$，由$g\circ f$是单射得$x_1=x_2$，所以$y_1=y_2$。可$g$未必是满射，取$A=B=\{1\}$，$C=\{1,2\}$，$f(1)=1$，$g(1)=1$就看得出来。所以选 B、D。
  solution: |
    选项 B 成立：$f(x_1)=f(x_2)$时，两边用$g$送过去，$g\circ f$是单射，所以$x_1=x_2$。选项 D 成立：$g\circ f$是满射，$C$的每个元素$z$都能写成$g(f(x))$，它是$f(x)$在$g$下的像。选项 A、C 不一定成立：$A=C=\{1\}$，$B=\{1,2\}$，$f(1)=1$，$g(1)=g(2)=1$时，$g\circ f$是恒等映射，$g$却不是单射，$f$却不是满射。

    选项 E 不一定成立：由条件能推出$g$是单射（$B$的元素都能写成$f(x)$），推不出$g$是满射，例如$A=B=\{1\}$，$C=\{1,2\}$，$f(1)=g(1)=1$。选 B、D。先做的$f$管单射，后做的$g$管满射，中间的$B$里多出来的元素，$g\circ f$看不见。

- id: p4
  tier: medium
  statement: |
    （1）$f:\{1,2,3\}\to\{1,2,3,4,5\}$，$f(1)=2$，$f(2)=5$，$f(3)=1$。$f$有几个左逆？

    （2）$f:\{1,2,3,4,5,6\}\to\{1,2,3\}$，$f(1)=1$，$f(2)=f(3)=2$，$f(4)=f(5)=f(6)=3$。$f$有几个右逆？

    按（左逆的个数，右逆的个数）的顺序填。
  answer:
    type: tuple
    value: [9, 6]
    exact: true
  hints:
    - |
      左逆$g$要使每个$x$都有$g(f(x))=x$，:term[右逆]{id="math.logic-sets.right-inverse"}$h$要使每个$y$都有$f(h(y))=y$。逐个元素看：它的去处是定死了，还是可以挑？
    - |
      （1）$g:\{1,2,3,4,5\}\to\{1,2,3\}$要满足$g(2)=1$，$g(5)=2$，$g(1)=3$，$3$和$4$呢？（2）$h:\{1,2,3\}\to\{1,2,3,4,5,6\}$要满足$f(h(y))=y$，$h(1)$、$h(2)$、$h(3)$各有几种挑法？
    - |
      （1）$g(2)$、$g(5)$、$g(1)$定死了；$3$、$4$不是像，$g(3)$、$g(4)$各有$3$种取法，由乘法原理（multiplication principle），左逆有$3\times3=9$个。（2）$h(1)$只能取$1$，$h(2)$可以取$2$、$3$，$h(3)$可以取$4$、$5$、$6$，右逆有$1\times2\times3=6$个。填$(9,6)$。
  solution: |
    （1）左逆$g:\{1,2,3,4,5\}\to\{1,2,3\}$要使每个$x$都有$g(f(x))=x$，所以$g(2)=1$，$g(5)=2$，$g(1)=3$；$3$、$4$不是像，$g(3)$、$g(4)$没有限制，各有$3$种取法。由乘法原理（multiplication principle），左逆有$3\times3=9$个。

    （2）右逆$h:\{1,2,3\}\to\{1,2,3,4,5,6\}$要使每个$y$都有$f(h(y))=y$，就是给每个$y$挑一个被送到$y$的元素，分别有$1$、$2$、$3$种挑法，右逆有$1\times2\times3=6$个。答案是$(9,6)$：左逆的自由在不是像的元素上，右逆的自由在有同一个像的几个元素里。

- id: p5
  tier: hard
  statement: |
    （1）设$f:A\to B$、$g:B\to C$都是:term[单射]{id="math.logic-sets.injective"}，证明$g\circ f$是单射；都是:term[满射]{id="math.logic-sets.surjective"}时，证明$g\circ f$是满射。

    （2）设$f:A\to B$，$g:B\to C$，$h:C\to D$，并且$g\circ f$和$h\circ g$都是:term[双射]{id="math.logic-sets.bijective"}。证明$f$、$g$、$h$都是双射。

    （3）设$f:A\to A$满足$f\circ f\circ f=f$。证明：$f$是单射，当且仅当$f$是满射。再举一个满足这个等式、却既不是单射也不是满射的$f$。
  hints:
    - |
      （1）照定义一层一层地推。（2）先看中间的$g$：$g\circ f$、$h\circ g$是双射，各说出了$g$的什么？（3）等式就是$f(f(f(x)))=f(x)$，$f$是单射时，最外面的$f$能不能去掉？$f$是满射时，任一元素都能写成$f(x)$。
    - |
      （1）单射：由$g(f(x_1))=g(f(x_2))$，先用$g$是单射，再用$f$是单射；满射：任取$z\in C$，先在$B$里找，再到$A$里找。

      （2）$C$的每个元素都能写成$g(f(x))$，所以$g$是满射；$g(y_1)=g(y_2)$时两边用$h$送过去，所以$g$是单射。有了$g^{-1}$，就有$f=g^{-1}\circ(g\circ f)$，$h$同样。

      （3）单射、满射两种情形，都推出$f\circ f=\mathrm{id}_A$。
    - |
      （1）设$f$、$g$都是单射，$g(f(x_1))=g(f(x_2))$。$g$是单射，所以$f(x_1)=f(x_2)$；$f$是单射，所以$x_1=x_2$，$g\circ f$是单射。设$f$、$g$都是满射，任取$z\in C$，有$y\in B$使$g(y)=z$，又有$x\in A$使$f(x)=y$。于是$g(f(x))=z$，$g\circ f$是满射。

      （2）先看$g$。任取$z\in C$，$g\circ f$是满射，有$x\in A$使$g(f(x))=z$，$z$是$f(x)$在$g$下的像，所以$g$是满射。设$g(y_1)=g(y_2)$，两边用$h$送过去，得$h(g(y_1))=h(g(y_2))$，$h\circ g$是单射，所以$y_1=y_2$，$g$是单射。于是$g$是双射，它有逆映射$g^{-1}$，$g^{-1}$也是双射。

      由结合律和:term[恒等映射]{id="math.logic-sets.identity-map"}的性质，$g^{-1}\circ(g\circ f)=(g^{-1}\circ g)\circ f=f$，$(h\circ g)\circ g^{-1}=h\circ(g\circ g^{-1})=h$。所以$f$、$h$都是两个双射的复合，由讲解里的定理，它们是双射。

      （3）设$f$是单射。对每个$x\in A$，$f(f(f(x)))=f(x)$，最外面的$f$是单射，所以$f(f(x))=x$，即$f\circ f=\mathrm{id}_A$。$f$有逆映射，就是它自己，所以$f$是双射，当然是满射。

      反过来，设$f$是满射。任取$y\in A$，有$x\in A$使$f(x)=y$，则$f(f(y))=f(f(f(x)))$，由条件它等于$f(x)$，即$f(f(y))=y$。所以又有$f\circ f=\mathrm{id}_A$，$f$是双射，当然是单射。$A$至少有两个元素时，:term[常值映射]{id="math.logic-sets.constant-map"}（constant map）$f$满足$f\circ f\circ f=f$，它既不是单射，也不是满射。
  reference: |
    （1）单射：$g(f(x_1))=g(f(x_2))\Rightarrow f(x_1)=f(x_2)\Rightarrow x_1=x_2$。满射：$z=g(y)$，$y=f(x)$，$z=g(f(x))$。

    （2）$g\circ f$满给$g$满，$h\circ g$单给$g$单，所以$g$双，$f=g^{-1}\circ(g\circ f)$、$h=(h\circ g)\circ g^{-1}$是双射的复合。不经$g^{-1}$也行：$g\circ f$单给$f$单；任取$y$，由$g\circ f$满有$x$使$g(f(x))=g(y)$，由$g$单$f(x)=y$，$f$满；$h$同样。

    （3）单：$f(f(f(x)))=f(x)\Rightarrow f(f(x))=x$；满：$y=f(x)$，$f(f(y))=f(f(f(x)))=f(x)=y$。两种情形都有$f\circ f=\mathrm{id}_A$，$f$是双射。例子：常值映射（$A$至少两个元素），或任何$f\circ f=f$而$f\ne\mathrm{id}_A$的$f$。

- id: p6
  tier: hard
  statement: |
    （1）设$A$不是:term[空集]{id="math.logic-sets.empty-set"}（empty set），$f:A\to B$。证明：$f$是单射，当且仅当$f$有左逆。

    （2）证明：$f:A\to B$有:term[右逆]{id="math.logic-sets.right-inverse"}时，$f$是满射。反过来，设$A\subseteq\N$，$f:A\to B$是满射，用[良序原理](lesson:math.logic-sets.induction#def-well-ordering)（well-ordering principle）证明$f$有右逆。

    （3）设$f:A\to B$是满射，$B$恰有$n$个元素，$n$是正整数，$A$可以有无穷多个元素。对$n$用[数学归纳法](lesson:math.logic-sets.induction#def-induction)（mathematical induction）证明$f$有右逆。

    （4）在（2）和（3）里，都要给$B$的每个元素$y$挑一个被送到$y$的元素，各靠什么，才用不着选择公理？
  hints:
    - |
      （1）有左逆时，把$f(x_1)=f(x_2)$两边用左逆送回去；反过来要造出$g:B\to A$，是像的$y$送回哪里，不是像的$y$呢？（2）从一些自然数里，可以按什么规矩挑出一个？（3）从$B$里去掉一个元素，$A$里要跟着去掉哪些？
    - |
      （1）取定$a_0\in A$，不是像的$y$都送到$a_0$。（2）令$h(y)$为满足$f(x)=y$的最小的$x$；良序原理说的是正整数，把自然数都加$1$就化过去了。

      （3）取定$b\in B$，令$A_1=\{x\in A:f(x)\ne b\}$，$B_1=B\setminus\{b\}$，$f$把$A_1$的元素送进$B_1$，还取遍了$B_1$。对它用:term[归纳假设]{id="math.logic-sets.induction-hypothesis"}（induction hypothesis），再补上$b$的去处。（4）比较「一口气说清的规矩」和「挑有限次」。
    - |
      （1）设$f$有左逆$g$，并且$f(x_1)=f(x_2)$。两边用$g$送回去，左边得$x_1$，右边得$x_2$，所以$x_1=x_2$，$f$是单射。反过来，设$f$是单射，取定$a_0\in A$。规定$g:B\to A$：$y$是像时，使$f(x)=y$的$x$恰有一个，令$g(y)$为它；$y$不是像时，令$g(y)=a_0$。

      对每个$x\in A$，$g(f(x))$是被送到$f(x)$的那个元素，就是$x$，所以$g\circ f=\mathrm{id}_A$，$g$是左逆。条件「$A$不是空集」去不掉：$A=\varnothing$而$B$不空时，$f$是单射，可一个$B\to A$的映射也没有。

      （2）设$f$有右逆$h$。任取$y\in B$，$y=f(h(y))$是$h(y)$的像，所以$f$是满射。反过来，设$A\subseteq\N$，$f$是满射，则对每个$y\in B$，$\{x\in A:f(x)=y\}$是由自然数组成的非空集合。把其中的数都加$1$，得到由正整数组成的非空集合，由良序原理，它有最小的数，减去$1$就是原来最小的数。

      令$h(y)$为满足$f(x)=y$的最小的$x$，则$h:B\to A$，并且$f(h(y))=y$，$h$是$f$的右逆。

      （3）对$n$归纳，证明：$B$恰有$n$个元素时，任何满射$f:A\to B$都有右逆。$n=1$时$B=\{b\}$，$f$是满射，有$a\in A$使$f(a)=b$，令$h(b)=a$就行。设$n$时成立，$B$有$n+1$个元素。取定$b\in B$，令$A_1=\{x\in A:f(x)\ne b\}$，$B_1=B\setminus\{b\}$，$f_1:A_1\to B_1$，$x\mapsto f(x)$。

      $B_1$的每个元素都是$A$中某个元素的像，这个元素不被送到$b$，所以在$A_1$里，$f_1$是满射。由:term[归纳假设]{id="math.logic-sets.induction-hypothesis"}（induction hypothesis），$f_1$有右逆$h_1:B_1\to A_1$。再取$a\in A$使$f(a)=b$，规定$h(b)=a$，$y\in B_1$时$h(y)=h_1(y)$。每个$y\in B$都有$f(h(y))=y$，$h$是$f$的右逆。

      （4）第（2）问靠一条一口气说清的规矩：取最小的，不必一个一个去挑。第（3）问只挑了$n$次，每次从一个非空集合里取一个元素，挑得完。一般的满射，$B$可以有无穷多个元素，也不一定有这样的规矩；两样都靠不上时，就靠选择公理，见[选择公理与佐恩引理](lesson:math.logic-sets.axiom-of-choice)。
  reference: |
    （1）（⇐）$x_1=g(f(x_1))=g(f(x_2))=x_2$。（⇒）取$a_0\in A$，$y=f(x)$时$g(y)=x$（单射保证$x$唯一），否则$g(y)=a_0$，$g(f(x))=x$。$A=\varnothing\ne B$时单射却没有左逆。

    （2）右逆给满射：$y=f(h(y))$。反过来令$h(y)=\min\{x\in A:f(x)=y\}$，集合非空因为$f$满，$\min$存在由良序原理（平移$1$）。

    （3）对$n$归纳，命题对任意的$A$、$B$、$f$说。$n=1$取一个$a$。由$n$推$n+1$：$f_1:A_1\to B_1$满，归纳假设给$h_1$，补$h(b)=a$。关键是$f_1$仍是满射：$y\ne b$时，被送到$y$的元素不被送到$b$。

    （4）第（2）问有统一的规则（最小的）；第（3）问只取有限次（每次从一个非空集合取一个元素，归纳）。一般情形是无穷多次没有规则的挑选，正是选择公理。

- id: p7
  tier: thinking
  statement: |
    设$f:A\to A$。

    （1）若$f$和每个:term[常值映射]{id="math.logic-sets.constant-map"}（constant map）$c:A\to A$都可以交换次序，即$f\circ c=c\circ f$，$f$是什么映射？

    （2）把「每个常值映射」换成「每个:term[双射]{id="math.logic-sets.bijective"}$A\to A$」。$A$恰有两个元素时，$f$有哪几种可能？恰有三个元素时呢？

    （3）两个元素的情形为什么特别？$A$的元素更多（包括无穷多个）时，结论是什么？
  hints:
    - |
      （1）设$c$总取$a$，把$f\circ c$和$c\circ f$的值都写出来。（2）两个元素的集合到自己的双射只有两个，映射只有四个，逐个试。（3）若$f(x)=y\ne x$，能不能找一个双射，不动$x$，却挪动$y$？
    - |
      （1）$f\circ c$总取$f(a)$，$c\circ f$总取$a$。（2）三个元素时，假如$f(1)=2$，取不动$1$、对调$2$和$3$的双射$\sigma$，比较$f(\sigma(1))$和$\sigma(f(1))$。（3）不动$x$又要挪动$y$，得有第三个元素$z$来和$y$对调。
    - |
      （1）$f$是:term[恒等映射]{id="math.logic-sets.identity-map"}。任取$a\in A$，设$c$总取$a$，则$f\circ c$总取$f(a)$，$c\circ f$总取$a$，两者相等，所以$f(a)=a$。每个$a$都这样，$f=\mathrm{id}_A$；反过来，$\mathrm{id}_A$和每个映射都可以交换次序。

      （2）先设$A=\{1,2\}$，双射只有$\mathrm{id}_A$和对调$1$、$2$的$\sigma$，要紧的是$f\circ\sigma=\sigma\circ f$。$f=\mathrm{id}_A$、$f=\sigma$都满足；$f$总取$1$时，$f(\sigma(1))=1$，$\sigma(f(1))=2$，不满足，$f$总取$2$时同样。从$A$到$A$的映射就这四个，所以$f$是$\mathrm{id}_A$或$\sigma$。

      再设$A=\{1,2,3\}$。假如$f(1)=2$，取不动$1$、对调$2$和$3$的双射$\sigma$，则$f(\sigma(1))=f(1)=2$，$\sigma(f(1))=\sigma(2)=3$，矛盾。假如$f(1)=3$，还是这个$\sigma$，$f(\sigma(1))=3$，$\sigma(f(1))=2$，也矛盾。所以$f(1)=1$，对$2$、$3$同样论证，$f$只能是$\mathrm{id}_A$。

      （3）上面的论证是：若$f(x)=y\ne x$，找一个双射不动$x$，却把$y$挪走。挪走$y$就要有第三个元素$z$和它对调；只有两个元素时没有$z$，不动$x$的双射也只好不动$y$，论证做不下去，对调两个元素的$\sigma$就留了下来。

      $A$至少有三个元素（包括无穷多个）时，取不同于$x$、$y$的$z$，令$\sigma$对调$y$和$z$、别的元素都不动，它是双射，因为$\sigma\circ\sigma=\mathrm{id}_A$。这时$f(\sigma(x))=y$，$\sigma(f(x))=z$，矛盾。所以$f$只能是恒等映射；$A$至多有一个元素时，$A\to A$的映射本来只有恒等映射一个。
  reference: |
    （1）$f\circ c$总取$f(a)$，$c\circ f$总取$a$，所以$f(a)=a$，$f=\mathrm{id}_A$（$A$空时也对）。

    （2）$|A|=2$：$\mathrm{id}_A$和对调；两个常值映射不行。$|A|=3$：只有$\mathrm{id}_A$，$f(x)=y\ne x$时用不动$x$、对调$y$和第三个元素的$\sigma$，$f(\sigma(x))=y\ne z=\sigma(f(x))$。

    （3）要有第三个元素$z$才有「不动$x$而挪动$y$」的双射；两个元素时没有。至少三个元素（含无穷）时只有恒等映射，同一个论证。用群的话说，对称群在元素不少于三个时中心只有单位元，这里对一般的映射$f$也成立。

- id: p8
  tier: thinking
  statement: |
    $a\ne0$时，由$ab=ac$可以消去$a$，得$b=c$。映射的复合也可以问「能不能消去」。

    （1）设$f:A\to B$是:term[单射]{id="math.logic-sets.injective"}，$g,h:X\to A$满足$f\circ g=f\circ h$。证明$g=h$。

    （2）反过来，若对每个集合$X$和任意的$g,h:X\to A$，由$f\circ g=f\circ h$都能推出$g=h$，证明$f$是单射。只让$X$取恰有一个元素的集合，够不够？

    （3）:term[满射]{id="math.logic-sets.surjective"}有没有类似的说法，$f$要放在哪一边？写出来并证明。这时检验用的集合只取恰有一个元素的，还够不够？

    （4）数的乘法里，从左边消和从右边消是一回事，映射的复合为什么不是？
  hints:
    - |
      （1）比较两边在每个$t\in X$处的值。（2）从恰有一个元素的集合到$A$的映射，就是在$A$里挑一个元素。（3）把$f$换到先做的一边，$g,h$改从$B$出发；$f$漏掉了$B$的一个元素时，能不能造出两个不同的映射，偏偏只在那里不同？
    - |
      （2）设$f(x_1)=f(x_2)$，取$X=\{t\}$，$g(t)=x_1$，$h(t)=x_2$。（3）满射时，由$g\circ f=h\circ f$推出$g=h$，这里$g,h:B\to Y$；不是满射时取$Y=\{0,1\}$。到恰有一个元素的集合的映射有几个？（4）看$f$放在左边、放在右边，各怕它出什么毛病。
    - |
      （1）对每个$t\in X$，$f(g(t))=f(h(t))$，$f$是单射，所以$g(t)=h(t)$。$g$、$h$的定义域都是$X$，陪域都是$A$，又逐点相等，所以$g=h$。

      （2）设$f(x_1)=f(x_2)$。取$X=\{t\}$，令$g(t)=x_1$，$h(t)=x_2$，则$f\circ g$、$f\circ h$都把$t$送到同一个元素，$f\circ g=f\circ h$。由条件$g=h$，即$x_1=x_2$，$f$是单射。证明只用到恰有一个元素的$X$，所以够了。

      （3）$f$放在右边：$f:A\to B$是满射，当且仅当对每个集合$Y$和任意的$g,h:B\to Y$，由$g\circ f=h\circ f$都能推出$g=h$。设$f$是满射，$g\circ f=h\circ f$。任取$y\in B$，有$x\in A$使$f(x)=y$，$g(f(x))=h(f(x))$就是$g(y)=h(y)$，所以$g=h$。

      反过来，设$f$不是满射，有$b\in B$不是像。取$Y=\{0,1\}$，令$g$总取$0$，$h$在$b$处取$1$、别处取$0$。$f$的值都不是$b$，所以$g\circ f=h\circ f$，可$g\ne h$，推不出来。

      $Y$取恰有两个元素的集合就够，只取恰有一个元素的不够：从$B$到那样的集合只有一个映射，$g=h$总成立，什么也检验不出来。一头是在$A$里挑元素，一头是给$B$的元素分类，要有两类才分得开。

      （4）$ab=ba$，左边、右边没有分别。复合一般不能交换次序：$f$放在左边是后做，怕它把不同的元素送到一处，不出这个毛病就是单射；$f$放在右边是先做，怕它漏掉$B$的元素，不出这个毛病就是满射。两边都能消去，$f$就是双射，有逆映射，正像$a\ne0$时$a$有倒数。
  reference: |
    （1）逐点用单射。（2）取$X=\{t\}$，$g(t)=x_1$，$h(t)=x_2$，一个元素的集合就够：它到$A$的映射就是$A$的元素。

    （3）$f$满$\iff$对任意$Y$和$g,h:B\to Y$，$g\circ f=h\circ f\Rightarrow g=h$。（⇒）$g(y)=g(f(x))=h(f(x))=h(y)$。（⇐）$b$不是像，$Y=\{0,1\}$，$g$恒为$0$，$h$只在$b$处为$1$。一个元素的$Y$不够（到它的映射只有一个），两个元素的就够。

    （4）乘法可交换，复合一般不可交换。左消去管的是「不合并」（单射），右消去管的是「不遗漏」（满射），两者独立；都成立就是双射、有逆。范畴论里叫单态射、满态射，这里不引。
