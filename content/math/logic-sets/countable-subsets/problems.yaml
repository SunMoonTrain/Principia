- id: p1
  tier: easy
  statement: |
    设$A=\{n\in\N:3\mid n\text{ 或 }5\mid n\}$（$0$也在内），$\varphi:A\to\N$是讲解里证明$\N$的无限子集与$\N$等势时用的映射。求$\varphi(45)$，再求满足$\varphi(a)=30$的$a$，按（前者，后者）的顺序填。
  answer:
    type: tuple
    value: [21, 65]
    exact: true
  hints:
    - |
      $\varphi(45)$数的是$A$中比$45$小的数有几个，$45$自己不算，$0$要算。后一问反过来，要找前面恰有$30$个数的那一个。
    - |
      比$45$小的自然数里，$3$的倍数、$5$的倍数各有几个？$15$的倍数两边都数到了。后一问可以每$15$个数分成一段，先数$0$到$14$里有几个属于$A$。
    - |
      比$45$小的自然数里，$3$的倍数有$15$个（$0,3,\dots,42$），$5$的倍数有$9$个（$0,5,\dots,40$），$15$的倍数有$3$个（$0,15,30$），所以$\varphi(45)=15+9-3=21$。$0$到$14$里属于$A$的是$0,3,5,6,9,10,12$，共$7$个，以后每$15$个数里也有$7$个。$0$到$59$一共有$28$个，接下去是$60$、$63$、$65$，$65$的前面恰有$30$个，所以$a=65$。填$(21,65)$。
  solution: |
    $A$中比$45$小的数，$3$的倍数有$15$个，$5$的倍数有$9$个，$15$的倍数数了两遍，有$3$个，所以$\varphi(45)=15+9-3=21$。漏了$0$会得到$20$，把$45$自己也算进去会得到$22$。

    每$15$个数一段，各段里属于$A$的都是$7$个，$0$到$14$里是$0,3,5,6,9,10,12$。$0$到$59$有$4\times7=28$个，往后依次是$60$、$63$、$65$，它们的$\varphi$值是$28$、$29$、$30$，所以$a=65$。答案是$(21,65)$。

- id: p2
  tier: easy
  statement: |
    下面哪些集合是:term[可数集]{id="math.logic-sets.countable-set"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        平面上圆心的两个坐标和半径都是有理数的圆，全体组成的集合
      - |
        既是平方数又是立方数的正整数，全体组成的集合
      - |
        分子、分母都是不超过$100$的正整数的分数，它们表示的数组成的集合
      - |
        $\{x\in\R:x^2\in\Q\}$
      - |
        十进制写法里各位数字互不相同的正整数，全体组成的集合
    value: [1, 2, 4]
  hints:
    - |
      可数集不包括:term[有限集]{id="math.logic-sets.finite-set"}。先看每个集合是有限还是无限；无限的，再想它和$\N$、$\Q$、$\Q\times\Q$这样的集合有什么关系，用得上讲解里的哪条定理。
    - |
      A：一个圆由圆心的两个坐标和半径这三个有理数定出来。B：它是$\N$的:term[子集]{id="math.logic-sets.subset"}，有没有最大的数？C：分子、分母各有几种取法？

      D：不小于$0$的有理数$r$，平方等于它的是$\sqrt r$和$-\sqrt r$，分成两半来看。E：这样的数最多有几位？
    - |
      A：把圆送到（圆心的横坐标，圆心的纵坐标，半径），是到$\Q\times\Q\times\Q$的:term[单射]{id="math.logic-sets.injective"}。笛卡儿积的定理用两次，$\Q\times\Q\times\Q$可数，所以 A 至多可数；半径可以取$1,2,3,\dots$，A 是无限集，可数。B：$1^6,2^6,3^6,\dots$都在其中，没有最大的数，是$\N$的无限子集，可数。

      D：不小于$0$的有理数组成$\Q$的无限子集，可数。$r\mapsto\sqrt r$、$r\mapsto-\sqrt r$各把它和 D 的一半一个对一个地配起来，D 是两个可数集的并集，可数。

      C：分子、分母各有$100$种取法，至多得到$10000$个数，是有限集。E：数字只有十个，各位互不相同的数最多十位，只有有限个。所以选 A、B、D。
  solution: |
    A、B、D 可数。A 到$\Q\times\Q\times\Q$有:term[单射]{id="math.logic-sets.injective"}，圆送到圆心的两个坐标和半径；$\Q\times\Q\times\Q$可数，A 至多可数，又是无限集。B 是$\N$的:term[子集]{id="math.logic-sets.subset"}，含有$1^6,2^6,3^6,\dots$，没有最大的数。D 是$\{\sqrt r:r\in\Q,\ r\ge0\}$和$\{-\sqrt r:r\in\Q,\ r\ge0\}$的并集，两个都和不小于$0$的有理数一个对一个地配得起来，都可数。

    C、E 是:term[有限集]{id="math.logic-sets.finite-set"}。C 是可数集$\Q$的子集，可分子、分母各只有$100$种取法，至多有$10000$个数：可数集的子集只保证至多可数。E 里的数最多十位，最大的是$9876543210$，一共$8877690$个。选 A、B、D。

- id: p3
  tier: medium
  statement: |
    把正的最简分数$\frac pq$（$p$、$q$是正整数，没有大于$1$的公因数）按$p+q$从小到大排，$p+q$相同时按$p$从小到大排：$\frac11,\frac12,\frac21,\frac13,\frac31,\frac14,\dots$。$\frac45$排在第几个？
  answer:
    type: number
    value: 24
    exact: true
  hints:
    - |
      $\frac45$的$p+q=9$。先数$p+q$不超过$8$的有几个，再看它在$p+q=9$的里面是第几个。
    - |
      $p+q=s$时，$p$从$1$取到$s-1$，去掉能约分的：$p$和$q=s-p$有大于$1$的公因数，就是$p$和$s$有。例如$s=6$时去掉$p=2,3,4$，只剩$\frac15$、$\frac51$两个。
    - |
      $s=2,3,4,5,6,7,8$时，和$s$没有大于$1$的公因数的$p$依次有$1,2,2,4,2,6,4$个，一共$21$个。$s=9$时$p$取$1,2,4,5,7,8$，依次是$\frac18,\frac27,\frac45,\dots$，$\frac45$是第$3$个。所以它排在第$21+3=24$个。
  solution: |
    $p+q=s$的最简分数，个数就是$1$到$s-1$里和$s$没有大于$1$的公因数的数的个数，$s=2,3,\dots,8$时依次是$1,2,2,4,2,6,4$，加起来是$21$。$s=9$的那些按$p$从小到大是$\frac18,\frac27,\frac45,\frac54,\frac72,\frac81$，$\frac45$是第$3$个，所以排在第$24$个。

    每个$s$只有有限个分数，所以每个正的最简分数前面只有有限个，都排得到：这是正有理数的一种排法，能约分的跳过了，所以不重复。

- id: p4
  tier: medium
  statement: |
    设$A$、$B$是集合。不管$A$、$B$怎样取，下面哪些一定成立？
  answer:
    type: choice
    multiple: true
    options:
      - |
        若$A$、$B$都是可数集，则$A\setminus B$是可数集
      - |
        若$A\cup B$是可数集，则$A$、$B$都是可数集
      - |
        若有从可数集$A$到无限集$B$的满射，则$B$是可数集
      - |
        若$A\times B$是可数集，则$A$、$B$中至少有一个是可数集
      - |
        若有从$A$到可数集$B$的满射，则$A$是至多可数集
    value: [3, 4]
  hints:
    - |
      成立的，由讲解里的定理推出来；不成立的，找反例（counterexample）。可数集都是:term[无限集]{id="math.logic-sets.infinite-set"}，说一个集合可数，它先得是无限集。
    - |
      选项 A：$A$和$B$可以差得很少。选项 B：$A\cup B$可数时，其中一个会不会是:term[有限集]{id="math.logic-sets.finite-set"}？选项 C：把双射$\N\to A$和这个:term[满射]{id="math.logic-sets.surjective"}:term[复合]{id="math.logic-sets.composite-map"}起来。

      选项 D：取定$b\in B$，$a\mapsto(a,b)$是什么样的映射？选项 E：$\R$到$\Z$有没有满射？
    - |
      选项 A 不成立，$A=B$时$A\setminus B=\varnothing$。选项 B 不成立，$A=\N$、$B=\{0\}$时$A\cup B=\N$可数，$B$却是有限集。选项 E 不成立，把$x$送到不超过$x$的最大整数，是从$\R$到可数集$\Z$的满射，可$\R$不是至多可数集，见[闭区间套定理](lesson:math.analysis.nested-intervals)例 2。

      选项 C 成立：双射$\N\to A$和满射$A\to B$复合，是$\N\to B$的满射，$B$至多可数，又是无限集，所以可数。选项 D 成立：$A\times B$不空，所以$A$、$B$都不空；取定$b\in B$，$a\mapsto(a,b)$是$A\to A\times B$的单射，和双射$A\times B\to\N$复合，得$A$至多可数，同样$B$至多可数。要是两个都不是可数集，就都是有限集，$A\times B$也是有限集，矛盾。所以选 C、D。
  solution: |
    选项 C：$B$由$\N$经过$A$满射上去，至多可数；它是无限集，所以可数。少了「无限集」这个条件就不对，$B$可以是有限集。

    选项 D：$A\times B$可数，所以$A$、$B$都不空。取定$b\in B$，$a\mapsto(a,b)$是$A$到可数集$A\times B$的单射，所以$A$至多可数，$B$也一样；两个都有限的话，$A\times B$的元素个数是两者的积，也有限，所以至少有一个可数。

    选项 A、B 里都可能出现有限集：$A=B$时$A\setminus B=\varnothing$；$\N\cup\{0\}=\N$，$\{0\}$却是有限集，不是可数集。选项 E 把方向弄反了：能被$\N$满射上的至多可数，能满射到$\N$、$\Z$上的却可以很大，如$\R$取整数部分。选 C、D。

- id: p5
  tier: hard
  statement: |
    （1）设$a<b$。用数学分析的[阿基米德性质](lesson:math.analysis.completeness#def-archimedean)（Archimedean property：对任意实数$x$，都有正整数$n>x$）证明：开区间$(a,b)$里有有理数。

    （2）设$\mathcal J$由数轴上的一些开区间组成，每个都形如$(a,b)$（$a<b$），其中任意两个不同的开区间都:term[不相交]{id="math.logic-sets.disjoint"}（disjoint）。证明$\mathcal J$是:term[至多可数集]{id="math.logic-sets.at-most-countable"}。

    （3）证明（2）时，要给每个开区间取定一个有理数（或者它在一列里的位置）。这一步用到:term[选择公理]{id="math.logic-sets.axiom-of-choice"}（axiom of choice，见[选择公理与佐恩引理](lesson:math.logic-sets.axiom-of-choice#def-axiom-of-choice)）了吗？

    （4）把开区间换成闭区间$[a,b]$（$a\le b$），（2）的结论还成立吗？
  hints:
    - |
      （1）先取分母：把数轴每隔$\frac1n$分一格，格子比$b-a$短，总有一个分点落在$(a,b)$里。（2）找从$\mathcal J$到$\N$的:term[单射]{id="math.logic-sets.injective"}：每个开区间里有有理数，而$\Q$排得成一列。（3）取哪一个有理数，说得出规则吗？（4）看$a=b$的闭区间。
    - |
      （1）取正整数$n>\frac1{b-a}$，令$m$为大于$na$的最小的整数，看$\frac mn$。（2）把$\Q$排成$r_1,r_2,r_3,\dots$，把开区间$J$送到使$r_k\in J$的最小的$k$；两个不同的开区间会送到同一个$k$吗？（3）第（2）问的取法是「取列里排在最前面的」。（4）$a=b$时闭区间只有一个点。
    - |
      （1）由阿基米德性质，取正整数$n>\frac1{b-a}$，则$nb-na>1$。大于$na$的整数是有的；再取正整数$N>-na$，大于$na$的整数都大于$-N$，加上$N$以后都是正整数，由:term[良序原理]{id="math.logic-sets.well-ordering-principle"}，其中有最小的，所以大于$na$的整数里有最小的，记作$m$。$m-1\le na$，所以$na<m\le na+1<nb$，$a<\frac mn<b$。

      （2）$\Q$可数，不重复、不遗漏地排成$r_1,r_2,r_3,\dots$。由（1），每个$J\in\mathcal J$里都有有理数，所以使$r_k\in J$的$k$至少有一个，令$g(J)$为其中最小的，得到$g:\mathcal J\to\N$。若$g(J)=g(J')=k$，则$r_k$既在$J$里又在$J'$里，两者相交，只能$J=J'$。所以$g$是单射，由讲解的定理，$\mathcal J$至多可数。

      （3）没有。先取定$\Q$的一种排法，只取了一次；以后「取列里排在最前面的」是一条对所有开区间都管用的规则。要是只说「从每个开区间里任取一个有理数」，不说怎样取，开区间有无穷多个时，照字面就用到了选择公理；有了规则，就用不着。

      （4）不成立。$a=b$时$[a,b]=\{a\}$，全体$\{x\}$（$x\in\R$）两两没有公共点，它们和实数一个对一个地配得起来，可$\R$不是至多可数集，见[闭区间套定理](lesson:math.analysis.nested-intervals)例 2。要求$a<b$就成立：每个闭区间里有开区间$(a,b)$，（2）的证明照搬。

      数学分析[哪些函数可积](lesson:math.analysis.integrable-functions)第 7 题说到单调函数的间断点（point of discontinuity），它们至多可数，也是这样证的：区间内部的每个间断点处，左极限（left-hand limit）和右极限（right-hand limit）之间有一段开区间，不同的间断点给出的开区间不相交。
  reference: |
    （1）$n>\frac1{b-a}$，$m$为大于$na$的最小整数（存在性由阿基米德性质和良序原理），$na<m\le na+1<nb$。数学分析「用戴德金分割构造实数」例 2 有另一种证法。

    （2）$g(J)=\min\{k:r_k\in J\}$，互不相交$\Rightarrow$单射。

    （3）没有用：只用了$\Q$的一个固定的排法，之后取最小下标是统一的规则。写成「任取一个有理数」而不交代规则的，要指出来。

    （4）不成立，$\{[x,x]:x\in\R\}$与$\R$等势。$a<b$时成立。

    常见的漏洞：（1）没有说明大于$na$的最小整数存在；（2）把$J$送到有理数本身就停下，没有再送到$\N$（也可以：到$\Q$的单射就够）；（2）中没有用到互不相交。

- id: p6
  tier: hard
  statement: |
    整系数多项式$a_nx^n+\cdots+a_1x+a_0$（$n\ge1$，$a_n\ne0$，系数都是整数）的实数根，叫作代数数（algebraic number，本题只说实数），如$\sqrt2$、$\frac13$。可以用：$n$次多项式至多有$n$个实数根。

    （1）证明：全体这样的整系数多项式组成:term[可数集]{id="math.logic-sets.countable-set"}。

    （2）证明：全体代数数组成可数集。

    （3）证明：$[0,1]$里有不是代数数的实数。可以用[闭区间套定理](lesson:math.analysis.nested-intervals)例 2：任给一列实数，$[0,1]$里总有一个数不等于其中任何一项。
  hints:
    - |
      （1）多项式由它的系数完全确定。把系数写成一串符号，照例 1 变成一个自然数。（2）一个多项式可能有好几个根，给它的根从小到大编上号，用（多项式，号码）来指出一个代数数。（3）把（2）的结论说成「排成一列」。
    - |
      （1）$2x^2-3$写成「2,0,-3」，一共只用到十个数字、负号、逗号这$12$种符号；用例 1 末尾的办法。（2）令$S$由「$F$至少有$k$个实数根」的$(F,k)$组成，$k$是正整数，它是哪个可数集的:term[子集]{id="math.logic-sets.subset"}？$(F,k)$送到$F$从小到大的第$k$个实数根，是从$S$到全体代数数的:term[满射]{id="math.logic-sets.surjective"}。
    - |
      （1）把多项式的系数从高次到低次写成一串，用逗号隔开，$2x^2-3$就写成「2,0,-3」。由这一串认得出多项式，不同的多项式写成不同的串。串里只有十个数字、负号、逗号这$12$种符号，把它们编成$1$到$12$，当作$13$进制的数来读，不同的串得到不同的自然数。所以有从全体多项式到$\N$的:term[单射]{id="math.logic-sets.injective"}，它们至多可数；$x,2x,3x,\dots$有无穷多个，所以可数。

      （2）用$\mathcal F$记全体这样的多项式，它可数，所以$\mathcal F\times\N^+$可数。令$S$由$\mathcal F\times\N^+$中满足「$F$至少有$k$个实数根」的$(F,k)$组成，$S$是可数集的子集，至多可数；对每个整数$m$，$(x-m,1)\in S$，$S$是无限集，所以可数，有双射$\N\to S$。

      把$(F,k)\in S$送到$F$从小到大的第$k$个实数根。任取一个代数数，它是某个$F\in\mathcal F$的根；$F$只有有限个实数根，它是从小到大的第几个，就取$k$为几，所以这是从$S$到全体代数数的满射。和$\N\to S$:term[复合]{id="math.logic-sets.composite-map"}，得到从$\N$到全体代数数的满射，代数数至多可数。整数$m$是$x-m$的根，代数数有无穷多个，所以可数。

      （3）由（2），全体代数数排成一列$x_1,x_2,x_3,\dots$。由闭区间套定理例 2，$[0,1]$里有一个实数不等于其中任何一项，它就不是代数数。这样的实数叫超越数（transcendental number）；没有写出它的式子，只由「一个排得成一列、一个排不成」就知道它存在，这是康托尔（Georg Cantor）的办法。
  reference: |
    （1）系数写成串，$12$种符号编成$1$到$12$，十三进制，没有数字$0$，读法唯一，得单射。也可以用「给好排法」的可数并：$n$次的与$(\Z\setminus\{0\})\times\Z^n$配，但各$n$的排法要用统一的规则给出。

    （2）$S\subseteq\mathcal F\times\N^+$，$(F,k)\mapsto F$的第$k$小的实数根，满射。也可以直接：每个多项式的根有限、从小到大排，是「给好了排法」的可数个有限集的并。只说「可数个有限集的并可数」而不说怎样排的，要指出排法（从小到大）。

    （3）由（2）和闭区间套定理例 2。代数数全体至多可数就够用。

    常见的漏洞：（1）把次数不同的多项式混起来排，没有说明每个都排得到；（2）漏说代数数无限（可数集要无限）。

- id: p7
  tier: thinking
  statement: |
    讲解说，可数个可数集的并，没有给好排法时，一般要用:term[选择公理]{id="math.logic-sets.axiom-of-choice"}（axiom of choice，见[选择公理与佐恩引理](lesson:math.logic-sets.axiom-of-choice#def-axiom-of-choice)）才能证明可数。设有一列集合$A_1,A_2,A_3,\dots$。下面四种情形，不用选择公理，能不能证明它们的并至多可数？能的写出证明，不能的说出缺了什么。

    （1）每个$A_k$都是$\Q$的子集。

    （2）每个$A_k$由有限个实数组成。

    （3）每个$A_k$由可数个实数组成。

    （4）每个$A_k$恰有两个元素，任意两个$A_k$:term[不相交]{id="math.logic-sets.disjoint"}（disjoint），此外一无所知。

    （5）光看每个$A_k$有多少个元素，判断得出能不能证明吗？真正起作用的是什么？
  hints:
    - |
      要证并至多可数，只要有从并到$\N$的:term[单射]{id="math.logic-sets.injective"}，到某个可数集的单射也行。先看并落在哪里；再看能不能用一条对所有$k$都管用的规则，给$A_k$的元素分出先后。
    - |
      （1）不必逐个管$A_k$，看它们的并。（2）有限个实数从小到大排得成一列；把$x$送到（使$x\in A_k$的最小的$k$，$A_k$中比$x$小的数的个数）。

      （3）可数个实数从小到大排得成一列吗？同一个$A_k$有多少种排法？（4）这两个元素，谁先谁后？（5）比一比（2）和（4）。
    - |
      （1）能。并是$\Q$的子集，$\Q$可数，所以并至多可数，用不着逐个排。也可以先取定$\Q$的一种排法，每个$A_k$里的数都照它们在这一列里的先后排，一条规则管住了所有的$A_k$。

      （2）能。设$x$属于并，取使$x\in A_k$的最小的$k$，再令$i$为$A_k$中比$x$小的数的个数，$A_k$有限，$i$是确定的自然数。若$x$、$x'$送到同一个$(k,i)$，它们都在$A_k$里；要是$x<x'$，$A_k$中比$x'$小的数，除了比$x$小的那些，至少还有$x$自己，两个$i$就不同了，$x>x'$也一样，所以$x=x'$。这是从并到$\N^+\times\N$的单射，$\N^+\times\N$可数，所以并至多可数。

      （3）不能。每个$A_k$都有从$\N$来的:term[双射]{id="math.logic-sets.bijective"}，可这样的双射有无穷多个，要给每个$k$取定一个，才能照讲解那样排。从小到大排不行，$A_k$可能像$\Q$那样没有最小的数；也写不出别的、能证明对所有由可数个实数组成的集合都管用的规则，不用选择公理就证不出来。只要集合论其余的公理本身不矛盾，「写不出」「证不出」都是集合论的定理，这里不证；缺的是无穷多次没有规则的挑选。

      （4）不能。每个$A_k$只有两种排法，可元素是什么都不知道，说不出谁先谁后，要同时给所有的$k$挑好，又是无穷多次没有规则的挑选。不用选择公理，同样证不出来，这也是集合论的定理。

      （5）判断不出。在（2）里，$A_k$也可以都恰有两个元素，和（4）一样多，却一个行，一个不行。起作用的是有没有一条对所有$k$都管用的规则，把$A_k$的元素分出先后：有限个实数从小到大排，（1）里照$\Q$的一种取定的排法排，都是这样的规则。对（4）的元素一无所知，规则无从说起；要是知道它们是实数，就归到（2）了。
  reference: |
    （1）并$\subseteq\Q$，至多可数。（2）$x\mapsto(k,i)$，$k=\min\{k:x\in A_k\}$，$i=|\{y\in A_k:y<x\}|$，单射到$\N^+\times\N$。

    （3）每个$A_k$的编号有许多种，没有统一的规则。只要集合论其余的公理本身不矛盾，不用选择公理时$\R$可以是可数个可数集的并（费弗曼-莱维模型），所以证不出。（4）罗素的袜子：可数个两元素集合的并，在同样的条件下，不用选择公理证不出至多可数（科恩的第二个模型）。学生只要说出「缺无穷多次没有规则的挑选」就够，不要求知道模型。

    （5）规则（统一的先后）才是关键，光看元素的多少判断不出（每个$A_k$至多一个元素时当然有规则，答到这一点也好）。

    （3）里答「可以，因为实数能比大小」的，要追问可数个实数能不能从小到大排成一列。

- id: p8
  tier: thinking
  statement: |
    （1）证明：$\N$的所有有限子集组成:term[可数集]{id="math.logic-sets.countable-set"}。

    （2）$\N$的子集$S$里，自己有限或者:term[补集]{id="math.logic-sets.complement"}（complement）$\N\setminus S$有限的那些，全体也组成可数集吗？

    （3）想把（1）的办法用到$\N$的所有子集上，会卡在哪里？

    （4）有人说：「办法卡住了，可见$\N$的所有子集排不成一列。」这个推理对吗？要说明$\N$的所有子集排不成一列，该证一句什么样的话？用量词（quantifier）的次序说清楚，它和「这个办法不行」差在哪里。
  hints:
    - |
      （1）例 1 把有限长的串变成自然数；有限子集也可以写成一串$0$和$1$，哪些位上是$1$，就有哪些数。（2）补集有限的子集，由它的补集完全确定。（3）无限的子集对应的串有多长？（4）「排不成一列」是对所有的排法说的。
    - |
      （1）把有限子集$F$送到$F$中各个$a$的$2^a$之和，$\varnothing$送到$0$；由这个和怎样认出$F$？（2）$S\mapsto\N\setminus S$，再用两个可数集的并集。（4）写成「对每一列子集$S_1,S_2,S_3,\dots$，都有……」；想想整数从小到大排会怎样。
    - |
      （1）把有限子集$F$送到$F$中各个$a$的$2^a$之和，$\varnothing$送到$0$，得到一个自然数。由它认得出$F$：$0\in F$当且仅当它是奇数；除以$2$，商正是把$F$中不是$0$的数都减$1$以后那个集合送到的数，再对商这样做，依次认出$1$、$2$、$3$、……在不在$F$里，到商是$0$为止。所以这是到$\N$的:term[单射]{id="math.logic-sets.injective"}，有限子集至多可数；$\{0\}$、$\{1\}$、$\{2\}$、……各不相同，所以可数。

      （2）可数。$S\mapsto\N\setminus S$做两次回到$S$，把补集有限的子集和有限子集一个对一个地配了起来，所以补集有限的子集也可数。两个可数集的并集可数。

      （3）无限子集$S$对应的和有无穷多项，加起来没有尽头，不是自然数；写成$0$、$1$的串，也是无限长的，例 1 的办法管不到。

      （4）不对。一个办法不行，不等于所有的办法都不行：整数从小到大排不成一列，换成$0,1,-1,2,-2,\dots$就排成了。

      要证的是：对$\N$的每一列子集$S_1,S_2,S_3,\dots$，都有$\N$的子集$S$，使每个$n$都有$S\ne S_n$。量词的次序是$\forall\,\exists\,\forall$，最前面的$\forall$管住了所有的排法；「这个办法不行」只说有一种试法没有成，前面没有这个$\forall$。怎样对任意一列都造出这样的$S$，见[不可数集与对角线论证](lesson:math.logic-sets.uncountable-sets)。
  reference: |
    （1）$F\mapsto\sum_{a\in F}2^a$，二进制写法唯一，单射；无限。（2）可数：$S\mapsto\N\setminus S$把补集有限的与有限的一一配好，用两个可数集的并。

    （3）无穷和不是自然数，没有像。（4）不对；要证$\forall(S_n)\,\exists S\,\forall n,\ S\ne S_n$，即任何$\N\to\Pow(\N)$的映射都不是满射。「某个映射不行」只是一个例子，用整数从小到大排的例子反驳。
