<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 166" width="600" height="166" font-size="14">
  <!-- 数轴上的自然数 0 到 20，n 画在 (60 + 25n, 88)。A 取全体素数：2、3、5、7、11、13、17、19 用强调色的圆点，别的数画空心小圈；每个圆点下面的箭头指向 φ 的值 0 到 7，就是它前面有几个素数。上方的括号从 2 罩到 11，罩住 13 以前的五个素数；13 外面加一圈 -->
  <line x1="44" y1="88" x2="586" y2="88" stroke="currentColor" stroke-width="1" opacity="0.45" />
  <g stroke="currentColor" stroke-width="1.2" style="fill: var(--bg, #ffffff)">
    <circle cx="60" cy="88" r="3.2" />
    <circle cx="85" cy="88" r="3.2" />
    <circle cx="160" cy="88" r="3.2" />
    <circle cx="210" cy="88" r="3.2" />
    <circle cx="260" cy="88" r="3.2" />
    <circle cx="285" cy="88" r="3.2" />
    <circle cx="310" cy="88" r="3.2" />
    <circle cx="360" cy="88" r="3.2" />
    <circle cx="410" cy="88" r="3.2" />
    <circle cx="435" cy="88" r="3.2" />
    <circle cx="460" cy="88" r="3.2" />
    <circle cx="510" cy="88" r="3.2" />
    <circle cx="560" cy="88" r="3.2" />
  </g>
  <g style="fill: var(--accent, #2563eb)">
    <circle cx="110" cy="88" r="5" />
    <circle cx="135" cy="88" r="5" />
    <circle cx="185" cy="88" r="5" />
    <circle cx="235" cy="88" r="5" />
    <circle cx="335" cy="88" r="5" />
    <circle cx="385" cy="88" r="5" />
    <circle cx="485" cy="88" r="5" />
    <circle cx="535" cy="88" r="5" />
  </g>
  <!-- 13 和它前面的五个 -->
  <g fill="none" stroke-width="1.5" style="stroke: var(--accent, #2563eb)">
    <circle cx="385" cy="88" r="9" />
    <path d="M 101 54 V 45 H 344 V 54" />
  </g>
  <text x="222.5" y="33" text-anchor="middle" fill="currentColor">13 的前面有 5 个素数</text>
  <!-- 从 a 指向 φ(a) -->
  <g stroke-width="1.4" style="stroke: var(--accent, #2563eb)">
    <line x1="110" y1="99" x2="110" y2="121" />
    <line x1="135" y1="99" x2="135" y2="121" />
    <line x1="185" y1="99" x2="185" y2="121" />
    <line x1="235" y1="99" x2="235" y2="121" />
    <line x1="335" y1="99" x2="335" y2="121" />
    <line x1="385" y1="101" x2="385" y2="121" />
    <line x1="485" y1="99" x2="485" y2="121" />
    <line x1="535" y1="99" x2="535" y2="121" />
  </g>
  <g style="fill: var(--accent, #2563eb)">
    <polygon points="110,129 106,120 114,120" />
    <polygon points="135,129 131,120 139,120" />
    <polygon points="185,129 181,120 189,120" />
    <polygon points="235,129 231,120 239,120" />
    <polygon points="335,129 331,120 339,120" />
    <polygon points="385,129 381,120 389,120" />
    <polygon points="485,129 481,120 489,120" />
    <polygon points="535,129 531,120 539,120" />
  </g>
  <!-- 自然数 n -->
  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="60" y="74">0</text>
    <text x="85" y="74">1</text>
    <text x="110" y="74">2</text>
    <text x="135" y="74">3</text>
    <text x="160" y="74">4</text>
    <text x="185" y="74">5</text>
    <text x="210" y="74">6</text>
    <text x="235" y="74">7</text>
    <text x="260" y="74">8</text>
    <text x="285" y="74">9</text>
    <text x="310" y="74">10</text>
    <text x="335" y="74">11</text>
    <text x="360" y="74">12</text>
    <text x="385" y="74">13</text>
    <text x="410" y="74">14</text>
    <text x="435" y="74">15</text>
    <text x="460" y="74">16</text>
    <text x="485" y="74">17</text>
    <text x="510" y="74">18</text>
    <text x="535" y="74">19</text>
    <text x="560" y="74">20</text>
    <text x="582" y="74">…</text>
  </g>
  <!-- φ 的值 -->
  <g style="fill: var(--accent, #2563eb)" text-anchor="middle">
    <text x="110" y="148">0</text>
    <text x="135" y="148">1</text>
    <text x="185" y="148">2</text>
    <text x="235" y="148">3</text>
    <text x="335" y="148">4</text>
    <text x="385" y="148">5</text>
    <text x="485" y="148">6</text>
    <text x="535" y="148">7</text>
    <text x="574" y="148">…</text>
  </g>
  <text x="12" y="148" style="fill: var(--accent, #2563eb)">前面有几个</text>
</svg>
