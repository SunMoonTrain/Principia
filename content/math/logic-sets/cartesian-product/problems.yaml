- id: p1
  tier: easy
  statement: |
    设$A=\{1,2,3\}$，$B=\{1,2\}$。:term[笛卡儿积]{id="math.logic-sets.cartesian-product"}$A\times B$有几个元素？$(A\times B)\cap(B\times A)$有几个元素？按（前者，后者）的顺序填。
  answer:
    type: tuple
    value: [6, 4]
    exact: true
  hints:
    - |
      $A\times B$由第一个分量在$A$里、第二个分量在$B$里的:term[有序对]{id="math.logic-sets.ordered-pair"}组成；$B\times A$正好反过来，第一个分量要在$B$里，第二个分量要在$A$里。
    - |
      先把$A\times B$的元素一个个写出来。一个有序对$(x,y)$属于$B\times A$，要$x\in B$且$y\in A$；看$A\times B$的元素里哪些满足这两条。
    - |
      第一个分量有$3$种取法，第二个有$2$种，$A\times B$有$3\times2=6$个元素：$(1,1),(1,2),(2,1),(2,2),(3,1),(3,2)$。它们的第二个分量都在$A$里；第一个分量还要在$B=\{1,2\}$里，$(3,1)$、$(3,2)$不行，剩下$4$个。所以填$(6,4)$。
  solution: |
    $A\times B=\{(1,1),(1,2),(2,1),(2,2),(3,1),(3,2)\}$，由乘法原理，有$3\times2=6$个元素。$B\times A$由满足$x\in\{1,2\}$、$y\in\{1,2,3\}$的有序对$(x,y)$组成。

    $A\times B$的元素的第二个分量都在$\{1,2,3\}$里，其中第一个分量在$\{1,2\}$里的是$(1,1),(1,2),(2,1),(2,2)$。所以$(A\times B)\cap(B\times A)=\{1,2\}\times\{1,2\}$，有$4$个元素，答案是$(6,4)$。

- id: p2
  tier: easy
  statement: |
    下面每一条规定了整数集$\Z$上的一个:term[关系]{id="math.logic-sets.binary-relation"}$R$：$a\mathrel{R}b$当且仅当这一条成立。哪些关系是:term[传递的]{id="math.logic-sets.transitive"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $a+b$是奇数
      - |
        $a+b$是偶数
      - |
        $ab>0$
      - |
        $ab\ge0$
      - |
        $a-b$是正偶数
    value: [2, 3, 5]
  hints:
    - |
      传递要对所有整数$a$、$b$、$c$都成立：由$a\mathrel{R}b$、$b\mathrel{R}c$推出$a\mathrel{R}c$。不成立的，找一组反例就够了；$a$、$c$可以相等，也别忘了$0$。
    - |
      B、E 把两个条件里的式子加起来：$(a+b)+(b+c)$、$(a-b)+(b-c)$各和$a+c$、$a-c$差多少？C 的$ab>0$是说$a$、$b$都不是$0$，并且同号。A 试$c=a$，D 试$b=0$。
    - |
      A：取$a=1$、$b=2$、$c=1$，$1+2$、$2+1$都是奇数，$1+1$却是偶数，不传递。B：$a+c=(a+b)+(b+c)-2b$，是偶数减偶数，仍是偶数，传递。C：$a$、$b$同号，$b$、$c$也同号，所以$a$、$c$都不是$0$且同号，$ac>0$，传递。

      D：取$a=1$、$b=0$、$c=-1$，$1\cdot0\ge0$，$0\cdot(-1)\ge0$，$1\cdot(-1)<0$，不传递。E：$a-c=(a-b)+(b-c)$是两个正偶数之和，仍是正偶数，传递。所以选 B、C、E。
  solution: |
    A：$1\mathrel{R}2$、$2\mathrel{R}1$，可$1+1=2$是偶数，$1\mathrel{R}1$不成立，所以不传递。B：$a+b$、$b+c$都是偶数时，$a+c=(a+b)+(b+c)-2b$也是偶数，传递。C：$ab>0$、$bc>0$时，$a$、$b$、$c$都不是$0$，$a$与$b$同号，$b$与$c$同号，所以$a$与$c$同号，$ac>0$，传递。

    D：$1\cdot0\ge0$，$0\cdot(-1)\ge0$，可$1\cdot(-1)=-1<0$，$0$把两个异号的数接了起来，不传递。E：$a-b$、$b-c$都是正偶数时，$a-c=(a-b)+(b-c)$也是正偶数，传递。选 B、C、E。

- id: p3
  tier: medium
  statement: |
    集合$A=\{1,2,3\}$上一共有多少个:term[自反的]{id="math.logic-sets.reflexive"}关系？
  answer:
    type: number
    value: 64
    exact: true
  hints:
    - |
      $A$上的:term[关系]{id="math.logic-sets.binary-relation"}就是$A\times A$的:term[子集]{id="math.logic-sets.subset"}。$A\times A$有几个元素？自反对这个子集提了什么要求？
    - |
      $A\times A$有$9$个有序对。自反要求$(1,1)$、$(2,2)$、$(3,3)$都在关系里，其余$6$个有序对放不放都行。
    - |
      一个自反的关系，由「其余$6$个有序对里放进了哪几个」完全确定，不同的放法给出不同的关系。所以自反的关系和这$6$个有序对组成的集合的子集一样多，由[集合与子集](lesson:math.logic-sets.sets#thm-subset-count)里的定理，有$2^6=64$个。
  solution: |
    $A$上的关系是$A\times A$的子集，$A\times A$有$3\times3=9$个有序对。自反要求$(1,1)$、$(2,2)$、$(3,3)$都在关系里；剩下的$(1,2)$、$(1,3)$、$(2,1)$、$(2,3)$、$(3,1)$、$(3,2)$可要可不要。

    每个自反的关系由这$6$个有序对里选了哪几个确定，不同的选法给出不同的关系。这$6$个有序对组成的集合有$2^6$个子集，所以自反的关系有$64$个。

- id: p4
  tier: medium
  statement: |
    设$A=\{1,2,3,4\}$，$A$上的关系$R=\{(1,2),(2,3),(3,4)\}$。至少要往$R$里添几个有序对，才能得到一个既:term[自反]{id="math.logic-sets.reflexive"}又:term[传递]{id="math.logic-sets.transitive"}的关系？
  answer:
    type: number
    value: 7
    exact: true
  hints:
    - |
      先找出一定要添的：自反要哪些有序对？传递又逼出哪些？再看添完以后够不够。
    - |
      自反要$(1,1)$、$(2,2)$、$(3,3)$、$(4,4)$。由$(1,2)$、$(2,3)$，传递要$(1,3)$；由$(2,3)$、$(3,4)$，要$(2,4)$；有了$(1,3)$，再由$(3,4)$还要$(1,4)$。
    - |
      包含$R$、既自反又传递的关系，一定含有上面这$4+3=7$个有序对，它们都不在$R$里，所以至少要添$7$个。添上这$7$个，得到$\{(a,b)\in A^2:a\le b\}$，也就是$A$上的$\le$，它既自反又传递，所以添$7$个就够了。答案是$7$。
  solution: |
    设关系$S$包含$R$，既自反又传递。由自反，$(1,1)$、$(2,2)$、$(3,3)$、$(4,4)$都在$S$里。由传递，$(1,2)$、$(2,3)$推出$(1,3)$，$(2,3)$、$(3,4)$推出$(2,4)$，$(1,3)$、$(3,4)$推出$(1,4)$，它们都在$S$里。这$7$个有序对都不在$R$里，所以至少要添$7$个。

    反过来，$R$添上这$7$个，正好是$\{(a,b)\in A^2:a\le b\}$，即$A$上的$\le$，它既自反又传递。所以至少要添$7$个，添$7$个也就够了。

- id: p5
  tier: hard
  statement: |
    讲解里只规定了:term[有序对]{id="math.logic-sets.ordered-pair"}什么时候相等。库拉托夫斯基（Kuratowski）用集合给出了一种造法：令$(a,b)=\{\{a\},\{a,b\}\}$。证明这样造出的有序对满足讲解里的规定，即$\{\{a\},\{a,b\}\}=\{\{c\},\{c,d\}\}$当且仅当$a=c$且$b=d$。
  hints:
    - |
      「当」的一边直接代入。「仅当」的一边，按$a=b$和$a\ne b$分两种情形：$a=b$时$\{\{a\},\{a,b\}\}$只有一个元素；$a\ne b$时有两个元素，其中只有$\{a\}$是只含一个元素的集合。
    - |
      设两边相等。$\{c\}$是右边的元素，所以也是左边的元素，等于$\{a\}$或$\{a,b\}$；比较元素个数，先定出$c$。再用$\{a,b\}$是右边的元素，定出$d$。
    - |
      若$a=c$且$b=d$，两边是同一个集合。反过来，设$\{\{a\},\{a,b\}\}=\{\{c\},\{c,d\}\}$。

      情形一，$a=b$。左边是$\{\{a\}\}$，只有一个元素$\{a\}$；$\{c\}$、$\{c,d\}$都是右边的元素，也就是左边的元素，所以$\{c\}=\{a\}$，$\{c,d\}=\{a\}$。由前者得$c=a$，由后者得$d\in\{a\}$，即$d=a$；所以$c=a$，$d=a=b$。

      情形二，$a\ne b$。这时$\{a,b\}$有两个元素，$\{c\}$只有一个，两者不相等；$\{c\}$是左边的元素，只能是$\{c\}=\{a\}$，得$c=a$。$\{a,b\}$是右边的元素，元素个数又和$\{c\}$不同，所以$\{a,b\}=\{c,d\}=\{a,d\}$，于是$b\in\{a,d\}$。而$b\ne a$，所以$b=d$。

      两种情形都得到$a=c$且$b=d$。
  reference: |
    （⇐）显然。（⇒）设$\{\{a\},\{a,b\}\}=\{\{c\},\{c,d\}\}$。

    若$a=b$，左边是$\{\{a\}\}$，于是$\{c\}=\{a\}$且$\{c,d\}=\{a\}$，得$c=a$、$d=a=b$。

    若$a\ne b$，$\{a,b\}$有两个元素，不能等于只含一个元素的$\{c\}$；$\{c\}$属于左边，只能等于$\{a\}$，故$c=a$。$\{a,b\}$属于右边，又不等于$\{c\}$，故$\{a,b\}=\{c,d\}=\{a,d\}$，由$b\in\{a,d\}$、$b\ne a$得$b=d$。关键是按$a=b$与否分情形，并用元素个数区分$\{a\}$和$\{a,b\}$。

- id: p6
  tier: hard
  statement: |
    设$A$、$B$、$C$、$D$是集合。

    （1）证明$(A\times B)\cap(C\times D)=(A\cap C)\times(B\cap D)$。

    （2）证明$(A\times B)\cup(C\times D)\subseteq(A\cup C)\times(B\cup D)$，并举例说明两边可以不相等。
  hints:
    - |
      （1）证两边互相包含。左边的元素既属于$A\times B$，又属于$C\times D$，先把这两句话分别写成「它是某个:term[有序对]{id="math.logic-sets.ordered-pair"}，分量各在哪里」。（2）右边由第一个分量在$A\cup C$里、第二个分量在$B\cup D$里的有序对组成。
    - |
      （1）设$p$属于左边，则$p=(x,y)$，$x\in A$，$y\in B$；又$p=(x',y')$，$x'\in C$，$y'\in D$。由有序对相等的规定，能得到什么？（2）举例时试$A=B=\{1\}$，$C=D=\{2\}$，在平面上画出两边。
    - |
      （1）设$p\in(A\times B)\cap(C\times D)$。由$p\in A\times B$，$p=(x,y)$，$x\in A$，$y\in B$；由$p\in C\times D$，$p=(x',y')$，$x'\in C$，$y'\in D$。由$(x,y)=(x',y')$得$x=x'$，$y=y'$，所以$x\in A\cap C$，$y\in B\cap D$，$p\in(A\cap C)\times(B\cap D)$。

      反过来，设$p\in(A\cap C)\times(B\cap D)$，则$p=(x,y)$，$x\in A\cap C$，$y\in B\cap D$。由$x\in A$、$y\in B$得$p\in A\times B$，由$x\in C$、$y\in D$得$p\in C\times D$，所以$p$属于左边。两边互相包含，所以相等。

      （2）设$p$属于左边。若$p\in A\times B$，则$p=(x,y)$，$x\in A\subseteq A\cup C$，$y\in B\subseteq B\cup D$，所以$p$属于右边；$p\in C\times D$时同理。

      取$A=B=\{1\}$，$C=D=\{2\}$。左边是$\{(1,1)\}\cup\{(2,2)\}=\{(1,1),(2,2)\}$，右边是$\{1,2\}\times\{1,2\}$，多出$(1,2)$、$(2,1)$，两边不相等。在平面上看，左边只是对角线上的两个点，右边却是$2\times2$的四个点。
  reference: |
    （1）$p\in(A\times B)\cap(C\times D)$，当且仅当$p=(x,y)$、$x\in A$、$y\in B$，同时$p=(x',y')$、$x'\in C$、$y'\in D$。由有序对相等的规定$x=x'$、$y=y'$，所以这当且仅当$p=(x,y)$、$x\in A\cap C$、$y\in B\cap D$，即$p\in(A\cap C)\times(B\cap D)$。关键是用$(x,y)=(x',y')\Rightarrow x=x',\ y=y'$把两种写法合成一种。

    （2）$A\times B\subseteq(A\cup C)\times(B\cup D)$，$C\times D$同理，所以并集也包含于右边。反例$A=B=\{1\}$，$C=D=\{2\}$：左边是$\{(1,1),(2,2)\}$，右边是$\{(1,1),(1,2),(2,1),(2,2)\}$。一般地，右边多出的是$A\times D$、$C\times B$里不属于左边的有序对。

- id: p7
  tier: thinking
  statement: |
    讲解把:term[$n$元组]{id="math.logic-sets.tuple"}当作一种新的对象，只规定了它什么时候相等。

    （1）有人提议用:term[有序对]{id="math.logic-sets.ordered-pair"}来定义三元组：令$(a,b,c)=((a,b),c)$，即第一个分量本身是有序对$(a,b)$的有序对。这样定义的三元组满足「两个三元组相等，当且仅当对应的分量都相等」吗？

    （2）$(A\times B)\times C$和$A\times(B\times C)$是不是同一个集合？按讲解的定义，它们和$A\times B\times C$又是不是同一个集合？

    （3）为什么写$\R^3$、$[0,1]^3$时，平常不必分这几种写法？
  hints:
    - |
      （1）用两次有序对相等的规定。（2）比较$((1,2),3)$和$(1,(2,3))$的第一个分量。
    - |
      （2）$(A\times B)\times C$的元素是第一个分量为有序对的有序对，$A\times(B\times C)$的元素是第二个分量为有序对的有序对，$A\times B\times C$的元素按讲解是三元组。（3）想想用到三元组时，用的是它的什么。
    - |
      （1）满足。由有序对相等的规定，$((a,b),c)=((a',b'),c')$当且仅当$(a,b)=(a',b')$且$c=c'$，再用一次规定，当且仅当$a=a'$、$b=b'$、$c=c'$。所以这样定义的三元组也满足讲解里的规定，可以拿它当三元组；有的书正是这样一层层用有序对定义$n$元组的。

      （2）一般不是。$((1,2),3)$的第一个分量是有序对$(1,2)$，$(1,(2,3))$的第一个分量是数$1$，两者不相等；所以取$A=\{1\}$，$B=\{2\}$，$C=\{3\}$，$(A\times B)\times C=\{((1,2),3)\}$和$A\times(B\times C)=\{(1,(2,3))\}$就不相等。按讲解，$A\times B\times C$的元素是三元组，不是有序对，所以$A$、$B$、$C$都不空时，它和这两个集合也不相同；有一个是空集时，三者都是$\varnothing$。按（1）的定义，它就是$(A\times B)\times C$。

      （3）三种写法的元素可以一个对一个地换过去：$(a,b,c)$、$((a,b),c)$、$(a,(b,c))$都由$a$、$b$、$c$按先后定下来，反过来也都定下$a$、$b$、$c$。用到三元组时，用的只是三个分量和它们的先后，只谈分量和先后的话，在一种写法里成立，换到另一种写法里照样成立。所以平常把它们看成一回事，写$\R^3$时不去区分。
  reference: |
    （1）$((a,b),c)=((a',b'),c')$当且仅当$(a,b)=(a',b')$且$c=c'$，当且仅当$a=a'$、$b=b'$、$c=c'$，满足三元组的规定，所以可以这样定义（不少集合论的书由此一层层定义$n$元组）。

    （2）一般不同：$((1,2),3)\ne(1,(2,3))$，第一个分量一个是有序对、一个是数，取$A=\{1\}$、$B=\{2\}$、$C=\{3\}$即得两个不同的集合。讲解把三元组当作新对象，$A$、$B$、$C$都不空时，$A\times B\times C$和两者都不同；有一个是空集时，三者都是$\varnothing$。采用（1）的定义，则$A\times B\times C=(A\times B)\times C$。

    （3）有自然的对应$(a,b,c)\leftrightarrow((a,b),c)\leftrightarrow(a,(b,c))$，每个元素对应另一边恰好一个元素，分量和先后都不变，这样的对应以后叫作双射（bijection）。数学上用到的只是分量，所以可以把它们等同起来，平常写$\R^3$时不加区分。

- id: p8
  tier: thinking
  statement: |
    有人这样论证：「设集合$A$上的:term[关系]{id="math.logic-sets.binary-relation"}$R$满足：只要$a\mathrel{R}b$，就有$b\mathrel{R}a$。如果$R$还是传递的，那它一定是自反的：由$a\mathrel{R}b$和$b\mathrel{R}a$，用传递性就得到$a\mathrel{R}a$。」

    （1）这个论证错在哪里？

    （2）在$A=\{1,2,3\}$上举一个关系，它满足「只要$a\mathrel{R}b$，就有$b\mathrel{R}a$」，又是传递的，却不是自反的。

    （3）给$R$再加上一个什么条件，这个论证就对了？
  hints:
    - |
      :term[自反性]{id="math.logic-sets.reflexive"}要对$A$的每个元素$a$证明$a\mathrel{R}a$。论证里的$b$是从哪里来的？
    - |
      这个论证只对「和某个$b$有关系$R$」的$a$管用。要是有一个元素，和谁都没有关系$R$呢？
    - |
      （1）要证自反，得任取$a\in A$，证明$a\mathrel{R}a$。论证一上来就用了$a\mathrel{R}b$，可对任取的$a$，未必有$b$使$a\mathrel{R}b$；它其实只证明了「若有$b$使$a\mathrel{R}b$，则$a\mathrel{R}a$」，和谁都没有关系$R$的元素，它管不到。

      （2）取$R=\{(1,1),(1,2),(2,1),(2,2)\}$，即$\{1,2\}\times\{1,2\}$。$R$里每个有序对倒过来还在$R$里；$a\mathrel{R}b$、$b\mathrel{R}c$时，$a$、$c$都在$\{1,2\}$里，所以$a\mathrel{R}c$，$R$是传递的。可$3$和谁都没有关系$R$，$(3,3)\notin R$，所以$R$不是自反的。

      （3）加上「对每个$a\in A$，都有$b\in A$使$a\mathrel{R}b$」。这时任取$a\in A$，取这样的$b$，由第一条性质得$b\mathrel{R}a$，再由传递性（取$c=a$）得$a\mathrel{R}a$，所以$R$是自反的。
  reference: |
    （1）自反性是全称命题「对每个$a\in A$，$a\mathrel{R}a$」。论证要先有$b$使$a\mathrel{R}b$，只证明了和某个元素有关系的$a$满足$a\mathrel{R}a$；和任何元素都没有关系的$a$被漏掉了。

    （2）$A=\{1,2,3\}$，$R=\{1,2\}^2=\{(1,1),(1,2),(2,1),(2,2)\}$：满足$a\mathrel{R}b\Rightarrow b\mathrel{R}a$；传递（$a\mathrel{R}b$、$b\mathrel{R}c$推出$a,c\in\{1,2\}$）；$(3,3)\notin R$，不自反。空关系$\varnothing$也是反例：前两条的条件永远不成立，按定义为真，自反却不成立。

    （3）加上「每个$a\in A$都和某个$b\in A$有关系$R$」。任取$a$，取$b$使$a\mathrel{R}b$，则$b\mathrel{R}a$，由传递性得$a\mathrel{R}a$。一般地，满足前两条的关系在$\{a\in A:\exists b\in A,\ a\mathrel{R}b\}$上是自反的，这个集合以外的元素都不和自己有关系。
