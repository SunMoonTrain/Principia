<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 284" width="600" height="284" font-size="14">
  <!-- 左：一块不规则区域 A 被三条曲线分成四块（一个划分），每块里的强调色圆点是代表元 a、b、c、d，块上标 [a]、[b]、[c]、[d]；相邻两块的底色深浅不同。右：以原点为圆心、半径 22、44、66、88（1∶2∶3∶4）的四个圆是 x² + y² 相等的等价类，原点和每个圆与 x 轴正半轴的交点是代表元 -->
  <text x="150" y="24" fill="currentColor" text-anchor="middle">集合 <tspan font-style="italic">A</tspan> 的一个划分</text>
  <g style="fill: var(--accent, #2563eb)">
    <path d="M 28 176 C 24 116, 82 62, 146 50 C 136 78, 162 102, 150 126 C 104 128, 66 166, 28 176 Z" opacity="0.1" />
    <path d="M 28 176 C 66 166, 104 128, 150 126 C 140 150, 166 172, 152 196 C 138 220, 160 244, 150 268 C 92 286, 30 238, 28 176 Z" opacity="0.22" />
    <path d="M 146 50 C 210 34, 292 88, 276 140 C 238 162, 196 190, 152 196 C 166 172, 140 150, 150 126 C 162 102, 136 78, 146 50 Z" opacity="0.22" />
    <path d="M 152 196 C 196 190, 238 162, 276 140 C 262 192, 226 246, 150 268 C 160 244, 138 220, 152 196 Z" opacity="0.1" />
  </g>
  <path d="M 146 50 C 210 34, 292 88, 276 140 C 262 192, 226 246, 150 268 C 92 286, 30 238, 28 176 C 24 116, 82 62, 146 50 Z" fill="none" stroke="currentColor" stroke-width="1.5" />
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M 146 50 C 136 78, 162 102, 150 126 C 140 150, 166 172, 152 196 C 138 220, 160 244, 150 268" />
    <path d="M 28 176 C 66 166, 104 128, 150 126" />
    <path d="M 276 140 C 238 162, 196 190, 152 196" />
  </g>
  <text x="22" y="70" fill="currentColor" font-size="16" font-style="italic">A</text>
  <g style="fill: var(--accent, #2563eb)">
    <circle cx="105" cy="98" r="4.5" />
    <circle cx="88" cy="204" r="4.5" />
    <circle cx="201" cy="115" r="4.5" />
    <circle cx="175" cy="218" r="4.5" />
  </g>
  <g fill="currentColor" font-style="italic">
    <text x="114" y="103">a</text>
    <text x="97" y="209">b</text>
    <text x="210" y="120">c</text>
    <text x="184" y="223">d</text>
  </g>
  <g fill="currentColor">
    <text x="73" y="124">[<tspan font-style="italic">a</tspan>]</text>
    <text x="88" y="178">[<tspan font-style="italic">b</tspan>]</text>
    <text x="201" y="89">[<tspan font-style="italic">c</tspan>]</text>
    <text x="205" y="206">[<tspan font-style="italic">d</tspan>]</text>
  </g>
  <!-- 右图：原点 (450, 160)，每单位 22 像素 -->
  <text x="450" y="24" fill="currentColor" text-anchor="middle"><tspan font-style="italic">x</tspan>² + <tspan font-style="italic">y</tspan>² 相等的点</text>
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="345" y1="160" x2="560" y2="160" />
    <line x1="450" y1="262" x2="450" y2="56" />
  </g>
  <polygon points="568,160 558,155.5 558,164.5" fill="currentColor" />
  <polygon points="450,46 445.5,56 454.5,56" fill="currentColor" />
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="450" cy="160" r="22" />
    <circle cx="450" cy="160" r="44" />
    <circle cx="450" cy="160" r="66" />
    <circle cx="450" cy="160" r="88" />
  </g>
  <g style="fill: var(--accent, #2563eb)">
    <circle cx="450" cy="160" r="4.5" />
    <circle cx="472" cy="160" r="4.5" />
    <circle cx="494" cy="160" r="4.5" />
    <circle cx="516" cy="160" r="4.5" />
    <circle cx="538" cy="160" r="4.5" />
  </g>
  <text x="562" y="182" fill="currentColor" font-style="italic">x</text>
  <text x="438" y="60" fill="currentColor" font-style="italic" text-anchor="end">y</text>
</svg>
