<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-size="13">
  <!-- 斜二测画法：W 是 z=0 的平面（平行四边形），v=(2.4,1,2.2)，p=(2.4,1,0)，w=(0.4,2.4,0)；v-p 竖直、和 W 垂直 -->
  <path d="M 51.52 292.87 L 411.12 292.87 L 568.56 182.63 L 208.96 182.63 Z" style="fill: var(--good, #0f8a5f); stroke: var(--good, #0f8a5f)" fill-opacity="0.08" stroke-width="1.4" />
  <text x="490.52" y="206.88" text-anchor="middle" font-size="16" style="fill: var(--good, #0f8a5f)" fill="currentColor"><tspan font-style="italic">W</tspan></text>
  <line x1="170" y1="262" x2="343.53" y2="109.49" style="stroke: var(--accent, #2563eb)" stroke-width="2.4" />
  <path d="M 350.29 103.55 L 346.5 112.87 L 340.56 106.11 Z" style="fill: var(--accent, #2563eb)" />
  <line x1="170" y1="262" x2="341.35" y2="241.04" style="stroke: var(--good, #0f8a5f)" stroke-width="2.4" />
  <path d="M 350.29 239.95 L 341.9 245.51 L 340.81 236.58 Z" style="fill: var(--good, #0f8a5f)" />
  <line x1="350.29" y1="103.55" x2="350.29" y2="239.95" style="stroke: var(--warn, #a8661a)" stroke-width="2.2" stroke-dasharray="6 4" />
  <line x1="350.29" y1="103.55" x2="270.37" y2="209.08" style="stroke: var(--muted, #6b7280)" stroke-width="1.6" stroke-dasharray="4 4" />
  <line x1="350.29" y1="239.95" x2="270.37" y2="209.08" style="stroke: var(--muted, #6b7280)" stroke-width="1.6" stroke-dasharray="4 4" />
  <circle cx="170" cy="262" r="2.8" fill="currentColor" />
  <circle cx="270.37" cy="209.08" r="3.2" style="fill: var(--muted, #6b7280)" />
  <path d="M 339.09 235.63 L 339.09 223.63 L 350.29 227.95" fill="none" stroke="currentColor" stroke-width="1.2" />
  <text x="160" y="266" text-anchor="end" font-size="14" fill="currentColor"><tspan font-style="italic">O</tspan></text>
  <text x="358.29" y="97.55" font-size="15" style="fill: var(--accent, #2563eb)" fill="currentColor"><tspan font-weight="bold">v</tspan></text>
  <text x="360.29" y="259.95" font-size="14" style="fill: var(--good, #0f8a5f)" fill="currentColor"><tspan font-weight="bold">p</tspan> = proj<tspan baseline-shift="sub" font-size="10"><tspan font-style="italic">W</tspan></tspan> <tspan font-weight="bold">v</tspan></text>
  <text x="260.37" y="227.08" text-anchor="end" font-size="15" style="fill: var(--muted, #6b7280)" fill="currentColor"><tspan font-weight="bold">w</tspan></text>
  <text x="358.29" y="175.75" font-size="14" style="fill: var(--warn, #a8661a)" fill="currentColor"><tspan font-weight="bold">v</tspan> − <tspan font-weight="bold">p</tspan></text>
  <text x="300" y="334" text-anchor="middle" fill="currentColor"><tspan font-weight="bold">v</tspan> − <tspan font-weight="bold">p</tspan> 和 <tspan font-style="italic">W</tspan> 里每个向量都正交，所以</text>
  <text x="300" y="366" text-anchor="middle" fill="currentColor">‖<tspan font-weight="bold">v</tspan> − <tspan font-weight="bold">w</tspan>‖² = ‖<tspan font-weight="bold">v</tspan> − <tspan font-weight="bold">p</tspan>‖² + ‖<tspan font-weight="bold">p</tspan> − <tspan font-weight="bold">w</tspan>‖² ≥ ‖<tspan font-weight="bold">v</tspan> − <tspan font-weight="bold">p</tspan>‖²</text>
</svg>
