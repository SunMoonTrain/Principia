- id: p1
  tier: easy
  statement: |
    设$\vb u=(2,-1,4)$、$\vb v=(1,3,-2)$，求$3\vb u-2\vb v$，按顺序填写三个:term[分量]{id="math.linear-algebra.component"}（component）。
  answer:
    type: tuple
    value: [4, -9, 16]
  hints:
    - |
      先分别算出$3\vb u$和$2\vb v$。
    - |
      $3\vb u=(6,-3,12)$，$2\vb v=(2,6,-4)$。
    - |
      逐个分量相减：$(6-2,\ -3-6,\ 12-(-4))=(4,-9,16)$。
  solution: |
    $3\vb u-2\vb v=(6-2,\,-3-6,\,12+4)=(4,-9,16)$，填 `4, -9, 16`。

- id: p2
  tier: easy
  statement: |
    点$A$的坐标是$(-1,3)$，向量$\overrightarrow{AB}=(4,-5)$。求点$B$的坐标。
  answer:
    type: tuple
    value: [3, -2]
  hints:
    - |
      $\overrightarrow{AB}$的分量是终点坐标减起点坐标。
    - |
      设$B=(x,y)$，则$(x-(-1),\ y-3)=(4,-5)$。
    - |
      $x+1=4$、$y-3=-5$，所以$x=3$、$y=-2$，$B=(3,-2)$。
  solution: |
    $B$的坐标是$A$的坐标加上$\overrightarrow{AB}$的分量：$(-1+4,\,3-5)=(3,-2)$，填 `3, -2`。

- id: p3
  tier: medium
  statement: |
    把$\vb w=(1,4,7)$写成$\vb u=(1,2,3)$与$\vb v=(0,1,2)$的:term[线性组合]{id="math.linear-algebra.linear-combination"}（linear combination）$\vb w=c_1\vb u+c_2\vb v$，按顺序填写$c_1$、$c_2$。
  answer:
    type: tuple
    value: [1, 2]
  hints:
    - |
      比较两边的三个分量，得到关于$c_1$、$c_2$的三个方程。
    - |
      三个方程是$c_1=1$、$2c_1+c_2=4$、$3c_1+2c_2=7$；先用前两个解出$c_1$、$c_2$。
    - |
      $c_1=1$，代入第二个方程得$c_2=2$；再检查第三个：$3\cdot1+2\cdot2=7$，成立。所以$\vb w=\vb u+2\vb v$。
  solution: |
    比较分量：$c_1=1$，$2c_1+c_2=4$得$c_2=2$，第三个分量$3+4=7$也对得上，填 `1, 2`。

- id: p4
  tier: medium
  statement: |
    空间里的平行四边形$ABCD$（顶点按这个顺序相连）有三个顶点$A(1,0,2)$、$B(3,1,0)$、$C(4,3,1)$。求顶点$D$的坐标。
  answer:
    type: tuple
    value: [2, 2, 3]
  hints:
    - |
      平行四边形的对边平行且相等，所以$\overrightarrow{AB}=\overrightarrow{DC}$。
    - |
      $\overrightarrow{AB}=(2,1,-2)$，而$\overrightarrow{DC}$是$C$的坐标减$D$的坐标。
    - |
      $D$的坐标$=C$的坐标$-\overrightarrow{AB}=(4-2,\ 3-1,\ 1-(-2))=(2,2,3)$。验算：$\overrightarrow{AD}=(1,2,1)=\overrightarrow{BC}$。
  solution: |
    由$\overrightarrow{AB}=\overrightarrow{DC}$，$D=(4,3,1)-(2,1,-2)=(2,2,3)$，填 `2, 2, 3`。

- id: p5
  tier: hard
  statement: |
    设$\vb a$、$\vb b$、$\vb c$是三角形顶点$A$、$B$、$C$的:term[位置向量]{id="math.linear-algebra.position-vector"}（position vector）。(1) 证明边$BC$的中点$M$的位置向量是$\frac12(\vb b+\vb c)$。(2) 证明三条中线都经过位置向量为$\frac13(\vb a+\vb b+\vb c)$的点，这个点叫作三角形的重心（centroid）。
  hints:
    - |
      (1) $\overrightarrow{BM}=\frac12\overrightarrow{BC}$，而$\overrightarrow{BC}=\vb c-\vb b$。
    - |
      (2) 从$A$出发，沿$\overrightarrow{AM}$走它的$\frac23$，算出到达的点的位置向量；它对$\vb a$、$\vb b$、$\vb c$有什么特点？
    - |
      (1) $M$的位置向量是$\vb b+\overrightarrow{BM}=\vb b+\frac12(\vb c-\vb b)=\frac12(\vb b+\vb c)$。

      (2) 中线$AM$上，从$A$出发沿$\overrightarrow{AM}$走它的$\frac23$，到达的点的位置向量是$\vb a+\frac23\bigl(\frac12(\vb b+\vb c)-\vb a\bigr)=\frac13\vb a+\frac13\vb b+\frac13\vb c$。这个式子对$\vb a$、$\vb b$、$\vb c$是对称的：从$B$、$C$出发的中线上按同样的比例取点，得到的是同一个位置向量。所以三条中线都经过位置向量为$\frac13(\vb a+\vb b+\vb c)$的点，并且它把每条中线分成$2:1$。
  reference: |
    (1) $\vb b+\frac12(\vb c-\vb b)=\frac12(\vb b+\vb c)$。(2) 中线$AM$上离$A$为$\frac23|AM|$的点是$\vb a+\frac23\bigl(\frac{\vb b+\vb c}2-\vb a\bigr)=\frac{\vb a+\vb b+\vb c}3$，对三个顶点对称，所以三条中线都经过它。

- id: p6
  tier: hard
  statement: |
    设$\vb u=(u_1,u_2)$与$\vb v=(v_1,v_2)$不:term[平行]{id="math.linear-algebra.parallel"}（parallel）。(1) 证明$u_1v_2-u_2v_1\ne0$。(2) 证明$\R^2$中的每个向量$\vb w=(w_1,w_2)$都能写成$\vb w=c_1\vb u+c_2\vb v$，并且系数$c_1$、$c_2$是唯一的。
  hints:
    - |
      (1) 用反证法：假设$u_1v_2-u_2v_1=0$，证明$\vb u$与$\vb v$平行。分$\vb u=\vb 0$、$u_1\ne0$、$u_1=0$而$u_2\ne0$三种情形。
    - |
      (2) 比较分量得$u_1c_1+v_1c_2=w_1$、$u_2c_1+v_2c_2=w_2$。第一个方程乘$v_2$、第二个乘$v_1$再相减，消去$c_2$；同样消去$c_1$。
    - |
      (1) 设$u_1v_2=u_2v_1$。若$\vb u=\vb 0$，它和$\vb v$平行。若$u_1\ne0$，则$v_2=\frac{v_1}{u_1}u_2$，于是$\vb v=\frac{v_1}{u_1}\vb u$。若$u_1=0$、$u_2\ne0$，则$u_2v_1=0$，$v_1=0$，于是$\vb v=\frac{v_2}{u_2}\vb u$；三种情形都平行，和假设矛盾。

      (2) 记$D=u_1v_2-u_2v_1\ne0$。消元得$Dc_1=w_1v_2-w_2v_1$、$Dc_2=u_1w_2-u_2w_1$，所以如果系数存在，只能是$c_1=\frac{w_1v_2-w_2v_1}{D}$、$c_2=\frac{u_1w_2-u_2w_1}{D}$，这就是唯一性。反过来代回去，$u_1c_1+v_1c_2=\frac{w_1(u_1v_2-u_2v_1)}{D}=w_1$，第二个方程同样成立，所以这组系数确实满足要求。
  reference: |
    (1) 若$u_1v_2=u_2v_1$：$\vb u=\vb 0$时平行；$u_1\ne0$时$\vb v=\frac{v_1}{u_1}\vb u$；$u_1=0$时$u_2\ne0$、$v_1=0$，$\vb v=\frac{v_2}{u_2}\vb u$，都与不平行矛盾。(2) 消元得$c_1=\frac{w_1v_2-w_2v_1}{D}$、$c_2=\frac{u_1w_2-u_2w_1}{D}$，$D=u_1v_2-u_2v_1\ne0$；系数只能是这组，代回验证两个方程都成立。

- id: p7
  tier: thinking
  statement: |
    平面上取两个点$P$、$Q$，在两个不同的原点$O$、$O'$下分别写出它们的位置向量。(1) 位置向量的和$\vb p+\vb q$对应的点（从原点出发走$\vb p+\vb q$到达的点），换了原点还是同一个点吗？(2) $\vb q-\vb p$和$\frac12(\vb p+\vb q)$呢？(3) 由此说说「点」和「向量」有什么不同。
  hints:
    - |
      设从$O$到$O'$的向量是$\vb d$，在新原点下的位置向量是$\vb p'=\vb p-\vb d$、$\vb q'=\vb q-\vb d$。
    - |
      把$O'$出发走$\vb p'+\vb q'$到达的点，改写成从$O$出发走某个向量到达；$\frac12(\vb p'+\vb q')$也这样改写。
    - |
      (1) 从$O'$出发走$\vb p'+\vb q'$，相当于从$O$出发走$\vb d+(\vb p+\vb q-2\vb d)=\vb p+\vb q-\vb d$，和从$O$走$\vb p+\vb q$差了$\vb d$：换了原点就是另一个点，所以「两个点相加」没有意义。

      (2) $\vb q'-\vb p'=\vb q-\vb p$，是从$P$指向$Q$的向量，和原点无关。中点：从$O'$走$\frac12(\vb p'+\vb q')$，相当于从$O$走$\vb d+\frac12(\vb p+\vb q)-\vb d=\frac12(\vb p+\vb q)$，是同一个点。一般地，$c_1\vb p+c_2\vb q$在$c_1+c_2=1$时对应的点和原点无关。

      (3) 点是位置，向量是位移：两个点相减得到向量，点加上向量得到点，可两个点不能相加。选定原点以后，点才和它的位置向量一一对应，所以前面总说「把起点放在原点」。
  reference: |
    设$O'=O+\vb d$，$\vb p'=\vb p-\vb d$、$\vb q'=\vb q-\vb d$。$\vb p'+\vb q'$对应的点比$\vb p+\vb q$对应的点差$\vb d$，依赖原点；$\vb q'-\vb p'=\vb q-\vb p$不变；中点$\frac12(\vb p+\vb q)$不变，系数和为$1$的组合都不变。点只能相减得向量，不能相加。

- id: p8
  tier: thinking
  statement: |
    定义在$\R$上的函数之间也能相加、数乘：$(f+g)(x)=f(x)+g(x)$，$(cf)(x)=cf(x)$。(1) 本节的八条运算律对函数还成立吗，这里的「零向量」是什么？(2) 如果把函数在每一点的值$f(x)$看成一个「分量」，和$\R^n$相比，函数有多少个分量？(3) $\sin x$能不能写成$x$与$x^2$的线性组合，也就是对所有$x$都有$\sin x=ax+bx^2$？
  hints:
    - |
      (1) 每一条运算律，在每个固定的$x$上都是数的运算律。
    - |
      (2) 每个实数$x$对应一个分量。(3) 假设$\sin x=ax+bx^2$对所有$x$成立，代入$x=\pi$和$x=-\pi$。
    - |
      (1) 都成立：例如$\bigl(c(f+g)\bigr)(x)=c\bigl(f(x)+g(x)\bigr)=cf(x)+cg(x)$，对每个$x$都是数的分配律。零向量是处处为零的函数，$-f$是$x\mapsto-f(x)$。

      (2) 每个实数$x$都对应一个「分量」$f(x)$，分量有无穷多个；加法、数乘仍是「按分量」进行。这就是以后[抽象向量空间](lesson:math.linear-algebra.vector-spaces)把函数也当作向量的出发点。

      (3) 不能。代入$x=\pi$和$x=-\pi$得$a\pi+b\pi^2=0$、$-a\pi+b\pi^2=0$，于是$a=b=0$，可$\sin x$不是处处为零的函数，矛盾。所以「是不是线性组合」对函数同样是个要回答的问题。
  reference: |
    运算律在每个$x$上都是数的运算律，都成立，零向量是零函数。每个$x$给出一个分量，有无穷多个分量。若$\sin x=ax+bx^2$，代入$\pm\pi$得$a=b=0$，矛盾，所以不能。
