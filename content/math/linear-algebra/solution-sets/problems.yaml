- id: p1
  tier: easy
  statement: |
    一个线性方程组的增广矩阵化成了:term[简化行阶梯形]{id="math.linear-algebra.reduced-row-echelon-form"}（reduced row echelon form）$\left(\begin{array}{cccc|c}1&0&2&0&1\\0&1&-1&0&2\\0&0&0&1&3\end{array}\right)$。它有几个:term[自由变量]{id="math.linear-algebra.free-variable"}（free variable）？
  answer:
    type: number
    value: 1
  hints:
    - |
      自由变量对应系数部分没有主元的列。
    - |
      四个未知数，主元在第 1、2、4 列。
    - |
      只有第 3 列没有主元，所以只有$x_3$是自由变量：$x_1=1-2x_3$、$x_2=2+x_3$、$x_4=3$。
  solution: |
    主元在第 1、2、4 列，只有$x_3$是自由变量，填 `1`。

- id: p2
  tier: easy
  statement: |
    一个方程组的:term[通解]{id="math.linear-algebra.general-solution"}（general solution）是$\vb x=(1,2,0)+t(3,-1,1)$。求它满足$x_3=2$的那个解，按顺序填写三个分量。
  answer:
    type: tuple
    value: [7, 0, 2]
  hints:
    - |
      通解的第三个分量是$0+t\cdot1=t$。
    - |
      $x_3=2$就是$t=2$。
    - |
      $t=2$时$\vb x=(1,2,0)+2(3,-1,1)=(7,0,2)$。
  solution: |
    $t=2$，$\vb x=(1+6,\,2-2,\,0+2)=(7,0,2)$，填 `7, 0, 2`。

- id: p3
  tier: medium
  statement: |
    方程组$x_1+2x_2+x_3=4$、$2x_1+4x_2+3x_3=9$有无穷多个解。求其中满足$x_1=x_2$的那个解，按顺序填写三个分量。
  answer:
    type: tuple
    value: [1, 1, 1]
  hints:
    - |
      先消元写出通解。
    - |
      做$R_2-2R_1$得$x_3=1$，再由第一个方程得$x_1=3-2x_2$；令$x_2=t$。
    - |
      通解是$(3-2t,\ t,\ 1)$。要$x_1=x_2$，就要$3-2t=t$，$t=1$，解是$(1,1,1)$。验算：$1+2+1=4$，$2+4+3=9$。
  solution: |
    通解$(3-2t,\,t,\,1)$，由$3-2t=t$得$t=1$，填 `1, 1, 1`。

- id: p4
  tier: medium
  statement: |
    已知$\vb p=(1,2,3)$和$\vb q=(2,1,4)$都是某个线性方程组的解。下面哪些向量一定是对应的:term[齐次线性方程组]{id="math.linear-algebra.homogeneous-system"}（homogeneous linear system）的解？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $(1,-1,1)$
      - |
        $(3,3,7)$
      - |
        $(-2,2,-2)$
      - |
        $(2,4,6)$
    value: [1, 3]
  hints:
    - |
      两个解之差是齐次方程组的解；齐次方程组的解的倍数还是它的解。
    - |
      把四个选项分别和$\vb q-\vb p$、$\vb p+\vb q$、$2\vb p$比一比。
    - |
      $(1,-1,1)=\vb q-\vb p$，$(-2,2,-2)=-2(\vb q-\vb p)$，都一定是齐次方程组的解。$(3,3,7)=\vb p+\vb q$，代入每个方程左边得到常数项的$2$倍；$(2,4,6)=2\vb p$也一样。常数项不全为零时，它们都不是齐次方程组的解，所以不能说「一定」。
  solution: |
    只有$\vb q-\vb p=(1,-1,1)$和它的倍数$(-2,2,-2)$一定是，选第 1、3 个。

- id: p5
  tier: hard
  statement: |
    设一个线性方程组有解。证明：它的解唯一，当且仅当对应的齐次方程组只有零解。
  hints:
    - |
      用「解集的结构」：全部的解是$\vb p+\vb h$，$\vb h$取遍齐次方程组的解。
    - |
      「仅当」：若齐次方程组有非零解$\vb h$，看$\vb p$和$\vb p+\vb h$。
    - |
      设$\vb p$是一个解。由解集的结构，全部的解恰好是$\vb p+\vb h$，$\vb h$取遍对应齐次方程组的解。

      若齐次方程组只有零解，全部的解就只有$\vb p+\vb 0=\vb p$，解唯一。若齐次方程组有非零解$\vb h$，那么$\vb p$和$\vb p+\vb h$是两个不同的解，解不唯一；而且对每个数$t$，$t\vb h$也是齐次方程组的解，$\vb p+t\vb h$都是解，解有无穷多个。
  reference: |
    全部解是$\vb p+\vb h$。齐次只有零解时只有$\vb p$；齐次有非零解$\vb h$时，$\vb p+t\vb h$是无穷多个不同的解。

- id: p6
  tier: hard
  statement: |
    齐次方程组按本节的办法写出通解$t_1\vb v_1+\dots+t_k\vb v_k$，$\vb v_j$是令第$j$个自由变量取$1$、其余自由变量取$0$得到的解。证明：不同的参数给出不同的解，也就是说，$t_1\vb v_1+\dots+t_k\vb v_k=\vb 0$只在$t_1=\dots=t_k=0$时成立。
  hints:
    - |
      看自由变量所在的那几个分量。
    - |
      $\vb v_j$在第$j$个自由变量的位置上是$1$，在其余自由变量的位置上是$0$。
    - |
      设自由变量是$x_{f_1},\dots,x_{f_k}$。按构造，$\vb v_j$的第$f_j$个分量是$1$，第$f_i$个分量（$i\ne j$）是$0$。所以$t_1\vb v_1+\dots+t_k\vb v_k$的第$f_i$个分量恰好是$t_i$。

      如果这个组合等于$\vb 0$，它的每个分量都是$0$，于是每个$t_i=0$。两组参数给出同一个解时，它们的差给出零向量，所以差全为零，两组参数相同。以后在[线性无关](lesson:math.linear-algebra.linear-independence)里，这样的一组向量叫作线性无关的。
  reference: |
    $\vb v_j$在自由变量$x_{f_i}$处的分量是$\delta_{ij}$（$i=j$时为$1$，否则为$0$），所以组合在$x_{f_i}$处的分量是$t_i$；组合为零推出每个$t_i=0$。

- id: p7
  tier: thinking
  statement: |
    三个未知数的线性方程组，解集可能是什么形状？能不能恰好有两个解，或者解集恰好是一个圆？
  hints:
    - |
      由解集的结构，解集是一个点加上齐次方程组的全部解。齐次方程组的解集可能是什么？
    - |
      如果$\vb p$、$\vb q$都是解，$\vb p+t(\vb q-\vb p)$呢？
    - |
      有解时，解集是$\vb p$加上齐次方程组的全部解，而齐次方程组的解集是$\{\vb 0\}$、过原点的直线、过原点的平面，或者整个空间（每个方程都是$0=0$时）。所以解集是空集、一个点、一条直线、一个平面，或者整个空间。

      不能恰好有两个解：$\vb p$、$\vb q$都是解时，$\vb q-\vb p$是齐次方程组的解，于是整条直线$\vb p+t(\vb q-\vb p)$上的点都是解。同样，圆上任取两点，连线上的其余点不在圆上，所以圆不可能是解集。线性方程组的解集总是「平直」的。
  reference: |
    解集是$\vb p$加齐次解集：空集、点、直线、平面或整个空间。两个解之间整条直线都是解，所以不会恰好两个解，也不会是圆。

- id: p8
  tier: thinking
  statement: |
    满足$f'(x)=2x$的函数$f$有哪些？和本节「特解加上齐次方程组的全部解」对照一下：哪一个是特解，哪一部分相当于齐次方程组的解？为什么会有同样的结构？
  hints:
    - |
      $x^2$满足这个等式；还有别的吗？
    - |
      若$f$、$g$都满足，$(f-g)'$等于什么？
    - |
      满足条件的是$f(x)=x^2+C$，$C$是任意常数。$x^2$是一个「特解」；两个解之差$h=f-g$满足$h'=0$，也就是「齐次」方程$h'=0$的解，它们是全体常数函数。

      同样的结构来自求导的线性：$(f+g)'=f'+g'$，$(cf)'=cf'$，和方程左边$L$的两条性质一样，所以「两个解之差满足齐次方程」的道理照样成立。常微分方程里的线性方程也是这样，见[一阶线性方程与积分因子](lesson:math.ode.linear-first-order#thm-linear-structure)。
  reference: |
    $f=x^2+C$。$x^2$是特解，常数$C$是齐次方程$h'=0$的通解。求导和方程左边一样是线性的，所以两个解之差满足齐次方程，结构相同。
