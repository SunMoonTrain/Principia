<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" font-size="13">
  <!-- 原点 (250, 250)，一个单位 70 像素；a1=(3,1)，a2=(1,2)，投影 (1.5,0.5)，u2=(-0.5,1.5)，q1、q2 是单位向量，虚线是单位圆 -->
  <line x1="50" y1="250" x2="550" y2="250" stroke="currentColor" stroke-width="1" opacity="0.45" />
  <line x1="250" y1="300" x2="250" y2="35" stroke="currentColor" stroke-width="1" opacity="0.45" />
  <circle cx="250" cy="250" r="70" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="250" y1="250" x2="451.46" y2="182.85" style="stroke: var(--accent, #2563eb)" stroke-width="2.2" />
  <path d="M 460 180 L 452.88 187.12 L 450.04 178.58 Z" style="fill: var(--accent, #2563eb)" />
