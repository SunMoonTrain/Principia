  <text x="468" y="184" font-size="15" style="fill: var(--accent, #2563eb)" fill="currentColor"><tspan font-weight="bold">a</tspan><tspan baseline-shift="sub" font-size="10">1</tspan></text>
  <text x="326" y="102" font-size="15" style="fill: var(--accent, #2563eb)" fill="currentColor"><tspan font-weight="bold">a</tspan><tspan baseline-shift="sub" font-size="10">2</tspan></text>
  <text x="359" y="237" text-anchor="middle" style="fill: var(--muted, #6b7280)" fill="currentColor">投影</text>
  <text x="207" y="139" text-anchor="end" font-size="15" style="fill: var(--warn, #a8661a)" fill="currentColor"><tspan font-weight="bold">u</tspan><tspan baseline-shift="sub" font-size="10">2</tspan></text>
  <text x="286.41" y="221.86" font-size="15" style="fill: var(--good, #0f8a5f)" fill="currentColor"><tspan font-weight="bold">q</tspan><tspan baseline-shift="sub" font-size="10">1</tspan></text>
  <text x="231.86" y="165.59" font-size="15" style="fill: var(--good, #0f8a5f)" fill="currentColor"><tspan font-weight="bold">q</tspan><tspan baseline-shift="sub" font-size="10">2</tspan></text>
  <text x="242" y="268" text-anchor="end" font-size="14" fill="currentColor"><tspan font-style="italic">O</tspan></text>
  <text x="300" y="336" text-anchor="middle" fill="currentColor"><tspan font-weight="bold">u</tspan><tspan baseline-shift="sub" font-size="10">2</tspan> = <tspan font-weight="bold">a</tspan><tspan baseline-shift="sub" font-size="10">2</tspan> − 投影，和 <tspan font-weight="bold">a</tspan><tspan baseline-shift="sub" font-size="10">1</tspan> 正交；<tspan font-weight="bold">q</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>、<tspan font-weight="bold">q</tspan><tspan baseline-shift="sub" font-size="10">2</tspan> 是单位向量</text>
