  <line x1="250" y1="250" x2="307.87" y2="230.71" style="stroke: var(--good, #0f8a5f)" stroke-width="3" />
  <path d="M 316.41 227.86 L 309.29 234.98 L 306.45 226.44 Z" style="fill: var(--good, #0f8a5f)" />
  <line x1="250" y1="250" x2="230.71" y2="192.13" style="stroke: var(--good, #0f8a5f)" stroke-width="3" />
