- id: p1
  tier: easy
  statement: |
    $k$取多少时，向量$(1,k,5)$在$\Span\{(1,1,1),(1,2,3)\}$里？
  answer:
    type: number
    value: 3
  hints:
    - |
      要找数$a$、$b$，使$a(1,1,1)+b(1,2,3)=(1,k,5)$。
    - |
      第一、三个分量给出$a+b=1$、$a+3b=5$，先解出$a$、$b$。
    - |
      $b=2$、$a=-1$，第二个分量$k=a+2b=3$。验算：$-(1,1,1)+2(1,2,3)=(1,3,5)$。
  solution: |
    由$a+b=1$、$a+3b=5$得$a=-1$、$b=2$，$k=a+2b=3$，填 `3`。

- id: p2
  tier: easy
  statement: |
    下面哪些是$\R^2$的子空间？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\{(x,y):2x-y=0\}$
      - |
        $\{(x,y):2x-y=3\}$
      - |
        $\{(x,y):y\ge0\}$
      - |
        $\{(x,y):y=x^2\}$
      - |
        $\{(x,y):x^2+y^2=0\}$
    value: [1, 5]
  hints:
    - |
      逐个检查三条：含不含$\vb 0$，对加法封不封闭，对数乘封不封闭。
    - |
      上半平面乘以$-1$会怎样？抛物线上取$(1,1)$，乘以$2$呢？
    - |
      选项 1 是齐次方程的解集，是子空间；选项 5 里$x^2+y^2=0$只有$x=y=0$，就是$\{\vb 0\}$，也是。选项 2 不含$\vb 0$；选项 3 里$(0,1)$乘以$-1$得$(0,-1)$，跑了出去；选项 4 里$2(1,1)=(2,2)$不在抛物线上。
  solution: |
    选项 1、5 是子空间；2 不含原点，3 对数乘不封闭，4 对数乘、加法都不封闭。

- id: p3
  tier: medium
  statement: |
    把$\vb b=(3,1,4)$写成$\vb v_1=(1,0,1)$、$\vb v_2=(1,1,0)$、$\vb v_3=(0,1,1)$的线性组合$x_1\vb v_1+x_2\vb v_2+x_3\vb v_3$，按顺序填写$x_1$、$x_2$、$x_3$。
  answer:
    type: tuple
    value: [3, 0, 1]
  hints:
    - |
      按分量写开：$x_1+x_2=3$、$x_2+x_3=1$、$x_1+x_3=4$。
    - |
      三个方程加起来，得$2(x_1+x_2+x_3)=8$。
    - |
      $x_1+x_2+x_3=4$，减去第二个方程得$x_1=3$，减去第三个得$x_2=0$，减去第一个得$x_3=1$。验算：$3(1,0,1)+(0,1,1)=(3,1,4)$。
  solution: |
    解方程组得$x_1=3$、$x_2=0$、$x_3=1$，填 `3, 0, 1`。

- id: p4
  tier: medium
  statement: |
    $h$取多少时，$(1,0,2)$、$(2,1,h)$、$(0,1,1)$生成不了$\R^3$？
  answer:
    type: number
    value: 5
  hints:
    - |
      以三个向量为各列，化成行阶梯形，看什么时候有一行没有主元。
    - |
      三行是$(1,2,0)$、$(0,1,1)$、$(2,h,1)$。做$R_3-2R_1$，第三行变成$(0,h-4,1)$。
    - |
      再做$R_3-(h-4)R_2$，第三行变成$(0,0,5-h)$。$h\ne5$时三行都有主元，生成$\R^3$；$h=5$时第三行全是零，生成不了。
  solution: |
    消元后第三行是$(0,0,5-h)$，$h=5$时没有主元，填 `5`。

- id: p5
  tier: hard
  statement: |
    设$V$、$W$是$\R^n$的子空间。(1) 证明它们的交集（intersection）$V\cap W$是子空间。(2) 证明它们的并集（union）$V\cup W$是子空间，当且仅当$V\subseteq W$或$W\subseteq V$。
  hints:
    - |
      (1) 逐条验证子空间的三个条件：两个向量同在$V$和$W$里时，它们的和在哪里？
    - |
      (2)「当」的方向直接看出；「仅当」用反证：取$\vb v\in V$不在$W$里、$\vb w\in W$不在$V$里，看$\vb v+\vb w$。
    - |
      (1) $\vb 0$既在$V$里又在$W$里。若$\vb u,\vb v\in V\cap W$，则$\vb u+\vb v$在$V$里、也在$W$里；数乘同理。

      (2) 若$V\subseteq W$，则$V\cup W=W$是子空间；反过来同理。若两个都不包含另一个，取上面的$\vb v$、$\vb w$。假如$\vb v+\vb w\in V$，则$\vb w=(\vb v+\vb w)-\vb v\in V$，矛盾；同理它也不在$W$里，所以$V\cup W$对加法不封闭。例如过原点的两条不同直线，并起来不是子空间。
  reference: |
    (1) 三个条件在$V$、$W$里都成立，所以在交集里成立。(2) 一个包含另一个时并集就是较大的那个；否则取$\vb v\in V\setminus W$、$\vb w\in W\setminus V$，$\vb v+\vb w$在$V$里会推出$\vb w\in V$，在$W$里会推出$\vb v\in W$，所以它不在并集里。

- id: p6
  tier: hard
  statement: |
    证明：$\Span\{\vb v_1,\dots,\vb v_k,\vb w\}=\Span\{\vb v_1,\dots,\vb v_k\}$，当且仅当$\vb w\in\Span\{\vb v_1,\dots,\vb v_k\}$。由此说明：一组向量里，把能用其余向量的线性组合表示的那一个去掉，生成的子空间不变。
  hints:
    - |
      右边总是包含在左边里：给$\vb w$配上系数$0$。
    - |
      「仅当」：$\vb w$本身在左边。「当」：把$\vb w$写成$\vb v_i$的组合，代进左边的任意一个线性组合。
    - |
      右边的每个线性组合，给$\vb w$配上系数$0$，就是左边的线性组合，所以右边包含在左边里。若两边相等，$\vb w=0\vb v_1+\dots+0\vb v_k+1\cdot\vb w$在左边，也就在右边。反过来，若$\vb w=a_1\vb v_1+\dots+a_k\vb v_k$，则$c_1\vb v_1+\dots+c_k\vb v_k+d\vb w=(c_1+da_1)\vb v_1+\dots+(c_k+da_k)\vb v_k$，左边的每个向量都在右边。

      所以一组向量里如果有一个能用其余的线性组合表示，去掉它，生成的子空间不变；反复这样做，可以把多余的向量都去掉。
  reference: |
    右边总在左边里。两边相等时$\vb w$在右边；反过来$\vb w=\sum a_i\vb v_i$时，左边的组合$\sum c_i\vb v_i+d\vb w=\sum(c_i+da_i)\vb v_i$在右边。

- id: p7
  tier: thinking
  statement: |
    $\R^3$的子空间有哪几种？说明理由，可以用上面「生成整个$\R^n$」的定理。
  hints:
    - |
      设$V\ne\{\vb 0\}$，取$V$里的非零向量$\vb u$。$V$至少含有哪个集合？
    - |
      $V$里还有不在$\Span\{\vb u\}$上的$\vb v$时呢？再有不在$\Span\{\vb u,\vb v\}$上的$\vb w$时，看以$\vb u$、$\vb v$、$\vb w$为各列的行阶梯形。
    - |
      只有四种：$\{\vb 0\}$、过原点的直线、过原点的平面、$\R^3$本身。若$V$有非零向量$\vb u$，由子空间的定义，$V$含有直线$\Span\{\vb u\}$；$V$就是这条直线时到此为止。否则有$\vb v\in V$不在这条直线上，$V$含有平面$\Span\{\vb u,\vb v\}$。

      若$V$还有不在这个平面上的$\vb w$，以$\vb u$、$\vb v$、$\vb w$为各列化成行阶梯形。假如有一列没有主元，齐次方程组$x_1\vb u+x_2\vb v+x_3\vb w=\vb 0$就有非零解：$x_3\ne0$时$\vb w$能用$\vb u$、$\vb v$表示，落在平面上；$x_3=0$时$\vb v$落在直线$\Span\{\vb u\}$上（$x_2=0$时还会得出$\vb u=\vb 0$）；都不可能。所以三列都有主元，三行也就都有主元，由那个定理，$V$含有$\Span\{\vb u,\vb v,\vb w\}=\R^3$。
  reference: |
    $\{\vb 0\}$、过原点的直线、过原点的平面、$\R^3$。逐个加入不在已生成部分里的向量；第三个向量加入后，三列都有主元（否则会推出它在平面上或前两个平行），由「生成整个$\R^n$」的定理，生成$\R^3$。

- id: p8
  tier: thinking
  statement: |
    生成允许系数取负数。只许取非负系数时，$\vb u=(1,0)$、$\vb v=(1,1)$的全部组合$a\vb u+b\vb v$（$a,b\ge0$）组成什么样的集合？它是子空间吗？把两种原料各取若干份混在一起，混合物里各种成分的含量是两种原料成分的这种组合，为什么用不上负系数？
  hints:
    - |
      $a\vb u$、$b\vb v$分别落在哪两条射线上？
    - |
      $a\vb u+b\vb v=(a+b,\ b)$，看横坐标和纵坐标的关系。
    - |
      记$(x,y)=(a+b,\ b)$，则$b=y\ge0$、$a=x-y\ge0$，所以这个集合是$\{(x,y):0\le y\le x\}$，即射线$a\vb u$和射线$b\vb v$之间的角形区域，这样的集合叫作锥（cone）。它对加法、对乘以非负数都封闭，乘以$-1$却跑了出去，不是子空间。

      混合时每种原料用的份数不能是负数，「取负一份」做不到，所以能配出的成分只占这个锥；允许负系数的$\Span\{\vb u,\vb v\}$却是整个平面。判断能不能配出某个成分，除了方程组要有解，还要解是非负的。
  reference: |
    集合是$\{(x,y):0\le y\le x\}$，两条射线之间的锥，对乘以$-1$不封闭，不是子空间。原料的份数不能为负，能配出的只是非负组合，所以还要求解非负。
