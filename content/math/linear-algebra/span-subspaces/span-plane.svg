  <circle cx="484.8" cy="156.11" r="2.4" style="fill: var(--warn, #a8661a)" />
  <circle cx="460" cy="165" r="2.6" fill="currentColor" />
  <text x="522" y="141" font-size="14" style="fill: var(--accent, #2563eb)" fill="currentColor"><tspan font-weight="bold">u</tspan></text>
  <text x="418.4" y="202.2" text-anchor="end" font-size="14" style="fill: var(--good, #0f8a5f)" fill="currentColor"><tspan font-weight="bold">v</tspan></text>
  <text x="492.8" y="98.4" font-size="14" style="fill: var(--warn, #a8661a)" fill="currentColor"><tspan font-weight="bold">b</tspan></text>
