  <text x="170.4" y="152.7" text-anchor="end" font-size="14" style="fill: var(--accent, #2563eb)" fill="currentColor"><tspan font-weight="bold">u</tspan></text>
  <text x="206.8" y="138.4" text-anchor="end" style="fill: var(--accent, #2563eb)" fill="currentColor">2<tspan font-weight="bold">u</tspan></text>
  <text x="95.6" y="183.3" text-anchor="end" style="fill: var(--accent, #2563eb)" fill="currentColor">−<tspan font-weight="bold">u</tspan></text>
  <text x="140" y="300" text-anchor="middle" fill="currentColor"><tspan font-style="normal">span</tspan>{<tspan font-weight="bold">u</tspan>}：过原点的直线</text>
