<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-size="13">
  <!-- 左：span{u} 是过原点的直线，u = (0.5, 1, 0.5)，标出 -u、u、2u；右：span{u, v} 是过原点的平面的一块，u = (0, 1.4, 0.7)、v = (1.4, 0, -0.2)，虚线补成平行四边形，第四个顶点 u + v 在平面上，b = (0.3, 0.8, 1.9) 在平面上方，虚线竖直连到平面上的 (0.3, 0.8, 0.36)。斜投影：x 轴画向左下 (-0.6, 0.45)，y 轴向右，z 轴向上 -->
  <line x1="70.84" y1="202.17" x2="231" y2="139.25" style="stroke: var(--accent, #2563eb)" stroke-width="1.6" opacity="0.75" />
