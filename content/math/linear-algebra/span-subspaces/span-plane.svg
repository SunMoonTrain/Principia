  <path d="M 516 137 L 509.96 145.05 L 505.94 137 Z" style="fill: var(--accent, #2563eb)" />
  <line x1="460" y1="165" x2="432.8" y2="191.87" style="stroke: var(--good, #0f8a5f)" stroke-width="2.4" />
  <path d="M 426.4 198.2 L 429.64 188.67 L 435.96 195.08 Z" style="fill: var(--good, #0f8a5f)" />
  <circle cx="482.4" cy="170.2" r="3.2" fill="currentColor" />
  <line x1="484.8" y1="94.4" x2="484.8" y2="156.11" style="stroke: var(--warn, #a8661a)" stroke-width="1.2" stroke-dasharray="4 3" />
  <line x1="460" y1="165" x2="481.82" y2="102.89" style="stroke: var(--warn, #a8661a)" stroke-width="2.2" />
