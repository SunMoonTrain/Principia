- id: p1
  tier: easy
  statement: |
    求$\Span\{(1,-1,0),(2,-2,0),(0,1,1)\}$的维数。
  answer:
    type: number
    value: 2
  hints:
    - |
      先看有没有一个向量是另一个的倍数。
    - |
      $(2,-2,0)=2(1,-1,0)$，去掉它生成的子空间不变；剩下两个向量平行（parallel）吗？
    - |
      $(1,-1,0)$、$(0,1,1)$不平行，线性无关，是一组基，维数是$2$。
  solution: |
    去掉$(2,-2,0)$后剩两个线性无关的向量，维数是$2$，填 `2`。

- id: p2
  tier: easy
  statement: |
    $\mathcal B=\bigl((1,1),(1,-1)\bigr)$是$\R^2$的一组基。求$\vb v=(5,1)$的坐标向量$[\vb v]_{\mathcal B}$，按顺序填写两个数。
  answer:
    type: tuple
    value: [3, 2]
  hints:
    - |
      设$\vb v=c_1(1,1)+c_2(1,-1)$，按分量写开。
    - |
      $c_1+c_2=5$、$c_1-c_2=1$。
    - |
      两式相加得$c_1=3$，相减得$c_2=2$。验算：$3(1,1)+2(1,-1)=(5,1)$。
  solution: |
    $c_1=3$、$c_2=2$，填 `3, 2`。

- id: p3
  tier: medium
  statement: |
    求方程组$x_1+x_2+x_3+x_4=0$、$x_1-x_2+x_3-x_4=0$的解集的维数。
  answer:
    type: number
    value: 2
  hints:
    - |
      解集的维数等于自由变量的个数。
    - |
      做$R_2-R_1$，第二行变成$(0,-2,0,-2)$。
    - |
      主元在第一、二列，$x_3$、$x_4$是自由变量，维数是$2$。通解是$x_3(-1,0,1,0)+x_4(0,-1,0,1)$，这两个向量是一组基。
  solution: |
    两个主元、四个未知数，自由变量$2$个，维数是$2$，填 `2`。

- id: p4
  tier: medium
  statement: |
    $k$取多少时，$(1,2,0)$、$(0,1,k)$、$(1,0,1)$不是$\R^3$的一组基？
  answer:
    type: number
    value: -1/2
  hints:
    - |
      $\dim\R^3=3$，三个向量只要线性无关就是一组基。
    - |
      以三个向量为各列，三行是$(1,0,1)$、$(2,1,0)$、$(0,k,1)$；做$R_2-2R_1$得$(0,1,-2)$。
    - |
      再做$R_3-kR_2$，第三行是$(0,0,1+2k)$。$k=-\frac12$时第三列没有主元，三个向量线性相关，不是基；其余时候是基。
  solution: |
    消元后第三行是$(0,0,1+2k)$，$k=-\frac12$时不是基，填 `-1/2`。

- id: p5
  tier: hard
  statement: |
    设$W$、$V$是$\R^n$的子空间，$W\subseteq V$。证明$\dim W\le\dim V$，并且等号成立时$W=V$。
  hints:
    - |
      取$W$的一组基，它在$V$里线性无关；$V$由它的一组基生成。
    - |
      等号成立时，用「个数对了，只需查一条」那个定理。
    - |
      取$W$的一组基，共$\dim W$个向量，它们在$V$里线性无关。$V$由它的一组基的$\dim V$个向量生成，由「个数的上限」那个定理，$\dim W\le\dim V$。

      若$\dim W=\dim V=k$，$W$的基是$V$里$k$个线性无关的向量，由「个数对了，只需查一条」，它们也是$V$的一组基，生成$V$。于是$V=\Span(W\text{的基})=W$。例如$\R^3$里，含在一个平面里的平面就是它自己。
  reference: |
    $W$的基在$V$里线性无关，而$V$由$\dim V$个向量生成，所以$\dim W\le\dim V$。相等时$W$的基是$V$里个数等于维数的无关组，也是$V$的基，所以$W=V$。

- id: p6
  tier: hard
  statement: |
    设$V$是$\R^n$的子空间，$\dim V=k$。证明：(1) $V$里任何一组线性无关的向量，都能添上$V$里的一些向量成为$V$的一组基；(2) 任何一组生成$V$的向量，都能去掉其中一些成为$V$的一组基。
  hints:
    - |
      (1) 照「基总是存在」的证明，从这组无关的向量开始往上加。
    - |
      (2) 照[生成与子空间](lesson:math.linear-algebra.span-subspaces)第 6 题，一个一个去掉多余的向量。
    - |
      (1) 若这组向量还生成不了$V$，取$V$里一个不在已生成的子空间里的向量加进去，由[线性无关](lesson:math.linear-algebra.linear-independence)第 5 题仍线性无关。$V$里线性无关的向量至多$k$个，所以加不了几次就停，停下时这组向量生成$V$，是一组基。

      (2) 若这组向量线性相关，其中有一个能用其余的表示，去掉它，生成的子空间仍是$V$。向量个数每次减少一个，最后剩下的一组线性无关又生成$V$，是一组基；这正是用主元列挑基的道理。
  reference: |
    (1) 不生成$V$就添一个不在已生成部分里的向量，保持无关，至多$k$个时停下，得到基。(2) 相关就去掉一个能用其余表示的向量，生成的子空间不变，最后得到无关的生成组，即基。

- id: p7
  tier: thinking
  statement: |
    设$\mathcal B=(\vb b_1,\vb b_2)$是$\R^3$里某个平面$V$的一组基。$V$里两个向量相加、乘以数时，它们的坐标向量怎样变？为什么说借助坐标，可以把$V$当作$\R^2$来计算？
  hints:
    - |
      设$\vb u=a_1\vb b_1+a_2\vb b_2$、$\vb v=c_1\vb b_1+c_2\vb b_2$，写出$\vb u+\vb v$、$t\vb u$。
    - |
      坐标是唯一的，所以算出来的系数就是坐标。
    - |
      $\vb u+\vb v=(a_1+c_1)\vb b_1+(a_2+c_2)\vb b_2$，$t\vb u=(ta_1)\vb b_1+(ta_2)\vb b_2$，由坐标的唯一性，$[\vb u+\vb v]_{\mathcal B}=[\vb u]_{\mathcal B}+[\vb v]_{\mathcal B}$，$[t\vb u]_{\mathcal B}=t[\vb u]_{\mathcal B}$。

      所以$\vb v\mapsto[\vb v]_{\mathcal B}$是$V$和$\R^2$之间的一一对应，而且把加法对应到加法、数乘（scalar multiplication）对应到数乘：在$V$里做的任何线性运算，都可以先换成坐标，在$\R^2$里算完再换回来。[抽象向量空间](lesson:math.linear-algebra.vector-spaces)里，多项式、函数这类「向量」也正是借助坐标，和$\R^n$对应起来。
  reference: |
    坐标对加法、数乘都「保持」：$[\vb u+\vb v]=[\vb u]+[\vb v]$，$[t\vb u]=t[\vb u]$。所以坐标给出$V$与$\R^2$的一一对应，运算原样对应，可以在$\R^2$里计算。

- id: p8
  tier: thinking
  statement: |
    随手取$\R^3$里的三个向量（比如各个分量都是随意取的实数），它们恰好线性相关的可能性大吗？为什么说线性相关是一种「巧合」？
  hints:
    - |
      前两个向量多半不平行，生成一个平面。第三个向量要落在哪里，三个才会相关？
    - |
      一个平面在整个三维空间里占多大的地方？
    - |
      前两个向量平行的情形很特殊；不平行时它们生成一个过原点的平面，三个向量相关，当且仅当第三个恰好落在这个平面上。平面是$2$维的，在$3$维空间里「没有厚度」，随意取的一点恰好落在上面的可能性是零，所以随手取的三个向量几乎总是一组基。

      反过来，相关时只要把向量稍微挪一点，多半就变成无关的了；所以实际问题里遇到相关的向量，往往说明背后有一条精确的关系（例如某个量守恒、某个方程是另外两个之和），不是凑巧。只有像小整数这样「刻意取」的分量，才容易碰上相关。
  reference: |
    三个向量相关，当且仅当第三个落在前两个生成的平面上（前两个不平行时）；平面在三维空间里没有体积，随意取的点落在上面的可能性为零，所以几乎总是一组基。相关往往反映一条精确的关系。
