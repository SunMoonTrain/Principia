- id: p1
  tier: easy
  statement: |
    求多项式$p=3+2x-x^2$在$P_2$的基$\mathcal B=(1,\ 1+x,\ 1+x+x^2)$下的坐标向量，按顺序填写三个数。
  answer:
    type: tuple
    value: [1, 3, -1]
  hints:
    - |
      设$p=c_1\cdot1+c_2(1+x)+c_3(1+x+x^2)$，按$1$、$x$、$x^2$的系数比较。
    - |
      $x^2$的系数：$c_3=-1$；$x$的系数：$c_2+c_3=2$；常数项：$c_1+c_2+c_3=3$。
    - |
      $c_3=-1$、$c_2=3$、$c_1=1$。验算：$1+3(1+x)-(1+x+x^2)=3+2x-x^2$。
  solution: |
    $c_3=-1$、$c_2=3$、$c_1=1$，填 `1, 3, -1`。

- id: p2
  tier: easy
  statement: |
    按通常的加法和数乘，下面哪些集合是向量空间？
  answer:
    type: choice
    multiple: true
    options:
      - |
        形如$a+bx+(a+b)x^2$的多项式全体（$a$、$b$取遍实数）
      - |
        系数都是整数的多项式全体
      - |
        $\R$上满足$f(1)=0$的实函数全体
      - |
        $\R$上满足$f(0)=1$的实函数全体
      - |
        $\R$上处处满足$|f(x)|\le1$的实函数全体
    value: [1, 3]
  hints:
    - |
      它们都在一个更大的向量空间里，只要查：含不含零向量，对加法、数乘封不封闭。
    - |
      零多项式、零函数在不在里面？乘以$\frac12$、乘以$2$以后呢？
    - |
      选项 A 是$a(1+x^2)+b(x+x^2)$，即$1+x^2$、$x+x^2$生成的子空间。选项 C 里，$f(1)=0$、$g(1)=0$时$(f+g)(1)=0$、$(cf)(1)=0$，零函数也在，是子空间。选项 B 里$x$乘以$\frac12$得$\frac12x$，系数不是整数；选项 D 里零函数不满足$f(0)=1$；选项 E 里常数函数$1$在里面，乘以$2$得到的常数函数$2$却不在。
  solution: |
    选项 A、C 是向量空间；B 对数乘不封闭，D 不含零向量，E 对加法、数乘都不封闭。

- id: p3
  tier: medium
  statement: |
    求$P_3$的子空间$W=\{p\in P_3:p(1)=0\}$的维数。
  answer:
    type: number
    value: 3
  hints:
    - |
      在基$1,x,x^2,x^3$下，$p=a_0+a_1x+a_2x^2+a_3x^3$，$p(1)=0$是关于系数的一个方程。
    - |
      $a_0+a_1+a_2+a_3=0$：一个方程、四个未知数，有几个自由变量（free variable）？
    - |
      $a_1$、$a_2$、$a_3$是自由变量，维数是$3$；通解（general solution）给出一组基$x-1$、$x^2-1$、$x^3-1$。
  solution: |
    条件是$a_0+a_1+a_2+a_3=0$，自由变量$3$个，维数是$3$，填 `3`。

- id: p4
  tier: medium
  statement: |
    $k$取多少时，$P_2$里的$1+x$、$x+x^2$、$k+x^2$线性相关？
  answer:
    type: number
    value: -1
  hints:
    - |
      在基$1,x,x^2$下取坐标：$(1,1,0)$、$(0,1,1)$、$(k,0,1)$。
    - |
      以它们为各列，三行是$(1,0,k)$、$(1,1,0)$、$(0,1,1)$；做$R_2-R_1$得$(0,1,-k)$。
    - |
      再做$R_3-R_2$，第三行是$(0,0,1+k)$，$k=-1$时第三列没有主元，线性相关。这时$-1+x^2=(x+x^2)-(1+x)$。
  solution: |
    消元后第三行是$(0,0,1+k)$，$k=-1$时相关，填 `-1`。

- id: p5
  tier: hard
  statement: |
    只用向量空间的八条运算律证明：(1) 零向量只有一个；(2) $0\vb v=\vb 0$；(3) $(-1)\vb v=-\vb v$。
  hints:
    - |
      (1) 若$\vb 0$、$\vb 0'$都是零向量，看$\vb 0+\vb 0'$。
    - |
      (2) $0\vb v=(0+0)\vb v=0\vb v+0\vb v$，两边加上$-(0\vb v)$。
    - |
      (1) $\vb 0'=\vb 0'+\vb 0=\vb 0+\vb 0'=\vb 0$，第一个等号用$\vb 0$是零向量，第三个用$\vb 0'$是零向量，中间用交换律。

      (2) $0\vb v=(0+0)\vb v=0\vb v+0\vb v$，两边加上$-(0\vb v)$，用结合律得$\vb 0=0\vb v$。(3) $\vb v+(-1)\vb v=1\vb v+(-1)\vb v=(1-1)\vb v=0\vb v=\vb 0$，所以$(-1)\vb v$就是$\vb v$的相反向量；相反向量也只有一个，证法同 (1)。这些在$\R^n$里显而易见，可在一般的向量空间里，只能从八条推出来。
  reference: |
    (1) $\vb 0'=\vb 0'+\vb 0=\vb 0$。(2) $0\vb v=0\vb v+0\vb v$，两边加相反向量。(3) $\vb v+(-1)\vb v=(1-1)\vb v=\vb 0$，相反向量唯一。

- id: p6
  tier: hard
  statement: |
    设$a\ne b$。证明$e^{ax}$、$e^{bx}$作为$\R$上的函数线性无关。
  hints:
    - |
      设$c_1e^{ax}+c_2e^{bx}=0$对每个$x$成立，取两个方便的点。
    - |
      $x=0$给出$c_1+c_2=0$；再两边乘以$e^{-ax}$。
    - |
      设$c_1e^{ax}+c_2e^{bx}=0$对每个$x$成立。两边乘以$e^{-ax}$，得$c_1+c_2e^{(b-a)x}=0$对每个$x$成立。$b-a\ne0$，$e^{(b-a)x}$不是常数，在$x=0$处是$1$，在另一点是不等于$1$的正数，两个点给出$c_1+c_2=0$和$c_1+c_2q=0$（$q\ne1$），所以$c_2=0$，$c_1=0$。

      这说明不同的指数函数「方向不同」；:term[常微分方程]{id="math.ode.ode"}（ordinary differential equation）里，$y''-3y'+2y=0$的解$e^x$、$e^{2x}$是解空间的一组基，靠的就是这一点。
  reference: |
    乘以$e^{-ax}$得$c_1+c_2e^{(b-a)x}\equiv0$；在$x=0$和另一点各取值，得$c_1+c_2=0$、$c_1+c_2q=0$（$q\ne1$），所以$c_1=c_2=0$。

- id: p7
  tier: thinking
  statement: |
    在全体正实数组成的集合$V$上，规定「加法」$u\oplus v=uv$、「数乘」$c\odot v=v^c$。$V$是向量空间吗？它的零向量是什么，维数是多少？用什么办法可以把它和$\R$对应起来？
  hints:
    - |
      逐条检查八条运算律；零向量要满足$v\oplus\vb 0=v$。
    - |
      $\ln(uv)=\ln u+\ln v$，$\ln(v^c)=c\ln v$。
    - |
      八条都成立：例如$c\odot(u\oplus v)=(uv)^c=u^cv^c=(c\odot u)\oplus(c\odot v)$，$(c+d)\odot v=v^{c+d}=v^cv^d$。零向量是$1$，因为$v\oplus1=v$；$v$的相反向量是$\frac1v$。任何$v=e^{\ln v}=(\ln v)\odot e$，所以$e$一个就构成一组基，维数是$1$。

      $v\mapsto\ln v$是$V$到$\R$的一一对应，把$\oplus$变成加法、$\odot$变成数乘，正是同构；坐标就是对数。这说明向量空间看的只是运算满足的规律，元素长什么样、运算叫什么都无关紧要。
  reference: |
    是向量空间，零向量是$1$，相反向量是$\frac1v$；$e$构成一组基，维数$1$；$\ln$把它同构地对应到$\R$。

- id: p8
  tier: thinking
  statement: |
    为什么说$\R$上全体实函数组成的向量空间是无限维的？假如它是$n$维的，会和哪个定理矛盾？
  hints:
    - |
      $1,x,\dots,x^n$这$n+1$个函数线性无关吗？
    - |
      $n$维空间里最多有几个线性无关的向量？
    - |
      $1,x,\dots,x^n$线性无关：组合处处为零的多项式有无穷多个根，系数全是零。假如函数空间是$n$维的，它由一组基的$n$个向量生成，由「个数的上限」，任何$n+1$个向量都线性相关，矛盾。所以它不能由有限个函数生成，是无限维的。

      直观地说，有限个函数的线性组合只能描述「有限多个参数」的一族函数，而函数可以随意地变来变去。处理无限维空间要用到极限，例如把函数写成无穷多项之和，这是泰勒级数（Taylor series）、:term[傅里叶级数]{id="math.analysis.fourier-series"}（Fourier series）的出发点。
  reference: |
    $1,x,\dots,x^n$对每个$n$都线性无关；若空间是$n$维的，$n+1$个向量必相关，矛盾。所以是无限维的。
