<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-size="13">
  <!-- 左右两个复平面，原点 (165, 160)、(475, 160)，一个单位 78 像素；左：z1 = 1，z1² = 1；右：z2 = i，z2² = -1，|z2|² = 1 -->
  <line x1="40" y1="160" x2="290" y2="160" stroke="currentColor" stroke-width="1" opacity="0.45" />
  <line x1="165" y1="42" x2="165" y2="278" stroke="currentColor" stroke-width="1" opacity="0.45" />
  <circle cx="165" cy="160" r="78" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
  <text x="173" y="54" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">虚轴</text>
  <line x1="350" y1="160" x2="600" y2="160" stroke="currentColor" stroke-width="1" opacity="0.45" />
  <line x1="475" y1="42" x2="475" y2="278" stroke="currentColor" stroke-width="1" opacity="0.45" />
  <circle cx="475" cy="160" r="78" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
  <text x="483" y="54" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">虚轴</text>
  <line x1="165" y1="160" x2="234" y2="160" style="stroke: var(--accent, #2563eb)" stroke-width="2.4" />
  <path d="M 243 160 L 234 164.5 L 234 155.5 Z" style="fill: var(--accent, #2563eb)" />
  <circle cx="243" cy="160" r="5" style="fill: var(--accent, #2563eb)" />
  <text x="47" y="178" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">实轴</text>
  <text x="595" y="152" text-anchor="end" font-size="12" style="fill: var(--muted, #6b7280)" fill="currentColor">实轴</text>
  <text x="253" y="150" style="fill: var(--accent, #2563eb)" fill="currentColor"><tspan font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">1</tspan> = 1</text>
  <text x="255" y="186" style="fill: var(--accent, #2563eb)" fill="currentColor"><tspan font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">1</tspan><tspan baseline-shift="super" font-size="10">2</tspan> = 1</text>
  <text x="165" y="26" text-anchor="middle" font-size="14" fill="currentColor">第一个分量 <tspan font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">1</tspan> = 1</text>
  <line x1="475" y1="160" x2="475" y2="91" style="stroke: var(--accent, #2563eb)" stroke-width="2.4" />
  <path d="M 475 82 L 479.5 91 L 470.5 91 Z" style="fill: var(--accent, #2563eb)" />
  <circle cx="475" cy="82" r="5" style="fill: var(--accent, #2563eb)" />
  <text x="463" y="70" text-anchor="end" style="fill: var(--accent, #2563eb)" fill="currentColor"><tspan font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">2</tspan> = <tspan font-style="italic">i</tspan></text>
  <circle cx="397" cy="160" r="5" style="fill: var(--warn, #a8661a)" />
  <text x="385" y="186" text-anchor="end" style="fill: var(--warn, #a8661a)" fill="currentColor"><tspan font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">2</tspan><tspan baseline-shift="super" font-size="10">2</tspan> = −1</text>
  <circle cx="553" cy="160" r="5" style="fill: var(--good, #0f8a5f)" />
  <text x="565" y="186" style="fill: var(--good, #0f8a5f)" fill="currentColor">|<tspan font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">2</tspan>|<tspan baseline-shift="super" font-size="10">2</tspan> = 1</text>
  <text x="475" y="26" text-anchor="middle" font-size="14" fill="currentColor">第二个分量 <tspan font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">2</tspan> = <tspan font-style="italic">i</tspan></text>
  <text x="320" y="304" text-anchor="middle" style="fill: var(--warn, #a8661a)" fill="currentColor">照搬点积：<tspan font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">1</tspan><tspan baseline-shift="super" font-size="10">2</tspan> + <tspan font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">2</tspan><tspan baseline-shift="super" font-size="10">2</tspan> = 1 + (−1) = 0</text>
  <text x="320" y="336" text-anchor="middle" style="fill: var(--good, #0f8a5f)" fill="currentColor">先取共轭：|<tspan font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">1</tspan>|<tspan baseline-shift="super" font-size="10">2</tspan> + |<tspan font-style="italic">z</tspan><tspan baseline-shift="sub" font-size="10">2</tspan>|<tspan baseline-shift="super" font-size="10">2</tspan> = 1 + 1 = 2</text>
</svg>
