  <text x="260" y="342" text-anchor="middle" fill="currentColor">绿点是数据，虚线段是残差：数据减去直线上的值</text>
  <text x="260" y="370" text-anchor="middle" fill="currentColor">残差的平方和是 1，换任何一条直线都更大</text>
