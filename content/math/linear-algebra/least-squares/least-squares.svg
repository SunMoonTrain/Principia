  <circle cx="80" cy="248" r="5" style="fill: var(--good, #0f8a5f)" />
  <circle cx="80" cy="222" r="3" style="fill: var(--accent, #2563eb)" />
  <line x1="180" y1="144" x2="180" y2="170" style="stroke: var(--warn, #a8661a)" stroke-width="2" stroke-dasharray="5 3" />
  <circle cx="180" cy="144" r="5" style="fill: var(--good, #0f8a5f)" />
