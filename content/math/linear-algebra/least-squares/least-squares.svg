<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" font-size="13">
  <!-- 横轴 t、纵轴 y；原点 (80, 300)，t 方向一个单位 100 像素，y 方向 52 像素；四个数据点、拟合直线 y = 1.5 + t、四条竖直的残差线段 -->
  <line x1="50" y1="300" x2="472" y2="300" stroke="currentColor" stroke-width="1.2" />
  <path d="M 480 300 L 472 304 L 472 296 Z" fill="currentColor" />
