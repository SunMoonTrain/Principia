- id: p1
  tier: easy
  statement: |
    解:term[线性方程组]{id="math.linear-algebra.linear-system"}（system of linear equations）$x+3y=5$、$2x-y=3$，按顺序填写$x$、$y$。
  answer:
    type: tuple
    value: [2, 1]
  hints:
    - |
      写出增广矩阵$\left(\begin{array}{cc|c}1&3&5\\2&-1&3\end{array}\right)$，用第一行消去第二行的$x$。
    - |
      做$R_2-2R_1$，第二行变成$(0\ \ -7\mid-7)$。
    - |
      $-7y=-7$，$y=1$；回代$x=5-3y=2$。验算：$2\cdot2-1=3$。
  solution: |
    $R_2-2R_1$得$-7y=-7$，$y=1$，$x=5-3=2$，填 `2, 1`。

- id: p2
  tier: easy
  statement: |
    一个线性方程组的增广矩阵化成了:term[行阶梯形]{id="math.linear-algebra.row-echelon-form"}（row echelon form）$\left(\begin{array}{ccc|c}1&-3&2&4\\0&2&-1&1\\0&0&0&0\end{array}\right)$。这个方程组的解是什么情况？
  answer:
    type: choice
    multiple: false
    options:
      - |
        无解
      - |
        恰有一个解
      - |
        有无穷多个解
    value: 3
  hints:
    - |
      先看有没有$(0\ 0\ 0\mid b)$、$b\ne0$这样的行。
    - |
      最后一行全是零，不会推出矛盾；再看三个未知数的列是不是都有:term[主元]{id="math.linear-algebra.pivot"}（pivot）。
    - |
      主元在第一、二列，第三列没有主元，对应的未知数可以任意取值，所以有无穷多个解。
  solution: |
    没有$0=b\ne0$的行，第三列没有主元，有无穷多个解，选第 3 个。

- id: p3
  tier: medium
  statement: |
    用:term[高斯消元法]{id="math.linear-algebra.gaussian-elimination"}（Gaussian elimination）解方程组$x+y+z=6$、$2x-y+z=3$、$x+2y-z=2$，按顺序填写$x$、$y$、$z$。
  answer:
    type: tuple
    value: [1, 2, 3]
  hints:
    - |
      先做$R_2-2R_1$、$R_3-R_1$，消去第二、三个方程里的$x$。
    - |
      得到$(0\ \ -3\ \ -1\mid-9)$和$(0\ \ 1\ \ -2\mid-4)$。交换这两行，再用新的第二行消去第三行的$y$。
    - |
      交换后做$R_3+3R_2$：$(0\ \ -3\ \ -1\mid-9)+3(0\ \ 1\ \ -2\mid-4)=(0\ \ 0\ \ -7\mid-21)$，所以$z=3$；由$y-2z=-4$得$y=2$；由$x+y+z=6$得$x=1$。验算第三个方程：$1+4-3=2$。
  solution: |
    消元得$-7z=-21$，$z=3$，回代$y=2$、$x=1$，填 `1, 2, 3`。

- id: p4
  tier: medium
  statement: |
    方程组$x+y+z=1$、$x+2y+2z=2$、$x+2y+hz=k$里，$h$、$k$取什么值时有无穷多个解？按顺序填写$h$、$k$。
  answer:
    type: tuple
    value: [2, 2]
  hints:
    - |
      消元化成行阶梯形，看最后一行。
    - |
      做$R_2-R_1$、$R_3-R_1$，再做$R_3-R_2$，最后一行是$(0\ \ 0\ \ h-2\mid k-2)$。
    - |
      $h\ne2$时第三列有主元，有唯一解；$h=2$、$k\ne2$时最后一行是$0=k-2\ne0$，无解；$h=2$、$k=2$时最后一行全是零，第三列没有主元，有无穷多个解。
  solution: |
    最后一行是$(0\ 0\ h-2\mid k-2)$，无穷多解要$h=2$、$k=2$，填 `2, 2`。

- id: p5
  tier: hard
  statement: |
    设$\vb p$、$\vb q$是同一个线性方程组的两个不同的解。证明对每个实数$t$，$\vb p+t(\vb q-\vb p)$也是它的解，从而解有无穷多个；再说明$\vb q-\vb p$是对应的:term[齐次线性方程组]{id="math.linear-algebra.homogeneous-system"}（homogeneous linear system）的解。
  hints:
    - |
      只需对每一个方程$a_1x_1+\dots+a_nx_n=b$验证。把左边记作$L(\vb x)$，它对加法和数乘（scalar multiplication）有什么性质？
    - |
      $L(\vb x+\vb y)=L(\vb x)+L(\vb y)$，$L(c\vb x)=cL(\vb x)$；而$L(\vb p)=L(\vb q)=b$。
    - |
      对每个方程，$L\bigl(\vb p+t(\vb q-\vb p)\bigr)=L\bigl((1-t)\vb p+t\vb q\bigr)=(1-t)L(\vb p)+tL(\vb q)=(1-t)b+tb=b$，所以$\vb p+t(\vb q-\vb p)$满足每个方程。$\vb q-\vb p\ne\vb 0$，不同的$t$给出不同的向量，解有无穷多个。

      同样$L(\vb q-\vb p)=b-b=0$，每个方程的左边在$\vb q-\vb p$处都等于$0$，所以$\vb q-\vb p$是对应齐次方程组的解。几何上，平面里两条直线若有两个公共点，就有一整条公共的直线。
  reference: |
    每个方程的左边$L$满足$L(\vb x+\vb y)=L(\vb x)+L(\vb y)$、$L(c\vb x)=cL(\vb x)$，于是$L((1-t)\vb p+t\vb q)=(1-t)b+tb=b$；$\vb q\ne\vb p$时不同的$t$给出不同的解。$L(\vb q-\vb p)=0$，所以$\vb q-\vb p$解齐次方程组。

- id: p6
  tier: hard
  statement: |
    证明：方程个数少于未知数个数的:term[齐次线性方程组]{id="math.linear-algebra.homogeneous-system"}一定有不全为零的解。
  hints:
    - |
      化成行阶梯形以后，主元最多有几个？
    - |
      每一行至多一个主元，主元个数不超过方程个数$m$，而未知数有$n>m$个。
    - |
      设有$m$个方程、$n$个未知数，$m<n$。化成行阶梯形，每个主元占一行，主元个数不超过$m$，所以$n$个未知数的列里至少有一列没有主元。齐次方程组不会出现$0=b\ne0$的行，由「解的三种情况」，它有无穷多个解，不止零解一个。

      具体地，把没有主元的那一列对应的未知数取成$1$，其余没有主元的取成$0$，再回代求出有主元的那些未知数，得到的解至少有一个分量（component）是$1$，不全为零。
  reference: |
    $m<n$时主元至多$m$个，有一列没有主元。齐次方程组总有解，由解的三种情况它有无穷多个解；把那个未知数取成$1$再回代，就得到不全为零的解。

- id: p7
  tier: thinking
  statement: |
    系数不全为零时，三个未知数的一个线性方程在空间里表示一个平面。(1) 三个这样的方程组成的方程组有唯一解、无解、有无穷多个解时，三个平面各可能是什么样子？(2) 无解时，三个平面中一定有两个平行吗？
  hints:
    - |
      唯一解：三个平面只有一个公共点。无穷多解：公共点组成一条直线，或者三个方程表示同一个平面。
    - |
      (2) 试试$x=0$、$y=0$、$x+y=1$这三个平面，看它们两两的交线。
    - |
      (1) 唯一解：三个平面交于一点，像房间的墙角。无穷多解：三个平面绕同一条直线排开，像书页，或者三个方程其实是同一个平面。无解：有两个平面平行；或者三个平面两两相交，三条交线互相平行，围成一个三棱柱的侧面。

      (2) 不一定。$x=0$、$y=0$、$x+y=1$两两都不平行（哪个方程的系数都不是另一个的倍数），两两的交线是三条竖直的直线：$z$轴、过$(0,1,0)$的竖线、过$(1,0,0)$的竖线。可三个平面没有公共点：前两个方程给出$x=y=0$，代入第三个得$0=1$。
  reference: |
    唯一解：交于一点。无穷多解：共一条直线，或三个平面重合。无解：有两个平行，或两两相交成三条平行的交线（三棱柱）。$x=0$、$y=0$、$x+y=1$两两不平行却无公共点，所以不一定有平行的。

- id: p8
  tier: thinking
  statement: |
    在只能保留三位有效数字的计算器上，用两种顺序消元，解$0.0001x+y=1$、$x+y=2$：(1) 直接以$0.0001$为主元；(2) 先交换两个方程，以$1$为主元。哪一种的结果接近真正的解（$x\approx1.0001$、$y\approx0.9999$）？由此说说，实际计算时为什么常把这一列绝对值最大的数换到主元的位置（部分主元法，partial pivoting）。
  hints:
    - |
      (1) 要做$R_2-10000R_1$。$1-10000$和$2-10000$保留三位有效数字各是多少？
    - |
      (2) 交换后做$R_2-0.0001R_1$，$1-0.0001$和$1-0.0002$保留三位有效数字各是多少？
    - |
      (1) $R_2-10000R_1$得$(1-10000)y=2-10000$，即$-9999y=-9998$，保留三位有效数字都成了$-1.00\times10^4$，所以$y=1.00$；回代$0.0001x=1-1.00=0$，$x=0$，错得很远。

      (2) 交换后做$R_2-0.0001R_1$，得$0.9999y=0.9998$，保留三位有效数字是$1.00\,y=1.00$，$y=1.00$；回代$x=2-1.00=1.00$，和真正的解只差万分之一。

      用很小的主元，乘数（这里是$10000$）很大，第二个方程原来的系数$1$、$2$被淹没在舍入误差（round-off error）里，回代时又把误差放大。主元取这一列绝对值最大的数，乘数的绝对值都不超过$1$，误差就不会这样被放大，所以实际计算时常这样选主元（见 Trefethen、Bau 的 *Numerical Linear Algebra* 第 21 讲）。
  reference: |
    (1) 以$0.0001$为主元：$-9999y=-9998$舍入成$-10000y=-10000$，$y=1$，回代得$x=0$，大错。(2) 先交换：$0.9999y=0.9998$舍入成$y=1$，$x=1$，几乎准确。小主元带来大乘数，原方程的信息被舍入误差淹没；选绝对值最大的主元使乘数不超过$1$。
