id: math.linear-algebra
title: |
  线性代数
proofPolicy: sketch
macros:
  \R: |
    \mathbb{R}
  \C: |
    \mathbb{C}
  \vb: |
    \mathbf{#1}
  \T: |
    ^{\mathsf{T}}
  \Span: |
    \operatorname{span}
  \rank: |
    \operatorname{rank}
  \tr: |
    \operatorname{tr}
  \im: |
    \operatorname{im}
  \uv: |
    \hat{\mathbf{#1}}
  \dd: |
    \mathop{}\!\mathrm{d}
  \HT: |
    ^{\mathsf{H}}
glossary:
  - id: math.linear-algebra.zero-vector
    zh: |
      零向量
    en: |
      zero vector
    brief: |
      大小为零的向量，记作$\vb 0$，分量全为零；它没有确定的方向。
    definedIn: math.linear-algebra.vectors
    anchor: def-vector
  - id: math.linear-algebra.scalar-multiplication
    zh: |
      数乘
    en: |
      scalar multiplication
    brief: |
      数$c$乘向量$\vb v$：长度变为$|c|$倍，$c<0$时反向；按分量算就是每个分量都乘以$c$。
    definedIn: math.linear-algebra.vectors
    anchor: def-scalar-multiplication
  - id: math.linear-algebra.parallel
    zh: |
      平行
    en: |
      parallel
    brief: |
      两个向量中有一个是另一个的倍数，即方向相同或相反；零向量和任何向量平行。
    definedIn: math.linear-algebra.vectors
    anchor: def-parallel
  - id: math.linear-algebra.component
    zh: |
      分量
    en: |
      component
    brief: |
      向量的起点放在原点时，终点的各个坐标；$\vb v=(v_1,\dots,v_n)$的第$i$个分量是$v_i$。
    definedIn: math.linear-algebra.vectors
    anchor: def-components
  - id: math.linear-algebra.position-vector
    zh: |
      位置向量
    en: |
      position vector
    brief: |
      从原点指向点$P$的向量，它的分量就是$P$的坐标。
    definedIn: math.linear-algebra.vectors
    anchor: def-components
  - id: math.linear-algebra.linear-combination
    zh: |
      线性组合
    en: |
      linear combination
    brief: |
      形如$c_1\vb v_1+\dots+c_k\vb v_k$的向量，即只用加法和数乘由$\vb v_1,\dots,\vb v_k$得到的向量。
    definedIn: math.linear-algebra.vectors
    anchor: def-linear-combination
  - id: math.linear-algebra.standard-basis-vector
    zh: |
      标准基向量
    en: |
      standard basis vector
    brief: |
      $\R^n$中第$i$个分量为$1$、其余为$0$的向量$\vb e_i$；任何向量都等于$v_1\vb e_1+\dots+v_n\vb e_n$。
    definedIn: math.linear-algebra.vectors
    anchor: def-standard-basis
  - id: math.linear-algebra.dot-product
    zh: |
      点积
    en: |
      dot product
    brief: |
      $\vb u\cdot\vb v=u_1v_1+\dots+u_nv_n$，结果是数；在平面和空间里等于$|\vb u||\vb v|\cos\theta$。
    definedIn: math.linear-algebra.dot-product
    anchor: def-dot-product
  - id: math.linear-algebra.length
    zh: |
      长度
    en: |
      length
    brief: |
      $|\vb v|=\sqrt{\vb v\cdot\vb v}=\sqrt{v_1^2+\dots+v_n^2}$，也叫模；在平面和空间里就是箭头的长。
    definedIn: math.linear-algebra.dot-product
    anchor: def-length
  - id: math.linear-algebra.unit-vector
    zh: |
      单位向量
    en: |
      unit vector
    brief: |
      长度为$1$的向量；非零向量$\vb v$除以自己的长度，得到同方向的单位向量$\uv v$。
    definedIn: math.linear-algebra.dot-product
    anchor: def-length
  - id: math.linear-algebra.angle
    zh: |
      夹角
    en: |
      angle
    brief: |
      两个非零向量的夹角$\theta\in[0,\pi]$由$\cos\theta=\frac{\vb u\cdot\vb v}{|\vb u||\vb v|}$确定。
    definedIn: math.linear-algebra.dot-product
    anchor: def-angle
  - id: math.linear-algebra.cauchy-schwarz-inequality
    zh: |
      柯西-施瓦茨不等式
    en: |
      Cauchy-Schwarz inequality
    brief: |
      $|\vb u\cdot\vb v|\le|\vb u||\vb v|$，等号当且仅当两个向量平行。
    definedIn: math.linear-algebra.dot-product
    anchor: thm-cauchy-schwarz
  - id: math.linear-algebra.orthogonal
    zh: |
      正交
    en: |
      orthogonal
    brief: |
      点积为零：$\vb u\cdot\vb v=0$；两个非零向量正交就是互相垂直，零向量和任何向量都正交。
    definedIn: math.linear-algebra.dot-product
    anchor: def-orthogonal
  - id: math.linear-algebra.projection
    zh: |
      投影
    en: |
      projection
    brief: |
      $\vb u$在非零向量$\vb v$上的投影是$\frac{\vb u\cdot\vb v}{\vb v\cdot\vb v}\vb v$，$\vb u$减去它就与$\vb v$正交。
    definedIn: math.linear-algebra.dot-product
    anchor: def-projection
  - id: math.linear-algebra.linear-system
    zh: |
      线性方程组
    en: |
      system of linear equations
    brief: |
      若干个形如$a_1x_1+\dots+a_nx_n=b$的方程放在一起；解是让每个方程都成立的$(x_1,\dots,x_n)$。
    definedIn: math.linear-algebra.linear-systems
    anchor: def-linear-system
  - id: math.linear-algebra.solution-set
    zh: |
      解集
    en: |
      solution set
    brief: |
      方程组的全部解组成的集合；线性方程组的解集要么是空的，要么只有一个解，要么有无穷多个解。
    definedIn: math.linear-algebra.linear-systems
    anchor: def-linear-system
  - id: math.linear-algebra.coefficient-matrix
    zh: |
      系数矩阵
    en: |
      coefficient matrix
    brief: |
      把线性方程组的系数按原来的位置排成的数表，第$j$列是未知数$x_j$在各个方程里的系数。
    definedIn: math.linear-algebra.linear-systems
    anchor: def-augmented-matrix
  - id: math.linear-algebra.augmented-matrix
    zh: |
      增广矩阵
    en: |
      augmented matrix
    brief: |
      系数矩阵右边再添一列常数项（中间画一条竖线）得到的矩阵，记下了方程组的全部信息。
    definedIn: math.linear-algebra.linear-systems
    anchor: def-augmented-matrix
  - id: math.linear-algebra.elementary-row-operation
    zh: |
      初等行变换
    en: |
      elementary row operation
    brief: |
      交换两行、把一行乘以不为零的数、把一行的倍数加到另一行；做在增广矩阵上不改变解集。
    definedIn: math.linear-algebra.linear-systems
    anchor: def-row-operations
  - id: math.linear-algebra.row-echelon-form
    zh: |
      行阶梯形
    en: |
      row echelon form
    brief: |
      零行都在最下面，每个非零行最左边的非零数（主元）都在上一行主元右边的矩阵。
    definedIn: math.linear-algebra.linear-systems
    anchor: def-echelon
  - id: math.linear-algebra.pivot
    zh: |
      主元
    en: |
      pivot
    brief: |
      行阶梯形里每个非零行最左边的非零数；系数部分没有主元的列，对应的未知数可以任意取值。
    definedIn: math.linear-algebra.linear-systems
    anchor: def-echelon
  - id: math.linear-algebra.gaussian-elimination
    zh: |
      高斯消元法
    en: |
      Gaussian elimination
    brief: |
      用初等行变换把增广矩阵化成行阶梯形，再从最后一个方程起往上回代求出未知数的解法。
    definedIn: math.linear-algebra.linear-systems
    anchor: def-gaussian-elimination
  - id: math.linear-algebra.reduced-row-echelon-form
    zh: |
      简化行阶梯形
    en: |
      reduced row echelon form
    brief: |
      主元都是$1$、主元所在列的其余数都是$0$的行阶梯形；一个矩阵化成的简化行阶梯形是唯一的。
    definedIn: math.linear-algebra.linear-systems
    anchor: def-rref
  - id: math.linear-algebra.homogeneous-system
    zh: |
      齐次线性方程组
    en: |
      homogeneous linear system
    brief: |
      常数项全为零的线性方程组；它总有零解，问题在于还有没有别的解。
    definedIn: math.linear-algebra.linear-systems
    anchor: def-homogeneous
  - id: math.linear-algebra.cross-product
    zh: |
      叉积
    en: |
      cross product
    brief: |
      $\R^3$中的$\vb u\times\vb v=(u_2v_3-u_3v_2,\,u_3v_1-u_1v_3,\,u_1v_2-u_2v_1)$，与两个因子都正交，长度是平行四边形的面积。
    definedIn: math.linear-algebra.cross-product
    anchor: def-cross-product
  - id: math.linear-algebra.right-hand-rule
    zh: |
      右手定则
    en: |
      right-hand rule
    brief: |
      右手四指从$\vb u$弯向$\vb v$，拇指指向$\vb u\times\vb v$；坐标轴也按它取成右手系。
    definedIn: math.linear-algebra.cross-product
    anchor: def-right-hand-rule
  - id: math.linear-algebra.scalar-triple-product
    zh: |
      混合积
    en: |
      scalar triple product
    brief: |
      数$(\vb u\times\vb v)\cdot\vb w$，它的绝对值是以$\vb u$、$\vb v$、$\vb w$为棱的平行六面体的体积。
    definedIn: math.linear-algebra.cross-product
    anchor: def-triple-product
  - id: math.linear-algebra.zero-matrix
    zh: |
      零矩阵
    en: |
      zero matrix
    brief: |
      所有数都是$0$的矩阵，记作$O$；它乘任何向量都得零向量。
    definedIn: math.linear-algebra.matrices
    anchor: def-matrix-operations
  - id: math.linear-algebra.square-matrix
    zh: |
      方阵
    en: |
      square matrix
    brief: |
      行数等于列数的矩阵；$n\times n$的方阵也叫$n$阶方阵。
    definedIn: math.linear-algebra.matrices
    anchor: def-matrix-operations
  - id: math.linear-algebra.matrix-multiplication
    zh: |
      矩阵乘法
    en: |
      matrix multiplication
    brief: |
      $AB$的第$j$列是$A$乘$B$的第$j$列；第$i$行第$j$列是$A$的第$i$行与$B$的第$j$列对应相乘再相加。
    definedIn: math.linear-algebra.matrices
    anchor: def-matrix-product
  - id: math.linear-algebra.diagonal-matrix
    zh: |
      对角矩阵
    en: |
      diagonal matrix
    brief: |
      主对角线以外的数都是$0$的方阵$\operatorname{diag}(d_1,\dots,d_n)$，它把第$i$个分量放大$d_i$倍。
    definedIn: math.linear-algebra.matrices
    anchor: def-identity
  - id: math.linear-algebra.identity-matrix
    zh: |
      单位矩阵
    en: |
      identity matrix
    brief: |
      主对角线上都是$1$、其余都是$0$的方阵$I$；$I\vb x=\vb x$，在矩阵乘法里的作用像数$1$。
    definedIn: math.linear-algebra.matrices
    anchor: def-identity
  - id: math.linear-algebra.free-variable
    zh: |
      自由变量
    en: |
      free variable
    brief: |
      化成行阶梯形后，系数部分没有主元的列对应的未知数；它可以任意取值，主变量随之确定。
    definedIn: math.linear-algebra.solution-sets
    anchor: def-free-variable
  - id: math.linear-algebra.general-solution
    zh: |
      通解
    en: |
      general solution
    brief: |
      把主变量用自由变量表示后写成的$\vb p+t_1\vb v_1+\dots+t_k\vb v_k$，参数取遍实数时给出全部的解。
    definedIn: math.linear-algebra.solution-sets
    anchor: def-general-solution
  - id: math.linear-algebra.particular-solution
    zh: |
      特解
    en: |
      particular solution
    brief: |
      方程组的任何一个具体的解；全部的解等于一个特解加上对应齐次方程组的全部解。
    definedIn: math.linear-algebra.solution-sets
    anchor: def-general-solution
  - id: math.linear-algebra.linear-transformation
    zh: |
      线性变换
    en: |
      linear transformation
    brief: |
      满足$T(\vb u+\vb v)=T(\vb u)+T(\vb v)$、$T(c\vb u)=cT(\vb u)$的变换，也叫线性映射；它总能写成$\vb x\mapsto A\vb x$。
    definedIn: math.linear-algebra.linear-maps
    anchor: def-linear-transformation
  - id: math.linear-algebra.standard-matrix
    zh: |
      标准矩阵
    en: |
      standard matrix
    brief: |
      以$T(\vb e_1),\dots,T(\vb e_n)$为各列的矩阵$A$，对每个$\vb x$都有$T(\vb x)=A\vb x$。
    definedIn: math.linear-algebra.linear-maps
    anchor: thm-standard-matrix
  - id: math.linear-algebra.rotation-matrix
    zh: |
      旋转矩阵
    en: |
      rotation matrix
    brief: |
      绕原点逆时针转过角$\theta$的标准矩阵$\begin{pmatrix}\cos\theta&-\sin\theta\\\sin\theta&\cos\theta\end{pmatrix}$。
    definedIn: math.linear-algebra.linear-maps
    anchor: def-rotation-shear
  - id: math.linear-algebra.shear
    zh: |
      剪切
    en: |
      shear
    brief: |
      把$(x,y)$变成$(x+ky,y)$这类变换：每个点沿一个方向移动，移动量和它到某条轴的距离成正比。
    definedIn: math.linear-algebra.linear-maps
    anchor: def-rotation-shear
  - id: math.linear-algebra.direction-vector
    zh: |
      方向向量
    en: |
      direction vector
    brief: |
      直线$\vb r=\vb r_0+t\vb v$里的非零向量$\vb v$，表示直线的方向；它的任何非零倍数也可以。
    definedIn: math.linear-algebra.lines-planes
    anchor: def-line
  - id: math.linear-algebra.normal-vector
    zh: |
      法向量
    en: |
      normal vector
    brief: |
      与平面垂直的非零向量$\vb n$；平面$ax+by+cz=d$的法向量是$(a,b,c)$。
    definedIn: math.linear-algebra.lines-planes
    anchor: def-plane
  - id: math.linear-algebra.invertible
    zh: |
      可逆
    en: |
      invertible
    brief: |
      方阵$A$可逆，是说有同阶方阵$B$使$AB=BA=I$；这等价于$A\vb x=\vb 0$只有零解。
    definedIn: math.linear-algebra.matrix-inverse
    anchor: def-inverse
  - id: math.linear-algebra.inverse-matrix
    zh: |
      逆矩阵
    en: |
      inverse matrix
    brief: |
      可逆方阵$A$的逆矩阵$A^{-1}$满足$AA^{-1}=A^{-1}A=I$，只有一个；方阵只要验证一边。
    definedIn: math.linear-algebra.matrix-inverse
    anchor: def-inverse
  - id: math.linear-algebra.transpose
    zh: |
      转置
    en: |
      transpose
    brief: |
      把矩阵的各行依次写成各列，记作$A\T$，$(A\T)_{ij}=a_{ji}$；乘积的转置$(AB)\T=B\T A\T$。
    definedIn: math.linear-algebra.matrix-inverse
    anchor: def-transpose
  - id: math.linear-algebra.symmetric-matrix
    zh: |
      对称矩阵
    en: |
      symmetric matrix
    brief: |
      满足$A\T=A$的方阵，即$a_{ij}=a_{ji}$，关于主对角线对称。
    definedIn: math.linear-algebra.matrix-inverse
    anchor: def-transpose
  - id: math.linear-algebra.span
    zh: |
      生成
    en: |
      span
    brief: |
      $\vb v_1,\dots,\vb v_k$的全部线性组合组成的集合，记作$\Span\{\vb v_1,\dots,\vb v_k\}$，也说它们张成这个集合。
    definedIn: math.linear-algebra.span-subspaces
    anchor: def-span
  - id: math.linear-algebra.subspace
    zh: |
      子空间
    en: |
      subspace
    brief: |
      含$\vb 0$、对加法和数乘都封闭的子集，例如过原点的直线、平面和齐次方程组的解集。
    definedIn: math.linear-algebra.span-subspaces
    anchor: def-subspace
  - id: math.linear-algebra.signed-area
    zh: |
      有向面积
    en: |
      signed area
    brief: |
      以$\vb a$、$\vb b$为邻边的平行四边形的面积，按从$\vb a$转到$\vb b$是逆时针还是顺时针取正负号，等于$a_1b_2-a_2b_1$。
    definedIn: math.linear-algebra.determinant
    anchor: def-signed-area
  - id: math.linear-algebra.determinant
    zh: |
      行列式
    en: |
      determinant
    brief: |
      方阵的各列的函数$\det A$，由多重线性、交错和$\det I=1$确定；它是线性变换对有向体积的放大倍数。
    definedIn: math.linear-algebra.determinant
    anchor: def-determinant
  - id: math.linear-algebra.multilinear
    zh: |
      多重线性
    en: |
      multilinear
    brief: |
      对每个变量都是线性的：固定其余变量，对这一个变量是线性映射；行列式对它的各列就是这样。
    definedIn: math.linear-algebra.determinant
    anchor: def-determinant
  - id: math.linear-algebra.alternating
    zh: |
      交错
    en: |
      alternating
    brief: |
      有两列相同时值为零；由此交换两列时变号。行列式的第二条性质。
    definedIn: math.linear-algebra.determinant
    anchor: def-determinant
  - id: math.linear-algebra.linearly-independent
    zh: |
      线性无关
    en: |
      linearly independent
    brief: |
      只有系数全为零的线性组合才等于零向量；这时生成的子空间里每个向量的写法唯一。
    definedIn: math.linear-algebra.linear-independence
    anchor: def-linear-independence
  - id: math.linear-algebra.linearly-dependent
    zh: |
      线性相关
    en: |
      linearly dependent
    brief: |
      有系数不全为零的线性组合等于零向量；这时其中某个向量能用其余的线性表示。
    definedIn: math.linear-algebra.linear-independence
    anchor: def-linear-independence
  - id: math.linear-algebra.basis
    zh: |
      基
    en: |
      basis
    brief: |
      子空间里线性无关、又生成这个子空间的一组向量；子空间里每个向量都唯一地写成它们的线性组合。
    definedIn: math.linear-algebra.basis-dimension
    anchor: def-basis
  - id: math.linear-algebra.coordinate-vector
    zh: |
      坐标向量
    en: |
      coordinate vector
    brief: |
      $\vb v=c_1\vb b_1+\dots+c_k\vb b_k$时，系数排成的$(c_1,\dots,c_k)$，记作$[\vb v]_{\mathcal B}$。
    definedIn: math.linear-algebra.basis-dimension
    anchor: def-coordinates
  - id: math.linear-algebra.dimension
    zh: |
      维数
    en: |
      dimension
    brief: |
      子空间的一组基所含向量的个数，对每组基都一样，记作$\dim V$；$\dim\R^n=n$。
    definedIn: math.linear-algebra.basis-dimension
    anchor: def-dimension
  - id: math.linear-algebra.upper-triangular-matrix
    zh: |
      上三角矩阵
    en: |
      upper triangular matrix
    brief: |
      主对角线以下的数都是$0$的方阵；它的行列式等于主对角线上各数的乘积。
    definedIn: math.linear-algebra.determinant-properties
    anchor: def-triangular
  - id: math.linear-algebra.minor
    zh: |
      余子式
    en: |
      minor
    brief: |
      划去第$i$行、第$j$列后剩下的$n-1$阶方阵的行列式，记作$M_{ij}$。
    definedIn: math.linear-algebra.determinant-properties
    anchor: def-cofactor
  - id: math.linear-algebra.cofactor
    zh: |
      代数余子式
    en: |
      cofactor
    brief: |
      $C_{ij}=(-1)^{i+j}M_{ij}$；按第$i$行展开，$\det A=\sum_ja_{ij}C_{ij}$。
    definedIn: math.linear-algebra.determinant-properties
    anchor: def-cofactor
  - id: math.linear-algebra.column-space
    zh: |
      列空间
    en: |
      column space
    brief: |
      矩阵的各列生成的子空间$C(A)$，也就是全体$A\vb x$；$A\vb x=\vb b$有解当且仅当$\vb b\in C(A)$。
    definedIn: math.linear-algebra.column-null-space
    anchor: def-column-null-space
  - id: math.linear-algebra.null-space
    zh: |
      零空间
    en: |
      null space
    brief: |
      齐次方程组$A\vb x=\vb 0$的全部解组成的子空间$N(A)$；它的维数等于自由变量的个数。
    definedIn: math.linear-algebra.column-null-space
    anchor: def-column-null-space
  - id: math.linear-algebra.vector-space
    zh: |
      向量空间
    en: |
      vector space
    brief: |
      元素能相加、能乘以数，并满足八条运算律的集合，例如$\R^n$、多项式全体、函数全体。
    definedIn: math.linear-algebra.vector-spaces
    anchor: def-vector-space
  - id: math.linear-algebra.finite-dimensional
    zh: |
      有限维
    en: |
      finite-dimensional
    brief: |
      能由有限个向量生成的向量空间叫有限维的，维数是它的一组基所含向量的个数；否则叫无限维的。
    definedIn: math.linear-algebra.vector-spaces
    anchor: def-finite-dimensional
  - id: math.linear-algebra.change-of-basis-matrix
    zh: |
      基变换矩阵
    en: |
      change-of-basis matrix
    brief: |
      以旧基$\mathcal B$的向量在新基$\mathcal C$下的坐标为各列的矩阵$P_{\mathcal C\leftarrow\mathcal B}$，满足$[\vb v]_{\mathcal C}=P_{\mathcal C\leftarrow\mathcal B}[\vb v]_{\mathcal B}$。
    definedIn: math.linear-algebra.change-of-basis
    anchor: def-change-of-basis
  - id: math.linear-algebra.rank
    zh: |
      秩
    en: |
      rank
    brief: |
      矩阵的列空间的维数$\rank A$，等于化成行阶梯形后主元的个数，也等于行空间的维数。
    definedIn: math.linear-algebra.rank-nullity
    anchor: def-rank
  - id: math.linear-algebra.nullity
    zh: |
      零化度
    en: |
      nullity
    brief: |
      矩阵的零空间的维数，等于方程组$A\vb x=\vb 0$的自由变量的个数。
    definedIn: math.linear-algebra.rank-nullity
    anchor: def-rank
  - id: math.linear-algebra.rank-nullity-theorem
    zh: |
      秩-零化度定理
    en: |
      rank–nullity theorem
    brief: |
      $m\times n$矩阵满足$\rank A+\dim N(A)=n$：秩与零化度之和等于列数。
    definedIn: math.linear-algebra.rank-nullity
    anchor: thm-rank-nullity
  - id: math.linear-algebra.eigenvalue
    zh: |
      特征值
    en: |
      eigenvalue
    brief: |
      使$A\vb v=\lambda\vb v$有非零解$\vb v$的数$\lambda$；它是特征多项式$\det(A-\lambda I)$的根。
    definedIn: math.linear-algebra.eigenvalues
    anchor: def-eigen
  - id: math.linear-algebra.eigenvector
    zh: |
      特征向量
    en: |
      eigenvector
    brief: |
      满足$A\vb v=\lambda\vb v$的非零向量$\vb v$：$A$把它变成原来的$\lambda$倍，不离开它所在的直线。
    definedIn: math.linear-algebra.eigenvalues
    anchor: def-eigen
  - id: math.linear-algebra.characteristic-polynomial
    zh: |
      特征多项式
    en: |
      characteristic polynomial
    brief: |
      $n$阶方阵$A$的$\det(A-\lambda I)$，是$\lambda$的$n$次多项式，它的根就是$A$的特征值。
    definedIn: math.linear-algebra.eigenvalues
    anchor: def-characteristic-polynomial
  - id: math.linear-algebra.eigenspace
    zh: |
      特征空间
    en: |
      eigenspace
    brief: |
      属于特征值$\lambda$的特征向量连同$\vb 0$组成的子空间，即零空间$N(A-\lambda I)$。
    definedIn: math.linear-algebra.eigenvalues
    anchor: def-characteristic-polynomial
  - id: math.linear-algebra.trace
    zh: |
      迹
    en: |
      trace
    brief: |
      方阵主对角线上的元素之和，记作$\tr A$；它等于全部特征值（按重数计）之和。
    definedIn: math.linear-algebra.eigenvalues
    anchor: def-trace
  - id: math.linear-algebra.algebraic-multiplicity
    zh: |
      代数重数
    en: |
      algebraic multiplicity
    brief: |
      特征值作为特征多项式的根的重数。
    definedIn: math.linear-algebra.eigenvalues
    anchor: def-multiplicity
  - id: math.linear-algebra.geometric-multiplicity
    zh: |
      几何重数
    en: |
      geometric multiplicity
    brief: |
      特征值的特征空间的维数，即属于它的线性无关的特征向量最多有几个。
    definedIn: math.linear-algebra.eigenvalues
    anchor: def-multiplicity
  - id: math.linear-algebra.linear-map
    zh: |
      线性映射
    en: |
      linear map
    brief: |
      向量空间$V$到$W$的对应$T$，满足$T(\vb u+\vb v)=T(\vb u)+T(\vb v)$、$T(c\vb u)=cT(\vb u)$。
    definedIn: math.linear-algebra.kernel-image
    anchor: def-linear-map
  - id: math.linear-algebra.image
    zh: |
      像
    en: |
      image
    brief: |
      向量$\vb x$在线性变换$T$下对应的向量$T(\vb x)$；一个集合里各向量的像，组成这个集合的像；整个空间的像记作$\im T$。
    definedIn: math.linear-algebra.linear-maps
    anchor: def-linear-transformation
  - id: math.linear-algebra.kernel
    zh: |
      核
    en: |
      kernel
    brief: |
      线性映射$T$送到$\vb 0$的向量全体$\ker T$，是定义域的子空间；$\vb x\mapsto A\vb x$的核就是$N(A)$。
    definedIn: math.linear-algebra.kernel-image
    anchor: def-kernel-image
  - id: math.linear-algebra.injective
    zh: |
      单射
    en: |
      injective
    brief: |
      不同的向量总有不同的像；线性映射是单射，当且仅当核只有$\vb 0$。
    definedIn: math.linear-algebra.kernel-image
    anchor: def-injective-surjective
  - id: math.linear-algebra.surjective
    zh: |
      满射
    en: |
      surjective
    brief: |
      目标空间的每个向量都是某个向量的像，即$\im T$是整个目标空间。
    definedIn: math.linear-algebra.kernel-image
    anchor: def-injective-surjective
  - id: math.linear-algebra.dimension-formula
    zh: |
      维数公式
    en: |
      dimension theorem
    brief: |
      $V$有限维时，线性映射$T:V\to W$满足$\dim\ker T+\dim\im T=\dim V$；对矩阵，这就是秩-零化度定理。
    definedIn: math.linear-algebra.kernel-image
    anchor: thm-dimension-formula
  - id: math.linear-algebra.isomorphism
    zh: |
      同构
    en: |
      isomorphism
    brief: |
      两个向量空间之间保持加法和数乘的一一对应，例如$\vb v\mapsto[\vb v]_{\mathcal B}$。
    definedIn: math.linear-algebra.vector-spaces
    anchor: thm-coordinates-iso
  - id: math.linear-algebra.linear-functional
    zh: |
      线性函数
    en: |
      linear functional
    brief: |
      向量空间$V$到$\R$的线性映射；在$\R^n$上就是$a_1x_1+\dots+a_nx_n$，相当于一个行向量。
    definedIn: math.linear-algebra.dual-space
    anchor: def-dual-space
  - id: math.linear-algebra.covector
    zh: |
      余向量
    en: |
      covector
    brief: |
      线性函数的另一个名字；换基时它的坐标和向量的坐标反着变。
    definedIn: math.linear-algebra.dual-space
    anchor: def-dual-space
  - id: math.linear-algebra.dual-space
    zh: |
      对偶空间
    en: |
      dual space
    brief: |
      $V$上全体线性函数组成的向量空间$V^*$；$V$是$n$维时，它也是$n$维。
    definedIn: math.linear-algebra.dual-space
    anchor: def-dual-space
  - id: math.linear-algebra.dual-basis
    zh: |
      对偶基
    en: |
      dual basis
    brief: |
      基$\vb b_1,\dots,\vb b_n$的对偶基$f_1,\dots,f_n$：$f_i$取向量的第$i$个坐标，所以$f_i(\vb b_j)$在$i=j$时为$1$、否则为$0$。
    definedIn: math.linear-algebra.dual-space
    anchor: def-dual-basis
  - id: math.linear-algebra.linear-operator
    zh: |
      线性算子
    en: |
      linear operator
    brief: |
      向量空间$V$到它自己的线性映射；取一组基$\mathcal B$，它就对应一个方阵$[T]_{\mathcal B}$。
    definedIn: math.linear-algebra.similarity
    anchor: def-operator-matrix
  - id: math.linear-algebra.similar
    zh: |
      相似
    en: |
      similar
    brief: |
      有可逆矩阵$P$使$B=P^{-1}AP$时，说$A$与$B$相似：它们是同一个线性算子在两组基下的矩阵。
    definedIn: math.linear-algebra.similarity
    anchor: def-similar
  - id: math.linear-algebra.diagonalization
    zh: |
      对角化
    en: |
      diagonalization
    brief: |
      找可逆矩阵$P$和对角矩阵$D$使$A=PDP^{-1}$；能做到，当且仅当$A$有$n$个线性无关的特征向量。
    definedIn: math.linear-algebra.diagonalization
    anchor: def-diagonalizable
  - id: math.linear-algebra.bilinear-map
    zh: |
      双线性映射
    en: |
      bilinear map
    brief: |
      $f:V\times W\to U$，固定一个变量时对另一个变量是线性映射；它由各对基向量上的值决定。
    definedIn: math.linear-algebra.tensor-product
    anchor: def-bilinear
  - id: math.linear-algebra.tensor-product
    zh: |
      张量积
    en: |
      tensor product
    brief: |
      以$\vb b_i\otimes\vb c_j$为基的$mn$维空间$V\otimes W$；$V\times W$上的双线性映射就是它上面的线性映射。
    definedIn: math.linear-algebra.tensor-product
    anchor: def-tensor-product
  - id: math.linear-algebra.jordan-block
    zh: |
      若尔当块
    en: |
      Jordan block
    brief: |
      主对角线上都是$\lambda$、紧挨着它上方的斜线上都是$1$、其余为$0$的方阵$J_m(\lambda)=\lambda I+N$。
    definedIn: math.linear-algebra.jordan-form
    anchor: def-jordan-block
  - id: math.linear-algebra.nilpotent-matrix
    zh: |
      幂零矩阵
    en: |
      nilpotent matrix
    brief: |
      某个正整数次幂是零矩阵的方阵，例如若尔当块里的$N$；它的特征值只有$0$。
    definedIn: math.linear-algebra.jordan-form
    anchor: def-nilpotent
  - id: math.linear-algebra.generalized-eigenvector
    zh: |
      广义特征向量
    en: |
      generalized eigenvector
    brief: |
      满足$(A-\lambda I)^k\vb w=\vb 0$的非零向量$\vb w$；特征向量不够时，用它补成一组基。
    definedIn: math.linear-algebra.jordan-form
    anchor: def-generalized-eigenvector
  - id: math.linear-algebra.jordan-canonical-form
    zh: |
      若尔当标准形
    en: |
      Jordan canonical form
    brief: |
      和$A$相似、由若尔当块沿主对角线拼成的矩阵$J$，$A=PJP^{-1}$；不计各块次序时唯一。
    definedIn: math.linear-algebra.jordan-form
    anchor: thm-jordan
  - id: math.linear-algebra.inner-product
    zh: |
      内积
    en: |
      inner product
    brief: |
      向量空间上对称、对每个变量线性、并且非零向量和自己的值为正的二元运算$\langle\vb u,\vb v\rangle$，例如点积。
    definedIn: math.linear-algebra.inner-product-spaces
    anchor: def-inner-product
  - id: math.linear-algebra.inner-product-space
    zh: |
      内积空间
    en: |
      inner product space
    brief: |
      规定了一个内积的向量空间，例如带点积的$\R^n$、带积分内积的连续函数空间。
    definedIn: math.linear-algebra.inner-product-spaces
    anchor: def-inner-product
  - id: math.linear-algebra.norm
    zh: |
      范数
    en: |
      norm
    brief: |
      内积空间里向量的长度$\|\vb v\|=\sqrt{\langle\vb v,\vb v\rangle}$；取点积时就是$|\vb v|$。
    definedIn: math.linear-algebra.inner-product-spaces
    anchor: def-norm
  - id: math.linear-algebra.orthogonal-complement
    zh: |
      正交补
    en: |
      orthogonal complement
    brief: |
      和子空间$W$里每个向量都正交的向量全体$W^\perp$，它也是子空间。
    definedIn: math.linear-algebra.orthogonal-projection
    anchor: def-orthogonal-complement
  - id: math.linear-algebra.orthogonal-projection
    zh: |
      正交投影
    en: |
      orthogonal projection
    brief: |
      $W$中使$\vb v-\vb p$和$W$正交的那个$\vb p$，记作$\operatorname{proj}_W\vb v$；它是$W$里离$\vb v$最近的点。
    definedIn: math.linear-algebra.orthogonal-projection
    anchor: def-orthogonal-projection
  - id: math.linear-algebra.direct-sum
    zh: |
      直和
    en: |
      direct sum
    brief: |
      $V$的每个向量都能唯一地写成$W_1$中一个向量与$W_2$中一个向量之和时，记作$V=W_1\oplus W_2$。
    definedIn: math.linear-algebra.orthogonal-projection
    anchor: def-direct-sum
  - id: math.linear-algebra.orthogonal-decomposition
    zh: |
      正交分解
    en: |
      orthogonal decomposition
    brief: |
      $W$是内积空间$V$的有限维子空间时，$V=W\oplus W^\perp$：每个向量都能唯一地写成$W$里一个向量与$W^\perp$里一个向量之和。
    definedIn: math.linear-algebra.orthogonal-projection
    anchor: thm-orthogonal-decomposition
  - id: math.linear-algebra.orthogonal-basis
    zh: |
      正交基
    en: |
      orthogonal basis
    brief: |
      由两两正交的非零向量组成的基；在它下面求投影、求坐标都不用解方程组。
    definedIn: math.linear-algebra.gram-schmidt
    anchor: def-orthonormal-basis
  - id: math.linear-algebra.orthonormal-basis
    zh: |
      正交规范基
    en: |
      orthonormal basis
    brief: |
      两两正交、范数都是$1$的基；在它下面，向量的坐标是$\langle\vb v,\vb q_i\rangle$，内积就是坐标的点积。
    definedIn: math.linear-algebra.gram-schmidt
    anchor: def-orthonormal-basis
  - id: math.linear-algebra.gram-schmidt
    zh: |
      施密特正交化
    en: |
      Gram-Schmidt process
    brief: |
      把线性无关的向量依次减去在前面已正交化的向量上的投影，得到两两正交的向量，再各自单位化。
    definedIn: math.linear-algebra.gram-schmidt
    anchor: thm-gram-schmidt
  - id: math.linear-algebra.qr-decomposition
    zh: |
      QR 分解
    en: |
      QR decomposition
    brief: |
      各列线性无关的矩阵写成$A=QR$：$Q$的各列正交规范，$R$是主对角线以下全为$0$、对角元为正的方阵。
    definedIn: math.linear-algebra.gram-schmidt
    anchor: thm-qr
  - id: math.linear-algebra.least-squares-solution
    zh: |
      最小二乘解
    en: |
      least-squares solution
    brief: |
      使$\|A\vb x-\vb b\|$最小的$\hat{\vb x}$；$A\vb x=\vb b$无解时，它让各方程误差的平方和最小。
    definedIn: math.linear-algebra.least-squares
    anchor: def-least-squares
  - id: math.linear-algebra.normal-equations
    zh: |
      法方程
    en: |
      normal equations
    brief: |
      方程组$A\T A\vb x=A\T\vb b$；它的解正是$A\vb x=\vb b$的最小二乘解，残差和$A$的各列正交。
    definedIn: math.linear-algebra.least-squares
    anchor: thm-normal-equations
  - id: math.linear-algebra.orthogonal-matrix
    zh: |
      正交矩阵
    en: |
      orthogonal matrix
    brief: |
      满足$Q\T Q=I$的方阵，即各列是正交规范基；它保持长度和夹角，逆是转置，行列式是$\pm1$。
    definedIn: math.linear-algebra.orthogonal-matrices
    anchor: def-orthogonal-matrix
  - id: math.linear-algebra.orthogonal-transformation
    zh: |
      正交变换
    en: |
      orthogonal transformation
    brief: |
      由正交矩阵给出的线性变换$\vb x\mapsto Q\vb x$，例如旋转、关于过原点的直线或平面的反射。
    definedIn: math.linear-algebra.orthogonal-matrices
    anchor: def-orthogonal-transformation
  - id: math.linear-algebra.spectral-theorem
    zh: |
      谱定理
    en: |
      spectral theorem
    brief: |
      实对称矩阵的特征值都是实数，并且有一组由特征向量组成的正交规范基，即$A=QDQ\T$，$Q$是正交矩阵。
    definedIn: math.linear-algebra.spectral-theorem
    anchor: thm-spectral
  - id: math.linear-algebra.spectral-decomposition
    zh: |
      谱分解
    en: |
      spectral decomposition
    brief: |
      实对称矩阵写成$A=\lambda_1\vb q_1\vb q_1\T+\dots+\lambda_n\vb q_n\vb q_n\T$，$\vb q_i$是正交规范的特征向量：投到各特征向量方向上，乘特征值，再相加。
    definedIn: math.linear-algebra.spectral-theorem
    anchor: def-spectral-decomposition
  - id: math.linear-algebra.complex-inner-product
    zh: |
      复内积
    en: |
      complex inner product
    brief: |
      复向量空间上的内积，交换两个向量时取共轭，对第二个变量线性；$\C^n$里是$\langle\vb u,\vb v\rangle=\sum\bar u_iv_i$。
    definedIn: math.linear-algebra.hermitian-unitary
    anchor: def-complex-inner-product
  - id: math.linear-algebra.conjugate-transpose
    zh: |
      共轭转置
    en: |
      conjugate transpose
    brief: |
      把矩阵的各元素取共轭再转置，记作$A\HT$；复内积可以写成$\langle\vb u,\vb v\rangle=\vb u\HT\vb v$。
    definedIn: math.linear-algebra.hermitian-unitary
    anchor: def-hermitian
  - id: math.linear-algebra.hermitian-matrix
    zh: |
      厄米矩阵
    en: |
      Hermitian matrix
    brief: |
      满足$A\HT=A$的复方阵；特征值都是实数，能用酉矩阵对角化。实的厄米矩阵就是对称矩阵。
    definedIn: math.linear-algebra.hermitian-unitary
    anchor: def-hermitian
  - id: math.linear-algebra.unitary-matrix
    zh: |
      酉矩阵
    en: |
      unitary matrix
    brief: |
      满足$U\HT U=I$的复方阵，即各列在复内积下正交规范；它保持复内积，特征值的模都是$1$。
    definedIn: math.linear-algebra.hermitian-unitary
    anchor: def-unitary
  - id: math.linear-algebra.quadratic-form
    zh: |
      二次型
    en: |
      quadratic form
    brief: |
      $n$个变量的二次齐次多项式，写成$\vb x\T A\vb x$，$A$取对称矩阵，例如$5x^2-4xy+8y^2$。
    definedIn: math.linear-algebra.quadratic-forms
    anchor: def-quadratic-form
  - id: math.linear-algebra.positive-definite
    zh: |
      正定
    en: |
      positive definite
    brief: |
      对所有$\vb x\ne\vb 0$都有$\vb x\T A\vb x>0$；对称矩阵正定当且仅当特征值都为正。
    definedIn: math.linear-algebra.quadratic-forms
    anchor: def-positive-definite
  - id: math.linear-algebra.law-of-inertia
    zh: |
      惯性定理
    en: |
      Sylvester's law of inertia
    brief: |
      二次型用任何可逆线性换元化成平方和，正系数、负系数的个数都不变，分别等于正、负特征值的个数。
    definedIn: math.linear-algebra.quadratic-forms
    anchor: thm-inertia
  - id: math.linear-algebra.singular-value
    zh: |
      奇异值
    en: |
      singular value
    brief: |
      $A\T A$的特征值的平方根$\sigma_i\ge0$，是$A$把一组互相垂直的单位向量拉成的长度。
    definedIn: math.linear-algebra.svd
    anchor: def-singular-value
  - id: math.linear-algebra.svd
    zh: |
      奇异值分解
    en: |
      singular value decomposition
    brief: |
      把任何矩阵写成$A=U\Sigma V\T$，$U$、$V$是正交矩阵，$\Sigma$的对角线上是从大到小的奇异值。
    definedIn: math.linear-algebra.svd
    anchor: thm-svd
