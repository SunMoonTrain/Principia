- id: p1
  tier: easy
  statement: |
    求$A=\begin{pmatrix}1&2&3\\2&4&6\end{pmatrix}$的零空间的维数。
  answer:
    type: number
    value: 2
  hints:
    - |
      零空间的维数等于$A\vb x=\vb 0$的自由变量的个数。
    - |
      第二行是第一行的$2$倍，做$R_2-2R_1$后只剩一行。
    - |
      只有一个主元（第一列），三个未知数里$x_2$、$x_3$是自由变量，维数是$2$；基可以取$(-2,1,0)$、$(-3,0,1)$。
  solution: |
    一个主元、三个未知数，自由变量$2$个，填 `2`。

- id: p2
  tier: easy
  statement: |
    $k$取多少时，$(1,k,3)$在$A=\begin{pmatrix}1&0\\1&1\\1&2\end{pmatrix}$的列空间里？
  answer:
    type: number
    value: 2
  hints:
    - |
      在列空间里，就是能写成$a(1,1,1)+b(0,1,2)$。
    - |
      第一个分量给出$a=1$，第三个分量给出$a+2b=3$。
    - |
      $a=1$、$b=1$，第二个分量$k=a+b=2$。
  solution: |
    $a=1$、$b=1$，$k=2$，填 `2`。

- id: p3
  tier: medium
  statement: |
    求$A=\begin{pmatrix}1&1&-1\\2&3&1\end{pmatrix}$的零空间的一组基。它只有一个向量；取第三个分量为$1$，按顺序填写这个向量的三个分量。
  answer:
    type: tuple
    value: [4, -3, 1]
  hints:
    - |
      化成简化行阶梯形，把主变量（pivot variable）用自由变量表示。
    - |
      做$R_2-2R_1$得$(0,1,3)$，再做$R_1-R_2$得$(1,0,-4)$。
    - |
      $x_1=4x_3$、$x_2=-3x_3$，令$x_3=1$，基向量是$(4,-3,1)$。验算：$4+(-3)-1=0$，$8-9+1=0$。
  solution: |
    $x_1=4x_3$、$x_2=-3x_3$，基向量$(4,-3,1)$，填 `4, -3, 1`。

- id: p4
  tier: medium
  statement: |
    设$A=\begin{pmatrix}1&2&1&1\\0&0&1&2\\1&2&2&3\end{pmatrix}$。下面哪几组$A$的列是$C(A)$的一组基？
  answer:
    type: choice
    multiple: true
    options:
      - |
        第 1、2 列
      - |
        第 1、3 列
      - |
        第 2、4 列
      - |
        第 1、2、3 列
      - |
        第 3、4 列
    value: [2, 3, 5]
  hints:
    - |
      先求$\dim C(A)$：第三行等于前两行之和。
    - |
      $\dim C(A)=2$，所以$C(A)$里任意两个线性无关的向量都是一组基。
    - |
      化成行阶梯形只有两个主元（第一、三列），$\dim C(A)=2$。第 2 列是第 1 列的$2$倍，选项 A 线性相关（linearly dependent）；选项 D 有三个向量，多于维数，一定线性相关。选项 B、C、E 各是两个不平行的列，都在$C(A)$里，由「个数对了，只需查一条」，都是基。
  solution: |
    $\dim C(A)=2$，选项 B、C、E 是两个线性无关的列，是基；A 的两列平行，D 的列数多于维数。

- id: p5
  tier: hard
  statement: |
    证明：初等行变换不改变矩阵的零空间，因此也不改变各列之间的线性关系；但它可以改变列空间，举一个例子。
  hints:
    - |
      零空间是方程组$A\vb x=\vb 0$的解集。
    - |
      各列之间的一个线性关系$c_1\vb a_1+\dots+c_n\vb a_n=\vb 0$，就是零空间里的一个向量$(c_1,\dots,c_n)$。
    - |
      $N(A)$是$A\vb x=\vb 0$的解集，初等行变换不改变方程组的解（[线性方程组与高斯消元](lesson:math.linear-algebra.linear-systems#thm-row-operations)），所以行变换前后零空间相同。$c_1\vb a_1+\dots+c_n\vb a_n=\vb 0$当且仅当$(c_1,\dots,c_n)\in N(A)$，所以变换前后各列满足的线性关系完全一样：哪几列线性无关、哪一列是其余几列的什么组合，都不变。

      列空间却会变：$\begin{pmatrix}1&2\\1&2\end{pmatrix}$做$R_2-R_1$得$\begin{pmatrix}1&2\\0&0\end{pmatrix}$，列空间从直线$y=x$变成$x$轴，两列「第二列是第一列的$2$倍」这个关系却没变。所以用主元找列空间的基时，要取原来的列。
  reference: |
    行变换不改变$A\vb x=\vb 0$的解，所以零空间不变；列之间的线性关系就是零空间里的向量，也不变。例：$\begin{pmatrix}1&2\\1&2\end{pmatrix}\to\begin{pmatrix}1&2\\0&0\end{pmatrix}$，列空间从$y=x$变成$x$轴。

- id: p6
  tier: hard
  statement: |
    设$A$是$m\times n$矩阵，$B$是$n\times p$矩阵。证明：(1) $C(AB)\subseteq C(A)$；(2) $N(B)\subseteq N(AB)$。由此说明$\dim C(AB)\le\dim C(A)$。
  hints:
    - |
      (1) $C(AB)$里的向量都是$AB\vb x$的形式。
    - |
      (2) $B\vb x=\vb 0$时，$AB\vb x$是什么？
    - |
      (1) $C(AB)$里的向量是$(AB)\vb x=A(B\vb x)$，它是$A$乘以向量$B\vb x$，所以在$C(A)$里。(2) 若$B\vb x=\vb 0$，则$(AB)\vb x=A(B\vb x)=A\vb 0=\vb 0$，所以$\vb x\in N(AB)$。

      由 (1) 和[基与维数](lesson:math.linear-algebra.basis-dimension)第 5 题，$\dim C(AB)\le\dim C(A)$：先做$B$再做$A$，得到的向量不会比只做$A$得到的更多。
  reference: |
    (1) $AB\vb x=A(B\vb x)\in C(A)$。(2) $B\vb x=\vb 0$推出$AB\vb x=\vb 0$。子空间包含时维数不增，所以$\dim C(AB)\le\dim C(A)$。

- id: p7
  tier: thinking
  statement: |
    $A$是$3\times3$矩阵，它的零空间是一条过原点的直线。$A$的列空间是什么形状？方程组$A\vb x=\vb b$对哪些$\vb b$有解？有解时，解集长什么样？
  hints:
    - |
      $\dim C(A)+\dim N(A)=3$。
    - |
      有解时，全部的解是一个特解加上零空间。
    - |
      $\dim N(A)=1$，所以$\dim C(A)=2$，列空间是$\R^3$里过原点的一个平面。$A\vb x=\vb b$有解，当且仅当$\vb b$在这个平面上；$\vb b$落在平面外时无解。

      有解时，全部的解是$\vb p+\vb h$，$\vb h$取遍零空间那条直线，所以解集是和零空间平行、经过$\vb p$的一条直线。不同的$\vb b$给出一族互相平行的直线，$A$把每一条都压成平面上的一个点。
  reference: |
    列空间是过原点的平面；$\vb b$在这个平面上才有解；解集是平行于零空间的直线$\vb p+N(A)$。

- id: p8
  tier: thinking
  statement: |
    配平丙烷燃烧的化学方程式$x_1\,\mathrm{C_3H_8}+x_2\,\mathrm{O_2}\to x_3\,\mathrm{CO_2}+x_4\,\mathrm{H_2O}$：碳、氢、氧三种原子在两边的个数要相等。把它写成齐次方程组，系数矩阵（coefficient matrix）的零空间是几维的？配平的答案是什么，为什么只差一个倍数？
  hints:
    - |
      碳：$3x_1=x_3$；氢：$8x_1=2x_4$；氧：$2x_2=2x_3+x_4$。都移到左边。
    - |
      三个方程、四个未知数，化成行阶梯形看有几个自由变量。
    - |
      方程组是$3x_1-x_3=0$、$8x_1-2x_4=0$、$2x_2-2x_3-x_4=0$。三个方程各有一个新的主变量，主元有$3$个，$x_1$之外的都能用$x_1$表示：$x_3=3x_1$、$x_4=4x_1$、$x_2=\frac{2x_3+x_4}2=5x_1$。零空间是$1$维的，由$(1,5,3,4)$生成。

      所以配平的方程式是$\mathrm{C_3H_8}+5\,\mathrm{O_2}\to3\,\mathrm{CO_2}+4\,\mathrm{H_2O}$；零空间里的其他向量都是它的倍数，只是把所有分子数同时加倍，化学上说的是同一个反应。若零空间是$2$维的，就说明这些物质之间可以发生两种互相独立的反应。
  reference: |
    方程$3x_1=x_3$、$8x_1=2x_4$、$2x_2=2x_3+x_4$；零空间一维，由$(1,5,3,4)$生成，即$\mathrm{C_3H_8}+5\mathrm{O_2}\to3\mathrm{CO_2}+4\mathrm{H_2O}$，其他解是它的倍数。
