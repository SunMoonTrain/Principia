<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-size="13">
  <!-- 左：直线 r = r0 + t v，r0 = (0, 0.6, 1.2)，v = (0.4, 1, 0.6)，一个单位 60 像素，标出 t = 0, 1, 2；右：平面 z = 0 的一块，法向量 n 沿 z 轴，Q = (0.6, 1.2, 1.6) 到平面的垂线。斜投影：x 轴画向左下 (-0.6, 0.45)，y 轴向右，z 轴向上，一个单位 46 像素 -->
  <line x1="73.2" y1="170.6" x2="228.24" y2="84.92" stroke="currentColor" stroke-width="1.4" />
  <line x1="60" y1="230" x2="92.87" y2="164.26" style="stroke: var(--muted, #6b7280)" stroke-width="1.4" stroke-dasharray="4 3" />
  <path d="M 96 158 L 96 165.83 L 89.74 162.7 Z" style="fill: var(--muted, #6b7280)" />
