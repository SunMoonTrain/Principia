  <circle cx="440" cy="200" r="3" fill="currentColor" />
  <circle cx="478.64" cy="138.82" r="3.2" fill="currentColor" />
  <circle cx="478.64" cy="212.42" r="2.6" fill="currentColor" />
  <path d="M 490.14 212.42 L 490.14 202.3 L 478.64 202.3" fill="none" stroke="currentColor" stroke-width="1" />
  <text x="432" y="216" text-anchor="end" fill="currentColor"><tspan font-style="italic">P</tspan><tspan baseline-shift="sub" font-size="10">0</tspan></text>
  <text x="486.64" y="142.82" font-size="14" fill="currentColor"><tspan font-style="italic">Q</tspan></text>
  <text x="432" y="148.8" text-anchor="end" font-size="14" style="fill: var(--warn, #a8661a)" fill="currentColor"><tspan font-weight="bold">n</tspan></text>
  <text x="486.64" y="163.62" style="fill: var(--good, #0f8a5f)" fill="currentColor">距离</text>
  <text x="470" y="284" text-anchor="middle" fill="currentColor">平面：<tspan font-weight="bold">n</tspan> · (<tspan font-weight="bold">r</tspan> − <tspan font-weight="bold">r</tspan><tspan baseline-shift="sub" font-size="10">0</tspan>) = 0</text>
