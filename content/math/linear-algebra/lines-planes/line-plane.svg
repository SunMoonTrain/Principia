  <text x="145.6" y="152.8" font-size="12" fill="currentColor"><tspan font-style="italic">t</tspan> = 1</text>
  <text x="191.2" y="127.6" font-size="12" fill="currentColor"><tspan font-style="italic">t</tspan> = 2</text>
  <text x="114.8" y="133.4" text-anchor="end" font-size="14" style="fill: var(--accent, #2563eb)" fill="currentColor"><tspan font-weight="bold">v</tspan></text>
  <text x="87" y="204" style="fill: var(--muted, #6b7280)" fill="currentColor"><tspan font-weight="bold">r</tspan><tspan baseline-shift="sub" font-size="10">0</tspan></text>
  <text x="160" y="284" text-anchor="middle" fill="currentColor">直线：<tspan font-weight="bold">r</tspan> = <tspan font-weight="bold">r</tspan><tspan baseline-shift="sub" font-size="10">0</tspan> + <tspan font-style="italic">t</tspan><tspan font-weight="bold">v</tspan></text>
  <path d="M 418.84 181.37 L 349.84 233.12 L 506.24 233.12 L 575.24 181.37 Z" style="fill: var(--accent, #2563eb); stroke: currentColor" fill-opacity="0.15" stroke-width="0.8" stroke-opacity="0.6" />
  <line x1="440" y1="200" x2="440" y2="153.8" style="stroke: var(--warn, #a8661a)" stroke-width="2.4" />
  <path d="M 440 144.8 L 444.5 153.8 L 435.5 153.8 Z" style="fill: var(--warn, #a8661a)" />
  <line x1="440" y1="200" x2="474.9" y2="144.74" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3" />
  <path d="M 478.64 138.82 L 477.86 146.61 L 471.94 142.87 Z" fill="currentColor" />
