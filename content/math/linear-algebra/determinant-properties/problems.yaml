- id: p1
  tier: easy
  statement: |
    求$\det\begin{pmatrix}2&7&-1&4\\0&-1&3&8\\0&0&3&6\\0&0&0&5\end{pmatrix}$。
  answer:
    type: number
    value: -30
  hints:
    - |
      这是上三角矩阵。
    - |
      三角矩阵的行列式等于主对角线上各数的乘积。
    - |
      $2\cdot(-1)\cdot3\cdot5=-30$；主对角线以上的数不影响结果。
  solution: |
    主对角线之积$2\cdot(-1)\cdot3\cdot5=-30$，填 `-30`。

- id: p2
  tier: easy
  statement: |
    $A$是三阶可逆方阵，$\det A=3$。按顺序填写$\det(2A)$、$\det A\T$、$\det A^{-1}$、$\det(A^2)$。
  answer:
    type: tuple
    value: [24, 3, 1/3, 9]
  hints:
    - |
      $2A$的每一列都乘了$2$，共三列。
    - |
      转置不改变行列式；$\det A^{-1}=\frac1{\det A}$；$A^2=AA$。
    - |
      $\det(2A)=2^3\cdot3=24$，$\det A\T=3$，$\det A^{-1}=\frac13$，$\det(A^2)=\det A\det A=9$。
  solution: |
    依次是$24$、$3$、$\frac13$、$9$，填 `24, 3, 1/3, 9`。

- id: p3
  tier: medium
  statement: |
    求$\det\begin{pmatrix}1&1&2&1\\2&3&5&2\\1&2&6&3\\3&3&6&5\end{pmatrix}$。
  answer:
    type: number
    value: 6
  hints:
    - |
      用「一行的倍数加到另一行上」化成上三角矩阵，行列式不变。
    - |
      做$R_2-2R_1$、$R_3-R_1$、$R_4-3R_1$，得$(0,1,1,0)$、$(0,1,4,2)$、$(0,0,0,2)$。
    - |
      再做$R_3-R_2$，第三行是$(0,0,3,2)$；四行依次是$(1,1,2,1)$、$(0,1,1,0)$、$(0,0,3,2)$、$(0,0,0,2)$，已是上三角，行列式是$1\cdot1\cdot3\cdot2=6$。
  solution: |
    化成上三角矩阵，主对角线$1,1,3,2$，行列式是$6$，填 `6`。

- id: p4
  tier: medium
  statement: |
    按第二行展开，求$\det\begin{pmatrix}2&1&3\\0&4&1\\5&2&6\end{pmatrix}$。
  answer:
    type: number
    value: -11
  hints:
    - |
      $\det A=a_{21}C_{21}+a_{22}C_{22}+a_{23}C_{23}$，$a_{21}=0$那一项不用算。
    - |
      $C_{22}=(+1)\det\begin{pmatrix}2&3\\5&6\end{pmatrix}$，$C_{23}=(-1)\det\begin{pmatrix}2&1\\5&2\end{pmatrix}$。
    - |
      $C_{22}=12-15=-3$，$C_{23}=-(4-5)=1$，$\det A=4\cdot(-3)+1\cdot1=-11$。
  solution: |
    $4\cdot(-3)+1\cdot1=-11$，填 `-11`。

- id: p5
  tier: hard
  statement: |
    设$A$是$n$阶可逆方阵，$A_i$是把$A$的第$i$列换成$\vb b$得到的矩阵。证明方程组$A\vb x=\vb b$的唯一解是$x_i=\frac{\det A_i}{\det A}$（$i=1,\dots,n$），这叫克拉默法则（Cramer's rule）。
  hints:
    - |
      $\vb b=A\vb x=x_1\vb a_1+\dots+x_n\vb a_n$。
    - |
      把这个式子代进$\det A_i$的第$i$列，用多重线性展开。
    - |
      $A$可逆，方程组有唯一解$\vb x$，并且$\vb b=x_1\vb a_1+\dots+x_n\vb a_n$。$\det A_i$的第$i$列换成这个组合，由多重线性，$\det A_i=\sum_jx_j\det(\vb a_1,\dots,\vb a_j,\dots,\vb a_n)$，其中第$j$项是把第$i$列换成$\vb a_j$。$j\ne i$时有两列相同，是零；只剩$j=i$那一项$x_i\det A$。

      所以$\det A_i=x_i\det A$，$\det A\ne0$，$x_i=\frac{\det A_i}{\det A}$。二阶时，例如$ax+by=e$、$cx+dy=f$，得$x=\frac{ed-bf}{ad-bc}$、$y=\frac{af-ec}{ad-bc}$。这个公式适合讲道理、解小方程组；大方程组用消元快得多。
  reference: |
    $\vb b=\sum x_j\vb a_j$代入$A_i$的第$i$列，按多重线性展开，$j\ne i$的项有两列相同为零，得$\det A_i=x_i\det A$。

- id: p6
  tier: hard
  statement: |
    把代数余子式$C_{ji}$放在第$i$行第$j$列，得到的矩阵叫作$A$的伴随矩阵（adjugate），记作$\operatorname{adj}A$。证明$A\operatorname{adj}A=(\det A)I$；由此，$A$可逆时$A^{-1}=\frac1{\det A}\operatorname{adj}A$，并验证二阶时就是[二阶矩阵的逆](lesson:math.linear-algebra.matrix-inverse#thm-two-by-two)的公式。
  hints:
    - |
      $A\operatorname{adj}A$的第$i$行第$k$列是$\sum_ja_{ij}C_{kj}$。
    - |
      $i=k$时这是按第$i$行展开；$i\ne k$时，它是把第$k$行换成第$i$行得到的矩阵按第$k$行展开。
    - |
      $(A\operatorname{adj}A)_{ik}=\sum_ja_{ij}(\operatorname{adj}A)_{jk}=\sum_ja_{ij}C_{kj}$。$i=k$时是$\det A$按第$i$行展开。$i\ne k$时，把$A$的第$k$行换成第$i$行，得到的矩阵有两行相同，行列式为零；它按第$k$行展开，代数余子式$C_{kj}$不变（划掉的正是第$k$行），展开式正是$\sum_ja_{ij}C_{kj}$，所以是$0$。

      于是$A\operatorname{adj}A=(\det A)I$，$\det A\ne0$时两边除以它，$A\cdot\frac1{\det A}\operatorname{adj}A=I$，乘一边就够。二阶时$C_{11}=d$、$C_{12}=-c$、$C_{21}=-b$、$C_{22}=a$，$\operatorname{adj}A=\begin{pmatrix}d&-b\\-c&a\end{pmatrix}$，正是那个公式。
  reference: |
    $(A\operatorname{adj}A)_{ik}=\sum_ja_{ij}C_{kj}$：$i=k$时是按行展开得$\det A$；$i\ne k$时是一个有两行相同的矩阵按第$k$行展开，为零。二阶时$\operatorname{adj}A=\begin{pmatrix}d&-b\\-c&a\end{pmatrix}$。

- id: p7
  tier: thinking
  statement: |
    $AB$和$BA$一般不相等，为什么$\det(AB)=\det(BA)$总成立？从体积的放大倍数看，$\det(AB)=\det A\det B$和$\det A^{-1}=\frac1{\det A}$各说的是什么？
  hints:
    - |
      两者都等于$\det A\det B$，数的乘法可以交换。
    - |
      先作用$B$再作用$A$，体积先后各放大多少倍？
    - |
      $\det(AB)=\det A\det B=\det B\det A=\det(BA)$：矩阵乘法（matrix multiplication）不能交换，可放大倍数是数，相乘可以交换。$AB$和$BA$把单位正方形变成形状不同的平行四边形，面积和朝向却一样。

      先作用$B$，体积放大$|\det B|$倍，再作用$A$，又放大$|\det A|$倍，合起来放大$|\det A||\det B|$倍；朝向翻一次变号一次。$A^{-1}$把$A$做的变换撤回去，体积要缩回原来的大小，所以放大倍数是$\frac1{\det A}$；$\det A=0$时体积已被压成零，没有办法撤回，$A$也就不可逆。
  reference: |
    $\det(AB)$、$\det(BA)$都等于$\det A\det B$，数相乘可交换。放大倍数先后相乘；逆变换把体积缩回去，倍数是倒数；压成零的撤不回，所以不可逆。

- id: p8
  tier: thinking
  statement: |
    $10$阶方阵$A=0.1I$的行列式是多少？它可逆吗？解$A\vb x=\vb b$难不难？由此说明，为什么不能用行列式的大小来判断一个矩阵「差一点就不可逆」。
  hints:
    - |
      $0.1I$是对角矩阵，行列式是主对角线之积。
    - |
      $A^{-1}$是什么？
    - |
      $\det A=0.1^{10}=10^{-10}$，非常小；可$A^{-1}=10I$，方程组的解就是$\vb x=10\vb b$，一点也不难，对误差也不敏感。

      行列式是体积的放大倍数，每个方向都缩小到$\frac1{10}$，$10$个方向乘起来就成了$10^{-10}$；它随矩阵的大小、阶数剧烈变化，把$A$乘以$10$，行列式就变成$1$。所以判断一个矩阵是不是「差一点就不可逆」，要看它把某个方向压得比别的方向扁多少（例如[线性无关](lesson:math.linear-algebra.linear-independence)第 8 题里两列几乎平行（parallel）），而不是看行列式本身是大是小；数值计算里用的是条件数（condition number）这样的量。
  reference: |
    $\det A=10^{-10}$，但$A^{-1}=10I$，方程组很好解。行列式随矩阵的大小、阶数剧烈变化，小不等于接近不可逆；要看各方向被压扁的程度是否悬殊。
