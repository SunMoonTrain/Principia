- id: p1
  tier: easy
  statement: |
    用:term[试探函数]{id="math.calculus-of-variations.trial-function"}$y=x(1-x)^2$估计$[0,1]$上$-y''=\lambda y$、$y(0)=y(1)=0$的最小特征值：求它的:term[瑞利商]{id="math.calculus-of-variations.rayleigh-quotient"}$R[y]=\frac{\int_0^1y'^2\,\dd x}{\int_0^1y^2\,\dd x}$。
  answer:
    type: number
    value: 14
  hints:
    - |
      先检查$y$两端为零，再把$y'$写成多项式。
    - |
      $y'=1-4x+3x^2$，$\int_0^1y'^2\,\dd x=\frac{2}{15}$。
    - |
      $\int_0^1x^2(1-x)^4\,\dd x=\frac{1}{105}$，所以$R[y]=\frac{2}{15}\cdot105=14$，比$\pi^2\approx9.87$大，确实是上界。
  solution: |
    $y=x-2x^2+x^3$，$y'=1-4x+3x^2$，展开积分得$\int_0^1y'^2\,\dd x=\frac2{15}$，$\int_0^1y^2\,\dd x=\frac1{105}$，所以$R[y]=14$。它比$\pi^2$大了约$42\%$：$x(1-x)^2$的最高点偏向左边，不像$\sin\pi x$那样对称，估计就差得多。

- id: p2
  tier: easy
  statement: |
    在$[0,1]$上考虑两端为零、不恒为零的函数和:term[瑞利商]{id="math.calculus-of-variations.rayleigh-quotient"}$R[y]=\frac{\int_0^1y'^2\,\dd x}{\int_0^1y^2\,\dd x}$。下面哪些说法正确？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $R[-2y]=R[y]$
      - |
        $\sin5\pi x$是特征函数，$R[\sin5\pi x]=25\pi^2$
      - |
        $x(1-x)$是特征函数
      - |
        $y=x-x^3$给出的$R[y]$小于$\pi^2$
      - |
        $R[y]=\pi^2$时，$y$一定是$\sin\pi x$的常数倍
    value: [1, 2, 5]
  hints:
    - |
      分子、分母都是$y$的二次式；特征函数的瑞利商等于它的特征值。
    - |
      $-(x(1-x))''=2$，它不是$x(1-x)$的常数倍。任何两端为零的$y$都有$R[y]\ge\pi^2$。
    - |
      A、B、E 对；C 不是特征函数；D 的$R[y]=\frac{21}{2}$，不小于$\pi^2$。
  solution: |
    A 对：分子、分母同乘$4$。B 对：$-(\sin5\pi x)''=25\pi^2\sin5\pi x$，特征函数的瑞利商等于特征值。C 错：$-(x(1-x))''=2$不是$x(1-x)$的常数倍。D 错：任何两端为零的$y$都有$R[y]\ge\pi^2$，这里$R[y]=\frac{4/5}{8/105}=\frac{21}2$；E 对，这是定理里等号成立的条件。

- id: p3
  tier: medium
  statement: |
    弦的张力随位置变化，方程是$-\bigl((1+x)y'\bigr)'=\lambda y$，$y(0)=y(1)=0$。用:term[试探函数]{id="math.calculus-of-variations.trial-function"}$\sin\pi x$求最小特征值的上界。
  answer:
    type: number
    value: 3*pi^2/2
  hints:
    - |
      这时$p=1+x$、$q=0$、$w=1$，:term[瑞利商]{id="math.calculus-of-variations.rayleigh-quotient"}是$\frac{\int_0^1(1+x)y'^2\,\dd x}{\int_0^1y^2\,\dd x}$。
    - |
      分子是$\pi^2\int_0^1(1+x)\cos^2\pi x\,\dd x$；$\int_0^1x\cos^2\pi x\,\dd x$可以用把$x$换成$1-x$的对称性求。
    - |
      $\int_0^1x\cos^2\pi x\,\dd x=\frac14$，分子是$\frac{3\pi^2}{4}$，分母是$\frac12$，上界是$\frac{3\pi^2}{2}\approx14.80$。
  solution: |
    分子$\pi^2\int_0^1(1+x)\cos^2\pi x\,\dd x=\pi^2\bigl(\frac12+\frac14\bigr)=\frac{3\pi^2}{4}$，其中$\int_0^1x\cos^2\pi x\,\dd x$和$\int_0^1(1-x)\cos^2\pi x\,\dd x$相等，和为$\frac12$。分母$\int_0^1\sin^2\pi x\,\dd x=\frac12$，所以$\lambda_1\le\frac{3\pi^2}{2}\approx14.80$。数值解方程得$\lambda_1\approx14.34$；张力处处不小于$1$，所以$\lambda_1\ge\pi^2$，结果和这一点一致。

- id: p4
  tier: medium
  statement: |
    $A=\begin{pmatrix}2&-1&0\\-1&2&-1\\0&-1&2\end{pmatrix}$。求$\frac{\mathbf x\cdot A\mathbf x}{\mathbf x\cdot\mathbf x}$在$\mathbf x\ne\mathbf 0$时的最小值。
  answer:
    type: number
    value: 2-sqrt(2)
  hints:
    - |
      这个商的最小值是$A$的最小特征值。
    - |
      $\det(A-\lambda I)=(2-\lambda)\bigl((2-\lambda)^2-2\bigr)$。
    - |
      特征值是$2-\sqrt2$、$2$、$2+\sqrt2$，最小值是$2-\sqrt2\approx0.586$，在$\mathbf x=(1,\sqrt2,1)$处取到。
  solution: |
    按行列式展开，$\det(A-\lambda I)=(2-\lambda)\bigl((2-\lambda)^2-2\bigr)$，特征值是$2-\sqrt2$、$2$、$2+\sqrt2$。最小值是$2-\sqrt2\approx0.586$，在$\mathbf x=(1,\sqrt2,1)$处取到，可以直接代进去验证。这个矩阵来自把弦离散成三个点：步长$h=\frac14$时$\frac{y_{i-1}-2y_i+y_{i+1}}{h^2}$近似$y''$，于是$16(2-\sqrt2)\approx9.37$近似$\pi^2\approx9.87$。

- id: p5
  tier: hard
  statement: |
    考虑$[0,L]$上的$-y''=\lambda y$、$y(0)=y(L)=0$。证明：（1）特征值都是正数；（2）属于不同特征值的特征函数$y$、$z$正交，即$\int_0^Ly\,z\,\dd x=0$。
  hints:
    - |
      （1）两边乘$y$积分，分部积分。
    - |
      $\lambda\int_0^Ly^2\,\dd x=\int_0^Ly'^2\,\dd x$；右边为零意味着$y$是常数。
    - |
      （2）设$-z''=\mu z$，算$\int_0^L(-y'')z\,\dd x$：分部积分两次，它等于$\int_0^Ly\,(-z'')\,\dd x$，于是$(\lambda-\mu)\int_0^Ly\,z\,\dd x=0$。
  reference: |
    （1）设$y$是属于$\lambda$的特征函数。两边乘$y$积分，分部积分时边界项$y\,y'$在两端为零，得$\lambda\int_0^Ly^2\,\dd x=\int_0^Ly'^2\,\dd x\ge0$。如果右边为零，$y'\equiv0$，$y$是常数，又$y(0)=0$，只能$y\equiv0$，和特征函数的定义矛盾。所以右边为正，$\lambda>0$。

    （2）设$-y''=\lambda y$，$-z''=\mu z$，$\lambda\ne\mu$。分部积分两次，边界项都因$y$、$z$在两端为零而消失：$\int_0^L(-y'')z\,\dd x=\int_0^Ly'z'\,\dd x=\int_0^Ly\,(-z'')\,\dd x$。左边是$\lambda\int_0^Ly\,z\,\dd x$，右边是$\mu\int_0^Ly\,z\,\dd x$，所以$(\lambda-\mu)\int_0^Ly\,z\,\dd x=0$，即$\int_0^Ly\,z\,\dd x=0$。

    这和实对称矩阵属于不同特征值的特征向量互相垂直是同一回事：$\int_0^L(-y'')z\,\dd x=\int_0^Ly\,(-z'')\,\dd x$正是$\mathbf x\cdot A\mathbf y=A\mathbf x\cdot\mathbf y$的对应物。

- id: p6
  tier: hard
  statement: |
    设$y$在$[0,1]$上有连续的导数，$y(0)=0$，右端不加限制。证明$\int_0^1y'^2\,\dd x\ge\frac{\pi^2}{4}\int_0^1y^2\,\dd x$，并说明等号何时成立。
  hints:
    - |
      仿照讲解里定理的证明，换一个在$(0,1]$上不为零的函数。
    - |
      取$k=\frac\pi2$，$\sin kx$在$(0,1]$上为正，讲解里的恒等式照样成立。
    - |
      积分时$x=1$处的边界项是$k\cot\frac\pi2\cdot y(1)^2=0$，不管$y(1)$是多少；$x\to0$处和讲解一样趋于零。
  reference: |
    取$k=\frac\pi2$。在$(0,1]$上$\sin kx>0$，直接求导可以验证$y'^2-k^2y^2=\bigl(y'-k\cot(kx)\,y\bigr)^2+\bigl(k\cot(kx)\,y^2\bigr)'$。从$0$到$1$积分：$x\to0$时边界项趋于零（$|y(x)|$不超过常数乘$x$，$\cot(kx)$约是$\frac1{kx}$），$x=1$处是$k\cot\frac\pi2\cdot y(1)^2=0$。所以$\int_0^1(y'^2-k^2y^2)\,\dd x=\int_0^1\bigl(y'-k\cot(kx)\,y\bigr)^2\dd x\ge0$。

    等号要求$y'=k\cot(kx)\,y$，即$y=c\sin\frac{\pi x}{2}$，所以常数$\frac{\pi^2}4$不能再改大。$\sin\frac{\pi x}{2}$满足$-y''=\frac{\pi^2}{4}y$、$y(0)=0$，右端$y'(1)=0$，这正是右端不加限制时极小值自动满足的:term[自然边界条件]{id="math.calculus-of-variations.natural-boundary-condition"}（natural boundary condition，见[自然边界条件与可动端点](lesson:math.calculus-of-variations.natural-boundary-conditions)）。和两端都固定的情形比，少了一个限制，最小值从$\pi^2$降到$\frac{\pi^2}{4}$。

- id: p7
  tier: thinking
  statement: |
    在两端固定的均匀弦的中点粘一颗小珠子，基频变高还是变低？如果改成把中点按住不动呢？用:term[瑞利商]{id="math.calculus-of-variations.rayleigh-quotient"}说明，不解方程。
  hints:
    - |
      瑞利商的分母$\int w\,y^2\,\dd x$管的是质量的分布，分子管的是弦的弹性；频率随最小特征值$\lambda_1$升降。
    - |
      粘上珠子：把珠子看成中点附近一段很窄、很密的质量，分母大约多出$M\,y(\frac12)^2$，每个$y$的$R$都不会变大。
    - |
      按住中点：参加比较的函数多了一个条件$y(\frac12)=0$，在更小的范围里求最小值，结果不会变小；其实每一半都是长$\frac12$的弦，$\lambda_1=4\pi^2$。
  reference: |
    粘珠子：设弦长$1$、密度$1$，珠子质量$M$。把珠子看成中点附近一段很窄、很密的质量，分母从$\int_0^1y^2\,\dd x$变成大约$\int_0^1y^2\,\dd x+M\,y(\frac12)^2$，分子不变。每个$y$的$R$都不变大，$y(\frac12)\ne0$的变小，所以最小值$\lambda_1$变小，基频变低：弦变重了。

    按住中点：容许的函数多了条件$y(\frac12)=0$，分子、分母都不变，但在更小的函数集合里求最小值，结果不会更小，所以基频变高。精确地说，两半各是一根长$\frac12$、两端固定的弦，由讲解的定理，$\lambda_1=\frac{\pi^2}{(1/2)^2}=4\pi^2$，频率加倍，这正是原来那根弦的第二个特征值（见[驻波](lesson:physics.oscillations-waves.standing-waves)）。

    两种改动都不用解方程：瑞利商把物理上的改动翻译成分子、分母或比较范围的变化，最小值往哪边变就一目了然。

- id: p8
  tier: thinking
  statement: |
    设$y_1$是属于$\lambda_1$的特征函数，:term[试探函数]{id="math.calculus-of-variations.trial-function"}是$y=y_1+\varepsilon\eta$（$\eta$两端为零，不是$y_1$的常数倍）。$R[y]-\lambda_1$是$\varepsilon$的几阶小量？这说明用试探函数估计特征值有什么好处？
  hints:
    - |
      $y_1$是:term[瑞利商]{id="math.calculus-of-variations.rayleigh-quotient"}的最小值点，也就是驻点。
    - |
      所以$\dv{}{\varepsilon}R[y_1+\varepsilon\eta]$在$\varepsilon=0$处为零，$R[y]-\lambda_1$没有一次项。
    - |
      是二阶小量：试探函数有$10\%$的偏差，特征值的估计大约只差百分之几（几何图像里$c=0$附近曲线很平）。
  reference: |
    记分子$N=\int_0^1y'^2\,\dd x$、分母$D=\int_0^1y^2\,\dd x$。分部积分并用$-y_1''=\lambda_1y_1$，得$\int_0^1y_1'\eta'\,\dd x=\lambda_1\int_0^1y_1\eta\,\dd x$，于是$N-\lambda_1D$里的一次项$2\varepsilon\int y_1'\eta'\,\dd x-2\varepsilon\lambda_1\int y_1\eta\,\dd x$正好消掉，剩下$N-\lambda_1D=\varepsilon^2\int_0^1\bigl(\eta'^2-\lambda_1\eta^2\bigr)\dd x$。所以$R[y]-\lambda_1=\frac{N-\lambda_1D}{D}$是$\varepsilon$的二阶小量。

    这正是驻点的特点：在驻点附近，函数值的变化比自变量的变化高一阶，和一元函数在极小值点附近$f(x_0+h)-f(x_0)$约是$h^2$一样。所以试探函数只要大致像特征函数，估计出的特征值就相当准；反过来，用$R$的值很难判断试探函数本身像不像。几何图像里$R=\pi^2\frac{1+m^2c^2}{1+c^2}$，在$c=0$附近约是$\pi^2\bigl(1+(m^2-1)c^2\bigr)$，正是这种二阶的变化。
