id: math.calculus-of-variations
title: |
  变分法
proofPolicy: sketch
macros:
  \R: |
    \mathbb{R}
  \dd: |
    \mathop{}\!\mathrm{d}
  \dv: |
    \frac{\mathrm{d} #1}{\mathrm{d} #2}
  \pdv: |
    \frac{\partial #1}{\partial #2}
glossary:
  - id: math.calculus-of-variations.functional
    zh: |
      泛函
    en: |
      functional
    brief: |
      把一类函数中的每个函数对应到一个实数的规则，例如把曲线对应到它的长度。
    definedIn: math.calculus-of-variations.functionals
    anchor: def-functional
  - id: math.calculus-of-variations.admissible-function
    zh: |
      容许函数
    en: |
      admissible function
    brief: |
      变分问题里参加比较的函数：满足给定的端点条件，导数连续。
    definedIn: math.calculus-of-variations.functionals
    anchor: def-admissible-function
  - id: math.calculus-of-variations.variational-problem
    zh: |
      变分问题
    en: |
      variational problem
    brief: |
      在容许函数中找使泛函取最小值或最大值的函数。
    definedIn: math.calculus-of-variations.functionals
    anchor: def-variational-problem
  - id: math.calculus-of-variations.brachistochrone
    zh: |
      最速降线
    en: |
      brachistochrone
    brief: |
      小球由静止沿光滑轨道滑到较低的一点，用时最短的那条轨道；它是一段摆线。
    definedIn: math.calculus-of-variations.functionals
    anchor: def-brachistochrone
  - id: math.calculus-of-variations.first-variation
    zh: |
      第一变分
    en: |
      first variation
    brief: |
      泛函沿方向$\eta$的导数$\delta J=\dv{}{\varepsilon}J[y+\varepsilon\eta]$在$\varepsilon=0$处的值。
    definedIn: math.calculus-of-variations.euler-lagrange
    anchor: def-first-variation
  - id: math.calculus-of-variations.fundamental-lemma
    zh: |
      变分法基本引理
    en: |
      fundamental lemma of the calculus of variations
    brief: |
      连续函数$g$与所有两端为零的光滑函数$\eta$之积的积分都为零，则$g$恒为零。
    definedIn: math.calculus-of-variations.euler-lagrange
    anchor: thm-fundamental-lemma
  - id: math.calculus-of-variations.euler-lagrange-equation
    zh: |
      欧拉-拉格朗日方程
    en: |
      Euler–Lagrange equation
    brief: |
      泛函$\int F(x,y,y')\,\dd x$的光滑局部极值满足的方程$F_y-\dv{}{x}F_{y'}=0$。
    definedIn: math.calculus-of-variations.euler-lagrange
    anchor: thm-euler-lagrange
  - id: math.calculus-of-variations.extremal
    zh: |
      极值曲线
    en: |
      extremal
    brief: |
      满足欧拉-拉格朗日方程的函数；它使第一变分为零，但不一定取极值。
    definedIn: math.calculus-of-variations.euler-lagrange
    anchor: def-extremal
  - id: math.calculus-of-variations.beltrami-identity
    zh: |
      贝尔特拉米恒等式
    en: |
      Beltrami identity
    brief: |
      被积函数$F(y,y')$不显含$x$时，沿每条极值曲线$F-y'F_{y'}$是常数。
    definedIn: math.calculus-of-variations.beltrami-identity
    anchor: thm-beltrami
  - id: math.calculus-of-variations.first-integral
    zh: |
      首次积分
    en: |
      first integral
    brief: |
      沿每条极值曲线都保持为常数的量；知道它，二阶的方程就降成一阶。
    definedIn: math.calculus-of-variations.beltrami-identity
    anchor: def-first-integral
  - id: math.calculus-of-variations.catenoid
    zh: |
      悬链面
    en: |
      catenoid
    brief: |
      悬链线$y=c\cosh\frac{x-x_0}{c}$绕$x$轴转出的曲面，连接两个圆环的肥皂膜就是它。
    definedIn: math.calculus-of-variations.beltrami-identity
    anchor: def-catenary
  - id: math.calculus-of-variations.natural-boundary-condition
    zh: |
      自然边界条件
    en: |
      natural boundary condition
    brief: |
      端点的值不给定时，局部极值在那里自动满足的条件$F_{y'}=0$。
    definedIn: math.calculus-of-variations.natural-boundary-conditions
    anchor: def-natural-boundary-condition
  - id: math.calculus-of-variations.transversality-condition
    zh: |
      横截条件
    en: |
      transversality condition
    brief: |
      终点在曲线$y=\varphi(x)$上滑动时，局部极值在终点满足$F+(\varphi'-y')F_{y'}=0$。
    definedIn: math.calculus-of-variations.natural-boundary-conditions
    anchor: def-transversality-condition
  - id: math.calculus-of-variations.euler-poisson-equation
    zh: |
      欧拉-泊松方程
    en: |
      Euler–Poisson equation
    brief: |
      被积函数含$y''$时的方程$F_y-\dv{}{x}F_{y'}+\frac{\dd^2}{\dd x^2}F_{y''}=0$，一般是四阶的。
    definedIn: math.calculus-of-variations.several-functions
    anchor: thm-euler-poisson
  - id: math.calculus-of-variations.isoperimetric-problem
    zh: |
      等周问题
    en: |
      isoperimetric problem
    brief: |
      带积分约束的变分问题：求$\int F\,\dd x$的极值，同时要求$\int G\,\dd x$等于给定的值。
    definedIn: math.calculus-of-variations.isoperimetric-problems
    anchor: def-isoperimetric-problem
  - id: math.calculus-of-variations.dirichlet-integral
    zh: |
      狄利克雷积分
    en: |
      Dirichlet integral
    brief: |
      $D[u]=\frac12\iint(u_x^2+u_y^2)\,\dd x\,\dd y$，衡量$u$起伏的程度；它的极值函数满足拉普拉斯方程。
    definedIn: math.calculus-of-variations.multivariable-functionals
    anchor: def-dirichlet-integral
  - id: math.calculus-of-variations.dirichlet-principle
    zh: |
      狄利克雷原理
    en: |
      Dirichlet principle
    brief: |
      满足拉普拉斯方程的函数，在边界值相同的函数中使狄利克雷积分最小。
    definedIn: math.calculus-of-variations.multivariable-functionals
    anchor: thm-dirichlet-principle
  - id: math.calculus-of-variations.minimal-surface
    zh: |
      极小曲面
    en: |
      minimal surface
    brief: |
      使面积的第一变分为零的曲面；作为图像$z=u(x,y)$时满足极小曲面方程。
    definedIn: math.calculus-of-variations.multivariable-functionals
    anchor: def-minimal-surface
  - id: math.calculus-of-variations.second-variation
    zh: |
      第二变分
    en: |
      second variation
    brief: |
      $\Phi(\varepsilon)=J[y+\varepsilon\eta]$在$\varepsilon=0$处的二阶导数；局部极小处它对所有$\eta$都非负。
    definedIn: math.calculus-of-variations.second-variation
    anchor: def-second-variation
  - id: math.calculus-of-variations.legendre-condition
    zh: |
      勒让德条件
    en: |
      Legendre condition
    brief: |
      局部极小处沿极值曲线$F_{y'y'}\ge0$（极大处$\le0$）；它是必要条件，不是充分条件。
    definedIn: math.calculus-of-variations.second-variation
    anchor: thm-legendre
  - id: math.calculus-of-variations.jacobi-equation
    zh: |
      雅可比方程
    en: |
      Jacobi equation
    brief: |
      沿极值曲线的线性方程$-(Ph')'+Qh=0$，$P=F_{y'y'}$，$Q=F_{yy}-\dv{}{x}F_{yy'}$；它是第二变分的欧拉-拉格朗日方程。
    definedIn: math.calculus-of-variations.jacobi-condition
    anchor: def-jacobi-equation
  - id: math.calculus-of-variations.conjugate-point
    zh: |
      共轭点
    en: |
      conjugate point
    brief: |
      雅可比方程满足$h(a)=0$、$h'(a)=1$的解在$a$右边的第一个零点。
    definedIn: math.calculus-of-variations.jacobi-condition
    anchor: def-conjugate-point
  - id: math.calculus-of-variations.jacobi-condition
    zh: |
      雅可比条件
    en: |
      Jacobi condition
    brief: |
      $F_{y'y'}>0$时，极值曲线是局部极小的必要条件是两端之间没有共轭点；伸到第一个共轭点为止都是极小。
    definedIn: math.calculus-of-variations.jacobi-condition
    anchor: thm-jacobi
  - id: math.calculus-of-variations.holonomic-constraint
    zh: |
      完整约束
    en: |
      holonomic constraint
    brief: |
      未知函数在每一点都要满足、不含导数的方程，例如曲线必须落在曲面$G=0$上；它的乘子是一个函数。
    definedIn: math.calculus-of-variations.holonomic-constraints
    anchor: def-holonomic-constraint
  - id: math.calculus-of-variations.rayleigh-quotient
    zh: |
      瑞利商
    en: |
      Rayleigh quotient
    brief: |
      两端为零的$y$的商$\frac{\int y'^2\,\dd x}{\int y^2\,\dd x}$及其带系数的推广；它的最小值是最小特征值。
    definedIn: math.calculus-of-variations.rayleigh-quotient
    anchor: def-rayleigh-quotient
  - id: math.calculus-of-variations.trial-function
    zh: |
      试探函数
    en: |
      trial function
    brief: |
      为了估计极小值而代进瑞利商或泛函的具体容许函数；它给出的是上界。
    definedIn: math.calculus-of-variations.rayleigh-quotient
    anchor: def-trial-function
  - id: math.calculus-of-variations.minimizing-sequence
    zh: |
      极小化序列
    en: |
      minimizing sequence
    brief: |
      一列容许函数$y_k$，使$J[y_k]$趋于$J$的下确界；它不一定收敛，极限也不一定是极小值点。
    definedIn: math.calculus-of-variations.direct-methods
    anchor: def-minimizing-sequence
  - id: math.calculus-of-variations.direct-method
    zh: |
      直接方法
    en: |
      direct method
    brief: |
      不经过欧拉-拉格朗日方程，从极小化序列出发证明极小值点存在或求近似解的办法。
    definedIn: math.calculus-of-variations.direct-methods
    anchor: def-direct-method
  - id: math.calculus-of-variations.ritz-method
    zh: |
      里茨方法
    en: |
      Ritz method
    brief: |
      在有限个基函数的线性组合中求泛函的最小值，用来近似原问题；得到的值是上界。
    definedIn: math.calculus-of-variations.direct-methods
    anchor: def-ritz-method
