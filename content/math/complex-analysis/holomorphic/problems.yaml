- id: p1
  tier: easy
  statement: |
    设$f(z)=(x^2-y^2)+2ixy$。用柯西-黎曼方程（Cauchy-Riemann equations）验证$f$处处复可导，并求$f'(1+i)$，答案依次写实部、虚部。
  answer:
    type: tuple
    value: [2, 2]
  hints:
    - |
      $u=x^2-y^2$，$v=2xy$，求四个偏导数。
    - |
      $u_x=2x=v_y$，$u_y=-2y=-v_x$，偏导数处处连续。
    - |
      $f'=u_x+iv_x=2x+2iy$。
  solution: |
    $u_x=2x$，$u_y=-2y$，$v_x=2y$，$v_y=2x$，处处连续并满足$u_x=v_y$、$u_y=-v_x$，所以$f$处处复可导，$f'=u_x+iv_x=2x+2iy$。在$1+i$处是$2+2i$：实部$2$，虚部$2$。其实$f(z)=z^2$，$f'=2z$。

- id: p2
  tier: easy
  statement: |
    下列函数中，是整函数（entire function）的有哪些？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\bar z$
      - |
        $\frac1{z^2+1}$
      - |
        $z^3+e^z$
      - |
        $\sin z\cos z$
    value: [3, 4]
  hints:
    - |
      整函数要在整个复平面上处处复可导。
    - |
      A：$u=x$，$v=-y$，$u_x=v_y$成立吗？B：分母什么时候为$0$？
    - |
      C、D 由整函数经过加法、乘法得到。
  solution: |
    A：$u_x=1$，$v_y=-1$，柯西-黎曼方程处处不成立，不是。B：$z=\pm i$处没有定义，不是。C、D：$z^3$、$e^z$、$\sin z$、$\cos z$都是整函数，相加、相乘仍处处复可导，是。选 C、D。

- id: p3
  tier: medium
  statement: |
    设实数$a$、$b$使$f(z)=(x^2+ay^2)+ibxy$是整函数。求$a$、$b$（依次填写）。
  answer:
    type: tuple
    value: [-1, 2]
  hints:
    - |
      $u=x^2+ay^2$，$v=bxy$，偏导数处处连续。
    - |
      $u_x=v_y$给出$2x=bx$对一切$x$成立。
    - |
      $u_y=-v_x$给出$2ay=-by$对一切$y$成立。
  solution: |
    $u_x=2x$，$v_y=bx$，所以$b=2$；$u_y=2ay$，$-v_x=-by$，所以$2a=-b$，$a=-1$。这时$f(z)=x^2-y^2+2ixy=z^2$。

- id: p4
  tier: medium
  statement: |
    求$\cos z$在$z=i$处的导数，答案依次写实部、虚部。
  answer:
    type: tuple
    value: [0, -(exp(1)-exp(-1))/2]
  hints:
    - |
      $(\cos z)'=-\sin z$。
    - |
      $\sin(iy)=i\sinh y$。
    - |
      所以导数是$-\sin i=-i\sinh1$。
  solution: |
    $(\cos z)'=-\sin z$，在$z=i$处是$-\sin i=-i\sinh1$，而$\sinh1=\frac{e-e^{-1}}2\approx1.175$。实部$0$，虚部$-\sinh1\approx-1.175$。

- id: p5
  tier: hard
  statement: |
    设$f=u+iv$在区域（domain）$D$上全纯。

    （1）证明：如果$D$上处处$f'(z)=0$，那么$f$在$D$上是常数。

    （2）证明：如果$f$在$D$上只取实数值，那么$f$是常数。
  hints:
    - |
      （1）$f'=u_x+iv_x=0$给出$u_x=v_x=0$，再由柯西-黎曼方程得$u_y=v_y=0$。
    - |
      （1）在$D$里的一条线段$z_1+t(z_2-z_1)$上看$g(t)=u\bigl(z_1+t(z_2-z_1)\bigr)$。由可微的定义，$g'(t)=u_x\Delta x+u_y\Delta y$，其中$z_2-z_1=\Delta x+i\Delta y$。
    - |
      （2）$v\equiv0$，由柯西-黎曼方程，$u_x=v_y=0$，$v_x=0$，所以$f'=u_x+iv_x=0$。
  reference: |
    （1）$f'=u_x+iv_x=0$，所以$u_x=v_x=0$；由柯西-黎曼方程，$u_y=-v_x=0$，$v_y=u_x=0$，四个偏导数在$D$上处处为$0$。设线段$z_1+t(z_2-z_1)$（$0\le t\le1$）落在$D$里，$z_2-z_1=\Delta x+i\Delta y$，令$g(t)=u\bigl(z_1+t(z_2-z_1)\bigr)$。由$u$可微，$g(t+s)-g(t)=s(u_x\Delta x+u_y\Delta y)+o(s)$，所以$g'(t)=u_x\Delta x+u_y\Delta y=0$，$g$是常数，$u(z_1)=u(z_2)$。$D$是区域，任意两点都能用$D$里的折线连起来，沿折线一段一段地推，$u$在$D$上是常数；$v$同理。

    （2）$v\equiv0$，所以$v_x=v_y=0$，由柯西-黎曼方程$u_x=v_y=0$，于是$f'=u_x+iv_x=0$。由（1），$f$是常数。只取实数值的全纯函数是常数，说明全纯是很强的条件：实变量的「好」函数，到了复数里不能只取实数值。

- id: p6
  tier: hard
  statement: |
    设$f=u+iv$在区域$D$上全纯，并且$|f|$在$D$上是常数。证明$f$在$D$上是常数。
  hints:
    - |
      $u^2+v^2=c$是常数。$c=0$时$f\equiv0$。
    - |
      $c\ne0$时分别对$x$、$y$求偏导：$uu_x+vv_x=0$，$uu_y+vv_y=0$。
    - |
      用柯西-黎曼方程把$v_x$、$v_y$换成$-u_y$、$u_x$，得到关于$u_x$、$u_y$的方程组；第一式乘$u$、第二式乘$v$再相加，能消去$u_y$。
  reference: |
    设$u^2+v^2=c$。$c=0$时$f\equiv0$。$c\ne0$时，对$x$、$y$求偏导得$uu_x+vv_x=0$，$uu_y+vv_y=0$；由柯西-黎曼方程$v_x=-u_y$、$v_y=u_x$，变成

    $$uu_x-vu_y=0,\qquad vu_x+uu_y=0.$$

    第一式乘$u$、第二式乘$v$再相加，得$(u^2+v^2)u_x=0$；第一式乘$-v$、第二式乘$u$再相加，得$(u^2+v^2)u_y=0$。因为$u^2+v^2=c\ne0$，所以$u_x=u_y=0$，再由柯西-黎曼方程，$v_x=v_y=0$。于是$f'=0$，由第 5 题，$f$是常数。

- id: p7
  tier: thinking
  statement: |
    （1）$(u_x,v_x)$和$(u_y,v_y)$分别是$f$沿哪个方向的变化率？柯西-黎曼方程说它们之间是什么关系？

    （2）$\bar z$满足$u_x=-v_y$、$u_y=v_x$，而不满足柯西-黎曼方程。它的线性近似是怎样的变换？

    （3）为什么说「复可导」是「可微」加上「线性近似是旋转加伸缩」？
  hints:
    - |
      （1）$(u_x,v_x)$是$x$增加时$f$的变化率，把它看成复数$u_x+iv_x$。
    - |
      （1）柯西-黎曼方程等价于$u_y+iv_y=i(u_x+iv_x)$。
    - |
      （2）$\bar z$：$(u_x,v_x)=(1,0)$，$(u_y,v_y)=(0,-1)$。
  reference: |
    （1）$(u_x,v_x)$是沿实轴方向（$x$增加）的变化率，$(u_y,v_y)$是沿虚轴方向的变化率。柯西-黎曼方程等价于$u_y+iv_y=i(u_x+iv_x)$：沿虚轴的变化率等于沿实轴的变化率逆时针转$90^\circ$，两个方向的伸缩倍数一样。

    （2）$\bar z$的两个变化率是$(1,0)$和$(0,-1)$，后者是前者顺时针转$90^\circ$，线性近似是关于实轴的反射，改变了转向，所以不是乘以复数。

    （3）可微保证$f$在一点附近有线性近似；复可导要求这个线性近似恰好是乘以一个复数$f'(z_0)$，也就是旋转加伸缩，柯西-黎曼方程就是这个要求写成偏导数的样子。

- id: p8
  tier: thinking
  statement: |
    全纯要求在开集上处处复可导，不是只在一点。

    （1）$|z|^2$在$0$处复可导，它在$0$处全纯吗？

    （2）为什么要用开集来定义全纯？

    （3）有人说：「函数在一条直线上处处复可导，它在这条直线上就全纯。」对吗？
  hints:
    - |
      （1）全纯要在以$0$为圆心的某个开圆盘里处处复可导。
    - |
      （2）以后的结论，例如沿闭曲线积分为$0$、可以无穷次求导，要用到点周围一整块地方的信息。
    - |
      （3）回想例 1 的$x^2+iy^2$。
  reference: |
    （1）不全纯。$|z|^2$只在$0$处复可导，以$0$为圆心的任何开圆盘里都有它不可导的点。

    （2）全纯函数的那些强结论，比如沿闭曲线的积分为$0$、可以无穷次求导、能展开成幂级数，证明时都要在点的周围一整块地方用到可导性；只在零星的点上可导，什么也推不出来。

    （3）不对。例 1 的$f(z)=x^2+iy^2$在直线$y=x$上处处复可导，可它在任何点都不全纯：直线不是开集，直线上每一点周围的圆盘里都有不可导的点。
