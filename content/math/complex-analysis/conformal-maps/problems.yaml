- id: p1
  tier: easy
  statement: |
    设$f(z)=z^3$，$z_0=1+i$。经过$z_0$的曲线在$f$下，切向量的长度乘以几、方向转过多少弧度（取在$(-\pi,\pi]$里）？答案依次写这两个数。
  answer:
    type: tuple
    value: [6, pi/2]
  hints:
    - |
      切向量乘以$f'(z_0)$。
    - |
      $f'(z)=3z^2$，而$(1+i)^2=2i$。
    - |
      $6i$的模是$6$，辐角是$\frac\pi2$。
  solution: |
    $f'(z_0)=3(1+i)^2=6i$，切向量乘以$6i$：长度乘$6$，方向转过$\arg(6i)=\frac\pi2$。

- id: p2
  tier: easy
  statement: |
    下列函数中，在$z=0$处保角的有哪些？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $z^2+z$
      - |
        $\sin z$
      - |
        $z^3$
      - |
        $\bar z$
    value: [1, 2]
  hints:
    - |
      全纯、导数不为$0$的点处保角。
    - |
      分别求在$0$处的导数。
    - |
      $\bar z$不全纯，它把夹角的转向反过来。
  solution: |
    $(z^2+z)'=2z+1$在$0$处是$1$；$(\sin z)'=\cos z$在$0$处是$1$；$(z^3)'=3z^2$在$0$处是$0$，夹角放大成三倍；$\bar z$把转向反过来。选 A、B。

- id: p3
  tier: medium
  statement: |
    $z^3$把扇形$\{re^{i\theta}:0<r<2,\ 0<\theta<\frac\pi6\}$映成扇形$\{\rho e^{i\varphi}:0<\rho<R,\ 0<\varphi<\alpha\}$。求$R$、$\alpha$（依次填写）。
  answer:
    type: tuple
    value: [8, pi/2]
  hints:
    - |
      $re^{i\theta}$映成$r^3e^{3i\theta}$。
    - |
      模$r^3$取遍$(0,8)$。
    - |
      $3\cdot\frac\pi6\le2\pi$，映射是一一的。
  solution: |
    $re^{i\theta}$映成$r^3e^{3i\theta}$，模$r^3$取遍$(0,8)$，角$3\theta$取遍$\bigl(0,\frac\pi2\bigr)$。所以$R=8$，$\alpha=\frac\pi2$。

- id: p4
  tier: medium
  statement: |
    从$z_0=1$出发的两条射线$z_1(t)=1+t$、$z_2(t)=1+it$（$t\ge0$）夹角是$\frac\pi2$。在$f(z)=z^2-2z$下，它们的像是从$f(1)$出发的两条曲线。像的夹角是多少（弧度，取在$[0,\pi]$里）？
  answer:
    type: number
    value: pi
  hints:
    - |
      $f'(1)=0$，保角的定理不能用。
    - |
      配方：$f(z)=(z-1)^2-1$。
    - |
      分别写出$f(z_1(t))$、$f(z_2(t))$。
  solution: |
    $f(z)=(z-1)^2-1$，所以$f(1+t)=-1+t^2$，$f(1+it)=-1-t^2$。两条像都从$-1$出发，一条朝右、一条朝左，夹角是$\pi$，是原来的$\frac\pi2$的两倍：$f'(1)=0$，夹角放大一倍。

- id: p5
  tier: hard
  statement: |
    记半带形$H=\{x+iy:0<x<\pi,\ y>0\}$。

    （1）证明$\cos z$把$H$映到下半平面$\{w:\Im w<0\}$里。

    （2）$H$的三段边界：$x=0$（$y>0$）、$x=\pi$（$y>0$）、$y=0$（$0<x<\pi$）分别映成什么？

    （3）证明$\cos z$在$H$上是共形映射。
  hints:
    - |
      （1）由定义，$\cos(x+iy)=\cos x\cosh y-i\sin x\sinh y$。
    - |
      （2）$\cos(iy)=\cosh y$，$\cos(\pi+iy)=-\cosh y$。
    - |
      （3）$(\cos z)'=-\sin z$，$\sin z$只在$z=k\pi$处为$0$。
  reference: |
    （1）$e^{i(x+iy)}=e^{-y}e^{ix}$，$e^{-i(x+iy)}=e^ye^{-ix}$，相加除以$2$，实部是$\cos x\cosh y$，虚部是$-\sin x\sinh y$。$H$里$\sin x>0$、$\sinh y>0$，所以虚部为负。

    （2）$x=0$：$\cos(iy)=\cosh y$，取遍$(1,+\infty)$；$x=\pi$：$\cos(\pi+iy)=-\cosh y$，取遍$(-\infty,-1)$；$y=0$：$\cos x$取遍$(-1,1)$。三段合起来是实轴去掉$\pm1$，而$\pm1$是两个角$0$、$\pi$的像。

    （3）$\cos z$处处全纯，$(\cos z)'=-\sin z$。由[复变函数与映射](lesson:math.complex-analysis.complex-functions#thm-sin-modulus)里的$|\sin z|^2=\sin^2x+\sinh^2y$，$\sin z=0$只在$z=k\pi$处，这些点不在$H$里，所以$H$上导数处处不为$0$。还可以证明$\cos z$把$H$一一地映成整个下半平面，这里不要求。

- id: p6
  tier: hard
  statement: |
    设$f(z)=z^2(z-3)$。

    （1）对从原点出发、辐角为$\alpha$的射线$z(t)=te^{i\alpha}$（$t>0$），证明$t\to0^+$时$\frac{f(z(t))}{|f(z(t))|}\to-e^{2i\alpha}$。

    （2）由此说明：从原点出发的两条射线，像在原点处的夹角是原来的两倍。

    （3）除原点外，$f$还在哪个点不保角？那里的夹角怎样变？
  hints:
    - |
      （1）$f(te^{i\alpha})=t^2e^{2i\alpha}(te^{i\alpha}-3)$。
    - |
      （2）像从原点出发的方向，辐角是$\pi+2\alpha$。
    - |
      （3）$f'(z)=3z(z-2)$；在那一点附近也把$f$写成平方乘一个不为$0$的因子。
  reference: |
    （1）$f(te^{i\alpha})=t^2e^{2i\alpha}(te^{i\alpha}-3)$，所以$\frac{f}{|f|}=e^{2i\alpha}\cdot\frac{te^{i\alpha}-3}{|te^{i\alpha}-3|}$，$t\to0^+$时后一个因子趋于$\frac{-3}3=-1$。

    （2）像从原点出发的方向是$-e^{2i\alpha}$，辐角是$\pi+2\alpha$。两条射线的辐角差$\alpha_2-\alpha_1$变成$2(\alpha_2-\alpha_1)$，夹角是原来的两倍。

    （3）$f'(z)=3z^2-6z=3z(z-2)$，在$z=2$处也为$0$，$f(2)=-4$。$f(z)+4=z^3-3z^2+4=(z-2)^2(z+1)$，因子$z+1$在$2$处是$3\ne0$，照（1）的办法，从$2$出发、辐角为$\alpha$的射线的像，方向的辐角趋于$2\alpha$，夹角同样放大一倍。

- id: p7
  tier: thinking
  statement: |
    （1）$e^z$处处保角，可它把两条平行的竖线映成两个同心圆，「平行」不见了。这和保角矛盾吗？

    （2）共形映射把很小的正方形变成近似的正方形。很大的正方形呢？举一个例子。

    （3）设$f$在区域上全纯、一一、导数处处不为$0$，并且它的逆映射$g$连续。$g$也是共形映射吗？
  hints:
    - |
      （1）保角说的是曲线交点处的夹角。
    - |
      （2）看$z^2$把正方形$[1,2]\times[0,1]$的四条边映成什么。
    - |
      （3）看差商$\frac{g(w)-g(w_0)}{w-w_0}$，令$z=g(w)$。
  reference: |
    （1）不矛盾：两条平行线不相交，没有夹角可保，保角只说交点处的夹角。竖线和横线交成直角，它们的像，圆和从原点出发的射线，也交成直角。

    （2）大的不行。$z^2$把正方形$[1,2]\times[0,1]$的两条竖边映成抛物线$(1-y^2,2y)$、$(4-y^2,4y)$，下边映成线段$[1,4]$，上边映成抛物线$(x^2-1,2x)$。像的四个角仍是直角，四条边却弯了，各处放大的倍数$|2z|$也不一样。

    （3）是。设$w_0=f(z_0)$；$w\ne w_0$时，$z=g(w)\ne z_0$（$f$一一），$\frac{g(w)-g(w_0)}{w-w_0}=\frac{z-z_0}{f(z)-f(z_0)}$，$w\to w_0$时由$g$连续，$z\to z_0$，右边趋于$\frac1{f'(z_0)}$。所以$g$全纯，$g'(w_0)=\frac1{f'(z_0)}\ne0$，是共形映射。$g$的连续性其实可以证明是自动的，这里当作条件。

- id: p8
  tier: thinking
  statement: |
    （1）为什么说共形映射在$z_0$附近把面积放大约$|f'(z_0)|^2$倍？

    （2）$z^2$在$z_0=1+i$附近，半径为$0.01$的小圆盘的像，面积大约是多少？

    （3）在原点附近呢？
  hints:
    - |
      （1）局部线性近似：$f(z_0+h)\approx f(z_0)+f'(z_0)h$。
    - |
      （2）$|2z_0|=2\sqrt2$。
    - |
      （3）$z^2$把圆盘$|z|<r$映成什么？
  reference: |
    （1）$z_0$附近$f(z_0+h)\approx f(z_0)+f'(z_0)h$。乘以$f'(z_0)$是转一个角再伸缩$|f'(z_0)|$倍，转角不改变面积，所以半径为$r$的小圆盘大约变成半径为$|f'(z_0)|r$的圆盘，面积约乘$|f'(z_0)|^2$。

    （2）$|f'(z_0)|=|2(1+i)|=2\sqrt2$，面积约$8\cdot\pi\cdot0.01^2=8\pi\times10^{-4}\approx2.5\times10^{-3}$。

    （3）$z^2$把圆盘$|z|<r$映成圆盘$|w|<r^2$，每个点盖两遍，面积$\pi r^4$，比$\pi r^2$小得多。这和$|f'(0)|^2=0$对得上：导数为$0$的地方，小圆盘被压得比任何固定倍数都小。
