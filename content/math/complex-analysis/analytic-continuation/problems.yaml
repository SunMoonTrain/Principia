- id: p1
  tier: easy
  statement: |
    设$\Re z>0$时$F(z)=\int_0^{+\infty}e^{-zt}\,\dd t$（指$A\to+\infty$时$\int_0^Ae^{-zt}\,\dd t$的极限）。求$F$到$\C\setminus\{0\}$的解析延拓在$z=-4$处的值。
  answer:
    type: number
    value: -1/4
  hints:
    - |
      先算$\int_0^Ae^{-zt}\,\dd t$，再让$A\to+\infty$。
    - |
      $\int_0^Ae^{-zt}\,\dd t=\frac{1-e^{-zA}}z$，而$|e^{-zA}|=e^{-A\Re z}$。
    - |
      $\Re z>0$时$F(z)=\frac1z$；哪个函数在$\C\setminus\{0\}$上全纯、在右半平面上等于$F$？
  solution: |
    由[复指数的积分公式](lesson:math.complex-analysis.complex-exponential#thm-exp-derivative)，$\int_0^Ae^{-zt}\,\dd t=\frac{1-e^{-zA}}z$。$\Re z>0$时$|e^{-zA}|=e^{-A\Re z}\to0$，所以$F(z)=\frac1z$。$\frac1z$在区域$\C\setminus\{0\}$上全纯，在右半平面上等于$F$，所以它就是$F$到$\C\setminus\{0\}$的解析延拓，在$z=-4$处的值是$-\frac14$。这时积分本身发散：$\int_0^Ae^{4t}\,\dd t=\frac{e^{4A}-1}4\to+\infty$。

- id: p2
  tier: easy
  statement: |
    下列说法中，哪些是对的？
  answer:
    type: choice
    multiple: true
    options:
      - |
        设$F$在$\C\setminus\{-2\}$上全纯，并且对区间$(0,1)$里的每个实数$x$，$F(x)=\frac1{x+2}$，那么对一切$z\ne-2$，$F(z)=\frac1{z+2}$
      - |
        $\sum_{n=0}^\infty\frac{z^n}{3^n}$的和函数在$z=-1$处的泰勒级数，收敛半径是$2$
      - |
        $\frac1{(1-z)^2}$是$\sum_{n=0}^\infty(n+1)z^n$（$|z|<1$）到$\C\setminus\{1\}$的解析延拓
      - |
        $\Log(1+z)$是$\sum_{n=1}^\infty\frac{(-1)^{n+1}z^n}n$（$|z|<1$）到$\C\setminus\{-1\}$的解析延拓
    value: [1, 3]
  hints:
    - |
      解析延拓要在整个大区域上全纯，并且在原来的区域上等于原来的函数。
    - |
      A：区间$(0,1)$里有一列互不相同、收敛到$\frac12$的点；B：先求和函数，再找离$-1$最近的、它不全纯的点。
    - |
      C：对$\sum_{n=0}^\infty z^n=\frac1{1-z}$逐项求导；D：$z<-1$时$1+z$落在哪里，$\Log$在那里连续吗？
  solution: |
    A 对：$\C\setminus\{-2\}$是区域，$F$和$\frac1{z+2}$都在上面全纯，在区间$(0,1)$里一列互不相同、收敛到$\frac12$的点上相等，由唯一性定理处处相等。

    B 错：$|z|<3$时和函数是$\frac1{1-z/3}=\frac3{3-z}$，它只在$3$处不全纯，$z\to3$时模趋于$+\infty$，由[收敛半径和最近的不全纯点](lesson:math.complex-analysis.power-series#thm-radius-nearest)的定理，在$-1$处的泰勒级数的收敛半径是$|3-(-1)|=4$。$2$只是这一节的定理给的下界$3-|-1|$。

    C 对：由[逐项求导的定理](lesson:math.complex-analysis.complex-power-series#thm-termwise-complex)，$|z|<1$时$\sum_{n=0}^\infty(n+1)z^n$是$\sum_{n=0}^\infty z^n=\frac1{1-z}$逐项求导得到的级数，和是$\bigl(\frac1{1-z}\bigr)'=\frac1{(1-z)^2}$；它在区域$\C\setminus\{1\}$上全纯，所以是这个级数的和到$\C\setminus\{1\}$的解析延拓。

    D 错：在$|z|<1$里这个级数的和确实是$\Log(1+z)$（把例 1 里的$z$换成$-z$），可$z<-1$时$1+z$在负实轴上，$\Log(1+z)$在那里不连续，在$\C\setminus\{-1\}$上不全纯。照例 1 的办法，它是这个级数的和到$\C\setminus(-\infty,-1]$的解析延拓。

    选 A、C。

- id: p3
  tier: medium
  statement: |
    设$|z|<2$时$f(z)=\sum_{n=0}^\infty\frac{(-1)^nz^{2n}}{4^n}$。把$f$在$z=1$处展开成泰勒级数，求这个新级数的收敛半径，以及它在$z=3$处的和，依次填写。
  answer:
    type: tuple
    value: [sqrt(5), 4/13]
  hints:
    - |
      先求出$f$的和，看它延拓以后在哪些点不全纯。
    - |
      $f(z)=\frac4{4+z^2}$，它只在$\pm2i$处不全纯。
    - |
      新的收敛半径是$1$到$\pm2i$的距离；$3$在新的收敛圆盘里，新级数在那里的和等于哪个函数的值？
  solution: |
    $|z|<2$时$\bigl|-\frac{z^2}4\bigr|<1$，由等比级数，$f(z)=\frac1{1+z^2/4}=\frac4{4+z^2}$。$g(z)=\frac4{4+z^2}$只在$\pm2i$处不全纯，$z\to\pm2i$时$|g(z)|\to+\infty$，$\pm2i$到$1$的距离都是$\sqrt5$；$g$在$1$附近等于$f$，两者在$1$处的泰勒级数相同，由[收敛半径和最近的不全纯点](lesson:math.complex-analysis.power-series#thm-radius-nearest)的定理，收敛半径是$\sqrt5$。$|3-1|=2<\sqrt5$，$g$在圆盘$|z-1|<\sqrt5$上全纯，由[泰勒展开的定理](lesson:math.complex-analysis.power-series#thm-taylor)在那里等于它在$1$处的泰勒级数，所以新级数在$3$处的和是$g(3)=\frac4{13}$。$3$在原来的收敛圆盘外面，重新展开把$f$延拓到了那里。

- id: p4
  tier: medium
  statement: |
    设$|z|<1$时$f(z)=\sum_{n=1}^\infty\frac{z^n}n$。从$z=\frac12$出发，沿圆周$|z-1|=\frac12$逆时针走一圈回到$\frac12$，把$f$沿这条曲线解析延拓。求延拓回来的函数在$\frac12$处的值，依次填写实部、虚部。
  answer:
    type: tuple
    value: [log(2), -2*pi]
  hints:
    - |
      由例 1，$\frac12$附近$f(z)=-\Log(1-z)$；沿曲线延拓时，照例 2 的办法，把$\Log(1-z)$换成随$z$连续变化的$\log(1-z)$。
    - |
      曲线是$z=1+\frac12e^{it}$，$t$从$\pi$走到$3\pi$，这时$1-z=\frac12e^{i(t-\pi)}$。
    - |
      $1-z$绕原点逆时针转了一圈，它的辐角从$0$连续地增加到$2\pi$。
  solution: |
    由例 1，$\frac12$附近$f(z)=-\Log(1-z)$。曲线是$z=1+\frac12e^{it}$（$t$从$\pi$到$3\pi$），$1-z=\frac12e^{i(t-\pi)}$，也就是说$1-z$绕原点逆时针走一圈，辐角$t-\pi$从$0$连续地增加到$2\pi$。照例 2 的办法，沿曲线取一串不含$1$的小圆盘，在每个圆盘里取$\log(1-z)$的分支、让辐角接得上，延拓所得的是$-\log(1-z)$，其中的辐角随$t$连续变化。回到$\frac12$时$\log(1-z)=\ln\frac12+2\pi i$，所以值是$\ln2-2\pi i$：实部是$\ln2$，虚部是$-2\pi$。

- id: p5
  tier: hard
  statement: |
    设$f_k$是$f_0$沿曲线$\gamma$的解析延拓，开圆盘$\Delta_j$和函数$f_j$（$j=0,1,\dots,k$）照这一节的定义。

    （1）设在$\Delta_0$上$f_0(z)^2=z$。证明：对每个$j$，在$\Delta_j$上$f_j(z)^2=z$。

    （2）在（1）里，设$\gamma$是闭曲线，$\Delta_k=\Delta_0$。证明：在$\Delta_0$上$f_k=f_0$，或者$f_k=-f_0$。

    （3）把条件$f_0(z)^2=z$换成$e^{f_0(z)}=z$，（1）（2）的结论应当怎样改？
  hints:
    - |
      （1）对$j$归纳：$f_j^2-z$在$\Delta_j$上全纯，在$\Delta_{j-1}\cap\Delta_j$上为$0$。
    - |
      （2）先说明$\Delta_0$不含$0$（对$f_0^2=z$求导），于是$f_0$在$\Delta_0$上不为$0$；再看$\frac{f_k}{f_0}$的平方。
    - |
      （2）$\frac{f_k}{f_0}$连续、只取$\pm1$，照[复对数与幂函数](lesson:math.complex-analysis.complex-logarithm)一节第 8 题，沿线段用介值定理（intermediate value theorem）。（3）看$f_k-f_0$。
  reference: |
    （1）$j=0$时就是条件。设在$\Delta_{j-1}$上$f_{j-1}^2=z$。$h=f_j^2-z$在$\Delta_j$上全纯；在非空的开集$\Delta_{j-1}\cap\Delta_j$上$f_j=f_{j-1}$，所以$h=0$。在这个开集里取一列互不相同、收敛到其中一点的点，由唯一性定理，$h$在$\Delta_j$上恒为$0$。

    （2）由（1），在$\Delta_0$上$f_k^2=z=f_0^2$。假如$0\in\Delta_0$，由$f_0(0)^2=0$得$f_0(0)=0$，可对$f_0^2=z$求导得$2f_0f_0'=1$，在$0$处左边是$0$，矛盾；所以$\Delta_0$不含$0$，$f_0$在$\Delta_0$上不为$0$。$u=\frac{f_k}{f_0}$在$\Delta_0$上连续，$u^2=1$，只取$1$和$-1$；$\Delta_0$里任两点用线段连起来，$\Re u$沿线段连续、只取$\pm1$，由介值定理是常数。所以$u$在$\Delta_0$上是常数，$f_k=f_0$或$f_k=-f_0$，例 2 是后一种。

    （3）同（1），每个$f_j$都满足$e^{f_j(z)}=z$。在$\Delta_0$上$e^{f_k-f_0}=1$，所以$\frac{f_k-f_0}{2\pi i}$连续、只取整数，同（2）是常数：$f_k=f_0+2m\pi i$，$m$是某个整数。沿单位圆周逆时针走一圈时$m=1$，见复对数与幂函数一节第 7 题。

- id: p6
  tier: hard
  statement: |
    设$f(z)=\sum_{n=0}^\infty z^{2^n}=z+z^2+z^4+z^8+\cdots$。

    （1）求这个幂级数的收敛半径。

    （2）设$k$是非负整数，$\zeta^{2^k}=1$。证明：$r$从小于$1$的一侧趋于$1$时，$|f(r\zeta)|\to+\infty$。

    （3）证明：$f$不能解析延拓到任何比$|z|<1$大的区域。这时单位圆周叫作$f$的自然边界（natural boundary）。
  hints:
    - |
      （1）$|z|\ge1$时通项的模不趋于$0$。（2）$n\ge k$时$\zeta^{2^n}=1$。
    - |
      （2）$f(r\zeta)$是前$k$项（模不超过$k$）加上$\sum_{n\ge k}r^{2^n}$；对每个$N\ge k$，后一个和不小于$\sum_{n=k}^Nr^{2^n}$，$r\to1$时这个有限和趋于$N-k+1$。
    - |
      （3）比$|z|<1$大的区域含单位圆周上的一点$p$（从$0$出发，沿折线连到区域里单位圆盘外的一点，用介值定理）；$p$附近有满足$\zeta^{2^k}=1$的点$\zeta$。
  reference: |
    （1）$|z|<1$时$\sum|z|^{2^n}\le\sum_{m\ge1}|z|^m$，收敛；$|z|\ge1$时$|z^{2^n}|\ge1$，通项不趋于$0$，级数发散。所以收敛半径是$1$。

    （2）$n\ge k$时$\zeta^{2^n}=\bigl(\zeta^{2^k}\bigr)^{2^{n-k}}=1$，所以$0<r<1$时$f(r\zeta)=\sum_{n=0}^{k-1}(r\zeta)^{2^n}+\sum_{n\ge k}r^{2^n}$，前一个和的模不超过$k$。任取$N\ge k$，后一个和不小于$\sum_{n=k}^Nr^{2^n}$，这个有限和在$r\to1$时趋于$N-k+1$；$N$任意，所以后一个和趋于$+\infty$，$|f(r\zeta)|\ge\sum_{n\ge k}r^{2^n}-k\to+\infty$。

    （3）设$F$是$f$到区域$D_2$的解析延拓，$D_2$含单位圆盘$\Delta$，又有一点$q\notin\Delta$。用$D_2$里的折线$\sigma(s)$（$0\le s\le1$）从$0$连到$q$，$|\sigma(s)|$连续，从$0$变到$|q|\ge1$，由介值定理有$s$使$|\sigma(s)|=1$，这一点$p$在$D_2$里。$D_2$是开集，有以$p$为圆心、半径为$\delta$的开圆盘含在$D_2$里；取$k$使$\frac{2\pi}{2^k}<\delta$，点$e^{2\pi ij/2^k}$（$j=0,1,\dots,2^k-1$）把单位圆周分成长$\frac{2\pi}{2^k}$的弧，其中有一点$\zeta$到$p$的距离小于$\delta$，$\zeta\in D_2$。$F$在$\zeta$处连续，在$\zeta$附近有界；可$r\to1$时$r\zeta$在$\Delta$里趋于$\zeta$，$F(r\zeta)=f(r\zeta)$，由（2）模趋于$+\infty$，矛盾。

- id: p7
  tier: thinking
  statement: |
    延拓时对函数要求得越多，结果越确定。

    （1）在$x\le0$时等于$0$、在整个实轴上无穷次可导的函数有多少个？可以用[零点的孤立性与唯一性定理](lesson:math.complex-analysis.identity-theorem)一节的$\varphi$。

    （2）实轴上的连续函数，由它在全体有理数上的值决定吗？由它在点$\frac1n$（$n=1,2,\dots$）上的值决定吗？

    （3）区域上的全纯函数，只要知道它在一列互不相同、收敛到区域里一点的点上的值，就整个定下来了。和（1）（2）比，差别出在哪里？
  hints:
    - |
      （1）试试$c\varphi(x)$，$c$是常数。
    - |
      （2）每个实数都是有理数列的极限；在点$\frac1n$之间，连续函数可以随意起伏，比如$x\sin\frac\pi x$。
    - |
      （3）全纯函数在一点附近等于它的泰勒级数，泰勒系数又由一列互不相同、收敛到这一点的点上的值决定；$\varphi$在$0$处的泰勒级数是$0$，却不等于$\varphi$。
  reference: |
    （1）无穷多个：$\varphi$在$x>0$时取$e^{-1/x}$、$x\le0$时取$0$，对任意实数$c$，$c\varphi(x)$都满足条件。$x\le0$上的值完全定不下$x>0$上的值。

    （2）有理数上的值决定连续函数：每个实数$x$是某个有理数列$q_m$的极限，$h(x)=\lim h(q_m)$；数学分析[用幂级数定义指数函数与对数](lesson:math.analysis.exp-log-construction)一节把乘方从有理数推到无理数，靠的就是这件事。点$\frac1n$上的值定不下：$h(x)=x\sin\frac\pi x$（$h(0)=0$）连续，在每个$\frac1n$处都是$0$，却在$\frac2{2m+1}$处不为$0$。连无穷次可导也不够：$e^{-1/x^2}\sin\frac\pi x$（在$0$处补上$0$）可以验证无穷次可导，在$\frac1n$处也都是$0$，却不恒为$0$。

    （3）由唯一性定理，区域上的全纯函数在一列互不相同、收敛到区域里一点$a$的点上的值，决定它在整个区域上的值。原因是全纯函数在$a$附近等于它的泰勒级数，而泰勒系数可以由点列上的值一个个求出来：先由连续性得$f(a)$，再由差商的极限得$f'(a)$，依此类推；再由区域连成一片推到整个区域。无穷次可导的实函数在一点的泰勒级数未必等于它本身（$\varphi$在$0$处），连续函数更只受稠密的点集约束。所以解析延拓唯一，光滑的延拓、连续的延拓都不唯一。

- id: p8
  tier: thinking
  statement: |
    （1）$\sum_{n=0}^\infty z^n$在$z=2$处收敛吗？它的和函数到$\C\setminus\{1\}$的解析延拓在$z=2$处的值是多少？

    （2）有人据此写「$1+2+4+8+\cdots=-1$」。这个等式在什么意义下没有道理，在什么意义下又有一点道理？

    （3）要是改用别的办法，比如从$0$出发，沿一串不含$1$的圆盘一步步重新展开到$2$，会不会得到别的值？这和例 2 里$\sqrt z$绕一圈变号有什么不同？
  hints:
    - |
      （1）通项$2^n$不趋于$0$；延拓是$\frac1{1-z}$。
    - |
      （2）级数的和要求部分和收敛；$-1$是延拓给出的值，而延拓是唯一的。
    - |
      （3）用第 5 题（1）的办法，逐个圆盘比较$f_j$和$\frac1{1-z}$。
  reference: |
    （1）不收敛，通项$2^n$不趋于$0$。和函数到$\C\setminus\{1\}$的解析延拓是$\frac1{1-z}$，在$2$处是$-1$。

    （2）当作级数的和，等式没有道理：部分和$2^{N+1}-1\to+\infty$，各项都是正数，「和」却是负数。可$-1$也不是随便凑的：和函数在$|z|<1$上的解析延拓只有一个，不管用什么式子找到它，在$2$处都得$-1$；在这个意义上，可以说延拓给这个发散级数指定了一个值。有时被写成「$1+2+3+\cdots=-\frac1{12}$」的式子也是这个意思：黎曼$\zeta$函数延拓以后$\zeta(-1)=-\frac1{12}$，这里不证。

    （3）不会。设$\Delta_0$是$0$附近的圆盘，$f_0=\frac1{1-z}$；若$f_{j-1}$在$\Delta_{j-1}$上等于$\frac1{1-z}$，则$f_j$和$\frac1{1-z}$都在$\Delta_j$上全纯（$\Delta_j$不含$1$），在$\Delta_{j-1}\cap\Delta_j$上相等，由唯一性定理在$\Delta_j$上相等。所以走哪条路，到$2$都得$-1$。和$\sqrt z$不同：$\frac1{1-z}$本身是整个$\C\setminus\{1\}$上的一个全纯函数，每一步延拓都只能是它；去掉原点的平面上却没有连续的$\sqrt z$（复数的$n$次方根一节第 7 题），延拓的结果才会随路变。
