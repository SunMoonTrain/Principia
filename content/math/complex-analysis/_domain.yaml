id: math.complex-analysis
title: |
  复分析
proofPolicy: full
macros:
  \C: |
    \mathbb{C}
  \R: |
    \mathbb{R}
  \Re: |
    \operatorname{Re}
  \Im: |
    \operatorname{Im}
  \Res: |
    \operatorname*{Res}
  \Arg: |
    \operatorname{Arg}
  \Log: |
    \operatorname{Log}
  \dd: |
    \mathop{}\!\mathrm{d}
  \lap: |
    \nabla^2
glossary:
  - id: math.complex-analysis.complex-number
    zh: |
      复数
    en: |
      complex number
    brief: |
      形如$a+bi$的数，$a$、$b$是实数，$i^2=-1$；按多项式的规矩运算，遇到$i^2$就换成$-1$。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-complex-number
  - id: math.complex-analysis.real-part
    zh: |
      实部
    en: |
      real part
    brief: |
      复数$z=a+bi$里的实数$a$，记作$\Re z$；$\Re z=\frac{z+\bar z}2$。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-complex-number
  - id: math.complex-analysis.imaginary-part
    zh: |
      虚部
    en: |
      imaginary part
    brief: |
      复数$z=a+bi$里的实数$b$（不带$i$），记作$\Im z$；$\Im z=\frac{z-\bar z}{2i}$。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-complex-number
  - id: math.complex-analysis.purely-imaginary
    zh: |
      纯虚数
    en: |
      purely imaginary number
    brief: |
      实部为$0$、虚部不为$0$的复数，如$2i$、$-i$；$0$不算纯虚数。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-complex-number
  - id: math.complex-analysis.conjugate
    zh: |
      共轭复数
    en: |
      complex conjugate
    brief: |
      $z=a+bi$的共轭复数是$\bar z=a-bi$，即$z$关于实轴的对称点；$z\bar z=|z|^2$。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-conjugate
  - id: math.complex-analysis.complex-plane
    zh: |
      复平面
    en: |
      complex plane
    brief: |
      把复数$a+bi$画成点$(a,b)$的平面，横轴是实轴，纵轴是虚轴；复数相加就是向量相加。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-complex-plane
  - id: math.complex-analysis.real-axis
    zh: |
      实轴
    en: |
      real axis
    brief: |
      复平面的横轴，上面的点就是实数；正实轴、负实轴是它在原点两侧的两半。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-complex-plane
  - id: math.complex-analysis.imaginary-axis
    zh: |
      虚轴
    en: |
      imaginary axis
    brief: |
      复平面的纵轴，上面的点是$yi$（$y$是实数），也就是$0$和纯虚数。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-complex-plane
  - id: math.complex-analysis.modulus
    zh: |
      模
    en: |
      modulus
    brief: |
      复数$z=a+bi$到原点的距离$|z|=\sqrt{a^2+b^2}$；$|z|^2=z\bar z$，$|zw|=|z||w|$。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-complex-plane
  - id: math.complex-analysis.triangle-inequality
    zh: |
      三角不等式
    en: |
      triangle inequality
    brief: |
      对复数$z$、$w$，$|z+w|\le|z|+|w|$：三角形的一边不超过另两边之和。
    definedIn: math.complex-analysis.complex-numbers
    anchor: thm-triangle-inequality
  - id: math.complex-analysis.argument
    zh: |
      辐角
    en: |
      argument
    brief: |
      从正实轴转到非零复数$z$所在射线的角（逆时针为正），记作$\arg z$，可以差$2\pi$的整数倍。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-argument
  - id: math.complex-analysis.principal-argument
    zh: |
      辐角主值
    en: |
      principal argument
    brief: |
      落在$(-\pi,\pi]$里的那个辐角，记作$\Arg z$，如$\Arg(-1)=\pi$；高中课本取的是$[0,2\pi)$。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-argument
  - id: math.complex-analysis.trigonometric-form
    zh: |
      三角形式
    en: |
      trigonometric form
    brief: |
      把非零复数写成$r(\cos\theta+i\sin\theta)$，$r$是模，$\theta$是辐角；两数相乘时模相乘、辐角相加。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-argument
  - id: math.complex-analysis.exponential-form
    zh: |
      指数形式
    en: |
      exponential form
    brief: |
      记$e^{i\theta}=\cos\theta+i\sin\theta$，把非零复数写成$re^{i\theta}$；$e^{i\alpha}e^{i\beta}=e^{i(\alpha+\beta)}$。
    definedIn: math.complex-analysis.complex-numbers
    anchor: def-exponential-form
  - id: math.complex-analysis.complex-series
    zh: |
      复数项级数
    en: |
      series of complex numbers
    brief: |
      各项是复数的级数$\sum z_n$；实部、虚部组成的两个级数都收敛才算收敛，$\sum|z_n|$收敛时它一定收敛。
    definedIn: math.complex-analysis.complex-exponential
    anchor: def-complex-series
  - id: math.complex-analysis.euler-formula
    zh: |
      欧拉公式
    en: |
      Euler's formula
    brief: |
      对实数$\theta$，$e^{i\theta}=\cos\theta+i\sin\theta$：$e^x$的泰勒级数在$x=i\theta$处的和；如$e^{i\pi}=-1$。
    definedIn: math.complex-analysis.complex-exponential
    anchor: thm-euler
  - id: math.complex-analysis.complex-exponential
    zh: |
      复指数函数
    en: |
      complex exponential function
    brief: |
      $e^{x+iy}=e^x(\cos y+i\sin y)$；满足$e^{z+w}=e^ze^w$，永不为$0$，以$2\pi i$为周期。
    definedIn: math.complex-analysis.complex-exponential
    anchor: def-complex-exp
  - id: math.complex-analysis.complex-valued-function
    zh: |
      复值函数
    en: |
      complex-valued function
    brief: |
      实变量$t$的函数$g(t)=u(t)+iv(t)$；求导、积分对实部、虚部分别做，如$(e^{\lambda t})'=\lambda e^{\lambda t}$。
    definedIn: math.complex-analysis.complex-exponential
    anchor: def-complex-valued-function
  - id: math.complex-analysis.de-moivre-formula
    zh: |
      棣莫弗公式
    en: |
      de Moivre's formula
    brief: |
      对整数$n$，$(\cos\theta+i\sin\theta)^n=\cos n\theta+i\sin n\theta$，即$(e^{i\theta})^n=e^{in\theta}$。
    definedIn: math.complex-analysis.complex-roots
    anchor: thm-de-moivre
  - id: math.complex-analysis.nth-root
    zh: |
      $n$次方根
    en: |
      nth root
    brief: |
      满足$z^n=w$的复数$z$；$w\ne0$时恰有$n$个，排成以原点为圆心的圆的内接正$n$边形。
    definedIn: math.complex-analysis.complex-roots
    anchor: def-nth-root
  - id: math.complex-analysis.root-of-unity
    zh: |
      单位根
    en: |
      root of unity
    brief: |
      $1$的$n$次方根$e^{2k\pi i/n}$，$k=0,1,\dots,n-1$；在单位圆上均匀分布，$n\ge2$时和为$0$。
    definedIn: math.complex-analysis.complex-roots
    anchor: def-root-of-unity
  - id: math.complex-analysis.complex-function
    zh: |
      复变函数
    en: |
      function of a complex variable
    brief: |
      对复数集合$D$里的每个$z$，有唯一的复数$w=f(z)$和它对应；写成$u(x,y)+iv(x,y)$，是平面到平面的映射。
    definedIn: math.complex-analysis.complex-functions
    anchor: def-complex-function
  - id: math.complex-analysis.open-set
    zh: |
      开集
    en: |
      open set
    brief: |
      复平面上的集合$D$，其中每一点都有一个以它为圆心的开圆盘整个含在$D$里，例如$\{z:|z|<1\}$。
    definedIn: math.complex-analysis.complex-derivative
    anchor: def-open-set
  - id: math.complex-analysis.open-disc
    zh: |
      开圆盘
    en: |
      open disc
    brief: |
      以$z_0$为圆心、$r$为半径的开圆盘是$\{z:|z-z_0|<r\}$，不含边上的圆周。
    definedIn: math.complex-analysis.complex-derivative
    anchor: def-open-set
  - id: math.complex-analysis.domain
    zh: |
      区域
    en: |
      domain
    brief: |
      连成一片的开集：其中任意两点都能用一条落在里面的折线连起来，例如去掉原点的平面。
    definedIn: math.complex-analysis.complex-derivative
    anchor: def-open-set
  - id: math.complex-analysis.complex-derivative
    zh: |
      复导数
    en: |
      complex derivative
    brief: |
      $f'(z_0)=\lim_{h\to0}\frac{f(z_0+h)-f(z_0)}h$，$h$取复数，不管怎样趋于$0$，差商都趋于这个数；有这个极限就说复可导。
    definedIn: math.complex-analysis.complex-derivative
    anchor: def-complex-derivative
  - id: math.complex-analysis.contour-integral
    zh: |
      复积分
    en: |
      contour integral
    brief: |
      沿曲线$C$：$z(t)$（$a\le t\le b$）的积分$\int_Cf(z)\dd z=\int_a^bf(z(t))z'(t)\dd t$；方向反过来，积分变号。
    definedIn: math.complex-analysis.contour-integrals
    anchor: def-contour-integral
  - id: math.complex-analysis.ml-inequality
    zh: |
      ML 不等式
    en: |
      ML inequality
    brief: |
      在长为$L$的曲线$C$上处处$|f|\le M$时，$\bigl|\int_Cf(z)\dd z\bigr|\le ML$：最大模乘长度。
    definedIn: math.complex-analysis.contour-integrals
    anchor: thm-ml-inequality
  - id: math.complex-analysis.cauchy-riemann-equations
    zh: |
      柯西-黎曼方程
    en: |
      Cauchy-Riemann equations
    brief: |
      $u_x=v_y$，$u_y=-v_x$；$f=u+iv$复可导当且仅当$u$、$v$可微并满足它们，这时$f'=u_x+iv_x$。
    definedIn: math.complex-analysis.holomorphic
    anchor: thm-cauchy-riemann
  - id: math.complex-analysis.holomorphic-function
    zh: |
      全纯函数
    en: |
      holomorphic function
    brief: |
      在开集的每一点都复可导的函数，如多项式、$e^z$；只在零星的点上复可导（如$|z|^2$在$0$处）不算全纯。
    definedIn: math.complex-analysis.holomorphic
    anchor: def-holomorphic
  - id: math.complex-analysis.cauchy-theorem
    zh: |
      柯西积分定理
    en: |
      Cauchy's integral theorem
    brief: |
      $f$在简单闭曲线$C$和它围成的部分上全纯时（这里要求$f'$连续，以后去掉），$\oint_Cf(z)\dd z=0$；由它，积分路径可以在全纯的范围里变形。
    definedIn: math.complex-analysis.cauchy-theorem
    anchor: thm-cauchy
  - id: math.complex-analysis.goursat-theorem
    zh: |
      古尔萨定理
    en: |
      Goursat's theorem
    brief: |
      $f$在开集上全纯时，沿其中任何三角形（连同内部在开集里）的边界积分为$0$，不必假设$f'$连续。
    definedIn: math.complex-analysis.goursat
    anchor: thm-goursat
  - id: math.complex-analysis.antiderivative
    zh: |
      原函数
    en: |
      antiderivative
    brief: |
      开集上满足$F'=f$的全纯函数$F$；有了它，$\int_Cf\dd z$等于$F$在终点的值减去在起点的值。$\frac1z$在去掉原点的平面上没有原函数。
    definedIn: math.complex-analysis.cauchy-theorem
    anchor: def-antiderivative
  - id: math.complex-analysis.entire-function
    zh: |
      整函数
    en: |
      entire function
    brief: |
      在整个复平面上全纯的函数，如多项式、$e^z$、$\sin z$、$\cos z$。
    definedIn: math.complex-analysis.holomorphic
    anchor: def-holomorphic
  - id: math.complex-analysis.complex-logarithm
    zh: |
      复对数
    en: |
      complex logarithm
    brief: |
      满足$e^w=z$的复数$w$（$z\ne0$），记作$\log z$；$\log z=\ln|z|+i\arg z$，有无穷多个值，两两相差$2\pi i$的整数倍。
    definedIn: math.complex-analysis.complex-logarithm
    anchor: def-complex-log
  - id: math.complex-analysis.principal-logarithm
    zh: |
      对数主值
    en: |
      principal logarithm
    brief: |
      取辐角主值的那个复对数$\Log z=\ln|z|+i\Arg z$，虚部在$(-\pi,\pi]$里；在去掉负实轴的平面上全纯，导数是$\frac1z$。
    definedIn: math.complex-analysis.complex-logarithm
    anchor: def-principal-log
  - id: math.complex-analysis.branch
    zh: |
      分支
    en: |
      branch
    brief: |
      区域$G$上满足$e^{F(z)}=z$的连续函数$F$，即从多值的$\log z$里连续地挑出的一个值，例如去掉负实轴的平面上的$\Log z$。
    definedIn: math.complex-analysis.complex-logarithm
    anchor: def-branch
  - id: math.complex-analysis.branch-cut
    zh: |
      支割线
    en: |
      branch cut
    brief: |
      为了得到分支而从平面上去掉的曲线，例如$\Log z$的支割线是负实轴；从它的两侧趋近，分支的值不同。
    definedIn: math.complex-analysis.complex-logarithm
    anchor: def-branch
  - id: math.complex-analysis.power-function
    zh: |
      幂函数
    en: |
      power function
    brief: |
      $z\mapsto z^a=e^{a\log z}$（$z\ne0$）；$a$是整数时只有一个值，$a=\frac pq$时有$q$个，$a$是无理数或不是实数时有无穷多个；主值是$e^{a\Log z}$。
    definedIn: math.complex-analysis.complex-logarithm
    anchor: def-power
  - id: math.complex-analysis.conformal-map
    zh: |
      共形映射
    en: |
      conformal map
    brief: |
      区域上全纯、导数处处不为$0$的函数，也叫保角映射；它在每一点保持曲线夹角的大小和转向，小处的形状不变。
    definedIn: math.complex-analysis.conformal-maps
    anchor: def-conformal
  - id: math.complex-analysis.disc-of-convergence
    zh: |
      收敛圆盘
    en: |
      disc of convergence
    brief: |
      复幂级数$\sum a_n(z-a)^n$在圆盘$|z-a|<R$里绝对收敛、在圆盘外发散，这个圆盘叫收敛圆盘，$R=\frac1{\limsup\sqrt[n]{|a_n|}}$；圆周上收敛不收敛要逐点看。
    definedIn: math.complex-analysis.complex-power-series
    anchor: def-disc-of-convergence
  - id: math.complex-analysis.extended-complex-plane
    zh: |
      扩充复平面
    en: |
      extended complex plane
    brief: |
      复平面添上一个点$\infty$得到的$\C\cup\{\infty\}$；$z\to\infty$指$|z|\to+\infty$，直线可以看成经过$\infty$的圆。
    definedIn: math.complex-analysis.mobius
    anchor: def-extended-plane
  - id: math.complex-analysis.mobius-transformation
    zh: |
      分式线性变换
    en: |
      Möbius transformation
    brief: |
      $T(z)=\frac{az+b}{cz+d}$，$ad-bc\ne0$，也叫默比乌斯变换；它是扩充复平面上的一一映射，把圆或直线映成圆或直线，由三个点的像唯一确定。
    definedIn: math.complex-analysis.mobius
    anchor: def-mobius
  - id: math.complex-analysis.cross-ratio
    zh: |
      交比
    en: |
      cross-ratio
    brief: |
      $(z,z_1,z_2,z_3)=\frac{(z-z_1)(z_2-z_3)}{(z-z_3)(z_2-z_1)}$；作为$z$的函数，它是把$z_1$、$z_2$、$z_3$映成$0$、$1$、$\infty$的分式线性变换。
    definedIn: math.complex-analysis.mobius
    anchor: def-cross-ratio
  - id: math.complex-analysis.cauchy-integral-formula
    zh: |
      柯西积分公式
    en: |
      Cauchy's integral formula
    brief: |
      $f$在以$a$为圆心的开圆盘上全纯，$C_r$是其中的圆周$|\zeta-a|=r$，则对圆内的$z$，$f(z)=\frac1{2\pi i}\oint_{C_r}\frac{f(\zeta)}{\zeta-z}\dd\zeta$：圆内的值由圆周上的值决定。
    definedIn: math.complex-analysis.cauchy-integral-formula
    anchor: thm-cauchy-formula
  - id: math.complex-analysis.morera-theorem
    zh: |
      莫雷拉定理
    en: |
      Morera's theorem
    brief: |
      $f$在开集$D$上连续，并且沿$D$里每个三角形（连同内部在$D$里）的边界积分为$0$，则$f$在$D$上全纯；它是古尔萨定理倒过来的说法。
    definedIn: math.complex-analysis.higher-derivatives
    anchor: thm-morera
  - id: math.complex-analysis.higher-derivative-formula
    zh: |
      高阶导数公式
    en: |
      Cauchy's integral formula for derivatives
    brief: |
      $f$在以$a$为圆心的开圆盘上全纯，$C_r$是其中的圆周$|\zeta-a|=r$，则对圆内的$z$，$f^{(n)}(z)=\frac{n!}{2\pi i}\oint_{C_r}\frac{f(\zeta)}{(\zeta-z)^{n+1}}\dd\zeta$；全纯函数因此无穷次可导。
    definedIn: math.complex-analysis.higher-derivatives
    anchor: thm-higher-derivatives
  - id: math.complex-analysis.analytic-function
    zh: |
      解析函数
    en: |
      analytic function
    brief: |
      在开集$D$的每一点附近都等于一个幂级数的和的函数；在开集上，解析和全纯是一回事。
    definedIn: math.complex-analysis.power-series
    anchor: def-analytic
  - id: math.complex-analysis.harmonic-conjugate
    zh: |
      共轭调和函数
    en: |
      harmonic conjugate
    brief: |
      实值调和函数$u$在开集$D$上的共轭调和函数，是使$u+iv$在$D$上全纯的实函数$v$；在开圆盘上一定存在，在区域上只能差一个常数。
    definedIn: math.complex-analysis.harmonic-functions
    anchor: def-harmonic-conjugate
  - id: math.complex-analysis.cauchy-estimate
    zh: |
      柯西估计
    en: |
      Cauchy's estimate
    brief: |
      $f$在以$a$为圆心的开圆盘上全纯，在其中的圆周$|z-a|=r$上$|f|\le M$，则$|f^{(n)}(a)|\le\frac{n!\,M}{r^n}$。
    definedIn: math.complex-analysis.liouville
    anchor: thm-cauchy-estimate
  - id: math.complex-analysis.liouville-theorem
    zh: |
      刘维尔定理
    en: |
      Liouville's theorem
    brief: |
      有界的整函数一定是常数；由柯西估计让圆的半径趋于无穷得到。
    definedIn: math.complex-analysis.liouville
    anchor: thm-liouville
  - id: math.complex-analysis.fundamental-theorem-of-algebra
    zh: |
      代数基本定理
    en: |
      fundamental theorem of algebra
    brief: |
      次数不小于$1$的复系数多项式在复数里至少有一个根；因而$n$次多项式恰好有$n$个根（重根按重数计），能分解成一次因式的乘积。
    definedIn: math.complex-analysis.liouville
    anchor: thm-fundamental-algebra
  - id: math.complex-analysis.mean-value-property
    zh: |
      平均值性质
    en: |
      mean value property
    brief: |
      函数在每一点的值都等于它在以这一点为圆心、连同圆盘都含在定义域里的圆周上的平均值；全纯函数和调和函数都有这个性质。
    definedIn: math.complex-analysis.maximum-modulus
    anchor: def-mean-value-property
  - id: math.complex-analysis.maximum-modulus-principle
    zh: |
      最大模原理
    en: |
      maximum modulus principle
    brief: |
      $f$在区域上全纯、$|f|$在区域里某点取到最大值，则$f$是常数；所以有界区域上$|f|$的最大值在边界上取到。
    definedIn: math.complex-analysis.maximum-modulus
    anchor: thm-maximum-modulus
