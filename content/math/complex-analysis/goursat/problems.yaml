- id: p1
  tier: easy
  statement: |
    $T$是以$0$、$2$、$2i$为顶点的三角形，取逆时针方向。求$\oint_{\partial T}\Re z\,\dd z$，答案依次写实部、虚部。
  answer:
    type: tuple
    value: [0, 2]
  hints:
    - |
      三条边分别写参数：$[0,2]$、$[2,2i]$、$[2i,0]$。
    - |
      在$[2,2i]$上$z=2+t(2i-2)$，$\Re z=2-2t$，$z'(t)=2i-2$。
    - |
      在$[2i,0]$上$\Re z=0$。
  solution: |
    在$[0,2]$上$z=2t$，积分是$\int_0^1 2t\cdot2\,\dd t=2$；在$[2,2i]$上积分是$(2i-2)\int_0^1(2-2t)\,\dd t=2i-2$；在$[2i,0]$上被积函数是$0$。三段相加是$2i$：实部$0$，虚部$2$。它不是$0$，因为$\Re z$不全纯。

- id: p2
  tier: easy
  statement: |
    和用格林公式证明的柯西积分定理相比，古尔萨定理（Goursat's theorem）少要了哪个条件？
  answer:
    type: choice
    multiple: false
    options:
      - |
        $f'$连续
      - |
        $f$在三角形的边界上连续
      - |
        $f$在三角形连同内部全纯
      - |
        三角形的边界取逆时针方向
    value: 1
  hints:
    - |
      格林公式要求被积的函数有连续的偏导数。
    - |
      由柯西-黎曼方程，$u$、$v$的偏导数就是$f'$的实部、虚部（和它们的相反数）。
    - |
      古尔萨定理的证明只用到每一点复可导。
  solution: |
    格林公式要$u$、$v$有连续的偏导数，也就是$f'$连续；古尔萨定理的证明把三角形不断细分，在缩向的那一点用复可导，没有用到$f'$的连续性。全纯这个条件不能少（例 1），方向反过来只差一个符号。选 A。

- id: p3
  tier: medium
  statement: |
    设$f(z)=2z+1$，$F(z)=\int_{[0,z]}f(\zeta)\,\dd\zeta$，积分沿从$0$到$z$的线段。求$F(i)$，答案依次写实部、虚部。
  answer:
    type: tuple
    value: [-1, 1]
  hints:
    - |
      线段$[0,z]$写成$\zeta=tz$，$0\le t\le1$，$\dd\zeta=z\,\dd t$。
    - |
      $F(z)=\int_0^1(2tz+1)z\,\dd t$。
    - |
      积出来是$z^2+z$。
  solution: |
    $F(z)=\int_0^1(2tz+1)z\,\dd t=z^2+z$，所以$F(i)=i^2+i=-1+i$：实部$-1$，虚部$1$。可以验证$F'(z)=2z+1=f(z)$，正是圆盘里原函数的构造。

- id: p4
  tier: medium
  statement: |
    $z\ne0$时$f(z)=\frac{e^z-1}z$，$f(0)=1$。$F(z)=\int_{[0,z]}f(\zeta)\,\dd\zeta$，积分沿线段。求$F'(0)$，答案依次写实部、虚部。
  answer:
    type: tuple
    value: [1, 0]
  hints:
    - |
      先看$f$在$0$处连不连续：$\frac{e^z-1}z$是哪个函数在$0$处的差商？
    - |
      $f$在整个平面上连续，除$0$外全纯。
    - |
      由圆盘里的原函数的定理，$F'=f$。
  solution: |
    $\frac{e^z-1}{z-0}$是$e^z$在$0$处的差商，趋于$(e^z)'|_{z=0}=1$，所以$f$在$0$处连续。$f$在任何以$0$为圆心的开圆盘上连续、除$0$外全纯，由定理，$F'=f$，$F'(0)=f(0)=1$：实部$1$，虚部$0$。

- id: p5
  tier: hard
  statement: |
    补全「允许一个例外点」的证明：设$f$在开集$D$上连续，除一点$p$外都全纯，三角形$T$连同内部在$D$里。

    （1）$p$在$T$的一条边上（不是顶点）时，证明$\oint_{\partial T}f\,\dd z=0$。

    （2）$p$在$T$的内部时，证明$\oint_{\partial T}f\,\dd z=0$。
  hints:
    - |
      （1）连接$p$和对面的顶点，把$T$分成两个以$p$为顶点的三角形。
    - |
      （2）连接$p$和三个顶点，把$T$分成三个以$p$为顶点的三角形。
    - |
      各小三角形都取逆时针方向，新加的边上积分抵消；每个小三角形用「$p$是顶点」的情形。
  reference: |
    （1）设$p$在边$[b,c]$上，$a$是对面的顶点。连接$a$、$p$，$T$分成三角形$abp$和$apc$，都以$p$为顶点，都取逆时针方向。线段$[a,p]$在两个三角形里各走一遍、方向相反，积分抵消，所以$\oint_{\partial T}f\,\dd z$等于两个小三角形边界上的积分之和。由$p$是顶点的情形，两个积分都是$0$。

    （2）连接$p$和三个顶点，$T$分成三个以$p$为顶点的三角形，同样各取逆时针方向。三条新边上的积分两两抵消，三个积分都是$0$，所以$\oint_{\partial T}f\,\dd z=0$。

- id: p6
  tier: hard
  statement: |
    在去掉原点的平面$D$上考虑$f(z)=\frac1z$。

    （1）说明沿$D$里每个三角形的边界，只要三角形连同内部不含原点，积分就是$0$。

    （2）照「圆盘里的原函数」的办法，取$a=1$，令$F(z)=\int_{[1,z]}\frac{\dd\zeta}\zeta$。$F(z)$对哪些$z$没有定义？

    （3）证明中的哪一步在$D$上不成立？由此说明为什么推不出$\frac1z$在$D$上有原函数。
  hints:
    - |
      （1）$\frac1z$在不含原点的开集上全纯，用古尔萨定理。
    - |
      （2）$z$是负实数时，从$1$到$z$的线段经过哪个点？
    - |
      （3）三角形$1,z,z+h$会不会把原点围在里面？
  reference: |
    （1）三角形连同内部不含原点时，它在开集$D$的一部分里，而$\frac1z$在$D$上全纯，由古尔萨定理积分为$0$。

    （2）$z$是负实数时，线段$[1,z]$经过原点，$\frac1\zeta$在那里没有定义，积分没有意思，所以$F(z)$在负实轴上没有定义。

    （3）证明要求三角形$1,z,z+h$连同内部都在定义域里。$D$不是圆盘，$z$在负实轴附近时，这个三角形可能把原点围进去，「沿它的边界积分为$0$」就不成立了。事实上$\frac1z$在$D$上没有原函数，否则沿单位圆的积分该是$0$，而它是$2\pi i$。

- id: p7
  tier: thinking
  statement: |
    关于古尔萨定理的证明：

    （1）直接对大三角形$T$用 ML 不等式，能证出积分是$0$吗？

    （2）细分到第$n$步，$\oint_{\partial T_n}f\,\dd z$的模至少有多大？用复可导估计，至多有多大？

    （3）证明里哪一步用到了「复可导」，只是「连续」行不行？
  hints:
    - |
      （1）ML 不等式只给出一个和$f$的大小、$T$的周长有关的上界。
    - |
      （2）下界$\frac I{4^n}$，上界$\eta\cdot\frac{dL}{4^n}$。
    - |
      （3）一次函数沿闭曲线的积分为$0$，余项$\varepsilon(z)(z-z_0)$要比$|z-z_0|$小得多。
  reference: |
    （1）不能。ML 不等式只说积分的模不超过$f$在边界上的最大模乘周长，这个数一般不是$0$。

    （2）至少$\frac I{4^n}$；用复可导，至多$\eta\cdot\frac d{2^n}\cdot\frac L{2^n}$，$\eta$可以任意小。两者都和$\frac1{4^n}$同阶，比一比，就只剩$I\le\eta dL$。

    （3）在$z_0$处把$f$写成一次函数加上$\varepsilon(z)(z-z_0)$，要用复可导。只是连续的话，只能写成$f(z_0)$加上一个趋于$0$的量，上界变成$\eta\cdot\frac L{2^n}$，只和$\frac1{2^n}$同阶，比不过下界$\frac I{4^n}$，证不出来；$\bar z$连续却不全纯，沿三角形的积分就不为$0$（例 1）。

- id: p8
  tier: thinking
  statement: |
    （1）在这一节之前，柯西积分定理要求$f'$连续。这个条件是从哪里来的？

    （2）这一节在什么范围里把它去掉了？

    （3）还要证明什么，才能在一般的简单闭曲线上也去掉它？
  hints:
    - |
      （1）回想柯西积分定理是用什么证的。
    - |
      （2）三角形；圆盘。
    - |
      （3）要是能证明全纯函数的导数总是连续的……
  reference: |
    （1）来自格林公式：它要被积的函数有连续的偏导数。

    （2）沿三角形边界的积分为$0$，不需要$f'$连续；由此在圆盘里，沿任何闭曲线的积分都为$0$。

    （3）只要证明全纯函数的导数总是连续的，格林公式版的柯西积分定理就对所有全纯函数成立。[柯西积分公式](lesson:math.complex-analysis.cauchy-integral-formula)一节正是这样做的：先在圆周上用本节的结论证出积分公式，由它推出全纯函数可以无穷次求导，导数当然连续。
