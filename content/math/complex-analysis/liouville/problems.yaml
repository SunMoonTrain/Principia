- id: p1
  tier: easy
  statement: |
    设$f$是整函数，在圆周$|z|=2$上处处$|f(z)|\le5$。由柯西估计，$|f''(0)|$不超过多少？
  answer:
    type: number
    value: 5/2
  hints:
    - |
      柯西估计：$|f^{(n)}(a)|\le\frac{n!\,M}{r^n}$。
    - |
      这里$a=0$、$r=2$、$M=5$、$n=2$。
    - |
      $\frac{2!\cdot5}{2^2}$。
  solution: |
    由柯西估计（$a=0$，$r=2$，$M=5$，$n=2$），$|f''(0)|\le\frac{2!\cdot5}{2^2}$，即$\frac52$。

- id: p2
  tier: easy
  statement: |
    下列整函数中，在整个复平面上有界的是哪一个？
  answer:
    type: choice
    multiple: false
    options:
      - |
        $\cos^2z+\sin^2z$
      - |
        $\sin z$
      - |
        $e^{iz}$
      - |
        $e^{-z^2}$
    value: 1
  hints:
    - |
      由刘维尔定理，有界的整函数只能是常数。
    - |
      $\cos^2z+\sin^2z$对复数也恒等于$1$吗？
    - |
      $e^{iz}$看$z=-iy$，$e^{-z^2}$看$z=iy$。
  solution: |
    有界的整函数只能是常数。A：$\cos^2z+\sin^2z$恒等于$1$（用$e^{iz}$、$e^{-iz}$展开验证），有界；B：$|\sin(iy)|=|\sinh y|$无界；C：$|e^{iz}|=e^{-\Im z}$，$z=-iy$、$y\to+\infty$时无界；D：$z=iy$时$e^{-z^2}=e^{y^2}$，无界。选 A。

- id: p3
  tier: medium
  statement: |
    多项式$z^3-3z^2+4z-2$有三个根（重根按重数计）。求这三个根的模的平方和。
  answer:
    type: number
    value: 5
  hints:
    - |
      先试$z=1$。
    - |
      提出因子$z-1$，剩下$z^2-2z+2$。
    - |
      $z^2-2z+2=0$的根是$1\pm i$。
  solution: |
    $z=1$时$1-3+4-2=0$，所以$z^3-3z^2+4z-2=(z-1)(z^2-2z+2)$。$z^2-2z+2=0$的根是$1\pm i$，模的平方都是$2$。所以平方和是$1+2+2$，即$5$。

- id: p4
  tier: medium
  statement: |
    整函数$f$处处满足$|f(z)|\le2|z|^2$，并且$f(1)=1$。求$f(2i)$。
  answer:
    type: number
    value: -4
  hints:
    - |
      对三阶导数用柯西估计，说明$f'''$处处为$0$，$f$是至多二次的多项式。
    - |
      $z=0$代进去得$f(0)=0$；再看$z\to0$时$\frac{f(z)}z$。
    - |
      $f(z)=\alpha z^2$。
  solution: |
    任取$a$和$r>0$，圆周$|z-a|=r$上$|f|\le2(|a|+r)^2$，由柯西估计$|f'''(a)|\le\frac{3!\cdot2(|a|+r)^2}{r^3}$，$r\to+\infty$时趋于$0$，所以$f'''=0$，$f=\alpha z^2+\beta z+\gamma$。由$|f(0)|\le0$得$\gamma=0$；$z\ne0$时$|\alpha z+\beta|\le2|z|$，令$z\to0$得$\beta=0$。$f(1)=\alpha$，即$\alpha=1$，所以$f(z)=z^2$，$f(2i)=-4$。

- id: p5
  tier: hard
  statement: |
    设$f$是整函数。

    （1）如果处处$\Re f(z)\le0$，证明$f$是常数。

    （2）如果$f$的值都不落在某个圆盘$|w-w_0|<\varepsilon$里，证明$f$是常数。
  hints:
    - |
      （1）看$e^{f}$：$|e^{f}|=e^{\Re f}$。
    - |
      （2）看$\frac1{f-w_0}$。
    - |
      都用刘维尔定理；（1）里由$e^f$是常数推$f$是常数，要用$(e^f)'=f'e^f$。
  reference: |
    （1）$g=e^{f}$是整函数，$|g|=e^{\Re f}\le1$，由刘维尔定理$g$是常数，$g'=f'e^f=0$。$e^f$永不为$0$，所以$f'$处处为$0$，$f$是常数。

    （2）$f(z)-w_0$永不为$0$，$h=\frac1{f-w_0}$是整函数，$|h|\le\frac1\varepsilon$。由刘维尔定理$h$是常数，它不为$0$，所以$f=w_0+\frac1h$也是常数。不是常数的整函数的值，在每个圆盘里都有。

- id: p6
  tier: hard
  statement: |
    设$p$是实系数多项式。

    （1）证明：$p(z_0)=0$时$p(\bar z_0)=0$。

    （2）证明$p$能分解成实系数的一次因式和二次因式的乘积。

    （3）把$z^4+1$分解成实系数的二次因式的乘积。
  hints:
    - |
      （1）系数是实数，$\overline{p(z)}=p(\bar z)$。
    - |
      （2）$(z-z_0)(z-\bar z_0)=z^2-2\Re z_0\,z+|z_0|^2$。
    - |
      （3）$z^4=-1$的根是$e^{i\pi/4}$乘$1$、$i$、$-1$、$-i$。
  reference: |
    （1）系数是实数，取共轭得$\overline{p(z)}=p(\bar z)$。$p(z_0)=0$时$p(\bar z_0)=\overline{p(z_0)}$，即$0$。

    （2）由代数基本定理，$p(z)=a_n(z-z_1)\cdots(z-z_n)$，$a_n$是实数。实根给出实系数的一次因式。不是实数的根$z_0$和$\bar z_0$成对出现，而且重数相同（把$(z-z_0)(z-\bar z_0)$这个实系数二次式除掉以后，商仍是实系数多项式，可以接着用（1）），两者合起来是$z^2-2\Re z_0\,z+|z_0|^2$，系数是实数。

    （3）根是$\frac{\pm1\pm i}{\sqrt2}$。$\frac{1\pm i}{\sqrt2}$合起来是$z^2-\sqrt2z+1$，$\frac{-1\pm i}{\sqrt2}$合起来是$z^2+\sqrt2z+1$，所以$z^4+1=(z^2-\sqrt2z+1)(z^2+\sqrt2z+1)$。

- id: p7
  tier: thinking
  statement: |
    （1）$\sin x$、$\frac1{1+x^2}$都是在整个实轴上有界、无穷次可导、不是常数的实函数。为什么这和刘维尔定理不矛盾？

    （2）刘维尔定理的证明里，哪一步用到了「在整个平面上全纯」？
  hints:
    - |
      （1）把$x$换成$z$：$\sin z$在平面上有界吗？$\frac1{1+z^2}$在哪里不全纯？
    - |
      （2）柯西估计里的$r$要能取得任意大。
    - |
      （2）只在圆盘里全纯时，$r$能取多大？
  reference: |
    （1）刘维尔定理说的是在整个复平面上全纯、有界。$\sin z$在平面上全纯，但沿虚轴无界；$\frac1{1+z^2}$在$\pm i$处不全纯，不是整函数。实轴上的有界性管不到整个平面。

    （2）对每个$r>0$，要在以$a$为圆心、半径大于$r$的圆盘上用柯西估计，并让$r\to+\infty$。只在半径为$R$的圆盘里全纯时，$r$不能超过$R$，只能得到$|f'(a)|\le\frac Mr$（$r<R$），推不出$f'(a)=0$；$f(z)=z$在单位圆盘里就是例子。

- id: p8
  tier: thinking
  statement: |
    （1）代数基本定理对实数「不成立」：$x^2+1$没有实根。照搬证明，哪一步对实数走不通？

    （2）证明：奇数次的实系数多项式至少有一个实根。

    （3）偶数次的实系数多项式一定有实根吗？
  hints:
    - |
      （1）$\frac1{1+x^2}$在实轴上有界，可它不是整函数。
    - |
      （2）不是实数的根成对出现。
    - |
      （3）$x^2+1$。
  reference: |
    （1）证明要把$\frac1p$看成整函数，在整个复平面上用刘维尔定理。$\frac1{1+x^2}$在实轴上有界、可导，但作为复变函数在$\pm i$处没有定义，不是整函数，刘维尔定理用不上；根就藏在实轴外面。

    （2）由代数基本定理，$n$次多项式有$n$个根（重根按重数计）。不是实数的根和它的共轭成对出现、重数相同（第 6 题），个数是偶数；$n$是奇数，所以至少有一个根是实数。也可以用介值定理：$x\to\pm\infty$时$p(x)$的符号相反。

    （3）不一定：$x^2+1$、$x^4+1$都没有实根。
