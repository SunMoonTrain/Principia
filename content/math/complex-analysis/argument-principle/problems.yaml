- id: p1
  tier: easy
  statement: |
    设$f(z)=\frac{(z-1)^3(z+5)}{z^2+1}$。求$\frac1{2\pi i}\oint_{|z|=2}\frac{f'(z)}{f(z)}\,\dd z$，圆周取逆时针方向。
  answer:
    type: number
    value: 1
    exact: true
  hints:
    - |
      由辐角原理，这个积分等于$f$在圆$|z|<2$里的零点个数减极点个数，都按阶计。
    - |
      零点是$1$（三阶）和$-5$，极点是$\pm i$（都是一阶）。哪些在圆里？
    - |
      圆里有三阶零点$1$和一阶极点$\pm i$，$-5$在圆外：$N=3$，$P=2$，结果是$1$。
  solution: |
    $f(z)=(z-1)^3g(z)$，$g(z)=\frac{z+5}{z^2+1}$在$1$处等于$3\ne0$，所以$1$是三阶零点；$-5$是单零点。分母的零点$\pm i$是单零点，分子在那里不为$0$，所以$\pm i$是一阶极点。

    $|1|<2$，$|\pm i|=1<2$，而$|-5|=5>2$，圆周上没有零点和极点。所以$N=3$，$P=2$，由辐角原理，结果是$N-P=1$。

- id: p2
  tier: easy
  statement: |
    下列闭曲线里，$t$都从$0$走到$2\pi$。绕原点的绕数（winding number）是$2$的是哪一条？
  answer:
    type: choice
    multiple: false
    options:
      - |
        $w=e^{it}\bigl(2+e^{it}\bigr)$
      - |
        $w=e^{2it}\bigl(2+e^{it}\bigr)$
      - |
        $w=e^{-2it}$
      - |
        $w=2+e^{2it}$
    value: 2
  hints:
    - |
      把每条曲线写成$f(z)$，$z=e^{it}$逆时针走一圈单位圆周。由辐角原理，绕原点的圈数是$f$在单位圆里的零点个数减极点个数。
    - |
      A 是$z(z+2)$，B 是$z^2(z+2)$，C 是$\frac1{z^2}$，D 是$z^2+2$。
    - |
      A 绕$1$圈（$-2$在圆外），B 绕$2$圈（$0$是二阶零点），C 绕$-2$圈（$0$是二阶极点），D 绕$0$圈（零点$\pm\sqrt2i$在圆外）。选 B。
  solution: |
    令$z=e^{it}$，它逆时针走一圈单位圆周。A 是$f(z)=z(z+2)$，单位圆里只有单零点$0$，绕数是$1$。B 是$z^2(z+2)$，$0$是二阶零点，$-2$在圆外，绕数是$2$。

    C 是$\frac1{z^2}$，没有零点，$0$是二阶极点，绕数是$-2$；也可以直接看出连续辐角是$-2t$，增加了$-4\pi$。D 是$z^2+2$，零点$\pm\sqrt2i$的模大于$1$，绕数是$0$；也可以看出$\Re w=2+\cos2t\ge1$，曲线在右半平面里，绕不到原点。选 B。

- id: p3
  tier: medium
  statement: |
    设$f(z)=\frac{z^2+1}{z-\frac12}$。求$\frac1{2\pi i}\oint_{|z|=2}\frac{zf'(z)}{f(z)}\,\dd z$，圆周取逆时针方向。
  answer:
    type: number
    value: -1/2
  hints:
    - |
      对数导数把乘除变成加减：$\frac{f'}f=\frac1{z-i}+\frac1{z+i}-\frac1{z-\frac12}$。
    - |
      被积函数在$i$、$-i$、$\frac12$处都是一阶极点，$\frac z{z-a}$在$a$处的留数是$a$。
    - |
      三点都在圆里，留数依次是$i$、$-i$、$-\frac12$，由留数定理，结果是$i-i-\frac12=-\frac12$。
  solution: |
    $z^2+1=(z-i)(z+i)$，对数导数把乘除变成加减：$\frac{f'}f=\frac1{z-i}+\frac1{z+i}-\frac1{z-\frac12}$。所以$\frac{zf'}f=\frac z{z-i}+\frac z{z+i}-\frac z{z-\frac12}$，在$i$处只有第一项不全纯，留数是$\lim_{z\to i}(z-i)\frac z{z-i}=i$；同样，$-i$、$\frac12$处的留数是$-i$、$-\frac12$。

    三点的模都小于$2$，圆周上没有奇点，由留数定理，结果是$i-i-\frac12=-\frac12$。它正是圆里的零点之和减去极点之和。

- id: p4
  tier: medium
  statement: |
    求$\frac1{2\pi i}\oint_{|z|=10}\frac{e^z}{e^z-1}\,\dd z$，圆周取逆时针方向。
  answer:
    type: number
    value: 3
    exact: true
  hints:
    - |
      分子正是分母的导数，被积函数是$e^z-1$的对数导数。
    - |
      $e^z=1$当且仅当$z=2k\pi i$，$k$是整数。哪些在圆里？它们是几阶零点？
    - |
      $|2k\pi i|<10$只有$k=0$、$\pm1$（$4\pi>10$）；$(e^z-1)'=e^z\ne0$，都是单零点。$e^z-1$没有极点，结果是$3$。
  solution: |
    $(e^z-1)'=e^z$，被积函数是$e^z-1$的对数导数；$e^z-1$是整函数，没有极点。$e^z=1$当且仅当$z=2k\pi i$（$k$是整数），$|2k\pi i|=2|k|\pi<10$只有$k=0$、$\pm1$，因为$4\pi\approx12.6>10$，圆周上也没有零点。

    在这三点处$(e^z-1)'=e^z=1\ne0$，它们都是单零点，所以$N=3$，$P=0$，由辐角原理，结果是$3$。

- id: p5
  tier: hard
  statement: |
    设$f$在$z_0$附近全纯，$w_0=f(z_0)$，$z_0$是$f(z)-w_0$的$n$阶零点（$n\ge1$）。

    （1）证明：有$r>0$和$\delta>0$，使$|w-w_0|<\delta$时，方程$f(z)=w$在$|z-z_0|<r$里的解按阶计恰有$n$个。

    （2）证明：可以再把$r$取小（$\delta$随之重取），使$0<|w-w_0|<\delta$时这$n$个解互不相同。由此说明：$f$在以$z_0$为圆心的某个开圆盘上是一一的，当且仅当$f'(z_0)\ne0$。
  hints:
    - |
      （1）由辐角原理，$N(w)=\frac1{2\pi i}\oint_{|z-z_0|=r}\frac{f'(z)}{f(z)-w}\,\dd z$就是解的个数，$N(w_0)=n$。说明$N(w)$对$w$连续，它又只取整数。
    - |
      （1）取$r$使$f-w_0$在$0<|z-z_0|\le r$上没有零点，$\delta$是$|f-w_0|$在圆周$|z-z_0|=r$上的最小值，这时圆周上$f\ne w$。被积函数之差是$\frac{f'(z)(w-w_1)}{(f(z)-w)(f(z)-w_1)}$，用 ML 不等式（ML inequality）估计；再沿从$w_0$到$w$的线段用介值定理。
    - |
      （1）照上面的估计，$|N(w)-N(w_1)|$不超过常数乘$|w-w_1|$，所以$N$连续、只取整数，沿线段是常数$n$。（2）$f$不是常数，$f'$在$z_0$附近不恒为$0$，它的零点也孤立：把$r$取小，使$0<|z-z_0|<r$里$f'\ne0$，于是$w\ne w_0$时每个解都是单零点，$n$个解互不相同。$f'(z_0)\ne0$当且仅当$n=1$：$n=1$时每个这样的$w$在圆盘里只取一次，$f$在$z_0$附近一一；$n\ge2$时，不管圆盘多小，$w_0$附近的$w\ne w_0$都在里面取$n$次，不是一一的。
  reference: |
    （1）$f-w_0$在$z_0$附近不恒为$0$（否则$z_0$不是有限阶零点），由零点的孤立性，可以取$r>0$，使$f$在一个包含闭圆盘$|z-z_0|\le r$的开圆盘上全纯，并且$f-w_0$在$0<|z-z_0|\le r$上没有零点。记$\Gamma$是逆时针的圆周$|z-z_0|=r$，$|f(z)-w_0|$在$\Gamma$上连续、处处为正，由最值定理有正的最小值$\delta$。$|w-w_0|<\delta$时，$\Gamma$上$|f(z)-w|\ge|f(z)-w_0|-|w-w_0|>0$；$f-w$没有极点，由辐角原理，$f(z)=w$在$|z-z_0|<r$里的解按阶计共有$N(w)=\frac1{2\pi i}\oint_\Gamma\frac{f'(z)}{f(z)-w}\,\dd z$个，$N(w_0)=n$。

    再证$N$连续。取$|w_1-w_0|<\delta$，令$\eta=\frac12(\delta-|w_1-w_0|)$；$|w-w_1|<\eta$时$|w-w_0|<\delta-\eta$，$\Gamma$上$|f-w|>\eta$，$|f-w_1|\ge2\eta$。设$\Gamma$上$|f'|\le M$，被积函数之差是$\frac{f'(z)(w-w_1)}{(f(z)-w)(f(z)-w_1)}$，由 ML 不等式，$|N(w)-N(w_1)|\le\frac1{2\pi}\cdot\frac{M|w-w_1|}{2\eta^2}\cdot2\pi r$，$w\to w_1$时趋于$0$。所以$N$在圆盘$|w-w_0|<\delta$里连续、只取整数，限制在从$w_0$到$w$的线段上，由介值定理是常数，$N(w)=N(w_0)=n$。

    （2）$f$在$z_0$附近不是常数，所以$f'$在$z_0$附近不恒为$0$（导数处处为$0$的函数在圆盘上是常数，见柯西-黎曼方程与全纯函数一节第 5 题）。由零点的孤立性，把$r$取小（照（1）重取$\delta$），可以使$0<|z-z_0|<r$里$f'\ne0$。$0<|w-w_0|<\delta$时，$f(z)=w$的解都不是$z_0$，那里$f'(z)\ne0$，每个解都是$f-w$的单零点，所以$n$个解互不相同。

    由零点的阶的定义，$n$是使$f^{(n)}(z_0)\ne0$的最小正整数，所以$f'(z_0)\ne0$当且仅当$n=1$。$n=1$时，令$V$是$|z-z_0|<r$里满足$|f(z)-w_0|<\delta$的点，它是包含$z_0$的开集，含有以$z_0$为圆心的某个开圆盘；$V$里两点的值相同、都等于$w$时，$|w-w_0|<\delta$，方程$f(z)=w$在$|z-z_0|<r$里只有一个解，所以这两点相同，$f$在$V$上一一。$n\ge2$时，对任何$r'\le r$，照（1）（2）在$|z-z_0|<r'$里取出相应的$\delta'$，满足$0<|w-w_0|<\delta'$的$w$在这个圆盘里有$n\ge2$个不同的原像，所以$f$在以$z_0$为圆心的任何开圆盘上都不是一一的。

- id: p6
  tier: hard
  statement: |
    设$C$、$f$满足辐角原理的条件，$f$在$C$里面的零点是$a_1,\dots,a_k$，阶分别是$m_1,\dots,m_k$，极点是$b_1,\dots,b_l$，阶分别是$q_1,\dots,q_l$；$g$在一个包含$C$和它围成的部分的开集上全纯。

    （1）证明：$\frac1{2\pi i}\oint_Cg(z)\frac{f'(z)}{f(z)}\,\dd z=\sum_{j=1}^km_jg(a_j)-\sum_{j=1}^lq_jg(b_j)$。

    （2）用（1）求$z^3-3z+1$的三个根的平方和。
  hints:
    - |
      （1）照辐角原理的证明，$g\frac{f'}f$只在$C$里面的零点、极点处可能不全纯。在$m$阶零点$a$附近，$\frac{f'}f=\frac m{z-a}+h(z)$，$h$在$a$附近全纯；乘上$g$以后，$a$处的留数是多少？
    - |
      （1）$\frac{mg(z)}{z-a}$在$a$处的留数是$mg(a)$，极点处同理，只是$m$换成$-q$。（2）取$g(z)=z^2$、$f(z)=z^3-3z+1$，$C$取包含三个根的大圆周$|z|=\rho$；做除法，$z^2\cdot\frac{3z^2-3}{z^3-3z+1}=3z+\frac{6z^2-3z}{z^3-3z+1}$。
    - |
      （1）由留数定理，把各点的留数相加即得。（2）$3z$沿圆周的积分是$0$；$\frac{6z^2-3z}{z^3-3z+1}-\frac6z=\frac{-3z^2+18z-6}{z(z^3-3z+1)}$在$|z|=\rho$上不超过常数乘$\frac1{\rho^2}$，由 ML 不等式，它的积分趋于$0$。平方和和$\rho$无关，所以等于$\frac1{2\pi i}\oint\frac6z\,\dd z=6$。
  reference: |
    （1）照辐角原理的证明，有包含$C$和它围成的部分的开集$U$，$\frac{f'}f$在$U$上除$C$里面的零点、极点外全纯，乘上$g$以后也是这样。在$m_j$阶零点$a_j$附近，由讲解里关于对数导数的留数的定理的证明，$\frac{f'}f=\frac{m_j}{z-a_j}+h(z)$，$h$在$a_j$附近全纯，所以$g\frac{f'}f=\frac{m_jg(z)}{z-a_j}+g(z)h(z)$，留数是$\lim_{z\to a_j}(z-a_j)g(z)\frac{f'(z)}{f(z)}=m_jg(a_j)$（$g(a_j)=0$时$a_j$是可去奇点，留数也是$0$，公式照样成立）。在$q_j$阶极点$b_j$附近，$\frac{f'}f=\frac{-q_j}{z-b_j}+$（全纯函数），留数是$-q_jg(b_j)$。由留数定理相加即得。

    （2）设三个根是$z_1$、$z_2$、$z_3$，都是单根（$f'=3z^2-3$在$\pm1$处为$0$，可$f(\pm1)$是$-1$、$3$，都不为$0$）。取$f(z)=z^3-3z+1$、$g(z)=z^2$，$C$是逆时针的圆周$|z|=\rho$，$\rho\ge3$大于三个根的模；$f$没有极点，由（1），平方和$S=\frac1{2\pi i}\oint_Cz^2\frac{3z^2-3}{z^3-3z+1}\,\dd z$，和$\rho$无关。做除法，$z^2\cdot\frac{3z^2-3}{z^3-3z+1}=3z+\frac{6z^2-3z}{z^3-3z+1}$，$\oint_C3z\,\dd z=0$，$\frac1{2\pi i}\oint_C\frac6z\,\dd z=6$。

    而$\frac{6z^2-3z}{z^3-3z+1}-\frac6z=\frac{-3z^2+18z-6}{z(z^3-3z+1)}$；$|z|=\rho\ge3$时分子的模不超过$3\rho^2+18\rho+6\le27\rho^2$，$|z^3-3z+1|\ge\rho^3-3\rho-1\ge\frac{\rho^3}2$，所以这一项的模不超过$\frac{54}{\rho^2}$，由 ML 不等式，它沿$C$的积分的模不超过$\frac{108\pi}\rho$，趋于$0$。所以$S=6$。核对：由根与系数的关系，$z_1+z_2+z_3=0$，$z_1z_2+z_2z_3+z_3z_1=-3$，$S=0^2-2\cdot(-3)=6$。

- id: p7
  tier: thinking
  statement: |
    设$C$是分段光滑的闭曲线，点$a$不在$C$上。

    （1）为什么$\operatorname{Ind}_C(a)$只能取整数？

    （2）$a$不碰到$C$、连续地移动时，$\operatorname{Ind}_C(a)$会不会变？$a$离原点很远时，它是多少？

    （3）设$C$是逆时针的简单闭曲线，$a$在$C$里面。不碰到$C$，能不能把$a$连续地移到离原点很远的地方？
  hints:
    - |
      （1）绕数是连续辐角走完一圈的增量除以$2\pi$；回到起点时，辐角只能差$2\pi$的整数倍。
    - |
      （2）$\operatorname{Ind}_C(a)=\frac1{2\pi i}\oint_C\frac{\dd z}{z-a}$。估计$a$、$b$两点处被积函数之差，说明它对$a$连续；连续又只取整数的函数，沿一条路径变化时会怎样？
    - |
      （1）由连续辐角的定理（3），增量是$2\pi$的整数倍。（2）由 ML 不等式，$|\operatorname{Ind}_C(a)-\operatorname{Ind}_C(b)|\le\frac{L|a-b|}{2\pi d_ad_b}$，$L$是$C$的长度，$d_a$、$d_b$是$a$、$b$到$C$的最短距离，所以绕数对$a$连续；$a$沿不碰$C$的路径移动时，由介值定理它不变。$|a|$比$C$上各点的模大得多时，$\bigl|\frac1{z-a}\bigr|$在$C$上很小，绕数的模小于$1$，只能是$0$。（3）不能：里面的点绕数是$1$（柯西积分定理一节变形积分路径后面的说明），很远的点绕数是$0$，不碰$C$的移动又不改变绕数。
  reference: |
    （1）由连续辐角的定理（3），$z(t)-a$的连续辐角走完一圈的增量是$2\pi$的整数倍，绕数就是这个整数。直观地说，回到起点时$z-a$回到原来的值，辐角只能差$2\pi$的整数倍。

    （2）设$a$、$b$都不在$C$上，$d_a$、$d_b$是它们到$C$的最短距离（$C$上$|z-a|$连续、处处为正，由最值定理取得到正的最小值），$L$是$C$的长度。$\frac1{z-a}-\frac1{z-b}=\frac{a-b}{(z-a)(z-b)}$，由 ML 不等式，$|\operatorname{Ind}_C(a)-\operatorname{Ind}_C(b)|\le\frac{L|a-b|}{2\pi d_ad_b}$；$b\to a$时$d_b\ge d_a-|a-b|$，右边趋于$0$，所以绕数对$a$连续。$a$沿一条不碰$C$的路径$\gamma(s)$（$0\le s\le1$，$\gamma$连续）移动时，$\operatorname{Ind}_C(\gamma(s))$是$[0,1]$上只取整数的连续函数，由介值定理是常数。

    设$C$上$|z|\le M$。$|a|>M+L$时，$C$上$|z-a|\ge|a|-M>L$，由 ML 不等式，$|\operatorname{Ind}_C(a)|\le\frac1{2\pi}\cdot\frac L{|a|-M}<\frac1{2\pi}$，只能是$0$。

    （3）不能。$C$是逆时针的简单闭曲线时，里面的点绕数是$1$（柯西积分定理一节变形积分路径后面的说明），离原点很远的点绕数是$0$；要是有一条不碰$C$的路径把$a$移到很远的地方，由（2），绕数不变，矛盾。所以从$C$里面到很远的地方，路径一定要碰到$C$：简单闭曲线把平面分成了里外两部分，绕数正好把它们区分开。

- id: p8
  tier: thinking
  statement: |
    设$f(z)=\frac{z-1}{z+1}$，$C$是逆时针的圆周$|z|=2$。

    （1）像曲线$f(C)$绕原点几圈？$C$里面有没有$f$的零点？

    （2）只知道$\frac1{2\pi i}\oint_C\frac{f'}f\,\dd z$的值，能不能确定$C$里面有几个零点？还要知道什么？

    （3）设$g$在$C$上和$C$里面都全纯（没有极点），在$C$上不为$0$。像曲线$g(C)$绕原点的圈数能不能是负的，即顺时针绕原点？
  hints:
    - |
      （1）$f$在$C$里面有单零点$1$和一阶极点$-1$。
    - |
      （1）由辐角原理算$N-P$。也可以验证在$|z|=2$上$\bigl|f(z)-\frac53\bigr|=\frac43$，像曲线落在右半平面里。（2）积分只给出差。（3）对$g$来说$P=0$。
    - |
      （1）$N=P=1$，像曲线绕原点$0$圈，可$C$里面有零点$1$。（2）不能，例如$\frac{z-1}{z+1}$和常数$1$沿$C$的这个积分都是$0$；还要知道极点个数，没有极点时，积分就是零点个数。（3）不能：$g(C)$绕原点$N\ge0$圈；把$g$换成$g-w_0$，$g(C)$绕任何不在它上面的点$w_0$的圈数，都是$g(z)=w_0$在$C$里面的解数，也不是负的。有极点时就可以，$\frac1z$把逆时针的单位圆周映成顺时针的单位圆周。
  reference: |
    （1）$f$在$C$里面有单零点$1$和一阶极点$-1$，$C$上没有零点和极点。由辐角原理，$f(C)$绕原点$N-P=1-1=0$圈。也可以直接看：$f(z)-\frac53=-\frac23\cdot\frac{z+4}{z+1}$；$|z|=2$、$x=\Re z$时，$|z+4|^2=20+8x$，$|z+1|^2=5+2x$，所以$|z+4|=2|z+1|$，$\bigl|f(z)-\frac53\bigr|=\frac43$。像曲线落在圆周$\bigl|w-\frac53\bigr|=\frac43$上，也就在右半平面$\Re w\ge\frac13$里，$\Arg f$是连续辐角，走一圈的增量是$0$；可$C$里面有零点$1$。

    （2）不能。积分只给出$N-P$：$\frac{z-1}{z+1}$和没有零点的常数$1$，沿$C$的这个积分都是$0$。还要知道极点个数$P$；$f$在$C$里面没有极点时，积分就是零点个数。

    （3）不能。$g$没有极点，$P=0$，由辐角原理和像曲线绕原点圈数的定理，$g(C)$绕原点$N\ge0$圈。对不在$g(C)$上的任何$w_0$，把$g$换成$g-w_0$，$g(C)$绕$w_0$的圈数就是$g(z)=w_0$在$C$里面的解的个数（按阶计），也不是负的。所以全纯函数把逆时针的简单闭曲线映成的像曲线，绕任何一点的绕数都不是负的；有极点时就可以是负的：$\frac1z$把逆时针的单位圆周映成顺时针的单位圆周，绕原点$-1$圈。
