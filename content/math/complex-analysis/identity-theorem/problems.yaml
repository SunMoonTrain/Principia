- id: p1
  tier: easy
  statement: |
    求$e^{z^2}-1-z^2$在$0$处零点的阶。
  answer:
    type: number
    value: 4
    exact: true
  hints:
    - |
      把$e^w$的幂级数里的$w$换成$z^2$。
    - |
      $e^{z^2}=1+z^2+\frac{z^4}{2!}+\frac{z^6}{3!}+\cdots$。
    - |
      减去$1+z^2$以后，第一个不为$0$的项是哪一项？
  solution: |
    $e^{z^2}=\sum_{n\ge0}\frac{z^{2n}}{n!}$，所以$e^{z^2}-1-z^2=\frac{z^4}2+\frac{z^6}6+\cdots=z^4g(z)$，其中$g(z)=\frac12+\frac{z^2}6+\cdots$，$g(0)=\frac12\ne0$。所以$0$是$4$阶零点。

- id: p2
  tier: easy
  statement: |
    设$f$在区域$D$上全纯。下列条件中，哪些能推出$f$在$D$上恒为$0$？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $D$里有一点$a$，$f(a)=f'(a)=f''(a)=0$
      - |
        $D$和实轴有公共点，并且在$D$里的每个实数$x$处$f(x)=0$
      - |
        $f$的实部在$D$里的一个开圆盘上恒为$0$
      - |
        $f^2$在$D$里的一个开圆盘上恒为$0$
    value: [2, 4]
  hints:
    - |
      唯一性定理要一列互不相同、收敛到$D$中一点的零点，或者一点处的函数值和各阶导数都是$0$。
    - |
      A 只管到二阶导数，试试$(z-a)^3$；C 试试常数$i$。
    - |
      B：$D$是开集，和实轴的公共点附近有一段实轴落在$D$里；D：$f^2=0$就是$f=0$。
  solution: |
    A：不能，$f(z)=(z-a)^3$在$a$处的函数值、一阶和二阶导数都是$0$，却不恒为$0$；B：能，设实数$x_0\in D$，$D$是开集，以$x_0$为圆心的某个开圆盘含在$D$里，其中有一段实轴，在这一段上取一列互不相同、收敛到$x_0$的实数，$f$在这些点上为$0$，由唯一性定理$f$恒为$0$；C：不能，常数函数$f=i$的实部处处为$0$，它却不为$0$；D：能，$f^2=0$推出$f=0$，$f$在这个开圆盘上恒为$0$，由唯一性定理在$D$上恒为$0$。选 B、D。

- id: p3
  tier: medium
  statement: |
    设$f$在$|z|<1$上全纯，并且对一切$n\ge2$，$f\bigl(\frac1n\bigr)=\frac1{n^2+1}$。求$f\bigl(\frac i2\bigr)$。
  answer:
    type: number
    value: -1/3
  hints:
    - |
      把$\frac1{n^2+1}$写成$\frac1n$的式子。
    - |
      $\frac1{n^2+1}=\frac{(1/n)^2}{1+(1/n)^2}$，试试$g(z)=\frac{z^2}{1+z^2}$。
    - |
      $g$在$|z|<1$上全纯，在点$\frac1n$处和$f$相等，这些点收敛到圆盘里的$0$。
  solution: |
    $\frac1{n^2+1}=\frac{(1/n)^2}{1+(1/n)^2}$。$g(z)=\frac{z^2}{1+z^2}$的分母只在$\pm i$处为$0$，所以$g$在$|z|<1$上全纯，并且在点$\frac1n$处和$f$相等；这些点互不相同，收敛到圆盘里的$0$，由唯一性定理，$f=g$。所以$f\bigl(\frac i2\bigr)=\frac{-1/4}{1-1/4}$，即$-\frac13$。

- id: p4
  tier: medium
  statement: |
    求$\sin\frac1z$在$\frac1{10}\le|z|\le1$里的零点个数。
  answer:
    type: number
    value: 6
    exact: true
  hints:
    - |
      $\sin w=0$当且仅当$w=k\pi$，$k$是整数。
    - |
      $\frac1z=k\pi$，$k\ne0$，即$z=\frac1{k\pi}$，$|z|=\frac1{|k|\pi}$。
    - |
      要$1\le|k|\pi\le10$，$k$能取哪些整数？
  solution: |
    由[复变函数与映射](lesson:math.complex-analysis.complex-functions#thm-sin-modulus)一节，$\sin w=0$当且仅当$w=k\pi$，$k$是整数。$\frac1z$不为$0$，所以零点是$z=\frac1{k\pi}$，$k$是非零整数，$|z|=\frac1{|k|\pi}$。条件$\frac1{10}\le\frac1{|k|\pi}\le1$即$1\le|k|\pi\le10$，左边对非零整数总成立，右边要$|k|\le\frac{10}\pi\approx3.18$，所以$k=\pm1,\pm2,\pm3$，共$6$个。这些零点越来越密地挤向$0$，可$0$不在$\sin\frac1z$的定义域里；在这个含在定义域里的有界闭区域里，零点只有有限个。

- id: p5
  tier: hard
  statement: |
    （1）设$f$、$g$在区域$D$上全纯，$f(z)g(z)$在$D$上恒为$0$。证明$f$、$g$中至少有一个在$D$上恒为$0$。

    （2）设$x>0$时$\varphi(x)=e^{-1/x}$，$x\le0$时$\varphi(x)=0$；$\varphi(x)$和$\varphi(-x)$都在整个实轴上无穷次可导（承认这一点）。它们的积是什么？和（1）对照，这说明什么？

    （3）把（1）里的「区域」换成一般的开集，结论还成立吗？
  hints:
    - |
      （1）设$g$不恒为$0$，取一点$a$使$g(a)\ne0$；$g$连续，$a$附近也有$g\ne0$。
    - |
      （1）于是$f$在以$a$为圆心的一个开圆盘上恒为$0$，再用唯一性定理。
    - |
      （2）$\varphi(x)$只在$x>0$处不为$0$，$\varphi(-x)$只在$x<0$处不为$0$。（3）想一想两个不相交的开圆盘。
  reference: |
    （1）设$g$不恒为$0$，取$a\in D$使$g(a)\ne0$。$g$在$a$处连续，所以有以$a$为圆心、含在$D$里的开圆盘$\Delta$，在$\Delta$上$g\ne0$。在$\Delta$上$fg=0$，所以$f=0$；$f$在$D$里的一个开圆盘上恒为常数$0$，由这一节的推论（或唯一性定理），$f$在$D$上恒为$0$。

    （2）$x>0$时$\varphi(-x)=0$，$x<0$时$\varphi(x)=0$，$x=0$时两个都是$0$，所以积处处为$0$；可两个因子都不恒为$0$。无穷次可导的实函数没有（1）的性质：一个因子可以在一边为$0$，另一个在另一边为$0$，接缝处都光滑。

    （3）不成立。设$D$由两个不相交的开圆盘$\Delta_1$、$\Delta_2$组成，令$f$在$\Delta_1$上取$1$、在$\Delta_2$上取$0$，$g$正好反过来，两个都在$D$上全纯，$fg$恒为$0$，可两个都不恒为$0$。（1）的证明用到$D$连成一片：从一个圆盘上恒为$0$推到整个$D$，靠的是唯一性定理。

- id: p6
  tier: hard
  statement: |
    下面的$f$、$g$、$F$都在所说的点附近全纯。

    （1）$a$是$f$的$m$阶零点，是$g$的$k$阶零点。证明$a$是$fg$的$(m+k)$阶零点。

    （2）$a$是$f$的$m$阶零点，$m\ge2$。证明$a$是$f'$的$(m-1)$阶零点。

    （3）$0$是$F$的$m$阶零点，$a$是$g$的$k$阶零点。证明$a$是$F(g(z))$的$mk$阶零点，并求$\sin^2(z^3)$在$0$处零点的阶。
  hints:
    - |
      都写成$z-a$的若干次方乘一个在$a$处不为$0$的全纯函数，再用讲解里「反过来」的那句话。
    - |
      （2）$f=(z-a)^mh$，$f'=(z-a)^{m-1}\bigl(mh+(z-a)h'\bigr)$。
    - |
      （3）$F(w)=w^mH(w)$，$g(z)=(z-a)^kG(z)$，代进去；$\sin w$在$0$处是单零点。
  reference: |
    （1）$f=(z-a)^mh_1$，$g=(z-a)^kh_2$，$h_1$、$h_2$在$a$附近全纯，在$a$处都不为$0$。$fg=(z-a)^{m+k}h_1h_2$，$h_1h_2$全纯，在$a$处不为$0$，所以$a$是$(m+k)$阶零点。

    （2）$f=(z-a)^mh$，$h(a)\ne0$。$f'=m(z-a)^{m-1}h+(z-a)^mh'=(z-a)^{m-1}\bigl(mh+(z-a)h'\bigr)$，括号里的函数全纯，在$a$处等于$mh(a)\ne0$，所以$a$是$f'$的$(m-1)$阶零点。

    （3）$F(w)=w^mH(w)$，$H(0)\ne0$；$g(z)=(z-a)^kG(z)$，$G(a)\ne0$。$g$连续，$g(a)=0$，所以$a$附近$g(z)$落在$F$全纯的范围里，$F(g(z))=(z-a)^{mk}G(z)^mH(g(z))$，$G(z)^mH(g(z))$全纯，在$a$处等于$G(a)^mH(0)\ne0$，所以$a$是$mk$阶零点。$\sin w$在$0$处是单零点（$\sin0=0$，$\cos0=1\ne0$），$z^3$在$0$处是$3$阶零点，所以$\sin(z^3)$在$0$处是$3$阶零点，由（1），$\sin^2(z^3)$在$0$处是$6$阶零点。

- id: p7
  tier: thinking
  statement: |
    复数的三角恒等式可以不展开$e^{iz}$，直接从实数的恒等式推出来。

    （1）已知对实数$x$、$y$，$\cos(x+y)=\cos x\cos y-\sin x\sin y$。固定实数$y$，说明对一切复数$z$，$\cos(z+y)=\cos z\cos y-\sin z\sin y$。

    （2）再固定复数$z$，说明对一切复数$w$，$\cos(z+w)=\cos z\cos w-\sin z\sin w$。

    （3）对实数$x$，$|\sin x|\le1$。照这个办法能推出对复数也成立吗？哪一步走不通？
  hints:
    - |
      （1）两边都是$z$的整函数，在实轴上相等。
    - |
      （2）两边都是$w$的整函数；由（1），$w$取实数时两边相等。
    - |
      （3）唯一性定理比较的是两个全纯函数。$|\sin z|$是全纯函数吗？
  reference: |
    （1）固定实数$y$，$F(z)=\cos(z+y)$和$G(z)=\cos z\cos y-\sin z\sin y$都是整函数（$\cos$、$\sin$是整函数，平移自变量、乘常数、相加以后仍处处全纯）。$z$取实数时，由已知两者相等；实轴上有一列互不相同、收敛到$0$的点，比如$\frac1n$，由唯一性定理，$F=G$处处成立。

    （2）固定复数$z$，$F(w)=\cos(z+w)$和$G(w)=\cos z\cos w-\sin z\sin w$都是$w$的整函数；由（1），$w$是实数时两者相等。同样由唯一性定理，对一切复数$w$两者相等。

    （3）推不出，事实上也不成立：$|\sin(iy)|=|\sinh y|$无界。唯一性定理比较两个全纯函数，结论是它们的差恒为$0$；$|\sin z|$只取实数值、又不是常数，不是全纯函数（见[柯西-黎曼方程与全纯函数](lesson:math.complex-analysis.holomorphic)第 5 题），不等式也不是「某个全纯函数恒为$0$」的形式，所以从实轴推不到别处。

- id: p8
  tier: thinking
  statement: |
    设$f(z)=\sin\frac\pi{1-z}$，$|z|<1$。

    （1）求$f$在$|z|<1$里的全部零点。

    （2）这些零点越来越密地挤向哪一点？这和「不恒为$0$的全纯函数，在含在区域里的有界闭区域里只有有限个零点」矛盾吗？

    （3）不恒为$0$的多项式在整个平面上只有有限个零点。在开圆盘$|z|<1$上全纯、不恒为$0$的函数，能不能有无穷多个零点？一列互不相同的零点如果收敛，极限可能在哪里？
  hints:
    - |
      （1）$\sin w=0$当且仅当$w=k\pi$，$k$是整数。
    - |
      （2）在闭圆盘$|z|\le r$（$r<1$）里有几个零点？
    - |
      （3）极限要是在圆盘里，由唯一性定理会推出什么？
  reference: |
    （1）$\frac\pi{1-z}=k\pi$即$z=1-\frac1k$，$k$是非零整数。$k\le-1$时$z=1+\frac1{|k|}>1$，不在圆盘里，所以零点是$1-\frac1k$（$k=1,2,3,\dots$），即$0,\frac12,\frac23,\frac34,\dots$。

    （2）它们挤向$1$，$1$在圆周$|z|=1$上，不在定义域里。不矛盾：含在$|z|<1$里的有界闭区域$K$上，连续函数$|z|$取得到最大值$r$（最值定理），$r<1$，所以$K$放在闭圆盘$|z|\le r$里，而那里只有满足$1-\frac1k\le r$的有限个零点。

    （3）能，这里的$f$就是例子。一列互不相同的零点收敛到圆盘里一点时，由唯一性定理$f$恒为$0$；所以对不恒为$0$的$f$，这样的极限只能在圆周$|z|=1$上。多项式的零点只有有限个，全纯函数在圆盘里可以有无穷多个零点，可它们收敛时只能往圆周上挤。
