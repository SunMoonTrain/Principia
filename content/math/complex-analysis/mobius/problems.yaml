- id: p1
  tier: easy
  statement: |
    设$T(z)=\frac{z-i}{z+i}$。求$T(1)$，答案依次写实部、虚部。
  answer:
    type: tuple
    value: [0, -1]
  hints:
    - |
      $T(1)=\frac{1-i}{1+i}$。
    - |
      分子分母同乘$1-i$。
    - |
      $(1-i)^2=-2i$。
  solution: |
    $T(1)=\frac{1-i}{1+i}$，分子分母同乘$1-i$，得$\frac{(1-i)^2}{2}=\frac{-2i}2$，即$-i$。实部$0$，虚部$-1$。

- id: p2
  tier: easy
  statement: |
    下列函数中，是分式线性变换的有哪些？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $\frac{2z+1}{z+3}$
      - |
        $\frac{z+1}{2z+2}$
      - |
        $\frac1z$
      - |
        $z^2$
    value: [1, 3]
  hints:
    - |
      要写成$\frac{az+b}{cz+d}$，并且$ad-bc\ne0$。
    - |
      $\frac{z+1}{2z+2}$的$ad-bc$是多少？
    - |
      $z^2$不是一次式之比。
  solution: |
    A：$a=2$、$b=1$、$c=1$、$d=3$，$ad-bc=5\ne0$，是；B：$ad-bc=2-2=0$，它在$z\ne-1$处恒等于$\frac12$，不是；C：$a=0$、$b=1$、$c=1$、$d=0$，$ad-bc=-1\ne0$，是；D：不是一次式之比，也不是一一的。选 A、C。

- id: p3
  tier: medium
  statement: |
    圆$|z-2|=1$在$\frac1z$下的像是一个圆，圆心是实数。求这个圆的圆心和半径（依次填写）。
  answer:
    type: tuple
    value: [2/3, 1/3]
  hints:
    - |
      原来的圆不经过$0$，像是圆；它关于实轴对称，像也关于实轴对称。
    - |
      原来的圆和实轴交于$1$、$3$。
    - |
      $1$、$3$的像$1$、$\frac13$是像圆的一条直径的两端。
  solution: |
    圆$|z-2|=1$不经过$0$，像是圆。原来的圆关于实轴对称，$\frac1{\bar z}=\overline{\bigl(\frac1z\bigr)}$，所以像圆也关于实轴对称，圆心在实轴上，和实轴的两个交点是一条直径的两端。原来的圆和实轴交于$1$、$3$，像是$1$、$\frac13$，所以圆心是$\frac23$，半径是$\frac13$。

- id: p4
  tier: medium
  statement: |
    分式线性变换$T$把$0$、$1$、$\infty$分别映成$i$、$1$、$-1$。求$T(-1)$，答案依次写实部、虚部。
  answer:
    type: tuple
    value: [-3/5, 4/5]
  hints:
    - |
      写出$(w,i,1,-1)=(z,0,1,\infty)$。
    - |
      $(z,0,1,\infty)=z$；$(w,i,1,-1)=\frac{2(w-i)}{(1-i)(w+1)}$。
    - |
      代入$z=-1$，解关于$w$的一次方程。
  solution: |
    $(z,0,1,\infty)$去掉含$\infty$的两个因子，等于$z$；$(w,i,1,-1)=\frac{(w-i)\cdot2}{(w+1)(1-i)}$。令两者相等、$z=-1$：$2(w-i)=-(1-i)(w+1)$，即$(3-i)w=-1+3i$，$w=\frac{(-1+3i)(3+i)}{10}=\frac{-6+8i}{10}$。所以$T(-1)=-\frac35+\frac45i$，它的模是$1$：实轴映成了单位圆周。

- id: p5
  tier: hard
  statement: |
    设$T(z)=\frac{2z+1}{z+2}$。

    （1）求$T$的不动点（满足$T(z)=z$的点）。

    （2）证明：$|z|=1$时$|T(z)|=1$，$|z|<1$时$|T(z)|<1$。

    （3）证明$T$把单位圆盘一一地映成单位圆盘。
  hints:
    - |
      （1）$2z+1=z^2+2z$。
    - |
      （2）比较$|2z+1|^2$和$|z+2|^2$，两者之差是$3(|z|^2-1)$。
    - |
      （3）逆变换是$\frac{2w-1}{-w+2}$，对它做同样的计算。
  reference: |
    （1）$T(z)=z$即$2z+1=z^2+2z$，$z^2=1$，不动点是$\pm1$；$T(\infty)=2\ne\infty$，$\infty$不是不动点。

    （2）$|2z+1|^2=4|z|^2+4\Re z+1$，$|z+2|^2=|z|^2+4\Re z+4$，两者之差是$3(|z|^2-1)$。$|z|=1$时差为$0$，$|T(z)|=1$；$|z|<1$时差为负，$|T(z)|<1$。

    （3）由（2），$T$把单位圆盘映进单位圆盘。逆变换$S(w)=\frac{2w-1}{-w+2}$，同样算出$|2w-1|^2-|2-w|^2=3(|w|^2-1)$，所以$S$也把单位圆盘映进单位圆盘。$T$、$S$互逆，所以$T$把单位圆盘一一地映成单位圆盘。

- id: p6
  tier: hard
  statement: |
    设$|a|<1$，$T(z)=\frac{z-a}{1-\bar az}$。

    （1）证明$|z-a|^2-|1-\bar az|^2=-(1-|z|^2)(1-|a|^2)$。

    （2）由此证明：$|z|=1$时$|T(z)|=1$，$|z|<1$时$|T(z)|<1$。

    （3）证明$T$把单位圆盘一一地映成单位圆盘，并把$a$映成$0$。
  hints:
    - |
      （1）展开：$|z-a|^2=|z|^2-2\Re(\bar az)+|a|^2$。
    - |
      （2）$|z|<1$、$|a|<1$时右边为负。
    - |
      （3）逆变换是$\frac{w+a}{1+\bar aw}$，它和$T$形状相同，$a$换成$-a$。
  reference: |
    （1）$|z-a|^2=|z|^2-2\Re(\bar az)+|a|^2$，$|1-\bar az|^2=1-2\Re(\bar az)+|a|^2|z|^2$，相减得$|z|^2+|a|^2-1-|a|^2|z|^2=-(1-|z|^2)(1-|a|^2)$。

    （2）$|z|=1$时右边为$0$，$|z-a|=|1-\bar az|$，$|T(z)|=1$（$|z|=1$时$1-\bar az\ne0$，因为$|\bar az|<1$）。$|z|<1$时右边为负，$|T(z)|<1$。

    （3）$T(a)=0$。解$w=\frac{z-a}{1-\bar az}$得$z=\frac{w+a}{1+\bar aw}$，这是同样形状的变换（$a$换成$-a$），由（2）也把单位圆盘映进单位圆盘。两者互逆，所以$T$把单位圆盘一一地映成单位圆盘。

- id: p7
  tier: thinking
  statement: |
    （1）分式线性变换的定义里为什么要用到$\infty$？不添$\infty$，哪里不完整？

    （2）证明交比在分式线性变换下不变：$\bigl(T(z),T(z_1),T(z_2),T(z_3)\bigr)=(z,z_1,z_2,z_3)$。

    （3）四个互不相同的点在同一个圆或同一条直线上，当且仅当它们的交比是实数。为什么？
  hints:
    - |
      （1）$\frac1z$把$0$映到哪里？直线$\Re z=1$的像是不是整个圆？
    - |
      （2）$S(z)=(z,z_1,z_2,z_3)$，看$S\circ T^{-1}$把$T(z_1)$、$T(z_2)$、$T(z_3)$映成什么，再用「三点确定一个变换」。
    - |
      （3）交比把经过$z_1$、$z_2$、$z_3$的圆或直线映成经过$0$、$1$、$\infty$的直线。
  reference: |
    （1）不添$\infty$，$\frac1z$在$0$处没有值，$0$也不是任何点的像，它只是去掉$0$的平面到自身的一一映射；直线$\Re z=1$的像是圆$\bigl|w-\frac12\bigr|=\frac12$去掉原点，缺一个点。添上$\infty$，$\frac1z$交换$0$和$\infty$，直线的像是整个圆，定理才能说得干净。

    （2）$S\circ T^{-1}$是分式线性变换，把$T(z_1)$、$T(z_2)$、$T(z_3)$映成$0$、$1$、$\infty$；交比$(w,T(z_1),T(z_2),T(z_3))$也是。由唯一性两者相同，在$w=T(z)$处取值，就是要证的等式。

    （3）$S(z)=(z,z_1,z_2,z_3)$把经过$z_1$、$z_2$、$z_3$的圆或直线映成经过$0$、$1$、$\infty$的圆或直线，也就是实轴（连同$\infty$）；$S$是一一的，所以$z$在这个圆或直线上，当且仅当$S(z)$是实数。

- id: p8
  tier: thinking
  statement: |
    （1）能不能用分式线性变换把单位圆盘映成上半平面？映成一个圆的外部？映成一条带形$\{0<\Im w<1\}$？

    （2）为什么？
  hints:
    - |
      （1）上半平面见例 2；圆的外部试试$\frac1z$。
    - |
      （2）单位圆周映成一个圆或一条直线。
    - |
      （2）带形的边界由几条直线组成？
  reference: |
    （1）前两个能：例 2 的$-i\cdot\frac{z-1}{z+1}$把单位圆盘映成上半平面；$\frac1z$把它映成单位圆的外部（连同$\infty$）。带形不能。

    （2）分式线性变换是扩充复平面上的一一映射，单位圆周映成一个圆或一条直线，圆盘映成它分出的两块之一：一个圆盘、一个圆的外部，或者一个半平面。带形的边界是两条平行直线，不是一个圆或一条直线，所以不可能是圆盘的像。
