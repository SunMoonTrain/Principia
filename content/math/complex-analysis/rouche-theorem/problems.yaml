- id: p1
  tier: easy
  statement: |
    多项式$z^8-7z^6+2$在单位圆盘$|z|<1$里有几个根（重根按重数计）？
  answer:
    type: number
    value: 6
    exact: true
  hints:
    - |
      在单位圆周上比较各项的模：哪一项的模比另外几项的模加起来还大？
    - |
      $|z|=1$时$|-7z^6|=7$，另外两项$|z^8+2|\le1+2=3$。
    - |
      由儒歇定理，这个多项式在单位圆里的根和$-7z^6$一样多；$0$是$-7z^6$的六阶零点，所以有$6$个根。
  solution: |
    单位圆周上$|z^8+2|\le|z|^8+2=3<7=|-7z^6|$。取$f(z)=-7z^6$、$g(z)=z^8+2$，由儒歇定理，$f+g=z^8-7z^6+2$在$|z|<1$里的根和$f$一样多，都按阶计。$f$在圆里只有六阶零点$0$，所以有$6$个根。

- id: p2
  tier: easy
  statement: |
    用儒歇定理数$p(z)=z^4+6z+3$在$|z|<2$里的根，要在圆周$|z|=2$上把$p$写成$f+g$，使处处$|g(z)|<|f(z)|$，再数$f$在圆里的根。$f$取下面哪一个时满足这个条件（$g$是$p$里其余的项）？
  answer:
    type: choice
    multiple: false
    options:
      - |
        $f(z)=z^4$
      - |
        $f(z)=6z$
      - |
        $f(z)=6z+3$
      - |
        $f(z)=3$
    value: 1
  hints:
    - |
      圆周$|z|=2$上，$z^4$、$6z$、$3$的模各是多少？
    - |
      $|z^4|=16$，$|6z|=12$，所以$|6z+3|\le15$，$|z^4+3|\ge16-3=13$。
    - |
      A 中$|g|=|6z+3|\le15<16=|f|$，满足条件；B 中$|g|\ge13>12=|f|$，C 中$|g|=16>15\ge|f|$，D 中$|g|\ge16-12=4>3=|f|$，都不满足。选 A。
  solution: |
    $|z|=2$时$|z^4|=16$，$|6z|=12$。A：$g(z)=6z+3$，$|g|\le12+3=15<16=|f|$，处处成立。B：$g(z)=z^4+3$，$|g|\ge16-3=13>12=|f|$。

    C：$g(z)=z^4$，$|g|=16$，而$|f|=|6z+3|\le15$。D：$g(z)=z^4+6z$，$|g|\ge16-12=4>3=|f|$。所以只有 A 满足，由儒歇定理，$p$在$|z|<2$里的根和$z^4$一样多，是$4$个。选 A。

- id: p3
  tier: medium
  statement: |
    多项式$z^5-6z^2+2$在圆环$1<|z|<2$里有几个根（重根按重数计）？
  answer:
    type: number
    value: 3
    exact: true
  hints:
    - |
      分别数出$|z|<1$和$|z|<2$里的根，再看单位圆周上有没有根。
    - |
      单位圆周上$-6z^2$占上风，$|z|=2$上$z^5$占上风。
    - |
      $|z|=1$时$|z^5+2|\le3<6$，$|z|<1$里有$2$个根，圆周上$|p|\ge6-3>0$，没有根；$|z|=2$时$|-6z^2+2|\le26<32$，$|z|<2$里有$5$个根。圆环里有$5-2=3$个根。
  solution: |
    记$p(z)=z^5-6z^2+2$。单位圆周上$|z^5+2|\le3<6=|-6z^2|$，$-6z^2$在圆里有二阶零点$0$，由儒歇定理，$p$在$|z|<1$里有$2$个根；单位圆周上$|p|\ge6-3=3>0$，没有根。

    $|z|=2$上$|-6z^2+2|\le24+2=26<32=|z^5|$，$z^5$在圆里有五阶零点$0$，所以$p$在$|z|<2$里有$5$个根。相减，圆环$1<|z|<2$里有$5-2=3$个根。

- id: p4
  tier: medium
  statement: |
    方程$e^z=4z^2$在单位圆盘$|z|<1$里有几个根（按阶计）？其中有几个是实数？答案依次填写根的个数和实根的个数。
  answer:
    type: tuple
    value: [2, 2]
    exact: true
  hints:
    - |
      单位圆周上$|e^z|$最大是多少？和$|4z^2|$比一比。
    - |
      $|e^z|=e^{\Re z}\le e<4$。实根看$\varphi(x)=e^x-4x^2$在$-1$、$0$、$1$处的符号。
    - |
      由儒歇定理，$e^z-4z^2$在圆里的根和$-4z^2$一样多，是$2$个。$\varphi(-1)<0$、$\varphi(0)=1>0$、$\varphi(1)=e-4<0$，由零点定理，$(-1,0)$、$(0,1)$里各有一个实根；圆里一共只有$2$个根，所以都是实数。答案是$2$、$2$。
  solution: |
    单位圆周上$|e^z|=e^{\Re z}\le e<4=|-4z^2|$。取$f(z)=-4z^2$、$g(z)=e^z$，由儒歇定理，$e^z-4z^2$在$|z|<1$里的根和$f$一样多；$0$是$f$的二阶零点，所以按阶计有$2$个根。

    令$\varphi(x)=e^x-4x^2$，则$\varphi(-1)=e^{-1}-4<0$，$\varphi(0)=1>0$，$\varphi(1)=e-4<0$，由零点定理，$(-1,0)$、$(0,1)$里各有一个实根。这已经是两个不同的根，而圆里一共只有$2$个根，所以圆里的根都是实数，答案是$2$、$2$。

- id: p5
  tier: hard
  statement: |
    设$p(z)=a_nz^n+\dots+a_1z+a_0$，$n\ge1$，$a_n\ne0$；$q(z)=b_nz^n+\dots+b_1z+b_0$也是复系数多项式，记$\delta=\max\{|b_0-a_0|,|b_1-a_1|,\dots,|b_n-a_n|\}$。

    （1）设$a$是$p$的$m$重根，$r>0$，闭圆盘$|z-a|\le r$里除$a$以外没有$p$的根。证明：有$\delta_0>0$，只要$\delta<\delta_0$，$q$在$|z-a|<r$里就恰有$m$个根（重根按重数计）。

    （2）设$p$的不同的根是$z_1,\dots,z_k$，重数分别是$m_1,\dots,m_k$，$r>0$小于任意两个根之间距离的一半。证明：有$\delta_0>0$，只要$\delta<\delta_0$，$q$的根就全都落在这$k$个开圆盘$|z-z_j|<r$里，并且第$j$个开圆盘里恰有$m_j$个。这就是说，多项式的根随系数连续地变。
  hints:
    - |
      （1）在圆周$|z-a|=r$上把$q$看成$p+(q-p)$，用儒歇定理：要说明$\delta$小时$|q-p|<|p|$。
    - |
      （1）$|p|$在这个圆周上连续、处处为正，有正的最小值$\mu$；圆周上$|z|\le|a|+r$，$|q(z)-p(z)|$不超过$\delta$乘一个只和$|a|+r$、$n$有关的常数。（2）对每个$z_j$用（1）；$q$一共有几个根？
    - |
      （1）记$M=|a|+r$，$K=1+M+\dots+M^n$，圆周上$|q-p|\le\delta K$；取$\delta_0=\frac\mu K$，$\delta<\delta_0$时$|q-p|<|p|$，由儒歇定理，$q$在$|z-a|<r$里的根和$p$一样多，是$m$个。（2）闭圆盘$|z-z_j|\le r$两两不相交，每个里只有$p$的一个根，对每个$j$用（1），取所得的$\delta_0$里最小的一个，再让它不超过$|a_n|$。这时$b_n\ne0$，由代数基本定理，$q$一共有$n$个根，这些开圆盘里已经有$m_1+\dots+m_k=n$个，所以圆盘外面没有根。
  reference: |
    （1）$p$在闭圆盘$|z-a|\le r$里只有根$a$，在圆周$|z-a|=r$上不为$0$。把圆周写成$z=a+re^{it}$（$0\le t\le2\pi$），$|p|$是$t$的连续函数、处处为正，由最值定理有正的最小值$\mu$。圆周上$|z|\le|a|+r=M$，所以$|q(z)-p(z)|\le|b_n-a_n||z|^n+\dots+|b_0-a_0|\le\delta(M^n+\dots+M+1)$，记右边为$\delta K$。

    取$\delta_0=\frac\mu K$。$\delta<\delta_0$时，圆周上$|q-p|\le\delta K<\mu\le|p|$；$p$、$q-p$都是多项式，在整个平面上全纯，由儒歇定理，$q=p+(q-p)$在$|z-a|<r$里的零点个数（按阶计）和$p$相同。$p$在这个开圆盘里只有$m$重根$a$，即$m$阶零点，所以$q$在里面恰有$m$个根，重根按重数计。

    （2）任意两个根的距离都大于$2r$，所以闭圆盘$|z-z_j|\le r$两两不相交，第$j$个里只有$p$的根$z_j$。对每个$j$用（1），得到$\delta_j$；取$\delta_0=\min\{\delta_1,\dots,\delta_k,|a_n|\}$。$\delta<\delta_0$时，第$j$个开圆盘里恰有$q$的$m_j$个根；$|b_n|\ge|a_n|-\delta>0$，$q$是$n$次多项式，由代数基本定理一共有$n$个根（重根按重数计）。这些开圆盘两两不相交，里面一共已经有$m_1+\dots+m_k=n$个根，所以$q$在圆盘外面没有根。

- id: p6
  tier: hard
  statement: |
    （1）设$f$在一个包含闭圆盘$|z|\le1$的开集上全纯，在单位圆周上处处$|f(z)|<1$。证明：$f$在$|z|<1$里恰有一个不动点（fixed point），即恰有一点$z_0$使$f(z_0)=z_0$。

    （2）设$\lambda>1$。证明：方程$ze^{\lambda-z}=1$在$|z|<1$里恰有一个根，并且这个根是$(0,1)$里的实数。
  hints:
    - |
      （1）不动点就是$f(z)-z$的零点。在单位圆周上，$f(z)$和$-z$哪个的模大？
    - |
      （1）在儒歇定理里让$-z$当占上风的那个函数，题里的$f$当另一个；$-z$在圆里只有单零点（simple zero）$0$。（2）方程两边乘$e^{z-\lambda}$，改写成$z=e^{z-\lambda}$。
    - |
      （1）由儒歇定理，$f(z)-z$在圆里的零点按阶计恰有一个，所以只有一点，而且是单零点。（2）$|e^{z-\lambda}|=e^{\Re z-\lambda}\le e^{1-\lambda}<1$，由（1）恰有一个根；$\varphi(x)=x-e^{x-\lambda}$满足$\varphi(0)<0$、$\varphi(1)=1-e^{1-\lambda}>0$，由零点定理，$(0,1)$里有一个根，它就是那个根。
  reference: |
    （1）不动点就是$f(z)-z$的零点。单位圆周上$|f(z)|<1=|-z|$；$-z$和$f$都在包含闭圆盘的开集上全纯，由儒歇定理（占上风的取$-z$，另一个取$f$），$-z+f(z)$在$|z|<1$里的零点个数（按阶计）和$-z$相同。$-z$在圆里只有单零点$0$，所以$f(z)-z$在圆里的零点按阶计恰有一个：只有一点$z_0$，而且它是单零点。

    （2）$e^{z-\lambda}$永不为$0$，方程两边乘它，$ze^{\lambda-z}=1$等价于$z=e^{z-\lambda}$。$g(z)=e^{z-\lambda}$是整函数，单位圆周上$|g(z)|=e^{\Re z-\lambda}\le e^{1-\lambda}<1$，由（1），$g$在$|z|<1$里恰有一个不动点，即原方程在$|z|<1$里恰有一个根。令$\varphi(x)=x-e^{x-\lambda}$，$\varphi(0)=-e^{-\lambda}<0$，$\varphi(1)=1-e^{1-\lambda}>0$，由零点定理，$(0,1)$里有$\varphi$的零点，它是原方程在$|z|<1$里的根；根只有一个，所以就是它，是$(0,1)$里的实数。

- id: p7
  tier: thinking
  statement: |
    （1）设$C$是单位圆周，取$f(z)=2z$、$g(z)=-(z+1)$。$C$上$|g|\le|f|$成立吗？等号在哪里成立？$f+g$和$f$在单位圆里的零点一样多吗？

    （2）儒歇定理的证明里，条件$|g|<|f|$用在了哪里？它其实只是保证了$h=\frac{f+g}f$在$C$附近的值有什么性质？

    （3）设$F$、$G$在一个包含分段光滑的简单闭曲线$C$和它围成的部分的开集上全纯，在$C$上处处$|F-G|<|F|+|G|$。照（2）的想法说明：$F$、$G$在$C$里面的零点一样多（按阶计）。儒歇定理是它的特例吗？
  hints:
    - |
      （1）$|z+1|$在单位圆周上最大是多少，在哪里取到？$f+g$等于什么？（2）看证明里哪一步用了$\Re h>0$。
    - |
      （1）$f+g=z-1$。（2）$\Log h$要在$C$附近全纯。（3）设$\frac FG=-s$，$s\ge0$，算一算$|F-G|$。
    - |
      （1）$|g|=|z+1|\le2=|f|$，只在$z=1$处取等号；$f+g=z-1$的零点$1$在圆周上，圆里没有零点，$f$却有一个，不一样多。（2）它保证$f$、$f+g$在$C$上不为$0$，并且$h$在$C$附近的值不落在$(-\infty,0]$上，从而$\Log h$全纯，$\oint_C\frac{h'}h\,\dd z=0$；前一条其实也包含在后一条里。（3）$F$、$G$在$C$上都不为$0$（比如$F=0$时不等式变成$|G|<|G|$），$\frac FG$也不是负实数或$0$：否则$F=-sG$，$s\ge0$，$|F-G|=(1+s)|G|=|F|+|G|$；照儒歇定理的证明，用$\frac FG$代替$h$即得。取$F=f+g$、$G=f$，$C$上$|F-G|=|g|<|f|\le|F|+|G|$，儒歇定理正是它的特例。
  reference: |
    （1）单位圆周上$|g|=|z+1|\le|z|+1=2=|f|$，等号只在$z$和$1$同方向，即$z=1$时成立。$f+g=z-1$，零点$1$在圆周上，圆里没有零点；$f=2z$在圆里有零点$0$。所以不一样多：只在一点取等号，结论就不对了，$f+g$的零点正好跑到了$C$上。

    （2）证明里$|g|<|f|$用了两次：保证$f$、$f+g$在$C$上不为$0$（辐角原理要这一条），以及在$C$附近$\Re h>0$。后一条只是为了让$h$的值避开原点和负实轴，$\Log h$才全纯，$\frac{h'}h$有原函数，沿$C$的积分为$0$；$h$在$C$附近有定义、值不落在$(-\infty,0]$上，本身就包含了$f$、$f+g$在$C$上不为$0$。换句话说，要的是像曲线$h(C)$不绕原点。

    （3）$C$上$F\ne0$：否则不等式变成$|G|<|G|$；同样$G\ne0$。$\frac FG$不是负实数或$0$：否则$F=-sG$，$s\ge0$，$|F-G|=(1+s)|G|=|F|+|G|$，和条件矛盾。令$U$是开集里满足$|F-G|<|F|+|G|$的点组成的集合，由连续性它是包含$C$的开集，在上面$F$、$G$都不为$0$，$H=\frac FG$全纯，值不落在$(-\infty,0]$上；所以$\Log H$全纯，导数$\frac{H'}H=\frac{F'}F-\frac{G'}G$在$U$上连续（$H'$也全纯），$\oint_C\frac{H'}H\,\dd z=0$。由辐角原理，$F$、$G$在$C$里面的零点一样多。

    儒歇定理是它的特例：取$F=f+g$、$G=f$，$C$上$|F-G|=|g|<|f|=|G|\le|F|+|G|$。

- id: p8
  tier: thinking
  statement: |
    设$p(z)=a_nz^n+\dots+a_1z+a_0$，$n\ge1$，$a_n\ne0$。[刘维尔定理与代数基本定理](lesson:math.complex-analysis.liouville)一节、[平均值性质与最大模原理](lesson:math.complex-analysis.maximum-modulus)一节第 6 题和本节，用三种办法证明了$p$有根。

    （1）三个证明各自直接得出了什么：至少有一个根，恰好有$n$个根，还是根落在哪个圆盘里？

    （2）前两个证明都是反证法，为什么只能推出「有根」，要知道有$n$个根还得一次次提出一次因式？儒歇定理的证明为什么一步就数出了个数？

    （3）设$\rho>0$，把$p$换成$a_nz^n+g(z)$，$g$是整函数（entire function），只知道在圆周$|z|=\rho$上$|g|<|a_n|\rho^n$。三个证明里，哪一个照样能说明它在$|z|<\rho$里恰有$n$个零点？刘维尔定理的那个证明还能用吗？
  hints:
    - |
      （1）回头看三个证明最后各推出了什么。
    - |
      （2）反证法推翻的是「没有根」；要数个数，得有一个能把零点个数算出来的式子。（3）刘维尔定理的证明要用$p$在某个圆外处处满足$|p(z)|\ge\frac{|a_n|}2|z|^n$。
    - |
      （1）刘维尔定理的证明：至少有一个根，$n$个根靠提出因式，证明里的估计还说明根都在$|z|<\rho$里；最小模（minimum modulus）的证明：取的圆盘里至少有一个根；儒歇定理的证明：$|z|<\rho$里恰好有$n$个根。（2）反证法只从「没有根」推出矛盾，不碰个数；儒歇定理背后是辐角原理，$\frac1{2\pi i}\oint\frac{p'}p\,\dd z$本身就是零点个数，和$a_nz^n$一比就数出来了。（3）儒歇定理的证明一字不改，$|z|<\rho$里恰有$n$个零点，只是圆外它不管。刘维尔定理的证明要$\frac1{a_nz^n+g}$在$|z|\ge\rho$时有界，只凭圆周上的不等式推不出来，用不上。
  reference: |
    （1）刘维尔定理的证明：假设没有根，$\frac1p$是有界的整函数，推出矛盾，所以至少有一个根；恰好$n$个根要一次次提出一次因式才得到。证明里的估计$|z|\ge\rho$时$|p(z)|\ge\frac{|a_n|}2|z|^n>0$还说明根都在$|z|<\rho$里，但不说那里有几个。最小模的证明：取$\rho'$使圆周$|z|=\rho'$上$|p|>|p(0)|$，$|p|$在闭圆盘上的最小值在圆里取到，假如圆里没有根就推出$p$是常数，所以圆盘$|z|<\rho'$里至少有一个根，也不说几个。儒歇定理的证明：$|z|<\rho$里恰好有$n$个根（按重数计），圆外没有，个数和范围一起得到。

    （2）反证法只能推翻「没有根」这一个假设，结论里自然只有「有根」；要数个数，得一次次提出因式，对次数更低的多项式再用一次。儒歇定理背后是辐角原理：$\frac1{2\pi i}\oint_{|z|=\rho}\frac{p'}p\,\dd z$本身就是圆里的零点个数，一个整数；和$a_nz^n$的同一个积分比较，后者显然是$n$。这是「数」零点，不是「找」零点。

    （3）儒歇定理的证明只用到圆周$|z|=\rho$上$|g|<|a_nz^n|$，一字不改：$a_nz^n+g$在$|z|<\rho$里恰有$n$个零点。圆外它什么也不说，整函数在圆外还可以有零点：例如$z^2+\frac{e^z}{100}$，$|z|=3$上$\bigl|\frac{e^z}{100}\bigr|\le\frac{e^3}{100}<1<9$，$|z|<3$里恰有$2$个零点（都在$0$附近，约$-0.005\pm0.0996i$），可它在$9.22\pm3.95i$附近还有零点（数值验算）。刘维尔定理的证明要$\frac1{a_nz^n+g}$在$|z|\ge\rho$上有界，这对多项式靠的是所有$|z|\ge\rho$上的估计，对一般的整函数$g$只知道圆周上的一个不等式，推不出来，证明用不上；最小模的证明也只能给出「圆里至少有一个零点」（还要先验证圆周上$|a_nz^n+g|>|g(0)|$）。
