- id: p1
  tier: easy
  statement: |
    求$|z^2+2z|$在闭圆盘$|z|\le1$上的最大值。
  answer:
    type: number
    value: 3
  hints:
    - |
      $z^2+2z$是整函数，最大值在圆周上取到。
    - |
      圆周上$|z^2+2z|=|z|\cdot|z+2|$，即$|z+2|$。
    - |
      单位圆周上哪一点离$-2$最远？
  solution: |
    由圆盘上的估计，最大值在圆周$|z|=1$上取到。圆周上$|z^2+2z|=|z|\cdot|z+2|$，即$|z+2|$，也就是$z$到$-2$的距离，在$z=1$处最大，为$3$。

- id: p2
  tier: easy
  statement: |
    设$f$在区域$D$上全纯，不是常数。下列说法中正确的有哪些？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $|f|$能在$D$里取到最大值
      - |
        $|f|$不能在$D$里取到最小值
      - |
        $\Re f$不能在$D$里取到最大值
      - |
        设$z_0\in D$，开圆盘$|z-z_0|<R$含在$D$里。则每个圆周$|z-z_0|=r$（$0<r<R$）上都有点$z$使$|f(z)|\ge|f(z_0)|$
    value: [3, 4]
  hints:
    - |
      A 用最大模原理；D 用平均值性质：$|f(z_0)|$不超过$|f|$在圆周上的平均值。
    - |
      有零点时，$|f|$的最小值可以是$0$。
    - |
      $\Re f$调和；$f$不是常数时$\Re f$也不是常数。
  solution: |
    A：错，由最大模原理，取到就是常数；B：错，$f(z)=z$在单位圆盘里，$|f|$在$0$处取到最小值$0$；C：对，$\Re f$调和，$\Re f$是常数时由柯西-黎曼方程$f'=0$，$f$是常数，所以$\Re f$不是常数，由调和函数的最大值原理取不到最大值；D：对，由平均值性质，$|f(z_0)|\le\frac1{2\pi}\int_0^{2\pi}|f(z_0+re^{it})|\dd t$，要是圆周上处处$|f(z)|<|f(z_0)|$，右边这个连续函数的平均值就小于$|f(z_0)|$，矛盾。选 C、D。

- id: p3
  tier: medium
  statement: |
    求$|e^{z^2}|$在闭圆盘$|z|\le1$上的最大值。
  answer:
    type: number
    value: e
  hints:
    - |
      $|e^w|=e^{\Re w}$。
    - |
      最大值在圆周上取到；圆周上$z^2=e^{2it}$。
    - |
      $\Re e^{2it}=\cos2t$。
  solution: |
    $e^{z^2}$是整函数，最大值在圆周上取到。圆周上$z=e^{it}$，$|e^{z^2}|=e^{\Re e^{2it}}=e^{\cos2t}$，在$t=0$、$\pi$即$z=\pm1$处最大，为$e$。

- id: p4
  tier: medium
  statement: |
    求$\int_0^{2\pi}\ln|3+e^{it}|\,\dd t$。
  answer:
    type: number
    value: 2*pi*ln(3)
  hints:
    - |
      $\ln|3+z|$在哪里调和？
    - |
      它是$\Log(3+z)$的实部，在$|z|<3$上调和。
    - |
      平均值性质：圆心$0$处的值是$\ln3$。
  solution: |
    $|z|<3$时$3+z$的实部为正，$\Log(3+z)$全纯，它的实部$\ln|3+z|$调和。由平均值性质（圆心$0$，$r=1$），$\frac1{2\pi}\int_0^{2\pi}\ln|3+e^{it}|\dd t=\ln3$，所以积分是$2\pi\ln3$。

- id: p5
  tier: hard
  statement: |
    设$f$在单位圆盘$|z|<1$上全纯，处处$|f(z)|\le1$，并且$f(0)=0$。

    （1）令$z\ne0$时$g(z)=\frac{f(z)}z$，$g(0)=f'(0)$。证明$g$在单位圆盘上全纯。

    （2）证明：$|z|<1$时$|f(z)|\le|z|$，并且$|f'(0)|\le1$。

    （3）如果某个$z_0\ne0$使$|f(z_0)|=|z_0|$，$f$是什么样的？
  hints:
    - |
      （1）$g$在$0$处连续、别处全纯，用[高阶导数与莫雷拉定理](lesson:math.complex-analysis.higher-derivatives)第 8 题。
    - |
      （2）在圆周$|z|=r$（$r<1$）上$|g|\le\frac1r$，用圆盘上的估计，再让$r\to1$。
    - |
      （3）$|g(z_0)|=1$是$|g|$的最大值。
  reference: |
    （1）$z\to0$时$\frac{f(z)-f(0)}{z-0}\to f'(0)$，所以$g$在$0$处连续，在别处是全纯函数的商，全纯。由高阶导数与莫雷拉定理一节第 8 题（连续、除一点外全纯就全纯），$g$在单位圆盘上全纯。

    （2）取定$z$，对$|z|<r<1$，$g$在半径大于$r$的圆盘$|w|<1$上全纯，圆周$|w|=r$上$|g|\le\frac1r$，由圆盘上的估计$|g(z)|\le\frac1r$。令$r\to1$，$|g(z)|\le1$，即$|f(z)|\le|z|$；$z=0$时得$|f'(0)|\le1$。

    （3）$|g(z_0)|=1$，而$|g|\le1$，$|g|$在圆盘里的$z_0$处取到最大值，由最大模原理$g$是常数$c$，$|c|=1$。所以$f(z)=cz$，是一个旋转。

- id: p6
  tier: hard
  statement: |
    （1）设$f$在区域$D$上全纯、处处不为$0$，$|f|$在$D$里某点取到最小值。证明$f$是常数。

    （2）用（1）再证一次代数基本定理（[刘维尔定理与代数基本定理](lesson:math.complex-analysis.liouville)一节用刘维尔定理证过）：设$p$是次数$n\ge1$的复系数多项式，假如$p$没有根，取$\rho$使圆周$|z|=\rho$上处处$|p(z)|>|p(0)|$，说明$|p|$在开圆盘$|z|<\rho$里取到它在闭圆盘$|z|\le\rho$上的最小值，从而得出矛盾。
  hints:
    - |
      （1）看$\frac1f$。
    - |
      （2）$|z|\to\infty$时$|p(z)|\to+\infty$，所以这样的$\rho$存在。
    - |
      （2）闭圆盘是有界闭区域，用多变量微积分的最值定理。
  reference: |
    （1）$\frac1f$在$D$上全纯，$|f|$的最小值点是$\bigl|\frac1f\bigr|$的最大值点，由最大模原理$\frac1f$是常数，$f$也是。

    （2）设$p(z)=a_nz^n+\dots+a_0$，$a_n\ne0$，记$A=|a_0|+\dots+|a_{n-1}|$。$|z|\ge1$时$|p(z)|\ge|a_n||z|^n-A|z|^{n-1}$，$|z|\to\infty$时趋于$+\infty$，所以能取$\rho$使圆周$|z|=\rho$上$|p(z)|>|p(0)|$。$|p|$在闭圆盘上连续，由最值定理取到最小值；最小值不超过$|p(0)|$，比圆周上的值都小，所以在开圆盘里取到。假如$p$没有根，由（1），$p$在开圆盘上是常数，和次数$n\ge1$矛盾。

- id: p7
  tier: thinking
  statement: |
    平板占据闭圆盘$|z|\le1$，内部不再随时间变化的温度$u$调和，并在闭圆盘上连续。

    （1）边界上的温度都在$0$到$100$之间。内部的温度呢？

    （2）两个这样的温度分布$u_1$、$u_2$在边界上相同。证明它们处处相同。
  hints:
    - |
      （1）调和函数的最大值、最小值原理，加上最值定理。
    - |
      （2）$u_1-u_2$调和，边界上为$0$。
    - |
      （2）它的最大值、最小值都是$0$。
  reference: |
    （1）$u$在闭圆盘上连续，由最值定理取到最大值和最小值。如果最大值在内部取到，由调和函数的最大值原理，$u$在开圆盘上是常数，再由连续性在闭圆盘上也是这个常数，边界上也取到；所以最大值总能在边界上取到，不超过$100$。同样最小值不小于$0$，内部的温度都在$0$到$100$之间。

    （2）$w=u_1-u_2$调和，在闭圆盘上连续，边界上为$0$。由（1）的道理，$w$的最大值、最小值都在边界上取到，都是$0$，所以$w$处处为$0$。边界上的温度决定了内部的温度。

- id: p8
  tier: thinking
  statement: |
    （1）$f(z)=e^{-iz}$。求$|f|$在实轴上的值和在上半平面里的值。

    （2）这和「最大值在边界上取到」矛盾吗？

    （3）在有界区域上，为什么不会出现这种情况？
  hints:
    - |
      （1）$z=x+iy$时$-iz=y-ix$。
    - |
      （2）上半平面里$|f|$有没有最大值？
    - |
      （3）有界闭区域上连续函数一定取到最大值。
  reference: |
    （1）$|e^{-iz}|=e^{\Re(-iz)}=e^y$。实轴上处处是$1$，上半平面里$y>0$，$|f|>1$，$y\to+\infty$时无界。

    （2）不矛盾。最大模原理说的是：$|f|$在区域里取到最大值时$f$是常数。上半平面里$|f|$根本没有最大值，这条结论管不到它；边界上有界推出内部有界，要靠「闭区域上一定取到最大值」，而上半平面连同实轴不是有界闭区域。

    （3）有界区域连同边界是有界闭区域，$|f|$在上面连续就一定取到最大值；最大值不在内部取到就在边界上取到，所以内部的值不超过边界上的最大值。
