- id: p1
  tier: easy
  statement: |
    $u$在整个平面上可微，满足$u_t+3u_x=0$和$u(x,0)=e^{-x^2}$。求$u(5,1)$。
  answer:
    type: number
    value: exp(-4)
  hints:
    - |
      这是$c=3$的:term[输运方程]{id="math.pde.transport-equation"}，解沿特征线$x-3t=$常数不变。
    - |
      由定理 1，$u(x,t)=\varphi(x-3t)$，$\varphi(x)=e^{-x^2}$。过$(5,1)$的特征线在$t=0$时经过哪一点？
    - |
      过$(5,1)$的特征线是$x-3t=2$，在$t=0$时经过$x=2$，所以$u(5,1)=\varphi(2)=e^{-4}$。
  solution: |
    由定理 1，$u(x,t)=e^{-(x-3t)^2}$：初始的形状以速度$3$向右平移。过$(5,1)$的特征线$x-3t=2$在$t=0$时经过$x=2$，所以$u(5,1)=e^{-4}\approx0.0183$。

- id: p2
  tier: easy
  statement: |
    关于方程$u_t-2u_x=0$在整个平面上的可微解，下列说法中，正确的有哪些？
  answer:
    type: choice
    multiple: true
    options:
      - |
        方程的特征线是直线$x-2t=$常数
      - |
        每个解的图像都以速度$2$向左平移，形状不变
      - |
        若$u(x,0)=\varphi(x)$，则$u(1,3)=\varphi(7)$
      - |
        每个解都满足$u(x,t)=u(x,0)$
      - |
        $u=\sin(x+2t)+5$是一个解
    value: [2, 3, 5]
  hints:
    - |
      把方程写成$u_t+cu_x=0$的样子，$c$等于多少？
    - |
      $c=-2$，特征线是$x+2t=$常数，可微解都是$\varphi(x+2t)$的样子，$\varphi(x)=u(x,0)$。
    - |
      A：$x-2t=$常数是$u_t+2u_x=0$的特征线，和$x+2t=$常数不是同一族直线，不对。B：$\varphi(x+2t)$的图像是$\varphi$的图像向左平移$2t$，形状不变，对。C：过$(1,3)$的特征线是$x+2t=7$，在$t=0$时经过$x=7$，所以$u(1,3)=\varphi(7)$，对。

      D：$\varphi(x)=x$时$u=x+2t$，$u(0,1)=2$，$u(0,0)=0$，不对。E：$u_t=2\cos(x+2t)$，$u_x=\cos(x+2t)$，$u_t-2u_x=0$，对。选 B、C、E。
  solution: |
    方程是$c=-2$的:term[输运方程]{id="math.pde.transport-equation"}，特征线是$x+2t=$常数，可微解是$u(x,t)=\varphi(x+2t)$，$\varphi(x)=u(x,0)$。A：$x-2t=$常数是$u_t+2u_x=0$的特征线，不对。B：$\varphi(x+2t)$是把$\varphi$的图像向左平移$2t$，对。

    C：过$(1,3)$的特征线$x+2t=7$在$t=0$时经过$x=7$，所以$u(1,3)=\varphi(7)$，对。D：$\varphi$不是常数时不成立，例如$\varphi(x)=x$时$u=x+2t$，$u(0,1)=2\ne u(0,0)$，不对。E：$u_t=2\cos(x+2t)$，$u_x=\cos(x+2t)$，$u_t-2u_x=0$，对。选 B、C、E。

- id: p3
  tier: medium
  statement: |
    $u$在整个平面上可微，满足$u_t+2u_x+u=e^{-t}$和$u(x,0)=x^2$。求$u(3,1)$。
  answer:
    type: number
    value: 2*exp(-1)
  hints:
    - |
      特征线只看$u_t$、$u_x$的系数，和$u_t+2u_x=0$的一样，是$x=x_0+2t$。沿它记$U(t)=u(x_0+2t,t)$。
    - |
      $U'=u_t+2u_x=e^{-t}-U$，即$U'+U=e^{-t}$，$U(0)=x_0^2$。乘积分因子$e^t$。
    - |
      $(e^tU)'=1$，所以$e^tU(t)=x_0^2+t$，$U(t)=e^{-t}(x_0^2+t)$。过$(3,1)$的特征线从$x_0=3-2=1$出发，代入$t=1$，得$u(3,1)=e^{-1}(1+1)=\frac2e\approx0.7358$。
  solution: |
    沿特征线$x=x_0+2t$，$U(t)=u(x_0+2t,t)$满足$U'=u_t+2u_x=e^{-t}-U$，即$U'+U=e^{-t}$，$U(0)=x_0^2$。乘上积分因子$e^t$，得$(e^tU)'=1$，所以$e^tU(t)=x_0^2+t$。

    代回$x_0=x-2t$，$u(x,t)=e^{-t}\bigl((x-2t)^2+t\bigr)$。过$(3,1)$的特征线从$x_0=1$出发，所以$u(3,1)=e^{-1}(1+1)=\frac2e\approx0.7358$。

- id: p4
  tier: medium
  statement: |
    在去掉原点的平面上，$u$可微，满足$yu_x-xu_y=0$，并且$u(x,0)=\ln x$（$x>0$）。求$u(3,4)$。
  answer:
    type: number
    value: log(5)
  hints:
    - |
      $a=y$、$b=-x$，特征线满足$\dv xs=y$、$\dv ys=-x$。沿特征线，$x^2+y^2$怎样变？
    - |
      $\dv{}{s}(x^2+y^2)=2xy-2yx=0$，特征线是以原点为圆心的圆，和[恰当方程](lesson:math.ode.exact-equations)一节开头$x\dd x+y\dd y=0$的那族圆一样。$u$沿每个圆不变。
    - |
      圆$x^2+y^2=r^2$和$x$轴的正半轴恰好交于一点$(r,0)$，所以$u(x,y)=u(r,0)=\ln r$，即$u=\frac12\ln(x^2+y^2)$。代入$(3,4)$，得$u(3,4)=\frac12\ln25=\ln5\approx1.609$。
  solution: |
    特征线满足$\dv xs=y$、$\dv ys=-x$，沿它$\dv{}{s}(x^2+y^2)=2xy-2yx=0$，所以特征线是以原点为圆心的圆，可微解$u$沿每个圆不变。

    圆$x^2+y^2=r^2$和$x$轴的正半轴恰好交于一点$(r,0)$，所以$u(x,y)=u(r,0)=\ln r=\frac12\ln(x^2+y^2)$，它在去掉原点的平面上可微，满足方程。这正是定理 2 里的$F(\Phi)$：$\Phi=x^2+y^2$，$F(w)=\frac12\ln w$。所以$u(3,4)=\frac12\ln25=\ln5\approx1.609$。

- id: p5
  tier: hard
  statement: |
    在半平面$x>0$上，$u$可微，满足$xu_x+yu_y=ku$，$k$是常数。这是齐次（homogeneous）的:term[线性偏微分方程]{id="math.pde.linear-pde"}，「齐次」指没有不含$u$及其偏导数的项；下面的「$k$次齐次函数」（homogeneous function）是另一个意思，指对一切$t>0$都有$f(tx,ty)=t^kf(x,y)$的函数。

    （1）求这个方程的特征线。

    （2）证明$u(x,y)=x^kF\bigl(\frac yx\bigr)$，其中$F$是一个可导的一元函数。

    （3）由此证明$u$是$k$次齐次函数。这是[多元复合函数的链式法则](lesson:math.vector-calculus.multivariable-chain-rule)第 6 题的逆命题。
  hints:
    - |
      （1）$a=x$、$b=y$，特征线满足$\dv xs=x$、$\dv ys=y$，$\frac yx$沿它怎样变？（2）沿特征线，$u$满足什么常微分方程？
    - |
      （1）$\frac yx$沿特征线不变，特征线是从原点出发的射线$y=mx$。（2）固定$m$，记$U(x)=u(x,mx)$，由链式法则$xU'(x)=xu_x+yu_y=kU$，再用积分因子解它。
    - |
      （1）由$\dv xs=x$、$\dv ys=y$，$\dv{}{s}\frac yx=\frac{xy-yx}{x^2}=0$，所以$\frac yx=m$沿特征线不变，$m$是常数；又由$\dv xs=x$得$x=x_1e^s$，取遍$(0,+\infty)$，所以特征线是整条射线$y=mx$（$x>0$）。

      （2）固定$m$，记$U(x)=u(x,mx)$。由链式法则，$U'(x)=u_x+mu_y$，乘以$x$得$xU'=xu_x+yu_y=kU$，即$U'-\frac kxU=0$。乘积分因子$x^{-k}$，得$(x^{-k}U)'=0$，所以$x^{-k}U(x)=U(1)=u(1,m)$。记$F(m)=u(1,m)$，$u$可微，所以$F$可导，于是$u(x,mx)=x^kF(m)$，即$u(x,y)=x^kF\bigl(\frac yx\bigr)$。

      （3）$t>0$时$(tx,ty)$仍在半平面里，$u(tx,ty)=(tx)^kF\bigl(\frac{ty}{tx}\bigr)=t^kx^kF\bigl(\frac yx\bigr)=t^ku(x,y)$，所以$u$是$k$次齐次函数。第 6 题证的是反方向：可微的$k$次齐次函数满足$xu_x+yu_y=ku$。两题合起来，在$x>0$上，可微函数满足这个方程，当且仅当它是$k$次齐次函数。
  reference: |
    （1）$a=x$、$b=y$。沿特征线$\dv{}{s}\frac yx=\frac{x\cdot y-y\cdot x}{x^2}=0$，$\frac yx=m$不变；$x=x_1e^s$取遍$(0,+\infty)$，特征线是射线$y=mx$（$x>0$）。

    （2）$U(x)=u(x,mx)$，$U'=u_x+mu_y$，$xU'=xu_x+yu_y=kU$。乘积分因子$x^{-k}$得$(x^{-k}U)'=0$，$U(x)=x^kU(1)$。令$F(m)=u(1,m)$（$u$可微，$F$可导），得$u(x,y)=x^kF\bigl(\frac yx\bigr)$。

    （3）$t>0$时$u(tx,ty)=t^kx^kF\bigl(\frac yx\bigr)=t^ku(x,y)$。和第 6 题合起来：在$x>0$上，可微函数满足$xu_x+yu_y=ku$当且仅当它是$k$次齐次函数。

- id: p6
  tier: hard
  statement: |
    河道从$x=0$处开始，水以速度$c>0$流动。$t=0$时河里的浓度是$u(x,0)=\varphi(x)$（$x>0$），此后入口处流进来的水的浓度是$u(0,t)=g(t)$（$t>0$），$\varphi$、$g$都可导。在$x>0$、$t>0$的范围里解$u_t+cu_x=0$。

    （1）分$x>ct$、$x<ct$两部分写出解。

    （2）设$x\to0^+$时$\varphi(x)$的极限和$t\to0^+$时$g(t)$的极限都存在。解在直线$x=ct$两侧要能连起来，需要什么条件？

    （3）如果$c<0$，水往左流，$x=0$处成了出口，为什么不能再任意给定$u(0,t)$？
  hints:
    - |
      解沿特征线不变。过$(x,t)$的特征线往回走（$t$减小），先碰到$t=0$还是先碰到$x=0$？
    - |
      $x>ct$时，它在$t=0$时经过$x$轴上的$x-ct>0$；$x<ct$时，它在$t-\frac xc>0$时刻经过入口$x=0$。（3）$c<0$时，往回走的特征线会不会碰到$x=0$？
    - |
      （1）解沿特征线不变。$x>ct$时，过$(x,t)$的特征线往回走，在$t=0$时经过$x-ct>0$，所以$u=\varphi(x-ct)$；$x<ct$时，它在$t-\frac xc>0$时刻经过入口，所以$u=g\bigl(t-\frac xc\bigr)$。两部分都可微，都满足方程：$g\bigl(t-\frac xc\bigr)$也是$x-ct$的函数。

      （2）从右边趋近直线$x=ct$上的一点时，$u=\varphi(x-ct)$趋于$\varphi$在$0$处的右极限（right-hand limit）；从左边趋近时，$u=g\bigl(t-\frac xc\bigr)$趋于$g$在$0$处的右极限。两侧能连起来，当且仅当这两个极限相等：开始时入口流进来的浓度，和河里紧挨入口处的浓度一样。两侧的导数也接上时，解在这条直线上才可微。

      （3）$c<0$时特征线是$x=x_0+ct$，$t$减小时$x$增大，所以过$(x,t)$的特征线往回走时一直在$x>0$里，在$t=0$时经过$x-ct>0$。于是$u=\varphi(x-ct)$已经由初值定死，出口处的值也定了：$u(0,t)=\varphi(-ct)$。再给$u(0,t)$，和它不一样就没有解。边界条件（boundary condition）只能给在水流进来的一端，也就是特征线随着$t$增大走进这个范围的地方。
  reference: |
    （1）$x>ct$：特征线往回走在$t=0$时到$x-ct>0$，$u=\varphi(x-ct)$。$x<ct$：在$t-\frac xc>0$时刻到入口，$u=g\bigl(t-\frac xc\bigr)$，它也是$x-ct$的函数，满足方程。

    （2）从两侧趋近$x=ct$上的点，$u$分别趋于$\varphi$、$g$在$0$处的右极限，所以连续当且仅当$\lim_{x\to0^+}\varphi(x)=\lim_{t\to0^+}g(t)$。在这条直线上也可微，还要两侧的导数接上（$g'(0^+)=-c\varphi'(0^+)$）。

    （3）$c<0$时往回走的特征线$x$增大，总在$t=0$时到$x-ct>0$，$u=\varphi(x-ct)$已定，$u(0,t)=\varphi(-ct)$也定了，另给的值不一致就无解。边界条件只能给在特征线走进范围的一端（入流边界）。

- id: p7
  tier: thinking
  statement: |
    单摆的方程组是$x'=y$、$y'=-\sin x$（$x$是摆角，$y$是角速度）。$E(x,y)=\frac{y^2}2-\cos x$沿它的每个解都不变，是它的守恒量（conserved quantity，见[非线性系统与线性化](lesson:math.ode.nonlinear-systems#def-conserved)）。

    （1）说明「$E$沿每个解都不变」等于说$E$满足一阶线性偏微分方程$yE_x-\sin x\,E_y=0$。

    （2）这个偏微分方程的特征线是相平面（phase plane，见[一阶线性方程组](lesson:math.ode.first-order-systems#def-phase-plane)）上的什么曲线？$F(E)$（$F$是可导的一元函数）为什么也满足它？

    （3）为什么说求方程组$x'=a(x,y)$、$y'=b(x,y)$的守恒量，就是解一个一阶线性偏微分方程？
  hints:
    - |
      沿一个解$\bigl(x(t),y(t)\bigr)$，由链式法则，$\dv{}{t}E\bigl(x(t),y(t)\bigr)=E_xx'+E_yy'$。
    - |
      代入$x'=y$、$y'=-\sin x$，得$\dv{}{t}E=yE_x-\sin x\,E_y$。这个偏微分方程的$a=y$、$b=-\sin x$，特征线满足$\dv xs=y$、$\dv ys=-\sin x$。
    - |
      （1）沿方程组的任一个解，$\dv{}{t}E\bigl(x(t),y(t)\bigr)=E_xx'+E_yy'=yE_x-\sin x\,E_y$。平面上每一点都有解经过（见[解的存在唯一性](lesson:math.ode.existence-uniqueness#thm-systems)），所以「沿每个解都有$\dv Et=0$」等于说在每一点$yE_x-\sin x\,E_y=0$。直接验证也行：$E_x=\sin x$，$E_y=y$，$y\sin x-\sin x\cdot y=0$。

      （2）$a=y$、$b=-\sin x$在点$(k\pi,0)$（$k$是整数）同时为$0$，讲解里定义特征线时要求$a$、$b$不同时为$0$，所以先除去这些点：它们是方程组的平衡点（equilibrium point），从那里出发的解一直不动。在其余的点，特征线满足$\dv xs=y$、$\dv ys=-\sin x$，正是单摆的方程组，$s$就是时间：特征线就是方程组的解在相平面上走出的轨线（trajectory，见[一阶线性方程组](lesson:math.ode.first-order-systems#def-phase-plane)）。

      和定理 2 的证明一样，$F(E)$的两个偏导数是$F'(E)E_x$、$F'(E)E_y$，代进去得$F'(E)(yE_x-\sin x\,E_y)=0$，所以$F(E)$也是解。例如$E^2$、$e^E$也沿每个解不变，也是守恒量。

      （3）一般地，$\Phi(x,y)$沿$x'=a$、$y'=b$的每个解都不变，等于说$a\Phi_x+b\Phi_y=0$，而这个一阶线性偏微分方程的特征线正是方程组的轨线（平衡点除外）。所以找守恒量，就是找这个偏微分方程在任何一小块区域上都不是常数的解；找到了，轨线就都落在$\Phi$的等值线上。[恰当方程](lesson:math.ode.exact-equations)一节的几何图像正是这样：动点沿势函数的等值线走。
  reference: |
    （1）沿解$\dv{}{t}E=E_xx'+E_yy'=yE_x-\sin x\,E_y$；每一点都有解经过，所以「沿每个解不变」⇔ 处处$yE_x-\sin x\,E_y=0$。验证：$E_x=\sin x$，$E_y=y$。

    （2）除去$a$、$b$同时为$0$的平衡点$(k\pi,0)$，特征线方程$\dv xs=y$、$\dv ys=-\sin x$就是单摆的方程组，特征线是相平面上的轨线。$F(E)$的偏导数是$F'(E)E_x$、$F'(E)E_y$，代入得$F'(E)(yE_x-\sin x\,E_y)=0$，也是解（定理 2）；$E^2$、$e^E$也是守恒量。

    （3）$\Phi$是$x'=a$、$y'=b$的守恒量 ⇔ $a\Phi_x+b\Phi_y=0$ 且$\Phi$不在一小块区域上是常数；这个方程的特征线就是轨线（平衡点除外）。解这个一阶线性偏微分方程就是找守恒量，轨线落在它的等值线上，和恰当方程那一节的几何图像一致。

- id: p8
  tier: thinking
  statement: |
    一滴染料落进匀速流动的河水里。按:term[输运方程]{id="math.pde.transport-equation"}，它整团以水速漂走，形状永远不变；可实际上它一边漂走，一边慢慢散开、变淡。

    （1）输运方程漏掉了什么？

    （2）在等号右边加上一项$Ku_{xx}$（$K$是常数），方程变成$u_t+cu_x=Ku_{xx}$。$K$应当是正的还是负的，才能让鼓包变矮、变宽？

    （3）这一项描述的散开，和输运方程描述的整团带走，有什么不同？随水漂流的人会看到什么？
  hints:
    - |
      染料分子自己也在不停地乱动，并不只是跟着水走。
    - |
      鼓包顶上$u_{xx}<0$，两侧弯向上的地方$u_{xx}>0$。随水漂流看到的变化率是$u_t+cu_x$，要让顶上变低、两侧变高，它应当和$u_{xx}$同号还是异号？
    - |
      （1）输运方程只管水的整体流动把染料带走，没有管染料分子自己的无规则运动：分子乱走，净效果是从浓的地方往淡的地方跑，鼓包因而散开。

      （2）$K>0$。随水漂流看到的变化率是$u_t+cu_x=Ku_{xx}$，鼓包顶上$u_{xx}<0$，它为负，顶上变低；两侧弯向上的地方$u_{xx}>0$，那里变高，于是鼓包变矮、变宽。$K<0$会让鼓包越来越尖，和实际相反。

      （3）像讲解里那样换到随水漂流的坐标$\xi=x-ct$、$\tau=t$，$u_t+cu_x$变成$w_\tau$，方程变成$w_\tau=Kw_{\xi\xi}$：随水漂流的人只看到散开，这正是:term[热方程]{id="math.pde.heat-equation"}（heat equation）的样子，见[热方程的推导](lesson:math.pde.heat-equation)。整团带走对每一点都一样，只平移、不变形；散开是浓度不均匀引起的，哪里弯得厉害，哪里就变得快，把起伏抹平。
  reference: |
    （1）漏了染料分子自己的无规则运动（扩散）：分子乱走的净效果是从浓处往淡处跑。

    （2）$K>0$。顶上$u_{xx}<0$，随水看到的变化率$u_t+cu_x=Ku_{xx}$为负，顶上变低；两侧$u_{xx}>0$，变高；鼓包变矮变宽。$K<0$会越来越尖。

    （3）在随水漂流的坐标里$w_\tau=Kw_{\xi\xi}$，是热方程：漂流的人只看到散开。整团带走对每点一样、只平移不变形；散开由浓度不均匀驱动，弯得越厉害变得越快，把起伏抹平。
