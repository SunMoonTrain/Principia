- id: p1
  tier: easy
  statement: |
    下列方程里，$u$是$x$、$t$或$x$、$y$的函数。哪些是:term[线性偏微分方程]{id="math.pde.linear-pde"}？
  answer:
    type: choice
    multiple: true
    options:
      - |
        $u_{tt}=(1+x^2)u_{xx}+\sin t$
      - |
        $u_{tt}=u_{xx}-\sin u$
      - |
        $u_xu_y=1$
      - |
        $u_x+u_y=\cos(xy)\,u$
      - |
        $u_{xxt}+uu_{xx}=0$
    value: [1, 4]
  hints:
    - |
      线性看$u$和它的各阶偏导数是不是都只以一次的形式出现：不互相乘、不平方、不放进别的函数里。
    - |
      系数可以随自变量变化，不含$u$及其偏导数的项（如$\sin t$）也可以有；逐个找$u$或偏导数相乘、放进别的函数里的项。
    - |
      B 有$\sin u$，C 是$u_x$乘$u_y$，E 是$u$乘$u_{xx}$，都不是线性的。A 写成$u_{tt}-(1+x^2)u_{xx}=\sin t$，D 写成$u_x+u_y-\cos(xy)\,u=0$，系数和右边都只依赖自变量，是$L[u]=f$的样子，都是线性的。选 A、D。
  solution: |
    A：写成$u_{tt}-(1+x^2)u_{xx}=\sin t$，左边是$u_{tt}$、$u_{xx}$各乘只依赖自变量的系数再相加，右边只依赖自变量，是线性的（非齐次）。B：$u$放进了$\sin$里，不是线性的。C：$u_x$乘了$u_y$，不是线性的。

    D：写成$u_x+u_y-\cos(xy)\,u=0$，$u$的系数$\cos(xy)$只依赖自变量，是线性的（齐次）。E：$u$乘了$u_{xx}$，不是线性的。选 A、D。

- id: p2
  tier: easy
  statement: |
    方程$u_{xx}-6u_{xy}+9u_{yy}+u_x=0$在平面上是哪一型？
  answer:
    type: choice
    multiple: false
    options:
      - |
        处处是椭圆型
      - |
        处处是双曲型
      - |
        处处是抛物型
      - |
        在不同的点类型不同
    value: 3
  hints:
    - |
      把$u_{xy}$的系数写成$2B$，再算$B^2-AC$；$u_x$是低阶项，不影响类型。
    - |
      $A=1$，$2B=-6$，$C=9$。
    - |
      $B=-3$，$B^2-AC=9-9=0$。系数都是常数，各点的类型一样，所以处处是抛物型，选 C。
  solution: |
    $A=1$，$B=-3$，$C=9$，$B^2-AC=9-9=0$。系数都是常数，各点都一样，所以处处是:term[抛物型]{id="math.pde.parabolic-equation"}，选 C。低阶项$u_x$不影响类型。

- id: p3
  tier: medium
  statement: |
    特里科米方程（Tricomi equation）$yu_{xx}+u_{yy}=0$在点$(1,2)$、$(0,-3)$、$(5,0)$处依次是哪一型？椭圆型记作 E，抛物型记作 P，双曲型记作 H，按顺序填三个字母。
  answer:
    type: sequence
    value: [E, H, P]
    alphabet: [E, P, H]
  hints:
    - |
      系数$A=y$随点变化，类型要逐点判断。
    - |
      $A=y$，$B=0$，$C=1$，所以$B^2-AC=-y$。
    - |
      $-y$在三个点处依次是$-2$、$3$、$0$，分别小于、大于、等于$0$。所以三个点依次是椭圆型、双曲型、抛物型，填 E、H、P。
  solution: |
    $A=y$，$B=0$，$C=1$，$B^2-AC=-y$。在$(1,2)$处它是$-2<0$，:term[椭圆型]{id="math.pde.elliptic-equation"}；在$(0,-3)$处是$3>0$，:term[双曲型]{id="math.pde.hyperbolic-equation"}；在$(5,0)$处是$0$，:term[抛物型]{id="math.pde.parabolic-equation"}。依次填 E、H、P。

    整个上半平面是椭圆型，下半平面是双曲型，$x$轴上是抛物型。跨声速流动（transonic flow）里会遇到这类方程：气流比声速慢的区域对应椭圆型，比声速快的区域对应双曲型。

- id: p4
  tier: medium
  statement: |
    已知$u=t$满足$u_t=u_{xx}+1$，并且对每个正整数$k$，$e^{-k^2t}\cos kx$满足$u_t=u_{xx}$。用:term[叠加原理]{id="math.pde.superposition-principle"}把它们组合成满足$u_t=u_{xx}+1$、$u(x,0)=2\cos x-\cos3x$的解，求这个解在$x=0$、$t=\ln2$处的值。
  answer:
    type: number
    value: log(2)+1-1/512
  hints:
    - |
      $t$是非齐次方程的一个解，加上齐次方程$u_t=u_{xx}$的解，仍满足$u_t=u_{xx}+1$。
    - |
      设$u=t+\sum_kc_ke^{-k^2t}\cos kx$（有限项），令$t=0$，和$2\cos x-\cos3x$比较。
    - |
      由叠加原理（1），有限项之和$\sum_kc_ke^{-k^2t}\cos kx$满足$u_t=u_{xx}$；再由（2），加上$t$以后满足$u_t=u_{xx}+1$。取$c_1=2$、$c_3=-1$，其余为$0$，得$u=t+2e^{-t}\cos x-e^{-9t}\cos3x$，$t=0$时正好是$2\cos x-\cos3x$。

      代入$x=0$、$t=\ln2$：$e^{-\ln2}=\frac12$，$e^{-9\ln2}=\frac1{512}$，所求的值是$\ln2+1-\frac1{512}\approx1.6912$。
  solution: |
    由叠加原理（1），有限项之和$\sum_kc_ke^{-k^2t}\cos kx$满足$u_t=u_{xx}$；再由（2），$u=t+\sum_kc_ke^{-k^2t}\cos kx$满足$u_t=u_{xx}+1$。$t=0$时它等于$\sum_kc_k\cos kx$，要等于$2\cos x-\cos3x$，取$c_1=2$、$c_3=-1$、其余为$0$，得$u=t+2e^{-t}\cos x-e^{-9t}\cos3x$。

    在$x=0$、$t=\ln2$处，$e^{-\ln2}=\frac12$，$e^{-9\ln2}=\frac1{512}$，所以所求的值是$\ln2+1-\frac1{512}\approx1.6912$。

- id: p5
  tier: hard
  statement: |
    记$L[u]$是把$u$和它的各阶偏导数各乘一个只依赖自变量的系数、再相加得到的式子。

    （1）证明$L[c_1u_1+c_2u_2]=c_1L[u_1]+c_2L[u_2]$（$c_1$、$c_2$是常数），并由此证明叠加原理的两条。

    （2）$u_1$、$u_2$都满足非齐次方程$L[u]=f$时，$u_1+u_2$满足什么方程？

    （3）验证$u=-\frac1{1+t}$满足$u_t=u_{xx}+u^2$，$2u$却不满足。这说明什么？
  hints:
    - |
      （1）先看一阶偏导数：$(c_1u_1+c_2u_2)_x=c_1(u_1)_x+c_2(u_2)_x$，高阶偏导数把这一条用几次。叠加原理的（2）要证两个方向。
    - |
      （1）叠加原理（2）的两个方向：$v$满足$L[v]=0$时算$L[u_{\mathrm p}+v]$；$u$满足$L[u]=f$时算$L[u-u_{\mathrm p}]$。（2）算$L[u_1+u_2]$。（3）直接代入。
    - |
      （1）$L[u]=\sum_ja_jD_ju$，每个$D_j$表示求某个偏导数（$D_ju=u$也算一项），$a_j$只依赖自变量。一阶偏导数满足$(c_1u_1+c_2u_2)_x=c_1(u_1)_x+c_2(u_2)_x$，高阶的一次次用这一条，得$D_j(c_1u_1+c_2u_2)=c_1D_ju_1+c_2D_ju_2$；乘$a_j$再相加，就是$L[c_1u_1+c_2u_2]=c_1L[u_1]+c_2L[u_2]$。

      叠加原理（1）：$L[u_1]=L[u_2]=0$，所以$L[c_1u_1+c_2u_2]=0$。叠加原理（2）：$v$满足$L[v]=0$时，$L[u_{\mathrm p}+v]=f+0=f$；反过来，$u$满足$L[u]=f$时，$L[u-u_{\mathrm p}]=f-f=0$，$u=u_{\mathrm p}+(u-u_{\mathrm p})$正是$u_{\mathrm p}$加上齐次方程的一个解。

      （2）$L[u_1+u_2]=f+f=2f$，$u_1+u_2$满足$L[u]=2f$，$f$不恒为$0$时就不是原方程的解。非齐次方程的两个解之差满足齐次方程，两个解之和却不再是解。

      （3）$u_t=\frac1{(1+t)^2}$，$u_{xx}=0$，$u^2=\frac1{(1+t)^2}$，所以$u_t=u_{xx}+u^2$。$w=2u$时$w_t=\frac2{(1+t)^2}$，$w_{xx}+w^2=\frac4{(1+t)^2}$，两边不等。方程含$u^2$，不是线性的，解的常数倍不一定是解：非线性方程（nonlinear equation）一般没有叠加原理。
  reference: |
    （1）$L[u]=\sum_ja_jD_ju$，每个$D_j$表示求某个偏导数（$D_ju=u$也算一项），$a_j$只依赖自变量。一阶偏导数满足$(c_1u_1+c_2u_2)_x=c_1(u_1)_x+c_2(u_2)_x$，高阶的一次次用这一条，得$D_j(c_1u_1+c_2u_2)=c_1D_ju_1+c_2D_ju_2$；乘$a_j$再相加，就是$L[c_1u_1+c_2u_2]=c_1L[u_1]+c_2L[u_2]$。

    叠加原理（1）：$L[u_1]=L[u_2]=0$，所以$L[c_1u_1+c_2u_2]=0$。叠加原理（2）：$v$满足$L[v]=0$时，$L[u_{\mathrm p}+v]=f+0=f$；反过来，$u$满足$L[u]=f$时，$L[u-u_{\mathrm p}]=f-f=0$，$u=u_{\mathrm p}+(u-u_{\mathrm p})$正是$u_{\mathrm p}$加上齐次方程的一个解。

    （2）$L[u_1+u_2]=2f$，$u_1+u_2$满足$L[u]=2f$，$f$不恒为$0$时就不是原方程的解。两个解之差满足齐次方程，两个解之和却不再是解。

    （3）$u_t=\frac1{(1+t)^2}$，$u_{xx}=0$，$u^2=\frac1{(1+t)^2}$，所以$u_t=u_{xx}+u^2$。$w=2u$时$w_t=\frac2{(1+t)^2}$，$w_{xx}+w^2=\frac4{(1+t)^2}$，两边不等。方程含$u^2$，不是线性的，解的常数倍不一定是解：非线性方程一般没有叠加原理。

- id: p6
  tier: hard
  statement: |
    设$A$、$B$、$C$是常数，$A\ne0$，考虑方程$Au_{xx}+2Bu_{xy}+Cu_{yy}=0$。

    （1）求出所有的常数$\mu$，使$u=F(y-\mu x)$对每个二阶可导的一元函数$F$都是解。

    （2）说明方程是双曲型时这样的$\mu$恰好有两个，抛物型时恰好一个，椭圆型时一个也没有。

    （3）写出$u_{xx}+4u_{xy}+3u_{yy}=0$（例 2 第一个方程去掉了$u_y$）的一族含两个任意函数的解。
  hints:
    - |
      （1）对$x$、$y$求偏导数时用一元的链式法则（chain rule），和[偏导数](lesson:math.vector-calculus.partial-derivatives)第 5 题一样：$u_x=-\mu F'(y-\mu x)$，$u_y=F'(y-\mu x)$。
    - |
      （1）代入得$(A\mu^2-2B\mu+C)F''(y-\mu x)=0$；取$F(s)=\frac{s^2}2$，可以看出括号必须为$0$。（2）看这个二次方程的判别式。
    - |
      （1）由一元的链式法则，$u_x=-\mu F'$，$u_y=F'$，$u_{xx}=\mu^2F''$，$u_{xy}=-\mu F''$，$u_{yy}=F''$，$F$的导数都在$y-\mu x$处取值。代入得$(A\mu^2-2B\mu+C)F''(y-\mu x)=0$。括号为$0$时它对每个$F$都成立；反过来，取$F(s)=\frac{s^2}2$，$F''=1$，括号必须为$0$。所以$\mu$恰好是$A\mu^2-2B\mu+C=0$的实根。

      （2）$A\ne0$，这是$\mu$的二次方程，判别式是$4B^2-4AC=4(B^2-AC)$。双曲型时它为正，有两个不同的实根；抛物型时为$0$，只有一个实根$\frac BA$；椭圆型时为负，没有实根。

      （3）这里$A=1$，$B=2$，$C=3$，$\mu^2-4\mu+3=0$，$\mu=1$或$3$。所以$F(y-x)$、$G(y-3x)$都是解；由叠加原理，$u=F(y-x)+G(y-3x)$也是解，$F$、$G$是任意二阶可导的一元函数。
  reference: |
    （1）由一元的链式法则，$u_x=-\mu F'$，$u_y=F'$，$u_{xx}=\mu^2F''$，$u_{xy}=-\mu F''$，$u_{yy}=F''$，$F$的导数都在$y-\mu x$处取值。代入得$(A\mu^2-2B\mu+C)F''(y-\mu x)=0$。括号为$0$时它对每个$F$都成立；反过来，取$F(s)=\frac{s^2}2$，$F''=1$，括号必须为$0$。所以$\mu$恰好是$A\mu^2-2B\mu+C=0$的实根。

    （2）$A\ne0$，这是$\mu$的二次方程，判别式是$4(B^2-AC)$。双曲型时它为正，有两个不同的实根；抛物型时为$0$，只有一个实根$\frac BA$；椭圆型时为负，没有实根。

    （3）$A=1$，$B=2$，$C=3$，$\mu^2-4\mu+3=0$，$\mu=1$或$3$。$F(y-x)$、$G(y-3x)$都是解；由叠加原理，$u=F(y-x)+G(y-3x)$也是解，$F$、$G$是任意二阶可导的一元函数。

- id: p7
  tier: thinking
  statement: |
    :term[热方程]{id="math.pde.heat-equation"}$u_t=u_{xx}$的:term[初值问题]{id="math.pde.initial-value-problem"}只给$u(x,0)=\varphi(x)$，:term[波动方程]{id="math.pde.wave-equation"}$u_{tt}=u_{xx}$还要再给$u_t(x,0)=\psi(x)$。

    （1）给热方程的初值问题也加上$u_t(x,0)=\psi(x)$，会出现什么情况？设解和方程里出现的偏导数在$t=0$处也连续。

    （2）为什么方程对$t$是几阶，就要给几个初始条件？可以把$x$轴分成间距为$h$的格点（grid point），用差商（difference quotient）代替$u_{xx}$，看看方程变成了什么。
  hints:
    - |
      （1）在方程里令$t\to0^+$，$u_t(x,0)$等于什么？
    - |
      （1）$u_t(x,0)=u_{xx}(x,0)=\varphi''(x)$。（2）在格点$x_j=jh$上记$u_j(t)=u(x_j,t)$，用$\frac{u_{j+1}-2u_j+u_{j-1}}{h^2}$代替$u_{xx}$，它是相邻两段的差商之差再除以$h$。
    - |
      （1）解和$u_t$、$u_{xx}$在$t=0$处连续，在方程里令$t\to0^+$，得$u_t(x,0)=u_{xx}(x,0)=\varphi''(x)$。所以$u_t(x,0)$已经由$\varphi$定死了：$\psi=\varphi''$时，新加的条件是多余的；$\psi\ne\varphi''$时，问题没有解。波动方程只定出$u_{tt}(x,0)=\varphi''(x)$，$u_t(x,0)$没有定下来，所以要另外给。

      （2）在格点$x_j=jh$上记$u_j(t)=u(x_j,t)$，把$u_{xx}$换成$\frac{u_{j+1}-2u_j+u_{j-1}}{h^2}$，也就是相邻两段的差商之差再除以$h$。热方程变成$u_j'=\frac{u_{j+1}-2u_j+u_{j-1}}{h^2}$，每个$u_j$满足一阶方程，要一个初值$u_j(0)$；波动方程变成$u_j''=\frac{u_{j+1}-2u_j+u_{j-1}}{h^2}$，每个$u_j$要$u_j(0)$、$u_j'(0)$两个初值。这和常微分方程一样：一阶方程的通解含一个常数，二阶的含两个。$h\to0$时，各点的$u_j(0)$合起来就是函数$u(x,0)$，$u_j'(0)$合起来就是$u_t(x,0)$。
  reference: |
    （1）解和$u_t$、$u_{xx}$在$t=0$处连续，令$t\to0^+$得$u_t(x,0)=\varphi''(x)$，$u_t(x,0)$已经由$\varphi$定死：$\psi=\varphi''$时新条件多余，$\psi\ne\varphi''$时无解。波动方程只定出$u_{tt}(x,0)=\varphi''(x)$，$u_t(x,0)$要另外给。

    （2）用差商把$u_{xx}$离散化，$u_j(t)=u(x_j,t)$。热方程变成一阶常微分方程组$u_j'=\frac{u_{j+1}-2u_j+u_{j-1}}{h^2}$，每个$u_j$要一个初值；波动方程变成二阶的$u_j''=\cdots$，每个要两个初值，和常微分方程的通解含几个常数一致。$h\to0$时这些初值合成函数$u(x,0)$、$u_t(x,0)$。

- id: p8
  tier: thinking
  statement: |
    设$f$在$[0,L]$上连续，$F$是它的一个原函数（antiderivative；连续函数都有原函数，见[微积分基本定理](lesson:math.calculus.fundamental-theorem)）。考虑:term[边值问题]{id="math.pde.boundary-value-problem"}$u''=f(x)$（$0\le x\le L$），$u'(0)=a$，$u'(L)=b$。

    （1）说明只有$F(L)-F(0)=b-a$时才有解；有解时有无穷多个，彼此只差一个常数。

    （2）把条件换成$u(0)=a$、$u(L)=b$，解有几个？

    （3）初值问题$u''=f$、$u(0)=a$、$u'(0)=b$总有唯一的解。边值问题为什么不总是这样？
  hints:
    - |
      $u''=f$说明$u'$是$f$的原函数：$u'=F+C_1$，$C_1$是常数。
    - |
      （1）两端的条件分别要求$C_1=a-F(0)$和$C_1=b-F(L)$。（2）设$G$是$F$的一个原函数，$u=G+C_1x+C_2$，两个条件各给出一个关于$C_1$、$C_2$的方程。
    - |
      （1）$u''=f$，所以$u'$是$f$的原函数，$u'=F+C_1$（同一个函数的原函数只差常数）。$u'(0)=a$要$C_1=a-F(0)$，$u'(L)=b$要$C_1=b-F(L)$，两者相容当且仅当$F(L)-F(0)=b-a$，不相容就没有解。相容时$u'$定下来了，$u$是它的原函数，还可以加任意常数，所以有无穷多个解，彼此只差常数。

      （2）$F$可导，所以连续，也有原函数$G$，通解是$u=G+C_1x+C_2$。$u(0)=a$定出$C_2=a-G(0)$，$u(L)=b$再定出$C_1=\frac{b-a-G(L)+G(0)}L$，解恰好有一个。

      （3）初值问题的两个条件都给在$x=0$：$u'(0)=b$定出$C_1$，$u(0)=a$定出$C_2$，一个条件管一个常数，总能定出来。边值问题的条件分在两端，两个条件可能管的是同一个常数：（1）里两个条件都只管$C_1$，于是要么互相矛盾（没有解），要么重复（$C_2$定不下来，有无穷多个解）。（2）里两个条件恰好管住两个常数，解才唯一；边值问题有没有解、解唯不唯一，要看具体的方程和条件。
  reference: |
    （1）$u'=F+C_1$。$u'(0)=a$、$u'(L)=b$分别要$C_1=a-F(0)$、$C_1=b-F(L)$，相容当且仅当$F(L)-F(0)=b-a$；相容时$u'$确定，$u$再差一个任意常数，有无穷多个解。

    （2）$u=G+C_1x+C_2$（$G'=F$），$C_2=a-G(0)$，$C_1=\frac{b-a-G(L)+G(0)}L$，恰好一个解。

    （3）初值问题的条件在同一端，各定一个常数；边值问题的条件分在两端，可能都只管同一个常数（如（1）的$C_1$），于是要么矛盾、要么重复。是否有解、是否唯一，要看具体的方程和条件。
